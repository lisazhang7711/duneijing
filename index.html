{"id":"sw42","book":"素问","no":42,"title":"风论","titleTw":"風論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw42-1","tags":[],"yw":"黃帝問曰∶風之傷人也，或爲寒熱，或爲熱中，或爲寒中，或爲癘風，或爲偏枯，或爲風也，其病各異，其名不同，或內至五髒六腑，不知其解，願聞其說。岐伯對曰∶風氣藏於皮膚之間，內不得通，外不得泄，風者善行而數變，腠理開則灑然寒，閉則熱而悶，其寒也則衰食飲，其熱也則消肌肉，故使人慄而不能食，名曰寒熱。風氣與陽明入胃，循脈而上至目內，其人肥則風氣不得外泄，則爲熱中而目黃；人瘦則外泄而寒，則爲寒中而泣出。風氣與太陽俱入，行諸脈俞，散於分肉之間，與衛氣相干，其道不利，故使肌肉憤而有瘍，衛氣有所凝而不行，故其肉有不仁也。","bh":"","notes":[],"pending":true},{"id":"sw42-2","tags":[],"yw":"癘者，有榮氣熱，其氣不清，故使其鼻柱壞而色敗，皮膚瘍潰，風寒客於脈而不去，名曰癘風，或名曰寒熱。以春甲乙傷於風者爲肝風，以夏丙丁傷於風者爲心風，以季夏戊己傷於邪者爲脾風，以秋庚辛中於邪者爲肺風，以冬壬癸中於邪者爲腎風。風中五髒六腑之俞，亦爲髒腑之風，各入其門戶所中，則爲偏風。風氣循風府而上，則爲腦風。風入系頭，則爲目風，眼寒。飲酒中風，則爲漏風。入房汗出中風，則爲內風。新沐中風，則爲首風。久風入中，則爲腸風飧泄。","bh":"","notes":[],"pending":true},{"id":"sw42-3","tags":[],"yw":"外在腠理，則爲泄風。故風者百病之長也，至其變化乃爲他病也，無常方，然致有風氣也。帝曰∶五髒風之形狀不同者何？願聞其診及其病能。岐伯曰∶肺風之狀，多汗惡風，色然白，時咳短氣，晝日則瘥，暮則甚，診在眉上，其色白。心風之狀，多汗惡風，焦絕善怒嚇，赤色，病甚則言不可快，診在口，其色赤。肝風之狀，多汗惡風，善悲，色微蒼，嗌干善怒，時憎女子，診在目下，其色青。脾風之狀，多汗惡風，身體怠惰，四肢不欲動，色薄微黃，不嗜食，診在鼻上，其色黃。","bh":"","notes":[],"pending":true},{"id":"sw42-4","tags":[],"yw":"腎風之狀，多汗惡風，面然浮腫，脊痛不能正立，其色，隱曲不利，診在肌上，其色黑。胃風之狀，頸多汗惡風，食飲不下，膈塞不通，腹善滿，失衣則脹，食寒則泄，診形瘦而腹大。首風之狀，頭面多汗惡風，當先風一日則病甚，頭痛不可以出內，至其風日則病少愈。漏風之狀，或多汗，常不可單衣，食則汗出，甚則身汗，喘息惡風，衣常濡，口干善渴，不能勞事。泄風之狀，多汗，汗出泄衣上，口中干，上漬，其風不能勞事，身體盡痛則寒。帝曰∶善。","bh":"","notes":[],"pending":true},{"id":"sw42-5","tags":[],"yw":"<目錄>卷第十二","bh":"","notes":[],"pending":true}]},
{"id":"sw43","book":"素问","no":43,"title":"痹论","titleTw":"痹論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw43-1","tags":[],"yw":"黃帝問曰∶痹之安生？岐伯對曰∶風寒溼三氣雜至，合而爲痹也。其風氣勝者爲行痹，寒氣勝者爲痛痹，溼氣勝者爲着痹也。帝曰∶其有五者何也？岐伯曰∶以冬遇此者爲骨痹，以春遇此者爲筋痹，以夏遇此者爲脈痹，以至陰遇此者爲肌痹，以秋遇此者爲皮痹。帝曰∶內舍五髒六腑，何氣使然？岐伯曰∶五髒皆有合，病久而不去者，內舍於其合也。故骨痹不已，復感於邪，內舍於腎。筋痹不已，復感於邪，內舍於肝。脈痹不已，復感於邪，內舍於心。","bh":"","notes":[],"pending":true},{"id":"sw43-2","tags":[],"yw":"肌痹不已，復感於邪，內舍於脾。皮痹不已，復感於邪，內舍於肺。所謂痹者，各以其時重感於風寒溼之氣也。凡痹之客五髒者，肺痹者，煩滿喘而嘔。心痹者，脈不通，煩則心下鼓，暴上氣而喘，嗌干善噫，厥氣上則恐。肝痹者，夜臥則驚，多飲數小便，上爲引如懷。腎痹者，善脹，尻以代踵，脊以代頭。脾痹者，四肢解惰，發咳嘔汁，上爲大塞。腸痹者，數飲而出不得，中氣喘爭，時發飧泄。胞痹者，少腹膀胱按之內痛，若沃以湯，澀於小便，上爲清涕。","bh":"","notes":[],"pending":true},{"id":"sw43-3","tags":[],"yw":"陰氣者，靜則神藏，躁則消亡，飲食自倍，腸胃乃傷。淫氣喘息，痹聚在肺；淫氣憂思，痹聚在心；淫氣遺溺，痹聚在腎；淫氣乏竭，痹聚在肝；淫氣肌絕，痹聚在脾。諸痹不已，亦益內也。其風氣勝者，其人易已也。帝曰∶痹，其時有死者，或疼久者，或易已者，其故何也？岐伯曰∶其入髒者死，其留連筋骨間者疼久，其留皮膚間者易已。帝曰∶其客於六腑者何也？岐伯曰∶此亦其食飲居處，爲其病本也。六腑亦各有俞，風寒溼氣中其俞，而食飲應之，循俞而入，各舍其腑也。","bh":"","notes":[],"pending":true},{"id":"sw43-4","tags":[],"yw":"帝曰∶以針治之奈何？岐伯曰∶五髒有俞，六腑有合，循脈之分，各有所發，各隨其過，則病瘳也。帝曰∶榮衛之氣亦令人痹乎？岐伯曰∶榮者，水谷之精氣也，和調於五髒，灑陳於六腑，乃能入於脈也，故循脈上下，貫五髒，絡六腑也。衛者，水谷之悍氣也，其氣疾滑利，不能入於脈也，故循皮膚之中，分肉之間，燻於肓膜，散於胸腹，逆其氣則病，從其氣則愈，不與風寒溼氣合，故不爲痹。帝曰∶善。痹或痛，或不痛，或不仁，或寒，或熱，或燥，或溼，其故何也？岐伯曰∶痛者，寒氣多也，有寒故痛也。","bh":"","notes":[],"pending":true},{"id":"sw43-5","tags":[],"yw":"其不痛不仁者，病久入深，榮衛之行澀，經絡時疏，故不通，皮膚不營，故爲不仁。其寒者，陽氣少，陰氣多，與病相益，故寒也。其熱者，陽氣多，陰氣少，病氣勝陽遭陰，故爲痹熱。其多汗而濡者，此其逢溼甚也，陽氣少，陰氣盛，兩氣相感，故汗出而濡也。帝曰∶夫痹之爲病，不痛何也？岐伯曰∶痹在於骨則重，在於脈則血凝而不流，在於筋則屈不伸，在於肉則不仁，在於皮則寒，故具此五者，則不痛也。凡痹之類，逢寒則蟲，逢熱則縱。帝曰∶善。","bh":"","notes":[],"pending":true},{"id":"sw43-6","tags":[],"yw":"<目錄>卷第十二","bh":"","notes":[],"pending":true}]},
{"id":"sw44","book":"素问","no":44,"title":"痿论","titleTw":"痿論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw44-1","tags":[],"yw":"黃帝問曰∶五髒使人痿何也？岐伯對曰∶肺主身之皮毛，心主身之血脈，肝主身之筋膜，脾主身之肌肉，腎主身之骨髓，故肺熱葉焦，則皮毛虛弱急薄着，則生痿也。心氣熱，則下脈厥而上，上則下脈虛，虛則生脈痿，樞折挈，脛縱而不任地也。肝氣熱，則膽泄口苦筋膜干，筋膜干則筋急而攣，發爲筋痿。脾氣熱，則胃干而渴，肌肉不仁，發爲肉痿。腎氣熱，則腰脊不舉，骨枯而髓減，發爲骨痿。帝曰∶何以得之？岐伯曰∶肺者，髒之長也，爲心之蓋也，有所失亡，所求不得，則發肺鳴，鳴則肺熱葉焦。","bh":"","notes":[],"pending":true},{"id":"sw44-2","tags":[],"yw":"故曰∶五髒因肺熱葉焦，發爲痿。此之謂也。悲哀太甚，則胞絡絕，胞絡絕則陽氣內動，發則心下崩數溲血也。故《本病》曰∶大經空虛，發爲肌痹，傳爲脈痿。思想無窮，所願不得，意淫於外，入房太甚，宗筋弛縱，發爲筋痿，及爲白淫。故《下經》曰∶筋痿者，生於肝使內也。有漸於溼，以水爲事，若有所留，居處相溼，肌肉濡漬，痹而不仁，發爲肉痿。故《下經》曰∶肉痿者，得之溼地也。有所遠行勞倦，逢大熱而渴，渴則陽氣內伐，內伐則熱舍於腎，腎者水髒也，今水不勝火，則骨枯而髓虛，故足不任身，發爲骨痿。","bh":"","notes":[],"pending":true},{"id":"sw44-3","tags":[],"yw":"故《下經》曰∶骨痿者，生於大熱也。帝曰∶何以別之？岐伯曰∶肺熱者色白而毛敗，心熱者色赤而絡脈溢，肝熱者色蒼而爪枯，脾熱者色黃而肉蠕動，腎熱者色黑而齒槁。帝曰∶如夫子言可矣，論言治痿者獨取陽明何也？岐伯曰∶陽明者，五髒六腑之海，主潤宗筋，宗筋主束骨而利機關也。衝脈者，經脈之海也，主滲灌溪谷，與陽明合於宗筋，陰陽宗筋之會，會於氣街，而陽明爲之長，皆屬於帶脈，而絡於督脈。故陽明虛則宗筋縱，帶脈不引，故足痿不用也。","bh":"","notes":[],"pending":true},{"id":"sw44-4","tags":[],"yw":"帝曰∶治之奈何？岐伯曰∶各補其滎而通其俞，調其虛實，和其逆順，筋脈骨肉。各以其時受月，則病已矣。帝曰∶善。<目錄>卷第十二","bh":"","notes":[],"pending":true}]},
{"id":"sw45","book":"素问","no":45,"title":"厥论","titleTw":"厥論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw45-1","tags":[],"yw":"黃帝問曰∶厥之寒熱者何也？岐伯對曰∶陽氣衰於下，則爲寒厥；陰氣衰於下，則爲熱厥。帝曰∶熱厥之爲熱也，必起於足下者何也？岐伯曰∶陽氣起於足五指之表，陰脈者集於足下而聚於足心，故陽氣勝則足下熱也。帝曰∶寒厥之爲寒也，必從五指而上於膝者何也？岐伯曰∶陰氣起於五指之裏，集於膝下而聚於膝上，故陰氣勝則從五指至膝上寒，其寒也，不從外，皆從內也。帝曰∶寒厥何失而然也？岐伯曰∶前陰者，宗筋之所聚，太陰陽明之所合也。","bh":"","notes":[],"pending":true},{"id":"sw45-2","tags":[],"yw":"春夏則陽氣多而陰氣少，秋冬則陰氣盛而陽氣衰。此人者質壯，以秋冬奪於所用，下氣上爭，不能復，精氣溢下，邪氣因從之而上也，氣因於中，陽氣衰，不能滲營其經絡，陽氣日損，陰氣獨在，故手足爲之寒也。帝曰∶熱厥何如而然也？岐伯曰∶酒入於胃，則絡脈滿而經脈虛，脾主爲胃行其津液者也，陰氣虛則陽氣入，陽氣入則胃不和，胃不和則精氣竭，精氣竭則不營其四肢也。此人必數醉若飽以入房，氣聚於脾中不得散，酒氣與谷氣相薄，熱盛於中，故熱遍於身內熱而溺赤也。","bh":"","notes":[],"pending":true},{"id":"sw45-3","tags":[],"yw":"夫酒氣盛而悍，腎氣有衰，陽氣獨勝，故手足爲之熱也。帝曰∶厥或令人腹滿，或令人暴不知人，或至半日遠至一日乃知人者何也？岐伯曰∶陰氣盛於上則下虛，下虛則腹脹滿，陽氣盛於上則下氣重上而邪氣逆，逆則陽氣亂，陽氣亂則不知人也。帝曰∶善。願聞六經脈之厥狀病能也。岐伯曰∶巨陽之厥，則腫首頭重，足不能行，發爲僕。陽明之厥，則癲疾欲走呼，腹滿不得臥，面赤而熱，妄見而妄言。少陽之厥，則暴聾頰腫而熱，脅痛，不可以運。太陰之厥，則腹滿脹，後不利，不欲食，食則嘔，不得臥。","bh":"","notes":[],"pending":true},{"id":"sw45-4","tags":[],"yw":"少陰之厥，則口干溺赤，腹滿心痛。厥陰之厥，則少腹腫痛，腹脹涇溲不利，好臥屈膝，陰縮腫，內熱。盛則瀉之，虛則補之，不盛不虛，以經取之。太陰厥逆，急攣，心痛引腹，治主病者。少陰厥逆，虛滿嘔變，下泄清，治主病者。厥陰厥逆，攣腰痛，虛滿前閉譫言，治主病者。三陰俱逆，不得前後，使人手足寒，三日死。太陽厥逆，僵僕嘔血善衄，治主病者。少陽厥逆，機關不利，機關不利者，腰不可以行，項不可以顧，發腸癰不可治，驚者死。","bh":"","notes":[],"pending":true},{"id":"sw45-5","tags":[],"yw":"陽明厥逆，喘咳身熱，善驚衄嘔血。手太陰厥逆，虛滿而咳，善嘔沫，治主病者。手心主少陰厥逆，心痛引喉，身熱。死不可治。手太陽厥逆，耳聾泣出，項不可以顧，腰不可以俯仰，治主病者。手陽明少陽厥逆，發喉痹，嗌腫，，治主病者。風論∶癘（音利）潰（胡對切）腦（奴皓切）痹論∶肓（音荒）痿論∶（必亦切）髖（音寬）尻（枯熬切）（音總）臏（音牝）厥論∶譫（音詹）僵（居良切）僕（音赴）髦（音毛）<目錄>卷第十三","bh":"","notes":[],"pending":true}]},
{"id":"sw46","book":"素问","no":46,"title":"病能论","titleTw":"病能論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw46-1","tags":[],"yw":"黃帝問曰∶人病胃脘癰者，診當何如？岐伯對曰∶診此者當候胃脈，其脈當沉細，沉細者氣逆，逆者人迎甚盛，甚盛則熱，人迎者胃脈也，逆而盛，則熱聚於胃口而不行，故胃脘爲癰也。帝曰∶善。人有臥而有所不安者何也？岐伯曰∶髒有所傷及，精有所之寄，則安，故人不能懸其病也。帝曰∶人之不得偃臥者何也？岐伯曰∶肺者髒之蓋也，肺氣盛則脈大，脈大則不得偃臥，論在《奇恆陰陽》中。帝曰∶有病厥者，診右脈沉而緊，左脈浮而遲，不然，病主安在？岐伯曰∶冬診之，右脈固當沉緊，此應四時，左脈浮而遲，此逆四時，在左當主病在腎，頗關在肺，當腰痛也。","bh":"","notes":[],"pending":true},{"id":"sw46-2","tags":[],"yw":"帝曰∶何以言之？岐伯曰∶少陰脈貫腎絡肺，今得肺脈，腎爲之病，故腎爲腰痛之病也。帝曰∶善。有病頸癰者，或石治之，或針灸治之，而皆已，其真安在？岐伯曰∶此同名異等者也。夫癰氣之息者，宜以針開除去之，夫氣盛血聚者，宜石而瀉之，此所謂同病異治也。帝曰∶有病怒狂者，此病安生？岐伯曰∶生於陽也。帝曰∶陽何以使人狂？岐伯曰∶陽氣者，因暴折而難決，故善怒也，病名曰陽厥。帝曰∶何以知之？岐伯曰∶陽明者常動，巨陽少陽不動，不動而動大疾，此其候也？帝曰∶治之奈何？岐伯曰∶奪其食即已，夫食入於陰，長氣於陽，故奪其食即已。","bh":"","notes":[],"pending":true},{"id":"sw46-3","tags":[],"yw":"使之服以生鐵洛爲飲，夫生鐵洛者，下氣疾也。帝曰∶善。有病身熱解惰，汗出如浴，惡風少氣，此爲何病？岐伯曰∶病名曰酒風。帝曰∶治之奈何？岐伯曰∶以澤瀉、術各十分，麋銜五分，合以三指撮爲後飯。所謂深之細者，其中手如針也，摩之切之，聚者堅也，博者大也。《上經》者，言氣之通天也。《下經》者，言病之變化也。《金匱》者，決死生也。《揆度》者，切度之也。《奇恆》者，言奇病也。所謂奇者，使奇病不得以四時死也。恆者，得以四時死也。","bh":"","notes":[],"pending":true},{"id":"sw46-4","tags":[],"yw":"所謂揆者，方切求之也，言切求其脈理也。度者，得其病處，以四時度之也。<目錄>卷第十三","bh":"","notes":[],"pending":true}]},
{"id":"sw47","book":"素问","no":47,"title":"奇病论","titleTw":"奇病論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw47-1","tags":[],"yw":"黃帝問曰∶人有重身，九月而喑，此爲何也？岐伯對曰∶胞之絡脈絕也。帝曰∶何以言之？岐伯曰∶胞絡者系於腎，少陰之脈，貫腎系舌本，故不能言。帝曰∶治之奈何？岐伯曰∶無治也，當十月復。《刺法》曰∶無損不足，益有餘，以成其疹，然後調之。所謂無損不足者，身羸瘦，無用石也。無益其有餘者，腹中有形而泄之，泄之則精出而病獨擅中，故曰疹成也。帝曰∶病脅下滿氣逆，二三歲不已，是爲何病？岐伯曰∶病名曰息積，此不妨於食，不可灸刺，積爲導引服藥，藥不能獨治也。","bh":"","notes":[],"pending":true},{"id":"sw47-2","tags":[],"yw":"帝曰∶人有身體髀股皆腫，環臍而痛，是爲何病？岐伯曰∶病名曰伏梁，此風根也。其氣溢於大腸而着於肓，肓之原在臍下，故環臍而痛也。不可動之，動之爲水溺澀之病也。帝曰∶人有尺脈數甚，筋急而見，此爲何病？岐伯曰∶此所謂疹筋，是人腹必急，白色黑色見，則病甚。帝曰∶人有病頭痛以數歲不已，此安得之，名爲何病？岐伯曰∶當有所犯大寒，內至骨髓，髓者以腦爲主，腦逆故令頭痛，齒亦痛，病名曰厥逆。帝曰∶善。帝曰∶有病口甘者，病名爲何？何以得之？岐伯曰∶此五氣之溢也，名曰脾癉。","bh":"","notes":[],"pending":true},{"id":"sw47-3","tags":[],"yw":"夫五味入口，藏於胃，脾爲之行其精氣，津液在脾，故令人口甘也，此肥美之所發也，此人必數食甘美而多肥也，肥者令人內熱，甘者令人中滿，故其氣上溢，轉爲消渴。治之以蘭，除陳氣也。帝曰∶有病口苦，取陽陵泉，口苦者病名爲何？何以得之？岐伯曰∶病名曰膽癉。夫肝者，中之將也，取決於膽，咽爲之使。此人者，數謀慮不決，故膽虛氣上溢而口爲之苦，治之以膽募俞，治在《陰陽十二官相使》中。帝曰∶有癃者，一日數十溲，此不足也。","bh":"","notes":[],"pending":true},{"id":"sw47-4","tags":[],"yw":"身熱如炭，頸膺如格，人迎躁盛，喘息氣逆，此有餘也。太陰脈微細如發者，此不足也。其病安在？名爲何病？岐伯曰∶病在太陰，其盛在胃，頗在肺，病名曰厥，死不治，此所謂得五有餘二不足也。帝曰∶何謂五有餘二不足？岐伯曰∶所謂五有餘者，五病之氣有餘也，二不足者，亦病氣之不足也。今外得五有餘，內得二不足，此其身不表不裏，亦正死明矣。帝曰∶人生而有病顛疾者，病名曰何？安所得之？岐伯曰∶病名爲胎病，此得之在母腹中時，其母有所大驚，氣上而不下，精氣並居，故令子發爲顛疾也。","bh":"","notes":[],"pending":true},{"id":"sw47-5","tags":[],"yw":"帝曰∶有病然如有水狀，切其脈大緊，身無痛者，形不瘦，不能食，食少，名爲何病？岐伯曰∶病生在腎，名爲腎風。腎風而不能食善驚，驚已心氣痿者死。帝曰∶善。<目錄>卷第十三","bh":"","notes":[],"pending":true}]},
{"id":"sw48","book":"素问","no":48,"title":"大奇论","titleTw":"大奇論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw48-1","tags":[],"yw":"肝滿腎滿肺滿皆實，即爲腫。肺之雍，喘而兩滿。肝雍，兩滿，臥則驚，不得小便。腎雍，腳下至少腹滿，脛有大小，髀大跛，易偏枯。心脈滿大，癇螈筋攣。肝脈小急，癇螈筋攣。肝脈騖暴，有所驚駭，脈不至若喑，不治自已。腎脈小急，肝脈小急，心脈小急，不鼓皆爲瘕。腎肝並沉爲石水，並浮爲風水，並虛爲死，並小弦欲驚。腎脈大急沉，肝脈大急沉，皆爲疝。心脈搏滑急爲心疝，肺脈沉搏爲肺疝。三陽急爲瘕，三陰急爲疝，二陰急爲癇厥，二陽急爲驚。","bh":"","notes":[],"pending":true},{"id":"sw48-2","tags":[],"yw":"脾脈外鼓，沉爲腸，久自已。肝脈小緩爲腸，易治。腎脈小搏沉，爲腸下血，血溫身熱者死。心肝亦下血，二髒同病者可治，其脈小沉澀爲腸，其身熱者死，熱見七日死。胃脈沉鼓澀，胃外鼓大，心脈小堅急，皆膈偏枯，男子發左，女子發右，不喑舌轉，可治，三十日起，其從者喑，三歲起，年不滿二十者，三歲死。脈至而搏，血衄身熱者死，脈來懸鉤浮爲常脈。脈至如喘，名曰暴厥，暴厥者不知與人言。脈至如數，使人暴驚，三四日自已。脈至浮合，浮合如數，一息十至以上，是經氣予不足也。","bh":"","notes":[],"pending":true},{"id":"sw48-3","tags":[],"yw":"微見九十日死。脈至如火薪然，是心精之予奪也，草干而死。脈至如散葉，是肝氣予虛也，木葉落而死。脈至如省客，省客者脈塞而鼓，是腎氣予不足也，懸去棗華而死。脈至如丸泥，是胃精予不足也，榆莢落而死。脈至如橫格，是膽氣予不足也，禾熟而死。脈至如弦縷，是胞精予不足也，病善言，下霜而死，不言，可治。脈至如交漆，交漆者左右旁至也，微見三十日死。脈至如湧泉，浮鼓肌中，太陽氣予不足也，少氣味，韭英而死。脈至如頹土之狀，按之不得，是肌氣予不足也，五色先見黑白，壘發死。","bh":"","notes":[],"pending":true},{"id":"sw48-4","tags":[],"yw":"脈至如懸雍，懸雍者浮揣切之益大，是十二俞之予不足也，水凝而死。脈至如偃刀，偃刀者浮之小急，按之堅大急，五髒菀熟，寒熱獨並於腎也，如此其人不得坐，立春而死。脈至如丸滑不直手，不直手者按之不可得也，是大腸氣予不足也，棗葉生而死。脈至如華者，令人善恐，不欲坐臥，行立常聽，是小腸氣予不足也，季秋而死。<目錄>卷第十三","bh":"","notes":[],"pending":true}]},
{"id":"sw49","book":"素问","no":49,"title":"脉解","titleTw":"脈解","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw49-1","tags":[],"yw":"太陽所謂腫腰痛者，正月太陽寅，寅太陽也，正月陽氣出在上而陰氣盛，陽未得自次也，故腫腰痛也。病偏虛爲跛者，正月陽氣凍解地氣而出也，所謂偏虛者，冬寒頗有不足者，故偏虛爲跛也。所謂強上引背者，陽氣大上而爭，故強上也。所謂耳鳴者，陽氣萬物盛上而躍，故耳鳴也。所謂甚則狂顛疾者，陽盡在上而陰氣從下，下虛上實，故狂顛疾也。所謂浮爲聾者，皆在氣也。所謂入中爲喑者，陽盛已衰，故爲喑也。內奪而厥，則爲喑俳，此腎虛也，少陰不至者，厥也。","bh":"","notes":[],"pending":true},{"id":"sw49-2","tags":[],"yw":"少陽所謂心脅痛者，言少陽盛也，盛者心之所表也，九月陽氣盡而陰氣盛，故心脅痛也。所謂不可反側者，陰氣藏物也，物藏則不動，故不可反側也。所謂甚則躍者，九月萬物盡衰，草木畢落而墮，則氣去陽而之陰，氣盛而陽之下長，故謂躍。陽明所謂灑灑振寒者，陽明者午也，五月盛陽之陰也，陽盛而陰氣加之，故灑灑振寒也。所謂脛腫而股不收者，是五月盛陽之陰也，陽者衰於五月，而一陰氣上，與陽始爭，故脛腫而股不收也。所謂上喘而爲水者，陰氣下而復上，上則邪客於髒腑間，故爲水也。","bh":"","notes":[],"pending":true},{"id":"sw49-3","tags":[],"yw":"所謂胸痛少氣者，水氣在髒腑也，水者陰氣也，陰氣在中，故胸痛少氣也。所謂甚則厥，惡人與火，聞木音則惕然而驚者，陽氣與陰氣相薄，水火相惡，故惕然而驚也。所謂欲獨閉戶牖而處者，陰陽相薄也，陽盡而陰盛，故欲獨閉戶牖而居。所謂病至則欲乘高而歌，棄衣而走者，陰陽復爭，而外並於陽，故使之棄衣而走也。所謂客孫脈則頭痛鼻鼽腹腫者，陽明並於上，上者則其孫絡太陰也，故頭痛鼻鼽腹腫也。太陰所謂病脹者，太陰子也，十一月萬物氣皆藏於中，故曰病脹。","bh":"","notes":[],"pending":true},{"id":"sw49-4","tags":[],"yw":"所謂上走心爲噫者，陰盛而上走於陽明，陽明絡屬心，故曰上走心爲噫也。所謂食則嘔者，物盛滿而上溢，故嘔也。所謂得後與氣則快然如衰者，十二月陰氣下衰，而陽氣且出，故曰得後與氣則快然如衰也。少陰所謂腰痛者，少陰者腎也，十月萬物陽氣皆傷，故腰痛也。所謂嘔咳上氣喘者，陰氣在下，陽氣在上，諸陽氣浮，無所根據從，故嘔咳上氣喘也。所謂色色不能久立，久坐起則目KTKT無所見者，萬物陰陽不定未有主也，秋氣始至，微霜始下，而方殺萬物，陰陽內奪，故目KTKT無所見也。","bh":"","notes":[],"pending":true},{"id":"sw49-5","tags":[],"yw":"所謂少氣善怒者，陽氣不治，陽氣不治則陽氣不得出，肝氣當治而未得，故善怒，善怒者名曰煎厥。所謂恐如人將捕之者，秋氣萬物未有畢去，陰氣少，陽氣入，陰陽相薄，故恐也。所謂惡聞食臭者，胃無氣，故惡聞食臭也。所謂面黑如地色者，秋氣內奪，故變於色也。所謂咳則有血者，陽脈傷也，陽氣未盛於上而脈滿，滿則咳，故血見於鼻也。厥陰所謂疝，婦人少腹腫者，厥陰者辰也，三月陽中之陰，邪在中，故曰疝少腹腫也。所謂腰脊痛不可以俯仰者，三月一振榮華，萬物一俯而不仰也。","bh":"","notes":[],"pending":true},{"id":"sw49-6","tags":[],"yw":"所謂癃疝膚脹者，曰陰亦盛而脈脹不通，故曰癃疝也。所謂甚則嗌干熱中者，陰陽相薄而熱，故嗌干也。病能論∶解（音介）惰（徒臥切）撮（子括切）奇病論∶（鋤銜切）疹（丑刃切）（音畜）大奇論∶焰（弋念切）瞥（蒲滅切）揣（初委切）脈解論∶（音誰）<目錄>卷第十四","bh":"","notes":[],"pending":true}]},
{"id":"sw50","book":"素问","no":50,"title":"刺要论","titleTw":"刺要論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw50-1","tags":[],"yw":"黃帝問曰∶願聞刺要。岐伯對曰∶病有浮沉，刺有淺深，各至其理，無過其道。過之則內傷，不及則生外壅，壅則邪從之。淺深不得，反爲大賊，內動五髒，後生大病。故曰∶病有在毫毛腠理者，有在皮膚者，有在肌肉者，有在脈者，有在筋者，有在骨者，有在髓者。是故刺毫毛腠理無傷皮，皮傷則內動肺，肺動則秋病溫瘧，溯溯然寒慄。刺皮無傷肉，肉傷則內動脾，脾動則七十二日四季之月，病腹脹煩不嗜食。刺肉無傷脈，脈傷則內動心，心動則夏病心痛。","bh":"","notes":[],"pending":true},{"id":"sw50-2","tags":[],"yw":"刺脈無傷筋，筋傷則內動肝，肝動則春病熱而筋弛。刺筋無傷骨，骨傷則內動腎，腎動則冬病脹腰痛。刺骨無傷髓，髓傷則銷鑠，體解然不去矣。<目錄>卷第十四","bh":"","notes":[],"pending":true}]},
{"id":"sw51","book":"素问","no":51,"title":"刺齐论","titleTw":"刺齊論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw51-1","tags":[],"yw":"黃帝問曰∶願聞刺淺深之分。岐伯對曰∶刺骨者無傷筋，刺筋者無傷肉，刺肉者無傷脈，刺脈者無傷皮，刺皮者無傷肉，刺肉者無傷筋，刺筋者無傷骨。帝曰∶餘未知其所謂，願聞其解。岐伯曰∶刺骨無傷筋者，針至筋而去，不及骨也。刺筋無傷肉者，至肉而去，不及筋也。刺肉無傷脈者，至脈而去，不及肉也。刺脈無傷皮者，至皮而去，不及脈也。所謂刺皮無傷肉者，病在皮中，針入皮中，無傷肉也。刺肉無傷筋者，過肉中筋也。刺筋無傷骨者，過筋中骨也。","bh":"","notes":[],"pending":true},{"id":"sw51-2","tags":[],"yw":"此之謂反也。<目錄>卷第十四","bh":"","notes":[],"pending":true}]},
{"id":"sw52","book":"素问","no":52,"title":"刺禁论","titleTw":"刺禁論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw52-1","tags":[],"yw":"黃帝問曰∶願聞禁數。岐伯對曰；髒有要害，不可不察，肝生於左，肺藏於右，心部於表，腎治於裏，脾爲之使，胃爲之市。膈肓之上，中有父母，七節之旁，中有小心，從之有福，逆之有咎。刺中心，一日死，其動爲噫。刺中肝，五日死，其動爲語。刺中腎，六日死，其動爲嚏。刺中肺，三日死，其動爲咳。刺中脾，十日死，其動爲吞。刺中膽，一日半死，其動爲嘔。刺跗上中大脈，血出不止死。刺面中溜脈，不幸爲盲。刺頭中腦戶，入腦立死。刺舌下中脈太過，血出不止爲喑。","bh":"","notes":[],"pending":true},{"id":"sw52-2","tags":[],"yw":"刺足下布絡中脈，血不出爲腫。刺中大脈，令人僕脫色。刺氣街中脈，血不出，爲腫鼠僕。刺脊間中髓，爲傴。刺乳上，中乳房，爲腫根蝕。刺缺盆中內陷，氣泄，令人喘咳逆。刺手魚腹內陷，爲腫。無刺大醉，令人氣亂。無刺大怒，令人氣逆。無刺大勞人，無刺新飽人，無刺大飢人，無刺大渴人，無刺大驚人。刺陰股中大脈，血出不止死。刺客主人內陷中脈，爲內漏爲聾。刺膝髕出液，爲跛。刺臂太陰脈，出血多立死。刺足少陰脈，重虛出血，爲舌難以言。","bh":"","notes":[],"pending":true},{"id":"sw52-3","tags":[],"yw":"刺膺中陷中肺，爲喘逆仰息。刺肘中內陷，氣歸之，爲不屈伸。刺陰股下三寸內陷，令人遺溺。刺掖下脅間內陷，令人咳。刺少腹中膀胱溺出，令人少腹滿。刺腸內陷，爲腫。刺匡上陷骨中脈，爲漏爲盲。刺關節中液出，不得屈伸。<目錄>卷第十四","bh":"","notes":[],"pending":true}]},
{"id":"sw53","book":"素问","no":53,"title":"刺志论","titleTw":"刺志論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw53-1","tags":[],"yw":"黃帝問曰∶願聞虛實之要。岐伯對曰∶氣實形實，氣虛形虛，此其常也，反此者病。谷盛氣盛，谷虛氣虛，此其常也，反此者病。脈實血實，脈虛血虛，此其常也，反此者病。帝曰∶如何而反？岐伯曰∶氣虛身熱，此謂反也。谷入多而氣少，此謂反也。谷不入而氣多，此謂反也。脈盛血少，此謂反也。脈小血多，此謂反也。氣盛身寒，得之傷寒。氣虛身熱，得之傷暑。谷入多而氣少者，得之有所脫血，溼居下也。谷入少而氣多者，邪在胃及與肺也。脈小血多者，飲中熱也。","bh":"","notes":[],"pending":true},{"id":"sw53-2","tags":[],"yw":"脈大血少者，脈有風氣，水漿不入，此之謂也。夫實者，氣入也。虛者，氣出也。氣實者，熱也。氣虛者，寒也。入實者，左手開針空也。入虛者，左手閉針空也。<目錄>卷第十四","bh":"","notes":[],"pending":true}]},
{"id":"sw54","book":"素问","no":54,"title":"针解","titleTw":"針解","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw54-1","tags":[],"yw":"黃帝問曰∶願聞九針之解，虛實之道。岐伯對曰∶刺虛則實之者，針下熱也，氣實乃熱也。滿而泄之者，針下寒也，氣虛乃寒也。菀陳則除之者，出惡血也。邪勝則虛之者，出針勿按。徐而疾則實者，徐出針而疾按之。疾而徐則虛者，疾出針而徐按之。言實與虛者，寒溫氣多少也。若無若有者，疾不可知也。察後與先者，知病先後也。爲虛與實者，工勿失其法。若得若失者，離其法也。虛實之要，九針最妙者，爲其各有所宜也。補瀉之時者，與氣開闔相合也。","bh":"","notes":[],"pending":true},{"id":"sw54-2","tags":[],"yw":"九針之名，各不同形者，針窮其所當補瀉也。刺實須其虛者，留針陰氣隆至，乃去針也。刺虛須其實者，陽氣隆至，針下熱乃去針也。經氣已至，慎守勿失者，勿更改也。深淺在志者，知病之內外也。近遠如一者，深淺其候等也。如臨深淵者，不敢惰也。手如握虎者，欲其壯也。神無營於衆物者，靜志觀病患，無左右視也。義無邪下者，欲端以正也。必正其神者，欲瞻病患目制其神，令氣易行也。所謂三裏者，下膝三寸也。所謂跗之者，舉膝分易見也。","bh":"","notes":[],"pending":true},{"id":"sw54-3","tags":[],"yw":"巨虛者，蹺足獨陷者。下廉者，陷下者也。帝曰∶餘聞九針，上應天地四時陰陽，願聞其方，令可傳於後世以爲常也。岐伯曰∶夫一天、二地、三人、四時、五音、六律、七星、八風、九野，身形亦應之，針各有所宜，故曰九針。人皮應天，人肉應地，人脈應人，人筋應時，人聲應音，人陰陽合氣應律，人齒面目應星，人出入氣應風，人九竅三百六十五絡應野。故一針皮，二針肉，三針脈，四針筋，五針骨，六針調陰陽，七針益精，八針除風，九針通九竅，除三百六十五節氣，此之謂各有所主也。","bh":"","notes":[],"pending":true},{"id":"sw54-4","tags":[],"yw":"人心意應八風，人氣應天，人發齒耳目五聲應五音六律，人陰陽脈血氣應地，人肝目應之九。九竅三百六十五。人一以觀動靜天二以候五色七星應之以候發毋澤五音一以候宮商角徵羽六律有餘不足應之二地一以候高下有餘九野一節俞應之以候閉節三人變一分人候齒泄多血少十分角之變五分以候緩急六分不足三分寒關節第九分四時人寒溫燥溼四時一應之以候相反一四方各作解。<目錄>卷第十四","bh":"","notes":[],"pending":true}]},
{"id":"sw55","book":"素问","no":55,"title":"长刺节论","titleTw":"長刺節論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw55-1","tags":[],"yw":"刺家不診，聽病者言，在頭頭疾痛，爲藏針之，刺至骨病已，上無傷骨肉及皮，皮者道也。陰刺，入一旁四處。治寒熱深專者，刺大藏，迫藏刺背，背俞也，刺之迫藏，藏會，腹中寒熱去而止，與刺之要，發針而淺出血。治腐腫者刺腐上，視癰小大深淺刺，刺大者多血，小者深之，必端內針爲故止。病在少腹有積，刺皮，HT以下，至少腹而止，刺挾脊兩旁四椎間，刺兩髂季脅肋間，導腹中氣熱下已。病在少腹，腹痛不得大小便，病名曰疝，得之寒，刺少腹兩股間，刺腰髁骨間，刺而多之，盡炅病已。","bh":"","notes":[],"pending":true},{"id":"sw55-2","tags":[],"yw":"病在筋，筋攣節痛，不可以行，名曰筋痹，刺筋上爲故，刺分肉間，不可中骨也，病起筋炅病已止。病在肌膚，肌膚盡痛，名曰肌痹，傷於寒溼，刺大分小分，多發針而深之，以熱爲故，無傷筋骨，傷筋骨，痛發若變，諸分盡熱病已止。病在骨，骨重不可舉，骨髓酸痛，寒氣至，名曰骨痹，深者刺無傷脈肉爲故，其道大分小分，骨熱病已止。病在諸陽脈，且寒且熱，諸分且寒且熱，名曰狂，刺之虛脈，視分盡熱病已止。病初發歲一發，不治月一發，不治月四五發，名曰癲病，刺諸分諸脈，其無寒者以針調之，病已止。","bh":"","notes":[],"pending":true},{"id":"sw55-3","tags":[],"yw":"病風且寒且熱，炅汗出，一日數過，先刺諸分理絡脈；汗出且寒且熱，三日一刺，百日而已。病大風，骨節重，須眉墮，名曰大風，刺肌肉爲故，汗出百日，刺骨髓，汗出百日，凡二百日，須眉生而止針。刺要論∶（音素）弛（施是切）鑠（詩若切）眩（音縣）刺齊論∶解（胡買切）刺禁論∶髕（音牝）刺志論∶脫（土活切）捻（音涅）針解論∶（音低）長刺節論∶（光抹切）篡（初患切）<目錄>卷第十五","bh":"","notes":[],"pending":true}]},
{"id":"sw56","book":"素问","no":56,"title":"皮部论","titleTw":"皮部論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw56-1","tags":[],"yw":"黃帝問曰∶餘聞皮有分部，脈有經紀，筋有結絡，骨有度量，其所生病各異，別其分部，左右上下，陰陽所在，病之始終，願聞其道。岐伯對曰∶欲知皮部以經脈爲紀者，諸經皆然。陽明之陽，名曰害蜚，上下同法，視其部中有浮絡者，皆陽明之絡也，其色多青則痛，多黑則痹，黃赤則熱，多白則寒，五色皆見，則寒熱也，絡盛則入客於經，陽主外，陰主內。少陽之陽，名曰樞持，上下同法，視其部中有浮絡者，皆少陽之絡也，絡盛則入客於經，故在陽者主內，在陰者主出，以滲於內，諸經皆然。","bh":"","notes":[],"pending":true},{"id":"sw56-2","tags":[],"yw":"太陽之陽，名曰關樞，上下同法，視其部中有浮絡者，皆太陽之絡也，絡盛則入客於經。少陰之陰，名曰樞儒，上下同法，視其部中有浮絡者，皆少陰之絡也，絡盛則入客於經，其入經也，從陽部注於經，其出者，從陰內注於骨。心主之陰，名曰害肩，上下同法，視其部中有浮絡者，皆心主之絡也，絡盛則入客於經。太陰之陰，名曰關蟄，上下同法，視其部中有浮絡者，皆太陰之絡也，絡盛則入客於經。凡十二經絡脈者，皮之部也。是故百病之始生也，必先於皮毛，邪中之則腠理開，開則入客於絡脈，留而不去，傳入於經，留而不去，傳入於腑，廩於腸胃。","bh":"","notes":[],"pending":true},{"id":"sw56-3","tags":[],"yw":"邪之始入於皮也，然起毫毛，開腠理；其入於絡也，則絡脈盛色變；其入客於經也，則感虛乃陷下；其留於筋骨之間，寒多則筋攣骨痛，熱多則筋弛骨消，肉爍破，毛直而敗。帝曰∶夫子言皮之十二部，其生病皆何如？岐伯曰∶皮者脈之部也，邪客於皮則腠理開，開則邪入客於絡脈，絡脈滿則注於經脈，經脈滿則入舍於腑髒也，故皮者有分部，不與而生大病也。帝曰∶善。<目錄>卷第十五","bh":"","notes":[],"pending":true}]},
{"id":"sw57","book":"素问","no":57,"title":"经络论","titleTw":"經絡論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw57-1","tags":[],"yw":"黃帝問曰∶夫絡脈之見也，其五色各異，青黃赤白黑不同，其故何也？岐伯對曰∶經有常色而絡無常變也。帝曰∶經之常色何如？岐伯曰∶心赤，肺白，肝青，脾黃，腎黑，皆亦應其經脈之色也。帝曰∶絡之陰陽，亦應其經乎？岐伯曰∶陰絡之色應其經，陽絡之色變無常，隨四時而行也。寒多則凝泣，凝泣則青黑，熱多則淖澤，淖澤則黃赤，此皆常色，謂之無病。五色具見者，謂之寒熱。帝曰∶善。<目錄>卷第十五","bh":"","notes":[],"pending":true}]},
{"id":"sw58","book":"素问","no":58,"title":"气穴论","titleTw":"氣穴論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw58-1","tags":[],"yw":"黃帝問曰∶餘聞氣穴三百六十五以應一歲，未知其所，願卒聞之。岐伯稽首再拜對曰∶窘乎哉問也！其非聖帝，孰能窮其道焉，因請溢意盡言其處。帝捧手逡巡而卻曰∶夫子之開餘道也，目未見其處，耳未聞其數，而目以明，耳以聰矣。岐伯曰∶此所謂聖人易語，良馬易御也。帝曰∶餘非聖人之易語也，世言真數開人意，今餘所訪問者真數，發蒙解惑，未足以論也。然餘願聞夫子溢志盡言其處，令解其意，請藏之金匱，不敢復出。岐伯再拜而起曰∶臣請言之，背與心相控而痛，所治天突與十椎及上紀，上紀者胃脘也，下紀者關元也。","bh":"","notes":[],"pending":true},{"id":"sw58-2","tags":[],"yw":"背胸邪系陰陽左右，如此其病前後痛澀，胸脅痛而不得息，不得臥，上氣短氣偏痛，脈滿起斜出尻脈，絡胸脅支心貫膈，上肩加天突，斜下肩交十椎下。髒俞五十穴，腑俞七十二穴，熱俞五十九穴，水俞五十七穴，頭上五行行五，五五二十五穴，中KT兩旁各五，凡十穴，大椎上兩旁各一，凡二穴，目瞳子浮白二穴，兩髀厭分中二穴，犢鼻二穴，耳中多所聞二穴，眉本二穴，完骨二穴，項中央一穴，枕骨二穴，上關二穴，大迎二穴，下關二穴，天柱二穴，巨虛上下廉四穴，曲牙二穴，天突一穴，天府二穴，天牖二穴，扶突二穴，天窗二穴，肩解二穴，關元一穴，委陽二穴，肩貞二穴，喑門一穴，臍一穴，胸俞十二穴，背俞二穴，膺俞十二穴，分肉二穴，踝上橫二穴，陰陽蹺四穴，水俞在諸分，熱俞在氣穴，寒熱俞在兩骸厭中二穴，大禁二十五，在天府下五寸，凡三百六十五穴，針之所由行也。","bh":"","notes":[],"pending":true},{"id":"sw58-3","tags":[],"yw":"帝曰∶餘已知氣穴之處，遊針之居，願聞孫絡溪谷，亦有所應乎？岐伯曰∶孫絡三百六十五穴會，亦以應一歲，以溢奇邪，以通榮衛，榮衛稽留，衛散榮溢，氣竭血着，外爲發熱，內爲少氣，疾瀉無怠，以通榮衛，見而瀉之，無問所會。帝曰∶善。願聞溪谷之會也。岐伯曰∶肉之大會爲谷，肉之小會爲溪，肉分之間，溪谷之會，以行榮衛，以會大氣。邪溢氣壅，脈熱肉敗，榮衛不行，必將爲膿，內銷骨髓，外破大，留於節湊，必將爲敗。積寒留舍，榮衛不居，卷肉縮筋，肋肘不得伸，內爲骨痹，外爲不仁，命曰不足，大寒留於溪谷也。","bh":"","notes":[],"pending":true},{"id":"sw58-4","tags":[],"yw":"溪谷三百六十五穴會，亦應一歲。其小痹淫溢，循脈往來，微針所及，與法相同。帝乃辟左右而起，再拜曰∶今日發蒙解惑，藏之金匱，不敢復出。乃藏之金蘭之室，署曰氣穴所在。岐伯曰∶孫絡之脈別經者，其血盛而當瀉者，亦三百六十五脈，並注於絡，傳注十二絡脈，非獨十四絡脈也，內解瀉於中者十脈。<目錄>卷第十五","bh":"","notes":[],"pending":true}]},
{"id":"sw59","book":"素问","no":59,"title":"气府论","titleTw":"氣府論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw59-1","tags":[],"yw":"足太陽脈氣所發者七十八穴∶兩眉頭各一，入發至項三寸半，旁五，相去三寸，其浮氣在皮中者凡五行，行五，五五二十五，項中大筋兩旁各一，風府兩旁各一，挾脊以下至尻尾二十一節十五間各一，五髒之俞各五，六腑之俞各六，委中以下至足小指旁各六俞。足少陽脈氣所發者六十二穴∶兩角上各二，直目上發際內各五，耳前角上各一，耳前角下各一，銳發下各一，客主人各一，耳後陷中各一，下關各一，耳下牙車之後各一，缺盆各一，掖下三寸，脅下至，八間各一，髀樞中，旁各一，膝以下至足小指次指各六俞。","bh":"","notes":[],"pending":true},{"id":"sw59-2","tags":[],"yw":"足陽明脈氣所發者六十八穴∶額顱發際旁各三，面鼽骨空各一，大迎之骨空各一，人迎各一，缺盆外骨空各一，膺中骨間各一，挾鳩尾之外，當乳下三寸，挾胃脘各五，挾臍廣三寸各三，下臍二寸挾之各三，氣街動脈各一，伏兔上各一，三裏以下至足中指各八俞，分之所在穴空。手太陽脈氣所發者三十六穴∶目內各一，目外各一，鼽骨下各一，耳郭上各一，耳中各一，巨骨穴各一，曲掖上骨穴各一，柱骨上陷者各一，上天窗四寸各一，肩解各一，肩解下三寸各一，肘以下至手小指本各六俞。","bh":"","notes":[],"pending":true},{"id":"sw59-3","tags":[],"yw":"手陽明脈氣所發者二十二穴∶鼻空外廉項上各二，大迎骨空各一，柱骨之會各一，骨之會各一，肘以下至手大指次指本各六俞。手少陽脈氣所發者三十二穴∶鼽骨下各一，眉後各一，角上各一，下完骨後各一，項中足太陽之前各一，挾扶突各一，肩貞各一，肩貞下三寸分間各一，肘以下至手小指次指本各六俞。督脈氣所發者二十八穴∶項中央二，發際後中八，面中三，大椎以下至尻尾及旁十五穴，至下凡二十一節，脊椎法也。任脈之氣所發者二十八穴∶喉中央二，膺中骨陷中各一，鳩尾下三寸，胃脘五寸，胃脘以下至橫骨六寸半一。","bh":"","notes":[],"pending":true},{"id":"sw59-4","tags":[],"yw":"腹脈法也。下陰別一，目下各一，下脣一，齦交一。衝脈氣所發者二十二穴∶挾鳩尾外各半寸至臍寸一，挾臍下旁各五分至橫骨寸一，腹脈法也。足少陰舌下，厥陰毛中急脈各一，手少陰各一，陰陽蹺各一，手足諸魚際脈氣所發者，凡三百六十五穴也。皮部論∶蜚（扶沸切）（渠殞切）氣穴論∶蔽（必寐切）（音摘）（奴到切）氣府論∶囟（音信）（上音衣，下音喜）顳（上如輒切，下汝車切）毖（音祕）HT（音仇）<目錄>卷第十六","bh":"","notes":[],"pending":true}]},
{"id":"sw60","book":"素问","no":60,"title":"骨空论","titleTw":"骨空論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw60-1","tags":[],"yw":"黃帝問曰∶餘聞風者百病之始也，以針治之奈何？岐伯對曰∶風從外入，令人振寒，汗出頭痛，身重惡寒，治在風府，調其陰陽，不足則補，有餘則瀉，大風頸項痛，刺風府，風府在上椎。大風汗出，灸，在背下挾脊旁三寸所，厭之令病者呼，應手。從風憎風，刺眉頭。失枕在肩上橫骨間，折使揄臂齊肘正，灸脊中。絡季脅引少腹而痛脹，刺。腰痛不可以轉搖，急引陰卵，刺八與痛上，八在腰尻分間。鼠寒熱，還刺寒府，寒府在附膝外解營。取膝上外者使之拜，取足心者使之跪。","bh":"","notes":[],"pending":true},{"id":"sw60-2","tags":[],"yw":"任脈者，起於中極之下，以上毛際，循腹裏上關元，至咽喉，上頤循面入目。衝脈者，起於氣街，並少陰之經，挾臍上行，至胸中而散。任脈爲病，男子內結七疝，女子帶下瘕聚。衝脈爲病，逆氣裏急。督脈爲病，脊強反折。督脈者，起於少腹以下骨中央，女子入系廷孔，其孔，溺孔之端也，其絡循陰器合篡間，繞篡後，別繞臀，至少陰與巨陽中絡者，合少陰上股內後廉，貫脊屬腎，與太陽起於目內，上額交巔上，入絡腦，還出別下項，循肩內，挾脊抵腰中，入循膂絡腎；其男子循莖下至篡，與女子等；其少腹直上者，貫臍中央，上貫心入喉，上頤環脣，上系兩目之下中央。","bh":"","notes":[],"pending":true},{"id":"sw60-3","tags":[],"yw":"此生病，從少腹上衝心而痛，不得前後，爲衝疝。其女子不孕，癃痔遺溺嗌干。督脈生病治督脈，治在骨上，甚者在臍下營。其上氣有音者治其喉中央，在缺盆中者。其病上衝喉者治其漸，漸者上挾頤也。蹇膝伸不屈治其楗。坐而膝痛治其機。立而暑解，治其骸關。膝痛，痛及拇指治其。坐而膝痛如物隱者，治其關。膝痛不可屈伸，治其背內。連若折，治陽明中俞。若別，治巨陽少陰滎。淫濼脛，不能久立，治少陽之維，在外上五寸。輔骨上橫骨下爲楗，挾髖爲機，膝解爲骸關，挾膝之骨爲連骸，骸下爲輔，輔上爲，上爲關，頭橫骨爲枕。","bh":"","notes":[],"pending":true},{"id":"sw60-4","tags":[],"yw":"水俞五十七穴者，尻上五行，行五，伏兔上兩行，行五，左右各一行，行五，踝上各一行，行六穴。髓空在腦後三分，在顱際銳骨之下，一在齦基下，一在項後中復骨下，一在脊骨上空在風府上。脊骨下空，在尻骨下空。數髓空在面挾鼻，或骨空在口下當兩肩。兩骨空，在中之陽。臂骨空在臂陽，去踝四寸兩骨空之間。股骨上空在股陽，出上膝四寸。骨空在輔骨之上端。股際骨空在毛中動下。尻骨空在髀骨之後，相去四寸。扁骨有滲理湊，無髓孔，易髓無空。","bh":"","notes":[],"pending":true},{"id":"sw60-5","tags":[],"yw":"灸寒熱之法，先灸項大椎，以年爲壯數，次灸橛骨，以年爲壯數，視背俞陷者灸之，舉臂肩上陷者灸之，兩季脅之間灸之，外踝上絕骨之端灸之，足小指次指間灸之，下陷脈灸之，外踝後灸之，缺盆骨上切之堅痛如筋者灸之，膺中陷骨間灸之。掌束骨下灸之，臍下關元三寸灸之，毛際動脈灸之，膝下三寸分間灸之，足陽明跗上動脈灸之，巔上一灸之，犬所齧之處灸之三壯，即以犬傷病法灸之，凡當灸二十九處。傷食灸之，不已者，必視其經之過於陽者，數刺其俞而藥之。","bh":"","notes":[],"pending":true},{"id":"sw60-6","tags":[],"yw":"<目錄>卷第十六","bh":"","notes":[],"pending":true}]},
{"id":"sw61","book":"素问","no":61,"title":"水热穴论","titleTw":"水熱穴論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw61-1","tags":[],"yw":"黃帝問曰∶少陰何以主腎？腎何以主水？岐伯對曰∶腎者至陰也，至陰者盛水也，肺者太陰也，少陰者冬脈也，故其本在腎，其末在肺，皆積水也。帝曰∶腎何以能聚水而生病？岐伯曰∶腎者胃之關也，關門不利，故聚水而從其類也。上下溢於皮膚，故爲腫。腫者，聚水而生病也。帝曰∶諸水皆生於腎乎？岐伯曰∶腎者牝髒也，地氣上者屬於腎，而生水液也，故曰至陰。勇而勞甚則腎汗出，腎汗出逢於風，內不得入於髒腑，外不得越於皮膚，客於玄府，行於皮裏，傳爲腫，本之於腎，名曰風水。","bh":"","notes":[],"pending":true},{"id":"sw61-2","tags":[],"yw":"所謂玄府者，汗空也。帝曰∶水俞五十七處者，是何主也？岐伯曰∶腎俞五十七穴，積陰之所聚也，水所從出入也。尻上五行行五者，此腎俞。故水病下爲腫大腹，上爲喘呼，不得臥者，標本俱病，故肺爲喘呼，腎爲水腫，肺爲逆不得臥，分爲相輸，俱受者水氣之所留也。伏兔上各二行行五者，此腎之街也。三陰之所交結於腳也。踝上各一行行六者，此腎脈之下行也，名曰太衝。凡五十七穴者，皆髒之陰絡，水之所客也。帝曰∶春取絡脈分肉何也？岐伯曰∶春者木始治，肝氣始生，肝氣急，其風疾，經脈常深，其氣少，不能深入，故取絡脈分肉間。","bh":"","notes":[],"pending":true},{"id":"sw61-3","tags":[],"yw":"帝曰∶夏取盛經分腠何也？岐伯曰∶夏者火始治，心氣始長，脈瘦氣弱，陽氣留溢，熱燻分腠，內至於經，故取盛經分腠，絕膚而病去者，邪居淺也。所謂盛經者，陽脈也。帝曰∶秋取經俞何也？岐伯曰∶秋者金始治，肺將收殺，金將勝火，陽氣在合，陰氣初勝，溼氣及體，陰氣未盛，未能深入，故取俞以瀉陰邪，取合以虛陽邪，陽氣始衰，故取於合。帝曰∶冬取井滎何也？岐伯曰∶冬者水始治，腎方閉，陽氣衰少，陰氣堅盛，巨陽伏沉，陽脈乃去，故取井以下陰逆，取滎以實陽氣。","bh":"","notes":[],"pending":true},{"id":"sw61-4","tags":[],"yw":"故曰∶冬取井滎，春不鼽衄。此之謂也。帝曰∶夫子言治熱病五十九俞，餘論其意，未能領別其處，願聞其處，因聞其意。岐伯曰∶頭上五行行五者，以越諸陽之熱逆也。大杼、膺俞、缺盆、背俞，此八者，以瀉胸中之熱也。氣街，三裏，巨虛上下廉，此八者，以瀉胃中之熱也。雲門、骨、委中、髓空，此八者，以瀉四肢之熱也。五髒俞旁五，此十者，以瀉五髒之熱也。凡此五十九穴者，皆熱之左右也。帝曰∶人傷於寒而傳爲熱何也？岐伯曰∶夫寒盛則生熱也。","bh":"","notes":[],"pending":true},{"id":"sw61-5","tags":[],"yw":"骨空論∶（音博）楗（音健）齧（若結切）水熱穴論∶（音祕）菟（音兔）溜（力救切）鼷（音奚）致（馳二切）<目錄>卷第十七","bh":"","notes":[],"pending":true}]},
{"id":"sw62","book":"素问","no":62,"title":"调经论","titleTw":"調經論","tags":["ci","jingluo","bingji"],"brief":"","pending":true,"sections":[{"id":"sw62-1","tags":[],"yw":"黃帝問曰∶餘聞刺法言，有餘瀉之，不足補之，何謂有餘？何謂不足？岐伯對曰∶有餘有五，不足亦有五，帝欲何問？帝曰∶願盡聞之。岐伯曰∶神有餘有不足，氣有餘有不足，血有餘有不足，形有餘有不足，志有餘有不足，凡此十者，其氣不等也。帝曰∶人有精氣津液，四肢九竅，五髒十六部，三百六十五節，乃生百病，百病之生，皆有虛實。今夫子乃言有餘有五，不足亦有五，何以生之乎？岐伯曰∶皆生於五髒也。夫心藏神，肺藏氣，肝藏血，脾藏肉，腎藏志，而此成形。","bh":"","notes":[],"pending":true},{"id":"sw62-2","tags":[],"yw":"志意通，內連骨髓，而成身形五髒。五髒之道，皆出於經隧，以行血氣，血氣不和，百病乃變化而生，是故守經隧焉。帝曰∶神有餘不足何如？岐伯曰∶神有餘則笑不休，神不足則悲。血氣未並，五髒安定，邪客於形，灑淅起於毫毛，未入於經絡也，故命曰神之微。帝曰∶補瀉奈何？岐伯曰∶神有餘，則瀉其小絡之血，出血勿之深斥，無中其大經，神氣乃平。神不足者，視其虛絡，按而致之，刺而利之，無出其血，無泄其氣，以通其經，神氣乃平。帝曰∶刺微奈何？岐伯曰∶按摩勿釋，着針勿斥，移氣於不足，神氣乃得復。","bh":"","notes":[],"pending":true},{"id":"sw62-3","tags":[],"yw":"帝曰∶善。有餘不足奈何？岐伯曰∶氣有餘則喘咳上氣，不足則息利少氣。血氣未並，五髒安定，皮膚微病，命曰白氣微泄。帝曰∶補瀉奈何？岐伯曰∶氣有餘，則瀉其經隧，無傷其經，無出其血，無泄其氣。不足，則補其經隧，無出其氣。帝曰∶刺微奈何？岐伯曰∶按摩勿釋，出針視之，曰我將深之，適人必革，精氣自伏，邪氣散亂，無所休息，氣泄腠理，真氣乃相得。帝曰∶善。血有餘不足奈何？岐伯曰∶血有餘則怒，不足則恐。血氣未並，五髒安定，孫絡外溢，則經有留血。","bh":"","notes":[],"pending":true},{"id":"sw62-4","tags":[],"yw":"帝曰∶補瀉奈何？岐伯曰∶血有餘，則瀉其盛經出其血。不足，則視其虛經內針其脈中，久留而視，脈大，疾出其針，無令血泄。帝曰∶刺留血奈何？岐伯曰∶視其血絡，刺出其血，無令惡血得入於經，以成其疾。帝曰∶善。形有餘不足奈何？岐伯曰∶形有餘則腹脹涇溲不利，不足則四肢不用。血氣未並，五髒安定，肌肉蠕動，命曰微風。帝曰∶補瀉奈何？岐伯曰∶形有餘則瀉其陽經，不足則補其陽絡。帝曰∶刺微奈何？岐伯曰∶取分肉間，無中其經，無傷其絡，衛氣得復，邪氣乃索。","bh":"","notes":[],"pending":true},{"id":"sw62-5","tags":[],"yw":"帝曰∶善。志有餘不足奈何？岐伯曰∶志有餘則腹脹飧泄，不足則厥。血氣未並，五髒安定，骨節有動。帝曰∶補瀉奈何？岐伯曰∶志有餘則瀉然筋血者，不足則補其復溜。帝曰∶刺未並奈何？岐伯曰∶即取之，無中其經，邪所乃能立虛。帝曰∶善。餘已聞虛實之形，不知其何以生。岐伯曰∶氣血以並，陰陽相傾，氣亂於衛，血逆於經，血氣離居，一實一虛。血並於陰，氣並於陽，故爲驚狂。血並於陽，氣並於陰，乃爲炅中。血並於上，氣並於下，心煩惋善怒。","bh":"","notes":[],"pending":true},{"id":"sw62-6","tags":[],"yw":"血並於下，氣並於上，亂而喜忘。帝曰∶血並於陰，氣並於陽，如是血氣離居，何者爲實？何者爲虛？岐伯曰∶血氣者，喜溫而惡寒，寒則泣不能流，溫則消而去之，是故氣之所並爲血虛，血之所並爲氣虛。帝曰∶人之所有者，血與氣耳。今夫子乃言血並爲虛，氣並爲虛，是無實乎？岐伯曰∶有者爲實，無者爲虛，故氣並則無血，血並則無氣，今血與氣相失，故爲虛焉。絡之與孫脈俱輸於經，血與氣並，則爲實焉。血之與氣並走於上，則爲大厥，厥則暴死，氣復反則生，不反則死。","bh":"","notes":[],"pending":true},{"id":"sw62-7","tags":[],"yw":"帝曰∶實者何道從來？虛者何道從去？虛實之要，願聞其故。岐伯曰∶夫陰與陽皆有俞會，陽注於陰，陰滿之外，陰陽勻平，以充其形，九候若一，命曰平人。夫邪之生也，或生於陰，或生於陽。其生於陽者，得之風雨寒暑。其生於陰者，得之飲食居處，陰陽喜怒。帝曰∶風雨之傷人奈何？岐伯曰∶風雨之傷人也，先客於皮膚，傳入於孫脈，孫脈滿則傳入於絡脈，絡脈滿則輸於大經脈，血氣與邪並客於分腠之間，其脈堅大，故曰實。實者外堅充滿，不可按之，按之則痛。","bh":"","notes":[],"pending":true},{"id":"sw62-8","tags":[],"yw":"帝曰∶寒溼之傷人奈何？岐伯曰∶寒溼之中人也，皮膚不收，肌肉堅緊，榮血泣，衛氣去，故曰虛。虛者聶辟氣不足，按之則氣足以溫之，故快然而不痛。帝曰∶善。陰之生實奈何？岐伯曰∶喜怒不節則陰氣上逆，上逆則下虛，下虛則陽氣走之，故曰實矣。帝曰∶陰之生虛奈何？岐伯曰∶喜則氣下，悲則氣消，消則脈虛空，因寒飲食，寒氣燻滿，則血泣氣去，故曰虛矣。帝曰∶經言陽虛則外寒，陰虛則內熱，陽盛則外熱，陰盛則內寒，餘已聞之矣，不知其所由然也。","bh":"","notes":[],"pending":true},{"id":"sw62-9","tags":[],"yw":"岐伯曰∶陽受氣於上焦，以溫皮膚分肉之間，今寒氣在外，則上焦不通，上焦不通，則寒氣獨留於外，故寒慄。帝曰∶陰虛生內熱奈何？岐伯曰∶有所勞倦，形氣衰少，谷氣不盛，上焦不行，下脘不通。胃氣熱，熱氣燻胸中，故內熱。帝曰∶陽盛生外熱奈何？岐伯曰∶上焦不通利，則皮膚致密，腠理閉塞，玄府不通，衛氣不得泄越，故外熱。帝曰∶陰盛生內寒奈何？岐伯曰∶厥氣上逆，寒氣積於胸中而不瀉，不瀉則溫氣去，寒獨留，則血凝泣，凝則脈不通，其脈盛大以澀，故中寒。","bh":"","notes":[],"pending":true},{"id":"sw62-10","tags":[],"yw":"帝曰∶陰與陽並，血氣以並，病形以成，刺之奈何？岐伯曰∶刺此者取之經隧，取血於營，取氣於衛，用形哉，因四時多少高下。帝曰∶血氣以並，病形以成，陰陽相傾，補瀉奈何？岐伯曰∶瀉實者氣盛乃內針，針與氣俱內，以開其門如利其戶，針與氣俱出，精氣不傷，邪氣乃下，外門不閉，以出其疾，搖大其道，如利其路，是謂大瀉，必切而出，大氣乃屈。帝曰∶補虛奈何？岐伯曰∶持針勿置，以定其意，候呼內針，氣出針入，針空四塞，精無從去，方實而疾出針，氣入針出，熱不得還，閉塞其門，邪氣布散，精氣乃得存，動氣候時，近氣不失，遠氣乃來，是謂追之。","bh":"","notes":[],"pending":true},{"id":"sw62-11","tags":[],"yw":"帝曰∶夫子言虛實者有十，生於五髒，五髒五脈耳。夫十二經脈皆生其病，今夫子獨言五髒。夫十二經脈者，皆絡三百六十五節，節有病必被經脈，經脈之病皆有虛實，何以合之？岐伯曰∶五髒者，故得六腑與爲表裏，經絡支節，各生虛實，其病所居，隨而調之。病在脈，調之血；病在血，調之絡；病在氣，調之衛；病在肉，調之分肉；病在筋，調之筋；病在骨，調之骨。燔針劫刺其下及與急者；病在骨，淬針藥熨；病不知所痛，兩蹺爲上；身形有痛，九候莫病，則繆刺之；痛在於左而右脈病者，巨刺之。","bh":"","notes":[],"pending":true},{"id":"sw62-12","tags":[],"yw":"必謹察其九候，針道備矣。調經論∶隧（音遂）飧（音孫）燔（音煩）<目錄>卷第十八","bh":"","notes":[],"pending":true}]},
{"id":"sw63","book":"素问","no":63,"title":"缪刺论","titleTw":"繆刺論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw63-1","tags":[],"yw":"黃帝問曰∶餘聞繆刺，未得其意，何謂繆刺？岐伯對曰∶夫邪之客於形也，必先舍於皮毛，留而不去，入舍於孫脈，留而不去，入舍於絡脈，留而不去，入舍於經脈，內連五髒，散於腸胃，陰陽俱感，五髒乃傷，此邪之從皮毛而入，極於五髒之次也，如此則治其經焉。今邪客於皮毛，入舍於孫絡，留而不去，閉塞不通，不得入於經，流溢於大絡，而生奇病也。夫邪客大絡者，左注右，右注左，上下左右與經相干，而布於四末，其氣無常處，不入於經俞，命曰繆刺。","bh":"","notes":[],"pending":true},{"id":"sw63-2","tags":[],"yw":"帝曰∶願聞繆刺，以左取右以右取左奈何？其與巨刺何以別之？岐伯曰∶邪客於經，左盛則右病，右盛則左病，亦有移易者，左痛未已而右脈先病，如此者，必巨刺之，必中其經，非絡脈也。故絡病者，其痛與經脈繆處，故命曰繆刺。帝曰∶願聞繆刺奈何？取之何如？岐伯曰∶邪客於足少陰之絡，令人卒心痛暴脹，胸脅支滿，無積者，刺然骨之前出血，如食頃而已，不已，左取右，右取左，病新發者，取五日已。邪客於手少陽之絡，令人喉痹舌卷，口干心煩，臂外廉痛，手不及頭，刺手中指次指爪甲上，去端如韭葉各一，壯者立已，老者有頃已，左取右，右取左，此新病數日已。","bh":"","notes":[],"pending":true},{"id":"sw63-3","tags":[],"yw":"邪客於足厥陰之絡，令人卒疝暴痛，刺足大指爪甲上，與肉交者各一，男子立已，女子有頃已，左取右，右取左。邪客於足太陽之絡，令人頭項肩痛，刺足小指爪甲上，與肉交者各一，立已，不已，刺外踝下三，左取右，右取左，如食頃已。邪客於手陽明之絡，令人氣滿胸中，喘息而支，胸中熱，刺手大指次指爪甲上，去端如韭葉各一，左取右，右取左，如食頃已。邪客於臂掌之間，不可得屈，刺其踝後，先以指按之痛，乃刺之，以月死生爲數，月生一日一，二日二，十五日十五，十六日十四。","bh":"","notes":[],"pending":true},{"id":"sw63-4","tags":[],"yw":"邪客於足陽蹺之脈，令人目痛從內始，刺外踝之下半寸所各二，左刺右，右刺左，如行十裏頃而已。人有所墮墜，惡血留內，腹中滿脹，不得前後，先飲利藥，此上傷厥陰之脈，下傷少陰之絡，刺足內踝之下，然骨之前血脈出血，刺足跗上動脈，不已，刺三毛上各一，見血立已，左刺右，右刺左。善悲驚不樂，刺如右方。邪客於手陽明之絡，令人耳聾，時不聞音，刺手大指次指爪甲上，去端如韭葉各一，立聞，不已，刺中指爪甲上與肉交者，立聞，其不時聞者，不可刺也。","bh":"","notes":[],"pending":true},{"id":"sw63-5","tags":[],"yw":"耳中生風者，亦刺之如此數，左刺右，右刺左。凡痹往來行無常處者，在分肉間痛而刺之，以月死生爲數，用針者，隨氣盛衰，以爲數，針過其日數則脫氣，不及日數則氣不瀉，左刺右，右刺左，病已止，不已，復刺之如法，月生一日一，二日二，漸多之，十五日十五，十六日十四，漸少之。邪客於足陽明之經，令人鼽衄上齒寒，刺足中指次指爪甲上，與肉交者各一，左刺右，右刺左。邪客於足少陽之絡，令人脅痛不得息，咳而汗出，刺足小指次指爪甲上，與肉交者各一，不得息立已，汗出立止，咳者溫衣飲食，一日已，左刺右，右刺左，病立已，不已，復刺如法。","bh":"","notes":[],"pending":true},{"id":"sw63-6","tags":[],"yw":"邪客於足少陰之絡，令人嗌痛不可內食，無故善怒，氣上走賁上，刺足下中央之脈各三，凡六刺，立已，左刺右，右刺左。嗌中腫，不能內唾，時不能出唾者，繆刺然骨之前，出血立已，左刺右，右刺左。邪客於足太陰之絡，令人腰痛，引少腹控，不可以仰息，刺腰尻之解，兩胂之上，是腰俞，以月死生爲數，發針立已，左刺右，右刺左。邪客於足太陽之絡，令人拘攣背急，引脅而痛，刺之從項始數脊椎挾脊，疾按之應手如痛，刺之旁三，立已。邪客於足少陽之絡，令人留於樞中痛，髀不可舉，刺樞中以毫針，寒則久留針，以月死生爲數，立已。","bh":"","notes":[],"pending":true},{"id":"sw63-7","tags":[],"yw":"治諸經刺之，所過者不病，則繆刺之。耳聾，刺手陽明，不已，刺其通脈出耳前者。齒齲，刺手陽明，不已，刺其脈入齒中，立已。邪客於五髒之間，其病也，脈引而痛，時來時止，視其病，繆刺之於手足爪甲上，視其脈，出其血，間日一刺，一刺不已，五刺已。繆傳引上齒，齒脣寒痛，視其手背脈血者去之，足陽明中指爪甲上一，手大指次指爪甲上各一，立已，左取右，右取左。邪客於手足少陰太陰足陽明之絡，此五絡皆會於耳中，上絡左角，五絡俱竭，令人身脈皆動，而形無知也，其狀若屍，或曰屍厥，刺其足大指內側爪甲上，去端如韭葉，後刺足心，後刺足中指爪甲上各一，後刺手大指內側，去端如韭葉，後刺手心主，少陰銳骨之端各一，立已，不已，以竹管吹其兩耳，其左角之發方一寸燔治，飲以美酒一杯，不能飲者灌之，立已。","bh":"","notes":[],"pending":true},{"id":"sw63-8","tags":[],"yw":"凡刺之數，先視其經脈，切而從之，審其虛實而調之，不調者經刺之，有痛而經不病者繆刺之，因視其皮部有血絡者盡取之，此繆刺之數也。<目錄>卷第十八","bh":"","notes":[],"pending":true}]},
{"id":"sw64","book":"素问","no":64,"title":"四时刺逆从论","titleTw":"四時刺逆從論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw64-1","tags":[],"yw":"厥陰有餘病陰痹，不足病生熱痹，滑則病狐疝風，澀則病少腹積氣。少陰有餘病皮痹隱軫，不足病肺痹，滑則病肺風疝，澀則病積溲血。太陰有餘病肉痹寒中，不足病脾痹，滑則病脾風疝，澀則病積心腹時滿。陽明有餘病脈痹身時熱，不足病心痹，滑則病心風疝，澀則病積時善驚。太陽有餘病骨痹身重，不足病腎痹，滑則病腎風疝，澀則病積善時巔疾。少陽有餘病筋痹脅滿，不足病肝痹，滑則病肝風疝，澀則病積時筋急目痛。是故春氣在經脈，夏氣在孫絡，長夏氣在肌肉，秋氣在皮膚，冬氣在骨髓中。","bh":"","notes":[],"pending":true},{"id":"sw64-2","tags":[],"yw":"帝曰∶餘願聞其故。岐伯曰∶春者，天氣始開，地氣始泄，凍解冰釋，水行經通，故人氣在脈。夏者，經滿氣溢，入孫絡受血，皮膚充實。長夏者，經絡皆盛，內溢肌中。秋者，天氣始收，腠理閉塞，皮膚引急。冬者蓋藏，血氣在中，內着骨髓，通於五髒。是故邪氣者，常隨四時之氣血而入客也，至其變化不可爲度，然必從其經氣，辟除其邪，除其邪則亂氣不生。帝曰∶逆四時而生亂氣奈何？岐伯曰∶春刺絡脈，血氣外溢，令人少氣；春刺肌肉，血氣環逆，令人上氣；春刺筋骨，血氣內着，令人腹脹。","bh":"","notes":[],"pending":true},{"id":"sw64-3","tags":[],"yw":"夏刺經脈，血氣乃竭，令人解；夏刺肌肉，血氣內卻，令人善恐；夏刺筋骨，血氣上逆，令人善怒。秋刺經脈，血氣上逆，令人善忘；秋刺絡脈，氣不外行，令人臥不欲動；秋刺筋骨，血氣內散，令人寒慄。冬刺經脈，血氣皆脫，令人目不明；冬刺絡脈，內氣外泄，留爲大痹；冬刺肌肉，陽氣竭絕，令人善忘。凡此四時刺者，大逆之病，不可不從也，反之，則生亂氣相淫病焉。故刺不知四時之經，病之所生，以從爲逆，正氣內亂，與精相薄，必審九候，正氣不亂，精氣不轉。","bh":"","notes":[],"pending":true},{"id":"sw64-4","tags":[],"yw":"帝曰∶善。刺五髒，中心一日死，其動爲噫。中肝五日死，其動爲語。中肺三日死，其動爲咳。中腎六日死，其動爲嚏欠。中脾十日死，其動爲吞。刺傷人五髒必死，其動，則根據其髒之所變候知其死也。<目錄>卷第十八","bh":"","notes":[],"pending":true}]},
{"id":"sw65","book":"素问","no":65,"title":"标本病传论","titleTw":"標本病傳論","tags":["ci","bingji","yinyang"],"brief":"","pending":true,"sections":[{"id":"sw65-1","tags":[],"yw":"黃帝問曰∶病有標本，刺有逆從奈何？岐伯對曰∶凡刺之方，必別陰陽，前後相應，逆從得施，標本相移，故曰有其在標而求之於標，有其在本而求之於本，有其在本而求之於標，有其在標而求之於本。故治有取標而得者，有取本而得者，有逆取而得者；有從取而得者。故知逆與從，正行無問，知標本者，萬舉萬當，不知標本，是謂妄行。夫陰陽逆從標本之爲道也，小而大，言一而知百病之害，少而多，淺而博，可以言一而知百也。以淺而知深，察近而知遠，言標與本，易而勿及。","bh":"","notes":[],"pending":true},{"id":"sw65-2","tags":[],"yw":"治反爲逆，治得爲從。先病而後逆者治其本，先逆而後病者治其本，先寒而後生病者治其本，先病而後生寒者治其本，先熱而後生病者治其本，先熱而後生中滿者治其標，先病而後泄者治其本，先泄而後生他病者治其本，必且調之，乃治其他病，先病而後生中滿者治其標，先中滿而後煩心者治其本。人有客氣有同氣。小大不利治其標，小大利治其本。病發而有餘，本而標之，先治其本，後治其標。病發而不足，標而本之，先治其標，後治其本。謹察間甚，以意調之，間者並行，甚者獨行。","bh":"","notes":[],"pending":true},{"id":"sw65-3","tags":[],"yw":"先小大不利而後生病者治其本。夫病傳者，心病先心痛，一日而咳，三日脅支痛，五日閉塞不通，身痛體重，三日不已死，冬夜半，夏日中。肺病喘咳，三日而脅支滿痛，一日身重體痛，五日而脹，十日不已死，冬日入，夏日出。肝病頭目眩脅支滿，三日體重身痛，五日而脹，三日腰脊少腹痛脛，三日不已死，冬日入，夏早食。脾病身痛體重，一日而脹，二日少腹腰脊痛脛，三日背KT筋痛小便閉，十日不已死，冬人定，夏晏食。腎病少腹腰脊痛，三日背KT筋痛小便閉，三日腹脹，三日兩脅支痛，三日不已死，冬大晨，夏晏晡。","bh":"","notes":[],"pending":true},{"id":"sw65-4","tags":[],"yw":"胃病脹滿，五日少腹腰脊痛，三日背KT筋痛小便閉，五日身體重，六日不已死，冬夜半後，夏日。膀胱病小便閉，五日少腹脹腰脊痛，一日腹脹，一日身體痛，二日不已死，冬雞鳴，夏下晡。諸病以次相傳，如是者，皆有死期，不可刺。間一髒止，及至三四髒者，乃可刺也。<目錄>卷第十九","bh":"","notes":[],"pending":true}]},
{"id":"sw66","book":"素问","no":66,"title":"天元纪大论","titleTw":"天元紀大論","tags":["yunqi","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw66-1","tags":[],"yw":"黃帝問曰∶天有五行，御五位，以生寒暑燥溼風，人有五髒，化五氣，以生喜怒思憂恐，論言五運相襲而皆治之，終期之日，周而復始，餘已知之矣，願聞其與三陰三陽之候奈何合之？鬼臾區稽首再拜對曰∶昭乎哉問也。夫五運陰陽者，天地之道也，萬物之綱紀，變化之父母，生殺之本始，神明之府也，可不通乎！故物生謂之化，物極謂之變，陰陽不測謂之神，神用無方謂之聖。夫變化之爲用也，在天爲玄，在人爲道，在地爲化，化生五味，道生智，玄生神。","bh":"","notes":[],"pending":true},{"id":"sw66-2","tags":[],"yw":"神在天爲風，在地爲木，在天爲熱，在地爲火，在天爲溼，在地爲土，在天爲燥，在地爲金，在天爲寒，在地爲水，故在天爲氣，在地成形，形氣相感而化生萬物矣。然天地者，萬物之上下也；左右者，陰陽之道路也；水火者，陰陽之徵兆也；金木者，生成之終始也。氣有多少，形有盛衰，上下相召而損益彰矣。帝曰∶願聞五運之主時也何如？鬼臾區曰∶五氣營運，各終期日，非獨主時也。帝曰∶請聞其所謂也。鬼臾區曰∶臣積考《太始天元冊》文曰∶太虛寥廓，肇基化元，萬物資始，五運終天，布氣真靈，統坤元，九星懸朗，七曜周旋，曰陰曰陽，曰柔曰剛，幽顯既位，寒暑弛張，生生化化，品物鹹章。","bh":"","notes":[],"pending":true},{"id":"sw66-3","tags":[],"yw":"臣斯十世，此之謂也。帝曰∶善。何謂氣有多少，形有盛衰？鬼臾區曰∶陰陽之氣各有多少，故曰三陰三陽也。形有盛衰，謂五行之治，各有太過不及也。故其始也，有餘而往，不足隨之，不足而往，有餘從之，知迎知隨，氣可與期。應天爲天符，承歲爲歲直，三合爲治。帝曰∶上下相召奈何？鬼臾區曰∶寒暑燥溼風火，天之陰陽也，三陰三陽上奉之。木火土金水火，地之陰陽也，生長化收藏下應之。天以陽生陰長，地以陽殺陰藏。天有陰陽，地亦有陰陽。","bh":"","notes":[],"pending":true},{"id":"sw66-4","tags":[],"yw":"木火土金水火，地之陰陽也，生長化收藏。故陽中有陰，陰中有陽。所以欲知天地之陰陽者，應天之氣，動而不息，故五歲而右遷，應地之氣，靜而守位，故六期而環會，動靜相召，上下相臨，陰陽相錯，而變由生也。帝曰∶上下周紀，其有數乎？鬼臾區曰∶天以六爲節，地以五爲制。周天氣者，六期爲一備；終地紀者，五歲爲一周。君火以明，相火以位。五六相合而七百二十氣，爲一紀，凡三十歲；千四百四十氣，凡六十歲，而爲一周，不及太過，斯皆見矣。","bh":"","notes":[],"pending":true},{"id":"sw66-5","tags":[],"yw":"帝曰∶夫子之言，上終天氣，下畢地紀，可謂悉矣。餘願聞而藏之，上以治民，下以治身，使百姓昭着，上下和親，德澤下流，子孫無憂，傳之後世，無有終時，可得聞乎？鬼臾區曰∶至數之機，迫迮以微，其來可見，其往可追，敬之者昌，慢之者亡，無道行私，必得夭殃，謹奉天道，請言真要。帝曰∶善言始者，必會於終，善言近者，必知其遠，是則至數極而道不惑，所謂明矣。願夫子推而次之，令有條理，簡而不匱，久而不絕，易用難忘，爲之綱紀，至數之要，願盡聞之。","bh":"","notes":[],"pending":true},{"id":"sw66-6","tags":[],"yw":"鬼臾區曰∶昭乎哉問！明乎哉道！如鼓之應桴，響之應聲也。臣聞之，甲己之歲，土運統之；乙庚之歲，金運統之；丙辛之歲，水運統之；丁壬之歲，木運統之；戊癸之歲，火運統之。帝曰∶其於三陰三陽，合之奈何？鬼臾區曰∶子午之歲，上見少陰；丑未之歲，上見太陰；寅申之歲，上見少陽；卯酉之歲，上見陽明；辰戌之歲，上見太陽；巳亥之歲，上見厥陰。少陰所謂標也，厥陰所謂終也。厥陰之上，風氣主之；少陰之上，熱氣主之；太陰之上，溼氣主之；少陽之上、相火主之；陽明之上，燥氣主之；太陽之上，寒氣主之。","bh":"","notes":[],"pending":true},{"id":"sw66-7","tags":[],"yw":"所謂本也，是謂六元。帝曰∶光乎哉道！明乎哉論！請着之玉版，藏之金匱，署曰《天元紀》。<目錄>卷第十九","bh":"","notes":[],"pending":true}]},
{"id":"sw67","book":"素问","no":67,"title":"五营运大论","titleTw":"五營運大論","tags":["bingji","yinyang","wuxing"],"brief":"","pending":true,"sections":[{"id":"sw67-1","tags":[],"yw":"黃帝坐明堂，始正天綱，臨觀八極，考建五常，請天師而問之曰∶論言天地之動靜，神明爲之紀，陰陽之升降，寒暑彰其兆。餘聞五運之數於夫子，夫子之所言，正五氣之各主歲爾，首甲定運，餘因論之。鬼臾區曰∶土主甲己，金主乙庚，水主丙辛，木主丁壬，火主戊癸。子午之上，少陰主之；丑未之上，太陰主之；寅申之上，少陽主之；卯酉之上，陽明主之；辰戌之上，太陽主之；巳亥之上，厥陰主之。不合陰陽，其故何也？岐伯曰∶是明道也，此天地之陰陽也。","bh":"","notes":[],"pending":true},{"id":"sw67-2","tags":[],"yw":"夫數之可數者，人中之陰陽也，然所合，數之可得者也。夫陰陽者，數之可十，推之可百，數之可千，推之可萬。天地陰陽者，不以數推以象之謂也。帝曰∶願聞其所始也。岐伯曰∶昭乎哉問也！臣覽《太始天元冊》文，丹天之氣經於牛女戊分，天之氣經於心尾己分，蒼天之氣經於危室柳鬼，素天之氣經於亢氐昴畢，玄天之氣經於張翼婁胃。所謂戊己分者，奎壁角軫，則天地之門戶也。夫候之所始，道之所生，不可不通也。帝曰∶善。論言天地者，萬物之上下，左右者，陰陽之道路，未知其所謂也。","bh":"","notes":[],"pending":true},{"id":"sw67-3","tags":[],"yw":"岐伯曰∶所謂上下者，歲上下見陰陽之所在也。左右者，諸上見厥陰，左少陰右太陽；見少陰，左太陰右厥陰；見太陰，左少陽右少陰；見少陽，左陽明右太陰；見陽明，左太陽右少陽；見太陽，左厥陰右陽明。所謂面北而命其位，言其見也。帝曰∶何謂下？岐伯曰∶厥陰在上則少陽在下，左陽明右太陰；少陰在上則陽明在下，左太陽右少陽；太陰在上則太陽在下，左厥陰右陽明；少陽在上則厥陰在下，左少陰右太陽；陽明在上則少陰在下，左太陰右厥陰；太陽在上則太陰在下，左少陽右少陰。","bh":"","notes":[],"pending":true},{"id":"sw67-4","tags":[],"yw":"所謂面南而命其位，言其見也。上下相遘，寒暑相臨，氣相得則和，不相得則病。帝曰∶氣相得而病者何也？岐伯曰∶以下臨上，不當位也。帝曰∶動靜何如？岐伯曰∶上者右行，下者左行，左右周天，餘而復會也。帝曰∶餘聞鬼臾區曰∶應地者靜。今夫子乃言下者左行，不知其所謂也，願聞何以生之乎？岐伯曰∶天地動靜，五行遷復，雖鬼臾區其上候而已，猶不能遍明。夫變化之用，天垂象，地成形，七曜緯虛，五行麗地。地者，所以載生成之形類也。","bh":"","notes":[],"pending":true},{"id":"sw67-5","tags":[],"yw":"虛者，所以列應天之精氣也。形精之動，猶根本之與枝葉也，仰觀其象，雖遠可知也。帝曰∶地之爲下否乎？岐伯曰∶地爲人之下，太虛之中者也。帝曰∶馮乎？岐伯曰∶大氣舉之也。燥以干之，暑以蒸之，風以動之，溼以潤之，寒以堅之，火以溫之。故風寒在下，燥熱在上，溼氣在中，火遊行其間，寒暑六入，故令虛而生化也。故燥勝則地干，暑勝則地熱，風勝則地動，溼勝則地泥，寒勝則地裂，火勝則地固矣。帝曰∶天地之氣，何以候之？岐伯曰∶天地之氣，勝復之作，不形於診也。","bh":"","notes":[],"pending":true},{"id":"sw67-6","tags":[],"yw":"《脈法》曰∶天地之變，無以脈診。此之謂也。帝曰∶間氣何如？岐伯曰∶隨氣所在，期於左右。帝曰∶期之奈何？岐伯曰∶從其氣則和，違其氣則病，不當其位者病，迭移其位者病，失守其位者危，尺寸反者死，陰陽交者死。先立其年，以知其氣，左右應見，然後乃可以言死生之逆順。帝曰∶寒暑燥溼風火，在人合之奈何？其於萬物何以生化？岐伯曰∶東方生風，風生木，木生酸，酸生肝，肝生筋，筋生心。其在天爲玄，在人爲道，在地爲化。化生五味，道生智，玄生神，化生氣。","bh":"","notes":[],"pending":true},{"id":"sw67-7","tags":[],"yw":"神在天爲風，在地爲木，在體爲筋，在氣爲柔，在髒爲肝。其性爲暄，其德爲和，其用爲動，其色爲蒼，其化爲榮，其蟲毛，其政爲散，其令宣發，其變摧拉，其眚爲隕，其味爲酸，其志爲怒。怒傷肝，悲勝怒；風傷肝，燥勝風；酸傷筋，辛勝酸。南方生熱，熱生火，火生苦，苦生心，心生血，血生脾。其在天爲熱，在地爲火，在體爲脈，在氣爲息，在髒爲心。其性爲暑，其德爲顯，其用爲躁，其色爲赤，其化爲茂，其蟲羽，其政爲明，其令鬱蒸，其變炎爍，其眚燔，其味爲苦，其志爲喜。","bh":"","notes":[],"pending":true},{"id":"sw67-8","tags":[],"yw":"喜傷心，恐勝喜；熱傷氣，寒勝熱；苦傷氣，鹹勝苦。中央生溼，溼生土，土生甘，甘生脾，脾生肉，肉生肺。其在天爲溼，在地爲土，在體爲肉，在氣爲充，在髒爲脾。其性靜兼，其德爲濡，其用爲化，其色爲黃，其化爲盈，其蟲，其政爲謐，其令雲雨，其變動注，其眚淫潰，其味爲甘，其志爲思。思傷脾，怒勝思；溼傷肉，風勝溼；甘傷脾，酸勝甘。西方生燥，燥生金，金生辛，辛生肺，肺生皮毛，皮毛生腎。其在天爲燥，在地爲金，在體爲皮毛，在氣爲成，在髒爲肺，其性爲涼，其德爲清，其用爲固，其色爲白，其化爲斂，其蟲介，其政爲勁，其令霧露，其變肅殺，其眚蒼落，其味爲辛，其志爲憂。","bh":"","notes":[],"pending":true},{"id":"sw67-9","tags":[],"yw":"憂傷肺，喜勝憂；熱傷皮毛，寒勝熱；辛傷皮毛，苦勝辛。北方生寒，寒生水，水生鹹，鹹生腎，腎生骨髓，髓生肝。其在天爲寒，在地爲水，在體爲骨，在氣爲堅，在髒爲腎。其性爲凜，其德爲寒，其用爲□，其色爲黑，其化爲肅，其蟲鱗，其政爲靜，其令□□，其變凝冽，其眚冰雹，其味爲鹹，其志爲恐。恐傷腎，思勝恐；寒傷血，燥勝寒；鹹傷血，甘勝鹹。五氣更立，各有所先，非其位則邪，當其位則正。帝曰∶病生之變何如？岐伯曰∶氣相得則微，不相得則甚。","bh":"","notes":[],"pending":true},{"id":"sw67-10","tags":[],"yw":"帝曰∶主歲何如？岐伯曰∶氣有餘，則制己所勝而侮所不勝；其不及，則己所不勝侮而乘之，己所勝輕而侮之。侮反受邪，侮而受邪，寡於畏也。帝曰∶善。<目錄>卷第十九","bh":"","notes":[],"pending":true}]},
{"id":"sw68","book":"素问","no":68,"title":"六微旨大论","titleTw":"六微旨大論","tags":["yunqi","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw68-1","tags":[],"yw":"黃帝問曰∶嗚呼遠哉！天之道也，如迎浮雲，若視深淵，視深淵尚可測，迎浮雲莫知其極。夫子數言謹奉天道，餘聞而藏之，心私異之，不知其所謂也。願夫子溢志盡言其事，令終不滅，久而不絕，天之道可得聞乎？岐伯稽首再拜對曰∶明乎哉問天之道也！此因天之序，盛衰之時也。帝曰∶願聞天道六六之節盛衰何也？岐伯曰∶上下有位，左右有紀。故少陽之右，陽明治之；陽明之右，太陽治之；太陽之右，厥陰治之；厥陰之右，少陰治之；少陰之右，太陰治之；太陰之右，少陽治之。","bh":"","notes":[],"pending":true},{"id":"sw68-2","tags":[],"yw":"此所謂氣之標，蓋南面而待也。故曰∶因天之序，盛衰之時，移光定位，正立而待之。此之謂也。少陽之上，火氣治之，中見厥陰；陽明之上，燥氣治之，中見太陰；太陽之上，寒氣治之，中見少陰；厥陰之上，風氣治之，中見少陽；少陰之上，熱氣治之，中見太陽；太陰之上，溼氣治之，中見陽明。所謂本也，本之下，中之見也，見之下，氣之標也，本標不同，氣應異象。帝曰∶其有至而至，有至而不至，有至而太過，何也？岐伯曰∶至而至者和；至而不至，來氣不及也；未至而至，來氣有餘也。","bh":"","notes":[],"pending":true},{"id":"sw68-3","tags":[],"yw":"帝曰∶至而不至，未至而至如何？岐伯曰∶應則順，否則逆，逆則變生，變則病。帝曰∶善。請言其應。岐伯曰∶物生其應也，氣脈其應也。帝曰∶善。願聞地理之應六節氣位何如？岐伯曰∶顯明之右，君火之位也；君火之右，退行一步，相火治之；復行一步，土氣治之；復行一步，金氣治之；復行一步，水氣治之；復行一步，木氣治之；復行一步，君火治之。相火之下，水氣承之；水位之下，土氣承之；土位之下，風氣承之；風位之下，金氣承之；金位之下，火氣承之；君火之下，陰精承之。","bh":"","notes":[],"pending":true},{"id":"sw68-4","tags":[],"yw":"帝曰∶何也？岐伯曰∶亢則害，承乃制，制則生化，外列盛衰，害則敗亂，生化大病。帝曰∶盛衰何如？岐伯曰∶非其位則邪，當其位則正，邪則變甚，正則微。帝曰∶何謂當位？岐伯曰∶木運臨卯，火運臨午，土運臨四季，金運臨酉，水運臨子，所謂歲會，氣之平也。帝曰∶非位何如？岐伯曰∶歲不與會也。帝曰∶土運之歲，上見太陰；火運之歲，上見少陽、少陰；金運之歲，上見陽明；木運之歲，上見厥陰；水運之歲，上見太陽，奈何？岐伯曰∶天之與會也。","bh":"","notes":[],"pending":true},{"id":"sw68-5","tags":[],"yw":"故《天元冊》曰天符。天符歲會何如？岐伯曰∶太一天符之會也。帝曰∶其貴賤何如？岐伯曰∶天符爲執法，歲位爲行令，太一天符爲貴人。帝曰∶邪之中也奈何？岐伯曰∶中執法者，其病速而危；中行令者，其病徐而持；中貴人者，其病暴而死。帝曰∶位之易也何如？岐伯曰∶君位臣則順，臣位君則逆。逆則其病近，其害速；順則其病遠，其害微。所謂二火也。帝曰∶善。願聞其步何如？岐伯曰∶所謂步者，六十度而有奇，故二十四步積盈百刻而成日也。","bh":"","notes":[],"pending":true},{"id":"sw68-6","tags":[],"yw":"帝曰∶六氣應五行之變何如？岐伯曰∶位有終始，氣有國中，上下不同，求之亦異也。帝曰∶求之奈何？岐伯曰∶天氣始於甲，地氣治於子，子甲相合，命曰歲立，謹候其時，氣可與期。帝曰∶願聞其歲，六氣始終，早晏何如？岐伯曰∶明乎哉問也！甲子之歲，初之氣，天數始於水下一刻，終於八十七刻半；二之氣，始於八十七刻六分，終於七十五刻；三之氣，始於七十六刻，終於六十二刻半；四之氣，始於六十二刻六分，終於五十刻；五之氣，始於五十一刻；終於三十七刻半；六之氣，始於三十七刻六分，終於二十五刻。","bh":"","notes":[],"pending":true},{"id":"sw68-7","tags":[],"yw":"所謂初六，天之數也。乙丑歲，初之氣，天數始於二十六刻，終於一十二刻半；二之氣，始於一十二刻六分，終於水下百刻；三之氣，始於一刻，終於八十七刻半；四之氣，始於八十七刻六分，終於七十五刻；五之氣，始於七十六刻，終於六十二刻半；六之氣，始於六十二刻六分，終於五十刻。所謂六二，天之數也。丙寅歲，初之氣，天數始於五十一刻，終於三十七刻半；二之氣，始於三十七刻六分，終於二十五刻；三之氣，始於二十六刻，終於一十二刻半；四之氣，始於一十二刻六分，終於水下百刻；五之氣，始於一刻，終於八十七刻半；六之氣，始於八十七刻六分，終於七十五刻。","bh":"","notes":[],"pending":true},{"id":"sw68-8","tags":[],"yw":"所謂六三，天之數也。丁卯歲，初之氣，天數始於七十六刻，終於六十二刻半；二之氣，始於六十二刻六分，終於五十刻；三之氣，始於五十一刻，終於三十七刻半；四之氣，始於三十七刻六分，終於二十五刻；五之氣，始於二十六刻，終於一十二刻半；六之氣，始於一十二刻六分，終於水下百刻。所謂六四，天之數也。次戊辰歲，初之氣，復始於一刻，常如是無已，周而復始。帝曰∶願聞其歲候何如？岐伯曰∶悉於哉問也！日行一周，天氣始於一刻，日行再周，天氣始於二十六刻，日行三周，天氣始於五十一刻，日行四周，天氣始於七十六刻，日行五周，天氣復始於一刻，所謂一紀也。","bh":"","notes":[],"pending":true},{"id":"sw68-9","tags":[],"yw":"是故寅午戌歲氣會同，卯未亥歲氣會同，辰申子歲氣會同，巳酉丑歲氣會同，終而復始。帝曰∶願聞其用也。岐伯曰，言天者求之本，言地者求之位，言人者求之氣交。帝曰∶何謂氣交？岐伯曰∶上下之位，氣交之中，人之居也。故曰∶天樞之上，天氣主之；天樞之下，地氣主之；氣交之分，人氣從之，萬物由之。此之謂也。帝曰∶何謂國中？岐伯曰∶初凡三十度而有奇，中氣同法。帝曰∶國中何也？岐伯曰∶所以分天地也。帝曰∶願卒聞之。岐伯曰∶初者地氣也，中者天氣也。","bh":"","notes":[],"pending":true},{"id":"sw68-10","tags":[],"yw":"帝曰∶其升降何如？岐伯曰∶氣之升降，天地之更用也。帝曰∶願聞其用何如？岐伯曰∶升已而降，降者謂天；降已而升，升者謂地。天氣下降，氣流於地；地氣上升，氣騰於天。故高下相召，升降相因，而變作矣。帝曰∶善。寒溼相遘，燥熱相臨，風火相值，其有間乎？岐伯曰∶氣有勝復，勝復之作，有德有化，有用有變，變則邪氣居之。帝曰∶何謂邪乎？岐伯曰∶夫物之生從於化，物之極由乎變，變化之相薄，成敗之所由也。故氣有往復，用有遲速，四者之有，而化而變，風之來也。","bh":"","notes":[],"pending":true},{"id":"sw68-11","tags":[],"yw":"帝曰∶遲速往復，風所由生，而化而變，故因盛衰之變耳。成敗倚伏遊乎中何也？岐伯曰∶成敗倚伏生乎動，動而不已，則變作矣。帝曰∶有期乎？岐伯曰∶不生不化，靜之期也。帝曰∶不生化乎？岐伯曰∶出入廢則神機化滅，升降息則氣立孤危。故非出入，則無以生長壯老已；非升降，則無以生長化收藏。是以升降出入，無器不有。故器者生化之宇，器散則分之，生化息矣。故無不出入，無不升降。化有小大，期有近遠，四者之有，而貴常守，反常則災害至矣。","bh":"","notes":[],"pending":true},{"id":"sw68-12","tags":[],"yw":"故曰∶無形無患。此之謂也。帝曰∶善。有不生不化乎？岐伯曰∶悉乎哉問也！與道協議，惟真人也。帝曰∶善。天元紀大論∶鐫（子泉切）五營運大論∶憑（扶冰切）礙（音艾）（音畫）眚（所景切）（音）（慈濫切）溽（音辱）（音今）（音括）疚（音救）六微旨大論∶霪（音淫）（音注）涸（胡各切）（音祁）埏（式連切）<目錄>卷第二十","bh":"","notes":[],"pending":true}]},
{"id":"sw69","book":"素问","no":69,"title":"气交变大论","titleTw":"氣交變大論","tags":["yunqi","bingji","yinyang"],"brief":"","pending":true,"sections":[{"id":"sw69-1","tags":[],"yw":"黃帝問曰∶五運更治，上應天期，陰陽往復，寒暑迎隨，真邪相薄，內外分離，六經波蕩，五氣傾移，太過過不及，專勝兼並，願言其始，而有常名，可得聞乎？岐伯稽首再拜對曰∶昭乎哉問也！是明道也。此上帝所貴，先師傳之，臣雖不敏，往聞其旨。帝曰∶餘聞得其人不教，是謂失道，傳非其人，慢泄天寶。餘誠菲德，未足以受至道；然而衆子哀其不終，願夫子保於無窮，流於無極，餘司其事，則而行之奈何？岐伯曰∶請遂言之也。《上經》曰∶夫道者，上知天文，下知地理，中知人事，可以長久。","bh":"","notes":[],"pending":true},{"id":"sw69-2","tags":[],"yw":"此之謂也。帝曰∶何謂也？岐伯曰∶本氣位也。位天者，天文也。位地者，地理也。通於人氣之變化者，人事也。故太過者先天，不及者後天，所謂治化而人應之也。帝曰∶五運之化，太過何如？岐伯曰∶歲木太過，風氣流行，脾土受邪。民病飧泄食減，體重煩冤，腸鳴腹支滿，上應歲星。甚則忽忽善怒，眩冒巔疾。化氣不政，生氣獨治，雲物飛動，草木不寧，甚而搖落，反脅痛而吐甚，衝陽絕者死不治，上應太白星。歲火太過，炎暑流行，肺金受邪。","bh":"","notes":[],"pending":true},{"id":"sw69-3","tags":[],"yw":"民病瘧，少氣咳喘，血溢血泄注下，嗌燥耳聾，中熱肩背熱，上應熒惑星。甚則胸中痛，脅支滿脅痛，膺背肩胛間痛，兩臂內痛，身熱骨痛而爲浸淫。收氣不行，長氣獨明，雨水霜寒，上應辰星。上臨少陰少陽，火燔，水泉涸，物焦槁，病反譫妄狂越，咳喘息鳴，下甚血溢泄不已，太淵絕者死不治，上應熒惑星。歲土太過，雨溼流行，腎水受邪。民病腹痛，清厥意不樂，體重煩冤，上應鎮星。甚則肌肉萎，足痿不收，行善，腳下痛，飲發中滿食減，四肢不舉。","bh":"","notes":[],"pending":true},{"id":"sw69-4","tags":[],"yw":"變生得位，髒氣伏，化氣獨治之，泉湧河衍，涸澤生魚，風雨大至，土崩潰，鱗見於陸，病腹滿溏泄腸鳴，反下甚而太溪絕者死不治，上應歲星。歲金太過，燥氣流行，肝木受邪。民病兩脅下少腹痛，目赤痛瘍，耳無所聞。肅殺而甚，則體重煩冤，胸痛引背，兩脅滿且痛引少腹，上應太白星。甚則喘咳逆氣，肩背痛，尻陰股膝髀足皆病，上應熒惑星。收氣峻，生氣下，草木斂，蒼干雕隕，病反暴痛，脅不可反側，咳逆甚而血溢，太衝絕者死不治，上應太白星。","bh":"","notes":[],"pending":true},{"id":"sw69-5","tags":[],"yw":"歲水太過，寒氣流行，邪害心火。民病身熱煩心躁悸，陰厥上下中寒，譫妄心痛，寒氣早至，上應辰星。甚則腹大脛腫，喘咳，寢汗出憎風，大雨至，埃霧朦鬱，上應鎮星。上臨太陽，則雨冰雪，霜不時降，溼氣變物，病反腹滿腸鳴，溏泄食不化，渴而妄冒，神門絕者死不治，上應熒惑、辰星。帝曰∶善。其不及何如？岐伯曰∶悉乎哉問也！歲木不及，燥乃大行，生氣失應，草木晚榮，肅殺而甚，則剛木辟着，柔萎蒼干，上應太白星，民病中清，脅痛，少腹痛，腸鳴溏泄，涼雨時至，上應太白星，其谷蒼。","bh":"","notes":[],"pending":true},{"id":"sw69-6","tags":[],"yw":"上臨陽明，生氣失政，草木再榮，化氣乃急，上應太白、鎮星，其主蒼早。復則炎暑流火，溼性燥，柔脆草木焦槁，下體再生，華實齊化，病寒熱瘡瘍胗癰痤，上應熒惑、太白，其谷白堅。白露早降，收殺氣行，寒雨害物，蟲食甘黃，脾土受邪，赤氣後化，心氣晚治，上勝肺金，白氣乃屈，其谷不成，咳而鼽，上應熒惑、太白星。歲火不及，寒乃大行，長政不用，物榮而下，凝慘而甚，則陽氣不化，乃折榮美，上應辰星，民病胸中痛，脅支滿，兩脅痛，膺背肩胛間及兩臂內痛，鬱冒朦昧，心痛暴喑，胸腹大，脅下與腰背相引而痛，甚則屈不能伸，髖髀如別，上應熒惑、辰星，其谷丹。","bh":"","notes":[],"pending":true},{"id":"sw69-7","tags":[],"yw":"復則埃鬱，大雨且至，黑氣乃辱，病溏腹滿，食飲不下，寒中腸鳴，泄注腹痛，暴攣痿痹，足不任身，上應鎮星、辰星，玄谷不成。歲土不及，風乃大行，化氣不令，草木茂榮，飄揚而甚，秀而不實，上應歲星，民病飧泄霍亂，體重腹痛，筋骨繇復，肌肉酸，善怒，髒氣舉事，蟄蟲早附，鹹病寒中，上應歲星、鎮星，其谷。復則收政嚴峻，名木蒼雕，胸脅暴痛，下引少腹，善大息，蟲食甘黃，氣客於脾，谷乃減，民食少失味，蒼谷乃損，上應太白、歲星。","bh":"","notes":[],"pending":true},{"id":"sw69-8","tags":[],"yw":"上臨厥陰，流水不冰，蟄蟲來見，髒氣不用，白乃不復，上應歲星，民乃康。歲金不及，炎火乃行，生氣乃用，長氣專勝，庶物以茂，燥爍以行，上應熒惑星，民病肩背瞀重，鼽嚏血便注下，收氣乃後，上應太白星，其谷堅芒。復則寒雨暴至，乃零冰雹霜雪殺物，陰厥且格，陽反上行，頭腦戶痛，延及囟頂發熱，上應辰星，丹谷不成，民病口瘡，甚則心痛。歲水不及，溼乃大行，長氣反用，其化乃速，暑雨數至，上應鎮星，民病腹滿身重，濡泄寒瘍流水，腰股痛發，股膝不便，煩冤足痿清厥，腳下痛，甚則跗腫，髒氣不政，腎氣不衡，上應辰星，其谷。","bh":"","notes":[],"pending":true},{"id":"sw69-9","tags":[],"yw":"上臨太陰，則大寒數舉，蟄蟲早藏，地積堅冰，陽光不治，民病寒疾於下，甚則腹滿浮腫，上應鎮星，其主谷。復則大風暴發，草偃木零，生長不鮮，面色時變，筋骨並辟，肉螈，目視KTKT，物疏璺，肌肉胗發，氣並膈中，痛於心腹，黃氣乃損，其谷不登，上應歲星。帝曰∶善。願聞其時也。岐伯曰∶悉哉問也！木不及，春有鳴條律暢之化，則秋有霧露清涼之政，春有慘悽殘賊之勝，則夏有炎暑燔爍之復，其眚東，其髒肝，其病內舍脅，外在關節。","bh":"","notes":[],"pending":true},{"id":"sw69-10","tags":[],"yw":"火不及，夏有炳明光顯之化，則冬有嚴肅霜寒之政，夏有慘悽凝冽之勝，則不時有埃昏大雨之復，其眚南，其髒心，其病內舍膺脅，外在經絡。土不及，四維有埃雲潤澤之化，則春有鳴條鼓拆之政，四維發振拉飄騰之變，則秋有肅殺霖霪之復，其眚四維，其髒脾，其病內舍心腹，外在肌肉四肢。金不及，夏有光顯鬱蒸之令，則冬有嚴凝整肅之應，夏有炎爍燔燎之變，則秋有冰雹霜雪之復，其眚西，其髒肺，其病內舍膺脅肩背，外在皮毛。水不及，四維有湍潤埃雲之化，則不時有和風生發之應，四維發埃昏驟注之變，則不時有瓢蕩振拉之復，其眚北，其髒腎，其病內舍腰脊骨髓，外在溪谷膝。","bh":"","notes":[],"pending":true},{"id":"sw69-11","tags":[],"yw":"夫五運之政，猶權衡也，高者抑之，下者舉之，化者應之，變者復之，此生長化成收藏之理，氣之常也，失常則天地四塞矣。故曰∶天地之動靜，神明爲之紀，陰陽之往復，寒暑彰其兆。此之謂也。帝曰∶夫子之言五氣之變，四時之應，可謂悉矣。夫氣之動亂，觸遇而作，發無常會，卒然災合，何以期之？岐伯曰∶夫氣之動變，固不常在，而德化政令災變，不同其候也。帝曰∶何謂也？岐伯曰∶東方生風，風生木，其德敷和，其化生榮，其政舒啓，其令風，其變振發，其災散落。","bh":"","notes":[],"pending":true},{"id":"sw69-12","tags":[],"yw":"南方生熱，熱生火，其德彰顯，其化蕃茂，其政明曜，其令熱，其變銷爍，其災燔。中央生溼，溼生土，其德溽蒸，其化豐備，其政安靜，其令溼，其變驟注，其災霖潰。西方生燥，燥生金，其德清潔，其化緊斂，其政勁切，其令燥，其變肅殺，其災蒼隕。北方生寒，寒生水，其德悽滄，其化清謐，其政凝肅，其令寒，其變冽，其災冰雪霜雹。是以察其動也，有德有化，有政有令，有變有災，而物由之，而人應之也。帝曰∶夫子之言歲候，其不及太過，而上應五星。","bh":"","notes":[],"pending":true},{"id":"sw69-13","tags":[],"yw":"今夫德化政令，災眚變易，非常而有也，卒然而動，其亦爲之變乎。岐伯曰∶承天而行之，故無妄動，無不應也。卒然而動者，氣之交變也，其不應焉。故曰∶應常不應卒。此之謂也。帝曰∶其應奈何？岐伯曰∶各從其氣化也。帝曰∶其行之徐疾逆順何如？岐伯曰∶以道留久，逆守而小，是謂省下。以道而去，去而速來，曲而過之，是謂省遺過也。久留而環，或離或附，是謂議災與其德也。應近則小，應遠則大。芒而大倍常之一，其化甚；大常之二，其眚即發也。","bh":"","notes":[],"pending":true},{"id":"sw69-14","tags":[],"yw":"小常之一，其化減；小常之二，是謂臨視，省下之過與其德也。德者福之，過者伐之。是以象之見也，高而遠則小，下而近則大，故大則喜怒邇，小則禍福遠。歲運太過，則運星北越，運氣相得，則各行以道。故歲運太過，畏星失色而兼其母，不及，則色兼其所不勝。肖者瞿瞿，莫知其妙，閔閔之當，孰者爲良，妄行無徵，示畏侯王。帝曰∶其災應何如？岐伯曰∶亦各從其化也，故時至有盛衰，凌犯有逆順，留守有多少，形見有善惡，宿屬有勝負，徵應有吉兇矣。","bh":"","notes":[],"pending":true},{"id":"sw69-15","tags":[],"yw":"帝曰∶其善惡何謂也？岐伯曰∶有喜有怒，有憂有喪，有澤有燥，此象之常也，必謹察之。帝曰∶六者高下異乎？岐伯曰∶象見高下，其應一也，故人亦應之。帝曰∶善。其德化政令之動靜損益皆何如？岐伯曰∶夫德化政令災變，不能相加也。勝復盛衰，不能相多也。往來小大，不能相過也。用之升降，不能相無也。各從其動而復之耳。帝曰∶其病生何如？岐伯曰∶德化者氣之祥，政令者氣之章，變易者復之紀，災眚者傷之始，氣相勝者和，不相勝者病，重感於邪則甚也。","bh":"","notes":[],"pending":true},{"id":"sw69-16","tags":[],"yw":"帝曰∶善。所謂精光之論，大聖之業，宣明大道，通於無窮，究於無極也。餘聞之，善言天者，必應於人，善言古者，必驗於今，善言氣者，必彰於物，善言應者，同天地之化，善言化言變者，通神明之理，非夫子孰能言至道歟！乃擇良兆而藏之靈室，每旦讀之，命曰《氣交變》，非齋戒不敢發，慎傳也。<目錄>卷第二十","bh":"","notes":[],"pending":true}]},
{"id":"sw70","book":"素问","no":70,"title":"五常政大论","titleTw":"五常政大論","tags":["yunqi","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw70-1","tags":[],"yw":"黃帝問曰∶太虛寥廓，五運回薄，衰盛不同，損益相從，願聞平氣何如而名？何如而紀也？岐伯對曰∶昭乎哉問也！木曰敷和，火曰升明，土曰備化，金曰審平，水曰靜順。帝曰∶其不及奈何？岐伯曰∶木曰委和，火曰伏明，土曰卑監，金曰從革，水曰涸流。帝曰∶太過何謂？岐伯曰∶木曰發生，火曰赫曦，土曰敦阜，金曰堅成，水曰流衍。帝曰∶三氣之紀，願聞其候。岐伯曰∶悉乎哉問也！敷和之紀，木德周行，陽舒陰布，五化宣平，其氣端，其性隨，其用曲直，其化生榮，其類草木，其政發散，其候溫和，其令風，其髒肝，肝其畏清，其主目，其谷麻，其果李，其實核，其應春，其蟲毛，其畜犬，其色蒼，其養筋，其病裏急支滿，其味酸，其音角，其物中堅，其數八。","bh":"","notes":[],"pending":true},{"id":"sw70-2","tags":[],"yw":"升明之紀，正陽而治，德施周普，五化均衡，其氣高，其性速，其用燔灼，其化蕃茂，其類火，其政明曜，其候炎暑，其令熱，其髒心，心其畏寒，其主舌，其谷麥，其果杏，其實絡，其應夏，其蟲羽，其畜馬，其色赤，其養血，其病螈，其味苦，其音徵，其物脈，其數七。備化之紀，氣協天休，德流四政，五化齊修，其氣平，其性順，其用高下，其化豐滿，其類土，其政安靜，其候溽蒸，其令溼，其髒脾，脾其畏風，其主口，其谷稷，其果棗，其實肉，其應長夏，其蟲，其畜牛，其色黃，其養肉，其病痞，其味甘，其音宮，其物膚，其數五。","bh":"","notes":[],"pending":true},{"id":"sw70-3","tags":[],"yw":"審平之紀，收而不爭，殺而無犯，五化宣明，其氣潔，其性剛，其用散落，其化堅斂，其類金，其政勁肅，其候清切，其令燥，其髒肺，肺其畏熱，其主鼻，其谷稻，其果桃，其實殼，其應秋，其蟲介，其畜雞，其色白，其養皮毛，其病咳，其味辛，其音商，其物外堅，其數九。靜順之紀，藏而勿害，治而善下，五化鹹整，其氣明，其性下，其用沃衍，其化凝堅，其類水，其政流演，其候凝肅，其令寒，其髒腎，腎其畏溼，其主二陰，其谷豆，其果慄，其實濡，其應冬，其蟲鱗，其畜彘，其色黑，其養骨髓，其病厥，其味鹹，其音羽，其物濡，其數六。","bh":"","notes":[],"pending":true},{"id":"sw70-4","tags":[],"yw":"故生而勿殺，長而勿罰，化而勿制，收而勿害，藏而勿抑，是謂平氣。委和之紀，是謂勝生，生氣不政，化氣乃揚，長氣自平，收令乃早，涼雨時降，風雲並興，草木晚榮，蒼干雕落，物秀而實，膚肉內充，其氣斂，其用聚，其動戾拘緩，其發驚駭，其髒肝，其果棗李，其實核殼，其谷稷稻，其味酸辛，其色白蒼，其畜犬雞，其蟲毛介，其主霧露悽滄，其聲角商，其病搖動注恐，從金化也，少角與判商同，上角與正角同，上商與正商同，其病肢廢癰腫瘡瘍，其甘蟲，邪傷肝也，上宮與正宮同，蕭肅殺則炎赫沸騰，眚於三，所謂復也，其主飛蠹蛆雉，乃爲雷霆。","bh":"","notes":[],"pending":true},{"id":"sw70-5","tags":[],"yw":"伏明之紀，是謂勝長，長氣不宣，髒氣反布，收氣自政，化令乃衡，寒清數舉，暑令乃薄，承化物生，生而不長，成實而稚，遇化已老，陽氣屈伏，蟄蟲早藏，其氣鬱，其用暴，其動彰伏變易，其發痛，其髒心，其果慄桃，其實絡濡，其谷豆稻，其味苦鹹，其色玄丹，其畜馬彘，其蟲羽鱗，其主冰雪霜寒，其聲徵羽，其病昏惑悲忘，從水化也，少徵與少羽同，上商與正商同，邪傷心也，凝慘凜冽則豪雨霖霪，眚於九，其主驟注雷霆震驚，沉淫雨。卑監之紀，是謂減化，化氣不令，生政獨彰，長氣整，雨乃愆，收氣平，風寒並興，草木榮美，秀而不實，成而秕也，其氣散，其用靜定，其動瘍湧分潰癰腫，其發濡滯，其髒脾，其果李慄，其實濡核，其谷豆麻，其味酸甘，其色蒼黃，其畜牛犬，其蟲毛，其主飄怒振發，其聲宮角，其病留滿痞塞，從木化也，少宮與少角同，上宮與正宮同，上角與正角同，其病飧泄，邪傷脾也，振拉飄揚則蒼干散落，其眚四維，其主敗折虎野狼，清氣乃用，生政乃辱。","bh":"","notes":[],"pending":true},{"id":"sw70-6","tags":[],"yw":"從革之紀，是謂折收，收氣乃後，生氣乃揚，長化合德，火政乃宣，庶類以蕃，其氣揚，其用躁切，其動鏗禁瞀厥，其發咳喘，其髒肺，其果李杏，其實殼絡，其谷麻麥，其味苦辛，其色白丹，其畜雞羊，其蟲介羽，其主明曜炎爍，其聲商徵，其病嚏咳鼽衄，從火化也，少商與少徵同，上商與正商同，上角與正角同，邪傷肺也，炎光赫烈則冰雪霜雹，眚於七，其主鱗伏彘鼠，歲氣早至，乃生大寒。涸流之紀，是謂反陽，藏令不舉，化氣乃昌，長氣宣布，蟄蟲不藏，土潤水泉減，草木條茂，榮秀滿盛，其氣滯，其用滲泄，其動堅止，其發燥槁，其髒腎，其果棗杏，其實濡肉，其谷黍稷，其味甘鹹，其色玄，其畜彘牛，其蟲鱗，其主埃鬱昏翳，其聲羽宮，其病痿厥堅下，從土化也，少羽與少宮同，上宮與正宮同，其病癃，邪傷腎也，埃昏驟雨則振拉摧拔，眚於一，其主毛顯狐，變化不藏。","bh":"","notes":[],"pending":true},{"id":"sw70-7","tags":[],"yw":"故乘危而行，不速而至，炎威無德，災反及之，微者復微，甚者復甚，氣之常也。發生之紀，是謂啓陳，土疏泄，蒼氣達，陽和布化，陰氣乃隨，生氣淳化，萬物以榮，其化生，其氣美，其政散，其令條舒，其動掉眩巔疾，其德鳴靡啓坼，其變振拉摧拔，其谷麻稻，其畜雞犬，其果李桃，其色青黃白，其味酸甘辛，其象春，其經足厥陰少陽，其髒肝脾，其蟲毛介，其物中堅外堅，其病怒，太角與上商同，上徵則其氣逆，其病吐利，不務其德則收氣復，秋氣勁切，甚則肅殺，清氣大至，草木雕零，邪乃傷肝。","bh":"","notes":[],"pending":true},{"id":"sw70-8","tags":[],"yw":"赫曦之紀，是謂蕃茂，陰氣內化，陽氣外榮，炎暑施化，物得以昌，其化長，其氣高，其政動，其令鳴顯，其動炎灼妄擾，其德暄暑鬱蒸，其變炎烈沸騰，其谷麥豆，其畜羊彘，其果杏慄，其色赤白玄，其味苦辛鹹，其象夏，其經手少陰太陽，手厥陰少陽，其髒心肺，其蟲羽鱗，其物脈濡，其病笑瘧瘡瘍血流狂妄目赤，上羽與正徵同，其收齊，其病，上徵而收氣後也，暴烈其政，髒氣乃復，時見凝慘，甚則雨水霜雹切寒，邪傷心也。敦阜之紀，是謂廣化，濃德清靜，順長以盈，至陰內實，物化充成，煙埃朦鬱，見於濃土，大雨時行，溼氣乃用，燥政乃辟，其化圓，其氣豐，其政靜，其令周備，其動濡積並，其德柔潤重淖，其變震驚飄驟崩潰，其谷稷麻，其畜牛犬，其果棗李，其色玄蒼，其味甘鹹酸，其象長夏，其經足太陰陽明，其髒脾腎，其蟲毛，其物肌核，其病腹滿四肢不舉，大風迅至，邪傷脾也。","bh":"","notes":[],"pending":true},{"id":"sw70-9","tags":[],"yw":"堅成之紀，是謂收引，天氣潔，地氣明，陽氣隨，陰治化，燥行其政，物以司成，收氣繁布，化洽不終，其化成，其氣削，其政肅，其令銳切，其動暴折瘍疰，其德霧露蕭，其變肅殺雕零，其谷稻黍，其畜雞馬，其果桃杏，其色白青丹，其味辛酸苦，其象秋，其經手太陰陽明，其髒肺肝，其蟲介羽，其物殼絡，其病喘喝胸憑仰息，上徵與正商同，其生齊，其病咳，政暴變則名木不榮，柔脆焦首，長氣斯救，大火流，炎爍且至，蔓將槁，邪傷肺也。流衍之紀，是謂封藏，寒司物化，天地嚴凝，藏政以布，長令不揚，其化凜，其氣堅，其政謐，其令流注，其動漂泄沃湧，其德凝慘寒，其變冰雪霜雹，其谷豆稷，其畜彘牛，其果慄棗，其色黑丹，其味鹹苦甘，其象冬，其經足少陰太陽，其髒腎心，其蟲鱗，其物濡滿，其病脹，上羽而長氣不化也。","bh":"","notes":[],"pending":true},{"id":"sw70-10","tags":[],"yw":"政過則化氣大舉，而埃昏氣交，大雨時降，邪傷腎也。故曰∶不恆其德，則所勝來復，政恆其理，則所勝同化。此之謂也。帝曰∶天不足西北，左寒而右涼，地不滿東南，右熱而左溫，其故何也？岐伯曰∶陰陽之氣，高下之理，太少之異也。東南方，陽也，陽者其精降於下，故右熱而左溫。西北方，陰也，陰者其精奉於上，故左寒而右涼。是以地有高下，氣有溫涼，高者氣寒，下者氣熱，故適寒涼者脹，之溫熱者瘡，下之則脹已，汗之則瘡已，此腠理開閉之常，太少之異耳。","bh":"","notes":[],"pending":true},{"id":"sw70-11","tags":[],"yw":"帝曰∶其於壽夭何如？岐伯曰∶陰精所奉其人壽，陽精所降其人夭。帝曰∶善。其病也，治之奈何？岐伯曰∶西北之氣散而寒之，東南之氣收而溫之，所謂同病異治也。故曰∶氣寒氣涼，治以寒涼，行水漬之。氣溫氣熱，治以溫熱，強其內守。必同其氣，可使平也，假者反之。帝曰∶善。一州之氣，生化壽夭不同，其故何也？岐伯曰∶高下之理，地勢使然也。崇高則陰氣治之，污下則陽氣治之，陽勝者先天，陰勝者後天，此地理之常，生化之道也。帝曰∶其有壽夭乎？岐伯曰∶高者其氣壽，下者其氣夭，地之小大異也，小者小異，大者大異。","bh":"","notes":[],"pending":true},{"id":"sw70-12","tags":[],"yw":"故治病者，必明天道地理，陰陽更勝，氣之先後，人之壽夭，生化之期，乃可以知人之形氣矣。帝曰∶善。其歲有不病，而髒氣不應不用者何也？岐伯曰∶天氣制之，氣有所從也。帝曰∶願卒聞之。岐伯曰∶少陽司天，火氣下臨，肺氣上從，白起金用，草木眚，火見燔，革金且耗，大暑以行，咳嚏鼽衄鼻窒，曰瘍，寒熱腫。風行於地，塵沙飛揚，心痛胃脘痛，厥逆膈不通，其主暴速。陽明司天，燥氣下臨，肝氣上從，蒼起木用而立，土乃眚，悽滄數至，木伐草萎，脅痛目赤，掉振鼓慄，筋痿不能久立。","bh":"","notes":[],"pending":true},{"id":"sw70-13","tags":[],"yw":"暴熱至，土乃暑，陽氣鬱發，小便變，寒熱如瘧，甚則心痛，火行於稿，流水不冰，蟄蟲乃見。太陽司天，寒氣下臨，心氣上從，而火且明，丹起金乃眚，寒清時舉，勝則水冰，火氣高明，心熱煩，嗌干善渴，鼽嚏，喜悲數欠，熱氣妄行，寒乃復，霜不時降，善忘，甚則心痛。土乃潤，水豐衍，寒客至，沉陰化，溼氣變物，水飲內，中滿不食，皮肉苛，筋脈不利，甚則腫身後癰。厥陰司天，風氣下臨，脾氣上從，而土且隆，黃起水乃眚，土用革，體重肌肉萎，食減口爽，風行太虛，雲物搖動，目轉耳鳴。","bh":"","notes":[],"pending":true},{"id":"sw70-14","tags":[],"yw":"火縱其暴，地乃暑，大熱消爍，赤沃下，蟄蟲數見，流水不冰，其發機速。少陰司天，熱氣下臨，肺氣上從，白起金用，草木眚，喘嘔寒熱，嚏鼽衄鼻窒，大暑流行，甚則瘡瘍燔灼，金爍石流。地乃燥清，悽滄數至，脅痛善太息，肅殺行，草木變。太陰司天，溼氣下臨，腎氣上從，黑起水變，埃冒雲雨，胸中不利，陰痿氣大衰而不起不用。當其時反腰痛，動轉不便也，厥逆。地乃藏陰，大寒且至，蟄蟲早附，心下痞痛，地裂冰堅，少腹痛，時害於食，乘金則止水增，味乃鹹，行水減也。","bh":"","notes":[],"pending":true},{"id":"sw70-15","tags":[],"yw":"帝曰∶歲有胎孕不育，治之不全，何氣使然？岐伯曰∶六氣五類，有相勝制也，同者盛之，異者衰之，此天地之道，生化之常也。故厥陰司天，毛蟲靜，羽蟲育，介蟲不成；在泉，毛蟲育，蟲耗，羽蟲不育。少陰司天，羽蟲靜，介蟲育，毛蟲不成；在泉，羽蟲育，介蟲耗不育。太陰司天，蟲靜，鱗蟲育，羽蟲不成；在泉，蟲育，鱗蟲不成。少陽司天，羽蟲靜，毛蟲育，蟲不成；在泉，羽蟲育，介蟲耗，毛蟲不育。陽明司天，介蟲靜，羽蟲育，介蟲不成；在泉，介蟲育，毛蟲耗，羽蟲不成。","bh":"","notes":[],"pending":true},{"id":"sw70-16","tags":[],"yw":"太陽司天，鱗蟲靜，蟲育；在泉，鱗蟲耗，蟲不育。諸乘所不成之運，則甚也。故氣主有所制，歲立有所生，地氣制己勝，天氣制勝己，天制色，地制形，五類衰盛，各隨其氣之所宜也。故有胎孕不育，治之不全，此氣之常也，所謂中根也。根於外者亦五，故生化之別，有五氣五味五色五類五宜也。帝曰∶何謂也？岐伯曰∶根於中者，命曰神機，神去則機息。根於外者，命曰氣立，氣止則化絕。故各有制，各有勝，各有生，各有成。故曰∶不知年之所加，氣之同異，不足以言生化。","bh":"","notes":[],"pending":true},{"id":"sw70-17","tags":[],"yw":"此之謂也。帝曰∶氣始而生化，氣散而有形，氣布而蕃育，氣終而象變，其致一也。然而五味所資，生化有薄濃，成熟有少多，終始不同，其故何也？岐伯曰∶地氣制之也，非天不生，地不長也。帝曰∶願聞其道。岐伯曰∶寒熱燥溼，不同其化也。故少陽在泉，寒毒不生，其味辛，其治苦酸，其谷蒼丹。陽明在泉，溼毒不生，其味酸，其氣溼，其治辛苦甘，其谷丹素。太陽在泉，熱毒不生，其味苦，其治淡鹹，其谷。厥陰在泉，清毒不生，其味甘，其治酸苦，其谷蒼赤，其氣專，其味正。","bh":"","notes":[],"pending":true},{"id":"sw70-18","tags":[],"yw":"少陰在泉，寒毒不生，其味辛，其治辛苦甘，其谷白丹。太陰在泉，燥毒不生，其味鹹，其氣熱，其治甘鹹，其谷。化淳則鹹守，氣專則辛化而俱治。故曰∶補上下者從之，治上下者逆之，以所在寒熱盛衰而調之。故曰∶上取下取，內取外取，以求其過。能毒者以濃藥，不勝毒者以薄藥。此之謂也。氣反者，病在上，取之下；病在下，取之上；病在中，旁取之。治熱以寒，溫而行之；治寒以熱，涼而行之；治溫以清，冷而行之；治清以溫，熱而行之。","bh":"","notes":[],"pending":true},{"id":"sw70-19","tags":[],"yw":"故消之削之，吐之下之，補之瀉之，久新同法。帝曰∶病在中而不實不堅，且聚且散，奈何？岐伯曰∶悉乎哉問也！無積者求其藏，虛則補之，藥以祛之，食以隨之，行水漬之，和其中外，可使畢已。帝曰∶有毒無毒，服有約乎？岐伯曰∶病有久新，方有大小，有毒無毒，固宜常制矣。大毒治病，十去其六，常毒治病，十去其七，小毒治病，十去其八，無毒治病，十去其九，谷肉果菜，食養盡之，無使過之，傷其正也。不盡，行復如法，必先歲氣，無伐天和，無盛盛，無虛虛，而遺人天殃，無致邪，無失正，絕人長命。","bh":"","notes":[],"pending":true},{"id":"sw70-20","tags":[],"yw":"帝曰∶其久病者，有氣從不康，病去而瘠，奈何？岐伯曰∶昭乎哉聖人之問也！化不可代，時不可違。夫經絡以通，血氣以從，復其不足，與衆齊同，養之和之，靜以待時，謹守其氣，無使傾移，其形乃彰，生氣以長，命曰聖王。故大要曰∶無代化，無違時，必養必和，待其來復。此之謂也。帝曰∶善。氣交變大論∶槁（苦老切）瞼（音檢）HT（音接）蠹（音）（音木）璺（音問）謐（音蜜）五常政大論∶（如勻切）（妻徑切）（音瑟）（音今）麂（音幾）鏗（音坑）瞀（音冒）拉（音蠟）（他端切）磧（妻力切）（音列）<目錄>卷第二十一","bh":"","notes":[],"pending":true}]},
{"id":"sw71","book":"素问","no":71,"title":"六元正纪大论","titleTw":"六元正紀大論","tags":["yunqi","bingji","yinyang"],"brief":"","pending":true,"sections":[{"id":"sw71-1","tags":[],"yw":"黃帝問曰∶六化六變，勝復淫治，甘苦辛鹹酸淡先後，餘知之矣。夫五運之化，或從五氣，或逆天氣，或從天氣而逆地氣，或從地氣而逆天氣，或相得，或不相得，餘未能明其事。欲通天之紀，從地之理，和其運，調其化，使上下合德，無相奪倫，天地升降，不失其宜，五運宣行，勿乖其政，調之正味，從逆奈何？岐伯稽首再拜對曰∶昭乎哉問也，此天地之綱紀，變化之淵源，非聖帝孰能窮其至理歟！臣雖不敏，請陳其道，令終不滅，久而不易。帝曰∶願夫子推而次之，從其類序，分其部主，別其宗司，昭其氣數，明其正化，可得聞乎？岐伯曰∶先立其年以明其氣，金木水火土營運之數，寒暑燥溼風火臨御之化，則天道可見，民氣可調，陰陽卷舒，近而無惑，數之可數者，請遂言之。","bh":"","notes":[],"pending":true},{"id":"sw71-2","tags":[],"yw":"帝曰∶太陽之政奈何？岐伯曰∶辰戌之紀也。太陽太角太陰壬辰壬戌其運風，其化鳴紊啓拆，其變振拉摧拔，其病眩掉目瞑。太角（初正）少徵太宮少商太羽（終）太陽太徵太陰戊辰戊戌同正。其運熱，其化暄暑鬱燠，其變炎烈沸騰，其病熱鬱。太徵少宮太商少羽（終）少角（初）太陽太宮太陰甲辰歲會（同天符）甲戌歲會（同天符）其運陰埃，其化柔潤重澤，其變震驚飄驟，其病溼下重。太宮少商太羽（終）太角（初）少徵太陽太商太陰庚辰庚戌其運涼，其化霧露蕭，其變肅殺雕零，其病燥背瞀胸滿。","bh":"","notes":[],"pending":true},{"id":"sw71-3","tags":[],"yw":"太商少羽（終）少角（初）太徵少宮太陽太羽太陰丙辰天符丙戌天符。其運寒，其化凝慘冽，其變冰雪霜雹，其病大寒留於溪谷。太羽（終）太角（初）少徵太宮少商凡此太陽司天之政，氣化營運先天，天氣肅，地氣靜，寒臨太虛，陽氣不令，水土合德，上應辰星鎮星。其谷玄。其政肅，其令徐。寒政大舉，澤無陽焰，則火發待時。少陽中治，時雨乃涯，止極雨散，還於太陰，雲朝北極，溼化乃布，澤流萬物，寒敷於上，雷動於下，寒溼之氣，持於氣交。","bh":"","notes":[],"pending":true},{"id":"sw71-4","tags":[],"yw":"民病寒溼，發肌肉萎，足痿不收，濡瀉血溢。初之氣，地氣遷，氣乃大溫，草乃早榮，民乃厲，溫病乃作，身熱頭痛嘔吐，肌腠瘡瘍。二之氣，大涼反至，民乃慘，草乃遇寒，火氣遂抑，民病氣鬱中滿，寒乃始。三之氣，天政布，寒氣行，雨乃降。民病寒，反熱中，癰疽注下，心熱瞀悶，不治者死。四之氣，風溼交爭，風化爲雨，乃長乃化乃成。民病大熱少氣，肌肉萎足痿，注下赤白。五之氣，陽復化，草乃長乃化乃成，民乃舒。終之氣，地氣正，溼令行，陰凝太虛，埃昏郊野，民乃慘悽，寒風以至，反者孕乃死。","bh":"","notes":[],"pending":true},{"id":"sw71-5","tags":[],"yw":"故歲宜苦以燥之溫之，必折其鬱氣，先資其化源，抑其運氣，扶其不勝，無使暴過而生其疾，食歲谷以全其真，避虛邪以安其正。適氣同異，多少制之，同寒溼者燥熱化，異寒溼者燥溼化，故同者多之，異者少之，用寒遠寒，用涼遠涼，用溫遠溫，用熱遠熱，食宜同法。有假者反常，反是者病，所謂時也。帝曰∶善。陽明之政奈何？岐伯曰∶卯酉之紀也。陽明少角少陰清熱勝復同，同正商。丁卯歲會丁酉其運風清熱。少角（初正）太徵少宮太商少羽（終）陽明少徵少陰寒雨勝復同，同正商。","bh":"","notes":[],"pending":true},{"id":"sw71-6","tags":[],"yw":"癸卯（同歲會）癸酉（同歲會）其運熱寒雨。少徵太宮少商太羽（終）太角（初）陽明少宮少陰風涼勝復同。己卯己酉其運雨風涼。少宮太商少羽（終）少角（初）太徵陽明少商少陰熱寒勝復同，同正商。乙卯天符乙酉歲會，太一天符。其運涼熱寒。少商太羽（終）太角（初）少徵太宮陽明少羽少陰雨風勝復同，同少宮。辛卯辛酉其運寒雨風。少羽（終）少角（初）太徵少宮太商凡此陽明司天之政，氣化營運後天，天氣急，地氣明，陽專其令，炎暑大行，物燥以堅，淳風乃治，風燥橫運，流於氣交，多陽少陰，雲趨雨府，溼化乃敷。","bh":"","notes":[],"pending":true},{"id":"sw71-7","tags":[],"yw":"燥極而澤，其谷白丹，間谷命太者，其耗白甲品羽，金火合德，上應太白熒惑。其政切，其令暴，蟄蟲乃見，流水不冰，民病咳嗌塞，寒熱發，暴振癃，清先而勁，毛蟲乃死，熱後而暴，介蟲乃殃，其發躁，勝復之作，擾而大亂，清熱之氣，持於氣交。初之氣，地氣遷，陰始凝，氣始肅，水乃冰，寒雨化。其病中熱脹，面目浮腫，善眠，鼽衄嚏欠嘔，小便黃赤，甚則淋。二之氣，陽乃布，民乃舒，物乃生榮。厲大至，民善暴死。三之氣，天政布，涼乃行，燥熱交合，燥極而澤，民病寒熱。","bh":"","notes":[],"pending":true},{"id":"sw71-8","tags":[],"yw":"四之氣，寒雨降。病暴僕，振慄譫妄，少氣嗌干引飲，及爲心痛癰腫瘡瘍瘧寒之疾，骨痿血便。五之氣，春令反行，草乃生榮，民氣和。終之氣，陽氣布，候反溫，蟄蟲來見，流水不冰，民乃康平，其病溫。故食歲谷以安其氣，食間谷以去其邪，歲宜以鹹以苦以辛，汗之清之散之，安其運氣，無使受邪，折其鬱氣，資其化源。以寒熱輕重少多其制，同熱者多天化，同清者多地化，用涼遠涼，用熱遠熱，用寒遠寒，用溫遠溫，食宜同法。有假者反之，此其道也。","bh":"","notes":[],"pending":true},{"id":"sw71-9","tags":[],"yw":"反是者，亂天地之經，擾陰陽之紀也。帝曰∶善。少陽之政奈何？岐伯曰∶寅申之紀也。少陽太角厥陰壬寅（同天符）壬申（同天符）其運風鼓，其化鳴紊啓坼，其變振拉摧拔，其病掉眩支脅驚駭。太角（初正）少徵太宮少商太羽（終）少陽太徵厥陰戊寅天符戊申天符其運暑，其化暄囂鬱燠，其變炎烈沸騰，其病上熱鬱血溢血泄心痛。太徵少宮太商少羽（終）少角（初）少陽太宮厥陰甲寅甲申其運陰雨，其化柔潤重澤，其變震驚飄驟，其病體重腫痞飲。","bh":"","notes":[],"pending":true},{"id":"sw71-10","tags":[],"yw":"太宮少商太羽（終）太角（初）少徵少陽太商厥陰庚寅庚申同正商其運涼，其化霧露清切，其變肅殺雕零，其病肩背胸中。太商少羽（終）少角（初）太徵少宮少陽太羽厥陰丙寅丙申其運寒肅，其化凝慘冽，其變冰雪霜雹，其病寒浮腫。太羽（終）太角（初）少徵太宮少商凡此少陽司天之政，氣化營運先天，天氣正，地氣擾，風乃暴舉，木偃沙飛，炎火乃流，陰行陽化，雨乃時應，火木同德，上應熒惑歲星。其谷丹蒼，其政嚴，其令擾。故風熱參布，雲物沸騰，太陰橫流，寒乃時至，涼雨並起。","bh":"","notes":[],"pending":true},{"id":"sw71-11","tags":[],"yw":"民病寒中，外發瘡瘍，內爲泄滿。故聖人遇之，和而不爭。往復之作，民病寒熱瘧泄，聾瞑嘔吐，上怫腫色變。初之氣，地氣遷，風勝乃搖，寒乃去，候乃大溫，草木早榮。寒來不殺，溫病乃起，其病氣怫於上，血溢目赤，咳逆頭痛，血崩脅滿，膚腠中瘡。二之氣，火反鬱，白埃四起，雲趨雨府，風不勝溼，雨乃零，民乃康。其病熱鬱於上，咳逆嘔吐，瘡發於中，胸嗌不利，頭痛身熱，昏憒膿瘡。三之氣，天政布，炎暑至，少陽臨上，雨乃涯。民病熱中，聾瞑血溢，膿瘡咳嘔，鼽衄渴嚏欠，喉痹目赤，善暴死。","bh":"","notes":[],"pending":true},{"id":"sw71-12","tags":[],"yw":"四之氣，涼乃至，炎暑間化，白露降，民氣和平，其病滿身重。五之氣，陽乃去，寒乃來，雨乃降，氣門乃閉，剛木早雕，民避寒邪，君子周密。終之氣，地氣正，風乃至，萬物反生，霧以行。其病關閉不禁，心痛，陽氣不藏而咳。抑其運氣，贊所不勝，必折其鬱氣，先取化源，暴過不生，苛疾不起。故歲宜鹹辛宜酸，滲之泄之，漬之發之，觀氣寒溫以調其過，同風熱者多寒化，異風熱者少寒化，用熱遠熱，用溫遠溫，用寒遠寒，用涼遠涼，食宜同法，此其道也。","bh":"","notes":[],"pending":true},{"id":"sw71-13","tags":[],"yw":"有假者反之，反是者病之階也。帝曰∶善。太陰之政奈何？岐伯曰∶丑未之紀也。太陰少角太陽清熱勝復同，同正宮。丁丑丁未其運風清熱。少角（初正）太徵少宮太商少羽（終）太陰少徵太陽寒雨勝復同。癸丑癸未其運熱寒雨。少徵太宮少商太羽（終）太角太陰少宮太陽風清勝復同，同正宮。己丑太一天符己未太一天符其運雨風清。少宮太商少羽（終）少角（初）太徵太陰少商太陽熱寒勝復同。乙丑乙未其運涼熱寒。少商太羽（終）太角（初）少徵太宮太陰少羽太陽雨風勝復同，同正宮。","bh":"","notes":[],"pending":true},{"id":"sw71-14","tags":[],"yw":"辛丑（同歲會）辛未（同歲會）其運寒雨風。少羽（終）少角（初）太徵少宮太商凡此太陰司天之政，氣化營運後天，陰專其政，陽氣退辟，大風時起，天氣下降，地氣上騰，原野昏，白埃四起，雲奔南極，寒雨數至，物成於差夏。民病寒溼，腹滿身憤腫，痞逆寒厥拘急。溼寒合德，黃黑埃昏，流行氣交，上應鎮星辰星。其政肅，其令寂，其谷玄。故陰凝於上，寒積於下，寒水勝火，則爲冰雹，陽光不治，殺氣乃行。故有餘宜高，不及宜下，有餘宜晚，不及宜早，土之利，氣之化也，民氣亦從之，間谷命其太也。","bh":"","notes":[],"pending":true},{"id":"sw71-15","tags":[],"yw":"初之氣，地氣遷，寒乃去，春氣正，風乃來，生布萬物以榮，民氣條舒，風溼相薄，雨乃後。民病血溢，筋絡拘強，關節不利，身重筋痿。二之氣，大火正，物承化，民乃和，其病溫厲大行，遠近鹹若，溼蒸相薄，雨乃時降。三之氣，天政布，溼氣降，地氣騰，雨乃時降，寒乃隨之。感於寒溼，則民病身重腫，胸腹滿。四之氣，畏火臨，溽蒸化，地氣騰，天氣痞隔，寒風曉暮，蒸熱相薄，草木凝煙，溼化不流，則白露陰布，以成秋令。民病腠理熱，血暴溢瘧，心腹滿熱臚脹，甚則腫。","bh":"","notes":[],"pending":true},{"id":"sw71-16","tags":[],"yw":"五之氣，慘令已行，寒露下，霜乃早降，草木黃落，寒氣及體，君子周密，民病皮腠。終之氣，寒大舉，溼大化，霜乃積，陰乃凝，水堅冰，陽光不治。感於寒，則病患關節禁固，腰痛，寒溼推於氣交而爲疾也。必折其鬱氣，而取化源，益其歲氣，無使邪勝，食歲谷以全其真，食間谷以保其精。故歲宜以苦燥之溫之，甚者發之泄之。不發不泄，則溼氣外溢，肉潰皮拆而水血交流。必贊其陽火，令御甚寒，從氣異同，少多其判也，同寒者以熱化，同溼者以燥化，異者少之，同者多之，用涼遠涼，用寒遠寒，用溫遠溫，用熱遠熱，食宜同法。","bh":"","notes":[],"pending":true},{"id":"sw71-17","tags":[],"yw":"假者反之，此其道也，反是者病也。帝曰∶善。少陰之政奈何？岐伯曰∶子午之紀也。少陰太角陽明壬子壬午其運風鼓，其化鳴紊啓拆，其變振拉摧拔，其病支滿。太角（初正）少徵太宮少商太羽（終）少陰太徵陽明戊子天符戊午太一天符其運炎暑，其化暄曜鬱燠，其變炎烈沸騰，其病上熱血溢。太徵少宮太商少羽（終）少角（初）少陰太宮陽明甲子甲午其運陰雨，其化柔潤時雨，其變震驚飄驟，其病中滿身重。太宮少商太羽（終）太角（初）少徵少陰太商陽明庚子（同天符）庚午（同天符）同正商其運涼勁，其化霧露蕭，其變肅殺雕零，其病下清。","bh":"","notes":[],"pending":true},{"id":"sw71-18","tags":[],"yw":"太商少羽（終）少角（初）太徵少宮少陰太羽陽明丙子歲會丙午其運寒，其化凝慘冽，其變冰雪霜雹，其病寒下。太羽（終）太角（初）少徵太宮少商凡此少陰司天之政，氣化營運先天，地氣肅，天氣明，寒交暑，熱加燥，雲馳雨府，溼化乃行，時雨乃降，金火合德，上應熒惑太白。其政明，其令切，其谷丹白。水火寒熱持於氣交而爲病始也，熱病生於上，清病生於下，寒熱凌犯而爭於中，民病咳喘，血溢血泄鼽嚏，目赤瘍，寒厥入胃，心痛腰痛，腹大嗌干腫上。","bh":"","notes":[],"pending":true},{"id":"sw71-19","tags":[],"yw":"初之氣，地氣遷，燥將去，寒乃始，蟄復藏，水乃冰，霜復降，風乃至，陽氣鬱，民反周密，關節禁固，腰痛，炎暑將起，中外瘡瘍。二之氣，陽氣布，風乃行，春氣以正，萬物應榮，寒氣時至，民乃和。其病淋，目瞑目赤，氣鬱於上而熱。三之氣，天政布，大火行，庶類番鮮，寒氣時至。民病氣厥心痛，寒熱更作，咳喘目赤。四之氣，溽暑至，大雨時行，寒熱互至。民病寒熱，嗌干黃癉，鼽衄飲發。五之氣，畏火臨，暑反至，陽乃化，萬物乃生乃長榮，民乃康，其病溫。","bh":"","notes":[],"pending":true},{"id":"sw71-20","tags":[],"yw":"終之氣，燥令行，餘火內格，腫於上，咳喘，甚則血溢。寒氣數舉，則霧翳，病生皮腠，內舍於脅，下連少腹而作寒中，地將易也。必抑其運氣，資其歲勝，折其鬱發，先取化源，無使暴過而生其病也。食歲谷以全真氣，食間谷以辟虛邪。歲宜鹹以之，而調其上，甚則以苦發之；以酸收之，而安其下，甚則以苦泄之。適氣同異而多少之，同天氣者以寒清化，同地氣者以溫熱化，用熱遠熱，用涼遠涼，用溫遠溫，用寒遠寒，食宜同法。有假則反，此其道也，反是者病作矣。","bh":"","notes":[],"pending":true},{"id":"sw71-21","tags":[],"yw":"帝曰∶善。厥陰之政奈何？岐伯曰∶巳亥之紀也。厥陰少角少陽清熱勝復同，同正角。丁巳天符丁亥天符其運風清熱。少角（初正）太徵少宮太商少羽（終）厥明少徵少陽寒雨勝復同。癸巳（同歲會）癸亥（同歲會）其運熱寒雨。少徵太宮少商太羽（終）太角（初）厥陰少宮少陽風清勝復同，同正角。己巳己亥其運雨風清。少宮太商少羽（終）少角（初）太徵厥陰少商少陽熱寒勝復同，同正角。乙巳乙亥其運涼熱寒。少商太羽（終）太角（初）少徵太宮厥陰少羽少陽雨風勝復同。","bh":"","notes":[],"pending":true},{"id":"sw71-22","tags":[],"yw":"辛巳辛亥其運寒雨風。少羽（終）少角（初）太徵少宮太商凡此厥陰司天之政，氣化營運後天，諸同正歲，氣化營運同天，天氣擾，地氣正，風生高遠，炎熱從之，雲趨雨府，溼化乃行，風火同德，上應歲星熒惑。其政撓，其令速，其谷蒼丹，間谷言太者，其耗文角品羽。風燥火熱，勝復更作，蟄蟲來見，流水不冰，熱病行於下，風病行於上，風燥勝復形於中。初之氣，寒始肅，殺氣方至，民病寒於右之下。二之氣，寒不去，華雪水冰，殺氣施化，霜乃降，名草上焦，寒雨數至，陽復化，民病熱於中。","bh":"","notes":[],"pending":true},{"id":"sw71-23","tags":[],"yw":"三之氣，天政布，風乃時舉，民病泣出耳鳴掉眩。四之氣，溽暑溼熱相薄，爭於左之上，民病黃癉而爲腫。五之氣，燥溼更勝，沉陰乃布，寒氣及體，風雨乃行。終之氣，畏火司令，陽乃大化，蟄蟲出見，流水不冰，地氣大發，草乃生，人乃舒，其病溫厲。必折其鬱氣，資其化源，贊其運氣，無使邪勝。歲宜以辛調上，以鹹調下，畏火之氣，無妄犯之。用溫遠溫，用熱遠熱，用涼遠涼，用寒遠寒，食宜同法。有假反常，此之道也，反是者病。帝曰∶善。","bh":"","notes":[],"pending":true},{"id":"sw71-24","tags":[],"yw":"夫子之言可謂悉矣，然何以明其應乎？岐伯曰∶昭乎哉問也！夫六氣者，行有次，止有位，故常以正月朔日平旦視之，睹其位而知其所在矣。運有餘，其至先，運不及，其至後，此天之道，氣之常也。運非有餘非不足，是謂正歲，其至當其時也。帝曰∶勝復之氣，其常在也，災眚時至，候也奈何？岐伯曰∶非氣化者，是謂災也。帝曰∶天地之數，終始奈何？岐伯曰∶悉乎哉問也！是明道也。數之始，起於上而終於下，歲半之前，天氣主之，歲半之後，地氣主之，上下交互，氣交主之，歲紀畢矣。","bh":"","notes":[],"pending":true},{"id":"sw71-25","tags":[],"yw":"故曰∶位明氣月可知乎，所謂氣也。帝曰∶餘司其事，則而行之，不合其數何也？岐伯曰∶氣用有多少，化治有盛衰，衰盛多少，同其化也。帝曰∶願聞同化何如？岐伯曰∶風溫春化同，熱曛昏火夏化同，勝與復同，燥清煙露秋化同，雲雨昏暝埃長夏化同，寒氣霜雪冰冬化同，此天地五運六氣之化，更用盛衰之常也。帝曰∶五營運同天化者，命曰天符，餘知之矣。願聞同地化者何謂也？岐伯曰∶太過而同天化者三，不及而同天化者亦三，太過而同地化者三，不及而同地化者亦三，此凡二十四歲也。","bh":"","notes":[],"pending":true},{"id":"sw71-26","tags":[],"yw":"帝曰∶願聞其所謂也。岐伯曰∶甲辰甲戌太宮下加太陰，壬寅壬申太角下加厥陰，庚子庚午太商下加陽明，如是者三。癸巳癸亥少徵下加少陽，辛丑辛未少羽下加太陽，癸卯癸酉少徵下加少陰，如是者三。戊子戊午太徵上臨少陰，戊寅戊申太徵上臨少陽，丙辰丙戌太羽上臨太陽，如是者三。丁巳丁亥少角上臨厥陰，乙卯乙酉少商上臨陽明，己丑己未少宮上臨太陰，如是者三。除此二十四歲，則不加不臨也。帝曰∶加者何謂？岐伯曰∶太過而加同天符，不及而加同歲會也。","bh":"","notes":[],"pending":true},{"id":"sw71-27","tags":[],"yw":"帝曰∶臨者何謂？岐伯曰∶太過不及，皆曰天符，而變行有多少，病形有微甚，生死有早晏耳。帝曰∶夫子言用寒遠寒，用熱遠熱，餘未知其然也，願聞何謂遠？岐伯曰∶熱無犯熱，寒無犯寒，從者和，逆者病，不可不敬畏而遠之，所謂時興六位也。帝曰∶溫涼何如？岐伯曰∶司氣以熱，用熱無犯，司氣以寒，用寒無犯，司氣以涼，用涼天犯，司氣以溫，用溫無犯，間氣同其主無犯，異其主則小犯之，是謂四畏，必謹察之。帝曰∶善。其犯者何如？岐伯曰∶天氣反時，則可根據時，及勝其主則可犯，以平爲期，而不可過，是謂邪氣反勝者。","bh":"","notes":[],"pending":true},{"id":"sw71-28","tags":[],"yw":"故曰∶無失天信，無逆氣宜，無翼其勝，無贊其復，是謂至治。帝曰∶善。五運氣行主歲之紀，其有常數乎？岐伯曰∶臣請次之。甲子甲午歲上少陰火中太宮土運下陽明金熱化二，雨化五，燥化四，所謂正化日也。其化上鹹寒，中苦熱，下酸熱，所謂藥食宜也。乙丑乙未歲上太陰土中少商金運下太陽水熱化寒化勝復同，所謂邪氣化日也。災七宮。溼化五，清化四，寒化六，所謂正化日也。其化上苦熱，中酸和，下甘熱，所謂藥食宜也。丙寅丙申歲上少陽相火中太羽水運下厥陰木火化二，寒化六，風化三，所謂正化日也。","bh":"","notes":[],"pending":true},{"id":"sw71-29","tags":[],"yw":"其化上鹹寒，中鹹溫，下辛溫，所謂藥食宜也。丁卯（歲會）丁酉歲上陽明金中少角木運下少陰火清化熱化勝復同，所謂邪氣化日也。災三宮。燥化九，風化三，熱化七，所謂正化日也。其化上苦小溫，中辛和，下鹹寒，所謂藥食宜也。戊辰戊戌歲上太陽水中太徵火運下太陰土寒化六，熱化七，溼化五，所謂正化日也。其化上苦溫，中甘和，下甘溫，所謂藥食宜也。己巳己亥歲上厥陰木中少宮土運下少陽相火風化清化勝復同，所謂邪氣化日也。災五宮。","bh":"","notes":[],"pending":true},{"id":"sw71-30","tags":[],"yw":"風化三，溼化五，火化七，所謂正化日也。其化上辛涼，中甘和，下鹹寒，所謂藥食宜也。庚午（同天符）庚子歲（同天符）上少陰火中太商金運下陽明金熱化七，清化九，燥化九，所謂正化日也。其化上鹹寒，中辛溫，下酸溫，所謂藥食宜也。辛未（同歲會）辛丑歲（同歲會）上太陰土中少羽水運下太陽水雨化風化勝復同，所謂邪氣化日也。災一宮。雨化五，寒化一，所謂正化日也。其化上苦熱，中苦和，下苦熱，所謂藥食宜也。壬申（同天符）壬寅歲（同天符）上少陽相火中太角木運下厥陰木火化二，風化八，所謂正化日也。","bh":"","notes":[],"pending":true},{"id":"sw71-31","tags":[],"yw":"其化上鹹寒，中酸和，下辛涼，所謂藥食宜也。癸酉（同歲會）癸卯歲（同歲會）上陽明金中少徵火運下少陰火寒化雨化勝復同，所謂邪氣化日也。災九宮。燥化九，熱化二，所謂正化日也。其化上苦小溫，中鹹溫，下鹹寒，所謂藥食宜也。甲戌（歲會同天符）甲辰歲（歲會同天符）上太陽水中太宮土運下太陰土寒化六，溼化五，正化日也。其化上苦熱，中苦溫，下苦溫，藥食宜也。乙亥乙巳歲上厥陰木，中少商金運，下少陽相火，熱化寒化勝復同，邪氣化日也。","bh":"","notes":[],"pending":true},{"id":"sw71-32","tags":[],"yw":"災七宮。風化八，清化四，火化二，正化度也。其化上辛涼，中酸和，下鹹寒，藥食宜也。丙子（歲會）丙午歲上少陰火中太羽水運下陽明金熱化二，寒化六，清化四，正化度也。其化上鹹寒，中鹹熱，下酸溫，藥食宜也。丁丑丁未歲上太陰土中少角木運下太陽水清化熱化勝復同，邪氣化度也。災三宮。雨化五，風化三，寒化一，正化度也。其化上苦溫，中辛溫，下甘熱，藥食宜也。戊寅戊申歲（天符）上少陽相火中太徵火運下厥陰木火化七，風化三，正化度也。","bh":"","notes":[],"pending":true},{"id":"sw71-33","tags":[],"yw":"其化上鹹寒，中甘和，下辛涼，藥食宜也。己卯己酉歲上陽明金中少宮土運下少陰火風化清化勝復同，邪氣化度也。災五宮。清化九，雨化五，熱化七，正化度也。其化上苦小溫，中甘和，下鹹寒，藥食宜也。庚辰庚戌歲上太陽水中太商金運下太陰土寒化一，清化九，雨化五，正化度也。其化上苦熱，中辛溫，下甘熱，藥食宜也。辛巳辛亥歲上厥陰木中少羽水運下少陽相火雨化風化勝復同，邪氣化度也。災一宮。風化三，寒化一，火化七，正化度也。","bh":"","notes":[],"pending":true},{"id":"sw71-34","tags":[],"yw":"其化上辛涼，中苦和，下鹹寒，藥食宜也。壬午壬子歲上少陰火中太角木運下陽明金熱化二，風化八，清化四，正化度也。其化上鹹寒，中酸涼，下酸溫，藥食宜也。癸未癸丑歲上太陰土中少徵火運下太陽水寒化雨化勝復同，邪氣化度也。災九宮。雨化五，火化二，寒化一，正化度也。其化上苦溫，中鹹溫，下甘熱，藥食宜也。甲申甲寅歲上少陽相火中太宮土運下厥陰木火化二，雨化五，風化八，正化度也。其化上鹹寒，中鹹和，下辛涼，藥食宜也。","bh":"","notes":[],"pending":true},{"id":"sw71-35","tags":[],"yw":"乙酉（太一天符）乙卯歲（天符）上陽明金中少商金運下少陰火熱化寒化勝復同，邪氣化度也。災七宮。燥化四，清化四，熱化二，正化度也。其化上苦小溫，中苦和，下鹹寒，藥食宜也。丙戌（天符）丙辰歲（天符）上太陽水中太羽水運下太陰土寒化六，雨化五，正化度也。其化上苦熱，中鹹溫，下甘熱，藥食宜也。丁亥（天符）丁巳歲（天符）上厥陰木中少角木運下少陽相火清化熱化勝復同，邪氣化度也。災三宮。風化三，火化七，正化度也。其化上辛涼，中辛和，下鹹寒，藥食宜也。","bh":"","notes":[],"pending":true},{"id":"sw71-36","tags":[],"yw":"戊子（天符）戊午歲（太一天符）上少陰火中太徵火運下陽明金熱化七，清化九，正化度也。其化上鹹寒，中甘寒，下酸溫，藥食宜也。己丑（太一天符）己未歲（太一天符）上太陰土中少宮土運下太陽水風化清化勝復同，邪氣化度也。災五宮。雨化五，寒化一，正化度也。其化上苦熱，中甘和，下甘熱，藥食宜也。庚寅庚申歲上少陽相火中太商金運下厥陰木火化七，清化九，風化三，正化度也。其化上鹹寒，中辛溫，下辛涼，藥食宜也。辛卯辛酉歲上陽明金中少羽水運下少陰火雨化風化勝復同，邪氣化度也。","bh":"","notes":[],"pending":true},{"id":"sw71-37","tags":[],"yw":"災一宮。清化九，寒化一，熱化七，正化度也。其化上苦小溫，中苦和，下鹹寒，藥食宜也。壬辰壬戌歲上太陽水中太角木運下太陰土寒化六，風化八，雨化五，正化度也。其化上苦溫，中酸和，下甘溫，藥食宜也。癸巳（同歲會）癸亥（同歲會）上厥陰木中少徵火運下少陽相火寒化雨化勝復同，邪氣化度也。災九宮。風化八，火化二，正化度也。其化上辛涼，中鹹和，下鹹寒，藥食宜也。凡此定期之紀，勝復正化，皆有常數，不可不察。故知其要者，一言而終，不知其要，流散無窮，此之謂也。","bh":"","notes":[],"pending":true},{"id":"sw71-38","tags":[],"yw":"帝曰∶善。五運之氣，亦復歲乎？岐伯曰∶鬱極乃發，待時而作也。帝曰∶請問其所謂也？岐伯曰∶五常之氣，太過不及，其發異也。帝曰∶願卒聞之。岐伯曰∶太過者暴，不及者徐，暴者爲病甚，徐者爲病持。帝曰∶太過不及，其數何如？岐伯曰∶太過者其數成，不及者其數生，土常以生也。帝曰∶其發也何如？岐伯曰∶土鬱之發，巖谷震驚，雷殷氣交，埃昏黃黑，化爲白氣，飄驟高深，擊石飛空，洪水乃從，川流漫衍，田牧土駒。化氣乃敷，善爲時雨，始生始長，始化始成。","bh":"","notes":[],"pending":true},{"id":"sw71-39","tags":[],"yw":"故民病心腹脹，腸鳴而爲數後，甚則心痛脅，嘔吐霍亂，飲發注下，腫身重。雲奔雨府，霞擁朝陽，山澤埃昏，其乃發也，以其四氣。雲橫天山，浮遊生滅，怫之先兆。金鬱之發，天潔地明，風清氣切，大涼乃舉，草樹浮煙，燥氣以行，霧數起，殺氣來至，草木蒼干，金乃有聲。故民病咳逆，心脅滿引少腹，善暴痛，不可反側，嗌干面塵色惡。山澤焦枯，土凝霜滷，怫乃發也，其氣五。夜零白露，林莽聲悽，怫之兆也。水鬱之發，陽氣乃辟，陰氣暴舉，大寒乃至，川澤嚴凝，寒結爲霜雪，甚則黃黑昏翳，流行氣交，乃爲霜殺，水乃見祥。","bh":"","notes":[],"pending":true},{"id":"sw71-40","tags":[],"yw":"故民病寒客心痛，腰痛，大關節不利，屈伸不便，善厥逆，痞堅腹滿。陽光不治，空積沉陰，白埃昏瞑，而乃發也，其氣二火前後。太虛深玄，氣猶麻散，微見而隱，色黑微黃，怫之先兆也。木鬱之發，太虛埃昏，雲物以擾，大風乃至，屋發折木，木有變。故民病胃脘當心而痛，上支兩脅，膈咽不通，食飲不下，甚則耳鳴眩轉，目不識人，善暴僵僕。太虛蒼埃，天山一色，或氣濁色，黃黑鬱若，橫雲不起雨，而乃發也，其氣無常。長川草偃，柔葉呈陰，松吟高山，虎嘯巖岫，怫之先兆也。","bh":"","notes":[],"pending":true},{"id":"sw71-41","tags":[],"yw":"火鬱之發，太虛腫翳，大明不彰，炎火行，大暑至，山澤燔燎，材木流津，廣廈騰煙，土浮霜滷，止水乃減，蔓草焦黃，風行惑言，溼化乃後。故民病少氣，瘡瘍癰腫，脅腹胸背，面首四肢，憤臚脹，瘍嘔逆，螈骨痛，節乃有動，注下溫瘧，腹中暴痛，血溢流注，精液乃少，目赤心熱，甚則瞀悶懊，善暴死。刻終大溫，汗濡玄府，其乃發也，其氣四。動復則靜，陽極反陰，溼令乃化乃成。華發水凝，山川冰雪，焰陽午澤，怫之先兆也。有怫之應而後報也，皆觀其極而乃發也，木發無時，水隨火也。","bh":"","notes":[],"pending":true},{"id":"sw71-42","tags":[],"yw":"謹候其時，病可與期，失時反歲，五氣不行，生化收藏，政無恆也。帝曰∶水發而雹雪，土發而飄驟，木發而毀折，金發而清明，火發而曛昧，何氣使然？岐伯曰∶氣有多少，發有微甚，微者當其氣，甚者兼其下，徵其下氣而見可知也。帝曰∶善。五氣之發，不當位者何也？岐伯曰∶命其差。帝曰∶差有數乎？岐伯曰∶後皆三十度而有奇也。帝曰∶氣至而先後者何？岐伯曰∶運太過則其至先，運不及則其至後，此候之常也。帝曰∶當時而至者何也？岐伯曰∶非太過非不及，則至當時，非是者眚也。","bh":"","notes":[],"pending":true},{"id":"sw71-43","tags":[],"yw":"帝曰∶善。氣有非時而化者何也？岐伯曰∶太過者當其時，不及者歸其己勝也。帝曰∶四時之氣，至有早晏高下左右，其候何如？岐伯曰∶行有逆順，至有遲速，故太過者化先天，不及者化後天。帝曰∶願聞其行何謂也？岐伯曰∶春氣西行，夏氣北行，秋氣東行，冬氣南行。故春氣始於下，秋氣始於上，夏氣始於中，冬氣始於標。春氣始於左，秋氣始於右，冬氣始於後，夏氣始於前。此四時正化之常。故至高之地，冬氣常在，至下之地，春氣常在，必謹察之。","bh":"","notes":[],"pending":true},{"id":"sw71-44","tags":[],"yw":"帝曰∶善。黃帝問曰∶五運六氣之應見，六化之正，六變之紀何如？岐伯對曰∶夫六氣正紀，有化有變，有勝有復，有用有病，不同其候，帝欲何乎？帝曰∶願盡聞之。岐伯曰∶請遂言之。夫氣之所至也，厥陰所至爲和平，少陰所至爲暄，太陰所至爲埃溽，少陽所至爲炎暑，陽明所至爲清勁，太陽所至爲寒，時化之常也。厥陰所至爲風府爲璺啓，少陰所至爲火府爲舒榮，太陰所至爲雨府爲員盈，少陽所至爲熱府爲行出，陽明所至爲司殺府爲庚蒼，太陽所至爲寒府爲歸藏，司化之常也。","bh":"","notes":[],"pending":true},{"id":"sw71-45","tags":[],"yw":"厥陰所至爲生爲風搖，少陰所至爲榮爲形見，太陰所至爲化爲雲雨，少陽所至爲長爲番鮮，陽明所至爲收爲霧露，太陽所至爲藏爲周密，氣化之常也。厥陰所至爲風生，終爲肅；少陰所至爲熱生，中爲寒；太陰所至爲溼生，終爲注雨；少陽所至爲火生，終爲蒸溽；陽明所至爲燥生，終爲涼；太陽所至爲寒生，中爲溫。德化之常也。厥陰所至爲毛化，少陰所至爲羽化，太陰所至爲化，少陽所至爲羽化，陽明所至爲介化，太陽所至爲鱗化，德化之常也。厥陰所至爲生化，少陰所至爲榮化，太陰所至爲濡化，少陽所至爲茂化，陽明所至爲堅化，太陽所至爲藏化，布政之常也。","bh":"","notes":[],"pending":true},{"id":"sw71-46","tags":[],"yw":"厥陰所至爲飄怒大涼，少陰所至爲大暄寒，太陰所至爲雷霆驟注烈風，少陽所至爲飄風燔燎霜凝，陽明所至爲散落溫，太陽所至爲寒雪冰雹白埃，氣變之常也。厥陰所至爲撓動爲迎隨，少陰所至爲高明焰爲曛，太陰所至爲沉陰爲白埃爲晦暝，少陽所至爲光顯爲彤雲爲曛，陽明所至爲煙埃爲霜爲勁切爲悽鳴，太陽所至爲剛固爲堅芒爲立，令行之常也。厥陰所至爲裏急，少陰所至爲瘍胗身熱，太陰所至爲積飲痞隔，少陽所至爲嚏嘔爲瘡瘍，陽明所至爲浮虛，太陽所至爲屈伸不利，病之常也。","bh":"","notes":[],"pending":true},{"id":"sw71-47","tags":[],"yw":"厥陰所至爲支痛，少陰所至爲驚惑惡寒戰譫妄，太陰所至爲滿，少陽所至爲驚躁瞀昧暴病，陽明所至爲鼽尻陰股膝髀足病，太陽所至爲腰痛，病之常也。厥陰所至爲戾，少陰所至爲悲妄衄，太陰所至爲中滿霍亂吐下，少陽所至爲喉痹耳鳴嘔湧，陽明所至爲皴揭，太陽所至爲寢汗痙，病之常也。厥陰所至爲脅痛嘔泄，少陰所至爲語笑，太陰所至爲重腫，少陽所至爲暴注螈暴死，陽明所至爲鼽嚏，太陽所至爲流泄禁止，病之常也。凡此十二變者，報德以德，報化以化，報政以政，報令以令，氣高則高，氣下則下，氣後則後，氣前則前，氣中則中，氣外則外，位之常也。","bh":"","notes":[],"pending":true},{"id":"sw71-48","tags":[],"yw":"故風勝則動，熱勝則腫，燥勝則干，寒勝則浮，溼勝則濡泄，甚則水閉腫，隨氣所在，以言其變耳。帝曰∶願聞其用也。岐伯曰∶夫六氣之用，各歸不勝而爲化，故太陰雨化，施於太陽；太陽寒化，施於少陰；少陰熱化，施於陽明；陽明燥化，施於厥陰；厥陰風化，施於太陰。各命其所在以徵之也。帝曰∶自得其位何如？岐伯曰∶自得其位，常化也。帝曰∶願聞所在也。岐伯曰∶命其位而方月可知也。帝曰∶六位之氣盈虛何如？岐伯曰∶太少異也，太者之至徐而常，少者暴而亡。","bh":"","notes":[],"pending":true},{"id":"sw71-49","tags":[],"yw":"帝曰∶天地之氣，盈虛何如？岐伯曰∶天氣不足，地氣隨之，地氣不足，天氣從之，運居其中而常先也。惡所不勝，歸所同和，隨運歸從而生其病也。故上勝則天氣降而下，下勝則地氣遷而上，多少而差其分，微者小差，甚者大差，甚則位易氣交易，則大變生而病作矣。《大要》曰∶甚紀五分，微紀七分，其差可見。此之謂也。帝曰∶善。論言熱無犯熱，寒無犯寒。餘欲不遠寒，不遠熱奈何？岐伯曰∶悉乎哉問也！發表不遠熱，攻裏不遠寒。帝曰∶不發不攻而犯寒犯熱何如？岐伯曰∶寒熱內賊，其病益甚。","bh":"","notes":[],"pending":true},{"id":"sw71-50","tags":[],"yw":"帝曰∶願聞無病者何如？岐伯曰∶無者生之，有者甚之。帝曰∶生者何如？岐伯曰∶不遠熱則熱至，不遠寒則寒至，寒至則堅痞腹滿，痛急下利之病生矣，熱至則身熱，吐下霍亂，癰疽瘡瘍，瞀鬱注下，螈腫脹，嘔鼽衄頭痛，骨節變肉痛，血溢血泄，淋之病生矣。帝曰∶治之奈何？岐伯曰∶時必順之，犯者治以勝也。黃帝問曰∶婦人重身，毒之何如？岐伯曰∶有故無殞，亦無殞也。帝曰∶願聞其故何謂也？岐伯曰∶大積大聚，其可犯也，衰其太半而止，過者死。","bh":"","notes":[],"pending":true},{"id":"sw71-51","tags":[],"yw":"帝曰∶善。鬱之甚者治之奈何？岐伯曰∶木鬱達之，火鬱發之，土鬱奪之，金鬱泄之，水鬱折之，然調其氣，過者折之，以其畏也，所謂瀉之。帝曰∶假者何如？岐伯曰∶有假其氣，則無禁也。所謂主氣不足，客氣勝也。帝曰∶至哉聖人之道！天地大化營運之節，臨御之紀，陰陽之政，寒暑之令，非夫子孰能通之！請藏之靈蘭之室，署曰《六元正紀》，非齋戒不敢示，慎傳也。六元正紀大論∶憒（音會）（音蒙）（奴董切）翮（胡革切）痙（巨郢切）<目錄>卷第二十一","bh":"","notes":[],"pending":true}]},
{"id":"sw72","book":"素问","no":72,"title":"刺法论","titleTw":"刺法論","tags":["yunqi","ci","bingji"],"brief":"","pending":true,"sections":[{"id":"sw72-1","tags":[],"yw":"黃帝問曰∶升降不前，氣交有變，即成暴鬱，餘已知之。如何預救生靈，可得卻乎？岐伯稽首再拜對曰∶昭乎哉問！臣聞夫子言，既明天元，須窮法刺，可以折鬱扶運，補弱全真，瀉盛蠲餘，令除斯苦。帝曰∶願卒聞之。岐伯曰∶升之不前，即有甚兇也。木欲升而天柱窒抑之，木欲發鬱亦須待時，當刺足厥陰之井。火欲升而天蓬窒抑之，火欲發鬱亦須待時，君火相火同刺包絡之滎。土欲升而天衝窒抑之，土欲發鬱亦須待時，當刺足太陰之俞。金欲升而天英窒抑之，金欲發鬱亦須待時，當刺手太陰之經。","bh":"","notes":[],"pending":true},{"id":"sw72-2","tags":[],"yw":"水欲升而天芮窒抑之，水欲發鬱亦須待時，當刺足少陰之合。帝曰∶升之不前，可以預備，願聞其降，可以先防。岐伯曰∶既明其升，必達其降也。升降之道，皆可先治也。木欲降而地晶窒抑之，降而不入，抑之鬱發，散而可得位，降而鬱發，暴如天間之待時也，降而不下，鬱可速矣，降可折其所勝也，當刺手太陰之所出，刺手陽明之所入。火欲降而地玄窒抑之，降而不入，抑之鬱發，散而可矣，當折其所勝，可散其鬱，當刺足少陰之所出，刺足太陽之所入。","bh":"","notes":[],"pending":true},{"id":"sw72-3","tags":[],"yw":"土欲降而地蒼窒抑之，降而不下，抑之鬱發，散而可入，當折其勝，可散其鬱，當刺足厥陰之所出，刺足少陽之所入。金欲降而地彤窒抑之，降而不下，抑之鬱發，散而可入，當折其勝，可散其鬱，當刺心包絡所出，刺手少陽所入也。水欲降而地阜窒抑之，降而不下，抑之鬱發，散而可入，當折其土，可散其鬱，當刺足太陰之所出，刺足陽明之所入。帝曰∶五運之至，有前後與升降往來，有所承抑之，可得聞乎刺法？岐伯曰∶當取其化源也。是故太過取之，不及資之。","bh":"","notes":[],"pending":true},{"id":"sw72-4","tags":[],"yw":"太過取之，次抑其鬱，取其運之化源，令折鬱氣。不及扶資，以扶運氣，以避虛邪也。資取之法令出《密語》。黃帝問曰∶升降之刺，以知其要，願聞司天未得遷正，使司化之失其常政，即萬化之或其皆妄。然與民爲病，可得先除，欲濟羣生，願聞其說。岐伯稽首再拜曰∶悉乎哉問！言其至理，聖念慈憫，欲濟羣生，臣乃盡陳斯道，可申洞微。太陽復布，即厥陰不遷正，不遷正氣塞於上，當瀉足厥陰之所流。厥陰復布，少陰不遷正，不遷正即氣塞於上，當刺心包絡脈之所流。","bh":"","notes":[],"pending":true},{"id":"sw72-5","tags":[],"yw":"少陰復布，太陰不遷正，不遷正即氣留於上，當刺足太陰之所流。太陰復布，少陽不遷正，不遷正則氣塞未通，當刺手少陽之所流。少陽復布，則陽明不遷正，不遷正則氣未通上，當刺手太陰之所流。陽明復布，太陽不遷正，不遷正則復塞其氣，當刺足少陰之所流。帝曰∶遷正不前，以通其要，願聞不退，欲折其餘，無令過失，可得明乎？岐伯曰∶氣過有餘，復作布正，是名不退位也。使地氣不得後化，新司天未可遷正，故復布化令如故也。巳亥之歲天數有餘，故厥陰不退位也，風行於上，木化布天，當刺足厥陰之所入。","bh":"","notes":[],"pending":true},{"id":"sw72-6","tags":[],"yw":"子午之歲，天數有餘，故少陰不退位也，熱行於上，火餘化布天，當刺手厥陰之所入。丑未之歲，天數有餘，故太陰不退位也，溼行於上，雨化布天，當刺足太陰之所入。寅申之歲，天數有餘，故少陽不退位也，熱行於上，火化布天，當刺手少陽之所入。卯酉之歲，天數有餘，故陽明不退位也，金行於上，燥化布天，當刺手太陰之所入。辰戌之歲，天數有餘，故太陽不退位也，寒行於上凜水化布天，當刺足少陰之所入。故天地氣逆，化成民病，以法刺之，預可平。","bh":"","notes":[],"pending":true},{"id":"sw72-7","tags":[],"yw":"黃帝問曰∶剛柔二干，失守其位，使天運之氣皆虛乎？與民爲病，可得平乎？岐伯曰∶深乎哉問！明其奧旨，天地迭移，三年化疫，是謂根之可見，必有逃門。假令甲子，剛柔失守，剛未正，柔孤而有虧，時序不令，即音律非從，如此三年，變大疫也。詳其微甚，察其淺深，欲至而可刺，刺之，當先補腎俞，次三日，可刺足太陰之所注。又有下位己卯不至，而甲子孤立者，次三年作土癘，其法補瀉，一如甲子同法也。其刺以畢，又不須夜行及遠行，令七日潔，清淨齋戒。","bh":"","notes":[],"pending":true},{"id":"sw72-8","tags":[],"yw":"所有自來腎有久病者，可以寅時面向南，淨神不亂，思閉氣不息七遍，以引頸咽氣順之，如咽甚硬物，如此七遍後，餌舌下津令無數。假令丙寅，剛柔失守，上剛干失守，下柔不可獨主之，中水運非太過，不可執法而定之，布天有餘，而失守上正，天地不合，即律呂音異，如此即天運失序，後三年變疫。詳其微甚，差有大小，徐至即後三年，至甚即首三年，當先補心俞，次五日，可刺腎之所入。又有下位地甲子，辛巳柔不附剛，亦名失守，即地運皆虛，後三年變水癘，即刺法皆如此矣。","bh":"","notes":[],"pending":true},{"id":"sw72-9","tags":[],"yw":"其刺如畢，慎其大喜欲情於中，如不忌，即其氣復散也，令靜七日，心欲實，令少思。假令庚辰，剛柔失守，上位失守，下位無合，乙庚金運，故非相招，布天未退，中運勝來，上下相錯，謂之失守，姑洗林鍾，商音不應也，如此則天運化易，三年變大疫。詳其天數，差有微甚，微即微，三年至，甚即甚，三年至，當先補肝俞，次三日，可刺肺之所行。刺畢，可靜神七日，慎勿大怒，怒必真氣卻散之。又或在下地甲子乙未失守者，即乙柔干，即上庚獨治之，亦名失守者，即天運孤主之，三年變癘，名曰金癘，其至待時也。","bh":"","notes":[],"pending":true},{"id":"sw72-10","tags":[],"yw":"詳其地數之等差，亦推其微甚，可知遲速爾。諸位乙庚失守，刺法同，肝欲平，即勿怒。假令壬午，剛柔失守，上壬未遷正，下丁獨然，即雖陽年，虧及不同，上下失守，相招其有期，差之微甚，各有其數也，律呂二角，失而不和，同音有日，微甚如見，三年大疫，當刺脾之俞，次三日，可刺肝之所出也。刺畢，靜神七日，勿大醉歌樂，其氣復散，又勿飽食，勿食生物，欲令脾實，氣無滯飽，無久坐，食無太酸，無食一切生物，宜甘宜淡。又或地下甲子，丁酉失守其位，未得中司，即氣不當位，下不與壬奉合者，亦名失守，非名合德，故柔不附剛，即地運不合，三年變癘，其刺法一如木疫之法。","bh":"","notes":[],"pending":true},{"id":"sw72-11","tags":[],"yw":"假令戊申，剛柔失守，戊癸雖火運，陽年不太過也，上失其剛，柔地獨主，其氣不正，故有邪干，迭移其位，差有淺深，欲至將合，音律先同，如此天運失時，三年之中，火疫至矣，當刺肺之俞。刺畢，靜神七日，勿大悲傷也，悲傷即肺動，而真氣復散也，人欲實肺者，要在息氣也。又或地下甲子，癸亥失守者，即柔失守位也，即上失其剛也，即亦名戊癸不相合德者也，即運與地虛，後三年變癘，即名火癘。是故立地五年，以明失守，以窮法刺，於是疫之與癘，即是上下剛柔之名也，窮歸一體也，即刺疫法，只有五法，即總其諸位失守，故只歸五行而統之也。","bh":"","notes":[],"pending":true},{"id":"sw72-12","tags":[],"yw":"黃帝曰∶餘聞五疫之至，皆相染易，無問大小，病狀相似，不施救療，如何可得不相移易者？岐伯曰∶不相染者，正氣存內，邪不可干，避其毒瓦斯，天牝從來，復得其往，氣出於腦，即不邪干。氣出於腦，即室先想心如日。欲將入於疫室，先想青氣自肝而出，左行於東，化作林木。次想白氣自肺而出，右行於西，化作戈甲。次想赤氣自心而出，南行於上，化作焰明。次想黑氣自腎而出，北行於下，化作水。次想黃氣自脾而出，存於中央，化作土。五氣護身之畢，以想頭上如北斗之煌煌，然後可入於疫室。","bh":"","notes":[],"pending":true},{"id":"sw72-13","tags":[],"yw":"又一法，於春分之日，日未出而吐之。又一法，於雨水日後，三浴以藥泄汗。又一法，小金丹方∶辰砂二兩，水磨雄黃一兩，葉子雌黃一兩，紫金半兩，同入合中，外固了，地一尺築地實，不用爐，不須藥制，用火二十斤之也，七日終，候冷七日取，次日出合子，埋藥地中七日，取出順日研之三日，煉白沙蜜爲丸，如梧桐子大，每日望東吸日華氣一口，冰水下一丸，和氣咽之，服十粒，無疫干也。黃帝問曰∶人虛即神遊失守位，使鬼神外干，是致夭亡，何以全真？願聞刺法。","bh":"","notes":[],"pending":true},{"id":"sw72-14","tags":[],"yw":"岐伯稽首再拜曰∶昭乎哉問！謂神移失守，雖在其體，然不致死，或有邪干，故令夭壽。只如厥陰失守，天以虛，人氣肝虛，感天重虛，即魂遊於上，邪干厥大氣，身溫猶可刺之，刺其足少陽之所過，次刺肝之俞。人病心虛，又遇君相二火司天失守，感而三虛，遇火不及，黑屍鬼犯之，令人暴亡，可刺手少陽之所過，復刺心俞。人脾病，又遇太陰司天失守，感而三虛，又遇土不及，青屍鬼邪犯之於人，令人暴亡，可刺足陽明之所過，復刺脾之俞。人肺病，遇陽明司天失守，感而三虛，又遇金不及，有赤屍鬼干人，令人暴亡，可刺手陽明之所過，復刺肺俞。","bh":"","notes":[],"pending":true},{"id":"sw72-15","tags":[],"yw":"人腎病，又遇太陽司天失守，感而三虛，又遇水運不及之年，有黃屍鬼干犯人正氣，吸人神魂，致暴亡，可刺足太陽之所過，復刺腎俞。黃帝問曰∶十二髒之相使，神失位，使神彩之不圓，恐邪干犯，治之可刺，願聞其要。岐伯稽首再拜曰∶悉乎哉，問至理，道真宗，此非聖帝，焉究斯源，是謂氣神合道，契符上天。心者，君主之官，神明出焉，可刺手少陰之源。肺者，相傅之官，治節出焉，可刺手太陰之源。肝者，將軍之官，謀慮出焉，可刺足厥陰之源。","bh":"","notes":[],"pending":true},{"id":"sw72-16","tags":[],"yw":"膽者，中正之官，決斷出焉，可刺足少陽之源。羶中者，臣使之官，喜樂出焉，可刺心包絡所流。脾爲諫議之官，知周出焉，可刺脾之源。胃爲倉廩之官，五味出焉，可刺胃之源。大腸者，傳道之官，變化出焉，可刺大腸之源。小腸者，受盛之官，化物出焉，可刺小腸之源。腎者，作強之官，伎巧出焉，刺其腎之源。三焦者，決瀆之官，水道出焉，刺三焦之源。膀胱者，州都之官，精液藏焉，氣化則能出矣，刺膀胱之源。凡此十二官者，不得相失也。","bh":"","notes":[],"pending":true},{"id":"sw72-17","tags":[],"yw":"是故刺法有全神養真之旨，亦法有修真之道，非治疾也，故要修養和神也。道貴常存，補神固根，精氣不散，神守不分，然即神守而雖不去，亦能全真，人神不守，非達至真，至真之要，在乎天玄，神守天息，復入本元，命曰歸宗。<目錄>卷第二十一","bh":"","notes":[],"pending":true}]},
{"id":"sw73","book":"素问","no":73,"title":"本病论","titleTw":"本病論","tags":["yunqi","bingji","yinyang"],"brief":"","pending":true,"sections":[{"id":"sw73-1","tags":[],"yw":"黃帝問曰∶天元九窒，餘已知之，願聞氣交，何名失守？岐伯曰∶謂其上下升降，遷正退位，各有經論，上下各有不前，故名失守也。是故氣交失易位，氣交乃變，變易非常，即四時失序，萬化不安，變民病也。帝曰∶升降不前，願聞其故，氣交有變，何以明知？岐伯曰∶昭乎問哉！明乎道矣。氣交有變，是爲天地機，但欲降而不得降者，地窒刑之。又有五運太過，而先天而至者，即交不前，但欲升而不得其升，中運抑之，但欲降而不得其降，中運抑之。","bh":"","notes":[],"pending":true},{"id":"sw73-2","tags":[],"yw":"於是有升之不前，降之不下者，有降之不下，升而至天者，有升降俱不前，作如此之分別，即氣交之變，變之有異，常各各不同，災有微甚者也。帝曰，願聞氣交遇會勝抑之由，變成民病，輕重何如？岐伯曰∶勝相會，抑伏使然。是故辰戌之歲，木氣升之，主逢天柱，勝而不前。又遇庚戌，金運先天，中運勝之，忽然不前。木運升天，金乃抑之，升而不前，即清生風少，肅殺於春，露霜復降，草木乃萎。民病溫疫早發，咽嗌乃干，四肢滿，肢節皆痛。","bh":"","notes":[],"pending":true},{"id":"sw73-3","tags":[],"yw":"久而化鬱，即大風摧拉，折隕鳴紊。民病卒中偏痹，手足不仁。是故巳亥之歲，君火升天，主窒天蓬，勝之不前。又厥陰木遷正，則少陰未得升天，水運以至其中者。君火欲升，而中水運抑之，升之不前，即清寒復作，冷生旦暮。民病伏陽，而內生煩熱，心神驚悸，寒熱間作。日久成鬱，即暴熱乃至，赤風腫翳，化疫，溫癘暖作，赤氣彰而化火疫，皆煩而躁渴，渴甚治之以泄之可止。是故子午之歲，太陰升天，主窒天衝，勝之不前。又或遇壬子，木運先天而至者，中木遇抑之也。","bh":"","notes":[],"pending":true},{"id":"sw73-4","tags":[],"yw":"升天不前，即風埃四起，時舉埃昏，雨溼不化。民病風厥涎潮，偏痹不隨，脹滿。久而伏鬱，即黃埃化疫也，民病夭亡，臉肢府黃膽滿閉，溼令弗布，雨化乃微。是故丑未之年，少陽升天，主窒天蓬，勝之不前。又或遇太陰未遷正者，即少陽未升天也，水運以至者。升天不前，即寒反布，凜冽如冬，水復涸，冰再結，暄暖乍作，冷復布之，寒暄不時。民病伏陽在內，煩熱生中，心神驚駭，寒熱間爭。以成久鬱，即暴熱乃生，赤風氣瞳翳，化成鬱癘，乃化作伏熱內煩，痹而生厥，甚則血溢。","bh":"","notes":[],"pending":true},{"id":"sw73-5","tags":[],"yw":"是故寅申之年，陽明升天，主窒天英，勝之不前。又或遇戊申戊寅，火運先天而至。金欲升天，火運抑之，升之不前，實時雨不降，西風數舉，鹹滷燥生。民病上熱，喘嗽血溢。久而化鬱，即白埃翳霧，清生殺氣，民病脅滿悲傷，寒鼽嚏嗌干，手拆皮膚燥。是故卯酉之年，太陽升天，主窒天芮，勝之不前。又遇陽明未遷正者，即太陽未升天也，土運以至。水欲升天，土運抑之，升之不前，即溼而熱蒸，寒生兩間。民病注下，食不及化。久而成鬱，冷來客熱，冰雹卒至。","bh":"","notes":[],"pending":true},{"id":"sw73-6","tags":[],"yw":"民病厥逆而噦，熱生於內，氣痹於外，足脛疼，反生心悸懊熱，暴煩而復厥。黃帝曰∶升之不前，餘已盡知其旨。願聞降之不下，可得明乎？岐伯曰∶悉乎哉問！是之謂天地微旨，可以盡陳斯道，所謂升已必降也。至天三年，次歲必降，降而入地，始爲左間也。如此升降往來，命之六紀者矣。是故丑未之歲，厥陰降地，主窒地，勝而不前。又或遇少陰未退位，即厥陰未降下，金運以至中。金運承之，降之未下，抑之變鬱，木欲降下，金承之，降而不下，蒼埃遠見，白氣承之，風舉埃昏，清躁行殺，霜露復下，肅殺布令。","bh":"","notes":[],"pending":true},{"id":"sw73-7","tags":[],"yw":"久而不降，抑之化鬱，即作風躁相伏，暄而反清，草木萌動，殺霜乃下，蟄蟲未見，懼清傷髒。是故寅申之歲，少陰降地，主窒地玄，勝之不入。又或遇丙申丙寅，水運太過，先天而至。君火欲降，水運承之，降而不下，即彤雲才見，黑氣反生，暄暖如舒，寒常布雪，凜冽復作，天雲慘悽。久而不降，伏之化鬱，寒勝復熱，赤風化疫，民病面赤心煩，頭痛目眩也，赤氣彰而溫病欲作也。是故卯酉之歲，太陰降地，主窒地蒼，勝之不入。又或少陽未退位者，即太陰未得降也，或木運以至。","bh":"","notes":[],"pending":true},{"id":"sw73-8","tags":[],"yw":"木運承之，降而不下，即黃雲見而青霞彰，鬱蒸作而大風，霧翳埃勝，折損乃作。久而不降也，伏之化鬱，天埃黃氣，地布溼蒸，民病四肢不舉，昏眩肢節痛，腹滿填臆。是故辰戌之歲，少陽降地，主窒地玄，勝之不入。又或遇水運太過，先天而至也。水運承之，水降不下，即彤雲才見，黑氣反生，暄暖欲生，冷氣卒至，甚即冰雹也。久而不降，伏之化鬱，冷氣復熱，赤風化疫，民病面赤心煩，頭痛目眩也，赤氣彰而熱病欲作也。是故巳亥之歲，陽明降地，主窒地彤，勝而不入。","bh":"","notes":[],"pending":true},{"id":"sw73-9","tags":[],"yw":"又或遇太陰未退位，即少陽未得降，即火運以至之。火運承之不下，即天清而肅，赤氣乃彰，暄熱反作。民皆昏倦，夜臥不安，咽干引飲，懊熱內煩，天清朝暮，暄還復作。久而不降，伏之化鬱，天清薄寒，遠生白氣。民病掉眩，手足直而不仁，兩脅作痛，滿目KTKT。是故子午之年，太陽降地，主窒地阜勝之，降而不入。又或遇土運太過，先天而至。土運承之，降而不入，即天彰黑氣，暝暗悽慘，才施黃埃而布溼，寒化令氣，蒸溼復令。久而不降，伏之化鬱，民病大厥，四肢重怠，陰萎少力，天布沉陰，蒸溼間作。","bh":"","notes":[],"pending":true},{"id":"sw73-10","tags":[],"yw":"帝曰∶升降不前，晰知其宗，願聞遷正，可得明乎？岐伯曰∶正司中位，是謂遷正位，司天不得其遷正者，即前司天以過交司之日。即遇司天太過有餘日也，即仍舊治天數，新司天未得遷正也。厥陰不遷正，即風暄不時，花卉萎瘁，民病淋溲，目系轉，轉筋喜怒，小便赤。風欲令而寒由不去，溫暄不正，春正失時。少陰不遷正，即冷氣不退，春冷後寒，暄暖不時。民病寒熱，四肢煩痛，腰脊強直。木氣雖有餘，位不過於君火也。太陰不遷正，即雲雨失令，萬物枯焦，當生不發。","bh":"","notes":[],"pending":true},{"id":"sw73-11","tags":[],"yw":"民病手足肢節腫滿，大腹水腫，填臆不食，飧泄脅滿，四肢不舉。雨化欲令，熱猶治之，溫煦於氣，亢而不澤。少陽不遷正，即炎灼弗令，苗莠不榮，酷暑於秋，肅殺晚至，霜露不時。民病瘧骨熱，心悸驚駭，甚時血溢。陽明不遷正，則暑化於前，肅殺於後，草木反榮。民病寒熱鼽嚏，皮毛折，爪甲枯焦，甚則喘嗽息高，悲傷不樂。熱化乃布，燥化未令，即清勁未行，肺金復病。太陽不遷正，即冬清反寒，易令於春，殺霜在前，寒冰於後，陽光復治，凜冽不作，雲待時。","bh":"","notes":[],"pending":true},{"id":"sw73-12","tags":[],"yw":"民病溫癘至，喉閉溢干，煩燥而渴，喘息而有音也。寒化待燥，猶治天氣，過失序，與民作災。帝曰∶遷正早晚，以命其旨，願聞退位，可得明哉？岐伯曰∶所謂不退者，即天數未終，即天數有餘，名曰復布政，故名曰再治天也，即天令如故而不退位也。厥陰不退位，即大風早舉，時雨不降，溼令不化，民病溫疫，疵廢風生，民病皆肢節痛，頭目痛，伏熱內煩，咽喉干引飲。少陰不退位，即溫生春冬，蟄蟲早至，草木發生，民病膈熱咽干，血溢驚駭，小便赤澀，丹瘤瘡瘍留毒。","bh":"","notes":[],"pending":true},{"id":"sw73-13","tags":[],"yw":"太陰不退位，而取寒暑不時，埃昏布作，溼令不去，民病四肢少力，食飲不下，泄注淋滿，足脛寒，陰萎閉塞，失溺小便數。少陽不退位，即熱生於春，暑乃後化，冬溫不凍，流水不冰，蟄蟲出見，民病少氣，寒熱更作，便血上熱，小腹堅滿，小便赤沃，甚則血溢。陽明不退位，即春生清冷，草木晚榮，寒熱間作，民病嘔吐暴注，食飲不下，大便干燥，四肢不舉，目瞑掉眩。帝曰∶天歲早晚，餘以知之，願聞地數，可得聞乎？岐伯曰∶地下遷正升天及退位不前之法，即地土產化，萬物失時之化也。","bh":"","notes":[],"pending":true},{"id":"sw73-14","tags":[],"yw":"帝曰∶餘聞天地二甲子，十干十二支。上下經緯天地，數有迭移，失守其位，可得昭乎？岐伯曰∶失之迭位者，謂雖得歲正，未得正位之司，即四時不節，即生大疫。注《玄珠密語》雲∶陽年三十年，除六年天刑，計有太過二十四年，除此六年，皆作太過之用，令不然之旨。今言迭支迭位，皆可作其不及也。假令甲子陽年，土運太窒，如癸亥天數有餘者，年雖交得甲子，厥陰猶尚治天，地已遷正，陽明在泉，去歲少陽以作右間，即厥陰之地陽明，故不相和奉者也。","bh":"","notes":[],"pending":true},{"id":"sw73-15","tags":[],"yw":"癸巳相會，土運太過，虛反受木勝，故非太過也，何以言土運太過，況黃鍾不應太窒，木既勝而金還復，金既復而少陰如至，即木勝如火而金復微，如此則甲己失守，後三年化成土疫，晚至丁卯，早至丙寅，土疫至也，大小善惡，推其天地，詳乎太一。又只如甲子年，如甲至子而合，應交司而治天，即下己卯未遷正，而戊寅少陽未退位者，亦甲己下有合也，即土運非太過，而木乃乘虛而勝土也，金次又行復勝之，即反邪化也。陰陽天地殊異爾，故其大小善惡，一如天地之法旨也。","bh":"","notes":[],"pending":true},{"id":"sw73-16","tags":[],"yw":"假令丙寅陽年太過，如乙丑天數有餘者，雖交得丙寅，太陰尚治天也，地已遷正，厥陰司地，去歲太陽以作右間，即天太陰而地厥陰，故地不奉天化也。乙辛相會，水運太虛，反受土勝，故非太過，即太簇之管，太羽不應，土勝而雨化，水復即風，此者丙辛失守其會，後三年化成水疫，晚至己巳，早至戊辰，甚即速，微即徐，水疫至也，大小善惡推其天地數，乃太乙遊宮。又只如丙寅年，丙至寅且合，應交司而治天，即辛巳未得遷正，而庚辰太陽未退位者，亦丙辛不合德也，即水運亦小虛而小勝，或有復，後三年化癘，名曰水癘，其狀如水疫，治法如前。","bh":"","notes":[],"pending":true},{"id":"sw73-17","tags":[],"yw":"假令庚辰陽年太過，如己卯天數有餘者，雖交得庚辰年也，陽明猶尚治天，地已遷正，太陰司地，去歲少陰以作右間，即天陽明而地太陰也，故地下奉天也。乙巳相會，金運太虛，反受火勝，故非太過也，即姑洗之管，太商不應，火勝熱化，水復寒刑，此乙庚失守，其後三年化成金疫也，速至壬午，徐至癸未，金疫至也，大小善惡，推本年天數及太一也。又只如庚辰，如庚至辰，且應交司而治天，即下乙未未得遷正者，即地甲午少陰未退位者，且乙庚不合德也，即下乙未，干失剛，亦金運小虛也，有小勝或無復，後三年化癘，名曰金癘，其狀如金疫也，治法如前。","bh":"","notes":[],"pending":true},{"id":"sw73-18","tags":[],"yw":"假令壬午陽年太過，如辛巳天數有餘者，雖交後壬午年也，厥陰猶尚治天，地已遷正，陽明在泉，去歲丙申少陽以作右間，即天厥陰而地陽明，故地不奉天者也。丁辛相合會，木運太虛，反受金勝，故非太過也，即蕤賓之管，太角不應，金行燥勝，火化熱復，甚即速，微即徐，疫至大小善惡，推疫至之年天數及太一。又只如壬至午，且應交司而治之，即下丁酉未得遷正者，即地下丙申少陽未得退位者，見丁壬不合德也，即丁柔干失剛，亦木運小虛也，有小勝小復。","bh":"","notes":[],"pending":true},{"id":"sw73-19","tags":[],"yw":"後三年化癘，名曰木癘，其狀如風疫，法治如前。假令戊申陽年太過，如丁未天數太過者，雖交得戊申年也，太陰猶尚治天，地已遷正，厥陰在泉，去歲壬戌太陽以退位作右間，即天丁未，地癸亥，故地不奉天化也。丁癸相會，火運太虛，反受水勝，故非太過也，即夷則之管，上太徵不應，此戊癸失守其會，後三年化疫也，速至庚戌，大小善惡，推疫至之年天數及太一。又只如戊申，如戊至申，且應交司而治天，即下癸亥未得遷正者，即地下壬戌太陽未退位者，見戊癸未合德也，即下癸柔干失剛，見火運小虛也，有小勝或無復也，後三年化癘，名曰火癘也，治法如前，治之法可寒之泄之。","bh":"","notes":[],"pending":true},{"id":"sw73-20","tags":[],"yw":"黃帝曰∶人氣不足，天氣如虛，人神失守，神光不聚，邪鬼干人，致有夭亡，可得聞乎？岐伯曰∶人之五髒，一髒不足，又會天虛，感邪之至也。人憂愁思慮即傷心，又或遇少陰司天，天數不及，太陰作接間至，即謂天虛也，此即人氣天氣同虛也。又遇驚而奪精，汗出於心，因而三虛，神明失守，心爲君主之官，神明出焉，神失守位，即神遊上丹田，在帝太一帝君泥丸宮下，神既失守，神光不聚，卻遇火不及之歲，有黑屍鬼見之，令人暴亡。人飲食勞倦即傷脾，又或遇太陰司天，天數不及，即少陽作接間至，即謂之虛也，此即人氣虛而天氣虛也。","bh":"","notes":[],"pending":true},{"id":"sw73-21","tags":[],"yw":"又遇飲食飽甚，汗出於胃，醉飽行房，汗出於脾，因而三虛，脾神失守，脾爲諫議之官，智周出焉，神既失守，神光失位而不聚也，卻遇土不及之年，或己年或甲年失守，或太陰天虛，青屍鬼見之，令人卒亡。人久坐溼地，強力入水即傷腎，腎爲作強之官，伎巧出焉，因而三虛，腎神失守，神志失位，神光不聚，卻遇水不及之年，或辛不會符，或丙年失守，或太陽司天虛，有黃屍鬼至，見之令人暴亡。人或恚怒，氣逆上而不下，即傷肝也。又遇厥陰司天，天數不及，即少陰作接間至，是謂天虛也，此謂天虛人虛也。","bh":"","notes":[],"pending":true},{"id":"sw73-22","tags":[],"yw":"又遇疾走恐懼，汗出於肝，肝爲將軍之官，謀慮出焉，神位失守，神光不聚，又遇木不及年，或丁年不符，或壬年失守，或厥陰司天虛也，有白屍鬼見之，令人暴亡也。以上五失守者，天虛而人虛也，神遊失守其位，即有五屍鬼干人，令人暴亡也，謂之曰屍厥。人犯五神易位，即神光不圓也，非但屍鬼，即一切邪犯者，皆是神失守位故也。此謂得守者生，失守者死，得神者昌，失神者亡。<目錄>卷第二十二","bh":"","notes":[],"pending":true}]},
{"id":"sw74","book":"素问","no":74,"title":"至真要大论","titleTw":"至真要大論","tags":["yunqi","ci","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw74-1","tags":[],"yw":"黃帝問曰∶五氣交合，盈虛更作，餘知之矣。六氣分治，司天地者，其至何如？岐伯再拜對曰∶明乎哉問也！天地之大紀，人神之通應也。帝曰∶願聞上合昭昭，下合冥冥奈何？岐伯曰∶此道之所主，工之所疑也。帝曰∶願聞其道也。岐伯曰∶厥陰司天，其化以風；少陰司天，其化以熱；太陰司天，其化以溼；少陽司天，其化以火；陽明司天，其化以燥；太陽司天，其化以寒。以所臨髒位，命其病者也。帝曰∶地化奈何？岐伯曰∶司天同候，間氣皆然。","bh":"","notes":[],"pending":true},{"id":"sw74-2","tags":[],"yw":"帝曰∶間氣何謂？岐伯曰∶司左右者，是謂間氣也。帝曰∶何以異之？岐伯曰∶主歲者紀歲，間氣者紀步也。帝曰∶善。歲主奈何？岐伯曰∶厥陰司天爲風化，在泉爲酸化，司氣爲蒼化，間氣爲動化。少陰司天爲熱化，在泉爲苦化，不司氣化，居氣爲灼化。太陰司天爲溼化，在泉爲甘化，司氣爲化，間氣爲柔化。少陽司天爲火化，在泉爲苦化，司氣爲丹化，間氣爲明化。陽明司天爲燥化，在泉爲辛化，司氣爲素化，間氣爲清化。太陽司天爲寒化，在泉爲鹹化，司氣爲玄化，間氣爲藏化。","bh":"","notes":[],"pending":true},{"id":"sw74-3","tags":[],"yw":"故治病者，必明六化分治，五味五色所生，五髒所宜，乃可以言盈虛病生之緒也。帝曰∶厥陰在泉而酸化先，餘知之矣。風化之行也何如？岐伯曰∶風行於地，所謂本也，餘氣同法。本乎天者，天之氣也，本乎地者，地之氣也，天地合氣，六節分而萬物化生矣。故曰∶謹候氣宜，無失病機。此之謂也。帝曰∶其主病何如？岐伯曰∶司歲備物，則無遺主矣。帝曰∶先歲物何也？岐伯曰∶天地之專精也。帝曰∶司氣者何如？岐伯曰∶司氣者主歲同，然有餘不足也。","bh":"","notes":[],"pending":true},{"id":"sw74-4","tags":[],"yw":"帝曰∶非司歲物何謂也？岐伯曰∶散也，故質同而異等也，氣味有薄濃，性用有躁靜，治保有多少，力化有淺深，此之謂也。帝曰∶歲主藏害何謂？岐伯曰∶以所不勝命之，則其要也。帝曰∶治之奈何？岐伯曰∶上淫於下，所勝平之，外淫於內，所勝治之。帝曰∶善。平氣何如？岐伯曰∶謹察陰陽所在而調之，以平爲期，正者正治，反者反治。帝曰∶夫子言察陰陽所在而調之，論言人迎與寸口相應，若引繩小大齊等，命曰平，陰之所在寸口何如？岐伯曰∶視歲南北，可知之矣。","bh":"","notes":[],"pending":true},{"id":"sw74-5","tags":[],"yw":"帝曰∶願卒聞之。岐伯曰∶北政之歲，少陰在泉，則寸口不應；厥陰在泉，則右不應；太陰在泉，則左不應。南政之歲，少陰司天，則寸口不應；厥陰司天，則右不應；太陰司天，則左不應。諸不應者，反其診則見矣。帝曰∶尺候何如？岐伯曰∶北政之歲，三陰在下，則寸不應；三陰在上，則尺不應。南政之歲，三陰在天，則寸不應；三陰在泉，則尺不應。左右同。故曰∶知其要者，一言而終，不知其要，流散無窮。此之謂也。帝曰∶善。天地之氣，內淫而病何如？岐伯曰∶歲厥陰在泉，風淫所勝，則地氣不明，平野昧，草乃早秀。","bh":"","notes":[],"pending":true},{"id":"sw74-6","tags":[],"yw":"民病灑灑振寒，善伸數欠，心痛支滿，兩脅裏急，飲食不下，膈咽不通，食則嘔，腹脹善噫，得後與氣，則快然如衰，身體皆重。歲少陰在泉，熱淫所勝，則焰浮川澤，陰處反明。民病腹中常鳴，氣上衝胸，喘不能久立，寒熱皮膚痛，目瞑齒痛腫，惡寒發熱如瘧，少腹中痛腹大，蟄蟲不藏。歲太陰在泉，草乃早榮，溼淫所勝，則埃昏巖谷，黃反見黑，至陰之交。民病飲積，心痛，耳聾渾渾，嗌腫喉痹，陰病血見，少腹痛腫，不得小便，病衝頭痛，目似脫，項似拔，腰似折，髀不可以回，如結，如別。","bh":"","notes":[],"pending":true},{"id":"sw74-7","tags":[],"yw":"歲少陽在泉，火淫所勝，則焰明郊野，寒熱更至。民病注泄赤白，少腹痛溺赤，甚則血便。少陰同候。歲陽明在泉，燥淫所勝，則霧清暝。民病喜嘔，嘔有苦，善大息，心脅痛不能反側，甚則嗌干面塵，身無膏澤，足外反熱。歲太陽在泉，寒淫所勝，則凝肅慘慄。民病少腹控睾，引腰脊，上衝心痛，血
