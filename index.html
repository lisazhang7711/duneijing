<style>
/* ===== 读内经 · 样式 ===== */
:root{
  --paper:#f2e7cb;
  --paper2:#f8f1de;
  --paper-deep:#e9d9ab;
  --line:#d9c9a4;
  --line2:#ab9670;
  --ink:#171208;
  --ink2:#4b4028;
  --ink3:#6c6042;
  --zhu:#a32a17;
  --zhu-bg:#f6ddd0;
  --indigo:#17496f;
  --indigo-bg:#e4ecf2;
  --gold:#7d5310;
  --green:#2f6238;
  --sans:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",Georgia,serif;
  --fs:19px;
  /* 派生语义量：夜间模式只需覆盖这一组 */
  --paper-a:rgba(242,231,203,.95);
  --hover:#e9dcbc;
  --quote-bg:#f8f1d9;
  --txt2:#221c0e;
  --txt3:#332a17;
  --flash:#eed68c;
  --highlight:#e9c96b;
  --th-bg:#eadcbb;
  --src-t:#481f16;
  --node-bg:#f7efd8;
  --svg-line:#685c46;
  --scroll:#b0a17f;
}

/* ---------- 夜间模式 ---------- */
body.night{
  --paper:#12100a;
  --paper2:#1d1a12;
  --paper-deep:#2b2414;
  --line:#3c3a30;
  --line2:#5c5943;
  --ink:#efe6cc;
  --ink2:#cac0a4;
  --ink3:#a89e82;
  --zhu:#ff8f76;
  --zhu-bg:#37211c;
  --indigo:#8fc6e8;
  --indigo-bg:#1a2029;
  --gold:#e5c164;
  --green:#93cb93;
  --paper-a:rgba(18,16,10,.95);
  --hover:#2e2a1e;
  --quote-bg:#262014;
  --txt2:#e8dec2;
  --txt3:#d8cdad;
  --flash:#54451a;
  --highlight:#5a4a15;
  --th-bg:#2b2618;
  --src-t:#f4cdc3;
  --node-bg:#1f1c13;
  --svg-line:#918a76;
  --scroll:#514d3e;
}
body.night img.oldchart-img{filter:brightness(.86) contrast(1.12) sepia(.2)}
/* 图片统一压成暖黄调，避免出现纯白块 */
#mer-fig img,#off-fig img,#mp-fig img,.oldchart-img{filter:sepia(.16) saturate(1.06) contrast(1.02)}
body.night .mer-chip.on,
body.night .wx-chip.on,
body.night .tool-btn.on,
body.night .tm.on,
body.night .mp-btn.on{color:#12100a}
/* 夜间主题切换按钮：宽度自适应文字，避免「夜间 / 日间」两字被挤偏 */
#btn-theme{min-width:46px;text-align:center}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:var(--fs);
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:9px;
  height:52px;padding:0 14px;
  background:var(--paper-a);
  backdrop-filter:blur(8px);
  border-bottom:2px solid var(--line2);
  /* 窄屏时整条横向滚动，不挤压按钮导致文字折行竖排 */
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
#topbar::-webkit-scrollbar{display:none}
.brand{
  font-size:19px;font-weight:700;letter-spacing:.08em;color:var(--ink);
  white-space:nowrap;
}
.brand em{font-style:normal;color:var(--zhu)}
.navbtn{
  border:none;background:none;color:var(--ink2);
  font-size:15px;padding:5px 2px;border-bottom:2px solid transparent;
  letter-spacing:.03em;
  /* 三字以上标题一律单行横排，不折行 */
  white-space:nowrap;flex:0 0 auto;line-height:1.2;
}
.navbtn:hover{color:var(--ink)}
.navbtn.on{color:var(--zhu);border-bottom-color:var(--zhu);font-weight:700}
.spacer{flex:1 1 auto;min-width:0}
#topbar>.brand,#topbar>span{flex:0 0 auto;white-space:nowrap}
#q{
  flex:0 1 132px;min-width:96px;
  padding:4px 8px;font-size:13.5px;font-family:var(--sans);
  border:1px solid var(--line2);border-radius:4px;background:var(--paper2);
  color:var(--ink);outline:none;
}
#q:focus{border-color:var(--zhu)}
.tool-btn{
  border:1px solid var(--line2);background:var(--paper2);
  color:var(--ink2);font-size:12.5px;font-family:var(--sans);
  padding:3px 6px;border-radius:3px;letter-spacing:.02em;
  white-space:nowrap;flex:0 0 auto;line-height:1.5;
}
.tool-btn:hover{border-color:var(--zhu);color:var(--zhu)}
.tool-btn.on{background:var(--zhu);border-color:var(--zhu);color:#fdf4dc}
/* 目录按钮：主色实底，与普通工具按钮区分 */
#btn-toc{background:var(--zhu);border-color:var(--zhu);color:#fdf4dc;font-weight:700;letter-spacing:.1em}
#btn-toc:hover{color:#fff;border-color:var(--zhu)}
body.night #btn-toc{color:#16130c}
/* 返回阅读：主色实底、加大，第一眼可见 */
[id^="viz-close"]{background:var(--zhu);border-color:var(--zhu);color:#fdf4dc;font-weight:700;padding:5px 14px;letter-spacing:.06em}
[id^="viz-close"]:hover{color:#fff;border-color:var(--zhu)}
body.night [id^="viz-close"]{color:#16130c}
/* 阅读原文：顶栏互动按钮（靛蓝描边） */
.orig-btn{border-color:var(--indigo);color:var(--indigo)}
.orig-btn:hover{background:var(--indigo);border-color:var(--indigo);color:#f2e7cb}
body.night .orig-btn:hover{color:#12100a}

/* ---------- 布局 ---------- */
#wrap{display:flex;height:calc(100vh - 78px);overflow:hidden}
#toc{
  width:242px;flex:0 0 242px;overflow-y:auto;
  border-right:1px solid var(--line);background:var(--paper2);
  padding:12px 0 40px;
}
#main{flex:1;overflow-y:auto;padding:0 0 120px}
#aside{
  width:312px;flex:0 0 312px;overflow-y:auto;
  border-left:1px solid var(--line);background:var(--paper2);
}
#main.narrow{max-width:940px;margin:0 auto}
body.hide-toc #toc{display:none}
body.hide-aside #aside{display:none}

/* 目录收缩把手：常驻页面左缘 */
#toc-handle{
  position:fixed;left:0;top:44%;z-index:70;width:24px;padding:8px 0;
  border:1px solid var(--line2);border-left:none;background:var(--paper2);
  color:var(--ink3);cursor:pointer;border-radius:0 6px 6px 0;
  font-size:11px;line-height:1.35;text-align:center;font-family:var(--sans);
}
#toc-handle:hover{color:var(--zhu);border-color:var(--zhu)}

/* 古籍经络图 */
.oldchart-wrap{padding:10px}
.oldchart-img{width:100%;display:block;border-radius:3px;box-shadow:0 1px 6px rgba(60,45,20,.14)}
.oldchart-cap{
  font-family:var(--sans);font-size:11px;color:var(--ink3);
  letter-spacing:.05em;padding:7px 2px 2px;text-align:center;
}
.oldchart-empty{
  padding:46px 26px;font-family:var(--sans);font-size:13px;
  color:var(--ink3);text-align:center;line-height:2;
}

/* 阅读栏宽度：仿「阅读模式」三档 */
body.w-wide #main .inner{max-width:1180px}
body.w-mid  #main .inner{max-width:860px}
body.w-nar  #main .inner{max-width:660px}
#main .inner{margin:0 auto;padding:34px 42px 0}

/* ---------- 目录 ---------- */
.toc-book{
  padding:8px 16px 4px;font-size:13px;color:var(--ink3);
  font-family:var(--sans);letter-spacing:.14em;
}
.toc-item{
  display:flex;align-items:baseline;gap:7px;
  padding:5px 16px;font-size:15px;color:var(--ink2);
  border-left:3px solid transparent;cursor:pointer;line-height:1.5;
}
.toc-item:hover{background:var(--hover);color:var(--ink)}
.toc-item.on{
  background:var(--zhu-bg);color:var(--zhu);font-weight:700;
  box-shadow:inset 0 0 0 1px var(--zhu-bg);
  border-left-color:var(--zhu);
}
.toc-no{
  font-family:var(--sans);font-size:11px;color:var(--ink3);
  min-width:20px;text-align:right;
}
.toc-item.on .toc-no{color:var(--zhu)}

/* ---------- 篇章头 ---------- */
.crumb{
  font-family:var(--sans);font-size:12.5px;color:var(--ink3);
  letter-spacing:.06em;margin-bottom:14px;
}
.crumb b{color:var(--ink2);font-weight:600}
.ch-title{
  font-size:31px;font-weight:700;letter-spacing:.1em;margin:0 0 4px;
}
.ch-sub{
  font-family:var(--sans);font-size:13px;color:var(--ink3);
  letter-spacing:.05em;margin-bottom:12px;
}
.ch-brief{
  background:var(--paper2);border:1px solid var(--line);
  border-left:4px solid var(--gold);
  padding:12px 15px;border-radius:3px;
  font-size:15.5px;color:var(--ink2);line-height:1.85;margin-bottom:8px;
}
.ch-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 22px}
.tg{
  font-family:var(--sans);font-size:11.5px;padding:2px 8px;border-radius:11px;
  border:1px solid currentColor;letter-spacing:.05em;
}

/* ---------- 段落卡 ---------- */
.sec{
  border-top:1px solid var(--line);padding:20px 0 22px;position:relative;
}
.sec:first-of-type{border-top:none}
.sec-bar{
  display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;
}
.sec-no{
  font-family:var(--sans);font-size:11px;color:var(--gold);font-weight:600;
  letter-spacing:.05em;
  background:var(--paper2);border:1px solid var(--line2);border-radius:10px;
  padding:2px 8px;
}
.mini-btn{
  font-family:var(--sans);font-size:11.5px;padding:1.5px 8px;
  border:1px solid var(--line2);border-radius:11px;background:var(--paper2);
  color:var(--ink2);letter-spacing:.04em;
}
.mini-btn:hover{border-color:var(--zhu);color:var(--zhu)}
.mini-btn.mer{border-color:var(--indigo);color:var(--indigo);font-weight:600}
.mini-btn.off{border-color:var(--gold);color:var(--gold);font-weight:600}
.mini-btn.man{border-color:var(--green);color:var(--green);font-weight:600}
.mini-btn.hi{background:var(--zhu);color:#fdf4dc;border-color:var(--zhu)}

/* ---------- 图文互鉴（正文内的图示入口） ---------- */
.tzwj{
  margin:0 0 24px;border:1px solid var(--line2);border-radius:12px;
  background:var(--paper2);overflow:hidden;
}
.tzwj-h{
  display:flex;align-items:center;gap:8px;padding:9px 14px;
  border-bottom:1px dashed var(--line2);background:var(--zhu-bg);
  font-family:var(--sans);font-size:13px;font-weight:700;
  letter-spacing:.14em;color:var(--zhu);
}
.tzwj-ic{font-size:13px;line-height:1}
.tzwj-h i{
  font-style:normal;margin-left:auto;font-weight:400;
  font-size:11.5px;letter-spacing:.06em;color:var(--ink3);
}
.tzwj-b{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px}
.tzwj-bt{
  flex:1 1 170px;min-width:152px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:3px;padding:10px 12px;
  border:1px solid var(--line2);border-radius:10px;background:var(--paper);
  transition:border-color .15s,background .15s,transform .15s;
}
.tzwj-bt b{
  font-family:var(--sans);font-size:13.5px;font-weight:700;
  letter-spacing:.05em;color:var(--ink);
}
.tzwj-bt em{
  font-style:normal;font-family:var(--sans);font-size:11.5px;
  letter-spacing:.03em;color:var(--ink3);
}
.tzwj-bt:hover{
  border-color:var(--zhu);background:var(--zhu-bg);transform:translateY(-1px);
}
.tzwj-bt:hover b{color:var(--zhu)}
.tzwj-bt:hover em{color:var(--indigo)}

.yw{
  font-size:var(--fs);line-height:2.05;letter-spacing:.045em;
  color:var(--ink);text-align:justify;
  background:var(--paper-deep);
  padding:16px 18px;border-radius:4px;
  box-shadow:inset 0 0 0 1px var(--line2);
}
body.hide-bh .bh{display:none}
body.hide-note .notes{display:none}
.bh{
  margin-top:11px;padding:11px 14px;
  background:var(--quote-bg);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:3px;font-size:15.5px;line-height:1.9;color:var(--txt3);text-align:justify;
}
.bh::before{
  content:"翻译";display:inline-block;margin-right:8px;
  font-family:var(--sans);font-size:10.5px;color:var(--gold);
  border:1px solid var(--gold);border-radius:2px;padding:0 4px;
  vertical-align:2px;letter-spacing:.08em;
}
/* 术语 */
.t{
  color:var(--zhu);border-bottom:1px dotted var(--zhu);
  cursor:pointer;transition:background .12s;
}
.t:hover{background:var(--zhu-bg)}
.t.on{background:var(--highlight);font-weight:600}
.notes{margin-top:11px}
.pend{color:var(--ink3,#8b8f9a);font-style:italic;opacity:.72}
.ch-brief.pend{font-size:13px}
.nt{
  display:flex;gap:9px;font-size:14.5px;line-height:1.8;
  color:var(--ink2);padding:3px 0;
}
.nt-w{
  flex:0 0 auto;font-family:var(--sans);font-size:11px;
  width:22px;height:22px;line-height:20px;text-align:center;
  border:1px solid var(--line2);border-radius:50%;
  color:var(--ink3);margin-top:5px;
}
.nt-w.x{color:#6a4699;border-color:#6a4699;font-weight:600}
.nt-w.y{color:var(--green);border-color:var(--green);font-weight:600}
.nt-w.a{color:var(--gold);border-color:var(--gold);font-weight:600}
.sec.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{background:var(--flash)}100%{background:transparent}}

/* ---------- 右栏 ---------- */
.aside-hd{
  padding:13px 16px 9px;border-bottom:1px solid var(--line);
  font-family:var(--sans);font-size:12px;color:var(--ink3);
  letter-spacing:.16em;display:flex;justify-content:space-between;align-items:center;
}
.aside-hd button{
  border:none;background:none;color:var(--ink3);font-size:15px;padding:0 4px;
}
.aside-body{padding:14px 16px 40px}
.card-h{
  font-size:19px;font-weight:700;letter-spacing:.05em;margin:0 0 2px;
}
.card-py{
  font-family:var(--sans);font-size:12px;color:var(--ink3);letter-spacing:.1em;
}
.card-cat{
  display:inline-block;font-family:var(--sans);font-size:11px;
  padding:1px 8px;border-radius:10px;margin:9px 0 10px;
  border:1px solid currentColor;color:var(--indigo);
}
.card-def{font-size:15px;line-height:1.95;color:var(--txt2);text-align:justify}
.card-link{
  margin-top:14px;font-family:var(--sans);font-size:12.5px;
  color:var(--indigo);cursor:pointer;border-top:1px dashed var(--line2);
  padding-top:9px;
}
.card-link:hover{color:var(--zhu)}
.empty{color:var(--ink3);font-size:14px;font-family:var(--sans);line-height:1.9}
.occ{
  font-family:var(--sans);font-size:12.5px;color:var(--ink2);
  padding:7px 0;border-bottom:1px dashed var(--line);
}
.occ:hover{color:var(--zhu);cursor:pointer}
.occ b{color:var(--ink3);font-weight:400;font-size:11px;margin-right:6px}

/* ---------- 全屏可视化视图 ---------- */
#viz{display:none;height:calc(100vh - 78px);overflow-y:auto;background:var(--paper2)}
#viz.on{display:block}
#result{height:calc(100vh - 78px);overflow-y:auto;background:var(--paper2)}
body.viz #wrap{display:none}
.viz-head{
  padding:18px 30px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;background:var(--paper-a);
  backdrop-filter:blur(6px);z-index:5;
}
.viz-head h2{margin:0;font-size:22px;letter-spacing:.12em}
.viz-head p{margin:0;font-family:var(--sans);font-size:12.5px;color:var(--ink3)}
.viz-body{display:flex;gap:0;align-items:flex-start;padding:18px 30px 60px}

/* 经络图 */
#mer-fig{flex:0 0 430px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
#mer-panel{flex:1;padding:0 0 0 26px;min-width:300px}
.mer-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mer-chip{
  font-family:var(--sans);font-size:12.5px;padding:3px 10px;border-radius:12px;
  border:1px solid var(--line2);background:var(--paper2);color:var(--ink2);
}
.mer-chip:hover{border-color:var(--zhu)}
.mer-chip.on{color:#fdf4dc;border-color:transparent}
.mer-chip .dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;
}
.view-sw{display:flex;gap:6px;margin-bottom:12px}
.mp-name{font-size:20px;font-weight:700;margin:0 0 3px}
.mp-sub{font-family:var(--sans);font-size:12px;color:var(--ink3);letter-spacing:.08em;margin-bottom:12px}
.mp-h{
  font-family:var(--sans);font-size:11.5px;color:var(--ink3);
  letter-spacing:.14em;margin:14px 0 5px;
}
.mp-t{font-size:15.5px;line-height:1.95;color:var(--txt2);text-align:justify}
.mp-dis li{
  font-size:15px;line-height:1.9;color:var(--txt3);margin-bottom:6px;
  padding-left:12px;border-left:2px solid var(--line2);
}
.mer-path{fill:none;stroke-width:2.6;stroke-linecap:round;opacity:.58;cursor:pointer;transition:opacity .15s,stroke-width .15s}
.mer-path:hover{opacity:.88}
.mer-path.on{opacity:1;stroke-width:4}
.body-line{fill:none;stroke:var(--svg-line);stroke-linecap:round;stroke-linejoin:round}
.body-fill{fill:var(--node-bg);stroke:var(--svg-line);stroke-width:1.2}
.pt-dot{fill:var(--paper2);stroke:var(--zhu);stroke-width:1.5;cursor:pointer}
.pt-dot:hover,.pt-dot.on{fill:var(--zhu)}
.pt-lb{font-family:var(--sans);font-size:9px;fill:var(--ink2);pointer-events:none}
#forcebar{
  font-family:var(--sans);font-size:11px;fill:var(--ink3);letter-spacing:.1em;
}

/* 十二官 */
#off-fig{flex:0 0 560px}
#off-panel{flex:1;padding:0 0 0 20px;min-width:270px}
.off-node{cursor:pointer}
.off-node circle{transition:stroke-width .15s,fill .15s}
.off-node:hover circle.off-c{stroke-width:2.5}
.off-nm{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#fdf4dc;letter-spacing:.04em}
.off-rk{font-family:var(--sans);font-size:10px;text-anchor:middle;fill:var(--ink2)}

    let v = null;

  }

    const now = cur();
    Array.prototype.forEach.call(gate.querySelectorAll(".mg-card"), function (b) {
      b.classList.toggle("cur", b.getAttribute("data-m") === now);
    });

  }

    const bar = $("topbar");
    if (!bar || $("modeSwitch")) return;

      const next = (cur() === "desktop" ? "mp" : "desktop");

    if (asideBtn) origOn.aside = asideBtn.onclick;
    if (asideClose) origOn.asideClose = asideClose.onclick;

    if (m) {
      apply(m);
    } else {
      const sw = $("modeSwitch"); if (sw) sw.textContent = "选择版本";
    }
    openGate();

    Array.prototype.forEach.call(gate.querySelectorAll(".mg-card"), function (b) {
      b.onclick = function () {
        const m = this.dataset.m;
        save(m); gate.hidden = true; apply(m);
      };

    const gc = $("mgCancel");
    if (gc) gc.onclick = function () { gate.hidden = true; };

    });
    window.addEventListener("resize", function () { syncNarrow(); syncTopbar(); });
    window.addEventListener("orientationchange", function () { setTimeout(function () { syncNarrow(); syncTopbar(); }, 300); });
  };
  NJModeBoot();
})();

        bh: "岐伯说：女子七岁时，肾气开始充盛，换牙，头发长得快。十四岁时天癸到来，任脉通畅，太冲脉充盛，月经按时来潮，所以能够生育。二十一岁时，肾气平匀充足，智齿生出，身高达到了顶点。二十八岁时，筋骨坚固，头发长到最盛，身体最为壮实。三十五岁时，阳明经脉之气衰退，面部开始憔悴，头发开始脱落。四十二岁时，三阳经脉之气从上部衰退，整个面部都憔悴了，头发开始变白。四十九岁时，任脉空虚，太冲脉衰少，天癸枯竭，月经停闭而地道不通，所以形体衰败，不能再生育了。",
        notes: [
          { w: "训", t: "天癸：肾精充盈到一定程度后产生的、促成生殖机能成熟的物质。" },
          { w: "训", t: "地道不通：指月经停止。焦，通憔，枯槁不泽。" },
          { w: "按", t: "注意衰老的起点在「阳明脉衰」而不在肾。面部是阳明胃经所过，此处把消化吸收能力视作衰老的第一个可见窗口。" }
        ]
      },
      {
        id: "sw01-6", tags: ["zangxiang", "yang"],
        yw: "丈夫八歲，腎氣實，髮長齒更。二八，腎氣盛，天癸至，精氣溢瀉，陰陽和，故能有子。三八，腎氣平均，筋骨勁強，故真牙生而長極。四八，筋骨隆盛，肌肉滿壯。五八，腎氣衰，髮墮齒槁。六八，陽氣衰竭於上，面焦，髮鬢頒白。七八，肝氣衰，筋不能動，天癸竭，精少，腎藏衰，形體皆極。八八，則齒髮去。",
        bh: "男子八岁时，肾气充实，头发长得好，牙齿开始更换。十六岁时，肾气充盛，天癸到来，精气满溢而能外泄，男女阴阳交合，所以能有子。二十四岁时，肾气平匀充足，筋骨强劲有力，智齿生出，身高达到了顶点。三十二岁时，筋骨丰隆盛满，肌肉丰满壮实。四十岁时，肾气开始衰退，头发脱落，牙齿枯槁。四十八岁时，阳气从上部衰竭，面部憔悴，鬓发斑白。五十六岁时，肝气衰退，筋脉不能灵活活动，天癸枯竭，精液减少，肾脏衰败，形体都到了极点。六十四岁时，牙齿和头发就都脱落了。",
        notes: [
          { w: "按", t: "女七男八，是节律单位而非精确年限。同是一套节律倒数，女子自三十五岁而面始衰，男子自四十岁而齿始槁，都与阳明／阳气的可见表征挂钩。" }
        ]
      },
      {
        id: "sw01-7", tags: ["zangxiang"],
        yw: "腎者主水，受五藏六府之精而藏之，故五藏盛，乃能瀉。今五藏皆衰，筋骨解墮，天癸盡矣，故髮鬢白，身體重，行步不正，而無子耳。",
        bh: "肾主水液，接受并储藏五脏六腑的精气，所以五脏精气充盛，肾才能向外输泻精气。如今五脏都已衰退，筋骨松解无力，天癸枯竭，所以鬓发斑白，身体沉重，走路不稳，也就不能生育了。",
        notes: [
          { w: "义", t: "关键一句：「五藏盛，乃能泻」。肾不是孤立的水库，而是全身精气的共同账户。补的思路由此确立。" }
        ]
      },
      {
        id: "sw01-8", tags: ["yang", "shen"],
        yw: "黃帝曰：余聞上古有真人者，提挈天地，把握陰陽，呼吸精氣，獨立守神，肌肉若一，故能壽敝天地，無有終時，此其道生。中古之時，有至人者，淳德全道，和於陰陽，調於四時，去世離俗，積精全神，遊行天地之間，視聽八達之外。其次有聖人者，處天地之和，從八風之理，適嗜欲於世俗之間，無恚嗔之心，行不欲離於世，外不勞形於事，內無思想之患，以恬愉爲務，以自得爲功，形體不敝，精神不散，亦可以百數。其次有賢人者，法則天地，象似日月，辨列星辰，逆從陰陽，分別四時，將從上古合同於道，亦可使益壽而有極時。",
        bh: "黄帝说：我听说上古有称为真人的人，能提挈天地造化，把握阴阳的变化，呼吸天地精纯之气，独立守持精神，肌肉与形体浑然如一，所以寿命能与天地同久，没有终结的时候，这是他们得道而生的结果。中古时有称为至人的人，德行淳厚，道行完备，调和于阴阳，适应于四时的变迁，超脱世俗，蓄积精气保全精神，神游于天地之间，视听能达八方之外。其次有称为圣人的人，安居于天地的和气之中，顺从八风的变化规律，在世俗之间适度满足自己的嗜好与欲望，没有恼怒怨恨之心，行为不脱离世俗，外不让形体被事务劳累，内心没有思想上的忧患，以恬静愉悦为本务，以自得自足为功业，形体不衰败，精神不耗散，也可以活到百岁。再其次有称为贤人的人，以天地为法则，以日月运行为取象，分辨星辰的位次，顺从阴阳的消长，区别四时的变化，追随上古真人而合于道，也可以延益寿命，但有其极限。",
        notes: [
          { w: "按", t: "真人、至人、圣人、贤人，是四类阶梯，最下一档仍有「极时」。说明这是可达目标的梯度表，不是神话。" }
        ]
      }
    ]
  },

  {
    id: "sw02", book: "素问", no: 2, title: "四气调神大论", titleTw: "四氣調神大論",
    tags: ["yang", "wuxing", "zhize"],
    brief: "按春夏秋冬给出四套作息与情志方案，末尾落到「治未病」——全书最著名的一句纲领。",
    sections: [
      {
        id: "sw02-1", tags: ["yang", "wuxing"],
        yw: "春三月，此謂發陳，天地俱生，萬物以榮，夜臥早起，廣步於庭，被髮緩形，以使志生，生而勿殺，予而勿奪，賞而勿罰，此春氣之應，養生之道也。逆之則傷肝，夏爲寒變，奉長者少。",
        bh: "春季三个月，是推陈出新的季节，天地一同生发，万物欣欣向荣。应当晚睡早起，在庭院里大步散步，披散头发、松缓衣束，让情志随之生发；对待万物要促其生而不加杀伐，多给予而不去剥夺，多奖赏而不去惩罚。这是顺应春气、调养生气的方法。违背了就会损伤肝脏，到夏天发生寒性病变，供给夏季生长的力量就不足了。",
        notes: [
          { w: "训", t: "发陈：发散陈旧，推陈出新。被发，披散头发，取其舒松。" },
          { w: "按", t: "注意这里把「生而勿杀、予而勿夺」也说成养生之法——情志与待人方式被算进了养生技术清单。" }
        ]
      },
      {
        id: "sw02-2", tags: ["yang", "wuxing"],
        yw: "夏三月，此謂蕃秀，天地氣交，萬物華實，夜臥早起，無厭於日，使志無怒，使華英成秀，使氣得泄，若所愛在外，此夏氣之應，養長之道也。逆之則傷心，秋爲痎瘧，奉收者少，冬至重病。",
        bh: "夏季三个月，是万物繁茂秀美的季节，天地之气交合，万物开花结果。应当晚睡早起，不要厌恶日光，让情志不发怒，让容色像花一样秀美，让气机得以宣泄，好像所爱之物就在外边一样外向舒展。这是顺应夏气、调养长气的方法。违背了就会损伤心脏，到秋天发生疟疾之类的寒热病，供给秋季收敛的力量就不足，冬至时节就会重病。",
        notes: [{ w: "训", t: "蕃秀：繁茂秀丽。痎疟，疟疾的通称。" }]
      },
      {
        id: "sw02-3", tags: ["yang", "wuxing"],
        yw: "秋三月，此謂容平，天氣以急，地氣以明，早臥早起，與雞俱興，使志安寧，以緩秋刑，收斂神氣，使秋氣平，無外其志，使肺氣清，此秋氣之應，養收之道也。逆之則傷肺，冬爲飧泄，奉藏者少。",
        bh: "秋季三个月，是万物平定收敛的季节，天气转急，地气清明。应当早睡早起，与鸡的活动时间同步，让情志安宁，以缓和秋气的肃杀之刑，收敛神气，使秋气得以平和，不使情志外驰，使肺气清肃。这是顺应秋气、调养收气的方法。违背了就会损伤肺脏，到冬天发生完谷不化的泄泻，供给冬季闭藏的力量就不足。",
        notes: [{ w: "训", t: "容平：万物形态平定成熟。容，形态。飧泄，泻下物夹有不化谷物。" }]
      },
      {
        id: "sw02-4", tags: ["yang", "wuxing"],
        yw: "冬三月，此謂閉藏，水冰地坼，無擾乎陽，早臥晚起，必待日光，使志若伏若匿，若有私意，若已有得，去寒就溫，無泄皮膚，使氣亟奪，此冬氣之應，養藏之道也。逆之則傷腎，春爲痿厥，奉生者少。",
        bh: "冬季三个月，是万物闭藏的季节，水结冰，地冻裂，不要扰动阳气。应当早睡晚起，一定要等到日光出现才起身，让情志好像潜伏藏匿起来一样，好像怀有私意而不外露，好像已经得到了什么而满足；避开寒冷，趋近温暖，不要让皮肤开泄出汗，以免阳气屡屡被夺。这是顺应冬气、调养藏气的方法。违背了就会损伤肾脏，到春天发生痿弱厥冷的病证，供给春季生发的力量就不足。",
        notes: [
          { w: "训", t: "坼，音彻，裂开。亟，屡次。" },
          { w: "按", t: "四季作息的差别，本质是一件事：对皮肤开阖和出汗的管理。春天广步出汗，冬天无泄皮肤。" }
        ]
      },
      {
        id: "sw02-5", tags: ["wuxing", "zangxiang"],
        yw: "逆春氣，則少陽不生，肝氣內變。逆夏氣，則太陽不長，心氣內洞。逆秋氣，則太陰不收，肺氣焦滿。逆冬氣，則少陰不藏，腎氣獨沉。",
        bh: "违背了春气，少阳之气就不能生发，肝气在体内发生病变。违背了夏气，太阳之气就不能长养，心气在内虚怯不足。违背了秋气，太阴之气就不能收敛，肺气焦躁胀满。违背了冬气，少阴之气就不能闭藏，肾气独自沉衰。",
        notes: [
          { w: "义", t: "用少阳/太阳/太阴/少阴四组把四季与脏腑锁在一起——这是四时与藏象之间的固定接线。" }
        ]
      },
      {
        id: "sw02-6", tags: ["yang"],
        yw: "夫四時陰陽者，萬物之根本也。所以聖人春夏養陽，秋冬養陰，以從其根，故與萬物沉浮於生長之門。逆其根，則伐其本，壞其真矣。故陰陽四時者，萬物之終始也，死生之本也，逆之則災害生，從之則苛疾不起，是謂得道。",
        bh: "四时阴阳的变化，是万物生长收藏的根本。所以圣人在春夏调养生发之气，在秋冬调养收藏之阴，以顺从这个根本，因而能与万物一起在生长收藏的门户中沉浮出入。违背了这个根本，就是砍伐本源、败坏真气。所以阴阳四时的变化，是万物的终始，是死生的根本，违背了就产生灾害，顺从了就不会生重病，这叫做得道。",
        notes: [
          { w: "按", t: "「春夏养阳，秋冬养阴」常被误解为夏天吃热药冬天吃凉药。原意是：春夏要顺养「生、长」的功能，秋冬要顺养「收、藏」的功能。" }
        ]
      },
      {
        id: "sw02-7", tags: ["zhize", "yang"],
        yw: "是故聖人不治已病治未病，不治已亂治未亂，此之謂也。夫病已成而後藥之，亂已成而後治之，譬猶渴而穿井，鬥而鑄錐，不亦晚乎！",
        bh: "所以圣人不等到已经生病才去治疗，而是在疾病发生之前就加以预防；不等到已经动乱才去治理，而是在动乱发生之前就加以防范，说的就是这个。如果疾病已经形成才用药治疗，动乱已经发生才去治理，那就好比口渴了才去挖井，战斗已经开始了才去铸造兵器，不是太晚了吗！",
        notes: [
          { w: "义", t: "「治未病」三字的原始出处。注意它出现的位置——不是作为口号，而是四季养生论证链的末句，前提是顺时而养。" }
        ]
      }
    ]
  },

  {
    id: "sw03", book: "素问", no: 3, title: "生气通天论", titleTw: "生氣通天論",
    tags: ["yang", "bingji", "wuxing"],
    brief: "把阳气比作天空的太阳，再逐条推演阳气受损的六种路径。阳气病理学的总纲。",
    sections: [
      {
        id: "sw03-1", tags: ["yang"],
        yw: "黃帝曰：夫自古通天者，生之本，本於陰陽。天地之間，六合之內，其氣九州、九竅、五藏、十二節，皆通乎天氣。其生五，其氣三，數犯此者，則邪氣傷人，此壽命之本也。",
        bh: "黄帝说：自古以来，与天气相通是生命的根本，而这个根本又归结于阴阳。天地之间、四方上下之内，无论是地上的九州，还是人体的九窍、五脏、十二关节，都与天气相通。阴阳化生五行，又分为三阴三阳之气，屡次违犯这个规律，邪气就会伤害人体，所以这是寿命的根本所在。",
        notes: [{ w: "训", t: "六合：四方上下。十二节，双侧腕、肘、肩、髋、膝、踝共十二大关节。" }]
      },
      {
        id: "sw03-2", tags: ["yang"],
        yw: "陽氣者，若天與日，失其所則折壽而不彰，故天運當以日光明。是故陽因而上，衛外者也。",
        bh: "人体的阳气，好像天体中的太阳一样，如果失去了它应有的位次，人就会减损寿命而不显露生机，所以天体的运行应当有太阳的光明，人的生命也应当有阳气的温养。因此阳气是向上、向外运行的，起着护卫体表的作用。",
        notes: [
          { w: "按", t: "全书最著名的一个比喻。它把「阳气」的功能定义钉死了：向上 + 向外 + 卫外。" }
        ]
      },
      {
        id: "sw03-3", tags: ["bingji"],
        yw: "因於寒，欲如運樞，起居如驚，神氣乃浮。因於暑，汗，煩則喘喝，靜則多言，體若燔炭，汗出而散。因於濕，首如裹，濕熱不攘，大筋緛短，小筋弛長，緛短爲拘，弛長爲痿。因於氣，爲腫，四維相代，陽氣乃竭。",
        bh: "感受了寒邪，阳气应当像门轴的运转一样内守，如果起居躁动惊扰不安，神气就会向外浮越。感受了暑邪，就会出汗，烦躁时可见喘息有声，安静时则多言多语，身体像燃烧的炭一样发热，汗出之后热才散去。感受了湿邪，头部像被布裹住一样沉重，湿热不能消除，大筋就会收缩变短，小筋就会松弛变长，缩短的成为拘挛，弛长的成为痿弱。因于风气，会发生浮肿，四肢交替出现肿胀，阳气就会衰竭。",
        notes: [
          { w: "训", t: "緛，音软，缩短。弛长，松缓延长。四维，四肢。" },
          { w: "义", t: "寒、暑、湿、气四种病因，分别给出「神气浮/汗出/首如裹/肿」四组可辨识的主症，是一份症状鉴别表。" }
        ]
      },
      {
        id: "sw03-4", tags: ["bingji", "yang"],
        yw: "陽氣者，煩勞則張，精絕，闢積於夏，使人煎厥。目盲不可以視，耳閉不可以聽，潰潰乎若壞都，汩汩乎不可止。陽氣者，大怒則形氣絕，而血菀於上，使人薄厥。有傷於筋，縱，其若不容。汗出偏沮，使人偏枯。",
        bh: "阳气在过度烦劳的时候就会亢张外越，使阴精耗竭，这种情况重复累积到夏天，就会使人发生煎厥。表现为眼睛昏盲不能视物，耳窍闭塞不能听声，病情像堤防崩溃一样汹涌，像急流奔泻一样不可阻止。阳气在大怒的时候，会使形与气的功能阻绝，血郁积于上部，使人发生薄厥。如果损伤了筋脉，筋脉就会弛纵，肢体好像不受自己的支配。如果身体半侧出汗而另半侧不出汗，就会使人发生偏枯，即半身不遂。",
        notes: [
          { w: "训", t: "菀，音郁，郁积。沮，音举，阻止、不出。辟积，重复累积。" },
          { w: "义", t: "煎厥与薄厥：一因劳而生于夏，一因怒而发在急。都是「阳气失控」，但触发路径完全不同。" }
        ]
      },
      {
        id: "sw03-5", tags: ["yang", "bingji"],
        yw: "陽氣者，一日而主外，平旦人氣生，日中而陽氣隆，日西而陽氣已虛，氣門乃閉。是故暮而收拒，無擾筋骨，無見霧露，反此三時，形乃困薄。",
        bh: "阳气在一天之中主持于外：清晨人气开始生发，正午阳气最为隆盛，日落时阳气已经虚衰，汗孔的门户也就关闭了。所以到了傍晚就应当收敛阳气、拒守于内，不要扰动筋骨，不要接触雾气露水。如果违背了平旦、日中、日西这三个时段的阳气规律，形体就会被邪气困扰而衰薄。",
        notes: [
          { w: "按", t: "把一年压缩成一天。这也是子午流注一类时间医学的雏形。" }
        ]
      },
      {
        id: "sw03-6", tags: ["yang"],
        yw: "岐伯曰：陰者，藏精而起亟也；陽者，衛外而爲固也。陰不勝其陽，則脈流薄疾，並乃狂。陽不勝其陰，則五藏氣爭，九竅不通。是以聖人陳陰陽，筋脈和同，骨髓堅固，氣血皆從。",
        bh: "岐伯说：阴是内藏精气而不断地起来支援阳气的；阳是保卫体表而使身体固密的。如果阴不能克制阳气，脉中的气血流动就会急迫而快速，阳邪并于阳位就会发狂。如果阳不能克制阴气，五脏之气就会互相争扰，九窍就会不通畅。所以圣人调理阴阳，使筋脉和顺协调，骨髓坚固，气血都能顺从运行。",
        notes: [
          { w: "训", t: "起亟：不断地起来应接需求。亟，急也。" },
          { w: "义", t: "阴与阳在这里各给了一个动词定义：储备 + 支援（阴），屏蔽 + 固守（阳）。" }
        ]
      },
      {
        id: "sw03-7", tags: ["yang"],
        yw: "凡陰陽之要，陽密乃固，兩者不和，若春無秋，若冬無夏，因而和之，是謂聖度。故陽強不能密，陰氣乃絕；陰平陽祕，精神乃治；陰陽離決，精氣乃絕。",
        bh: "大凡阴阳的关键，在于阳气致密才能达到固密。二者不能协调，就好像只有春天而没有秋天、只有冬天而没有夏天一样。因此加以调和，就是圣人的法度。所以阳气过亢而不能固密，阴气就会随之竭绝；阴气平和，阳气固密，精神才能正常；阴阳分离决裂，精气也就随之竭尽了。",
        notes: [
          { w: "按", t: "「阴平阳秘」是中医最常被引用的一句原文，常被简化为「阴阳平衡」。原意更严：平的对象是阴（不虚不亢），秘的对象是阳（致密不散）。" }
        ]
      },
      {
        id: "sw03-8", tags: ["bingji", "wuxing"],
        yw: "陰之所生，本在五味；陰之五宮，傷在五味。是故味過於酸，肝氣以津，脾氣乃絕。味過於鹹，大骨氣勞，短肌，心氣抑。味過於甘，心氣喘滿，色黑，腎氣不衡。味過於苦，脾氣不濡，胃氣乃厚。味過於辛，筋脈沮弛，精神乃央。是故謹和五味，骨正筋柔，氣血以流，腠理以密，如是則骨氣以精，謹道如法，長有天命。",
        bh: "阴精的产生，来源于五味；而储藏阴精的五脏，又会被五味所伤害。所以过食酸味，肝气就会过盛而津溢，脾气就会衰竭。过食咸味，骨骼就会劳伤，肌肉短缩，心气受到抑郁。过食甘味，就会心气喘满，面色发黑，肾气失去平衡。过食苦味，脾气就不能濡润，胃气就会变得厚滞。过食辛味，筋脉就会败坏松弛，精神也会随之受损。因此谨慎地调和五味，骨骼就端正，筋脉就柔韧，气血得以畅行，腠理得以固密，这样骨气就精强有力，谨慎地遵循这些方法，就能享有天赋的寿命。",
        notes: [
          { w: "训", t: "五宫，五脏。沮，败坏。央，殃的通假，伤残。" },
          { w: "义", t: "五味既能养又能伤，判断标准是「各归所喜」。这是一组五行相克的实际应用：酸过则肝乘脾，咸过则肾乘心。" }
        ]
      }
    ]
  },

  {
    id: "sw05", book: "素问", no: 5, title: "阴阳应象大论", titleTw: "陰陽應象大論",
    tags: ["yinyang", "wuxing", "zangxiang", "zhenfa"],
    brief: "阴阳五行的方法论总纲。提出「治病必求于本」，并把清浊出入、气味形精的转化链讲透。",
    sections: [
      {
        id: "sw05-1", tags: ["yinyang"],
        yw: "黃帝曰：陰陽者，天地之道也，萬物之綱紀，變化之父母，生殺之本始，神明之府也。治病必求於本。",
        bh: "黄帝说：阴阳是天地间的普遍规律，是万物的纲领和法度，是变化的起源，是生长与消亡的根本，是一切神明变化所出的府库。治病一定要推求于阴阳这个根本。",
        notes: [
          { w: "按", t: "五个名词连用（纲纪/父母/本始/府），措辞极重。「治病必求于本」的「本」在此处有具体所指，不是泛泛的根本。" }
        ]
      },
      {
        id: "sw05-2", tags: ["yinyang"],
        yw: "故積陽爲天，積陰爲地。陰靜陽躁，陽生陰長，陽殺陰藏。陽化氣，陰成形。寒極生熱，熱極生寒。寒氣生濁，熱氣生清。清氣在下，則生飧泄；濁氣在上，則生䐜脹。此陰陽反作，病之逆從也。",
        bh: "所以阳气轻清上升而聚积成为天，阴气重浊下降而凝聚成为地。阴主静，阳主动；阳主生发，阴主成长；阳主肃杀，阴主闭藏。阳能化生出气，阴能构成形体。寒到极点会转化为热，热到极点会转化为寒。寒气凝聚而生浊阴，热气升散而生清阳。清阳之气当升而不升、反而陷在下，就会发生完谷不化的泄泻；浊阴之气当降而不降、反而滞在上，就会发生胸腹胀满。这就是阴阳的反向运行，也就是疾病的逆顺之别。",
        notes: [
          { w: "训", t: "䐜，音嗔，胀起。" },
          { w: "义", t: "「清气在下则为飧泄，浊气在上则为䐜胀」两句，是升降理论最实用的一对接线，脾胃病的处方由此分野。" }
        ]
      },
      {
        id: "sw05-3", tags: ["yinyang"],
        yw: "故清陽出上竅，濁陰出下竅；清陽發腠理，濁陰走五藏；清陽實四支，濁陰歸六府。",
        bh: "所以清阳之气出于上部的七窍，浊阴之液出于下部的二窍；清阳之气发散于腠理之间，浊阴之精内注于五脏之中；清阳之气充实于四肢，浊阴之水谷归于六腑。",
        notes: [
          { w: "按", t: "三组對應構成一張完整分配表：出路、居所、去向。背诵价值极高。" }
        ]
      },
      {
        id: "sw05-4", tags: ["bingji"],
        yw: "風勝則動，熱勝則腫，燥勝則幹，寒勝則浮，濕勝則濡瀉。",
        bh: "风气偏胜就会出现动摇震颤的症状，热气偏胜就会出现红肿的症状，燥气偏胜就会出现干枯的症状，寒气偏胜就会出现浮肿的症状，湿气偏胜就会出现濡润泄泻的症状。",
        notes: [
          { w: "按", t: "五字一组，把病因直接翻译成看得见的体征。这是《内经》里最短的一条鉴别口诀。" }
        ]
      },
      {
        id: "sw05-5", tags: ["zhenfa", "yinyang"],
        yw: "善診者，察色按脈，先別陰陽；審清濁，而知部分；視喘息，聽音聲，而知所苦；觀權衡規矩，而知病所主；按尺寸，觀浮沉滑澀，而知病所生。以治無過，以診則不失矣。",
        bh: "善于诊病的医生，观察气色、诊按脉象，首先辨别属阴属阳；审察面色的清浊，就能知道病变的部位；观看呼吸的喘息，听辨声音的变化，就能知道病者的痛苦所在；观察脉象的四时规矩，就能知道病变的主因；按切尺肤与寸口，观察脉象的浮沉滑涩，就能知道疾病产生的原因。这样施治就不会有过失，诊断就不会有差错。",
        notes: [
          { w: "训", t: "权衡规矩：四时脉象的形容——春应中规、夏应中矩、秋应中衡、冬应中权。" },
          { w: "按", t: "「先别阴阳」是第一步，不是最后一步。这句常被读成流程中的一環，其实是序位。" }
        ]
      },
      {
        id: "sw05-6", tags: ["zhize"],
        yw: "故曰：病之始起也，可刺而已；其盛，可待衰而已。故因其輕而揚之，因其重而減之，因其衰而彰之。形不足者，溫之以氣；精不足者，補之以味。其高者，因而越之；其下者，引而竭之；中滿者，瀉之於內。",
        bh: "所以说：疾病刚开始发作的时候，可以用针刺方法治愈；病情正盛的时候，可以等到邪气衰减时再行治疗而获愈。所以病势轻浅的，用轻扬宣散的方法；病势沉重的，用逐步削减的方法；正气衰弱的，用补益彰显的方法。形体虚弱的，用温养阳气的方法调补；阴精不足的，用厚味滋养的方法填补。病在上焦高位的，用涌吐的方法使邪气从上越出；病在下焦的，用疏导攻下的方法使邪从下排出；中焦胀满的，用分消的方法泻之于内。",
        notes: [
          { w: "义", t: "「因其盛，可待衰而已」是个反直觉的策略：正盛时不动手，等它自己衰减。与现代急则治标并不矛盾，针对的是周期性发作的病。" }
        ]
      }
    ]
  },

  {
    id: "sw08", book: "素问", no: 8, title: "灵兰秘典论", titleTw: "靈蘭秘典論",
    tags: ["zangxiang", "wuxing"],
    brief: "十二脏腑的官职隐喻，全文不足三百字，是藏象学说的定义性文本。右侧「十二官」图的数据源头。",
    sections: [
      {
        id: "sw08-0", tags: ["zangxiang"],
        yw: "黃帝問曰：願聞十二藏之相使，貴賤何如？岐伯對曰：悉乎哉問也！請遂言之。",
        bh: "黄帝问道：我想听听十二脏腑之间的相互役使关系，它们的主从贵贱是怎样的？岐伯回答说：你问得真详尽啊！请让我来谈谈这个问题。",
        notes: [{ w: "按", t: "「相使」与「贵贱」两个词说明了提问的性质：问的是组织结构图，不是功能清单。" }]
      },
      {
        id: "sw08-1", tags: ["zangxiang", "wuxing"], off: ["心", "肺", "肝"],
        yw: "心者，君主之官也，神明出焉。肺者，相傅之官，治節出焉。肝者，將軍之官，謀慮出焉。",
        bh: "心，如同君主一样的器官，精神意识由此产生。肺，如同辅佐君主的宰相，治理与节律由此产生。肝，如同出征作战的将军，谋略与思虑由此产生。",
        notes: [
          { w: "义", t: "三个官定的都是「信息处理」岗位：神明 = 决策中枢，治节 = 节律调度，谋虑 = 方案生成。" }
        ]
      },
      {
        id: "sw08-2", tags: ["zangxiang", "wuxing"], off: ["胆", "膻中"],
        yw: "膽者，中正之官，決斷出焉。羶中者，臣使之官，喜樂出焉。",
        bh: "胆，如同公正不偏的司法之官，判断与决断由此产生。膻中，如同传达命令的近臣，喜悦与欢乐由此产生。",
        notes: [
          { w: "训", t: "膻中，此处指心包络，为气之海。" },
          { w: "义", t: "肝出谋，胆决断。谋而不决在肝，决而不当在胆，这是两脏的分工。" }
        ]
      },
      {
        id: "sw08-3", tags: ["zangxiang"], off: ["脾", "胃", "大肠", "小肠"],
        yw: "脾胃者，倉廩之官，五味出焉。大腸者，傳道之官，變化出焉。小腸者，受盛之官，化物出焉。",
        bh: "脾胃，如同管理仓库的官员，五味滋养由此产生。大肠，如同负责运输传导的官员，糟粕由此变化形成。小肠，如同负责接收的官员，进一步分化食物精微的功能由此产生。",
        notes: [
          { w: "义", t: "三个都是「物流」岗位：入库分类（脾胃）、干线运输（大肠）、精粗分拣（小肠）。" }
        ]
      },
      {
        id: "sw08-4", tags: ["zangxiang"], off: ["肾", "三焦", "膀胱"],
        yw: "腎者，作強之官，伎巧出焉。三焦者，決瀆之官，水道出焉。膀胱者，州都之官，津液藏焉，氣化則能出矣。",
        bh: "肾，如同复兴百工的能工之官，精巧的技能由此产生。三焦，如同管理水利的官员，通调水道的功能由此产生。膀胱，如同汇聚水液的州都之地，津液储藏于此，经过气化作用才能排出体外。",
        notes: [
          { w: "训", t: "作强，作用强力。伎巧，精巧的技艺。决渎，疏通水道。州都，水液汇聚的地方。" },
          { w: "按", t: "注意膀胱是唯一一个在句末加了机制说明的：「气化则能出矣」。这是在强调它不是被动容器，排尿依赖气的推动。" }
        ]
      },
      {
        id: "sw08-5", tags: ["zangxiang"], off: ["心"],
        yw: "凡此十二官者，不得相失也。故主明則下安，以此養生則壽，歿世不殆，以爲天下則大昌。主不明則十二官危，使道閉塞而不通，形乃大傷，以此養生則殃，以爲天下者，其宗大危，戒之戒之！",
        bh: "这十二官之间，是不能失去协调的。所以君主清明，下属就安定，用这样的道理养生就能长寿，终身不会有危险；用这样的道理治理天下，国家就会昌盛繁荣。君主不明察，十二官就都危险了，联络的通道闭塞不通，形体就会受到大的伤害，用这样的状况养生就要遭殃，用这样的状况治理天下，他的宗社就非常危险，一定要警惕啊！",
        notes: [
          { w: "义", t: "「使道」是关键词：十二官之所以成为系统，靠的是通路而不是各自的职能。通路一闭，职能再全也垮。" },
          { w: "按", t: "全文由脏腑推及治国，一次性把医学与政治隐喻打通。这种跳跃在《内经》里并不常见。" }
        ]
      },
      {
        id: "sw08-6", tags: ["zangxiang"],
        yw: "至道在微，變化無窮，孰知其原！" + "恍惚之数，生于毫氂，毫氂之数，起于度量，千之万之，可以益大，推之大之，其形乃制。",
        bh: "最高深的道理在于细微之处，它的变化是无穷无尽的，谁能知道它的本原呢！那些若有若无的数量变化，产生于毫厘般的微小差别，毫厘般的微小差别，又起于测量的尺度标准。把它成千成万地积累，就可以由小变大，推演扩充开来，事物的形体规律才被认识把握。",
        notes: [
          { w: "训", t: "氂，音厘，同厘，极微小的长度单位。" },
          { w: "按", t: "讲完官职立刻接一段方法论：差异从极小处开始积累。这是《内经》少见的认识论插笔。" }
        ]
      }
    ]
  },

  {
    id: "sw10", book: "素问", no: 10, title: "五脏生成篇", titleTw: "五藏生成篇",
    tags: ["zangxiang", "zhenfa", "wuxing"],
    brief: "给出五脏与体、华、主的对应表，以及五色生死辨——望诊的基础数据结构。",
    sections: [
      {
        id: "sw10-1", tags: ["zangxiang", "wuxing"],
        yw: "心之合脈也，其榮色也，其主腎也。肺之合皮也，其榮毛也，其主心也。肝之合筋也，其榮爪也，其主肺也。脾之合肉也，其榮脣也，其主肝也。腎之合骨也，其榮髮也，其主脾也。",
        bh: "心与脉相合，它的荣华表现在面色上，受肾制约。肺与皮肤相合，它的荣华表现在毫毛上，受心制约。肝与筋相合，它的荣华表现在爪甲上，受肺制约。脾与肌肉相合，它的荣华表现在口唇上，受肝制约。肾与骨相合，它的荣华表现在头发上，受脾制约。",
        notes: [
          { w: "义", t: "每脏三件事：所合（它管什么组织）、所荣（外表哪里看得见）、所主（谁克它）。" },
          { w: "按", t: "「其荣」是可观察项。头发看肾、爪甲看肝、嘴唇看脾——这是最初的望诊接口。" }
        ]
      },
      {

{"id":"sw04","book":"素问","no":4,"title":"金匮真言论","titleTw":"金匱真言論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw04-1","tags":[],"yw":"黃帝問曰∶天有八風，經有五風，何謂？岐伯對曰∶八風發邪，以爲經風，觸五髒，邪氣發病。所謂得四時之勝者，春勝長夏，長夏勝冬，冬勝夏，夏勝秋，秋勝春，所謂四時之勝也。東風生於春，病在肝，俞在頸項；南風生於夏，病在心，俞在胸脅；西風生於秋，病在肺，俞在肩背；北風生於冬，病在腎，俞在腰股；中央爲土，病在脾，俞在脊。故春氣者病在頭，夏氣者病在髒，秋氣者病在肩背，冬氣者病在四肢。故春善病鼽衄，仲夏善病胸脅，長夏善病洞泄寒中，秋善病風瘧，冬善病痹厥。","bh":"","notes":[],"pending":true},{"id":"sw04-2","tags":[],"yw":"故冬不按蹺，春不鼽衄，春不病頸項，仲夏不病胸脅，長夏不病洞泄寒中，秋不病風瘧，冬不病痹厥，飧泄，而汗出也。夫精者，身之本也。故藏於精者，春不病溫。夏暑汗不出者，秋成風瘧。此平人脈法也。故曰∶陰中有陰，陽中有陽。平旦至日中，天之陽，陽中之陽也；日中至黃昏，天之陽，陽中之陰也；合夜至雞鳴，天之陰，陰中之陰也；雞鳴至平旦，天之陰，陰中之陽也。故人亦應之。夫言人之陰陽，則外爲陽，內爲陰。言人身之陰陽，則背爲陽，腹爲陰。","bh":"","notes":[],"pending":true},{"id":"sw04-3","tags":[],"yw":"言人身之髒腑中陰陽，則髒者爲陰，腑者爲陽。肝心脾肺腎五髒皆爲陰，膽胃大腸小腸膀胱三焦六腑皆爲陽。所以欲知陰中之陰陽中之陽者何也？爲冬病在陰，夏病在陽，春病在陰，秋病在陽，皆視其所在，爲施針石也。故背爲陽，陽中之陽，心也；背爲陽，陽中之陰，肺也；腹爲陰，陰中之陰，腎也；腹爲陰，陰中之陽，肝也；腹爲陰，陰中之至陰，脾也。此皆陰陽表裏內外雌雄相輸應也，故以應天之陰陽也。帝曰∶五髒應四時，各有收受乎？岐伯曰∶有。","bh":"","notes":[],"pending":true},{"id":"sw04-4","tags":[],"yw":"東方青色，入通於肝，開竅於目，藏精於肝，其病發驚駭，其味酸，其類草木，其畜雞，其谷麥，其應四時，上爲歲星，是以春氣在頭也，其音角，其數八，是以知病之在筋也，其臭臊。南方赤色，入通於心，開竅於耳，藏精於心，故病在五髒，其味苦，其類火，其畜羊，其谷黍，其應四時，上爲熒惑星，是以知病之在脈也，其音徵，其數七，其臭焦。中央黃色，入通於脾，開竅於口，藏精於脾，故病在舌本，其味甘，其類土，其畜牛，其谷稷。其應四時，上爲鎮星，是以知病之在肉也，其音宮，其數五，其臭香，西方白色，入通於肺，開竅於鼻，藏精於肺，故病在背，其味辛，其類金，其畜馬，其谷稻，其應四時，上爲太白星，是以知病之在皮毛也，其音商，其數九，其臭腥，北方黑色，入通於腎，開竅於二陰，藏精於腎，故病在溪，其味鹹，其類水，其畜彘。","bh":"","notes":[],"pending":true},{"id":"sw04-5","tags":[],"yw":"其谷豆。其應四時，上爲辰星，是以知病之在骨也。其音羽，其數六，其臭腐，故善爲脈者，謹察五髒六腑，一逆一從，陰陽、表裏、雌雄之紀，藏之心意，合心於精，非其人勿教，非其真勿授，是謂得道。序∶乃其（上音乃）蕆（敕輦切）糅（女救切，雜也）瀅（音瑩）上古天真論∶徇（徐閏切，病也）痹（必至切）恬（上啼廉切，下音淡）更齒（上古行切，下齒更同）（於葛切）俠口（胡夾切，下同）額顱（落胡切）滲灌（上所禁切）解惰（上上聲）壽敝（毗祭切）眉睫（音接）恚嗔（上於桂切）愉（音俞）四氣調神大論∶予而（上音與）獺（他達切）（音如，鶉也）蕃秀（上音煩）螻蟈（上音樓，下古獲切，蛙也）蚯蚓（上音丘，下以志切）（古闃切，搏勞鳥也）蜩（音條）溽暑（上音辱）（音皆，瘦瘧也）欲熾（尺志切）壞戶（上步回切）始涸（胡各切）豺（音柴）亟奪（上去吏切）（苦割切）荔挺（上力計切，下大頂切）北鄉（音向）（古豆切，雉鳴）爲否（符鄙切，下不交否同）燠熱（上於六切）生氣通天論∶分（上聲）暴卒（倉沒切）荒佚（音逸）躁（則到切）喝（呼葛切）瘀（衣倨切）裹攘（汝陽切）（音軟，縮也）潰潰（古沒切，煩悶不止也）（在計切，又前計切）奔並（下去聲）偏沮（子魚切，潤也）痤（昨禾切）痱（方味切）怫（符弗切）（織加切）（許竹切）（尺制切）（而劣切）大僂（力主切）（力斗切，癰）瘍（音陽，下並同）俞（音庶）否隔（符鄙切，塞也）粗（千胡切）淖（奴教 {"id":"sw06","book":"素问","no":6,"title":"阴阴离合论","titleTw":"陰陰離合論","tags":["bingji","zangxiang","yinyang"],"brief":"","pending":true,"sections":[{"id":"sw06-1","tags":[],"yw":"黃帝問曰∶餘聞天爲陽，地爲陰，日爲陽，月爲陰，大小月三百六十日成一歲，人亦應之。今三陰三陽，不應陰陽，其故何也？岐伯對曰∶陰陽者，數之可十，推之可百，數之可千，推之可萬，萬之大不可勝數，然其要一也。天復地載，萬物方生，未出地者，命曰陰處，名曰陰中之陰；則出地者，命曰陰中之陽。陽予之正，陰爲之主。故生因春，長因夏，收因秋，藏因冬，失常則天地四塞。陰陽之變，其在人者，亦數之可數。帝曰∶願聞三陰三陽之離合也。","bh":"","notes":[],"pending":true},{"id":"sw06-2","tags":[],"yw":"岐伯曰∶聖人南面而立，前曰廣明，後曰太衝，太衝之地，名曰少陰，少陰之上，名曰太陽，太陽根起於至陰，結於命門，名曰陰中之陽。中身而上，名曰廣明，廣明之下，名曰太陰，太陰之前，名曰陽明，陽明根起於厲兌，名曰陰中之陽。厥陰之表，名曰少陽，少陽根起於竅陰，名曰陰中之少陽。是故三陽之離合也，太陽爲開，陽明爲闔，少陽爲樞。三經者，不得相失也，搏而勿浮，命曰一陽。帝曰∶願聞三陰。岐伯曰∶外者爲陽，內者爲陰，然則中爲陰，其衝在下，名曰太陰，太陰根起於隱白，名曰陰中之陰。","bh":"","notes":[],"pending":true},{"id":"sw06-3","tags":[],"yw":"太陰之後，名曰少陰，少陰根起於湧泉，名曰陰中之少陰。少陰之前，名曰厥陰，厥陰根起於大敦，陰之絕陽，名曰陰之絕陰。是故三陰之離合也，太陰爲開，厥陰爲闔，少陰爲樞。三經者，不得相失也，搏而勿沉，名曰一陰。陰陽衝衝，積傳爲一周，氣裏形表而爲相成也。<目錄>卷第二","bh":"","notes":[],"pending":true}]},
{"id":"sw07","book":"素问","no":7,"title":"阴阳别论","titleTw":"陰陽別論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw07-1","tags":[],"yw":"黃帝問曰∶人有四經十二從，何謂？岐伯對曰∶四經應四時，十二從應十二月，十二月應十二脈。脈有陰陽，知陽者知陰，知陰者知陽。凡陽有五，五五二十五陽。所謂陰者，真髒也，見則爲敗，敗必死也。所謂陽者，胃脘之陽也。別於陽者，知病處也；別於陰者，知死生之期。三陽在頭，三陰在手，所謂一也。別於陽者，知病忌時；別於陰者，知死生之期。謹熟陰陽，無與衆謀。所謂陰陽者，去者爲陰，至者爲陽；靜者爲陰，動者爲陽；遲者爲陰，數者爲陽。","bh":"","notes":[],"pending":true},{"id":"sw07-2","tags":[],"yw":"凡持真脈之髒脈者，肝至懸絕急，十八日死；心至懸絕，九日死；肺至懸絕，十二日死；腎至懸絕，七日死；脾至懸絕，四日死。曰∶二陽之病發心脾，有不得隱曲，女子不月；其傳爲風消，其傳爲息賁者，死不治。曰∶三陽爲病發寒熱，下爲癰腫，及爲痿厥；其傳爲索澤，其傳爲頹疝。曰∶一陽發病，少氣善咳善泄；其傳爲心掣，其傳爲隔。二陽一陰發病，主驚駭背痛，善噫善欠，名曰風厥。二陰一陽發病，善脹心滿善氣。三陽三陰發病，爲偏枯痿易，四肢不舉。","bh":"","notes":[],"pending":true},{"id":"sw07-3","tags":[],"yw":"鼓一陽曰鉤，鼓一陰曰毛，鼓陽勝急曰弦，鼓陽至而絕曰石，陰陽相過曰溜。陰爭於內，陽擾於外，魄汗未藏，四逆而起，起則燻肺，使人喘鳴。陰之所生，和本曰和。是故剛與剛，陽氣破散，陰氣乃消亡。淖則剛柔不和，經氣乃絕。死陰之屬，不過三日而死；生陽之屬，不過四日而死。所謂生陽死陰者，肝之心謂之生陽，心之肺謂之死陰，肺之腎謂之重陰，腎之脾謂之辟陰，死不治。結陽者，腫四肢。結陰者，便血一升，再結二升，三結三升。陰陽結斜，多陰少陽曰石水，少腹腫。","bh":"","notes":[],"pending":true},{"id":"sw07-4","tags":[],"yw":"二陽結謂之消，三陽結謂之隔，三陰結謂之水，一陰一陽結謂之喉痹。陰搏陽別謂之有子。陰陽虛腸辟死。陽加於陰謂之汗。陰虛陽搏謂之崩。三陰俱搏，二十日夜半死。二陰俱搏，十三日夕時死。一陰俱搏，十日死。三陽俱搏且鼓，三日死。三陰三陽俱搏，心腹滿。發盡不得隱曲，五日死。二陽俱搏，其病溫，死不治，不過十日死。陰陽應象大論∶脹（上昌真切，肉脹起也）滲泄（上所禁切）翕（下許極切）噦噫（上乙劣切，下烏界切）能冬（上奴代切，下能夏、形能並同）放效（上妃兩切）並於（上去聲）嗌（伊芳者切）滑澀（下音色）漬（即賜切）陰陽離合論∶予（猶與也）陰陽別論∶（音喘，腓腸也）（音淵，疼也）淖（音淘，水朝宗於海）<目錄>卷第三","bh":"","notes":[],"pending":true}]},
{"id":"sw09","book":"素问","no":9,"title":"六节藏象论","titleTw":"六節藏象論","tags":["zangxiang","yinyang","wuxing"],"brief":"","pending":true,"sections":[{"id":"sw09-1","tags":[],"yw":"黃帝問曰∶餘聞天以六六之節，以成一歲，人以九九制會，計人亦有三百六十五節以爲天地，久矣。不知其所謂也？岐伯對曰∶昭乎哉問也，請遂言之。夫六六之節，九九制會者，所以正天之度、氣之數也。天度者，所以制日月之行也；氣數者，所以紀化生之用也。天爲陽，地爲陰；日爲陽，月爲陰；行有分紀，周有道理，日行一度，月行十三度而有奇焉，故大小月三百六十五日而成歲，積氣餘而盈閏矣。立端於始，表正於中，推餘於終，而天度畢矣。","bh":"","notes":[],"pending":true},{"id":"sw09-2","tags":[],"yw":"帝曰∶餘已聞天度矣，願聞氣數何以合之？岐伯曰∶天以六六爲節，地以九九制會，天有十日，日六竟而周甲，甲六復而終歲，三百六十日法也。夫自古通天者，生之本，本於陰陽，其氣九州九竅，皆通乎天氣。故其生五，其氣三，三而成天，三而成地，三而成人，三而三之，合則爲九，九分爲九野，九野爲九藏，故形藏四，神藏五，合爲九藏以應之也。帝曰∶餘已聞六六九九之會也，夫子言積氣盈閏，願聞何謂氣？請夫子發蒙解惑焉。岐伯曰∶此上帝所祕，先師傳之也。","bh":"","notes":[],"pending":true},{"id":"sw09-3","tags":[],"yw":"帝曰∶請遂聞之。岐伯曰∶五日謂之候，三候謂之氣，六氣謂之時，四時謂之歲，而各從其主治焉。五運相襲，而皆治之，終期之日，周而復始，時立氣布，如環無端，候亦同法。故曰∶不知年之所加，氣之盛衰，虛實之所起，不可以爲工矣。帝曰∶五運之始，如環無端，其太過不及何如？岐伯曰∶五氣更立，各有所勝，盛虛之變，此其常也。帝曰∶平氣何如？岐伯曰∶無過者也。帝曰∶太過不及奈何？岐伯曰∶在經有也。帝曰∶何謂所勝？岐伯曰∶春勝長夏，長夏勝冬，冬勝夏，夏勝秋，秋勝春，所謂得五行時之勝，各以氣命其髒。","bh":"","notes":[],"pending":true},{"id":"sw09-4","tags":[],"yw":"帝曰∶何以知其勝？岐伯曰∶求其至也，皆歸始春，未至而至，此謂太過，則薄所不勝，而乘所勝也，命曰氣淫。不分邪僻內生工不能禁。至而不至，此謂不及，則所勝妄行，而所生受病，所不勝薄之也，命曰氣迫。所謂求其至者，氣至之時也。謹候其時，氣可與期，失時反候，五治不分，邪僻內生，工不能禁也。帝曰∶有不襲乎？岐伯曰∶蒼天之氣，不得無常也。氣之不襲，是謂非常，非常則變矣。帝曰∶非常而變奈何？岐伯曰∶變至則病，所勝則微，所不勝則甚，因而重感於邪，則死矣。","bh":"","notes":[],"pending":true},{"id":"sw09-5","tags":[],"yw":"故非其時則微，當其時則甚也。帝曰∶善。餘聞氣合而有形，因變以正名。天地之運，陰陽之化，其於萬物，孰少孰多，可得聞乎？岐伯曰∶悉哉問也，天至廣不可度，地至大不可量，大神靈問，請陳其方。草生五色，五色之變，不可勝視，草生五味，五味之美，不可勝極，嗜欲不同，各有所通。天食人以五氣，地食人以五味。五氣入鼻，藏於心肺，上使五色修明，音聲能彰。五味入口，藏於腸胃，味有所藏，以養五氣，氣和而生，津液相成，神乃自生。","bh":"","notes":[],"pending":true},{"id":"sw09-6","tags":[],"yw":"帝曰∶髒象何如？岐伯曰∶心者，生之本，神之變也，其華在面，其充在血脈，爲陽中之太陽，通於夏氣。肺者，氣之本，魄之處也，其華在毛，其充在皮，爲陽中之太陰，通於秋氣。腎者，主蟄封藏之本，精之處也，其華在發，其充在骨，爲陰中之少陰，通於冬氣。肝者，罷極之本，魂之居也，其華在爪，其充在筋，以生血氣，其味酸，其色蒼，此爲陽中之少陽，通於春氣。脾胃大腸小腸三焦膀胱者，倉廩之本，營之居也，名曰器，能化糟粕，轉味而入出者也，其華在脣四白，其充在肌，其味甘，其色黃，此至陰之類，通於土氣。","bh":"","notes":[],"pending":true},{"id":"sw09-7","tags":[],"yw":"凡十一髒，取決於膽也。故人迎一盛病在少陽，二盛病在太陽，三盛病在陽明，四盛以上爲格陽。寸口一盛病在厥陰，二盛病在少陰，三盛病在太陰，四盛以上爲關陰。人迎與寸口俱盛四倍以上爲關格，關格之脈羸，不能極於天地之精氣，則死矣。<目錄>卷第三","bh":"","notes":[],"pending":true}]},
{"id":"sw11","book":"素问","no":11,"title":"五脏别论","titleTw":"五髒別論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw11-1","tags":[],"yw":"黃帝問曰∶餘聞方士，或以腦髓爲髒，或以腸胃爲髒，或以爲腑，敢問更相反，皆自謂是，不知其道，願聞其說。岐伯對曰∶腦髓骨脈膽女子胞，此六者地氣之所生也，皆藏於陰而象於地，故藏而不瀉，名曰奇恆之府。夫胃大腸小腸三焦膀胱，此五者，天氣之所生也，其氣象天，故瀉而不藏，此受五髒濁氣，名曰傳化之府，此不能久留輸瀉者也。魄門亦爲五髒使，水谷不得久藏。所謂五髒者，藏精氣而不瀉也，故滿而不能實。六腑者，傳化物而不藏，故實而不能滿也。","bh":"","notes":[],"pending":true},{"id":"sw11-2","tags":[],"yw":"所以然者，水谷入口，則胃實而腸虛；食下，則腸實而胃虛。故曰實而不滿，滿而不實也。帝曰∶氣口何以獨爲五髒主？岐伯曰∶胃者，水谷之海，六腑之大源也。五味入口，藏於胃以養五髒氣，氣口亦太陰也。是以五髒六腑之氣味，皆出於胃，變見於氣口。故五氣入鼻，藏於心肺，心肺有病，而鼻爲之不利也。凡治病必察其下，適其脈，觀其志意，與其病也。拘於鬼神者，不可與言至德。惡於針石者，不可與言至巧。病不許治者，病必不治，治之無功矣。","bh":"","notes":[],"pending":true},{"id":"sw11-3","tags":[],"yw":"靈蘭祕典論∶羶（徒旱切）廩（力稔切）瘠（音籍）瞿（音劬）六節藏象論∶僦（即就切）溲（所鳩切，小便也）五髒生成論∶胝（上丁尼切，下側救切）（音苔）（芳杯切）（音頑，又音君）隧（音遂）頏（胡浪切）顙（蘇朗切）系（奚帝切）顴（音權）（去魚切）（音虞）五髒別論∶（音巡）惡（音污）<目錄>卷第四","bh":"","notes":[],"pending":true}]},
{"id":"sw12","book":"素问","no":12,"title":"异法方宜论","titleTw":"異法方宜論","tags":["ci","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw12-1","tags":[],"yw":"黃帝問曰∶醫之治病也，一病而治各不同，皆愈何也？岐伯對曰∶地勢使然也。故東方之域，天地之所始生也，魚鹽之地，海濱傍水，其民食魚而嗜鹹，皆安其處，美其食，魚者使人熱中，鹽者勝血，故其民皆黑色疏理，其病皆爲癰瘍，其治宜砭石，故砭石者，亦從東方來。西方者，金玉之域，沙石之處，天地之所收引也，其民陵居而多風，水土剛強，其民不衣而褐薦，其民華食而脂肥，故邪不能傷其形體，其病生於內，其治宜毒藥，故毒藥者，亦從西方來。","bh":"","notes":[],"pending":true},{"id":"sw12-2","tags":[],"yw":"北方者，天地所閉藏之域也，其地高陵居，風寒冰冽，其民樂野處而乳食，髒寒生滿病，其治宜灸。故灸者，亦從北方來。南方者，天地所長養，陽之所盛處也，其地下，水土弱，霧露之所聚也，其民嗜酸而食。故其民皆致理而赤色，其病攣痹，其治宜微針。故九針者，亦從南方來。中央者，其地平以溼，天地所以生萬物也衆，其民食雜而不勞，故其病多痿厥寒熱，其治宜導引按蹺，故導引按蹺者，亦從中央出也。故聖人雜合以治，各得其所宜，故治所以異而病皆愈者，得病之情，知治之大體也。","bh":"","notes":[],"pending":true},{"id":"sw12-3","tags":[],"yw":"<目錄>卷第四","bh":"","notes":[],"pending":true}]},
{"id":"sw13","book":"素问","no":13,"title":"移精变气论","titleTw":"移精變氣論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw13-1","tags":[],"yw":"黃帝問曰∶餘聞古之治病，惟其移精變氣，可祝由而已。今世治病，毒藥治其內，針石治其外，或愈或不愈，何也？岐伯對曰∶往古人居禽獸之間，動作以避寒，陰居以避暑，內無眷慕之累，外無伸宦之形，此恬之世，邪不能深入也。故毒藥不能治其內，針石不能治其外，故可移精祝由而已。當今之世不然，憂患緣其內，苦形傷其外，又失四時之從，逆寒暑之宜，賊風數至，虛邪朝夕，內至五髒骨髓，外傷空竅肌膚，所以小病必甚，大病必死，故祝由不能已也。","bh":"","notes":[],"pending":true},{"id":"sw13-2","tags":[],"yw":"帝曰∶善。餘欲臨病患，觀死生，決嫌疑，欲知其要，如日月光，可得聞乎？岐伯曰∶色脈者，上帝之所貴也，先師之所傳也。上古使僦貸季，理色脈而通神明，合之金木水火土四時八風六合，不離其常，變化相移，以觀其妙，以知其要，欲知其要，則色脈是矣。色以應日，脈以應月，常求其要，則其要也。夫色之變化，以應四時之脈，此上帝之所貴，以合於神明也，所以遠死而近生。生道以長，命曰聖王。中古之治病，至而治之，湯液十日，以去八風五痹之病，十日不已，治以草蘇草之枝，本末爲助，標本已得，邪氣乃服。","bh":"","notes":[],"pending":true},{"id":"sw13-3","tags":[],"yw":"暮世之治病也則不然，治不本四時，不知日月，不審逆從，病形已成，乃欲微針治其外，湯液治其內，粗工兇兇，以爲可攻，故病未已，新病復起。帝曰∶願聞要道。岐伯曰∶治之要極，無失色脈，用之不惑，治之大則。逆從倒行，標本不得，亡神失國。去故就新，乃得真人。帝曰∶餘聞其要於夫子矣，夫子言不離色脈，此餘之所知也。岐伯曰∶治之極於一。帝曰∶何謂一？岐伯曰∶一者因得之。帝曰∶奈何？岐伯曰∶閉戶塞牖，系之病者，數問其情，以從其意，得神者昌，失神者亡。","bh":"","notes":[],"pending":true},{"id":"sw13-4","tags":[],"yw":"帝曰∶善。<目錄>卷第四","bh":"","notes":[],"pending":true}]},
{"id":"sw14","book":"素问","no":14,"title":"汤液醪醴论","titleTw":"湯液醪醴論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw14-1","tags":[],"yw":"黃帝問曰∶爲五谷湯液及醪醴奈何？岐伯對曰∶必以稻米，炊之稻薪，稻米者完，稻薪者堅。帝曰∶何以然？岐伯曰∶此得天地之和，高下之宜，故能至完，伐取得時，故能至堅也。帝曰∶上古聖人作湯液醪醴，爲而不用何也？岐伯曰∶自古聖人之作湯液醪醴者，以爲備耳，夫上古作湯液，故爲而弗服也。中古之世，道德稍衰，邪氣時至，服之萬全。帝曰∶今之世不必已何也？岐伯曰∶當今之世，必齊毒藥攻其中，石針艾治其外也。帝曰∶形弊血盡而功不立者何？岐伯曰∶神不使也。","bh":"","notes":[],"pending":true},{"id":"sw14-2","tags":[],"yw":"帝曰∶何謂神不使？岐伯曰∶針石，道也。精神不進，志意不治，故病不可愈。今精壞神去，榮衛不可復收。何者？嗜欲無窮，而憂患不止，精氣弛壞，榮泣衛除，故神去之而病不愈也。帝曰∶夫病之始生也，極微極精，必先入結於皮膚。今良工皆稱曰∶病成名曰逆，則針石不能治，良藥不能及也。今良工皆得其法，守其數，親戚兄弟遠近音聲日聞於耳，五色日見於目，而病不愈者，亦何暇不早乎？岐伯曰∶病爲本，工爲標，標本不得，邪氣不服，此之謂也。","bh":"","notes":[],"pending":true},{"id":"sw14-3","tags":[],"yw":"帝曰∶其有不從毫毛而生，五髒陽以竭也，津液充郭，其魄獨居，精孤於內，氣耗於外，形不可與衣相保，此四極急而動中，是氣拒於內，而形施於外，治之奈何？岐伯曰∶平治於權衡，去宛陳，微動四極，溫衣，繆刺其處，以復其形。開鬼門，潔淨府，精以時服，五陽已布，疏滌五髒，故精自生，形自盛，骨肉相保，巨氣乃平。帝曰∶善。<目錄>卷第四","bh":"","notes":[],"pending":true}]},
{"id":"sw15","book":"素问","no":15,"title":"玉版论要","titleTw":"玉版論要","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw15-1","tags":[],"yw":"黃帝問曰∶餘聞揆度奇恆，所指不同，用之奈何？岐伯對曰∶揆度者，度病之淺深也。奇恆者，言奇病也。請言道之至數，五色脈變，揆度奇恆，道在於一。神轉不回，回則不轉，乃失其機，至數之要，迫近以微，着之玉版，命曰合玉機。容色見上下左右，各在其要。其色見淺者，湯液主治，十日已。其見深者，必齊主治，二十一日已。其見大深者，醪酒主治，百日已。色夭面脫，不治，百日盡已。脈短氣絕死，病溫虛甚死。色見上下左右，各在其要。","bh":"","notes":[],"pending":true},{"id":"sw15-2","tags":[],"yw":"上爲逆，下爲從。女子右爲逆，左爲從；男子左爲逆，右爲從。易，重陽死，重陰死。陰陽反他，治在權衡相奪，奇恆事也，揆度事也。搏脈痹，寒熱之交。脈孤爲消氣，虛泄爲奪血。孤爲逆，虛爲從。行奇恆之法，以太陰始。行所不勝曰逆，逆則死；行所勝曰從，從則活。八風四時之勝，終而復始，逆行一過，不復可數，論要畢矣。<目錄>卷第四","bh":"","notes":[],"pending":true}]},
{"id":"sw16","book":"素问","no":16,"title":"诊要经终论","titleTw":"診要經終論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw16-1","tags":[],"yw":"黃帝問曰∶診要何如？岐伯對曰∶正月二月，天氣始方，地氣始發，人氣在肝。三月四月，天氣正方，地氣定發，人氣在脾。五月六月，天氣盛，地氣高，人氣在頭。七月八月，陰氣始殺，人氣在肺。九月十月，陰氣始冰，地氣始閉，人氣在心。十一月十二月，冰復，地氣合，人氣在腎。故春刺散俞，及與分理，血出而止，甚者傳氣，間者環也。夏刺絡俞，見血而止，盡氣閉環，痛病必下。秋刺皮膚，循理，上下同法，神變而止。冬刺俞竅於分理，甚者直下，間者散下。","bh":"","notes":[],"pending":true},{"id":"sw16-2","tags":[],"yw":"春夏秋冬，各有所刺，法其所在。春刺夏分，脈亂氣微，入淫骨髓，病不能愈，令人不嗜食，又且少氣。春刺秋分，筋攣，逆氣環爲咳嗽，病不愈，令人時驚，又且哭。春刺冬分，邪氣着藏，令人脹，病不愈，又且欲言語。夏刺春分，病不愈，令人解惰。夏刺秋分，病不愈，令人心中欲無言，惕惕如人將捕之。夏刺冬分，病不愈，令人少氣，時欲怒。秋刺春分，病不已，令人惕然欲有所爲，起而忘之。秋刺夏分，病不已，令人益嗜臥，又且善夢。秋刺冬分，病不已，令人灑灑時寒。","bh":"","notes":[],"pending":true},{"id":"sw16-3","tags":[],"yw":"冬刺春分，病不已，令人欲臥不能眠，眠而有見。冬刺夏分，病不愈，氣上，發爲諸痹。冬刺秋分，病不已，令人善渴。凡刺胸腹者，必避五髒。中心者環死，中脾者五日死，中腎者七日死，中肺者五日死，中膈者，皆爲傷中，其病雖愈，不過一歲必死。刺避五髒者，知逆從也。所謂從者，膈與脾腎之處，不知者反之。刺胸腹者，必以布着之，乃從單布上刺，刺之不愈復刺。刺針必肅，刺腫搖針，經刺勿搖，此刺之道也。帝曰∶願聞十二經脈之終奈何？岐伯曰∶太陽之脈，其終也戴眼反折螈，其色白，絕汗乃出，出則死矣。","bh":"","notes":[],"pending":true},{"id":"sw16-4","tags":[],"yw":"少陽終者，耳聾百節皆縱，目HT絕系，絕系一日半死，其死也色先青白，乃死矣。陽明終者，口目動作，善驚妄言，色黃，其上下經盛，不仁，則終矣。少陰終者，面黑齒長而垢，腹脹閉，上下不通而終矣。太陰終者，腹脹閉不得息，善噫善嘔，嘔則逆，逆則面赤，不逆則上下不通，不通則面黑皮毛焦而終矣。厥陰終者，中熱嗌干，善溺心煩，甚則舌卷卵上縮而終矣。此十二經之所敗也。異法方宜論∶蹺（巨嬌切）砭（普廉切）致（直利切）移精變氣論∶（古哀切，草根也）標（必堯切）湯液醪醴論∶（音勞）（音，斬也）滌（音迪）穢（音畏）玉版論∶度（徒各切）（必益切）診要經終論∶（古堯切）（音縱）HT（音瓊）（音閃）跗（音夫）<目錄>卷第五","bh":"","notes":[],"pending":true}]},
{"id":"sw17","book":"素问","no":17,"title":"脉要精微论","titleTw":"脈要精微論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw17-1","tags":[],"yw":"黃帝問曰∶診法何如？岐伯對曰∶診法常以平旦，陰氣未動，陽氣未散，飲食未進，經脈未盛，絡脈調勻，氣血未亂，故乃可診有過之脈。切脈動靜而視精明，察五色，觀五髒有餘不足，六腑強弱，形之盛衰，以此參伍，決死生之分。夫脈者，血之府也，長則氣治，短則氣病，數則煩心，大則病進，上盛則氣高，下盛則氣脹，代則氣衰，細則氣少，澀則心痛，渾渾革至如湧泉，病進而色弊，綿綿其去如弦絕，死。夫精明五色者，氣之華也，赤欲如白裹朱，不欲如赭；白欲如鵝羽，不欲如鹽；青欲如蒼璧之澤，不欲如藍；黃欲如羅裹雄黃，不欲如黃土；黑欲如重漆色，不欲如地蒼。","bh":"","notes":[],"pending":true},{"id":"sw17-2","tags":[],"yw":"五色精微象見矣，其壽不久也。夫精明者，所以視萬物，別白黑，審短長。以長爲短，以白爲黑，如是則精衰矣。五髒者，中之守也，中盛髒滿，氣勝傷恐者，聲如從室中言，是中氣之溼也。言而微，終日乃復言者，此奪氣也。衣被不斂，言語善惡，不避親疏者，此神明之亂也。倉廩不藏者，是門戶不要也。水泉不止者，是膀胱不藏也。得守者生，失守者死。夫五髒者，身之強也，頭者精明之府，頭傾視深，精神將奪矣。背者胸中之府，背曲肩隨，府將壞矣。","bh":"","notes":[],"pending":true},{"id":"sw17-3","tags":[],"yw":"腰者腎之府，轉搖不能，腎將憊矣。膝者筋之府，屈伸不能，行則僂附，筋將憊矣。骨者髓之府，不能久立，行則振掉，骨將憊矣。得強則生，失強則死。岐伯曰∶反四時者，有餘爲精，不足爲消。應太過，不足爲精；應不足，有餘爲消。陰陽不相應，病名曰關格。帝曰∶脈其四時動奈何？知病之所在奈何？知病之所變奈何？知病乍在內奈何？知病乍在外奈何？請問此五者，可得聞乎？岐伯曰∶請言其與天運轉大也。萬物之外，六合之內，天地之變，陰陽之應，彼春之暖，爲夏之暑，彼秋之忿，爲冬之怒，四變之動，脈與之上下，以春應中規，夏應中矩，秋應中衡，冬應中權。","bh":"","notes":[],"pending":true},{"id":"sw17-4","tags":[],"yw":"是故冬至四十五日，陽氣微上，陰氣微下；夏至四十五日，陰氣微上，陽氣微下。陰陽有時，與脈爲期，期而相失，知脈所分，分之有期，故知死時。微妙在脈，不可不察，察之有紀，從陰陽始，始之有經，從五行生，生之有度，四時爲宜，補瀉勿失，與天地如一，得一之情，以知死生。是故聲合五音，色合五行，脈合陰陽。是知陰盛則夢涉大水恐懼，陽盛則夢大火燔灼，陰陽俱盛則夢相殺毀傷；上盛則夢飛，下盛則夢墮；甚飽則夢予，甚飢則夢取；肝氣盛則夢怒，肺氣盛則夢哭；短蟲多則夢聚衆，長蟲多則夢相擊毀傷。","bh":"","notes":[],"pending":true},{"id":"sw17-5","tags":[],"yw":"是故持脈有道，虛靜爲保。春日浮，如魚之遊在波，夏日在膚，泛泛乎萬物有餘；秋日下膚，蟄蟲將去；冬日在骨，蟄蟲周密，君子居室。故曰∶知內者按而紀之，知外者終而始之。此六者，持脈之大法。心脈搏堅而長，當病舌卷不能言；其而散者，當消環自已。肺脈搏堅而長，當病唾血；其而散者，當病灌汗，至令不復散發也。肝脈搏堅而長，色不青，當病墜若搏，因血在脅下，令人喘逆；其而散色澤者，當病溢飲，溢飲者渴暴多飲，而易入肌皮腸胃之外也。","bh":"","notes":[],"pending":true},{"id":"sw17-6","tags":[],"yw":"胃脈搏堅而長，其色赤，當病折髀；其而散者，當病食痹。脾脈搏堅而長，其色黃，當病少氣；其而散色不澤者，當病足腫，若水狀也。腎脈搏堅而長，其色黃而赤者，當病折腰；其而散者，當病少血，至令不復也。帝曰∶診得心脈而急，此爲何病？病形何如？岐伯曰∶病名心疝，少腹當有形也。帝曰∶何以言之？岐伯曰∶心爲牡髒，小腸爲之使，故曰少腹當有形也。帝曰∶診得胃脈，病形何如？岐伯曰∶胃脈實則脹，虛則泄。帝曰∶病成而變何謂？岐伯曰∶風成爲寒熱，癉成爲消中，厥成爲巔疾，久風爲飧泄，脈風成爲癘，病之變化，不可勝數。","bh":"","notes":[],"pending":true},{"id":"sw17-7","tags":[],"yw":"帝曰∶諸癰腫筋攣骨痛，此皆安生？岐伯曰∶此寒氣之腫，八風之變也。帝曰∶治之奈何？岐伯曰∶此四時之病，以其勝治之愈也。帝曰∶有故病五髒發動，因傷脈色，各何以知其久暴至之病乎？岐伯曰∶悉乎哉問也！徵其脈小色不奪者，新病也；徵其脈不奪其色奪者，此久病也；徵其脈與五色俱奪者，此久病也；徵其脈與五色俱不奪者，新病也。肝與腎脈並至，其色蒼赤，當病毀傷不見血，已見血，溼若中水也。尺內兩旁，則季脅也，尺外以候腎，尺裏以候腹中。","bh":"","notes":[],"pending":true},{"id":"sw17-8","tags":[],"yw":"附上，左外以候肝，內以候膈；右外以候胃，內以候脾。上附上，右外以候肺，內以候胸中；左外以候心，內以候羶中。前以候前，後以候後。上竟上者，胸喉中事也；下竟下者，少腹腰股膝脛足中事也。粗大者，陰不足陽有餘，爲熱中也。來疾去徐，上實下虛，爲厥巔疾；來徐去疾，上虛下實，爲惡風也。故中惡風者，陽氣受也。有脈俱沉細數者，少陰厥也；沉細數散者，寒熱也；浮而散者爲僕。諸浮不躁者皆在陽，則爲熱；其有躁者在手。諸細而沉者皆在陰，則爲骨痛；其有靜者在足。","bh":"","notes":[],"pending":true},{"id":"sw17-9","tags":[],"yw":"數動一代者，病在陽之脈也，泄及便膿血。諸過者切之，澀者陽氣有餘也，滑者陰氣有餘也。陽氣有餘爲身熱無汗，陰氣有餘爲多汗身寒，陰陽有餘則無汗而寒。推而外之，內而不外，有心腹積也。推而內之，外而不內，身有熱也。推而上之，上而不下，腰足清也。推而下之，下而不上，頭項痛也。按之至骨，脈氣少者，腰脊痛而身有痹也。<目錄>卷第五","bh":"","notes":[],"pending":true}]},
{"id":"sw18","book":"素问","no":18,"title":"平人气象论","titleTw":"平人氣象論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw18-1","tags":[],"yw":"黃帝問曰∶平人何如？岐伯對曰∶人一呼脈再動，一吸脈亦再動，呼吸定息脈五動，閏以太息，命曰平人。平人者，不病也。常以不病調病患，醫不病，故爲病患平息以調之爲法。人一呼脈一動，一吸脈一動，曰少氣。人一呼脈三動，一吸脈三動而躁，尺熱曰病溫，尺不熱脈滑曰病風，脈澀曰痹。人一呼脈四動以上曰死，脈絕不至曰死，乍疏乍數曰死。平人之常氣稟於胃，胃者平人之常氣也，人無胃氣曰逆，逆者死。春胃微弦曰平，弦多胃少曰肝病，但弦無胃曰死，胃而有毛曰秋病，毛甚曰今病。","bh":"","notes":[],"pending":true},{"id":"sw18-2","tags":[],"yw":"藏真散於肝，肝藏筋膜之氣也。夏胃微鉤曰平，鉤多胃少曰心病，但鉤無胃曰死，胃而有石曰冬病，石甚曰今病。藏真通於心，心藏血脈之氣也。長夏胃微弱曰平，弱多胃少曰脾病，但代無胃曰死，弱有石曰冬病，弱甚曰今病。藏真濡於脾，脾藏肌肉之氣也。秋胃微毛曰平，毛多胃少曰肺病，但毛無胃曰死，毛而有弦曰春病，弦甚曰今病。藏真高於肺，以行榮衛陰陽也。冬胃微石曰平，石多胃少曰腎病，但石無胃曰死，石而有鉤曰夏病，鉤甚曰今病。","bh":"","notes":[],"pending":true},{"id":"sw18-3","tags":[],"yw":"藏真下於腎，腎藏骨髓之氣也。胃之大絡，名曰虛裏，貫膈絡肺，出於左乳下，其動應衣，脈宗氣也。盛喘數絕者，則病在中；結而橫，有積矣；絕不至曰死。乳之下其動應衣，宗氣泄也。欲知寸口太過與不及，寸口之脈中手短者，曰頭痛。寸口脈中手長者，曰足脛痛。寸口脈中手促上擊者，曰肩背痛。寸口脈沉而堅者，曰病在中。寸口脈浮而盛者，曰病在外。寸口脈沉而弱，曰寒熱及疝瘕少腹痛。寸口脈沉而橫，曰脅下有積，腹中有橫積痛。寸口脈沉而喘，曰寒熱。","bh":"","notes":[],"pending":true},{"id":"sw18-4","tags":[],"yw":"脈盛滑堅者，曰病在外。脈小實而堅者，病在內。脈小弱以澀，謂之久病。脈滑浮而疾者，謂之新病。脈急者，曰疝瘕少腹痛。脈滑曰風。脈澀曰痹。緩而滑曰熱中。盛而緊曰脹。脈從陰陽，病易已；脈逆陰陽，病難已。脈得四時之順，曰病無他；脈反四時及不間藏，曰難已。臂多青脈，曰脫血。尺脈緩澀，謂之解。安臥脈盛，謂之脫血。尺澀脈滑，謂之多汗。尺寒脈細，謂之後泄。脈尺粗常熱者，謂之熱中。肝見庚辛死，心見壬癸死，脾見甲乙死，肺見丙丁死，腎見戊己死，是謂真髒見皆死。","bh":"","notes":[],"pending":true},{"id":"sw18-5","tags":[],"yw":"頸脈動喘疾咳，曰水。目裹微腫如臥蠶起之狀，曰水。溺黃赤安臥者，黃膽。已食如飢者，胃疸。面腫曰風。足脛腫曰水。目黃者曰黃膽。婦人手少陰脈動甚者，妊子也。脈有逆從四時，未有髒形，春夏而脈瘦，秋冬而脈浮大，命曰逆四時也。風熱而脈靜，泄而脫血脈實，病在中脈虛，病在外脈澀堅者，皆難治，命曰反四時也。人以水谷爲本，故人絕水谷則死，脈無胃氣亦死。所謂無胃氣者，但得真髒脈不得胃氣也。所謂脈不得胃氣者，肝不弦腎不石也。","bh":"","notes":[],"pending":true},{"id":"sw18-6","tags":[],"yw":"太陽脈至，洪大以長，少陽脈至，乍數乍疏，乍短乍長；陽明脈至，浮大而短。夫平心脈來，累累如連珠，如循琅，曰心平，夏以胃氣爲本。病心脈來，喘喘連屬，其中微曲，曰心病。死心脈來，前曲後居，如操帶鉤，曰心死。平肺脈來，厭厭聶聶，如落榆莢，曰肺平，秋以胃氣爲本。病肺脈來，不上不下，如循雞羽，曰肺病。死肺脈來，如物之浮，如風吹毛，曰肺死。平肝脈來，弱招招，如揭長竿末梢，曰肝平，春以胃氣爲本。病肝脈來，盈實而滑，如循長竿，曰肝病。","bh":"","notes":[],"pending":true},{"id":"sw18-7","tags":[],"yw":"死肝脈來，急益勁，如新張弓弦，曰肝死。平脾脈來，和柔相離，如雞踐地，曰脾平，長夏以胃氣爲本。病脾脈來，實而盈數，如雞舉足，曰脾病。死脾脈來，銳堅如鳥之喙，如鳥之距，如屋之漏，如水之流，曰脾死。平腎脈來，喘喘累累如鉤，按之而堅，曰腎平，冬以胃氣爲本。病腎脈來，如引葛，按之益堅，曰腎病。死腎脈來，發如奪索，辟辟如彈石，曰腎死。脈要精微論∶莠（音誘）汨（古沒切）癉（都HT切）（音荀，又音舜）平人氣象論∶疝（音山）瘕（音賈）（音亦）（女耕切）喙（虛畏切）<目錄>卷第六","bh":"","notes":[],"pending":true}]},
{"id":"sw19","book":"素问","no":19,"title":"玉机真脏论","titleTw":"玉機真髒論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw19-1","tags":[],"yw":"黃帝問曰∶春脈如弦，何如而弦？岐伯對曰∶春脈者肝也，東方木也，萬物之所以始生也，故其氣來，弱輕虛而滑，端直以長，故曰弦，反此者病。帝曰∶何如而反？岐伯曰∶其氣來實而強，此謂太過，病在外；其氣來不實而微，此謂不及，病在中。帝曰∶春脈太過與不及，其病皆何如？岐伯曰∶太過則令人善忘，忽忽眩冒而巔疾；其不及則令人胸痛引背，下則兩脅滿。帝曰∶善。夏脈如鉤，何如而鉤？岐伯曰∶夏脈者心也，南方火也，萬物之所以盛長也，故其氣來盛去衰，故曰鉤，反此者病。","bh":"","notes":[],"pending":true},{"id":"sw19-2","tags":[],"yw":"帝曰∶何如而反？岐伯曰∶其氣來盛去亦盛，此謂太過，病在外；其氣來不盛去反盛，此謂不及，病在中。帝曰∶夏脈太過與不及，其病皆何如？岐伯曰∶太過則令人身熱而膚痛，爲浸淫；其不及則令人煩心，上見咳唾，下爲氣泄。帝曰∶善。秋脈如浮，何如而浮？岐伯曰∶秋脈者肺也，西方金也，萬物之所以收成也，故其氣來，輕虛以浮，來急去散，故曰浮，反此者病。帝曰∶何如而反？岐伯曰∶其氣來，毛而中央堅，兩旁虛，此謂太過，病在外；其氣來，毛而微，此謂不及，病在中。","bh":"","notes":[],"pending":true},{"id":"sw19-3","tags":[],"yw":"帝曰∶秋脈太過與不及，其病皆何如？岐伯曰∶太過則令人逆氣而背痛，慍慍然；其不及則令人喘，呼吸少氣而咳，上氣見血，下聞病音。帝曰∶善。冬脈如營，何如而營？岐伯曰∶冬脈者腎也，北方水也，萬物之所以合藏也，故其氣來沉以搏，故曰營，反此者病。帝曰∶何如而反？岐伯曰∶其氣來如彈石者，此謂太過，病在外；其去如數者，此謂不及，病在中。帝曰∶冬脈太過與不及，其病皆何如？岐伯曰∶太過則令人解，脊脈痛而少氣不欲言；其不及則令人心懸如病飢，中清，脊中痛，少腹滿，小便變。","bh":"","notes":[],"pending":true},{"id":"sw19-4","tags":[],"yw":"帝曰∶善。帝曰∶四時之序，逆從之變異也，然脾脈獨何主？岐伯曰∶脾脈者土也，孤髒以灌四旁者也。帝曰∶然則脾善惡，可得見之乎？岐伯曰∶善者不可得見，惡者可見。帝曰∶惡者何如可見？岐伯曰∶其來如水之流者，此謂太過，病在外；如鳥之喙者，此謂不及，病在中。帝曰∶夫子言脾爲孤髒，中央土以灌四旁，其太過與不及，其病皆何如？岐伯曰∶太過則令人四肢不舉；其不及，則令人九竅不通，名曰重強。帝瞿然而起，再拜而稽首曰∶善。","bh":"","notes":[],"pending":true},{"id":"sw19-5","tags":[],"yw":"吾得脈之大要，天下至數，五色脈變，揆度奇恆，道在於一，神轉不回，回則不轉，乃失其機，至數之要，迫近以微，着之玉版，藏之髒腑，每旦讀之，名曰《玉機》。五髒受氣於其所生，傳之於其所勝，氣舍於其所生，死於其所不勝。病之且死，必先傳行至其所不勝，病乃死。此言氣之逆行也，故死。肝受氣於心，傳之於脾，氣舍於腎，至肺而死。心受氣於脾，傳之於肺，氣舍於肝，至腎而死。脾受氣於肺，傳之於腎，氣舍於心，至肝而死。肺受氣於腎，傳之於肝，氣舍於脾，至心而死。","bh":"","notes":[],"pending":true},{"id":"sw19-6","tags":[],"yw":"腎受氣於肝，傳之於心，氣舍於肺，至脾而死。此皆逆死也。一日一夜五分之，此所以佔死生之早暮也。黃帝曰∶五髒相通，移皆有次，五髒有病，則各傳其所勝。不治，法三月若六月，若三日若六日，傳五髒而當死，是順傳所勝之次。故曰∶別於陽者，知病從來；別於陰者，知死生之期。言知至其所困而死。是故風者百病之長也，今風寒客於人，使人毫毛畢直，皮膚閉而爲熱，當是之時，可汗而發也；或痹不仁腫痛，當是之時，可湯熨及火灸刺而去之。","bh":"","notes":[],"pending":true},{"id":"sw19-7","tags":[],"yw":"弗治，病入舍於肺，名曰肺痹，發咳上氣。弗治，肺即傳而行之肝，病名曰肝痹，一名曰厥，脅痛出食，當是之時，可按若刺耳。弗治，肝傳之脾，病名曰脾風，發癉，腹中熱，煩心出黃，當此之時，可按可藥可浴。弗治，脾傳之腎，病名曰疝瘕，少腹冤熱而痛，出白，一名曰蠱，當此之時，可按可藥。弗治，腎傳之心，病筋脈相引而急，病名曰螈，當此之時，可灸可藥。弗治，滿十日，法當死。腎因傳之心，心即復反傳而行之肺，發寒熱，法當三歲死，此病之次也。","bh":"","notes":[],"pending":true},{"id":"sw19-8","tags":[],"yw":"然其卒發者，不必治於傳，或其傳化有不以次，不以次入者，憂恐悲喜怒，令不得以其次，故令人有大病矣。因而喜大虛則腎氣乘矣，怒則肝氣乘矣，悲則肺氣乘矣，恐則脾氣乘矣，憂則心氣乘矣，此其道也。故病有五，五五二十五變，及其傳化。傳，乘之名也。大骨枯槁，大肉陷下，胸中氣滿，喘息不便，其氣動形，期六月死，真髒脈見，乃予之期日。大骨枯槁，大肉陷下，胸中氣滿，喘息不便，內痛引肩項，期一月死，真髒見，乃予之期日。大骨枯槁，大肉陷下，胸中氣滿，喘息不便，內痛引肩項，身熱脫肉破，真髒見，十月之內死。","bh":"","notes":[],"pending":true},{"id":"sw19-9","tags":[],"yw":"大骨枯槁，大肉陷下，肩髓內消，動作益衰，真髒來見，期一歲死，見其真髒，乃予之期日。大骨枯槁，大肉陷下，胸中氣滿，腹內痛，心中不便，肩項身熱，破脫肉，目匡陷，真髒見，目不見人，立死，其見人者，至其所不勝之時則死。急虛身中卒至，五髒絕閉，脈道不通，氣不往來，譬於墮溺，不可爲期。其脈絕不來，若人一息五六至，其形肉不脫，真髒雖不見，猶死也。真肝脈至，中外急，如循刀刃責責然，如按琴瑟弦，色青白不澤，毛折，乃死。","bh":"","notes":[],"pending":true},{"id":"sw19-10","tags":[],"yw":"真心脈至，堅而搏，如循薏苡子累累然，色赤黑不澤，毛折，乃死。真肺脈至，大而虛，如以毛羽中人膚，色白赤不澤，毛折，乃死。真腎脈至，搏而絕，如指彈石辟辟然，色黑黃不澤，毛折，乃死。真脾脈至，弱而乍數乍疏，色黃青不澤，毛折，乃死。諸真髒脈見者，皆死不治也。黃帝曰∶見真髒曰死，何也？岐伯曰∶五髒者皆稟氣於胃，胃者五髒之本也，髒氣者，不能自致於手太陰，必因於胃氣，乃至於手太陰也，故五髒各以其時，自爲而至於手太陰也。","bh":"","notes":[],"pending":true},{"id":"sw19-11","tags":[],"yw":"故邪氣勝者，精氣衰也，故病甚者，胃氣不能與之俱至於手太陰，故真髒之氣獨見，獨見者病勝髒也，故曰死。帝曰∶善。黃帝曰∶凡治病，察其形氣色澤，脈之盛衰，病之新故，乃治之無後其時。形氣相得，謂之可治；色澤以浮，謂之易已；脈從四時，謂之可治；脈弱以滑，是有胃氣，命曰易治，取之以時。形氣相失，謂之難治；色夭不澤，謂之難已；脈實以堅，謂之益甚；脈逆四時，爲不可治。必察四難，而明告之。所謂逆四時者，春得肺脈，夏得腎脈，秋得心脈，冬得脾脈，其至皆懸絕沉澀者，命曰逆四時。","bh":"","notes":[],"pending":true},{"id":"sw19-12","tags":[],"yw":"未有髒形，於春夏而脈沉澀，秋冬而脈浮大，名曰逆四時也。病熱脈靜，泄而脈大，脫血而脈實，病在中脈實堅，病在外脈不實堅者，皆難治。黃帝曰∶餘聞虛實以決死生，願聞其情。岐伯曰∶五實死，五虛死。帝曰∶願聞五實五虛。岐伯曰∶脈盛，皮熱，腹脹，前後不通，悶瞀，此謂五實。脈細，皮寒，氣少，泄利前後，飲食不入，此謂五虛。帝曰∶其時有生者何也？岐伯曰∶漿粥入胃，泄注止，則虛者活；身汗得後利，則實者活。此其候也。<目錄>卷第六","bh":"","notes":[],"pending":true}]},
{"id":"sw20","book":"素问","no":20,"title":"三部九候论","titleTw":"三部九候論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw20-1","tags":[],"yw":"黃帝問曰∶餘聞九針於夫子，衆多博大，不可勝數。餘願聞要道，以屬子孫，傳之後世，着之骨髓，藏之肝肺，歃血而受，不敢妄泄，令合天道，必有終始，上應天光星辰歷紀，下副四時五行，貴賤更立，冬陰夏陽，以人應之奈何？願聞其方。岐伯對曰∶妙乎哉問也！此天地之至數。帝曰∶願聞天地之至數，合於人形血氣，通決死生，爲之奈何？岐伯曰∶天地之至數，始於一，終於九焉。一者天，二者地，三者人，因而三之，三三者九，以應九野。故人有三部，部有三候，以決死生，以處百病，以調虛實，而除邪疾。","bh":"","notes":[],"pending":true},{"id":"sw20-2","tags":[],"yw":"帝曰∶何謂三部？岐伯曰∶有下部，有中部，有上部，部各有三候，三候者，有天有地有人也，必指而導之，乃以爲真。上部天，兩額之動脈；上部地，兩頰之動脈；上部人，耳前之動脈。中部天，手太陰也；中部地，手陽明也；中部人，手少陰也。下部天，足厥陰也；下部地，足少陰也；下部人，足太陰也。故下部之天以候肝，地以候腎，人以候脾胃之氣。帝曰∶中部之候奈何？岐伯曰∶亦有天，亦有地，亦有人。天以候肺，地以候胸中之氣，人以候心。","bh":"","notes":[],"pending":true},{"id":"sw20-3","tags":[],"yw":"帝曰∶上部以何候之？岐伯曰∶亦有天，亦有地，亦有人。天以候頭角之氣，地以候口齒之氣，人以候耳目之氣。三部者，各有天，各有地，各有人。三而成天，三而成地，三而成人。三而三之，合則爲九，九分爲九野，九野爲九藏。故神藏五，形藏四，合爲九藏。五髒已敗，其色必夭，夭必死矣。帝曰∶以候奈何？岐伯曰∶必先度其形之肥瘦，以調其氣之虛實，實則瀉之，虛則補之。必先去其血脈而後調之，無問其病，以平爲期。帝曰∶決死生奈何？岐伯曰∶形盛脈細，少氣不足以息者危。","bh":"","notes":[],"pending":true},{"id":"sw20-4","tags":[],"yw":"形瘦脈大，胸中多氣者死。形氣相得者生。參伍不調者病。三部九候皆相失者死。上下左右之脈相應如參舂者病甚。上下左右相失不可數者死。中部之候雖獨調，與衆髒相失者死。中部之候相減者死。目內陷者死。帝曰∶何以知病之所在？岐伯曰∶察九候獨小者病，獨大者病，獨疾者病，獨遲者病，獨熱者病，獨寒者病，獨陷下者病。以左手足上，上去踝五寸按之，庶右手足當踝而彈之，其應過五寸以上，蠕蠕然者不病；其應疾，中手渾渾然者病；中手徐徐然者病；其應上不能至五寸，彈之不應者死。","bh":"","notes":[],"pending":true},{"id":"sw20-5","tags":[],"yw":"是以脫肉身不去者死。中部乍疏乍數者死。其脈代而鉤者，病在絡脈。九候之相應也，上下若一，不得相失。一候後則病，二候後則病甚，三候後則病危。所謂後者，應不俱也。察其腑髒，以知死生之期，必先知經脈，然後知病脈，真髒脈見者勝死。足太陽氣絕者，其足不可屈伸，死必戴眼。帝曰∶冬陰夏陽奈何？岐伯曰∶九候之脈，皆沉細懸絕者爲陰，主冬，故以夜半死。盛躁喘數者爲陽，主夏，故以日中死。是故寒熱病者，以平旦死。熱中及熱病者，以日中死。","bh":"","notes":[],"pending":true},{"id":"sw20-6","tags":[],"yw":"病風者，以日夕死。病水者，以夜半死。其脈乍疏乍數乍遲乍疾者，日乘四季死。形肉已脫，九候雖調，猶死。七診雖見，九候皆從者不死。所言不死者，風氣之病及經月之病，似七診之病而非也，故言不死。若有七診之病，其脈候亦敗者死矣，必發噦噫。必審問其所始病，與今之所方病，而後各切循其脈，視其經絡浮沉，以上下逆從循之，其脈疾者不病，其脈遲者病，脈不往來者死，皮膚着者死。帝曰∶其可治者奈何？岐伯曰∶經病者治其經，孫絡病者治其孫絡血，血病身有痛者治其經絡。","bh":"","notes":[],"pending":true},{"id":"sw20-7","tags":[],"yw":"其病者在奇邪，奇邪之脈則繆刺之。留瘦不移，節而刺之。上實下虛，切而從之，索其結絡脈，刺出其血，以見通之。瞳子高者太陽不足，戴眼者太陽已絕，此決死生之要，不可不察也。手指及手外踝上五指留針。玉機真髒論∶溉（古代切）窳（音愈）（渠殞切）瞀（莫候切）三部九候論∶歃（所甲切，飲血也）（古營切）蠕（而勻切）<目錄>卷第七","bh":"","notes":[],"pending":true}]},
{"id":"sw22","book":"素问","no":22,"title":"脏气法时论","titleTw":"髒氣法時論","tags":["bingji","zangxiang","yinyang"],"brief":"","pending":true,"sections":[{"id":"sw22-1","tags":[],"yw":"黃帝問曰∶合人形以法四時五行而治，何如而從？何如而逆？得失之意，願聞其事。岐伯對曰∶五行者，金木水火土也，更貴更賤，以知死生，以決成敗，而定五髒之氣，間甚之時，死生之期也。帝曰∶願卒聞之。岐伯曰∶肝主春，足厥陰少陽主治，其日甲乙，肝苦急，急食甘以緩之。心主夏，手少陰太陽主治，其日丙丁，心苦緩，急食酸以收之。脾主長夏，足太陰陽明主治，其日戊己，脾苦溼，急食苦以燥之。肺主秋，手太陰陽明主治，其日庚辛，肺苦氣上逆，急食苦以泄之。","bh":"","notes":[],"pending":true},{"id":"sw22-2","tags":[],"yw":"腎主冬，足少陰太陽主治，其日壬癸，腎苦燥，急食辛以潤之，開腠理，致津液，通氣也。病在肝，愈於夏，夏不愈，甚於秋，秋不死，持於冬，起於春，禁當風。肝病者，愈在丙丁，丙丁不愈，加於庚辛，庚辛不死，持於壬癸，起於甲乙。肝病者，平旦慧，下晡甚，夜半靜。肝欲散，急食辛以散之，用辛補之，酸瀉之。病在心，愈在長夏，長夏不愈，甚於冬，冬不死，持於春，起於夏，禁溫食熱衣。心病者，愈在戊己，戊己不愈，加於壬癸，壬癸不死。","bh":"","notes":[],"pending":true},{"id":"sw22-3","tags":[],"yw":"持於甲乙，起於丙丁。心病者，日中慧，夜半甚，平旦靜。心欲，急食鹹以之，用鹹補之，甘瀉之。病在脾，愈在秋，秋不愈，甚於春，春不死，持於夏，起於長夏，禁溫食飽食溼地濡衣。脾病者，愈在庚辛，庚辛不愈，加於甲乙，甲乙不死，持於丙丁，起於戊己。脾病者，日慧，日出甚，下晡靜。脾欲緩，急食甘以緩之，用苦瀉之，甘補之。病在肺，愈在冬，冬不愈，甚於夏，夏不死，持於長夏，起於秋，禁寒飲食寒衣。肺病者，愈在壬癸，壬癸不愈，加於丙丁，丙丁不死，持於戊己，起於庚辛。","bh":"","notes":[],"pending":true},{"id":"sw22-4","tags":[],"yw":"肺病者，下晡慧，日中甚，夜半靜。肺欲收，急食酸以收之，用酸補之，辛瀉之。病在腎，愈在春，春不愈，甚於長夏，長夏不死，持於秋，起於冬，禁犯淬HT熱食溫炙衣。腎病者，愈在甲乙，甲乙不愈，甚於戊己，戊己不死，持於庚辛，起於壬癸。腎病者，夜半慧，四季甚，下晡靜。腎欲堅，急食苦以堅之，用苦補之，鹹瀉之。夫邪氣之客於身也，以勝相加，至其所生而愈，至其所不勝而甚，至於所生而持，自得其位而起。必先定五髒之脈，乃可言間甚之時，死生之期也。","bh":"","notes":[],"pending":true},{"id":"sw22-5","tags":[],"yw":"肝病者，兩脅下痛引少腹，令人善怒，虛則目KTKT無所見，耳無所聞，善恐如人將捕之，取其經，厥陰與少陽，氣逆，則頭痛耳聾不聰頰腫。取血者。心病者，胸中痛，脅支滿，脅下痛，膺背肩甲間痛，兩臂內痛，虛則胸腹大，脅下與腰相引而痛，取其經，少陰太陽，舌下血者。其變病，刺中血者。脾病者，身重善肌肉痿，足不收行，善螈腳下痛，虛則腹滿腸鳴，飧泄食不化，取其經，太陰陽明少陰血者。肺病者，喘咳逆氣，肩背痛，汗出尻陰股膝髀足皆痛，虛則少氣不能報息，耳聾嗌干，取其經，太陰足太陽之外厥陰內血者。","bh":"","notes":[],"pending":true},{"id":"sw22-6","tags":[],"yw":"腎病者，腹大脛腫，喘咳身重，寢汗出憎風，虛則胸中痛，大腹小腹痛，清厥意不樂，取其經，少陰太陽血者。肝色青，宜食甘，粳米牛肉棗葵皆甘。心色赤，宜食酸，小豆犬肉李韭皆酸。肺色白，宜食苦，麥羊肉杏薤皆苦。脾色黃，宜食鹹，大豆豕肉慄藿皆鹹。腎色黑，宜食辛，黃黍雞肉桃蔥皆辛。辛散，酸收，甘緩，苦堅，鹹。毒藥攻邪，五谷爲養，五果爲助，五畜爲益，五菜爲充，氣味合而服之，以補精益氣。此五者，有辛酸甘苦鹹，各有所利，或散或收，或緩或急，或堅或，四時五髒，病隨五味所宜也。","bh":"","notes":[],"pending":true},{"id":"sw22-7","tags":[],"yw":"<目錄>卷第七","bh":"","notes":[],"pending":true}]},
{"id":"sw23","book":"素问","no":23,"title":"宣明五气","titleTw":"宣明五氣","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw23-1","tags":[],"yw":"五味所入∶酸入肝，辛入肺，苦入心，鹹入腎，甘入脾，是謂五入。五氣所病∶心爲噫，肺爲咳，肝爲語，脾爲吞，腎爲欠爲嚏，胃爲氣逆爲噦爲恐，大腸小腸爲泄，下焦溢爲水，膀胱不利爲癃，不約爲遺溺，膽爲怒，是謂五病。五精所並∶精氣並於心則喜，並於肺則悲，並於肝則憂，並於脾則畏，並於腎則恐，是謂五並，虛而相並者也。五髒所惡∶心惡熱，肺惡寒，肝惡風，脾惡溼，腎惡燥，是謂五惡。五髒化液∶心爲汗，肺爲涕，肝爲淚，脾爲涎，腎爲唾，是謂五液。","bh":"","notes":[],"pending":true},{"id":"sw23-2","tags":[],"yw":"五味所禁∶辛走氣，氣病無多食辛；鹹走血，血病無多食鹹；苦走骨，骨病無多食苦；甘走肉，肉病無多食甘；酸走筋，筋病無多食酸。是謂五禁，無令多食。五病所發∶陰病發於骨，陽病發於血，陰病發於肉，陽病發於冬，陰病發於夏，是謂五發。五邪所亂∶邪入於陽則狂，邪入於陰則痹，搏陽則爲巔疾，搏陰則爲喑，陽入之陰則靜，陰出之陽則怒，是謂五亂。五邪所見∶春得秋脈，夏得冬脈，長夏得春脈，秋得夏脈，冬得長夏脈，名曰陰出之陽，病善怒不治，是謂五邪，皆同命，死不治。","bh":"","notes":[],"pending":true},{"id":"sw23-3","tags":[],"yw":"五髒所藏∶心藏神，肺藏魄，肝藏魂，脾藏意，腎藏志，是謂五髒所藏。五髒所主∶心主脈，肺主皮，肝主筋，脾主肉，腎主骨，是謂五主。五勞所傷∶久視傷血，久臥傷氣，久坐傷肉，久立傷骨，久行傷筋，是謂五勞所傷。五脈應象∶肝脈弦，心脈鉤，脾脈代，肺脈毛，腎脈石，是謂五髒之脈。<目錄>卷第七","bh":"","notes":[],"pending":true}]},
{"id":"sw24","book":"素问","no":24,"title":"血气形志","titleTw":"血氣形志","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw24-1","tags":[],"yw":"夫人之常數，太陽常多血少氣，少陽常少血多氣，陽明常多氣多血，少陰常少血多氣，厥陰常多血少氣，太陰常多氣少血，此天之常數。足太陽與少陰爲表裏，少陽與厥陰爲表裏，陽明與太陰爲表裏，是爲足陰陽也。手太陽與少陰爲表裏，少陽與心主爲表裏，陽明與太陰爲表裏，是爲手之陰陽也。今知手足陰陽所苦，凡治病必先去其血，乃去其所苦，伺之所欲，然後瀉有餘，補不足。欲知背俞，先度其兩乳間，中折之，更以他草度去半已，即以兩隅相拄也，乃舉以度其背，令其一隅居上，齊脊大椎，兩隅在下，當其下隅者，肺之俞也。","bh":"","notes":[],"pending":true},{"id":"sw24-2","tags":[],"yw":"復下一度，心之俞也。復下一度，左角肝之俞也，右角脾之俞也。復下一度，腎之俞也。是謂五髒之俞，灸刺之度也。形樂志苦，病生於脈，治之以灸刺。形樂志樂，病生於肉，治之以針石。形苦志樂，病生於筋，治之以熨引。形苦志苦，病生於咽嗌，治之以百藥。形數驚恐，經絡不通，病生於不仁，治之以按摩醪藥。是謂五形志也。刺陽明出血氣，刺太陽出血惡氣，刺少陽出氣惡血，刺太陰出氣惡血，刺少陰出氣惡血，刺厥陰出血惡氣也。經脈別論∶跌僕（音赴）罷極（上音疲）如漚（下音甌）髒氣法時論∶慧（音惠）淬（七內切）HT（烏開切）KTKT（音荒）內（人朱切）宣明五氣篇∶翕（音吸）（音帝）窒（陡慄切）凝泣（澀）喑（讀作音）血氣形志篇∶相柱（知庚切）（音鈹）<目錄>卷第八","bh":"","notes":[],"pending":true}]},
{"id":"sw25","book":"素问","no":25,"title":"宝命全角论","titleTw":"寶命全角論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw25-1","tags":[],"yw":"黃帝問曰∶天復地載，萬物悉備，莫貴於人，人以天地之氣生，四時之法成，君王衆庶，盡欲全角，形之疾病，莫知其情，留淫日深，着於骨髓，心私慮之。餘欲針除其疾病，爲之奈何？岐伯對曰∶夫鹽之味鹹者，其氣令器津泄；弦絕者，其音嘶敗；木敷者，其葉發；病深者，其聲噦。人有此三者，是謂壞府，毒藥無治，短針無取，此皆絕皮傷肉，血氣爭黑。帝曰∶餘念其痛，心爲之亂惑反甚，其病不可更代，百姓聞之，以爲殘賊，爲之奈何？岐伯曰∶夫人生於地，懸命於天，天地合氣，命之曰人。","bh":"","notes":[],"pending":true},{"id":"sw25-2","tags":[],"yw":"人能應四時者，天地爲之父母；知萬物者，謂之天子。天有陰陽，人有十二節；天有寒暑，人有虛實。能經天地陰陽之化者，不失四時；知十二節之理者，聖智不能欺也；能存八動之變，五勝更立；能達虛實之數者，獨出獨入，吟至微，秋毫在目。帝曰∶人生有形，不離陰陽，天地合氣，別爲九野，分爲四時，月有小大，日有短長，萬物並至，不可勝量，虛實吟，敢問其方？岐伯曰∶木得金而伐，火得水而滅，土得木而達，金得火而缺，水得土而絕，萬物盡然，不可勝竭。","bh":"","notes":[],"pending":true},{"id":"sw25-3","tags":[],"yw":"故針有懸布天下者五，黔首共餘食，莫知之也。一曰治神，二曰知養身，三曰知毒藥爲真，四曰制砭石小大，五曰知腑髒血氣之診。五法俱立，各有所先。今末世之刺也，虛者實之，滿者泄之，此皆衆工所共知也。若夫法天則地，隨應而動，和之者若響，隨之者若影，道無鬼神，獨來獨往。帝曰∶願聞其道。岐伯曰∶凡刺之真，必先治神，五髒已定，九候已備，後乃存針，衆脈不見，衆兇弗聞，外內相得，無以形先，可玩往來，乃施於人。人有虛實，五虛勿近，五實勿遠，至其當發，間不容。","bh":"","notes":[],"pending":true},{"id":"sw25-4","tags":[],"yw":"手動若務，針耀而勻，靜意視義，觀適之變，是謂冥冥，莫知其形，見其烏烏，見其稷稷，從見其飛，不知其誰，伏如橫弩，起如發機。帝曰∶何如而虛？何如而實？岐伯曰∶刺實者須其虛，刺虛者須其實，經氣已至，慎守勿失，深淺在志，遠近若一，如臨深淵，手如握虎，神無營於衆物。<目錄>卷第八","bh":"","notes":[],"pending":true}]},
{"id":"sw26","book":"素问","no":26,"title":"八正神明论","titleTw":"八正神明論","tags":["ci","jingluo","bingji"],"brief":"","pending":true,"sections":[{"id":"sw26-1","tags":[],"yw":"黃帝問曰∶用針之服，必有法則焉，今何法何則？岐伯對曰∶法天則地，合以天光。帝曰∶願卒聞之。岐伯曰∶凡刺之法，必候日月星辰，四時八正之氣，氣定乃刺之。是故天溫日明，則人血淖液而衛氣浮，故血易瀉，氣易行；天寒日陰，則人血凝泣而衛氣沉。月始生，則血氣始精，衛氣始行；月郭滿，則血氣實，肌肉堅；月郭空，則肌肉減，經絡虛，衛氣去，形獨居。是以因天時而調血氣也。是以天寒無刺，天溫無疑。月生無瀉，月滿無補，月郭空無治，是謂得時而調之。","bh":"","notes":[],"pending":true},{"id":"sw26-2","tags":[],"yw":"因天之序，盛虛之時，移光定位，正立而待之。故曰月生而瀉，是謂髒虛，月滿而補，血氣揚溢，絡有留血，命曰重實；月郭空而治，是謂亂經。陰陽相錯，真邪不別，沉以留止，外虛內亂，淫邪乃起。帝曰∶星辰八正何候？岐伯曰∶星辰者，所以制日月之行也。八正者，所以候八風之虛邪以時至者也。四時者，所以分春秋冬夏之氣所在，以時調之，候八正之虛邪，而避之勿犯也。以身之虛，而逢天之虛，兩虛相感，其氣至骨，入則傷五髒，工候救之，弗能傷也，故曰∶天忌不可不知也。","bh":"","notes":[],"pending":true},{"id":"sw26-3","tags":[],"yw":"帝曰∶善。其法星辰者，餘聞之矣，願聞法往古者。岐伯曰∶法往古者，先知針經也。驗於來今者，先知日之寒溫，月之虛盛，以候氣之浮沉，而調之於身，觀其立有驗也。觀於冥冥者，言形氣榮衛之不形於外，而工獨知之，以日之寒溫，月之虛盛，四時氣之浮沉，參伍相合而調之，工常先見之，然而不形於外，故曰觀於冥冥焉。通於無窮者，可以傳於後世也，是故工之所以異也，然而不形見於外，故俱不能見也。視之無形，嘗之無味，故謂冥冥，若神仿佛。","bh":"","notes":[],"pending":true},{"id":"sw26-4","tags":[],"yw":"虛邪者，八正之虛邪氣也。正邪者，身形若用力汗出，腠理開，逢虛風，其中人也微，故莫知其情，莫見其形。上工救其萌牙，必先見三部九候之氣，盡調不敗而救之，故曰上工。下工救其已成，救其已敗。救其已成者，言不知三部九候之相失，因病而敗之也。知其所在者，知診三部九候之病脈處而治之，故曰守其門戶焉，莫知其情而見邪形也。帝曰∶餘聞補瀉，未得其意。岐伯曰∶瀉必用方，方者，以氣方盛也，以月方滿也，以日方溫也，以身方定也，以息方吸而內針，乃復候其方吸而轉針，乃復候其方呼而徐引針，故曰瀉必用方，其氣乃行焉。","bh":"","notes":[],"pending":true},{"id":"sw26-5","tags":[],"yw":"補必用員，員者行也，行者移也，刺必中其榮，復以吸排針也。故員與方，非針也。故養神者，必知形之肥瘦，榮衛血氣之盛衰。血氣者，人之神，不可不謹養。帝曰∶妙乎哉論也！合人形於陰陽四時，虛實之應，冥冥之期，其非夫子孰能通之。然夫子數言形與神，何謂形？何謂神？願卒聞之。岐伯曰∶請言形，形乎形，目冥冥，問其所病，索之於經，慧然在前，按之不得，不知其情，故曰形。帝曰∶何謂神？岐伯曰∶請言神，神乎神，耳不聞，目明心開而志先，慧然獨悟，口弗能言，俱視獨見，適若昏，昭然獨明，若風吹雲，故曰神。","bh":"","notes":[],"pending":true},{"id":"sw26-6","tags":[],"yw":"三部九候爲之原，九針之論不必存也。<目錄>卷第八","bh":"","notes":[],"pending":true}]},
{"id":"sw27","book":"素问","no":27,"title":"离合真邪论","titleTw":"離合真邪論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw27-1","tags":[],"yw":"黃帝問曰∶餘聞九針九篇，夫子乃因而九之，九九八十一篇，餘盡通其意矣。經言氣之盛衰，左右傾移，以上調下，以左調右，有餘不足，補瀉於滎輸，餘知之矣。此皆榮衛之傾移，虛實之所生，非邪氣從外入於經也。餘願聞邪氣之在經也，其病患何如？取之奈何？岐伯對曰∶夫聖人之起度數，必應於天地，故天有宿度，地有經水，人有經脈。天地溫和，則經水安靜；天寒地凍，則經水凝泣；天暑地熱，則經水沸溢；卒風暴起，則經水波湧而隴起。夫邪之入於脈也，寒則血凝泣，暑則氣淖澤，虛邪因而入客，亦如經水之得風也，經之動脈，其至也亦時隴起，其行於脈中循循然，其至寸口中手也，時大時小，大則邪至，小則平，其行無常處，在陰與陽，不可爲度，從而察之，三部九候，卒然逢之，早遏其路。","bh":"","notes":[],"pending":true},{"id":"sw27-2","tags":[],"yw":"吸則內針，無令氣忤，靜以久留，無令邪布，吸則轉針，以得氣爲故，候呼引針，呼盡乃去，大氣皆出，故命曰瀉。帝曰∶不足者補之奈何？岐伯曰∶必先捫而循之，切而散之，推而按之，彈而怒之，抓而下之，通而取之，外引其門，以閉其神，呼盡內針，靜以久留，以氣至爲故，如待所貴，不知日暮，其氣以至，適而自護，候吸引針，氣不得出，各在其處，推闔其門，令神氣存，大氣留止，故命曰補。帝曰∶候氣奈何？岐伯曰∶夫邪去絡入於經也，舍於血脈之中，其寒溫未相得，如湧波之起也，時來時去，故不常在。","bh":"","notes":[],"pending":true},{"id":"sw27-3","tags":[],"yw":"故曰方其來也，必按而止之，止而取之，無逢其衝而瀉之。真氣者，經氣也，經氣太虛，故曰其來不可逢，此之謂也。故曰候邪不審，大氣已過，瀉之則真氣脫，脫則不復，邪氣復至，而病益蓄，故曰其往不可追，此之謂也。不可掛以發者，待邪之至時而發針瀉矣，若先若後者，血氣已盡，其病不可下，故曰知其可取如發機，不知其取如扣椎，故曰知機道者不可掛以發，不知機者扣之不發，此之謂也。帝曰∶補瀉奈何？岐伯曰∶此攻邪也，疾出以去盛血，而復其真氣，此邪新客，溶溶未有定處也，推之則前，引之則止，逆而刺之，溫血也。","bh":"","notes":[],"pending":true},{"id":"sw27-4","tags":[],"yw":"刺出其血，其病立已。帝曰∶善。然真邪以合，波隴不起，候之奈何？岐伯曰∶審捫循三部九候之盛虛而調之，察其左右上下相失及相減者，審其病髒以期之。不知三部者，陰陽不別，天地不分。地以候地，天以候天，人以候人，調之中府，以定三部，故曰刺不知三部九候病脈之處，雖有大過且至，工不能禁也。誅罰無過，命曰大惑，反亂大經，真不可復，用實爲虛，以邪爲真，用針無義，反爲氣賊，奪人正氣，以從爲逆，榮衛散亂，真氣已失，邪獨內着，絕人長命，予人天殃，不知三部九候，故不能久長。","bh":"","notes":[],"pending":true},{"id":"sw27-5","tags":[],"yw":"因不知合之四時五行，因加相勝，釋邪攻正，絕人長命。邪之新客來也，未有定處，推之則前，引之則止，逢而瀉之，其病立已。<目錄>卷第八","bh":"","notes":[],"pending":true}]},
{"id":"sw28","book":"素问","no":28,"title":"通评虚实论","titleTw":"通評虛實論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"sw28-1","tags":[],"yw":"黃帝問曰∶何謂虛實？岐伯對曰∶邪氣盛則實，精氣奪則虛。帝曰∶虛實何如？岐伯曰∶氣虛者肺虛也，氣逆者足寒也，非其時則生，當其時則死。餘髒皆如此。帝曰∶何謂重實？岐伯曰∶所謂重實者，言大熱病，氣熱脈滿，是謂重實。帝曰∶經絡俱實何如？何以治之？岐伯曰∶經絡皆實，是寸脈急而尺緩也，皆當治之，故曰滑則從，澀則逆也。夫虛實者，皆從其物類始，故五髒骨肉滑利，可以長久也。帝曰∶絡氣不足，經氣有餘，何如？岐伯曰∶絡氣不足，經氣有餘者，脈口熱而尺寒也，秋冬爲逆，春夏爲從，治主病者。","bh":"","notes":[],"pending":true},{"id":"sw28-2","tags":[],"yw":"帝曰∶經虛絡滿何如？岐伯曰∶經虛絡滿者，尺熱滿脈口寒澀也，此春夏死秋冬生也。帝曰∶治此者奈何？岐伯曰∶絡滿經虛，灸陰刺陽；經滿絡虛，刺陰灸陽。帝曰∶何謂重虛？岐伯曰∶脈氣上虛尺虛，是謂重虛。帝曰∶何以治之？岐伯曰∶所謂氣虛者，言無常也。尺虛者，行步然。脈虛者，不象陰也。如此者，滑則生，澀則死也。帝曰∶寒氣暴上，脈滿而實何如？岐伯曰∶實而滑則生，實而逆則死。帝曰∶脈實滿，手足寒，頭熱，何如？岐伯曰∶春秋則生，冬夏則死。","bh":"","notes":[],"pending":true},{"id":"sw28-3","tags":[],"yw":"脈浮而澀，澀而身有熱者死。帝曰∶其形盡滿何如？岐伯曰∶其形盡滿者，脈急大堅，尺澀而不應也，如是者，故從則生，逆則死。帝曰∶何謂從則生，逆則死？岐伯曰∶所謂從者，手足溫也。所謂逆者，手足寒也。帝曰∶乳子而病熱，脈懸小者何如？岐伯曰∶手足溫則生，寒則死。帝曰∶乳子中風熱，喘鳴肩息者，脈何如？岐伯曰∶喘鳴肩息者，脈實大也，緩則生，急則死。帝曰∶腸便血何如？岐伯曰∶身熱則死，寒則生。帝曰∶腸下白沫何如？岐伯曰∶脈沉則生，脈浮則死。","bh":"","notes":[],"pending":true},{"id":"sw28-4","tags":[],"yw":"帝曰∶腸下膿血何如？岐伯曰∶脈懸絕則死，滑大則生。帝曰∶腸之屬，身不熱，脈不懸絕何如？岐伯曰∶滑大者曰生，懸澀者曰死，以髒期之。帝曰∶癲疾何如？岐伯曰∶脈搏大滑，久自已；脈小堅急，死不治。帝曰∶癲疾之脈，虛實何如？岐伯曰∶虛則可治，實則死，帝曰∶消癉虛實何如？岐伯曰∶脈實大，病久可治；脈懸小堅，病久不可治。帝曰∶形度骨度脈度筋度，何以知其度也？帝曰∶春亟治經絡，夏亟治經俞，秋亟治六腑，冬則閉塞。閉塞者，用藥而少針石也。","bh":"","notes":[],"pending":true},{"id":"sw28-5","tags":[],"yw":"所謂少針石者，非癰疽之謂也，癰疽不得頃時回。癰不知所，按之不應手，乍來乍已，刺手太陰旁三與纓脈各二。掖癰大熱，刺足少陽五，刺而熱不止，刺手心主三，刺手太陰經絡者大骨之會各三。暴癰筋，隨分而痛，魄汗不盡，胞氣不足，治在經俞。腹暴滿，按之不下，取手太陽經絡者，胃之募也，少陰俞去脊椎三寸旁五，用員利針。霍亂，刺俞旁五，足陽明及上旁三。刺癇驚脈五，針手太陰各五，刺經太陽五，刺手少陰經絡旁者一，足陽明一，上踝五寸刺三針。","bh":"","notes":[],"pending":true},{"id":"sw28-6","tags":[],"yw":"凡治消癉僕擊，偏枯痿厥，氣滿發逆，甘肥貴人，則高梁之疾也。隔塞閉絕，上下不通，則暴憂之病也。暴厥而聾，偏塞閉不通，內氣暴薄也。不從內外中風之病，故瘦留着也。跛，寒風溼之病也。黃帝曰∶黃膽暴痛，癲疾厥狂，久逆之所生也。五髒不平，六腑閉塞之所生也。頭痛耳鳴，九竅不利，腸胃之所生也。<目錄>卷第八","bh":"","notes":[],"pending":true}]},
{"id":"sw29","book":"素问","no":29,"title":"太阴阳明论","titleTw":"太陰陽明論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw29-1","tags":[],"yw":"黃帝問曰∶太陰陽明爲表裏，脾胃脈也，生病而異者何也？岐伯對曰∶陰陽異位，更虛更實，更逆更從，或從內，或從外，所從不同，故病異名也。帝曰∶願聞其異狀也。岐伯曰∶陽者，天氣也，主外；陰者，地氣也，主內。故陽道實，陰道虛。故犯賊風虛邪者，陽受之；食飲不節起居不時者，陰受之。陽受之則入六腑，陰受之則入五髒。入六腑則身熱不時臥，上爲喘呼；入五髒則滿閉塞，下爲飧泄，久爲腸。故喉主天氣，咽主地氣。故陽受風氣，陰受溼氣。","bh":"","notes":[],"pending":true},{"id":"sw29-2","tags":[],"yw":"故陰氣從足上行至頭，而下行循臂至指端；陽氣從手上行至頭，而下行至足。故曰陽病者上行極而下，陰病者下行極而上。故傷於風者，上先受之；傷於溼者，下先受之。帝曰∶脾病而四肢不用何也？岐伯曰∶四肢皆稟氣於胃，而不得至經，必因於脾，乃得稟也。今脾病不能爲胃行其津液，四肢不得稟水谷氣，氣日以衰，脈道不利，筋骨肌肉，皆無氣以生，故不用焉。帝曰∶脾不主時何也？岐伯曰∶脾者土也，治中央，常以四時長四髒，各十八日寄治，不得獨主於時也。","bh":"","notes":[],"pending":true},{"id":"sw29-3","tags":[],"yw":"脾髒者常着胃土之精也，土者生萬物而法天地，故上下至頭足，不得主時也。帝曰∶脾與胃以膜相連耳，而能爲之行其津液何也？岐伯曰∶足太陰者三陰也，其脈貫胃屬脾絡嗌，故太陰爲之行氣於三陰。陽明者表也，五髒六腑之海也，亦爲之行氣於三陽。髒腑各因其經而受氣於陽明，故爲胃行其津液。四肢不得稟水谷氣，日以益衰，陰道不利，筋骨肌肉無氣以生，故不用焉。<目錄>卷第八","bh":"","notes":[],"pending":true}]},
{"id":"sw30","book":"素问","no":30,"title":"阳明脉解","titleTw":"陽明脈解","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw30-1","tags":[],"yw":"黃帝問曰∶足陽明之脈病，惡人與火，聞木音則惕然而驚，鍾鼓不爲動，聞木音而驚何也？願聞其故。岐伯對曰∶陽明者胃脈也，胃者土也，故聞木音而驚者，土惡木也。帝曰∶善。其惡火何也？岐伯曰∶陽明主肉，其脈血氣盛，邪客之則熱，熱甚則惡火。帝曰∶其惡人何也？岐伯曰∶陽明厥則喘而惋，惋則惡人。帝曰∶或喘而死者，或喘而生者，何也？岐伯曰∶厥逆連髒則死，連經則生。帝曰∶善。病甚則棄衣而走，登高而歌，或至不食數日，逾垣上屋，所上之處，皆非其素所能也，病反能者何也？岐伯曰∶四肢者諸陽之本也，陽盛則四肢實，實則能登高也。","bh":"","notes":[],"pending":true},{"id":"sw30-2","tags":[],"yw":"帝曰∶其棄衣而走者何也？岐伯曰∶熱盛於身，故棄衣欲走也。帝曰∶其妄言罵詈不避親疏而歌者何也？岐伯曰∶陽盛則使人妄言罵詈不避親疏而不欲食，不欲食故妄走也。寶命全角論∶嗄（所嫁切）吟（上丘伽切）黔（音鉗）棄蔑（音滅）容（音舜）八正神明論∶仿佛（上音仿，下音弗）離合真邪論∶（徐倫切）蚊虻（武庚切）捫（音門）抓（側交切）溶（音容）通評虛實論∶（去王切）（榮美切）（之石切）太陰陽明論∶閉塞（蘇則切）陽明脈解篇∶惋（烏貫切）逾（音於）<目錄>卷第九","bh":"","notes":[],"pending":true}]},
{"id":"sw31","book":"素问","no":31,"title":"热论","titleTw":"熱論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw31-1","tags":[],"yw":"黃帝問曰∶今夫熱病者，皆傷寒之類也，或愈或死，其死皆以六七日之間，其愈皆以十日以上者何也？不知其解，願聞其故。岐伯對曰∶巨陽者，諸陽之屬也，其脈連於風府，故爲諸陽主氣也。人之傷於寒也，則爲病熱，熱雖甚不死；其兩感於寒而病者，必不免於死。帝曰∶願聞其狀。岐伯曰∶傷寒一日，巨陽受之，故頭項痛腰脊強。二日陽明受之，陽明主肉，其脈挾鼻絡於目，故身熱目疼而鼻干，不得臥也。三日少陽受之，少陽主膽，其脈循脅絡於耳，故胸脅痛而耳聾。","bh":"","notes":[],"pending":true},{"id":"sw31-2","tags":[],"yw":"三陽經絡皆受其病，而未入於髒者，故可汗而已。四日太陰受之，太陰脈布胃中絡於嗌，故腹滿而嗌干。五日少陰受之，少陰脈貫腎絡於肺，系舌本，故口燥舌干而渴。六日厥陰受之，厥陰脈循陰器而絡於肝，故煩滿而囊縮。三陰三陽，五髒六腑皆受病，榮衛不行，五髒不通，則死矣。其不兩感於寒者，七日巨陽病衰，頭痛少愈；八日陽明病衰，身熱少愈；九日少陽病衰，耳聾微聞；十日太陰病衰，腹減如故，則思飲食；十一日少陰病衰，渴止不滿，舌干已而嚏；十二日厥陰病衰，囊縱少腹微下，大氣皆去，病日已矣。","bh":"","notes":[],"pending":true},{"id":"sw31-3","tags":[],"yw":"帝曰∶治之奈何？岐伯曰∶治之各通其髒脈，病日衰已矣。其未滿三日者，可汗而已；其滿三日者，可泄而已。帝曰∶熱病已愈，時有所遺者何也？岐伯曰∶諸遺者，熱甚而強食之，故有所遺也。若此者，皆病已衰而熱有所藏，因其谷氣相薄，兩熱相合，故有所遺也。帝曰∶善。治遺奈何？岐伯曰∶視其虛實，調其逆從，可使必已矣。帝曰∶病熱當何禁之？岐伯曰∶病熱少愈，食肉則復，多食則遺，此其禁也。帝曰∶其病兩感於寒者，其脈應與其病形何如？岐伯曰∶兩感於寒者，病一日則巨陽與少陰俱病，則頭痛口干而煩滿；二日則陽明與太陰俱病，則腹滿身熱，不欲食譫言；三日則少陽與厥陰俱病，則耳聾囊縮而厥，水漿不入，不知人，六日死。","bh":"","notes":[],"pending":true},{"id":"sw31-4","tags":[],"yw":"帝曰∶五髒已傷，六腑不通，榮衛不行，如是之後，三日乃死何也？岐伯曰∶陽明者，十二經脈之長也，其血氣盛，故不知人，三日其氣乃盡，故死矣。凡病傷寒而成溫者，先夏至日者爲病溫，後夏至日者爲病暑，暑當與汗皆出，勿止。<目錄>卷第九","bh":"","notes":[],"pending":true}]},
{"id":"sw32","book":"素问","no":32,"title":"刺热","titleTw":"刺熱","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw32-1","tags":[],"yw":"肝熱病者，小便先黃，腹痛多臥身熱，熱爭則狂言及驚，脅滿痛，手足躁，不得安臥，庚辛甚，甲乙大汗，氣逆則庚辛死，刺足厥陰少陽，其逆則頭痛員員，脈引衝頭也。心熱病者，先不樂，數日乃熱，熱爭則卒心痛，煩悶善嘔，頭痛面赤無汗，壬癸甚，丙丁大汗，氣逆則壬癸死，刺手少陰太陽。脾熱病者，先頭重頰痛，煩心顏青，欲嘔身熱，熱爭則腰痛不可用俯仰，腹滿泄，兩頷痛，甲乙甚，戊己大汗，氣逆則甲乙死，刺足太陰陽明。肺熱病者，先淅然厥，起毫毛，惡風寒，舌上黃身熱。","bh":"","notes":[],"pending":true},{"id":"sw32-2","tags":[],"yw":"熱爭則喘咳，痛走胸膺背，不得大息，頭痛不堪，汗出而寒，丙丁甚，庚辛大汗，氣逆則丙丁死，刺手太陰陽明，出血如大豆，立已。腎熱病者，先腰痛，苦渴數飲身熱，熱爭則項痛而強，寒且，足下熱，不欲言，其逆則項痛員員淡淡然，戊己甚，壬癸大汗，氣逆則戊己死，刺足少陰太陽，諸汗者，至其所勝日汗出也。肝熱病者左頰先赤，心熱病者顏先赤，脾熱病者鼻先赤，肺熱病者右頰先赤，腎熱病者頤先赤，病雖未發，見赤色者刺之，名曰治未病。","bh":"","notes":[],"pending":true},{"id":"sw32-3","tags":[],"yw":"熱病從部所起者，至期而已；其刺之反者，三周而已；重逆則死。諸當汗者，至其所勝日，汗大出也。諸治熱病，以飲之寒水乃刺之，必寒衣之，居止寒處，身寒而止也。熱病先胸脅痛，手足躁，刺足少陽，補足太陰，病甚者爲五十九刺。熱病始手臂痛者，刺手陽明太陰而汗出止。熱病始於頭首者，刺項太陽而汗出止。熱病始於足脛者，刺足陽明而汗出止。熱病先身重骨痛，耳聾好瞑，刺足少陰，病甚爲五十九刺。熱病先眩冒而熱，胸脅滿，刺足少陰少陽。","bh":"","notes":[],"pending":true},{"id":"sw32-4","tags":[],"yw":"太陽之脈，色榮顴骨，熱病也，榮未交，曰今且得汗，待時而已。與厥陰脈爭見者，死期不過三日，其熱病內連腎，少陽之脈色也。少陽之脈，色榮頰前，熱病也，榮未交，曰今且得汗，待時而已，與少陰脈爭見者，死期不過三日。熱病氣穴∶三椎下間主胸中熱，四椎下間主膈中熱，五椎下間主肝熱，六椎下間主脾熱，七椎下間主腎熱，榮在也。項上三椎，陷者中也。頰下逆顴爲大瘕，下牙車爲腹滿，顴後爲脅痛，頰上者膈上也。<目錄>卷第九","bh":"","notes":[],"pending":true}]},
{"id":"sw33","book":"素问","no":33,"title":"评热病论","titleTw":"評熱病論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw33-1","tags":[],"yw":"黃帝問曰∶有病溫者，汗出輒復熱，而脈躁疾不爲汗衰，狂言不能食，病名爲何？岐伯對曰∶病名陰陽交，交者死也。帝曰∶願聞其說。岐伯曰∶人所以汗出者，皆生於谷，谷生於精，今邪氣交爭於骨肉而得汗者，是邪卻而精勝也，精勝則當能食而不復熱。復熱者邪氣也，汗者精氣也，今汗出而輒復熱者，是邪勝也，不能食者，精無俾也，病而留者，其壽可立而傾也。且夫《熱論》曰∶汗出而脈尚躁盛者死。今脈不與汗相應，此不勝其病也，其死明矣。","bh":"","notes":[],"pending":true},{"id":"sw33-2","tags":[],"yw":"狂言者是失志，失志者死。今見三死，不見一生，雖愈必死也。帝曰∶有病身熱汗出煩滿，煩滿不爲汗解，此爲何病？岐伯曰∶汗出而身熱者風也，汗出而煩滿不解者厥也，病名曰風厥。帝曰∶願卒聞之。岐伯曰∶巨陽主氣，故先受邪，少陰與其爲表裏也，得熱則上從之，從之則厥也。帝曰∶治之奈何？岐伯曰∶表裏刺之，飲之服湯。帝曰∶勞風爲病何如？岐伯曰∶勞風法在肺下，其爲病也，使人強上冥視，唾出若涕，惡風而振寒，此爲勞風之病。帝曰∶治之奈何？岐伯曰∶以救俯仰。","bh":"","notes":[],"pending":true},{"id":"sw33-3","tags":[],"yw":"巨陽引精者三日，中年者五日，不精者七日，咳出青黃涕，其狀如膿，大如彈丸，從口中若鼻中出，不出則傷肺，傷肺則死也。帝曰∶有病腎風者，面然壅，害於言，可刺不？岐伯曰∶虛不當刺，不當刺而刺，後五日其氣必至。帝曰∶其至何如？岐伯曰∶至必少氣時熱，時熱從胸背上至頭，汗出手熱，口干苦渴，小便黃，目下腫，腹中鳴，身重難以行，月事不來，煩而不能食，不能正偃，正偃則咳甚，病名曰風水，論在《刺法》中。帝曰∶願聞其說。","bh":"","notes":[],"pending":true},{"id":"sw33-4","tags":[],"yw":"岐伯曰∶邪之所湊，其氣必虛，陰虛者陽必湊之，故少氣時熱而汗出也。小便黃者，少腹中有熱也。不能正偃者，胃中不和也。正偃則咳甚，上迫肺也。諸有水氣者，微腫先見於目下也。帝曰∶何以言？岐伯曰∶水者陰也，目下亦陰也，腹者至陰之所居，故水在腹者，必使目下腫也。真氣上逆，故口苦舌干，臥不得正偃，正偃則咳出清水也。諸水病者，故不得臥，臥則驚，驚則咳甚也。腹中鳴者，病本於胃也。薄脾則煩不能食，食不下者，胃脘隔也。","bh":"","notes":[],"pending":true},{"id":"sw33-5","tags":[],"yw":"身重難以行者，胃脈在足也。月事不來者，胞脈閉也，胞脈者屬心而絡於胞中，今氣上迫肺，心氣不得下通，故月事不來也。帝曰∶善。<目錄>卷第九","bh":"","notes":[],"pending":true}]},
{"id":"sw34","book":"素问","no":34,"title":"逆调论","titleTw":"逆調論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw34-1","tags":[],"yw":"黃帝問曰∶人身非常溫也，非常熱也，爲之熱而煩滿者何也？岐伯對曰∶陰氣少而陽氣勝，故熱而煩滿也。帝曰∶人身非衣寒也，中非有寒氣也，寒從中生者何？岐伯曰∶是人多痹氣也，陽氣少，陰氣多，故身寒如從水中出。帝曰∶人有四肢熱，逢風寒如炙如火者何也？岐伯曰∶是人者陰氣虛，陽氣盛，四肢者陽也，兩陽相得而陰氣虛少，少水不能滅盛火，而陽獨治，獨治者不能生長也，獨勝而止耳，逢風而如炙如火者，是人當肉爍也。帝曰∶人有身寒，湯火不能熱，濃衣不能溫，然不凍慄，是爲何病？岐伯曰∶是人者，素腎氣勝，以水爲事，太陽氣衰，腎脂枯不長，一水不能勝兩火，腎者水也，而生於骨，腎不生則髓不能滿，故寒甚至骨也。","bh":"","notes":[],"pending":true},{"id":"sw34-2","tags":[],"yw":"所以不能凍慄者，肝一陽也，心二陽也，腎孤髒也，一水不能勝二火，故不能凍慄，病名曰骨痹，是人當攣節也。帝曰∶人之肉苛者，雖近衣絮，猶尚苛也，是謂何疾？岐伯曰∶榮氣虛，衛氣實也，榮氣虛則不仁，衛氣虛則不用，榮衛俱虛，則不仁且不用，肉如故也，人身與志不相有，曰死。帝曰∶人有逆氣不得臥而息有音者，有不得臥而息無音者，有起居如故而息有音者，有得臥行而喘者，有不得臥不能行而喘者，有不得臥臥而喘者，皆何髒使然？願聞其故。","bh":"","notes":[],"pending":true},{"id":"sw34-3","tags":[],"yw":"岐伯曰∶不得臥而息有音者，是陽明之逆也，足三陽者下行，今逆而上行，故息有音也。陽明者胃脈也，胃者六腑之海，其氣亦下行，陽明逆不得從其道，故不得臥也。《下經》曰∶胃不和則臥不安。此之謂也。夫起居如故而息有音者，此肺之絡脈逆也，絡脈不得隨經上下，故留經而不行，絡脈之病患也微，故起居如故而息有音也。夫不得臥臥則喘者，是水氣之客也，夫水者循津液而流也，腎者水髒，主津液，主臥與喘也。帝曰∶善。熱論∶怫（音弗）譫（之閻切，多言也）刺熱論∶頷（胡感切）灑淅（上先禮切，下先歷切）（音酸）跟（音根）（音氐）評熱病論∶（下莫江切）（音博）逆調論∶苛（胡歌切）<目錄>卷第十","bh":"","notes":[],"pending":true}]},
{"id":"sw35","book":"素问","no":35,"title":"疟论","titleTw":"瘧論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw35-1","tags":[],"yw":"黃帝問曰∶夫瘧皆生於風，其蓄作有時者何也？岐伯對曰∶瘧之始發也，先起於毫毛，伸欠乃作，寒慄鼓頷，腰脊俱痛，寒去則內外皆熱，頭痛如破，渴欲冷凍飲料。帝曰∶何氣使然？願聞其道。岐伯曰∶陰陽上下交爭，虛實更作，陰陽相移也。陽並於陰，則陰實而陽虛，陽明虛則寒慄鼓頷也；巨陽虛則腰背頭項痛；三陽俱虛則陰氣勝，陰氣勝則骨寒而痛；寒生於內，故中外皆寒；陽盛則外熱，陰虛則內熱，外內皆熱則喘而渴，故欲冷凍飲料也。此皆得之夏傷於暑，熱氣盛，藏於皮膚之內，腸胃之外，此榮氣之所舍也。","bh":"","notes":[],"pending":true},{"id":"sw35-2","tags":[],"yw":"此令人汗空疏，腠理開，因得秋氣，汗出遇風，及得之以浴，水氣舍於皮膚之內，與衛氣並居。衛氣者，晝日行於陽，夜行於陰，此氣得陽而外出，得陰而內薄，內外相薄，是以日作。帝曰∶其間日而作者何也？岐伯曰∶其氣之舍深，內薄於陰，陽氣獨發，陰邪內着，陰與陽爭不得出，是以間日而作也。帝曰∶善。其作日晏與其日早者，何氣使然？岐伯曰∶邪氣客於風府，循膂而下，衛氣一日一夜大會於風府，其明日日下一節，故其作也晏，此先客於脊背也，每至於風府則腠理開，腠理開則邪氣入，邪氣入則病作，以此日作稍益晏也。","bh":"","notes":[],"pending":true},{"id":"sw35-3","tags":[],"yw":"其出於風府，日下一節，二十五日下至骨，二十六日入於脊內，注於伏膂之脈，其氣上行，九日出於缺盆之中，其氣日高，故作日益早也。其間日發者，由邪氣內薄於五髒，橫連募原也，其道遠，其氣深，其行遲，不能與衛氣俱行，不得皆出，故間日乃作也。帝曰∶夫子言衛氣每至於風府，腠理乃發，發則邪氣入，入則病作。今衛氣日下一節，其氣之發也不當風府，其日作者奈何？岐伯曰∶此邪氣客於頭項循膂而下者也，故虛實不同，邪中異所，則不得當其風府也。","bh":"","notes":[],"pending":true},{"id":"sw35-4","tags":[],"yw":"故邪中於頭項者，氣至頭項而病；中於背者，氣至背而病；中於腰脊者，氣至腰脊而病；中於手足者，氣至手足而病。衛氣之所在，與邪氣相合，則病作。故風無常府，衛氣之所發，必開其腠理，邪氣之所合，則其府也。帝曰∶善。夫風之與瘧也，相似同類，而風獨常在，瘧得有時而休者何也？岐伯曰∶風氣留其處，故常在；瘧氣隨經絡沉以內薄，故衛氣應乃作。帝曰∶瘧先寒而後熱者何也？岐伯曰∶夏傷於大暑，其汗大出，腠理開發，因遇夏氣悽滄之水寒，藏於腠理皮膚之中，秋傷於風，則病成矣。","bh":"","notes":[],"pending":true},{"id":"sw35-5","tags":[],"yw":"夫寒者陰氣也，風者陽氣也，先傷於寒而後傷於風，故先寒而後熱也，病以時作，名曰寒瘧。帝曰∶先熱而後寒者何也？岐伯曰∶此先傷於風而後傷於寒，故先熱而後寒也，亦以時作，名曰溫瘧。其但熱而不寒者，陰氣先絕，陽氣獨發，則少氣煩冤，手足熱而欲嘔，名曰癉瘧。帝曰∶夫經言有餘者瀉之，不足者補之。今熱爲有餘，寒爲不足。夫瘧者之寒，湯火不能溫也，及其熱，冰水不能寒也，此皆有餘不足之類。當此之時，良工不能止，必須其自衰乃刺之，其故何也？願聞其說。","bh":"","notes":[],"pending":true},{"id":"sw35-6","tags":[],"yw":"岐伯曰∶經言無刺之熱，無刺渾渾之脈，無刺漉漉之汗，故爲其病逆未可治也。夫瘧之始發也，陽氣並於陰，當是之時，陽虛而陰盛，外無氣，故先寒慄也。陰氣逆極，則復出之陽，陽與陰復並於外，則陰虛而陽實，故先熱而渴。夫瘧氣者，並於陽則陽勝，並於陰則陰勝，陰勝則寒，陽勝則熱。瘧者，風寒之氣不常也，病極則復。至病之發也，如火之熱，如風雨不可當也。故經言曰∶方其盛時必毀，因其衰也，事必大昌。此之謂也。夫瘧之未發也，陰未並陽，陽未並陰，因而調之，真氣得安，邪氣乃亡，故工不能治其已發，爲其氣逆也。","bh":"","notes":[],"pending":true},{"id":"sw35-7","tags":[],"yw":"帝曰∶善。攻之奈何？早晏何如？岐伯曰∶瘧之且發也，陰陽之且移也，必從四末始也，陽已傷，陰從之，故先其時堅束其處，令邪氣不得入，陰氣不得出，審候見之在孫絡盛堅而血者皆取之，此真往而未得並者也。帝曰∶瘧不發，其應何如？岐伯曰∶瘧氣者，必更盛更虛，當氣之所在也，病在陽，則熱而脈躁；在陰，則寒而脈靜；極則陰陽俱衰，衛氣相離，故病得休；衛氣集，則復病也。帝曰∶時有間二日或至數日發，或渴或不渴，其故何也？岐伯曰∶其間日者，邪氣與衛氣客於六腑，而有時相失，不能相得，故休數日乃作也。","bh":"","notes":[],"pending":true},{"id":"sw35-8","tags":[],"yw":"瘧者，陰陽更勝也，或甚或不甚，故或渴或不渴。帝曰∶論言夏傷於暑，秋必病瘧，今瘧不必應者何也？岐伯曰∶此應四時者也。其病異形者，反四時也。其以秋病者寒甚，以冬病者寒不甚，以春病者惡風，以夏病者多汗。帝曰∶夫病溫瘧與寒瘧而皆安舍？舍於何髒？岐伯曰∶溫瘧者，得之冬中於風，寒氣藏於骨髓之中，至春則陽氣大發，邪氣不能自出，因遇大暑，腦髓爍，肌肉消，腠理發泄，或有所用力，邪氣與汗皆出，此病藏於腎，其氣先從內出之於外也。","bh":"","notes":[],"pending":true},{"id":"sw35-9","tags":[],"yw":"如是者，陰虛而陽盛，陽盛則熱矣，衰則氣復反入，入則陽虛，陽虛則寒矣，故先熱而後寒，名曰溫瘧。帝曰∶癉瘧何如？岐伯曰∶癉瘧者，肺素有熱氣盛於身，厥逆上衝，中氣實而不外泄，因有所用力，腠理開，風寒舍於皮膚之內、分肉之間而發，發則陽氣盛，陽氣盛而不衰則病矣。其氣不及於陰，故但熱而不寒，氣內藏於心，而外舍於分肉之間，令人消爍脫肉，故命曰癉瘧。帝曰∶善。<目錄>卷第十","bh":"","notes":[],"pending":true}]},
{"id":"sw36","book":"素问","no":36,"title":"刺疟","titleTw":"刺瘧","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw36-1","tags":[],"yw":"足太陽之瘧，令人腰痛頭重，寒從背起，先寒後熱，然，熱止汗出，難已，刺中出血。足少陽之瘧，令人身體解，寒不甚，熱不甚，惡見人，見人心惕惕然，熱多汗出甚，刺足少陽。足陽明之瘧，令人先寒，灑淅灑淅，寒甚久乃熱，熱去汗出，喜見日月光火氣乃快然，刺足陽明跗上。足太陰之瘧，令人不樂，好大息，不嗜食，多寒熱汗出，病至則善嘔，嘔已乃衰，即取之。足少陰之瘧，令人嘔吐甚，多寒熱，熱多寒少，欲閉戶牖而處，其病難已。足厥陰之瘧，令人腰痛少腹滿，小便不利如癃狀，非癃也，數便，意恐懼氣不足，腹中悒悒，刺足厥陰。","bh":"","notes":[],"pending":true},{"id":"sw36-2","tags":[],"yw":"肺瘧者，令人心寒，寒甚熱，熱間善驚，如有所見者，刺手太陰陽明。心瘧者，令人煩心甚，欲得清水，反寒多，不甚熱，刺手少陰。肝瘧者，令人色蒼蒼然，太息，其狀若死者，刺足厥陰見血。脾瘧者，令人寒，腹中痛，熱則腸中鳴，鳴已汗出，刺足太陰。腎瘧者，令人灑灑然，腰脊痛宛轉，大便難，目然，手足寒，刺足太陽少陰。胃瘧者，令人且病也，善飢而不能食，食而支滿腹大，刺足陽明太陰橫脈出血。瘧發身方熱，刺跗上動脈，開其空，出其血，立寒。","bh":"","notes":[],"pending":true},{"id":"sw36-3","tags":[],"yw":"瘧方欲寒，刺手陽明太陰、足陽明太陰。瘧脈滿大，急刺背俞，用中針旁伍俞各一，適肥瘦出其血也。瘧脈小實，急灸脛少陰，刺指井。瘧脈滿大，急刺背俞，用五俞背俞各一，適行至於血也。瘧脈緩大虛，便宜用藥，不宜用針。凡治瘧先發，如食頃乃可以治，過之則失時也。諸瘧而脈不見，刺十指間出血，血去必已，先視身之赤如小豆者盡取之。十二瘧者，其發各不同時，察其病形，以知其何脈之病也。先其發時如食頃而刺之，一刺則衰，二刺則知，三刺則已，不已刺舌下兩脈出血，不已刺中盛經出血，又刺項以下俠脊者必已。","bh":"","notes":[],"pending":true},{"id":"sw36-4","tags":[],"yw":"舌下兩脈者，廉泉也。刺瘧者，必先問其病之所先發者，先刺之。先頭痛及重者，先刺頭上及兩額兩眉間出血。先項背痛者，先刺之。先腰脊痛者，先刺中出血。先手臂痛者，先刺手少陰陽明十指間。先足脛痛者，先刺足陽明十指間出血。風瘧，瘧發則汗出惡風，刺三陽經背俞之血者。痛甚，按之不可，名曰髓病，以針針絕骨出血，立已。身體小痛，刺至陰。諸陰之井無出血，間日一刺。瘧不渴，間日而作，刺足太陽。渴而間日作，刺足少陽。溫瘧汗不出，爲五十九刺。","bh":"","notes":[],"pending":true},{"id":"sw36-5","tags":[],"yw":"<目錄>卷第十","bh":"","notes":[],"pending":true}]},
{"id":"sw37","book":"素问","no":37,"title":"气厥论","titleTw":"氣厥論","tags":["bingji","zangxiang","yinyang"],"brief":"","pending":true,"sections":[{"id":"sw37-1","tags":[],"yw":"黃帝問曰∶五髒六腑，寒熱相移者何？岐伯曰∶腎移寒於肝，癰腫少氣。脾移寒於肝，癰腫筋攣。肝移寒於心，狂隔中。心移寒於肺，肺消，肺消者飲一溲二，死不治。肺移寒於腎，爲湧水，湧水者，按腹不堅，水氣客於大腸，疾行則鳴濯濯如囊裹漿，水之病也。脾移熱於肝，則爲驚衄。肝移熱於心，則死。心移熱於肺，傳爲膈消。肺移熱於腎，傳爲柔。腎移熱於脾，傳爲虛，腸死，不可治。胞移熱於膀胱，則癃溺血。膀胱移熱於小腸，膈腸不便，上爲口麋。","bh":"","notes":[],"pending":true},{"id":"sw37-2","tags":[],"yw":"小腸移熱於大腸，爲瘕，爲沉。大腸移熱於胃，善食而瘦入，謂之食亦。胃移熱於膽，亦曰食亦。膽移熱於腦，則辛鼻淵，鼻淵者，濁涕下不止也，傳爲衄蔑瞑目，故得之氣厥也。<目錄>卷第十","bh":"","notes":[],"pending":true}]},
{"id":"sw38","book":"素问","no":38,"title":"咳论","titleTw":"咳論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw38-1","tags":[],"yw":"黃帝問曰∶肺之令人咳何也？岐伯對曰∶五髒六腑皆令人咳，非獨肺也。帝曰∶願聞其狀。岐伯曰∶皮毛者肺之合也，皮毛先受邪氣，邪氣以從其合也。其寒飲食入胃，從肺脈上至於肺則肺寒，肺寒則外內合邪因而客之，則爲肺咳。五髒各以其時受病，非其時各傳以與之。人與天地相參，故五髒各以治時感於寒則受病，微則爲咳，甚者爲泄爲痛。乘秋則肺先受邪，乘春則肝先受之，乘夏則心先受之，乘至陰則脾先受之，乘冬則腎先受之。帝曰∶何以異之？岐伯曰∶肺咳之狀，咳而喘息有音，甚則唾血。","bh":"","notes":[],"pending":true},{"id":"sw38-2","tags":[],"yw":"心咳之狀，咳則心痛，喉仲介介如梗狀，甚則咽腫喉痹。肝咳之狀，咳則兩脅下痛，甚則不可以轉，轉則兩下滿。脾咳之狀，咳則右脅下痛陰陰引肩背，甚則不可以動，動則咳劇。腎咳之狀，咳則腰背相引而痛，甚則咳涎。帝曰∶六腑之咳奈何？安所受病？岐伯曰∶五髒之久咳，乃移於六腑。脾咳不已，則胃受之，胃咳之狀，咳而嘔，嘔甚則長蟲出。肝咳不已，則膽受之、膽咳之狀、咳嘔膽汁。肺咳不已，則大腸受之，大腸咳狀，咳而遺失。心咳不已，則小腸受之，小腸咳狀，咳而失氣，氣與咳俱失。","bh":"","notes":[],"pending":true},{"id":"sw38-3","tags":[],"yw":"腎咳不已，則膀胱受之，膀胱咳狀，咳而遺溺。久咳不已，則三焦受之，三焦咳狀，咳而腹滿，不欲食飲，此皆聚於胃，關於肺，使人多涕唾而面浮腫氣逆也。帝曰∶治之奈何？岐伯曰∶治髒者治其俞，治腑者治其合，浮腫者治其經。帝曰∶善。瘧論∶（火沃切）漉（音鹿）弭（綿婢切）刺瘧論∶（音謁）悒（於急切）（音舜）氣厥論∶（音熾）麋（武悲切）（音復）蔑（莫結切）咳論∶蛔（音回）<目錄>卷第十一","bh":"","notes":[],"pending":true}]},
{"id":"sw40","book":"素问","no":40,"title":"腹中论","titleTw":"腹中論","tags":["ci","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw40-1","tags":[],"yw":"黃帝問曰∶有病心腹滿，旦食則不能暮食，此爲何病？岐伯對曰∶名爲鼓脹。帝曰∶治之奈何？岐伯曰∶治之以雞矢醴，一劑知，二劑已。帝曰∶其時有復發者何也？岐伯曰∶此飲食不節，故時有病也。雖然其病且已，時故當病，氣聚於腹也。帝曰∶有病胸脅支滿者，妨於食，病至則先聞腥臊臭，出清液，先唾血，四肢清，目眩，時時前後血，病名爲何？何以得之？岐伯曰∶病名血枯，此得之年少時，有所大脫血，若醉入房中，氣竭肝傷，故月事衰少不來也。","bh":"","notes":[],"pending":true},{"id":"sw40-2","tags":[],"yw":"帝曰∶治之奈何？復以何術？岐伯曰∶以四烏骨一茹二物並合之，丸以雀卵，大如小豆，以五丸爲後飯，飲以鮑魚汁，利腸中及傷肝也。帝曰∶病有少腹盛，上下左右皆有根，此爲何病？可治不？岐伯曰∶病名曰伏梁。帝曰∶伏梁何因而得之？岐伯曰∶裹大膿血，居腸胃之外，不可治，治之每切按之致死。帝曰∶何以然？岐伯曰∶此下則因陰，必下膿血，上則迫胃脘，生膈，挾胃脘內癰，此久病也，難治。居臍上爲逆，居臍下爲從，勿動亟奪。論在《刺法》中。","bh":"","notes":[],"pending":true},{"id":"sw40-3","tags":[],"yw":"帝曰∶人有身體髀股皆腫，環臍而痛，是爲何病？岐伯曰∶病名伏梁，此風根也。其氣溢於大腸而着於肓，肓之原在臍下，故環臍而痛也。不可動之，動之爲水溺澀之病。帝曰∶夫子數言熱中消中，不可服高梁芳草石藥，石藥發，芳草發狂。夫熱中消中者，皆富貴人也，今禁高梁，是不合其心，禁芳草石藥，是病不愈，願聞其說。岐伯曰∶夫芳草之氣美，石藥之氣悍，二者其氣急疾堅勁，故非緩心和人，不可以服此二者。帝曰∶不可以服此二者，何以然？岐伯曰∶夫熱氣悍，藥氣亦然，二者相遇，恐內傷脾，脾者土也而惡木，服此藥者，至甲乙日更論。","bh":"","notes":[],"pending":true},{"id":"sw40-4","tags":[],"yw":"帝曰∶善。有病膺腫頸痛胸滿腹脹，此爲何病？何以得之？岐伯曰∶名厥逆。帝曰∶治之奈何？岐伯曰∶灸之則喑，石之則狂，須其氣並，乃可治也。帝曰∶何以然？岐伯曰∶陽氣重上，有餘於上，灸之則陽氣入陰，入則喑；石之則陽氣虛，虛則狂；須其氣並而治之，可使全也。帝曰∶善。何以知懷子之且生也？岐伯曰∶身有病而無邪脈也。帝曰∶病熱而有所痛者何也？岐伯曰∶病熱者，陽脈也，以三陽之動也，人迎一盛少陽，二盛太陽，三盛陽明，入陰也。","bh":"","notes":[],"pending":true},{"id":"sw40-5","tags":[],"yw":"夫陽入於陰，故病在頭與腹，乃脹而頭痛也。帝曰∶善。<目錄>卷第十一","bh":"","notes":[],"pending":true}]},
{"id":"sw41","book":"素问","no":41,"title":"刺腰痛","titleTw":"刺腰痛","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw41-1","tags":[],"yw":"足太陽脈令人腰痛，引項脊尻背如重狀，刺其中。太陽正經出血，春無見血。少陽令人腰痛，如以針刺其皮中，循循然不可以俯仰，不可以顧，刺少陽成骨之端出血，成骨在膝外廉之骨獨起者，夏無見血。陽明令人腰痛，不可以顧，顧如有見者，善悲，刺陽明於前三，上下和之出血，秋無見血。足少陰令人腰痛，痛引脊內廉，刺少陰於內踝上二，春無見血，出血太多，不可復也。厥陰之脈令人腰痛，腰中如張弓弩弦，刺厥陰之脈，在踵魚腹之外，循之累累然，乃刺之，其病令人善言默默然不慧，刺之三。","bh":"","notes":[],"pending":true},{"id":"sw41-2","tags":[],"yw":"解脈令人腰痛，痛引肩，目KTKT然，時遺溲，刺解脈，在膝筋肉分間外廉之橫脈出血，血變而止。解脈令人腰痛如引帶，常如折腰狀，善恐，刺解脈，在中結絡如黍米，刺之血射以黑，見赤血而已。同陰之脈，令人腰痛，痛如小錘居其中，怫然腫，刺同陰之脈，在外踝上絕骨之端，爲三。陽維之脈令人腰痛，痛上怫然腫，刺陽維之脈，脈與太陽合下間，去地一尺所。衡絡之脈令人腰痛，不可以俯仰，仰則恐僕，得之舉重傷腰，衡絡絕，惡血歸之，刺之在陽、筋之間，上數寸，衡居爲二出血。","bh":"","notes":[],"pending":true},{"id":"sw41-3","tags":[],"yw":"會陰之脈令人腰痛，痛上漯漯然汗出，汗干令人欲飲，飲已欲走，刺直陽之脈上三，在蹺上下五寸橫居，視其盛者出血。飛陽之脈令人腰痛，痛上拂拂然，甚則悲以恐，刺飛陽之脈，在內踝上五寸，少陰之前，與陰維之會。昌陽之脈令人腰痛，痛引膺，目KTKT然，甚則反折，舌卷不能言，刺內筋爲二，在內踝上大筋前太陰後，上踝二寸所。散脈令人腰痛而熱，熱甚生煩，腰下如有橫木居其中，甚則遺溲，刺散脈，在膝前骨肉分間，絡外廉，束脈爲三。","bh":"","notes":[],"pending":true},{"id":"sw41-4","tags":[],"yw":"肉裏之脈令人腰痛，不可以咳，咳則筋縮急，刺肉裏之脈爲二，在太陽之外，少陽絕骨之後。腰痛俠脊而痛至頭KTKT然，目KTKT欲僵僕，刺足太陽中出血。腰痛上寒，刺足太陽陽明；上熱，刺足厥陰；不可以俯仰，刺足少陽；中熱而喘，刺足少陰，刺中出血。腰痛，上寒不可顧，刺足陽明；上熱，刺足太陰；中熱而喘，刺足少陰。大便難，刺足少陰。少腹滿，刺足厥陰。如折不可以俯仰，不可舉，刺足太陽。引脊內廉，刺足少陰。腰痛引少腹控，不可以仰，刺腰尻交者，兩髁胂上，以月生死爲數，發針立已，左取右，右取左。","bh":"","notes":[],"pending":true},{"id":"sw41-5","tags":[],"yw":"舉痛論∶泣而（音澀）絀急（上丁骨切）腹中論∶（昨則切）茹（上力居切，下音如）脖（上蒲沒切，下鳥郎切）喑（音陰）刺腰痛論∶厭（於豔切）髁（苦瓦切）（音遼）踵（丑用切）蠡溝（上盧啓切，又落戈切）嘿（音黑）小錘（直垂切）漯（他合切）擷（虎結切）眇（亡表切）<目錄>卷第十二","bh":"","notes":[],"pending":true}]},
