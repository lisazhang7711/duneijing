{"id":"sw62","book":"素问","no":62,"title":"调经论","titleTw":"調經論","tags":["ci","jingluo","bingji"],"brief":"论神、气、血、形、志各有有余不足的病候与补泻刺法，并阐明气血相并、阴阳偏盛所致虚实的病机与调治原则。","pending":false,"sections":[{"id":"sw62-1","tags":[],"yw":"黃帝問曰∶餘聞刺法言，有餘瀉之，不足補之，何謂有餘？何謂不足？岐伯對曰∶有餘有五，不足亦有五，帝欲何問？帝曰∶願盡聞之。岐伯曰∶神有餘有不足，氣有餘有不足，血有餘有不足，形有餘有不足，志有餘有不足，凡此十者，其氣不等也。帝曰∶人有精氣津液，四肢九竅，五髒十六部，三百六十五節，乃生百病，百病之生，皆有虛實。今夫子乃言有餘有五，不足亦有五，何以生之乎？岐伯曰∶皆生於五髒也。夫心藏神，肺藏氣，肝藏血，脾藏肉，腎藏志，而此成形。","bh":"黄帝问道：我听刺法上说，有余的泻之，不足的补之。什么叫有余？什么叫不足？岐伯回答说：有余有五种，不足也有五种，帝想问哪一种？黄帝说：我希望全部听听。岐伯说：神有有余有不足，气有有余有不足，血有有余有不足，形有有余有不足，志有有余有不足；凡此十种，其气各不相同。黄帝说：人有精、气、津、液，四肢，九窍，五脏，十六部，三百六十五节，才发生百病；百病的发生，都有虚实。如今先生只说有余有五种、不足也有五种，它们是怎样产生的呢？岐伯说：都产生于五脏。心藏神，肺藏气，肝藏血，脾藏肉，肾藏志，由此而成其形体。","notes":[],"pending":false},{"id":"sw62-2","tags":[],"yw":"志意通，內連骨髓，而成身形五髒。五髒之道，皆出於經隧，以行血氣，血氣不和，百病乃變化而生，是故守經隧焉。帝曰∶神有餘不足何如？岐伯曰∶神有餘則笑不休，神不足則悲。血氣未並，五髒安定，邪客於形，灑淅起於毫毛，未入於經絡也，故命曰神之微。帝曰∶補瀉奈何？岐伯曰∶神有餘，則瀉其小絡之血，出血勿之深斥，無中其大經，神氣乃平。神不足者，視其虛絡，按而致之，刺而利之，無出其血，無泄其氣，以通其經，神氣乃平。帝曰∶刺微奈何？岐伯曰∶按摩勿釋，着針勿斥，移氣於不足，神氣乃得復。","bh":"志意通（于内），在内连属骨髓，从而成就身形与五脏。五脏的通道，都出于经隧（经脉之路），以运行血气；血气不和，百病就变化而生，所以要守定经隧。黄帝说：神的有余不足怎样？岐伯说：神有余就笑而不止，神不足就悲伤。若血气尚未相并，五脏安定，邪气客于形体，从毫毛起恶寒战栗，还没有入于经络，所以名叫神之微（病）。黄帝说：补泻怎样？岐伯说：神有余的，就泻其小络之血，出血但不要深刺推针（勿之深斥），不要刺中其大经，神气就平复了。神不足的，看其虚络所在，按压以招致其气，针刺以通利之，不出血、不泄气，以通其经，神气就平复了。黄帝说：刺微（病）怎样？岐伯说：按摩不要放开（勿释），着针不要深推（勿斥），把气移行到不足之处，神气就能恢复。","notes":[],"pending":false},{"id":"sw62-3","tags":[],"yw":"帝曰∶善。有餘不足奈何？岐伯曰∶氣有餘則喘咳上氣，不足則息利少氣。血氣未並，五髒安定，皮膚微病，命曰白氣微泄。帝曰∶補瀉奈何？岐伯曰∶氣有餘，則瀉其經隧，無傷其經，無出其血，無泄其氣。不足，則補其經隧，無出其氣。帝曰∶刺微奈何？岐伯曰∶按摩勿釋，出針視之，曰我將深之，適人必革，精氣自伏，邪氣散亂，無所休息，氣泄腠理，真氣乃相得。帝曰∶善。血有餘不足奈何？岐伯曰∶血有餘則怒，不足則恐。血氣未並，五髒安定，孫絡外溢，則經有留血。","bh":"黄帝说：好。气的有余不足怎样？岐伯说：气有余就喘息咳嗽、气上逆；不足则呼吸虽通利而气少。血气尚未相并，五脏安定（之时），（若仅）皮肤微有病，名叫白气微泄。黄帝说：补泻怎样？岐伯说：气有余的，泻其经隧，不要损伤其经脉，不要出血，不要泄气。不足的，补其经隧，不要使气外泄。黄帝说：刺微怎样？岐伯说：按摩不要放开（勿释），出针时给病人看，说我将要深刺；（这样）适应病人（之情）必然改变而变化（适人必革），精气自然内伏，邪气散乱而无处停息，邪气从腠理外泄，真气于是两相谐得。黄帝说：好。血的有余不足怎样？岐伯说：血有余就容易发怒，不足就容易恐惧。血气尚未相并、五脏安定（之时），孙络（水液）外溢，则经脉中有留血。","notes":[],"pending":false},{"id":"sw62-4","tags":[],"yw":"帝曰∶補瀉奈何？岐伯曰∶血有餘，則瀉其盛經出其血。不足，則視其虛經內針其脈中，久留而視，脈大，疾出其針，無令血泄。帝曰∶刺留血奈何？岐伯曰∶視其血絡，刺出其血，無令惡血得入於經，以成其疾。帝曰∶善。形有餘不足奈何？岐伯曰∶形有餘則腹脹涇溲不利，不足則四肢不用。血氣未並，五髒安定，肌肉蠕動，命曰微風。帝曰∶補瀉奈何？岐伯曰∶形有餘則瀉其陽經，不足則補其陽絡。帝曰∶刺微奈何？岐伯曰∶取分肉間，無中其經，無傷其絡，衛氣得復，邪氣乃索。","bh":"黄帝说：补泻怎样？岐伯说：血有余的，就泻其盛（实）之经，使它出血。不足的，就看其虚经，把针刺入脉中，久留针而观察，待脉变大（气至），迅速出针，不要让血外泄。黄帝说：刺留血怎样？岐伯说：看其血络，刺出其中的血，不要让恶血入于经脉，以致成病。黄帝说：好。形的有余不足怎样？岐伯说：形有余则腹胀、大小便不利（泾溲不利），不足则四肢不能任用。血气尚未相并、五脏安定（之时），肌肉蠕动，名叫微风。黄帝说：补泻怎样？岐伯说：形有余的泻其阳经，不足的补其阳络。黄帝说：刺微怎样？岐伯说：取分肉之间，不要刺中其经，不要损伤其络，卫气得以恢复，邪气就消散（索）了。","notes":[],"pending":false},{"id":"sw62-5","tags":[],"yw":"帝曰∶善。志有餘不足奈何？岐伯曰∶志有餘則腹脹飧泄，不足則厥。血氣未並，五髒安定，骨節有動。帝曰∶補瀉奈何？岐伯曰∶志有餘則瀉然筋血者，不足則補其復溜。帝曰∶刺未並奈何？岐伯曰∶即取之，無中其經，邪所乃能立虛。帝曰∶善。餘已聞虛實之形，不知其何以生。岐伯曰∶氣血以並，陰陽相傾，氣亂於衛，血逆於經，血氣離居，一實一虛。血並於陰，氣並於陽，故爲驚狂。血並於陽，氣並於陰，乃爲炅中。血並於上，氣並於下，心煩惋善怒。","bh":"黄帝说：好。志的有余不足怎样？岐伯说：志有余则腹胀、飧泄，不足则厥。血气尚未相并、五脏安定（之时），骨节有所变动。黄帝说：补泻怎样？岐伯说：志有余的，就泻（然谷处的）然筋之血络使它出血；不足的，就补其复溜（穴）。黄帝说：刺（血气）未相并的怎样？岐伯说：即时取穴刺之，不要刺中其经，邪气所在之处就能立刻衰虚。黄帝说：好。我已经听说了虚实的外在表现，却不知它们是怎样产生的。岐伯说：气血相并，阴阳相互倾移，气乱于卫，血逆于经，血与气相离而各居其所，一处实一处虚。血并于阴，气并于阳，所以成为惊狂。血并于阳，气并于阴，就成为炅中（热中）。血并于上，气并于下，就心中烦闷、容易发怒。","notes":[],"pending":false},{"id":"sw62-6","tags":[],"yw":"血並於下，氣並於上，亂而喜忘。帝曰∶血並於陰，氣並於陽，如是血氣離居，何者爲實？何者爲虛？岐伯曰∶血氣者，喜溫而惡寒，寒則泣不能流，溫則消而去之，是故氣之所並爲血虛，血之所並爲氣虛。帝曰∶人之所有者，血與氣耳。今夫子乃言血並爲虛，氣並爲虛，是無實乎？岐伯曰∶有者爲實，無者爲虛，故氣並則無血，血並則無氣，今血與氣相失，故爲虛焉。絡之與孫脈俱輸於經，血與氣並，則爲實焉。血之與氣並走於上，則爲大厥，厥則暴死，氣復反則生，不反則死。","bh":"血并于下，气并于上，就（神志）惑乱而健忘。黄帝说：血并于阴，气并于阳，像这样的血气离居，哪一个是实？哪一个是虚？岐伯说：血气喜欢温而厌恶寒；寒则凝涩不能流动，温则消散而去。所以气所并之处为血虚，血所并之处为气虚。黄帝说：人所具有的不过是血与气罢了。如今先生说血并的为虚、气并的为虚，那就没有实了吗？岐伯说：有的就是实，没有的就是虚；所以气并（聚）的地方就没有血，血并（聚）的地方就没有气；现在血与气相互失离，所以成为虚。络脉与孙脉都输注于经脉，血与气相并聚，就成为实。血与气一并向走于上，就成为大厥；厥就突然昏死，气复返回（下行）则生，不返回则死。","notes":[],"pending":false},{"id":"sw62-7","tags":[],"yw":"帝曰∶實者何道從來？虛者何道從去？虛實之要，願聞其故。岐伯曰∶夫陰與陽皆有俞會，陽注於陰，陰滿之外，陰陽勻平，以充其形，九候若一，命曰平人。夫邪之生也，或生於陰，或生於陽。其生於陽者，得之風雨寒暑。其生於陰者，得之飲食居處，陰陽喜怒。帝曰∶風雨之傷人奈何？岐伯曰∶風雨之傷人也，先客於皮膚，傳入於孫脈，孫脈滿則傳入於絡脈，絡脈滿則輸於大經脈，血氣與邪並客於分腠之間，其脈堅大，故曰實。實者外堅充滿，不可按之，按之則痛。","bh":"黄帝说：实是从什么途径来的？虚是从什么途径去的？虚实的要领，希望听听其中的缘故。岐伯说：阴与阳都有俞会（输注会合之处），阳注于阴，阴满而外溢，阴阳匀平，以充养其形体，九候（之脉）如一，名叫平人。邪气的发生，有的生于阴，有的生于阳。生于阳的，得之于风雨寒暑；生于阴的，得之于饮食、居处、（房事）阴阳与喜怒。黄帝说：风雨伤人怎样？岐伯说：风雨伤人，先客留于皮肤，再传入孙脉；孙脉满就传入络脉；络脉满就输注于大经脉；血气与邪气一并客留于分腠之间，其脉坚实而大，所以叫实。实的表现是外部坚实充满，不可按压，按之则痛。","notes":[],"pending":false},{"id":"sw62-8","tags":[],"yw":"帝曰∶寒溼之傷人奈何？岐伯曰∶寒溼之中人也，皮膚不收，肌肉堅緊，榮血泣，衛氣去，故曰虛。虛者聶辟氣不足，按之則氣足以溫之，故快然而不痛。帝曰∶善。陰之生實奈何？岐伯曰∶喜怒不節則陰氣上逆，上逆則下虛，下虛則陽氣走之，故曰實矣。帝曰∶陰之生虛奈何？岐伯曰∶喜則氣下，悲則氣消，消則脈虛空，因寒飲食，寒氣燻滿，則血泣氣去，故曰虛矣。帝曰∶經言陽虛則外寒，陰虛則內熱，陽盛則外熱，陰盛則內寒，餘已聞之矣，不知其所由然也。","bh":"黄帝说：寒湿伤人怎样？岐伯说：寒湿中于人，皮肤不收（弛纵不收），肌肉坚紧，营血凝涩，卫气散去，所以叫虚。虚的表现是皮肤皱叠（聂辟）、气不足；按之则气足以温养它，所以感到舒畅而不痛。黄帝说：好。阴分产生实怎样？岐伯说：喜怒不节则阴气上逆；上逆则下部虚；下部虚则阳气随之走聚（于上），所以叫实了。黄帝说：阴分产生虚怎样？岐伯说：喜则气下行，悲则气消散；气消散则脉空虚；又因进食寒冷之物（寒饮食），寒气熏蒸胀满于内，则血凝涩而气散去，所以叫虚了。黄帝说：医经上说阳虚则外寒，阴虚则内热，阳盛则外热，阴盛则内寒；我已经听说过，却不知它们所以这样（的机理）。","notes":[],"pending":false},{"id":"sw62-9","tags":[],"yw":"岐伯曰∶陽受氣於上焦，以溫皮膚分肉之間，今寒氣在外，則上焦不通，上焦不通，則寒氣獨留於外，故寒慄。帝曰∶陰虛生內熱奈何？岐伯曰∶有所勞倦，形氣衰少，谷氣不盛，上焦不行，下脘不通。胃氣熱，熱氣燻胸中，故內熱。帝曰∶陽盛生外熱奈何？岐伯曰∶上焦不通利，則皮膚致密，腠理閉塞，玄府不通，衛氣不得泄越，故外熱。帝曰∶陰盛生內寒奈何？岐伯曰∶厥氣上逆，寒氣積於胸中而不瀉，不瀉則溫氣去，寒獨留，則血凝泣，凝則脈不通，其脈盛大以澀，故中寒。","bh":"岐伯说：阳气禀受于上焦，以温养皮肤分肉之间；如今寒气在外，则上焦不通；上焦不通，则寒气独留于外，所以寒战。黄帝说：阴虚生内热怎样？岐伯说：有所劳倦，形气衰少，谷气不盛，上焦不能宣行，下脘不通畅；胃气郁而生热，热气熏蒸胸中，所以内热。黄帝说：阳盛生外热怎样？岐伯说：上焦不通利，则皮肤致密，腠理闭塞，玄府（汗孔）不通，卫气不得发泄越出，所以外热。黄帝说：阴盛生内寒怎样？岐伯说：厥逆之气上逆，寒气积于胸中而不（被）泻除；不泻则温气离去，寒气独留，则血凝涩；凝涩则脉不通，其脉盛大而涩，所以成为内寒（中寒）。","notes":[],"pending":false},{"id":"sw62-10","tags":[],"yw":"帝曰∶陰與陽並，血氣以並，病形以成，刺之奈何？岐伯曰∶刺此者取之經隧，取血於營，取氣於衛，用形哉，因四時多少高下。帝曰∶血氣以並，病形以成，陰陽相傾，補瀉奈何？岐伯曰∶瀉實者氣盛乃內針，針與氣俱內，以開其門如利其戶，針與氣俱出，精氣不傷，邪氣乃下，外門不閉，以出其疾，搖大其道，如利其路，是謂大瀉，必切而出，大氣乃屈。帝曰∶補虛奈何？岐伯曰∶持針勿置，以定其意，候呼內針，氣出針入，針空四塞，精無從去，方實而疾出針，氣入針出，熱不得還，閉塞其門，邪氣布散，精氣乃得存，動氣候時，近氣不失，遠氣乃來，是謂追之。","bh":"黄帝说：阴与阳相并，血与气相并，病形已经形成，怎样刺治它？岐伯说：刺这种病要取之于经隧，取血于营，取气于卫；要依据（患者的）形体啊，并因四时（之气）的多少、高下（部位）来施用。黄帝说：血气已经相并，病形已经形成，阴阳互相倾移，补泻怎样？岐伯说：泻实的，在气盛的时候进针，针与气同时进入，以开其门如同使门户通畅；针与气同时退出，使精气不受伤，邪气就随之下降；出针时外门不闭合，以祛出其病邪，摇大其针道，如同开通其路径，这叫大泻；必须（以手）切（其处）而出针，亢盛之气就（屈伏）消退了。黄帝说：补虚怎样？岐伯说：持针不要马上（放置）刺入，以安定其意；等候呼气（外出）时进针，气出而针入；针孔四周密塞（勿使外张），精气就无从外散；待（正气）方实的时候迅速出针，气（方）入而针已出，使热（气）不得外还；闭塞其（针）门，邪气得以布散，精气才能留存；候其动气之时（而施治），近处的气不失，远处的气也随之而来，这就叫追（补之法）。","notes":[],"pending":false},{"id":"sw62-11","tags":[],"yw":"帝曰∶夫子言虛實者有十，生於五髒，五髒五脈耳。夫十二經脈皆生其病，今夫子獨言五髒。夫十二經脈者，皆絡三百六十五節，節有病必被經脈，經脈之病皆有虛實，何以合之？岐伯曰∶五髒者，故得六腑與爲表裏，經絡支節，各生虛實，其病所居，隨而調之。病在脈，調之血；病在血，調之絡；病在氣，調之衛；病在肉，調之分肉；病在筋，調之筋；病在骨，調之骨。燔針劫刺其下及與急者；病在骨，淬針藥熨；病不知所痛，兩蹺爲上；身形有痛，九候莫病，則繆刺之；痛在於左而右脈病者，巨刺之。","bh":"黄帝说：先生说虚实的（表现）有十种，产生于五脏，而五脏不过是（五条）脉罢了。十二经脉都能发生各自的病，如今先生只说五脏。那十二经脉都联络三百六十五节；节有病必然波及经脉，经脉之病都有虚实，怎样与（前面说的）相合呢？岐伯说：五脏本来与六腑互为表里，经络、支节各生虚实，其病所在的部位，随其所在而调治之。病在脉，调之于血；病在血，调之于络；病在气，调之于卫；病在肉，调之于分肉；病在筋，调之于筋；病在骨，调之于骨。用燔针（火针）劫刺其下部以及拘急之处；病在骨的，用（火）针（焠针）与药熨；（病处）不知痛痒的，取两𫏋（阴阳𫏋脉）为上；身形有痛而九候脉象无病的，就用缪刺；痛在左侧而右侧脉有病的，用巨刺。","notes":[],"pending":false},{"id":"sw62-12","tags":[],"yw":"必謹察其九候，針道備矣。調經論∶隧（音遂）飧（音孫）燔（音煩）<目錄>卷第十八","bh":"必须谨慎地审察其九候，针道就完备了。（篇末所附释音为：）调经论：隧（音遂）；飧（音孙）；燔（音烦）。","notes":[],"pending":false}]},
{"id":"sw63","book":"素问","no":63,"title":"缪刺论","titleTw":"繆刺論","tags":["ci","jingluo","zhenfa"],"brief":"论缪刺的原理及其与巨刺的区别，并按各经络脉受邪列举病候与左右交叉取穴的具体刺法和次数。","pending":false,"sections":[{"id":"sw63-1","tags":[],"yw":"黃帝問曰∶餘聞繆刺，未得其意，何謂繆刺？岐伯對曰∶夫邪之客於形也，必先舍於皮毛，留而不去，入舍於孫脈，留而不去，入舍於絡脈，留而不去，入舍於經脈，內連五髒，散於腸胃，陰陽俱感，五髒乃傷，此邪之從皮毛而入，極於五髒之次也，如此則治其經焉。今邪客於皮毛，入舍於孫絡，留而不去，閉塞不通，不得入於經，流溢於大絡，而生奇病也。夫邪客大絡者，左注右，右注左，上下左右與經相干，而布於四末，其氣無常處，不入於經俞，命曰繆刺。","bh":"黄帝问道：我听说缪刺，却不明白它的意思，什么叫缪刺？岐伯回答说：邪气客留于形体，必先客留于皮毛；留而不去，就入舍于孙脉；留而不去，入舍于络脉；留而不去，入舍于经脉；在内连于五脏，散于肠胃；阴阳都受邪，五脏才受伤。这是邪气从皮毛而入、最终达到五脏的次序，像这样就应治其经脉。如今邪气客于皮毛，入舍于孙络，留而不去，闭阻不通，不能入于经脉，流溢于大络，而发为奇病。邪气客于大络的，左边的（邪）注于右，右边的（邪）注于左，上下左右与经脉相干犯，而布散于四肢末端；其气没有固定的部位，不入于经俞（经穴），这就叫缪刺。","notes":[],"pending":false},{"id":"sw63-2","tags":[],"yw":"帝曰∶願聞繆刺，以左取右以右取左奈何？其與巨刺何以別之？岐伯曰∶邪客於經，左盛則右病，右盛則左病，亦有移易者，左痛未已而右脈先病，如此者，必巨刺之，必中其經，非絡脈也。故絡病者，其痛與經脈繆處，故命曰繆刺。帝曰∶願聞繆刺奈何？取之何如？岐伯曰∶邪客於足少陰之絡，令人卒心痛暴脹，胸脅支滿，無積者，刺然骨之前出血，如食頃而已，不已，左取右，右取左，病新發者，取五日已。邪客於手少陽之絡，令人喉痹舌卷，口干心煩，臂外廉痛，手不及頭，刺手中指次指爪甲上，去端如韭葉各一，壯者立已，老者有頃已，左取右，右取左，此新病數日已。","bh":"黄帝说：希望听听缪刺以左取右、以右取左是怎样的？它与巨刺怎样区别？岐伯说：邪气客于经脉的，左侧邪盛则右侧发病，右侧邪盛则左侧发病；也有转移变易的，左侧疼痛未止而右侧脉已先病；像这样的，必须用巨刺，必须刺中其经脉，而不是络脉。所以络脉发病的，其痛处与经脉（之所在）相错缪，所以名叫缪刺。黄帝说：希望听听缪刺怎样施行？怎样取穴？岐伯说：邪客于足少阴的络脉，使人突然心痛、突然胀满，胸胁支撑胀满。没有积聚的，刺然骨之前使其出血，约一顿饭的时间就好了；不好的，左侧病取右侧，右侧病取左侧；新发的病，五日可愈。邪客于手少阳的络脉，使人喉痹、舌卷、口干、心烦，臂的外侧疼痛，手抬不到头部；刺手中指次指（第四指）爪甲上，距指端如韭叶之处，各一针；壮年人立即好，老年人过一会儿好；左侧取右侧，右侧取左侧；这是新病，数日可愈。","notes":[],"pending":false},{"id":"sw63-3","tags":[],"yw":"邪客於足厥陰之絡，令人卒疝暴痛，刺足大指爪甲上，與肉交者各一，男子立已，女子有頃已，左取右，右取左。邪客於足太陽之絡，令人頭項肩痛，刺足小指爪甲上，與肉交者各一，立已，不已，刺外踝下三，左取右，右取左，如食頃已。邪客於手陽明之絡，令人氣滿胸中，喘息而支，胸中熱，刺手大指次指爪甲上，去端如韭葉各一，左取右，右取左，如食頃已。邪客於臂掌之間，不可得屈，刺其踝後，先以指按之痛，乃刺之，以月死生爲數，月生一日一，二日二，十五日十五，十六日十四。","bh":"邪客于足厥阴的络脉，使人突然疝气剧痛，刺足大趾爪甲上与肉相交之处，各一针；男子立即好，女子过一会儿好；左侧取右侧，右侧取左侧。邪客于足太阳的络脉，使人头项肩部疼痛，刺足小趾爪甲上与肉相交之处，各一针，立即好；不好的，刺（足）外踝下三针；左侧取右侧，右侧取左侧，约一顿饭的时间就好。邪客于手阳明的络脉，使人胸中气满、喘息而支撑（不适），胸中发热；刺手大指次指（食指）爪甲上，距指端如韭叶之处，各一针；左侧取右侧，右侧取左侧，约一顿饭的时间就好。邪气客于臂掌之间，不能屈（伸）的，刺其（手腕）踝后；先用手指按压，疼痛处才刺之；以月亮的盈亏死生数为针刺之数：月生初一日刺一针，初二日刺二针，到十五日刺十五针，到十六日刺十四针。","notes":[],"pending":false},{"id":"sw63-4","tags":[],"yw":"邪客於足陽蹺之脈，令人目痛從內始，刺外踝之下半寸所各二，左刺右，右刺左，如行十裏頃而已。人有所墮墜，惡血留內，腹中滿脹，不得前後，先飲利藥，此上傷厥陰之脈，下傷少陰之絡，刺足內踝之下，然骨之前血脈出血，刺足跗上動脈，不已，刺三毛上各一，見血立已，左刺右，右刺左。善悲驚不樂，刺如右方。邪客於手陽明之絡，令人耳聾，時不聞音，刺手大指次指爪甲上，去端如韭葉各一，立聞，不已，刺中指爪甲上與肉交者，立聞，其不時聞者，不可刺也。","bh":"邪客于足阳𫏋之脉，使人眼痛从内眦开始，刺外踝之下半寸许，各二针；左侧刺右侧，右侧刺左侧，约行走十里路的时间就好了。人有从高处堕落坠伤的，恶血留积在内，腹中胀满，大小便不通；先给他服通利的药物。这是上面伤了厥阴之脉，下面伤了少阴之络；刺足内踝之下、然骨之前的血脉使之出血，并刺足背上的动脉；不好的，刺（足大趾）三毛上各一针，见血立即好；左侧刺右侧，右侧刺左侧。容易悲伤惊恐而不快乐的，也按上述方法（右方）刺治。邪客于手阳明的络脉，使人耳聋，有时听不到声音；刺手大指次指（食指）爪甲上，距指端如韭叶之处，各一针，立即能听见；不好的，刺中指爪甲上与肉相交之处，立即能听见；那种（久聋）不能随时恢复听觉的，不可刺治。","notes":[],"pending":false},{"id":"sw63-5","tags":[],"yw":"耳中生風者，亦刺之如此數，左刺右，右刺左。凡痹往來行無常處者，在分肉間痛而刺之，以月死生爲數，用針者，隨氣盛衰，以爲數，針過其日數則脫氣，不及日數則氣不瀉，左刺右，右刺左，病已止，不已，復刺之如法，月生一日一，二日二，漸多之，十五日十五，十六日十四，漸少之。邪客於足陽明之經，令人鼽衄上齒寒，刺足中指次指爪甲上，與肉交者各一，左刺右，右刺左。邪客於足少陽之絡，令人脅痛不得息，咳而汗出，刺足小指次指爪甲上，與肉交者各一，不得息立已，汗出立止，咳者溫衣飲食，一日已，左刺右，右刺左，病立已，不已，復刺如法。","bh":"耳中有风声的，也按此数（穴数）刺之；左侧刺右侧，右侧刺左侧。凡是痹（痛）往来行走、没有固定部位的，就在分肉间疼痛处刺之，以月亮的盈亏死生为数。用针的人随气盛衰来定针刺之数：针的次数超过其日数就会脱失正气，不及日数则邪气不得泻除；左侧刺右侧，右侧刺左侧；病愈则止，不好的，再按此法刺之：月生初一刺一针，初二刺二针，逐渐增多，到十五日刺十五针，到十六日刺十四针，再逐渐减少。邪客于足阳明之经，使人鼻塞鼻出血、上齿寒冷，刺足中趾（次趾）爪甲上与肉相交之处，各一针；左侧刺右侧，右侧刺左侧。邪客于足少阳的络脉，使人胁痛不能呼吸、咳嗽而汗出，刺足小趾次趾爪甲上与肉相交之处，各一针；不能呼吸的立即通利，汗出的立即停止；咳嗽的要注意保暖穿衣和饮食，一日可愈；左侧刺右侧，右侧刺左侧，病立即好；不好的，再按此法刺之。","notes":[],"pending":false},{"id":"sw63-6","tags":[],"yw":"邪客於足少陰之絡，令人嗌痛不可內食，無故善怒，氣上走賁上，刺足下中央之脈各三，凡六刺，立已，左刺右，右刺左。嗌中腫，不能內唾，時不能出唾者，繆刺然骨之前，出血立已，左刺右，右刺左。邪客於足太陰之絡，令人腰痛，引少腹控，不可以仰息，刺腰尻之解，兩胂之上，是腰俞，以月死生爲數，發針立已，左刺右，右刺左。邪客於足太陽之絡，令人拘攣背急，引脅而痛，刺之從項始數脊椎挾脊，疾按之應手如痛，刺之旁三，立已。邪客於足少陽之絡，令人留於樞中痛，髀不可舉，刺樞中以毫針，寒則久留針，以月死生爲數，立已。","bh":"邪客于足少阴的络脉，使人咽喉疼痛不能进食，无故容易发怒，气上走于贲门之上（胸膈之上）的，刺足下中央之脉各三针，共六刺，立即好；左侧刺右侧，右侧刺左侧。咽喉部肿，不能咽下唾液，有时也不能吐出唾液的，缪刺然骨之前，出血立即好；左侧刺右侧，右侧刺左侧。邪客于足太阴的络脉，使人腰痛，牵引少腹、（控及）季胁，不能仰身呼吸的，刺腰尻（骨）的解（骨缝）、两胂（臀部肉）之上，这就是腰俞；以月亮的盈亏死生为数，出针（后）立即可愈；左侧刺右侧，右侧刺左侧。邪客于足太阳的络脉，使人拘挛、背部拘急，牵引胁肋而痛；刺时从项部起数脊椎、夹脊柱两旁，快速按压，哪里应手作痛就刺哪里，刺其旁三针，立即好。邪客于足少阳的络脉，使人邪留于髀枢之中疼痛、大腿不能抬举；用毫针刺髀枢之中；寒（证）就久留其针；以月亮的盈亏死生为数，立即好。","notes":[],"pending":false},{"id":"sw63-7","tags":[],"yw":"治諸經刺之，所過者不病，則繆刺之。耳聾，刺手陽明，不已，刺其通脈出耳前者。齒齲，刺手陽明，不已，刺其脈入齒中，立已。邪客於五髒之間，其病也，脈引而痛，時來時止，視其病，繆刺之於手足爪甲上，視其脈，出其血，間日一刺，一刺不已，五刺已。繆傳引上齒，齒脣寒痛，視其手背脈血者去之，足陽明中指爪甲上一，手大指次指爪甲上各一，立已，左取右，右取左。邪客於手足少陰太陰足陽明之絡，此五絡皆會於耳中，上絡左角，五絡俱竭，令人身脈皆動，而形無知也，其狀若屍，或曰屍厥，刺其足大指內側爪甲上，去端如韭葉，後刺足心，後刺足中指爪甲上各一，後刺手大指內側，去端如韭葉，後刺手心主，少陰銳骨之端各一，立已，不已，以竹管吹其兩耳，其左角之發方一寸燔治，飲以美酒一杯，不能飲者灌之，立已。","bh":"治疗各经（之病）而刺其经脉，若经脉所过之处没有病，就要用缪刺。耳聋的刺手阳明（经）；不好的，刺其通于耳前的脉络出处。齿龋（齿痛如被虫蛀）的刺手阳明（经）；不好的，刺其脉入于齿中之处，立即好。邪气客于五脏之间的，其病的表现是（经）脉牵引而痛，时来时止；看病（所在），缪刺刺于手足爪甲之上，看到有（瘀滞）的脉络就刺出其血，隔日一刺；一刺不好的，五刺可愈。缪（传之邪）传引上齿，牙齿与嘴唇寒冷疼痛的，看其手背上的血脉有（瘀）的就（刺）去其血；（并刺）足阳明（经）中趾爪甲上一针，手大指次指（食指）爪甲上各一针，立即好；左侧取右侧，右侧取左侧。邪气客于手、足少阴、太阴与足阳明的络脉，这五条络脉都会于耳中，上络于左（额）角；五络之气都竭尽，使人全身经脉都躁动，而形体无所知觉，其状如同死尸，有人叫它尸厥；刺其足大趾内侧爪甲上、距趾端如韭叶之处，然后刺足心，然后刺足中趾爪甲上各一针，然后刺手大指内侧、距指端如韭叶之处，然后刺手心主（厥阴）、（手）少阴（经）锐骨之端各一针，立即好；不好的，用竹管吹他的两耳，（并）取他左角的头发一方寸（烧灰为末），用美酒一杯送服；不能饮的就灌服，立即好。","notes":[],"pending":false},{"id":"sw63-8","tags":[],"yw":"凡刺之數，先視其經脈，切而從之，審其虛實而調之，不調者經刺之，有痛而經不病者繆刺之，因視其皮部有血絡者盡取之，此繆刺之數也。<目錄>卷第十八","bh":"凡针刺的法度：先诊视其经脉，切按而循按之，审察其虚实而调治之；不调的用经刺之法；有疼痛而经脉不病的用缪刺之法；同时看其皮部有血络的全部刺取之，这就是缪刺的法度。","notes":[],"pending":false}]},
{"id":"sw64","book":"素问","no":64,"title":"四时刺逆从论","titleTw":"四時刺逆從論","tags":["ci","jingluo","zhenfa"],"brief":"论六经有余不足及脉象滑涩所主的痹、疝、积气诸病，四季气血所在部位，以及违逆四时而刺所产生的变乱病证。","pending":false,"sections":[{"id":"sw64-1","tags":[],"yw":"厥陰有餘病陰痹，不足病生熱痹，滑則病狐疝風，澀則病少腹積氣。少陰有餘病皮痹隱軫，不足病肺痹，滑則病肺風疝，澀則病積溲血。太陰有餘病肉痹寒中，不足病脾痹，滑則病脾風疝，澀則病積心腹時滿。陽明有餘病脈痹身時熱，不足病心痹，滑則病心風疝，澀則病積時善驚。太陽有餘病骨痹身重，不足病腎痹，滑則病腎風疝，澀則病積善時巔疾。少陽有餘病筋痹脅滿，不足病肝痹，滑則病肝風疝，澀則病積時筋急目痛。是故春氣在經脈，夏氣在孫絡，長夏氣在肌肉，秋氣在皮膚，冬氣在骨髓中。","bh":"厥阴（之气）有余则病发阴痹，不足则病发（生）热痹；脉见滑象则病狐疝风，脉见涩象则病少腹积气。少阴有余则病皮痹、隐疹（隐轸），不足则病肺痹；脉滑则病肺风疝，脉涩则病积、尿中带血（溲血）。太阴有余则病肉痹、寒中，不足则病脾痹；脉滑则病脾风疝，脉涩则病积、心腹时常胀满。阳明有余则病脉痹、身体时常发热，不足则病心痹；脉滑则病心风疝，脉涩则病积、时常容易惊。太阳有余则病骨痹、身体沉重，不足则病肾痹；脉滑则病肾风疝，脉涩则病积、时常发巅顶（头部）之疾。少阳有余则病筋痹、胁肋胀满，不足则病肝痹；脉滑则病肝风疝，脉涩则病积、时常筋脉拘急、目痛。所以春气在经脉，夏气在孙络，长夏之气在肌肉，秋气在皮肤，冬气在骨髓之中。","notes":[],"pending":false},{"id":"sw64-2","tags":[],"yw":"帝曰∶餘願聞其故。岐伯曰∶春者，天氣始開，地氣始泄，凍解冰釋，水行經通，故人氣在脈。夏者，經滿氣溢，入孫絡受血，皮膚充實。長夏者，經絡皆盛，內溢肌中。秋者，天氣始收，腠理閉塞，皮膚引急。冬者蓋藏，血氣在中，內着骨髓，通於五髒。是故邪氣者，常隨四時之氣血而入客也，至其變化不可爲度，然必從其經氣，辟除其邪，除其邪則亂氣不生。帝曰∶逆四時而生亂氣奈何？岐伯曰∶春刺絡脈，血氣外溢，令人少氣；春刺肌肉，血氣環逆，令人上氣；春刺筋骨，血氣內着，令人腹脹。","bh":"黄帝说：我希望听听其中的缘故。岐伯说：春天，天气开始开（发），地气开始发泄，冰冻消解，水气流行、经脉通畅，所以人的气在脉。夏天，经脉满而气外溢，（所溢之气）入于孙络而（使之）受血，皮肤充实。长夏，经络都盛，其气向内溢入肌肉之中。秋天，天气开始收敛，腠理闭塞，皮肤收引而急（致密）。冬天主闭藏，血气在中，内着于骨髓，通于五脏。所以邪气常常随四时之气血而侵入客居；至于它的变化不可测度，然而必须依从（四时）经气，以祛除其邪；邪气被除去，乱气就不生了。黄帝说：违逆四时（而刺）以致产生乱气，是怎样的？岐伯说：春天刺络脉，血气向外溢越，使人少气；春天刺肌肉，血气环周逆乱，使人上气（气逆喘息）；春天刺筋骨，血气内着留滞，使人腹胀。","notes":[],"pending":false},{"id":"sw64-3","tags":[],"yw":"夏刺經脈，血氣乃竭，令人解；夏刺肌肉，血氣內卻，令人善恐；夏刺筋骨，血氣上逆，令人善怒。秋刺經脈，血氣上逆，令人善忘；秋刺絡脈，氣不外行，令人臥不欲動；秋刺筋骨，血氣內散，令人寒慄。冬刺經脈，血氣皆脫，令人目不明；冬刺絡脈，內氣外泄，留爲大痹；冬刺肌肉，陽氣竭絕，令人善忘。凡此四時刺者，大逆之病，不可不從也，反之，則生亂氣相淫病焉。故刺不知四時之經，病之所生，以從爲逆，正氣內亂，與精相薄，必審九候，正氣不亂，精氣不轉。","bh":"夏天刺经脉，血气就衰竭，使人懈惰（解㑊）；夏天刺肌肉，血气内却（退）而留滞，使人容易恐惧；夏天刺筋骨，血气上逆，使人容易发怒。秋天刺经脉，血气上逆，使人容易健忘；秋天刺络脉，气不外行（运行），使人嗜卧而不想活动；秋天刺筋骨，血气内散，使人寒战。冬天刺经脉，血气都脱失，使人视物不明；冬天刺络脉，内气向外泄越，留滞而成大痹；冬天刺肌肉，阳气竭绝，使人容易健忘。凡此四时的刺法，是大逆于常所致的病变，不可不遵从；反其道而行，就会生出乱气、彼此浸淫为病。所以针刺若不知四时的经气、病所生之由，把「从」当作「逆」，就会使正气内乱，与精气相迫扰；必须审察九候，使正气不乱，精气不（妄）转（逆乱）。","notes":[],"pending":false},{"id":"sw64-4","tags":[],"yw":"帝曰∶善。刺五髒，中心一日死，其動爲噫。中肝五日死，其動爲語。中肺三日死，其動爲咳。中腎六日死，其動爲嚏欠。中脾十日死，其動爲吞。刺傷人五髒必死，其動，則根據其髒之所變候知其死也。<目錄>卷第十八","bh":"黄帝说：好。刺（中）五脏的：刺中心脏一日死，其变动表现为噫气；刺中肝五日死，其变动表现为多语；刺中肺三日死，其变动表现为咳；刺中肾六日死，其变动表现为喷嚏、呵欠；刺中脾十日死，其变动表现为吞咽。刺（误）伤人的五脏必死；其（刺中后的）变动（表现），可以根据该脏所变（出现）的证候来预知死的时日。","notes":[],"pending":false}]},
{"id":"sw65","book":"素问","no":65,"title":"标本病传论","titleTw":"標本病傳論","tags":["ci","bingji","yinyang"],"brief":"论标本先后、逆从取舍的治则，并按五脏及胃、膀胱之病列举传变次序、日数与可刺不可刺的判断。","pending":false,"sections":[{"id":"sw65-1","tags":[],"yw":"黃帝問曰∶病有標本，刺有逆從奈何？岐伯對曰∶凡刺之方，必別陰陽，前後相應，逆從得施，標本相移，故曰有其在標而求之於標，有其在本而求之於本，有其在本而求之於標，有其在標而求之於本。故治有取標而得者，有取本而得者，有逆取而得者；有從取而得者。故知逆與從，正行無問，知標本者，萬舉萬當，不知標本，是謂妄行。夫陰陽逆從標本之爲道也，小而大，言一而知百病之害，少而多，淺而博，可以言一而知百也。以淺而知深，察近而知遠，言標與本，易而勿及。","bh":"黄帝问道：病有标有本，刺有逆有从，（怎样运用）？岐伯回答说：凡是刺治的法则，必须辨别阴阳，前后相应，逆从得以施行，标本互相转移；所以说：有病在标而从标求治的，有病在本而从本求治的，有病在本而从标求治的，有病在标而从本求治的。所以治法有取标而获效的，有取本而获效的，有逆取而获效的，有从取而获效的。所以知道逆与从，就可以正行而无疑难；知道标本的，万举万当；不知道标本的，叫做妄行。那阴阳、逆从、标本作为治道，可以由小而推大，说到一个（道理）就能知道百病的危害；由少而多，由浅而广，可以说由一个（道理）而知道百（病原委）。以浅而知深，察近而知远；谈着标与本（似乎）容易，（真正掌握）却往往做不到。","notes":[],"pending":false},{"id":"sw65-2","tags":[],"yw":"治反爲逆，治得爲從。先病而後逆者治其本，先逆而後病者治其本，先寒而後生病者治其本，先病而後生寒者治其本，先熱而後生病者治其本，先熱而後生中滿者治其標，先病而後泄者治其本，先泄而後生他病者治其本，必且調之，乃治其他病，先病而後生中滿者治其標，先中滿而後煩心者治其本。人有客氣有同氣。小大不利治其標，小大利治其本。病發而有餘，本而標之，先治其本，後治其標。病發而不足，標而本之，先治其標，後治其本。謹察間甚，以意調之，間者並行，甚者獨行。","bh":"治（病）反（其道）的叫做逆，治（病）得当的叫做从。先病而后（气血）逆乱的治其本；先（气血）逆乱而后生病的治其本；先寒而后生病的治其本；先病而后生寒的治其本；先热而后生病的治其本；先热而后生中满（腹部胀满）的治其标；先病而后泄泻的治其本；先泄泻而后生其他病的治其本——必须先把它调治好，然后才治其他病；先病而后生中满的治其标；先中满而后心烦的治其本。人有客气，有同气。大小便不通利的治其标，大小便通利的治其本。病发而有余的，由本而及标（本而标之），先治其本，后治其标。病发而不足的，由标而及本（标而本之），先治其标，后治其本。谨慎地审察病情的轻重（间甚），以心意调适之：病势轻（或病间断）的可以标本并行（兼治），病势重的要独行（专攻其一）。","notes":[],"pending":false},{"id":"sw65-3","tags":[],"yw":"先小大不利而後生病者治其本。夫病傳者，心病先心痛，一日而咳，三日脅支痛，五日閉塞不通，身痛體重，三日不已死，冬夜半，夏日中。肺病喘咳，三日而脅支滿痛，一日身重體痛，五日而脹，十日不已死，冬日入，夏日出。肝病頭目眩脅支滿，三日體重身痛，五日而脹，三日腰脊少腹痛脛，三日不已死，冬日入，夏早食。脾病身痛體重，一日而脹，二日少腹腰脊痛脛，三日背KT筋痛小便閉，十日不已死，冬人定，夏晏食。腎病少腹腰脊痛，三日背KT筋痛小便閉，三日腹脹，三日兩脅支痛，三日不已死，冬大晨，夏晏晡。","bh":"先大小便不通利而后生病的，治其本。至于病的传变：心脏病，先心痛，一日后咳嗽，三日后胁肋支撑疼痛，五日后（大便）闭塞不通、身体疼痛沉重；再过三日不好的就死，死在冬天的夜半，夏天的中午。肺病，喘息咳嗽，三日后胁肋支撑胀满疼痛，一日后身体沉重疼痛，五日后腹胀，十日不好的就死，死在冬天的日落，夏天的日出。肝病，头目眩晕、胁肋支撑胀满，三日后身体沉重疼痛，五日后腹胀，三日后腰脊少腹疼痛、小腿酸痛，再过三日不好的就死，死在冬天的日落，夏天的早饭时。脾病，身体疼痛沉重，一日后腹胀，二日后少腹腰脊疼痛、小腿酸痛，三日后背部（膂）筋痛、小便不通，十日不好的就死，死在冬天的（夜深）人定时，夏天的（晚饭）晏食时。肾病，少腹腰脊疼痛、小腿酸痛，三日后背部膂筋痛、小便不通，三日后腹胀，三日后两胁支撑疼痛，再过三日不好的就死，死在冬天的大晨（天大亮时），夏天的晏晡（傍晚时）。","notes":[],"pending":false},{"id":"sw65-4","tags":[],"yw":"胃病脹滿，五日少腹腰脊痛，三日背KT筋痛小便閉，五日身體重，六日不已死，冬夜半後，夏日。膀胱病小便閉，五日少腹脹腰脊痛，一日腹脹，一日身體痛，二日不已死，冬雞鳴，夏下晡。諸病以次相傳，如是者，皆有死期，不可刺。間一髒止，及至三四髒者，乃可刺也。<目錄>卷第十九","bh":"胃病，腹部胀满，五日后少腹腰脊疼痛、小腿酸痛，三日后背部膂筋痛、小便不通，五日后身体沉重，六日不好的就死，死在冬天夜半之后，夏天的（日昳时分，此处原文有缺字）。膀胱病，小便不通，五日后少腹胀、腰脊疼痛、（小腿酸痛），一日后腹胀，一日后身体疼痛，二日不好的就死，死在冬天的鸡鸣时，夏天的下晡时。诸病按次序相传变的，像（五脏传遍）这样的，都有死期，不可刺治；（若）间隔一脏而止的，以及（只）传至三四脏的，才可以刺治。","notes":[],"pending":false}]},
{"id":"sw66","book":"素问","no":66,"title":"天元纪大论","titleTw":"天元紀大論","tags":["yunqi","bingji","zangxiang"],"brief":"论五运六气为天地之道：形气相感、气有多少、形有盛衰，并列举天干化五运、地支配三阴三阳与六元主气。","pending":false,"sections":[{"id":"sw66-1","tags":[],"yw":"黃帝問曰∶天有五行，御五位，以生寒暑燥溼風，人有五髒，化五氣，以生喜怒思憂恐，論言五運相襲而皆治之，終期之日，周而復始，餘已知之矣，願聞其與三陰三陽之候奈何合之？鬼臾區稽首再拜對曰∶昭乎哉問也。夫五運陰陽者，天地之道也，萬物之綱紀，變化之父母，生殺之本始，神明之府也，可不通乎！故物生謂之化，物極謂之變，陰陽不測謂之神，神用無方謂之聖。夫變化之爲用也，在天爲玄，在人爲道，在地爲化，化生五味，道生智，玄生神。","bh":"黄帝问道：天有五行，统御五个方位，从而生出寒、暑、燥、湿、风；人有五脏，化生五气，从而生出喜、怒、思、忧、恐。（古）论上说五运相承袭而各主治（一时），终期之日到了，又周而复始；我已经知道了，希望听听它与三阴三阳的征候怎样相合？鬼臾区稽首再拜回答说：问得真明白啊！那五运阴阳是天地的法则，万物的纲纪，变化的父母，生和杀的本始，神明之府，岂能不通晓呢！所以万物发生叫做化，物发展到极点叫做变；阴阳不可测度叫做神，神的运用没有定所（方所）叫做圣。变化的作用，在天为玄（幽远），在人为道，在地为化；化生五味，道生智慧，玄生神。","notes":[],"pending":false},{"id":"sw66-2","tags":[],"yw":"神在天爲風，在地爲木，在天爲熱，在地爲火，在天爲溼，在地爲土，在天爲燥，在地爲金，在天爲寒，在地爲水，故在天爲氣，在地成形，形氣相感而化生萬物矣。然天地者，萬物之上下也；左右者，陰陽之道路也；水火者，陰陽之徵兆也；金木者，生成之終始也。氣有多少，形有盛衰，上下相召而損益彰矣。帝曰∶願聞五運之主時也何如？鬼臾區曰∶五氣營運，各終期日，非獨主時也。帝曰∶請聞其所謂也。鬼臾區曰∶臣積考《太始天元冊》文曰∶太虛寥廓，肇基化元，萬物資始，五運終天，布氣真靈，統坤元，九星懸朗，七曜周旋，曰陰曰陽，曰柔曰剛，幽顯既位，寒暑弛張，生生化化，品物鹹章。","bh":"神（的显现）：在天为风，在地为木；在天为热，在地为火；在天为湿，在地为土；在天为燥，在地为金；在天为寒，在地为水。所以在天为气，在地成形，形与气相互感应而化生万物。那天地是万物的上下；左右是阴阳（升降）的道路；水火是阴阳的征兆；金木是生成的终（与）始。气有多少，形有盛衰，上下相互感召，（损益）就彰显出来了。黄帝说：希望听听五运主时是怎样的？鬼臾区说：五气运行，各终其期日，并不是只主一时的。黄帝说：请听听（这）话的含义。鬼臾区说：臣（积久）考求《太始天元册》的文字，（那里）说：太空辽阔无垠，是万物化生的原始根基；万物赖之以生始，五运终而复始地运行于天；布散真灵之气，总统（大地）坤元；九星高悬明朗，七曜周旋转运；有阴有阳，有柔有刚；幽（隐）与显（明）的位置既已确定，寒暑往来弛张；生生化化，众物（品类）都因而彰显。","notes":[],"pending":false},{"id":"sw66-3","tags":[],"yw":"臣斯十世，此之謂也。帝曰∶善。何謂氣有多少，形有盛衰？鬼臾區曰∶陰陽之氣各有多少，故曰三陰三陽也。形有盛衰，謂五行之治，各有太過不及也。故其始也，有餘而往，不足隨之，不足而往，有餘從之，知迎知隨，氣可與期。應天爲天符，承歲爲歲直，三合爲治。帝曰∶上下相召奈何？鬼臾區曰∶寒暑燥溼風火，天之陰陽也，三陰三陽上奉之。木火土金水火，地之陰陽也，生長化收藏下應之。天以陽生陰長，地以陽殺陰藏。天有陰陽，地亦有陰陽。","bh":"臣（家传）十世于此，说的就是这个。黄帝说：好。什么叫气有多少、形有盛衰？鬼臾区说：阴阳之气各有多少的不同，所以有三阴三阳。形有盛衰，是说五行主治（之时），各有太过与不及。所以（在它的）开始，有余过去了，不足随之而来；不足过去了，有余随之而来；知道（该）迎接什么、随从什么，气（的往来）就可以预期了。（岁运与天干）相应（应天）的叫天符，（与岁支）相承（承岁）的叫岁直，天、运、岁三者相合的为治。黄帝说：上下相召是怎样的？鬼臾区说：寒暑燥湿风火，是天的阴阳，三阴三阳在上（上奉之）。木火土金水火，是地的阴阳，生长化收藏在下相应之。天以阳生、以阴长，地以阳杀、以阴藏。天有阴阳，地也有阴阳。","notes":[],"pending":false},{"id":"sw66-4","tags":[],"yw":"木火土金水火，地之陰陽也，生長化收藏。故陽中有陰，陰中有陽。所以欲知天地之陰陽者，應天之氣，動而不息，故五歲而右遷，應地之氣，靜而守位，故六期而環會，動靜相召，上下相臨，陰陽相錯，而變由生也。帝曰∶上下周紀，其有數乎？鬼臾區曰∶天以六爲節，地以五爲制。周天氣者，六期爲一備；終地紀者，五歲爲一周。君火以明，相火以位。五六相合而七百二十氣，爲一紀，凡三十歲；千四百四十氣，凡六十歲，而爲一周，不及太過，斯皆見矣。","bh":"木、火、土、金、水、（君）火，是地的阴阳，主生长化收藏。所以阳中有阴，阴中有阳。因此要知道天地的阴阳：应于天之气，运动不止，所以五岁而右迁（一步）；应于地之气，静而守其位，所以六期而环会一周。动静相（感）召，上下相临遇，阴阳相互交错，变化就由此而生。黄帝说：上下（的）周（转）与（岁）纪，有定数吗？鬼臾区说：天以六为节度，地以五为制（准则）。周（行）天气的，六期为一备；终（尽）地纪的，五岁为一周。君火以明（光）为用，相火以（居）位（行君火之令）为用。五与六相合而（得）七百二十气，为一纪，共三十岁；一千四百四十气，共六十岁，而为一周；（其中的）不及与太过，都在这里显现出来了。","notes":[],"pending":false},{"id":"sw66-5","tags":[],"yw":"帝曰∶夫子之言，上終天氣，下畢地紀，可謂悉矣。餘願聞而藏之，上以治民，下以治身，使百姓昭着，上下和親，德澤下流，子孫無憂，傳之後世，無有終時，可得聞乎？鬼臾區曰∶至數之機，迫迮以微，其來可見，其往可追，敬之者昌，慢之者亡，無道行私，必得夭殃，謹奉天道，請言真要。帝曰∶善言始者，必會於終，善言近者，必知其遠，是則至數極而道不惑，所謂明矣。願夫子推而次之，令有條理，簡而不匱，久而不絕，易用難忘，爲之綱紀，至數之要，願盡聞之。","bh":"黄帝说：先生的话，上尽天气，下穷地纪，可以说详备了。我愿意听了之后把它收藏起来：对上用以治理百姓，对下用以调治自身，使百姓明白显著，上下和睦相亲，恩德惠泽向下流布，子孙没有忧患，流传到后世，没有终止的时候——可以让我听到（这些）吗？鬼臾区说：（气运的）至数之机要，迫近而微细；它的到来可以预见，它的过去可以追察；敬慎遵行它的就昌盛，轻慢违背它的就灭亡；不循其道而任意行私的，必遭夭殃；我恭敬奉行天道，请让我讲说其中的真要。黄帝说：善于谈论起始的，必能会（通）于终结；善于谈论近处的，必能知道远处；这样就是至数极尽而道仍不惑，这就叫明白了。希望先生推演而依次编排，使（它）有条理，简而不匮乏，久而不灭绝，易用而难忘，作为（它的）纲纪；至数的要领，我希望能全部听到。","notes":[],"pending":false},{"id":"sw66-6","tags":[],"yw":"鬼臾區曰∶昭乎哉問！明乎哉道！如鼓之應桴，響之應聲也。臣聞之，甲己之歲，土運統之；乙庚之歲，金運統之；丙辛之歲，水運統之；丁壬之歲，木運統之；戊癸之歲，火運統之。帝曰∶其於三陰三陽，合之奈何？鬼臾區曰∶子午之歲，上見少陰；丑未之歲，上見太陰；寅申之歲，上見少陽；卯酉之歲，上見陽明；辰戌之歲，上見太陽；巳亥之歲，上見厥陰。少陰所謂標也，厥陰所謂終也。厥陰之上，風氣主之；少陰之上，熱氣主之；太陰之上，溼氣主之；少陽之上、相火主之；陽明之上，燥氣主之；太陽之上，寒氣主之。","bh":"鬼臾区说：问得真透彻啊！道（真）明白啊！如同鼓（应）鼓槌，如同回响应声一样。臣听说：甲与己之年，土运统主之；乙与庚之年，金运统主之；丙与辛之年，水运统主之；丁与壬之年，木运统主之；戊与癸之年，火运统主之。黄帝说：它与三阴三阳相合，是怎样的？鬼臾区说：子午之年，上见少阴；丑未之年，上见太阴；寅申之年，上见少阳；卯酉之年，上见阳明；辰戌之年，上见太阳；巳亥之年，上见厥阴。少阴是所谓标，厥阴是所谓终。厥阴之上，风气主治之；少阴之上，热气主治之；太阴之上，湿气主治之；少阳之上，相火主治之；阳明之上，燥气主治之；太阳之上，寒气主治之。","notes":[],"pending":false},{"id":"sw66-7","tags":[],"yw":"所謂本也，是謂六元。帝曰∶光乎哉道！明乎哉論！請着之玉版，藏之金匱，署曰《天元紀》。<目錄>卷第十九","bh":"（这些）叫做本，这就叫六元。黄帝说：真是光明啊这道理！真是明白啊这论述！请把它刻写在玉版上，收藏于金匮之中，署名为《天元纪》。","notes":[],"pending":false}]},
{"id":"sw67","book":"素问","no":67,"title":"五营运大论","titleTw":"五營運大論","tags":["bingji","yinyang","wuxing"],"brief":"论五运六气的天文依据、上下左右六气的位置与南北面命之法，以及五方生化的性味、情志与相胜关系。","pending":false,"sections":[{"id":"sw67-1","tags":[],"yw":"黃帝坐明堂，始正天綱，臨觀八極，考建五常，請天師而問之曰∶論言天地之動靜，神明爲之紀，陰陽之升降，寒暑彰其兆。餘聞五運之數於夫子，夫子之所言，正五氣之各主歲爾，首甲定運，餘因論之。鬼臾區曰∶土主甲己，金主乙庚，水主丙辛，木主丁壬，火主戊癸。子午之上，少陰主之；丑未之上，太陰主之；寅申之上，少陽主之；卯酉之上，陽明主之；辰戌之上，太陽主之；巳亥之上，厥陰主之。不合陰陽，其故何也？岐伯曰∶是明道也，此天地之陰陽也。","bh":"黄帝坐在明堂，开始端正天文纲纪，临观八方极远之地，考校建立五常（五行之常理），请天师而问他说：古论上讲天地的动静以神明为纲纪，阴阳的升降由寒暑彰显其征兆。我从先生那里听到了五运之数；先生所讲的，正是五气各主一岁而已，以（六十）甲子之首确定运气，我因而继此而推论之。（我问的是：）鬼臾区说土主甲己，金主乙庚，水主丙辛，木主丁壬，火主戊癸；子午之上，少阴主之；丑未之上，太阴主之；寅申之上，少阳主之；卯酉之上，阳明主之；辰戌之上，太阳主之；巳亥之上，厥阴主之。这（看来）不与（通常的）阴阳相合，是什么缘故？岐伯说：这是明白的道理啊，这是天地的阴阳。","notes":[],"pending":false},{"id":"sw67-2","tags":[],"yw":"夫數之可數者，人中之陰陽也，然所合，數之可得者也。夫陰陽者，數之可十，推之可百，數之可千，推之可萬。天地陰陽者，不以數推以象之謂也。帝曰∶願聞其所始也。岐伯曰∶昭乎哉問也！臣覽《太始天元冊》文，丹天之氣經於牛女戊分，天之氣經於心尾己分，蒼天之氣經於危室柳鬼，素天之氣經於亢氐昴畢，玄天之氣經於張翼婁胃。所謂戊己分者，奎壁角軫，則天地之門戶也。夫候之所始，道之所生，不可不通也。帝曰∶善。論言天地者，萬物之上下，左右者，陰陽之道路，未知其所謂也。","bh":"那些可以用数去数的，是人身中的阴阳，然而它所合（的数），是可以数得出来的。那阴阳（之数），数到十可以推衍到百，数到千可以推衍到万。天地的阴阳，是不能以数推求的，要用象（去把握），说的就是这个。黄帝说：希望听听它的起始。岐伯说：问得真明白啊！臣观览《太始天元册》的文字：丹天之气经过牛、女（二宿）与戊分；（黅）天之气经过心、尾（二宿）与己分；苍天之气经过危、室、柳、鬼（四宿）；素天之气经过亢、氐、昴、毕（四宿）；玄天之气经过张、翼、娄、胃（四宿）。所谓戊分己分，就是奎、壁、角、轸（四宿），是天地的门户。候气之所由起始，道之所由产生，不可不通晓。黄帝说：好。（古）论上说天地是万物的上下，左右是阴阳的道路，不知（它）指什么。","notes":[],"pending":false},{"id":"sw67-3","tags":[],"yw":"岐伯曰∶所謂上下者，歲上下見陰陽之所在也。左右者，諸上見厥陰，左少陰右太陽；見少陰，左太陰右厥陰；見太陰，左少陽右少陰；見少陽，左陽明右太陰；見陽明，左太陽右少陽；見太陽，左厥陰右陽明。所謂面北而命其位，言其見也。帝曰∶何謂下？岐伯曰∶厥陰在上則少陽在下，左陽明右太陰；少陰在上則陽明在下，左太陽右少陽；太陰在上則太陽在下，左厥陰右陽明；少陽在上則厥陰在下，左少陰右太陽；陽明在上則少陰在下，左太陰右厥陰；太陽在上則太陰在下，左少陽右少陰。","bh":"岐伯说：所谓上下，是指一年中上下所见（司天在泉）阴阳的所在。所谓左右：凡上面见到厥阴，左是少阴右是太阳；见到少阴，左是太阴右是厥阴；见到太阴，左是少阳右是少阴；见到少阳，左是阳明右是太阴；见到阳明，左是太阳右是少阳；见到太阳，左是厥阴右是阳明。这就是所谓面北而确定其位置，说的是（它）所显现的（左右）。黄帝说：什么叫下（在泉）？岐伯说：厥阴在上则少阳在下，左为阳明右为太阴；少阴在上则阳明在下，左为太阳右为少阳；太阴在上则太阳在下，左为厥阴右为阳明；少阳在上则厥阴在下，左为少阴右为太阳；阳明在上则少阴在下，左为太阴右为厥阴；太阳在上则太阴在下，左为少阳右为少阴。","notes":[],"pending":false},{"id":"sw67-4","tags":[],"yw":"所謂面南而命其位，言其見也。上下相遘，寒暑相臨，氣相得則和，不相得則病。帝曰∶氣相得而病者何也？岐伯曰∶以下臨上，不當位也。帝曰∶動靜何如？岐伯曰∶上者右行，下者左行，左右周天，餘而復會也。帝曰∶餘聞鬼臾區曰∶應地者靜。今夫子乃言下者左行，不知其所謂也，願聞何以生之乎？岐伯曰∶天地動靜，五行遷復，雖鬼臾區其上候而已，猶不能遍明。夫變化之用，天垂象，地成形，七曜緯虛，五行麗地。地者，所以載生成之形類也。","bh":"这就是所谓面南而确定其位置，说的是（它）所显现的（左右）。上下相互交遘（遇），寒暑相互临迫；其气相得（相和）的就平和，不相得的就生病。黄帝说：气相得而反生病的，是为什么？岐伯说：这是以（在下者）临于上位，不当其位的缘故。黄帝说：动静怎样？岐伯说：上（司天之气）右行，下（在泉之气）左行，左右周行于天，（各有）余奇而后再次相会。黄帝说：我听鬼臾区说，应于地者是静的。如今先生却说下者左行，不知这是什么道理，希望听听它是怎样产生的？岐伯说：天地的动静、五行的迁转往复，鬼臾区虽然（能）候察其上（司天）之气而已，还是不能全部明白。那变化的作用：天垂示其象，地生成其形，七曜（日月五星）经纬于虚空，五行附丽于地。地，是用来承载（有）生成（之形类）的。","notes":[],"pending":false},{"id":"sw67-5","tags":[],"yw":"虛者，所以列應天之精氣也。形精之動，猶根本之與枝葉也，仰觀其象，雖遠可知也。帝曰∶地之爲下否乎？岐伯曰∶地爲人之下，太虛之中者也。帝曰∶馮乎？岐伯曰∶大氣舉之也。燥以干之，暑以蒸之，風以動之，溼以潤之，寒以堅之，火以溫之。故風寒在下，燥熱在上，溼氣在中，火遊行其間，寒暑六入，故令虛而生化也。故燥勝則地干，暑勝則地熱，風勝則地動，溼勝則地泥，寒勝則地裂，火勝則地固矣。帝曰∶天地之氣，何以候之？岐伯曰∶天地之氣，勝復之作，不形於診也。","bh":"虚空（之天），是用来陈列与天相应之精气的。形与精的运动，如同根本与枝叶的关系；仰观其象，即使遥远也可以知道。黄帝说：地是在（天的）下面吗？岐伯说：地在人的下面，（悬）在太虚之中的。黄帝说：（它是）凭靠（什么而不坠）？岐伯说：是大气把它举托起来的。燥使它干燥，暑使它蒸腾，风使它动荡，湿使它滋润，寒使它坚实，火使它温暖。所以风、寒（之气）在下，燥、热（之气）在上，湿气在中，火游行于其间；寒暑（等六气）有六种入（于地中），所以使（虚空）之中得以发生生化。所以燥气偏胜则地干燥，暑气偏胜则地热，风气偏胜则地动，湿气偏胜则地泥泞，寒气偏胜则地裂，火气偏胜则地固结。黄帝说：天地之气，怎样候察它？岐伯说：天地之气的胜（气）复（气）发作，不显现于诊脉。","notes":[],"pending":false},{"id":"sw67-6","tags":[],"yw":"《脈法》曰∶天地之變，無以脈診。此之謂也。帝曰∶間氣何如？岐伯曰∶隨氣所在，期於左右。帝曰∶期之奈何？岐伯曰∶從其氣則和，違其氣則病，不當其位者病，迭移其位者病，失守其位者危，尺寸反者死，陰陽交者死。先立其年，以知其氣，左右應見，然後乃可以言死生之逆順。帝曰∶寒暑燥溼風火，在人合之奈何？其於萬物何以生化？岐伯曰∶東方生風，風生木，木生酸，酸生肝，肝生筋，筋生心。其在天爲玄，在人爲道，在地爲化。化生五味，道生智，玄生神，化生氣。","bh":"《脉法》说：天地的变化，不能用脉诊（去候察）。说的就是这个。黄帝说：间气怎样？岐伯说：随其气所在（的部位），期（候）于左右。黄帝说：怎样期候它？岐伯说：顺从其气就平和，违逆其气就生病；不当其位的病，（左右）更迭移位的病，失守其位的危；尺（脉）与寸（脉）相反的死，阴阳交（错）的死。先确立其年（的气运），以知道它的气，（再看）左右相应的所见，然后才可以谈论死生的逆顺。黄帝说：寒暑燥湿风火（六气），在人体怎样与之相合？它对万物怎样生化？岐伯说：东方生风，风生木，木生酸，酸生肝，肝生筋，筋生心。（六气）在天为玄，在人为道，在地为化；化生五味，道生智慧，玄生神（明），化生气。","notes":[],"pending":false},{"id":"sw67-7","tags":[],"yw":"神在天爲風，在地爲木，在體爲筋，在氣爲柔，在髒爲肝。其性爲暄，其德爲和，其用爲動，其色爲蒼，其化爲榮，其蟲毛，其政爲散，其令宣發，其變摧拉，其眚爲隕，其味爲酸，其志爲怒。怒傷肝，悲勝怒；風傷肝，燥勝風；酸傷筋，辛勝酸。南方生熱，熱生火，火生苦，苦生心，心生血，血生脾。其在天爲熱，在地爲火，在體爲脈，在氣爲息，在髒爲心。其性爲暑，其德爲顯，其用爲躁，其色爲赤，其化爲茂，其蟲羽，其政爲明，其令鬱蒸，其變炎爍，其眚燔，其味爲苦，其志爲喜。","bh":"神在天为风，在地为木，在体为筋，在气为柔，在脏为肝。它的性是暄（温），它的德是和，它的作用是动，它的色是苍（青），它的化是荣（荣茂），它的虫是毛虫，它的政是散（发散），它的令是宣发，它的变是摧拉（摧折拔拉），它的眚（灾）是陨（坠落），它的味是酸，它的志（情志）是怒。怒伤肝，悲克制（胜）怒；风伤肝，燥克制风；酸伤筋，辛克制酸。南方生热，热生火，火生苦，苦生心，心生血，血生脾。（六气）在天为热，在地为火，在体为脉，在气为息（呼吸），在脏为心。它的性是暑，它的德是显（显明），它的作用是躁，它的色是赤，它的化是茂（繁茂），它的虫是羽虫，它的政是明，它的令是郁蒸，它的变是炎烁（灼热焚烧），它的眚是燔焫（焚烧），它的味是苦，它的志是喜。","notes":[],"pending":false},{"id":"sw67-8","tags":[],"yw":"喜傷心，恐勝喜；熱傷氣，寒勝熱；苦傷氣，鹹勝苦。中央生溼，溼生土，土生甘，甘生脾，脾生肉，肉生肺。其在天爲溼，在地爲土，在體爲肉，在氣爲充，在髒爲脾。其性靜兼，其德爲濡，其用爲化，其色爲黃，其化爲盈，其蟲，其政爲謐，其令雲雨，其變動注，其眚淫潰，其味爲甘，其志爲思。思傷脾，怒勝思；溼傷肉，風勝溼；甘傷脾，酸勝甘。西方生燥，燥生金，金生辛，辛生肺，肺生皮毛，皮毛生腎。其在天爲燥，在地爲金，在體爲皮毛，在氣爲成，在髒爲肺，其性爲涼，其德爲清，其用爲固，其色爲白，其化爲斂，其蟲介，其政爲勁，其令霧露，其變肅殺，其眚蒼落，其味爲辛，其志爲憂。","bh":"喜伤心，恐克制（胜）喜；热伤气，寒克制热；苦伤气，咸克制苦。中央生湿，湿生土，土生甘，甘生脾，脾生肉，肉生肺。（六气）在天为湿，在地为土，在体为肉，在气为充（充养），在脏为脾。它的性是静而兼（容），它的德是濡（滋润），它的作用是化（运化），它的色是黄，它的化是盈（充盈），它的虫是倮虫，它的政是谧（安静），它的令是云雨，它的变是动注（骤注），它的眚是淫溃（水湿泛滥），它的味是甘，它的志是思。思伤脾，怒克制思；湿伤肉，风克制湿；甘伤脾，酸克制甘。西方生燥，燥生金，金生辛，辛生肺，肺生皮毛，皮毛生肾。（六气）在天为燥，在地为金，在体为皮毛，在气为成（成熟），在脏为肺。它的性是凉，它的德是清，它的作用是固（收敛紧固），它的色是白，它的化是敛（收敛），它的虫是介虫，它的政是劲（刚劲），它的令是雾露，它的变是肃杀，它的眚是苍落（凋零陨落），它的味是辛，它的志是忧。","notes":[],"pending":false},{"id":"sw67-9","tags":[],"yw":"憂傷肺，喜勝憂；熱傷皮毛，寒勝熱；辛傷皮毛，苦勝辛。北方生寒，寒生水，水生鹹，鹹生腎，腎生骨髓，髓生肝。其在天爲寒，在地爲水，在體爲骨，在氣爲堅，在髒爲腎。其性爲凜，其德爲寒，其用爲□，其色爲黑，其化爲肅，其蟲鱗，其政爲靜，其令□□，其變凝冽，其眚冰雹，其味爲鹹，其志爲恐。恐傷腎，思勝恐；寒傷血，燥勝寒；鹹傷血，甘勝鹹。五氣更立，各有所先，非其位則邪，當其位則正。帝曰∶病生之變何如？岐伯曰∶氣相得則微，不相得則甚。","bh":"忧伤肺，喜克制（胜）忧；热伤皮毛，寒克制热；辛伤皮毛，苦克制辛。北方生寒，寒生水，水生咸，咸生肾，肾生骨髓，髓生肝。（六气）在天为寒，在地为水，在体为骨，在气为坚，在脏为肾。它的性是凛（凛冽），它的德是寒，它的用（此处原文有缺字），它的色是黑，它的化是肃（肃静），它的虫是鳞虫，它的政是静，它的令（此处原文有缺字），它的变是凝冽（凝结凛冽），它的眚是冰雹，它的味是咸，它的志是恐。恐伤肾，思克制（胜）恐；寒伤血，燥克制寒；咸伤血，甘克制咸。五气更相主（时），各有其先后；不在其位（非其时）则为邪，当其位的就是正。黄帝说：疾病发生的变化怎样？岐伯说：（其）气相得的病就轻（微），不相得的病就重（甚）。","notes":[],"pending":false},{"id":"sw67-10","tags":[],"yw":"帝曰∶主歲何如？岐伯曰∶氣有餘，則制己所勝而侮所不勝；其不及，則己所不勝侮而乘之，己所勝輕而侮之。侮反受邪，侮而受邪，寡於畏也。帝曰∶善。<目錄>卷第十九","bh":"黄帝说：主岁（之气）怎样？岐伯说：气有余，就能克制自己所胜（克）的（气），并反过来欺侮那（本来）胜自己的（气）；（气）不及的，则自己胜不了的（气）就欺侮并乘袭它，自己所胜的（气）也轻慢而（反过来）欺侮它。（凡）欺侮（他气）的反而自己受邪；欺侮别的（气）却因而受邪，是因为（自己）力量寡弱、无所畏惧（寡于畏）的缘故。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw68","book":"素问","no":68,"title":"六微旨大论","titleTw":"六微旨大論","tags":["yunqi","zhenfa","bingji"],"brief":"论六气的标本中见、亢害承制、天符岁会太一天符、六气时位刻数的推算，以及升降出入生化的道理。","pending":false,"sections":[{"id":"sw68-1","tags":[],"yw":"黃帝問曰∶嗚呼遠哉！天之道也，如迎浮雲，若視深淵，視深淵尚可測，迎浮雲莫知其極。夫子數言謹奉天道，餘聞而藏之，心私異之，不知其所謂也。願夫子溢志盡言其事，令終不滅，久而不絕，天之道可得聞乎？岐伯稽首再拜對曰∶明乎哉問天之道也！此因天之序，盛衰之時也。帝曰∶願聞天道六六之節盛衰何也？岐伯曰∶上下有位，左右有紀。故少陽之右，陽明治之；陽明之右，太陽治之；太陽之右，厥陰治之；厥陰之右，少陰治之；少陰之右，太陰治之；太陰之右，少陽治之。","bh":"黄帝问道：啊，真是深远啊！天的道理，如同仰望浮云，如同俯视深渊；视深渊还可以测度，迎浮云却不知它的终极。先生多次讲到谨慎奉行天道，我听了记在心里，但私下对此有些疑惑，不知（它）指的是什么。希望先生尽情陈述其事，使它终不泯灭，久不断绝；天的道理可以让我听到吗？岐伯稽首再拜回答说：真是明达啊，问天之道！这是因循天（时）的次序、（阴阳）盛衰的时位。黄帝说：希望听听天道「六六」之节的盛衰是怎样的？岐伯说：上下各有其位，左右各有其纪。所以少阳之右，阳明主治之；阳明之右，太阳主治之；太阳之右，厥阴主治之；厥阴之右，少阴主治之；少阴之右，太阴主治之；太阴之右，少阳主治之。","notes":[],"pending":false},{"id":"sw68-2","tags":[],"yw":"此所謂氣之標，蓋南面而待也。故曰∶因天之序，盛衰之時，移光定位，正立而待之。此之謂也。少陽之上，火氣治之，中見厥陰；陽明之上，燥氣治之，中見太陰；太陽之上，寒氣治之，中見少陰；厥陰之上，風氣治之，中見少陽；少陰之上，熱氣治之，中見太陽；太陰之上，溼氣治之，中見陽明。所謂本也，本之下，中之見也，見之下，氣之標也，本標不同，氣應異象。帝曰∶其有至而至，有至而不至，有至而太過，何也？岐伯曰∶至而至者和；至而不至，來氣不及也；未至而至，來氣有餘也。","bh":"这就是所谓气的标（标示），是（设想）南面而待（观望）的结果。所以说：因循天的次序、盛衰的时位，随着（日）光推移而确定位置，正身站立而等待（观望），说的就是这个。少阳之上，火气主治之，中见厥阴；阳明之上，燥气主治之，中见太阴；太阳之上，寒气主治之，中见少阴；厥阴之上，风气主治之，中见少阳；少阴之上，热气主治之，中见太阳；太阴之上，湿气主治之，中见阳明。这些叫做本；本之下是（中）所见（中气），中见之下是气的标（三阴三阳之标）；本与标不同，气的应（象）也就不一样。黄帝说：（六气）有（时令已）至而气也至的，有（时令已）至而气不至的，有（时令）未至而气先至（太过）的，是为什么？岐伯说：时至而气至的是和平（正常）；时至而气不至的，是来气不及；（时令）未至而气先至的，是来气有余。","notes":[],"pending":false},{"id":"sw68-3","tags":[],"yw":"帝曰∶至而不至，未至而至如何？岐伯曰∶應則順，否則逆，逆則變生，變則病。帝曰∶善。請言其應。岐伯曰∶物生其應也，氣脈其應也。帝曰∶善。願聞地理之應六節氣位何如？岐伯曰∶顯明之右，君火之位也；君火之右，退行一步，相火治之；復行一步，土氣治之；復行一步，金氣治之；復行一步，水氣治之；復行一步，木氣治之；復行一步，君火治之。相火之下，水氣承之；水位之下，土氣承之；土位之下，風氣承之；風位之下，金氣承之；金位之下，火氣承之；君火之下，陰精承之。","bh":"黄帝说：至而不至、未至而至又会怎样？岐伯说：应（时）的就顺，不应（时）的就逆；逆就发生变（易），变则生病。黄帝说：好。请谈谈它的应（验）。岐伯说：万物（的生化）是它的应，气（与）脉（的变化）是它的应。黄帝说：好。希望听听地理（方位）应于六节之气的位置是怎样的？岐伯说：显明（正东，春分之位）的右（边），是君火之位；君火之右，退（退后）行一步，是相火主治之；再行一步，土气主治之；再行一步，金气主治之；再行一步，水气主治之；再行一步，木气主治之；再行一步，君火主治之。相火之下，水气承（承制）之；水位之下，土气承之；土位之下，风气承之；风位之下，金气承之；金位之下，火气承之；君火之下，阴精承之。","notes":[],"pending":false},{"id":"sw68-4","tags":[],"yw":"帝曰∶何也？岐伯曰∶亢則害，承乃制，制則生化，外列盛衰，害則敗亂，生化大病。帝曰∶盛衰何如？岐伯曰∶非其位則邪，當其位則正，邪則變甚，正則微。帝曰∶何謂當位？岐伯曰∶木運臨卯，火運臨午，土運臨四季，金運臨酉，水運臨子，所謂歲會，氣之平也。帝曰∶非位何如？岐伯曰∶歲不與會也。帝曰∶土運之歲，上見太陰；火運之歲，上見少陽、少陰；金運之歲，上見陽明；木運之歲，上見厥陰；水運之歲，上見太陽，奈何？岐伯曰∶天之與會也。","bh":"黄帝说：为什么？岐伯说：（六气）亢极则为害，（有）承（制）才能制约；有制约才能生化，在外显现出盛衰（之象）；（亢）害则败坏紊乱，（正常的）生化（由此）生大病。黄帝说：盛衰怎样？岐伯说：不当其位的就是邪，当其位的就是正；邪则（病）变重，正则（病）轻。黄帝说：什么叫当位？岐伯说：木运临卯，火运临午，土运临四季（辰戌丑未），金运临酉，水运临子，这就是所谓岁会，是气的平和（状态）。黄帝说：不当（其）位怎样？岐伯说：（就是）岁（支）不与（运）相会。黄帝说：土运之年，上见太阴；火运之年，上见少阳、少阴；金运之年，上见阳明；木运之年，上见厥阴；水运之年，上见太阳，（这）是怎样？岐伯说：这是天（气）与（运气）相会。","notes":[],"pending":false},{"id":"sw68-5","tags":[],"yw":"故《天元冊》曰天符。天符歲會何如？岐伯曰∶太一天符之會也。帝曰∶其貴賤何如？岐伯曰∶天符爲執法，歲位爲行令，太一天符爲貴人。帝曰∶邪之中也奈何？岐伯曰∶中執法者，其病速而危；中行令者，其病徐而持；中貴人者，其病暴而死。帝曰∶位之易也何如？岐伯曰∶君位臣則順，臣位君則逆。逆則其病近，其害速；順則其病遠，其害微。所謂二火也。帝曰∶善。願聞其步何如？岐伯曰∶所謂步者，六十度而有奇，故二十四步積盈百刻而成日也。","bh":"所以《天元册》称它（此书叫）天符。（既是）天符（又）是岁会怎样？岐伯说：这是太一天符之会。黄帝说：它们的贵贱怎样？岐伯说：天符为执法，岁会（岁位）为行令，太一天符为贵人。黄帝说：邪气中（伤）于人的情形怎样？岐伯说：中于执法（天符）的，其病急速而危重；中于行令（岁会）的，其病徐缓而持久；中于贵人（太一天符）的，其病暴急而死。黄帝说：位的变易怎样？岐伯说：君（火）位而臣（火）居之则顺，臣（火）位而君（火）居之则逆。逆则其病来得近（急），其为害迅速；顺则其病来得远（缓），其为害轻微。这就是所谓（君相）二火。黄帝说：好。希望听听「步」是什么？岐伯说：所谓步，是六十度而有奇（余数），所以二十四步（积累余数）积满百刻而成为一日。","notes":[],"pending":false},{"id":"sw68-6","tags":[],"yw":"帝曰∶六氣應五行之變何如？岐伯曰∶位有終始，氣有國中，上下不同，求之亦異也。帝曰∶求之奈何？岐伯曰∶天氣始於甲，地氣治於子，子甲相合，命曰歲立，謹候其時，氣可與期。帝曰∶願聞其歲，六氣始終，早晏何如？岐伯曰∶明乎哉問也！甲子之歲，初之氣，天數始於水下一刻，終於八十七刻半；二之氣，始於八十七刻六分，終於七十五刻；三之氣，始於七十六刻，終於六十二刻半；四之氣，始於六十二刻六分，終於五十刻；五之氣，始於五十一刻；終於三十七刻半；六之氣，始於三十七刻六分，終於二十五刻。","bh":"黄帝说：六气应于五行的变化怎样？岐伯说：（气）位有终有始，气有初（有中），上下不同，推求（它们）的方法也不同。黄帝说：怎样推求？岐伯说：天气始于甲，地气（始）治于子；子与甲相合，名叫岁立；谨慎地候察其时，气就可以预期了。黄帝说：希望听听一年之中六气的始终早晚是怎样？岐伯说：问得真明白啊！甲子之年，初之气，天数（漏刻）始于水下一刻，终于八十七刻半；二之气，始于八十七刻六分，终于七十五刻；三之气，始于七十六刻，终于六十二刻半；四之气，始于六十二刻六分，终于五十刻；五之气，始于五十一刻，终于三十七刻半；六之气，始于三十七刻六分，终于二十五刻。","notes":[],"pending":false},{"id":"sw68-7","tags":[],"yw":"所謂初六，天之數也。乙丑歲，初之氣，天數始於二十六刻，終於一十二刻半；二之氣，始於一十二刻六分，終於水下百刻；三之氣，始於一刻，終於八十七刻半；四之氣，始於八十七刻六分，終於七十五刻；五之氣，始於七十六刻，終於六十二刻半；六之氣，始於六十二刻六分，終於五十刻。所謂六二，天之數也。丙寅歲，初之氣，天數始於五十一刻，終於三十七刻半；二之氣，始於三十七刻六分，終於二十五刻；三之氣，始於二十六刻，終於一十二刻半；四之氣，始於一十二刻六分，終於水下百刻；五之氣，始於一刻，終於八十七刻半；六之氣，始於八十七刻六分，終於七十五刻。","bh":"这就是所谓初六，是天（气）的数。乙丑之年，初之气，天数始于二十六刻，终于一十二刻半；二之气，始于一十二刻六分，终于水下百刻；三之气，始于一刻，终于八十七刻半；四之气，始于八十七刻六分，终于七十五刻；五之气，始于七十六刻，终于六十二刻半；六之气，始于六十二刻六分，终于五十刻。这就是所谓六二，是天（气）的数。丙寅之年，初之气，天数始于五十一刻，终于三十七刻半；二之气，始于三十七刻六分，终于二十五刻；三之气，始于二十六刻，终于一十二刻半；四之气，始于一十二刻六分，终于水下百刻；五之气，始于一刻，终于八十七刻半；六之气，始于八十七刻六分，终于七十五刻。","notes":[],"pending":false},{"id":"sw68-8","tags":[],"yw":"所謂六三，天之數也。丁卯歲，初之氣，天數始於七十六刻，終於六十二刻半；二之氣，始於六十二刻六分，終於五十刻；三之氣，始於五十一刻，終於三十七刻半；四之氣，始於三十七刻六分，終於二十五刻；五之氣，始於二十六刻，終於一十二刻半；六之氣，始於一十二刻六分，終於水下百刻。所謂六四，天之數也。次戊辰歲，初之氣，復始於一刻，常如是無已，周而復始。帝曰∶願聞其歲候何如？岐伯曰∶悉於哉問也！日行一周，天氣始於一刻，日行再周，天氣始於二十六刻，日行三周，天氣始於五十一刻，日行四周，天氣始於七十六刻，日行五周，天氣復始於一刻，所謂一紀也。","bh":"这就是所谓六三，是天（气）的数。丁卯之年，初之气，天数始于七十六刻，终于六十二刻半；二之气，始于六十二刻六分，终于五十刻；三之气，始于五十一刻，终于三十七刻半；四之气，始于三十七刻六分，终于二十五刻；五之气，始于二十六刻，终于一十二刻半；六之气，始于一十二刻六分，终于水下百刻。这就是所谓六四，是天（气）的数。其次戊辰之年，初之气，又始于一刻；常是这样而无穷尽，周而复始。黄帝说：希望听听它的岁候怎样？岐伯说：问得真周详啊！日行一周，天气始于一刻；日行再（两）周，天气始于二十六刻；日行三周，天气始于五十一刻；日行四周，天气始于七十六刻；日行五周，天气又始于一刻；这就是所谓一纪。","notes":[],"pending":false},{"id":"sw68-9","tags":[],"yw":"是故寅午戌歲氣會同，卯未亥歲氣會同，辰申子歲氣會同，巳酉丑歲氣會同，終而復始。帝曰∶願聞其用也。岐伯曰，言天者求之本，言地者求之位，言人者求之氣交。帝曰∶何謂氣交？岐伯曰∶上下之位，氣交之中，人之居也。故曰∶天樞之上，天氣主之；天樞之下，地氣主之；氣交之分，人氣從之，萬物由之。此之謂也。帝曰∶何謂國中？岐伯曰∶初凡三十度而有奇，中氣同法。帝曰∶國中何也？岐伯曰∶所以分天地也。帝曰∶願卒聞之。岐伯曰∶初者地氣也，中者天氣也。","bh":"所以寅、午、戌（三）年的岁气会同，卯、未、亥（三）年的岁气会同，辰、申、子（三）年的岁气会同，巳、酉、丑（三）年的岁气会同，终而复始。黄帝说：希望听听它的应用。岐伯说：言天的，要推求其本（六气之本）；言地的，要推求其位；言人的，要推求其气交。黄帝说：什么叫气交？岐伯说：上下之位（的中间），就是气交之中，是人所居之处。所以说：天枢之上，天气主之；天枢之下，地气主之；气交之分，人气从之，万物由此而生。说的就是这个。黄帝说：什么叫初、中？岐伯说：初是（每气）三十度而有奇；中气（的度数）也同一法则。黄帝说：初、中（是）为了什么？岐伯说：是用来分（别）天地的。黄帝说：希望详尽地听听。岐伯说：初是地气，中是天气。","notes":[],"pending":false},{"id":"sw68-10","tags":[],"yw":"帝曰∶其升降何如？岐伯曰∶氣之升降，天地之更用也。帝曰∶願聞其用何如？岐伯曰∶升已而降，降者謂天；降已而升，升者謂地。天氣下降，氣流於地；地氣上升，氣騰於天。故高下相召，升降相因，而變作矣。帝曰∶善。寒溼相遘，燥熱相臨，風火相值，其有間乎？岐伯曰∶氣有勝復，勝復之作，有德有化，有用有變，變則邪氣居之。帝曰∶何謂邪乎？岐伯曰∶夫物之生從於化，物之極由乎變，變化之相薄，成敗之所由也。故氣有往復，用有遲速，四者之有，而化而變，風之來也。","bh":"黄帝说：它们的升降怎样？岐伯说：气的升降，是天地更相为用（的作用）。黄帝说：希望听听它（怎样）为用？岐伯说：升已而后降，这（下降的）属于天；降已而后升，这（上升的）属于地。天气下降，其气流注于地；地气上升，其气腾跃于天。所以高与下相互感召，升与降互为因果，变化就由此而发生了。黄帝说：好。寒与湿相遇，燥与热相临，风与火相值（遇），它们之间有分别吗？岐伯说：（六）气有胜（气）有复（气）；胜复的作用中，有德（生化之德）有化（生化之用），有用（作用）有变（灾变）；有了变，邪气就居停其中。黄帝说：什么叫邪？岐伯说：物（的生成）从于化，物（发展到极点）由乎变；变与化相互迫薄（消长），这是成与败的由来。所以气有往有复，作用有迟有速；这四者（德化用变）的存在，而化而变，风的到来（就是这样产生的）。","notes":[],"pending":false},{"id":"sw68-11","tags":[],"yw":"帝曰∶遲速往復，風所由生，而化而變，故因盛衰之變耳。成敗倚伏遊乎中何也？岐伯曰∶成敗倚伏生乎動，動而不已，則變作矣。帝曰∶有期乎？岐伯曰∶不生不化，靜之期也。帝曰∶不生化乎？岐伯曰∶出入廢則神機化滅，升降息則氣立孤危。故非出入，則無以生長壯老已；非升降，則無以生長化收藏。是以升降出入，無器不有。故器者生化之宇，器散則分之，生化息矣。故無不出入，無不升降。化有小大，期有近遠，四者之有，而貴常守，反常則災害至矣。","bh":"黄帝说：（气有）迟速往复，风由此而生，而化而变，所以（这一切）是因于盛衰的变化罢了。（所谓）成败（二者）倚伏游行于其中，是怎样的？岐伯说：成败（的）倚伏产生于动；动而不止，变就发生了。黄帝说：有（止息的）期限吗？岐伯说：不生不化（的时期），就是静的期限。黄帝说：（真有）不生化的吗？岐伯说：出入（的作用）废弛则神机化灭，升降（的作用）停息则气立孤危。所以没有出入，就没有生、长、壮、老、已；没有升降，就没有生、长、化、收、藏。因此升降出入，没有一个「器」（有形之物）不具有。所以器是生化的宇（处所）；器（形体）散了就分离，生化就止息了。所以没有不出入的，没有不升降的。化有小有大，期有近有远；这四者（升降出入）的存在，贵在常守（恒而不失），违反常（律），灾害就来到了。","notes":[],"pending":false},{"id":"sw68-12","tags":[],"yw":"故曰∶無形無患。此之謂也。帝曰∶善。有不生不化乎？岐伯曰∶悉乎哉問也！與道協議，惟真人也。帝曰∶善。天元紀大論∶鐫（子泉切）五營運大論∶憑（扶冰切）礙（音艾）（音畫）眚（所景切）（音）（慈濫切）溽（音辱）（音今）（音括）疚（音救）六微旨大論∶霪（音淫）（音注）涸（胡各切）（音祁）埏（式連切）<目錄>卷第二十","bh":"所以说：无形（器可散）则无患。说的就是这个。黄帝说：好。有（能够）不生不化的吗？岐伯说：问得真详尽啊！与道相合（同一）的，只有真人（才能做到）。黄帝说：好。（篇末所附释音为：）天元纪大论：镌（子泉切）；五运行大论：凭（扶冰切）、碍（音艾）、（一字，音画）、眚（所景切）、（二字，前一音，后一慈滥切）、溽（音辱）、（一字，音今）、（一字，音括）、疚（音救）；六微旨大论：霪（音淫）、（一字，音注）、涸（胡各切）、（一字，音祁）、埏（式连切）。","notes":[],"pending":false}]},
{"id":"sw69","book":"素问","no":69,"title":"气交变大论","titleTw":"氣交變大論","tags":["yunqi","bingji","yinyang"],"brief":"论五运太过与不及所致的气候、物候、病候变化，及五星应象、德化政令灾变与胜复之理，强调天道气交与人体相应。","pending":false,"sections":[{"id":"sw69-1","tags":[],"yw":"黃帝問曰∶五運更治，上應天期，陰陽往復，寒暑迎隨，真邪相薄，內外分離，六經波蕩，五氣傾移，太過過不及，專勝兼並，願言其始，而有常名，可得聞乎？岐伯稽首再拜對曰∶昭乎哉問也！是明道也。此上帝所貴，先師傳之，臣雖不敏，往聞其旨。帝曰∶餘聞得其人不教，是謂失道，傳非其人，慢泄天寶。餘誠菲德，未足以受至道；然而衆子哀其不終，願夫子保於無窮，流於無極，餘司其事，則而行之奈何？岐伯曰∶請遂言之也。《上經》曰∶夫道者，上知天文，下知地理，中知人事，可以長久。","bh":"黄帝问道：五运交替主岁，上与天体运行的期数相应；阴阳往复，寒暑相随而至；真气与邪气相互搏迫，内外分离，六经之气动荡，五气偏移，太过与不及，专胜与兼并——希望听听它们的起始，以及是否有固定的名称，可以讲给我听吗？岐伯叩头再拜回答说：您问得多么明白啊！这是阐明大道的问题。这是上古帝王所珍视、先师传授下来的，臣虽不聪敏，往昔曾听到过其中的要旨。黄帝说：我听说遇到合适的人而不教，就叫作失道；传给不该传的人，是轻慢泄露天宝。我确是德薄，不足以承受这至道；然而众人哀怜他们不能终尽天年，希望先生保全此道于无穷，流传于无极，我来主持这件事，照着施行，怎么样呢？岐伯说：请让我详尽地说吧。《上经》说：所谓道，上知天文，下知地理，中知人事，这样才能长久。","notes":[],"pending":false},{"id":"sw69-2","tags":[],"yw":"此之謂也。帝曰∶何謂也？岐伯曰∶本氣位也。位天者，天文也。位地者，地理也。通於人氣之變化者，人事也。故太過者先天，不及者後天，所謂治化而人應之也。帝曰∶五運之化，太過何如？岐伯曰∶歲木太過，風氣流行，脾土受邪。民病飧泄食減，體重煩冤，腸鳴腹支滿，上應歲星。甚則忽忽善怒，眩冒巔疾。化氣不政，生氣獨治，雲物飛動，草木不寧，甚而搖落，反脅痛而吐甚，衝陽絕者死不治，上應太白星。歲火太過，炎暑流行，肺金受邪。","bh":"说的就是这个。黄帝说：这话怎么讲？岐伯说：这是以气的本位为根本。位于天的，就是天文；位于地的，就是地理；通晓人气变化的，就是人事。所以太过的先于天时而至，不及的后于天时而至，这就是所谓主治与生化，而人体随之相应。黄帝说：五运的生化，太过是怎样的？岐伯说：岁木太过，风气流行，脾土受邪。民众易患飧泄、进食减少、身体沉重、烦闷郁冤、肠鸣、腹部支撑胀满，上应岁星（木星）。严重时精神恍惚、容易发怒、眩晕昏冒、头部疾患。化气不能行其政令，生气独自主治，云物飞动，草木不得安宁，严重时枝叶摇落；反过来出现胁痛而呕吐加剧，若冲阳脉绝的，属死证不可治，上应太白星（金星）。岁火太过，炎热暑气流行，肺金受邪。","notes":[],"pending":false},{"id":"sw69-3","tags":[],"yw":"民病瘧，少氣咳喘，血溢血泄注下，嗌燥耳聾，中熱肩背熱，上應熒惑星。甚則胸中痛，脅支滿脅痛，膺背肩胛間痛，兩臂內痛，身熱骨痛而爲浸淫。收氣不行，長氣獨明，雨水霜寒，上應辰星。上臨少陰少陽，火燔，水泉涸，物焦槁，病反譫妄狂越，咳喘息鳴，下甚血溢泄不已，太淵絕者死不治，上應熒惑星。歲土太過，雨溼流行，腎水受邪。民病腹痛，清厥意不樂，體重煩冤，上應鎮星。甚則肌肉萎，足痿不收，行善，腳下痛，飲發中滿食減，四肢不舉。","bh":"民众易患疟疾、气短、咳喘、血溢血泄、泻注，咽干、耳聋，内热、肩背发热，上应荧惑星（火星）。严重时胸中疼痛，胁肋支撑胀满而疼痛，胸膺、背部、肩胛之间疼痛，两臂内侧疼痛，身热、骨痛而成为浸淫疮。收气不得施行，长气独显，出现雨水霜寒，上应辰星（水星）。若上临少阴、少阳，则火势燔焫，水泉干涸，万物焦枯；病症反而出现谵语狂乱、咳喘息鸣，下部出血不止，若太渊脉绝的，属死证不可治，上应荧惑星。岁土太过，雨湿之气流行，肾水受邪。民众易患腹痛、清厥、情志不乐、身体沉重、烦闷郁冤，上应镇星（土星）。严重时肌肉萎缩、足软无力不能收持，行走不便、脚下疼痛，水饮内发、中焦胀满、进食减少，四肢不能抬举。","notes":[],"pending":false},{"id":"sw69-4","tags":[],"yw":"變生得位，髒氣伏，化氣獨治之，泉湧河衍，涸澤生魚，風雨大至，土崩潰，鱗見於陸，病腹滿溏泄腸鳴，反下甚而太溪絕者死不治，上應歲星。歲金太過，燥氣流行，肝木受邪。民病兩脅下少腹痛，目赤痛瘍，耳無所聞。肅殺而甚，則體重煩冤，胸痛引背，兩脅滿且痛引少腹，上應太白星。甚則喘咳逆氣，肩背痛，尻陰股膝髀足皆病，上應熒惑星。收氣峻，生氣下，草木斂，蒼干雕隕，病反暴痛，脅不可反側，咳逆甚而血溢，太衝絕者死不治，上應太白星。","bh":"变气发生而当令得位，脏气被伏抑，化气独自主治，泉水上涌、河水漫溢，干涸的湖泽里生出鱼来，风雨大作，土崩堤溃，鳞类出现在陆地上；人病腹部胀满、溏泄、肠鸣，若反见下利加重而太溪脉绝的，属死证不可治，上应岁星。岁金太过，燥气流行，肝木受邪。民众易患两胁下及少腹疼痛，目赤、疼痛生疮，耳聋无所闻。若肃杀之气太甚，则身体沉重、烦闷郁冤，胸痛牵引背部，两胁胀满且疼痛牵引少腹，上应太白星。严重时喘咳、气上逆，肩背疼痛，尻、阴部、大腿、膝、髀、足全都发病，上应荧惑星。收气严峻，生气被抑下，草木收敛，苍干凋陨；病症反而出现猝暴疼痛，胁痛得不能转侧，咳逆加重而出血，若太冲脉绝的，属死证不可治，上应太白星。","notes":[],"pending":false},{"id":"sw69-5","tags":[],"yw":"歲水太過，寒氣流行，邪害心火。民病身熱煩心躁悸，陰厥上下中寒，譫妄心痛，寒氣早至，上應辰星。甚則腹大脛腫，喘咳，寢汗出憎風，大雨至，埃霧朦鬱，上應鎮星。上臨太陽，則雨冰雪，霜不時降，溼氣變物，病反腹滿腸鳴，溏泄食不化，渴而妄冒，神門絕者死不治，上應熒惑、辰星。帝曰∶善。其不及何如？岐伯曰∶悉乎哉問也！歲木不及，燥乃大行，生氣失應，草木晚榮，肅殺而甚，則剛木辟着，柔萎蒼干，上應太白星，民病中清，脅痛，少腹痛，腸鳴溏泄，涼雨時至，上應太白星，其谷蒼。","bh":"岁水太过，寒气流行，邪气伤害心火。民众易患身热、心中烦躁、躁动心悸，阴厥而上下内外俱寒，谵语妄言、心痛，寒气提早到来，上应辰星。严重时腹部胀大、胫部浮肿、喘咳，睡中汗出、恶风；大雨降下，尘埃雾气朦郁，上应镇星。若上临太阳，则出现雨、冰、雪，霜不时降下，湿气变易万物；病症反见腹部胀满、肠鸣、溏泄、食物不化，口渴而昏冒妄乱，若神门脉绝的，属死证不可治，上应荧惑星、辰星。黄帝说：好。那不及的情况怎样？岐伯说：您问得真详尽啊！岁木不及，燥气于是大行，生气不能与之相应，草木推迟繁荣；若肃杀过甚，则坚硬的树木干裂皴揭，柔弱的草木枯萎苍干，上应太白星；民众易患内里清冷、胁痛、少腹痛、肠鸣、溏泄，凉雨时常降下，上应太白星，其谷色苍。","notes":[],"pending":false},{"id":"sw69-6","tags":[],"yw":"上臨陽明，生氣失政，草木再榮，化氣乃急，上應太白、鎮星，其主蒼早。復則炎暑流火，溼性燥，柔脆草木焦槁，下體再生，華實齊化，病寒熱瘡瘍胗癰痤，上應熒惑、太白，其谷白堅。白露早降，收殺氣行，寒雨害物，蟲食甘黃，脾土受邪，赤氣後化，心氣晚治，上勝肺金，白氣乃屈，其谷不成，咳而鼽，上應熒惑、太白星。歲火不及，寒乃大行，長政不用，物榮而下，凝慘而甚，則陽氣不化，乃折榮美，上應辰星，民病胸中痛，脅支滿，兩脅痛，膺背肩胛間及兩臂內痛，鬱冒朦昧，心痛暴喑，胸腹大，脅下與腰背相引而痛，甚則屈不能伸，髖髀如別，上應熒惑、辰星，其谷丹。","bh":"若上临阳明，生气失去政令，草木再度繁荣，化气于是急迫，上应太白星、镇星，其主苍色之物早成。若复气发作，则炎暑如火流布，湿性变为干燥，柔脆的草木焦枯，下部重新生发，开花与结实同时并化；人病寒热、疮疡、疹、痈、痤，上应荧惑星、太白星，其谷白色坚实。白露提早降下，收杀之气运行，寒雨伤害万物，虫类蛀食甘黄之物，脾土受邪；赤气后化，心气晚主治令，火气上胜肺金，白气于是屈服，其谷不能成熟，病咳嗽而鼻塞流涕，上应荧惑星、太白星。岁火不及，寒气于是大行，长气之政不能施用，万物虽荣却趋于衰落；若凝惨过甚，则阳气不能生化，于是摧折荣美，上应辰星；民众易患胸中疼痛、胁肋支撑胀满、两胁疼痛，胸膺、背部、肩胛之间以及两臂内侧疼痛，郁冒昏蒙，心痛、突然失音，胸腹胀大，胁下与腰背相牵引而痛，严重时屈而不能伸，髋部与髀部如开裂一般，上应荧惑星、辰星，其谷色丹。","notes":[],"pending":false},{"id":"sw69-7","tags":[],"yw":"復則埃鬱，大雨且至，黑氣乃辱，病溏腹滿，食飲不下，寒中腸鳴，泄注腹痛，暴攣痿痹，足不任身，上應鎮星、辰星，玄谷不成。歲土不及，風乃大行，化氣不令，草木茂榮，飄揚而甚，秀而不實，上應歲星，民病飧泄霍亂，體重腹痛，筋骨繇復，肌肉酸，善怒，髒氣舉事，蟄蟲早附，鹹病寒中，上應歲星、鎮星，其谷。復則收政嚴峻，名木蒼雕，胸脅暴痛，下引少腹，善大息，蟲食甘黃，氣客於脾，谷乃減，民食少失味，蒼谷乃損，上應太白、歲星。","bh":"若复气发作，则尘埃郁塞，大雨将要到来，黑气于是受辱；人病大便溏薄、腹部胀满，饮食不下，寒气在中、肠鸣，泄泻如注、腹痛，突然痉挛、痿痹，两足不能支撑身体，上应镇星、辰星，黑色之谷不能成熟。岁土不及，风气于是大行，化气不能行令，草木茂盛繁荣，飘扬过甚，只抽穗而不结实，上应岁星；民众易患飧泄、霍乱，身体沉重、腹痛，筋骨摇动往复，肌肉酸楚，容易发怒；脏气用事，蛰虫提早伏附，都易患寒中之病，上应岁星、镇星，其谷（原文此处有缺）。若复气发作，则收气之政严峻，高大的树木苍老凋零，胸胁猝然疼痛，向下牵引少腹，常爱叹气，虫类蛀食甘黄之物，邪气客于脾，谷物因而减产，民众进食减少、失去味觉，苍色之谷受到损伤，上应太白星、岁星。","notes":[],"pending":false},{"id":"sw69-8","tags":[],"yw":"上臨厥陰，流水不冰，蟄蟲來見，髒氣不用，白乃不復，上應歲星，民乃康。歲金不及，炎火乃行，生氣乃用，長氣專勝，庶物以茂，燥爍以行，上應熒惑星，民病肩背瞀重，鼽嚏血便注下，收氣乃後，上應太白星，其谷堅芒。復則寒雨暴至，乃零冰雹霜雪殺物，陰厥且格，陽反上行，頭腦戶痛，延及囟頂發熱，上應辰星，丹谷不成，民病口瘡，甚則心痛。歲水不及，溼乃大行，長氣反用，其化乃速，暑雨數至，上應鎮星，民病腹滿身重，濡泄寒瘍流水，腰股痛發，股膝不便，煩冤足痿清厥，腳下痛，甚則跗腫，髒氣不政，腎氣不衡，上應辰星，其谷。","bh":"若上临厥阴，则流水不结冰，蛰虫重新出现，脏气不能用事，白气于是不来报复，上应岁星，民众安康。岁金不及，炎火于是流行，生气于是用事，长气专胜，众物因而繁茂，燥热烁灼之气流行，上应荧惑星；民众易患肩背闷重，鼻塞喷嚏、便血、泻注，收气延后，上应太白星，其谷坚实有芒。若复气发作，则寒雨暴至，降下冰雹霜雪而杀伤万物；阴厥之气格拒于外，阳气反而上行，出现头后脑户部疼痛，延及囟门顶部发热，上应辰星，丹色之谷不能成熟，民众易患口疮，严重时心痛。岁水不及，湿气于是大行，长气反被用事，其生化迅速，暑雨屡次降下，上应镇星；民众易患腹部胀满、身体沉重，濡泄、寒性疮疡流脓水，腰腿部疼痛发作，大腿膝部活动不便，烦闷郁冤、足痿、清厥，脚下疼痛，严重时足背浮肿；脏气不能行令，肾气失于平衡，上应辰星，其谷（原文此处有缺）。","notes":[],"pending":false},{"id":"sw69-9","tags":[],"yw":"上臨太陰，則大寒數舉，蟄蟲早藏，地積堅冰，陽光不治，民病寒疾於下，甚則腹滿浮腫，上應鎮星，其主谷。復則大風暴發，草偃木零，生長不鮮，面色時變，筋骨並辟，肉螈，目視KTKT，物疏璺，肌肉胗發，氣並膈中，痛於心腹，黃氣乃損，其谷不登，上應歲星。帝曰∶善。願聞其時也。岐伯曰∶悉哉問也！木不及，春有鳴條律暢之化，則秋有霧露清涼之政，春有慘悽殘賊之勝，則夏有炎暑燔爍之復，其眚東，其髒肝，其病內舍脅，外在關節。","bh":"若上临太阴，则大寒屡次发作，蛰虫提早伏藏，地上积起坚冰，阳光不能主治，民众下部易患寒病，严重时腹部胀满、浮肿，上应镇星，其主谷（原文此处有缺）。若复气发作，则大风突然发作，草倒木落，生长之物不鲜明，面色时常改变，筋骨拘急痉挛，肌肉抽动，目视（原文此二字残缺），物体疏裂，肌肉发疹，邪气并于膈中，心腹疼痛；黄气于是受损，其谷不能丰收，上应岁星。黄帝说：好。希望听听它相应的时令。岐伯说：您问得真详尽啊！木运不及，如果春天有风吹枝条鸣响、节律和畅的生化，那么秋天就有雾露清凉的政令；如果春天有凄惨残贼的胜气，那么夏天就有炎暑燔灼的复气。其灾害应于东方，其脏在肝，其病在内舍于胁部，在外表现于关节。","notes":[],"pending":false},{"id":"sw69-10","tags":[],"yw":"火不及，夏有炳明光顯之化，則冬有嚴肅霜寒之政，夏有慘悽凝冽之勝，則不時有埃昏大雨之復，其眚南，其髒心，其病內舍膺脅，外在經絡。土不及，四維有埃雲潤澤之化，則春有鳴條鼓拆之政，四維發振拉飄騰之變，則秋有肅殺霖霪之復，其眚四維，其髒脾，其病內舍心腹，外在肌肉四肢。金不及，夏有光顯鬱蒸之令，則冬有嚴凝整肅之應，夏有炎爍燔燎之變，則秋有冰雹霜雪之復，其眚西，其髒肺，其病內舍膺脅肩背，外在皮毛。水不及，四維有湍潤埃雲之化，則不時有和風生發之應，四維發埃昏驟注之變，則不時有瓢蕩振拉之復，其眚北，其髒腎，其病內舍腰脊骨髓，外在溪谷膝。","bh":"火运不及，如果夏天有光明显赫的生化，那么冬天就有严肃霜寒的政令；如果夏天有凄惨凝冽的胜气，那么不定时就有尘埃昏暗、大雨的复气。其灾害应于南方，其脏在心，其病在内舍于胸膺胁部，在外表现于经络。土运不及，如果四维（辰戌丑未月）有埃云润泽的生化，那么春天就有风吹枝条鸣响、鼓动拆发的政令；如果四维发生振动拉拔、飘扬升腾的变异，那么秋天就有肃杀霖霪的复气。其灾害应于四维，其脏在脾，其病在内舍于心腹，在外表现于肌肉四肢。金运不及，如果夏天有光明郁蒸的时令，那么冬天就有严寒凝整肃杀的应验；如果夏天有炎热燔燎的变异，那么秋天就有冰雹霜雪的复气。其灾害应于西方，其脏在肺，其病在内舍于胸膺、胁、肩背，在外表现于皮毛。水运不及，如果四维有湍润埃云的生化，那么不定时就有和风生发的应验；如果四维发生尘埃昏暗、骤注大雨的变异，那么不定时就有飘荡振动拉拔的复气。其灾害应于北方，其脏在肾，其病在内舍于腰脊骨髓，在外表现于溪谷与膝部。","notes":[],"pending":false},{"id":"sw69-11","tags":[],"yw":"夫五運之政，猶權衡也，高者抑之，下者舉之，化者應之，變者復之，此生長化成收藏之理，氣之常也，失常則天地四塞矣。故曰∶天地之動靜，神明爲之紀，陰陽之往復，寒暑彰其兆。此之謂也。帝曰∶夫子之言五氣之變，四時之應，可謂悉矣。夫氣之動亂，觸遇而作，發無常會，卒然災合，何以期之？岐伯曰∶夫氣之動變，固不常在，而德化政令災變，不同其候也。帝曰∶何謂也？岐伯曰∶東方生風，風生木，其德敷和，其化生榮，其政舒啓，其令風，其變振發，其災散落。","bh":"五运的政令，犹如秤锤与秤杆一样，过高的就压低它，过低的就抬举它；有生化的就有相应，有变异的就有报复。这就是生、长、化、成、收、藏的道理，是气的常道；失去常道，天地四方的气就闭塞不通了。所以说：天地的动静，由神明为之纲纪；阴阳的往复，由寒暑来彰显它的征兆。说的就是这个。黄帝说：先生所讲五气的变化、四时的应验，可以说是很详尽了。然而气的动乱，是触遇而发作，发作没有固定的时候，猝然与灾害相合，怎样来预期它呢？岐伯说：气的动变，本来不常在，而德、化、政、令、灾、变，各有不同的征候。黄帝说：怎么讲呢？岐伯说：东方生风，风生木；其德为敷和，其化为生荣，其政为舒启，其令为风，其变为振发，其灾为散落。","notes":[],"pending":false},{"id":"sw69-12","tags":[],"yw":"南方生熱，熱生火，其德彰顯，其化蕃茂，其政明曜，其令熱，其變銷爍，其災燔。中央生溼，溼生土，其德溽蒸，其化豐備，其政安靜，其令溼，其變驟注，其災霖潰。西方生燥，燥生金，其德清潔，其化緊斂，其政勁切，其令燥，其變肅殺，其災蒼隕。北方生寒，寒生水，其德悽滄，其化清謐，其政凝肅，其令寒，其變冽，其災冰雪霜雹。是以察其動也，有德有化，有政有令，有變有災，而物由之，而人應之也。帝曰∶夫子之言歲候，其不及太過，而上應五星。","bh":"南方生热，热生火；其德为彰显，其化为蕃茂，其政为明曜，其令为热，其变为销烁，其灾为燔焫。中央生湿，湿生土；其德为溽蒸，其化为丰备，其政为安静，其令为湿，其变为骤注，其灾为霖溃。西方生燥，燥生金；其德为清洁，其化为紧敛，其政为劲切，其令为燥，其变为肃杀，其灾为苍陨。北方生寒，寒生水；其德为凄沧，其化为清谧，其政为凝肃，其令为寒，其变为凛冽，其灾为冰雪霜雹。所以观察气的变动，有德有化，有政有令，有变有灾，万物由此而生，人体也随之相应。黄帝说：先生所谈岁候的不及与太过，而上应五星。","notes":[],"pending":false},{"id":"sw69-13","tags":[],"yw":"今夫德化政令，災眚變易，非常而有也，卒然而動，其亦爲之變乎。岐伯曰∶承天而行之，故無妄動，無不應也。卒然而動者，氣之交變也，其不應焉。故曰∶應常不應卒。此之謂也。帝曰∶其應奈何？岐伯曰∶各從其氣化也。帝曰∶其行之徐疾逆順何如？岐伯曰∶以道留久，逆守而小，是謂省下。以道而去，去而速來，曲而過之，是謂省遺過也。久留而環，或離或附，是謂議災與其德也。應近則小，應遠則大。芒而大倍常之一，其化甚；大常之二，其眚即發也。","bh":"至于德、化、政、令、灾、眚、变、易，不是常有的，猝然而动，五星也会随之变动吗？岐伯说：它们是承奉天道而运行的，所以没有妄动，也没有不相应的。猝然而动的，属于气的交变，五星就不与之相应。所以说：应于常而不应于卒。说的就是这个。黄帝说：那怎样相应呢？岐伯说：各随其气的生化而定。黄帝说：五星运行的徐疾逆顺是怎样的？岐伯说：顺道而行、停留很久，逆行留守而形体变小，这叫作省察下方。顺道而去，去而速来，曲折而过，这叫作省察遗留的过失。久留而环绕，或离或附，这叫作议察灾害与其德泽。应验在近的则小，应验在远的则大。光芒比平常大一倍的，其生化甚盛；大两倍的，其灾害即刻发作。","notes":[],"pending":false},{"id":"sw69-14","tags":[],"yw":"小常之一，其化減；小常之二，是謂臨視，省下之過與其德也。德者福之，過者伐之。是以象之見也，高而遠則小，下而近則大，故大則喜怒邇，小則禍福遠。歲運太過，則運星北越，運氣相得，則各行以道。故歲運太過，畏星失色而兼其母，不及，則色兼其所不勝。肖者瞿瞿，莫知其妙，閔閔之當，孰者爲良，妄行無徵，示畏侯王。帝曰∶其災應何如？岐伯曰∶亦各從其化也，故時至有盛衰，凌犯有逆順，留守有多少，形見有善惡，宿屬有勝負，徵應有吉兇矣。","bh":"比平常小一倍的，其生化衰减；小一半的，这叫作临视，是省察下方的过失与其德泽。有德的赐之以福，有过失的讨伐之。所以星象的出现，位置高而远的形体就小，位置低而近的形体就大；因此星大则喜怒之事近，星小则祸福之事远。岁运太过，则运星向北越过；运气相得，则各按自己的轨道运行。所以岁运太过，所畏之星失色而兼见其母色；不及，则颜色兼见其所不胜之色。众人瞿瞿然惊顾，没有人知道其中的奥妙；深远幽微的当否，哪一个才算良好？妄行而没有征验，只是示警于侯王罢了。黄帝说：那灾害的应验怎样？岐伯说：也各随其气化而定，所以时令到来有盛有衰，凌犯有逆有顺，留守有多有少，形现于外有善有恶，星宿所属有胜有负，征应也就有吉有凶了。","notes":[],"pending":false},{"id":"sw69-15","tags":[],"yw":"帝曰∶其善惡何謂也？岐伯曰∶有喜有怒，有憂有喪，有澤有燥，此象之常也，必謹察之。帝曰∶六者高下異乎？岐伯曰∶象見高下，其應一也，故人亦應之。帝曰∶善。其德化政令之動靜損益皆何如？岐伯曰∶夫德化政令災變，不能相加也。勝復盛衰，不能相多也。往來小大，不能相過也。用之升降，不能相無也。各從其動而復之耳。帝曰∶其病生何如？岐伯曰∶德化者氣之祥，政令者氣之章，變易者復之紀，災眚者傷之始，氣相勝者和，不相勝者病，重感於邪則甚也。","bh":"黄帝说：善恶指的是什么？岐伯说：有喜悦之象，有怒威之象，有忧戚之象，有丧败之象，有润泽之象，有枯燥之象，这是星象的常态，必须谨慎观察。黄帝说：这六种象在高位和低位有差别吗？岐伯说：星象出现的位置虽有高下之分，其应验是一致的，所以人体也与之相应。黄帝说：好。德、化、政、令的动静损益都是怎样的？岐伯说：德、化、政、令、灾、变，不能相互叠加；胜气与复气的盛衰，不能相互增多；往来的大小，不能相互超越；气用的升降，不能相互缺乏。各随其所动而报复罢了。黄帝说：疾病是怎样产生的？岐伯说：德化是气的祥瑞，政令是气的外彰，变易是复气的纲纪，灾眚是损伤的开始；气能相胜的就调和，不能相胜的就发病，若再重感于邪气就会加重。","notes":[],"pending":false},{"id":"sw69-16","tags":[],"yw":"帝曰∶善。所謂精光之論，大聖之業，宣明大道，通於無窮，究於無極也。餘聞之，善言天者，必應於人，善言古者，必驗於今，善言氣者，必彰於物，善言應者，同天地之化，善言化言變者，通神明之理，非夫子孰能言至道歟！乃擇良兆而藏之靈室，每旦讀之，命曰《氣交變》，非齋戒不敢發，慎傳也。<目錄>卷第二十","bh":"黄帝说：好。这就是所谓精微光明的论述、大圣的事业，宣明大道，通达于无穷，穷究于无极啊。我听说：善于谈论天的，必能应验于人；善于谈论古的，必能验证于今；善于谈论气的，必能彰显于物；善于谈论相应的，能与天地的生化相合；善于谈论化与变的，能通晓神明的道理。除了先生，谁能讲出这样的至道呢！于是选择吉日良兆，把它藏在灵室之中，每天早晨诵读，命名为《气交变》，不斋戒不敢开启，慎重地传授。","notes":[],"pending":false}]},
{"id":"sw70","book":"素问","no":70,"title":"五常政大论","titleTw":"五常政大論","tags":["yunqi","zhenfa","bingji"],"brief":"分述五运平气、不及、太过三纪的气候物候与病候，论地势高下与寿夭、司天在泉对生化胎孕的影响及因时因地制宜的用药之法。","pending":false,"sections":[{"id":"sw70-1","tags":[],"yw":"黃帝問曰∶太虛寥廓，五運回薄，衰盛不同，損益相從，願聞平氣何如而名？何如而紀也？岐伯對曰∶昭乎哉問也！木曰敷和，火曰升明，土曰備化，金曰審平，水曰靜順。帝曰∶其不及奈何？岐伯曰∶木曰委和，火曰伏明，土曰卑監，金曰從革，水曰涸流。帝曰∶太過何謂？岐伯曰∶木曰發生，火曰赫曦，土曰敦阜，金曰堅成，水曰流衍。帝曰∶三氣之紀，願聞其候。岐伯曰∶悉乎哉問也！敷和之紀，木德周行，陽舒陰布，五化宣平，其氣端，其性隨，其用曲直，其化生榮，其類草木，其政發散，其候溫和，其令風，其髒肝，肝其畏清，其主目，其谷麻，其果李，其實核，其應春，其蟲毛，其畜犬，其色蒼，其養筋，其病裏急支滿，其味酸，其音角，其物中堅，其數八。","bh":"黄帝问道：太虚寥廓广大，五运回旋迫薄，衰盛各不相同，损益相随而来，希望听听平气怎样命名、怎样记录？岐伯回答说：您问得多么明白啊！木运平气叫作敷和，火运叫作升明，土运叫作备化，金运叫作审平，水运叫作静顺。黄帝说：不及的怎样？岐伯说：木叫委和，火叫伏明，土叫卑监，金叫从革，水叫涸流。黄帝说：太过叫什么？岐伯说：木叫发生，火叫赫曦，土叫敦阜，金叫坚成，水叫流衍。黄帝说：这三种气的纲纪，希望听听它们的征候。岐伯说：您问得真详尽啊！敷和的年份，木德周行于四方，阳气舒发、阴气布散，五化宣畅平和；其气端直，其性随和，其用能曲能直，其化为生发荣茂，其类为草木，其政为发散，其气候温和，其令为风，其脏应肝，肝畏清气（金气），其主于目，其谷为麻，其果为李，其实为核，其应于春，其虫为毛虫，其畜为犬，其色为苍，其滋养筋，其病为腹中拘急、支撑胀满，其味为酸，其音为角，其在物为中坚，其数为八。","notes":[],"pending":false},{"id":"sw70-2","tags":[],"yw":"升明之紀，正陽而治，德施周普，五化均衡，其氣高，其性速，其用燔灼，其化蕃茂，其類火，其政明曜，其候炎暑，其令熱，其髒心，心其畏寒，其主舌，其谷麥，其果杏，其實絡，其應夏，其蟲羽，其畜馬，其色赤，其養血，其病螈，其味苦，其音徵，其物脈，其數七。備化之紀，氣協天休，德流四政，五化齊修，其氣平，其性順，其用高下，其化豐滿，其類土，其政安靜，其候溽蒸，其令溼，其髒脾，脾其畏風，其主口，其谷稷，其果棗，其實肉，其應長夏，其蟲，其畜牛，其色黃，其養肉，其病痞，其味甘，其音宮，其物膚，其數五。","bh":"升明的年份，以正阳而主治，德泽施布周遍，五化均衡；其气高扬，其性迅疾，其用为燔灼，其化为蕃茂，其类为火，其政为明曜，其气候为炎暑，其令为热，其脏应心，心畏寒气（水气），其主于舌，其谷为麦，其果为杏，其实为络，其应于夏，其虫为羽虫，其畜为马，其色为赤，其滋养血脉，其病为抽搐痉挛，其味为苦，其音为征，其在物为脉，其数为七。备化的年份，气与天道相协和，德泽流布于四时之政，五化齐备修治；其气平正，其性柔顺，其用能高能下，其化为丰满，其类为土，其政为安静，其气候为溽蒸，其令为湿，其脏应脾，脾畏风气（木气），其主于口，其谷为稷，其果为枣，其实为肉，其应于长夏，其虫为倮虫（无羽无毛无鳞无介之虫），其畜为牛，其色为黄，其滋养肌肉，其病为痞塞，其味为甘，其音为宫，其在物为肤，其数为五。","notes":[],"pending":false},{"id":"sw70-3","tags":[],"yw":"審平之紀，收而不爭，殺而無犯，五化宣明，其氣潔，其性剛，其用散落，其化堅斂，其類金，其政勁肅，其候清切，其令燥，其髒肺，肺其畏熱，其主鼻，其谷稻，其果桃，其實殼，其應秋，其蟲介，其畜雞，其色白，其養皮毛，其病咳，其味辛，其音商，其物外堅，其數九。靜順之紀，藏而勿害，治而善下，五化鹹整，其氣明，其性下，其用沃衍，其化凝堅，其類水，其政流演，其候凝肅，其令寒，其髒腎，腎其畏溼，其主二陰，其谷豆，其果慄，其實濡，其應冬，其蟲鱗，其畜彘，其色黑，其養骨髓，其病厥，其味鹹，其音羽，其物濡，其數六。","bh":"审平的年份，收敛而不相争，肃杀而无侵犯，五化宣畅明洁；其气洁净，其性刚劲，其用为散落，其化为坚敛，其类为金，其政为劲肃，其气候为清切，其令为燥，其脏应肺，肺畏热气（火气），其主于鼻，其谷为稻，其果为桃，其实为壳，其应于秋，其虫为介虫，其畜为鸡，其色为白，其滋养皮毛，其病为咳，其味为辛，其音为商，其在物为外坚，其数为九。静顺的年份，闭藏而无伤害，主治而善于下行，五化都整齐；其气明洁，其性下趋，其用为沃衍，其化为凝坚，其类为水，其政为流演，其气候为凝肃，其令为寒，其脏应肾，肾畏湿气（土气），其主于二阴（前后二阴），其谷为豆，其果为栗，其实为濡（汁液），其应于冬，其虫为鳞虫，其畜为豕，其色为黑，其滋养骨髓，其病为厥，其味为咸，其音为羽，其在物为濡润，其数为六。","notes":[],"pending":false},{"id":"sw70-4","tags":[],"yw":"故生而勿殺，長而勿罰，化而勿制，收而勿害，藏而勿抑，是謂平氣。委和之紀，是謂勝生，生氣不政，化氣乃揚，長氣自平，收令乃早，涼雨時降，風雲並興，草木晚榮，蒼干雕落，物秀而實，膚肉內充，其氣斂，其用聚，其動戾拘緩，其發驚駭，其髒肝，其果棗李，其實核殼，其谷稷稻，其味酸辛，其色白蒼，其畜犬雞，其蟲毛介，其主霧露悽滄，其聲角商，其病搖動注恐，從金化也，少角與判商同，上角與正角同，上商與正商同，其病肢廢癰腫瘡瘍，其甘蟲，邪傷肝也，上宮與正宮同，蕭肅殺則炎赫沸騰，眚於三，所謂復也，其主飛蠹蛆雉，乃爲雷霆。","bh":"所以，主生的时令不要杀伐，主长的时令不要惩罚，主化的时令不要制约，主收的时令不要伤害，主藏的时令不要抑压，这就叫作平气。委和的年份，叫作胜生（生气被胜）；生气不能行令，化气于是张扬，长气自趋平和，收令提早到来，凉雨时常降下，风云并起，草木推迟繁荣，苍干凋落；物虽抽穗结实，只是皮肉内充；其气收敛，其用聚敛，其动为乖戾、拘急或弛缓，其发为惊骇，其脏应肝；其果为枣、李，其实为核与壳，其谷为稷、稻，其味酸辛，其色白苍，其畜为犬、鸡，其虫为毛虫、介虫，其主为雾露凄沧之象，其声为角与商；其病为摇动、注泻、惊恐，这是从金气而化的缘故。少角与判商同，上角与正角同，上商与正商同；其病为肢体废坏、痈肿疮疡，其为甘虫所伤，是邪气伤肝。上宫与正宫同。若萧瑟肃杀太过，则炎赫沸腾而来报复，灾害应于三（东方），这就是所谓复气；其主飞虫、蠹虫、蛆、雉，于是发生雷霆。","notes":[],"pending":false},{"id":"sw70-5","tags":[],"yw":"伏明之紀，是謂勝長，長氣不宣，髒氣反布，收氣自政，化令乃衡，寒清數舉，暑令乃薄，承化物生，生而不長，成實而稚，遇化已老，陽氣屈伏，蟄蟲早藏，其氣鬱，其用暴，其動彰伏變易，其發痛，其髒心，其果慄桃，其實絡濡，其谷豆稻，其味苦鹹，其色玄丹，其畜馬彘，其蟲羽鱗，其主冰雪霜寒，其聲徵羽，其病昏惑悲忘，從水化也，少徵與少羽同，上商與正商同，邪傷心也，凝慘凜冽則豪雨霖霪，眚於九，其主驟注雷霆震驚，沉淫雨。卑監之紀，是謂減化，化氣不令，生政獨彰，長氣整，雨乃愆，收氣平，風寒並興，草木榮美，秀而不實，成而秕也，其氣散，其用靜定，其動瘍湧分潰癰腫，其發濡滯，其髒脾，其果李慄，其實濡核，其谷豆麻，其味酸甘，其色蒼黃，其畜牛犬，其蟲毛，其主飄怒振發，其聲宮角，其病留滿痞塞，從木化也，少宮與少角同，上宮與正宮同，上角與正角同，其病飧泄，邪傷脾也，振拉飄揚則蒼干散落，其眚四維，其主敗折虎野狼，清氣乃用，生政乃辱。","bh":"伏明的年份，叫作胜长（长气被胜）；长气不能宣发，脏气反布于外，收气自行政令，化令于是趋于平和，寒凉清冷之气屡次发作，暑令因而薄弱；承接化气而生的万物，生而不能长，虽结实而幼稚，遇到化气就已衰老；阳气屈伏，蛰虫提早伏藏；其气郁滞，其用暴急，其动为显伏变易无常，其发为疼痛，其脏应心；其果为栗、桃，其实为络与濡，其谷为豆、稻，其味苦咸，其色玄丹，其畜为马、豕，其虫为羽虫、鳞虫，其主为冰雪霜寒之象，其声为征与羽；其病为昏惑、悲哀、健忘，这是从水气而化的缘故。少征与少羽同，上商与正商同，邪气伤心。若凝惨凛冽太过，则暴雨霖霪而来报复，灾害应于九（南方）；其主骤注大雨、雷霆震惊，沉淫久雨。卑监的年份，叫作减化（化气被减）；化气不能行令，生气之政独显，长气齐整，雨水于是愆期，收气平和，风寒并起，草木荣美，只开花而不结实，虽成而子实空秕；其气散漫，其用静定，其动为疮疡涌发、分溃、痈肿，其发为濡滞，其脏应脾；其果为李、栗，其实为濡与核，其谷为豆、麻，其味酸甘，其色苍黄，其畜为牛、犬，其虫为毛虫，其主为飘怒振发之象，其声为宫与角；其病为留滞胀满、痞塞不通，这是从木气而化的缘故。少宫与少角同，上宫与正宫同，上角与正角同；其病为飧泄，邪气伤脾。若振动拉拔飘扬太过，则苍干散落而来报复，其灾害在四维；其主败折、虎狼之伤，清气于是用事，生气之政于是受辱。","notes":[],"pending":false},{"id":"sw70-6","tags":[],"yw":"從革之紀，是謂折收，收氣乃後，生氣乃揚，長化合德，火政乃宣，庶類以蕃，其氣揚，其用躁切，其動鏗禁瞀厥，其發咳喘，其髒肺，其果李杏，其實殼絡，其谷麻麥，其味苦辛，其色白丹，其畜雞羊，其蟲介羽，其主明曜炎爍，其聲商徵，其病嚏咳鼽衄，從火化也，少商與少徵同，上商與正商同，上角與正角同，邪傷肺也，炎光赫烈則冰雪霜雹，眚於七，其主鱗伏彘鼠，歲氣早至，乃生大寒。涸流之紀，是謂反陽，藏令不舉，化氣乃昌，長氣宣布，蟄蟲不藏，土潤水泉減，草木條茂，榮秀滿盛，其氣滯，其用滲泄，其動堅止，其發燥槁，其髒腎，其果棗杏，其實濡肉，其谷黍稷，其味甘鹹，其色玄，其畜彘牛，其蟲鱗，其主埃鬱昏翳，其聲羽宮，其病痿厥堅下，從土化也，少羽與少宮同，上宮與正宮同，其病癃，邪傷腎也，埃昏驟雨則振拉摧拔，眚於一，其主毛顯狐，變化不藏。","bh":"从革的年份，叫作折收（收气被折）；收气延后，生气于是张扬，长气与化气合德，火政于是宣发，众物因而蕃盛；其气发扬，其用躁急切迫，其动为铿然有声、噤闭、昏闷、厥逆，其发为咳喘，其脏应肺；其果为李、杏，其实为壳与络，其谷为麻、麦，其味苦辛，其色白丹，其畜为鸡、羊，其虫为介虫、羽虫，其主为明曜炎烁之象，其声为商与征；其病为喷嚏、咳嗽、鼻塞流涕、鼻出血，这是从火气而化的缘故。少商与少征同，上商与正商同，上角与正角同，邪气伤肺。若炎光赫烈太过，则冰雪霜雹而来报复，灾害应于七（西方）；其主鳞虫伏藏、彘鼠之类，岁气提早到来，于是发生大寒。涸流的年份，叫作反阳；藏令不能举发，化气于是昌盛，长气宣布，蛰虫不能伏藏，土润而水泉减少，草木枝条茂盛，荣秀丰盛；其气滞涩，其用为渗泄，其动为坚止，其发为干燥枯槁，其脏应肾；其果为枣、杏，其实为濡与肉，其谷为黍、稷，其味甘咸，其色为玄，其畜为豕、牛，其虫为鳞虫，其主为埃郁昏翳之象，其声为羽与宫；其病为痿厥、坚下，这是从土气而化的缘故。少羽与少宫同，上宫与正宫同；其病为癃闭，邪气伤肾。若埃昏骤雨太过，则振动拉拔摧折而来报复，灾害应于一（北方）；其主毛虫显露、狐貉之类，变化而不能闭藏。","notes":[],"pending":false},{"id":"sw70-7","tags":[],"yw":"故乘危而行，不速而至，炎威無德，災反及之，微者復微，甚者復甚，氣之常也。發生之紀，是謂啓陳，土疏泄，蒼氣達，陽和布化，陰氣乃隨，生氣淳化，萬物以榮，其化生，其氣美，其政散，其令條舒，其動掉眩巔疾，其德鳴靡啓坼，其變振拉摧拔，其谷麻稻，其畜雞犬，其果李桃，其色青黃白，其味酸甘辛，其象春，其經足厥陰少陽，其髒肝脾，其蟲毛介，其物中堅外堅，其病怒，太角與上商同，上徵則其氣逆，其病吐利，不務其德則收氣復，秋氣勁切，甚則肅殺，清氣大至，草木雕零，邪乃傷肝。","bh":"所以乘其虚弱而行，不招而来，以炎威相加而无恩德，灾害反而会加到自身，轻微的报复也轻，严重的报复也重，这是气的常道。发生的年份，叫作启陈（开启陈旧）；土气疏泄，苍气通达，阳和布散生化，阴气随之而行，生气淳厚化育，万物因而繁荣；其化为生，其气美好，其政为散布，其令为条达舒展，其动为振摇眩晕、头部疾患；其德为鸣响靡散、开启坼裂，其变为振动拉拔摧折；其谷为麻、稻，其畜为鸡、犬，其果为李、桃，其色青黄白，其味酸甘辛，其象应春；其经脉为足厥阴、足少阳，其脏应肝脾，其虫为毛虫、介虫，其在物为中坚与外坚，其病为易怒。太角与上商同；上征则其气上逆，其病为吐泻。若不务修其德，则收气来复，秋气劲切，甚则肃杀，清气大至，草木凋零，邪气于是伤肝。","notes":[],"pending":false},{"id":"sw70-8","tags":[],"yw":"赫曦之紀，是謂蕃茂，陰氣內化，陽氣外榮，炎暑施化，物得以昌，其化長，其氣高，其政動，其令鳴顯，其動炎灼妄擾，其德暄暑鬱蒸，其變炎烈沸騰，其谷麥豆，其畜羊彘，其果杏慄，其色赤白玄，其味苦辛鹹，其象夏，其經手少陰太陽，手厥陰少陽，其髒心肺，其蟲羽鱗，其物脈濡，其病笑瘧瘡瘍血流狂妄目赤，上羽與正徵同，其收齊，其病，上徵而收氣後也，暴烈其政，髒氣乃復，時見凝慘，甚則雨水霜雹切寒，邪傷心也。敦阜之紀，是謂廣化，濃德清靜，順長以盈，至陰內實，物化充成，煙埃朦鬱，見於濃土，大雨時行，溼氣乃用，燥政乃辟，其化圓，其氣豐，其政靜，其令周備，其動濡積並，其德柔潤重淖，其變震驚飄驟崩潰，其谷稷麻，其畜牛犬，其果棗李，其色玄蒼，其味甘鹹酸，其象長夏，其經足太陰陽明，其髒脾腎，其蟲毛，其物肌核，其病腹滿四肢不舉，大風迅至，邪傷脾也。","bh":"赫曦的年份，叫作蕃茂；阴气化于内，阳气荣于外，炎暑施布生化，万物得以昌盛；其化为长，其气高扬，其政为动，其令为鸣响显明；其动为炎热灼烧、妄动扰乱，其德为暄暑郁蒸，其变为炎烈沸腾；其谷为麦、豆，其畜为羊、豕，其果为杏、栗，其色赤白玄，其味苦辛咸，其象应夏；其经脉为手少阴、手太阳，手厥阴、手少阳，其脏应心肺，其虫为羽虫、鳞虫，其在物为脉与濡；其病为喜笑不休、疟疾、疮疡、血流、狂妄、目赤。上羽与正征同，其收气齐备；其病（原文此处有缺），是上征而收气延后的缘故。若施政暴烈，脏气（水气）于是来复，时常出现凝惨之象，甚则雨水霜雹、严寒切骨，邪气伤心。敦阜的年份，叫作广化；厚德清静，顺承长气而致丰盈，至阴之气内实，万物化育充实成熟；烟埃朦郁，见于厚土之上，大雨时常施行，湿气于是用事，燥政于是退避；其化为圆，其气丰盛，其政为安静，其令为周备；其动为濡湿积并，其德为柔润重淖，其变为震惊、飘骤、崩溃；其谷为稷、麻，其畜为牛、犬，其果为枣、李，其色玄苍，其味甘咸酸，其象应长夏；其经脉为足太阴、足阳明，其脏应脾肾，其虫为毛虫，其在物为肌与核；其病为腹部胀满、四肢不能抬举。大风迅速到来，邪气伤脾。","notes":[],"pending":false},{"id":"sw70-9","tags":[],"yw":"堅成之紀，是謂收引，天氣潔，地氣明，陽氣隨，陰治化，燥行其政，物以司成，收氣繁布，化洽不終，其化成，其氣削，其政肅，其令銳切，其動暴折瘍疰，其德霧露蕭，其變肅殺雕零，其谷稻黍，其畜雞馬，其果桃杏，其色白青丹，其味辛酸苦，其象秋，其經手太陰陽明，其髒肺肝，其蟲介羽，其物殼絡，其病喘喝胸憑仰息，上徵與正商同，其生齊，其病咳，政暴變則名木不榮，柔脆焦首，長氣斯救，大火流，炎爍且至，蔓將槁，邪傷肺也。流衍之紀，是謂封藏，寒司物化，天地嚴凝，藏政以布，長令不揚，其化凜，其氣堅，其政謐，其令流注，其動漂泄沃湧，其德凝慘寒，其變冰雪霜雹，其谷豆稷，其畜彘牛，其果慄棗，其色黑丹，其味鹹苦甘，其象冬，其經足少陰太陽，其髒腎心，其蟲鱗，其物濡滿，其病脹，上羽而長氣不化也。","bh":"坚成的年份，叫作收引；天气洁净，地气清明，阳气随从，阴气主治生化，燥气施行其政，万物由此而成，收气繁布，化气不能终尽；其化为成，其气削夺，其政为肃，其令为锐切；其动为暴折、疮疡、疰病，其德为雾露萧瑟，其变为肃杀凋零；其谷为稻、黍，其畜为鸡、马，其果为桃、杏，其色白青丹，其味辛酸苦，其象应秋；其经脉为手太阴、手阳明，其脏应肺肝，其虫为介虫、羽虫，其在物为壳与络；其病为喘喝、胸中满闷、仰面而息。上征与正商同，其生气齐备；其病为咳。若施政暴变，则名木不能荣茂，柔脆之物焦其首，长气（火气）于是来救，大火流行，炎烁将至，蔓草将要枯萎，邪气伤肺。流衍的年份，叫作封藏；寒气主司万物之化，天地严寒凝肃，藏政布散，长令不得发扬；其化为凛冽，其气坚凝，其政为静谧，其令为流注；其动为漂泄、沃涌，其德为凝惨寒冽，其变为冰雪霜雹；其谷为豆、稷，其畜为豕、牛，其果为栗、枣，其色黑丹，其味咸苦甘，其象应冬；其经脉为足少阴、足太阳，其脏应肾心，其虫为鳞虫，其在物为濡满；其病为胀，这是因为上羽而长气不能生化的缘故。","notes":[],"pending":false},{"id":"sw70-10","tags":[],"yw":"政過則化氣大舉，而埃昏氣交，大雨時降，邪傷腎也。故曰∶不恆其德，則所勝來復，政恆其理，則所勝同化。此之謂也。帝曰∶天不足西北，左寒而右涼，地不滿東南，右熱而左溫，其故何也？岐伯曰∶陰陽之氣，高下之理，太少之異也。東南方，陽也，陽者其精降於下，故右熱而左溫。西北方，陰也，陰者其精奉於上，故左寒而右涼。是以地有高下，氣有溫涼，高者氣寒，下者氣熱，故適寒涼者脹，之溫熱者瘡，下之則脹已，汗之則瘡已，此腠理開閉之常，太少之異耳。","bh":"若施政太过，则化气（土气）大举，尘埃昏蒙于气交之中，大雨时常降下，邪气伤肾。所以说：不能常守其德，则所胜者就会来报复；能常守其理，则所胜者与之同化。说的就是这个。黄帝说：天气不足于西北，所以北方寒而西方凉；地气不满于东南，所以南方热而东方温，这是什么缘故？岐伯说：这是阴阳之气、地势高下之理、多少不同的缘故。东南方属阳，阳气的精微下降于下，所以南方热而东方温。西北方属阴，阴气的精微奉养于上，所以北方寒而西方凉。因此地势有高下，气候有温凉：地势高的气寒，地势低的气热。所以到寒凉之地的人易患胀病，到温热之地的人易患疮疡；用下法则胀病可愈，用汗法则疮疡可愈。这是腠理开闭的常态，也是阴阳多少的差异罢了。","notes":[],"pending":false},{"id":"sw70-11","tags":[],"yw":"帝曰∶其於壽夭何如？岐伯曰∶陰精所奉其人壽，陽精所降其人夭。帝曰∶善。其病也，治之奈何？岐伯曰∶西北之氣散而寒之，東南之氣收而溫之，所謂同病異治也。故曰∶氣寒氣涼，治以寒涼，行水漬之。氣溫氣熱，治以溫熱，強其內守。必同其氣，可使平也，假者反之。帝曰∶善。一州之氣，生化壽夭不同，其故何也？岐伯曰∶高下之理，地勢使然也。崇高則陰氣治之，污下則陽氣治之，陽勝者先天，陰勝者後天，此地理之常，生化之道也。帝曰∶其有壽夭乎？岐伯曰∶高者其氣壽，下者其氣夭，地之小大異也，小者小異，大者大異。","bh":"黄帝说：这与寿命长短有什么关系？岐伯说：阴精所奉养的地方，其人长寿；阳精所降泄的地方，其人夭折。黄帝说：好。如果发病，怎样治疗？岐伯说：西北之气，宜发散其外而寒清其内；东南之气，宜收敛其外而温养其内，这就是所谓同病异治。所以说：气寒气凉的地方，用寒凉之法治疗，并用汤水浸渍；气温气热的地方，用温热之法治疗，以加强其内在的固守。必须与当地的气相一致，才能使病情平复，若为假象则反其道而行。黄帝说：好。同一州域之气，生化与寿夭各不相同，这是什么缘故？岐伯说：这是高下之理、地势使之如此。崇高之地由阴气主治，低下之地由阳气主治；阳胜的先天时而至，阴胜的后天时而至，这是地理的常态、生化的规律。黄帝说：其中有寿夭的差别吗？岐伯说：地势高的其气令人寿，地势低的其气令人夭，这是地域大小的差异：地域小的差异小，地域大的差异大。","notes":[],"pending":false},{"id":"sw70-12","tags":[],"yw":"故治病者，必明天道地理，陰陽更勝，氣之先後，人之壽夭，生化之期，乃可以知人之形氣矣。帝曰∶善。其歲有不病，而髒氣不應不用者何也？岐伯曰∶天氣制之，氣有所從也。帝曰∶願卒聞之。岐伯曰∶少陽司天，火氣下臨，肺氣上從，白起金用，草木眚，火見燔，革金且耗，大暑以行，咳嚏鼽衄鼻窒，曰瘍，寒熱腫。風行於地，塵沙飛揚，心痛胃脘痛，厥逆膈不通，其主暴速。陽明司天，燥氣下臨，肝氣上從，蒼起木用而立，土乃眚，悽滄數至，木伐草萎，脅痛目赤，掉振鼓慄，筋痿不能久立。","bh":"所以治病的人，必须明晓天道地理、阴阳更胜、气的先后、人的寿夭、生化的期限，才可以了解人的形与气。黄帝说：好。有的年份不发生疾病，而脏气不与岁气相应、不发挥作用，这是什么缘故？岐伯说：这是天气制约它，气有所从的缘故。黄帝说：希望详尽地听听。岐伯说：少阳司天，火气下临于地，肺气上从而应之，白色之气兴起、金气用事，草木受灾，火气燔焫，金气因而耗损，大暑流行，发生咳嗽、喷嚏、鼻塞流涕、鼻出血、鼻塞不通，以及疮疡、寒热、浮肿。风气行于地，尘沙飞扬，发生心痛、胃脘痛、厥逆、膈塞不通，其主病急暴。阳明司天，燥气下临于地，肝气上从而应之，苍色之气兴起、木气用事而立，土于是受灾，凄沧之气屡至，木伐草萎，发生胁痛、目赤、振摇战栗、筋痿不能久立。","notes":[],"pending":false},{"id":"sw70-13","tags":[],"yw":"暴熱至，土乃暑，陽氣鬱發，小便變，寒熱如瘧，甚則心痛，火行於稿，流水不冰，蟄蟲乃見。太陽司天，寒氣下臨，心氣上從，而火且明，丹起金乃眚，寒清時舉，勝則水冰，火氣高明，心熱煩，嗌干善渴，鼽嚏，喜悲數欠，熱氣妄行，寒乃復，霜不時降，善忘，甚則心痛。土乃潤，水豐衍，寒客至，沉陰化，溼氣變物，水飲內，中滿不食，皮肉苛，筋脈不利，甚則腫身後癰。厥陰司天，風氣下臨，脾氣上從，而土且隆，黃起水乃眚，土用革，體重肌肉萎，食減口爽，風行太虛，雲物搖動，目轉耳鳴。","bh":"暴热到来，土气于是暑热，阳气郁而发作，小便发生改变，寒热如同疟疾，严重时心痛；火气行于枯槁之物，流水不结冰，蛰虫于是出现。太阳司天，寒气下临于地，心气上从而应之，火气因而显明，丹色之气兴起而金气受灾，寒凉清冷之气时常发作，若胜甚则水结冰；火气高明在上，发生心中烦热、咽干、易渴、鼻塞喷嚏、喜悲、常打呵欠；热气妄行，寒气于是来复，霜不时降下，健忘，严重时心痛。土于是润泽，水丰衍流溢，寒客之气到来，沉阴之气生化，湿气变易万物，水饮内停，中焦胀满不能进食，皮肉麻木不仁，筋脉不利，严重时浮肿、身后发痈。厥阴司天，风气下临于地，脾气上从而应之，土气因而隆盛，黄色之气兴起而水气受灾，土的作用改变，发生身体沉重、肌肉萎缩、进食减少、口失滋味；风行于太虚，云物摇动，发生目眩、耳鸣。","notes":[],"pending":false},{"id":"sw70-14","tags":[],"yw":"火縱其暴，地乃暑，大熱消爍，赤沃下，蟄蟲數見，流水不冰，其發機速。少陰司天，熱氣下臨，肺氣上從，白起金用，草木眚，喘嘔寒熱，嚏鼽衄鼻窒，大暑流行，甚則瘡瘍燔灼，金爍石流。地乃燥清，悽滄數至，脅痛善太息，肅殺行，草木變。太陰司天，溼氣下臨，腎氣上從，黑起水變，埃冒雲雨，胸中不利，陰痿氣大衰而不起不用。當其時反腰痛，動轉不便也，厥逆。地乃藏陰，大寒且至，蟄蟲早附，心下痞痛，地裂冰堅，少腹痛，時害於食，乘金則止水增，味乃鹹，行水減也。","bh":"火气纵其暴虐，地上于是暑热，大热消烁万物，赤痢下利，蛰虫屡次出现，流水不结冰，其发作机变迅速。少阴司天，热气下临于地，肺气上从而应之，白色之气兴起、金气用事，草木受灾，发生喘、呕、寒热，喷嚏、鼻塞流涕、鼻出血、鼻塞不通，大暑流行，严重时疮疡燔灼，金石销熔流汁。地气于是干燥清凉，凄沧之气屡至，发生胁痛、善太息；肃杀之气运行，草木发生变化。太阴司天，湿气下临于地，肾气上从而应之，黑色之气兴起而水气发生变化，尘埃上冒、云雨时行，胸中不舒利，阴痿、气大衰而不能勃起、不能为用；当其时反见腰痛，转动不便，厥逆。地气于是闭藏阴气，大寒将至，蛰虫提早依附，心下痞塞疼痛，地裂冰坚，少腹疼痛，时常妨害饮食；若乘金气则止水增加，味于是变咸，行水减少。","notes":[],"pending":false},{"id":"sw70-15","tags":[],"yw":"帝曰∶歲有胎孕不育，治之不全，何氣使然？岐伯曰∶六氣五類，有相勝制也，同者盛之，異者衰之，此天地之道，生化之常也。故厥陰司天，毛蟲靜，羽蟲育，介蟲不成；在泉，毛蟲育，蟲耗，羽蟲不育。少陰司天，羽蟲靜，介蟲育，毛蟲不成；在泉，羽蟲育，介蟲耗不育。太陰司天，蟲靜，鱗蟲育，羽蟲不成；在泉，蟲育，鱗蟲不成。少陽司天，羽蟲靜，毛蟲育，蟲不成；在泉，羽蟲育，介蟲耗，毛蟲不育。陽明司天，介蟲靜，羽蟲育，介蟲不成；在泉，介蟲育，毛蟲耗，羽蟲不成。","bh":"黄帝说：年份中有胎孕而不生育的，治疗效果不全，是什么气使它这样？岐伯说：六气与五类（毛虫、羽虫、倮虫、介虫、鳞虫）之间，有相胜相制的关系；相同的就旺盛，相异的就衰减，这是天地的规律、生化的常态。所以厥阴司天，毛虫安静，羽虫生育，介虫不能成形；厥阴在泉，毛虫生育，倮虫耗损，羽虫不能生育。少阴司天，羽虫安静，介虫生育，毛虫不能成形；少阴在泉，羽虫生育，介虫耗损而不能生育。太阴司天，倮虫安静，鳞虫生育，羽虫不能成形；太阴在泉，倮虫生育，鳞虫不能成形。少阳司天，羽虫安静，毛虫生育，倮虫不能成形；少阳在泉，羽虫生育，介虫耗损，毛虫不能生育。阳明司天，介虫安静，羽虫生育，介虫不能成形；阳明在泉，介虫生育，毛虫耗损，羽虫不能成形。","notes":[],"pending":false},{"id":"sw70-16","tags":[],"yw":"太陽司天，鱗蟲靜，蟲育；在泉，鱗蟲耗，蟲不育。諸乘所不成之運，則甚也。故氣主有所制，歲立有所生，地氣制己勝，天氣制勝己，天制色，地制形，五類衰盛，各隨其氣之所宜也。故有胎孕不育，治之不全，此氣之常也，所謂中根也。根於外者亦五，故生化之別，有五氣五味五色五類五宜也。帝曰∶何謂也？岐伯曰∶根於中者，命曰神機，神去則機息。根於外者，命曰氣立，氣止則化絕。故各有制，各有勝，各有生，各有成。故曰∶不知年之所加，氣之同異，不足以言生化。","bh":"太阳司天，鳞虫安静，倮虫生育；太阳在泉，鳞虫耗损，倮虫不能生育。凡乘临于所不能成形之运的，情况就更严重。所以气主各有其所制，岁气确立各有其所生；地气制约自己所胜之气，天气制约胜过自己的气；天制约色，地制约形；五类的衰盛，各随其气的相宜与否。所以有胎孕而不育、治疗不全的情况，这是气的常态，就是所谓中根。根于外的也有五类，所以生化的区别有五气、五味、五色、五类、五宜。黄帝说：这怎么讲？岐伯说：根于中的，叫作神机，神气离去则机转停息。根于外的，叫作气立，气止息则生化断绝。所以各有制约，各有胜气，各有生化，各有成就。所以说：不知道年气的加临、气的同异，就不足以谈生化。","notes":[],"pending":false},{"id":"sw70-17","tags":[],"yw":"此之謂也。帝曰∶氣始而生化，氣散而有形，氣布而蕃育，氣終而象變，其致一也。然而五味所資，生化有薄濃，成熟有少多，終始不同，其故何也？岐伯曰∶地氣制之也，非天不生，地不長也。帝曰∶願聞其道。岐伯曰∶寒熱燥溼，不同其化也。故少陽在泉，寒毒不生，其味辛，其治苦酸，其谷蒼丹。陽明在泉，溼毒不生，其味酸，其氣溼，其治辛苦甘，其谷丹素。太陽在泉，熱毒不生，其味苦，其治淡鹹，其谷。厥陰在泉，清毒不生，其味甘，其治酸苦，其谷蒼赤，其氣專，其味正。","bh":"说的就是这个。黄帝说：气起始则有生化，气布散则成有形之物，气敷布则繁育，气终结则物象改变，其道理是一致的。然而五味所资养的，生化有厚有薄，成熟有多有少，终结与起始各不相同，这是什么缘故？岐伯说：这是地气制约的缘故，不是天不生、地不长。黄帝说：希望听听其中的道理。岐伯说：寒、热、燥、湿，其生化各不相同。所以少阳在泉，寒毒之物不生，其味为辛，其治用苦酸，其谷为苍、丹之色。阳明在泉，湿毒之物不生，其味为酸，其气为湿，其治用辛苦甘，其谷为丹、素之色。太阳在泉，热毒之物不生，其味为苦，其治用淡咸，其谷（原文此处有缺）。厥阴在泉，清毒之物不生，其味为甘，其治用酸苦，其谷为苍、赤之色；其气专一，其味纯正。","notes":[],"pending":false},{"id":"sw70-18","tags":[],"yw":"少陰在泉，寒毒不生，其味辛，其治辛苦甘，其谷白丹。太陰在泉，燥毒不生，其味鹹，其氣熱，其治甘鹹，其谷。化淳則鹹守，氣專則辛化而俱治。故曰∶補上下者從之，治上下者逆之，以所在寒熱盛衰而調之。故曰∶上取下取，內取外取，以求其過。能毒者以濃藥，不勝毒者以薄藥。此之謂也。氣反者，病在上，取之下；病在下，取之上；病在中，旁取之。治熱以寒，溫而行之；治寒以熱，涼而行之；治溫以清，冷而行之；治清以溫，熱而行之。","bh":"少阴在泉，寒毒之物不生，其味为辛，其治用辛苦甘，其谷为白、丹之色。太阴在泉，燥毒之物不生，其味为咸，其气为热，其治用甘咸，其谷（原文此处有缺）。生化淳厚则咸味内守，气专一则辛味生化而都能主治。所以说：补上下之气的顺从它，治上下之气的违逆它，根据所在之处的寒热盛衰来调治。所以说：上取、下取，内取、外取，以寻求其过失所在。能耐受药毒的用气味浓厚的药，不能耐受药毒的用气味淡薄的药。说的就是这个。气反的，病在上的取下，病在下的取上，病在中的取旁。治热用寒药，温热服之；治寒用热药，清凉服之；治温用清药，冷服之；治清用温药，热服之。","notes":[],"pending":false},{"id":"sw70-19","tags":[],"yw":"故消之削之，吐之下之，補之瀉之，久新同法。帝曰∶病在中而不實不堅，且聚且散，奈何？岐伯曰∶悉乎哉問也！無積者求其藏，虛則補之，藥以祛之，食以隨之，行水漬之，和其中外，可使畢已。帝曰∶有毒無毒，服有約乎？岐伯曰∶病有久新，方有大小，有毒無毒，固宜常制矣。大毒治病，十去其六，常毒治病，十去其七，小毒治病，十去其八，無毒治病，十去其九，谷肉果菜，食養盡之，無使過之，傷其正也。不盡，行復如法，必先歲氣，無伐天和，無盛盛，無虛虛，而遺人天殃，無致邪，無失正，絕人長命。","bh":"所以消散它、削伐它，涌吐它、攻下它，补益它、泻夺它，久病新病都同一法则。黄帝说：病在中焦，既不坚实也不硬满，时聚时散，怎么办？岐伯说：您问得真详尽啊！没有积滞的，就探求其所主之脏，虚的就补它，用药祛除病邪，用饮食调养随之，用汤水浸渍，调和其中外，可以使病完全痊愈。黄帝说：有毒的药与无毒的药，服用有什么常规吗？岐伯说：病有久新，方有大小，有毒无毒，本来就有固定的制度。用大毒治病，病去十分之六就停；用常毒治病，病去十分之七就停；用小毒治病，病去十分之八就停；用无毒治病，病去十分之九就停；其余用谷、肉、果、菜，以饮食调养尽除病邪，不可用药过度，以免损伤正气。若病未尽除，再按前法施行。必须先候岁气，不可违逆天和，不可使盛者更盛、虚者更虚，从而给人留下夭殃；不可招致邪气，不可耗失正气，以免断绝人的寿命。","notes":[],"pending":false},{"id":"sw70-20","tags":[],"yw":"帝曰∶其久病者，有氣從不康，病去而瘠，奈何？岐伯曰∶昭乎哉聖人之問也！化不可代，時不可違。夫經絡以通，血氣以從，復其不足，與衆齊同，養之和之，靜以待時，謹守其氣，無使傾移，其形乃彰，生氣以長，命曰聖王。故大要曰∶無代化，無違時，必養必和，待其來復。此之謂也。帝曰∶善。氣交變大論∶槁（苦老切）瞼（音檢）HT（音接）蠹（音）（音木）璺（音問）謐（音蜜）五常政大論∶（如勻切）（妻徑切）（音瑟）（音今）麂（音幾）鏗（音坑）瞀（音冒）拉（音蠟）（他端切）磧（妻力切）（音列）<目錄>卷第二十一","bh":"黄帝说：那些久病的人，气已顺从而身体仍不健康，病邪已去而身体消瘦，怎么办？岐伯说：圣人的提问多么高明啊！生化之气不可代替，时令不可违背。要使经络得以通畅，血气得以顺从，恢复其不足，与众人齐同；调养它、和顺它，安静地等待时令，谨慎地守护其气，不使它偏倾移动，形体就会彰显，生气就会增长，这就叫作圣王。所以《大要》说：不要代替生化，不要违背时令，必须调养、必须和顺，等待它自然恢复。说的就是这个。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw71","book":"素问","no":71,"title":"六元正纪大论","titleTw":"六元正紀大論","tags":["yunqi","bingji","yinyang"],"brief":"统论六气司天在泉之政、五运六气同化与天符岁会之数，及五郁之发、六气正纪十二变与四时用药宜忌。","pending":false,"sections":[{"id":"sw71-1","tags":[],"yw":"黃帝問曰∶六化六變，勝復淫治，甘苦辛鹹酸淡先後，餘知之矣。夫五運之化，或從五氣，或逆天氣，或從天氣而逆地氣，或從地氣而逆天氣，或相得，或不相得，餘未能明其事。欲通天之紀，從地之理，和其運，調其化，使上下合德，無相奪倫，天地升降，不失其宜，五運宣行，勿乖其政，調之正味，從逆奈何？岐伯稽首再拜對曰∶昭乎哉問也，此天地之綱紀，變化之淵源，非聖帝孰能窮其至理歟！臣雖不敏，請陳其道，令終不滅，久而不易。帝曰∶願夫子推而次之，從其類序，分其部主，別其宗司，昭其氣數，明其正化，可得聞乎？岐伯曰∶先立其年以明其氣，金木水火土營運之數，寒暑燥溼風火臨御之化，則天道可見，民氣可調，陰陽卷舒，近而無惑，數之可數者，請遂言之。","bh":"黄帝问道：六气的生化与六气的变化，胜气、复气、太过、平治，以及甘苦辛咸酸淡六味的先后，我已经知道了。至于五运的生化，有的随从五气，有的违逆天气，有的随从天气而违逆地气，有的随从地气而违逆天气，有的相得，有的不相得，我还未能明白其中的道理。想要通晓天的纲纪，顺从地的理法，和调其运，调理其化，使上下合其德，不相夺其伦次；天地升降，不失其宜；五运宣行，不违背其政令；用正味来调治，怎样随从、怎样违逆呢？岐伯叩头再拜回答说：您问得多么明白啊！这是天地的纲纪、变化的渊源，若非圣帝谁能穷究它的至理呢！臣虽不聪敏，请让我陈述这个道理，使它终不泯灭、历久而不变易。黄帝说：希望先生推演而按次排列，依从其类别次序，分其部属主司，辨别其宗主所司，昭明其气数，阐明其正常的生化，可以讲给我听吗？岐伯说：先确立其年份以明确其气，金木水火土运行之数，寒暑燥湿风火临御之化，这样天道就可以显现，民气就可以调治，阴阳的卷舒，近在眼前而没有疑惑。这些可以计数的，请让我详尽地说来。","notes":[],"pending":false},{"id":"sw71-2","tags":[],"yw":"帝曰∶太陽之政奈何？岐伯曰∶辰戌之紀也。太陽太角太陰壬辰壬戌其運風，其化鳴紊啓拆，其變振拉摧拔，其病眩掉目瞑。太角（初正）少徵太宮少商太羽（終）太陽太徵太陰戊辰戊戌同正。其運熱，其化暄暑鬱燠，其變炎烈沸騰，其病熱鬱。太徵少宮太商少羽（終）少角（初）太陽太宮太陰甲辰歲會（同天符）甲戌歲會（同天符）其運陰埃，其化柔潤重澤，其變震驚飄驟，其病溼下重。太宮少商太羽（終）太角（初）少徵太陽太商太陰庚辰庚戌其運涼，其化霧露蕭，其變肅殺雕零，其病燥背瞀胸滿。","bh":"黄帝说：太阳司天的政令是怎样的？岐伯说：这是辰戌年的纲纪。太阳司天，太角（木运太过）为太角中运，太阴在泉，壬辰、壬戌年：其运为风，其化为鸣响紊乱、开启拆裂，其变为振动拉拔摧折，其病为眩晕振摇、目眩眼黑。太角（初正）、少征、太宫、少商、太羽（终）。太阳司天，太征（火运太过）中运，太阴在泉，戊辰、戊戌年，同正征：其运为热，其化为暄暖暑热、郁蒸燠热，其变为炎烈沸腾，其病为热郁。太征、少宫、太商、少羽（终）、少角（初）。太阳司天，太宫（土运太过）中运，太阴在泉，甲辰岁会（同天符）、甲戌岁会（同天符）：其运为阴埃（阴雨尘埃），其化为柔润重泽，其变为震惊飘骤，其病为湿邪下注、身体沉重。太宫、少商、太羽（终）、太角（初）、少征。太阳司天，太商（金运太过）中运，太阴在泉，庚辰、庚戌年：其运为凉，其化为雾露萧瑟，其变为肃杀凋零，其病为燥、背部闷瞀、胸满。","notes":[],"pending":false},{"id":"sw71-3","tags":[],"yw":"太商少羽（終）少角（初）太徵少宮太陽太羽太陰丙辰天符丙戌天符。其運寒，其化凝慘冽，其變冰雪霜雹，其病大寒留於溪谷。太羽（終）太角（初）少徵太宮少商凡此太陽司天之政，氣化營運先天，天氣肅，地氣靜，寒臨太虛，陽氣不令，水土合德，上應辰星鎮星。其谷玄。其政肅，其令徐。寒政大舉，澤無陽焰，則火發待時。少陽中治，時雨乃涯，止極雨散，還於太陰，雲朝北極，溼化乃布，澤流萬物，寒敷於上，雷動於下，寒溼之氣，持於氣交。","bh":"太商、少羽（终）、少角（初）、太征、少宫。太阳司天，太羽（水运太过）中运，太阴在泉，丙辰天符、丙戌天符：其运为寒，其化为凝惨凛冽，其变为冰雪霜雹，其病为大寒之气留滞于溪谷（肌肉交会之处）。太羽（终）、太角（初）、少征、太宫、少商。凡此太阳司天的政令，气化运行先于天时；天气肃杀，地气安静，寒气临于太虚，阳气不能行令；水土合德，上应辰星（水星）、镇星（土星）。其谷色玄。其政肃，其令徐。寒政大举，川泽中没有阳热之焰，则火气郁伏而等待时机发作。少阳（相火）居中主治，时雨于是止息；止极则雨散，还归于太阴，云朝向北极，湿化于是布散，润泽流布万物；寒气敷布于上，雷动于下，寒湿之气持守于气交之中。","notes":[],"pending":false},{"id":"sw71-4","tags":[],"yw":"民病寒溼，發肌肉萎，足痿不收，濡瀉血溢。初之氣，地氣遷，氣乃大溫，草乃早榮，民乃厲，溫病乃作，身熱頭痛嘔吐，肌腠瘡瘍。二之氣，大涼反至，民乃慘，草乃遇寒，火氣遂抑，民病氣鬱中滿，寒乃始。三之氣，天政布，寒氣行，雨乃降。民病寒，反熱中，癰疽注下，心熱瞀悶，不治者死。四之氣，風溼交爭，風化爲雨，乃長乃化乃成。民病大熱少氣，肌肉萎足痿，注下赤白。五之氣，陽復化，草乃長乃化乃成，民乃舒。終之氣，地氣正，溼令行，陰凝太虛，埃昏郊野，民乃慘悽，寒風以至，反者孕乃死。","bh":"民众易患寒湿之病，发为肌肉萎缩、足软无力不能收持、濡泻、血溢。初之气，地气迁移，气候于是大温，草木于是提早繁荣，民众易患疫疠，温病于是发作，出现身热、头痛、呕吐、肌肤腠理生疮疡。二之气，大凉之气反而到来，民众因而凄惨，草木遭遇寒气，火气于是被抑，民众易患气郁、中满，寒气于是开始。三之气，天政布散，寒气运行，雨水于是降下；民众患寒病，反而出现内热，发痈疽、泻注，心中烦热、昏闷，不治的会死亡。四之气，风湿相争，风化而为雨，于是生长、化育、成熟；民众易患大热、气短，肌肉萎缩、足痿，泻下赤白。五之气，阳气恢复生化，草木于是生长、化育、成熟，民众于是舒畅。终之气，地气当正，湿令施行，阴气凝于太虚，尘埃昏蒙郊野，民众于是凄惨，寒风到来；与时相反的，孕者胎儿会死亡。","notes":[],"pending":false},{"id":"sw71-5","tags":[],"yw":"故歲宜苦以燥之溫之，必折其鬱氣，先資其化源，抑其運氣，扶其不勝，無使暴過而生其疾，食歲谷以全其真，避虛邪以安其正。適氣同異，多少制之，同寒溼者燥熱化，異寒溼者燥溼化，故同者多之，異者少之，用寒遠寒，用涼遠涼，用溫遠溫，用熱遠熱，食宜同法。有假者反常，反是者病，所謂時也。帝曰∶善。陽明之政奈何？岐伯曰∶卯酉之紀也。陽明少角少陰清熱勝復同，同正商。丁卯歲會丁酉其運風清熱。少角（初正）太徵少宮太商少羽（終）陽明少徵少陰寒雨勝復同，同正商。","bh":"所以这一年宜用苦味以燥之、以温之，必须折减其郁气，先资助其生化之源，抑制其运气，扶助其所不胜之气，不使暴过而生疾病；食用岁谷以保全真气，躲避虚邪以安定正气。根据气的同异、多少来制约它：与寒湿相同的用燥热之化，与寒湿相异的用燥湿之化，所以相同的多用，相异的少用。用寒药要避开寒时，用凉药要避开凉时，用温药要避开温时，用热药要避开热时，饮食也同一法则。有假气的反其常法，违背这些就会生病，这就是所谓时也。黄帝说：好。阳明司天的政令是怎样的？岐伯说：这是卯酉年的纲纪。阳明司天，少角（木运不及）中运，少阴在泉，清热胜复相同，同正商：丁卯岁会、丁酉年，其运为风、清、热。少角（初正）、太征、少宫、太商、少羽（终）。阳明司天，少征（火运不及）中运，少阴在泉，寒雨胜复相同，同正商。","notes":[],"pending":false},{"id":"sw71-6","tags":[],"yw":"癸卯（同歲會）癸酉（同歲會）其運熱寒雨。少徵太宮少商太羽（終）太角（初）陽明少宮少陰風涼勝復同。己卯己酉其運雨風涼。少宮太商少羽（終）少角（初）太徵陽明少商少陰熱寒勝復同，同正商。乙卯天符乙酉歲會，太一天符。其運涼熱寒。少商太羽（終）太角（初）少徵太宮陽明少羽少陰雨風勝復同，同少宮。辛卯辛酉其運寒雨風。少羽（終）少角（初）太徵少宮太商凡此陽明司天之政，氣化營運後天，天氣急，地氣明，陽專其令，炎暑大行，物燥以堅，淳風乃治，風燥橫運，流於氣交，多陽少陰，雲趨雨府，溼化乃敷。","bh":"癸卯（同岁会）、癸酉（同岁会）：其运为热、寒、雨。少征、太宫、少商、太羽（终）、太角（初）。阳明司天，少宫（土运不及）中运，少阴在泉，风凉胜复相同：己卯、己酉年，其运为雨、风、凉。少宫、太商、少羽（终）、少角（初）、太征。阳明司天，少商（金运不及）中运，少阴在泉，热寒胜复相同，同正商：乙卯天符、乙酉岁会，为太一天符，其运为凉、热、寒。少商、太羽（终）、太角（初）、少征、太宫。阳明司天，少羽（水运不及）中运，少阴在泉，雨风胜复相同，同少宫：辛卯、辛酉年，其运为寒、雨、风。少羽（终）、少角（初）、太征、少宫、太商。凡此阳明司天的政令，气化运行后于天时；天气急劲，地气清明，阳气专主其令，炎暑大行，万物干燥而坚，淳和之风主治，风燥横行，流布于气交，阳多阴少，云趋向雨府，湿化于是敷布。","notes":[],"pending":false},{"id":"sw71-7","tags":[],"yw":"燥極而澤，其谷白丹，間谷命太者，其耗白甲品羽，金火合德，上應太白熒惑。其政切，其令暴，蟄蟲乃見，流水不冰，民病咳嗌塞，寒熱發，暴振癃，清先而勁，毛蟲乃死，熱後而暴，介蟲乃殃，其發躁，勝復之作，擾而大亂，清熱之氣，持於氣交。初之氣，地氣遷，陰始凝，氣始肅，水乃冰，寒雨化。其病中熱脹，面目浮腫，善眠，鼽衄嚏欠嘔，小便黃赤，甚則淋。二之氣，陽乃布，民乃舒，物乃生榮。厲大至，民善暴死。三之氣，天政布，涼乃行，燥熱交合，燥極而澤，民病寒熱。","bh":"燥极而后转为润泽，其谷为白、丹之色；间谷是得间气之化而气太过的，其耗损白色甲壳之类与羽虫。金火合德，上应太白星（金星）、荧惑星（火星）。其政急切，其令暴烈，蛰虫于是出现，流水不结冰；民众易患咳嗽、咽喉阻塞，寒热发作，猝然振颤、癃闭；清气先至而劲急，毛虫于是死亡；热气后至而暴烈，介虫于是遭殃。其发作躁急，胜复之气的发作，扰乱而大乱，清气与热气持守于气交。初之气，地气迁移，阴气开始凝结，气开始肃杀，水于是结冰，寒雨之化发生；其病为内热胀满，面目浮肿，嗜睡，鼻塞流涕、鼻出血、喷嚏、呵欠、呕吐，小便黄赤，甚则淋证。二之气，阳气于是布散，民众于是舒畅，万物于是生长繁荣；疫疠大至，民众易猝然死亡。三之气，天政布散，凉气于是运行，燥热交合，燥极而后润泽，民众患寒热。","notes":[],"pending":false},{"id":"sw71-8","tags":[],"yw":"四之氣，寒雨降。病暴僕，振慄譫妄，少氣嗌干引飲，及爲心痛癰腫瘡瘍瘧寒之疾，骨痿血便。五之氣，春令反行，草乃生榮，民氣和。終之氣，陽氣布，候反溫，蟄蟲來見，流水不冰，民乃康平，其病溫。故食歲谷以安其氣，食間谷以去其邪，歲宜以鹹以苦以辛，汗之清之散之，安其運氣，無使受邪，折其鬱氣，資其化源。以寒熱輕重少多其制，同熱者多天化，同清者多地化，用涼遠涼，用熱遠熱，用寒遠寒，用溫遠溫，食宜同法。有假者反之，此其道也。","bh":"四之气，寒雨降下，发生猝然昏仆、振颤战栗、谵语妄言、气短、咽干而欲饮水，以及心痛、痈肿、疮疡、疟疾寒热之类疾病，骨痿、便血。五之气，春令反而施行，草木于是生长繁荣，民众之气和平。终之气，阳气布散，气候反温，蛰虫出现，流水不结冰，民众于是安康平和，其病为温病。所以食用岁谷以安定其气，食用间谷以祛除其邪；这一年宜用咸味、苦味、辛味，汗之、清之、散之，安定其运气，不使受邪，折减其郁气，资助其生化之源。根据寒热的轻重来多少地制方：与热气相同的多用天化（寒化），与清气相同的多用地化（温化）。用凉远凉，用热远热，用寒远寒，用温远温，饮食同一法则。有假气的反其道而行，这就是它的法则。","notes":[],"pending":false},{"id":"sw71-9","tags":[],"yw":"反是者，亂天地之經，擾陰陽之紀也。帝曰∶善。少陽之政奈何？岐伯曰∶寅申之紀也。少陽太角厥陰壬寅（同天符）壬申（同天符）其運風鼓，其化鳴紊啓坼，其變振拉摧拔，其病掉眩支脅驚駭。太角（初正）少徵太宮少商太羽（終）少陽太徵厥陰戊寅天符戊申天符其運暑，其化暄囂鬱燠，其變炎烈沸騰，其病上熱鬱血溢血泄心痛。太徵少宮太商少羽（終）少角（初）少陽太宮厥陰甲寅甲申其運陰雨，其化柔潤重澤，其變震驚飄驟，其病體重腫痞飲。","bh":"违背这些，就会扰乱天地的常经、扰乱阴阳的纲纪。黄帝说：好。少阳司天的政令是怎样的？岐伯说：这是寅申年的纲纪。少阳司天，太角（木运太过）中运，厥阴在泉，壬寅（同天符）、壬申（同天符）：其运为风鼓，其化为鸣响紊乱、开启坼裂，其变为振动拉拔摧折，其病为振摇眩晕、胁肋支撑、惊骇。太角（初正）、少征、太宫、少商、太羽（终）。少阳司天，太征（火运太过）中运，厥阴在泉，戊寅天符、戊申天符：其运为暑，其化为暄暖喧嚣、郁蒸燠热，其变为炎烈沸腾，其病为上部热郁、血溢、血泄、心痛。太征、少宫、太商、少羽（终）、少角（初）。少阳司天，太宫（土运太过）中运，厥阴在泉，甲寅、甲申年：其运为阴雨，其化为柔润重泽，其变为震惊飘骤，其病为身体沉重、浮肿、痞塞、水饮。","notes":[],"pending":false},{"id":"sw71-10","tags":[],"yw":"太宮少商太羽（終）太角（初）少徵少陽太商厥陰庚寅庚申同正商其運涼，其化霧露清切，其變肅殺雕零，其病肩背胸中。太商少羽（終）少角（初）太徵少宮少陽太羽厥陰丙寅丙申其運寒肅，其化凝慘冽，其變冰雪霜雹，其病寒浮腫。太羽（終）太角（初）少徵太宮少商凡此少陽司天之政，氣化營運先天，天氣正，地氣擾，風乃暴舉，木偃沙飛，炎火乃流，陰行陽化，雨乃時應，火木同德，上應熒惑歲星。其谷丹蒼，其政嚴，其令擾。故風熱參布，雲物沸騰，太陰橫流，寒乃時至，涼雨並起。","bh":"太宫、少商、太羽（终）、太角（初）、少征。少阳司天，太商（金运太过）中运，厥阴在泉，庚寅、庚申年，同正商：其运为凉，其化为雾露清切，其变为肃杀凋零，其病在肩背、胸中。太商、少羽（终）、少角（初）、太征、少宫。少阳司天，太羽（水运太过）中运，厥阴在泉，丙寅、丙申年：其运为寒肃，其化为凝惨凛冽，其变为冰雪霜雹，其病为寒、浮肿。太羽（终）、太角（初）、少征、太宫、少商。凡此少阳司天的政令，气化运行先于天时；天气正，地气扰动，风气于是暴举，树木倒伏、沙土飞扬，炎火于是流行，阴气行而阳气施化，雨水应时而下，火木同德，上应荧惑星（火星）、岁星（木星）。其谷为丹、苍之色，其政严厉，其令扰动。所以风热参杂布散，云物沸腾，太阴（湿土之气）横流，寒气应时而至，凉雨同时兴起。","notes":[],"pending":false},{"id":"sw71-11","tags":[],"yw":"民病寒中，外發瘡瘍，內爲泄滿。故聖人遇之，和而不爭。往復之作，民病寒熱瘧泄，聾瞑嘔吐，上怫腫色變。初之氣，地氣遷，風勝乃搖，寒乃去，候乃大溫，草木早榮。寒來不殺，溫病乃起，其病氣怫於上，血溢目赤，咳逆頭痛，血崩脅滿，膚腠中瘡。二之氣，火反鬱，白埃四起，雲趨雨府，風不勝溼，雨乃零，民乃康。其病熱鬱於上，咳逆嘔吐，瘡發於中，胸嗌不利，頭痛身熱，昏憒膿瘡。三之氣，天政布，炎暑至，少陽臨上，雨乃涯。民病熱中，聾瞑血溢，膿瘡咳嘔，鼽衄渴嚏欠，喉痹目赤，善暴死。","bh":"民众易患寒中之病，外发疮疡，内为泄泻胀满。所以圣人遇到这种情况，和顺而不与之相争。往来发作的时候，民众易患寒热、疟疾、泄泻，耳聋、目眩、呕吐，上部郁怫浮肿、面色改变。初之气，地气迁移，风气胜则摇动，寒气于是离去，气候于是大温，草木提早繁荣；寒气来而不能杀伐，温病于是兴起，其病为气郁怫于上，血溢、目赤、咳逆、头痛、血崩、胁肋胀满，肌肤腠理生疮。二之气，火气反而郁伏，白色埃雾四起，云趋向雨府，风气不能胜湿，雨水于是降下，民众于是安康；其病为热郁于上，咳逆、呕吐，疮发于内，胸咽不利，头痛、身热，昏愦、生脓疮。三之气，天政布散，炎暑到来，少阳临于上，雨水于是止息；民众患热中之病，耳聋、目眩、血溢、脓疮、咳嗽、呕吐、鼻塞流涕、鼻出血、口渴、喷嚏、呵欠、喉痹、目赤，容易猝然死亡。","notes":[],"pending":false},{"id":"sw71-12","tags":[],"yw":"四之氣，涼乃至，炎暑間化，白露降，民氣和平，其病滿身重。五之氣，陽乃去，寒乃來，雨乃降，氣門乃閉，剛木早雕，民避寒邪，君子周密。終之氣，地氣正，風乃至，萬物反生，霧以行。其病關閉不禁，心痛，陽氣不藏而咳。抑其運氣，贊所不勝，必折其鬱氣，先取化源，暴過不生，苛疾不起。故歲宜鹹辛宜酸，滲之泄之，漬之發之，觀氣寒溫以調其過，同風熱者多寒化，異風熱者少寒化，用熱遠熱，用溫遠溫，用寒遠寒，用涼遠涼，食宜同法，此其道也。","bh":"四之气，凉气于是到来，炎暑间断施化，白露降下，民众之气和平，其病为胀满、身体沉重。五之气，阳气离去，寒气到来，雨水降下，气门（汗孔）于是闭藏，刚硬之木提早凋零，民众躲避寒邪，君子周密防护。终之气，地气当正，风气于是到来，万物反而生长，雾气流行；其病为关闭不禁，心痛，阳气不能闭藏而咳嗽。抑制其运气，赞助其所不胜，必须折减其郁气，先取用其生化之源，使暴过之气不生，重病不起。所以这一年宜用咸、宜用辛、宜用酸，渗之、泄之，渍之、发之，观察气候的寒温来调治其太过；与风热相同的多用寒化，与风热相异的少用寒化。用热远热，用温远温，用寒远寒，用凉远凉，饮食同一法则，这就是它的规律。","notes":[],"pending":false},{"id":"sw71-13","tags":[],"yw":"有假者反之，反是者病之階也。帝曰∶善。太陰之政奈何？岐伯曰∶丑未之紀也。太陰少角太陽清熱勝復同，同正宮。丁丑丁未其運風清熱。少角（初正）太徵少宮太商少羽（終）太陰少徵太陽寒雨勝復同。癸丑癸未其運熱寒雨。少徵太宮少商太羽（終）太角太陰少宮太陽風清勝復同，同正宮。己丑太一天符己未太一天符其運雨風清。少宮太商少羽（終）少角（初）太徵太陰少商太陽熱寒勝復同。乙丑乙未其運涼熱寒。少商太羽（終）太角（初）少徵太宮太陰少羽太陽雨風勝復同，同正宮。","bh":"有假气的反其道而行，违背这些就是疾病发生的阶梯。黄帝说：好。太阴司天的政令是怎样的？岐伯说：这是丑未年的纲纪。太阴司天，少角（木运不及）中运，太阳在泉，清热胜复相同，同正宫：丁丑、丁未年，其运为风、清、热。少角（初正）、太征、少宫、太商、少羽（终）。太阴司天，少征（火运不及）中运，太阳在泉，寒雨胜复相同：癸丑、癸未年，其运为热、寒、雨。少征、太宫、少商、太羽（终）、太角。太阴司天，少宫（土运不及）中运，太阳在泉，风清胜复相同，同正宫：己丑太一天符、己未太一天符，其运为雨、风、清。少宫、太商、少羽（终）、少角（初）、太征。太阴司天，少商（金运不及）中运，太阳在泉，热寒胜复相同：乙丑、乙未年，其运为凉、热、寒。少商、太羽（终）、太角（初）、少征、太宫。太阴司天，少羽（水运不及）中运，太阳在泉，雨风胜复相同，同正宫。","notes":[],"pending":false},{"id":"sw71-14","tags":[],"yw":"辛丑（同歲會）辛未（同歲會）其運寒雨風。少羽（終）少角（初）太徵少宮太商凡此太陰司天之政，氣化營運後天，陰專其政，陽氣退辟，大風時起，天氣下降，地氣上騰，原野昏，白埃四起，雲奔南極，寒雨數至，物成於差夏。民病寒溼，腹滿身憤腫，痞逆寒厥拘急。溼寒合德，黃黑埃昏，流行氣交，上應鎮星辰星。其政肅，其令寂，其谷玄。故陰凝於上，寒積於下，寒水勝火，則爲冰雹，陽光不治，殺氣乃行。故有餘宜高，不及宜下，有餘宜晚，不及宜早，土之利，氣之化也，民氣亦從之，間谷命其太也。","bh":"辛丑（同岁会）、辛未（同岁会）：其运为寒、雨、风。少羽（终）、少角（初）、太征、少宫、太商。凡此太阴司天的政令，气化运行后于天时；阴气专主其政，阳气退避，大风时常兴起，天气下降，地气上腾，原野昏暗，白色埃雾四起，云奔向南极，寒雨屡次到来，万物成熟于差夏。民众易患寒湿之病，腹部胀满、身体浮肿，痞塞气逆、寒厥、拘急。湿寒合德，黄黑之埃昏蒙，流行于气交，上应镇星（土星）、辰星（水星）。其政肃，其令寂，其谷色玄。所以阴气凝于上，寒气积于下，寒水胜火，则结为冰雹；阳光不能主治，杀气于是运行。所以有余的宜高，不及的宜下；有余的宜晚，不及的宜早。这是土地之利、气化的结果，民气也随从它，间谷是得间气之化而气太过的。","notes":[],"pending":false},{"id":"sw71-15","tags":[],"yw":"初之氣，地氣遷，寒乃去，春氣正，風乃來，生布萬物以榮，民氣條舒，風溼相薄，雨乃後。民病血溢，筋絡拘強，關節不利，身重筋痿。二之氣，大火正，物承化，民乃和，其病溫厲大行，遠近鹹若，溼蒸相薄，雨乃時降。三之氣，天政布，溼氣降，地氣騰，雨乃時降，寒乃隨之。感於寒溼，則民病身重腫，胸腹滿。四之氣，畏火臨，溽蒸化，地氣騰，天氣痞隔，寒風曉暮，蒸熱相薄，草木凝煙，溼化不流，則白露陰布，以成秋令。民病腠理熱，血暴溢瘧，心腹滿熱臚脹，甚則腫。","bh":"初之气，地气迁移，寒气离去，春气当正，风气到来，生气布散，万物因而繁荣，民众之气条达舒畅；风湿相迫，雨水延后；其病为血溢，筋络拘急强直，关节不利，身体沉重、筋痿。二之气，大火当正，万物承其生化，民众于是和平；其病为温疫大行，远近都一样；湿蒸相迫，雨水应时降下。三之气，天政布散，湿气下降，地气上腾，雨水应时降下，寒气随之而来；感受寒湿，则民众患身体沉重、浮肿、胸腹胀满。四之气，畏火（相火）来临，溽暑蒸化，地气上腾，天气痞塞隔绝，寒风出现在清晨与傍晚，蒸热相迫，草木上凝着烟霭，湿化不得流动，于是白露阴布，形成秋令；其病为腠理发热，血突然外溢、疟疾，心腹胀满发热、腹部膨胀，甚则浮肿。","notes":[],"pending":false},{"id":"sw71-16","tags":[],"yw":"五之氣，慘令已行，寒露下，霜乃早降，草木黃落，寒氣及體，君子周密，民病皮腠。終之氣，寒大舉，溼大化，霜乃積，陰乃凝，水堅冰，陽光不治。感於寒，則病患關節禁固，腰痛，寒溼推於氣交而爲疾也。必折其鬱氣，而取化源，益其歲氣，無使邪勝，食歲谷以全其真，食間谷以保其精。故歲宜以苦燥之溫之，甚者發之泄之。不發不泄，則溼氣外溢，肉潰皮拆而水血交流。必贊其陽火，令御甚寒，從氣異同，少多其判也，同寒者以熱化，同溼者以燥化，異者少之，同者多之，用涼遠涼，用寒遠寒，用溫遠溫，用熱遠熱，食宜同法。","bh":"五之气，惨令已经施行，寒露降下，霜提早降落，草木黄落，寒气侵及人体，君子周密防护，民众易患皮腠之病。终之气，寒气大举，湿气大化，霜于是积聚，阴气于是凝结，水结成坚冰，阳光不能主治；感受寒邪，则病人关节僵固、腰痛，这是寒湿之气推荡于气交而成为疾病。必须折减其郁气，取用其生化之源，增益其岁气，不使邪气偏胜；食用岁谷以保全真气，食用间谷以保养精气。所以这一年宜用苦味以燥之、以温之，严重的用发汗、用泻下。不发不泄，则湿气向外流溢，肌肉溃烂、皮肤拆裂而水血交流。必须赞助其阳火，使它抵御严寒；根据气的异同来分辨多少：与寒相同的用热化，与湿相同的用燥化，相异的少用，相同的多用。用凉远凉，用寒远寒，用温远温，用热远热，饮食同一法则。","notes":[],"pending":false},{"id":"sw71-17","tags":[],"yw":"假者反之，此其道也，反是者病也。帝曰∶善。少陰之政奈何？岐伯曰∶子午之紀也。少陰太角陽明壬子壬午其運風鼓，其化鳴紊啓拆，其變振拉摧拔，其病支滿。太角（初正）少徵太宮少商太羽（終）少陰太徵陽明戊子天符戊午太一天符其運炎暑，其化暄曜鬱燠，其變炎烈沸騰，其病上熱血溢。太徵少宮太商少羽（終）少角（初）少陰太宮陽明甲子甲午其運陰雨，其化柔潤時雨，其變震驚飄驟，其病中滿身重。太宮少商太羽（終）太角（初）少徵少陰太商陽明庚子（同天符）庚午（同天符）同正商其運涼勁，其化霧露蕭，其變肅殺雕零，其病下清。","bh":"有假气的反其道而行，这就是它的法则，违背这些就会生病。黄帝说：好。少阴司天的政令是怎样的？岐伯说：这是子午年的纲纪。少阴司天，太角（木运太过）中运，阳明在泉，壬子、壬午年：其运为风鼓，其化为鸣响紊乱、开启拆裂，其变为振动拉拔摧折，其病为支撑胀满。太角（初正）、少征、太宫、少商、太羽（终）。少阴司天，太征（火运太过）中运，阳明在泉，戊子天符、戊午太一天符：其运为炎暑，其化为暄暖光曜、郁蒸燠热，其变为炎烈沸腾，其病为上部热、血溢。太征、少宫、太商、少羽（终）、少角（初）。少阴司天，太宫（土运太过）中运，阳明在泉，甲子、甲午年：其运为阴雨，其化为柔润时雨，其变为震惊飘骤，其病为中满、身体沉重。太宫、少商、太羽（终）、太角（初）、少征。少阴司天，太商（金运太过）中运，阳明在泉，庚子（同天符）、庚午（同天符），同正商：其运为凉劲，其化为雾露萧瑟，其变为肃杀凋零，其病为下部清冷、下利清谷。","notes":[],"pending":false},{"id":"sw71-18","tags":[],"yw":"太商少羽（終）少角（初）太徵少宮少陰太羽陽明丙子歲會丙午其運寒，其化凝慘冽，其變冰雪霜雹，其病寒下。太羽（終）太角（初）少徵太宮少商凡此少陰司天之政，氣化營運先天，地氣肅，天氣明，寒交暑，熱加燥，雲馳雨府，溼化乃行，時雨乃降，金火合德，上應熒惑太白。其政明，其令切，其谷丹白。水火寒熱持於氣交而爲病始也，熱病生於上，清病生於下，寒熱凌犯而爭於中，民病咳喘，血溢血泄鼽嚏，目赤瘍，寒厥入胃，心痛腰痛，腹大嗌干腫上。","bh":"太商、少羽（终）、少角（初）、太征、少宫。少阴司天，太羽（水运太过）中运，阳明在泉，丙子岁会、丙午年：其运为寒，其化为凝惨凛冽，其变为冰雪霜雹，其病为寒下（下部寒冷、寒泄）。太羽（终）、太角（初）、少征、太宫、少商。凡此少阴司天的政令，气化运行先于天时；地气肃杀，天气光明，寒气与暑气相交，热气加于燥气；云驰向雨府，湿化于是运行，时雨于是降下；金火合德，上应荧惑星（火星）、太白星（金星）。其政明曜，其令急切，其谷为丹、白之色。水火寒热持守于气交，而成为疾病的开端：热病生于上，清病生于下，寒热互相凌犯而争于中焦；民众易患咳喘、血溢、血泄、鼻塞流涕、喷嚏、目赤、疮疡，寒厥之气入胃，心痛、腰痛，腹部胀大、咽干、上部浮肿。","notes":[],"pending":false},{"id":"sw71-19","tags":[],"yw":"初之氣，地氣遷，燥將去，寒乃始，蟄復藏，水乃冰，霜復降，風乃至，陽氣鬱，民反周密，關節禁固，腰痛，炎暑將起，中外瘡瘍。二之氣，陽氣布，風乃行，春氣以正，萬物應榮，寒氣時至，民乃和。其病淋，目瞑目赤，氣鬱於上而熱。三之氣，天政布，大火行，庶類番鮮，寒氣時至。民病氣厥心痛，寒熱更作，咳喘目赤。四之氣，溽暑至，大雨時行，寒熱互至。民病寒熱，嗌干黃癉，鼽衄飲發。五之氣，畏火臨，暑反至，陽乃化，萬物乃生乃長榮，民乃康，其病溫。","bh":"初之气，地气迁移，燥气将要离去，寒气于是开始，蛰虫重新伏藏，水于是结冰，霜重新降下，风气到来，阳气郁伏，民众反而周密闭藏；发生关节僵固、腰痛，炎暑将要兴起时，内外发生疮疡。二之气，阳气布散，风气运行，春气因而当正，万物应之而繁荣，寒气应时而至，民众于是和平；其病为淋证，目眩、目赤，气郁于上而发热。三之气，天政布散，大火运行，众物繁茂鲜明，寒气应时而至；民众患气厥、心痛，寒热交替发作，咳喘、目赤。四之气，溽暑到来，大雨应时而行，寒热交互而至；民众患寒热、咽干、黄疸、鼻塞流涕、鼻出血、水饮发作。五之气，畏火（相火）来临，暑气反而到来，阳气于是施化，万物于是生长繁荣，民众于是安康，其病为温病。","notes":[],"pending":false},{"id":"sw71-20","tags":[],"yw":"終之氣，燥令行，餘火內格，腫於上，咳喘，甚則血溢。寒氣數舉，則霧翳，病生皮腠，內舍於脅，下連少腹而作寒中，地將易也。必抑其運氣，資其歲勝，折其鬱發，先取化源，無使暴過而生其病也。食歲谷以全真氣，食間谷以辟虛邪。歲宜鹹以之，而調其上，甚則以苦發之；以酸收之，而安其下，甚則以苦泄之。適氣同異而多少之，同天氣者以寒清化，同地氣者以溫熱化，用熱遠熱，用涼遠涼，用溫遠溫，用寒遠寒，食宜同法。有假則反，此其道也，反是者病作矣。","bh":"终之气，燥令施行，余热格拒于内，上部浮肿，咳喘，甚则血溢。寒气屡次发作，于是出现雾气翳障；病生于皮腠，内舍于胁部，向下连及少腹而成为寒中之病，这时地气将要改易了。必须抑制其运气，资助其岁气所胜，折减其郁气的发作，先取用其生化之源，不使暴过而发生疾病；食用岁谷以保全真气，食用间谷以躲避虚邪。这一年宜用咸以软之，而调治其上部；严重的用苦味发散它；用酸味收敛，而安定其下部；严重的用苦味泄下它。根据气的同异而决定多少：与天气相同的用寒清之化，与地气相同的用温热之化。用热远热，用凉远凉，用温远温，用寒远寒，饮食同一法则。有假气的就反其道而行，这就是它的法则，违背这些疾病就要发作。","notes":[],"pending":false},{"id":"sw71-21","tags":[],"yw":"帝曰∶善。厥陰之政奈何？岐伯曰∶巳亥之紀也。厥陰少角少陽清熱勝復同，同正角。丁巳天符丁亥天符其運風清熱。少角（初正）太徵少宮太商少羽（終）厥明少徵少陽寒雨勝復同。癸巳（同歲會）癸亥（同歲會）其運熱寒雨。少徵太宮少商太羽（終）太角（初）厥陰少宮少陽風清勝復同，同正角。己巳己亥其運雨風清。少宮太商少羽（終）少角（初）太徵厥陰少商少陽熱寒勝復同，同正角。乙巳乙亥其運涼熱寒。少商太羽（終）太角（初）少徵太宮厥陰少羽少陽雨風勝復同。","bh":"黄帝说：好。厥阴司天的政令是怎样的？岐伯说：这是巳亥年的纲纪。厥阴司天，少角（木运不及）中运，少阳在泉，清热胜复相同，同正角：丁巳天符、丁亥天符，其运为风、清、热。少角（初正）、太征、少宫、太商、少羽（终）。厥阴司天，少征（火运不及）中运，少阳在泉，寒雨胜复相同：癸巳（同岁会）、癸亥（同岁会），其运为热、寒、雨。少征、太宫、少商、太羽（终）、太角（初）。厥阴司天，少宫（土运不及）中运，少阳在泉，风清胜复相同，同正角：己巳、己亥年，其运为雨、风、清。少宫、太商、少羽（终）、少角（初）、太征。厥阴司天，少商（金运不及）中运，少阳在泉，热寒胜复相同，同正角：乙巳、乙亥年，其运为凉、热、寒。少商、太羽（终）、太角（初）、少征、太宫。厥阴司天，少羽（水运不及）中运，少阳在泉，雨风胜复相同。","notes":[],"pending":false},{"id":"sw71-22","tags":[],"yw":"辛巳辛亥其運寒雨風。少羽（終）少角（初）太徵少宮太商凡此厥陰司天之政，氣化營運後天，諸同正歲，氣化營運同天，天氣擾，地氣正，風生高遠，炎熱從之，雲趨雨府，溼化乃行，風火同德，上應歲星熒惑。其政撓，其令速，其谷蒼丹，間谷言太者，其耗文角品羽。風燥火熱，勝復更作，蟄蟲來見，流水不冰，熱病行於下，風病行於上，風燥勝復形於中。初之氣，寒始肅，殺氣方至，民病寒於右之下。二之氣，寒不去，華雪水冰，殺氣施化，霜乃降，名草上焦，寒雨數至，陽復化，民病熱於中。","bh":"辛巳、辛亥年：其运为寒、雨、风。少羽（终）、少角（初）、太征、少宫、太商。凡此厥阴司天的政令，气化运行后于天时；凡属同正岁的，气化运行与天时相同。天气扰动，地气当正，风生于高远之处，炎热随之而来，云趋向雨府，湿化于是运行；风火同德，上应岁星（木星）、荧惑星（火星）。其政挠动，其令迅疾，其谷为苍、丹之色；间谷是得间气之化而气太过的，其耗损有文彩的角虫与羽虫之类。风燥火热，胜复交替发作，蛰虫出现，流水不结冰；热病流行于下，风病流行于上，风燥胜复表现于中。初之气，寒气开始肃杀，杀气刚到，民众在右下部患寒病。二之气，寒气不去，雪花飘落、水结成冰，杀气施布生化，霜于是降下，名贵的草木上部枯焦，寒雨屡次到来，阳气恢复生化，民众患内热之病。","notes":[],"pending":false},{"id":"sw71-23","tags":[],"yw":"三之氣，天政布，風乃時舉，民病泣出耳鳴掉眩。四之氣，溽暑溼熱相薄，爭於左之上，民病黃癉而爲腫。五之氣，燥溼更勝，沉陰乃布，寒氣及體，風雨乃行。終之氣，畏火司令，陽乃大化，蟄蟲出見，流水不冰，地氣大發，草乃生，人乃舒，其病溫厲。必折其鬱氣，資其化源，贊其運氣，無使邪勝。歲宜以辛調上，以鹹調下，畏火之氣，無妄犯之。用溫遠溫，用熱遠熱，用涼遠涼，用寒遠寒，食宜同法。有假反常，此之道也，反是者病。帝曰∶善。","bh":"三之气，天政布散，风气应时兴起，民众患流泪、耳鸣、振摇眩晕。四之气，溽暑湿热相迫，争于左上部，民众患黄疸而成为浮肿。五之气，燥湿交替偏胜，沉阴之气于是布散，寒气侵及人体，风雨于是流行。终之气，畏火（相火）司令，阳气于是大施生化，蛰虫外出出现，流水不结冰，地气大发，草木于是生长，人们于是舒畅，其病为温疫。必须折减其郁气，资助其生化之源，赞助其运气，不使邪气偏胜。这一年宜用辛味调治上部，用咸味调治下部，畏火之气不可妄犯。用温远温，用热远热，用凉远凉，用寒远寒，饮食同一法则。有假气的反其常法，这就是它的法则，违背这些就会生病。黄帝说：好。","notes":[],"pending":false},{"id":"sw71-24","tags":[],"yw":"夫子之言可謂悉矣，然何以明其應乎？岐伯曰∶昭乎哉問也！夫六氣者，行有次，止有位，故常以正月朔日平旦視之，睹其位而知其所在矣。運有餘，其至先，運不及，其至後，此天之道，氣之常也。運非有餘非不足，是謂正歲，其至當其時也。帝曰∶勝復之氣，其常在也，災眚時至，候也奈何？岐伯曰∶非氣化者，是謂災也。帝曰∶天地之數，終始奈何？岐伯曰∶悉乎哉問也！是明道也。數之始，起於上而終於下，歲半之前，天氣主之，歲半之後，地氣主之，上下交互，氣交主之，歲紀畢矣。","bh":"先生所讲的可以说是很详尽了，然而怎样去明验它的应象呢？岐伯说：您问得多么明白啊！那六气的运行有次序，休止有定位，所以常在正月初一清晨来观察它，看它所在的方位就知道它所主的气了。运气有余的，其气到来在先；运气不及的，其气到来在后，这是天的规律、气的常道。运气既非有余也非不足的，这叫作正岁，其气到来正当其时。黄帝说：胜气与复气是常在的，而灾害时常到来，怎样诊候它呢？岐伯说：不是正常气化的，就叫作灾。黄帝说：天地的数理，其始终怎样？岐伯说：您问得真详尽啊！这是阐明大道的问题。数的开始，起于上而终于下；岁半之前，由天气主之；岁半之后，由地气主之；上下交互之处，由气交主之，一年的纲纪就完备了。","notes":[],"pending":false},{"id":"sw71-25","tags":[],"yw":"故曰∶位明氣月可知乎，所謂氣也。帝曰∶餘司其事，則而行之，不合其數何也？岐伯曰∶氣用有多少，化治有盛衰，衰盛多少，同其化也。帝曰∶願聞同化何如？岐伯曰∶風溫春化同，熱曛昏火夏化同，勝與復同，燥清煙露秋化同，雲雨昏暝埃長夏化同，寒氣霜雪冰冬化同，此天地五運六氣之化，更用盛衰之常也。帝曰∶五營運同天化者，命曰天符，餘知之矣。願聞同地化者何謂也？岐伯曰∶太過而同天化者三，不及而同天化者亦三，太過而同地化者三，不及而同地化者亦三，此凡二十四歲也。","bh":"所以说：明确了位置和气月就可以知道，这就是所谓气。黄帝说：我主持这件事，照着施行，却与气数不合，为什么呢？岐伯说：气的作用有多有少，生化的主治有盛有衰，盛衰多少同属于其生化。黄帝说：希望听听同化是怎样的。岐伯说：风温与春之化同，热、曛昏、火与夏之化同，胜气与复气同，燥清烟露与秋之化同，云雨昏暝埃与长夏之化同，寒气霜雪冰与冬之化同，这是天地五运六气的生化，交替为用、盛衰的常道。黄帝说：五运的运行与天之化相同的，叫作天符，我已经知道了。希望听听与地之化相同的是什么？岐伯说：太过而同天化的有三，不及而同天化的也有三；太过而同地化的有三，不及而同地化的也有三，这样共二十四年。","notes":[],"pending":false},{"id":"sw71-26","tags":[],"yw":"帝曰∶願聞其所謂也。岐伯曰∶甲辰甲戌太宮下加太陰，壬寅壬申太角下加厥陰，庚子庚午太商下加陽明，如是者三。癸巳癸亥少徵下加少陽，辛丑辛未少羽下加太陽，癸卯癸酉少徵下加少陰，如是者三。戊子戊午太徵上臨少陰，戊寅戊申太徵上臨少陽，丙辰丙戌太羽上臨太陽，如是者三。丁巳丁亥少角上臨厥陰，乙卯乙酉少商上臨陽明，己丑己未少宮上臨太陰，如是者三。除此二十四歲，則不加不臨也。帝曰∶加者何謂？岐伯曰∶太過而加同天符，不及而加同歲會也。","bh":"黄帝说：希望听听它的具体说法。岐伯说：甲辰、甲戌年，太宫（土运太过）下加太阴；壬寅、壬申年，太角（木运太过）下加厥阴；庚子、庚午年，太商（金运太过）下加阳明，这是三。癸巳、癸亥年，少征（火运不及）下加少阳；辛丑、辛未年，少羽（水运不及）下加太阳；癸卯、癸酉年，少征（火运不及）下加少阴，这是三。戊子、戊午年，太征（火运太过）上临少阴；戊寅、戊申年，太征上临少阳；丙辰、丙戌年，太羽（水运太过）上临太阳，这是三。丁巳、丁亥年，少角（木运不及）上临厥阴；乙卯、乙酉年，少商（金运不及）上临阳明；己丑、己未年，少宫（土运不及）上临太阴，这是三。除去这二十四年，就不再有加、有临了。黄帝说：加是指什么？岐伯说：太过而加的叫作同天符，不及而加的叫作同岁会。","notes":[],"pending":false},{"id":"sw71-27","tags":[],"yw":"帝曰∶臨者何謂？岐伯曰∶太過不及，皆曰天符，而變行有多少，病形有微甚，生死有早晏耳。帝曰∶夫子言用寒遠寒，用熱遠熱，餘未知其然也，願聞何謂遠？岐伯曰∶熱無犯熱，寒無犯寒，從者和，逆者病，不可不敬畏而遠之，所謂時興六位也。帝曰∶溫涼何如？岐伯曰∶司氣以熱，用熱無犯，司氣以寒，用寒無犯，司氣以涼，用涼天犯，司氣以溫，用溫無犯，間氣同其主無犯，異其主則小犯之，是謂四畏，必謹察之。帝曰∶善。其犯者何如？岐伯曰∶天氣反時，則可根據時，及勝其主則可犯，以平爲期，而不可過，是謂邪氣反勝者。","bh":"黄帝说：临是指什么？岐伯说：太过与不及都叫作天符，只是变化运行有多少，病形有微有甚，生死有早有晚罢了。黄帝说：先生说用寒远寒、用热远热，我还不明白它的道理，希望听听什么叫远。岐伯说：热时不要犯热，寒时不要犯寒；顺从的就调和，违逆的就生病，不可不敬畏而远离它，这就是所谓时令与六步的关系。黄帝说：温凉怎样？岐伯说：司气为热的，用热药不要犯；司气为寒的，用寒药不要犯；司气为凉的，用凉药不要犯；司气为温的，用温药不要犯。间气与主气相同的不要犯，与主气相异的可以稍稍犯之，这就叫作四畏，必须谨慎审察。黄帝说：好。如果犯了怎样？岐伯说：天气与时令相反的，就可以依从时令；等到客气胜过主气时就可以犯，以平复为期，不可太过，这就是所谓邪气反胜的情况。","notes":[],"pending":false},{"id":"sw71-28","tags":[],"yw":"故曰∶無失天信，無逆氣宜，無翼其勝，無贊其復，是謂至治。帝曰∶善。五運氣行主歲之紀，其有常數乎？岐伯曰∶臣請次之。甲子甲午歲上少陰火中太宮土運下陽明金熱化二，雨化五，燥化四，所謂正化日也。其化上鹹寒，中苦熱，下酸熱，所謂藥食宜也。乙丑乙未歲上太陰土中少商金運下太陽水熱化寒化勝復同，所謂邪氣化日也。災七宮。溼化五，清化四，寒化六，所謂正化日也。其化上苦熱，中酸和，下甘熱，所謂藥食宜也。丙寅丙申歲上少陽相火中太羽水運下厥陰木火化二，寒化六，風化三，所謂正化日也。","bh":"所以说：不要失去天时的信验，不要违逆气之所宜，不要助长其胜气，不要赞助其复气，这就叫作至治。黄帝说：好。五运气行主岁的纲纪，有固定的数吗？岐伯说：臣请按次陈述。甲子、甲午岁：上为少阴火（司天），中为太宫土运，下为阳明金（在泉）；热化二，雨化五，燥化四，这就是所谓正化日。其化上用咸寒，中用苦热，下用酸热，这就是所谓药物与食物的所宜。乙丑、乙未岁：上为太阴土，中为少商金运，下为太阳水；热化与寒化的胜复相同，这就是所谓邪气化日。灾害在七宫。湿化五，清化四，寒化六，这就是所谓正化日。其化上用苦热，中用酸和，下用甘热，这就是所谓药物与食物的所宜。丙寅、丙申岁：上为少阳相火，中为太羽水运，下为厥阴木；火化二，寒化六，风化三，这就是所谓正化日。","notes":[],"pending":false},{"id":"sw71-29","tags":[],"yw":"其化上鹹寒，中鹹溫，下辛溫，所謂藥食宜也。丁卯（歲會）丁酉歲上陽明金中少角木運下少陰火清化熱化勝復同，所謂邪氣化日也。災三宮。燥化九，風化三，熱化七，所謂正化日也。其化上苦小溫，中辛和，下鹹寒，所謂藥食宜也。戊辰戊戌歲上太陽水中太徵火運下太陰土寒化六，熱化七，溼化五，所謂正化日也。其化上苦溫，中甘和，下甘溫，所謂藥食宜也。己巳己亥歲上厥陰木中少宮土運下少陽相火風化清化勝復同，所謂邪氣化日也。災五宮。","bh":"其化上用咸寒，中用咸温，下用辛温，这就是所谓药物与食物的所宜。丁卯（岁会）、丁酉岁：上为阳明金，中为少角木运，下为少阴火；清化与热化的胜复相同，这就是所谓邪气化日。灾害在三宫。燥化九，风化三，热化七，这就是所谓正化日。其化上用苦小温，中用辛和，下用咸寒，这就是所谓药物与食物的所宜。戊辰、戊戌岁：上为太阳水，中为太征火运，下为太阴土；寒化六，热化七，湿化五，这就是所谓正化日。其化上用苦温，中用甘和，下用甘温，这就是所谓药物与食物的所宜。己巳、己亥岁：上为厥阴木，中为少宫土运，下为少阳相火；风化与清化的胜复相同，这就是所谓邪气化日。灾害在五宫。","notes":[],"pending":false},{"id":"sw71-30","tags":[],"yw":"風化三，溼化五，火化七，所謂正化日也。其化上辛涼，中甘和，下鹹寒，所謂藥食宜也。庚午（同天符）庚子歲（同天符）上少陰火中太商金運下陽明金熱化七，清化九，燥化九，所謂正化日也。其化上鹹寒，中辛溫，下酸溫，所謂藥食宜也。辛未（同歲會）辛丑歲（同歲會）上太陰土中少羽水運下太陽水雨化風化勝復同，所謂邪氣化日也。災一宮。雨化五，寒化一，所謂正化日也。其化上苦熱，中苦和，下苦熱，所謂藥食宜也。壬申（同天符）壬寅歲（同天符）上少陽相火中太角木運下厥陰木火化二，風化八，所謂正化日也。","bh":"风化三，湿化五，火化七，这就是所谓正化日。其化上用辛凉，中用甘和，下用咸寒，这就是所谓药物与食物的所宜。庚午（同天符）、庚子岁（同天符）：上为少阴火，中为太商金运，下为阳明金；热化七，清化九，燥化九，这就是所谓正化日。其化上用咸寒，中用辛温，下用酸温，这就是所谓药物与食物的所宜。辛未（同岁会）、辛丑岁（同岁会）：上为太阴土，中为少羽水运，下为太阳水；雨化与风化的胜复相同，这就是所谓邪气化日。灾害在一宫。雨化五，寒化一，这就是所谓正化日。其化上用苦热，中用苦和，下用苦热，这就是所谓药物与食物的所宜。壬申（同天符）、壬寅岁（同天符）：上为少阳相火，中为太角木运，下为厥阴木；火化二，风化八，这就是所谓正化日。","notes":[],"pending":false},{"id":"sw71-31","tags":[],"yw":"其化上鹹寒，中酸和，下辛涼，所謂藥食宜也。癸酉（同歲會）癸卯歲（同歲會）上陽明金中少徵火運下少陰火寒化雨化勝復同，所謂邪氣化日也。災九宮。燥化九，熱化二，所謂正化日也。其化上苦小溫，中鹹溫，下鹹寒，所謂藥食宜也。甲戌（歲會同天符）甲辰歲（歲會同天符）上太陽水中太宮土運下太陰土寒化六，溼化五，正化日也。其化上苦熱，中苦溫，下苦溫，藥食宜也。乙亥乙巳歲上厥陰木，中少商金運，下少陽相火，熱化寒化勝復同，邪氣化日也。","bh":"其化上用咸寒，中用酸和，下用辛凉，这就是所谓药物与食物的所宜。癸酉（同岁会）、癸卯岁（同岁会）：上为阳明金，中为少征火运，下为少阴火；寒化与雨化的胜复相同，这就是所谓邪气化日。灾害在九宫。燥化九，热化二，这就是所谓正化日。其化上用苦小温，中用咸温，下用咸寒，这就是所谓药物与食物的所宜。甲戌（岁会同天符）、甲辰岁（岁会同天符）：上为太阳水，中为太宫土运，下为太阴土；寒化六，湿化五，这是正化日。其化上用苦热，中用苦温，下用苦温，这是药物与食物的所宜。乙亥、乙巳岁：上为厥阴木，中为少商金运，下为少阳相火；热化与寒化的胜复相同，这是邪气化日。","notes":[],"pending":false},{"id":"sw71-32","tags":[],"yw":"災七宮。風化八，清化四，火化二，正化度也。其化上辛涼，中酸和，下鹹寒，藥食宜也。丙子（歲會）丙午歲上少陰火中太羽水運下陽明金熱化二，寒化六，清化四，正化度也。其化上鹹寒，中鹹熱，下酸溫，藥食宜也。丁丑丁未歲上太陰土中少角木運下太陽水清化熱化勝復同，邪氣化度也。災三宮。雨化五，風化三，寒化一，正化度也。其化上苦溫，中辛溫，下甘熱，藥食宜也。戊寅戊申歲（天符）上少陽相火中太徵火運下厥陰木火化七，風化三，正化度也。","bh":"灾害在七宫。风化八，清化四，火化二，这是正化度。其化上用辛凉，中用酸和，下用咸寒，这是药物与食物的所宜。丙子（岁会）、丙午岁：上为少阴火，中为太羽水运，下为阳明金；热化二，寒化六，清化四，这是正化度。其化上用咸寒，中用咸热，下用酸温，这是药物与食物的所宜。丁丑、丁未岁：上为太阴土，中为少角木运，下为太阳水；清化与热化的胜复相同，这是邪气化度。灾害在三宫。雨化五，风化三，寒化一，这是正化度。其化上用苦温，中用辛温，下用甘热，这是药物与食物的所宜。戊寅、戊申岁（天符）：上为少阳相火，中为太征火运，下为厥阴木；火化七，风化三，这是正化度。","notes":[],"pending":false},{"id":"sw71-33","tags":[],"yw":"其化上鹹寒，中甘和，下辛涼，藥食宜也。己卯己酉歲上陽明金中少宮土運下少陰火風化清化勝復同，邪氣化度也。災五宮。清化九，雨化五，熱化七，正化度也。其化上苦小溫，中甘和，下鹹寒，藥食宜也。庚辰庚戌歲上太陽水中太商金運下太陰土寒化一，清化九，雨化五，正化度也。其化上苦熱，中辛溫，下甘熱，藥食宜也。辛巳辛亥歲上厥陰木中少羽水運下少陽相火雨化風化勝復同，邪氣化度也。災一宮。風化三，寒化一，火化七，正化度也。","bh":"其化上用咸寒，中用甘和，下用辛凉，这是药物与食物的所宜。己卯、己酉岁：上为阳明金，中为少宫土运，下为少阴火；风化与清化的胜复相同，这是邪气化度。灾害在五宫。清化九，雨化五，热化七，这是正化度。其化上用苦小温，中用甘和，下用咸寒，这是药物与食物的所宜。庚辰、庚戌岁：上为太阳水，中为太商金运，下为太阴土；寒化一，清化九，雨化五，这是正化度。其化上用苦热，中用辛温，下用甘热，这是药物与食物的所宜。辛巳、辛亥岁：上为厥阴木，中为少羽水运，下为少阳相火；雨化与风化的胜复相同，这是邪气化度。灾害在一宫。风化三，寒化一，火化七，这是正化度。","notes":[],"pending":false},{"id":"sw71-34","tags":[],"yw":"其化上辛涼，中苦和，下鹹寒，藥食宜也。壬午壬子歲上少陰火中太角木運下陽明金熱化二，風化八，清化四，正化度也。其化上鹹寒，中酸涼，下酸溫，藥食宜也。癸未癸丑歲上太陰土中少徵火運下太陽水寒化雨化勝復同，邪氣化度也。災九宮。雨化五，火化二，寒化一，正化度也。其化上苦溫，中鹹溫，下甘熱，藥食宜也。甲申甲寅歲上少陽相火中太宮土運下厥陰木火化二，雨化五，風化八，正化度也。其化上鹹寒，中鹹和，下辛涼，藥食宜也。","bh":"其化上用辛凉，中用苦和，下用咸寒，这是药物与食物的所宜。壬午、壬子岁：上为少阴火，中为太角木运，下为阳明金；热化二，风化八，清化四，这是正化度。其化上用咸寒，中用酸凉，下用酸温，这是药物与食物的所宜。癸未、癸丑岁：上为太阴土，中为少征火运，下为太阳水；寒化与雨化的胜复相同，这是邪气化度。灾害在九宫。雨化五，火化二，寒化一，这是正化度。其化上用苦温，中用咸温，下用甘热，这是药物与食物的所宜。甲申、甲寅岁：上为少阳相火，中为太宫土运，下为厥阴木；火化二，雨化五，风化八，这是正化度。其化上用咸寒，中用咸和，下用辛凉，这是药物与食物的所宜。","notes":[],"pending":false},{"id":"sw71-35","tags":[],"yw":"乙酉（太一天符）乙卯歲（天符）上陽明金中少商金運下少陰火熱化寒化勝復同，邪氣化度也。災七宮。燥化四，清化四，熱化二，正化度也。其化上苦小溫，中苦和，下鹹寒，藥食宜也。丙戌（天符）丙辰歲（天符）上太陽水中太羽水運下太陰土寒化六，雨化五，正化度也。其化上苦熱，中鹹溫，下甘熱，藥食宜也。丁亥（天符）丁巳歲（天符）上厥陰木中少角木運下少陽相火清化熱化勝復同，邪氣化度也。災三宮。風化三，火化七，正化度也。其化上辛涼，中辛和，下鹹寒，藥食宜也。","bh":"乙酉（太一天符）、乙卯岁（天符）：上为阳明金，中为少商金运，下为少阴火；热化与寒化的胜复相同，这是邪气化度。灾害在七宫。燥化四，清化四，热化二，这是正化度。其化上用苦小温，中用苦和，下用咸寒，这是药物与食物的所宜。丙戌（天符）、丙辰岁（天符）：上为太阳水，中为太羽水运，下为太阴土；寒化六，雨化五，这是正化度。其化上用苦热，中用咸温，下用甘热，这是药物与食物的所宜。丁亥（天符）、丁巳岁（天符）：上为厥阴木，中为少角木运，下为少阳相火；清化与热化的胜复相同，这是邪气化度。灾害在三宫。风化三，火化七，这是正化度。其化上用辛凉，中用辛和，下用咸寒，这是药物与食物的所宜。","notes":[],"pending":false},{"id":"sw71-36","tags":[],"yw":"戊子（天符）戊午歲（太一天符）上少陰火中太徵火運下陽明金熱化七，清化九，正化度也。其化上鹹寒，中甘寒，下酸溫，藥食宜也。己丑（太一天符）己未歲（太一天符）上太陰土中少宮土運下太陽水風化清化勝復同，邪氣化度也。災五宮。雨化五，寒化一，正化度也。其化上苦熱，中甘和，下甘熱，藥食宜也。庚寅庚申歲上少陽相火中太商金運下厥陰木火化七，清化九，風化三，正化度也。其化上鹹寒，中辛溫，下辛涼，藥食宜也。辛卯辛酉歲上陽明金中少羽水運下少陰火雨化風化勝復同，邪氣化度也。","bh":"戊子（天符）、戊午岁（太一天符）：上为少阴火，中为太征火运，下为阳明金；热化七，清化九，这是正化度。其化上用咸寒，中用甘寒，下用酸温，这是药物与食物的所宜。己丑（太一天符）、己未岁（太一天符）：上为太阴土，中为少宫土运，下为太阳水；风化与清化的胜复相同，这是邪气化度。灾害在五宫。雨化五，寒化一，这是正化度。其化上用苦热，中用甘和，下用甘热，这是药物与食物的所宜。庚寅、庚申岁：上为少阳相火，中为太商金运，下为厥阴木；火化七，清化九，风化三，这是正化度。其化上用咸寒，中用辛温，下用辛凉，这是药物与食物的所宜。辛卯、辛酉岁：上为阳明金，中为少羽水运，下为少阴火；雨化与风化的胜复相同，这是邪气化度。","notes":[],"pending":false},{"id":"sw71-37","tags":[],"yw":"災一宮。清化九，寒化一，熱化七，正化度也。其化上苦小溫，中苦和，下鹹寒，藥食宜也。壬辰壬戌歲上太陽水中太角木運下太陰土寒化六，風化八，雨化五，正化度也。其化上苦溫，中酸和，下甘溫，藥食宜也。癸巳（
