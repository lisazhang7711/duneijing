同歲會）癸亥（同歲會）上厥陰木中少徵火運下少陽相火寒化雨化勝復同，邪氣化度也。災九宮。風化八，火化二，正化度也。其化上辛涼，中鹹和，下鹹寒，藥食宜也。凡此定期之紀，勝復正化，皆有常數，不可不察。故知其要者，一言而終，不知其要，流散無窮，此之謂也。","bh":"灾害在一宫。清化九，寒化一，热化七，这是正化度。其化上用苦小温，中用苦和，下用咸寒，这是药物与食物的所宜。壬辰、壬戌岁：上为太阳水，中为太角木运，下为太阴土；寒化六，风化八，雨化五，这是正化度。其化上用苦温，中用酸和，下用甘温，这是药物与食物的所宜。癸巳（同岁会）、癸亥（同岁会）：上为厥阴木，中为少征火运，下为少阳相火；寒化与雨化的胜复相同，这是邪气化度。灾害在九宫。风化八，火化二，这是正化度。其化上用辛凉，中用咸和，下用咸寒，这是药物与食物的所宜。凡此定期的纲纪，胜复与正化都有固定的常数，不可不审察。所以知道要领的，一句话就说完；不知道要领的，就会流散无穷，说的就是这个。","notes":[],"pending":false},{"id":"sw71-38","tags":[],"yw":"帝曰∶善。五運之氣，亦復歲乎？岐伯曰∶鬱極乃發，待時而作也。帝曰∶請問其所謂也？岐伯曰∶五常之氣，太過不及，其發異也。帝曰∶願卒聞之。岐伯曰∶太過者暴，不及者徐，暴者爲病甚，徐者爲病持。帝曰∶太過不及，其數何如？岐伯曰∶太過者其數成，不及者其數生，土常以生也。帝曰∶其發也何如？岐伯曰∶土鬱之發，巖谷震驚，雷殷氣交，埃昏黃黑，化爲白氣，飄驟高深，擊石飛空，洪水乃從，川流漫衍，田牧土駒。化氣乃敷，善爲時雨，始生始長，始化始成。","bh":"黄帝说：好。五运之气，也有报复的年份吗？岐伯说：郁积到极点就会发作，等待时机而发作。黄帝说：请问它的具体情况是怎样的？岐伯说：五常之气，太过与不及，其发作有所不同。黄帝说：希望详尽地听听。岐伯说：太过的发作急暴，不及的发作徐缓；急暴的发病严重，徐缓的病势缠绵持久。黄帝说：太过与不及，其数如何？岐伯说：太过者其数为成数，不及者其数为生数，土常以生数为准。黄帝说：它的发作是怎样的？岐伯说：土郁发作时，岩谷震动惊骇，雷声殷殷于气交之中，尘埃昏蒙黄黑，化为白气，飘风骤雨起于高深之处，击石飞空，洪水于是随至，河流漫衍，田野放牧之处成为土块。化气于是敷布，善于成为时雨，万物开始生长、开始化育、开始成就。","notes":[],"pending":false},{"id":"sw71-39","tags":[],"yw":"故民病心腹脹，腸鳴而爲數後，甚則心痛脅，嘔吐霍亂，飲發注下，腫身重。雲奔雨府，霞擁朝陽，山澤埃昏，其乃發也，以其四氣。雲橫天山，浮遊生滅，怫之先兆。金鬱之發，天潔地明，風清氣切，大涼乃舉，草樹浮煙，燥氣以行，霧數起，殺氣來至，草木蒼干，金乃有聲。故民病咳逆，心脅滿引少腹，善暴痛，不可反側，嗌干面塵色惡。山澤焦枯，土凝霜滷，怫乃發也，其氣五。夜零白露，林莽聲悽，怫之兆也。水鬱之發，陽氣乃辟，陰氣暴舉，大寒乃至，川澤嚴凝，寒結爲霜雪，甚則黃黑昏翳，流行氣交，乃爲霜殺，水乃見祥。","bh":"所以民众易患心腹胀满，肠鸣而频频大便，严重时心痛、胁肋胀满、呕吐、霍乱、水饮发作、泻注，身体浮肿沉重。云奔向雨府，霞光簇拥朝阳，山泽之间尘埃昏蒙，它就在四之气时发作。云横于天山，浮游生灭，这是郁积将要发作的先兆。金郁发作时，天气洁净、地气清明，风清而气急切，大凉之气于是兴起，草树间浮起烟雾，燥气流行，雾气屡起，杀气到来，草木苍干，金于是有声。所以民众易患咳逆，心胁胀满牵引少腹，容易猝然疼痛，不能转侧，咽干、面色如尘而晦恶。山泽焦枯，土上凝着霜卤，这是郁积发作的征象，其气在五之气。夜间降下白露，林莽间声音凄切，这是郁积将要发作的先兆。水郁发作时，阳气于是退避，阴气暴然兴起，大寒于是到来，川泽严寒凝滞，寒气凝结为霜雪，甚则黄黑之气昏蒙遮蔽，流行于气交，于是成为霜杀之气，水于是出现祥兆。","notes":[],"pending":false},{"id":"sw71-40","tags":[],"yw":"故民病寒客心痛，腰痛，大關節不利，屈伸不便，善厥逆，痞堅腹滿。陽光不治，空積沉陰，白埃昏瞑，而乃發也，其氣二火前後。太虛深玄，氣猶麻散，微見而隱，色黑微黃，怫之先兆也。木鬱之發，太虛埃昏，雲物以擾，大風乃至，屋發折木，木有變。故民病胃脘當心而痛，上支兩脅，膈咽不通，食飲不下，甚則耳鳴眩轉，目不識人，善暴僵僕。太虛蒼埃，天山一色，或氣濁色，黃黑鬱若，橫雲不起雨，而乃發也，其氣無常。長川草偃，柔葉呈陰，松吟高山，虎嘯巖岫，怫之先兆也。","bh":"所以民众易患寒邪客留而心痛，腰痛，大关节不利，屈伸不便，容易厥逆，痞塞坚硬、腹部胀满。阳光不能主治，空中积聚沉阴之气，白色埃雾昏蒙，于是发作，其气在二火（二之气、三之气）前后。太虚深远幽玄，气如麻散，微现而隐，色黑微黄，这是郁积将要发作的先兆。木郁发作时，太虚尘埃昏蒙，云物因之扰动，大风于是到来，屋瓦揭起、树木折断，木发生变异。所以民众易患胃脘正当心处疼痛，向上支撑两胁，膈咽不通，饮食不下，严重时耳鸣、眩晕旋转，目不识人，容易猝然僵仆。太虚苍色埃雾，天山一色，或者气浊色变，黄黑郁结如云，横云不起雨，于是发作，其气没有固定时位。长川草木倒伏，柔叶翻呈背面，松鸣于高山，虎啸于岩岫，这是郁积将要发作的先兆。","notes":[],"pending":false},{"id":"sw71-41","tags":[],"yw":"火鬱之發，太虛腫翳，大明不彰，炎火行，大暑至，山澤燔燎，材木流津，廣廈騰煙，土浮霜滷，止水乃減，蔓草焦黃，風行惑言，溼化乃後。故民病少氣，瘡瘍癰腫，脅腹胸背，面首四肢，憤臚脹，瘍嘔逆，螈骨痛，節乃有動，注下溫瘧，腹中暴痛，血溢流注，精液乃少，目赤心熱，甚則瞀悶懊，善暴死。刻終大溫，汗濡玄府，其乃發也，其氣四。動復則靜，陽極反陰，溼令乃化乃成。華發水凝，山川冰雪，焰陽午澤，怫之先兆也。有怫之應而後報也，皆觀其極而乃發也，木發無時，水隨火也。","bh":"火郁发作时，太虚昏蒙翳障，大明之光不显，炎火流行，大暑到来，山泽燔燎，材木流出津液，大厦腾起烟雾，土上浮着霜卤，止水于是减少，蔓草焦黄，风行而人言惑乱，湿化于是延后。所以民众易患气短，疮疡痈肿，胁、腹、胸、背，头面、四肢，愤闷、腹部胀满，疮疡、呕吐气逆，抽搐、骨痛，关节为之动摇，泻注、温疟，腹中猝然疼痛，血溢流注，精液于是减少，目赤、心中烦热，严重时昏闷懊𢙐，容易猝然死亡。刻终之时大温，汗出沾濡玄府（汗孔），于是发作，其气在四之气。动极则静，阳极反阴，湿令于是生化而成。花开而水凝，山川冰雪，阳光如焰而午间水泽蒸腾，这是郁积将要发作的先兆。有郁积的感应而后才有报复，都是观察到极点才发作；木郁发作没有固定时位，水郁发作则随火之后。","notes":[],"pending":false},{"id":"sw71-42","tags":[],"yw":"謹候其時，病可與期，失時反歲，五氣不行，生化收藏，政無恆也。帝曰∶水發而雹雪，土發而飄驟，木發而毀折，金發而清明，火發而曛昧，何氣使然？岐伯曰∶氣有多少，發有微甚，微者當其氣，甚者兼其下，徵其下氣而見可知也。帝曰∶善。五氣之發，不當位者何也？岐伯曰∶命其差。帝曰∶差有數乎？岐伯曰∶後皆三十度而有奇也。帝曰∶氣至而先後者何？岐伯曰∶運太過則其至先，運不及則其至後，此候之常也。帝曰∶當時而至者何也？岐伯曰∶非太過非不及，則至當時，非是者眚也。","bh":"谨慎地等候其时令，疾病就可以预期；错过时令、违背岁气，五气就不能正常运行，生化收藏的政令也就没有常度了。黄帝说：水郁发作而出现雹雪，土郁发作而出现飘骤，木郁发作而出现毁折，金郁发作而出现清明，火郁发作而出现曛昧，是什么气使它这样？岐伯说：气有多有少，发作有微有甚；微的只当其本气，甚的则兼见其下承之气，诊察其下承之气就可以知道了。黄帝说：好。五气发作不在其本位，是为什么？岐伯说：这叫作差。黄帝说：差有数吗？岐伯说：都落后三十度而有余。黄帝说：气至而有先有后，是为什么？岐伯说：运气太过则其至在先，运气不及则其至在后，这是诊候的常道。黄帝说：正当其时而至的，是怎样的？岐伯说：既非太过也非不及，则至当其时；不是这样的，就是灾害。","notes":[],"pending":false},{"id":"sw71-43","tags":[],"yw":"帝曰∶善。氣有非時而化者何也？岐伯曰∶太過者當其時，不及者歸其己勝也。帝曰∶四時之氣，至有早晏高下左右，其候何如？岐伯曰∶行有逆順，至有遲速，故太過者化先天，不及者化後天。帝曰∶願聞其行何謂也？岐伯曰∶春氣西行，夏氣北行，秋氣東行，冬氣南行。故春氣始於下，秋氣始於上，夏氣始於中，冬氣始於標。春氣始於左，秋氣始於右，冬氣始於後，夏氣始於前。此四時正化之常。故至高之地，冬氣常在，至下之地，春氣常在，必謹察之。","bh":"黄帝说：好。有不在其时而生化的，是为什么？岐伯说：太过的当其时，不及的则归于其所胜之时（即被其己所胜者所制之时）。黄帝说：四时之气，到来有早晚、高下、左右的分别，其征候怎样？岐伯说：运行有逆有顺，到来有迟有速，所以太过的生化先天时而至，不及的生化后天时而至。黄帝说：希望听听它的运行是怎样的。岐伯说：春气向西行，夏气向北行，秋气向东行，冬气向南行。所以春气始于下，秋气始于上，夏气始于中，冬气始于标。春气始于左，秋气始于右，冬气始于后，夏气始于前。这是四时正常生化的常道。所以极高的地方冬气常在，极低的地方春气常在，必须谨慎审察。","notes":[],"pending":false},{"id":"sw71-44","tags":[],"yw":"帝曰∶善。黃帝問曰∶五運六氣之應見，六化之正，六變之紀何如？岐伯對曰∶夫六氣正紀，有化有變，有勝有復，有用有病，不同其候，帝欲何乎？帝曰∶願盡聞之。岐伯曰∶請遂言之。夫氣之所至也，厥陰所至爲和平，少陰所至爲暄，太陰所至爲埃溽，少陽所至爲炎暑，陽明所至爲清勁，太陽所至爲寒，時化之常也。厥陰所至爲風府爲璺啓，少陰所至爲火府爲舒榮，太陰所至爲雨府爲員盈，少陽所至爲熱府爲行出，陽明所至爲司殺府爲庚蒼，太陽所至爲寒府爲歸藏，司化之常也。","bh":"黄帝说：好。黄帝问道：五运六气的应象，六化的正常，六变的纲纪是怎样的？岐伯回答说：那六气的正纪，有化有变，有胜有复，有用有病，征候各不相同，您想听哪一项？黄帝说：希望全部听听。岐伯说：请让我详尽地说。那气所至之处，厥阴所至为和平，少阴所至为暄暖，太阴所至为埃溽，少阳所至为炎暑，阳明所至为清劲，太阳所至为寒，这是时令生化的常道。厥阴所至为风府、为开启，少阴所至为火府、为舒展荣华，太阴所至为雨府、为圆满充盈，少阳所至为热府、为运行外出，阳明所至为司杀之府、为庚苍，太阳所至为寒府、为归藏，这是主司生化的常道。","notes":[],"pending":false},{"id":"sw71-45","tags":[],"yw":"厥陰所至爲生爲風搖，少陰所至爲榮爲形見，太陰所至爲化爲雲雨，少陽所至爲長爲番鮮，陽明所至爲收爲霧露，太陽所至爲藏爲周密，氣化之常也。厥陰所至爲風生，終爲肅；少陰所至爲熱生，中爲寒；太陰所至爲溼生，終爲注雨；少陽所至爲火生，終爲蒸溽；陽明所至爲燥生，終爲涼；太陽所至爲寒生，中爲溫。德化之常也。厥陰所至爲毛化，少陰所至爲羽化，太陰所至爲化，少陽所至爲羽化，陽明所至爲介化，太陽所至爲鱗化，德化之常也。厥陰所至爲生化，少陰所至爲榮化，太陰所至爲濡化，少陽所至爲茂化，陽明所至爲堅化，太陽所至爲藏化，布政之常也。","bh":"厥阴所至为生、为风摇，少阴所至为荣、为形现，太阴所至为化、为云雨，少阳所至为长、为繁茂鲜明，阳明所至为收、为雾露，太阳所至为藏、为周密，这是气化的常道。厥阴所至为风生，终为肃；少阴所至为热生，中为寒；太阴所至为湿生，终为注雨；少阳所至为火生，终为蒸溽；阳明所至为燥生，终为凉；太阳所至为寒生，中为温。这是德化的常道。厥阴所至为毛化，少阴所至为羽化，太阴所至为倮化，少阳所至为羽化，阳明所至为介化，太阳所至为鳞化，这是德化的常道。厥阴所至为生化，少阴所至为荣化，太阴所至为濡化，少阳所至为茂化，阳明所至为坚化，太阳所至为藏化，这是布政的常道。","notes":[],"pending":false},{"id":"sw71-46","tags":[],"yw":"厥陰所至爲飄怒大涼，少陰所至爲大暄寒，太陰所至爲雷霆驟注烈風，少陽所至爲飄風燔燎霜凝，陽明所至爲散落溫，太陽所至爲寒雪冰雹白埃，氣變之常也。厥陰所至爲撓動爲迎隨，少陰所至爲高明焰爲曛，太陰所至爲沉陰爲白埃爲晦暝，少陽所至爲光顯爲彤雲爲曛，陽明所至爲煙埃爲霜爲勁切爲悽鳴，太陽所至爲剛固爲堅芒爲立，令行之常也。厥陰所至爲裏急，少陰所至爲瘍胗身熱，太陰所至爲積飲痞隔，少陽所至爲嚏嘔爲瘡瘍，陽明所至爲浮虛，太陽所至爲屈伸不利，病之常也。","bh":"厥阴所至为飘怒大凉，少阴所至为大暄与寒，太阴所至为雷霆骤注与烈风，少阳所至为飘风燔燎与霜凝，阳明所至为散落与温，太阳所至为寒雪冰雹与白埃，这是气变的常道。厥阴所至为挠动、为迎随，少阴所至为高明之焰、为曛，太阴所至为沉阴、为白埃、为晦暝，少阳所至为光显、为彤云、为曛，阳明所至为烟埃、为霜、为劲切、为凄鸣，太阳所至为刚固、为坚芒、为立，这是令行的常道。厥阴所至为腹中拘急，少阴所至为疮疡、疹、身热，太阴所至为积饮、痞塞阻隔，少阳所至为喷嚏、呕吐、疮疡，阳明所至为浮虚，太阳所至为屈伸不利，这是发病的常道。","notes":[],"pending":false},{"id":"sw71-47","tags":[],"yw":"厥陰所至爲支痛，少陰所至爲驚惑惡寒戰譫妄，太陰所至爲滿，少陽所至爲驚躁瞀昧暴病，陽明所至爲鼽尻陰股膝髀足病，太陽所至爲腰痛，病之常也。厥陰所至爲戾，少陰所至爲悲妄衄，太陰所至爲中滿霍亂吐下，少陽所至爲喉痹耳鳴嘔湧，陽明所至爲皴揭，太陽所至爲寢汗痙，病之常也。厥陰所至爲脅痛嘔泄，少陰所至爲語笑，太陰所至爲重腫，少陽所至爲暴注螈暴死，陽明所至爲鼽嚏，太陽所至爲流泄禁止，病之常也。凡此十二變者，報德以德，報化以化，報政以政，報令以令，氣高則高，氣下則下，氣後則後，氣前則前，氣中則中，氣外則外，位之常也。","bh":"厥阴所至为支撑疼痛，少阴所至为惊惑、恶寒、战栗、谵语妄言，太阴所至为胀满，少阳所至为惊躁、昏昧、猝发之病，阳明所至为鼻塞、尻、阴部、大腿、膝、髀、足等处疾病，太阳所至为腰痛，这是发病的常道。厥阴所至为乖戾，少阴所至为悲哀妄言、鼻出血，太阴所至为中满、霍乱、吐泻，少阳所至为喉痹、耳鸣、呕吐上涌，阳明所至为皮肤皴裂揭起，太阳所至为睡中汗出、痉挛，这是发病的常道。厥阴所至为胁痛、呕吐、泄泻，少阴所至为多语喜笑，太阴所至为身体沉重浮肿，少阳所至为猝然泻注、抽搐、猝死，阳明所至为鼻塞喷嚏，太阳所至为流泄不禁，这是发病的常道。凡此十二变，报德以德，报化以化，报政以政，报令以令；气高则高，气下则下，气后则后，气前则前，气中则中，气外则外，这是位置的常道。","notes":[],"pending":false},{"id":"sw71-48","tags":[],"yw":"故風勝則動，熱勝則腫，燥勝則干，寒勝則浮，溼勝則濡泄，甚則水閉腫，隨氣所在，以言其變耳。帝曰∶願聞其用也。岐伯曰∶夫六氣之用，各歸不勝而爲化，故太陰雨化，施於太陽；太陽寒化，施於少陰；少陰熱化，施於陽明；陽明燥化，施於厥陰；厥陰風化，施於太陰。各命其所在以徵之也。帝曰∶自得其位何如？岐伯曰∶自得其位，常化也。帝曰∶願聞所在也。岐伯曰∶命其位而方月可知也。帝曰∶六位之氣盈虛何如？岐伯曰∶太少異也，太者之至徐而常，少者暴而亡。","bh":"所以风胜则动，热胜则肿，燥胜则干，寒胜则浮，湿胜则濡泄，甚则水闭浮肿，随气所在的部位而说明它的病变罢了。黄帝说：希望听听六气的作用。岐伯说：那六气的作用，各归于其所不胜者而为生化，所以太阴雨化，施于太阳；太阳寒化，施于少阴；少阴热化，施于阳明；阳明燥化，施于厥阴；厥阴风化，施于太阴。各据其所在而验证它。黄帝说：自得其本位是怎样的？岐伯说：自得其本位，是正常的生化。黄帝说：希望听听所在的部位。岐伯说：确定了它的位置，方位与月令就可以知道了。黄帝说：六步之气的盈虚怎样？岐伯说：太与少不同；太者之至徐缓而持久，少者急暴而速亡。","notes":[],"pending":false},{"id":"sw71-49","tags":[],"yw":"帝曰∶天地之氣，盈虛何如？岐伯曰∶天氣不足，地氣隨之，地氣不足，天氣從之，運居其中而常先也。惡所不勝，歸所同和，隨運歸從而生其病也。故上勝則天氣降而下，下勝則地氣遷而上，多少而差其分，微者小差，甚者大差，甚則位易氣交易，則大變生而病作矣。《大要》曰∶甚紀五分，微紀七分，其差可見。此之謂也。帝曰∶善。論言熱無犯熱，寒無犯寒。餘欲不遠寒，不遠熱奈何？岐伯曰∶悉乎哉問也！發表不遠熱，攻裏不遠寒。帝曰∶不發不攻而犯寒犯熱何如？岐伯曰∶寒熱內賊，其病益甚。","bh":"黄帝说：天地之气的盈虚怎样？岐伯说：天气不足，地气随之；地气不足，天气从之；运气居于其中而常先于天地。厌恶其所不胜，归从其所同和，随运而归从，于是发生疾病。所以上部胜则天气下降于下，下部胜则地气上迁于上；相差有多有少，微者小差，甚者大差；甚则位置改易、气相交迭，于是大变发生而疾病发作。《大要》说：甚的纪为五分，微的纪为七分，其差异就可以看出来了。说的就是这个。黄帝说：好。医论说热无犯热，寒无犯寒。我想不避寒、不避热，怎么样？岐伯说：您问得真详尽啊！发表不避热，攻里不避寒。黄帝说：既不发表也不攻里而犯寒犯热，怎样？岐伯说：寒热在内相贼，其病更加严重。","notes":[],"pending":false},{"id":"sw71-50","tags":[],"yw":"帝曰∶願聞無病者何如？岐伯曰∶無者生之，有者甚之。帝曰∶生者何如？岐伯曰∶不遠熱則熱至，不遠寒則寒至，寒至則堅痞腹滿，痛急下利之病生矣，熱至則身熱，吐下霍亂，癰疽瘡瘍，瞀鬱注下，螈腫脹，嘔鼽衄頭痛，骨節變肉痛，血溢血泄，淋之病生矣。帝曰∶治之奈何？岐伯曰∶時必順之，犯者治以勝也。黃帝問曰∶婦人重身，毒之何如？岐伯曰∶有故無殞，亦無殞也。帝曰∶願聞其故何謂也？岐伯曰∶大積大聚，其可犯也，衰其太半而止，過者死。","bh":"黄帝说：希望听听无病的人怎样？岐伯说：无病的会因此生病，有病的会因此加重。黄帝说：生病是怎样的？岐伯说：不避热则热气到来，不避寒则寒气到来；寒气到来则坚硬痞塞、腹部胀满，疼痛拘急、下利的病就发生了；热气到来则身热，吐泻霍乱，痈疽疮疡，昏闷郁结、泻注，抽搐肿胀，呕吐、鼻塞流涕、鼻出血、头痛，骨节改变、肌肉疼痛，血溢血泄、淋证之类的病就发生了。黄帝说：怎样治疗？岐伯说：必须顺从时令，犯了寒热的用相胜之气来治疗。黄帝问道：妇人怀孕，用毒药怎样？岐伯说：有病因而用之，胎儿不会殒落，母体也不会损伤。黄帝说：希望听听这是什么缘故？岐伯说：大积大聚之病，是可以攻伐的，病邪衰减过半就停止，攻伐太过就会死亡。","notes":[],"pending":false},{"id":"sw71-51","tags":[],"yw":"帝曰∶善。鬱之甚者治之奈何？岐伯曰∶木鬱達之，火鬱發之，土鬱奪之，金鬱泄之，水鬱折之，然調其氣，過者折之，以其畏也，所謂瀉之。帝曰∶假者何如？岐伯曰∶有假其氣，則無禁也。所謂主氣不足，客氣勝也。帝曰∶至哉聖人之道！天地大化營運之節，臨御之紀，陰陽之政，寒暑之令，非夫子孰能通之！請藏之靈蘭之室，署曰《六元正紀》，非齋戒不敢示，慎傳也。六元正紀大論∶憒（音會）（音蒙）（奴董切）翮（胡革切）痙（巨郢切）<目錄>卷第二十一","bh":"黄帝说：好。郁气严重的怎样治疗？岐伯说：木郁就疏达它，火郁就发散它，土郁就劫夺它，金郁就泄利它，水郁就折抑它，然而调和其气，过甚的就折减它，用它所畏惧的，这就是所谓泻。黄帝说：假气是怎样的？岐伯说：有假其气的，就没有禁忌。这就是所谓主气不足、客气偏胜。黄帝说：至极啊圣人之道！天地大化运行的节度，临御的纲纪，阴阳的政令，寒暑的时令，除了先生谁能通晓它！请把它藏在灵兰之室，署名为《六元正纪》，不斋戒不敢出示，慎重地传授。","notes":[],"pending":false}]},
{"id":"sw72","book":"素问","no":72,"title":"刺法论","titleTw":"刺法論","tags":["yunqi","ci","bingji"],"brief":"论述六气升降不前、迁正退位、刚柔失守所致疫疠的针刺预防法，并载五脏补泻刺法、避五疫之法与十二脏刺法。","pending":false,"sections":[{"id":"sw72-1","tags":[],"yw":"黃帝問曰∶升降不前，氣交有變，即成暴鬱，餘已知之。如何預救生靈，可得卻乎？岐伯稽首再拜對曰∶昭乎哉問！臣聞夫子言，既明天元，須窮法刺，可以折鬱扶運，補弱全真，瀉盛蠲餘，令除斯苦。帝曰∶願卒聞之。岐伯曰∶升之不前，即有甚兇也。木欲升而天柱窒抑之，木欲發鬱亦須待時，當刺足厥陰之井。火欲升而天蓬窒抑之，火欲發鬱亦須待時，君火相火同刺包絡之滎。土欲升而天衝窒抑之，土欲發鬱亦須待時，當刺足太陰之俞。金欲升而天英窒抑之，金欲發鬱亦須待時，當刺手太陰之經。","bh":"黄帝问道：六气当升不升，气交发生变异，就会形成暴郁，这我已经知道了。怎样预先救护生灵，能使它退去呢？岐伯叩头再拜回答说：问得多么明白啊！臣听夫子说过，既已明了天元之理，还须穷尽刺法，才可以折减郁气、扶助运气，补益虚弱而保全真气，泻其亢盛而蠲除有余，使人免除这一病苦。黄帝说：希望详尽地听一听。岐伯说：当升而不能前进，就有很凶险的后果。木气欲升而被天柱（金气）窒塞抑制，木气欲发其郁还须等待时令，当刺足厥阴之井穴。火气欲升而被天蓬（水气）窒塞抑制，火气欲发其郁也须等待时令，君火、相火同刺包络之荥穴。土气欲升而被天冲（木气）窒塞抑制，土气欲发其郁也须等待时令，当刺足太阴之俞穴。金气欲升而被天英（火气）窒塞抑制，金气欲发其郁也须等待时令，当刺手太阴之经穴。","notes":[],"pending":false},{"id":"sw72-2","tags":[],"yw":"水欲升而天芮窒抑之，水欲發鬱亦須待時，當刺足少陰之合。帝曰∶升之不前，可以預備，願聞其降，可以先防。岐伯曰∶既明其升，必達其降也。升降之道，皆可先治也。木欲降而地晶窒抑之，降而不入，抑之鬱發，散而可得位，降而鬱發，暴如天間之待時也，降而不下，鬱可速矣，降可折其所勝也，當刺手太陰之所出，刺手陽明之所入。火欲降而地玄窒抑之，降而不入，抑之鬱發，散而可矣，當折其所勝，可散其鬱，當刺足少陰之所出，刺足太陽之所入。","bh":"水气欲升而被天芮（土气）窒塞抑制，水气欲发其郁也须等待时令，当刺足少阴之合穴。黄帝说：当升不升，可以预先防备，希望听听当降的情况，能否先行预防。岐伯说：既已明白它的升，必能通达它的降。升降的道理，都可以预先调治。木气欲降而被地晶（金气）窒塞抑制，降而不能入地，被抑而郁发，疏散之后才能得其位，降而郁发，其暴急如同天气之间待时而发，降而不下，其郁可以速散，可以折减它所胜之气，当刺手太阴之所出，刺手阳明之所入。火气欲降而被地玄（水气）窒塞抑制，降而不能入地，被抑而郁发，疏散之后就可以了，当折减它所胜之气，可以散它的郁，当刺足少阴之所出，刺足太阳之所入。","notes":[],"pending":false},{"id":"sw72-3","tags":[],"yw":"土欲降而地蒼窒抑之，降而不下，抑之鬱發，散而可入，當折其勝，可散其鬱，當刺足厥陰之所出，刺足少陽之所入。金欲降而地彤窒抑之，降而不下，抑之鬱發，散而可入，當折其勝，可散其鬱，當刺心包絡所出，刺手少陽所入也。水欲降而地阜窒抑之，降而不下，抑之鬱發，散而可入，當折其土，可散其鬱，當刺足太陰之所出，刺足陽明之所入。帝曰∶五運之至，有前後與升降往來，有所承抑之，可得聞乎刺法？岐伯曰∶當取其化源也。是故太過取之，不及資之。","bh":"土气欲降而被地苍（木气）窒塞抑制，降而不下，被抑而郁发，疏散之后才能入地，当折减其所胜，可以散它的郁，当刺足厥阴之所出，刺足少阳之所入。金气欲降而被地彤（火气）窒塞抑制，降而不下，被抑而郁发，疏散之后才能入地，当折减其所胜，可以散它的郁，当刺心包络之所出，刺手少阳之所入。水气欲降而被地阜（土气）窒塞抑制，降而不下，被抑而郁发，疏散之后才能入地，当折减其土，可以散它的郁，当刺足太阴之所出，刺足阳明之所入。黄帝说：五运的到来，有先后与升降往来，有相承而抑制它的，可以听听其中的刺法吗？岐伯说：当取它的化源。所以太过者取之，不及者资之。","notes":[],"pending":false},{"id":"sw72-4","tags":[],"yw":"太過取之，次抑其鬱，取其運之化源，令折鬱氣。不及扶資，以扶運氣，以避虛邪也。資取之法令出《密語》。黃帝問曰∶升降之刺，以知其要，願聞司天未得遷正，使司化之失其常政，即萬化之或其皆妄。然與民爲病，可得先除，欲濟羣生，願聞其說。岐伯稽首再拜曰∶悉乎哉問！言其至理，聖念慈憫，欲濟羣生，臣乃盡陳斯道，可申洞微。太陽復布，即厥陰不遷正，不遷正氣塞於上，當瀉足厥陰之所流。厥陰復布，少陰不遷正，不遷正即氣塞於上，當刺心包絡脈之所流。","bh":"太过则取之，其次抑制它的郁气，取它运气的化源，使郁气得以折减。不及则扶助资益，以此扶助运气，从而避虚邪。资取的法令出自《密语》。黄帝问道：升降的刺法，已知其要领，希望听听司天不得迁正，致使主司气化失去常政，也就是万物的生化或许都乱，这样给百姓造成疾病，能否预先消除，想救济众生，希望听听其中的道理。岐伯叩头再拜说：问得真周详啊！说的是最高的道理，圣心仁慈怜悯，想救济众生，臣就尽陈此道，可以申明幽微之理。太阳复行布政，就是厥阴不得迁正，不迁正则气塞于上，当泻足厥阴之所流。厥阴复行布政，少阴不得迁正，不迁正则气塞于上，当刺心包络脉之所流。","notes":[],"pending":false},{"id":"sw72-5","tags":[],"yw":"少陰復布，太陰不遷正，不遷正即氣留於上，當刺足太陰之所流。太陰復布，少陽不遷正，不遷正則氣塞未通，當刺手少陽之所流。少陽復布，則陽明不遷正，不遷正則氣未通上，當刺手太陰之所流。陽明復布，太陽不遷正，不遷正則復塞其氣，當刺足少陰之所流。帝曰∶遷正不前，以通其要，願聞不退，欲折其餘，無令過失，可得明乎？岐伯曰∶氣過有餘，復作布正，是名不退位也。使地氣不得後化，新司天未可遷正，故復布化令如故也。巳亥之歲天數有餘，故厥陰不退位也，風行於上，木化布天，當刺足厥陰之所入。","bh":"少阴复行布政，太阴不得迁正，不迁正则气留于上，当刺足太阴之所流。太阴复行布政，少阳不得迁正，不迁正则气塞不通，当刺手少阳之所流。少阳复行布政，则阳明不得迁正，不迁正则气未能上通，当刺手太阴之所流。阳明复行布政，太阳不得迁正，不迁正则又闭塞其气，当刺足少阴之所流。黄帝说：迁正不前，已通其要领，希望听听不退位，想折减其有余，不使有过失，可以明白吗？岐伯说：气过而有余，复又布行正位，这叫不退位。致使地气不得随后生化，新司天不能迁正，所以仍旧复行布化之令如同旧岁。巳亥之年天数有余，所以厥阴不退位，风行于上，木化布于天，当刺足厥阴之所入。","notes":[],"pending":false},{"id":"sw72-6","tags":[],"yw":"子午之歲，天數有餘，故少陰不退位也，熱行於上，火餘化布天，當刺手厥陰之所入。丑未之歲，天數有餘，故太陰不退位也，溼行於上，雨化布天，當刺足太陰之所入。寅申之歲，天數有餘，故少陽不退位也，熱行於上，火化布天，當刺手少陽之所入。卯酉之歲，天數有餘，故陽明不退位也，金行於上，燥化布天，當刺手太陰之所入。辰戌之歲，天數有餘，故太陽不退位也，寒行於上凜水化布天，當刺足少陰之所入。故天地氣逆，化成民病，以法刺之，預可平。","bh":"子午之年，天数有余，所以少阴不退位，热行于上，火气有余而布化于天，当刺手厥阴之所入。丑未之年，天数有余，所以太阴不退位，湿行于上，雨化布于天，当刺足太阴之所入。寅申之年，天数有余，所以少阳不退位，热行于上，火化布于天，当刺手少阳之所入。卯酉之年，天数有余，所以阳明不退位，金行于上，燥化布于天，当刺手太阴之所入。辰戌之年，天数有余，所以太阳不退位，寒行于上，凛冽水化布于天，当刺足少阴之所入。所以天地之气逆乱，化生而成民病，依法刺之，可以预先平复。","notes":[],"pending":false},{"id":"sw72-7","tags":[],"yw":"黃帝問曰∶剛柔二干，失守其位，使天運之氣皆虛乎？與民爲病，可得平乎？岐伯曰∶深乎哉問！明其奧旨，天地迭移，三年化疫，是謂根之可見，必有逃門。假令甲子，剛柔失守，剛未正，柔孤而有虧，時序不令，即音律非從，如此三年，變大疫也。詳其微甚，察其淺深，欲至而可刺，刺之，當先補腎俞，次三日，可刺足太陰之所注。又有下位己卯不至，而甲子孤立者，次三年作土癘，其法補瀉，一如甲子同法也。其刺以畢，又不須夜行及遠行，令七日潔，清淨齋戒。","bh":"黄帝问道：刚柔二干，失守其位，会使天运之气都虚吗？由此给百姓造成的疾病，可以平除吗？岐伯说：问得真深啊！明白了其中奥旨，天地迭相迁移，三年化为疫病，这叫作根由可以预见，必定有逃避的门径。假令甲子年，刚柔失守，刚干未能正位，柔干孤立而有所亏缺，时令节序不相应，就是音律不相随顺，如此三年，就变为大疫。详察它的微甚，审辨它的浅深，将要到来时可以刺治，刺的时候，当先补肾俞，过三日，可刺足太阴之所注。又有下位己卯不至，而甲子孤立无配的，过三年发作土疠，它的补泻方法，全与甲子失守之法相同。针刺完毕以后，又不可夜行及远行，要使七日清净，斋戒身心。","notes":[],"pending":false},{"id":"sw72-8","tags":[],"yw":"所有自來腎有久病者，可以寅時面向南，淨神不亂，思閉氣不息七遍，以引頸咽氣順之，如咽甚硬物，如此七遍後，餌舌下津令無數。假令丙寅，剛柔失守，上剛干失守，下柔不可獨主之，中水運非太過，不可執法而定之，布天有餘，而失守上正，天地不合，即律呂音異，如此即天運失序，後三年變疫。詳其微甚，差有大小，徐至即後三年，至甚即首三年，當先補心俞，次五日，可刺腎之所入。又有下位地甲子，辛巳柔不附剛，亦名失守，即地運皆虛，後三年變水癘，即刺法皆如此矣。","bh":"凡素来肾有久病的人，可以在寅时面向南，静神不乱，意想闭气不呼出，行七遍，引颈咽气顺下，如同咽下很硬的东西，如此七遍之后，吞服舌下津液不计其数。假令丙寅年，刚柔失守，上刚干失守，下柔干不能独主，中运水运并非太过，不可拘执常法而定之，布天有余，而上正失守，天地不合，就是律吕音异，如此则天运失其常序，过后三年变为疫病。详察其微甚，差别有大小，徐缓而至的在后三年，甚急的则在头三年，当先补心俞，过五日，可刺肾之所入。又有下位地甲子，辛巳柔干不附刚干，也叫失守，就是地运都虚，过三年变为水疠，刺法都与此相同。","notes":[],"pending":false},{"id":"sw72-9","tags":[],"yw":"其刺如畢，慎其大喜欲情於中，如不忌，即其氣復散也，令靜七日，心欲實，令少思。假令庚辰，剛柔失守，上位失守，下位無合，乙庚金運，故非相招，布天未退，中運勝來，上下相錯，謂之失守，姑洗林鍾，商音不應也，如此則天運化易，三年變大疫。詳其天數，差有微甚，微即微，三年至，甚即甚，三年至，當先補肝俞，次三日，可刺肺之所行。刺畢，可靜神七日，慎勿大怒，怒必真氣卻散之。又或在下地甲子乙未失守者，即乙柔干，即上庚獨治之，亦名失守者，即天運孤主之，三年變癘，名曰金癘，其至待時也。","bh":"针刺完毕之后，要慎戒内心大喜情欲，如不禁忌，其气又会散失，使其安静七日，心要充实，就要减少思虑。假令庚辰年，刚柔失守，上位失守，下位无所配合，乙庚为金运，所以不相招合，布天未退，中运胜气来乘，上下相错，叫作失守，姑洗、林钟，商音不相呼应，如此则天运变化更易，三年变为大疫。详察其天数，差别有微甚，微的则微，三年至，甚的则甚，三年至，当先补肝俞，过三日，可刺肺之所行。刺毕，要静神七日，切戒大怒，怒则真气退却散失。又有在下地甲子乙未失守的，就是乙柔干在上庚独治的情形，也叫失守，就是天运孤立独主，三年变为疠气，名叫金疠，它的到来有待时日。","notes":[],"pending":false},{"id":"sw72-10","tags":[],"yw":"詳其地數之等差，亦推其微甚，可知遲速爾。諸位乙庚失守，刺法同，肝欲平，即勿怒。假令壬午，剛柔失守，上壬未遷正，下丁獨然，即雖陽年，虧及不同，上下失守，相招其有期，差之微甚，各有其數也，律呂二角，失而不和，同音有日，微甚如見，三年大疫，當刺脾之俞，次三日，可刺肝之所出也。刺畢，靜神七日，勿大醉歌樂，其氣復散，又勿飽食，勿食生物，欲令脾實，氣無滯飽，無久坐，食無太酸，無食一切生物，宜甘宜淡。又或地下甲子，丁酉失守其位，未得中司，即氣不當位，下不與壬奉合者，亦名失守，非名合德，故柔不附剛，即地運不合，三年變癘，其刺法一如木疫之法。","bh":"详察它地数的等差，也推求它的微甚，就可以知道迟缓与急速了。诸位乙庚失守，刺法相同，肝要平，就不要发怒。假令壬午年，刚柔失守，上壬未得迁正，下丁独主其位，虽是阳年，亏损各不相同，上下失守，相招是有期限的，差别的微甚，各有其数，律吕二角，失而不和，同音自有其日，微甚一 一可见，三年发为大疫，当刺脾之俞，过三日，可刺肝之所出。刺毕，静神七日，不要大醉、歌唱作乐，那样其气又会散失，又不要饱食，不要吃生冷之物，要使脾充实，气无滞饱，不要久坐，饮食不要太酸，不要吃一切生物，宜甘宜淡。又有地下甲子，丁酉失守其位，未能得主中司，就是气不当位，下不能与壬奉合的，也叫失守，不能称为合德，所以柔不附刚，就是地运不合，三年变为疠气，它的刺法一如木疫之法。","notes":[],"pending":false},{"id":"sw72-11","tags":[],"yw":"假令戊申，剛柔失守，戊癸雖火運，陽年不太過也，上失其剛，柔地獨主，其氣不正，故有邪干，迭移其位，差有淺深，欲至將合，音律先同，如此天運失時，三年之中，火疫至矣，當刺肺之俞。刺畢，靜神七日，勿大悲傷也，悲傷即肺動，而真氣復散也，人欲實肺者，要在息氣也。又或地下甲子，癸亥失守者，即柔失守位也，即上失其剛也，即亦名戊癸不相合德者也，即運與地虛，後三年變癘，即名火癘。是故立地五年，以明失守，以窮法刺，於是疫之與癘，即是上下剛柔之名也，窮歸一體也，即刺疫法，只有五法，即總其諸位失守，故只歸五行而統之也。","bh":"假令戊申年，刚柔失守，戊癸虽是火运，而阳年并不太过，上失其刚，柔地独主，其气不正，所以有邪气干预，迭相迁移其位，差别有浅深，将要到来相合之时，音律先同，如此天运失时，三年之中，火疫就到了，当刺肺之俞。刺毕，静神七日，不要大悲伤，悲伤就会肺气妄动，而真气又复散失，人要使肺充实，关键在于调息其气。又有地下甲子，癸亥失守的，就是柔干失守其位，也就是上失其刚，也就是称作戊癸不相合德的情形，就是运与地都虚，过后三年变为疠气，就名叫火疠。所以立地五年之数，以明失守，以穷尽刺法，这样看来疫与疠，只是上下刚柔的不同名称，归根结底是一体的，就是刺疫之法，只有五法，也就是总括诸位失守，所以只归五行而统摄它。","notes":[],"pending":false},{"id":"sw72-12","tags":[],"yw":"黃帝曰∶餘聞五疫之至，皆相染易，無問大小，病狀相似，不施救療，如何可得不相移易者？岐伯曰∶不相染者，正氣存內，邪不可干，避其毒瓦斯，天牝從來，復得其往，氣出於腦，即不邪干。氣出於腦，即室先想心如日。欲將入於疫室，先想青氣自肝而出，左行於東，化作林木。次想白氣自肺而出，右行於西，化作戈甲。次想赤氣自心而出，南行於上，化作焰明。次想黑氣自腎而出，北行於下，化作水。次想黃氣自脾而出，存於中央，化作土。五氣護身之畢，以想頭上如北斗之煌煌，然後可入於疫室。","bh":"黄帝说：我听说五疫到来，都互相传染，无论大小，病状相似，不施行救治，怎样才能使它不互相传染呢？岐伯说：不相传染的，是因为正气内存于内，邪气就不能侵犯，要避它的毒气，天牝（鼻）是毒气往来的通路，又可使毒气复从原路而出，气出于脑，就不被邪气侵犯。气出于脑，就是入室之前先意想心如太阳。将要进入疫病之家，先意想青气自肝而出，向左行于东方，化作林木。次想白气自肺而出，向右行于西方，化作戈甲。次想赤气自心而出，向南行于上方，化作火焰光明。次想黑气自肾而出，向北行于下方，化作水。次想黄气自脾而出，存留于中央，化作土。五气护身完毕，再意想头上如同北斗那样煌煌明亮，然后可以进入疫病之家。","notes":[],"pending":false},{"id":"sw72-13","tags":[],"yw":"又一法，於春分之日，日未出而吐之。又一法，於雨水日後，三浴以藥泄汗。又一法，小金丹方∶辰砂二兩，水磨雄黃一兩，葉子雌黃一兩，紫金半兩，同入合中，外固了，地一尺築地實，不用爐，不須藥制，用火二十斤之也，七日終，候冷七日取，次日出合子，埋藥地中七日，取出順日研之三日，煉白沙蜜爲丸，如梧桐子大，每日望東吸日華氣一口，冰水下一丸，和氣咽之，服十粒，無疫干也。黃帝問曰∶人虛即神遊失守位，使鬼神外干，是致夭亡，何以全真？願聞刺法。","bh":"又一法，在春分之日，太阳未出时吐气。又一法，在雨水日之后，用药洗浴三次以发泄汗液。又一法，小金丹方：辰砂二两，水磨雄黄一两，叶子雌黄一两，紫金半两，同放入盒中，外面加固封严，在地上挖一尺筑地坚实，不用炉，不须另加制炼，用炭火二十斤来煅，七日终了，等冷却七日取出，次日打开盒子，把药埋在地中七日，取出后顺日研磨三日，炼白沙蜜为丸，如梧桐子大，每日向东吸日华气一口，用冰水送下一丸，和气咽下，服十粒，就不会有疫气侵犯。黄帝问道：人虚就会神游而失守其位，致使鬼神外干，因此夭折死亡，怎样才能保全真气？希望听听刺法。","notes":[],"pending":false},{"id":"sw72-14","tags":[],"yw":"岐伯稽首再拜曰∶昭乎哉問！謂神移失守，雖在其體，然不致死，或有邪干，故令夭壽。只如厥陰失守，天以虛，人氣肝虛，感天重虛，即魂遊於上，邪干厥大氣，身溫猶可刺之，刺其足少陽之所過，次刺肝之俞。人病心虛，又遇君相二火司天失守，感而三虛，遇火不及，黑屍鬼犯之，令人暴亡，可刺手少陽之所過，復刺心俞。人脾病，又遇太陰司天失守，感而三虛，又遇土不及，青屍鬼邪犯之於人，令人暴亡，可刺足陽明之所過，復刺脾之俞。人肺病，遇陽明司天失守，感而三虛，又遇金不及，有赤屍鬼干人，令人暴亡，可刺手陽明之所過，復刺肺俞。","bh":"岐伯叩头再拜说：问得多么明白啊！说的是神移而失守，虽然还在他身上，却不至于致死，或是有邪气相干，所以使人夭折短寿。就像厥阴失守，天气因此虚，人的肝气又虚，感受天之重虚，就会魂游于上，邪气干预厥阴大气，若身体尚温还可以刺治，刺它足少阳之所过，再刺肝之俞。人有心虚之病，又遇君火、相火二火司天失守，感受而成三虚，又遇火运不及，黑尸鬼侵犯，使人突然死亡，可刺手少阳之所过，再刺心俞。人有脾病，又遇太阴司天失守，感受而成三虚，又遇土运不及，青尸鬼之邪侵犯于人，使人突然死亡，可刺足阳明之所过，再刺脾之俞。人有肺病，遇阳明司天失守，感受而成三虚，又遇金运不及，有赤尸鬼干犯人，使人突然死亡，可刺手阳明之所过，再刺肺俞。","notes":[],"pending":false},{"id":"sw72-15","tags":[],"yw":"人腎病，又遇太陽司天失守，感而三虛，又遇水運不及之年，有黃屍鬼干犯人正氣，吸人神魂，致暴亡，可刺足太陽之所過，復刺腎俞。黃帝問曰∶十二髒之相使，神失位，使神彩之不圓，恐邪干犯，治之可刺，願聞其要。岐伯稽首再拜曰∶悉乎哉，問至理，道真宗，此非聖帝，焉究斯源，是謂氣神合道，契符上天。心者，君主之官，神明出焉，可刺手少陰之源。肺者，相傅之官，治節出焉，可刺手太陰之源。肝者，將軍之官，謀慮出焉，可刺足厥陰之源。","bh":"人有肾病，又遇太阳司天失守，感受而成三虚，又遇水运不及之年，有黄尸鬼干犯人的正气，吸夺人的神魂，致使突然死亡，可刺足太阳之所过，再刺肾俞。黄帝问道：十二脏的相互役使，神失其位，致使神彩不圆满，恐怕邪气干犯，治疗可否用刺？希望听听其中的要领。岐伯叩头再拜说：周详啊，问的是至理，讲的是道之真宗，若非圣帝，怎能穷究这一根源，这就叫作气神合道，契合于上天。心是君主之官，神明由此而出，可刺手少阴之源。肺是相傅之官，治节由此而出，可刺手太阴之源。肝是将军之官，谋虑由此而出，可刺足厥阴之源。","notes":[],"pending":false},{"id":"sw72-16","tags":[],"yw":"膽者，中正之官，決斷出焉，可刺足少陽之源。羶中者，臣使之官，喜樂出焉，可刺心包絡所流。脾爲諫議之官，知周出焉，可刺脾之源。胃爲倉廩之官，五味出焉，可刺胃之源。大腸者，傳道之官，變化出焉，可刺大腸之源。小腸者，受盛之官，化物出焉，可刺小腸之源。腎者，作強之官，伎巧出焉，刺其腎之源。三焦者，決瀆之官，水道出焉，刺三焦之源。膀胱者，州都之官，精液藏焉，氣化則能出矣，刺膀胱之源。凡此十二官者，不得相失也。","bh":"胆是中正之官，决断由此而出，可刺足少阳之源。膻中是臣使之官，喜乐由此而出，可刺心包络之所流。脾是谏议之官，智虑周全由此而出，可刺脾之源。胃是仓廪之官，五味由此而出，可刺胃之源。大肠是传道之官，变化由此而出，可刺大肠之源。小肠是受盛之官，化物由此而出，可刺小肠之源。肾是作强之官，伎巧由此而出，刺它肾之源。三焦是决渎之官，水道由此而出，刺三焦之源。膀胱是州都之官，津液藏聚于此，气化方能排出，刺膀胱之源。大凡这十二官，是不能相互失调的。","notes":[],"pending":false},{"id":"sw72-17","tags":[],"yw":"是故刺法有全神養真之旨，亦法有修真之道，非治疾也，故要修養和神也。道貴常存，補神固根，精氣不散，神守不分，然即神守而雖不去，亦能全真，人神不守，非達至真，至真之要，在乎天玄，神守天息，復入本元，命曰歸宗。<目錄>卷第二十一","bh":"所以刺法有全神养真的旨趣，也就是法中有修真之道，并不是专为治病，因此重在修养而调和其神。道贵在常存，补益神气、固其根本，精气不散，神守而不分离，这样虽然神守而不离去，也能保全真气，人的神不能守持，就不能通达至真，至真的要领，在于天玄，神能守住天然之息，再返归本元，就叫作归宗。（本篇见于卷第二十一。）","notes":[],"pending":false}]},
{"id":"sw73","book":"素问","no":73,"title":"本病论","titleTw":"本病論","tags":["yunqi","bingji","yinyang"],"brief":"论气交失守之变：六气升降不前、不得下降、迁正退位失序所致气候异变与民病，及刚柔失守三年化疫之理。","pending":false,"sections":[{"id":"sw73-1","tags":[],"yw":"黃帝問曰∶天元九窒，餘已知之，願聞氣交，何名失守？岐伯曰∶謂其上下升降，遷正退位，各有經論，上下各有不前，故名失守也。是故氣交失易位，氣交乃變，變易非常，即四時失序，萬化不安，變民病也。帝曰∶升降不前，願聞其故，氣交有變，何以明知？岐伯曰∶昭乎問哉！明乎道矣。氣交有變，是爲天地機，但欲降而不得降者，地窒刑之。又有五運太過，而先天而至者，即交不前，但欲升而不得其升，中運抑之，但欲降而不得其降，中運抑之。","bh":"黄帝问道：天元九窒，我已经知道了，希望听听气交，什么叫作失守？岐伯说：是指它的上下升降、迁正退位，各有经论可据，上下各有不能前进的，所以名叫失守。因此气交失其位置，气交就发生变化，变化变异不循常规，就使四时失去次序，万物的生化不安，变成民病。黄帝说：升降不前，希望听听它的缘故，气交有变，怎么才能明了？岐伯说：问得多么明白啊！真通达于道了。气交有变，这是天地的枢机，只是想降而不能降的，是地窒刑克它。又有五运太过，而先天时而至的，就是气交不能前进，只是想升而不得其升的，是中运抑制它，只是想降而不得其降的，也是中运抑制它。","notes":[],"pending":false},{"id":"sw73-2","tags":[],"yw":"於是有升之不前，降之不下者，有降之不下，升而至天者，有升降俱不前，作如此之分別，即氣交之變，變之有異，常各各不同，災有微甚者也。帝曰，願聞氣交遇會勝抑之由，變成民病，輕重何如？岐伯曰∶勝相會，抑伏使然。是故辰戌之歲，木氣升之，主逢天柱，勝而不前。又遇庚戌，金運先天，中運勝之，忽然不前。木運升天，金乃抑之，升而不前，即清生風少，肅殺於春，露霜復降，草木乃萎。民病溫疫早發，咽嗌乃干，四肢滿，肢節皆痛。","bh":"于是有升而不前的，有降而不下的，有降而不下而升至于天的，有升降都不前的，作这样的分别，就是气交的变化，变化各有差异，常常各不相同，灾害也就有微有甚。黄帝说：希望听听气交遇会、相胜相抑的缘由，由此变成民病，轻重如何？岐伯说：胜气相会，抑伏使它如此。所以辰戌之年，木气上升，主运上逢天柱（金气），被胜而不能前进。又遇庚戌，金运先天时而至，中运胜它，忽然不能前进。木运升天，金气抑制它，升而不前，就会清气发生而风气少，肃杀行于春令，霜露又降，草木因而枯萎。民病温疫早发，咽喉干燥，四肢胀满，肢节都痛。","notes":[],"pending":false},{"id":"sw73-3","tags":[],"yw":"久而化鬱，即大風摧拉，折隕鳴紊。民病卒中偏痹，手足不仁。是故巳亥之歲，君火升天，主窒天蓬，勝之不前。又厥陰木遷正，則少陰未得升天，水運以至其中者。君火欲升，而中水運抑之，升之不前，即清寒復作，冷生旦暮。民病伏陽，而內生煩熱，心神驚悸，寒熱間作。日久成鬱，即暴熱乃至，赤風腫翳，化疫，溫癘暖作，赤氣彰而化火疫，皆煩而躁渴，渴甚治之以泄之可止。是故子午之歲，太陰升天，主窒天衝，勝之不前。又或遇壬子，木運先天而至者，中木遇抑之也。","bh":"日久化为郁气，就有大风摧折拉拔，树木折断陨落，鸣声紊乱。民病猝然中风、半身痹阻，手足麻木不仁。所以巳亥之年，君火升天，主受天蓬（水气）窒塞，被胜而不能前进。又逢厥阴木迁正，则少阴未能升天，水运已至其中。君火欲升，而中运水气抑制它，升而不前，就会清寒之气又发作，寒冷生于早晚。民病阳气伏郁在内，从而内生烦热，心神惊悸，寒热交替发作。日久成郁，就是暴热到来，赤风肿翳，化为疫疠，温疠暖作，赤气彰明而化为火疫，都见烦躁而口渴，渴得厉害的用泻法治之可以止住。所以子午之年，太阴升天，主受天冲（木气）窒塞，被胜而不能前进。又或遇壬子，木运先天时而至的，就是中运木气抑制它。","notes":[],"pending":false},{"id":"sw73-4","tags":[],"yw":"升天不前，即風埃四起，時舉埃昏，雨溼不化。民病風厥涎潮，偏痹不隨，脹滿。久而伏鬱，即黃埃化疫也，民病夭亡，臉肢府黃膽滿閉，溼令弗布，雨化乃微。是故丑未之年，少陽升天，主窒天蓬，勝之不前。又或遇太陰未遷正者，即少陽未升天也，水運以至者。升天不前，即寒反布，凜冽如冬，水復涸，冰再結，暄暖乍作，冷復布之，寒暄不時。民病伏陽在內，煩熱生中，心神驚駭，寒熱間爭。以成久鬱，即暴熱乃生，赤風氣瞳翳，化成鬱癘，乃化作伏熱內煩，痹而生厥，甚則血溢。","bh":"升天不能前进，就会风尘四起，时常尘埃昏蒙，雨湿不能生化。民病风厥、涎水上涌，偏枯不遂，胀满。日久伏郁，就是黄埃化为疫气，民病夭亡，颜面肢体发黄、黄疸胀满便闭，湿令不能布行，雨化于是微弱。所以丑未之年，少阳升天，主受天蓬（水气）窒塞，被胜而不能前进。又或遇太阴未能迁正的，就是少阳未能升天，水运已经到来。升天不前，就会寒冷反而布行，凛冽如同冬日，水又干涸，冰再凝结，温暖忽而发作，寒冷又复布散，寒暖不按时令。民病阳气伏郁在内，烦热生于中焦，心神惊骇，寒热相互交争。日久成郁，就是暴热于是发生，赤风气肿翳，化成郁疠，就化为伏热内烦，痹阻而生厥逆，严重的则血外溢。","notes":[],"pending":false},{"id":"sw73-5","tags":[],"yw":"是故寅申之年，陽明升天，主窒天英，勝之不前。又或遇戊申戊寅，火運先天而至。金欲升天，火運抑之，升之不前，實時雨不降，西風數舉，鹹滷燥生。民病上熱，喘嗽血溢。久而化鬱，即白埃翳霧，清生殺氣，民病脅滿悲傷，寒鼽嚏嗌干，手拆皮膚燥。是故卯酉之年，太陽升天，主窒天芮，勝之不前。又遇陽明未遷正者，即太陽未升天也，土運以至。水欲升天，土運抑之，升之不前，即溼而熱蒸，寒生兩間。民病注下，食不及化。久而成鬱，冷來客熱，冰雹卒至。","bh":"所以寅申之年，阳明升天，主受天英（火气）窒塞，被胜而不能前进。又或遇戊申、戊寅，火运先天时而至。金气欲升天，火运抑制它，升而不前，就会应时之雨不降，西风频频兴起，咸卤干燥之气发生。民病上部热，喘促咳嗽、血外溢。日久化为郁气，就是白埃翳雾，清气生而杀气行，民病胁肋胀满悲伤，寒鼽喷嚏、咽喉干燥，手部皲裂皮肤干燥。所以卯酉之年，太阳升天，主受天芮（土气）窒塞，被胜而不能前进。又遇阳明未能迁正的，就是太阳未能升天，土运已经到来。水气欲升天，土运抑制它，升而不前，就会湿气蒸郁而生热，寒气生于天地两间。民病泄泻如注，饮食不能消化。日久成郁，冷气来客于热，冰雹猝然降下。","notes":[],"pending":false},{"id":"sw73-6","tags":[],"yw":"民病厥逆而噦，熱生於內，氣痹於外，足脛疼，反生心悸懊熱，暴煩而復厥。黃帝曰∶升之不前，餘已盡知其旨。願聞降之不下，可得明乎？岐伯曰∶悉乎哉問！是之謂天地微旨，可以盡陳斯道，所謂升已必降也。至天三年，次歲必降，降而入地，始爲左間也。如此升降往來，命之六紀者矣。是故丑未之歲，厥陰降地，主窒地，勝而不前。又或遇少陰未退位，即厥陰未降下，金運以至中。金運承之，降之未下，抑之變鬱，木欲降下，金承之，降而不下，蒼埃遠見，白氣承之，風舉埃昏，清躁行殺，霜露復下，肅殺布令。","bh":"民病厥逆而呃逆，热生于内，气痹阻于外，足胫疼痛，反而发生心悸烦热，突然烦躁又转为厥逆。黄帝说：升之不前，我已经完全知道其中的意旨了。希望听听降之不下，可以明白吗？岐伯说：问得真周详啊！这是天地的微妙意旨，可以尽陈这一道理，也就是所谓升已必降。升至天三年，次年必降，降而入地，才成为左间。如此升降往来，叫作六纪。所以丑未之年，厥阴降地，主受地（地晶，金气）窒塞，被胜而不能前进。又或遇少阴未退位，就是厥阴未能降下，金运已至中运。金运承制它，降而不能下，被抑而变为郁气，木欲降下，金气承之，降而不下，苍埃远见，白气承之，风起尘埃昏蒙，清燥行其杀令，霜露又降，肃杀布行其令。","notes":[],"pending":false},{"id":"sw73-7","tags":[],"yw":"久而不降，抑之化鬱，即作風躁相伏，暄而反清，草木萌動，殺霜乃下，蟄蟲未見，懼清傷髒。是故寅申之歲，少陰降地，主窒地玄，勝之不入。又或遇丙申丙寅，水運太過，先天而至。君火欲降，水運承之，降而不下，即彤雲才見，黑氣反生，暄暖如舒，寒常布雪，凜冽復作，天雲慘悽。久而不降，伏之化鬱，寒勝復熱，赤風化疫，民病面赤心煩，頭痛目眩也，赤氣彰而溫病欲作也。是故卯酉之歲，太陰降地，主窒地蒼，勝之不入。又或少陽未退位者，即太陰未得降也，或木運以至。","bh":"久而不降，被抑而化郁，就作风与燥相伏，温暖反变清冷，草木萌动，肃杀之霜却降下，蛰虫不出现，惧怕清气伤脏。所以寅申之年，少阴降地，主受地玄（水气）窒塞，被胜而不能入。又或遇丙申、丙寅，水运太过，先天时而至。君火欲降，水运承制它，降而不下，就会彤云才现，黑气反生，温暖好像舒展，寒冷常布霜雪，凛冽又发作，天云惨凄。久而不降，伏郁而化，寒胜之后又复热，赤风化疫，民病面赤心烦，头痛目眩，赤气彰明而温病将要发作。所以卯酉之年，太阴降地，主受地苍（木气）窒塞，被胜而不能入。又或遇少阳未退位的，就是太阴未能得降，或木运已经到来。","notes":[],"pending":false},{"id":"sw73-8","tags":[],"yw":"木運承之，降而不下，即黃雲見而青霞彰，鬱蒸作而大風，霧翳埃勝，折損乃作。久而不降也，伏之化鬱，天埃黃氣，地布溼蒸，民病四肢不舉，昏眩肢節痛，腹滿填臆。是故辰戌之歲，少陽降地，主窒地玄，勝之不入。又或遇水運太過，先天而至也。水運承之，水降不下，即彤雲才見，黑氣反生，暄暖欲生，冷氣卒至，甚即冰雹也。久而不降，伏之化鬱，冷氣復熱，赤風化疫，民病面赤心煩，頭痛目眩也，赤氣彰而熱病欲作也。是故巳亥之歲，陽明降地，主窒地彤，勝而不入。","bh":"木运承制它，降而不下，就会黄云出现而青霞彰明，郁蒸发作而成大风，雾气翳障尘埃胜作，折损于是发生。久而不降，伏郁而化，天布黄埃之气，地布湿蒸，民病四肢不能举动，昏眩、肢节疼痛，腹满而胸中填塞。所以辰戌之年，少阳降地，主受地玄（水气）窒塞，被胜而不能入。又或遇水运太过，先天时而至。水运承制它，水降而不能下，就会彤云才现，黑气反生，温暖将要发生，冷气猝然而至，严重的就下冰雹。久而不降，伏郁而化，冷气之后又复热，赤风化疫，民病面赤心烦，头痛目眩，赤气彰明而热病将要发作。所以巳亥之年，阳明降地，主受地彤（火气）窒塞，被胜而不能入。","notes":[],"pending":false},{"id":"sw73-9","tags":[],"yw":"又或遇太陰未退位，即少陽未得降，即火運以至之。火運承之不下，即天清而肅，赤氣乃彰，暄熱反作。民皆昏倦，夜臥不安，咽干引飲，懊熱內煩，天清朝暮，暄還復作。久而不降，伏之化鬱，天清薄寒，遠生白氣。民病掉眩，手足直而不仁，兩脅作痛，滿目KTKT。是故子午之年，太陽降地，主窒地阜勝之，降而不入。又或遇土運太過，先天而至。土運承之，降而不入，即天彰黑氣，暝暗悽慘，才施黃埃而布溼，寒化令氣，蒸溼復令。久而不降，伏之化鬱，民病大厥，四肢重怠，陰萎少力，天布沉陰，蒸溼間作。","bh":"又或遇太阴未退位，就是少阳未能得降，就是火运已经到来。火运承之而不能下降，就会天气清肃，赤气于是彰明，温暖反而发作。人们都昏沉倦怠，夜卧不安，咽喉干燥而引饮，烦热郁结于内，天气清朗于早晚，温暖又复发作。久而不降，伏郁而化，天气清薄而微寒，远处生出白气。民病振摇眩晕，手足僵直而麻木不仁，两胁作痛，满目视物不明。所以子午之年，太阳降地，主受地阜（土气）所胜，降而不能入。又或遇土运太过，先天时而至。土运承制它，降而不能入，就是天彰黑气，昏暗凄惨，才施行黄埃而布湿令，寒化行令之气，蒸湿又复行令。久而不降，伏郁而化，民病大厥，四肢沉重倦怠，阴痿而乏力，天布沉阴，蒸湿时作。","notes":[],"pending":false},{"id":"sw73-10","tags":[],"yw":"帝曰∶升降不前，晰知其宗，願聞遷正，可得明乎？岐伯曰∶正司中位，是謂遷正位，司天不得其遷正者，即前司天以過交司之日。即遇司天太過有餘日也，即仍舊治天數，新司天未得遷正也。厥陰不遷正，即風暄不時，花卉萎瘁，民病淋溲，目系轉，轉筋喜怒，小便赤。風欲令而寒由不去，溫暄不正，春正失時。少陰不遷正，即冷氣不退，春冷後寒，暄暖不時。民病寒熱，四肢煩痛，腰脊強直。木氣雖有餘，位不過於君火也。太陰不遷正，即雲雨失令，萬物枯焦，當生不發。","bh":"黄帝说：升降不前，已经明白它的宗旨，希望听听迁正，可以明白吗？岐伯说：正当其位而司中位，这叫迁正位，司天不能迁正的，就是前司天已过交司之日，也就是遇到司天太过而有余日，就仍旧治理天数，新司天未能迁正。厥阴不迁正，就会风暖不按时令，花卉枯萎，民病淋溲、目系转急、转筋、喜怒无常、小便赤。风要行令而寒气犹且不离去，温暖不正，春令失去时令。少阴不迁正，就是冷气不退，春冷之后又寒，温暖不按时令。民病寒热，四肢烦痛，腰脊强直。木气虽有余，其位不能超过君火。太阴不迁正，就是云雨失去时令，万物枯焦，当生而不能生发。","notes":[],"pending":false},{"id":"sw73-11","tags":[],"yw":"民病手足肢節腫滿，大腹水腫，填臆不食，飧泄脅滿，四肢不舉。雨化欲令，熱猶治之，溫煦於氣，亢而不澤。少陽不遷正，即炎灼弗令，苗莠不榮，酷暑於秋，肅殺晚至，霜露不時。民病瘧骨熱，心悸驚駭，甚時血溢。陽明不遷正，則暑化於前，肅殺於後，草木反榮。民病寒熱鼽嚏，皮毛折，爪甲枯焦，甚則喘嗽息高，悲傷不樂。熱化乃布，燥化未令，即清勁未行，肺金復病。太陽不遷正，即冬清反寒，易令於春，殺霜在前，寒冰於後，陽光復治，凜冽不作，雲待時。","bh":"民病手足肢节肿满，大腹水肿，胸中填塞不食，飧泄、胁胀满，四肢不能举动。雨化要行令，热气犹且主治，温煦于气，亢盛而不润泽。少阳不迁正，就是炎热不得行令，苗莠不能繁荣，酷暑延于秋，肃杀晚到，霜露不按时令。民病疟疾、骨中发热，心悸惊骇，严重时常血外溢。阳明不迁正，就暑化在前，肃杀在后，草木反而繁荣。民病寒热、鼽嚏，皮毛枯折，爪甲枯焦，严重的则喘促咳嗽、息高，悲伤不乐。热气布化，燥化未能行令，就是清劲之气未能施行，肺金又病。太阳不迁正，就是冬季清凉反变为寒，改令于春，肃霜在前，寒冰在后，阳光又复主治，凛冽不作，云待时而变。","notes":[],"pending":false},{"id":"sw73-12","tags":[],"yw":"民病溫癘至，喉閉溢干，煩燥而渴，喘息而有音也。寒化待燥，猶治天氣，過失序，與民作災。帝曰∶遷正早晚，以命其旨，願聞退位，可得明哉？岐伯曰∶所謂不退者，即天數未終，即天數有餘，名曰復布政，故名曰再治天也，即天令如故而不退位也。厥陰不退位，即大風早舉，時雨不降，溼令不化，民病溫疫，疵廢風生，民病皆肢節痛，頭目痛，伏熱內煩，咽喉干引飲。少陰不退位，即溫生春冬，蟄蟲早至，草木發生，民病膈熱咽干，血溢驚駭，小便赤澀，丹瘤瘡瘍留毒。","bh":"民病温疠到来，咽喉闭阻、干燥，烦躁而口渴，喘息而有声。寒化等待燥气，犹且主治天气，过失失序，给百姓造成灾害。黄帝说：迁正的早晚，已承明它的意旨，希望听听退位，可以明白吗？岐伯说：所谓不退，就是天数未终，就是天数有余，名叫复布政，所以名叫再治天，也就是天令如故而不得退位。厥阴不退位，就是大风早起，应时之雨不降，湿令不能生化，民病温疫，疵废而风气发生，民病都见肢节疼痛、头目痛，伏热内烦，咽喉干燥引饮。少阴不退位，就是温气生于春冬，蛰虫早到，草木发生，民病膈热咽干，血外溢、惊骇，小便赤涩，丹瘤疮疡留毒。","notes":[],"pending":false},{"id":"sw73-13","tags":[],"yw":"太陰不退位，而取寒暑不時，埃昏布作，溼令不去，民病四肢少力，食飲不下，泄注淋滿，足脛寒，陰萎閉塞，失溺小便數。少陽不退位，即熱生於春，暑乃後化，冬溫不凍，流水不冰，蟄蟲出見，民病少氣，寒熱更作，便血上熱，小腹堅滿，小便赤沃，甚則血溢。陽明不退位，即春生清冷，草木晚榮，寒熱間作，民病嘔吐暴注，食飲不下，大便干燥，四肢不舉，目瞑掉眩。帝曰∶天歲早晚，餘以知之，願聞地數，可得聞乎？岐伯曰∶地下遷正升天及退位不前之法，即地土產化，萬物失時之化也。","bh":"太阴不退位，于是寒暑不按时令，埃昏布作，湿令不去，民病四肢少力，饮食不下，泄泻如注、淋沥胀满，足胫寒冷，阴痿闭塞，遗尿、小便频数。少阳不退位，就是热生于春，暑热延后而化，冬季温暖不冻，流水不结冰，蛰虫出现，民病少气，寒热交替发作，便血、上部热，小腹坚硬胀满，小便赤浊，严重的则血外溢。阳明不退位，就是春生清冷，草木晚荣，寒热交替发作，民病呕吐、猝然暴泻，饮食不下，大便干燥，四肢不能举动，目昏而振摇眩晕。黄帝说：天岁的早晚，我已经知道了，希望听听地数，可以听说吗？岐伯说：地下迁正、升天以及退位不前之法，就是指地土产育生化，万物失去时令的变化。","notes":[],"pending":false},{"id":"sw73-14","tags":[],"yw":"帝曰∶餘聞天地二甲子，十干十二支。上下經緯天地，數有迭移，失守其位，可得昭乎？岐伯曰∶失之迭位者，謂雖得歲正，未得正位之司，即四時不節，即生大疫。注《玄珠密語》雲∶陽年三十年，除六年天刑，計有太過二十四年，除此六年，皆作太過之用，令不然之旨。今言迭支迭位，皆可作其不及也。假令甲子陽年，土運太窒，如癸亥天數有餘者，年雖交得甲子，厥陰猶尚治天，地已遷正，陽明在泉，去歲少陽以作右間，即厥陰之地陽明，故不相和奉者也。","bh":"黄帝说：我听说天地二甲子，十干配十二支，上下经纬天地，数理有迭相迁移，失去它们的位次，可以昭明吗？岐伯说：失于迭位的，是说虽得岁之正，却未得正位之司，就使四时不合节度，就发生大疫。注《玄珠密语》说：阳年三十年，除去六年天刑，计有太过二十四年，除去这六年，都作太过之用，令它不然的意旨。现在说的迭支迭位，都可以作它的不及来看。假令甲子阳年，土运太为窒塞，如果癸亥天数有余的，虽然年岁已交得甲子，厥阴仍然还在治天，地已经迁正，阳明在泉，去年少阳已作右间，也就是厥阴之地（天气）与阳明（地气），所以不相和奉。","notes":[],"pending":false},{"id":"sw73-15","tags":[],"yw":"癸巳相會，土運太過，虛反受木勝，故非太過也，何以言土運太過，況黃鍾不應太窒，木既勝而金還復，金既復而少陰如至，即木勝如火而金復微，如此則甲己失守，後三年化成土疫，晚至丁卯，早至丙寅，土疫至也，大小善惡，推其天地，詳乎太一。又只如甲子年，如甲至子而合，應交司而治天，即下己卯未遷正，而戊寅少陽未退位者，亦甲己下有合也，即土運非太過，而木乃乘虛而勝土也，金次又行復勝之，即反邪化也。陰陽天地殊異爾，故其大小善惡，一如天地之法旨也。","bh":"癸巳相会，土运太过，反虚而受木所胜，所以并非太过，怎么说土运太过呢，何况黄钟不应而太室，木既胜而金又来复，金既复而少阴如此到来，就是木胜如火而金复微弱，如此则甲己失守，过后三年化成土疫，晚至丁卯，早至丙寅，土疫就到了，大小善恶，要推求它的天地，详察于太一。又比如甲子年，如果甲至子而相合，应交接司气而治天，就是下位己卯未能迁正，而戊寅少阳未能退位的，也是甲己下有相合，就是土运并非太过，而木就乘虚而胜土，金其次又行报复而胜之，就是反邪之气。阴阳天地殊异如此，所以它的大小善恶，一如天地的法度意旨。","notes":[],"pending":false},{"id":"sw73-16","tags":[],"yw":"假令丙寅陽年太過，如乙丑天數有餘者，雖交得丙寅，太陰尚治天也，地已遷正，厥陰司地，去歲太陽以作右間，即天太陰而地厥陰，故地不奉天化也。乙辛相會，水運太虛，反受土勝，故非太過，即太簇之管，太羽不應，土勝而雨化，水復即風，此者丙辛失守其會，後三年化成水疫，晚至己巳，早至戊辰，甚即速，微即徐，水疫至也，大小善惡推其天地數，乃太乙遊宮。又只如丙寅年，丙至寅且合，應交司而治天，即辛巳未得遷正，而庚辰太陽未退位者，亦丙辛不合德也，即水運亦小虛而小勝，或有復，後三年化癘，名曰水癘，其狀如水疫，治法如前。","bh":"假令丙寅阳年太过，如果乙丑天数有余的，虽然已交得丙寅，太阴还在治天，地已迁正，厥阴司地，去年太阳已作右间，就是天为太阴而地为厥阴，所以地不奉天之化。乙辛相会，水运太虚，反受土所胜，所以并非太过，就是太簇之管，太羽不相呼应，土胜而雨化流行，水复则化为风，这样丙辛失守其会，过后三年化成水疫，晚至己巳，早至戊辰，甚的就急速，微的就徐缓，水疫就到了，大小善恶要推求天地的数，就是太乙游宫。又比如丙寅年，丙至寅并且相合，应交接司气而治天，就是辛巳未能迁正，而庚辰太阳未能退位的，也是丙辛不合德，就是水运也小虚而小胜，或者有报复，过后三年化为疠气，名叫水疠，它的症状如同水疫，治法同前。","notes":[],"pending":false},{"id":"sw73-17","tags":[],"yw":"假令庚辰陽年太過，如己卯天數有餘者，雖交得庚辰年也，陽明猶尚治天，地已遷正，太陰司地，去歲少陰以作右間，即天陽明而地太陰也，故地下奉天也。乙巳相會，金運太虛，反受火勝，故非太過也，即姑洗之管，太商不應，火勝熱化，水復寒刑，此乙庚失守，其後三年化成金疫也，速至壬午，徐至癸未，金疫至也，大小善惡，推本年天數及太一也。又只如庚辰，如庚至辰，且應交司而治天，即下乙未未得遷正者，即地甲午少陰未退位者，且乙庚不合德也，即下乙未，干失剛，亦金運小虛也，有小勝或無復，後三年化癘，名曰金癘，其狀如金疫也，治法如前。","bh":"假令庚辰阳年太过，如果己卯天数有余的，虽然已交得庚辰年，阳明仍然还在治天，地已迁正，太阴司地，去年少阴已作右间，就是天为阳明而地为太阴，所以地不奉天。乙巳相会，金运太虚，反受火所胜，所以并非太过，就是姑洗之管，太商不相呼应，火胜则热化流行，水复则寒气相刑，这样乙庚失守，其后三年化成金疫，速至壬午，徐至癸未，金疫就到了，大小善恶，要推求本年天数及太一。又比如庚辰，庚至辰，且应交接司气而治天，就是下位乙未未能迁正，就是地支甲午少阴未能退位的，就是乙庚不合德，也就是下位乙未柔干失刚，也是金运小虚，有小胜或者无复，过后三年化为疠气，名叫金疠，它的症状如同金疫，治法同前。","notes":[],"pending":false},{"id":"sw73-18","tags":[],"yw":"假令壬午陽年太過，如辛巳天數有餘者，雖交後壬午年也，厥陰猶尚治天，地已遷正，陽明在泉，去歲丙申少陽以作右間，即天厥陰而地陽明，故地不奉天者也。丁辛相合會，木運太虛，反受金勝，故非太過也，即蕤賓之管，太角不應，金行燥勝，火化熱復，甚即速，微即徐，疫至大小善惡，推疫至之年天數及太一。又只如壬至午，且應交司而治之，即下丁酉未得遷正者，即地下丙申少陽未得退位者，見丁壬不合德也，即丁柔干失剛，亦木運小虛也，有小勝小復。","bh":"假令壬午阳年太过，如果辛巳天数有余的，虽然交年之后是壬午年，厥阴仍然还在治天，地已迁正，阳明在泉，去年丙申少阳已作右间，就是天为厥阴而地为阳明，所以地不奉天。丁辛相合而会，木运太虚，反受金所胜，所以并非太过，就是蕤宾之管，太角不相呼应，金行燥气而胜，火化热气来复，甚的就急速，微的就徐缓，疫至的大小善恶，要推求疫至之年的天数及太一。又比如壬至午，且应交接司气而治天，就是下位丁酉未能迁正，就是地下丙申少阳未能退位，可见丁壬不合德，就是丁柔干失刚，也是木运小虚，有小胜小复。","notes":[],"pending":false},{"id":"sw73-19","tags":[],"yw":"後三年化癘，名曰木癘，其狀如風疫，法治如前。假令戊申陽年太過，如丁未天數太過者，雖交得戊申年也，太陰猶尚治天，地已遷正，厥陰在泉，去歲壬戌太陽以退位作右間，即天丁未，地癸亥，故地不奉天化也。丁癸相會，火運太虛，反受水勝，故非太過也，即夷則之管，上太徵不應，此戊癸失守其會，後三年化疫也，速至庚戌，大小善惡，推疫至之年天數及太一。又只如戊申，如戊至申，且應交司而治天，即下癸亥未得遷正者，即地下壬戌太陽未退位者，見戊癸未合德也，即下癸柔干失剛，見火運小虛也，有小勝或無復也，後三年化癘，名曰火癘也，治法如前，治之法可寒之泄之。","bh":"过后三年化为疠气，名叫木疠，它的症状如同风疫，治法同前。假令戊申阳年太过，如果丁未天数太过的，虽然已交得戊申年，太阴仍然还在治天，地已迁正，厥阴在泉，去年壬戌太阳已经退位而作右间，就是天为丁未，地为癸亥，所以地不奉天之化。丁癸相会，火运太虚，反受水所胜，所以并非太过，就是夷则之管，上太征不相呼应，这样戊癸失守其会，过后三年化为疫气，速至庚戌，大小善恶，要推求疫至之年的天数及太一。又比如戊申，戊至申，且应交接司气而治天，就是下位癸亥未能迁正，就是地下壬戌太阳未能退位，可见戊癸未能合德，就是下位癸柔干失刚，可见火运小虚，有小胜或者无复，过后三年化为疠气，名叫火疠，治法同前，治的方法可用寒法、可用泻法。","notes":[],"pending":false},{"id":"sw73-20","tags":[],"yw":"黃帝曰∶人氣不足，天氣如虛，人神失守，神光不聚，邪鬼干人，致有夭亡，可得聞乎？岐伯曰∶人之五髒，一髒不足，又會天虛，感邪之至也。人憂愁思慮即傷心，又或遇少陰司天，天數不及，太陰作接間至，即謂天虛也，此即人氣天氣同虛也。又遇驚而奪精，汗出於心，因而三虛，神明失守，心爲君主之官，神明出焉，神失守位，即神遊上丹田，在帝太一帝君泥丸宮下，神既失守，神光不聚，卻遇火不及之歲，有黑屍鬼見之，令人暴亡。人飲食勞倦即傷脾，又或遇太陰司天，天數不及，即少陽作接間至，即謂之虛也，此即人氣虛而天氣虛也。","bh":"黄帝说：人的正气不足，天气又虚，人的神失守其位，神光不能聚敛，邪鬼干犯于人，致使夭折死亡，可以听听吗？岐伯说：人的五脏，有一脏不足，又遇上天气虚，就容易感受邪气的到来。人忧愁思虑就会伤心，又或遇少阴司天，天数不及，太阴作接替的间气而至，就叫作天虚，这就是人气与天气同虚。又遇惊恐而夺去精气，汗出于心，因而成为三虚，神明失守，心是君主之官，神明由此而出，神失守其位，就是神游于上丹田，在帝太一帝君泥丸宫之下，神既失守，神光不聚，又遇火运不及之年，有黑尸鬼出现，使人突然死亡。人饮食不节、劳倦就会伤脾，又或遇太阴司天，天数不及，就是少阳作接替的间气而至，这就叫虚，这就是人气虚而天气也虚。","notes":[],"pending":false},{"id":"sw73-21","tags":[],"yw":"又遇飲食飽甚，汗出於胃，醉飽行房，汗出於脾，因而三虛，脾神失守，脾爲諫議之官，智周出焉，神既失守，神光失位而不聚也，卻遇土不及之年，或己年或甲年失守，或太陰天虛，青屍鬼見之，令人卒亡。人久坐溼地，強力入水即傷腎，腎爲作強之官，伎巧出焉，因而三虛，腎神失守，神志失位，神光不聚，卻遇水不及之年，或辛不會符，或丙年失守，或太陽司天虛，有黃屍鬼至，見之令人暴亡。人或恚怒，氣逆上而不下，即傷肝也。又遇厥陰司天，天數不及，即少陰作接間至，是謂天虛也，此謂天虛人虛也。","bh":"又遇饮食过饱，汗出于胃，醉饱而行房事，汗出于脾，因而成为三虚，脾神失守，脾是谏议之官，智虑周全由此而出，神既失守，神光失其位而不能聚敛，又遇土运不及之年，或己年或甲年失守，或太阴司天虚，青尸鬼出现，使人猝然死亡。人久坐湿地，强力入水就会伤肾，肾是作强之官，伎巧由此而出，因而成为三虚，肾神失守，神志失其位，神光不聚，又遇水运不及之年，或辛年不与会符，或丙年失守，或太阳司天虚，有黄尸鬼到来，见到它使人突然死亡。人或者忿怒，气逆于上而不能下行，就会伤肝。又遇厥阴司天，天数不及，就是少阴作接替的间气而至，这叫作天虚，这就是天虚人虚。","notes":[],"pending":false},{"id":"sw73-22","tags":[],"yw":"又遇疾走恐懼，汗出於肝，肝爲將軍之官，謀慮出焉，神位失守，神光不聚，又遇木不及年，或丁年不符，或壬年失守，或厥陰司天虛也，有白屍鬼見之，令人暴亡也。以上五失守者，天虛而人虛也，神遊失守其位，即有五屍鬼干人，令人暴亡也，謂之曰屍厥。人犯五神易位，即神光不圓也，非但屍鬼，即一切邪犯者，皆是神失守位故也。此謂得守者生，失守者死，得神者昌，失神者亡。<目錄>卷第二十二","bh":"又遇疾走恐惧，汗出于肝，肝是将军之官，谋虑由此而出，神位失守，神光不聚，又遇木运不及之年，或丁年不与符会，或壬年失守，或厥阴司天虚，有白尸鬼出现，使人突然死亡。以上五种失守，都是天虚而人虚，神游而失守其位，就有五尸鬼干犯于人，使人突然死亡，这叫作尸厥。人犯了五神易位，就是神光不圆满，不但尸鬼，就是一切邪气侵犯的，都是因为神失守其位的缘故。这就是所谓得守者生，失守者死，得神者昌，失神者亡。（本篇见于卷第二十二。）","notes":[],"pending":false}]},
{"id":"sw74","book":"素问","no":74,"title":"至真要大论","titleTw":"至真要大論","tags":["yunqi","ci","zhenfa"],"brief":"论六气司天在泉之化、胜复邪胜的病候与治法，兼及标本中气、病机十九条、君臣佐使与逆从反治。","pending":false,"sections":[{"id":"sw74-1","tags":[],"yw":"黃帝問曰∶五氣交合，盈虛更作，餘知之矣。六氣分治，司天地者，其至何如？岐伯再拜對曰∶明乎哉問也！天地之大紀，人神之通應也。帝曰∶願聞上合昭昭，下合冥冥奈何？岐伯曰∶此道之所主，工之所疑也。帝曰∶願聞其道也。岐伯曰∶厥陰司天，其化以風；少陰司天，其化以熱；太陰司天，其化以溼；少陽司天，其化以火；陽明司天，其化以燥；太陽司天，其化以寒。以所臨髒位，命其病者也。帝曰∶地化奈何？岐伯曰∶司天同候，間氣皆然。","bh":"黄帝问道：五气交相会合，盈虚更相为用，我已经知道了。六气分治，司天在泉的，它的到来怎样？岐伯再拜回答说：问得真高明啊！这是天地的大纲纪，人神与之相通应的。黄帝说：希望听听它上合于昭明、下合于幽冥的道理如何？岐伯说：这是道所主司的，也是医工所疑惑的。黄帝说：希望听听这道。岐伯说：厥阴司天，它以风化为其化；少阴司天，它以热化为其化；太阴司天，它以湿化为其化；少阳司天，它以火化为其化；阳明司天，它以燥化为其化；太阳司天，它以寒化为其化。根据它所临的脏位，来确定它的病。黄帝说：在泉之化怎样？岐伯说：与司天同候，间气也都是这样。","notes":[],"pending":false},{"id":"sw74-2","tags":[],"yw":"帝曰∶間氣何謂？岐伯曰∶司左右者，是謂間氣也。帝曰∶何以異之？岐伯曰∶主歲者紀歲，間氣者紀步也。帝曰∶善。歲主奈何？岐伯曰∶厥陰司天爲風化，在泉爲酸化，司氣爲蒼化，間氣爲動化。少陰司天爲熱化，在泉爲苦化，不司氣化，居氣爲灼化。太陰司天爲溼化，在泉爲甘化，司氣爲化，間氣爲柔化。少陽司天爲火化，在泉爲苦化，司氣爲丹化，間氣爲明化。陽明司天爲燥化，在泉爲辛化，司氣爲素化，間氣爲清化。太陽司天爲寒化，在泉爲鹹化，司氣爲玄化，間氣爲藏化。","bh":"黄帝说：什么叫间气？岐伯说：分司左右的，就叫作间气。黄帝说：怎样区别它？岐伯说：主岁的纪年的气，间气纪的是步。黄帝说：好。岁主怎样？岐伯说：厥阴司天为风化，在泉为酸化，司气为苍化，间气为动化。少阴司天为热化，在泉为苦化，不司气化，居气为灼化。太阴司天为湿化，在泉为甘化，司气为（黔）化，间气为柔化。少阳司天为火化，在泉为苦化，司气为丹化，间气为明化。阳明司天为燥化，在泉为辛化，司气为素化，间气为清化。太阳司天为寒化，在泉为咸化，司气为玄化，间气为藏化。","notes":[],"pending":false},{"id":"sw74-3","tags":[],"yw":"故治病者，必明六化分治，五味五色所生，五髒所宜，乃可以言盈虛病生之緒也。帝曰∶厥陰在泉而酸化先，餘知之矣。風化之行也何如？岐伯曰∶風行於地，所謂本也，餘氣同法。本乎天者，天之氣也，本乎地者，地之氣也，天地合氣，六節分而萬物化生矣。故曰∶謹候氣宜，無失病機。此之謂也。帝曰∶其主病何如？岐伯曰∶司歲備物，則無遺主矣。帝曰∶先歲物何也？岐伯曰∶天地之專精也。帝曰∶司氣者何如？岐伯曰∶司氣者主歲同，然有餘不足也。","bh":"所以治病的，必须明了六化的分治，五味五色的所生，五脏的所宜，才可以谈论盈虚与疾病发生的头绪。黄帝说：厥阴在泉而酸化在先，我已经知道了。风化的运行怎样？岐伯说：风行于地，就是所谓本，其余五气同法。本于天的，是天之气；本于地的，是地之气；天地合气，六节分而万物化生。所以说：谨慎候察气之所宜，不要失误了病机。说的就是这个。黄帝说：它主病怎样？岐伯说：按岁气所主而备药物，就没有遗漏主病的了。黄帝说：先于岁气的药物是什么？岐伯说：那是天地的专精。黄帝说：司气的怎样？岐伯说：司气与主岁的相同，然而有过与不及之分。","notes":[],"pending":false},{"id":"sw74-4","tags":[],"yw":"帝曰∶非司歲物何謂也？岐伯曰∶散也，故質同而異等也，氣味有薄濃，性用有躁靜，治保有多少，力化有淺深，此之謂也。帝曰∶歲主藏害何謂？岐伯曰∶以所不勝命之，則其要也。帝曰∶治之奈何？岐伯曰∶上淫於下，所勝平之，外淫於內，所勝治之。帝曰∶善。平氣何如？岐伯曰∶謹察陰陽所在而調之，以平爲期，正者正治，反者反治。帝曰∶夫子言察陰陽所在而調之，論言人迎與寸口相應，若引繩小大齊等，命曰平，陰之所在寸口何如？岐伯曰∶視歲南北，可知之矣。","bh":"黄帝说：不是司岁的药物怎么讲？岐伯说：那是散气，所以质同而等级不同，气味有厚薄，性用有躁静，治保有多少，力化有浅深，说的就是这个。黄帝说：岁主之藏受伤害怎么讲？岐伯说：以它所不胜之脏来命名，就是它的要领。黄帝说：怎样治它？岐伯说：上淫于下的，以所胜之气平之；外淫于内的，以所胜之气治之。黄帝说：好。平气怎样？岐伯说：谨慎审察阴阳所在而加以调治，以平为期；正的用正治，反的用反治。黄帝说：夫子说审察阴阳所在而调治它，论中说人迎与寸口相应，如同引绳那样大小齐等，叫作平；阴之所在在寸口怎样？岐伯说：看岁气的南北政，就可以知道了。","notes":[],"pending":false},{"id":"sw74-5","tags":[],"yw":"帝曰∶願卒聞之。岐伯曰∶北政之歲，少陰在泉，則寸口不應；厥陰在泉，則右不應；太陰在泉，則左不應。南政之歲，少陰司天，則寸口不應；厥陰司天，則右不應；太陰司天，則左不應。諸不應者，反其診則見矣。帝曰∶尺候何如？岐伯曰∶北政之歲，三陰在下，則寸不應；三陰在上，則尺不應。南政之歲，三陰在天，則寸不應；三陰在泉，則尺不應。左右同。故曰∶知其要者，一言而終，不知其要，流散無窮。此之謂也。帝曰∶善。天地之氣，內淫而病何如？岐伯曰∶歲厥陰在泉，風淫所勝，則地氣不明，平野昧，草乃早秀。","bh":"黄帝说：希望详尽地听听。岐伯说：北政之年，少阴在泉，则寸口不应；厥阴在泉，则右脉不应；太阴在泉，则左脉不应。南政之年，少阴司天，则寸口不应；厥阴司天，则右脉不应；太阴司天，则左脉不应。凡不应的，反其诊就可以见到了。黄帝说：尺部的诊候怎样？岐伯说：北政之年，三阴在下，则寸不应；三阴在上，则尺不应。南政之年，三阴在天，则寸不应；三阴在泉，则尺不应。左右相同。所以说：知道要领的，一句话就说到头了；不知道要领的，就流散无穷。说的就是这个。黄帝说：好。天地之气，内淫而发病怎样？岐伯说：岁厥阴在泉，风淫所胜，则地气不明，平野昏昧，草木提早开花结实。","notes":[],"pending":false},{"id":"sw74-6","tags":[],"yw":"民病灑灑振寒，善伸數欠，心痛支滿，兩脅裏急，飲食不下，膈咽不通，食則嘔，腹脹善噫，得後與氣，則快然如衰，身體皆重。歲少陰在泉，熱淫所勝，則焰浮川澤，陰處反明。民病腹中常鳴，氣上衝胸，喘不能久立，寒熱皮膚痛，目瞑齒痛腫，惡寒發熱如瘧，少腹中痛腹大，蟄蟲不藏。歲太陰在泉，草乃早榮，溼淫所勝，則埃昏巖谷，黃反見黑，至陰之交。民病飲積，心痛，耳聾渾渾，嗌腫喉痹，陰病血見，少腹痛腫，不得小便，病衝頭痛，目似脫，項似拔，腰似折，髀不可以回，如結，如別。","bh":"民病洒洒然寒战，好伸腰、频频呵欠，心痛支撑胀满，两胁内里拘急，饮食不下，膈咽不通，进食就呕，腹胀、好嗳气，得大便与矢气之后，就轻快像衰减了似的，身体都沉重。岁少阴在泉，热淫所胜，则火焰浮于川泽，阴处反而明亮。民病腹中常常鸣响，气上冲胸，喘息不能久立，寒热而皮肤痛，目昏、齿痛肿，恶寒发热如同疟疾，少腹中痛而腹大，蛰虫不藏伏。岁太阴在泉，草木提早繁荣，湿淫所胜，则埃雾昏蒙岩谷，黄色反见黑色，是至阴之交。民病水饮积滞，心痛，耳聋浑浑不清，咽喉肿、喉痹，阴病见血，少腹痛肿，不得小便，病气上冲头痛，目似脱出，项似被拔，腰似折断，大腿不能回转，像被结扎，像被分离。","notes":[],"pending":false},{"id":"sw74-7","tags":[],"yw":"歲少陽在泉，火淫所勝，則焰明郊野，寒熱更至。民病注泄赤白，少腹痛溺赤，甚則血便。少陰同候。歲陽明在泉，燥淫所勝，則霧清暝。民病喜嘔，嘔有苦，善大息，心脅痛不能反側，甚則嗌干面塵，身無膏澤，足外反熱。歲太陽在泉，寒淫所勝，則凝肅慘慄。民病少腹控睾，引腰脊，上衝心痛，血見，嗌痛頷腫。帝曰∶善。治之奈何？岐伯曰∶諸氣在泉，風淫於內，治以辛涼，佐以苦，以甘緩之，以辛散之。熱淫於內，治以鹹寒，佐以甘苦，以酸收之，以苦發之。","bh":"岁少阳在泉，火淫所胜，则火焰光明于郊野，寒热交替到来。民病泄泻如注而赤白，少腹痛、小便赤，严重的则大便下血。少阴同此候。岁阳明在泉，燥淫所胜，则雾气清凉昏暗。民病喜呕，呕吐苦水，好长叹息，心胁痛不能转侧，严重的则咽喉干燥、面如尘垢，身上没有润泽，足外侧反而发热。岁太阳在泉，寒淫所胜，则凝肃惨栗。民病少腹痛牵控睾丸，牵引腰脊，上冲心痛，出血，咽喉痛、颔肿。黄帝说：好。怎样治疗？岐伯说：诸气在泉，风淫于内的，治以辛凉，佐以苦味，以甘味缓之，以辛味散之。热淫于内的，治以咸寒，佐以甘苦，以酸味收之，以苦味发泄之。","notes":[],"pending":false},{"id":"sw74-8","tags":[],"yw":"溼淫於內，治以苦熱，佐以酸淡，以苦燥之，以淡泄之。火淫於內，治以鹹冷，佐以苦辛，以酸收之，以苦發之。燥淫於內，治以苦溫，佐以甘辛，以苦下之。寒淫於內，治以甘熱，佐以苦辛，以鹹瀉之，以辛潤之，以苦堅之。帝曰∶善。天氣之變何如？岐伯曰∶厥陰司天，風淫所勝，則太虛埃昏，雲物以擾，寒生春氣，流水不冰。民病胃脘當心而痛，上支兩脅，膈咽不通，飲食不下，舌本強，食則嘔，冷泄腹脹，溏泄瘕水閉，蟄蟲不去，病本於脾。","bh":"湿淫于内的，治以苦热，佐以酸淡，以苦味燥之，以淡味渗泄之。火淫于内的，治以咸冷，佐以苦辛，以酸味收之，以苦味发泄之。燥淫于内的，治以苦温，佐以甘辛，以苦味下之。寒淫于内的，治以甘热，佐以苦辛，以咸味泻之，以辛味润之，以苦味坚之。黄帝说：好。天气的变化怎样？岐伯说：厥阴司天，风淫所胜，则天空尘埃昏蒙，云物扰动，寒气生于春令，流水不结冰。民病胃脘正当心处而痛，上支撑两胁，膈咽不通，饮食不下，舌根强硬，进食就呕，冷泄、腹胀，溏泄、瘕聚、水闭，蛰虫不去，病的根本在脾。","notes":[],"pending":false},{"id":"sw74-9","tags":[],"yw":"衝陽絕，死不治。少陰司天，熱淫所勝，怫熱至，火行其政。民病胸中煩熱，嗌干，右滿，皮膚痛，寒熱咳喘，大雨且至，唾血血泄，鼽衄嚏嘔，溺色變，甚則瘡瘍腫，肩背臂及缺盆中痛，心痛肺，腹大滿，膨膨而喘咳病本於肺。尺澤絕，死不治。太陰司天，溼淫所勝，則沉陰且布，雨變枯槁，腫骨痛陰痹，陰痹者按之不得，腰脊頭項痛，時眩，大便難，陰氣不用，飢不欲食，咳唾則有血，心如懸，病本干腎。太溪絕，死不治。少陽司天，火淫所勝，則溫氣流行，金政不平。","bh":"冲阳脉绝，死而不治。少阴司天，热淫所胜，郁蒸之热到来，火行其政令。民病胸中烦热，咽喉干燥，右胁胀满，皮肤痛，寒热咳喘，大雨将要到来，唾血、血泄，鼽衄、喷嚏、呕吐，小便颜色改变，严重的则疮疡浮肿，肩背臂及缺盆中痛，心痛连肺，腹大而胀满，膨膨然喘息咳嗽，病的根本在肺。尺泽脉绝，死而不治。太阴司天，湿淫所胜，则沉阴之气布散，雨水改变而使草木枯槁，浮肿、骨痛、阴痹，阴痹是按之不得其处的，腰脊头项痛，时常眩晕，大便难，阴气不用，饥而不欲食，咳唾就有血，心如悬空，病的根本在肾。太溪脉绝，死而不治。少阳司天，火淫所胜，则温气流行，金之政令不平。","notes":[],"pending":false},{"id":"sw74-10","tags":[],"yw":"民病頭痛，發熱惡寒而瘧，熱上皮膚痛，色變黃赤，傳而爲水，身面腫，腹滿仰息，泄注赤白，瘡瘍咳唾血，煩心胸中熱，甚則鼽衄，病本於肺。天府絕，死不治。陽明司天，燥淫所勝，則木乃晚榮，草乃晚生，筋骨內變，民病左脅痛，寒清於中，感而瘧，大涼革候，咳，腹中鳴，注泄溏，名木斂，生菀於下，草焦上首，心脅暴痛，不可反側，嗌干面塵腰痛，丈夫疝，婦人少腹痛，目，瘍瘡痤癰，蟄蟲來見，病本於肝。太衝絕，死不治。太陽司天，寒淫所勝，則寒氣反至，水且冰，血變於中，發爲癰瘍，民病厥心痛，嘔血血泄鼽衄，善悲時眩僕。","bh":"民病头痛，发热恶寒而成疟，热上冲而皮肤痛，颜色变黄赤，传变而成为水病，身面浮肿，腹部胀满而仰面喘息，泄泻如注而赤白，疮疡，咳唾血，心中烦、胸中热，严重的则鼽衄，病的根本在肺。天府脉绝，死而不治。阳明司天，燥淫所胜，则树木晚荣，草类晚生，筋骨内发生变化，民病左胁痛，寒凉清气在于中，感而成疟，大凉改变节候，咳嗽，腹中鸣响，泄泻如注、大便溏薄，名木收敛，生气郁积于下，草梢焦枯，心胁突然疼痛，不可转侧，咽喉干燥、面如尘垢、腰痛，男子疝气，妇人少腹痛，目痛，疮疡痤痈，蛰虫出现，病的根本在肝。太冲脉绝，死而不治。太阳司天，寒淫所胜，则寒气反常到来，水将要结冰，血在体内发生变化，发为痈疡，民病厥心痛，呕血、血泄、鼽衄，好悲伤，时常眩晕仆倒。","notes":[],"pending":false},{"id":"sw74-11","tags":[],"yw":"運火炎烈，雨暴乃雹，胸腹滿，手熱肘攣掖腫，心澹澹大動，胸脅胃脘不安，面赤目黃，善噫嗌干，甚則色，渴而欲飲，病本於心。神門絕，死不治。所謂動氣，知其藏也。帝曰∶善。治之奈何？岐伯曰∶司天之氣，風淫所勝，平以辛涼，佐以苦甘，以甘緩之，以酸瀉之。熱淫所勝，平以鹹寒，佐以苦甘，以酸收之。溼淫所勝，平以苦熱，佐以酸辛，以苦燥之，以淡泄之。溼上甚而熱，治以苦溫，佐以甘辛，以汗爲故而止。火淫所勝，平以酸冷，佐以苦甘，以酸收之，以苦發之，以酸復之，熱淫同。","bh":"若火运炎烈，暴雨降下乃成冰雹，胸腹胀满，手热、肘部拘挛、腋肿，心中跳动不安，胸胁胃脘不适，面赤目黄，好嗳气、咽喉干燥，严重的则面色改变，口渴而想饮水，病的根本在心。神门脉绝，死而不治。所谓动气，据此可知其脏。黄帝说：好。怎样治疗？岐伯说：司天之气，风淫所胜的，平以辛凉，佐以苦甘，以甘味缓之，以酸味泻之。热淫所胜的，平以咸寒，佐以苦甘，以酸味收之。湿淫所胜的，平以苦热，佐以酸辛，以苦味燥之，以淡味渗泄之。湿气在上偏甚而有热的，治以苦温，佐以甘辛，以微汗出到恢复常态为止。火淫所胜的，平以酸冷，佐以苦甘，以酸味收之，以苦味发泄之，以酸味复之，与热淫同治。","notes":[],"pending":false},{"id":"sw74-12","tags":[],"yw":"燥淫所勝，平以苦溼，佐以酸辛，以苦下之。寒淫所勝，平以辛熱，佐以甘苦，以鹹瀉之。帝曰∶善。邪氣反勝，治之奈何？岐伯曰∶風司於地，清反勝之，治以酸溫，佐以苦甘，以辛平之。熱司於地，寒反勝之，治以甘熱，佐以苦辛，以鹹平之。溼司於地，熱反勝之，治以苦冷，佐以鹹甘，以苦平之。火司於地，寒反勝之，治以甘熱，佐以苦辛，以鹹平之。燥司於地，熱反勝之，治以平寒，佐以苦甘，以酸平之，以和爲利。寒司於地，熱反勝之，治以鹹冷，佐以甘辛，以苦平之。","bh":"燥淫所胜的，平以苦湿，佐以酸辛，以苦味下之。寒淫所胜的，平以辛热，佐以甘苦，以咸味泻之。黄帝说：好。邪气反胜的时候，怎样治疗？岐伯说：风气司于地，清气反来胜之，治以酸温，佐以苦甘，以辛味平之。热气司于地，寒气反来胜之，治以甘热，佐以苦辛，以咸味平之。湿气司于地，热气反来胜之，治以苦冷，佐以咸甘，以苦味平之。火气司于地，寒气反来胜之，治以甘热，佐以苦辛，以咸味平之。燥气司于地，热气反来胜之，治以平寒，佐以苦甘，以酸味平之，以调和为利。寒气司于地，热气反来胜之，治以咸冷，佐以甘辛，以苦味平之。","notes":[],"pending":false},{"id":"sw74-13","tags":[],"yw":"帝曰∶其司天邪勝何如？岐伯曰∶風化於天，清反勝之，治以酸溫，佐以甘苦。熱化於天，寒反勝之，治以甘溫，佐以苦酸辛。溼化於天，熱反勝之，治以苦寒，佐以苦酸。火化於天，寒反勝之，治以甘熱，佐以苦辛。燥化於天，熱反勝之，治以辛寒，佐以苦甘。寒化於天，熱反勝之，治以鹹冷，佐以苦辛。帝曰∶六氣相勝奈何？岐伯曰∶厥陰之勝，耳鳴頭眩，憒憒欲吐，胃膈如寒，大風數舉，蟲不滋，脅氣並，化而爲熱，小便黃赤，胃脘當心而痛，上支兩脅，腸鳴飧泄，少腹痛，注下赤白，甚則嘔吐，膈咽不通。","bh":"黄帝说：司天被邪气所胜怎样？岐伯说：风化于天，清气反来胜之，治以酸温，佐以甘苦。热化于天，寒气反来胜之，治以甘温，佐以苦酸辛。湿化于天，热气反来胜之，治以苦寒，佐以苦酸。火化于天，寒气反来胜之，治以甘热，佐以苦辛。燥化于天，热气反来胜之，治以辛寒，佐以苦甘。寒化于天，热气反来胜之，治以咸冷，佐以苦辛。黄帝说：六气互相为胜怎样？岐伯说：厥阴之胜，耳鸣头眩，昏乱欲吐，胃膈如有寒气，大风屡屡兴起，虫类不滋生，胁气并聚，化而为热，小便黄赤，胃脘正当心处而痛，上支撑两胁，肠鸣、飧泄，少腹痛，泄下赤白，严重的则呕吐，膈咽不通。","notes":[],"pending":false},{"id":"sw74-14","tags":[],"yw":"少陰之勝，心下熱善飢，臍下反動，氣遊三焦，炎暑至，木乃津，草乃萎，嘔逆躁煩，腹滿痛溏泄，傳爲赤沃。太陰之勝，火氣內鬱，瘡瘍於中，流散於外，病在脅，甚則心痛熱格，頭痛喉痹項強，獨勝則溼氣內鬱，寒迫下焦，痛留頂，互引眉間，胃滿，雨數至，燥化乃見，少腹滿，腰重強，內不便，善注泄，足下溫，頭重足脛腫，飲發於中，腫於上。少陽之勝，熱客於胃，煩心心痛，目赤欲嘔，嘔酸善飢，耳痛溺赤，善驚譫妄，暴熱消爍，草萎水涸，介蟲乃屈，少腹痛，下沃赤白。","bh":"少阴之胜，心下热而容易饥饿，脐下反而跳动，气游于三焦，炎暑到来，树木流津，草类枯萎，呕逆、烦躁，腹满痛、大便溏泄，传变为赤沃。太阴之胜，火气内郁，疮疡发于内，流散于外，病在胁部，严重的则心痛、热格拒，头痛、喉痹、项强，若湿气独胜则湿气内郁，寒气逼迫下焦，疼痛留滞头顶，互相牵引至眉间，胃中胀满，雨水屡至，燥化之象于是出现，少腹胀满，腰部沉重强直，内部不便，常常泄泻如注，足下温热，头重、足胫浮肿，水饮发于中，浮肿在上。少阳之胜，热邪客于胃，心中烦、心痛，目赤欲呕，呕酸水、容易饥饿，耳痛、小便赤，容易惊骇、谵语妄言，暴热消烁，草木枯萎、水液干涸，介虫屈伏，少腹痛，下泄赤白。","notes":[],"pending":false},{"id":"sw74-15","tags":[],"yw":"陽明之勝，清發於中，左脅痛溏泄，內爲嗌塞，外發疝，大涼肅殺，華英改容，毛蟲乃殃，胸中不便，嗌塞而咳。太陽之勝，凝且至，非時水冰，羽乃後化，痔瘧發，寒厥入胃，則內生心痛，陰中乃瘍，隱曲不利，互引陰股，筋肉拘苛，血脈凝泣，絡滿色變，或爲血泄，皮膚痞腫，腹滿食減，熱反上行，頭項囟頂腦戶中痛，目如脫，寒入下焦，傳爲濡瀉。帝曰∶治之奈何？岐伯曰∶厥陰之勝，治以甘清，佐以苦辛，以酸瀉之。少陰之勝，治以辛寒，佐以苦鹹，以甘瀉之。","bh":"阳明之胜，清气发于中，左胁痛、大便溏泄，在内则为咽喉阻塞，在外发为疝气，大凉肃杀，草木容色改变，毛虫遭殃，胸中不适，咽喉阻塞而咳。太阳之胜，凝冽之气到来，不是时令而水结冰，羽虫延后生化，痔疮、疟疾发作，寒厥入于胃，就内生心痛，阴部于是生疮疡，隐曲不利，互相牵引至阴股，筋肉拘急苛重，血脉凝涩，络脉充盈而颜色改变，或为血泄，皮肤痞塞浮肿，腹胀而进食减少，热气反而上行，头项囟顶脑户中痛，目如脱出，寒气入于下焦，传变为濡泻。黄帝说：怎样治疗？岐伯说：厥阴之胜，治以甘清，佐以苦辛，以酸味泻之。少阴之胜，治以辛寒，佐以苦咸，以甘味泻之。","notes":[],"pending":false},{"id":"sw74-16","tags":[],"yw":"太陰之勝，治以鹹熱，佐以辛甘，以苦瀉之。少陽之勝，治以辛寒，佐以甘鹹，以甘瀉之。陽明之勝，治以酸溫，佐以辛甘，以苦泄之。太陽之勝，治以甘熱，佐以辛酸，以鹹瀉之。帝曰∶六氣之復何如？岐伯曰∶悉乎哉問也！厥陰之復，少腹堅滿，裏急暴痛，偃木飛沙，蟲不榮，厥心痛，汗發嘔吐，飲食不入，入而復出，筋骨掉眩清厥，甚則入脾，食痹而吐。衝陽絕，死不治。少陰之復，燠熱內作，煩躁鼽嚏，少腹絞痛，火見燔，嗌燥，分注時止，氣動於左，上行於右，咳，皮膚痛，暴喑心痛，鬱冒不知人，乃灑淅惡寒，振慄譫妄，寒已而熱，渴而欲飲，少氣骨痿，隔腸不便，外爲浮腫噦噫，赤氣後化，流水不冰，熱氣大行，介蟲不復，病胗瘡瘍，癰疽痤痔，甚則入肺，咳而鼻淵。","bh":"太阴之胜，治以咸热，佐以辛甘，以苦味泻之。少阳之胜，治以辛寒，佐以甘咸，以甘味泻之。阳明之胜，治以酸温，佐以辛甘，以苦味泄之。太阳之胜，治以甘热，佐以辛酸，以咸味泻之。黄帝说：六气的复气怎样？岐伯说：问得真周详啊！厥阴之复，少腹坚硬胀满，腹内拘急突然疼痛，树木倒偃、飞沙走石，虫类不繁荣，厥心痛，汗出发呕吐，饮食不入，入而复出，筋骨振摇眩晕、清冷厥逆，严重的则入于脾，食痹而吐。冲阳脉绝，死而不治。少阴之复，郁热发于内，烦躁、鼽嚏，少腹绞痛，火热显现如焚，咽喉干燥，分次泄泻而时止时作，气动于左，上行于右，咳嗽，皮肤痛，突然失音、心痛，郁冒而不省人事，于是洒淅恶寒、寒战谵语妄言，寒止而复发热，口渴想饮水，少气、骨痿，膈肠不通大便，在外则浮肿、呃逆嗳气，赤气后化，流水不结冰，热气大行，介虫不复生，病发疹疮疡、痈疽痤痔，严重的则入于肺，咳嗽而鼻渊。","notes":[],"pending":false},{"id":"sw74-17","tags":[],"yw":"天府絕，死不治。太陰之復，溼變乃舉，體重中滿，食飲不化，陰氣上厥，胸中不便，飲發於中，咳喘有聲，大雨時行，鱗見於陸，頭頂痛重，而掉螈尤甚，嘔而密默，唾吐清液，甚則入腎，竅瀉無度。太溪絕，死不治。少陽之復，大熱將至，枯燥燔，介蟲乃耗，驚螈咳衄，心熱煩躁，便數憎風，厥氣上行，面如浮埃，目乃螈，火氣內發，上爲口糜嘔逆，血溢血泄，發而爲瘧，惡寒鼓慄，寒極反熱，嗌絡焦槁，渴引水漿，色變黃赤，少氣脈萎，化而爲水，傳爲腫，甚則入肺，咳而血泄。","bh":"天府脉绝，死而不治。太阴之复，湿变于是兴起，身体沉重、中焦胀满，饮食不消化，阴气上逆，胸中不适，水饮发于中，咳喘有声，大雨时常降下，鳞类出现于陆地，头顶疼痛沉重，而振摇抽搐尤其厉害，呕吐而静默寡言，唾吐清液，严重的则入于肾，窍孔泄泻无度。太溪脉绝，死而不治。少阳之复，大热将要到来，枯燥焚烧，介虫于是耗损，惊骇、抽搐、咳嗽、鼻衄，心中热而烦躁，小便频数而恶风，厥气上行，面如浮尘，目于是抽搐，火气内发，在上则为口糜、呕逆，血溢、血泄，发而为疟，恶寒战栗，寒极反而发热，咽喉络脉焦槁，口渴引饮水浆，颜色变黄赤，少气、脉痿，化而为水，传为浮肿，严重的则入于肺，咳嗽而血泄。","notes":[],"pending":false},{"id":"sw74-18","tags":[],"yw":"尺澤絕，死不治。陽明之復，清氣大舉，森木蒼干，毛蟲乃厲，病生脅，氣歸於左，善太息，甚則心痛痞滿，腹脹而泄，嘔苦咳噦煩心，病在膈中頭痛，甚則入肝，驚駭筋攣。太衝絕，死不治。太陽之復，厥氣上行，水凝雨冰，羽蟲乃死，心胃生寒，胸膈不利，心痛痞滿，頭痛善悲，時眩僕，食減，腰反痛，屈伸不便，地裂冰堅，陽光不治，少腹控睾，引腰脊，上衝心，唾出清水，及爲噦噫，甚則入心，善忘善悲。神門絕，死不治。帝曰∶善。治之奈何？岐伯曰∶厥陰之復，治以酸寒，佐以甘辛，以酸瀉之，以甘緩之。","bh":"尺泽脉绝，死而不治。阳明之复，清气大举，森林草木苍老干枯，毛虫遭殃，病生于胁部，气归于左，好长叹息，严重的则心痛痞满，腹胀而泄泻，呕吐苦水、咳嗽、呃逆、心烦，病在膈中而头痛，严重的则入于肝，惊骇、筋脉拘挛。太冲脉绝，死而不治。太阳之复，厥气上行，水凝为雨水冰雹，羽虫于是死亡，心胃生寒，胸膈不利，心痛痞满，头痛、好悲伤，时常眩晕仆倒，进食减少，腰脊反而疼痛，屈伸不便，地裂冰坚，阳光不能主治，少腹痛牵控睾丸，牵引腰脊，上冲于心，吐出清水，以及呃逆嗳气，严重的则入于心，好忘、好悲伤。神门脉绝，死而不治。黄帝说：好。怎样治疗？岐伯说：厥阴之复，治以酸寒，佐以甘辛，以酸味泻之，以甘味缓之。","notes":[],"pending":false},{"id":"sw74-19","tags":[],"yw":"少陰之復，治以鹹寒，佐以苦辛，以甘瀉之，以酸收之，辛苦發之，以鹹之。太陰之復，治以苦熱，佐以酸辛，以苦瀉之，燥之，泄之。少陽之復，治以鹹冷，佐以苦辛，以鹹之，以酸收之，辛苦發之。發不遠熱，無犯溫涼，少陰同法。陽明之復，治以辛溫，佐以苦甘，以苦泄之，以苦下之，以酸補之。太陽之復，治以鹹熱，佐以甘辛，以苦堅之。治諸勝復，寒者熱之，熱者寒之，溫者清之，清者溫之，散者收之，抑者散之，燥者潤之，急者緩之，堅者之，脆者堅之，衰者補之，強者瀉之，各安其氣，必清必靜，則病氣衰去，歸其所宗，此治之大體也。","bh":"少阴之复，治以咸寒，佐以苦辛，以甘味泻之，以酸味收之，以辛苦发泄之，以咸味软之。太阴之复，治以苦热，佐以酸辛，以苦味泻之，燥之，泄之。少阳之复，治以咸冷，佐以苦辛，以咸味软之，以酸味收之，以辛苦发泄之。发泄不远避热性，不要触犯温凉的禁忌，少阴同此法则。阳明之复，治以辛温，佐以苦甘，以苦味泄之，以苦味下之，以酸味补之。太阳之复，治以咸热，佐以甘辛，以苦味坚之。治疗各种胜复，寒的用热法，热的用寒法，温的用清法，清的用温法，散的用收法，抑的用散法，燥的用润法，急的用缓法，坚的用软法，脆的用坚法，衰的用补法，强的用泻法，各安其气，务使清静，那么病气就会衰退而去，归返它的本宗，这是治疗的大法。","notes":[],"pending":false},{"id":"sw74-20","tags":[],"yw":"帝曰∶善。氣之上下何謂也？岐伯曰∶身半以上，其氣三矣，天之分也，天氣主之。身半以下，其氣三矣，地之分也，地氣主之。以名命氣，以氣命處，而言其病。半，所謂天樞也。故上勝而下俱病者，以地名之。下勝而上俱病者，以天名之。所謂勝至，報氣屈伏而未發也。復至則不以天地異名，皆如復氣爲法也。帝曰∶勝復之動，時有常乎？氣有必乎？岐伯曰∶時有常位，而氣無必也。帝曰∶願聞其道也。岐伯曰∶初氣終三氣，天氣主之，勝之常也。","bh":"黄帝说：好。气的上下怎么讲？岐伯说：身半以上，其气有三，是天的分野，天气主之。身半以下，其气有三，是地的分野，地气主之。以名来命气，以气来命处，从而说明它的病。中间，就是所谓天枢。所以在上胜而下都病的，以地（在泉）来命名。在下胜而上都病的，以天（司天）来命名。所谓胜至，是报复之气屈伏而未发。复至就不按天地异名，都依照复气为法则。黄帝说：胜复的变动，时令有常规吗？气有必然吗？岐伯说：时令有常位，而气没有必然。黄帝说：希望听听其中的道理。岐伯说：初气到终了的三气，天气主之，这是胜的常位。","notes":[],"pending":false},{"id":"sw74-21","tags":[],"yw":"四氣盡終氣，地氣主之，復之常也。有勝則復，無勝則否。帝曰∶善。復已而勝何如？岐伯曰∶勝至則復，無常數也，衰乃止耳。復已而勝，不復則害，此傷生也。帝曰∶復而反病何也？岐伯曰∶居非其位，不相得也。大復其勝則主勝之，故反病也。所謂火燥熱也。帝曰∶治之何如？岐伯曰∶夫氣之勝也，微者隨之，甚者制之。氣之復也，和者平之，暴者奪之。皆隨勝氣，安其屈伏，無問其數，以平爲期，此其道也。帝曰∶善。客主之勝復奈何？岐伯曰∶客主之氣，勝而無復也。","bh":"四气到终气，地气主之，这是复的常位。有胜就有复，无胜就没有复。黄帝说：好。复之后又有胜的怎样？岐伯说：胜至就有复，没有常数，衰退才停止。复之后又有胜，若不再复就有害，这是损伤生命的。黄帝说：复而反而生病是为什么？岐伯说：居非其位，不相得所致。复气太甚而胜其主气，就是主气胜它，所以反而生病。所谓的就是火、燥、热。黄帝说：怎样治疗？岐伯说：气的胜，微的就随顺它，甚的就制服它。气的复，和的就平调它，暴的就削夺它。都随顺其胜气，安定那屈伏之气，不问其次数，以平为期，这就是它的法则。黄帝说：好。客气与主气的胜复怎样？岐伯说：客气与主气，有胜而没有复。","notes":[],"pending":false},{"id":"sw74-22","tags":[],"yw":"帝曰∶其逆從何如？岐伯曰∶主勝逆，客勝從，天之道也。帝曰∶其生病何如？岐伯曰∶厥陰司天，客勝則耳鳴掉眩，甚則咳；主勝則胸脅痛，舌難以言。少陰司天，客勝則鼽嚏頸項強，肩背瞀熱，頭痛少氣，發熱耳聾目瞑，甚則腫血溢，瘡瘍咳喘；主勝則心熱煩躁，甚則脅痛支滿。太陰司天，客勝則首面腫，呼吸氣喘；主勝則胸腹滿，食已而瞀。少陽司天，客勝則丹胗外發，及爲丹瘡瘍，嘔逆喉痹，頭痛嗌腫，耳聾血溢，內爲螈；主勝則胸滿咳仰息，甚而有血，手熱。","bh":"黄帝说：它的逆从怎样？岐伯说：主气胜为逆，客气胜为从，这是天道。黄帝说：它发生病变怎样？岐伯说：厥阴司天，客气胜就耳鸣、振摇眩晕，严重的则咳嗽；主气胜就胸胁痛，舌难以言语。少阴司天，客气胜就鼽嚏、颈项强直，肩背闷热，头痛、少气，发热、耳聋、目昏，严重的则浮肿出血、疮疡、咳喘；主气胜就心中热而烦躁，严重的则胁痛支撑胀满。太阴司天，客气胜就头面浮肿，呼吸喘息；主气胜就胸腹胀满，进食之后而昏闷。少阳司天，客气胜就丹疹外发，以及丹毒疮疡，呕逆、喉痹，头痛、咽喉肿，耳聋、出血，在内发为抽搐；主气胜就胸满、咳嗽而仰面喘息，严重的则有血，手热。","notes":[],"pending":false},{"id":"sw74-23","tags":[],"yw":"陽明司天，清復內餘，則咳衄嗌塞，心膈中熱，咳不止而白血出者死。太陽司天，客勝則胸中不利，出清涕，感寒則咳；主勝則喉嗌中鳴。厥陰在泉，客勝則大關節不利，內爲痙強拘螈，外爲不便；主勝則筋骨繇並，腰腹時痛。少陰在泉，客勝則腰痛，尻股膝髀足病，瞀熱以酸，腫不能久立，溲便變；主勝則厥氣上行，心痛發熱，膈中，衆痹皆作，發於脅，魄汗不藏，四逆而起。太陰在泉，客勝則足痿下重，便溲不時，溼客下焦，發而濡瀉，及爲腫隱曲之疾；主勝則寒氣逆滿，食飲不下，甚則爲疝。","bh":"阳明司天，清复之气内余，就咳嗽、鼻衄、咽喉阻塞，心膈中热，咳嗽不止而吐白血的死。太阳司天，客气胜就胸中不利，流出清涕，感受寒邪就咳嗽；主气胜就咽喉中鸣响。厥阴在泉，客气胜就大关节不利，在内为痉挛强直拘急抽搐，在外为举动不便；主气胜就筋骨摇动相并，腰腹时常疼痛。少阴在泉，客气胜就腰痛，尻、股、膝、髀、足等处发病，闷热而酸楚，浮肿不能久立，大小便改变；主气胜就厥气上行，心痛发热，膈中郁塞，众痹都发作，发于胁部，魄汗不藏，四肢厥逆而起。太阴在泉，客气胜就足痿而下部沉重，大小便不按时，湿邪客于下焦，发为濡泻，以及浮肿、隐曲等疾患；主气胜就寒气上逆胀满，饮食不下，严重的则为疝气。","notes":[],"pending":false},{"id":"sw74-24","tags":[],"yw":"少陽在泉，客勝則腰腹痛而反惡寒，甚則下白溺白；主勝則熱反上行而客於心，心痛發熱，格中而嘔。少陰同候。陽明在泉，客勝則清氣動下，少腹堅滿而數便瀉；主勝則腰重腹痛，少腹生寒，下爲溏，則寒厥於腸，上衝胸中，甚則喘不能久立。太陽在泉，寒復內餘，則腰尻痛；屈伸不利，股脛足膝中痛。帝曰∶善。治之奈何？岐伯曰∶高者抑之，下者舉之，有餘折之，不足補之，佐以所利，和以所宜，必安其主客，適其寒溫，同者逆之，異者從之。","bh":"少阳在泉，客气胜就腰腹痛而反而恶寒，严重的则下白浊、小便白浊；主气胜就热气反而上行而客于心，心痛发热，格拒于中而呕吐。少阴同此候。阳明在泉，客气胜就清气动于下，少腹坚硬胀满而频频泄泻；主气胜就腰部沉重、腹痛，少腹生寒，在下则为溏泄，就是寒厥于肠，上冲胸中，严重的则喘息不能久立。太阳在泉，寒复之气内余，就腰尻疼痛，屈伸不利，股、胫、足、膝中疼痛。黄帝说：好。怎样治疗？岐伯说：高的抑之，下的举之，有余的折之，不足的补之，佐以所利，和以所宜，必须安其主客，适其寒温，相同的逆之，不同的从之。","notes":[],"pending":false},{"id":"sw74-25","tags":[],"yw":"帝曰∶治寒以熱，治熱以寒，氣相得者逆之，不相得者從之，餘以知之矣。其於正味何如？岐伯曰∶木位之主，其瀉以酸，其補以辛。火位之主，其瀉以甘，其補以鹹。土位之主，其瀉以苦，其補以甘。金位之主，其瀉以辛，其補以酸。水位之主，其瀉以鹹，其補以苦。厥陰之客，以辛補之，以酸瀉之，以甘緩之。少陰之客，以鹹補之，以甘瀉之，以鹹收之。太陰之客，以甘補之，以苦瀉之，以甘緩之。少陽之客，以鹹補之，以甘瀉之，以鹹之。陽明之客，以酸補之，以辛瀉之，以苦泄之。","bh":"黄帝说：治寒以热，治热以寒，气相得的逆之，不相得的从之，我已经知道了。那对于正味怎样？岐伯说：木位之主，泻用酸，补用辛。火位之主，泻用甘，补用咸。土位之主，泻用苦，补用甘。金位之主，泻用辛，补用酸。水位之主，泻用咸，补用苦。厥阴之客，以辛补之，以酸泻之，以甘缓之。少阴之客，以咸补之，以甘泻之，以咸收之。太阴之客，以甘补之，以苦泻之，以甘缓之。少阳之客，以咸补之，以甘泻之，以咸软之。阳明之客，以酸补之，以辛泻之，以苦泄之。","notes":[],"pending":false},{"id":"sw74-26","tags":[],"yw":"太陽之客，以苦補之，以鹹瀉之，以苦堅之，以辛潤之。開發腠理，致津液通氣也。帝曰∶善。願聞陰陽之三也何謂？岐伯曰∶氣有多少，異用也。帝曰∶陽明何謂也？岐伯曰∶兩陽合明也。帝曰∶厥陰何也？岐伯曰∶兩陰交盡也。帝曰∶氣有多少，病有盛衰，治有緩急，方有大小，願聞其約奈何？岐伯曰∶氣有高下，病有遠近，證有中外，治有輕重，適其至所爲故也。大要曰∶君一臣二，奇之制也；君二臣四，偶之制也；君二臣三，奇之制也；君二臣六，偶之制也。","bh":"太阳之客，以苦补之，以咸泻之，以苦坚之，以辛润之。开发腠理，使津液流通、气机通畅。黄帝说：好。希望听听阴阳之分为三，怎么讲？岐伯说：气有多少，作用不同。黄帝说：阳明怎么讲？岐伯说：两阳合明。黄帝说：厥阴呢？岐伯说：两阴交尽。黄帝说：气有多少，病有盛衰，治有缓急，方有大小，希望听听其中的约制怎样？岐伯说：气有高下，病有远近，证有中外，治有轻重，以药力到达病所为准。大要说：君一臣二，是奇方的配制；君二臣四，是偶方的配制；君二臣三，是奇方的配制；君二臣六，是偶方的配制。","notes":[],"pending":false},{"id":"sw74-27","tags":[],"yw":"故曰∶近者奇之，遠者偶之，汗者不以奇，下者不以偶，補上治上制以緩，補下治下制以急，急則氣味濃，緩則氣味薄，適其至所，此之謂也。病所遠而中道氣味之者，食而過之，無越其制度也。是故平氣之道，近而奇偶，制小其服也。遠而奇偶，制大其服也。大則數少，小則數多。多則九之，少則二之。奇之不去則偶之，是謂重方。偶之不去，則反佐以取之，所謂寒熱溫涼，反從其病也。帝曰∶善。病生於本，餘知之矣。生於標者，治之奈何？岐伯曰∶病反其本，中標之病，治反其本，中標之方。","bh":"所以说：病位近的用奇方，病位远的用偶方，发汗不用奇方，攻下不用偶方，补上治上制方宜缓，补下治下制方宜急，急则气味浓厚，缓则气味淡薄，使药力到达病所，说的就是这个。病所远而药气在半途被隔碍的，进食之后再服药以推送过去，不要超越这一制度。所以平气的法则，病近的用奇偶方，就减小它的服量。病远的用奇偶方，就加大它的服量。方大则药味数少，方小则药味数多。多的可以到九味，少的可以到二味。奇方不去就用偶方，这叫作重方。偶方不去，就反佐以取之，所谓寒热温凉，反从其病而用。黄帝说：好。病生于本，我已经知道了。生于标的，怎样治疗？岐伯说：病反其本，就中标之病，治反其本，就中标之方。","notes":[],"pending":false},{"id":"sw74-28","tags":[],"yw":"帝曰∶善。六氣之勝，何以候之？岐伯曰∶乘其至也，清氣大來，燥之勝也，風木受邪，肝病生焉。熱氣大來，火之勝也，金燥受邪，肺病生焉。寒氣大來，水之勝也，火熱受邪，心病生焉。溼氣大來，土之勝也，寒水受邪，腎病生焉。風氣大來，木之勝也，土溼受邪，脾病生焉。所謂感邪而生病也。乘年之虛，則邪甚也。失時之和，亦邪甚也。遇月之空，亦邪甚也。重感於邪，則病危矣。有勝之氣，其必來復也。帝曰∶其脈至何如？岐伯曰∶厥陰之至其脈弦，少陰之至其脈鉤，太陰之至其脈沉，少陽之至大而浮，陽明之至短而澀，太陽之至大而長。","bh":"黄帝说：好。六气的胜，怎样候察？岐伯说：乘它到来的时候，清气大来，是燥气之胜，风木受邪，肝病就发生了。热气大来，是火气之胜，金燥受邪，肺病就发生了。寒气大来，是水气之胜，火热受邪，心病就发生了。湿气大来，是土气之胜，寒水受邪，肾病就发生了。风气大来，是木气之胜，土湿受邪，脾病就发生了。这就是所谓感受邪气而发病。乘年气之虚，则邪气就甚。失天时之和，邪气也甚。遇月廓之空，邪气也甚。重复感受邪气，病就危险了。有胜气，其气必来报复。黄帝说：它的脉象到来怎样？岐伯说：厥阴之至其脉弦，少阴之至其脉钩，太阴之至其脉沉，少阳之至大而浮，阳明之至短而涩，太阳之至大而长。","notes":[],"pending":false},{"id":"sw74-29","tags":[],"yw":"至而和則平，至而甚則病，至而反者病，至而不至者病，未至而至者病，陰陽易者危。帝曰∶六氣標本，所從不同奈何？岐伯曰∶氣有從本者，有從標本者，有不從標本者也。帝曰∶願卒聞之。岐伯曰∶少陽太陰從本，少陰太陽從本從標，陽明厥陰，不從標本從乎中也。故從本者化生於本，從標本者有標本之化，從中者以中氣爲化也。帝曰∶脈從而病反者，其診何如？岐伯曰∶脈至而從，按之不鼓，諸陽皆然。帝曰∶諸陰之反，其脈何如？岐伯曰∶脈至而從，按之鼓甚而盛也。","bh":"脉至而调和就是平，脉至而太过就是病，脉至而相反的病，当至而不至的病，未至而先至的病，阴阳变易的危险。黄帝说：六气的标本，所从不同怎样？岐伯说：气有从本的，有从标从本的，有不从标本的。黄帝说：希望详尽地听听。岐伯说：少阳、太阴从本，少阴、太阳从本从标，阳明、厥阴不从标本而从乎中气。所以从本的，化生于本；从标本的，有标本之化；从中气的，以中气为化。黄帝说：脉顺而病反的，它的诊断怎样？岐伯说：脉至而顺，按之不鼓指，诸阳脉都是这样。黄帝说：诸阴脉相反的，它的脉象怎样？岐伯说：脉至而顺，按之鼓指甚而有力。","notes":[],"pending":false},{"id":"sw74-30","tags":[],"yw":"是故百病之起，有生於本者，有生於標者，有生於中氣者，有取本而得者，有取標而得者，有取中氣而得者，有取標本而得者，有逆取而得者，有從取而得者。逆，正順也。若順，逆也。故曰∶知標與本，用之不殆，明知逆順，正行無問。此之謂也。不知是者，不足以言診，足以亂經。故《大要》曰∶粗工嘻嘻，以爲可知，言熱未已，寒病復始，同氣異形，迷診亂經。此之謂也。夫標本之道，要而博，小而大，可以言一而知百病之害，言標與本，易而勿損，察本與標，氣可令調，明知勝復，爲萬民式，天之道畢矣。","bh":"所以百病的发生，有生于本的，有生于标的，有生于中气的，有取本而获效的，有取标而获效的，有取中气而获效的，有取标本而获效的，有逆取而获效的，有从取而获效的。逆，是正、是顺。若顺，就是逆。所以说：知道标与本，用起来就没有危殆，明了逆顺，正行不疑。说的就是这个。不知道这些的，不足以谈论诊法，足以扰乱经旨。所以《大要》说：粗工嘻嘻然自得，以为全都知道了，说热还没完，寒病又重新开始，同气而异形，迷惑诊法而扰乱经旨。说的就是这个。标本之道，要约而广博，由小可以及大，可以说一而知百病之害，言标与本，简易而不受损伤，审察本与标，气可以使之调畅，明了胜复，可以作为万民的法则，天道就完备了。","notes":[],"pending":false},{"id":"sw74-31","tags":[],"yw":"帝曰∶勝復之變，早晏何如？岐伯曰∶夫所勝者，勝至已病，病已慍慍，而復已萌也。夫所復者，勝盡而起，得位而甚，勝有微甚，復有少多，勝和而和，勝虛而虛，天之常也。帝曰∶勝復之作，動不當位，或後時而至，其故何也？岐伯曰∶夫氣之生，與其化衰盛異也。寒暑溫涼盛衰之用，其在四維。故陽之動，始於溫，盛於暑；陰之動，始於清，盛於寒。春夏秋冬，各差其分。故《大要》曰∶彼春之暖，爲夏之暑，彼秋之忿，爲冬之怒，謹按四維，斥候皆歸，其終可見，其始可知。","bh":"黄帝说：胜复的变化，早晚怎样？岐伯说：所胜的一方，胜至已经发病，病已郁蕴，而复气已经萌生了。所复的一方，胜气尽了就兴起，得位就加重，胜有微甚，复有多少，胜和则复和，胜虚则复虚，这是天之常道。黄帝说：胜复的发作，动不当其位，或者后时而至，是什么缘故？岐伯说：气的生化，与它的盛衰不同有关。寒暑温凉盛衰的作用，在于四维（四立）。所以阳气的动，始于温，盛于暑；阴气的动，始于清，盛于寒。春夏秋冬，各有差度。所以《大要》说：那春之暖，成为夏之暑，那秋之忿，成为冬之怒，谨慎按察四维，候察之气都归于此，它的终结可以预见，它的起始可以推知。","notes":[],"pending":false},{"id":"sw74-32","tags":[],"yw":"此之謂也。帝曰∶差有數乎？岐伯曰∶又凡三十度也。帝曰∶其脈應皆何如？岐伯曰∶差同正法，待時而去也。脈要曰∶春不沉，夏不弦，冬不澀，秋不數，是謂四塞。沉甚曰病，弦甚曰病，澀甚曰病，數甚曰病，參見曰病，復見曰病，未去而去曰病，去而不去曰病，反者死。故曰∶氣之相守司也，如權衡之不得相失也。夫陰陽之氣，清靜則生化治，動則苛疾起，此之謂也。帝曰∶幽明何如？岐伯曰∶兩陰交盡故曰幽，兩陽合明故曰明，幽明之配，寒暑之異也。","bh":"说的就是这个。黄帝说：差有一定的度数吗？岐伯说：大凡又是三十度。黄帝说：它的脉象相应都怎样？岐伯说：差同正法，待其时而去。脉要说：春脉不沉，夏脉不弦，冬脉不涩，秋脉不数，这叫四塞。沉太甚的叫病，弦太甚的叫病，涩太甚的叫病，数太甚的叫病，脉象相参错互见的叫病，反复出现的叫病，当去而不去的叫病，已去而不去的叫病，相反的死。所以说：气的相守司，如同权衡之器不能相互失调。阴阳之气，清静则生化而治，妄动则苛疾兴起，说的就是这个。黄帝说：幽明怎样？岐伯说：两阴交尽所以叫幽，两阳合明所以叫明，幽明的配合，是寒暑的差异。","notes":[],"pending":false},{"id":"sw74-33","tags":[],"yw":"帝曰∶分至何如？岐伯曰∶氣至之謂至，氣分之謂分，至則氣同，分則氣異，所謂天地之正紀也。帝曰∶夫子言春秋氣始於前，冬夏氣始於後，餘已知之矣。然六氣往復，主歲不常也，其補瀉奈何？岐伯曰∶上下所主，隨其攸利，正其味，則其要也，左右同法。大要曰∶少陽之主，先甘後鹹；陽明之主，先辛後酸；太陽之主，先鹹後苦；厥陰之主，先酸後辛；少陰之主，先甘後鹹；太陰之主，先苦後甘。佐以所利，資以所生，是謂得氣。帝曰∶善。夫百病之生也，皆生於風寒暑溼燥火，以之化之變也。","bh":"黄帝说：分至怎样？岐伯说：气至叫作至，气分叫作分，至则气同，分则气异，这就是所谓天地的正纪。黄帝说：夫子说春分秋分之气始于前，冬至夏至之气始于后，我已经知道了。然而六气往复，主岁不常，它的补泻怎样？岐伯说：上下所主，随其所利，正其五味，就是它的要领，左右同法。大要说：少阳之主，先甘后咸；阳明之主，先辛后酸；太阳之主，先咸后苦；厥阴之主，先酸后辛；少阴之主，先甘后咸；太阴之主，先苦后甘。佐以所利，资益以所生，这叫作得气。黄帝说：好。大凡百病的发生，都生于风寒暑湿燥火，由它的化而生，由它的变而成。","notes":[],"pending":false},{"id":"sw74-34","tags":[],"yw":"經言盛者瀉之，虛者補之，餘錫以方士，而方士用之尚未能十全，餘欲令要道必行，桴鼓相應，猶拔刺雪污，工巧神聖，可得聞乎？岐伯曰∶審察病機，無失氣宜，此之謂也。帝曰∶願聞病機何如？岐伯曰∶諸風掉眩，皆屬於肝。諸寒收引，皆屬於腎。諸氣鬱，皆屬於肺。諸溼腫滿，皆屬於脾。諸熱瞀螈，皆屬於火。諸痛癢瘡，皆屬於心。諸厥固泄，皆屬於下。諸痿喘嘔，皆屬於上。諸禁鼓慄，如喪神守，皆屬於火。諸痙項強，皆屬於溼。諸逆衝上，皆屬於火。","bh":"医经上说盛的泻之，虚的补之，我把它赐给方士，而方士用它还不能十全，我想使要道必行，如桴鼓相应，如同拔刺、洗涤污浊，达到工巧神圣的地步，可以听听吗？岐伯说：审察病机，不要失去气宜，说的就是这个。黄帝说：希望听听病机怎样？岐伯说：诸风振摇眩晕，都属于肝。诸寒收敛牵引，都属于肾。诸气郁满，都属于肺。诸湿浮肿胀满，都属于脾。诸热昏闷抽搐，都属于火。诸痛痒疮疡，都属于心。诸厥逆、固闭、泄泻，都属于下。诸痿、喘息、呕吐，都属于上。诸口噤、鼓颔战栗，如丧神守，都属于火。诸痉挛、项强，都属于湿。诸逆气上冲，都属于火。","notes":[],"pending":false},{"id":"sw74-35","tags":[],"yw":"諸脹腹大，皆屬於熱。諸躁狂越，皆屬於火。諸暴強直，皆屬於風。諸病有聲，鼓之如鼓，皆屬於熱。諸病腫疼酸驚駭，皆屬於火。諸轉反戾，水液混濁，皆屬於熱。諸病水液，澄徹清冷，皆屬於寒。諸嘔吐酸，暴注下迫，皆屬於熱。故大要曰∶謹守病機，各司其屬，有者求之，無者求之，盛者責之，虛者責之，必先五勝，疏其血氣，令其調達，而致和平。此之謂也。帝曰∶善。五味陰陽之用何如？岐伯曰∶辛甘發散爲陽，酸苦湧泄爲陰，鹹味湧泄爲陰，淡味滲泄爲陽。","bh":"诸胀满腹大，都属于热。诸躁扰狂乱越常，都属于火。诸突然强直，都属于风。诸病有声，叩之如鼓，都属于热。诸病浮肿、疼痛酸楚、惊骇，都属于火。诸转筋反戾、水液浑浊，都属于热。诸病水液澄澈清冷，都属于寒。诸呕吐酸水、猝然暴泻而下迫，都属于热。所以大要说：谨守病机，各司其所属，有此症的推求它，无此症的也推求它，亢盛的责察它，虚衰的责察它，必先明五行之胜，疏通它的血气，使它调畅通达，从而达到和平。说的就是这个。黄帝说：好。五味阴阳的作用怎样？岐伯说：辛甘发散为阳，酸苦涌泄为阴，咸味涌泄为阴，淡味渗泄为阳。","notes":[],"pending":false},{"id":"sw74-36","tags":[],"yw":"六者或收或散，或緩或急，或燥或潤，或或堅，以所利而行之，調其氣使其平也。帝曰∶非調氣而得者，治之奈何？有毒無毒，何先何後？願聞其道。岐伯曰∶有毒無毒，所治爲主，適大小爲制也。帝曰∶請言其制。岐伯曰∶君一臣二，制之小也；君一臣三佐五，制之中也；君一臣三佐九，制之大也。寒者熱之，熱者寒之，微者逆之，甚者從之，堅者削之，客者除之，勞者溫之，結者散之，留者攻之，燥者濡之，急者緩之，散者收之，損者溫之，逸者行之，驚者平之，上之下之，摩之浴之，薄之劫之，開之發之，適事爲故。","bh":"六者或收或散，或缓或急，或燥或润，或软或坚，各依其所利而行用，调其气使它平和。黄帝说：不是调气而获愈的，怎样治疗？有毒无毒，何先何后？希望听听其中的道理。岐伯说：有毒无毒，以所治之病为主，以适宜的大小为制度。黄帝说：请讲它的制度。岐伯说：君一臣二，是小的方制；君一臣三佐五，是中等的方制；君一臣三佐九，是大的方制。寒的用热法，热的用寒法，微的逆之，甚的从之，坚的削之，客邪的除之，劳损的温之，结聚的散之，留滞的攻之，干燥的濡润之，拘急的缓之，散越的收之，虚损的温之，安逸太久的运行之，惊骇的平之，或上之下之，按摩之洗浴之，迫之劫之，开之发之，以适合病情为准。","notes":[],"pending":false},{"id":"sw74-37","tags":[],"yw":"帝曰∶何謂逆從？岐伯曰∶逆者正治，從者反治，從少從多，觀其事也。帝曰∶反治何謂？岐伯曰∶熱因寒用，寒因熱用，塞因塞用，通因通用，必伏其所主，而先其所因，其始則同，其終則異，可使破積，可使潰堅，可使氣和，可使必已。帝曰∶善。氣調而得者何如？岐伯曰∶逆之從之，逆而從之，從而逆之，疏氣令調，則其道也。帝曰∶善。病之中外何如？岐伯曰∶從內之外者，調其內；從外之內者，治其外；從內之外而盛於外者，先調其內而後治其外；從外之內而盛於內者，先治其外而後調其內；中外不相及，則治主病。","bh":"黄帝说：什么叫逆从？岐伯说：逆就是正治，从就是反治，从多从少，要观察病情。黄帝说：反治怎么讲？岐伯说：热因寒用，寒因热用，塞因塞用，通因通用，必须制伏它的主病，而推求它的起因，它的开始与病情相同，它的结果则相异，这样可以使积滞破除，可以使坚块溃散，可以使气机调和，可以使疾病必愈。黄帝说：好。调气而获愈的怎样？岐伯说：或用逆治，或用从治，或先用逆而后从，或先用从而后逆，疏通气机使它调畅，就是它的法则。黄帝说：好。病的内外怎样？岐伯说：从内而发于外的，调它的内；从外而入于内的，治它的外；从内而发于外并且盛于外的，先调它的内然后治它的外；从外而入于内并且盛于内的，先治它的外然后调它的内；内外互不相关的，就治它的主病。","notes":[],"pending":false},{"id":"sw74-38","tags":[],"yw":"帝曰∶善。火熱復，惡寒發熱，有如瘧狀，或一日發，或間數日發，其故何也？岐伯曰∶勝復之氣，會遇之時，有多少也。陰氣多而陽氣少，則其發日遠；陽氣多而陰氣少，則其發日近。此勝復相薄，盛衰之節，瘧亦同法。帝曰∶論言治寒以熱，治熱以寒，而方士不能廢繩墨而更其道也。有病熱者寒之而熱，有病寒者熱之而寒，二者皆在，新病復起，奈何治？岐伯曰∶諸寒之而熱者取之陰，熱之而寒者取之陽，所謂求其屬也。帝曰∶善。服寒而反熱、服熱而反寒，其故何也？岐伯曰∶治其王氣，是以反也。","bh":"黄帝说：好。火热复气所致，恶寒发热，有如疟疾之状，有的一天一发，有的隔数日一发，是什么缘故？岐伯说：胜复之气，相会相遇的时候，有多少的分别。阴气多而阳气少，就发作的日子隔得远；阳气多而阴气少，就发作的日子隔得近。这是胜复相迫、盛衰的节度，疟疾也同此法则。黄帝说：医论上说治寒以热，治热以寒，方士不能废除这一准则而改变其道。有发热的病用寒药而仍然热，有恶寒的病用热药而仍然寒，两者都在，又有新病复起，怎样治疗？岐伯说：凡用寒药而热的当取之于阴，用热药而寒的当取之于阳，这就是所谓求其所属。黄帝说：好。服寒药反而热、服热药反而寒，是什么缘故？岐伯说：治的是它的王气，所以相反。","notes":[],"pending":false},{"id":"sw74-39","tags":[],"yw":"帝曰∶不治王而然者何也？岐伯曰∶悉乎哉問也！不治五味屬也。夫五味入胃，各歸所喜，故酸先入肝，苦先入心，甘先入脾，辛先入肺，鹹先入腎，久而增氣，物化之常也。氣增而久，夭之由也。帝曰∶善。方制君臣何謂也？岐伯曰∶主病之謂君，佐君之謂臣，應臣之謂使，非上下三品之謂也。帝曰∶三品何謂？岐伯曰∶所以明善惡之殊貫也。帝曰∶善。病之中外何如？岐伯曰∶調氣之方，必別陰陽，定其中外，各守其鄉，內者內治，外者外治，微者調之，其次平之，盛者奪之，汗之下之，寒熱溫涼，衰之以屬，隨其攸利，謹道如法，萬舉萬全，氣血正平，長有天命。","bh":"黄帝说：不是治王气而这样的，为什么呢？岐伯说：问得真周详啊！这是不治五味所属之脏的缘故。五味入胃，各归它喜好之处，所以酸先入肝，苦先入心，甘先入脾，辛先入肺，咸先入肾，日久就增长其气，这是物类生化的常理。气增长太过而持久，就是夭折的缘由。黄帝说：好。方剂中的君臣怎么讲？岐伯说：主治病的叫君，辅佐君药的叫臣，应合臣药的叫使，并不是上中下三品的意思。黄帝说：三品怎么讲？岐伯说：是用来表明善恶轻重的不同类别。黄帝说：好。病的内外怎样？岐伯说：调气的方剂，必须辨别阴阳，确定它的内外，各守其部位，在内的从内治，在外的从外治，微贱的调养它，其次平定它，亢盛的削夺它，或用汗法或用下法，寒热温凉，按其所属而衰减之，随其所利，谨慎遵道如法，就万举万全，气血正常平和，可以长久保有天赋之命。","notes":[],"pending":false},{"id":"sw74-40","tags":[],"yw":"帝曰∶善。至真要大論∶熠（羊入切）（土渾切）膨（普盲切）痤（殂禾切）（如悅切）（匹搖切）（之力切）脆（須醉切）<目錄>卷第二十三","bh":"黄帝说：好。（本篇为《至真要大论》，末附音释：熠，羊入切；㷍，土浑切；膨，普盲切；痤，殂禾切；𦶟，如悦切；膘，匹摇切；膱，之力切；脆，须醉切。本篇见于卷第二十三。）","notes":[],"pending":false}]},
{"id":"sw75","book":"素问","no":75,"title":"着至教论","titleTw":"着至教論","tags":["zhenfa","bingji","zangxiang"],"brief":"黄帝于明堂以医道教雷公，言医道须上知天文下知地理中知人事，并论三阳并至为病的凶险脉证。","pending":false,"sections":[{"id":"sw75-1","tags":[],"yw":"黃帝坐明堂，召雷公而問之曰∶子知醫之道乎？雷公對曰∶誦而未能解，解而未能別，別而未能明，明而未能彰，足以治羣僚，不足治侯王。願得受樹天之度，四時陰陽合之，別星辰與日月光，以彰經術，後世益明，上通神農，着至教疑於二皇。帝曰∶善。無失之，此皆陰陽表裏上下雌雄相輸應也，而道上知天文，下知地理，中知人事，可以長久，以教衆庶，亦不疑殆，醫道論篇，可傳後世，可以爲寶。雷公曰∶請受道，諷誦用解。帝曰∶子不聞《陰陽傳》乎？曰∶不知。","bh":"黄帝坐在明堂，召来雷公而问他说：你懂得医道吗？雷公回答说：我能诵读而未能理解，能理解而未能辨别，能辨别而未能明了，能明了而未能彰显，足以治疗群僚之疾，不足以治疗侯王之病。希望得以受教天道之度、四时阴阳相合之理，辨别星辰与日月的光明，以彰显经术，使后世更加明白，上与神农相通，著为至教而比并二皇。黄帝说：好。不要失掉这些，这都是阴阳表里上下雌雄相互输应的，而医道上知天文，下知地理，中知人事，可以长久相传，以此教诲众庶，也不致疑惑危殆，医道论篇，可以传于后世，可以当作珍宝。雷公说：请受此道，诵读以求解悟。黄帝说：你没有听说《阴阳传》吗？回答说：不知道。","notes":[],"pending":false},{"id":"sw75-2","tags":[],"yw":"曰∶夫三陽天爲業，上下無常，合而病至，偏害陰陽。雷公曰∶三陽莫當，請聞其解。帝曰∶三陽獨至者，是三陽並至，並至如風雨，上爲巔疾，下爲漏病。外無期，內無正，不中經紀，診無上下，以書別。雷公曰∶臣治疏愈，說意而已。帝曰∶三陽者，至陽也，積並則爲驚，病起疾風，至如霹靂，九竅皆塞，陽氣滂溢，干嗌喉塞。並於陰，則上下無常，薄爲腸。此謂三陽直心，坐不得起，臥者便身全，三陽之病。且以知天下，何以別陰陽，應四時，合之五行。","bh":"黄帝说：三阳以天为业，上下无常，相合而病至，偏害阴阳。雷公说：三阳莫可阻挡，请听听其中的解释。黄帝说：所谓三阳独至，就是三阳之气并至，并至如同风雨，在上发为巅顶之疾，在下发为漏泄之病。在外没有期限，在内没有定处，不合于经脉纪纲，诊断无法分上下，当以书记载分别它。雷公说：臣治病粗疏者愈，只能说说大意罢了。黄帝说：三阳是至阳之气，积并就成为惊骇之病，病起如同疾风，到来如同霹雳，九窍都闭塞，阳气滂沱外溢，干及咽喉而喉中闭塞。若并于阴，就上下无常，迫迫而为肠澼。这就叫作三阳直心，坐而不能起，卧着才能使身体得以保全，这是三阳之病。并且以此推知天下之事，凭什么辨别阴阳，应合四时，合于五行。","notes":[],"pending":false},{"id":"sw75-3","tags":[],"yw":"雷公曰∶陽言不別，陰言不理，請起受解，以爲至道。帝曰∶子若受傳，不知合至道以惑師教，語子至道之要。病傷五髒，筋骨以消，子言不明不別，是世主學盡矣。腎且絕，惋惋日暮，從容不出，人事不殷。<目錄>卷第二十三","bh":"雷公说：阳的方面言而不辨，阴的方面言而不理，请起身受教解说，把它作为至道。黄帝说：你若受传，却不能合于至道以迷惑师教，我就告诉你至道的要领。病伤五脏，筋骨因而消损，你言不明辨，这是世上的主学就要尽了。肾气将绝，惋惋然日暮之时，从容而不能外出，人事不殷勤。（本篇见于卷第二十三。）","notes":[],"pending":false}]},
{"id":"sw76","book":"素问","no":76,"title":"示从容论","titleTw":"示從容論","tags":["ci","zhenfa","bingji"],"brief":"示以从容比类之道：辨三脏相似脉证之别，强调援物比类、循法守度，并以脾病误诊为肺为例申明诊断要领。","pending":false,"sections":[{"id":"sw76-1","tags":[],"yw":"黃帝燕坐，召雷公而問之曰∶汝受術誦書者，若能覽觀雜學，及於比類，通合道理，爲餘言子所長，五髒六腑，膽胃大小腸脾胞膀胱，腦髓涕唾，哭泣悲哀，水所從行，此皆人之所生，治之過失，子務明之，可以十全，即不能知，爲世所怨。雷公曰∶臣請誦《脈經·上下編》甚衆多矣，別異比類，猶未能以十全，又安足以明之。帝曰∶子別試通五髒之過，六腑之所不和，針石之敗，毒藥所宜，湯液滋味，具言其狀，悉言以對，請問不知。雷公曰∶肝虛腎虛脾虛，皆令人體重煩冤，當投毒藥刺灸砭石湯液，或已或不已，願聞其解。","bh":"黄帝安闲闲坐，召来雷公而问他说：你是受术读书的人，若能博览杂学，善于比类旁通，通达融合道理，给我说说你的所长，五脏六腑，胆、胃、大肠、小肠、脾、胞、膀胱，脑髓、涕唾，哭泣悲哀，水液运行的道路，这些都是人之所以生息的，治疗上的过失，你务必明了，才可以十全，如果不能知道，就会被世俗所怨。雷公说：臣请诵读《脉经·上下篇》很多了，辨别异同、比类取象，还不能十全，又哪里足以明了它。黄帝说：你试着在别处谈谈五脏的过失、六腑的不和、针石的失败、毒药的所宜、汤液的滋味，详言它的情状，尽言以对，不懂的就请问。雷公说：肝虚、肾虚、脾虚，都使人身体沉重、烦闷冤屈，当用毒药、刺灸、砭石、汤液，有的痊愈有的不愈，希望听听其中的解释。","notes":[],"pending":false},{"id":"sw76-2","tags":[],"yw":"帝曰∶公何年之長而問之少，餘真問以自謬也。吾問子窈冥，子言上下編以對，何也？夫脾虛浮似肺，腎小浮似脾，肝急沉散似腎，此皆工之所時亂也，然從容得之。若夫三髒土木水參居，此童子之所知，問之何也？雷公曰∶於此有人，頭痛筋攣骨重，怯然少氣，噦噫腹滿，時驚不嗜臥，此何髒之發也？脈浮而弦，切之石堅，不知其解，復問所以三髒者，以知其比類也。帝曰∶夫從容之謂也。夫年長則求之於腑，年少則求之於經，年壯則求之於髒。今子所言皆失，八風菀熟，五髒消爍，傳邪相受。","bh":"黄帝说：你年纪这么大而问得这样少，我真是问得自感荒谬了。我问你深奥幽微之理，你却拿上下篇来对答，为什么呢？脾虚脉浮类似肺脉，肾脉小而浮类似脾脉，肝脉急沉而散类似肾脉，这些都是医工时常错乱的地方，然而从容比类就能得之。至于脾土木水三脏相参而居，这是童子都知道的，问它做什么？雷公说：这里有个人，头痛、筋脉拘挛、骨节沉重，怯然少气，呃逆嗳气、腹中胀满，时常惊骇而不喜卧，这是什么脏所发的病？脉浮而弦，切之坚硬如石，不知道其中的道理，再问三脏的辨别，是想明了比类之法。黄帝说：这就是所谓从容。年长的求之于腑，年少的求之于经，年壮的求之于脏。现在你说的都错了，八风郁蒸而熟，五脏消烁受损，是传变的邪气相互传受所致。","notes":[],"pending":false},{"id":"sw76-3","tags":[],"yw":"夫浮而弦者，是腎不足也。沉而石者，是腎氣內着也。怯然少氣者，是水道不行，形氣消索也。咳嗽煩冤者，是腎氣之逆也。一人之氣，病在一髒也。若言三髒俱行，不在法也。雷公曰∶於此有人，四肢解惰，喘咳血泄，而愚診之，以爲傷肺，切脈浮大而緊，愚不敢治，粗工下砭石，病愈多出血，血止身輕，此何物也？帝曰∶子所能治，知亦衆多，與此病失矣。譬以鴻飛，亦衝於天。夫聖人之治病，循法守度，援物比類，化之冥冥，循上及下，何必守經今夫脈浮大虛者，是脾氣之外絕，去胃外歸陽明也。","bh":"脉浮而弦的，是肾气不足。脉沉而坚如石的，是肾气内着不行。怯然少气的，是水道不通，形气的消耗已尽。咳嗽而烦闷冤屈的，是肾气上逆。一个人的病气，病在一脏。如果说三脏都病，就不合于法度。雷公说：这里有个人，四肢懈惰无力，喘促咳嗽、血泄，我愚拙地诊查，认为是伤肺，切脉浮大而紧，我不敢治疗，粗工用砭石下之，病愈而出血很多，血止之后身体轻快，这是什么东西？黄帝说：你所能治的、知道的也很多，但对这病却错了。譬如鸿雁高飞，也冲至于天。圣人治病，遵循法度，援引物类以比类，变化于幽微之中，循上以及下，何必拘守经文。脉浮大而虚的，是脾气外绝不运，离开胃而外归于阳明。","notes":[],"pending":false},{"id":"sw76-4","tags":[],"yw":"夫二火不勝三水，是以脈亂而無常也。四肢解惰，此脾精之不行也。喘咳者，是水氣並陽明也。血泄者，脈急血無所行也。若夫以爲傷肺者，由失以狂也。不引比類，是知不明也。夫傷肺者，脾氣不守，胃氣不清，經氣不爲使，真髒壞決，經脈旁絕，五髒漏泄，不衄則嘔，此二者不相類也。譬如天之無形，地之無理，白與黑相去遠矣。是失吾過矣，以子知之，故不告子，明引比類《從容》，是以名曰診輕，是謂至道也。<目錄>卷第二十三","bh":"二火不胜三水，所以脉象紊乱而无常度。四肢懈惰，这是脾精不能运行。喘促咳嗽，是水气并于阳明。血泄，是脉急而血无处可行。至于认为是伤肺的，是由失误而狂乱。不引物比类，就是知见不明。伤肺的，脾气不能守持，胃气不清净，经气不能为使役，真脏坏损决败，经脉旁道断绝，五脏漏泄，不鼻衄就呕吐，这两种情况并不相类。譬如天无形可求，地无理可循，白与黑相差太远了。这是我的过失，以为你知道，所以没有告诉你，明白地引物比类、从从容容，所以名叫诊轻，这就叫作至道。（本篇见于卷第二十三。）","notes":[],"pending":false}]},
{"id":"sw77","book":"素问","no":77,"title":"五过论","titleTw":"五過論","tags":["ci","zhenfa","bingji"],"brief":"论述诊病必须详察人事，列举不知贵贱苦乐等情志变故而致误诊的五种过失，并示以治病必求其本的原则。","pending":false,"sections":[{"id":"sw77-1","tags":[],"yw":"黃帝曰∶嗚呼遠哉！閔閔乎若視深淵，若迎浮雲，視深淵尚可測，迎浮雲莫知其際。聖人之術，爲萬民式，論裁志意，必有法則，循經守數，按循醫事，爲萬民副，故事有五過四德，汝知之乎？雷公避席再拜曰∶臣年幼小，蒙愚以惑，不聞五過與四德，比類形名，虛引其經，心無所對。帝曰∶凡未診病者，必問嘗貴後賤，雖不中邪，病從內生，名曰脫營。嘗富後貧，名曰失精，五氣留連，病有所並。醫工診之，不在髒腑，不變軀形，診之而疑，不知病名。","bh":"黄帝说：唉，深远啊！闵闵然好像看着深渊，好像迎着浮云，看深渊还可以测量，迎浮云却不知它的边际。圣人的医术，是万民的法则，论议裁断志意，必定有法度准则，遵循经旨、遵守术数，按察施行医事，为万民之辅佐，所以医事有五过四德，你知道吗？雷公离席再拜说：臣年幼小，蒙昧愚暗而被迷惑，没有听说过五过与四德，只是比类形证名称，虚引经文，心中没有可对答的。黄帝说：凡在诊病之前，必问病人是否曾经尊贵而后卑贱，虽然没有感受外邪，病也会从内生，名叫脱营。曾经富有而后贫穷，名叫失精，五气留连不去，病就会有所并聚。医工诊察它，病不在脏腑，形体也没有变异，诊之而生疑惑，不知病名。","notes":[],"pending":false},{"id":"sw77-2","tags":[],"yw":"身體日減，氣虛無精，病深無氣，灑灑然時驚，病深者，以其外耗於衛，內奪於榮。良工所失，不知病情，此亦治之一過也。凡欲診病者，必問飲食居處，暴樂暴苦，始樂後苦，皆傷精氣，精氣竭絕，形體毀沮。暴怒傷陰，暴喜傷陽，厥氣上行，滿脈去形。愚醫治之，不知補瀉，不知病情，精華日脫，邪氣乃並，此治之二過也。善爲脈者，必以比類奇恆從容知之，爲工而不知道，此診之不足貴，此治之三過也。診有三常，必問貴賤，封君敗傷，及欲侯王。","bh":"身体日渐消瘦，气虚而无精，病深而无气，洒洒然时常惊骇，病深的，是因为外耗于卫气，内夺于荣气。良工的失误，是不知病情，这也是治疗上的第一种过失。凡要诊病的，必问饮食居处，是突然欢乐还是突然痛苦，或是先乐后苦，都会损伤精气，精气耗竭，形体毁坏。暴怒伤阴，暴喜伤阳，厥气上逆，充满经脉而形神离去。愚医治疗它，不知补泻，不知病情，精华日渐脱失，邪气于是并聚，这是治疗上的第二种过失。善于诊脉的，必定以比类奇恒、从容之法来认识疾病，作为医工却不懂得医道，这样的诊断就不足为贵，这是治疗上的第三种过失。诊病有三种常法，必问贵贱，是否为封君败伤，以及是否追求侯王。","notes":[],"pending":false},{"id":"sw77-3","tags":[],"yw":"故貴脫勢，雖不中邪，精神內傷，身必敗亡。始富後貧，雖不傷邪，皮焦筋屈，痿爲攣。醫不能嚴，不能動神，外爲柔弱，亂至失常，病不能移，則醫事不行，此治之四過也。凡診者，必知終始，有知餘緒，切脈問名，當合男女。離絕菀結，憂恐喜怒，五髒空虛，血氣離守，工不能知，何術之語。嘗富大傷，斬筋絕脈，身體復行，令澤不息。故傷敗結，留薄歸陽，膿積寒炅。粗工治之，亟刺陰陽，身體解散，四肢轉筋，死日有期，醫不能明，不問所發，唯言死日，亦爲粗工，此治之五過也。","bh":"所以尊贵者失去权势，虽然没有感受外邪，精神内伤，身体必致败亡。先富而后贫，虽然没有伤于邪气，也会皮焦筋屈，成为痿躄拘挛。医生不能严正，不能动摇其精神，外表显出柔弱，错乱而至失去常度，疾病不能移易，那么医事就不能施行，这是治疗上的第四种过失。凡诊病的，必须知道疾病的终始，又要知道余外的头绪，切脉问病名，应当结合男女之别。离别断绝、郁结不解，忧恐喜怒，使五脏空虚，血气离失其守，医工不能知道，还谈什么医术。曾经富有而大受损伤，斩伤筋脉，身体虽能行走，却使津泽不再充盛。所以伤败结聚，留迫而归于阳分，脓积而寒化为热。粗工治疗它，屡刺阴阳经脉，使身体解散，四肢转筋，死期就有了定时，医生不能明了，不问病之所发，只言死期，这也是粗工，这是治疗上的第五种过失。","notes":[],"pending":false},{"id":"sw77-4","tags":[],"yw":"凡此五者，皆受術不通，人事不明也。故曰∶聖人之治病也，必知天地陰陽，四時經紀，五髒六腑，雌雄表裏，刺灸砭石、毒藥所主，從容人事，以明經道，貴賤貧富，各異品理，問年少長，勇怯之理，審於分部，知病本始，八正九候，診必副矣。治病之道，氣內爲寶，循求其理，求之不得，過在表裏。守數據治，無失俞理，能行此術，終身不殆。不知俞理，五髒菀熟，癰發六腑。診病不審，是謂失常，謹守此治，與經相明，《上經》、《下經》，揆度陰陽，奇恆五中，決以明堂，審於終始，可以橫行。","bh":"这五种过失，都是因为所受的医术不通达、人情事理不明了。所以说：圣人治病，必知天地阴阳、四时的经脉纪纲、五脏六腑、雌雄表里，刺灸砭石与毒药的主治，从容不迫地体察人事，以明了经常之道，贵贱贫富，各有不同的情理，问其年少年长、勇怯之理，审察于分部，知道疾病的本始，八正九候，诊断就必相符合。治病之道，以气内守为宝，循求它的道理，求之不得，过失就在于表里。遵守法度而据以治疗，不失俞穴之理，能行此术，终身没有危殆。不知俞理，五脏郁蒸而熟，痈发于六腑。诊病不审慎，这就叫作失常，谨守这一治法，与经旨相印证，《上经》、《下经》，揆度阴阳，奇恒五中，决断于明堂，审察于终始，就可以横行天下了。","notes":[],"pending":false},{"id":"sw77-5","tags":[],"yw":"<目錄>卷第二十三","bh":"（本篇篇末原文仅存卷次标识：本篇见于《素问》卷第二十三。）","notes":[],"pending":false}]},
{"id":"sw78","book":"素问","no":78,"title":"征四失论","titleTw":"徵四失論","tags":["zhenfa","bingji","yinyang"],"brief":"指出医工临证不能十全的四种过失：不通阴阳逆从、妄作杂术、不辨贫富勇怯、不问病之所始。","pending":false,"sections":[{"id":"sw78-1","tags":[],"yw":"黃帝在明堂，雷公侍坐，黃帝曰∶夫子所通書受事衆多矣，試言得失之意，所以得之，所以失之。雷公對曰∶循經受業，皆言十全，其時有過失者，請聞其事解也。帝曰∶子年少智未及邪？將言以雜合耶？夫經脈十二，絡脈三百六十五，此皆人之所明知，工之所循用也。所以不十全者，精神不專，志意不理，外內相失，故時疑殆。診不知陰陽逆從之理，此治之一失矣。受師不卒，妄作雜術，謬言爲道，更名自功，妄用砭石，後遺身咎，此治之二失也。","bh":"黄帝在明堂，雷公侍坐，黄帝说：夫子所通晓的书籍、所受习的事务太多了，试谈一谈得失的意思，为什么能得，为什么会失。雷公回答说：遵循经旨承受学业，都说十全，其中时有过失的，请听听这事的解说。黄帝说：你是年少而才智不及呢？还是说话以杂合之说呢？经脉十二，络脉三百六十五，这都是人所明知的，医工所循用的。之所以不能十全的，是精神不专注，志意不条理，外内相失，所以时常疑惑危殆。诊病不知阴阳逆从的道理，这是治疗上的第一种过失。受师之教不能卒业，妄行杂术，把谬言当作道，改名自以为功，妄用砭石，后来给自己留下祸咎，这是治疗上的第二种过失。","notes":[],"pending":false},{"id":"sw78-2","tags":[],"yw":"不適貧富貴賤之居，坐之薄濃，形之寒溫，不適飲食之宜，不別人之勇怯，不知比類，足以自亂，不足以自明，此治之三失也。診病不問其始，憂患飲食之失節，起居之過度，或傷於毒，不先言此，卒持寸口，何病能中，妄言作名，爲粗所窮，此治之四失也。是以世人之語者，馳千裏之外，不明尺寸之論，診無人事。治數之道，從容之葆，坐持寸口，診不中五脈，百病所起，始以自怨，遺師其咎。是故治不能循理，棄術於市，妄治時愈，愚心自得。嗚呼！窈窈冥冥，熟知其道？！道之大者，擬於天地，配於四海，汝不知道之諭，受以明爲晦。","bh":"不能适应贫富贵贱的居处、坐卧的厚薄、形体的寒温，不能适应饮食的宜忌，不能辨别人的勇怯，不知比类，这就足以自乱，不足以自明，这是治疗上的第三种过失。诊病不问它的起始，不问忧患、饮食的失节、起居的过度，或者伤于毒物，不先说明这些，仓猝持取寸口，什么病能诊中，妄言而立病名，被粗陋所困穷，这是治疗上的第四种过失。所以世人的说法，驰骋于千里之外，却不明了尺寸的道理，诊治不参人事。治病术数的道理，从容才是它的保障，坐持寸口之脉，诊不中五脏之脉，百病的起因，开始时自怨，却把过失留给老师。所以治病不能遵循医理，就像弃术于市肆，妄治而偶愈，愚心自得。唉！幽深渺茫，谁能熟知那个道呢？道的大者，比拟于天地，配于四海，你不懂得道的晓喻，受了明道反而成为暗昧。","notes":[],"pending":false},{"id":"sw78-3","tags":[],"yw":"着至教論∶恤（音戌）示從容論∶砭（方驗切）五過論∶沮（七餘反）憚（音但）徵四失論∶佚（音逸）葆（音保）<目錄>卷第二十四","bh":"（本篇篇末为音释：《著至教论》恤，音戌；《示从容论》砭，方验切；《五过论》沮，七余反，惮，音但；《征四失论》佚，音逸，葆，音保。本篇见于卷第二十四。）","notes":[],"pending":false}]},
{"id":"sw79","book":"素问","no":79,"title":"阴阳类论","titleTw":"陰陽類論","tags":["jingluo","zhenfa","bingji"],"brief":"论三阴三阳经脉的脉象主病与五脏贵贱，并据四时阴阳盛衰判断病候与死生之期，以阴阳雌雄统摄诊法。","pending":false,"sections":[{"id":"sw79-1","tags":[],"yw":"孟春始至，黃帝燕坐，臨觀八極，正八風之氣，而問雷公曰∶陰陽之類，經脈之道，五中所主，何髒最貴？雷公對曰∶春甲乙青，中主肝，治七十二日，是脈之主時，臣以其髒最貴。帝曰∶卻念上下經陰陽從容，子所言貴，最其下也。雷公致齋七日，旦復侍坐。帝曰∶三陽爲經，二陽爲維，一陽爲遊部，此知五髒終始。三陰爲表，二陰爲裏，一陰至絕作朔晦，卻具合以正其理。雷公曰∶受業未能明。帝曰∶所謂三陽者，太陽爲經，三陽脈至手太陰，弦浮而不沉，決以度，察以心，合之陰陽之論。","bh":"孟春时节刚刚到来，黄帝安闲地坐著，观临八方远处的景象，辨正八风之气，于是问雷公说：阴阳的类别、经脉的道理、五脏各主什么时令，哪一脏最为重要？雷公回答说：春季属甲乙、色青，在内主肝，主时七十二日，这是肝脉主时的季节，臣以为肝脏最为重要。黄帝说：你再回想《上下经》《阴阳》《从容》的论述，你所说的那个最贵的脏，其实是最下的一脏。雷公于是斋戒七日，次日清晨再来侍坐。黄帝说：三阳为经，二阳为维，一阳为游部，由此可以了解五脏的终始。三阴为表，二阴为里，一阴至于断绝而如朔日与晦日的交替，把它们综合起来，才能确定其中的条理。雷公说：臣受业学习，还不能明白。黄帝说：所说的三阳，是指太阳为经；三阳脉气至于手太阴（寸口），其脉弦浮而不沉，判断时要以常度衡量，用心细察，再与阴阳之论相合。","notes":[],"pending":false},{"id":"sw79-2","tags":[],"yw":"所謂二陽者，陽明也，至手太陰，弦而沉急不鼓，炅至以病皆死。一陽者，少陽也，至手太陰，上連人迎，弦急懸不絕，此少陽之病也，專陰則死。三陰者，六經之所主也，交於太陰，伏鼓不浮，上空志心。二陰至肺，其氣歸膀胱，外連脾胃。一陰獨至，經絕，氣浮不鼓，鉤而滑。此六脈者，乍陰乍陽，交屬相並，繆通五髒，合於陰陽，先至爲主，後至爲客。雷公曰∶臣悉盡意，受傳經脈，頌得從容之道，以合《從容》，不知陰陽，不知雌雄。帝曰∶三陽爲父，二陽爲衛，一陽爲紀。","bh":"所说的二阳，是指阳明；阳明脉气至于手太阴，脉象弦而沉急、搏指无力，若再逢热邪致病，多为死证。一阳是指少阳；少阳脉气至于手太阴，上连人迎，脉象弦急悬绝而不绝，这是少阳的病脉；若见纯阴无阳之脉，则为死证。三阴是六经之主，其气交于太阴，脉象沉伏鼓指而不浮，上则空悬于志心（心志）。二阴之气至于肺，其气归注膀胱，外连脾胃。一阴之气独自而至，则经气断绝，气浮而不鼓指，脉来钩而滑。这六种脉象，忽阴忽阳，交会相并，交错连通五脏，合于阴阳之理；先至者为主，后至者为客。雷公说：臣已尽得其意，接受经脉的传授，诵读而得到从容之道，以合于《从容》之论，但仍不能分辨阴阳，不能辨别雌雄。黄帝说：三阳为父，二阳为卫，一阳为纪。","notes":[],"pending":false},{"id":"sw79-3","tags":[],"yw":"三陰爲母，二陰爲雌，一陰爲獨使。二陽一陰，陽明主病，不勝一陰，脈而動，九竅皆沉。三陽一陰，太陽脈勝，一陰不能止，內亂五髒，外爲驚駭。二陰二陽，病在肺，少陰脈沉，勝肺傷脾，外傷四肢。二陰二陽皆交至，病在腎，罵詈妄行，巔疾爲狂。二陰一陽，病出於腎，陰氣客遊於心，脘下空竅，堤閉塞不通，四肢別離。一陰一陽代絕，此陰氣至心，上下無常，出入不知，喉咽干燥，病在土脾。二陽三陰，至陰皆在，陰不過陽，陽氣不能止陰，陰陽並絕，浮爲血瘕，沉爲膿。","bh":"三阴为母，二阴为雌，一阴为独使（单独行使）。二阳一阴，阳明主病，不能胜过一阴，脉动而九窍皆沉滞不通。三阳一阴，太阳之脉偏胜，一阴不能制止，内则扰乱五脏，外则发为惊骇。二阴二阳，病在肺，少阴之脉沉，胜肺则伤脾，外则伤及四肢。二阴二阳之气都交至，病在肾，症见骂詈妄行，巅顶之疾发为狂证。二阴一阳，病出于肾，阴气客游于心，脘下空窍之处，堤防闭塞不通，四肢如同与身分离。一阴一阳之脉代而断绝，这是阴气至心，上下无常，出入不知（不可测度），喉咽干燥，病在土脏之脾。二阳三阴，至阴之气都在内，阴不能过阳，阳气不能制止阴气，阴阳并绝，脉浮则为血瘕，脉沉则为脓（痈脓）。","notes":[],"pending":false},{"id":"sw79-4","tags":[],"yw":"陰陽皆壯，下至陰陽，上合昭昭，下合冥冥，診決死生之期，遂合歲首。雷公曰∶請問短期。黃帝不應。雷公復問。黃帝曰。在經論中。雷公曰∶請聞短期。黃帝曰∶冬三月之病，病合於陽者，至春正月脈有死徵，皆歸出春。冬三月之病，在理已盡，草與柳葉皆殺，春陰陽皆絕，期在孟春。春三月之病，曰陽殺，陰陽皆絕，期在草干。夏三月之病，至陰不過十日，陰陽交，期在水。秋三月之病，三陽俱起，不治自已。陰陽交合者，立不能坐，坐不能起。","bh":"阴阳之气都很壮盛，下至于阴阳之宅，上合于昭昭之天，下合于冥冥之地；诊察决断死生之期，就要与岁首的时令相合。雷公说：请问什么叫短期（近期的死期）。黄帝不回答。雷公又问。黄帝说：在经论之中。雷公说：请讲讲短期。黄帝说：冬季三个月的病，病与阳相合的，到春季正月脉中出现死征，其死期都出在春季之末。冬季三个月的病，在理上已经气尽，草与柳叶都枯杀之时，若春天阴阳之气皆绝，死期在孟春。春季三个月的病，名叫阳杀，阴阳皆绝的，死期在草干之时。夏季三个月的病，至阴（脾）之病不超过十日；若阴阳交，死期在水（水旺之时）。秋季三个月的病，三阳之气俱起，不治也会自愈。若阴阳交合为病，则立而不能坐，坐而不能起。","notes":[],"pending":false},{"id":"sw79-5","tags":[],"yw":"三陽獨至，期在石水。二陰獨至，期在盛水。<目錄>卷第二十四","bh":"三阳之气单独而至，死期在石水（水结冰如石之时）；二阴之气单独而至，死期在盛水（水势盛大之时）。","notes":[],"pending":false}]},
{"id":"sw80","book":"素问","no":80,"title":"方盛衰论","titleTw":"方盛衰論","tags":["jingluo","zhenfa","bingji"],"brief":"论气之多少逆从与五脏气虚所梦，提出诊有十度、诊合阴阳虚实之道，强调持诊必上下度量而不失人情。","pending":false,"sections":[{"id":"sw80-1","tags":[],"yw":"雷公請問∶氣之多少，何者爲逆？何者爲從？黃帝答曰∶陽從左，陰從右，老從上，少從下，是以春夏歸陽爲生，歸秋冬爲死，反之，則歸秋冬爲生，是以氣多少逆皆爲厥。問曰∶有餘者厥耶？答曰∶一上不下，寒厥到膝，少者秋冬死，老者秋冬生。氣上不下，頭痛巔疾，求陽不得，求陰不審，五部隔無徵，若居曠野，若伏空室，綿綿乎屬不滿日。是以少氣之厥，令人妄夢，其極至迷。三陽絕，三陰微，是爲少氣。是以肺氣虛則使人夢見白物，見人斬血借借，得其時則夢見兵戰。","bh":"雷公请问说：气的多少，怎样是逆？怎样是从？黄帝回答说：阳从左，阴从右；老者从上，少者从下。所以春夏之病归于阳的为生，归于秋冬的为死；反过来说，归于秋冬的为生，所以气有多少皆逆就都成为厥。雷公问道：气有余的也会成厥吗？回答说：气一上而不下（上逆不下），寒厥及于膝部，少年人在秋冬死，老年人在秋冬生。气上不下，发为头痛、巅顶之疾，求之于阳而不得，求之于阴又不明，五脏之部阻隔而无征象可验，如同居于旷野，如同伏于空室，绵绵然视其气将尽而不满一日（危殆不久）。所以少气之厥，使人妄梦，甚至至于迷乱。三阳之气绝，三阴之气微，这就是少气。所以肺气虚则使人梦见白色之物，梦见人被斩杀而血肉狼藉；若得其当旺之时，则梦见兵战。","notes":[],"pending":false},{"id":"sw80-2","tags":[],"yw":"腎氣虛則使人夢見舟船溺人，得其時則夢伏水中，若有畏恐。肝氣虛則夢見菌香生草，得其時則夢伏樹下不敢起。心氣虛則夢救火陽物，得其時則夢燔灼。脾氣虛則夢飲食不足，得其時則夢築垣蓋屋。此皆五髒氣虛，陽氣有餘，陰氣不足，合之五診，調之陰陽，以在《經脈》。診有十度，度人脈度、髒度、肉度、筋度、俞度。陰陽氣盡，人病自具。脈動無常，散陰頗陽，脈脫不具，診無常行，診必上下，度民君卿，受師不卒，使術不明，不察逆從，是爲妄行，持雌失雄，棄陰附陽，不知並合，診故不明，傳之後世，反論自章。","bh":"肾气虚则使人梦见舟船淹死人；若得其当旺之时，则梦见伏于水中，好像有所畏惧惊恐。肝气虚则梦见菌类香草与生长的草；得其时则梦见伏于树下不敢起身。心气虚则梦见救火和阳热之物；得其时则梦见焚烧灼热。脾气虚则梦见饮食不足；得其时则梦见筑墙盖屋。这些都是五脏气虚、阳气有余、阴气不足所致；要结合五诊之法，调和阴阳，内容详见《经脉》。诊法有十度，即度人的脉度、脏度、肉度、筋度、俞度（各分阴阳而为十度）。阴阳之气尽竭，人的病就自然具备（显露）。脉动无常，散在阴而偏于阳，脉象脱失不全，诊察就没有常法可行；诊察必须上察下察，以度量庶民、君、卿的差别。受师之教而不能卒业，致使医术不明，不能察知逆从，这就是妄行；持雌失雄，弃阴附阳，不知合并（综合考虑），所以诊断不明；传于后世，反而使谬论彰明。","notes":[],"pending":false},{"id":"sw80-3","tags":[],"yw":"至陰虛，天氣絕；至陽盛，地氣不足。陰陽並交，至人之所行。陰陽並交者，陽氣先至，陰氣後至。是以聖人持診之道，先後陰陽而持之，奇恆之勢乃六十首，診合微之事，追陰陽之變，章五中之情，其中之論，取虛實之要，定五度之事，知此乃足以診。是以切陰不得陽，診消亡，得陽不得陰，守學不湛，知左不知右，知右不知左，知上不知下，知先不知後，故治不久。知丑知善，知病知不病，知高知下，知坐知起，知行知止，用之有紀，診道乃具，萬世不殆。","bh":"至阴虚，则天气绝（所禀之阳气竭绝）；至阳盛，则地气不足。阴阳并交，是至人（至高明的医者）所行的方法。所谓阴阳并交，是指阳气先至，阴气后至。所以圣人持诊之道，是先辨别阴阳的先后而把握它；奇恒之势共有六十首（六十种），诊察要结合细微之事，追踪阴阳的变化，彰明五脏的情形；其中的论述，取虚实之要领，定五度之事，懂得这些才足以诊病。所以切得阴而不得阳，诊断就消亡；得阳而不得阴，治学就不精深。知左不知右，知右不知左，知上不知下，知先不知后，所以治病不能长久。要知丑知善，知病知不病，知高知下，知坐知起，知行知止，运用有纲纪，诊道才算完备，才能万世不出差错。","notes":[],"pending":false},{"id":"sw80-4","tags":[],"yw":"起所有餘，知所不足，度事上下，脈事因格。是以形弱氣虛死；形氣有餘，脈氣不足死；脈氣有餘，形氣不足生。是以診有大方，坐起有常，出入有行，以轉神明，必清必淨，上觀下觀，司八正邪，別五中部，按脈動靜，循尺滑澀，寒溫之意，視其大小，合之病能，逆從以得，復知病名，診可十全，不失人情，故診之或視息視意，故不失條理，道甚明察，故能長久。不知此道，失經絕理，亡言妄期，此謂失道。<目錄>卷第二十四","bh":"由所见的有余，推知所存在的不足；度量病情之上下，脉事因而格致（推究）。所以形弱气虚的死；形气有余而脉气不足的死；脉气有余而形气不足的生。所以诊病有大法：坐起有常规，出入有法度，以运转神明；必须清静，上观下观，司察八风的邪正，辨别五脏中部的部位，按脉的动与静，循尺肤的滑与涩，察寒温之意，视其大小，与病能（病情表现）相合；由逆从而得病情，再知病名，诊断可以十全，不失人情（人情事理）。所以诊察时有时观察呼吸、观察情意，因而不失条理；道理极为明察，所以能长久。不知此道，丧失经旨、断绝医理，妄言而妄定期限，这就叫作失道。","notes":[],"pending":false}]},
{"id":"sw81","book":"素问","no":81,"title":"解精微论","titleTw":"解精微論","tags":["ci","zangxiang","yinyang"],"brief":"以哭泣涕泪之生与不出，阐发心肾水火、神志相感之理，并以厥证、冲风泣下说明阴阳上下相并之变。","pending":false,"sections":[{"id":"sw81-1","tags":[],"yw":"黃帝在明堂，雷公請曰∶臣授業傳之，行教以經論，從容形法，陰陽刺灸，湯藥所滋。行治有賢不肖，未必能十全。若先言悲哀喜怒，燥溼寒暑，陰陽婦女，請問其所以然者，卑賤富貴，人之形體所從，羣下通使，臨事以適道術，謹聞命矣。請問有HT愚僕漏之問，不在經者，欲聞其狀。帝曰∶大矣。公請問∶哭泣而淚不出者，若出而少涕，其故何也？帝曰∶在經有也。復問∶不知水所從生，涕所從出也。帝曰∶若問此者，無益於治也，工之所知，道之所生也。","bh":"黄帝在明堂，雷公请问说：臣接受所传授的学业，施行教化依据经论，以从容、形法、阴阳刺灸、汤药之所滋养来治病。行医治病的人有贤有不肖，未必都能十全。至于先讲悲哀喜怒、燥湿寒暑、阴阳妇女之事，请问之所以这样的道理；卑贱富贵、人的形体所从（体质差异）、群下通使（下属役使之人），临事以合于道术，我都谨听教诲了。请问还有些愚笨卑陋的问题，不在经典之中，想听听其中的情形。黄帝说：问得很大啊。雷公请问说：哭泣而眼泪不出的，或者出了眼泪而鼻涕很少，这是什么缘故？黄帝说：这在经典中已有记载。又问：不知水（眼泪）从何处生，涕从何处出。黄帝说：你问这个，对治疗没有益处，但却是医生应该知道的，也是医道所由产生的根本。","notes":[],"pending":false},{"id":"sw81-2","tags":[],"yw":"夫心者，五髒之專精也，目者其竅也，華色者其榮也，是以人有德也，則氣和於目，有亡，憂知於色。是以悲哀則泣下，泣下水所由生。水宗者積水也，積水者至陰也，至陰者腎之精也。宗精之水所以不出者，是精持之也，輔之裹之，故水不行也。夫水之精爲志，火之精爲神，水火相感，神志俱悲，是以目之水生也。故諺言曰∶心悲名曰志悲。志與心精，共湊於目也。是以俱悲則神氣傳於心精，上不傳於志而志獨悲，故泣出也。泣涕者腦也，腦者陰也，髓者骨之充也，故腦滲爲涕。","bh":"心是五脏的专精（专主之精），目是它的外窍，面色光泽是它的荣华。所以人有得意之事，则气和表现于目；有所失亡，忧郁之情表现于面色。所以悲哀就会流泪，流泪的水由此而生。水宗是积水之处，积水是至阴，至阴是肾之精。宗精之水之所以不外出的，是因为精把它持守著，辅佐包裹著它，所以水不能流行。水之精为志，火之精为神，水火相互感应，神志都悲，所以目中之水生出。所以谚语说：心悲名叫志悲。志与心之精，共同凑聚于目。所以神志俱悲，则神气传于心精，上不传于志而志独自悲伤，所以泪出。泣涕属于脑，脑属阴；髓是骨的充养，所以脑渗而为涕。","notes":[],"pending":false},{"id":"sw81-3","tags":[],"yw":"志者骨之主也，是以水流而涕從之者，其行類也。夫涕之與泣者，譬如人之兄弟，急則俱死，生則俱生，其志以早悲，是以涕泣俱出而橫行也。夫人涕泣俱出而相從者，所屬之類也。雷公曰∶大矣。請問人哭泣而淚不出者，若出而少，涕不從之何也？帝曰∶夫泣不出者，哭不悲也。不泣者，神不慈也。神不慈則志不悲，陰陽相持，泣安能獨來。夫志悲者惋，惋則衝陰，衝陰則志去目，志去則神不守精，精神去目，涕泣出也。且子獨不誦不念夫經言乎，厥則目無所見。","bh":"志是骨的主宰，所以水流而涕也相随而出，是因为它们同类而行。涕与泣，譬如人的兄弟，危急时俱死，生时俱生；其志因早有悲伤，所以涕和泪一并流出而横行（流溢）。人涕泪俱出而相随，是因为所属的类别相同。雷公说：道理真大啊。请问人哭泣而泪不出的，或者出了而很少，涕不随之而出，这是为什么？黄帝说：哭泣而不流泪的，是哭得不悲伤。不泣的，是神不慈（神情不哀）。神不慈则志不悲，阴阳相互持平（相持），泪怎么能独自来呢？志悲者心中惋（郁闷），惋则冲阴（上冲于阴），冲阴则志去于目；志去则神不守精，精神去于目，涕泪就出来了。你难道没有诵读、没有回想经上的话吗？厥证则目无所见。","notes":[],"pending":false},{"id":"sw81-4","tags":[],"yw":"夫人厥則陽氣並於上，陰氣並於下。陽並於上，則火獨光也；陰並於下，則足寒，足寒則脹也。夫一水不勝五火，故目盲。是以衝風，泣下而不止。夫風之中目也，陽氣內守於精，是火氣燔目，故見風則泣下也。有以比之，夫火疾風生乃能雨，此之類也。陰陽類論∶（音廉）方盛衰論∶菌（祛倫切）解精微論∶HT（士銜切）湊（粗勾切）<目錄>","bh":"人患厥证，则阳气并于上，阴气并于下。阳并于上，则火独旺（独光）；阴并于下，则足寒，足寒则胀。一水不能胜五火，所以目盲。所以被风所冲，泪下不止。风之中于目，是阳气内守于精，这是火气燔灼于目，所以见风就流泪。可以打个比方：火势急则风生，风生才能下雨，就是这一类。","notes":[],"pending":false}]},
{"id":"ls01","book":"灵枢","no":1,"title":"九针十二原","titleTw":"九針十二原","tags":["ci","jingluo","zhenfa"],"brief":"阐述微针之道与九针形制用途、补泻迎随之法，并论十二原穴与井荥俞经合五俞，为针经之总纲。","pending":false,"sections":[{"id":"ls01-1","tags":[],"yw":"黃帝問於岐伯曰：餘子萬民，養百姓而收其租稅；餘哀其不給而屬有疾病。餘欲勿使被毒藥，無用砭石，欲以微針通其經脈，調其血氣，榮其逆順出入之會。令可傳於後世，必明爲之法，令終而不滅，久而不絕，易用難忘，爲之經紀，異其章，別其表裏，爲之終始。令各有形，先立針經。願聞其情。岐伯答曰：臣請推而次之，令有綱紀，始於一，終於九焉。請言其道！小針之要，易陳而難入。粗守形，上守神。神乎神，客在門。未赭其疾，惡知其原？刺之微在速遲。","bh":"黄帝问岐伯说：我把万民当作子女，养育百姓而收取他们的租税；我怜悯他们生活不能自给，又接连发生疾病。我想不使他们遭受药物的毒害，也不用砭石，而想用微针（细针）来疏通他们的经脉，调和他们的血气，使营卫逆顺出入的会合之处得以畅通。要使这些可以传于后世，必须明确地立为法则，使它终而不灭、久而不绝，容易使用而难以遗忘；为此建立纲纪，区分章法，辨别表里，确定终始。使针各有其形制，先确立《针经》。希望听听其中的详情。岐伯回答说：请让我推究而依次陈述，使它有了纲纪，从一开始，到九而止。请让我讲讲其中的道理！小针（微针）的要领，容易陈述而难以深入。粗工守其形（形体上的刺法），上工守其神（神气）。神啊神，客（邪气）在门（门户）。没有见到疾病的表现，怎么知道它的根源？针刺的微妙在于疾徐（快慢）。","notes":[],"pending":false},{"id":"ls01-2","tags":[],"yw":"粗守關，上守機，機之動，不離其空。空中之機，清靜而微。其來不可逢，其往不可追。知機之道者，不可掛以發。不知機道，扣之不發。知其往來，要與之期。粗之闇乎，妙哉，工獨有之。往者爲逆，來者爲順，明知逆順，正行無問。迎而奪之，惡得無虛？追而濟之，惡得無實？迎之隨之，以意和之，針道畢矣。凡用針者，虛則實之，滿則泄之，宛陳則除之，邪勝則虛之。大要曰：徐而疾則實，疾而徐則虛。言實與虛，若有若無。察後與先。若存若亡。","bh":"粗工守著关（四肢关节），上工守著机（气机），机的变动，不离其空（孔穴）。空中的机，清静而微妙。它来时不可逢（迎而补），它去时不可追（追而泻）。懂得机之道的，不会有毫发之差；不懂机道的，如同扣弦而不发矢。知道它的往来，就要与它相期（把握时机）。粗工昏昧不明，微妙啊，只有上工独自掌握。往者为逆，来者为顺；明白逆顺，就可以正行而无须疑问。迎而夺之，怎么会不虚？追而济之，怎么会不实？迎之随之，以意来调和它，针道就完备了。凡用针者，虚则实之（补），满则泄之（泻），宛陈（郁积陈久）则除之，邪胜则虚之。大要上说：徐进针而疾出针则实（补），疾进针而徐出针则虚（泻）。所说的实与虚，若有若无。要审察后与先（先后），若存若亡。","notes":[],"pending":false},{"id":"ls01-3","tags":[],"yw":"爲虛與實，若得若失。虛實之要，九針最妙，補瀉之時，以針爲之。瀉曰，必持內之，放而出之，排陽得針，邪氣得泄。按而引針，是謂內溫，血不得散，氣不得出也。補曰，隨之隨之，意若妄之。若行若按，如蚊虻止，如留如還，去如弦絕，令左屬右，其氣故止，外門已閉，中氣乃實，必無留血，急取誅之。持針之道，堅者爲寶。正指直刺，無針左右。神在秋毫，屬意病者。審視血脈者，刺之無殆。方刺之時，必在懸陽，及與兩衛。神屬勿去，知病存亡。","bh":"辨别虚与实，若得若失。虚实的关键，九针最为奥妙；补泻之时，以针来进行。泻法是：必须持针纳入，放开而出针，排开阳气而得针（使针道通畅），邪气得以宣泄。按而引针（按压著引针外出），这叫作内温，血不得散，气不得出（邪气不得出）。补法是：随之随之（顺其气而行），意好像若无其事。或行或按，如蚊虻叮止，如留如还；出针如弓弦断绝（迅速），令左手属（接续）右手，其气因而留止；外门已闭，中气乃实，必不留血，有留血则急取而诛（去除）之。持针之道，以坚（坚定有力）为宝；正指直刺，不要使针左右偏斜。精神要集中在秋毫（极细微）之处，留意于病人。审视血脉所在，刺之就没有危险。正当针刺之时，必在悬阳（体表阳气的显露），以及与两卫（两旁的卫气）。神气属守而勿去，知病的存亡。","notes":[],"pending":false},{"id":"ls01-4","tags":[],"yw":"血脈者在俞橫居，視之獨澄，切之獨堅。九針之名，各不同形。一曰鑱針，長一寸六分；二曰員針，長一寸六分；三曰提針，長三寸半；四曰鋒針，長一寸六分；五曰鈹針，長四寸，廣二分半；六曰員利針，長一寸六分；七曰毫針，長三寸六分；八曰長針，長七寸；九曰大針，長四寸。鑱針者，頭大末銳，去瀉陽氣；員針者，針如卵形，揩摩分間，不得傷肌肉者，以瀉分氣；提針者，鋒如黍粟之銳，主按脈勿陷，以致其氣；鋒針者，刃三隅以發痼疾，鈹針者，末如劍鋒，以取大膿；員利針者，大如釐，且員且銳，中身微大，以取暴氣；毫針者，尖如蚊虻喙，靜以徐往，微以久留之而養，以取痛痹；長針者，鋒利身薄，可以取遠痹；大針者，尖如梃，其鋒微員，以瀉機關之水也。","bh":"血脉在俞穴横居（横向布于体表），看上去清澈独明，切之独坚。九针的名称，形状各不相同。一是镵针，长一寸六分；二是员针，长一寸六分；三是提针（𫔂针），长三寸半；四是锋针，长一寸六分；五是铍针，长四寸，宽二分半；六是员利针，长一寸六分；七是毫针，长三寸六分；八是长针，长七寸；九是大针，长四寸。镵针，头大末端锐利，用以泻阳气；员针，针如卵形，揩摩于分肉之间，不损伤肌肉，用以泻分肉之气；提针，锋如黍粟之锐，主于按脉而不陷入，以引致其气；锋针，刃有三隅（三棱），用以发痼疾（久病）；铍针，末端如剑锋，用以取大脓；员利针，大如牦（牦牛尾毛），既圆且锐，针身中段稍大，用以取暴气；毫针，尖如蚊虻的喙，静以徐往，微以久留之而养（扶养正气），用以取痛痹；长针，锋利而针身薄，可以取远痹（深部之痹）；大针，尖如梃（木棒），其锋微圆，用以泻机关（关节）之水。","notes":[],"pending":false},{"id":"ls01-5","tags":[],"yw":"九針畢矣。夫氣之在脈也，邪氣在上，濁氣在中，清氣在下。故針陷脈則邪氣出，針中脈則濁氣出，針太深則邪氣反沉、病益。故曰：皮肉筋脈，各有所處。病各有所宜。各不同形，各以任其所宜，無實無虛。損不足而益有餘，是謂甚病。病益甚，取五脈者死，取三脈者恇；奪陰者死，奪陽者狂，針害畢矣。刺之而氣不至，無問其數。刺之而氣至，乃去之，勿復針。針各有所宜，各不同形，各任其所，爲刺之要。氣至而有效，效之信，若風之吹雲，明乎若見蒼天，刺之道畢矣。","bh":"九针讲完了。气在脉中的分布：邪气在上（上部），浊气在中（中部），清气在下（下部）。所以针陷脉（深刺其脉）则邪气出，针中脉（刺中其脉）则浊气出，针刺太深则邪气反而深入而病益甚。所以说：皮肉筋脉各有所处（各有部位），病各有其所宜（的治法）。九针各不同形，各任其所宜，不可实其实、虚其虚。损不足而益有余，这叫作加重病情。病益加重的，取五脉（五脏阴经之脉）的会死，取三脉（三阳之脉）的会使人怯弱（恇）；夺阴的会死，夺阳的会发狂。针害讲完了。针刺而气不至（不得气），不要拘于刺的次数；针刺而气至，就出针，不要再刺。针各有所宜，各不同形，各任其所当任，这是针刺的关键。气至而有效，其效之可信，如风吹云散，明亮得像见到苍天，针刺之道就完备了。","notes":[],"pending":false},{"id":"ls01-6","tags":[],"yw":"黃帝曰：願聞五髒六腑所出之處。岐伯曰：五髒五俞，五五二十五俞，六腑六俞，六六三十六俞，經脈十二，絡脈十五，凡二十七氣，以上下。所出爲井，所溜爲滎，所注爲俞，所行爲經，所入爲合，二十七氣所行，皆在五俞也。節之交，三百六十五會，知其要者，一言而終，不知其要，流散無窮。所言節者，神氣之所遊行出入也。非皮肉筋骨也。觀其色，察其目，知其散復。一其形，聽其動靜，知其邪正，右主推之，左持而御之，氣至而去之。凡將用針，必先診脈，視氣之劇易，乃可以治也。","bh":"黄帝说：希望听听五脏六腑经气所出之处。岐伯说：五脏各有五俞（井荥俞经合），五五共二十五俞；六腑各有六俞，六六共三十六俞。经脉十二，络脉十五，共二十七气，以上下运行。所出为井，所溜为荥，所注为俞，所行为经，所入为合；二十七气的运行，都在五俞之中。节（骨节）之交，有三百六十五会（穴）；知道其中要领的，一句话就完了，不知其要领的，就会流散无穷。所说的节，是神气游行出入之处，不是皮肉筋骨。观察其气色，察其目，就知道其（神气的）散与复。专一其形（体态），听其动静，知邪与正；右手主推而进针，左手持护而驾驭，气至则出针。凡将用针，必先诊脉，视气的剧易（轻重缓急），才可以治疗。","notes":[],"pending":false},{"id":"ls01-7","tags":[],"yw":"五髒之氣，已絕於內，而用針者反實其外，是謂重竭。重竭必死，其死也靜。治之者輒反其氣，取腋與膺。五髒之氣，已絕於外，而用針者反實其內，是謂逆厥。逆厥則必死，其死也躁。治之者反取四末。刺之害中而不去，則精泄；害中而去，則致氣。精泄則病益甚而恇，致氣則生爲癰瘍。五髒有六腑，六腑有十二原，十二原出於四關，四關主治五髒。五髒有疾，當取之十二原。十二原者，五髒之所以稟三百六十五節氣味也。五髒有疾也，應出十二原。","bh":"五脏之气已绝于内（阴虚），而用针者反实其外（补阳），这叫作重竭。重竭必死，其死时安静。治疗这种病的人反取其气（误治），取腋与膺（腋下、胸膺）之处。五脏之气已绝于外（阳虚），而用针者反实其内（补阴），这叫作逆厥。逆厥则必死，其死时躁扰。治疗的人反取四末（四肢末端）。针刺为害：刺中病邪而不去针，则精气外泄；刺中而去针（太早），则招致邪气（致气）。精泄则病益甚而怯弱，致气则生为痈疡。五脏有六腑（相配），六腑有十二原；十二原出于四关（两肘两膝四关节），四关主治五脏之病。五脏有疾，当取之十二原。十二原，是五脏禀受三百六十五节气味的所在。五脏有病，就会反应出于十二原。","notes":[],"pending":false},{"id":"ls01-8","tags":[],"yw":"十二原各有所出。明知其原，睹其應，而知五髒之害矣。陽中之少陰，肺也，其原出於太淵，太淵二。陽中之太陽，心也，其原出於大陵，大陵二。陰中之少陽，肝也，其原出於太衝，太衝二。陰中之至陰，脾也，其原出於太白，太白二。陰中之太陰，腎也，其原出於太溪，太溪二。膏之原，出於鳩尾，鳩尾一。肓之原，出於脖胦，脖胦一。凡此十二原者，主治五髒六腑之有疾者也。脹取三陽，飧泄取三陰。稟今夫五髒之有疾也，譬猶刺也，猶污也，猶結也，猶閉也。","bh":"十二原各有其出处。明知其原，观察其反应，就能知道五脏的病变了。阳中之少阴是肺，其原出于太渊，太渊二（左右各一）。阳中之太阳是心，其原出于大陵，大陵二。阴中之少阳是肝，其原出于太冲，太冲二。阴中之至阴是脾，其原出于太白，太白二。阴中之太阴是肾，其原出于太溪，太溪二。膏之原出于鸠尾，鸠尾一。肓之原出于脖胦（气海），脖胦一。凡此十二原，主治五脏六腑之有疾者。胀病取三阳（足三阳），飧泄取三阴（足三阴）。五脏之有疾，譬如被刺扎了，犹如被污染，犹如打了结，犹如闭塞不通。","notes":[],"pending":false},{"id":"ls01-9","tags":[],"yw":"刺雖久猶可拔也，污雖久猶可雪也，結雖久猶可解也，閉雖久猶可決也。或言久疾之不可取者，非其說也。夫善用針者，取其疾也，猶拔刺也，猶雪污也，猶解結也，猶決閉也。疾雖久，猶可畢也。言不可治者，未得其術也。刺諸熱者，如以手探湯；刺寒清者，如人不欲行。陰有陽疾者，取之下陵三裏，正往無殆，氣下乃止，不下復始也。疾高而內者，取之陰之陵泉；疾高而外者，取之陽之陵泉也。","bh":"刺虽久还可以拔去，污虽久还可以洗雪，结虽久还可以解开，闭虽久还可以决通。有人说久病不可取治，这种说法不对。善用针的人治其病，就如同拔刺、洗污、解结、决闭；病虽久，还是可以治好的。说不可治的，是没有掌握其方法。刺诸热病的，如以手探汤（轻浅而迅速）；刺寒清（寒证）的，如人不欲行（留针久留）。阴有阳疾（阴分有阳邪之疾）的，取之下陵三里（足三里），正确地进针没有危险，气下（邪气下降）乃止针，不下则重新开始。病高而在内（上部在里）的，取阴之陵泉（阴陵泉）；病高而在外（上部在表）的，取阳之陵泉（阳陵泉）。","notes":[],"pending":false}]},
{"id":"ls02","book":"灵枢","no":2,"title":"本输","titleTw":"本輸","tags":["ci","jingluo","zhenfa"],"brief":"详列各经井荥俞原经合诸穴的部位与取法，兼论六腑相合、颈项要穴及四时刺法浅深之序。","pending":false,"sections":[{"id":"ls02-1","tags":[],"yw":"黃帝問於岐伯曰：凡刺之道，必通十二經絡之所終始，絡脈之所別處，五俞之所留，六腑之所與合，四時之所出入，五髒之所溜處，闊數之度，淺深之狀，高下所至。願聞其解。岐伯曰：請言其次也。肺出於少商，少商者，手大指端內側也，爲井木；溜於魚際，魚際者，手魚也，爲滎；注於太淵，太淵魚後一寸陷者中也，爲俞；行於經渠，經渠寸口中也，動而不居爲經；入於尺澤，尺澤肘中之動脈也，爲合。手太陰經也。心出於中衝，中衝，手中指之端也，爲井木；流於勞宮，勞宮掌中中指本節之內間也，爲滎；注於大陵，大陵掌後兩骨之間方下者也，爲俞；行於間使，間使之道，兩筋之間，三寸之中也，有過則至，無過則止，爲經；入於曲澤，曲澤，肘內廉下陷者之中也，屈而得之，爲合。","bh":"黄帝问岐伯说：凡针刺的道理，必须通晓十二经络之所终始、络脉之所别处、五俞（井荥俞经合）之所留、六腑之所与合、四时之所出入、五脏之所溜处，以及阔数（宽窄）之度、深浅之状、高下所至（的部位）。希望听听其中的解说。岐伯说：请让我按次序讲。肺（手太阴）出于少商，少商在手大指端的内侧，为井木；溜于鱼际，鱼际在手鱼（大鱼际）处，为荥；注于太渊，太渊在鱼后一寸的凹陷中，为俞；行于经渠，经渠在寸口之中，动而不居（脉动不止），为经；入于尺泽，尺泽是肘中的动脉（处），为合。这是手太阴经。心（手心主）出于中冲，中冲在手中指的末端，为井木；流于劳宫，劳宫在掌中中指本节之内间（内侧），为荥；注于大陵，大陵在掌后两骨之间、方下（正当两骨之下）之处，为俞；行于间使，间使之道在两筋之间、三寸之中，有过（有病）则（脉气）至，无过则止，为经；入于曲泽，曲泽在肘内廉（内侧缘）下方的凹陷之中，屈肘而得之，为合。","notes":[],"pending":false},{"id":"ls02-2","tags":[],"yw":"手少陰也。肝出於大敦，大敦者，足大趾之端，及三毛之中也，爲井木；溜於行間，行間足大趾間也，爲滎；注於太衝，太衝行間上二寸陷者之中也，爲俞；行於中封，中封內踝之前一寸半，陷者之中，使逆則宛，使和則通，搖足而得之，爲經；入於曲泉，曲泉輔骨之下，大筋之上也，屈膝而得之，爲合。足厥陰也。脾出於隱白，隱白者，足大趾之端內側也，爲井木；溜於大都，大都本節之後下陷者之中也，爲滎；注於太白，太白腕骨之下也，爲俞；行於商丘，商丘內踝之下陷者之中也，爲經；入於陰之陵泉，陰之陵泉，輔骨之下陷者之中也，伸而得之，爲合。","bh":"这是手少阴（原文如此，指手心主之脉）。肝（足厥阴）出于大敦，大敦在足大趾之端及三毛之中（大趾爪甲后丛毛处），为井木；溜于行间，行间在足大趾（与次趾）之间，为荥；注于太冲，太冲在行间上二寸的凹陷之中，为俞；行于中封，中封在内踝之前一寸半的凹陷之中，使（足）逆则气郁滞（宛），使和则气通，摇足而得之，为经；入于曲泉，曲泉在辅骨（腓骨）之下、大筋之上，屈膝而得之，为合。这是足厥阴。脾（足太阴）出于隐白，隐白在足大趾之端的内侧，为井木；溜于大都，大都在本节（第一跖趾关节）之后下方的凹陷之中，为荥；注于太白，太白在腕骨（内侧核骨）之下，为俞；行于商丘，商丘在内踝之下的凹陷之中，为经；入于阴之陵泉（阴陵泉），阴之陵泉在辅骨之下的凹陷之中，伸足而得之，为合。","notes":[],"pending":false},{"id":"ls02-3","tags":[],"yw":"足太陰也。腎出於湧泉，湧泉者足心也，爲井木；溜於然谷，然谷，然骨之下者也，爲滎；注於太溪，太溪內踝之後跟骨之上陷中者也，爲俞；行於復溜，復溜，上內踝二寸，動而不休，爲經；入於陰谷，陰谷，輔骨之後，大筋之下，小筋之上也，按之應手，屈膝而得之，爲合。足少陰經也。膀胱出於至陰，至陰者，足小趾之端也，爲井金；溜於通谷，通谷，本節之前外側也，爲滎；注於束骨，束骨，本節之後陷者中也，爲俞；過於京骨，京骨，足外側大骨之下，爲原；行於昆侖，昆侖，在外踝之後，跟骨之上，爲經；入於委中，委中，膕中央，爲合，委而取之。","bh":"这是足太阴。肾（足少阴）出于涌泉，涌泉在足心，为井木；溜于然谷，然谷在然骨（舟骨）之下，为荥；注于太溪，太溪在内踝之后、跟骨之上的凹陷中，为俞；行于复溜，复溜在内踝上二寸，动而不休（脉动不止），为经；入于阴谷，阴谷在辅骨之后、大筋之下、小筋之上，按之应手，屈膝而得之，为合。这是足少阴经。膀胱（足太阳）出于至阴，至阴在足小趾之端，为井金；溜于通谷，通谷在本节之前的外侧，为荥；注于束骨，束骨在本节之后的凹陷中，为俞；过于京骨，京骨在足外侧大骨之下，为原；行于昆仑，昆仑在外踝之后、跟骨之上，为经；入于委中，委中在腘（膝腘）中央，为合，委（屈膝）而取之。","notes":[],"pending":false},{"id":"ls02-4","tags":[],"yw":"足太陽也。膽出於竅陰，竅陰者，足小趾次趾之端也，爲井金；溜於俠溪，俠溪，足小趾次趾之間也，爲滎；注於臨泣，臨泣，上行一寸半，陷者中也，爲俞；過於丘墟，丘墟，外踝之前下陷者中也，爲原。行於陽輔，陽輔外踝之上輔骨之前及絕骨之端也，爲經；入於陽之陵泉，陽之陵泉，在膝外陷者中也，爲合，伸而得之。足少陽也。胃出於厲兌，厲兌者，足大趾內次趾之端也，爲井金；溜於內庭，內庭，次趾外間也，爲滎；注於陷谷，陷谷者，上中指內間上行二寸陷者中也，爲俞；過於衝陽，衝陽，足跗上五寸陷者中也，爲原，搖足而得之；行於解溪，解溪，上衝陽一寸半陷者中也，爲經；入於下陵，下陵，膝下三寸胻骨外三裏也，爲合；復下三裏三寸，爲巨虛上廉，復下上廉三寸，爲巨虛下廉也；大腸屬上，小腸屬下，足陽明胃脈也。","bh":"这是足太阳。胆（足少阳）出于窍阴，窍阴在足小趾次趾（第四趾）之端，为井金；溜于侠溪，侠溪在足小趾次趾之间，为荥；注于临泣，临泣（自侠溪）上行一寸半的凹陷中，为俞；过于丘墟，丘墟在外踝之前下的凹陷中，为原；行于阳辅，阳辅在外踝之上、辅骨之前及绝骨之端，为经；入于阳之陵泉（阳陵泉），阳之陵泉在膝外的凹陷中，为合，伸足而得之。这是足少阳。胃（足阳明）出于厉兑，厉兑在足大趾（内侧）次趾之端，为井金；溜于内庭，内庭在次趾外间，为荥；注于陷谷，陷谷在中趾内间（次趾与中趾之间）上行二寸的凹陷中，为俞；过于冲阳，冲阳在足跗（足背）上五寸的凹陷中，为原，摇足而得之；行于解溪，解溪在冲阳上一寸半的凹陷中，为经；入于下陵，下陵是膝下三寸、胻骨（胫骨）外（旁）的三里，为合；再往下三里三寸（三里下三寸），为巨虚上廉；再往下上廉三寸，为巨虚下廉。大肠属上（上廉），小肠属下（下廉），这是足阳明胃脉。","notes":[],"pending":false},{"id":"ls02-5","tags":[],"yw":"大腸小腸，皆屬於胃，是足陽明也。三焦者，上合手少陽，出於關衝，關衝者，手小指次指之端也，爲井金；溜於液門，液門，小指次指之間也，爲滎；注於中渚，中渚，本節之後陷者中也，爲俞；過於陽池，陽池，在腕上陷者之中也，爲原；行於支溝，支溝，上腕三寸兩骨之間陷者中也，爲經；入於天井，天井，在肘外大骨之上陷者中也，爲合，屈肘而得之；三焦下腧在於足大趾之前，少陽之後，出於膕中外廉，名曰委陽，是太陽絡也，手少陽經也。","bh":"大肠、小肠都属于胃，这就是足阳明（之脉）。三焦，上合于手少阳，出于关冲，关冲在手小指次指（无名指）之端，为井金；溜于液门，液门在小指次指之间，为荥；注于中渚，中渚在本节之后的凹陷中，为俞；过于阳池，阳池在腕上的凹陷之中，为原；行于支沟，支沟在腕上三寸、两骨之间的凹陷中，为经；入于天井，天井在肘外大骨之上的凹陷中，为合，屈肘而得之。三焦的下腧在足大趾之前、少阳（足少阳）之后，出于腘中外廉，名叫委阳，这是太阳的络脉（所属），手少阳经也。","notes":[],"pending":false},{"id":"ls02-6","tags":[],"yw":"三焦者，足少陽太陰之所將，太陽之別也，上踝五寸，別入貫腨腸，出於委陽，並太陽之正，入絡膀胱，約下焦，實則閉癃，虛則遺溺，遺溺則補之，閉癃則瀉之。手太陽小腸者，上合手太陽，出於少澤，少澤，小指之端也，爲井金；溜於前谷，前谷，在手外廉本節前陷者中也，爲滎；注於後溪，後溪者，在手外側本節之後也，爲俞；過於腕骨，腕骨，在手外側腕骨之前，爲原；行於陽谷，陽谷，在銳骨之下陷者中也，爲經；入於小海，小海，在肘內大骨之外，去端半寸，陷者中也，伸臂而得之，爲合。","bh":"三焦，是足少阳、太阴（之气）所统率（将）的，是太阳的别络；上踝五寸，别入而贯穿腨肠（小腿肚），出于委阳，并合太阳之正脉，入络膀胱，约束下焦；实则（邪实）闭癃（小便不通），虚则遗溺（小便失禁）；遗溺则补之，闭癃则泻之。手太阳小肠，上合于手太阳（经），出于少泽，少泽在小指之端，为井金；溜于前谷，前谷在手外廉（外侧缘）本节前的凹陷中，为荥；注于后溪，后溪在手外侧本节之后，为俞；过于腕骨，腕骨在手外侧腕骨之前，为原；行于阳谷，阳谷在锐骨（尺骨小头）之下的凹陷中，为经；入于小海，小海在肘内大骨之外、距骨端半寸的凹陷中，伸臂而得之，为合。","notes":[],"pending":false},{"id":"ls02-7","tags":[],"yw":"手太陽經也。大腸上合手陽明，出於商陽，商陽，大指次指之端也，爲井金；溜於本節之前二間，爲滎；注於本節之後三間，爲俞；過於合谷，合谷，在大指岐骨之間，爲原；行於陽溪，陽溪，在兩筋間陷者中也，爲經；入於曲池，在肘外輔骨陷者中，屈臂而得之，爲合。手陽明也。是謂五髒六腑之俞，五五二十五俞，六六三十六俞也。六腑皆出足之三陽，上合於手者也。缺盆之中，任脈也，名曰天突。一次，任脈側之動脈足陽明也，名曰人迎；二次脈，手陽明也，名曰扶突；三次脈，手太陽也，名曰天窗；四次脈，足少陽也，名曰天容；五次脈，手少陽也，名曰天牖；六次脈，足太陽也，名曰天柱；七次脈，頸中央之脈，督脈也，名曰風府。","bh":"这是手太阳经。大肠，上合于手阳明，出于商阳，商阳在大指次指（食指）之端，为井金；溜于本节之前的二间，为荥；注于本节之后的三间，为俞；过于合谷，合谷在大指（与次指）岐骨（两骨分歧）之间，为原；行于阳溪，阳溪在两筋之间的凹陷中，为经；入于曲池，曲池在肘外辅骨的凹陷中，屈臂而得之，为合。这是手阳明。以上所说就是五脏六腑之俞，五五二十五俞，六六三十六俞。六腑都出于足之三阳，而上合于手（的阳经）。缺盆之中是任脉，名叫天突。其第一次（第一行的脉），在任脉侧旁的动脉处，是足阳明，名叫人迎；二次脉是手阳明，名叫扶突；三次脉是手太阳，名叫天窗；四次脉是足少阳，名叫天容；五次脉是手少阳，名叫天牖；六次脉是足太阳，名叫天柱；七次脉在颈中央，是督脉，名叫风府。","notes":[],"pending":false},{"id":"ls02-8","tags":[],"yw":"腋內動脈手太陰也，名曰天府。腋下三寸手心主也，名曰天池。刺上關者，呿不能欠。刺下關者，欠不能呿。刺犢鼻者，屈不能伸。刺兩關者，伸不能屈。足陽明，俠喉之動脈也，其俞在膺中。手陽明，次在其俞外，不至曲頰一寸。手太陽當曲頰。足少陽在耳下曲頰之後。手少陽出耳後上加完骨之上。足太陽俠項大筋之中，發際。陰尺動脈，在五裏，五俞之禁也。肺合大腸，大腸者，傳道之腑。心合小腸，小腸者，受盛之腑。肝合膽，膽者中精之腑。","bh":"腋内动脉是手太阴，名叫天府。腋下三寸是手心主（手厥阴），名叫天池。刺上关的，要使口张开而不能合（呿不能欠）。刺下关的，要使口合而不能张（欠不能呿）。刺犊鼻的，要屈膝而不能伸。刺两关的，要伸而不能屈。足阳明是侠（夹）喉的动脉，其俞（腧穴）在膺中（胸部）。手阳明之俞次在其（足阳明）俞之外，不到曲颊一寸。手太阳正当曲颊。足少阳在耳下曲颊之后。手少阳出耳后，上（再加）于完骨之上。足太阳侠（夹）项部大筋之中，在发际（之下）。阴尺动脉在五里，这是五俞的禁刺之处。肺合大肠，大肠是传道（传导）之腑。心合小肠，小肠是受盛之腑。肝合胆，胆是中精之腑（藏精汁之腑）。","notes":[],"pending":false},{"id":"ls02-9","tags":[],"yw":"脾合胃，胃者五谷之腑。腎合膀胱，膀胱者津液之腑也。少陽屬腎，腎上連肺，故將兩髒。三焦者，中瀆之腑也，水道出焉，屬膀胱，是孤之腑也，是六腑之所與合者。春取絡脈諸滎大經分肉之間，甚者深取之，間者淺取之。夏取諸俞孫絡肌肉皮膚之上。秋取諸合，餘如春法。冬取諸井諸俞之分，欲深而留之。此四時之序，氣之所處，病之所舍，髒之所宜。轉筋者，立而取之，可令遂已。痿厥者，張而刺之，可令立快也。","bh":"脾合胃，胃是五谷之腑。肾合膀胱，膀胱是津液之腑。少阳（三焦）属肾，肾上连肺，所以（肾）将（统率）两脏。三焦是中渎之腑（沟渠之腑），水道由此而出，属于膀胱，这是孤之腑（无脏相配之腑）。这就是六腑之所与合者。春天取络脉、诸荥，以及大经分肉之间，病重的深取之，病轻（间者）的浅取之。夏天取诸俞、孙络，在肌肉皮肤之上。秋天取诸合，其余如同春法。冬天取诸井、诸俞之分，要深刺而留针。这是四时之序，气之所处，病之所舍，脏之所宜。转筋的，站立而取穴，可以使它痊愈。痿厥的，张（伸展四肢）而刺之，可以使它立刻轻快。","notes":[],"pending":false}]},
