{"id":"ls48","book":"灵枢","no":48,"title":"禁服","titleTw":"禁服","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls48-1","tags":[],"yw":"雷公問於黃帝曰：細子得受，通於九針六十篇，旦暮勤服之，近者編絕，久者簡垢，然尚諷誦弗置，未盡解於意矣。「外揣」言渾束爲一，未知所謂也。夫大則無外，小則無內，大小無極，高下無度，束之奈何？士之才力，或有厚薄，智慮褊淺，不能博大深奧，自強於學若細子。細子恐其散於後世，絕於子孫，敢問約之奈何？黃帝曰：善乎哉問也。此先師之所禁，坐私傳之也，割臂歃血之盟也，子若欲得之，何不齋乎。雷公再拜而起曰：請聞命於是也，乃齋宿三日而請曰：敢問今日正陽，細子願以受盟。","bh":"","notes":[],"pending":true},{"id":"ls48-2","tags":[],"yw":"黃帝乃與俱入齋室，割臂歃血，黃帝親祝曰：今日正陽，歃血傳方，有敢背此言者，反受其殃。雷公再拜曰：細子受之。黃帝乃左握其手，右授之書曰：慎之慎之，吾爲子言之，凡刺之理，經脈爲始，營其所行，知其度量，內刺五髒，外刺六腑，審察衛氣，爲百病母，調其虛實，虛實乃止，瀉其血絡，血盡不殆矣。雷公曰：此皆細子之所以通，未知其所約也。黃帝曰：夫約方者，猶約囊也，囊滿而弗約，則輸泄，方成弗約，則神與弗俱。雷公曰：願爲下材者，勿滿而約之。","bh":"","notes":[],"pending":true},{"id":"ls48-3","tags":[],"yw":"黃帝曰：未滿而知約之以爲工，不可以爲天下師。雷公曰：願聞爲工。黃帝曰：寸口主中，人迎主外，兩者相應，俱往俱來，若引繩大小齊等。春夏人迎微大，秋冬寸口微大，如是者，名曰平人。人迎大一倍於寸口，病在足少陽，一倍而躁，在手少陽。人迎二倍，病在足太陽，二倍而躁，病在手太陽。人迎三倍，病在足陽明，三倍而躁，病在手陽明。盛則爲熱，虛則爲寒，緊則爲痛痹，代則乍甚乍間。盛則瀉之，虛則補之，緊痛則取之分肉，代則取血絡，且飲藥，陷下則灸之，不盛不虛，以經取之，名曰經刺。","bh":"","notes":[],"pending":true},{"id":"ls48-4","tags":[],"yw":"人迎四倍者，且大且數，名曰溢陽，溢陽爲外格，死不治。必審按其本末，察其寒熱，以驗其髒腑之病。寸口大於人迎一倍，病在足厥陰，一倍而躁，在手心主。寸口二倍，病在足少陰，二倍而躁，在手少陰。寸口三倍，病在足太陰，三倍而躁，在手太陰。盛則脹滿，寒中，食不化，虛則熱中、出糜、少氣、溺色變，緊則痛痹，代則乍痛乍止。盛則瀉之，虛則補之，緊則先刺而後灸之，代則取血絡，而後調之，陷下則徒灸之，陷下者，脈血結於中，中有着血，血寒，故宜灸之，不盛不虛，以經取之。","bh":"","notes":[],"pending":true},{"id":"ls48-5","tags":[],"yw":"寸口四倍者，名曰內關，內關者，且大且數，死不治。必審察其本末之寒溫，以驗其髒腑之病。通其營輸，乃可傳於大數。大數曰：盛則徒瀉之，虛則徒補之，緊則灸刺，且飲藥，陷下則徒灸之，不盛不虛，以經取之。所謂經治者，飲藥，亦曰灸刺，脈急則引，脈大以弱，則欲安靜，用力無勞也。","bh":"","notes":[],"pending":true}]},
{"id":"ls49","book":"灵枢","no":49,"title":"五色","titleTw":"五色","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls49-1","tags":[],"yw":"雷公問於黃帝曰：五色獨決於明堂乎？小子未知其所謂也。黃帝曰：明堂者，鼻也；闕者，眉間也；庭者，顏也；蕃者，頰側也；蔽者，耳門也。其間欲方大，去之十步，皆見於外，如是者壽，必中百歲。雷公曰：五言之辨，奈何？黃帝曰：明堂骨高以起，平以直，五髒次於中央，六腑挾其兩側，首面上於闕庭，王宮在於下極，五髒安於胸中，真色以致，病色不見，明堂潤澤以清，五官惡得無辨乎？雷公曰：其不辨者，可得聞乎？黃帝曰：五色之見也，各出其色部。","bh":"","notes":[],"pending":true},{"id":"ls49-2","tags":[],"yw":"部骨陷者，必不免於病矣。其色部乘襲者，雖病甚，不死矣。雷公曰：官五色奈何？黃帝曰：青黑爲痛，黃赤爲熱，白爲寒，是謂五官。雷公曰：病之益甚，與其方衰，如何？黃帝曰：外內皆在焉。切其脈口，滑小緊以沉者，病益甚，在中；人迎氣大緊以浮者，其病益甚，在外。其脈口浮滑者，病日進；人迎沉而滑者，病日損。其脈口滑以沉者，病日進，在內；其人迎脈滑盛以浮者，其病日進，在外。脈之浮沉及人迎與寸口氣小大等者，病難已；病之在藏，沉而大者，易已，小爲逆；病在府，浮而大者，其病易已。","bh":"","notes":[],"pending":true},{"id":"ls49-3","tags":[],"yw":"人迎盛堅者，傷於寒，氣口盛堅者，傷於食。雷公曰：以色言食之間甚，奈何？黃帝曰：其色麤以明，沉夭者爲甚，其色上行者，病益甚；其色下行，如雲徹散者，病方已。五色各有髒部，有外部有內部也。色從外部走內部者，其病從外走內；其色從內走外者，其病從內走外。病生於內者，先治其陰，後治其陽，反者益甚。其病生於陽者，先治其外，後治其內，反者益甚。其脈滑大，以代而長者，病從外來，目有所見，志有所惡，此陽氣之並也，可變而已。","bh":"","notes":[],"pending":true},{"id":"ls49-4","tags":[],"yw":"雷公曰：小子聞風者，百病之始也；厥逆者，寒溼之起也，別之奈何？黃帝曰：常候闕中，薄澤爲風，衝濁爲痹。在地爲厥。此其常也；各以其色言其病。雷公曰：人不病卒死，何以知之？黃帝曰：大氣入於髒腑者，不病而卒死矣。雷公曰：病小愈而卒死者，何以知之？黃帝曰：赤色出兩顴，大如拇指者，病雖小愈，必卒死。黑色出於庭，大如拇指，必不病而卒死。雷公再拜曰：善哉！其死有期乎？黃帝曰：察色以言其時。雷公曰：善乎！願卒聞之。","bh":"","notes":[],"pending":true},{"id":"ls49-5","tags":[],"yw":"黃帝曰：庭者，首面也；闕上者，咽喉也；闕中者，肺也；下極者，心也；直下者，肝也；肝左者，膽也；下者，脾也；方上者，胃也；中央者，大腸也；挾大腸者，腎也；當腎者，臍也；面王以上者，小腸也，面王以下者，膀胱子處也；顴者，肩也；顴後者，臂也；臂下者，手也；目內眥上者，膺乳也；挾繩而上者，背也；循牙車以下者，股也；中央者，膝也；膝以下者，脛也；當脛以下者，足也；巨分者，股裏也；巨屈者，膝臏也。此五髒六腑肢節之部也，各有部分。","bh":"","notes":[],"pending":true},{"id":"ls49-6","tags":[],"yw":"有部分，用陰和陽，用陽和陰，當明部分，萬舉萬當。能別左右，是謂大道；男女異位，故曰陰陽。審察澤夭，謂之良工。沉濁爲內，浮澤爲外。黃赤爲風，青黑爲痛，白爲寒，黃而膏潤爲膿，赤甚者爲血痛，甚爲攣，寒甚爲皮不仁。五色各見其部，察其浮沉，以知淺深；察其澤夭，以觀成敗；察其散搏，以知遠近；視色上下，以知病處；積神於心，以知往今。故相氣不微，不知是非，屬意勿去，乃知新故。色明不麤，沉天爲甚，不明不澤，其病不甚。","bh":"","notes":[],"pending":true},{"id":"ls49-7","tags":[],"yw":"其色散，駒駒然，未有聚；其病散而氣痛，聚未成也。腎乘心，心先病，腎爲應，色皆如是。男子色在於面王，爲小腹痛；下爲卵痛；其圜直爲莖痛，高爲本，下爲首，狐疝(疒貴)陰之屬也。女子在於面王，爲膀胱子處之病，散爲痛，搏爲聚，方員左右，各如其色形。其隨而下至胝，爲淫，有潤如膏狀，爲暴食不潔。左爲左，右爲右。其色有邪，聚散而不端，面色所指者也。色者，青黑赤白黃，皆端滿有別鄉。別鄉赤者，其色赤，大如榆莢，在面王爲不日。","bh":"","notes":[],"pending":true},{"id":"ls49-8","tags":[],"yw":"其色上銳，首空上向，下銳下向，在左右如法。以五色命髒，青爲肝，赤爲心，白爲肺，黃爲脾，黑爲腎。肝合筋，心合脈，肺合皮，脾合肉，腎合骨也。","bh":"","notes":[],"pending":true}]},
{"id":"ls50","book":"灵枢","no":50,"title":"论勇","titleTw":"論勇","tags":["bingji","yinyang","zhize"],"brief":"","pending":true,"sections":[{"id":"ls50-1","tags":[],"yw":"黃帝問於少俞曰：有人於此，並行並立，其年之長少等也，衣之厚薄均也，卒然遇烈風暴雨，或病或不病，或皆病，或皆不病，其故何也？少俞曰：帝問何急？黃帝曰：願盡聞之。少俞曰：春青風夏陽風，秋涼風，冬寒風。凡此四時之風者，其所病各不同形。黃帝曰：四時之風，病人如何？少俞曰：黃色薄皮弱肉者，不勝春之虛風；白色薄皮弱肉者，不勝夏之虛風；青色薄皮弱肉，不勝秋之虛風；赤色薄皮弱肉，不勝冬之虛風也。黃帝曰：黑色不病乎？少俞曰：黑色而皮厚肉堅，固不傷於四時之風；其皮薄而肉不堅，色不一者，長夏至而有虛風者，病矣。","bh":"","notes":[],"pending":true},{"id":"ls50-2","tags":[],"yw":"其皮厚而肌肉堅者，長夏至而有虛風，不病矣。其皮厚而肌肉堅者，必重感於寒，外內皆然，乃病。黃帝曰：善。黃帝曰：夫人之忍痛與不忍痛，非勇怯之分也。夫勇士之不忍痛者，見難則前，見痛則止；夫怯士之忍痛者，聞難則恐，遇痛不動。夫勇士之忍痛者，見難不恐，遇痛不動；夫怯士之不忍痛者，見難與痛，目轉面盻，恐不能言，失氣，驚，顏色變化，乍死乍生。餘見其然也，不知其何由，願聞其故。少俞曰：夫忍痛與不忍痛者，皮膚之薄厚，肌肉之堅脆，緩急之分也，非勇怯之謂也。","bh":"","notes":[],"pending":true},{"id":"ls50-3","tags":[],"yw":"黃帝曰：願聞勇怯之所由然。少俞曰：勇士者，目深以固，長衝直揚，三焦理橫，其心端直，其肝大以堅，其膽滿以傍，怒則氣盛而胸張，肝舉而膽橫，眥裂而目揚，毛起而面蒼，此勇士之由然者也。黃帝曰：願聞怯士之所由然。少俞曰：怯士者，目大而不減，陰陽相失，其焦理縱，(骨曷)(骨虧)短而小，肝系緩，其膽不滿而縱，腸胃挺，脅下空，雖方大怒，氣不能滿其胸，肝肺雖舉，氣衰復下，故不能久怒，此怯士之所由然者也。黃帝曰：怯士之得酒，怒不避勇士者，何髒使然？少俞曰：酒者，水谷之精，熟谷之液也，其氣慓悍，其入於胃中，則胃脹，氣上逆，滿於胸中，肝浮膽橫，當是之時，固比於勇士，氣衰則悔。","bh":"","notes":[],"pending":true},{"id":"ls50-4","tags":[],"yw":"與勇士同類，不知避之，名曰酒悖也。","bh":"","notes":[],"pending":true}]},
{"id":"ls51","book":"灵枢","no":51,"title":"背腧","titleTw":"背腧","tags":["ci","zangxiang","zhize"],"brief":"","pending":true,"sections":[{"id":"ls51-1","tags":[],"yw":"黃帝問於岐伯曰：願聞五髒之腧，出於背者。岐伯曰：背中大腧，在杼骨之端，肺腧在三焦之間，心腧在五焦之間，膈腧在七焦之間，肝腧在九焦之間，脾腧在十一焦之間，腎腧在十四焦之間。皆挾脊相去三寸所，則欲得而驗之，按其處，應在中而痛解，乃其輸也。灸之則可刺之則不可。氣盛則瀉之，虛則補之。以火補者，毋吹其火，須自滅也；以火瀉之，疾吹其火，傳其艾，須其火滅也。","bh":"","notes":[],"pending":true}]},
{"id":"ls52","book":"灵枢","no":52,"title":"卫气","titleTw":"衛氣","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls52-1","tags":[],"yw":"黃帝曰：五髒者，所以藏精神魂魄者也；六腑者，所以受水谷而行化物者也。其氣內干五髒，而外絡肢節。其浮氣之不循經者，爲衛氣；其精氣之行於經者，爲營氣。陰陽相隨，外內相貫，如環之無端。亭亭淳淳乎，孰能竊之。然其分別陰陽，皆有標本虛實所離之處。能別陰陽十二經者，知病之所生；候虛實之所在者，能得病之高下；知六腑之氣街者，能知解結契紹於門戶；能知虛石之堅軟者，知補瀉之所在；能知六經標本者，可以無惑於天下。岐伯曰：博哉！聖帝之論。","bh":"","notes":[],"pending":true},{"id":"ls52-2","tags":[],"yw":"臣請盡意悉言之。足太陽之本，在限以上五寸中，標在兩絡命門。命門者，目也。足少陽之本，在竅陰之間，標在窗籠之前。窗籠者，耳也。足少陰之本，在內踝下上三寸中，標在背輸與舌下兩脈也。足厥陰之本，在行間上五寸所，標在背腧也。足陽明之本，在厲兌，標在人迎，頰挾頏顙也。足太陰之本，在中封前上四寸之中，標在背腧與舌本也。手太陽之本，在外踝之後，標在命門之上一寸也。手少陽之本，在小指次指之間上二寸，標在耳後上角下外眥也。","bh":"","notes":[],"pending":true},{"id":"ls52-3","tags":[],"yw":"手陽明之本，在肘骨中，上至別陽，標在顏下合鉗上也。手太陰之本，在寸口之中，標在腋內動也。手少陰之本，在銳骨之端，標在背腧也。手心主之本，在掌後兩筋之間二寸中，標在腋下下三寸也。凡候此者，下虛則厥，下盛則熱；上虛則眩，上盛則熱痛。故石者，絕而止之，虛者，引而起之。請言氣街，胸氣有街，腹氣有街，頭氣有街，脛氣有街。故氣在頭者，止之於腦；氣在胸者，止之膺與背腧；氣在腹者，止之背腧，與衝脈於臍左右之動脈者；氣在脛者，止之於氣街，與承山踝上以下。","bh":"","notes":[],"pending":true},{"id":"ls52-4","tags":[],"yw":"取此者，用毫針，必先按而在久應於手，乃刺而予之。所治者，頭痛眩，腹痛中滿暴脹，及有新。痛可移者，易已也；積不痛，難已也。","bh":"","notes":[],"pending":true}]},
{"id":"ls53","book":"灵枢","no":53,"title":"论痛","titleTw":"論痛","tags":["ci","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls53-1","tags":[],"yw":"黃帝問於少俞曰：筋骨之強弱，肌肉之堅脆，皮膚之厚薄，腠理之疏密，各不同，其於針石火焫之痛何如？腸胃之厚薄堅脆亦不等，其於毒藥何如？願盡聞之。少俞曰：人之骨強、筋弱、肉緩、皮膚厚者，耐痛，其於針石之痛火焫亦然。黃帝曰：其耐火煤者，何以知之？少俞答曰：加以黑色而美骨者，耐火焫。黃帝曰：其不耐針石之痛者，何以知之？少俞曰：堅肉薄皮者，不耐針石之痛，於火焫亦然。黃帝曰：人之病，或同時而傷，或易已，或難已，其故何如？少俞曰：同時而傷，其身多熱者，易已；多寒者，難已。","bh":"","notes":[],"pending":true},{"id":"ls53-2","tags":[],"yw":"黃帝曰：人之勝毒，何以知之？少俞曰：胃厚、色黑、大骨及肥骨者，皆勝毒；故其瘦而薄胃者，皆不勝毒也。","bh":"","notes":[],"pending":true}]},
{"id":"ls54","book":"灵枢","no":54,"title":"天年","titleTw":"天年","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls54-1","tags":[],"yw":"黃帝問於岐伯曰：願聞人之始生，何氣築爲基，何立而爲楯，何失而死，何得而生？岐伯曰：以母爲基，以父爲楯；失神者死，得神者生也。黃帝曰：何者爲神？岐伯曰：血氣已和，營衛已通，五髒已成，神氣舍心，魂魄畢具，乃成爲人。黃帝曰：人之壽夭各不同，或夭壽，或卒死，或病久，願聞其道。岐伯曰：五髒堅固，血脈和調，肌肉解利，皮膚致密，營衛之行，不失其常，呼吸微徐，氣以度行，六腑化谷，津液布揚，各如其常，故能長久。黃帝曰：人之壽百歲而死，何以致之？岐伯曰：使道隧以長，基牆高以方，通調營衛，三部三裏起，骨高肉滿，百歲乃得終。","bh":"","notes":[],"pending":true},{"id":"ls54-2","tags":[],"yw":"黃帝曰：其氣之盛衰，以至其死，可得聞乎？岐伯曰：人生十歲，五髒始定，血氣已通，其氣在下，故好走；二十歲，血氣始盛肌肉方長，故好趨；三十歲，五髒大定，肌肉堅固，血脈盛滿，故好步；四十歲，五髒六腑十二經脈，皆大盛以平定，腠理始疏，滎貨頹落，發頗斑白，平盛不搖，故好坐；五十歲，肝氣始衰，肝葉始薄，膽汁始減，目始不明；六十歲，心氣始衰，若憂悲，血氣懈惰，故好臥；七十歲，脾氣虛，皮膚枯；八十歲，肺氣衰，魄離，故言善誤；九十歲，腎氣焦，四髒經脈空虛；百歲，五髒皆虛，神氣皆去，形骸獨居而終矣。","bh":"","notes":[],"pending":true},{"id":"ls54-3","tags":[],"yw":"黃帝曰：其不能終壽而死者，何如？岐伯曰：其五髒皆不堅，使道不長，空外以張，喘息暴疾；又卑基牆薄，脈少血，其肉不石，數中風寒，血氣虛，脈不通，真邪相攻，亂而相引，故中壽而盡也。靈樞經","bh":"","notes":[],"pending":true}]},

{"id":"ls56","book":"灵枢","no":56,"title":"五味","titleTw":"五味","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls56-1","tags":[],"yw":"黃帝曰：願聞谷氣有五味，其入五髒，分別奈何？伯高曰：胃者，五髒六腑之海也，水谷皆入於胃，五髒六腑，皆稟氣於胃。五味各走其所喜，谷味酸，先走肝，谷味苦，先走心，谷味甘，先走脾，谷味辛，先走肺，谷味鹹，先走腎。谷氣津液已行，營衛大通，乃化糟粕，以次傳下。黃帝曰：營衛之行奈何？伯高曰：谷始入於胃，其精微者，先出於胃之兩焦，以溉五髒，別出兩行，營衛之道。其大氣之搏而不行者，積於胸中，命曰氣海，出於肺，循咽喉，故呼則出，吸則入。","bh":"","notes":[],"pending":true},{"id":"ls56-2","tags":[],"yw":"天地之精氣，其大數常出三入一，故谷不入，半日則氣衰，一日則氣少矣。黃帝曰：谷之五味，可得聞乎？伯高曰：請盡言之。五谷：糠米甘，麻酸，大豆鹹，麥苦，黃黍辛。五果：棗甘，李酸，慄鹹，杏苦，桃辛。五畜：牛甘，犬酸，豬鹹，羊苦，雞辛。五菜：葵甘，韭酸，藿鹹，薤苦，蔥辛。五色：黃色宜甘，青色宜酸，黑色宜鹹，赤色宜苦，白色宜辛。凡此五者，各有所宜。五宜所言五色者，脾病者，宜食糠米飯，牛肉棗葵；心病者，宜食麥羊肉杏薤；腎病者，宜食大豆黃卷豬肉慄藿；肝病者，宜食麻犬肉李韭；肺病者，宜食黃黍雞肉桃蔥。","bh":"","notes":[],"pending":true},{"id":"ls56-3","tags":[],"yw":"五禁：肝病禁辛，心病禁鹹，脾病禁酸，腎病禁甘，肺病禁苦。肝色青，宜食甘，糠米飯、牛肉、棗、葵皆甘。心色赤，宜食酸，犬肉、麻、李、韭皆酸。脾黃色，宜食鹹，大豆、豬肉、慄、藿皆鹹。肺白色，宜食苦，麥、羊肉、杏、薤皆苦。腎色黑，宜食辛，黃黍、雞肉、桃、蔥皆辛。黃帝問於岐伯曰：","bh":"","notes":[],"pending":true}]},
{"id":"ls57","book":"灵枢","no":57,"title":"水胀","titleTw":"水脹","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls57-1","tags":[],"yw":"水與膚脹、鼓脹、腸覃、石瘕、石水，何以別之？岐伯曰：水始起也，目窠上微腫，如新臥起之狀，其頸脈動，時咳，陰股間寒，足脛腫，腹乃大，其水已成矣。以手按其腹，隨手而起，如裹水之狀，此其候也。黃帝曰：膚脹何以候之？岐伯曰：膚脹者，寒氣客於皮膚之間，冬冬然不堅，腹大，身盡腫，皮厚，按其腹，窅而不起，腹色不變，此其候也。鼓脹何如？岐伯曰：腹脹身皆大，大與膚脹等也，色蒼黃，腹筋起，此其候也。腸覃何如？岐伯曰：寒氣客於腸外，與衛氣相搏，氣不得榮，因有所系，癖而內着，惡氣乃起，瘜肉乃生。","bh":"","notes":[],"pending":true},{"id":"ls57-2","tags":[],"yw":"其始生也，大如雞卵，稍以益大，至其成，如懷子之狀，久者離歲，按之則堅，推之則移，月事以時下，此其候也。石瘕何如？岐伯曰：石瘕生於胞中，寒氣客於子門，子門閉塞，氣不得通，惡血當瀉不瀉，衄以留止，日以益大，狀如懷子，月事不以時下，皆生於女子，可導而下。黃帝曰：膚脹鼓脹，可刺邪？岐伯曰：先瀉其脹之血絡，後調其經，刺去其血血絡也。","bh":"","notes":[],"pending":true}]},
{"id":"ls58","book":"灵枢","no":58,"title":"贼风","titleTw":"賊風","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls58-1","tags":[],"yw":"黃帝曰：夫子言賊風邪氣傷人也，令人病焉，今有其不離屏蔽，不出室穴之中，卒然病者，非不離賊風邪氣，其故何也？岐伯曰：此皆嘗有所傷於溼氣，藏於血脈之中，分肉之間，久留而不去。若有所墮墜，惡血在內而不去，卒然喜怒不節，飲食不適，寒溫不時，腠理閉而不通。其開而遇風寒，則血氣凝結，與故邪相襲，則爲寒痹。其有熱則汗出，汗出則受風，雖不遇賊風邪氣，必有因加而發焉。黃帝曰：今夫子之所言者，皆病人之所自知也。其毋所遇邪氣，又毋怵惕之所志，卒然而病者，其故何也？唯有因鬼神之事乎？岐伯曰：此亦有故邪留而未發，因而志有所惡，及有所慕，血氣內亂，兩氣相搏。","bh":"","notes":[],"pending":true},{"id":"ls58-2","tags":[],"yw":"其所從來者微，視之不見，聽而不聞，故似鬼神。黃帝曰：其祝而已者，其故何也？岐伯曰：先巫者，因知百病之勝，先知其病之所從生者，可祝而已也。","bh":"","notes":[],"pending":true}]},
{"id":"ls59","book":"灵枢","no":59,"title":"卫气失常","titleTw":"衛氣失常","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls59-1","tags":[],"yw":"黃帝曰：衛氣之留於腹中，搐積不行，菀蘊不得常所，使人支脅胃中滿，喘呼逆息者，何以去之？伯高曰：其氣積於胸中者，上取之，積於腹中者，下取之，上下皆滿者，旁取之。黃帝曰：取之奈何？伯高對曰：積於上，瀉人迎、天突、喉中；積於下者，瀉三裏與氣街；上下皆滿者，上下取之，與季脅之下一寸；重者，雞足取之。診視其脈大而弦急，及絕不至者，及腹皮急甚者，不可刺也。黃帝曰：善。黃帝問於伯高曰：何以知皮肉氣血筋骨之病也？伯高曰：色起兩眉薄澤者，病在皮；脣色青黃赤白黑者，病在肌肉；營氣濡然者，病在血氣；目色青黃赤白黑者，病在筋；耳焦枯受塵垢，病在骨。","bh":"","notes":[],"pending":true},{"id":"ls59-2","tags":[],"yw":"黃帝曰：病形何如，取之奈何？伯高曰：夫百病變化，不可勝數，然皮有部，肉有桂，血氣有輸，骨有屬。黃帝曰：願聞其故。伯高曰：皮之部，輸於四末；肉之柱，有臂脛諸陽分肉之間，與足少陰分間；血氣之輸，輸於諸絡，氣血留居，則盛而起，筋部無陰無陽，無左無右，候病所在；骨之屬者，骨空之所以受益而益腦者也。黃帝曰：取之奈何？伯高曰：夫病變化，浮沉深淺，不可勝究，各在其處，病間者淺之，甚者深之，間者小之，甚者衆之，隨變而調氣，故曰上工。","bh":"","notes":[],"pending":true},{"id":"ls59-3","tags":[],"yw":"黃帝問於伯高曰：人之肥瘦大小溫寒，有老壯少小，別之奈何？伯高對曰：人年五十已上爲老，二十已上爲壯，十八已上爲少，六歲已上爲小。黃帝曰：何以度知其肥瘦？伯高曰：人有肥、有膏、有肉。黃帝曰：別此奈何？伯高曰：膕肉堅，皮滿者，肥。膕肉不堅，皮緩者，膏。皮肉不相離者，肉。黃帝曰：身之寒溫何如？伯高：膏者，其肉淖而粗理者，身寒，細理者，身熱。脂者，其肉堅，細理者熱，粗理者寒。黃帝曰：其肥瘦大小奈何？伯高曰：膏者，多氣而皮縱緩，故能縱腹垂腴。","bh":"","notes":[],"pending":true},{"id":"ls59-4","tags":[],"yw":"肉者，身體容大。脂者，其身收小。黃帝曰：三者之氣血多少何如？伯高曰：膏者，多氣，多氣者，熱，熱者耐寒。肉者，多血則充形，充形則平。脂者，其血清，氣滑少，故不能大。此別於衆人者也。黃帝曰：衆人奈何？伯高曰：衆人皮肉脂膏，不能相加也，血與氣，不能相多，故其形不小不大，各自稱其身，命曰衆人。黃帝曰：善。治之奈何？伯高曰：必先別其三形，血之多少，氣之清濁，而後調之，治無失常經。是故膏人縱腹垂腴，肉人者，上下容大，脂人者，雖脂不能大者。","bh":"","notes":[],"pending":true}]},
{"id":"ls60","book":"灵枢","no":60,"title":"玉版","titleTw":"玉版","tags":["ci","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls60-1","tags":[],"yw":"黃帝曰：餘以小針爲細物也，夫子乃言上合之於天，下合之於地，中合之於人，餘以爲過針之意矣，願聞其故。岐伯曰：何物大於天乎？夫大於針者，惟五兵者焉，死之備也，非生之具。且夫人者，天地之鎮也，其不可不參乎？夫治民者，亦唯針焉。夫針之與五兵，其孰小乎？黃帝曰：病之生時，有喜怒不測，飲食不節，陰氣不足，陽氣有餘，營氣不行，乃發爲癰疽。陰陽不通，兩熱相搏，乃化爲濃，小針能取之乎？岐伯曰：聖人不能使化者爲之，邪不可留也。","bh":"","notes":[],"pending":true},{"id":"ls60-2","tags":[],"yw":"故兩軍相當，旗幟相望，白刃陳於中野者，此非一日之謀也。能使其民令行，禁止士卒無白刃之難者，非一日之教也，須臾之得也。夫至使身被癰疽之病，膿血之聚者，不亦離道遠乎？夫癰疽之生，膿血之成也，不從天下，不從地出，積微之所生也，故聖人自治於未有形也，愚者遭其已成也。黃帝曰：其已形，不予遭，膿已成，不予見；爲之奈何？岐伯曰：膿已成，十死一生，故聖人弗使已成，而明爲良方，着之竹帛，使能者踵而傳之後世，無有終時者，爲其不予遭也。","bh":"","notes":[],"pending":true},{"id":"ls60-3","tags":[],"yw":"黃帝曰：其已有膿血而後遭乎？不導之以小針治乎？岐伯曰：以小治小者，其功小，以大治大者，多害，故其已成膿血者，其唯砭石鈹鋒之所取也。黃帝曰：多害者其不可全乎？岐伯曰：其在逆順焉。黃帝曰：願聞逆順。岐伯曰：以爲傷者，其白眼青，黑眼小，是一逆也；內藥而嘔者，是二逆也；腹痛渴甚，是三逆也；肩項中不便，是四逆也；音嘶色脫，是五逆也。除此五者，爲順矣。黃帝曰：諸病皆有逆順，可得聞乎？岐伯曰：腹脹、身熱、脈大，是一逆也；腹鳴而滿，四肢清泄，其脈大，是二逆也；衄而不止，脈大，是三逆也；咳而溲血脫形，其脈小勁，是四逆也；咳脫形，身熱，脈小以疾，是謂五逆也。","bh":"","notes":[],"pending":true},{"id":"ls60-4","tags":[],"yw":"如是者，不過十五日而死矣。其腹大脹，四末清，脫形，泄甚，是一逆也；腹脹便血，其脈大，時絕，是二逆也；咳溲血，形肉脫，脈搏，是三逆也；嘔血，胸滿引背，脈小而疾，是四逆也；咳嘔，腹脹且飧泄，其脈絕，是五逆也。如是者，不及一時而死矣。工不察此者而刺之，是謂逆治。黃帝曰：夫子之言針甚駿，以配天地，上數天文，下度地紀，內別五髒，外次六腑，經脈二十八會，盡有周紀。能殺生人，不能起死者，子能反之乎？岐伯曰：能殺生人，不能起死者也。","bh":"","notes":[],"pending":true},{"id":"ls60-5","tags":[],"yw":"黃帝曰：餘聞之，則爲不仁，然願聞其道，弗行於人。岐伯曰：是明道也，其必然也，其如刀劍之可以殺人，如飲酒使人醉也，雖勿診，猶可知矣。黃帝曰：願卒聞之。岐伯曰：人之所受氣者，谷也。谷之所注者，胃也。胃者，水谷氣血之海也。海之所行雲氣者，天下也。胃之所出氣血者，經隧也。而隧者，五髒六腑之大絡也，迎而奪之而已矣。黃帝曰：上下有數乎？岐伯曰：迎之五裏，中道而止，五至而已，五往而髒之氣盡矣，故五五二十五，而竭其輸矣，此所謂奪其天氣者也，非能絕其命而傾其壽者也。","bh":"","notes":[],"pending":true},{"id":"ls60-6","tags":[],"yw":"黃帝曰：願卒聞之。岐伯曰：窺門而刺之者，死於家中；入門而刺之者，死於堂上。黃帝曰：善乎方，明哉道，請着之玉版，以爲重寶，傳之後世，以爲刺禁，令民勿敢犯也。","bh":"","notes":[],"pending":true}]},
{"id":"ls61","book":"灵枢","no":61,"title":"五禁","titleTw":"五禁","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls61-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞刺有五禁，何謂五禁？岐伯曰：禁其不可刺也。黃帝曰：餘聞刺有五奪。岐伯曰：無瀉其不可奪者也。黃帝曰：餘聞刺有五過。岐伯曰：補瀉無過其度。黃帝曰：餘聞刺有五逆。岐伯曰：病與脈相逆，命曰五逆。黃帝曰：餘聞刺有九宜。岐伯曰：明知九針之論，是謂九誼。黃帝曰：何謂五禁，願聞其不可刺之時。岐伯曰：甲乙日自乘，無刺實，無發蒙於耳內。丙丁日自乘，無振埃於肩喉廉泉。戊己日自乘四季，無刺腹，去爪瀉水。","bh":"","notes":[],"pending":true},{"id":"ls61-2","tags":[],"yw":"庚辛日自乘，無刺關節於股膝。壬癸日自乘，無刺足脛，是謂五禁。黃帝曰：何謂五奪？岐伯曰：形肉已奪，是一奪也；大奪血之後，是二奪也；大汗出之後，是三奪也；大泄之後，是四奪也；新產及大血之後，是五奪也。此皆不可瀉。黃帝曰：何謂五逆？岐伯曰：熱病脈靜，汗已出，脈盛躁，是一逆也；病泄，脈洪大，是二逆也；着痹不移，(月囷)肉破，身熱，脈偏絕，是三逆也；淫而奪形、身熱，色夭然白，乃後下血衄，血衄篤重，是謂四逆也；寒熱奪形，脈堅搏，是謂五逆也。","bh":"","notes":[],"pending":true}]},
{"id":"ls62","book":"灵枢","no":62,"title":"动输","titleTw":"動輸","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls62-1","tags":[],"yw":"黃帝曰：經脈十二，而手太陰、足少陰、陽明，獨動不休，何也？岐伯曰：是明胃脈也。胃爲五髒六腑之海，其清氣上注於肺，肺氣從太陰而行之，其行也，以息往來，故人一呼，脈再動，一吸脈亦再動，呼吸不已，故動而不止。黃帝曰：氣之過於寸口也，上十焉息，下八焉伏，何道從還？不知其極。岐伯曰：氣之離髒也，卒然如弓弩之發，如水之下岸，上於魚以及衰，其餘氣衰散以逆上，故其行微。黃帝曰：足之陽明，何因而動？岐伯曰：胃氣上注於肺，其悍氣上衝頭者，循咽，上走空竅，循眼系，入絡腦，出顑，下客主人，循牙車，合陽明，並下人迎，此胃氣別走於陽明者也。","bh":"","notes":[],"pending":true},{"id":"ls62-2","tags":[],"yw":"故陰陽上下，其動也若一。故陽病而陽脈小者，爲逆；陰病而陰脈大者，爲逆。故陰陽俱靜俱動，若引繩相傾者病。黃帝曰：足少陰何因而動？岐伯曰：衝脈者，十二經之海也，與少陰之大絡，起於腎下，出於氣街，循陰股內廉，邪入膕中，循脛骨內廉，並少陰之經，下入內踝之後。入足下，其別者，邪入踝，出屬附上，入大指之間，注諸絡，以溫足脛，此脈之常動者也。黃帝曰：營衛之行也，上下相貫，如環之無端，今有其卒然遇邪風，及逢大寒，手足懈惰，其脈陰陽之道，相輸之會，行相失也，氣何由還？岐伯曰：夫四末陰陽之會者，此氣之尤絡也；四街者，氣之徑路也。","bh":"","notes":[],"pending":true},{"id":"ls62-3","tags":[],"yw":"故絡絕則徑通，四末解則氣從合，相輸如環。黃帝曰：善。此所謂如環無端，莫知其紀，終而復始，此之謂也。","bh":"","notes":[],"pending":true}]},
{"id":"ls63","book":"灵枢","no":63,"title":"五味论","titleTw":"五味論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls63-1","tags":[],"yw":"黃帝問於少俞曰：五味入於口也，各有所走，各有所病，酸走筋，多食之，令人癃；鹹走血，多食之，令人渴；辛走氣，多食之，令人洞心；苦走骨，多食之，令人變嘔；甘走肉，多食之，令人挽心。餘知其然也，不知其何由？願聞其故。少俞答曰：酸入於胃，其氣澀以收，上之兩焦，弗能出入也，不出即留於胃中，胃中和溫，則下注膀胱，膀胱之胞薄以懦，得酸則縮綣，約而不通，水道不行，故癃。陰者，積筋之所終也，故酸入而走筋矣。黃帝曰：鹹走血，多食之，令人渴，何也？少俞曰：鹹入於胃；其氣上走中焦，注於脈，則血氣走之，血與鹹相得，則凝，凝則胃中汁注之，注之則胃中竭，竭則咽路焦，故舌本干而善渴。","bh":"","notes":[],"pending":true},{"id":"ls63-2","tags":[],"yw":"血脈者，中焦之道也，故鹹入而走血矣。黃帝曰：辛走氣，多食之，令人洞心，何也？少俞曰：辛入於胃，其氣走於上焦，上焦者，受氣而營諸陽者也，姜韭之氣燻之，營衛之氣，不時受之，久留心下，故洞心。辛與氣俱行，故辛入而與汗俱出。黃帝曰：苦走骨，多食之，令人變嘔，何也？少俞曰：苦入於胃，五谷之氣，皆不能勝苦，苦入下脘，三焦之道，皆閉而不通，故變嘔。齒者，骨之所終也，故苦入而走骨，故入而復出，知其走骨也。黃帝曰：甘走肉，多食之。","bh":"","notes":[],"pending":true},{"id":"ls63-3","tags":[],"yw":"令人悗心，何也？少俞曰：甘入於胃，其氣弱小，不能上至於上焦，而與谷留於胃中者，令人柔潤者也，胃柔則緩，緩則蟲動，蟲動則令人悗心。其氣外通於肉，故甘走肉。","bh":"","notes":[],"pending":true}]},
{"id":"ls64","book":"灵枢","no":64,"title":"阴阳二十五人","titleTw":"陰陽二十五人","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls64-1","tags":[],"yw":"黃帝曰：餘聞陰陽之人何如？伯高曰：天地之間，六合之內，不離於五，人亦應之。故五五二十五人之政，而陰陽之人不與焉。其態又不合於衆者五，餘已知之矣。願聞二十五人之形，血氣之所生，別而以候，從外知內，何如？岐伯曰：「悉乎哉問也，此先師之祕也，雖伯高猶不能明之也。黃帝避席遵循而卻曰：餘聞之得其人弗教，是謂重失，得而泄之，天將厭之，餘願得而明之，金櫃藏之，不敢揚之。岐伯曰：先立五形金木水火土，別其五色，異其五形之人，而二十五人具矣。","bh":"","notes":[],"pending":true},{"id":"ls64-2","tags":[],"yw":"黃帝曰：願卒聞之。岐伯曰：慎之慎之，臣請言之。木形之人，比於上角似於蒼帝，其爲人蒼色，小頭，長面大肩背直身小，手足好。有才，勞心少力多憂，勞於事，能春夏不能秋冬感而病生。足厥陰，佗佗然，大角之人比於左足少陽，少陽之上遺遺然。左角之人比於右足少陽，少陽之下隨隨然。鈦角之人，比於右足少陽，少陽之上推推然。判角之人比於左足少陽，少陽之下枯枯然。火形之人，比於上徵，似於赤帝。其爲人赤色廣(月引)，脫面，小頭，好肩背，髀腹小手足，行安地疾心，行搖肩背肉滿。","bh":"","notes":[],"pending":true},{"id":"ls64-3","tags":[],"yw":"有氣輕財少信多慮，見事明好顏，急心不壽暴死。能春夏不能秋冬，秋冬感而病生，手少陰核核然。質徵之人，比於左手太陽，太陽之上，肌肌然，少徵之人比於右手太陽，太陽之下??然，右徵之人比於右手太陽，太陽之上鮫鮫然。質判之人，比於左手太陽，太陽之下支支頤頤然。形於之人，比於上宮，似於上古黃帝，其爲人黃色圓面、大頭、美肩背、大腹、美股脛、小手足、多肉、上下相稱行安地，舉足浮。安心，好利人不喜權勢，善附人也。能秋冬不能春夏，春夏感而病生，足太陰，敦敦然。","bh":"","notes":[],"pending":true},{"id":"ls64-4","tags":[],"yw":"大宮之人比於左足陽明，陽明之上婉婉然。加宮之人，比於左足陽明，陽明之下坎坎然。少宮之人，比於右足陽明，陽明之上，樞樞然。左宮之人，比於右足陽明，陽明之下，兀兀然。金形之人比於上商，似於白帝，其爲人方面白色、小頭、小肩背小腹、小手足如骨發踵外，骨輕。身清廉，急心靜悍，善爲吏，能秋冬，不能春夏，春夏感而病生。手太陰敦敦然，釱商之人比於左手陽明，陽明之上，廉廉然。右商之人，比於左手陽明，陽明之下脫脫然。","bh":"","notes":[],"pending":true},{"id":"ls64-5","tags":[],"yw":"左商之人比於右手陽明，陽明之上監監然。少商之人，比於右手陽明，陽明之下，嚴嚴然。水形之人，比於上羽，似於黑帝，其爲人，黑色面不平，大頭廉頤，小肩大腹動手足，發行搖身下尻長，背延延然。不敬畏善欺紹人，戮死。能秋冬不能春夏，春夏感而病生。足少陰汗汗然。大羽之人，比於右足太陽，太陽之上，頰頰然。少羽之人，比於左足太陽，太陽之下潔潔然。桎之爲人，比於左足太陽，太陽之上安安然。是故五形之人二十五變者，衆之所以相欺者是也。","bh":"","notes":[],"pending":true},{"id":"ls64-6","tags":[],"yw":"黃帝曰：得其形，不得其色何如？岐伯曰：形勝色，色勝形者，至其勝時年加，感則病行，失則憂矣。形色相得者，富貴大樂。黃帝曰：其形色相當勝之時，年加可知乎？岐伯曰：凡年忌下上之人，大忌常加七歲，十六歲、二十五歲、三十四歲、四十三歲、五十二歲、六十一歲皆人之大忌，不可不自安也，感則病行，失則憂矣，當此之時，無爲奸事，是謂年忌。黃帝曰：夫子之言脈之上下，血氣之候似知形氣，奈何？岐伯曰：足陽明之上血氣盛則髯美長，血少氣多則髯短，故氣少血多則髯少，血氣皆少則無髯。","bh":"","notes":[],"pending":true},{"id":"ls64-7","tags":[],"yw":"兩吻多畫，足陽明之下血氣盛則下毛美長至胸，血多氣少則下毛美短至臍，行則善高舉足，足趾少肉足善寒，血少氣多則肉而善瘃，血氣皆少則無毛有則稀、枯悴，善痿厥，足痹。足少陽之上，氣血盛則通髯美長，血多氣少則通髯美短，血少氣多則少髯，血氣皆少則無須，感於寒溼則善痹。骨痛爪枯也。足少陽之下，血氣盛則脛毛美長，外踝肥；血多氣少則脛毛美短，外踝皮堅而厚，血少氣多則胻毛少，外踝皮薄而軟，血氣皆少則無毛，外踝瘦無肉。","bh":"","notes":[],"pending":true},{"id":"ls64-8","tags":[],"yw":"足太陽之上，血氣盛則美眉，眉有毫毛血多氣少則惡眉，面多少理，血少氣多則面多肉，血氣和則美色，足太陽之下，血氣盛則肉滿，踵堅，氣少血多則瘦，跟空，血氣皆少則善轉筋，踵下痛。手陽明之上，血氣盛則髭美。血少氣多則髭惡，血氣皆少則無髭。手陽明之下血氣盛則腋下毛美，手魚肉以溫，氣血皆少則手瘦以寒。手少陰之上，血氣盛則眉美以長，耳色美，血氣皆少則耳焦惡色。手少陽之下，血氣盛則手卷多肉以溫，血氣皆少則寒以瘦，氣少血多則瘦以多脈。","bh":"","notes":[],"pending":true},{"id":"ls64-9","tags":[],"yw":"手太陽之上，血氣盛則多須，面多肉以平，血氣皆少則面瘦惡色。手太陽之下，血氣盛則掌肉充滿，血氣皆少則掌瘦以寒。黃帝曰：二十五人者，刺之有約乎？岐伯曰：美眉者，足太陽之脈，氣血多，惡眉者，血氣少，其肥而澤者，血氣有餘，肥而不澤者，氣有餘，血不足，瘦而無澤者，氣血俱不足，審察其形氣有餘不足而調之，可以知逆順矣。黃帝曰：刺其諸陰陽奈何？岐伯曰：按其寸口人迎，以調陰陽，切循其經絡之凝澀，結而不通者，此於身皆爲痛痹，甚則不行，故凝澀，凝澀者，致氣以溫之血和乃止。","bh":"","notes":[],"pending":true},{"id":"ls64-10","tags":[],"yw":"其結絡者，脈結血不和，決之乃行，故曰：氣有餘於上者，導而下之，氣不足於上者，推而休之，其稽留不至者，因而迎之，必明於經隧，乃能持之，寒與熱爭者，導而行之，其宛陳血不結者，則而予之，必先明知二十五人則血氣之所在，左右上下，刺約畢也。","bh":"","notes":[],"pending":true}]},
{"id":"ls65","book":"灵枢","no":65,"title":"五音五味","titleTw":"五音五味","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls65-1","tags":[],"yw":"右徵與少徵，調右手太陽二，左商與左徵，調左手陽明上。少徵與大宮，調左手陽明上，右角與大角，調右手少陽下。大徵與少徵，調左手太陽上，衆羽與少羽，調右足太陽下，少商與右商調右手太陽下，桎羽與衆羽，調右足太陽下，少宮與大宮，調右足陽明下，判角與少角，調右足少陽下，釱商與上商，調右足陽明下，釱商與上角，調左足太陽下。上徵與右徵同谷麥、畜羊、果杏，手少陰藏心，色赤味苦，時夏。上羽與大羽，同谷大豆，畜彘，果慄，足少陰藏腎，色黑味鹹，時冬。","bh":"","notes":[],"pending":true},{"id":"ls65-2","tags":[],"yw":"上宮與大宮同谷稷，畜牛，果棗，足太陰藏脾，色黃味甘，時季夏。上商與右商同谷黍，畜雞，果桃，手太陰藏肺，色白味辛，時秋。上角與大角，同谷麻、畜犬、果李，足厥陰藏肝，色青味酸，時春。大宮與上角，同右足陽明上，左角與大角，同左足陽明上，少羽與大羽同右足太陽下，左商與右商，同左手陽明上，加宮與大宮同左足少陽上，質判與大宮，同左手太陽下，判角與大角同左足少陽下，大羽與大角，同右足太陽上，大角與大宮同右足少陽上，右徵、少徵、質徵、上徵、判徵、右角、釱角、上角、大角、判角。","bh":"","notes":[],"pending":true},{"id":"ls65-3","tags":[],"yw":"右商、少商、釱商、上商、左商。少宮、上宮、大宮、加宮、左角宮。衆羽、桎羽、上羽、大羽、少羽。黃帝曰：婦人無須者，無血氣乎？岐伯曰：衝脈任脈皆起於胞中，上循背裏，爲經絡之海，其浮而外者，循腹右上行，會於咽喉，別而絡脣口，血氣盛則充膚熱肉，血獨盛者澹滲皮膚，生毫毛。今婦人之生有餘於氣，不足於血以其數脫血也，衝任之脈，不榮口脣，故須不生焉。黃帝曰：士人有傷於陰，陰氣絕而不起，陰不用，然其須不去，其故何也？宦者獨去何也？願聞其故。","bh":"","notes":[],"pending":true},{"id":"ls65-4","tags":[],"yw":"岐伯曰：宦者去其宗筋，傷其衝脈，血瀉不復，皮膚內結，脣口內榮故須不生。黃帝曰：其有天宦者，未嘗被傷，不脫於血，然其須不生其故何也？岐伯曰：此天之所不足也，其任衝不盛、宗筋不成，有氣無血，脣口不榮，故須不生。黃帝曰：善乎哉！聖人之通萬物也，若日月之光影，音聲鼓響，聞其聲而知其形，其非夫子，孰能明萬物之精。是故聖人，視其顏色黃赤者，多熱氣，青白者少熱氣，黑色者多血少氣，美眉者，太陽多血；通髯極須者，少陽多血，美須者陽明多血，此其時然也。","bh":"","notes":[],"pending":true},{"id":"ls65-5","tags":[],"yw":"夫人之常數，太陽常多血少氣，少陽常多氣少血，陽明常多血多氣，厥陰常多氣少血，少陰常多血少氣，太陰常多血少氣，此天之常數也。","bh":"","notes":[],"pending":true}]},
{"id":"ls66","book":"灵枢","no":66,"title":"百病始生","titleTw":"百病始生","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls66-1","tags":[],"yw":"黃帝問於岐伯曰：夫百病之始生也，皆於風雨寒暑，清溼喜怒，喜怒不節則傷髒，風雨則傷上，清溼則傷下。三部之氣所傷異類，願聞其會，岐伯曰：三部之氣各不同或起於陰或起於陽請言其方，喜怒不節則傷髒，髒傷則病起於陰也，清溼襲虛，則病起於下，風雨襲虛，則病起於上，是謂三部，至於其淫泆，不可勝數。黃帝曰：餘固不能數，故問先師願卒聞其道，岐伯曰：風雨寒熱不得虛，邪不能獨傷人。卒然逢疾風暴雨而不病者，蓋無虛，故邪不能獨傷人。","bh":"","notes":[],"pending":true},{"id":"ls66-2","tags":[],"yw":"此必因虛邪之風，與其身形，兩虛相得，乃客其形。兩實相逢，衆人肉堅，其中於虛邪也因於天時，與其身形，參以虛實，大病乃成，氣有定舍，因處爲名，上下中外，分爲三員。是故虛邪之中人也，始於皮膚，皮膚緩則腠理開，開則邪從毛發入，入則抵深，深則毛發立，毛發立則淅然，故皮膚痛。留而不去，則傳舍於絡脈，在絡之時，痛於肌肉，故痛之時息，大經代去，留而不去，傳舍於經，在經之時，灑淅喜驚。留而不去，傳舍於俞，在俞之時，六經不通四肢，則肢節痛，腰脊乃強，留而不去，傳舍於伏衝之脈，在伏衝之時體重身痛，留而不去，傳舍於腸胃，在腸腎之時，賁響腹脹，多寒則腸鳴飧泄，食不化，多熱則溏出糜。","bh":"","notes":[],"pending":true},{"id":"ls66-3","tags":[],"yw":"留而不去，傳舍於腸胃之外，募原之間，留着於脈，稽留而不去，息而成積，或着孫脈，或着絡脈，或着經脈，或着俞脈，或着於伏衝之脈，或着於膂筋，或着於腸胃之募原，上連於緩筋，邪氣淫泆，不可勝論。黃帝曰：願盡聞其所由然。岐伯曰：其着孫絡之脈而成積者，其積往來上下，臂小孫絡之居也，浮而緩，不能句積而止之，故往來移行腸胃之間，水湊滲注灌，濯濯有音，有寒則(月真)(月真)滿雷引，故時切痛，其着於陽明之經則挾臍而居，飽食則益大，飢則益小。","bh":"","notes":[],"pending":true},{"id":"ls66-4","tags":[],"yw":"其着於緩筋也，似陽明之積，飽食則痛，飢則安。其着於腸胃之募原也，痛而外連於緩筋，飽食則安，飢則痛。其着於伏衝之脈者，揣之應手而動，發手則熱氣下於兩股，如湯沃之狀。其着於膂筋，在腸後者飢則積見，飽則積不見，按之不得。其着於輸之脈者，閉塞不通，津液不下，孔竅干壅，此邪氣之從外入內，從上下也。黃帝曰：積之始生，至其已成，奈何？岐伯曰：積之始生，得寒乃生，厥乃成積也，黃帝曰：其成積奈何？岐伯曰：厥氣生足悗，悗生脛寒，脛寒則血脈凝澀，血脈凝澀則寒氣上入於腸胃，入於腸胃則(月真)脹，(月真)脹則腸外之汁沫迫聚不得散，日以成積。","bh":"","notes":[],"pending":true},{"id":"ls66-5","tags":[],"yw":"卒然多食飲，則腸滿，起居不節，用力過度，則絡脈傷，陽絡傷則血外溢，血外溢則衄血，陰絡傷則血內溢，血內溢則後血。腸胃之絡傷則血溢於腸外，腸外有寒，汁沫與血相搏，則並合凝聚不得散，而積成矣。卒然中外於寒，若內傷於憂怒，則氣上逆，氣上逆則六俞不通，溫氣不行，凝血蘊裏而不散，津液澀滲，着而不去，而積皆成矣。黃帝曰：其生於陰者，奈何？岐伯曰：憂思傷心，重寒傷肺，忿怒傷肝，醉以入房，汗出當風傷脾，用力過度，若入房汗出洛，則傷腎，此內外三部之所生病者也。","bh":"","notes":[],"pending":true},{"id":"ls66-6","tags":[],"yw":"黃帝曰：善治之奈何？岐伯答曰：察其所痛，以知其應，有餘不足，當補則補，當瀉則瀉，毋逆天時，是謂至治。","bh":"","notes":[],"pending":true}]},
{"id":"ls67","book":"灵枢","no":67,"title":"行针","titleTw":"行針","tags":["ci","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls67-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞九針於夫子，而行之於百姓，百姓之血氣，各不同形，或神動而氣先針行；或氣與針相逢；或針已出，氣獨行；或數刺乃知；或發針而氣逆；或數刺病益劇。凡此六者，各不同形，願聞其方。岐伯曰：重陽之人，其神易動，其氣易往也。黃帝曰：何謂重陽之人？岐伯曰：重陽之人，熇熇高高，言語善疾，舉足善高，心肺之髒氣有餘，陽氣滑盛而揚，故神動而氣先行。黃帝曰：重陽之人而神不先行者，何也？岐伯曰：此人頗有陰者也。","bh":"","notes":[],"pending":true},{"id":"ls67-2","tags":[],"yw":"黃帝曰：何以知其頗有陰者也。岐伯曰：多陽者，多喜；多陰者，多怒，數怒者，易解，故曰頗有陰。其陰陽之離合難，故其神不能先行也。黃帝曰：其氣與針相逢，奈何？岐伯曰：陰陽和調，而血氣淖澤滑利，故針入而氣出，疾而相逢也。黃帝曰：針已出而氣獨行者，何氣使然？岐伯曰：其陰氣多而陽氣少，陰氣沉而陽氣浮者內藏，故針已出，氣乃隨其後，故獨行也。黃帝曰：數刺乃知，何氣使然？岐伯曰：此人之多陰而少陽，其氣沉而氣往難，故數刺乃知也。","bh":"","notes":[],"pending":true},{"id":"ls67-3","tags":[],"yw":"黃帝曰：針入而氣逆者，何氣使然？岐伯曰：其氣逆與其數刺病益甚者，非陰陽之氣，浮沉之勢也。此皆麤之所敗，工之所失，其形氣無過焉。","bh":"","notes":[],"pending":true}]},
{"id":"ls68","book":"灵枢","no":68,"title":"上膈","titleTw":"上膈","tags":["ci","jingluo","bingji"],"brief":"","pending":true,"sections":[{"id":"ls68-1","tags":[],"yw":"黃帝曰：氣爲上膈者，食飲入而還出，餘已知之矣。蟲爲下膈。下膈者，食焠時乃出，餘未得其意，願卒聞之。岐伯曰：喜怒不適，食飲不節，寒溫不時，則寒汁流於腸中。流於腸中則蟲寒，蟲寒則積聚，守於下管，則腸胃充郭，衛氣不營，邪氣居之。人食則蟲上食，蟲上食則下管虛，下管虛則邪氣勝之，積聚以留，留則癰成，癰成則下管約。其癰在管內者，即而痛深，其癰在外者，則癰外而痛浮，癰上皮熱。黃帝曰：刺之奈何？岐伯曰：微按其癰，視氣所行，先淺刺其傍，稍內益深，逐而刺之，毋過三行，察其沉浮，以爲深淺。","bh":"","notes":[],"pending":true},{"id":"ls68-2","tags":[],"yw":"已刺必熨，令熱入中，日使熱內，邪氣益衰，大癰乃潰。伍以參禁，以除其內，恬憺無爲，乃能行氣，後以鹹苦，化谷乃下矣。","bh":"","notes":[],"pending":true}]},
{"id":"ls69","book":"灵枢","no":69,"title":"忧恚无言","titleTw":"憂恚無言","tags":["ci","zhenfa","yinyang"],"brief":"","pending":true,"sections":[{"id":"ls69-1","tags":[],"yw":"黃帝問於少師曰：人之卒然憂恚，而言無音者，何道之塞？何氣出行？使音不彰？願聞其方。少師答曰：咽喉者，水谷之道也。喉嚨者，氣之所以上下者也。會厭者，聲音之戶也。口脣者，聲音之扇也。舌者，聲音之機也。懸壅垂者，聲音之關者。頏顙者，分氣之所泄也。橫骨者，神氣所使主發舌者也。故人之鼻洞涕出不收者，頏顙不開，分氣失也。是故厭小而疾薄，則發氣疾，其開闔利，其出氣易，其厭大而厚，則開闔難，其氣出遲，故重言也。人卒然無音者，寒氣客於厭，則厭不能發，發不能下，至其開闔不致，故無音。","bh":"","notes":[],"pending":true},{"id":"ls69-2","tags":[],"yw":"黃帝曰：刺之奈何？岐伯曰：足之少陰，上系於舌，絡於橫骨，終於會厭。兩瀉其血脈，濁氣乃避。會厭之脈，上絡任脈，取之天突，其厭乃發也。","bh":"","notes":[],"pending":true}]},
{"id":"ls70","book":"灵枢","no":70,"title":"寒热","titleTw":"寒熱","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls70-1","tags":[],"yw":"黃帝問於岐伯曰：寒熱瘰?在於頸腋者，皆何氣使生？岐伯曰：此皆鼠?寒熱之毒氣也，留於脈而不去者也。黃帝曰：去之奈何？岐伯曰：鼠?之本，皆在於髒，其末上出於頸腋之間，其浮於脈中，而未內着於肌肉，而外爲膿血者，易去也。黃帝曰：去之奈何？岐伯曰：請從其本引其末，可使衰去，而絕其寒熱。審按其道以予之，徐往徐來以去之，其小如麥者，一刺知，三刺而已。黃帝曰：決其生死奈何？岐伯曰：反其目視之，其中有赤脈，上下貫瞳子，見一脈，一歲死；見一脈半，一歲半死；見二脈，二歲死；見二脈半，二歲半死；見三脈，三歲而死。","bh":"","notes":[],"pending":true},{"id":"ls70-2","tags":[],"yw":"見赤脈不下貫瞳子，可治也。","bh":"","notes":[],"pending":true}]},
{"id":"ls71","book":"灵枢","no":71,"title":"邪客","titleTw":"邪客","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls71-1","tags":[],"yw":"黃帝問於伯高曰：夫邪氣之客人也，或令人目不瞑不臥出者，何氣使然？伯高曰：五谷入於胃也，其糟粕津液宗氣，分爲三隧。故宗氣積於胸中，出於喉嚨，以貫心脈，而行呼吸焉。營氣者，泌其津液，注之於脈，化以爲血，以榮四末，內注五髒六腑，以應刻數焉。節氣者，出其悍氣之慓疾，而先行於四末分肉皮膚之間，而不休者也。晝日行於陽，夜行於陰，常從足少陰之分間，行五髒六腑，今厥氣客於五髒六腑，則衛氣獨衛其外，行於陽，不得入於陰。","bh":"","notes":[],"pending":true},{"id":"ls71-2","tags":[],"yw":"行於陽則陽氣盛，陽氣盛則陽橋陷，不得入於陰，陰虛，故目不瞑。黃帝曰：善。治之奈何？伯高曰：補其不足，瀉其有餘，調其虛實，以通其道，而去其邪。飲以半夏湯一劑，陰陽已通，其臥立至。黃帝曰：善。此所謂決瀆壅塞，經絡大通，陰陽和得者也。願聞其方。伯高曰：其湯方以流水千裏以外者八升，揚之萬遍，取其清五升，煮之，炊以葦薪火，沸置秫米一升，治半夏五合，徐炊，令竭爲一升半，去其滓，飲汁一小杯，日三稍益，以知爲度，故其病新發者，復杯則臥，汗出則已矣。","bh":"","notes":[],"pending":true},{"id":"ls71-3","tags":[],"yw":"久者，三飲而已也。黃帝問於伯高曰：願聞人之肢節以應天地奈何？伯高答曰：天圓地方，人頭圓足方以應之。天有日月，人有兩目；地有九州，人有九竅；天有風雨，人有喜怒；天有雷電，人有聲音；天有四時，人有四肢；天有五音，人有五髒；天有六律，人有六腑；天有冬夏，人有寒熱；天有十曰，人有手十指；辰有十二，人有足十指，莖垂以應之，女子不足二節，以抱人形；天有陰陽，人有夫妻；歲有三百六十五日，人有三百六十五節；地有高山，人有肩膝；地有深谷，人有腋膕；地有十二經水，人有十二經脈；地有泉脈，人有衛氣；地有草蓂，人有毫毛；天有晝夜，人有臥起；天有列星，人有牙齒；地有小山，人有小節；地有山石，人有高骨；地有林木，人有募筋；地有聚邑，人有膕肉；歲有十二月，人有十二節；地有四時不生草，人有無子。","bh":"","notes":[],"pending":true},{"id":"ls71-4","tags":[],"yw":"此人與天地相應者也。黃帝問於岐伯曰：餘願聞持針之數，內針之理，縱舍之意，扞皮開腠理，奈何？脈之屈折，出入之處，焉至而出，焉至而止，焉至而徐，焉至而疾，焉至而入，六腑之輸於身者，餘願盡聞其方。岐伯曰：帝之所問，針道畢矣。黃帝曰：願卒聞之。岐伯曰：手太陰之脈，出於大指之端，內屈，循白肉際，至本節之後太淵，留以澹，外屈，上於本節下，內屈，與陰諸絡會於魚際，數脈並注，其氣滑利，伏行壅骨之下，外屈，出於寸口而行，上至於肘內廉，入於大筋之下，內屈，上行臑陰，入腋下，內屈，走肺。","bh":"","notes":[],"pending":true},{"id":"ls71-5","tags":[],"yw":"此順行逆數之屈折也。心主之脈，出於中指之端，內屈，循中指內廉以上，留於掌中，伏行兩骨之間，外屈，出兩筋之間，上至肘內廉，入於小筋之下，留兩骨之會，上入於胸中，內絡於心脈。黃帝曰：手太陰之脈，獨無俞，何也？岐伯曰：少陰，心脈也。心者，五髒六腑之大主也，精神之所舍也，其髒堅固，邪弗能容也。容之則心傷，心傷則神去，神去則死矣。故諸邪之在於心者，皆在於心之包絡。包絡者，心主之脈也，故獨無俞焉。黃帝曰：少陰獨無俞者，不病乎？岐伯曰：其外經病而藏不病，故獨取其經於掌後銳骨之端。","bh":"","notes":[],"pending":true},{"id":"ls71-6","tags":[],"yw":"其餘脈出入屈折，其行之徐疾，皆如手少陰心主之脈行也。故本俞者，皆因其氣之虛實疾徐以取之，是謂因衝而瀉，因衰而補，如是者，邪氣得去，真氣堅固，是謂因天之序。黃帝曰：持針縱舍奈何？岐伯曰：必先明知十二經脈之本末，皮膚之寒熱，脈之盛衰滑澀。其脈滑而盛者，病日進；虛而細者，久以持；大以澀者，爲痛痹。陰陽如一者，病難治。其本末尚熱者，病尚在；其熱以衰者，其病亦去矣。持其尺，察其肉之堅脆，大小滑澀，寒溫燥溼。","bh":"","notes":[],"pending":true},{"id":"ls71-7","tags":[],"yw":"因視目之五色，以知五髒，而決死生。視其血脈，察其色，以知其寒熱痛痹。黃帝曰：持針縱舍，餘未得其意也。岐伯曰：持針之道，欲端以正，安以靜。先知虛實而行疾徐。左手執骨，右手循之。無與肉果。瀉欲端以正，補必閉膚。輔針導氣，邪得淫泆，真氣得居。黃帝曰：扞皮開腠理奈何？岐伯曰：因其分肉，左別其膚，微內而徐端之，適神不散，邪氣得去。黃帝問於岐伯曰：人有八虛，各何以候？岐伯答曰：以候五髒。黃帝曰：候之奈何？岐伯曰：肺心有邪，其氣留於兩肘；肝有邪，其氣流於兩腋；脾有邪，其氣留於兩髀；腎有邪，其氣留於兩膕。","bh":"","notes":[],"pending":true},{"id":"ls71-8","tags":[],"yw":"凡此八虛者，皆機關之室，真氣之所過，血絡之所遊。邪氣惡血，固不得住留。住留則傷筋絡骨節；機關不得屈伸，故痀攣也。","bh":"","notes":[],"pending":true}]},
{"id":"ls72","book":"灵枢","no":72,"title":"通天","titleTw":"通天","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls72-1","tags":[],"yw":"黃帝問於少師曰：餘嘗聞人有陰陽，何謂陰人？何謂陽人？少師曰：天地之間，六合之內，不離於五，人亦應之，非徒一陰一陽而已也，而略言耳，口弗能遍明也。黃帝曰：願略聞其意，有賢人聖人，心能備而行之乎？少師曰：蓋有太陰之人，少陰之人，太陽之人，少陽之人，陰陽和平之人。凡五人者，其態不同，其筋骨氣血各不等。黃帝曰：其不等者，可得聞乎？少師曰：太陰之人，貪而不仁，下齊湛湛，好內而惡出，心和而不發，不務於時，動而後之，此太陰之人也。","bh":"","notes":[],"pending":true},{"id":"ls72-2","tags":[],"yw":"少陰之人，小貪而賊心，見人有亡，常若有得，好傷好害，見人有榮，乃反慍怒，心疾而無恩，此少陰之人也。太陽之人，居處於於，好言大事，無能而虛說，志發乎四野，舉措不顧是非，爲事如常自用，事雖敗，而常無悔，此太陽之人也。少陽之人，諟諦好自責，有小小官，則高自宜，好爲外交，而不內附，此少陽之人也。陰陽和平之人，居處安靜，無爲懼懼，無爲欣欣，婉然從物，或與不爭，與時變化，尊則謙謙，譚而不治，是謂至治。古之善用針艾者，視人五態，乃治之。","bh":"","notes":[],"pending":true},{"id":"ls72-3","tags":[],"yw":"盛者瀉之，虛者補之。黃帝曰：治人之五態奈何？少師曰：太陰之人，多陰而無陽，其陰血濁，其衛氣澀，陰陽不和，緩筋而厚皮，不之疾瀉，不能移之。少陰之人，多陰少陽，小胃而大腸，六腑不調，其陽明脈小，而太陽脈大，必審調之，其血易脫，其氣易敗也。太陽之人，多陽而少陰，必謹調之，無脫其陰，而瀉其陽。陽重脫者易狂，陰陽皆脫者，暴死，不知人也。少陽之人，多陽少陰，經小而絡大，血在中而氣外，實陰而虛陽。獨瀉其絡脈，則強氣脫而疾，中氣不足，病不起也。","bh":"","notes":[],"pending":true},{"id":"ls72-4","tags":[],"yw":"陰陽和平之人，其陰陽之氣和，血脈調，謹診其陰陽，視其邪正，安容儀，審有餘不足，盛則瀉之，虛則補之，不盛不虛，以經取之，此所以調陰陽，別五態之人者也。黃帝曰：夫五態之人者，相與毋故，卒然新會，未知其行也，何以別之？少師答曰：衆人之屬，不知五態之人者，故五五二十五人，而五態之人不與焉。五態之人，尤不合於衆者也。黃帝曰：別五態之人，奈何？少師曰：太陰之人，其狀黮黮然黑色，念然下意，臨臨然長大，膕然未僂，此太陰之人也。","bh":"","notes":[],"pending":true},{"id":"ls72-5","tags":[],"yw":"少陰之人，其狀清然竊然，固以陰賊，立而躁嶮，行而似伏，此少陰之人也。太陽之人，其狀軒軒儲儲，反身折膕，此太陽之人也。少陽之人，其狀立則好仰，行則好搖，其兩臂兩肘，則常出於背，此少陽之人也。陰陽和平之人，其狀委委然，隨隨然，顒顒然，愉愉然，(目旋)(目旋)然，豆豆然，衆人皆曰君子，此陰陽和平之人也。","bh":"","notes":[],"pending":true}]},
{"id":"ls73","book":"灵枢","no":73,"title":"官能","titleTw":"官能","tags":["ci","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls73-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞九針於夫子，衆多矣不可勝數，餘推而論之，以爲一紀。餘司誦之，子聽其理，非則語餘，請正其道，令可久傳後世無患，得其人乃傳，非其人勿言。岐伯稽首再拜曰：請聽聖王之道。黃帝曰：用針之理，必知形氣之所在，左右上下，陰陽表裏，血氣多少，行之逆順，出入之合，謀伐有過。知解結，知補虛瀉實，上下氣門，明通於四海。審其所在，寒熱淋露以輸異處，審於調氣，明於經隧，左右肢絡，盡知其會。寒與熱爭，能合而調之，虛與實鄰，知決而通之，左右不調，把而行之，明於逆順，乃知可治，陰陽不奇，故知起時。","bh":"","notes":[],"pending":true},{"id":"ls73-2","tags":[],"yw":"審於本末，察其寒熱，得邪所在，萬刺不殆。知官九針，刺道畢矣。明於五俞徐疾所在，屈伸出入，皆有條理。言陰與陽，合於五行，五髒六腑，亦有所藏，四時八風，盡有陰陽。各得其位，合於明堂，各處色部，五髒六腑。察其所痛，左右上下，知其寒溫，何經所在。審皮膚之寒溫滑澀，知其所苦，膈有上下，知其氣所在。先得其道，稀而疏之，稍深以留，故能徐入之。大熱在上，推而下之；從上下者，引而去之；視前痛者，常先取之。大寒在外，留而補之；入於中者，從合瀉之。","bh":"","notes":[],"pending":true},{"id":"ls73-3","tags":[],"yw":"針所不爲，灸之所宜。上氣不足，推而揚之；下氣不足，積而從之；陰陽皆虛，火自當之。厥而寒甚，骨廉陷下，寒過於膝，下陵三裏。陰絡所過，得之留止，寒入於中，推而行之；經陷下者，火則當之；結絡堅緊，火所治之。不知所苦，兩蹻之下，男陰女陽，良工所禁，針論畢矣。用針之服，必有法則，上視天光，下司八正，以辟奇邪，而觀百姓，審於虛實，無犯其邪。是得天之靈，遇歲之虛，救而不勝，反受其殃，故曰必知天忌，乃言針意。法於往古，驗於來今，觀於窈冥，通於無窮。","bh":"","notes":[],"pending":true},{"id":"ls73-4","tags":[],"yw":"麤之所不見，良工之所貴。莫知其形，若神髣佛。邪氣之中人也，灑淅動形；正邪之中人也，微先見於色，不知於其身，若有若無，若亡若存，有形無形，莫知其情。是故上工之取氣，乃救其萌芽；下工守其已成，因敗其形。是故工之用針也，知氣之所在，而守其門戶，明於調氣，補瀉所在，徐疾之意，所取之處。瀉必用員，切而轉之，其氣乃行，疾而徐出，邪氣乃出，伸而迎之，遙大其穴，氣出乃疾。補必用方，外引其皮，令當其門，左引其樞，右推其膚，微旋而徐推之，必端以正，安以靜，堅心無解，欲微以留，氣下而疾出之，推其皮，蓋其外門，真氣乃存。","bh":"","notes":[],"pending":true},{"id":"ls73-5","tags":[],"yw":"用針之要，無忘其神。雷公問於黃帝曰：針論曰：得其人乃傳，非其人勿言，何以知其可傳？黃帝曰：各得其人，任之其能，故能明其事。雷公曰：願聞官能奈何？黃帝曰：明目者，可使視色；聰耳者，可使聽音；捷疾辭語者，可使傳論；語徐而安靜，手巧而心審諦者，可使行針艾，理血氣而調諸逆順，察陰陽而兼諸方。緩節柔筋而心和調者，可使導引行氣；疾毒言語輕人者，可使唾癰?病；爪苦手毒，爲事善傷者，可使按積抑痹。各得其能，方乃可行，其名乃彰。","bh":"","notes":[],"pending":true},{"id":"ls73-6","tags":[],"yw":"不得其人，其功不成，其師無名。故曰：得其人乃言，非其人勿傳，此之謂也。手毒者，可使試按龜，置龜於器下，而按其上，五十日而死矣，手甘者，復生如故也。","bh":"","notes":[],"pending":true}]},
{"id":"ls74","book":"灵枢","no":74,"title":"论疾诊尺","titleTw":"論疾診尺","tags":["zhenfa","bingji","yinyang"],"brief":"","pending":true,"sections":[{"id":"ls74-1","tags":[],"yw":"黃帝問岐伯曰：餘欲無視色持脈，獨調其尺，以言其病，從外知內，爲之奈何？岐伯曰：審其尺之緩急小大滑澀，肉之堅脆，而病形定矣。視人之目窠上微癰，如新臥起狀，其頸脈動，時咳，按其手足上，窅而不起者，風水膚脹也。尺膚滑，其淖澤者，風也。尺肉弱者，解並，安臥脫肉者，寒熱，不治。尺膚滑而澤脂者，風也。尺膚澀者，風痹也。尺膚麤如枯魚之鱗者，水泆飲也。尺膚熱甚，脈盛躁者，病溫也，其脈甚而滑者，病且出也。尺膚寒，其脈小者，泄、少氣。","bh":"","notes":[],"pending":true},{"id":"ls74-2","tags":[],"yw":"尺膚炬然，先熱後寒者，寒熱也；尺膚先寒，久大之而熱者，亦寒熱也。肘所獨熱者，腰以上熱；手所獨熱者，腰以下熱。肘前獨熱者，膺前熱；肘後獨熱者，肩背熱。臂中獨熱者，腰腹熱；肘後麤以下三四寸熱者，腸中有蟲。掌中熱者，腹中熱；掌中寒者，腹中寒。魚上白肉有青血脈者，胃中有寒。尺炬然熱，人迎大者，當本血；尺堅大，脈小甚，少氣，免有加，立死。目赤色者病在心，白在肺，青在肝，黃在脾，黑在腎。黃色不可名者，病在胸中。","bh":"","notes":[],"pending":true},{"id":"ls74-3","tags":[],"yw":"診目痛，赤脈從上下者，太陽病；從下上者，陽明病；從外走內者，少陽病。診寒熱，赤脈上下至瞳子，見一脈一歲死；見一脈半，一歲半死；見二脈，二歲死；見二脈半，二歲半死；見三脈，三歲死。診齲齒痛，按其陽之來，有過者獨熱，在左左熱，在右右熱，在上上熱，在下下熱。診血脈者，多赤多熱，多青多痛，多黑爲久痹，多赤、多黑、多青皆見者，寒熱。身痛而色微黃，齒垢黃，爪甲上黃，黃疸也。安臥小便黃赤，脈小而澀者不嗜食。人病，其寸口之脈，與人迎之脈小大等，及其浮沉等者，病難已也。","bh":"","notes":[],"pending":true},{"id":"ls74-4","tags":[],"yw":"女子手少陰脈動甚者妊子。嬰兒病，其頭毛皆逆上者必死。耳間青脈起者掣痛。大便赤瓣飧泄，脈小者，手足寒，難已；飧泄，脈小，手足溫，泄易也。四時之變，寒暑之勝，重陰必陽，重陽必陰；故陰主寒，陽主熱，故寒甚則熱，熱甚則寒，故曰寒生熱，熱生寒，此陰陽之變也。故曰：冬傷於寒，春生病熱；春傷於風，夏生飧泄腸僻，夏傷於暑，秋生瘧；秋傷於溼，冬生咳嗽。是謂四時之序也。","bh":"","notes":[],"pending":true}]},
{"id":"ls75","book":"灵枢","no":75,"title":"刺节真邪","titleTw":"刺節真邪","tags":["ci","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls75-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞刺有五衛，奈何？岐伯曰：固有五衛，一曰振埃，二曰發蒙，三曰去爪，四曰徹衣，五曰解惑。黃帝曰：夫子言五衛，餘未知其意。岐伯曰：振埃者，刺外經去陽病也；發蒙者，刺腑俞，去腑病也；去爪者，刺關節肢絡也；徹衣者，盡刺諸陽之奇俞也；解惑者，盡知調陰陽，補瀉有餘不足，相傾移也。黃帝曰：刺衛言振埃，夫子乃言刺外經，去陽病，餘不知其所謂也。願卒聞之。岐伯曰：振埃者，陽氣大逆，上滿於胸中，憤瞋肩息，大氣逆上，喘喝坐伏，病惡埃煙，飼不得息，請言振埃，尚疾於振埃。","bh":"","notes":[],"pending":true},{"id":"ls75-2","tags":[],"yw":"黃帝曰：善。取之何如？岐伯曰：取之天容。黃帝曰：其咳上氣窮拙胸痛者，取之奈何？岐伯曰：取之廉泉。黃帝曰：取之有數乎？岐伯曰：取天容者，無過一裏，取廉泉者，血變而止。帝曰：善哉。黃帝曰：刺衛言發蒙，餘不得其意。夫發蒙者，耳無所聞，目無所見，夫子乃言刺腑俞，去腑病，何輸使然，願聞其故。岐伯曰：妙乎哉問也。此刺之大約，針之極也，神明之類也，口說書卷，猶不能及也，請言發蒙耳，尚疾於發蒙也。黃帝曰：善。願卒聞之。","bh":"","notes":[],"pending":true},{"id":"ls75-3","tags":[],"yw":"岐伯曰：刺此者，必於日中，刺其聽宮，中其眸子，聲聞於耳，此其輸也。黃帝曰：善。何謂聲聞於耳？岐伯曰：刺邪以手堅按其兩鼻竅，而疾偃其聲，必應於針也。黃帝曰：善。此所謂弗見爲之，而無目視，見而取之，神明相得者也。黃帝曰：刺衛言去爪，夫子乃言刺關節肢絡，願卒聞之。岐伯曰：腰脊者，身之大關節也；肢脛者，人之管以趨翔也；莖垂者，身中之機，陰精之候，津液之道也。故飲食不節，喜怒不時，津液內溢，乃下留於睪，血道不通，日大不休，俛仰不便，趨翔不能。","bh":"","notes":[],"pending":true},{"id":"ls75-4","tags":[],"yw":"此病榮然有水，不上不下，鈹石所取，形不可匿，常不得蔽，故命曰去爪。帝曰：善。黃帝曰：刺衛言徹衣，夫子乃言盡刺諸陽之奇俞，未有常處也。願卒聞之。岐伯曰：是陽氣有餘，而陰氣不足，陰氣不足則內熱，陽氣有餘則外熱，內熱相搏，熱於懷炭，外畏綿帛近，不可近身，又不可近席。腠理閉塞，則汗不出，舌焦脣槁，臘干益燥，飲食不讓美惡。黃帝曰：善。取之奈何？岐伯曰：取之於其天府大杼三痕，又刺中膂，以去其熱，補足手太陰，以去其汗，熱去汗稀，疾於徹衣。","bh":"","notes":[],"pending":true},{"id":"ls75-5","tags":[],"yw":"黃帝曰：善。黃帝曰：刺衛言解惑，夫子乃言盡知調陰陽，補瀉有餘不足，相傾移也，惑何以解之？岐伯曰：大風在身，血脈偏虛，虛者不足，實者有餘，輕重不得，傾側宛伏，不知東西，不知南北，乍上乍下，乍反乍復，顛倒無常，甚於迷惑。黃帝曰：善。取之奈何？岐伯曰：瀉其有餘，補其不足，陰陽平復，用針若此，疾於解惑。黃帝曰：善。請藏之靈蘭之室，不敢妄出也。黃帝曰：餘聞刺有五邪，何謂五邪？岐伯曰：病有持癰者，有容大者，有狹小者，有熱者，有寒者，是謂五邪。","bh":"","notes":[],"pending":true},{"id":"ls75-6","tags":[],"yw":"黃帝曰：刺五邪奈何？岐伯曰：凡刺五邪之方，不過五章，癉熱消滅，腫聚散亡，寒痹益溫，小者益陽；大者必去，請道其方。凡刺癰邪，無迎隴，易俗移性。不得膿，脆道更行，去其鄉，不安處所乃散亡，諸陰陽過癰者，取之其輸瀉之。凡刺大邪，日以小，泄奪其有餘，乃益虛。剽其通，針其邪，肌肉親視之，毋有反其真，刺諸陽分肉間。凡刺小邪，日以大，補其不足，乃無害。視其所在，迎之界，遠近盡至，其不得外侵而行之，乃自費，刺分肉間。","bh":"","notes":[],"pending":true},{"id":"ls75-7","tags":[],"yw":"凡刺熱邪，越而蒼，出遊不歸，乃無病。爲開通，辟門戶，使邪得出，病乃已。凡刺寒邪，日以溫，徐往徐來，致其神。門戶已閉，氣不分，虛實得調，其氣存也。黃帝曰：官針奈何？岐伯曰：刺癰者，用鈹針；刺大者，用鋒針；刺小者，用員利針；刺熱者，用纔針；刺寒者，用毫針也。請言解論，與天地相應，與四時相副，人參天地，故可爲解。下有漸洳，上生葦蒲，此所以知形氣之多少也。陰陽者，寒暑也，熱則滋雨而在上，根莖少汁，人氣在外，皮膚緩，腠理開，血氣減，汗大泄，皮淖澤。","bh":"","notes":[],"pending":true},{"id":"ls75-8","tags":[],"yw":"寒則地凍水冰，人氣在中，皮膚致，腠理閉，汗不出，血氣強，肉堅澀。當是之時，善行水者，不能往冰，善穿地者，不能擊凍，善用針者，亦不能取四厥，血脈凝結，堅搏不往來者，亦未可即柔。故行水者，必待天溫，冰釋凍解，而水可行，地可穿也。人脈猶是也。治厥者，必先熨調和其經，掌與腋，肘與腳，項與脊以調之，火氣已通，血脈乃行。然後視其病，脈淖澤者，刺而平之；堅緊者，破而散之，氣下乃止，此所謂以解結者也。用針之類，在於調氣，氣積於胃，以通營衛，各行其道。","bh":"","notes":[],"pending":true},{"id":"ls75-9","tags":[],"yw":"宗氣留於海，其下者，注於氣街，其上者，走於息道。故厥在於足，宗氣不下，脈中之血，凝而留止，弗之火調，弗能取之。用針者，必先察其經絡之實虛，切而循之，按而彈之，視其應動者，乃後取之而下之。六經調者，謂之不病，雖病，謂之自已也。一經上實下虛而不通者，此必有橫絡盛加於大經，令之不通，視而瀉之，此所謂解結也。上寒下熱，先刺其項太陽，久留之，已刺則熨項與肩胛，令熱下合乃止，此所謂推而上之者也。上熱下寒，視其虛脈而陷之於經絡者，取之，氣下乃止，此所謂引而下之者也。","bh":"","notes":[],"pending":true},{"id":"ls75-10","tags":[],"yw":"大熱遍身，狂而妄見妄聞妄言，視足陽明及大絡取之，虛者補之，血而實者瀉之。因其偃臥，居其頭前，以兩手四指挾按頸動脈，久持之，卷而切，推下至缺盆中，而復止如前，熱去乃止，此所謂推而散之者也。黃帝曰：有一脈生數十病者，或痛，或癰，或熱，或寒，或癢，或痹，或不仁，變化無窮，其故何也？岐伯曰：此皆邪氣之所生也。黃帝曰：餘聞氣者，有真氣，有正氣，有邪氣。何謂真氣？岐伯曰：真氣者，所受於天，與谷氣並而充身也。正氣者，正風也，從一方來，非實風，又非虛風也。","bh":"","notes":[],"pending":true},{"id":"ls75-11","tags":[],"yw":"邪氣者，虛風之賊傷人也，其中人也深，不能自去。正風者，其中人也淺，合而自去，其氣來柔弱，不能勝真氣，故自去。虛邪之中人也，灑晰動形，起毫毛而發腠理。其入深，內搏於骨，則爲骨痹；搏於筋，則爲筋攣；搏於脈中，則爲血閉，不通則爲癰。搏於肉，與衛氣相搏，陽勝者，則爲熱，陰勝者，則爲寒。寒則真氣去，去則虛，虛則寒搏於皮膚之間。其氣外發，腠理開，毫毛搖，氣往來行，則爲癢。留而不去，則痹。衛氣不行，則爲不仁。虛邪偏容於身半，其入深，內居榮衛，榮衛稍衰，則真氣去，邪氣獨留，發爲偏枯。","bh":"","notes":[],"pending":true},{"id":"ls75-12","tags":[],"yw":"其邪氣淺者，脈偏痛。虛邪之入於身也深，寒與熱相搏，久留而內着，寒勝其熱，則骨疼肉枯；熱勝其寒，則爛肉腐肌爲膿，內傷骨，內傷骨爲骨蝕。有所疾前筋，筋屈不得伸，邪氣居其間而不反，發爲筋溜。有所結，氣歸之，衛氣留之，不得反，津液久留，合而爲腸溜。久者，數歲乃成，以手按之柔，已有所結，氣歸之，津液留之，邪氣中之，凝結日以易甚，連以聚居，爲昔瘤。以手按之堅，有所結，深中骨，氣因於骨，骨與氣並，日以益大，則爲骨疽。","bh":"","notes":[],"pending":true},{"id":"ls75-13","tags":[],"yw":"有所結，中於肉，宗氣歸之，邪留而不去，有熱則化而爲膿，無熱則爲肉疽。凡此數氣者，其發無常處，而有常名也。","bh":"","notes":[],"pending":true}]},
{"id":"ls76","book":"灵枢","no":76,"title":"卫气行","titleTw":"衛氣行","tags":["jingluo","zhenfa","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls76-1","tags":[],"yw":"黃帝問於岐伯曰：願聞衛氣之行，出入之合，何如？岐伯曰：歲有十二月，日有十二辰，子午爲經，卯酉爲緯。天周二十八宿，而一面七星，四七二十八星。房昴爲緯，虛張爲經。是故房至畢爲陽，昴至心爲陰。陽主晝，陰主夜。故衛氣之行，一日一夜五十周於身，晝日行於陽二十五周，夜行於陰二十五周，周於五藏。是故平旦陰盡，陽氣出於目，目張則氣上行於頭，循項下足太陽，循背下至小趾之端。其散者，別於目銳眥，下手太陽，下至手小指之間外側。","bh":"","notes":[],"pending":true},{"id":"ls76-2","tags":[],"yw":"其散者，別於目銳眥，下足少陽，注小趾次趾之間。以上循手少陽之分側，下至小指之間。別者以上至耳前，合於頷脈，注足陽明以下行，至跗上，入五趾之間。其散者，從耳下下手陽明，入大指之間，入掌中。其至於足也，入足心，出內踝，下行陰分，復合於目，故爲一周。是故日行一舍，人氣行一周與十分身之八；日行二舍，人氣行三周於身與十分身之六；日行三舍，人氣行於身五周與十分身之四；日行四舍，人氣行於身七周與十分身之二；日行五舍，人氣行於身九周；日行六舍，人氣行於身十周與十分身之八；日行七舍，人氣行於身十二周在身與十分身之六；日行十四舍，人氣二十五周於身有奇分與十分身之二，陽盡於陰，陰受氣矣。","bh":"","notes":[],"pending":true},{"id":"ls76-3","tags":[],"yw":"其始入於陰，常從足少陰注於腎，腎注於心，心注於肺，肺注於肝，肝注於脾，脾復注於腎爲周。是故夜行一舍，人氣行於陰藏一周與十分藏之八，亦如陽行之二十五周，而復合於目。陰陽一日一夜，合有奇分十分身之四，與十分藏之二，是故人之所以臥起之時，有早晏者，奇分不盡故也。黃帝曰：衛氣之在於身也，上下往來不以期，候氣而刺之，奈何？伯高曰：分有多少，日有長短，春秋冬夏，各有分理，然後常以平旦爲紀，以夜盡爲始。是故一日一夜，水下百刻，二十五刻者，半日之度也，常如是毋已，日入而止，隨日之長短，各以爲紀而刺之。","bh":"","notes":[],"pending":true},{"id":"ls76-4","tags":[],"yw":"謹候其時，病可與期，失時反候者，百病不治。故曰：刺實者，刺其來也，刺虛者，刺其去也。此言氣存亡之時，以候虛實而刺之，是故謹候氣之所在而刺之，是謂逢時。在於三陽，必候其氣在於陽而刺之，病在於三陰，必候其氣在陰分而刺之。水下一刻，人氣在太陽；水下二刻，人氣在少陽；水下三刻，人氣在陽明；水下四刻，人氣在陰分。水下五刻，人氣在太陽；水下六刻，人氣在少陽；水下七刻，人氣在陽明；水下八刻，人氣在陰分。水下九刻，人氣在太陽；水下十刻，人氣在少陽；水下十一刻，人氣在陽明；水下十二刻，人氣在陰分。","bh":"","notes":[],"pending":true},{"id":"ls76-5","tags":[],"yw":"水下十三刻，人氣在太陽；水下十四刻，人氣在少陽；水下十五刻，人氣在陽明；水下十六刻，人氣在陰分。水下十七刻，人氣在太陽；水下十八刻，人氣在少陽；水下十九刻，人氣在陽明；水下二十刻，人氣在陰分。水下二十一刻，人氣在太陽；水下二十二刻，人氣在少陽；水下二十三刻，人氣在陽明；水下二十四刻，人氣在陰分。水下二十五刻，人氣在太陽，此半日之度也。從房至畢一十四舍水下五十刻，日行半度，回行一舍，水下三刻與七分刻之四。","bh":"","notes":[],"pending":true},{"id":"ls76-6","tags":[],"yw":"大要曰：常以日之加於宿上也，人氣在太陽，是故日行一舍，人氣行三陽行與陰分，常如是無已，天與地同紀，紛紛紛紛，終而復始，一日一夜水下百刻而盡矣。","bh":"","notes":[],"pending":true}]},
{"id":"ls77","book":"灵枢","no":77,"title":"九宫八风","titleTw":"九宮八風","tags":["yunqi","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls77-1","tags":[],"yw":"太一常以冬至之日，居葉蟄之宮四十六日，明日居天留四十六日，明日居倉門四十六日，明日居陰洛四十五日，明日居天宮四十六日，明日居玄委四十六日，明日居倉果四十六日，明日居新洛四十五日，明日復居葉蟄之宮，曰冬至矣。太一日遊，以冬至之日，居葉蟄之宮，數所在日，從一處至九日，復返於一。常如是無已，終而復始。太一移日，天必應之以風雨，以其日風雨則吉，歲美民安少病矣。先之則多雨，後之則多汗。太一在冬至之日有變，佔在君；太一在春分之日有變，佔在相；太一在中宮之日有變，佔在吏；太一在秋分之日有變，佔在將；太一在夏至之日有變，佔在百姓。","bh":"","notes":[],"pending":true},{"id":"ls77-2","tags":[],"yw":"所謂有變者，太一居五宮之日，病風折樹木，揚沙石，各以其所主，佔貴賤。因視風所從來而佔之，風從其所居之鄉來爲實風，主生，長養萬物；從其衝後來爲虛風，傷人者也，主殺，主害者。謹候虛風而避之，故聖人日避虛邪之道，如避矢石然，邪弗能害，此之謂也。是故太一入徙立於中宮，乃朝八風，以佔吉兇也。風從南方來，名曰大弱風，其傷人也，內舍於心，外在於脈，氣主熱。風從西南方來，名曰謀風，其傷人也，內舍於脾，外在於肌，其氣主爲弱。","bh":"","notes":[],"pending":true},{"id":"ls77-3","tags":[],"yw":"風從西方來，名曰剛風，其傷人也，內舍於肺，外在於皮膚，其氣主爲燥。風從西北方來，名曰折風，其傷人也，內舍於小腸，外在於手太陽脈，脈絕則溢，脈閉則結不通，善暴死。風從北方來，名曰大剛風，其傷人也，內舍於腎，外在於骨與肩背之膂筋，其氣主爲寒也。風從東北方來，名曰兇風，其傷人也，內舍於大腸，外在於兩脅腋骨下及肢節。風從東方來，名曰嬰兀風，其傷人也，內舍於肝，外在於筋紐，其氣主爲身溼。風從東南方來，名曰弱風，其傷人也，內舍於胃，外在肌肉，其氣主體重。","bh":"","notes":[],"pending":true},{"id":"ls77-4","tags":[],"yw":"此八風皆從其虛之鄉來，乃能病人。三虛相搏，則爲暴病卒死。兩實一虛，病則爲淋露寒熱。犯其兩溼之地，則爲痿。故聖人避風，如避矢石焉。其有三虛而偏中於邪風，則爲僕偏枯矣。","bh":"","notes":[],"pending":true}]},
{"id":"ls78","book":"灵枢","no":78,"title":"九针论","titleTw":"九針論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls78-1","tags":[],"yw":"黃帝曰：餘聞九針於夫子，衆多博大矣，餘猶不能寤，敢問九針焉生，何因而有名？岐伯曰：九針者，天地之大數也，始於一而終於九。故曰：一以法天，二以法地，三以法人，四以法時，五以法音，六以法律，七以法星，八以法風，九以法野。黃帝曰：以針應九之數，奈何？岐伯曰：夫聖人之起天地之數也，一而九之，故以立九野。九而九之，九九八十一，以起黃鍾數焉，以針應數也。一者，天也。天者，陽也。五藏之應天者肺，肺者，五藏六府之蓋也，皮者，肺之合也，人之陽也。","bh":"","notes":[],"pending":true},{"id":"ls78-2","tags":[],"yw":"故爲之治針，必以大其頭而銳其末，令無得深入而陽氣出。二者，地也。人之所以應土者，肉也。故爲之治針，必筩其身而員其末，令無得傷肉分，傷則氣得竭。三者，人也。人之所以成生者，血脈也。故爲之治針，必大其身而員其末，令可以按脈物陷，以致其氣，令邪氣獨出。四者，時也。時者，四時八風之客於經絡之中，爲瘤病者也。故爲之治針，必筩其身而鋒其末，令可以瀉熱出血，而痼病竭。五者，音也。音者，冬夏之分，分於子午，陰與陽別，寒與熱爭，兩氣相搏，合爲癰膿者也。","bh":"","notes":[],"pending":true},{"id":"ls78-3","tags":[],"yw":"故爲之治針，必令其末如劍鋒，可以取大膿。六者，律也。律者，調陰陽四時而合十二經脈，虛邪客於經絡而爲暴痹者也。故爲之治針，必令尖如釐，且員其銳，中身微大，以取暴氣。七者，星也。星者，人之七竅，邪之所客於經，而爲痛痹，合於經絡者也。故爲之治針，令尖如蚊虻喙，靜以徐往，微以久留，正氣因之，真邪俱往，出針而養者也。八者，風也。風者，人之股肱八節也。八正之虛風，八風傷人，內舍於骨解腰脊節腠理之間爲深痹也。故爲之治針，必長其身，鋒其末，可以取深邪遠痹。","bh":"","notes":[],"pending":true},{"id":"ls78-4","tags":[],"yw":"九者，野也。野者，人之節解皮膚之間也。淫邪流溢於身，如風水之狀，而留不能過於機關大節者也。故爲之治針，令尖如挺，其鋒微員，以取大氣之不能過於關節者也。黃帝曰：針之長短有數乎？岐伯曰：一曰鐵針者，取法於巾針，去末寸半，卒銳之，長一寸六分，主熱在頭身也。二曰員針，取法於絮針，其身而卵其鋒，長一寸六分，主治分間氣。三曰提針，取法於黍粟之銳，長三寸半，主按脈取氣，令邪出。四曰鋒針，取法於絮針，其身，鋒其末，長一寸六分，主癰熱出血。","bh":"","notes":[],"pending":true},{"id":"ls78-5","tags":[],"yw":"五曰鈹針，取法於劍鋒，廣二分半，長四寸，主大癰膿，兩熱爭者也。六曰員利針，取法於釐針，微大其末，反小其身，令可深內也，長一寸六分。主取癰痹者也。七曰毫針，取注於毫毛，長一寸六分，主寒熱痛痹在絡者也。八曰長針，取法於綦針，長七寸，主取深邪遠痹者也。九曰大針，取法於鋒針，其鋒微員，長四寸，主取大氣不出關節者也。針形畢矣，此九針大小長短法也。黃帝曰：願聞身形，應九野，奈何？岐伯曰：請言身形之應九野也，左足應立春，其日戊寅己丑。","bh":"","notes":[],"pending":true},{"id":"ls78-6","tags":[],"yw":"左脅應春分，其日乙卯。左手應立夏，其日戊辰己巳。膺喉首頭應夏至，其日丙午。右手應立秋，其中戊申己末。右脅應秋分，其日辛酉。右足應立冬，其日戊戌己亥。腰尻下竅應冬至，其日壬子。六腑下三髒應中州，其大禁，大禁太一所在之日，及諸戊己。凡此九者，善候八正所在之處。所主左右上下身體有癰腫者，欲治之，無以其所直之日潰治之，是謂天忌日也。形東志苦，病生於脈，治之於灸刺。形苦志東，病生於筋，治之以熨引。形東志東，病生於肉，治之以針石。","bh":"","notes":[],"pending":true},{"id":"ls78-7","tags":[],"yw":"形苦志苦，病生於咽喝，治之以甘藥。形數驚恐，筋脈不通，病生於不仁，治之以按摩謬藥。是謂形。五髒氣，心主噫，肺主咳，肝主語，脾主吞，腎主欠。六腑氣，膽爲怒，胃爲氣逆穢，大腸小腸爲泄，膀胱不約爲遺溺，下焦溢爲水。五味：酸入肝，辛入肺，苦入心，甘入脾，鹹入腎，淡入胃，是謂五味。五並：精氣並肝則憂，並心則喜，並肺則悲，並腎則恐，並脾則畏，是謂五精之氣，並於髒也。五惡：肝惡風，心惡熱，肺惡寒，腎惡燥，脾惡溼，此五髒氣所惡也。","bh":"","notes":[],"pending":true},{"id":"ls78-8","tags":[],"yw":"五液：心主汗，肝主泣，肺主涕，腎主唾，脾主液，此五液所出也。五勞：久視傷血，久臥傷氣，久坐傷肉，久立傷骨，久行傷筋，此五久勞所病也。五走：酸走筋，辛走氣，苦走血，鹹走骨，甘走肉，是謂五走也。五裁：病在筋，無食酸；病在氣，無食辛；病在骨，無食鹹；病在血，無食苦；病在肉，無食甘。口嗜而欲食之，不可多也，必自裁也，命曰五裁。五發：陰病發於骨，陽病發於血，陰病發於肉，陽病發於冬，陰病發於夏。五邪：邪入於陽，則爲狂；邪入於陰，則爲血癉；邪入於陽，轉則爲癲疾；邪入於陰，轉則爲瘖；陽入於陰，病靜；陰出之於陽，病喜怒。","bh":"","notes":[],"pending":true},{"id":"ls78-9","tags":[],"yw":"五藏：心藏神，肺藏魄，肝藏魂，脾藏意，腎藏精志也。五主：心主脈，肺主皮，肝主筋，脾主肌，腎主骨。陽明多血多氣，太陽多血少氣，少陽多氣少血，太陰多血少氣，厥陰多血少氣，少陰多氣少血。故曰刺陽明出血氣，刺太陽出血惡氣，刺少陽出氣惡血，刺太陰出血惡氣，刺厥陰出血惡氣，刺少陰出氣惡血也。足陽明太陰爲裏表，少陽厥陰爲表裏，太陽少陰爲表裏，是謂足之陰陽也。手陽明太陰爲表裏，少陽心主爲表裏，太陽少陰爲表裏，是謂手之陰陽也。","bh":"","notes":[],"pending":true}]},
{"id":"ls79","book":"灵枢","no":79,"title":"岁露论","titleTw":"歲露論","tags":["yunqi","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls79-1","tags":[],"yw":"黃帝問於岐伯曰：經言夏日傷暑，秋病瘧，瘧之發以時，其故何也？岐伯對曰：邪客於風府，病循膂而下，衛氣一日一夜，常大會於風府，其明日日下一節，故其日作晏，此其先客於脊背也。故每至於風府則腠理開，腠理開則邪氣入，邪氣入則病作，此所以日作尚晏也。衛氣之行風府，日下一節，二十一日下至尾底，二十二日入脊內，注於伏衝之脈，其行九日，出於缺盆之中，其氣上行，故其病稍益至。其內搏於五髒，橫連募原，其道遠，其氣深，其行遲，不能日作，故次日乃蓄積而作焉。","bh":"","notes":[],"pending":true},{"id":"ls79-2","tags":[],"yw":"黃帝曰：衛氣每至於風府，腠理乃發，發則邪入焉。其衛氣日下一節，則不當風府，奈何？岐伯曰：風府無常，衛氣之所應，必開其腠理，氣之所舍節，則其府也。黃帝曰：善。夫風之與瘧也，相與同類，而風常在，而瘧特以時休，何也？岐伯曰：風氣留其處，瘧氣隨經絡，沉以內搏，故衛氣應，乃作也。帝曰：善。黃帝問於少師曰：餘聞四時八風之中人也，故有寒暑，寒則皮膚急而腠理閉；暑則皮膚緩而腠理開。賊風邪氣，因得以入乎？將必須八正虛邪，乃能傷人乎？少師答曰：不然。","bh":"","notes":[],"pending":true},{"id":"ls79-3","tags":[],"yw":"賊風邪氣之中人也，不得以時，然必因其開也，其入深，其內極病，其病人也，卒暴。因其閉也，其入淺以留，其病也，徐以遲。黃帝曰：有寒溫和適，腠理不開，然有卒病者，其故何也？少師答曰：帝弗知邪入乎。雖平居其腠理開閉緩急，其故常有時也。黃帝曰：可得聞乎？少師曰：人與天地相參也，與日月相應也。故月滿則海水西盛，人血氣積，肌肉充，皮膚致，毛發堅，腠理郗，煙垢着，當是之時，雖遇賊風，其入淺不深。至其月郭空，則海水東盛，人氣血虛，其衛氣去，形獨居，肌肉減，皮膚縱，腠理開，毛發殘，膠理薄，煙垢落，當是之時，遇賊風則其入深，其病人也，卒暴。","bh":"","notes":[],"pending":true},{"id":"ls79-4","tags":[],"yw":"黃帝曰：其有卒然暴死暴病者，何也？少師答曰：三虛者，其死暴疾也；得三實者邪不能傷人也。黃帝曰：願聞三虛。少師曰：乘年之衰，逢月之空，失時之和，因爲賊風所傷，是謂三虛。故論不知三虛，工反爲粗。帝曰：願聞三實。少師曰：逢年之盛，遇月之滿，得時之和，雖有賊風邪氣，不能危之也。黃帝曰：善乎哉論！明乎哉道！請藏之金匱，命曰三實。然，此一夫之論也。黃帝曰：願聞歲之所以皆同病者，何因而然？少師曰：此八正之候也。","bh":"","notes":[],"pending":true},{"id":"ls79-5","tags":[],"yw":"黃帝曰：候之奈何？少師曰：候此者，常以冬至之日，太一立於葉蟄之宮，其至也，天必應之以風雨者矣。風雨從南方來者，爲虛風，賊傷人者也。其以夜半至也，萬民皆臥而弗犯也，故其歲民少病。其以晝至者，萬民懈惰而皆中於虛風，故萬民多病。虛邪入客於骨而不發於外，至其立春，陽氣大發，腠理開，因立春之日，風從西方來，萬民又皆中於虛風，此兩邪相搏，經氣結代者矣。故諸逢其風而遇其雨者，命曰遇歲露焉，因歲之和，而少賊風者，民少病而少死。","bh":"","notes":[],"pending":true},{"id":"ls79-6","tags":[],"yw":"歲多賊風邪氣，寒溫不和，則民多病而死矣。黃帝曰：虛邪之風，其所傷貴賤何如，候之奈何？少師答曰：正月朔日，太一居天留之宮，其日西北風，不雨，人多死矣。正月朔日，平旦北風，春，民多死。正月朔日，平旦北風行，民病多者，十有三也。正月朔日，日中北風，夏，民多死。正月朔日，夕時北風，秋，民多死。終日北風，大病死者十有六。正月朔日，風從南方來，命曰旱鄉；從西方來，命曰白骨，將國有殃，人多死亡。正月朔日，風從東方來，發屋，揚沙石，國有大災也。","bh":"","notes":[],"pending":true},{"id":"ls79-7","tags":[],"yw":"正月朔日，風從東南方行，春有死亡。正月朔日，天和溫不風糶賤，民不病；天寒而風，糶貴，民多病。此所謂候歲之風，殘傷人者也。二月丑不風，民多心腹病；三月戌不溫，民多寒熱；四月已不暑，民多癉病；十月申不寒，民多暴死。諸所謂風者，皆發屋，折樹木，揚沙石起毫毛，發腠理者也。","bh":"","notes":[],"pending":true}]},
{"id":"ls80","book":"灵枢","no":80,"title":"大惑论","titleTw":"大惑論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls80-1","tags":[],"yw":"黃帝問於岐伯曰：餘嘗上於清冷之臺，中階而顧，匍匐而前，則惑。餘私異之，竊內怪之，獨瞑獨視，安心定氣，久而不解。獨博獨眩，披發長跪，俛而視之，後久之不已也。卒然自上，何氣使然？岐伯對曰：五髒六腑之精氣，皆上注於目而爲之精。精之窠爲眼，骨之精爲瞳子，筋之精爲黑眼，血之精爲絡，其窠氣之精爲白眼，肌肉之精爲約束，裹擷筋骨血氣之精，而與脈並爲系。上屬於腦，後出於項中。故邪中於項，因逢其身之虛，其入深，則隨眼系以入於腦。","bh":"","notes":[],"pending":true},{"id":"ls80-2","tags":[],"yw":"入於腦則腦轉，腦轉則引目系急。目系急則目眩以轉矣。邪其精，其精所中不相比也，則精散。精散則視歧，視歧見兩物。目者，五髒六腑之精也，營衛魂魄之所常營也，神氣之所生也。故神勞則魂魄散，志意亂。是故瞳子黑眼法於陰，白眼赤脈法於陽也。故陰陽合傳而精明也。目者，心使也。心者，神之舍也，故神精亂而不轉。卒然見非常處精神魂魄，散不相得，故曰惑也。黃帝曰：餘疑其然。餘每之東苑，未曾不惑，去之則復，餘唯獨爲東苑勞神乎？何其異也？岐伯曰：不然也。","bh":"","notes":[],"pending":true},{"id":"ls80-3","tags":[],"yw":"心有所喜，神有所惡，卒然相惑，則精氣亂，視誤，故惑，神移乃復。是故間者爲迷，甚者爲惑。黃帝曰：人之善忘者，何氣使然？岐伯曰：上氣不足，下氣有餘，腸胃實而心肺虛。虛則營衛留於下，久之不以時上，故善忘也。黃帝曰：人之善飢而不嗜食者，何氣使然？岐伯曰：精氣並於脾，熱氣留於胃，胃熱則消谷，谷消故善飢。胃氣逆上，則胃脘寒，故不嗜食也。黃帝曰：病而不得臥者，何氣使然？岐伯曰：衛氣不得入於陰，常留於陽。留於陽則陽氣滿，陽氣滿則陽蹻盛，不得入於陰則陰氣虛，故目不瞑矣。","bh":"","notes":[],"pending":true},{"id":"ls80-4","tags":[],"yw":"黃帝曰：病目而不得視者，何氣使然？岐伯曰：衛氣留於陰，不得行於陽，留於陰則陰氣盛，陰氣盛則陰蹻滿，不得入於陽則陽氣虛，故目閉也。黃帝曰：人之多臥者，何氣使然？岐伯曰：此人腸胃大而皮膚溼，而分肉不解焉。腸胃大則衛氣留久；皮膚溼則分肉不解，其行遲。夫衛氣者，晝日常行於陽，夜行於陰，故陽氣盡則臥，陰氣盡則寤。故腸胃大，則衛氣行留久；皮膚溼，分肉不解，則行遲。留於陰也久，其氣不清，則欲瞑，故多臥矣。其腸胃小，皮膚滑以緩，分肉解利，衛氣之留於陽也久，故少瞑焉。","bh":"","notes":[],"pending":true},{"id":"ls80-5","tags":[],"yw":"黃帝曰：其非常經也，卒然多臥者，何氣使然？岐伯曰：邪氣留於上焦，上焦閉而不通，已食若飲湯，衛氣留久於陰而不行，故卒然多臥焉。黃帝曰：善。治此諸邪，奈何？岐伯曰：先其髒腑，誅其小過，後調其氣，盛者瀉之，虛者補之，必先明知其形志之苦樂，定乃取之。","bh":"","notes":[],"pending":true}]},
{"id":"ls81","book":"灵枢","no":81,"title":"痈疽","titleTw":"癰疽","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls81-1","tags":[],"yw":"黃帝曰：餘聞腸胃受谷，上焦出氣，以溫分肉，而養骨節，通腠理。中焦出氣如露，上注溪谷，而滲孫脈，津液和調，變化而赤爲血。血和則孫脈先滿溢，乃注於絡脈，皆盈，乃注於經脈，陰陽已張，因息乃行。行有經紀，周有道理，與天合同，不得休止。切而調之，從虛去實，瀉則不足，疾則氣減，留則先後。從實去虛，補則有餘，血氣已調，形氣乃持。餘已知血氣之平與不平，未知癰疽之所從生，成敗之時，死生之期，有遠近，何以度之，可得聞乎？岐伯曰：經脈留行不止，與天同度，與地合紀。","bh":"","notes":[],"pending":true},{"id":"ls81-2","tags":[],"yw":"故天宿失度，日月薄蝕；地經失紀，水道流溢，草萓不成，五谷不殖；徑路不通，民不往來，巷聚邑居，則別離異處。血氣猶然，請言其故。夫血脈營衛，周流不休，上應星宿，下應經數。寒邪客於經絡之中，則血泣，血泣則不通，不通則衛氣歸之，不得復反，故癰腫。寒氣化爲熱，熱勝則腐肉，肉腐則爲膿。膿不瀉則爛筋，筋爛則傷骨，骨傷則髓消，不當骨空，不得泄瀉，血枯空虛，則筋骨肌肉不相榮，經脈敗漏，燻於五髒，藏傷故死矣。黃帝曰：願盡聞癰疽之形，與忌曰名。","bh":"","notes":[],"pending":true},{"id":"ls81-3","tags":[],"yw":"岐伯曰：癰發於嗌中，名曰猛疽。猛疽不治，化爲膿，膿不瀉，塞咽，半日死。其化爲膿者，瀉則合豕膏，冷食，三日而已。發於頸，名曰夭疽。其癰大以赤黑，不急治，則熱氣下入淵腋，前傷任脈，內燻肝肺。燻肝肺，十餘日而死矣。陽留大發，消腦留項，名曰腦爍。其色不樂，項痛而如刺以針。煩心者，死不可治。發於肩及臑，名曰疵癰。其狀赤黑，急治之，此令人汗出至足，不害五髒。癰發四五日，逞焫之。發於腋下赤堅者，名曰米疽。治之以砭石，欲細而長，疏砭之，塗以豕膏，六日已，勿裹之。","bh":"","notes":[],"pending":true},{"id":"ls81-4","tags":[],"yw":"其癰堅而不潰者，爲馬刀挾癭，急治之。發於胸，名曰井疽。其狀如大豆，三四日起，不早治，下入腹，不治，七日死矣。發於膺，名曰甘疽。色青，其狀如谷實柧樓，常苦寒熱，急治之，去其寒熱，十歲死，死後出膿。發於脅，名曰敗疵。敗疵者，女子之病也，灸之，其病大癰膿，治之，其中乃有生肉，大如赤小豆，坐陵翹草根各一升，以水一斗六升煮之，竭爲取三升，則強飲厚衣，坐於釜上，令汗出至足已。發於股脛，名曰股脛疽。其狀不甚變，而癰膿搏骨，不急治，三十日死矣。","bh":"","notes":[],"pending":true},{"id":"ls81-5","tags":[],"yw":"發於尻，名曰銳疽。其狀赤堅大，急治之，不治，三十日死矣。發於股陰，名曰赤施。不急治，六十日死。在兩股之內，不治，十日而當死。發於膝，名曰疵癰。其狀大，癰色不變，寒熱，如堅石，勿石，石之者死，須其柔，乃石之者，生。諸癰疽之發於節而相應者，不可治也。發於陽者，百日死；發於陰者，三十日死。發於脛，名曰兔齧，其狀赤至骨，急治之，不治害人也。發於內踝，名曰走緩。其狀癰也，色不變，數石其輸，而止其寒熱，不死。","bh":"","notes":[],"pending":true},{"id":"ls81-6","tags":[],"yw":"發於足上下，名曰四淫。其狀大癰，急治之，百日死。發於足傍，名曰厲癰。其狀不大，初如小指，發，急治之，去其黑者；不消輒益，不治，百日死。發於足趾，名脫癰。其狀赤黑，死不治；不赤黑，不死。不衰，急斬之，不則死矣。黃帝曰：夫子言癰疽，何以別之？岐伯曰：營衛稽留於經脈之中，則血泣而不行，不行則衛氣從之而不通，壅遏而不得行，故熱。大熱不止，熱勝，則肉腐，肉腐則爲膿。然不能陷，骨髓不爲焦枯，五髒不爲傷，故命曰癰。","bh":"","notes":[],"pending":true},{"id":"ls81-7","tags":[],"yw":"黃帝曰：何謂疽？岐伯曰：熱氣淳盛，下陷肌膚，筋髓枯，內連五髒，血氣竭，當其癰下，筋骨良肉皆無餘，故命曰疽。疽者，上之皮夭以堅，上如牛領之皮。癰者，其皮上薄以澤。此其候也。","bh":"","notes":[],"pending":true}]}

  /* ---------- 索引：术语倒排 ---------- */
  const termKeys = Object.keys(NJ_TERMS).sort((a, b) => b.length - a.length);
  const termRe = new RegExp(termKeys.map(esc).join("|"), "g");
  const dict = new Map();                 // term -> [{ch,sec}]
  const chById = new Map();
  const secById = new Map();

  NJ_CHAPTERS.forEach(c => {
    chById.set(c.id, c);
    c.sections.forEach(s => {
      secById.set(s.id, s);
      const seen = new Set();
      (s.yw + "　" + s.bh).replace(termRe, m => { seen.add(m); return m; });
      seen.forEach(t => {
        if (!dict.has(t)) dict.set(t, []);
        dict.get(t).push({ ch: c, sec: s });
      });
    });
  });

  function hl(text) {
    return String(text).replace(termRe, m => `<span class="t" data-t="${m}">${m}</span>`);
  }
  function tagHtml(keys) {
    return (keys || []).map(k => {
      const t = NJ_TAGS[k]; if (!t) return "";
      return `<span class="tg" style="color:${t.color}">${t.name}</span>`;
    }).join("");
  }

  /* ---------- 目录 ---------- */
  let curBook = "素问";

  let tocMode = "book";

  function chapterTagSet(c) {
    const set = new Set(c.tags || []);
    (c.sections || []).forEach(x => (x.tags || []).forEach(t => set.add(t)));
    return set;
  }

  function renderTOC() {
    const toc = $("#toc");
    toc.innerHTML = "";

    const modes = document.createElement("div");
    modes.className = "toc-mode";
    modes.innerHTML = `<button class="tm${tocMode === "book" ? " on" : ""}" data-tm="book">按卷次</button><button class="tm${tocMode === "tag" ? " on" : ""}" data-tm="tag">按体系</button>`;
    modes.querySelectorAll(".tm").forEach(b => { b.onclick = () => { tocMode = b.dataset.tm; renderTOC(); }; });
    toc.appendChild(modes);

    const addItem = c => {
      const d = el("div", "toc-item" + (c.id === state.ch ? " on" : ""),
        `<span class="toc-no">${c.no}</span><span>${c.title}</span>`);
      d.dataset.id = c.id;
      d.onclick = () => openChapter(c.id);
      toc.appendChild(d);
    };

    if (tocMode === "book") {
      ["素问", "灵枢"].forEach(bk => {
        toc.appendChild(el("div", "toc-book", bk));
        NJ_CHAPTERS.filter(c => c.book === bk).sort((x, y) => x.no - y.no).forEach(addItem);
      });
      return;
    }

    const pairs = NJ_CHAPTERS.map(c => [c, chapterTagSet(c)]);
    Object.keys(NJ_TAGS).forEach(k => {
      const list = pairs.filter(x => x[1].has(k)).map(x => x[0]);
      if (!list.length) return;
      const t = NJ_TAGS[k];
      const head = el("div", "toc-book toc-tag", `${t.name}<i>${list.length} 篇</i>`);
      head.style.borderLeftColor = t.color;
      head.style.color = t.color;
      toc.appendChild(head);
      list.sort((x, y) => (x.book === y.book ? x.no - y.no : x.book < y.book ? -1 : 1)).forEach(addItem);
    });
  }

  /* ---------- 主内容 ---------- */
  const state = { ch: NJ_CHAPTERS[0].id, sec: null };

  function openChapter(id, secId) {
    if (window.NJCloseDrawers) window.NJCloseDrawers();   // 手机版 / 窄屏：选中章节后自动收抽屉
    state.ch = id; state.sec = secId || null;
    const c = chById.get(id);
    curBook = c.book;
    renderTOC();
    // 打开章节＝离开所有图表视图（旧写法在 inViz 时不收起覆盖层，导致点「素问」看不到正文）
    inViz = false;
    window.__vizKind = null;
    if (mpState.raf) { cancelAnimationFrame(mpState.raf); mpState.raf = null; }
    $("#viz").classList.remove("on");
    document.body.classList.remove("viz");
    $("#result").style.display = "none";
    $("#wrap").style.display = "flex";

    const wrap = el("div", "inner");
    wrap.appendChild(el("div", "crumb",
      `<b>${c.book}</b> · 第${c.no}篇　/　${c.sections.length}段`));
    const h = el("div", "ch-title", c.title);
    wrap.appendChild(h);
    const bs = NJ_BOOK_SUB[c.book] || NJ_BOOK_SUB["素问"];
    wrap.appendChild(el("div", "ch-sub", `${c.titleTw}　${bs.zhu} · 本篇 ${bs.ben}`));
    if (c.brief) wrap.appendChild(el("div", "ch-brief", c.brief));
    else wrap.appendChild(el("div", "ch-brief pend", "篇旨待补 —— 原文已全本录入，今译／注释分批补齐中"));
    wrap.appendChild(el("div", "ch-tags", tagHtml(c.tags)));
    // 图文互鉴：原本放在小助手面板里的图示入口，改到正文里（按本篇内容定位）
    const tzwj = tzwjHtml(c);
    if (tzwj) wrap.appendChild(el("div", "tzwj", tzwj));

    c.sections.forEach((s, i) => {
      const sec = el("div", "sec");
      sec.id = "sid-" + s.id;
      sec.dataset.sec = s.id;

      const bar = el("div", "sec-bar");
      bar.appendChild(el("span", "sec-no", String(i + 1).padStart(2, "0") + "/" + String(c.sections.length).padStart(2, "0")));
      if (s.tags && s.tags.length) {
        const tw = document.createElement("span");
        tw.style.display = "flex"; tw.style.gap = "6px"; tw.style.flexWrap = "wrap";
        tw.innerHTML = tagHtml(s.tags);
        bar.appendChild(tw);
      }
      if (s.mer) {
        const m = NJ_MERIDIANS.find(x => x.id === s.mer);
        bar.appendChild(el("button", "mini-btn mer", "经络 · " + (m ? m.short : s.mer)))
          .onclick = e => { e.stopPropagation(); openMer(s.mer); };
      }
      if (s.off) {
        bar.appendChild(el("button", "mini-btn off", "十二官 · " + s.off.join("")))
          .onclick = e => { e.stopPropagation(); openOff(s.off[0]); };
      }
      if (s.manip) {
        const mm = NJ_MANIP.find(x => x.id === s.manip);
        bar.appendChild(el("button", "mini-btn man", "手法 · " + (mm ? mm.name : "")))
          .onclick = e => { e.stopPropagation(); openManip(s.manip); };
      }
      sec.appendChild(bar);

      sec.appendChild(el("div", "yw", hl(s.yw)));
      if (s.bh) { sec.appendChild(el("div", "bh", hl(s.bh))); }
      else { sec.appendChild(el("div", "bh pend", "今译待补")); }

      if (s.notes && s.notes.length) {
        const nd = el("div", "notes");
        s.notes.forEach(n => {
          const cls = { "训": "x", "义": "y", "按": "a" }[n.w] || "";
          const row = el("div", "nt");
          row.appendChild(el("span", "nt-w " + cls, n.w));
          row.appendChild(el("span", "", hl(n.t)));
          nd.appendChild(row);
        });
        sec.appendChild(nd);
      }
      wrap.appendChild(sec);
    });

    const inner = $("#inner");
    inner.innerHTML = "";
    inner.appendChild(wrap);
    $("#main").scrollTop = 0;

    if (secId) {
      const t = document.getElementById("sid-" + secId);
      if (t) {
        t.scrollIntoView({ block: "center" });
        t.classList.add("flash");
        setTimeout(() => t.classList.remove("flash"), 1700);
      }
    }
    history.replaceState(null, "", "#" + (secId ? c.id + "/" + secId : c.id));
    setAside(defaultAside(c), "总结");
    if (window.NJMarkNav) window.NJMarkNav();
  }

  function defaultAside(c) {
    return `<div class="card-h">${c.title}</div>
      <div class="card-py">${c.book} 第${c.no}篇</div>
      <div class="card-cat" style="color:var(--gold)">本篇要旨</div>
      <div class="card-def">${hl(c.brief)}</div>
      <div style="margin-top:16px">${tagHtml(c.tags)}</div>`;
  }

  /* ---------- 图文互鉴：本篇 → 本篇真正讲到的那张图 ----------
     显式标记（段上的 mer / off / manip）最优先，其余按正文关键词命中，
     命中不到就不显示该按钮——不做「所有篇都跳同一张图」的兜底。 */
  const NJ_VIZ_KEYS = {
    mer: NJ_MERIDIANS.map(m => ({
      id: m.id, name: m.short || m.full, sub: m.full,
      keys: [m.full, m.short, m.limb + m.yinyang, m.yinyang + m.limb]
    })),
    off: NJ_OFFICIALS.map(o => ({
      id: o.name, name: o.name, sub: o.rank,
      keys: [o.rank, o.name + "者", o.name + "主", o.name + "藏", o.name + "气", o.name]
    })),
    manip: NJ_MANIP.map(x => ({
      id: x.id, name: x.name + "法", sub: x.sub,
      keys: [x.name + "之", x.name + "而", x.name + "其", x.sub, x.name + "法"]
    }))
  };

  function vizHits(c) {
    const secs = c.sections || [];
    const hay = [c.title, c.titleTw, c.brief, (c.tags || []).join(" "),
      secs.map(s => (s.yw || "") + " " + (s.bh || "")).join(" ")].join(" ");
    const cnt = (v) => { let n = 0, i = hay.indexOf(v);
      while (i >= 0) { n++; i = hay.indexOf(v, i + v.length); } return n; };
    const explicit = { mer: [], off: [], manip: [] };
    secs.forEach(s => {
      if (s.mer) explicit.mer.push(s.mer);
      if (s.off && s.off.length) explicit.off = explicit.off.concat(s.off);
      if (s.manip) explicit.manip.push(s.manip);
    });
    const out = {};
    ["mer", "off", "manip"].forEach(kind => {
      out[kind] = NJ_VIZ_KEYS[kind].map(it => {
        let sc = 0;
        it.keys.forEach(k => {
          if (!k) return;
          [k, toTrad(k)].forEach(v => {
            if (!v) return;
            const n = cnt(v);
            if (n) sc += n * (v.length >= 4 ? 14 : v.length === 3 ? 5 : v.length === 2 ? 2 : 0.4);
          });
        });
        const ex = explicit[kind].indexOf(it.id);
        if (ex >= 0) sc += 1000;
        return { it: it, sc: sc, ex: ex < 0 ? 999 : ex };
      }).filter(x => x.sc > 0)
        .sort((a, b) => (a.ex - b.ex) || (b.sc - a.sc));   // 显式标记按文中先后，其余按相关度
    });
    return out;
  }

  function tzwjHtml(c) {
    const h = vizHits(c);
    const take = (kind, min, cap) => h[kind].filter(x => x.sc >= min).slice(0, cap);
    const btn = (kind, id, name, sub) =>
      `<button class="tzwj-bt" data-act="${kind}" data-arg="${id}"><b>${name}</b><em>${sub}</em></button>`;
    const items = []
      .concat(take("mer", 3, 3).map(x => btn("mer", x.it.id, x.it.name, "人体经络图 · " + x.it.sub)))
      .concat(take("off", 3, 4).map(x => btn("off", x.it.id, x.it.name, "十二官 · " + x.it.sub)))
      .concat(take("manip", 6, 2).map(x => btn("manip", x.it.id, x.it.name, "手法演示 · " + x.it.sub)));
    if (!items.length) return "";
    return `<div class="tzwj-h"><span class="tzwj-ic">◍</span>图文互鉴<i>本篇讲到的那几张图</i></div>
      <div class="tzwj-b">${items.join("")}</div>`;
  }

  function setAside(html, title) {
    if (title) $("#aside-title").textContent = title;
    $("#aside-body").innerHTML = html;
  }

  /* 点击术语 / 全局点击委托 */
  document.addEventListener("click", e => {
    const t = e.target.closest(".t");
    if (t) { showTerm(t.dataset.t); return; }
    const l = e.target.closest("[data-act]");
    if (l) {
      const a = l.dataset.act, arg = l.dataset.arg;
      if (a === "mer") openMer(arg || NJ_MERIDIANS[0].id);
      if (a === "off") openOff(arg || "心");
      if (a === "manip") openManip(arg || "an");
      return;
    }
    const o = e.target.closest("[data-open]");
    if (o) {
      const [cid, sid] = o.dataset.open.split("/");
      openChapter(cid, sid || null);
    }
  });

    const d = NJ_TERMS[term]; if (!d) return;
    const catName = { zang: "脏腑", jing: "经络", xue: "腧穴", mai: "脉象", bing: "病证",
      gai: "概念", fa: "治法手法", wu: "五行岁时", shen: "神志", shih: "食养" }[d.cat] || "术语";
    const occ = dict.get(term) || [];
    let html = `<div class="card-h">${term}</div>
      <div class="card-py">${d.py || ""}</div>
      <div class="card-cat">${catName}</div>
      <div class="card-def">${hl(d.def)}</div>`;
    if (occ.length) {
      html += `<div class="mp-h" style="margin-top:16px">本书出现 ${occ.length} 处</div>`;
      occ.slice(0, 12).forEach(o => {
        html += `<div class="occ" data-open="${o.ch.id}/${o.sec.id}">
          <b>${o.ch.book}${o.ch.no}·${o.ch.title}</b>
          ${o.sec.yw.slice(0, 26)}…</div>`;

    if (d.see && chById.get(d.see)) {
      html += `<div class="card-link" data-open="${d.see}">阅读《${chById.get(d.see).title}》 →</div>`;

  function wxRingSVG() {
    const cx = 132, cy = 132, R = 86;
    const ang = i => (-90 + i * 72) * Math.PI / 180;
    const P = NJ_WUXING.map((x, i) =>
      [cx + R * Math.cos(ang(i)), cy + R * Math.sin(ang(i))]);
    const sheng = P.map((a, i) => {
      const b = P[(i + 1) % 5];
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const ox = mx - cx, oy = my - cy, L = Math.hypot(ox, oy) || 1;
      return `<path d="M${a[0].toFixed(1)},${a[1].toFixed(1)} Q${(mx + ox / L * 30).toFixed(1)},${(my + oy / L * 30).toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}" fill="none" stroke="#3f7a2e" stroke-width="1.2" opacity=".75" marker-end="url(#wxa-s)"/>`;
    }).join("");
    const ke = P.map((a, i) => {
      const b = P[(i + 2) % 5], t = 0.84;
      return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${(a[0] + (b[0] - a[0]) * t).toFixed(1)}" y2="${(a[1] + (b[1] - a[1]) * t).toFixed(1)}" stroke="#b02d18" stroke-width="1" stroke-dasharray="4 3" opacity=".5" marker-end="url(#wxa-k)"/>`;
    }).join("");
    const nodes = NJ_WUXING.map((w, i) => {
      const on = w.id === wxState.cur;
      return `<g class="wx-node" data-wx="${w.id}"><circle cx="${P[i][0].toFixed(1)}" cy="${P[i][1].toFixed(1)}" r="${on ? 25 : 21}" fill="${on ? w.color : njVar("--node-bg", "#f7efd8")}" stroke="${w.color}" stroke-width="${on ? 2 : 1}"/><text x="${P[i][0].toFixed(1)}" y="${(P[i][1] + 6).toFixed(1)}" text-anchor="middle" font-size="${on ? 19 : 17}" fill="${on ? "#fdf4dc" : w.color}" font-family="var(--serif)">${w.name}</text></g>`;
    }).join("");
    return `<svg viewBox="0 0 264 264" width="100%" style="max-width:264px;display:block">
      <defs>
        <marker id="wxa-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#3f7a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
        <marker id="wxa-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#b02d18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
      </defs>
      ${sheng}${ke}${nodes}
      <text x="132" y="126" text-anchor="middle" font-size="11" fill="${njVar("--ink3", "#9c9282")}" font-family="var(--sans)">外弧　相生</text>
      <text x="132" y="142" text-anchor="middle" font-size="11" fill="${njVar("--ink3", "#9c9282")}" font-family="var(--sans)">内线　相克</text>
    </svg>`;
  }

            <div class="wx-drow"><em>跳转</em><div class="wx-jump">

            </div></div>

    $("#viz").querySelectorAll("[data-wx]").forEach(b => {

    $("#viz").querySelectorAll("[data-wxact]").forEach(b => {

      b.onclick = () => { exitViz(); openChapter(b.dataset.wxopen); };

    $("#viz-close").onclick = exitViz;

  /* ---------- 十二官 ---------- */
  function openOff(name) {
    offState.cur = name || "心";
    renderViz("off");
  }
  const offState = { cur: "心" };

  function renderVizOff() {
    const cx = 280, cy = 250, rx = 216, ry = 168;
    const others = NJ_OFFICIALS.filter(o => o.name !== "心");
    const wx = { 木: "#3f7a2e", 火: "#b02d18", 土: "#96650c", 金: "#5c6a86", 水: "#33409e" };

    const offPos = { 心: [cx, cy] };
    const nodes = others.map((o, i) => {
      const a = (-Math.PI / 2) + (i / others.length) * Math.PI * 2;
      const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
      offPos[o.name] = [x, y];
      const col = wx[o.wuxing] || "#6c6450";
      const on = o.name === offState.cur;
      return `<g class="off-node" data-o="${o.name}">
        <line class="off-line" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"
          stroke="${on ? col : njVar("--line2", "#a89272")}" stroke-width="${on ? 2 : 1}"/>
        <circle class="off-c" cx="${x}" cy="${y}" r="30" fill="${on ? col : njVar("--node-bg", "#f7efd8")}"
          stroke="${col}" stroke-width="${on ? 2.5 : 1.4}"/>
        <text class="off-nm" x="${x}" y="${y - 5}" ${on ? "" : 'fill="' + col + '"'}
          style="fill:${on ? "#fdf4dc" : col}">${o.name}</text>
        <text class="off-nm" x="${x}" y="${y + 10}" style="font-size:9px;fill:${on ? "#fdf4dc" : col}">${o.i}</text>
        <text class="off-rk" x="${x}" y="${y + 44}">${o.rank}</text>
      </g>`;
    }).join("");

    const cur = NJ_OFFICIALS.find(o => o.name === offState.cur) || NJ_OFFICIALS[0];
    const centerColor = wx["火"];

    // —— 生克传变：四条通路（绿＝生克相及，红＝乘侮）
    const cbWx = NJ_WUXING.find(x => x.name === cur.wuxing) || NJ_WUXING[0];
    const cbMe = NJ_ZANG5[cur.wuxing];
    const cbZ = { 母: NJ_ZANG5[cbWx.shengwo], 子: NJ_ZANG5[cbWx.sheng],

  function startManipAnim(m) {
    if (mpState.raf) cancelAnimationFrame(mpState.raf);
    const hand = $("#hand"), press = $("#press"), curve = $("#curve"), fb = $("#forcebar");
    const pts = [];
    mpState.speed = m.speed; mpState.amp = m.amp;
    const sp = $("#sp"), am = $("#am");
    sp.oninput = () => { mpState.speed = sp.value / 100; $("#spv").textContent = mpState.speed.toFixed(2) + "×"; };
    am.oninput = () => { mpState.amp = am.value / 100; $("#amv").textContent = mpState.amp.toFixed(2) + "×"; };
    $("#mp-toggle").onclick = e => {
      mpState.run = !mpState.run;
      e.target.textContent = mpState.run ? "暂停" : "继续";
    };

    const baseX = 240, baseY = 236;
    const loop = () => {
      if (mpState.run) mpState.t += 0.016 * mpState.speed;
      const t = mpState.t, A = mpState.amp;
      let x = baseX, y = baseY, force = 0, rot = 0;
      if (m.mode === "press") {
        y = baseY + Math.sin(t * 3) * 26 * A;
        force = Math.max(0, (Math.sin(t * 3) + 1) / 2) * A;
      } else if (m.mode === "line") {
        x = baseX + Math.sin(t * 2.2) * 130 * A;
        const yy = Math.cos(t * 2.2);
        y = baseY - 6 + (1 - yy) * 3;
        force = 0.45 * A;
      } else {
        x = baseX + Math.cos(t * 2.6) * 46 * A;
        y = baseY + Math.sin(t * 2.6) * 18 * A - 2;
        force = 0.6 * A;
        rot = Math.sin(t * 2.6) * 12;
      }
      hand.setAttribute("transform", `translate(${x},${y}) rotate(${rot})`);
      press.setAttribute("cx", x);
      press.setAttribute("cy", y + 18);
      press.setAttribute("rx", 24 + force * 46);
      press.setAttribute("ry", 10 + force * 20);
      press.setAttribute("opacity", 0.06 + force * 0.18);

      pts.push(force);
      if (pts.length > 150) pts.shift();
      const n = pts.length;
      const str = pts.map((v, i) => {
        const px = 310 + (i / 149) * 150;
        const py = 92 - v * 44;
        return px.toFixed(1) + "," + py.toFixed(1);
      }).join(" ");
      curve.setAttribute("points", str);
      fb.textContent = force.toFixed(2);
      mpState.raf = requestAnimationFrame(loop);
    };
    loop();
  }

  /* ---------- 搜索 ---------- */
  // 简体输入 → 繁体归一（映射表由构建期生成），繁体原文也能命中
  function toTrad(s) {
    if (!window.NJ_S2T) return s;
    let out = "";
    for (const ch of s) out += (window.NJ_S2T[ch] || ch);
    return out;
  }
  function doSearch(q) {
    q = q.trim();
    if (!q) return;
    if (window.NJCloseDrawers) window.NJCloseDrawers();
    const res = [];
    NJ_CHAPTERS.forEach(c => {
      const hitTitle = c.title.indexOf(q) >= 0 || c.book.indexOf(q) >= 0 ||
        c.titleTw.indexOf(toTrad(q)) >= 0;
      if (hitTitle) res.push({ c, s: null, txt: c.brief, why: "篇目" });
      c.sections.forEach(s => {
        if (s.yw.indexOf(q) >= 0 || s.yw.indexOf(toTrad(q)) >= 0)
          res.push({ c, s, txt: s.yw, yw: 1 });
        else if (s.bh.indexOf(q) >= 0) res.push({ c, s, txt: s.bh, why: "翻译" });
        else if ((s.notes || []).some(n => n.t.indexOf(q) >= 0))
          res.push({ c, s, txt: s.yw, why: "注" });
      });
    });
    const qv = toTrad(q);
    const pat = qv && qv !== q ? esc(q) + "|" + esc(qv) : esc(q);
    const marked = () => t => t.replace(new RegExp(pat, "g"), m => `<em>${m}</em>`);
    const mk = marked();
    const box = $("#result");
    box.innerHTML = `<div class="viz-head"><h2>检索「${q}」</h2>
      <p>命中 ${res.length} 条</p><div style="flex:1"></div>
      <button class="tool-btn" id="viz-close2">返回阅读</button></div>`;
    if (!res.length) {
      box.innerHTML += `<div style="padding:26px 30px"><div class="empty">
        未命中。收录范围为本节选十篇。<br>可试试：陽氣、按之、天癸、味過於鹹、十二官……</div></div>`;
    }
    res.slice(0, 60).forEach(r => {
      const hits = [r.txt.indexOf(q), qv !== q ? r.txt.indexOf(qv) : -1].filter(i => i >= 0);
      const idx = hits.length ? Math.max(0, Math.min(...hits) - 16) : 0;
      const snip = mk(r.txt.slice(idx, idx + 60));
      const d = el("div", "rs",
        `<h4>${r.c.book}·${r.c.title}${r.why ? "　<span style='font-size:12px;color:var(--ink3);font-weight:400'>"
          + r.why + "</span>" : ""}</h4><p>…${snip}…</p>`);
      d.onclick = () => openChapter(r.c.id, r.s ? r.s.id : null);
      box.appendChild(d);
    });
    $("#viz").classList.remove("on");
    document.body.classList.remove("viz");
    $("#wrap").style.display = "none";
    box.style.display = "block";
    $("#viz-close2").onclick = exitViz;
  }

  /* ---------- 工具开关 ---------- */
  function bindTools() {
    const t = (sel, cls, inv) => {
      const b = $(sel);
      if (!b) return;
      b.onclick = () => {
        document.body.classList.toggle(cls);
        let on = document.body.classList.contains(cls);
        if (inv) on = !on;
        b.classList.toggle("on", on);
      };
    };
    t("#btn-bh", "hide-bh", true);
    t("#btn-note", "hide-note", true);
    $("#btn-bh").classList.add("on");
    $("#btn-note").classList.add("on");

    let fs = 19;
    $("#btn-aa").onclick = () => {
      fs = fs >= 24 ? 16 : fs + 2;
      document.documentElement.style.setProperty("--fs", fs + "px");
    };
    let wm = 1;
    $("#btn-width").onclick = () => {
      document.body.classList.remove("w-wide", "w-mid", "w-nar");
      wm = (wm + 1) % 3;
      document.body.classList.add(["w-wide", "w-mid", "w-nar"][wm]);
    };
    document.body.classList.add("w-mid");

    /* 目录 / 总结：手机版与电脑版窄窗走抽屉，宽屏电脑版走显隐 */
    const drawerMode = () =>
      document.documentElement.classList.contains("mode-mobile") ||
      document.documentElement.classList.contains("mode-narrow") ||
      document.documentElement.classList.contains("mode-narrow2");
    $("#btn-toc").onclick = () => { drawerMode() ? window.NJDrawer("side") : document.body.classList.toggle("hide-toc"); };
    $("#toc-handle").onclick = () => { drawerMode() ? window.NJDrawer("side") : document.body.classList.toggle("hide-toc"); };
    $("#btn-aside").onclick = () => { drawerMode() ? window.NJDrawer("ai") : document.body.classList.toggle("hide-aside"); };
    $("#aside-close").onclick = () => { drawerMode() ? window.NJDrawer("ai", false) : document.body.classList.add("hide-aside"); };

    /* 全屏：进入后按钮变为「退出全屏」，兼容 webkit 前缀（iPad Safari） */
    const fullBtn = $("#btn-full");
    const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
    const syncFull = () => {
      const on = !!fsEl();
      fullBtn.textContent = on ? "退出全屏" : "全屏";
      fullBtn.classList.toggle("on", on);
    };
    fullBtn.onclick = () => {
      try {
        if (!fsEl()) {
          const el = document.documentElement;
          (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
      } catch (e) {}
    };
    ["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, syncFull));

    // 日间 / 夜间：写 localStorage，切换后重绘当前视图以刷新 SVG 底色
    const themeBtn = $("#btn-theme");
    function applyTheme(night) {
      document.body.classList.toggle("night", !!night);
      themeBtn.textContent = night ? "日间" : "夜间";
      themeBtn.classList.toggle("on", !!night);
      try { localStorage.setItem("nj-theme", night ? "night" : "day"); } catch (e) {}
    }
    let nightMode = false;
    try { nightMode = localStorage.getItem("nj-theme") === "night"; } catch (e) {}
    applyTheme(nightMode);
    themeBtn.onclick = () => {
      nightMode = !nightMode;
      applyTheme(nightMode);
      if (inViz) renderViz(window.__vizKind || "mer");
    };

    // 输入即检索（200ms 防抖），回车立即检索并取消待执行的防抖
    let njQTimer = null;
    const njSearch = v => { clearTimeout(njQTimer); njQTimer = setTimeout(() => doSearch(v), 200); };
    $("#q").oninput = e => njSearch(e.target.value);
    $("#q").onkeydown = e => { if (e.key === "Enter") { clearTimeout(njQTimer); doSearch($("#q").value); } };
    $("#q").addEventListener("change", e => doSearch(e.target.value));

    // 顶栏导航统一绑定（避免新增视图时漏绑导致按钮无反应）
    const firstOf = bk => (NJ_CHAPTERS.find(c => c.book === bk) || {}).id;
    const NAVMAP = {
      "nav-sw": () => openChapter(firstOf("素问")),
      "nav-ls": () => openChapter(firstOf("灵枢")),
      "nav-wx": () => openWuxing("mu"),
      "nav-mer": () => openMer("lu"),
      "nav-off": () => openOff("心"),
      "nav-yq": () => renderViz("yq"),
      "nav-manip": () => openManip("an")
    };
    Object.keys(NAVMAP).forEach(id => {
      const b = document.getElementById(id);
      if (b) b.onclick = NAVMAP[id];
    });
  }

  /* ---------- 路由 ---------- */
  function route() {
    const h = location.hash.replace(/^#/, "");
    if (!h) { openChapter(state.ch); return; }
    const p = h.split("/");
    if (p[0] === "viz") { renderViz(p[1] || "mer"); return; }
    if (p[0] === "s") { doSearch(decodeURIComponent(p[1] || "")); return; }
    if (p[0] === "off") { openOff(decodeURIComponent(p[1] || "心")); return; }
    if (chById.get(p[0])) openChapter(p[0], p[1] || null);
    else openChapter(state.ch);
  }

  window.addEventListener("hashchange", route);

  /* ---------- 对外接口（顶栏按钮用） ---------- */
  window.NJAPI = {
    openChapter, openMer, openOff, openManip, openWuxing, renderViz, exitViz, doSearch, vizHits,
    chapters: NJ_CHAPTERS
  };

  /* ---------- 顶栏高亮 ---------- */
  function markNav() {
    document.querySelectorAll(".navbtn").forEach(b => b.classList.remove("on"));
    if (inViz) {
      const map = { wx: "nav-wx", mer: "nav-mer", off: "nav-off", yq: "nav-yq", manip: "nav-manip" };
      const id = map[window.__vizKind];
      if (id && document.getElementById(id)) document.getElementById(id).classList.add("on");
      return;
    }
    const c = chById.get(state.ch);
    if (c) {
      const id = c.book === "素问" ? "nav-sw" : "nav-ls";
      const b = document.getElementById(id);
      if (b) b.classList.add("on");
    }
  }
  window.NJMarkNav = markNav;

  /* ---------- 启动 ---------- */
  renderTOC();
  bindTools();
  route();
  markNav();
})();

/* ============================================================
   简体 / 繁体 切换（DOM 层，不改底本数据）
   ============================================================ */
(function () {
  "use strict";

  function buildDict(K, V, PK, PV) {
    const m = new Map();
    const a = Array.from(K), b = Array.from(V);
    for (let i = 0; i < a.length; i++) m.set(a[i], b[i]);
    const ka = PK.split("|"), va = PV.split("|");
    for (let i = 0; i < ka.length; i++) if (ka[i]) m.set(ka[i], va[i]);
    return m;
  }
  const S2T = buildDict(window.NJ_S2T_K, window.NJ_S2T_V, window.NJ_S2T_PK, window.NJ_S2T_PV);
  const T2S = buildDict(window.NJ_T2S_K, window.NJ_T2S_V, window.NJ_T2S_PK, window.NJ_T2S_PV);
  const MAXLEN = 3;

  function conv(str, m) {
    if (!str) return str;
    let out = "", i = 0;
    while (i < str.length) {
      let hit = false;
      for (let L = Math.min(MAXLEN, str.length - i); L > 0; L--) {
        const v = m.get(str.substr(i, L));
        if (v !== undefined && v !== str.substr(i, L)) { out += v; i += L; hit = true; break; }
      }
      if (!hit) { out += str[i]; i++; }
    }
    return out;
  }
  const toScript = t => script === "hant" ? conv(t, S2T) : conv(t, T2S);

  let script = "hant";
  try {
    const saved = localStorage.getItem("nj-script");
    if (saved === "hans" || saved === "hant") script = saved;
  } catch (e) {}

  const SKIP = { SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEXTAREA: 1 };
  /* 版本选择界面固定简体：#mgate 首选项，不随全站字形切换 */
  const MODE_UI = "#mgate, #modeSwitch";
  function inModeUI(node) {
    let el = null;
    if (node.nodeType === 1) el = node;
    else if (node.parentNode && node.parentNode.nodeType === 1) el = node.parentNode;
    return !!(el && el.closest && el.closest(MODE_UI));
  }
  const orig = new WeakMap();          // 文本节点 -> 原始文本（避免来回切换累积失真）
  const attrOrig = new WeakMap();      // 元素 -> { attr: 原始值 }
  let applying = false;

  function convertNode(node) {
    if (!orig.has(node)) orig.set(node, node.nodeValue);
    const want = toScript(orig.get(node));
    if (node.nodeValue !== want) node.nodeValue = want;
  }
  const ATTRS = ["placeholder", "title", "aria-label"];
  function convertAttrs(el) {
    if (!el || el.nodeType !== 1 || !el.hasAttribute) return;
    if (inModeUI(el)) return;
    let cache = attrOrig.get(el);
    if (!cache) { cache = {}; attrOrig.set(el, cache); }
    ATTRS.forEach(a => {
      if (!el.hasAttribute(a)) return;
      if (cache[a] === undefined) cache[a] = el.getAttribute(a);
      const want = toScript(cache[a]);
      if (want !== el.getAttribute(a)) el.setAttribute(a, want);
    });
  }
  function walk(root) {
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const list = [];
    let n;
    while ((n = tw.nextNode())) {
      const p = n.parentNode;
      if (!p || SKIP[p.nodeName]) continue;
      if (!n.nodeValue || !n.nodeValue.trim()) continue;
      if (inModeUI(n)) continue;
      list.push(n);
    }
    list.forEach(convertNode);
  }
  function applyAll() {
    applying = true;
    try {
      walk(document.body);
      document.querySelectorAll("[placeholder],[title],[aria-label]").forEach(convertAttrs);
    } finally { applying = false; }
  }

  /* 单键切换：按钮文字 = 点击后要切到的字形（当前简体时显示「繁体」） */
  const bSc = document.getElementById("btn-script");
  function labelNode() {
    return (bSc && bSc.firstChild && bSc.firstChild.nodeType === 3) ? bSc.firstChild : null;
  }
  function paint() {
    const n = labelNode();
    if (!n) return;
    const label = script === "hant" ? "简体" : "繁体";
    orig.set(n, label);              // 记为原文，整体转换时不再覆盖按钮标签
    n.nodeValue = toScript(label);
  }
  function setScript(v) {
    if (v === script) return;
    script = v;
    try { localStorage.setItem("nj-script", v); } catch (e) {}
    paint();                         // 先换按钮文字，再整体转换
    applyAll();
  }
  if (bSc) bSc.onclick = () => setScript(script === "hant" ? "hans" : "hant");

  paint();
  applyAll();

  // 后续动态渲染（目录 / 正文 / 图谱 / 助手 / 检索结果）自动跟随当前字形
  if (window.MutationObserver) {
    const mo = new MutationObserver(muts => {
      if (applying) return;
      applying = true;
      try {
        muts.forEach(m => {
          if (m.type !== "childList") return;
          m.addedNodes.forEach(node => {
            if (inModeUI(node)) return;
            if (node.nodeType === 1) { convertAttrs(node); walk(node); }
            else if (node.nodeType === 3) {
              const p = node.parentNode;
              if (p && !SKIP[p.nodeName] && node.nodeValue && node.nodeValue.trim()) convertNode(node);
            }
          });
        });
      } finally { applying = false; }
    });
    mo.observe(document.body, { childList: true, subtree: true });
  }
  window.NJSetScript = setScript;
})();

</script>
