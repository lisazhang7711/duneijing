{"id":"ls03","book":"灵枢","no":3,"title":"小针解","titleTw":"小針解","tags":["ci","zhenfa","bingji"],"brief":"逐句注解《九针十二原》中的针法要语，辨析守神守机、迎随补泻、虚实徐疾及误刺之害。","pending":false,"sections":[{"id":"ls03-1","tags":[],"yw":"所謂易陳者，易言也。難入者，難着於人也。粗守形者，守刺法也。上守神者，守人之血氣有餘不足可補瀉也。神客者，正邪共會也。神者，正氣也，客者邪氣也。在門者，邪循正氣之所出入也。未睹其疾者，先知邪正何經之疾也。惡知其原者，先知何經之病所取之處也。刺之微在數遲者，徐疾之意也。粗守關者，守四支而不知血氣正邪之往來也。上守機者，知守氣也。機之動不離其空中者，知氣之虛實，用針之徐疾也。空中之機，清靜以微者，針以得氣，密意守氣勿失也。","bh":"所说的易陈，是容易言说。难入，是难以著于人（落实到人身上）。粗守形，是守著刺法（针刺的法度）。上守神，是守护人之血气的有余不足而可补可泻。神客，是正气与邪气共会（相会）。神是正气，客是邪气。在门，是邪气循著正气出入的门户（而侵入）。未睹其疾，是说先要知道邪正在哪一经的疾病。恶知其原，是说先要知道哪一经的病与所取之处。刺之微在数（速）迟，是说徐疾（快慢）之意。粗守关，是守著四肢（关节）而不知血气正邪的往来。上守机，是知道守气。机之动不离其空中，是说知道气的虚实，用针的徐疾。空中之机，清静以微，是说针已得气，要专心（密意）守气而勿失。","notes":[],"pending":false},{"id":"ls03-2","tags":[],"yw":"其來不可逢者，氣盛不可補也。其往不可追者，氣虛不可瀉也。不可掛以發者，言氣易失也。扣之不發者，言不知補瀉之意也。血氣已盡而氣不下也。知其往來者，知氣之逆順盛虛也。要與之期者，知氣之可取之時也。粗之闇者，冥冥不知氣之微密也。妙哉！工獨有之者，盡知針意也。往者爲逆者，言氣之虛而小，小者逆也。來者爲順者，言形氣之平，平者順也。明知逆順正行無問者，言知所取之處也。迎而奪之者，瀉也；追而濟之者，補也。所謂虛則實之者，氣口虛而當補之也。","bh":"其来不可逢，是说气盛时不可补。其往不可追，是说气虚时不可泻。不可挂以发，是说气容易丧失。扣之不发，是说不知补泻之意，血气已尽而气不下（不至）。知其往来，是说知道气的逆顺盛虚。要与之期，是知道气可取之时。粗之暗（暗），是昏昧不知气的微密。妙哉！工独有之，是说（上工）尽知针意。往者为逆，是说气虚而脉小，小者为逆。来者为顺，是说形气平（和平），平者为顺。明知逆顺、正行无问，是说知道所取之处。迎而夺之，是泻法；追而济之，是补法。所说的虚则实之，是气口（寸口）虚而当补之。","notes":[],"pending":false},{"id":"ls03-3","tags":[],"yw":"滿則泄之者，氣口盛而當瀉之也。宛陳則除之者，去血脈也。邪勝則虛之者，言諸經有盛者，皆瀉其邪也。徐而疾則實者，言徐內而疾出也。疾而徐則虛者，言疾內而徐出也。言實與虛若有若無者，言實者有氣，虛者無氣也。察後與先若亡若存者，言氣之虛實，補瀉之先後也，察其氣之已下與常存也。爲虛爲實，若得若失者，言補者佖然若有得也，瀉則恍然若有失也。夫氣之在脈也，邪氣在上者，言邪氣之中人也高，故邪氣在上也。濁氣在中者，言水谷皆入於胃，其精氣上注於肺，濁溜於腸胃，言寒溫不適，飲食不節，而病生於腸胃，故命曰濁氣在中也。","bh":"满则泄之，是气口盛而当泻之。宛陈则除之，是除去血脉（中的瘀积）。邪胜则虚之，是说诸经有盛（邪盛）的，都泻其邪。徐而疾则实，是说徐进针而疾出针。疾而徐则虚，是说疾进针而徐出针。言实与虚、若有若无，是说实者有气，虚者无气。察后与先、若亡若存，是说气的虚实与补泻的先后，要审察其气已下（至）与是否常存。为虚为实、若得若失，是说补者佖然（充实满足）若有所得，泻则恍然（怅然）若有所失。那气之在脉，邪气在上，是说邪气中人在上（高处），所以邪气在上。浊气在中，是说水谷都入于胃，其精气上注于肺，浊气溜于肠胃；若寒温不适、饮食不节，而病生于肠胃，所以命名为浊气在中。","notes":[],"pending":false},{"id":"ls03-4","tags":[],"yw":"清氣在下者，言清溼地氣之中人也，必從足始，故曰清氣在下也。針陷脈，則邪氣出者取之上，針中脈則濁氣出者，取之陽明合也。針太深則邪氣反沉者，言淺浮之病，不欲深刺也。深則邪氣從之入，故曰反沉也。皮肉筋脈各有所處者，言經絡各有所主也。取五脈者死，言病在中氣不足，但用針盡大瀉其諸陰之脈也。取三陽之脈者，唯言盡瀉三陽之氣，令病人恇然不復也。奪陰者死，言取尺之五裏五往者也。奪陽者狂，正言也。睹其色，察其目，知其散復，一其形，聽其動靜者，言上工知相五色於目。","bh":"清气在下，是说清湿（清冷潮湿）的地气中于人，必定从足开始，所以说清气在下。针陷脉则邪气出，是取之于上（上部）；针中脉则浊气出，是取之于阳明之合（足三里）。针太深则邪气反沉，是说浅浮（病位浅）之病，不欲深刺，深刺则邪气随之而入，所以叫反沉。皮肉筋脉各有所处，是说经络各有所主。取五脉者死，是说病在中而气不足，却用针尽大泻其诸阴之脉。取三阳之脉者（取三脉者恇），是说尽泻三阳之气，令病人恇然（怯弱）而不能恢复。夺阴者死，是说取尺之五里（手阳明五里穴）五往（五次）者。夺阳者狂，是正论（确论）。睹其色、察其目、知其散复、一其形、听其动静，是说上工懂得在目上观察五色（的变化）。","notes":[],"pending":false},{"id":"ls03-5","tags":[],"yw":"有知調尺寸小大緩急滑澀以言所病也。知其邪正者，知論虛邪與正邪之風也。右主推之，左持而御之者，言持針而出入也。氣至而去之者，言補瀉氣調而去之也。調氣在於終始一者，持心也。節之交三百六十五會者，絡脈之滲灌諸節者也。所謂五髒之氣，已絕於內者，脈口氣內絕不至，反取其外之病處，與陽經之合，有留針以致陽氣，陽氣至則內重竭，重竭則死矣。其死也，無氣以動，故靜。所謂五髒之氣，已絕於外者，脈口氣外絕不至，反取其四末之輸，有留針以致其陰氣，陰氣至則陽氣反入，入則逆，逆則死矣。","bh":"又知道诊察尺（尺肤）与寸口脉象的小、大、缓、急、滑、涩，以说明所患之病。知其邪正，是说懂得区别虚邪（虚风）与正邪（正风）之风。右主推之、左持而御之，是说持针而使（针）出入。气至而去之，是说补泻使气调和而后出针。调气在于终始如一，是说要持心（专心）。节之交三百六十五会，是说络脉之渗灌（灌注）诸节。所说的五脏之气已绝于内，是指脉口（寸口）之气内绝而不至，反取其在外的病处与阳经之合，有留针以招致阳气，阳气至则内（阴）重竭，重竭则死。其死时，无气以动（无力气而动），所以安静。所说的五脏之气已绝于外，是指脉口之气外绝而不至，反取其四末（四肢末端）之输，有留针以招致其阴气，阴气至则阳气反入，入则逆，逆则死。","notes":[],"pending":false},{"id":"ls03-6","tags":[],"yw":"其死也，陰氣有餘，故躁。所以察其目者，五髒使五色循明。循明則聲章。聲章者，則言聲與平生異也。","bh":"其死时，阴气有余，所以躁扰。之所以要察其目，是因为五脏使五色循明（显现明润于目）；循明则声章（声音彰明）。声章，是说（病人的）声音与平时不同。","notes":[],"pending":false}]},
{"id":"ls04","book":"灵枢","no":4,"title":"邪气藏府病形","titleTw":"邪氣藏府病形","tags":["jingluo","zhenfa","bingji"],"brief":"论邪气中人的部位与途径、色脉尺肤相应之诊，以及五脏六腑病形与六变脉象的刺法取穴。","pending":false,"sections":[{"id":"ls04-1","tags":[],"yw":"黃帝問於岐伯曰：邪氣之中人也奈何？岐伯答曰：邪氣之中人高也。黃帝曰：高下有度乎？岐伯曰：身半以上者，邪中之也。身半已下者，溼中之也。故曰：邪之中人也。無有常，中於陰則溜於腑，中於陽則溜於經。黃帝曰：陰之與陽也，異名同類，上下相會，經絡之相貫，如環無端。邪之中人，或中於陰，或中於陽，上下左右，無有恆常，其故何也？岐伯曰：諸陽之會，皆在於面。中人也，方乘虛時及新用力，若飲食汗出，腠理開而中於邪。中於面，則下陽明。","bh":"黄帝问岐伯说：邪气中于人是怎样的？岐伯回答说：邪气中于人，多在人体的高处（上部）。黄帝说：高下有度数吗？岐伯说：身半以上的，是邪（风邪）中之；身半以下的，是湿中之。所以说：邪之中于人，没有常规；中于阴则溜（流注）于腑，中于阳则溜于经。黄帝说：阴之与阳，异名而同类，上下相会，经络之相贯，如环无端。邪之中人，或中于阴，或中于阳，上下左右，没有固定不变之处，这是什么缘故？岐伯说：诸阳之会都在于面部。邪之中人，往往乘著（人体）正气虚的时候，以及刚用力（劳作）之后，或者饮食汗出、腠理开泄之时，而中于邪。中于面，则（邪气）下走阳明（经）。","notes":[],"pending":false},{"id":"ls04-2","tags":[],"yw":"中於項，則下太陽。中於頰，則下少陽。其中於膺背兩脅，亦中其經。黃帝曰：其中於陰，奈何？岐伯答曰：中於陰者，常從臂胻始。夫臂與胻，其陰皮薄，其肉淖澤，故俱受於風，獨傷其陰。黃帝曰：此故傷其藏乎？岐伯答曰：身之中於風也，不必動藏。故邪入於陰經，則其藏氣實，邪氣入而不能客，故還之於腑。故中陽則溜於經，中陰則溜於府。黃帝曰：邪之中人髒奈何？岐伯曰：愁憂恐懼則傷心。形寒寒飲則傷肺，以其兩寒相感，中外皆傷，故氣逆而上行。","bh":"中于项（后颈），则下走太阳。中于颊，则下走少阳。其中于膺（胸）、背、两胁的，也各中其（相应的）经。黄帝说：其中于阴，是怎样的？岐伯回答说：中于阴的，常从臂与胻（小腿）开始。臂与胻的阴面皮薄，其肉淖泽（柔润），所以（臂与胻）都受于风，唯独伤其阴（内侧阴分）。黄帝说：这样就会伤其脏吗？岐伯回答说：身之中于风，不一定动（触动）脏。所以邪入于阴经，若其脏气实，邪气入而不能客（留居），所以还之于腑。因此中阳则溜于经，中阴则溜于腑。黄帝说：邪之中人（五）脏是怎样的？岐伯说：愁忧恐惧则伤心。形寒（外受寒）与寒饮（内饮冷）则伤肺，因为两种寒（内外之寒）相感应，中外皆伤，所以气逆而上行。","notes":[],"pending":false},{"id":"ls04-3","tags":[],"yw":"有所墮墜，惡血留內；若有所大怒，氣上而不下，積於脅下，則傷肝。有所擊僕，若醉入房，汗出當風，則傷脾。有所用力舉重，若入房過度，汗出浴水，則傷腎。黃帝曰：五髒之中風，奈何？岐伯曰：陰陽俱感，邪乃得往。黃帝曰：善哉。黃帝問於岐伯曰：首面與身形也，屬骨連筋，同血合於氣耳。天寒則裂地凌冰，其卒寒，或手足懈惰，然而其面不衣，何也？岐伯答曰：十二經脈，三百六十五絡，其血氣皆上於面而走空竅。其精陽氣上走於目而爲睛。","bh":"有所堕坠（从高处跌坠），恶血留于内；若有所大怒，气上而不下，积于胁下，则伤肝。有所击仆（被击倒），或醉酒入房，汗出当风，则伤脾。有所用力举重，或入房过度，汗出而浴于水，则伤肾。黄帝说：五脏之中风，是怎样的？岐伯说：阴阳俱感（内外俱虚而感邪），邪气才能得以（深入）往（入）。黄帝说：讲得好。黄帝问岐伯说：头面与身形，连属于骨、连于筋，同是血与气相合（而成）。天寒则地裂、水结冰；其猝然寒冷时，有的人手足懈惰（麻木迟缓），然而面部不用穿衣（也不觉冷），这是为什么？岐伯回答说：十二经脉、三百六十五络，其血气都上行于面而走于空窍（孔窍）。其精阳之气上走于目而为睛（视觉）。","notes":[],"pending":false},{"id":"ls04-4","tags":[],"yw":"其別氣走於耳而爲聽。其宗氣上出於鼻而爲臭。其濁氣出於胃，走脣舌而爲味。其氣之津液，皆上燻於面，而皮又厚，其肉堅，故天氣甚寒，不能勝之也。黃帝曰：邪之中人，其病形何如？岐伯曰：虛邪之中身也，灑淅動形。正邪之中人也，微，先見於色，不知於身，若有若無，若亡若存，有形無形，莫知其情。黃帝曰：善哉。黃帝問於岐伯曰：餘聞之，見其色，知其病，命曰明。按其脈，知其病，命曰神。問其病，知其處，命曰工。餘願聞見而知之，按而得之，問而極之，爲之奈何？岐伯答曰：夫色脈與尺之相應也，如桴鼓影響之相應也，不得相失也，此亦本末根葉之出候也，故根死則葉枯矣。","bh":"其别气（旁行之气）走于耳而为听（听觉）。其宗气上出于鼻而为臭（嗅觉）。其浊气出于胃，走唇舌而为味（味觉）。其气之津液都上熏于面，而（面部）皮又厚、其肉坚，所以天气（寒气）虽甚寒，不能胜之（不能胜过面部之阳气）。黄帝说：邪之中人，其病形（症状表现）如何？岐伯说：虚邪之中身，则洒淅（恶寒战栗）、动形（形体颤动）。正邪之中人则微（轻微），先见于气色，身上不知（没有感觉），若有若无，若亡若存，有形无形，不知其情状。黄帝说：讲得好。黄帝问岐伯说：我听说，见其色而知其病，叫作明；按其脉而知其病，叫作神；问其病而知其处（病位），叫作工。我希望听听：见而知之、按而得之、问而极（穷尽）之，是怎样做到的？岐伯回答说：色、脉与尺（尺肤）的相应，如同桴（鼓槌）鼓、影与响的相应，不得相失。这也是本末根叶之外候，所以根死则叶枯。","notes":[],"pending":false},{"id":"ls04-5","tags":[],"yw":"色脈形肉，不得相失也。故知一則爲工，知二則爲神，知三則神且明矣。黃帝曰：願卒聞之。岐伯答曰：色青者，其脈弦也，赤者，其脈鉤也，黃者，其脈代也，白者，其脈毛，黑者，其脈石。見其色而不得其脈，反得其相勝之脈，則死矣；得其相生之脈，則病已矣。黃帝問於岐伯曰：五髒之所生，變化之病形何如？岐伯答曰：先定其五色五脈之應，其病乃可別也。黃帝曰：色脈已定，別之奈何？岐伯說：調其脈之緩、急、小、大、滑、澀，而病變定矣。","bh":"色、脉、形肉，不得相失。所以知其一则为工，知其二则为神，知其三则神而且明了。黄帝说：希望详尽地听听。岐伯回答说：色青的，其脉弦；色赤的，其脉钩；色黄的，其脉代；色白的，其脉毛；色黑的，其脉石。见其色而不得其（相应之）脉，反得其相胜（相克）之脉的，就会死；得其相生之脉的，病就会好了。黄帝问岐伯说：五脏之所生（发生的病），变化之病形如何？岐伯回答说：先定其五色五脉之应，其病才可以辨别。黄帝说：色脉已定，怎样辨别它？岐伯说：调（辨察）其脉之缓、急、小、大、滑、涩，而病变就定了。","notes":[],"pending":false},{"id":"ls04-6","tags":[],"yw":"黃帝曰：調之奈何？岐伯答曰：脈急者，尺之皮膚亦急；脈緩者，尺之膚亦緩；脈小者，尺之皮膚亦減而少氣；脈大者，尺之皮膚亦賁而起；脈滑者，尺之皮膚亦滑；脈澀者，尺之皮膚亦澀。凡此變者，有微有甚。故善調尺者，不待於寸，善調脈者，不待於色。能參合而行之者，可以爲上工，上工十全九。行二者，爲中工，中工十全七。行一者，爲下工，下工十全六。黃帝曰：請問脈之緩、急，小、大，滑、澀之病形何如？岐伯曰：臣請言五藏之病變也。","bh":"黄帝说：怎样调（辨察）它？岐伯回答说：脉急的，尺（尺肤）之皮肤也急（紧张）；脉缓的，尺之皮肤也缓（弛缓）；脉小的，尺之皮肤也减（瘦薄）而少气；脉大的，尺之皮肤也贲（隆起）而起；脉滑的，尺之皮肤也滑；脉涩的，尺之皮肤也涩。凡此变化，有微有甚（有轻有重）。所以善调尺者，不待于寸（不必等待诊寸口之脉）；善调脉者，不待于色（不必等待察色）。能参合（综合）而行之者，可以为上工，上工十全九。行（其中）二者的，为中工，中工十全七。行（其中）一者的，为下工，下工十全六。黄帝说：请问脉之缓、急、小、大、滑、涩的病形如何？岐伯说：臣请言五脏之病变。","notes":[],"pending":false},{"id":"ls04-7","tags":[],"yw":"心脈急甚者爲瘈瘲；徵急，爲心痛引背，食不下。緩甚，爲狂笑；微緩，爲伏梁，在心下，上下行，時唾血。大甚，爲喉吤；微大，爲心痹引背，善淚出。小甚爲善噦；微小爲消病。滑甚爲善渴；微滑爲心疝，引臍，小腹鳴。澀爲爲瘖；微澀爲血溢，維厥耳鳴，顛疾。肺脈急甚，爲癲疾；微急，爲肺寒熱，怠惰，咳唾血，引腰背胸，若鼻息肉不通。緩甚，爲多汗；微緩，爲痿瘻，偏風，頭以下汗出不可止。大甚，爲脛腫；微大，爲肺痹，引胸背，起惡見日光。","bh":"心脉急甚的为瘈疭（筋脉拘急抽搐）；微急的，为心痛引背，食不下。缓甚的，为狂笑；微缓的，为伏梁（心下积块），在心下，上下行（上下移动），时时唾血。大甚的，为喉吤（喉中梗塞）；微大的，为心痹引背，常常流泪出。小甚的为善哕（呃逆）；微小的为消病（消渴）。滑甚的为善渴；微滑的为心疝，引（牵引）脐，小腹鸣。涩甚的为瘖（失音）；微涩的为血溢（出血），维厥（四肢厥逆）、耳鸣、颠疾。肺脉急甚的，为癫疾；微急的，为肺寒热（恶寒发热），怠惰，咳唾血，引（牵引）腰背胸，像鼻息肉（鼻塞）不通。缓甚的，为多汗；微缓的，为痿、瘘、偏风，头以下汗出不可止。大甚的，为胫肿（小腿肿）；微大的，为肺痹，引（牵引）胸背，（发作时）恶见日光。","notes":[],"pending":false},{"id":"ls04-8","tags":[],"yw":"小甚，爲泄；微小，爲消痹。滑甚，爲息賁上氣；微滑，爲上下出血。澀甚，爲嘔血；微澀，爲鼠瘻，在頸支腋之間，下不勝其上，其應善酸矣。肝脈急甚者爲惡言；微急爲肥氣在脅下，若復杯。緩甚爲善嘔，微緩爲水瘕痹也。大甚爲內癰，善嘔衄；微大爲肝痹，陰縮，咳引小腹。小甚爲多飲；微小爲消癉。滑甚爲疝；微滑爲遺溺。澀甚爲溢飲；微澀爲瘈攣筋痹。脾脈急甚爲瘈瘲；微急爲膈中，食飲入而還出，後沃沫。緩甚爲痿厥；微緩爲風痿，四肢不用，心慧然若無病。","bh":"（肺脉）小甚的，为泄（泄泻）；微小的，为消痹。滑甚的，为息贲（气逆喘息）上气；微滑的，为上下出血。涩甚的，为呕血；微涩的，为鼠瘘（瘰疬），在颈、支腋（肢腋）之间，下不胜其上，其（患处）应（反应）善酸（发酸）。肝脉急甚的，为（多）恶言；微急的为肥气，在胁下，如同复杯（倒扣的杯子）。缓甚的为善呕；微缓的为水瘕痹。大甚的为内痈，善呕、衄（鼻出血）；微大的为肝痹，阴缩（阴器收缩），咳引小腹。小甚的为多饮；微小的为消瘅。滑甚的为疝（㿗疝）；微滑的为遗溺。涩甚的为溢饮；微涩的为瘈（筋急）挛、筋痹。脾脉急甚的为瘈疭；微急的为膈中，食饮入而还出（呕吐），其后沃沫（吐出泡沫）。缓甚的为痿厥；微缓的为风痿，四肢不用，而心慧然（心中清明）若无病。","notes":[],"pending":false},{"id":"ls04-9","tags":[],"yw":"大甚爲擊僕；微大爲疝氣，腹裏大膿血在腸胃之外。小甚爲寒熱；微小爲消癉。滑甚爲癃；微滑爲蟲毒蛕蠍腹熱。澀甚爲腸；微澀爲內，多下膿血。腎脈急甚爲骨癲疾；微急爲沉厥奔豚，足不收，不得前後。緩甚爲折脊；微緩爲洞，洞者，食不化，下嗌逐出。大甚爲陰痿；微大爲石水，起臍已下至小腹睡睡然，上至胃脘，死不治。小甚爲洞泄；微小爲消癉。滑甚爲癃；微滑爲骨痿，坐不能起，起則目無所見。澀甚爲大癰；微澀爲不月，沉痔。黃帝曰：病之六變者，刺之奈何？岐伯曰：諸急者多寒；緩者多熱；大者多氣少血；小者血氣皆少；滑者陽氣盛，微有熱；澀者多血、少氣，微有寒。","bh":"（脾脉）大甚的为击仆（猝然仆倒）；微大的为疝气，腹里有（大）脓血在肠胃之外。小甚的为寒热；微小的为消瘅。滑甚的为癃（小便不通）；微滑的为虫毒蛕蝎（蛔虫之类），腹中热。涩甚的为肠（肠㿗）；微涩的为内（内㿗），多下脓血。肾脉急甚的为骨癫疾；微急的为沉厥、奔豚，足不收（不能屈伸收持），不得前后（大小便不利）。缓甚的为折脊（脊痛如折）；微缓的为洞（洞泄），洞是食不化，下咽（入咽）随即（逐）而出。大甚的为阴痿；微大的为石水，起（肿起）自脐以下至小腹睡睡然（垂坠之状），上至胃脘，死不治。小甚的为洞泄；微小的为消瘅。滑甚的为癃（小便不通）；微滑的为骨痿，坐不能起，起则目无所见。涩甚的为大痈；微涩的为不月（月经不行）、沉痔（久痔）。黄帝说：病之六变，刺之奈何？岐伯说：诸急的多寒；缓的多热；大的多气少血；小的血气皆少；滑的阳气盛，微有热；涩的多血、少气，微有寒。","notes":[],"pending":false},{"id":"ls04-10","tags":[],"yw":"是故刺急者，深內而久留之；刺緩者，淺內而疾發針，以去其熱；刺大者，微瀉其氣，無出其血；刺滑者，疾發針而淺內之，以瀉其陽氣而去其熱；刺澀者，必中其脈，隨其逆順而久留之，必先按而循之，已發針，已按其疝，無令其血出，以和其脈；諸小者，陰陽形氣俱不足，勿取以針而調以甘藥也。黃帝曰：餘聞五髒六府之氣，滎、俞所入爲合，令何道從入，入安連過，願聞其故。岐伯答曰：此陽脈之別入於內，屬於府者也。黃帝曰：滎俞與合，各有名乎？岐伯曰：滎俞治外經，合治內府。","bh":"所以刺急（脉）的，深内（进针）而久留之；刺缓的，浅内而疾发针（迅速出针），以去其热；刺大的，微泻其气，无出其血；刺滑的，疾发针而浅内之，以泻其阳气而去其热；刺涩的，必中其脉，随其（气的）逆顺而久留之，必先按而循之，已发针（出针）后，已（随即）按其痏（针孔），无令其血出，以和其脉；诸小（脉）者，阴阳形气俱不足，勿取以针而调以甘药（甘味之药）。黄帝说：我听说五脏六腑之气，荥、俞（之气）所入为合，令（它们）从何道而入，入后又连属于何处、经过何处，希望听听其中的缘故。岐伯回答说：这是阳脉之别（别行）而入于内、属于腑者。黄帝说：荥俞与合，各有名（各有不同的作用）吗？岐伯说：荥俞治外经（体表之经），合治内府（内在之腑）。","notes":[],"pending":false},{"id":"ls04-11","tags":[],"yw":"黃帝曰：治內府奈何？岐伯曰：取之於合。黃帝曰：合各有名乎？岐伯答曰：胃合於三裏，大腸合入於巨虛上廉，小腸合入於巨虛下廉，三焦合入於委陽，膀胱合入於委中央，膽合入於陽陵泉。黃帝曰：取之奈何？岐伯答曰：取之三裏者，低跗取之；巨虛者，舉足取之；委陽者，屈伸而索之；委中者，屈而取之；陽陵泉者，正豎膝予之齊下，至委陽之陽取之；取諸外經者，揄申而從之。黃帝曰：願聞六府之病。岐伯答曰：面熱者足陽明病，魚絡血者手陽明病，兩跗之上脈豎陷者，足陽明病，此胃脈也。","bh":"黄帝说：治内腑奈何？岐伯曰：取之于合。黄帝说：合各有名吗？岐伯回答说：胃合于三里，大肠合入于巨虚上廉，小肠合入于巨虚下廉，三焦合入于委阳，膀胱合入于委中央（委中），胆合入于阳陵泉。黄帝说：取之奈何？岐伯回答说：取三里的，低跗（足背下垂）取之；取巨虚的，举足取之；取委阳的，屈伸（下肢）而索（探寻）之；取委中的，屈（膝）而取之；取阳陵泉的，正竖膝，予之（使膝）齐（平），下至委阳之阳（外侧）取之；取诸外经者，揄申（舒展肢体）而从（顺）之。黄帝说：希望听听六腑之病。岐伯回答说：面热者足阳明病，鱼络（手鱼际络脉）血者手阳明病，两跗（足背）之上脉竖（隆起）或陷（下陷）者足阳明病，这是胃脉。","notes":[],"pending":false},{"id":"ls04-12","tags":[],"yw":"大腸病者，腸中切痛，而鳴濯濯。冬日重感於寒即泄，當臍而痛，不能久立，與胃同候，取巨虛上廉。胃病者，腹脹，胃脘當心而痛，上肢兩脅，膈咽不通，食飲不下，取之三裏也。小腸病者，小腹痛，腰脊控睪而痛，時窘之後，當耳前熱，若寒甚，若獨肩上熱甚，及手小指次指之間熱，若脈陷者，此其候也。手太陽病也，取之巨虛下廉。三焦病者，腹氣滿，小腹尤堅，不得小便，窘急，溢則水留，即爲脹。候在足太陽之外大絡，大絡在太陽少陽之間，亦見於脈，取委陽。","bh":"大肠病者，肠中切痛而鸣濯濯（肠鸣）。冬日重感于寒即泄，当脐而痛，不能久立，与胃同候，取巨虚上廉。胃病者，腹胀，胃脘当心而痛，上支（支撑）两胁，膈咽不通，食饮不下，取之三里。小肠病者，小腹痛，腰脊控睪（牵引睪丸）而痛，时窘之后（时常窘急于后阴），当耳前热，若寒甚，若独肩上热甚，及手小指次指之间热，若脉陷者，这是它的证候。手太阳病也，取之巨虚下廉。三焦病者，腹气满，小腹尤坚，不得小便，窘急，（水）溢则水留，即为胀。候（证候）在足太阳之外大络，大络在太阳（与）少阳之间，亦见于脉，取委阳。","notes":[],"pending":false},{"id":"ls04-13","tags":[],"yw":"膀胱病者，小腹偏腫而痛，以手按之，即欲小便而不得，肩上熱，若脈陷，及足小趾外廉及脛踝後皆熱，若脈陷，取委中央。膽病者，善太息，口苦，嘔宿汁，心下淡淡，恐人將捕之，嗌中吤吤然數唾。在足少陽之本末，亦視其脈之陷下者灸之；其寒熱者取陽陵泉。黃帝曰：刺之有道乎？岐伯答曰：刺此者，必中氣穴，無中肉節。中氣穴，則針遊於巷；中肉節，即皮膚痛；補瀉反，則病益篤。中筋則筋緩，邪氣不出，與其真相搏亂而不去，反還內着。","bh":"膀胱病者，小腹偏肿而痛，以手按之，即欲小便而不得，肩上热，若脉陷，及足小趾外廉及胫踝后皆热，若脉陷，取委中央（委中）。胆病者，善太息（叹息），口苦，呕宿汁（隔宿的苦汁），心下淡淡（心中悸动不安），恐人将捕之（好像有人要捉捕他），嗌中吤吤然（咽中如有物梗阻）而数唾（屡次吐唾沫）。（病）在足少阳之本末（终始），亦视其脉之陷下者灸之；其寒热者取阳陵泉。黄帝说：刺之有道（法则）吗？岐伯回答说：刺此者，必中气穴，无中肉节（肌肉骨节）。中气穴，则针游于巷（通道）；中肉节，即皮肤痛；补泻反（相反），则病益笃（加重）。中筋则筋缓（弛缓），邪气不出，与其真（真气）相搏乱而不去，反还（返入）而内著。","notes":[],"pending":false},{"id":"ls04-14","tags":[],"yw":"用針不審，以順爲逆也。","bh":"用针不审（不审慎），就是把顺当成逆了。","notes":[],"pending":false}]},
{"id":"ls05","book":"灵枢","no":5,"title":"根结","titleTw":"根結","tags":["ci","jingluo","zhenfa"],"brief":"论三阴三阳经气的根与结、开阖枢及其病候取治，兼述五十营诊脉、形气逆顺与补泻禁忌。","pending":false,"sections":[{"id":"ls05-1","tags":[],"yw":"岐伯曰：天地相感，寒暖相移，陰陽之道，孰少孰多，陰道偶，陽道奇。發於春夏，陰氣少，陽氣多，陰陽不調，何補何瀉。發於秋冬，陽氣少，陰氣多；陰氣盛而陽氣衰，故莖葉枯槁，溼雨下歸，陰陽相移，何瀉何補。奇邪離經，不可勝數，不知根結，五髒六腑，折關敗樞，開合而走，陰陽大失，不可復取。九針之玄，要在終始；故能知終始，一言而畢，不知終始，針道鹹絕。太陽根於至陰，結於命門。命門者，目也。陽明根於厲兌，結於顙大。顙大者，鉗耳也。","bh":"岐伯说：天地相感，寒暖相移（交替），阴阳之道，孰少孰多（多少不等）：阴道为偶（偶数），阳道为奇（奇数）。发于春夏的，阴气少，阳气多，阴阳不调，何补何泻（该如何补泻）。发于秋冬的，阳气少，阴气多；阴气盛而阳气衰，所以茎叶枯槁，湿雨（雨水）下归（于地），阴阳相移（转移），何泻何补（该如何泻补）。奇邪（不正之邪）离经（流离于经络），不可胜数（多得数不清）；不知根结（经气之根与结），五脏六腑就会折关败枢（关折枢败），开合（开阖）失司而（正气）走失，阴阳大失，不可复取（不可挽回）。九针之玄（奥妙），要在终始；所以能知终始，一言而毕（一句话就完了），不知终始，针道咸绝（全完了）。太阳根于至阴，结于命门；命门者，目也。阳明根于厉兑，结于颡大；颡大者，钳耳（耳上两旁）也。","notes":[],"pending":false},{"id":"ls05-2","tags":[],"yw":"少陽根於竅陰，結於窗籠。窗籠者，耳中也。太陽爲開，陽明爲合，少陽爲樞，故開折，則肉節瀆而暴病起矣。故暴病者，取之太陽，視有餘不足。瀆者，皮肉宛膲而弱也。合折，則氣無所止息而痿疾起矣。故痿疾者，取之陽明，視有餘不足。無所止息者，真氣稽留，邪氣居之也。樞折，即骨繇而不安於地。故骨繇者，取之少陽，視有餘不足。骨繇者，節緩而不收也。所謂骨繇者，搖故也。當竊其本也。太陰根於隱白，結於太倉。少陰根於湧泉，結於廉泉。","bh":"少阳根于窍阴，结于窗笼；窗笼者，耳中也。太阳为开，阳明为合，少阳为枢。所以开折（太阳开的功能受损），则肉节渎（皮肉溃缓）而暴病（急病）起。所以暴病者，取之太阳，视其有余不足。所谓渎，是皮肉宛膲（枯槁憔悴）而弱。合折（阳明合的功能受损），则气无所止息（无所留止）而痿疾起。所以痿疾者，取之阳明，视其有余不足。所谓无所止息，是真气稽留（滞留），邪气居之。枢折（少阳枢的功能受损），即骨繇（骨节动摇）而不安于地（站立不稳）。所以骨繇者，取之少阳，视其有余不足。骨繇者，节（骨节）缓而不收（不能收束）。所谓骨繇，就是摇（动摇）的缘故，当（深）窃（探究）其本（根本）。太阴根于隐白，结于太仓（中脘）。少阴根于涌泉，结于廉泉。","notes":[],"pending":false},{"id":"ls05-3","tags":[],"yw":"厥陰根於大敦，結於玉英，絡於羶中。太陰爲合，少陽爲樞。故開折，則倉廩無所輸，膈洞。膈洞者，取之太陰，視有餘不足，故開折者，氣不足而生病也。合折，即氣絕而喜悲。悲者取之厥陰，視有餘不足。樞折，則脈有所結而不通。不通者，取之少陰，視有餘不足，有結者，皆取之不足。足太陽根於至陰，溜於京骨，注於昆侖，入於天柱、飛揚也。足少陽根於竅陰，溜於丘墟，注於陽輔，入於天容、光明也。足陽明根於厲兌，溜於衝陽，注於下陵，入於人迎，豐隆也。","bh":"厥阴根于大敦，结于玉英（玉堂），络于膻中（膻中）。太阴为开（原文作合），少阳（当作少阴）为枢。所以开折，则仓廪（脾胃）无所输（转输），（发为）膈洞（膈塞洞泄）。膈洞者，取之太阴，视其有余不足；所以开折者，是气不足而生病。合折，即气绝而喜悲；悲者取之厥阴，视其有余不足。枢折，则脉有所结而不通；不通者，取之少阴，视其有余不足。有结者，皆取之不足（之经）。足太阳根于至阴，溜于京骨，注于昆仑，入于天柱、飞扬。足少阳根于窍阴，溜于丘墟，注于阳辅，入于天容、光明。足阳明根于厉兑，溜于冲阳，注于下陵（三里），入于人迎、丰隆。","notes":[],"pending":false},{"id":"ls05-4","tags":[],"yw":"手太陽根於少澤，溜於陽谷，注於小海，入於天窗，支正也。少陽根於關衝，溜於陽池，注於支溝，入於天牖、外關也。手陽明根於商陽，溜於合谷，注於陽溪，入於扶突、偏歷也。此所謂十二經者，盛絡皆當取之。一日一夜五十營，以營五髒之精，不應數者，名曰狂生。所謂五十營者，五髒皆受氣，持其脈口，數其至也。五十動而不一代者，五髒皆受氣。四十動一代者，一髒無氣。三十動一代者，二髒無氣。二十動一代者，三髒無氣。十動一代者，四髒無氣。","bh":"手太阳根于少泽，溜于阳谷，注于小海，入于天窗、支正。（手）少阳根于关冲，溜于阳池，注于支沟，入于天牖、外关。手阳明根于商阳，溜于合谷，注于阳溪，入于扶突、偏历。这就是所说的十二经，（其）盛络（充盛之络）皆当取之。一日一夜五十营（经气运行五十周），以营（运营）五脏之精；不应数者，名曰狂生（不正常之人）。所谓五十营者，五脏皆受气；持其脉口（寸口），数其至（数其搏动之至数）。五十动而不一代（一次间歇）者，五脏皆受气。四十动一代者，一脏无气。三十动一代者，二脏无气。二十动一代者，三脏无气。十动一代者，四脏无气。","notes":[],"pending":false},{"id":"ls05-5","tags":[],"yw":"不滿十動一代者，五髒無氣。予之短期，要在終始。所謂五十動而不一代者，以爲常也。以知五髒之期，予之短期者，乍數乍疏也。黃帝曰：逆順五體者，言人骨節之大小，肉之堅脆，皮之厚薄，血之清濁，氣之滑澀，脈之長短，血之多少，經絡之數，餘已知之矣，此皆布衣匹夫之士也。夫王公大人，血食之君，身體柔脆，肌肉軟弱，血氣慓悍滑利，其刺之徐疾淺深多少，可得同之乎。岐伯答曰：膏梁菽藿之味，何可同也？氣滑即出疾，其氣澀則出遲，氣悍則針小而入淺，氣澀則針大而入深，深則欲留，淺則欲疾。","bh":"不满十动一代者，五脏无气。予（判断）之短期（近期的死期），要在终始。所谓五十动而不一代者，以为常（以此为正常）。以知五脏（受气）之期；予之短期者，是（脉）乍数乍疏（忽快忽慢）。黄帝说：逆顺五体（五种形体之人），是说人骨节之大小、肉之坚脆、皮之厚薄、血之清浊、气之滑涩、脉之长短、血之多少、经络之数，我已经知道了，这些都是（指）布衣匹夫之士。那些王公大人、血食之君（享厚味者），身体柔脆，肌肉软弱，血气慓悍滑利，其刺之徐疾浅深多少，可得同之乎（可以相同吗）。岐伯回答说：膏粱（肥甘厚味）与菽藿（粗食豆叶）之味（所养的人），何可同也（怎么可以相同呢）。气滑即出（针）疾，其气涩则出（针）迟；气悍则针小而入浅，气涩则针大而入深；深则欲留（留针），浅则欲疾（出针快）。","notes":[],"pending":false},{"id":"ls05-6","tags":[],"yw":"以此觀之，刺布衣者，深以留之，刺大人者，微以徐之，此皆因氣慓悍滑利也。黃帝曰：形氣之逆順奈何？岐伯曰：形氣不足，病氣有餘，是邪勝也，急瀉之；形氣有餘，病氣不足，急補之；形氣不足，病氣不足，此陰陽氣俱不足也，不可刺之，刺之則重不足。重不足則陰陽俱竭，血氣皆盡，五髒空虛，筋骨髓枯，老者絕滅，壯者不復矣。形氣有餘，病氣有餘，此謂陰陽俱有餘也。急瀉其邪，調其虛實。故曰：有餘者瀉之，不足者補之，此之謂也。故曰：刺不知逆順，真邪相搏。","bh":"以此观之，刺布衣（平民）者，深以留之；刺大人（王公）者，微以徐之；此皆因气慓悍滑利也。黄帝说：形气之逆顺奈何？岐伯说：形气不足，病气有余，是邪胜也，急泻之；形气有余，病气不足，急补之；形气不足，病气不足，这是阴阳气俱不足，不可刺之，刺之则重不足（更加不足）。重不足则阴阳俱竭，血气皆尽，五脏空虚，筋骨髓枯，老者绝灭，壮者不复。形气有余，病气有余，这叫作阴阳俱有余。急泻其邪，调其虚实。所以说：有余者泻之，不足者补之，就是这个意思。所以说：刺不知逆顺，真邪相搏（真气与邪气相争）。","notes":[],"pending":false},{"id":"ls05-7","tags":[],"yw":"滿而補之，則陰陽四溢，腸胃充郭，肝肺內，陰陽相錯。虛而瀉之，則經脈空虛，血氣竭枯，腸胃辟，皮膚薄着，毛腠夭膲，予之死期。故曰：用針之要，在於知調陰與陽。調陰與陽，精氣乃光，合形與氣，使神內藏。故曰：上工平氣，中工亂脈，下工絕氣危生。故曰：下工不可不慎也，必審五藏變化之病，五脈之應，經絡之實虛，皮之柔麤，而後取之也。","bh":"（若）满而补之，则阴阳四溢（气满溢于外），肠胃充郭（胀满扩张），肝肺内（内壅），阴阳相错（错乱）。（若）虚而泻之，则经脉空虚，血气竭枯，肠胃（辟）辟（开豁无力），皮肤薄著（枯薄附骨），毛腠夭膲（毛发腠理枯焦），（可以）予之死期。所以说：用针之要，在于知调阴与阳。调阴与阳，精气乃光（充盛光大），合形与气，使神内藏。所以说：上工平气（调平气机），中工乱脉（扰乱经脉），下工绝气危生（断绝气机而危害生命）。所以说：下工不可不慎也，必审五脏变化之病、五脉之应、经络之实虚、皮之柔麤（柔润与粗糙），而后取之（施针）。","notes":[],"pending":false}]},
{"id":"ls06","book":"灵枢","no":6,"title":"寿夭刚柔","titleTw":"壽夭剛柔","tags":["ci","zhenfa","bingji"],"brief":"论人体阴阳刚柔、形气内外与疾病刺治之法，并据形气骨肉皮之相任判断寿夭，附药熨治寒痹。","pending":false,"sections":[{"id":"ls06-1","tags":[],"yw":"黃帝問於少師曰：餘聞人之生也，有剛有柔，有弱有強，有短有長，有陰有陽，願聞其方。少師答曰：陰中有陰，陽中有陽，審知陰陽，刺之有方。得病所始，刺之有理。謹度病端，與時相應。內合於五髒六腑，外合於筋骨皮膚。是故內有陰陽，外亦有陰陽。在內者，五髒爲陰，六腑爲陽，在外者，筋骨爲陰，皮膚爲陽。故曰，病在陰之陰者，刺陰之滎俞，病在陽之陽者，刺陽之合，病在陽之陰者，刺陰之經，病在陰之陽者，刺絡脈。故曰，病在陽者名曰風，病在陰者名曰痹，陰陽俱病名曰風痹。","bh":"黄帝问于少师曰：我听说人之生也，有刚有柔，有弱有强，有短有长，有阴有阳，希望听听其中的法则。少师回答说：阴中有阴，阳中有阳，审知阴阳，刺之有方（法则）。得病所始（得知病之所起始），刺之有理（条理）。谨度病端（慎重揣度病的端绪），与时相应。内合于五脏六腑，外合于筋骨皮肤。所以内有阴阳，外亦有阴阳。在内者，五脏为阴，六腑为阳；在外者，筋骨为阴，皮肤为阳。所以说：病在阴之阴者（阴中之阴），刺阴之荥俞；病在阳之阳者（阳中之阳），刺阳之合；病在阳之阴者（阳中之阴），刺阴之经；病在阴之阳者（阴中之阳），刺络脉。所以说：病在阳者名曰风，病在阴者名曰痹，阴阳俱病名曰风痹。","notes":[],"pending":false},{"id":"ls06-2","tags":[],"yw":"病有形而不痛者，陽之類也；無形而痛者，陰之類也。無形而痛者，其陽完而陰傷之也。急治其陰，無攻其陽。有形而不痛者，其陰完而陽傷之也。急治其陽，無攻其陰。陰陽俱動，乍有形，乍無形，加以煩心，命曰陰勝其陽。此謂不表不裏，其形不久。黃帝問於伯高曰：餘聞形氣之病先後，外內之應奈何？伯高答曰：風寒傷形，憂恐忿怒傷氣；氣傷髒，乃病髒，寒傷形，乃應形；風傷筋脈，筋脈乃應。此形氣外內之相應也。黃帝曰：刺之奈何？伯高答曰：病九日者，三刺而已；病一月者，十刺而已；多少遠近，以此衰之。","bh":"病有形而不痛者，阳之类也；无形而痛者，阴之类也。无形而痛者，其阳完（完好）而阴伤之也。急治其阴，无攻其阳。有形而不痛者，其阴完（完好）而阳伤之也。急治其阳，无攻其阴。阴阳俱动，乍有形，乍无形，加以烦心，命曰阴胜其阳。这叫作不表不里（表里同病），其形不久（形体难以久存）。黄帝问于伯高曰：我听说形气之病先后、外内之应奈何？伯高回答说：风寒伤形，忧恐忿怒伤气；气伤脏，乃病脏；寒伤形，乃应形；风伤筋脉，筋脉乃应。这就是形气外内之相应。黄帝说：刺之奈何？伯高回答说：病九日者，三刺而已；病一月者，十刺而已；多少远近（病程长短远近），以此衰之（以此递减推算）。","notes":[],"pending":false},{"id":"ls06-3","tags":[],"yw":"久痹不去身者，視其血絡，盡出其血。黃帝曰：外內之病，難易之治奈何？伯高答曰：形先病而未入髒者，刺之半其日。髒先病而形乃應者，刺之倍其日。此月內難易之應也。黃帝問於伯高曰：餘聞形有緩急，氣有盛衰，骨有大小，肉有堅脆，皮有厚薄，其以立壽夭奈何？伯高答曰：形與氣相任則壽，不相任則夭。皮與肉相果則壽，不相果則夭，血氣經絡勝形則壽，不勝形則夭。黃帝曰：何謂形之緩急？伯高答曰：形充而皮膚緩者則壽，形充而皮膚急者則夭，形充而脈堅大者順也，形充而脈小以弱者氣衰，衰則危矣。","bh":"久痹不去身者，视其血络，尽出其血。黄帝说：外内之病，难易之治奈何？伯高回答说：形先病而未入脏者，刺之半其日（日数减半）。脏先病而形乃应者，刺之倍其日（日数加倍）。这是一月之内（病情）难易之应。黄帝问于伯高曰：我听说形有缓急，气有盛衰，骨有大小，肉有坚脆，皮有厚薄，其以立寿夭奈何（以此确定寿夭如何）？伯高回答说：形与气相任（相称）则寿，不相任则夭。皮与肉相果（相包裹相称）则寿，不相果则夭。血气经络胜形（充旺于形）则寿，不胜形则夭。黄帝说：何谓形之缓急？伯高回答说：形充（形体充实）而皮肤缓（宽松）者则寿，形充而皮肤急（紧涩）者则夭，形充而脉坚大者顺也，形充而脉小以弱者气衰，衰则危矣。","notes":[],"pending":false},{"id":"ls06-4","tags":[],"yw":"若形充而顴不起者骨小，骨小則夭矣。形充而大肉胭堅而有分者肉堅，肉堅則壽矣；形充而大肉無分理不堅者肉脆，肉脆則夭矣。此天之生命，所以立形定氣而視壽夭者，必明乎此立形定氣，而後以臨病人，決生死。黃帝曰：餘聞壽夭，無以度之。伯高答曰：牆基卑，高不及其地者，不滿三十而死。其有因加疾者，不及二十而死也。黃帝曰：形氣之相勝，以立壽夭奈何？伯高答曰：平人而氣勝形者壽；病而形肉脫，氣勝形者死，形勝氣者危矣。黃帝曰：餘聞刺有三變，何謂三變？伯高答曰：有刺營者，有刺衛者，有刺寒痹之留經者。","bh":"若形充而颧不起者骨小，骨小则夭矣。形充而大肉（大块肌肉）胭坚（隆厚坚实）而有分（分理）者肉坚，肉坚则寿矣；形充而大肉无分理、不坚者肉脆，肉脆则夭矣。这是天之生命（禀赋），所以立形定气而视寿夭者，必明乎此立形定气（之法），而后以临病人，决生死。黄帝说：我听说寿夭，无以度之（无法度量）。伯高回答说：墙基（面部地阁）卑（低），高不及其地（高度不及地部）者，不满三十而死；其有因加疾（再加上疾病）者，不及二十而死也。黄帝说：形气之相胜，以立寿夭奈何？伯高回答说：平人（无病之人）而气胜形者寿；病而形肉脱（肌肉消脱），气胜形者死，形胜气者危矣。黄帝说：我听说刺有三变，何谓三变？伯高回答说：有刺营者，有刺卫者，有刺寒痹之留经者。","notes":[],"pending":false},{"id":"ls06-5","tags":[],"yw":"黃帝曰：刺三變者奈何？伯高答曰：刺營者出血，刺衛者出氣，刺寒痹者內熱。黃帝曰：營衛寒痹之爲病奈何？伯高答曰：營之生病也，寒熱少氣，血上下行。衛之生病也，氣痛時來時去，怫愾賁響，風寒客於腸胃之中。寒痹之爲病也，留而不去，時痛而皮不仁。黃帝曰：刺寒痹內熱奈何？伯高答曰：刺布衣者，以火焠之；刺大人者，以藥熨之。黃帝曰：藥熨奈何？伯高答曰：用淳酒二十斤，蜀椒一斤，干姜一斤，桂心一斤，凡四種，皆嚼咀，漬酒中，用綿絮一斤，細白布四丈，並內酒中，置酒馬矢熅中，封塗封，勿使泄。","bh":"黄帝说：刺三变者奈何？伯高回答说：刺营者出血，刺卫者出气，刺寒痹者内热（使内里生热）。黄帝说：营、卫、寒痹之为病奈何？伯高回答说：营之生病也，寒热少气，血上下行。卫之生病也，气痛时来时去，怫忾（满闷）贲响（腹鸣作响），（这是）风寒客（留客）于肠胃之中。寒痹之为病也，留而不去，时痛而皮不仁（麻木不仁）。黄帝说：刺寒痹（使之）内热奈何？伯高回答说：刺布衣者，以火焠之（用火针）；刺大人者，以药熨之。黄帝说：药熨奈何？伯高回答说：用淳酒二十斤，蜀椒一斤，干姜一斤，桂心一斤，凡四种，皆嚼咀（切碎），渍（浸）酒中；用绵絮一斤，细白布四丈，并内（放入）酒中；置酒（器）于马矢（马粪）煴（无焰之火）中，封涂（严密封涂），勿使泄（漏气）。","notes":[],"pending":false},{"id":"ls06-6","tags":[],"yw":"五日五夜，出綿絮曝干之，干復潰，以盡其汁。每漬必晬其日，乃出干。干，並用滓與綿絮，復布爲復巾，長六七尺，爲六七巾，則用之生桑炭炙巾，以熨寒痹所刺之處，令熱入至於病所，寒復炙巾以熨之，三十遍而止。汗出以巾拭身，亦三十遍而止。起步內中，無見風。每刺必熨，如此病已矣。","bh":"五日五夜，出绵絮曝干之，干复渍（再浸），以尽（吸尽）其汁。每渍必晬其日（满一昼夜），乃出干。干，（连）并用滓（药渣）与绵絮，复布为复巾（用布做成双层布巾），长六七尺，为六七巾。则用之（使用时）以生桑炭炙巾，以熨寒痹所刺之处，令热入至于病所；（巾）寒（凉）复炙巾以熨之，三十遍而止。汗出以巾拭身，亦三十遍而止。起步（行走）内中（内室之中），无见风。每刺必熨，如此病已矣。","notes":[],"pending":false}]},
{"id":"ls07","book":"灵枢","no":7,"title":"官针","titleTw":"官針","tags":["ci","jingluo","zhenfa"],"brief":"论九针各有所宜与刺法之过，详列九刺、十二节刺、三刺、五刺诸法及其所治之病。","pending":false,"sections":[{"id":"ls07-1","tags":[],"yw":"凡刺之要，官針最妙。九針之宜，各有所爲，長、短、大、小，各有所施也。不得其用，病弗能移。疾淺針深，內傷良肉，皮膚爲癰；病深針淺，病氣不瀉，支爲大膿。病小針大，氣瀉太甚，疾必爲害；病大針小，氣不泄瀉，亦復爲敗。失針之宜。大者瀉，小者不移。已言其過，請言其所施。病在皮膚無常處者，取以鑱針於病所，膚白勿取。病在分肉間，取以圓針於病所。病在經絡痼痹者，取以鋒針。病在脈，氣少，當補之者，取以鍉針於井滎分俞。","bh":"凡刺之要，官针（选用合宜的针具）最妙。九针之宜，各有所为（各有所用），长、短、大、小，各有所施。不得其用，病弗能移（病不能去除）。疾浅针深，内伤良肉，皮肤（因而）为痈；病深针浅，病气不泻，（反）支为大脓。病小针大，气泻太甚，疾必为害；病大针小，气不泄泻，亦复为败。这是失针之宜：大者泻（太过），小者不移（病不除）。已言其过，请言其所施。病在皮肤无常处（游走不定）者，取以镵针于病所，肤白勿取。病在分肉间，取以圆针于病所。病在经络（而为）痼痹者，取以锋针。病在脉，气少，当补之者，取以𫔂针于井荥分俞（井荥等俞穴）。","notes":[],"pending":false},{"id":"ls07-2","tags":[],"yw":"病爲大膿者，取以鈹針。病痹氣暴發者，取以圓利針。病痹氣痛而不去者，取以毫針。病在中者，取以長針。病水腫不能通關節者，取以大針。病在五髒固居者，取以鋒針，瀉於井滎分俞，取以四時。凡刺有九，以應九變。一曰俞刺，俞刺者，刺諸經滎俞髒俞也；二曰遠道刺，遠道刺者，病在上，取之下，刺腑俞也；三曰經刺，經刺者，刺大經之結絡經分也；四曰絡刺，絡刺者，刺小絡之血脈也；五曰分刺，分刺者，刺分肉之間也；六曰大瀉刺，大瀉刺者，刺大膿以鈹針也；七曰毛刺，毛刺者，刺浮痹皮膚也；八曰巨刺，巨刺者，左取右，右取左；九曰焠刺，焠刺者，刺燔針則取痹也。","bh":"病为大脓者，取以铍针。病痹气暴发者，取以圆利针。病痹气痛而不去者，取以毫针。病在中（深部）者，取以长针。病水肿不能通关节者，取以大针。病在五脏固居（固定不移）者，取以锋针，泻于井荥分俞，取以四时（依四时取穴）。凡刺有九，以应九变。一曰俞刺，俞刺者，刺诸经荥俞、脏俞也；二曰远道刺，远道刺者，病在上，取之下，刺腑俞也；三曰经刺，经刺者，刺大经之结络（结聚之络）经分也；四曰络刺，络刺者，刺小络之血脉也；五曰分刺，分刺者，刺分肉之间也；六曰大泻刺，大泻刺者，刺大脓以铍针也；七曰毛刺，毛刺者，刺浮痹（浮浅之痹）皮肤也；八曰巨刺，巨刺者，左取右，右取左；九曰焠刺，焠刺者，刺燔针（烧针）则取痹也。","notes":[],"pending":false},{"id":"ls07-3","tags":[],"yw":"凡刺有十二節，以應十二經。一曰偶刺，偶刺者，以手直心若背，直痛所，一刺前，一刺後，以治心痹。刺此者，傍針之也。二曰報刺，報刺者，刺痛無常處也。上下行者，直內無拔針，以左手隨病所按之，乃出針，復刺之也。三曰恢刺，恢刺者，直刺傍之，舉之前後，恢筋急，以治筋痹也。四曰齊刺，齊刺者，直入一，傍入二，以治寒氣小深者；或曰三刺，三刺者，治痹氣小深者也。五曰揚刺，揚刺者，正內一，傍內四，而浮之，以治寒氣之搏大者也。","bh":"凡刺有十二节，以应十二经。一曰偶刺，偶刺者，以手直心若背（直对心或背），直痛所（正当痛处），一刺前，一刺后，以治心痹；刺此者，傍针之（斜刺）也。二曰报刺，报刺者，刺痛无常处也；上下行者，直内无拔针（直刺进针而不拔），以左手随病所按之，乃出针，复刺之也。三曰恢刺，恢刺者，直刺傍之（直刺于旁侧），举之前后，恢（舒缓）筋急，以治筋痹也。四曰齐刺，齐刺者，直入一，傍入二，以治寒气小深者；或曰三刺，三刺者，治痹气小深者也。五曰扬刺，扬刺者，正内一，傍内四，而浮之，以治寒气之搏大（邪气搏聚而大）者也。","notes":[],"pending":false},{"id":"ls07-4","tags":[],"yw":"六曰直針刺，直針刺者，引皮乃刺之，以治寒氣之淺者也。七曰輸針，輸刺者，直入直出，稀發針而深之，以治氣盛而熱者也。八曰短刺，短刺者，刺骨痹，稍搖而深之，致針骨所，以上下摩骨也。九曰浮刺，浮刺者，傍入而浮之，以治肌急而寒者也。十曰陰刺，陰刺者，左右率刺之，以治寒厥；中寒厥，足踝後少陰也。十一曰傍針刺，傍針刺者，直刺傍刺各一，以治留痹久居者也。十二曰贊刺，贊刺者，直入直出，數發針而淺之，出血是謂治癰腫也。","bh":"六曰直针刺，直针刺者，引皮（捏起皮肤）乃刺之，以治寒气之浅者也。七曰输针（输刺），输刺者，直入直出，稀发针（少出针）而深之，以治气盛而热者也。八曰短刺，短刺者，刺骨痹，稍摇而深之，致针（骨）所（达于骨处），以上下摩骨也。九曰浮刺，浮刺者，傍入而浮之（浅刺），以治肌急而寒者也。十曰阴刺，阴刺者，左右率刺之（左右一并刺之），以治寒厥；中寒厥，（取）足踝后少阴也。十一曰傍针刺，傍针刺者，直刺傍刺各一，以治留痹久居者也。十二曰赞刺，赞刺者，直入直出，数发针而浅之，出血，是谓治痈肿也。","notes":[],"pending":false},{"id":"ls07-5","tags":[],"yw":"脈之所居，深不見者，刺之微內針而久留之，以致其空脈氣也。脈淺者，勿刺，按絕其脈乃刺之，無令精出，獨出其邪氣耳。所謂三刺，則谷氣出者。先淺刺絕皮，以出陽邪，再刺則陰邪出者，少益深絕皮，致肌肉，未入分肉間也；已入分肉之間，則谷氣出。故刺法曰：始刺淺之，以逐邪氣，而來血氣，後刺深之，以致陰氣之邪，最後刺極深之，以下谷氣。此之謂也。故用針者，不知年之所加，氣之盛衰，虛實之所起，不可以爲工也。凡刺有五，以應五髒，一曰半刺，半刺者，淺內而疾發針，無針傷肉，如拔毛狀，以取皮氣，此肺之應也。","bh":"脉之所居深不见者，刺之微内针（轻浅进针）而久留之，以致其空（孔穴）脉气也。脉浅者，勿刺，按绝其脉（按压阻断其脉）乃刺之，无令精（血）出，独出其邪气耳。所谓三刺则谷气出者：先浅刺绝皮（透过皮肤），以出阳邪；再刺则阴邪出者，少益深（稍加深）绝皮，致肌肉，未入分肉间也；已入分肉之间，则谷气出。所以刺法曰：始刺浅之，以逐邪气而来血气；后刺深之，以致阴气之邪；最后刺极深之，以下（降下）谷气。就是这个意思。所以用针者，不知年之所加（岁气的加临）、气之盛衰、虚实之所起，不可以为工也。凡刺有五，以应五脏：一曰半刺，半刺者，浅内而疾发针，无针伤肉，如拔毛状，以取皮气，此肺之应也。","notes":[],"pending":false},{"id":"ls07-6","tags":[],"yw":"二曰豹文刺，豹文刺者，左右前後針之，中脈爲故，以取經絡之血者，此心之應也。三曰關刺，關刺者，直刺左右盡筋上，以取筋痹，慎無出血，此肝之應也；或曰淵刺；一曰豈刺。四曰合谷刺，合谷刺者，左右雞足，針於分肉之間，以取肌痹，此脾之應也。五曰輸刺，輸刺者，直入直出，深內之至骨，以取骨痹，此腎之應也。","bh":"二曰豹文刺，豹文刺者，左右前后针之，中脉为故（以刺中脉为准），以取经络之血者，此心之应也。三曰关刺，关刺者，直刺左右尽筋上（关节处的筋），以取筋痹，慎无出血，此肝之应也；或曰渊刺；一曰岂刺。四曰合谷刺，合谷刺者，左右（斜刺）如鸡足，针于分肉之间，以取肌痹，此脾之应也。五曰输刺，输刺者，直入直出，深内之至骨，以取骨痹，此肾之应也。","notes":[],"pending":false}]},
{"id":"ls09","book":"灵枢","no":9,"title":"终始","titleTw":"終始","tags":["ci","jingluo","zhenfa"],"brief":"以终始为针道纲领，据人迎脉口盛衰定经脉补泻取穴之法，并论刺禁、得气与六经终绝之候。","pending":false,"sections":[{"id":"ls09-1","tags":[],"yw":"凡刺之道，畢於終始，明知終始，五髒爲紀，陰陽定矣。陰者主髒，陽者主腑，陽受氣於四末，陰受氣於五髒，故瀉者迎之，補者隨之，知迎知隨，氣可令和，和氣之方，必通陰陽。五髒爲陰，六腑爲陽，傳之後世，以血爲盟。敬之者昌，慢之者亡。無道行私，必得夭殃。謹奉天道，請言終始。終始者，經脈爲紀。持其脈口人迎，以知陰陽有餘不足，平與不平，天道畢矣。所謂平人者不病，不病者，脈口人迎應四時也，上下相應而俱往來也，六經之脈不結動也，本末之寒溫之相守司也。","bh":"凡刺之道，毕于终始（都归结于终始）。明知终始，五脏为纪（以五脏为纲纪），阴阳定矣。阴者主脏，阳者主腑；阳受气于四末（四肢末端），阴受气于五脏。所以泻者迎之（迎而夺之），补者随之（随而济之）；知迎知随，气可令和；和气之方（法则），必通阴阳。五脏为阴，六腑为阳。（此道）传之后世，以血为盟（歃血为盟）。敬之者昌，慢之者亡；无道行私（偏私），必得夭殃。谨奉天道，请言终始。终始者，经脉为纪。持（诊察）其脉口（寸口）人迎，以知阴阳有余不足、平与不平，天道毕矣。所谓平人者不病；不病者，脉口人迎应四时也，上下相应而俱往来也，六经之脉不结动（不结滞躁动）也，本末（标本）之寒温之相守司（相互协调）也。","notes":[],"pending":false},{"id":"ls09-2","tags":[],"yw":"形肉血氣必相稱也，是謂平人。少氣者，脈口人迎俱少，而不稱尺寸也。如是者，則陰陽俱不足，補陽則陰竭，瀉陰則陽脫。如是者，可將以甘藥，不可飲以至劑，如此者弗灸。不巳者因而瀉之，則五髒氣壞矣。人迎一盛，病在足少陽，一盛而躁，病在手少陽。人迎二盛，病在足太陽，二盛而躁，病在手太陽，人迎三盛，病在足陽明，三盛而躁，病在手陽明。人迎四盛，且大且數，名曰溢陽，溢陽爲外格。脈口一盛，病在足厥陰；厥陰一盛而躁，在手心主。","bh":"形肉血气必相称也，是谓平人。少气者，脉口人迎俱少，而不称尺寸（与尺寸不相称）也。如是者，则阴阳俱不足；补阳则阴竭，泻阴则阳脱。如是者，可将以甘药（用甘药调养），不可饮以至剂（峻猛之剂），如此者弗灸。不巳（不愈）者因而泻之，则五脏气坏矣。人迎一盛（大于寸口一倍），病在足少阳；一盛而躁，病在手少阳。人迎二盛，病在足太阳；二盛而躁，病在手太阳。人迎三盛，病在足阳明；三盛而躁，病在手阳明。人迎四盛，且大且数（又快），名曰溢阳；溢阳为外格。脉口一盛，病在足厥阴；厥阴一盛而躁，在手心主。","notes":[],"pending":false},{"id":"ls09-3","tags":[],"yw":"脈口二盛，病在足少陰；二盛而躁，在手少陰。脈口三盛，病在足太陰；三盛而躁，在手太陰。脈口四盛，且大且數者，名曰溢陰。溢陰爲內關，內關不通，死不治。人迎與太陰脈口俱盛四倍以上，名曰關格。關格者，與之短期。人迎一盛，瀉足少陽而補足厥陰，二瀉一補，日一取之，必切而驗之，疏取之，上氣和乃止。人迎二盛，瀉足太陽補足少陰，二瀉一補，二日一取之，必切而驗之，疏取之，上氣和乃止。人迎三盛，瀉足陽明而補足太陰，二瀉一補，日二取之，必切而驗之，疏取之，上氣和乃止。","bh":"脉口二盛，病在足少阴；二盛而躁，在手少阴。脉口三盛，病在足太阴；三盛而躁，在手太阴。脉口四盛，且大且数者，名曰溢阴。溢阴为内关；内关不通，死不治。人迎与太阴脉口俱盛四倍以上，名曰关格；关格者，与之短期（近期死期）。人迎一盛，泻足少阳而补足厥阴，二泻一补，日一取之（每日刺一次），必切（切脉）而验之，疏取之（缓取之），上气和乃止。人迎二盛，泻足太阳补足少阴，二泻一补，二日一取之，必切而验之，疏取之，上气和乃止。人迎三盛，泻足阳明而补足太阴，二泻一补，日二取之，必切而验之，疏取之，上气和乃止。","notes":[],"pending":false},{"id":"ls09-4","tags":[],"yw":"脈口一盛，瀉足厥陰而補足少陽，二補一瀉，日一取之，必切而驗之，疏而取，上氣和乃止。脈口二盛，瀉足少陰而補足太陽，二補一瀉，二日一取之，必切而驗之，疏取之，上氣和乃止。脈口三盛，瀉足太陰而補足陽明，二補一瀉，日二取之，必切而驗之，疏而取之，上氣和乃止。所以日二取之者，太、陽主胃，大富於谷氣，故可日二取之也。人迎與脈口俱盛三倍以上，命曰陰陽俱溢，如是者不開，則血脈閉塞，氣無所行，流淫於中，五髒內傷。如此者，因而灸之，則變易而爲他病矣。","bh":"脉口一盛，泻足厥阴而补足少阳，二补一泻，日一取之，必切而验之，疏而取（之），上气和乃止。脉口二盛，泻足少阴而补足太阳，二补一泻，二日一取之，必切而验之，疏取之，上气和乃止。脉口三盛，泻足太阴而补足阳明，二补一泻，日二取之，必切而验之，疏而取之，上气和乃止。所以日二取之者，太（阳）主胃，大富于谷气，故可日二取之也。人迎与脉口俱盛三倍以上，命曰阴阳俱溢；如是者不开（气机不开通），则血脉闭塞，气无所行，流淫于中（内），五脏内伤。如此者，因而灸之，则变易（病变）而为他病矣。","notes":[],"pending":false},{"id":"ls09-5","tags":[],"yw":"凡刺之道，氣調而止，補陰瀉陽，音氣益彰，耳目聰明。反此者，血氣不行。所謂氣至而有效者，瀉則益虛，虛者，脈大如其故而不堅也；堅如其故者，適雖言故，病未去也。補則益實，實者，脈大如其故而益堅也；夫如其故而不堅者，適雖言快，病未去也。故補則實、瀉則虛，痛雖不隨針，病必衰去。必先通十二經脈之所生病，而後可得傳於終始矣。故陰陽不相移，虛實不相傾，取之其經。凡刺之屬，三刺至谷氣，邪僻妄合，陰陽易居，逆順相反，沉浮異處，四時不得，稽留淫泆須針而去。","bh":"凡刺之道，气调而止（气调和就停止针刺）；补阴泻阳（依此调治），音气益彰（声音气息更加彰明），耳目聪明；反此者，血气不行。所谓气至而有效者：泻则益虚；虚者，脉大如其故（如同原来）而不坚（不坚实）也；坚如其故者，适（即使）虽言（病）故（好转），病未去也。补则益实；实者，脉大如其故而益坚也；（若脉）如其故而不坚者，适虽言快（舒适），病未去也。所以补则实、泻则虚，痛虽不随针（不随针立即消除），病必衰去。必先通十二经脉之所生病，而后可得传于终始（之理）矣。所以阴阳不相移（偏移），虚实不相倾（倾覆），取之其经。凡刺之属（针刺之法），三刺至（得）谷气；邪僻（不正之邪）妄合，阴阳易居（错位），逆顺相反，沉浮异处（异位），四时不得（不相应），稽留淫泆（邪气流溢停留），须针而去（须用针去除）。","notes":[],"pending":false},{"id":"ls09-6","tags":[],"yw":"故一刺則陽邪出，再刺則陰邪出，三刺則谷氣至，谷氣至而止。所謂谷氣至者，已補而實，已瀉而虛，故以知谷氣至也。邪氣獨去者，陰與陽未能調而病知愈也。故曰：補則實，瀉則虛，痛雖不隨針，病必衰去矣。陰盛而陽虛，先補其陽，後瀉其陰而和之。陰虛而陽盛，先補其陰，後瀉其陽而和之。三脈動於足大趾之間，必審其實虛，虛而瀉之，是謂重虛。重虛病益甚。凡刺此者，以指按之，脈動而實且疾者疾瀉之，虛而徐者則補之。反此者，病益甚。","bh":"所以一刺则阳邪出，再刺则阴邪出，三刺则谷气至；谷气至而止（针）。所谓谷气至者，已补而实，已泻而虚，故以知谷气至也。（若）邪气独去者，阴与阳未能调而病知愈（可知将愈）也。所以说：补则实，泻则虚，痛虽不随针，病必衰去矣。阴盛而阳虚，先补其阳，后泻其阴而和之。阴虚而阳盛，先补其阴，后泻其阳而和之。三脉动于足大趾之间（足太阴、厥阴、少阴之脉），必审其实虚；虚而泻之，是谓重虚。重虚病益甚。凡刺此者，以指按之，脉动而实且疾者疾泻之，虚而徐（缓）者则补之；反此者，病益甚。","notes":[],"pending":false},{"id":"ls09-7","tags":[],"yw":"其動也，陽明在上，厥陰在中，少陰在下。膺俞中膺，背俞中背，肩膊虛者，取之上。重舌，刺舌柱以鈹針也。手屈而不伸者，其病在筋，伸而不屈者，其病在骨，在骨守骨，在筋守筋。補須一方實，深取之，稀按其痏，以極出其邪氣。一方虛，淺刺之，以養其脈，疾按其痏，無使邪氣得入。邪氣來也緊而疾，谷氣來也徐而和。脈實者深刺之，以泄其氣；脈虛者，淺刺之，使精氣無瀉出，以養其脈，獨出其邪氣。刺諸痛者，其脈皆實。故曰：從腰以上者，手太陰陽明皆主之；從腰以下者，足太陰陽明皆主之。","bh":"其动（脉动之处）也，阳明在上，厥阴在中，少阴在下。膺俞（胸膺之俞）中膺（刺中胸膺），背俞中背（刺中背部）；肩膊虚（肩部软弱）者，取之上（上部之穴）。重舌（舌下肿起），刺舌柱（舌下之柱）以铍针也。手屈而不伸者，其病在筋；伸而不屈者，其病在骨。在骨守骨（治骨），在筋守筋（治筋）。补（泻）须（依）一方实（邪实）者，深取之，稀按其痏（少按针孔），以极出其邪气。一方虚者，浅刺之，以养其脉，疾按其痏（迅速按闭针孔），无使邪气得入。邪气来也紧而疾，谷气来也徐而和。脉实者深刺之，以泄其气；脉虚者，浅刺之，使精气无（不得）泻出，以养其脉，独出其邪气。刺诸痛者，其脉皆实。所以说：从腰以上者，手太阴阳明皆主之；从腰以下者，足太阴阳明皆主之。","notes":[],"pending":false},{"id":"ls09-8","tags":[],"yw":"病在上者下取之；病在下者高取之；病在頭者取之足；病在腰者取之膕。病生於頭者，頭重；生於手者，臂重；生於足者，足重。治病者，先刺其病所從生者也。春氣在毛，夏氣在皮膚，秋氣在分肉，冬氣在筋骨。刺此病者，各以其時爲齊。故刺肥人者，以秋冬之齊，刺瘦人者，以春夏之齊。病痛者，陰也，痛而以手按之不得者，陰也，深刺之。病在上者，陽也。病在下者，陰也。癢者，陽也，淺刺之。病先起陰者，先治其陰，而後治其陽；病先起陽者，先治其陽，而後治其陰。","bh":"病在上者下取之；病在下者高（上）取之；病在头者取之足；病在腰者取之腘（膝腘）。病生于头者，头重；生于手者，臂重；生于足者，足重。治病者，先刺其病所从生（起始）者也。春气在毛，夏气在皮肤，秋气在分肉，冬气在筋骨。刺此（这些）病者，各以其时为齐（以时令为刺治之标准）。所以刺肥人者，以秋冬之齐；刺瘦人者，以春夏之齐。病痛者，阴也，痛而以手按之不得（摸不到痛处）者，阴也，深刺之。病在上者，阳也；病在下者，阴也。痒者，阳也，浅刺之。病先起阴者，先治其阴，而后治其阳；病先起阳者，先治其阳，而后治其阴。","notes":[],"pending":false},{"id":"ls09-9","tags":[],"yw":"刺熱厥者，留針反爲寒；刺寒厥者，留針反爲熱。刺熱厥者，二陰一陽；刺寒厥者，二陽一陰。所謂二陰者，二刺陰也；一陽者，一刺陽也。久病者，邪氣入深。刺此病者，深內而久留之，間日而復刺之，必先調其左右，去其血脈，刺道畢矣。凡刺之法，必察其形氣。形肉未脫，少氣而脈又躁，躁厥者，必爲繆刺之，散氣可收，聚氣可布。深居靜處，佔神往來，閉戶塞牖，魂魄不散，專意一神，精氣之分，毋聞人聲，以收其精，必一其神，令志在針。","bh":"刺热厥者，留针反（转）为寒；刺寒厥者，留针反（转）为热。刺热厥者，二阴一阳；刺寒厥者，二阳一阴。所谓二阴者，二刺阴也；一阳者，一刺阳也。久病者，邪气入深。刺此病者，深内而久留之，间日而复刺之，必先调其左右，去其血脉（瘀血），刺道毕矣。凡刺之法，必察其形气。形肉未脱，少气而脉又躁，躁厥者，必为缪刺之（左病取右、右病取左），散气可收，聚气可布（散）。（医者）深居静处，占（观察）神往来，闭户塞牖（窗），魂魄不散，专意一神，精气之分（辨别精气之分别），毋闻人声，以收其精，必一其神，令志在针。","notes":[],"pending":false},{"id":"ls09-10","tags":[],"yw":"淺而留之，微而浮之，以移其神，氣至乃休。男內女外，堅拒勿出，謹守勿內，是謂得氣。凡刺之禁：新內勿刺，新刺勿內；已醉勿刺，已刺勿醉；新怒勿刺，已刺勿怒；新勞勿刺，已刺勿勞；已飽勿刺，已刺勿飽；已飢勿刺，已刺勿飢；已渴勿刺，已刺勿渴；大驚大恐，必定其氣乃刺之。乘車來者，臥而休之，如食頃乃刺之。出行來者，坐而休之，如行千裏頃乃刺之。凡此十二禁者，其脈亂氣散，逆其營衛，經氣不次，因而刺之，則陽病入於陰，陰病出爲陽，則邪氣復生。","bh":"浅而留之，微而浮之，以移其神（转移病人的注意力），气至乃休（停止）。男内女外，坚拒勿出（谨守住勿使气外泄），谨守勿内（勿使邪气内入），是谓得气。凡刺之禁：新内（刚行房事）勿刺，新刺勿内；已醉勿刺，已刺勿醉；新怒勿刺，已刺勿怒；新劳勿刺，已刺勿劳；已饱勿刺，已刺勿饱；已饥勿刺，已刺勿饥；已渴勿刺，已刺勿渴；大惊大恐，必定其气乃刺之。乘车来者，卧而休之，如食顷（一顿饭的工夫）乃刺之。出行（步行）来者，坐而休之，如行千里顷（走千里路程所需的工夫）乃刺之。凡此十二禁者，其脉乱气散，逆其营卫，经气不次（不按次序），因而刺之，则阳病入于阴，阴病出（而）为阳，则邪气复生。","notes":[],"pending":false},{"id":"ls09-11","tags":[],"yw":"粗工勿察，是謂伐身，形體淫亂，乃消腦髓，津液不化，脫其五味，是謂失氣也。太陽之脈，其終也。戴眼，反折，瘈瘲，其色白，絕皮乃絕汗，絕汗則終矣。少陽終者，耳聾，百節盡縱，目系絕，目系絕，一日半則死矣。其死也，色青白，乃死。陽明終者，口目動作，喜驚、妄言、色黃；其上下之經盛而不行，則終矣。少陰終者，面黑，齒長而垢，腹脹閉塞，上下不通而終矣。厥陰終者，中熱溢干，喜溺，心煩，甚則舌卷，卵上縮而終矣。太陰終者，腹脹閉，不得息，氣噫，善嘔，嘔則逆，逆則面赤，不逆則上下不通，上下不通則面黑，皮毛憔而終矣。","bh":"粗工勿察（不明察这些），是谓伐身（伤害身体）：形体淫乱（气血逆乱），乃消（耗）脑髓，津液不化，脱其五味（丧失五味所养），是谓失气也。太阳之脉，其终（气绝）也：戴眼（两目上视），反折（角弓反张），瘈疭（抽搐），其色白，绝皮（皮肤血气断绝）乃（出）绝汗，绝汗则终矣。少阳终者：耳聋，百节尽纵（弛纵），目系绝；目系绝，一日半则死矣。其死也，色青白，乃死。阳明终者：口目动作（牵引抽动），喜惊、妄言、色黄；其上下之经盛而不行（气血不行），则终矣。少阴终者：面黑，齿长而垢（牙齿显长而有垢），腹胀闭（闭塞），上下不通而终矣。厥阴终者：中热溢干（腹中热而咽喉干燥），喜溺（多尿），心烦，甚则舌卷（舌卷缩），卵（睪丸）上缩而终矣。太阴终者：腹胀闭（闭塞），不得息（不得呼吸），气噫（嗳气），善呕；呕则逆，逆则面赤，不逆则上下不通，上下不通则面黑，皮毛憔（枯憔）而终矣。","notes":[],"pending":false}]},
{"id":"ls11","book":"灵枢","no":11,"title":"经别","titleTw":"經別","tags":["ci","jingluo","zhenfa"],"brief":"论十二经脉别行之正的离合出入与六合相配，说明十二经脉为人之所以生、病之所以成。","pending":false,"sections":[{"id":"ls11-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞人之合於天地道也，內有五髒，以應五音、五色、五時、五味、五位也；外有六腑，以應六律。六律建陰陽諸經而合之十二月、十二辰、十二節、十二經水、十二時、十二經脈者，此五髒六腑之所以應天道。夫十二經脈者，人之所以生，病之所以成，人之所以治，病之所以起，學之所始，工之所止也。粗之所易，上之所難也。請問其離合，出入奈何？岐伯稽首再拜曰：明乎哉問也！此粗之所過，上之所息也，請卒言之。足太陽之正，別入於膕中，其一道下尻五寸，別入於肛，屬於膀胱，散之腎，循膂，當心入散；直者，從膂上出於項，復屬於太陽，此爲一經也。","bh":"黄帝问于岐伯曰：我听说人之合于天地道也：内有五脏，以应五音、五色、五时、五味、五位也；外有六腑，以应六律。六律建（立）阴阳诸经而合之十二月、十二辰、十二节、十二经水、十二时、十二经脉者，此五脏六腑之所以应天道。夫十二经脉者，人之所以生，病之所以成，人之所以治，病之所以起，学之所始，工之所止（医者之所归止）也。粗之所易（以为易），上之所难（以为难）也。请问其离合出入奈何？岐伯稽首再拜曰：明乎哉问也！此粗之所过（忽略），上之所息（留心），请卒言之（请让我详尽地说）。足太阳之正（别行之正经），别入于腘中；其一道（一条支别）下尻（尾骶）五寸，别入于肛（肛门），属于膀胱，散之肾，循膂（脊柱两旁的肌肉），当心入散；直者，从膂上出于项（后颈），复属于太阳，此为一经也。","notes":[],"pending":false},{"id":"ls11-2","tags":[],"yw":"足少陰之正，至膕中，別走太陽而合，上至腎，當十四椎出屬帶脈；直者，系舌本，復出於項，合於太陽，此爲一合。成以諸陰之別，皆爲正也。足少陽之正，繞髀入毛際，合於厥陰，別者入季脅之間，循胸裏屬膽，散之上肝，貫心以上挾咽，出頤頜中，散於面，系目系，合少陽於外眥也。足厥陰之正，別跗上，上至毛際，合於少陽，與別俱行，此爲二合也。足陽明之正，上至脾，入於腹裏屬胃，散之脾，上通於心，上循咽出於口，上頞，還系目系，合於陽明也。","bh":"足少阴之正，至腘中，别走太阳而合（会合），上至肾，当十四椎（第二腰椎）出属带脉；直者，系舌本（舌根），复出于项，合于太阳，此为一合。（以上是）成以诸阴之别（所成的阴经别行），皆为正也。足少阳之正，绕髀（大腿）入毛际（阴毛边缘），合于厥阴；别者入季胁（胁下软肋）之间，循胸里（胸内）属胆，散之（于）上（至）肝，贯心，以上挟咽（咽喉两侧），出颐颌（下颌）中，散于面，系目系，合少阳于外眦（外眼角）也。足厥阴之正，别跗（足背）上，上至毛际，合于少阳，与（少阳之）别俱行，此为二合也。足阳明之正，上至脾（原文如此），入于腹里属胃，散之脾，上通于心，上循咽出于口，上頞（鼻梁），还系目系，合于阳明也。","notes":[],"pending":false},{"id":"ls11-3","tags":[],"yw":"足太陰之正，上至髀，合於陽明，與別俱行，上結於咽，貫舌中，此爲三合也。手太陽之正，指地，別於肩解，入腋走心，系小腸也。手少陰之正，別入於淵腋兩筋之間，屬於心，上走喉嚨，出於面，合目內眥，此爲四合也。手少陽之正，指天，別於巔，入缺盆，下走三焦，散於胸中也。手心主之正，別下淵腋三寸，入胸中，別屬三焦，出循喉嚨，出耳後，合少陽完骨之下，此爲五合也。手陽明之正，從手循膺乳，別於肩髃，入柱骨，下走大腸，屬於肺，上循喉嚨，出缺盆，合於陽明也。","bh":"足太阴之正，上至髀（大腿），合于阳明，与（阳明之）别俱行，上结于咽，贯舌中，此为三合也。手太阳之正，指地（自上而下），别于肩解（肩关节），入腋走心，系小肠也。手少阴之正，别入于渊腋（腋下）两筋之间，属于心，上走喉咙，出于面，合目内眦（内眼角），此为四合也。手少阳之正，指天（自下而上），别于巅（头顶），入缺盆，下走三焦，散于胸中也。手心主之正，别下渊腋三寸，入胸中，别属三焦，出循喉咙，出耳后，合少阳（于）完骨之下，此为五合也。手阳明之正，从手循膺乳（胸乳部），别于肩髃，入柱骨（锁骨），下走大肠，属于肺，上循喉咙，出缺盆，合于阳明也。","notes":[],"pending":false},{"id":"ls11-4","tags":[],"yw":"手太陰之正，別入淵腋少陰之前，入走肺，散之大陽（腸），上出缺盆，循喉嚨，復合陽明，此六合也。","bh":"手太阴之正，别入渊腋（腋下）少阴之前，入走肺，散之大阳（大肠），上出缺盆，循喉咙，复合阳明，此六合也。","notes":[],"pending":false}]},
{"id":"ls12","book":"灵枢","no":12,"title":"经水","titleTw":"經水","tags":["ci","jingluo","zhenfa"],"brief":"以十二经水比类十二经脉，论其内属脏腑、血气多少，而定针刺深浅、留针呼数与灸之壮数。","pending":false,"sections":[{"id":"ls12-1","tags":[],"yw":"黃帝問於岐伯曰：經脈十二者，外合於十二經水，而內屬於五髒六腑。夫十二經水者，其有大小、深淺、廣狹、遠近各不同；五髒六腑之高下、大小、受谷之多少亦不等，相應奈何？夫經水者，受水而行之；五髒者，合神氣魂魄而藏之；六腑者，受谷而行之，受氣而揚之；經脈者，受血而營之。合而以治，奈何？刺之深淺，灸之壯數，可得聞乎？岐伯答曰：善哉問也！天至高不可度，地至廣不可量，此之謂也。且夫人生於天地之間，六合之內，此天之高，地之廣也，非人力之所能度量而至也。","bh":"黄帝问于岐伯曰：经脉十二者，外合于十二经水（十二条河流），而内属于五脏六腑。夫十二经水者，其有大小、深浅、广狭、远近各不同；五脏六腑之高下、大小、受谷之多少亦不等，相应奈何（它们相应的情形如何）？夫经水者，受水而行之；五脏者，合神气魂魄而藏之；六腑者，受谷而行之，受气而扬（布散）之；经脉者，受血而营（营运）之。合而以治（把它们配合起来用以治病），奈何？刺之深浅，灸之壮数，可得闻乎？岐伯回答曰：善哉问也！天至高不可度，地至广不可量，此之谓也。且夫人生于天地之间，六合（四方上下）之内，此天之高、地之广也，非人力之所能度量而至也。","notes":[],"pending":false},{"id":"ls12-2","tags":[],"yw":"若夫八尺之士，皮肉在此，外可度量切循而得之，其死可解剖而視之。其藏之堅脆，腑之大小，谷之多少，脈之長短，血之清濁，氣之多少，十二經之多血少氣，與其少血多氣，與其皆多血氣，與其皆少血氣，皆有大數。其治以針艾，各調其經氣，固其常有合乎。黃帝曰：餘聞之，快於耳不解於心，願卒聞之。岐伯答曰：此人之所以參天地而應陰陽也，不可不察。足太陽外合清水，內屬於膀胱，而通水道焉。足少陽外合於渭水，內屬於膽。足陽明外合於海水，內屬於胃。","bh":"若夫八尺之士（身高八尺的人），皮肉在此（体表），外可度量切循（按循）而得之，其死可解剖而视之。其脏之坚脆，腑之大小，谷之多少，脉之长短，血之清浊，气之多少，十二经之多血少气，与其少血多气，与其皆多血气，与其皆少血气，皆有大数（一定的常规）。其治以针艾（针刺艾灸），各调其经气，固其常有合乎（本来就有常法与之相符）。黄帝曰：我闻之，快于耳不解于心（听起来畅快而心中不解），愿卒闻之。岐伯回答曰：此人之所以参天地而应阴阳也，不可不察。足太阳外合清水，内属于膀胱，而通水道焉。足少阳外合于渭水，内属于胆。足阳明外合于海水，内属于胃。","notes":[],"pending":false},{"id":"ls12-3","tags":[],"yw":"足太陰外合於湖水，內屬於脾。足少陰外合於汝水，內屬於腎。足厥陰外合於澠水，內屬於肝。手太陽外合於淮水，內屬於小腸，而水道出焉。手少陽外合於漯水，內屬於三焦。手陽明外合於江水，內屬於大腸。手太陰外合於河水，內屬於肺。手少陰外合濟水，內屬於心。手心主外合於漳水，內屬於心包。凡此五髒六腑十二經水者，外有源泉，而內有所稟，此皆內外相貫，如環無端，人經亦然。故天爲陽，地爲陰，腰以上爲天，腰以下爲地。故海以北者爲陰，湖以北者爲陰中之陰；漳以南者爲陽，河以北至漳者爲陽中之陰；漯以南至江者，爲陽中之太陽，此一隅之陰陽也，所以人與天地相參也。","bh":"足太阴外合于湖水，内属于脾。足少阴外合于汝水，内属于肾。足厥阴外合于渑水，内属于肝。手太阳外合于淮水，内属于小肠，而水道出焉。手少阳外合于漯水，内属于三焦。手阳明外合于江水，内属于大肠。手太阴外合于河水，内属于肺。手少阴外合济水，内属于心。手心主外合于漳水，内属于心包。凡此五脏六腑十二经水者，外有源泉，而内有所禀（禀受），此皆内外相贯，如环无端，人经亦然。所以天为阳，地为阴，腰以上为天，腰以下为地。所以海以北者为阴，湖以北者为阴中之阴；漳以南者为阳，河以北至漳者为阳中之阴；漯以南至江者，为阳中之太阳。此一隅（一个方面）之阴阳也，所以人与天地相参（相应）也。","notes":[],"pending":false},{"id":"ls12-4","tags":[],"yw":"黃帝曰：夫經水之應經脈也，其遠近淺深，水血之多少，各不同，合而以刺之奈何？岐伯答曰：足陽明，五髒六腑之海也，其脈大，血多氣盛，熱壯，刺此者不深勿散，不留不瀉也。足陽明刺深六分，留十呼。足太陽深五分，留七呼。足少陽深四分，留五呼。足太陰深三分，留四呼。足少陰深二分，留三呼。足厥陰深一分，留二呼。手之陰陽，其受氣之道近，其氣之來疾，其刺深者，皆無過二分，其留，皆無過一呼。其少長、大小、肥瘦，以心擦之，命曰法天之常，灸之亦然。","bh":"黄帝曰：夫经水之应经脉也，其远近浅深、水血之多少，各不同，合而以刺之奈何？岐伯回答曰：足阳明，五脏六腑之海也，其脉大，血多气盛，热壮；刺此者不深勿散（不深刺则邪不散），不留不泻（不留针则邪不泻）。足阳明刺深六分，留十呼（十次呼吸的时间）。足太阳深五分，留七呼。足少阳深四分，留五呼。足太阴深三分，留四呼。足少阴深二分，留三呼。足厥阴深一分，留二呼。手之阴阳，其受气之道近，其气之来疾（快）；其刺深者，皆无过二分；其留（针），皆无过一呼。其少长、大小、肥瘦（的不同），以心（揣度）撩（揆度）之，命曰法天之常（效法天地之常法）；灸之亦然。","notes":[],"pending":false},{"id":"ls12-5","tags":[],"yw":"灸而過此者，得惡火則骨枯脈澀，刺而過此者，則脫氣。黃帝曰：夫經脈之大小，血之多少，膚之厚薄，肉之堅脆及膕之大小，可爲量度乎？岐伯答曰：其可爲度量者，取其中度也。不甚脫肉，而血氣不衰也。若夫度之人，消瘦而形肉脫者，惡可以度量刺乎。審、切、循、捫、按，視其寒溫盛衰而調之，是謂因適而爲之真也。","bh":"灸而过此（限度）者，得恶火（火热太过为害）则骨枯脉涩；刺而过此者，则脱气。黄帝曰：夫经脉之大小，血之多少，肤之厚薄，肉之坚脆及腘（膝腘）之大小，可为量度乎？岐伯回答曰：其可为度量者，取其中度（中等适度之人）也，不甚脱肉，而血气不衰也。若夫度之人（至于被度量的人），消瘦而形肉脱（肌肉消脱）者，恶可以度量刺乎（怎么可以用常法度量而刺呢）。（必须）审、切、循、扪、按（各种诊法），视其寒温盛衰而调之，是谓因适（随其适宜）而为之真（真正的治法）也。","notes":[],"pending":false}]},
{"id":"ls13","book":"灵枢","no":13,"title":"经筋","titleTw":"經筋","tags":["ci","jingluo","zhenfa"],"brief":"论十二经筋的起止循行、发病表现与燔针劫刺治法，按十二个月配属经筋而命名诸痹。","pending":false,"sections":[{"id":"ls13-1","tags":[],"yw":"足太陽之筋，起於足小趾，上結於踝，邪上結於膝，其下循足外側，結於踵，上循跟，結於膕；其別者，結於腨外，上膕中內廉，與膕中並上結於臀，上挾脊上項；其支者，別入結於舌本；其直者，結於枕骨，上頭，下顏，結於鼻；其支者，爲目上網，下結於頄；其支者，從腋後外廉結於肩髃；其支者，入腋下，上出缺盆，上結於完骨；其支者，出缺盆，邪上出於頄。其病小趾支跟腫痛，膕攣，脊反折，項筋急，肩不舉，腋支缺盆中紐痛，不可左右搖。","bh":"足太阳的经筋，起于足小趾，上行结于踝部，斜行向上结于膝部；它下行的分支沿足外侧走行，结于足跟，再沿足跟上行，结于腘窝；它的分支，结于小腿肚外侧，上行到腘窝内侧缘，与腘窝部的筋并行而上，结于臀部，再挟脊柱上行至项部；它的一条分支，另行入内结于舌根；它直行的主干，结于枕骨，上行到头部，下行到颜面，结于鼻部；它的分支，成为眼胞上的网，向下结于颧部；它的分支，从腋后外侧缘结于肩髃；它的分支，进入腋下，上行出于缺盆，再上行结于完骨；它的分支，出于缺盆，斜行向上出于颧部。它发病可见小趾与足跟支撑不适而肿痛，腘窝拘挛，脊柱反折，项部筋急，肩不能抬举，腋部支撑不适、缺盆中如纽结作痛，身体不能左右摇动。","notes":[],"pending":false},{"id":"ls13-2","tags":[],"yw":"治在燔針劫刺，以知爲數，以痛爲輸，名曰仲春痹也。足少陽之筋，起於小指次指，上結外踝，上循脛外廉，結於膝外廉；其支者，別起外輔骨，上走髀，前者結於伏兔之上，後者，結於尻；其直者，上乘沙季脅，上走腋前廉，系於膺乳，結於缺盆；直者，上出腋，貫缺盆，出太陽之前，循耳後，上額角，交巔上，下走頷，上結於頄；支者，結於目眥爲外維。其病小指次指支轉筋，引膝外轉筋，膝不可屈伸，膕筋急，前引髀，後引尻，即上乘(月少)季脅痛，上引缺盆、膺乳、頸維筋急。","bh":"治疗用燔针（火针）劫刺，以见效为度，以疼痛处为腧穴，这名叫仲春痹。足少阳的经筋，起于小趾次趾，上行结于外踝，再沿胫部外侧缘上行，结于膝部外侧缘；它的分支，另起于外辅骨，上行走向大腿，其中前行的结于伏兔之上，后行的结于尾骶部；它直行的主干，上行乘于季胁，再上行走向腋前缘，连系于胸膺乳房部，结于缺盆；直行的，上行出于腋部，贯穿缺盆，出于足太阳经筋之前，沿耳后上行至额角，交会于巅顶，再下行走向下颌，上行结于颧部；分支的，结于目外眦，成为眼的外维。它发病可见小趾次趾支撑不适、转筋，牵引膝部外侧转筋，膝不能屈伸，腘窝筋急，向前牵引大腿，向后牵引尾骶，进而上乘季胁作痛，向上牵引缺盆、胸膺乳房与颈部，维筋拘急。","notes":[],"pending":false},{"id":"ls13-3","tags":[],"yw":"從左之右，右目不開，上過右角，並蹻脈而行，左絡於右，故傷左角，右足不用，命曰維筋相交。治在燔針劫刺，以知爲數，以痛爲輸，名曰孟春痹也。足陽明之筋，起於中三指，結於跗上，邪外上加於輔骨，上結於膝外廉，直上結於髀樞，上循脅屬脊；其直者，上循(骨干)，結於膝；其支者，結於外輔骨，合少陽；其直者，上循伏兔，上結於髀，聚於陰器，上腹而布，至缺盆而結，上頸，上挾口，合於頄，下結於鼻，上合於太陽。太陽爲目上網，陽明爲目下網；其支者，從頰結於耳前。","bh":"从左至右，右目不能张开，筋上行经过右额角，与𫏋脉并行，左侧的筋联络于右侧，所以左侧额角受伤，右足就不能活动，这名叫维筋相交。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴，这名叫孟春痹。足阳明的经筋，起于中间三趾，结于足背上，斜行向外上方加于辅骨，上行结于膝部外侧缘，直上结于髀枢，再沿胁部上行而联属于脊柱；它直行的，沿胫骨上行，结于膝部；它的分支，结于外辅骨，与足少阳的经筋相合；它直行的，沿伏兔上行，上结于大腿，会聚于阴器，再上行至腹部而布散，到缺盆而结聚，上行至颈部，上行挟口，会合于颧部，下行结于鼻，上行与足太阳相合。足太阳为眼胞上网，足阳明为眼胞下网；它的分支，从颊部结于耳前。","notes":[],"pending":false},{"id":"ls13-4","tags":[],"yw":"其病足中指支脛轉筋，腳跳堅，伏兔轉筋，髀前踵，(疒貴)疝，腹筋急，引缺盆及頰，卒口僻；急者，目不合，熱則筋縱，目不開，頰筋有寒，則急，引頰移口，有熱則筋弛縱，緩不勝收，故僻。治之以馬膏，膏其急者；以白酒和桂，以塗其緩者，以桑鉤鉤之，即以生桑炭置之坎中，高下以坐等。以膏熨急頰，且飲美酒，敢美炙肉，不飲酒者，自強也，爲之三拊而已。治在燔針劫刺，以知爲數，以痛爲輸，名曰季春痹也。足太陰之筋，起於大指之端內側，上結於內踝；其直者，絡於膝內輔骨，上循陰股，結於髀，聚於陰器，上腹結於臍，循腹裏，結於肋，散於胸中；其內者，着於脊。","bh":"它发病可见足中趾支撑不适、胫部转筋，脚部跳动强直，伏兔部转筋，大腿前部肿，㿉疝，腹部的筋拘急，牵引缺盆及颊部，突然发生口僻（口眼歪斜）；拘急的，眼不能闭合；有热则筋弛纵，眼不能睁开。颊部的筋受寒，就拘急，牵引颊部使口角移动；有热则筋弛缓纵长，缓而不能收持，所以发生口僻。治法用马膏，膏敷在拘急的一侧；用白酒调和桂末，涂在弛缓的一侧，用桑钩钩住口角，再把生桑炭放在地坎中，高低以人坐着相称为度。用膏熨敷拘急的颊部，同时饮美酒，吃精美的烤肉，不饮酒的人也要勉强自己如此，再用手抚摩患处三次就可以了。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴，这名叫季春痹。足太阴的经筋，起于大趾端的内侧，上行结于内踝；它直行的，联络于膝部内侧的辅骨，沿阴股上行，结于大腿，会聚于阴器，上行至腹部结于脐，再沿腹内走行，结于肋部，散于胸中；它贴附于内的，附着于脊柱。","notes":[],"pending":false},{"id":"ls13-5","tags":[],"yw":"其病足大指支內踝痛，轉筋痛，膝內輔骨痛，陰股引髀而痛，陰器紐痛，上引臍兩脅痛，引膺中脊內痛。治在燔針劫刺，以知爲數，以痛爲輸，命曰孟秋痹也。足少陰之筋，起於小指之下，並足太陰之筋，邪走內踝之下，結於踵，與太陽之筋合，而上結於內輔之下，並太陰之筋，而上循陰股，結於陰器，循脊內挾膂上至項，結於枕骨，與足太陽之筋合。其病足下轉筋，及所過而結者皆痛及轉筋。病在此者，主癎瘈及痙，在外者不能挽，在內者不能仰。","bh":"它发病可见足大趾支撑不适、内踝痛，转筋疼痛，膝内侧辅骨痛，阴股牵引大腿而痛，阴器如纽结作痛，向上牵引脐部与两胁痛，并牵引胸膺中及脊柱内作痛。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴，名叫孟秋痹。足少阴的经筋，起于小趾之下，与足太阴的经筋并行，斜行走向内踝之下，结于足跟，与足太阳的经筋相合，再上行结于内侧辅骨之下，与足太阴的经筋并行而上，沿阴股上行，结于阴器，沿脊柱内侧挟膂肉上行至项部，结于枕骨，与足太阳的经筋相合。它发病可见足下转筋，以及经筋所经过、所结聚之处都疼痛并转筋。患这种病的，主发痫、瘛疭及痉证，病在外的不能俯身向前，在内的不能仰身向后。","notes":[],"pending":false},{"id":"ls13-6","tags":[],"yw":"故陽病者，腰反折不能俛，陰病者，不能仰。治在燔針劫刺，以知爲數，以痛爲輸。在內者熨引飲藥，此筋折紐，紐發數甚者死不治，名曰仲秋痹也。足厥陰之筋，起於大指之上，上結於內踝之前，上循脛，上結內輔之下，上循陰股，結於陰器，絡諸筋。其病足大指支內踝之前痛，內輔痛，陰股痛轉筋，陰器不用，傷於內則不起，傷於寒則陰縮入，傷於熱則縱挺不收，治在行水清陰氣；其病轉筋者，治在燔針劫刺，以知爲數，以痛爲輸，命曰季秋痹也。","bh":"所以阳病的，腰背反折不能俯身向前；阴病的，不能仰身向后。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴。在内的用熨法、导引并服汤药；这种筋折扭结、扭结发作频繁而重的，是不治的死证，名叫仲秋痹。足厥阴的经筋，起于大趾之上，上行结于内踝之前，沿胫部上行，结于内侧辅骨之下，再沿阴股上行，结于阴器，联络诸筋。它发病可见足大趾支撑不适、内踝之前痛，内侧辅骨痛，阴股痛而转筋，阴器不用；伤于房室内事则阴茎不起，伤于寒则阴器缩入，伤于热则阴茎纵缓挺举不收，治疗在于通行水液、清泄阴分的邪热；它出现转筋的，治疗用燔针劫刺，以见效为度，以疼痛处为腧穴，名叫季秋痹。","notes":[],"pending":false},{"id":"ls13-7","tags":[],"yw":"手太陽之筋，起於小指之上，結於腕，上循臂內廉，結於肘內銳骨之後，彈之應小指之上，入結於腋下；其支者，後走腋後廉，上繞肩胛，循頸出走太陽之前，結於耳後完骨；其支者，入耳中；直者，出耳上，下結於頷，上屬目外眥。其病小指支肘內銳骨後廉痛，循臂陰，入腋下，腋下痛，腋後廉痛，繞肩胛引頸而痛，應耳中鳴痛引頷，目瞑良久乃得視，頸筋急，則爲筋痿頸腫，寒熱在頸者。治在燔針劫刺之，以知爲數，以痛爲輸。其爲腫者，復而銳之。","bh":"手太阳的经筋，起于小指之上，结于腕部，沿臂内侧缘上行，结于肘部内侧锐骨之后，弹拨此处感应传到小指之上，再入内结于腋下；它的分支，向后走向腋后缘，上行绕过肩胛，沿颈部出于足太阳经筋之前，结于耳后的完骨；它的分支，进入耳中；直行的，出于耳上，下行结于下颌，上行连属目外眦。它发病可见小指支撑不适、肘内侧锐骨后缘痛，沿臂内侧入腋下，腋下痛，腋后缘痛，绕过肩胛牵引颈部作痛，耳中鸣响并牵引下颌作痛，两目闭合良久才能视物；颈部筋急，就成为筋痿、颈肿，这是寒热在颈部的病。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴。已成肿的，再用锐针刺治。","notes":[],"pending":false},{"id":"ls13-8","tags":[],"yw":"本支者，上曲牙，循耳前屬目外眥，上頷結於角，其痛當所過者支轉筋。治在燔針劫刺，以知爲數，以痛爲輸，名曰仲夏痹也。手少陽之筋，起於小指次指之端，結於腕，中循臂，結於肘，上繞臑外廉、上肩、走頸，合手太陽；其支者，當曲頰入系舌本；其支者，上曲牙，循耳前，屬目外眥，上乘頷，結於角。其病當所過者，即支轉筋，舌卷。治在燔針劫刺，以知爲數，以痛爲輸，名曰季夏痹也。手陽明之筋，起於大指次指之端，結於腕，上循臂，上結於肘外，上臑，結於髃；其支者，繞肩胛，挾脊；直者，從肩髃上頸；其支者，上頰，結於頄；直者，上出手太陽之前，上左角，絡頭，下右頷。","bh":"本支的，上行至曲牙，沿耳前连属目外眦，上行至下颌而结于额角，它发病疼痛就在经筋经过之处支撑不适、转筋。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴，名叫仲夏痹。手少阳的经筋，起于小指次指之端，结于腕部，沿臂中间上行，结于肘部，上行绕过上臂外侧缘、上肩、走向颈部，与手太阳的经筋相合；它的分支，正当曲颊部进入连系舌根；它的分支，上行至曲牙，沿耳前，连属目外眦，上行乘于下颌，结于额角。它发病就在经筋经过之处支撑不适、转筋，舌卷缩。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴，名叫季夏痹。手阳明的经筋，起于大指次指之端，结于腕部，沿臂上行，上行结于肘部外侧，上行于上臂，结于肩髃；它的分支，绕过肩胛，挟脊柱；直行的，从肩髃上行至颈部；它的分支，上行至颊部，结于颧部；直行的，上行出于手太阳经筋之前，上行至左额角，联络头部，下行至右颔。","notes":[],"pending":false},{"id":"ls13-9","tags":[],"yw":"其病當所過者，支痛及轉筋，肩不舉，頸不可左右視。治在燔針劫刺，以知爲數，以痛爲輸，名曰孟夏痹也。手太陰之筋，起於大指之上，循指上行，結於魚後，行寸口外側，上循臂，結肘中，上臑內廉，入腋下，出缺盆，結肩前髃，上結缺盆，下結胸裏，散貫賁，合賁下抵季脅。其病當所過者，支轉筋，痛甚成息賁，脅急吐血。治在燔針劫刺，以知爲數，以痛爲輸。名曰仲冬痹也。手心主之筋，起於中指，與太陰之筋並行，結於肘內廉，上臂陰，結腋下，下散前後挾脅；其支者，入腋，散胸中，結於臂。","bh":"它发病就在经筋经过之处支撑不适、疼痛及转筋，肩不能抬举，颈不能左右顾视。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴，名叫孟夏痹。手太阴的经筋，起于大指之上，沿指上行，结于鱼际之后，行于寸口外侧，再沿臂上行，结于肘中，上行于上臂内侧缘，进入腋下，出于缺盆，结于肩前髃，上行结于缺盆，下行结于胸内，分散贯穿贲门，会合贲门下方而抵达季胁。它发病就在经筋经过之处支撑不适、转筋，疼痛严重的成为息贲，胁部拘急、吐血。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴，名叫仲冬痹。手心主的经筋，起于中指，与手太阴的经筋并行，结于肘部内侧缘，上行于臂内侧，结于腋下，下行分散于前后而挟胁部；它的分支，进入腋部，散于胸中，结于臂部。","notes":[],"pending":false},{"id":"ls13-10","tags":[],"yw":"其病當所過者，支轉筋前及胸痛息賁。治在燔針劫刺，以知爲數，以痛爲輸，名曰孟冬痹也。手太陰之筋，起於小指之內側，結於銳骨，上結肘內廉，上入腋，交太陰，挾乳裏，結於胸中，循臂下系於臍。其病內急心承伏梁，下爲肘網。其病當所過者，支轉筋，筋痛。治在燔針劫刺，以知爲數，以痛爲輸。其成伏梁唾血膿者，死不治。經筋之病，寒則反折筋急，熱則筋弛縱不收，陰痿不用。陽急則反折，陰急則俯不伸。焠刺者，刺寒急也，熱則筋縱不收，無用燔針，名曰季冬痹也。","bh":"它发病就在经筋经过之处支撑不适、转筋，向前涉及胸痛、息贲。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴，名叫孟冬痹。手太阴之筋（按：此据原文，实为手少阴之筋），起于小指内侧，结于锐骨，上行结于肘内侧缘，上行进入腋部，与手太阴之筋相交，挟乳房内侧，结于胸中，沿臂下行连系于脐。它发病可见内里拘急、心下承伏梁（心下积块），下部成为肘部的网结。它发病在经筋经过之处支撑不适、转筋，筋痛。治疗用燔针劫刺，以见效为度，以疼痛处为腧穴。已成伏梁而吐血脓的，是不治的死证。经筋的病，受寒则筋反折拘急，受热则筋弛纵不收，阴器萎弱不用。阳经的筋拘急则腰背反折，阴经的筋拘急则俯身不能伸直。用焠刺（火针）的，是刺寒而筋急的；热证则筋纵弛不收，不可用燔针，名叫季冬痹。","notes":[],"pending":false},{"id":"ls13-11","tags":[],"yw":"足之陽明，手之太陽，筋急則口目爲僻，眥急不能卒視，治皆如右方也。","bh":"足阳明、手太阳的筋拘急，就会口眼歪斜，眼角拘急不能猝然视物，治法都如同上面所说的方法。","notes":[],"pending":false}]},
{"id":"ls14","book":"灵枢","no":14,"title":"骨度","titleTw":"骨度","tags":["jingluo","zhenfa","zhize"],"brief":"记载常人身长七尺五寸时头面胸腹四肢各骨节的标准尺寸，作为测定经脉长短的依据。","pending":false,"sections":[{"id":"ls14-1","tags":[],"yw":"黃帝問於伯高曰：脈度言經脈之長短，何以立之？伯高曰：先度其骨節之大小、廣狹、長短，而脈度定矣。黃帝曰：願聞衆人之度。人長七尺五寸者，其骨節之大小長短各幾何？伯高曰：頭之大骨圍，二尺六寸，胸圍四尺五寸。腰圍四尺二寸。發所覆者顱至項，尺二寸。發以下至頤，長一尺，君子終折。結喉以下至缺盆中，長四寸。缺盆以下至(骨曷)(骨虧)，長九寸，過則肺大，不滿則肺小。(骨曷)(骨虧)以下至天樞，長八寸，過則胃大，不及則胃小。","bh":"黄帝问伯高说：脉度讲经脉的长短，是根据什么确定的？伯高说：先度量骨节的大小、宽窄、长短，脉度就可以确定了。黄帝说：想听听常人的骨度。身长七尺五寸的人，他骨节的大小长短各是多少？伯高说：头的大骨围二尺六寸，胸围四尺五寸，腰围四尺二寸。头发所覆盖的部分，从颅际到项部，长一尺二寸。发际以下到颐（下巴），长一尺，君子到此为终折。结喉以下到缺盆中，长四寸。缺盆以下到蔽心骨（鸠尾），长九寸，超过则肺大，不满则肺小。蔽心骨以下到天枢，长八寸，超过则胃大，不及则胃小。","notes":[],"pending":false},{"id":"ls14-2","tags":[],"yw":"天樞以下至橫骨，長六寸半，過則回腸廣長，不滿則狹短。橫骨，長六寸半。橫骨上廉以下至內輔之上廉，長一尺八寸。內輔之上廉以下至下廉，長三寸半。內輔下廉，下至內踝，長一尺三寸。內踝以下至地，長三寸。膝膕以下至附屬，長一尺六寸。附屬以下至地，長三寸。故骨圍大則太過，小則不及。角以下至柱骨，長一尺。行腋中不見者，長四寸。腋以下至季脅，長一尺二寸。季脅以下至髀樞，長六寸，髀樞以下至膝中，長一尺九寸。膝以下至外踝，長一尺六寸。","bh":"天枢以下到横骨，长六寸半，超过则回肠宽而长，不满则狭而短。横骨长六寸半。横骨上缘以下到内辅骨上缘，长一尺八寸。内辅骨上缘以下到下缘，长三寸半。内辅骨下缘向下到内踝，长一尺三寸。内踝以下到地面，长三寸。膝腘以下到跗属，长一尺六寸。跗属以下到地面，长三寸。所以骨围大的就太过，小的就不及。额角以下到柱骨，长一尺。行于腋中看不见的部分，长四寸。腋以下到季胁，长一尺二寸。季胁以下到髀枢，长六寸。髀枢以下到膝中，长一尺九寸。膝以下到外踝，长一尺六寸。","notes":[],"pending":false},{"id":"ls14-3","tags":[],"yw":"外踝以下至京骨，長三寸。京骨以下至地，長一寸。耳後當完骨者，廣九寸。耳前當耳門者，廣一尺三寸。兩顴之間，相去七寸。兩乳之間，廣九寸半。兩髀之間，廣六寸半。足長一尺二寸，廣四寸半。肩至肘，長一尺七寸；肘至腕，長一尺二寸半。腕至中指本節，長四寸。本節至其末，長四寸半。項發以下至背骨，長二寸半，膂骨以下至尾骶，二十一節，長三尺，上節長一寸四分分之一，奇分在下，故上七節至於膂骨，九寸八分分之七。此衆人骨之度也，所以立經脈之長短也。","bh":"外踝以下到京骨，长三寸。京骨以下到地面，长一寸。耳后正当完骨处的宽度，九寸。耳前正当耳门处的宽度，一尺三寸。两颧之间相距七寸。两乳之间宽九寸半。两髀之间宽六寸半。足长一尺二寸，宽四寸半。肩至肘长一尺七寸；肘至腕长一尺二寸半。腕至中指本节长四寸。本节到指端长四寸半。项后发际以下到背骨，长二寸半；膂骨以下到尾骶，共二十一节，长三尺，上部每节长一寸四分之一，余数在下部，所以上七节到膂骨共长九寸八分之七。这就是常人的骨度，是用来确定经脉长短的依据。","notes":[],"pending":false},{"id":"ls14-4","tags":[],"yw":"是故視其經脈之在於身也，其見浮而堅，其見明而大者，多血，細而沉者，多氣也。","bh":"所以观察经脉在人身上的情况，显现浮浅而坚劲的，显现明显而大的，是多血；细小而沉伏的，是多气。","notes":[],"pending":false}]},
{"id":"ls15","book":"灵枢","no":15,"title":"五十营","titleTw":"五十營","tags":["jingluo","zhenfa","yang"],"brief":"以漏水下百刻、日行二十八宿为度，说明营气一昼夜运行五十周的息数、气行长度与时刻。","pending":false,"sections":[{"id":"ls15-1","tags":[],"yw":"黃帝曰：餘願聞五十營奈何？岐伯答曰：天周二十八宿，宿三十六分；人氣行一周，千八分，日行二十八宿。人經脈上下左右前後二十八脈，周身十六丈二尺，以應二十八宿，漏水下百刻，以分晝夜。故人一呼脈再動，氣行三寸，呼吸定息，氣行六寸；十息，氣行六尺，日行二分。二百七十息，氣行十六丈二尺，氣行交通於中，一周於身，下水二刻，日行二十五分。五百四十息，氣行再周於身，下水四刻，日行四十分。二千七百息，氣行十周於身，下水二十刻，日行五宿二十分。","bh":"黄帝说：我想听听五十营是怎么回事。岐伯回答说：天周有二十八宿，每宿三十六分；人气运行一周，合一千零八分，与日行二十八宿相应。人身经脉上下左右前后共二十八脉，周身长十六丈二尺，以应二十八宿；漏水下百刻，用来划分昼夜。所以人一呼气脉搏动两次，气行三寸，一呼一吸（呼吸定息），气行六寸；十息，气行六尺，日行二分。二百七十息，气行十六丈二尺，气行交通于中，在全身运行一周，漏水下二刻，日行二十五分。五百四十息，气在全身运行两周，漏水下四刻，日行四十分。二千七百息，气在全身运行十周，漏水下二十刻，日行五宿二十分。","notes":[],"pending":false},{"id":"ls15-2","tags":[],"yw":"一萬三千五百息，氣行五十營於身，水下百刻，日行二十八宿，漏水皆盡脈終矣。所謂交通者，並行一數也。故五十營備，得盡天地之壽矣，凡行八百一十丈也。","bh":"一万三千五百息，气在全身运行五十营（五十周），漏水下百刻，日行二十八宿，漏水全部滴尽，脉气也运行到终了。所谓交通，是指并行而合一之数。所以五十营完备，就能享尽天地所赋的寿数，总共气行八百一十丈。","notes":[],"pending":false}]},
{"id":"ls16","book":"灵枢","no":16,"title":"营气","titleTw":"營氣","tags":["zhenfa","bingji","zangxiang"],"brief":"叙述营气受谷于胃、沿十二经依次流注并别行督脉、终而复始的循行路线与逆顺常法。","pending":false,"sections":[{"id":"ls16-1","tags":[],"yw":"黃帝曰：營氣之道，內谷爲寶。谷入於胃，乃傳之肺，流溢於中，布散於外，精專者，行於經隧，常營無已，終而復始，是謂天地之紀。故氣從太陰出注手陽明，上行注足陽明，下行至跗上，注大指間，與太陰合；上行抵髀，從脾注心中；循手少陰，出腋中臂，注小指，合手太陽；上行乘腋，出?內，注目內眥，上巔，下項，合足太陽；循脊，下尻，下行注小指之端，循足心，注足少陰；上行注腎，從腎注心外，散於胸中；循心主脈，出腋，下臂，出兩筋之間，入掌中，出中指之端，還注小指次指之端，合手少陽；上行注羶中，散於三焦，從三焦注膽，出脅，注足少陽；下行至跗上，復從跗注大指間，合足厥陰，上行至肝，從肝上注肺，上循喉嚨，入頏顙之竅，究於畜門。","bh":"黄帝说：营气的道理，以纳入谷物为宝贵。谷物入于胃，乃传之于肺，流溢于中，布散于外，其中精专的部分，运行于经隧，常行不已，终而复始，这叫天地之纪。所以气从手太阴出，注于手阳明，上行注于足阳明，下行至足背上，注于大趾间，与足太阴相合；上行抵达髀部，从脾注于心中；循手少阴脉，出于腋下，下行于臂，注于小指，与手太阳相合；上行乘腋部，出于目下，注目内眦，上行至巅顶，下行项部，与足太阳相合；沿脊柱下行至尾骶，再下行注于小趾之端，沿足心注于足少阴；上行注于肾，从肾注于心外，散于胸中；循手心主之脉，出于腋下，下行于臂，出于两筋之间，入于掌中，出于中指之端，还回注于小指次指之端，与手少阳相合；上行注于膻中，散于三焦，从三焦注于胆，出于胁部，注于足少阳；下行至足背上，再从足背注于大趾间，与足厥阴相合，上行至肝，从肝上行注于肺，上循喉咙，入于颃颡之窍，而终究于畜门（鼻后孔）。","notes":[],"pending":false},{"id":"ls16-2","tags":[],"yw":"其支別者，上額，循巔，下項中，循脊，入骶，是督脈也；絡陰器，上過毛中，入臍中，上循腹裏，入缺盆，下注肺中，復出太陰。此營氣之所行也，逆順之常也。","bh":"它的分支另行的，上行至额部，沿巅顶，下行项部中间，沿脊柱入于骶部，这是督脉；联络阴器，上行经过毛际之中，入于脐中，上行沿腹内，入于缺盆，下行注于肺中，再从手太阴而出。这就是营气所运行的路线，是逆顺的常规。","notes":[],"pending":false}]},
{"id":"ls17","book":"灵枢","no":17,"title":"脉度","titleTw":"脈度","tags":["ci","jingluo","zhenfa"],"brief":"列举二十八脉长度合为十六丈二尺，并论五脏与七窍相通、关格病机及𫏋脉的起止循行。","pending":false,"sections":[{"id":"ls17-1","tags":[],"yw":"黃帝曰：願聞脈度。岐伯答曰：手之六陽，從手至頭，長五尺，五六三丈。手之六陰，從手至胸中，三尺五寸，三六一丈八尺，五六三尺，合二丈一尺。足之六陽，從足上至頭，八尺，六八四丈八尺。足之六陰，從足至胸中，六尺五寸，六六三丈六尺，五六三尺合三丈九尺。蹻脈從足至目，七尺五寸，二七一丈四尺，二五一尺，合一丈五尺。督脈、任脈，各四尺五寸，二四八尺，二五一尺，合九尺。凡都合一十六丈二尺，此氣之大經隧也。經脈爲裏，支而橫者爲絡，絡之別者爲孫，盛而血者疾誅之，盛者瀉之，虛者飲藥以補之。","bh":"黄帝说：想听听脉度。岐伯回答说：手的六条阳经，从手至头，长五尺，五六共三丈。手的六条阴经，从手至胸中，长三尺五寸，三六一丈八尺，五六三尺，合为二丈一尺。足的六条阳经，从足上行至头，长八尺，六八四丈八尺。足的六条阴经，从足至胸中，长六尺五寸，六六三丈六尺，五六三尺，合为三丈九尺。𫏋脉从足至目，长七尺五寸，二七一丈四尺，二五一尺，合为一丈五尺。督脉、任脉各长四尺五寸，二四八尺，二五一尺，合为九尺。总计合一十六丈二尺，这是气运行的大经隧。经脉为里，分支而横行的为络，络的分支为孙络；络脉盛而有血的，赶快刺去其血，盛的用泻法，虚的服药以补之。","notes":[],"pending":false},{"id":"ls17-2","tags":[],"yw":"五藏常內閱於上七竅也。故肺氣通於鼻，肺和則鼻能知臭香矣；心氣通於舌，心和則舌能知五味矣；肝氣通於目，肝和則目能辨五色矣；脾氣通於口，脾和則口能知五谷矣；腎氣通於耳，腎和則耳能聞五音矣。五髒不和，則七竅不通；六腑不合則留爲癰。故邪在腑則陽脈不和，陽脈不和則氣留之，氣留之則陽氣盛矣。陽氣太盛，則陰不利，陰脈不利則血留之，血留之則陰氣盛矣。陰氣太盛則陽氣不能榮也，故曰關。陽氣太盛，則陰氣弗能榮也，故曰格。","bh":"五脏的精气常上通于头面七窍。所以肺气通于鼻，肺和则鼻能辨别香臭；心气通于舌，心和则舌能辨别五味；肝气通于目，肝和则目能辨别五色；脾气通于口，脾和则口能辨别五谷之味；肾气通于耳，肾和则耳能听闻五音。五脏不和，则七窍不通；六腑不和，则邪气留滞而成痈。所以邪在腑则阳脉不和，阳脉不和则气留滞，气留滞则阳气盛。阳气太盛则阴脉不利，阴脉不利则血留滞，血留滞则阴气盛。阴气太盛则阳气不能营运于内，所以叫关。阳气太盛则阴气不能营运于外，所以叫格。","notes":[],"pending":false},{"id":"ls17-3","tags":[],"yw":"陰陽俱盛，不得相榮，故曰關格。關格者，不得盡期而死也。黃帝曰：蹻脈安起安止，何氣榮水？岐伯答曰：蹻脈者，少陰之別，起於然骨之後。上內踝之上，直上循陰股，入陰，上循胸裏，入缺盆，上出人迎之前，入頄，屬目內眥，合於太陽，陽蹻而上行，氣並相還，則爲濡，目氣不榮，則目不合。黃帝曰：氣獨行五髒，不榮六腑，何也？岐伯答曰：氣之不得無行也，如水之流，如日月之行不休，故陰脈榮其髒，陽脈榮其腑，如環之無端，莫知其紀，終而復始，其流溢之氣，內溉髒腑，外濡腠理。","bh":"阴阳俱盛，不能相互营运，所以叫关格。患关格的，不能活到应有的寿数而死。黄帝说：𫏋脉从哪里起到哪里止，是何气使它营运濡润？岐伯回答说：𫏋脉是足少阴的别脉，起于然骨之后，上行于内踝之上，直上沿阴股，入于阴器，上行沿胸内，入于缺盆，上行出于人迎之前，入于颧部，连属目内眦，与足太阳相合，阳𫏋而上行，气并行相还，则为濡润；目气不得濡养，则目不能闭合。黄帝说：气只运行五脏，不营运六腑，是为什么？岐伯回答说：气是不能不运行的，如水之流，如日月之行永不休止，所以阴脉营运其脏，阳脉营运其腑，如环无端，不知其纪，终而复始。它流溢之气，内灌溉脏腑，外濡润腠理。","notes":[],"pending":false},{"id":"ls17-4","tags":[],"yw":"黃帝曰：蹻脈有陰陽，何脈當其數？岐伯曰：男子數其陽，女子數其陰，當數者爲陰，其不當數者爲絡也。","bh":"黄帝说：𫏋脉有阴阳，哪一条脉计入脉度之数？岐伯说：男子计其阳𫏋，女子计其阴𫏋；计入脉度的为经，那不计入的为络。","notes":[],"pending":false}]},
{"id":"ls18","book":"灵枢","no":18,"title":"营卫生会","titleTw":"營衛生會","tags":["jingluo","zhenfa","bingji"],"brief":"论营卫的生成、运行与会合，三焦的部位与功能，并释老少睡眠差异、漏泄与饮酒小便先下。","pending":false,"sections":[{"id":"ls18-1","tags":[],"yw":"黃帝問於岐伯曰：人焉受氣？陰陽焉會？何氣爲營？何氣爲衛？營安從生？衛於焉會？老壯不同氣，陰陽異位，願聞其會。岐伯答曰：人受氣於谷，谷入於胃，以傳與肺，五髒六腑，皆以受氣，其清者爲營，濁者爲衛，營在脈中，衛在脈外，營周不休，五十度而復大會，陰陽相貫，如環無端，衛氣行於陰二十五度，行於陽二十五度，分爲晝夜，故氣至陽而起，至陰而止。故曰日中而陽隴，爲重陽，夜半而陰隴爲重陰，故太陰主內，太陽主外，各行二十五度分爲晝夜。","bh":"黄帝问岐伯说：人从哪里受气？阴阳在哪里会合？什么气为营？什么气为卫？营从哪里生？卫在哪里会合？老年与壮年之气不同，阴阳异位，想听听它们会合的情况。岐伯回答说：人受气于谷物，谷物入于胃，以传与肺，五脏六腑都因而受气，其中清的为营，浊的为卫，营在脉中，卫在脉外，营气运行不休，行五十度而复大会，阴阳相贯，如环无端；卫气行于阴二十五度，行于阳二十五度，分为昼夜，所以气至阳而起，至阴而止。所以说日中而阳气隆盛，为重阳；夜半而阴气隆盛，为重阴。所以太阴主内，太阳主外，各行二十五度，分为昼夜。","notes":[],"pending":false},{"id":"ls18-2","tags":[],"yw":"夜半爲陰隴，夜半後而爲陽衰，平且陰盡而陽受氣矣。日中而陽隴，日西而陽衰，日入陽盡而陰受氣矣。夜半而大會，萬民皆臥，命曰合陰，平旦陰盡而陽受氣，如是無己，與天地同紀。黃帝曰：老人之不夜瞑者，何氣使然？少壯之人，不晝瞑者，何氣使然？岐伯答曰：壯者之氣血盛，其肌肉滑，氣道通，營衛之行不失其常，故晝精而夜瞑。老者之氣血衰，其肌肉枯，氣道澀，五髒之氣相博，其營氣衰少而衛氣內伐，故晝不精，夜不瞑。黃帝曰：願聞營衛之所行，皆何道從來？岐伯答曰：營出中焦，衛出下焦。","bh":"夜半为阴气隆盛，夜半以后阴气渐衰，到平旦阴尽而阳气受气主事。日中而阳气隆盛，日西则阳气渐衰，日入阳尽而阴气受气主事。夜半而阴阳大会，万民皆卧，名叫合阴；平旦阴尽而阳气受气，如此没有终止，与天地同一纲纪。黄帝说：老人不能夜眠的，是什么气使他这样？少壮之人不能昼眠的，是什么气使他这样？岐伯回答说：壮年人气血盛，肌肉滑利，气道通畅，营卫的运行不失其常，所以白天精神清爽而夜间安眠。老年人气血衰，肌肉枯槁，气道涩滞，五脏之气相搏击，其营气衰少而卫气内伐，所以白天不清爽，夜间不能眠。黄帝说：想听听营卫所行，都从什么道路而来？岐伯回答说：营出于中焦，卫出于下焦。","notes":[],"pending":false},{"id":"ls18-3","tags":[],"yw":"黃帝曰：願聞三焦之所出。岐伯答曰：上焦出於胃上口，並咽以上，貫膈，而布胸中，走腋，循太陰之分而行，還至陽明，上至舌，下足陽明，常與營俱行於陽二十五度，行於陰亦二十五度一周也。故五十度而復大會於手太陰矣。黃帝曰：人有熱，飲食下胃，其氣未定，汗則出，或出於面，或出於背，或出於身半，其不循衛氣之道而出，何也？岐伯曰：此外傷於風，內開腠理，毛蒸理泄，衛氣走之，固不得循其道，此氣慓悍滑疾，見開而出，故不得從其道，故命曰漏泄。","bh":"黄帝说：想听听三焦之所出。岐伯回答说：上焦出于胃上口，并咽以上，贯穿膈膜，而布散于胸中，走腋部，循手太阴之分而行，还至手阳明，上行至舌，下接足阳明，常与营气俱行于阳二十五度，行于阴也是二十五度一周。所以行五十度而又大会于手太阴。黄帝说：人有热，饮食下入胃中，其气尚未安定，汗就出来，或出于面部，或出于背部，或出于身体半侧，它不循卫气的道路而出，是为什么？岐伯说：这是外伤于风，在内使腠理开张，毛窍蒸腾、肌理疏泄，卫气因而走泄，固然不能循其常道；此气慓悍滑疾，见开而出，所以不得从其道，所以名叫漏泄。","notes":[],"pending":false},{"id":"ls18-4","tags":[],"yw":"黃帝曰：願聞中焦之所出。岐伯答曰：中焦亦並胃中，出上焦之後，此所受氣者，泌糟粕，蒸津液，化其精微，上注於肺脈乃化而爲血，以奉生身，莫貴於此，故獨得行於經隧，命曰營氣。黃帝曰：夫血之與氣，異名同類。何謂也？岐伯答曰：營衛者，精氣也，血者，神氣也，故血之與氣，異名同類焉。故奪血者無汗，奪汗者無血，故人生有兩死而無兩生。黃帝曰：願聞下焦之所出。岐伯答曰：下焦者，別回腸，注於膀胱，而滲入焉；故水谷者，常並居於胃中，成糟粕，而俱下於大腸而成下焦，滲而俱下。","bh":"黄帝说：想听听中焦之所出。岐伯回答说：中焦也并于胃中，出于上焦之后。这里所受纳水谷之气，泌别糟粕，蒸化津液，化生其精微，上注于肺脉，才化而为血，以奉养身形，没有什么比这更宝贵，所以独得行于经隧，名叫营气。黄帝说：血与气，名称不同却属同类，这怎么讲？岐伯回答说：营卫是精气，血是神气，所以血与气名称不同而属于同类。所以夺血的不可再耗其汗，夺汗的不可再耗其血，所以人生有两死而无两生。黄帝说：想听听下焦之所出。岐伯回答说：下焦，别于回肠，注于膀胱而渗入其中；所以水谷常并居于胃中，化成糟粕，而俱下于大肠，而成下焦，渗而俱下。","notes":[],"pending":false},{"id":"ls18-5","tags":[],"yw":"濟泌別汁，循下焦而滲入膀胱焉。黃帝曰：人飲酒，酒亦入胃，谷未熟，而小便獨先下，何也？岐伯答曰：酒者，熟谷之液也。其氣悍以清，故後谷而入，先谷而液出焉。黃帝曰：善。餘聞上焦如霧，中焦如漚，下焦如瀆，此之謂也。","bh":"济泌别汁（分别清浊），循下焦而渗入膀胱。黄帝说：人饮酒，酒也入于胃，谷物尚未腐熟，而小便独先下行，是为什么？岐伯回答说：酒是熟谷之液，它的气悍而清，所以后于谷物而入，先于谷物而液化排出。黄帝说：好。我听说上焦如雾，中焦如沤，下焦如渎，说的就是这个意思。","notes":[],"pending":false}]},
{"id":"ls19","book":"灵枢","no":19,"title":"四时气","titleTw":"四時氣","tags":["ci","jingluo","zhenfa"],"brief":"论四时之气各有所在，灸刺取穴深浅留疾随之而异，并列举温疟、水胀、飧泄等病的刺治。","pending":false,"sections":[{"id":"ls19-1","tags":[],"yw":"黃帝問於岐伯曰：夫四時之氣，各不同形，百病之起，皆有所生，灸刺之道，何者爲定？岐伯答曰：四時之氣，各有所在，灸刺之道，得氣穴爲定。故春取經、血脈、分肉之間，甚者，深刺之，間者，淺刺之；夏取盛經孫絡，取分間絕皮膚；秋取經俞。邪在腑，取之合；冬取井滎，必深以留之。溫瘧汗不出，爲五十九痏，風(疒水)膚脹，爲五十痏。取皮膚之血者，盡取之。飧泄補三陰之上，補陰陵泉，皆久留之，熱行乃止。轉筋於陽，治其陽；轉筋於陰，治其陰。","bh":"黄帝问岐伯说：四时之气，各有不同的形态，百病的发生，都各有所由生，灸刺之道，以什么为定准？岐伯回答说：四时之气各有所在，灸刺之道，以得气穴为定准。所以春取经脉、血脉、分肉之间，病重的深刺，病轻的浅刺；夏取盛经的孙络，取分肉之间而绝（透过）皮肤；秋取经俞；邪在腑的，取合穴；冬取井穴荥穴，必须深刺而久留针。温疟汗不出的，用五十九痏；风水皮肤胀的，用五十痏。取皮肤之血的，尽取之。飧泄补三阴之上，补阴陵泉，都要久留针，热气行乃止针。转筋在阳经的，治其阳；转筋在阴经的，治其阴。","notes":[],"pending":false},{"id":"ls19-2","tags":[],"yw":"皆卒刺之。徒(疒水)先取環谷下三寸，以鈹針針之，已刺而筩之，而內之，入而復之，以盡其(疒水)，必堅。來緩則煩悗，來急則安靜，間日一刺之，(疒水)盡乃止。飲閉藥，方刺之時徒飲之，方飲無食，方食無飲，無食他食，百三十五日。着痹不去，久寒不已，卒取其三裏。骨爲干。腸中不便，取三裏，盛瀉之，虛補之。癘風者，素刺其腫上。已刺，以銳針針其處，按出其惡氣，腫盡乃止。常食方食，無食他食。腹中常鳴，氣上衝胸，喘不能久立。","bh":"都用猝刺（急刺）。单纯水胀的，先取环谷下三寸，用铍针刺之，已刺而用中空之针纳入，入而复出，以尽其水，必须使之坚实。病来缓则烦闷，来急则安静，隔日一刺，水尽乃止。服闭药（收敛之药），正在针刺之时只服药，正在服药时不要进食，正在进食时不要服药，不吃其他食物，如此一百三十五日。着痹不去，久寒不已，急取其三里。骨为干（骨骼为支柱）。肠中不便，取三里，邪盛泻之，正虚补之。疠风（麻风）的，常刺其肿上。已刺，用锐针刺其处，按出恶气，肿尽乃止。常食常食之物，不吃其他食物。腹中常鸣，气上冲胸，喘息而不能久立。","notes":[],"pending":false},{"id":"ls19-3","tags":[],"yw":"邪在大腸，刺肓之原，巨虛上廉、三裏。小腹控睪，引腰脊，上衝心。邪在小腸者，連睪系，屬於脊，貫肝肺，絡心系。氣盛則厥逆，上衝腸胃，燻肝，散於肓，結於臍，故取之肓原以散之，刺太陰以予之，取厥陰以下之，取巨虛下廉以去之，按其所過之經以調之。善嘔，嘔有苦，長太息，心中憺憺，恐人將捕之；邪在膽，逆在胃，膽液泄，則口苦，胃氣逆，則嘔苦，故曰嘔膽。取三裏以下。胃氣逆，則刺少陽血絡，以閉膽逆，卻調其虛實，以去其邪。","bh":"邪在大肠，刺肓之原（气海）、巨虚上廉、三里。小腹控引睾丸，牵引腰脊，上冲于心。邪在小肠的，连于睾系，属于脊，贯肝肺，络心系。气盛则厥逆，上冲肠胃，熏肝，散于肓，结于脐，所以取肓原以散之，刺太阴以补予之，取厥阴以下之，取巨虚下廉以去之，并按其所过之经以调之。善呕，呕吐苦水，常长太息，心中憺憺（悸动不宁），恐惧好像有人将要抓捕他；邪在胆，逆在胃，胆液外泄则口苦，胃气上逆则呕苦，所以叫呕胆。取三里以下胃气之逆。胃气逆的，就刺少阳血络，以闭阻胆气之逆，再调其虚实，以去其邪。","notes":[],"pending":false},{"id":"ls19-4","tags":[],"yw":"飲食不下，膈塞不通，邪在胃脘，在上脘，則刺抑而下之，在下脘，則散而去之。小腹痛腫，不得小便，邪在三焦，約取之太陽大絡，視其絡脈與厥陰小絡結而血者，腫上及胃脘，取三裏。睹其色，察其以，知其散復者，視其目色，以知病之存亡也。一其形，聽其動靜者，持氣口人迎以視其脈，堅且盛且滑者，病日進，脈軟者，病將下，諸經實者，病三日已。氣口候陰，人迎候陽也。","bh":"饮食不下，膈塞不通，是邪在胃脘，邪在上脘的，就针刺抑而下之；邪在下脘的，就散而去之。小腹痛肿，不得小便，是邪在三焦，大约取太阳大络，看那络脉与厥阴小络结聚而郁血的，肿上延及胃脘的，取三里。观察病人的气色，察其所以然，以知邪气散复的，看其目色，以知病之存亡。形气如一，听其动静的，持气口与人迎以察其脉，脉坚而盛而滑的，病日进；脉软的，病将退；诸经实的，病三日而已。气口候阴，人迎候阳。","notes":[],"pending":false}]},
{"id":"ls20","book":"灵枢","no":20,"title":"五邪","titleTw":"五邪","tags":["ci","zhenfa","bingji"],"brief":"论邪在肺、肝、脾胃、肾、心五脏的病证表现及其针刺取穴与补泻调治之法。","pending":false,"sections":[{"id":"ls20-1","tags":[],"yw":"邪在肺，則病皮膚痛，寒熱，上氣喘，汗出，欬動肩背。取之膺中外喻，背三節五髒之傍，以手疾按之，快然，乃刺之。取之缺盆中以越之。邪在肝，則兩脅中痛，寒中，惡血在內，行善掣節，時腳腫。取之行間，以引脅下，補三裏以溫胃中，取血脈以散惡血；取耳間青脈，以去其掣。邪在脾胃，則病肌肉痛，陽氣有餘，陰氣不足，則熱中善飢；陽氣不足，陰氣有餘，則寒中腸鳴、腹痛；陰陽俱有餘，若俱不足，則有寒有熱，皆調於三裏。邪在腎，則病骨痛，陰痹。","bh":"邪在肺，就病皮肤痛，寒热，上气喘，汗出，咳嗽牵动肩背。取之膺中外俞、背部三节五脏之傍，用手急按之，病人感到畅快，就刺之。取缺盆中以发越其邪。邪在肝，就两胁中痛，寒中，恶血在内，行走时好掣引关节，时常脚肿。取之行间以引胁下之气，补三里以温胃中，取血络以散恶血；取耳间青脉，以去其掣引。邪在脾胃，就病肌肉痛，阳气有余、阴气不足的，则热中善饥；阳气不足、阴气有余的，则寒中肠鸣、腹痛；阴阳俱有余，或俱不足的，则有寒有热，都调治于三里。邪在肾，就病骨痛，阴痹。","notes":[],"pending":false},{"id":"ls20-2","tags":[],"yw":"陰痹者，按之而不得，腹脹，腰痛，大便難，肩背頸項痛，時眩。取之湧泉、昆侖。視有血者，盡取之。邪在心，則病心痛，喜悲時眩僕；視有餘不足而調之其輸也。","bh":"阴痹，按之而不可得（按不到确切痛处），腹胀，腰痛，大便难，肩背颈项痛，时常眩晕。取之涌泉、昆仑。看到有郁血的，尽取之。邪在心，就病心痛，喜悲，时常眩晕仆倒；视其有余不足而调治其输穴。","notes":[],"pending":false}]},
{"id":"ls21","book":"灵枢","no":21,"title":"寒热病","titleTw":"寒熱病","tags":["zhenfa","bingji","zangxiang"],"brief":"论皮、肌、骨寒热及骨痹、体惰、厥痹等病，列举天牖五部诸穴主治、四时刺法与刺害。","pending":false,"sections":[{"id":"ls21-1","tags":[],"yw":"皮寒熱者，不可附席，毛發焦，鼻槁臘。不得汗，取三陽之絡，以補手太陰。肌寒熱者，肌痛，毛發焦而脣槁臘。不得汗，取三陽於下，以去其血者，補足太陰，以出其汗。骨寒熱者，病無所安，汗注不休。齒未槁，取其少陰於陰股之絡；齒已槁，死不治。骨厥亦然。骨痹，舉節不用而痛，汗注、煩心。取三陰之經，補之。身有所傷，血出多及中風寒，若有所墮墜，四肢懈惰不收，名曰體惰。取其小腹臍下三結交。三結交者，陽明太陰也，臍下三寸關元也。","bh":"皮寒热的，不可靠近床席，毛发焦枯，鼻干如腊。不得汗出的，取三阳之络，以补手太阴。肌寒热的，肌肉痛，毛发焦而嘴唇枯槁。不得汗出的，取三阳于下肢以去其血，补足太阴以出其汗。骨寒热的，病者无处安宁，汗出如注不止。齿未枯槁的，取足少阴于阴股之络；齿已枯槁的，是不治的死证。骨厥也是这样。骨痹，全身关节不能举动而痛，汗出如注、烦心，取三阴之经补之。身有所伤，出血多而又中于风寒，或者有所堕坠，四肢懈惰不收，名叫体惰。取小腹脐下三结交。三结交，是阳明、太阴，即脐下三寸的关元。","notes":[],"pending":false},{"id":"ls21-2","tags":[],"yw":"厥痹者，厥氣上及腹。取陰陽之絡，視主病也，瀉陽補陰經也。頸側之動脈人迎。人迎，足陽明也，在嬰筋之前。嬰筋之後，手陽明也，名曰扶突。次脈，足少陽脈也，名曰天牖。次脈，足太陽也，名曰天柱。腋下動脈，臂太陰也，名曰天府。陽迎頭痛，胸滿不得息，取之人迎。暴瘖氣鞭，取扶突與舌本出血。暴襲氣蒙，耳目不明，取天牖。暴攣?眩，足不任身，取天柱。暴痹內逆，肝肺相搏，血溢鼻口，取天府。此爲天牖五部。臂陽明，有入頄遍齒者，名曰大迎。","bh":"厥痹的，厥气上及腹部。取阴阳之络，视其主病所在，泻阳补阴经。颈侧的动脉是人迎。人迎是足阳明，在婴筋之前。婴筋之后的，是手阳明，名叫扶突。次一脉，是足少阳脉，名叫天牖。次一脉，是足太阳，名叫天柱。腋下的动脉，是臂太阴，名叫天府。阳邪上逆而头痛，胸满不得息的，取之人迎。突然失音、气梗的，取扶突与舌本出血。突然耳聋气蒙，耳目不明的，取天牖。突然拘挛、痫眩，足不能支撑身体的，取天柱。突然痹而内逆，肝肺相搏，血从鼻口外溢的，取天府。这就是天牖五部。臂阳明（手阳明），有入颧部而遍络于齿的，名叫大迎。","notes":[],"pending":false},{"id":"ls21-3","tags":[],"yw":"下齒齲，取之臂。惡寒補之，不惡寒瀉之。足太陽有入頄遍齒者，名曰角孫。上齒齲，取之在鼻與頄前。方病之時，其脈盛，盛則瀉之，虛則補之。一曰取之出鼻外。足陽明有挾鼻入於面者，名曰懸顱。屬口，對入系目本，視有過者取之。損有餘，益不足，反者益其。足太陽有通項入於腦者，正屬目本，名曰眼系。頭目苦痛，取之在項中兩筋間。入腦乃別陰蹻、陽蹻，陰陽相交，陽入陰，陰出陽，交於目銳眥，陽氣盛則瞋目，陰氣盛則瞑目。熱厥取足太陰、少陽，皆留之；寒厥取足陽明、少陰於足，皆留之。","bh":"下齿龋，取之臂上的穴位。恶寒的补之，不恶寒的泻之。足太阳有入颧部而遍络于齿的，名叫角孙。上齿龋，取之在鼻与颧前。正当发病时，其脉盛，盛则泻之，虚则补之。一说取之出于鼻外。足阳明有挟鼻而入于面的，名叫悬颅。连属于口，对入而系于目本（眼球根部），视其有过之处取之。损其有余，益其不足，反其道而行的就会加重。足太阳有通项而入于脑的，正属目本，名叫眼系。头目苦痛，取之在项中两筋之间。入脑后才分别阴𫏋、阳𫏋，阴阳相交，阳入阴，阴出阳，交会于目锐眦，阳气盛则瞪目，阴气盛则闭目。热厥取足太阴、少阳，都要留针；寒厥取足阳明、少阴于足部，都要留针。","notes":[],"pending":false},{"id":"ls21-4","tags":[],"yw":"舌縱涎下，煩悗，取足少陰。振寒灑灑鼓頷，不得汗出，腹脹煩悗，取手太陰，刺虛者，刺其去也；刺實者，刺其來也。春取絡脈，夏取分腠，秋取氣口，冬取經輸。凡此四時，各以時爲齊。絡脈治皮膚，分腠治肌肉，氣口治筋脈，經輸治骨髓。五髒，身有五部：伏兔一；腓二，腓者腨也；背三，五髒之輸四；項五。此五部有癰疽者死。病始手臂者，先取手陽明、太陰而汗出；病始頭首者，先取項太陽而汗出；病始足脛者，先取足陽明而汗出。臂太陰可汗出，足陽明可汗出，故取陰而汗出甚者，止之於陽，取陽而汗出甚者，止之於陰。","bh":"舌纵缓、流涎、烦闷的，取足少阴。振寒洒洒然、鼓动下颌，不得汗出，腹胀烦闷的，取手太阴。刺虚证的，刺其气去之时；刺实证的，刺其气来之时。春取络脉，夏取分腠，秋取气口，冬取经输。凡此四时，各以时令为准则。络脉治皮肤，分腠治肌肉，气口治筋脉，经输治骨髓。五脏在身有五部：伏兔一；腓二，腓就是腨（小腿肚）；背三；五脏之输四；项五。这五部有痈疽的，死。病始于手臂的，先取手阳明、太阴而使其汗出；病始于头首的，先取项部太阳而使其汗出；病始于足胫的，先取足阳明而使其汗出。臂太阴可使之汗出，足阳明可使之汗出，所以取阴经而汗出太甚的，止之于阳经，取阳经而汗出太甚的，止之于阴经。","notes":[],"pending":false},{"id":"ls21-5","tags":[],"yw":"凡刺之害，中而不去則精泄；不中而去則致氣。精泄則病甚而慪，致氣則生爲癰疽也。","bh":"凡针刺的害处：已中病而不去针，就会使精气外泄；未中病而去针，就会使邪气留滞。精气外泄则病加重而怯弱，邪气留滞则生为痈疽。","notes":[],"pending":false}]},
{"id":"ls22","book":"灵枢","no":22,"title":"癞狂病","titleTw":"癩狂病","tags":["ci","jingluo","zhenfa"],"brief":"论癫疾与狂证的发作表现、分类、预后及针灸取穴，兼及风逆、厥逆、少气短气等证治。","pending":false,"sections":[{"id":"ls22-1","tags":[],"yw":"目眥外決於面者，爲銳眥；在內近鼻者，爲內眥；上爲外眥，下爲內眥。癲疾始生，先不樂，頭重痛，視舉目赤，甚作極，已而煩心。候之於顏。取手太陽、陽明、太陰，血變爲止。癲疾始作，而引口啼呼喘悸者，候之手陽明、太陽。左強者，攻其右；右強者，攻其左，血變爲止。癲疾始作，先反僵，因而脊痛，候之足太陽、陽明、太陰、手太陽，血變爲止。治癲疾者，常與之居，察其所當取之處。病至，視之有過者瀉之，置其血於瓠壺之中，至其發時，血獨動矣，不動，灸窮骨二十壯。","bh":"眼角向外开于面部的，为锐眦；在内近鼻的，为内眦；上为外眦，下为内眦。癫疾初生，先是不乐，头重痛，抬眼视物而目赤，发作严重到极点之后就烦心。候之于颜面。取手太阳、阳明、太阴，刺至血色变为正常乃止。癫疾开始发作，而牵引口角啼呼喘悸的，候之手阳明、太阳。左侧强的，攻其右；右侧强的，攻其左，血色变乃止。癫疾开始发作，先身体反张僵硬，因而脊痛的，候之足太阳、阳明、太阴、手太阳，血色变乃止。治癫疾的，常与病人同住，观察他所当取的部位。病发作时，视其有病变的泻之，把刺出的血放在瓠壶之中，到他发作时，血会独自动，血不动的，灸穷骨二十壮。","notes":[],"pending":false},{"id":"ls22-2","tags":[],"yw":"窮骨者，骶骨也。骨癲疾者，顑、齒諸腧、分肉皆滿而骨居，汗出、煩悗，嘔多沃沫，氣下泄，不治。筋癲疾者，身倦攣急大，刺項大經之大杼脈，嘔多沃沫，氣下泄，不治。脈癲疾者，暴僕，四肢之脈皆脹而縱，脈滿，盡刺之出血，不滿，灸之項太陽，灸帶脈於腰相去三寸，諸分肉本輸。嘔吐沃沫，氣下泄，不治。癲疾者，疾發如狂者，死不治。狂始生，先自悲也，喜忘、苦怒、善恐者得之憂飢，治之取手太陽、陽明，血變而止，及取足太陰、陽明。","bh":"穷骨就是骶骨。骨癫疾的，面颊、齿、诸腧穴、分肉都胀满而骨独显，汗出、烦闷，呕吐大量沃沫，气下泄的，不治。筋癫疾的，身体倦曲、挛急而肿大，刺项部大经的大杼脉；呕吐大量沃沫，气下泄的，不治。脉癫疾的，突然仆倒，四肢之脉都胀满而纵缓，脉满的，尽刺之出血，不满的，灸项部太阳，灸带脉于腰间相去三寸处，以及诸分肉本输。呕吐沃沫，气下泄的，不治。癫疾发作时如同狂证的，是不治的死证。狂证初起，先是自我悲伤，喜忘、苦怒、善恐的，得之于忧愁与饥饿，治之取手太阳、阳明，血色变而止，以及取足太阴、阳明。","notes":[],"pending":false},{"id":"ls22-3","tags":[],"yw":"狂始發，少臥不飢，自高賢也，自辯智也，自尊貴也，善罵詈，日夜不休，治之取手陽明太陽太陰舌下少陰，視之盛者，皆取之，不盛，釋之也。狂言，驚，善笑，好歌樂，妄行不休者，得之大恐，治之取手陽明太陽太陰。狂，目妄見，耳妄聞，善呼者，少氣之所生也；治之取手太陽太陰陽明，足太陰頭兩顑。狂者多食，善見鬼神，善笑而不發於外者，得之有所大喜，治之取足太陰太陽陽明，後取手太陰太陽陽明。狂而新發，未應如此者，先取曲泉左右動脈，及盛者見血，有頃已，不已，以法取之，灸骨骶二十壯。","bh":"狂开始发作，少睡不饥，自以为高尚贤能，自以为善辩多智，自以为尊贵，善骂詈，日夜不休，治之取手阳明、太阳、太阴、舌下、少阴，视其脉盛的都取之，不盛的就不取。狂言，惊，善笑，好歌乐，妄行不休的，得之于大恐，治之取手阳明、太阳、太阴。狂而目妄见、耳妄闻、善呼叫的，是少气之所生；治之取手太阳、太阴、阳明，足太阴、头、两顑。狂者多食，善见鬼神，善笑而不发露于外的，得之于有所大喜，治之取足太阴、太阳、阳明，后取手太阴、太阳、阳明。狂而新发，尚未出现上述这些表现的，先取曲泉左右动脉，以及脉盛的刺出血，过一会儿就好了，不好的，依法取治，灸骨骶二十壮。","notes":[],"pending":false},{"id":"ls22-4","tags":[],"yw":"風逆，暴四肢腫，身漯漯，唏然時寒，飢則煩，飽則善變，取手太表裏，足少陰陽明之徑，肉清取滎，骨清取井、經也。厥逆爲病也，足暴清，胸若將裂，腸若將以刀切之，煩而不能食，脈大小皆澀，暖取足少陰，清取足陽明，清則補之，溫則瀉之。厥逆腹脹滿，腸鳴，胸滿不得息，取之下胸二脅，咳而動手者，與背輸，以手按之，立快者是也。內閉不得溲，刺足少陰太陽，與抵上以長針。氣逆，則取其太陰、陽明、厥陰，甚取少陰、陽明，動者之經也。","bh":"风逆，突然四肢肿，身上漯漯然（寒栗貌），唏然而时常发冷，饥则烦，饱则善变动，取手太阴表里，足少阴、阳明之经；肉寒的取荥穴，骨寒的取井穴、经穴。厥逆为病，足突然清冷，胸中好像将要裂开，肠中好像被刀切一样，烦闷而不能进食，脉无论大小都涩，温暖的取足少阴，清冷的取足阳明，清则补之，温则泻之。厥逆而腹胀满，肠鸣，胸满不得息的，取之下胸二胁，咳嗽而牵动手的，与背输，用手按之，立刻感到畅快的就是。内闭不得小便的，刺足少阴、太阳，与骶上，用长针。气逆的，就取太阴、阳明、厥阴，严重的取少阴、阳明，取动脉之经。","notes":[],"pending":false},{"id":"ls22-5","tags":[],"yw":"少氣，身漯漯也，言吸吸也，骨酸體重，懈惰不能動，補足少陰。短氣息短，不屬，動作氣索，補足少陰，去血絡也。","bh":"少气的，身上漯漯然，说话吸吸然（语声低微），骨酸体重，懈惰不能活动的，补足少阴。短气、呼吸短促而不相接续，一动作就气不继的，补足少阴，并去其血络。","notes":[],"pending":false}]},
{"id":"ls23","book":"灵枢","no":23,"title":"热病","titleTw":"熱病","tags":["ci","zhenfa","bingji"],"brief":"论偏枯、痱与热病的针刺治法、禁刺指征与预后判断，按皮、脉、肉、筋分经求治。","pending":false,"sections":[{"id":"ls23-1","tags":[],"yw":"偏枯，身偏不用而痛，言不變，志不亂，病在分腠之間，巨針取之，益其不足，損其有餘，乃可復也。痱之爲病也，身無痛者，四肢不收；智亂不甚，其言微知，可治；甚則不能言，不可治也。病先起於陽，復入於陰者，先取其陽，後取其陰，浮而取之。熱病三日，而氣口靜、人迎躁者，取之諸陽，五十九刺，以瀉其熱，而出其汗，實其陰，以補其不足者。身熱甚，陰陽皆靜者，勿刺也；其可刺者，急取之，不汗出則泄。所謂勿刺者，有死徵也。熱病七日八日，脈口動，喘而短者，急刺之，汗且自出，淺刺手大指間。","bh":"偏枯，半身不遂而痛，言语不变，神志不乱，病在分腠之间，用巨针刺之，补益其不足，损减其有余，才可以恢复。痱之为病，身体不痛的，四肢不收；神志错乱不甚，他说话还能听懂的，可治；严重的不能言语，不可治。病先起于阳，而后入于阴的，先取其阳，后取其阴，浅刺而取之。热病三日，而气口静、人迎躁的，取之诸阳，用五十九刺，以泻其热而出其汗，充实其阴以补其不足。身热很重，而气口人迎都静的，不要刺；可以刺的，赶快取之，不得汗出就要泄其热。所谓不可刺的，是有死征。热病七日八日，脉口动，喘息而气短的，急刺之，汗将自出，浅刺手大指间。","notes":[],"pending":false},{"id":"ls23-2","tags":[],"yw":"熱病七日八日，脈微小，病者溲血，口中干，一日半而死。脈代者，一日死。熱病已得汗出，而脈尚躁，喘且復熱，勿刺膚，喘甚者死。熱病七日八日，脈不躁，躁不散改，後看中有汗；三日不汗，四日死。未曾汗者，勿腠刺之。熱病先膚痛，窒鼻充面，取之皮，以第一針，五十九，苛軫鼻，索皮於肺，不得，索之火，火者，心也。熱病先身澀倚而熱，煩俛，干脣口溢，取之皮，以第一針，五十九；膚脹口干，寒汗出，索脈於心，不得，索之水，水者，腎也。","bh":"热病七日八日，脉微小，病人尿血，口中干，一日半而死。脉代的，一日死。热病已经汗出，而脉尚躁，喘息而又发热的，不要刺皮肤，喘息严重的死。热病七日八日，脉不躁，或者躁而不散乱的，继续观察是否有汗；三日不汗，四日死。未曾出汗的，不要用刺腠理之法。热病先见皮肤痛，鼻塞，面部充血，取之于皮，用第一针（镵针），用五十九刺；鼻部生小疹的，在皮（肺）这方面求治，不得，就求之于火，火是心。热病先见身体涩滞、困倦而发热，烦闷，唇口干燥，取之于皮，用第一针，用五十九刺；皮肤胀、口干、出冷汗的，在脉（心）这方面求治，不得，就求之于水，水是肾。","notes":[],"pending":false},{"id":"ls23-3","tags":[],"yw":"熱病溢干多飲，善驚，臥不能起，取之膚肉，以第六針，五十九，目眥青，索肉於脾，不得，索之水，木者，肝也。熱病面青，腦痛，手足躁，取之筋間，以第四針於四逆；筋躄目浸，索筋於肝，不得，索之金，金者，肺也。","bh":"热病咽干而多饮，善惊，卧而不能起，取之于肤肉，用第六针（员利针），用五十九刺；目眦发青的，在肉（脾）这方面求治，不得，就求之于木，木是肝。热病面青，脑痛，手足躁扰，取之于筋间，用第四针（锋针）刺四肢厥逆之处；筋躄（筋脉痿软）、目浸（流泪不止）的，在筋（肝）这方面求治，不得，就求之于金，金是肺。","notes":[],"pending":false}]},
{"id":"ls24","book":"灵枢","no":24,"title":"厥病","titleTw":"厥病","tags":["ci","zhenfa","bingji"],"brief":"分述厥头痛、真头痛、厥心痛、真心痛及虫病、耳病、髀痛、风痹等证的刺法与预后。","pending":false,"sections":[{"id":"ls24-1","tags":[],"yw":"厥頭痛，面若腫起而煩心，取之足陽明太陰。厥頭痛，頭脈痛，心悲，善泣，視頭動脈反盛者，刺盡去血，後調足厥陰。厥頭痛，貞貞頭重而痛，寫頭上五行，行五，先取手少陰，後取足少陰。厥頭痛，意善忘，按之不得，取頭面左右動脈，後取足太陰。厥頭痛，項先痛，腰脊爲應，先取天柱，後取足太陽。厥頭痛，頭痛甚，耳前後脈湧有熱，瀉出其血，後取足少陽。真頭痛，頭痛甚，腦盡痛，手足寒至節，死不治。頭痛不可取於腧者，有所擊墮，惡血在於內，若肉傷，痛未已，可則刺，不可遠取也。","bh":"厥头痛，面部好像肿起而烦心的，取足阳明、太阴。厥头痛，头部脉络痛，心悲善泣，看到头部动脉反常充盛的，刺之尽去其血，然后调足厥阴。厥头痛，头重而痛、昏沉不清的，泻头上五行，每行五穴，先取手少阴，后取足少阴。厥头痛，容易健忘，按之而找不到痛处的，取头面左右动脉，然后取足太阴。厥头痛，项部先痛，腰脊随之而应的，先取天柱，后取足太阳。厥头痛，头痛很重，耳前后脉充盛有热的，泻出其血，然后取足少阳。真头痛，头痛很重，整个头脑都痛，手足寒冷到关节的，是不治的死证。头痛不可取腧穴的，是被击打堕坠，恶血留于内，或是肌肉受伤，疼痛未止的，可以就近刺之，不可远取。","notes":[],"pending":false},{"id":"ls24-2","tags":[],"yw":"頭痛不可刺者，大痹爲惡，日作者，可令少愈，不可已。頭半寒痛，先取手少陽陽明，後取足少陽陽明。厥心痛，與背相控，善瘈，如從後觸其心，傴僂者，腎心痛也，先取京骨、昆侖，發狂不已，取然谷。厥心痛，腹脹胸滿，心尤痛甚，胃心痛也，取之大都、大白。厥心痛，痛如以錐針刺其心，心痛甚者，脾心痛也，取之然谷、太溪。厥心痛，色蒼蒼如死狀，終日不得太息，肝心痛也，取之行間、太衝。厥心痛，臥若徒居，心痛間，動作，痛益甚，色不變，肺心痛也，取之魚際、太淵。","bh":"头痛不可刺的，是大痹为患，每日发作的，可使其稍愈，不能根治。头半边寒痛的，先取手少阳、阳明，后取足少阳、阳明。厥心痛，与背部相互控引，常常拘急，好像从背后触动其心，身体伛偻（弯腰曲背）的，是肾心痛，先取京骨、昆仑，发狂不已的，取然谷。厥心痛，腹胀胸满，心痛尤其剧烈，是胃心痛，取之大都、太白。厥心痛，痛得像用锥针刺其心，心痛很重的，是脾心痛，取之然谷、太溪。厥心痛，面色苍苍如同死状，整日不能太息的，是肝心痛，取之行间、太冲。厥心痛，卧床或闲居时心痛减轻，一动作就加重，面色不变的，是肺心痛，取之鱼际、太渊。","notes":[],"pending":false},{"id":"ls24-3","tags":[],"yw":"真心痛，手足清至節，心痛甚，日發夕死，夕發旦死。心痛不可刺者，中有盛聚，不可取於腧。腸中有蟲瘕及蛟蛕，皆不可取以小針；心腸痛，憹作痛，腫聚，往來上下行，痛有休止，腹熱喜渴涎出者，是蛟蛕也。以手聚按而堅持之，無令得移，以大針刺之，久持之，蟲不動，乃出針也。恐腹濃痛，形中上者。耳聾無聞，取耳中；耳鳴，取耳前動脈；耳痛不可刺者，耳中有膿，若有干聆聊，耳無聞也；耳聾取手小指次指爪甲上與肉交者，先取手，後取足；耳鳴取手中指爪甲上，左取右，右取左，先取手，後取足。","bh":"真心痛，手足清冷到关节，心痛很重，早上发作晚上死，晚上发作早上死。心痛不可刺的，是内有盛聚（积聚），不可取于腧穴。肠中有虫瘕及蛟蛕（蛔虫）的，都不可用小针；心肠痛，懊𢙐作痛，聚而成块，往来上下游走，痛有休止，腹中发热、喜渴、流涎的，是蛟蛕。用手聚按而坚持按住，不让它移动，用大针刺之，持久持针，虫不动了，才出针。（虫动则）腹部剧痛，聚块在腹中上行。耳聋听不到的，取耳中；耳鸣的，取耳前动脉；耳痛不可刺的，是耳中有脓，或者有干耵聍阻塞，所以耳听不见；耳聋取手小指次指爪甲上与肉相交处，先取手，后取足；耳鸣取手中指爪甲上，左病取右，右病取左，先取手，后取足。","notes":[],"pending":false},{"id":"ls24-4","tags":[],"yw":"足髀不可舉，側而取之，在樞合中，以員利針，大針不可刺。病注下血，取曲泉。風痹淫礫，病不可已者，足如履冰，時如入湯中，股脛淫礫，煩心頭痛，時嘔時悗，眩已汗出，久則目眩，悲以喜恐，短氣，不樂，不出三年死也。","bh":"大腿不能抬举的，侧卧而取之，在髀枢之中，用员利针，不可用大针。病下血的，取曲泉。风痹淫砾（病邪久留不愈），病不可治愈的，足有时像踩在冰上，有时像浸入热水中，股胫酸痛，烦心头痛，时呕时闷，眩晕后汗出，久了就目眩，时悲时喜时恐，短气，不乐，不出三年就会死。","notes":[],"pending":false}]},
{"id":"ls25","book":"灵枢","no":25,"title":"病本","titleTw":"病本","tags":["bingji","yinyang","shen"],"brief":"论治病先后缓急、标本先后之序，并辨客气同气，提出间者并行、甚者独行的原则。","pending":false,"sections":[{"id":"ls25-1","tags":[],"yw":"先病而後逆者，治其本；先逆而後病者，治其本；先寒而後生病者，治其本；先病而後生寒者，治其本；先熱而後生病者，治其本。先泄而後生他病者，治其本，必且調之，乃治其他病。先病而後中滿者，治其標；先病後泄者，治其本；先中滿而後煩心者，治其本。有客氣，有同氣。大小便不利治其標，大小便利，治其本。病發而有餘，本而標之，先治其本，後治其標；病發而不足，標而本之，先治其標，後治其本，謹詳察間甚，以意調之，間者並行，甚爲獨行；先小大便不利而後生他病者，治其本也。","bh":"先病而后气逆的，治其本；先气逆而后病的，治其本；先寒而后生病的，治其本；先病而后生寒的，治其本；先热而后生病的，治其本。先泄泻而后生其他病的，治其本，必须先调治它，然后才治其他病。先病而后中满的，治其标；先病而后泄泻的，治其本；先中满而后烦心的，治其本。有客气，有同气。大小便不利的治其标，大小便通利的治其本。病发而有余的，本而标之，先治其本，后治其标；病发而不足的，标而本之，先治其标，后治其本。谨慎详察病的轻重，用心调治，病轻的标本并行而治，病重的单独而治；先大小便不利而后生其他病的，治其本。","notes":[],"pending":false}]},
{"id":"ls26","book":"灵枢","no":26,"title":"杂病","titleTw":"雜病","tags":["ci","zhenfa","bingji"],"brief":"汇集厥、喉痹、疟、齿痛、聋、衄、腰痛、心痛、腹痛、痿厥等杂病，按证取经取穴刺治。","pending":false,"sections":[{"id":"ls26-1","tags":[],"yw":"厥挾脊而痛者，至頂，頭沉沉然，目(目巟)(目巟)然，腰脊強。取足太陽膕中血絡。厥胸滿面腫，脣漯漯然，暴言難，甚則不能言，取足陽明。厥氣走喉而不能言，手足清，大便不利，取足少陰。厥而腹向向然，多寒氣，腹中谷谷，便溲難，取足太陰。嗌干，口中熱如膠，取足少陰。膝中痛，取犢鼻，以員利針，發而間之。針大如犛，刺膝無疑。喉痹不能言，取足陽明；能言，取手陽明。瘧不渴，間日而作，取足陽明；渴而日作，取手陽明。齒痛，不惡清飲，取足陽明；惡清飲，取手陽明。","bh":"厥而挟脊作痛的，上至头顶，头部沉重不清，目视物昏花，腰脊强直。取足太阳腘中血络。厥而胸满面肿，口唇湿润，突然言语困难，严重的不能言语，取足阳明。厥气走于咽喉而不能言语，手足清冷，大便不利的，取足少阴。厥而腹部向向然（胀满），多寒气，腹中谷谷然（肠鸣），大小便难的，取足太阴。咽喉干燥，口中热得像有胶的，取足少阴。膝中痛的，取犊鼻，用员利针，刺后间隔再刺。针大如牦牛毛，刺膝部不必疑虑。喉痹不能言语的，取足阳明；能言语的，取手阳明。疟疾不渴，隔日发作的，取足阳明；口渴而每日发作的，取手阳明。齿痛，不恶冷饮的，取足阳明；恶冷饮的，取手阳明。","notes":[],"pending":false},{"id":"ls26-2","tags":[],"yw":"聾而不痛者，取足少陽；聾而痛者，取手陽明。衄而不止，衄血流，取足太陽；衄血，取手太陽。不已，刺宛骨下；不已，刺膕中出血。腰痛，痛上寒，取足太陽陽明；痛上熱，取足厥陰；不可以俛仰，取足少陽。中熱而喘，取足少陰膕中血絡。喜怒而不欲食，言益小，刺足太陰；怒而多言，刺足少陽。顑痛，刺手陽明與顑之盛脈出血。項痛不可俛仰，刺足太陽；不可以顧，刺手太陽也。小腹滿大，上走胃，至心，淅淅身時寒熱，小便不利，取足厥陰。","bh":"耳聋而不痛的，取足少阳；耳聋而痛的，取手阳明。鼻衄不止、流血的，取足太阳；衄血的，取手太阳。不愈的，刺腕骨下；再不愈的，刺腘中出血。腰痛，痛处上部发寒的，取足太阳、阳明；痛处上部发热的，取足厥阴；不能俯仰的，取足少阳。中焦有热而喘息的，取足少阴腘中血络。喜怒而不想进食，言语越来越少的，刺足太阴；发怒而多言的，刺足少阳。面颊痛的，刺手阳明与面颊部充盛的血脉出血。项痛不能俯仰的，刺足太阳；不能回顾的，刺手太阳。小腹胀满膨大，气上走于胃，直至心下，身上淅淅然时而寒热的，小便不利的，取足厥阴。","notes":[],"pending":false},{"id":"ls26-3","tags":[],"yw":"腹滿，大便不利，腹大，亦上走胸嗌，喘息喝喝然，取足少陰。腹滿食不化，腹向向然，不能大便，取足太陰。心痛引腰脊，欲嘔，取足少陰。心痛，腹脹，牆牆然，大便不利，取足太陰。心痛，引背不得息，刺足少陰；不已，取手少陽。心痛引小腹滿，上下無常處，便溲難，刺足厥陰。心痛，但短氣不足以息，刺手太陰。心痛，當九節刺之，按，已刺按之，立已；不已，上下求之，得之立已。顑痛，刺足陽明曲周動脈，見血，立已；不已，按人迎於經，立已。","bh":"腹满，大便不利，腹大，气也上走胸咽，喘息喝喝然的，取足少阴。腹满而饮食不化，腹部向向然，不能大便的，取足太阴。心痛牵引腰脊，想呕的，取足少阴。心痛，腹胀，墙墙然（坚硬胀满），大便不利的，取足太阴。心痛牵引背部不得喘息的，刺足少阴；不愈的，取手少阳。心痛牵引小腹胀满，痛处上下无固定位置，大小便难的，刺足厥阴。心痛，只是短气而呼吸不足的，刺手太阴。心痛，当在第九椎节处刺之，刺后按压，立刻就好；不愈的，上下求之，找到部位就立刻见效。面颊痛的，刺足阳明曲周动脉，出血即愈；不愈的，按压人迎于经，立刻见效。","notes":[],"pending":false},{"id":"ls26-4","tags":[],"yw":"氣逆上，刺膺中陷者，與下胸動脈。腹痛，刺臍左右動脈，已刺按之，立已；不已，刺氣街，已刺按之，立已。痿厥爲四末束悗，乃疾解之，日二；不仁者，十日而知，無休，病已止。歲以草刺鼻，嚏，嚏而已；無息，而疾迎引之，立已；大驚之，亦可已。","bh":"气上逆的，刺膺中陷下之处，与下胸动脉。腹痛的，刺脐左右动脉，刺后按压，立刻就好；不愈的，刺气街，刺后按压，立刻就好。痿厥而四肢被束闷的，赶快解开它，一日二次；麻木不仁的，十日才有知觉，不用停治，病愈乃止。用草刺激鼻腔，打嚏，嚏出就好；气息不通的，赶紧迎引其气，立刻就好；使他大惊，也可以好。","notes":[],"pending":false}]},
{"id":"ls27","book":"灵枢","no":27,"title":"周痹","titleTw":"周痹","tags":["ci","jingluo","zhenfa"],"brief":"辨别众痹与周痹的不同，论周痹的病机、疼痛移行次第、针刺先后及切循熨通之法。","pending":false,"sections":[{"id":"ls27-1","tags":[],"yw":"黃帝問於岐伯曰：周痹之在身也，上下移徒隨脈，其上下左右相應，間不容空，願聞此痛，在血脈之中邪？將在分肉之間乎？何以致是？其痛之移也，間不及下針，其慉痛之時，不及定治，而痛已止矣。何道使然？願聞其故？岐伯答曰：此衆痹也，非周痹也。黃帝曰：願聞衆痹。岐伯對曰：此各在其處，更發更止，更居更起，以右應左，以左應右，非能周也。更發更休也。黃帝曰：善。刺之奈何？岐伯對曰：刺此者，痛雖已止，必刺其處，勿令復起。","bh":"黄帝问于岐伯说：周痹在人身，上下移动，随脉而行，它的上下左右相应，中间不空一息，我想听听这种痛，是在血脉之中呢？还是在分肉之间呢？是什么原因造成这样？它的疼痛移动，来不及下针，它聚痛的时候，来不及定治，而痛已经止住了。是什么道理使它这样？想听听其中的缘故。岐伯回答说：这是众痹，不是周痹。黄帝说：想听听众痹。岐伯回答说：这各在其处，更发更止，更居更起，以右应左，以左应右，不能周遍全身，而是更发更休。黄帝说：好。刺之怎样？岐伯回答说：刺这种病，疼痛虽然已经止住，也一定要刺它发病之处，不要让它再发作。","notes":[],"pending":false},{"id":"ls27-2","tags":[],"yw":"帝曰：善。願聞周痹何如？岐伯對曰：周痹者，在於血脈之中，隨脈以上，隨脈以下，不能左右，各當其所。黃帝曰：刺之奈何？岐伯對曰：痛從上下者，先刺其下以過之，後刺其上以脫之。痛從下上者，先刺其上以過之，後刺其下以脫之。黃帝曰：善。此痛安生？何因而有名？岐伯對曰：風寒溼氣，客於外分肉之間，迫切而爲沫，沫得寒則聚，聚則排分肉而分裂也，分裂則痛，痛則神歸之，神歸之則熱，熱則痛解，痛解則厥，厥則他痹發，發則如是。","bh":"黄帝说：好。想听听周痹如何？岐伯回答说：周痹，是在血脉之中，随脉而上，随脉而下，不能左右移动，各当其所在之处。黄帝说：刺之怎样？岐伯回答说：痛从上而下的，先刺其下以遏止之，后刺其上以解除之。痛从下而上的，先刺其上以遏止之，后刺其下以解除之。黄帝说：好。这种痛是怎么产生的？因什么而得名？岐伯回答说：风寒湿气，客于外在的分肉之间，逼迫津液而为沫，沫得寒则凝聚，凝聚就排挤分肉而使之分裂，分裂就痛，痛则神气归聚于此，神归聚则生热，热则痛解，痛解则气逆（厥），气逆则其他的痹发作，发作就是这样循环。","notes":[],"pending":false},{"id":"ls27-3","tags":[],"yw":"帝曰：善。餘已得其意矣。此內不在髒，而外未發於皮，獨居分肉之間，真氣不能周，故名曰周痹。故刺痹者，必先切循其下之六經，視其虛實，及大絡之血結而不通，及虛而脈陷空者而調之，熨而通之。其瘈堅轉引而行之。黃帝曰：善。餘已得其意矣，亦得其事也。九者經巽之理，十二經脈陰陽之病也。","bh":"黄帝说：好。我已经明白了它的意思。这种病在内不在脏，在外未发于皮，独居分肉之间，真气不能周流，所以名叫周痹。所以刺痹的，必先切按其下之六经，看它的虚实，以及大络之血结聚不通，以及虚而脉陷下空虚的，就调治它，用熨法以通之。它拘急坚硬的，就转引而行之。黄帝说：好。我已明白了它的意思，也得到了它的方法。九针是经脉顺逆之理，用于治十二经脉阴阳之病。","notes":[],"pending":false}]},
{"id":"ls28","book":"灵枢","no":28,"title":"口问","titleTw":"口問","tags":["ci","jingluo","zhenfa"],"brief":"以口传之法解释欠、哕、唏、振寒、噫、嚏、亸、泣涕、太息、涎下、耳鸣、啮舌十二奇邪。","pending":false,"sections":[{"id":"ls28-1","tags":[],"yw":"黃帝閒居，辟左右而問於岐伯曰：餘已聞九針之經，論陰陽逆順，六經已畢，願得口問。岐伯避席再拜曰：善乎哉問也，此先師之所口傳也。黃帝曰：願聞口傳。岐伯答曰：夫百病之始生也，皆生於風雨寒暑，陰陽喜怒，飲食居處，大驚卒恐。則血氣分離，陰陽破敗，經絡厥絕，脈道不通，陰陽相逆，衛氣稽留，經脈虛空，血氣不次，乃失其常。論不在經者，請道其方。黃帝曰：人之欠者，何氣使然？岐伯答曰：衛氣晝日行於陽，夜半則行於陰，陰者主夜，夜者臥；陽者主上，陰者主下；故陰氣積於下，陽氣未盡，陽引而上，陰引而下，陰陽相引，故數欠。","bh":"黄帝闲居，屏退左右而问岐伯说：我已经听闻九针之经，论阴阳逆顺，六经已经讲完，愿得口问（口传之学）。岐伯离开席位再拜说：问得真好啊，这是先师所口传的。黄帝说：愿闻口传。岐伯回答说：百病之始生，都生于风雨寒暑，阴阳喜怒，饮食居处，大惊卒恐。于是血气分离，阴阳破败，经络厥绝，脉道不通，阴阳相逆，卫气稽留，经脉虚空，血气不依次序，就失去了常态。这些内容不在经书上的，请讲讲它的治法。黄帝说：人打呵欠的，是什么气使他这样？岐伯回答说：卫气白天行于阳，夜半则行于阴，阴主夜，夜主卧；阳主上，阴主下；所以阴气积于下，阳气尚未尽入于阴，阳引而上，阴引而下，阴阳相引，所以频频呵欠。","notes":[],"pending":false},{"id":"ls28-2","tags":[],"yw":"陽氣盡，陰氣盛，則目瞑；陰氣盡而陽氣盛，則寤矣。瀉足少陰，補足太陽。黃帝曰：人之噦者，何氣使然？岐伯曰：谷入於胃，胃氣上注於肺。今有故寒氣與新谷氣，俱還入於胃，新故相亂，真邪相攻，氣並相逆，復出於胃，故爲噦。補手太陰，瀉足少陰。黃帝曰：人之唏者，何氣使然？岐伯曰：此陰氣盛而陽氣虛，陰氣疾而陽氣徐，陰氣盛而陽氣絕，故爲唏。補足太陽，瀉足少陰。黃帝曰：人之振寒者，何氣使然？岐伯曰：寒氣客於皮膚，陰氣盛，陽氣虛，故爲振寒寒慄，補諸陽。","bh":"阳气尽而阴气盛，就闭目入睡；阴气尽而阳气盛，就醒来。治疗泻足少阴，补足太阳。黄帝说：人哕（呃逆）的，是什么气使他这样？岐伯说：谷物入于胃，胃气上注于肺。如今有旧有的寒气与新的谷气，都还入于胃中，新旧相乱，真邪相攻，气并而相逆，又出于胃，所以成为哕。治疗补手太阴，泻足少阴。黄帝说：人唏（悲泣抽噎）的，是什么气使他这样？岐伯说：这是阴气盛而阳气虚，阴气行疾而阳气行徐，阴气盛而阳气衰绝，所以成为唏。治疗补足太阳，泻足少阴。黄帝说：人振寒的，是什么气使他这样？岐伯说：寒气客于皮肤，阴气盛，阳气虚，所以振寒而寒栗，治疗补诸阳。","notes":[],"pending":false},{"id":"ls28-3","tags":[],"yw":"黃帝曰：人之噫者，何氣使然？岐伯曰：寒氣客於胃，厥逆從下上散，復出於胃，故爲噫。補足太陰陽明，一曰補眉本也。黃帝曰：人之嚏者，何氣使然？岐伯曰：陽氣和利，滿於心，出於鼻，故爲嚏。補足太陽榮眉本，一曰眉上也。黃帝曰：人之嚲者，何氣使然？岐伯曰：胃不實則諸脈虛；諸脈虛則筋脈懈惰；筋脈懈惰則行陰用力，氣不能復，故爲嚲。因其所在，補分肉間。黃帝曰：人之哀而泣涕出者，何氣使然？岐伯曰：心者，五髒六腑之主也；目者，宗脈之所聚也，上液之道也；口鼻者，氣之門戶也。","bh":"黄帝说：人噫（嗳气）的，是什么气使他这样？岐伯说：寒气客于胃，厥逆之气从下上散，又出于胃，所以成为噫。治疗补足太阴、阳明，一说补眉本。黄帝说：人嚏（喷嚏）的，是什么气使他这样？岐伯说：阳气和利，满于心，出于鼻，所以成为嚏。治疗补足太阳荥、眉本，一说眉上。黄帝说：人亸（肢体垂弛懈惰）的，是什么气使他这样？岐伯说：胃不实则诸脉虚，诸脉虚则筋脉懈惰，筋脉懈惰则行房用力，气不能恢复，所以成为亸。根据它所在的部位，补分肉之间。黄帝说：人悲哀而泣涕流出的，是什么气使他这样？岐伯说：心是五脏六腑之主；目是宗脉所聚之处，是上部液道；口鼻是气之门户。","notes":[],"pending":false},{"id":"ls28-4","tags":[],"yw":"故悲哀愁憂則心動，心動則五髒六腑皆搖，搖則宗脈感，宗脈感則液道開，液道開，故泣涕出焉。液者，所以灌精濡空竅者也，故上液之道開則泣，泣不止則液竭；液竭則精不灌，精不灌則目無所見矣，故命曰奪精。補天柱經俠頸。黃帝曰：人之太息者，何氣使然？岐伯曰：憂思則心系急，心系急則氣道約，約則不利，故太息以伸出之，補手少陰心主，足少陽留之也。黃帝曰：人之涎下者，何氣使然？岐伯曰：飲食者，皆入於胃，胃中有熱則蟲動，蟲動則胃緩，胃緩則廉泉開，故涎下，補足少陰。","bh":"所以悲哀愁忧就心动，心动则五脏六腑都摇动，摇动则宗脉受感，宗脉受感则液道开，液道开，所以泣涕流出。液是用来灌注精气、濡润空窍的，所以上部液道开就流泪，泣不止则液竭；液竭则精气不能灌注，精气不能灌注则目无所见，所以名叫夺精。治疗补天柱经挟颈处。黄帝说：人太息（叹息）的，是什么气使他这样？岐伯说：忧思则心系拘急，心系拘急则气道约束，约束就不通利，所以用太息来伸展出气，治疗补手少阴、心主，足少阳留针。黄帝说：人流涎的，是什么气使他这样？岐伯说：饮食都入于胃，胃中有热则虫动，虫动则胃缓，胃缓则廉泉开，所以流涎，治疗补足少阴。","notes":[],"pending":false},{"id":"ls28-5","tags":[],"yw":"黃帝曰：人之耳中鳴者，何氣使然？岐伯曰：耳者，宗脈之所聚也，故胃中空則宗脈虛，虛則下溜，脈有所竭者，故耳鳴，補客主人，手大指爪甲上與肉交者也。黃帝曰：人之自齧舌者，何氣使然？岐伯曰：此厥逆走上，脈氣輩至也。少陰氣至則齧舌，少陽氣至則齧頰，陽明氣至則齧脣矣。視主病者，則補之。凡此十二邪者，皆奇邪之走空竅者也。故邪之所在，皆爲不足。故上氣不足，腦爲之不滿，耳爲之苦鳴，頭爲之苦傾，目爲之眩。中氣不足，溲便爲之變，腸爲之苦鳴。","bh":"黄帝说：人耳中鸣响的，是什么气使他这样？岐伯说：耳是宗脉所聚之处，所以胃中空虚则宗脉虚，虚则脉气下溜，脉有所竭的，所以耳鸣，治疗补客主人（上关），以及手大指爪甲上与肉相交处（少商）。黄帝说：人自己咬舌的，是什么气使他这样？岐伯说：这是厥逆之气上行，脉气依次而至。少阴气至则咬舌，少阳气至则咬颊，阳明气至则咬唇。看到主病的经脉，就补它。凡此十二种邪气，都是奇邪走入空窍所致。所以邪之所在，都是正气不足。所以上气不足，脑就因此不满，耳因此苦于鸣响，头因此苦于倾垂，目因此眩晕。中气不足，大小便因此改变，肠因此苦于鸣响。","notes":[],"pending":false},{"id":"ls28-6","tags":[],"yw":"下氣不足，則乃爲痿厥心悗。補足外踝下留之。黃帝曰：治之奈何？岐伯曰：腎主爲欠，取足少陰；肺主爲噦，取手太陰、足少陰；唏者，陰與陽絕，故補足太陽，瀉足少陰；振寒者，補諸陽；噫者，補足太陰陽明；嚏者，補足太陽眉本；嚲，因其所在，補分肉間；泣出補天柱經俠頸，俠頸者，頭中分也；太息，補手少陰、心主、足少陽，留之；涎下補足少陰；耳鳴補客主人，手大指爪甲上與肉交者；自齧舌，視主病者，則補之。目眩頭傾，補足外踝下留之；痿厥心悗，刺足大趾間上二寸，留之，一曰足外踝下留之。","bh":"下气不足，就成为痿厥、心闷。治疗补足外踝下而留针。黄帝说：怎样治疗？岐伯说：肾主为欠，取足少阴；肺主为哕，取手太阴、足少阴；唏是阴与阳相绝，所以补足太阳、泻足少阴；振寒的，补诸阳；噫的，补足太阴、阳明；嚏的，补足太阳眉本；亸，根据它所在的部位，补分肉之间；泣出补天柱经挟颈处，挟颈就是头与颈的分界处；太息，补手少阴、心主、足少阳，留针；流涎补足少阴；耳鸣补客主人，以及手大指爪甲上与肉相交处；自咬舌的，看主病之经，就补它。目眩头倾，补足外踝下而留针；痿厥心闷，刺足大趾间上二寸，留针，一说足外踝下留针。","notes":[],"pending":false}]},
{"id":"ls29","book":"灵枢","no":29,"title":"师传","titleTw":"師傳","tags":["zhenfa","bingji","zangxiang"],"brief":"论临病人问所便、顺其志的治则，饮食衣服的寒温调适，并以身形肢节外候五脏六腑。","pending":false,"sections":[{"id":"ls29-1","tags":[],"yw":"黃帝曰：餘聞先師，有所心藏，弗着於方，餘願聞而藏之，則而行之，上以治民，下以治身，使百姓無病，上下和親，德澤下流，子孫無優，傳於後世，無有終時，可得聞乎？岐伯曰：遠乎哉問也。夫治民與自治，治彼與治此，治小與治大，治國與治家，未有逆而能治之也，夫惟順而已矣。順者，非獨陰陽脈，論氣之逆順也，百姓人民皆欲順其志也。黃帝曰：順之奈何？岐伯曰：入國問俗，入家問諱，上堂問禮，臨病人問所便。黃帝曰：便病人奈何？岐伯曰：夫中熱消癉，則便寒；寒中之屬，則便熱。","bh":"黄帝说：我听说先师，有心中所藏而不著于简册的东西，我愿听闻而珍藏它，效法而实行它，对上用以治民，对下用以治身，使百姓无病，上下和睦相亲，德泽流布于下，子孙无忧，流传于后世，没有终了之时，可以听你说一说吗？岐伯说：问得深远啊。治民与自治，治彼与治此，治小与治大，治国与治家，没有逆其情而能治好的，唯有顺而已。所谓顺，不只是阴阳脉气、论气之逆顺，百姓人民也都希望顺遂他们的心愿。黄帝说：怎样顺呢？岐伯说：进入别国要问其风俗，进入人家要问其忌讳，上堂要问其礼节，临病人要问其所便（相宜）。黄帝说：怎样才算适宜病人？岐伯说：内热消瘅（消渴）的，就宜于寒；寒中之类的病，就宜于热。","notes":[],"pending":false},{"id":"ls29-2","tags":[],"yw":"胃中熱則消谷，令人懸心善飢。臍以上皮熱，腸中熱，則出黃如糜。臍以下皮寒，胃中寒，則腹脹；腸中寒，則腸鳴飧泄。胃中寒，腸中熱，則脹而且泄，胃中熱，腸中寒，則疾飲，小腹痛脹。黃帝曰：胃欲寒飲，腸欲熱飲，兩者相逆，便之奈何？且夫王公大人，血食之君，驕恣從欲輕人，而無能禁之，禁之則逆其志，順之則加其病，便之奈何？治之何先？岐伯曰：人之情，莫不惡死而喜生，告之以其敗，語之以其善，導之以其所便，開之以其所苦，雖有無道之人，惡有不聽者乎？黃帝曰：治之奈何？岐伯曰：春夏先治其標，後治其本；秋冬先治其本，後治其標。","bh":"胃中有热则消谷，令人心中悬空而善饥。脐以上皮肤热，是肠中有热，大便就出黄色如糜粥。脐以下皮肤寒，是胃中有寒，就腹胀；肠中有寒，就肠鸣飧泄。胃中寒、肠中热的，就既胀且泄；胃中热、肠中寒的，就快饮（饮水即下），小腹痛胀。黄帝说：胃宜寒饮，肠宜热饮，两者相逆，怎样才算相宜？况且那些王公大人，肉食之君，骄恣纵欲而轻视别人，无法禁止他们，禁止就违背他们的意愿，顺从就加重他们的病，怎样才算相宜？治疗先从何处着手？岐伯说：人之常情，没有不厌恶死而喜欢生的，告诉他违逆的败坏，告诉他顺从的好处，引导他到所适宜的方向，开导他所受的痛苦，即使是无道之人，哪有不听从的呢？黄帝说：怎样治疗？岐伯说：春夏先治其标，后治其本；秋冬先治其本，后治其标。","notes":[],"pending":false},{"id":"ls29-3","tags":[],"yw":"黃帝曰：便其相逆者奈何？岐伯曰：便此者，食飲衣服，亦欲適寒溫，寒無悽愴，暑無出汗。食飲者，熱無灼灼，寒無滄滄。寒溫中適，故氣將持，乃不致邪僻也。黃帝曰：本藏以身形肢節(月囷)肉，候五髒六腑之大小焉。今夫王公大人，臨朝即位之君，而問焉，誰可捫循之，而後答乎？岐伯曰：身形肢節者，藏府之蓋也，非面部之閱也。黃帝曰：五藏之氣，閱於面者，餘已知之矣，以肢節知而閱之，奈何？岐伯曰：五藏六府者，肺爲之蓋，巨肩陷咽，候見其外。","bh":"黄帝说：怎样使相逆的两方面都相宜？岐伯说：要使这些相宜，饮食衣服也要寒温适宜，寒时不要凄冷太过，暑时不要出汗过多。饮食方面，热不要滚烫，寒不要冰冷。寒温适中，所以正气得以持守，就不致被邪气所侵害。黄帝说：本藏篇以身形肢节䐃肉，来候五脏六腑的大小。如今那些王公大人、临朝即位的君主，若来询问，谁可以扪摸循按他们而后回答呢？岐伯说：身形肢节是脏腑的外盖，不是面部望诊所能替代的。黄帝说：五脏之气，外现于面部的，我已经知道了，以肢节来察知而外候，是怎样的？岐伯说：五脏六腑中，肺为华盖，肩宽大、咽喉内陷，就可以从外部候见。","notes":[],"pending":false},{"id":"ls29-4","tags":[],"yw":"黃帝曰：善。岐伯曰：五藏六府，心爲之主，缺盆爲之道，骷骨有餘，以候(骨曷)(骨虧)。黃帝曰：善。岐伯曰：肝者，主爲將，使之候外，欲知堅固，視目小大。黃帝曰：善。岐伯曰：脾者，主爲衛，使之迎糧，視脣舌好惡，以知吉兇。黃帝曰：善。岐伯曰：腎者，主爲外，使之遠聽，視耳好惡，以知其性。黃帝曰：善。願聞六府之候。岐伯曰：六府者，胃爲之海，龐骸、大頸、張胸，五谷乃容。鼻隧以長，以候大腸。脣厚、人中長，以候小腸。","bh":"黄帝说：好。岐伯说：五脏六腑，心为之主，缺盆是心的通道，胸骨有余（宽厚），可以候蔽心骨（鸠尾）。黄帝说：好。岐伯说：肝主为将（主谋虑），使它候察于外，要知道它坚固与否，看眼睛的大小。黄帝说：好。岐伯说：脾主为卫（主护卫），使它受纳水谷，看唇舌的好坏，以知吉凶。黄帝说：好。岐伯说：肾主为外（主外应），使它远听，看耳朵的好坏，以知其性。黄帝说：好。想听听六腑的外候。岐伯说：六腑之中，胃为之海，骨骼宽大、颈粗、胸廓张开，五谷才能容纳。鼻道深长，可以候大肠。唇厚、人中长，可以候小肠。","notes":[],"pending":false},{"id":"ls29-5","tags":[],"yw":"目下果大，其膽乃橫。鼻孔在外，膀胱漏泄。鼻柱中央起，三焦乃約，此所以候六府者也。上下三等，藏安且良矣。","bh":"目下眼胞大，其胆就横强。鼻孔外张，膀胱就漏泄。鼻柱中央隆起，三焦就固密，这就是候六腑的方法。身形上中下三部相称，五脏就安和而良好。","notes":[],"pending":false}]},
{"id":"ls30","book":"灵枢","no":30,"title":"决气","titleTw":"決氣","tags":["zhenfa","bingji","zangxiang"],"brief":"分辨精、气、津、液、血、脉六气的定义、脱失的证候，及六气以五谷与胃为大海。","pending":false,"sections":[{"id":"ls30-1","tags":[],"yw":"黃帝曰：餘聞人有精、氣、津、液、血、脈，餘意以爲一氣耳，今乃辨爲六名，餘不知其所以然。岐伯曰：兩神相搏，合而成形，常先身生，是謂精。何謂氣？岐伯曰：上焦開發，宣五谷味，燻膚、充身、澤毛，若霧露之溉，是謂氣。何謂津？岐伯曰：腠理發泄，汗出溱溱，是謂津。何謂液？岐伯曰：谷入氣滿，淖澤注於骨，骨屬屈伸，泄澤補益腦髓，皮膚潤澤，是謂液。何謂血？岐伯曰：中焦受氣，取汁變化而赤，是謂血。何謂脈？岐伯曰：壅遏營氣，令無所避，是謂脈。","bh":"黄帝说：我听说人有精、气、津、液、血、脉，我以为是一气罢了，如今却辨为六个名称，我不知道其中的缘故。岐伯说：男女两性相交，合而成形，在形体产生之前就已先生成的，就叫精。什么叫气？岐伯说：上焦开发，宣散五谷之味，温熏皮肤、充养身形、润泽毛发，如雾露之灌溉，就叫气。什么叫津？岐伯说：腠理发泄，汗出溱溱然（很多的样子），就叫津。什么叫液？岐伯说：水谷入胃、气充而润泽，渗注于骨，使骨属关节屈伸自如，渗泄润泽而补益脑髓，使皮肤润泽，就叫液。什么叫血？岐伯说：中焦受气，取其汁液而变化成红色，就叫血。什么叫脉？岐伯说：约束营气，使它不能外溢妄行，就叫脉。","notes":[],"pending":false},{"id":"ls30-2","tags":[],"yw":"黃帝曰：六氣有，有餘不足，氣之多少，腦髓之虛實，血脈之清濁，何以知之？岐伯曰：精脫者，耳聾；氣脫者，目不明；津脫者，腠理開，汗大泄；液脫者，骨屬屈伸不利，色夭，腦髓消，脛痹，耳數鳴；血脫者，色白，夭然不澤，其脈空虛，此其候也。黃帝曰：六氣者，貴賤何如？岐伯曰：六氣者，各有部主也，其貴賤善惡，可爲常主，然五谷與胃爲大海也。","bh":"黄帝说：六气有有余不足，气的多少，脑髓的虚实，血脉的清浊，怎样知道？岐伯说：精脱的，耳聋；气脱的，目不明；津脱的，腠理开，大汗外泄；液脱的，骨属关节屈伸不利，面色枯夭，脑髓消减，胫痹，耳常常鸣响；血脱的，面色白，枯夭而不润泽，其脉空虚，这就是它的证候。黄帝说：六气的贵贱如何？岐伯说：六气各有其所主的部位，它们的贵贱善恶，各有常主，然而五谷与胃是六气的大海。","notes":[],"pending":false}]},
{"id":"ls31","book":"灵枢","no":31,"title":"肠胃","titleTw":"腸胃","tags":["zhenfa","zangxiang","yinyang"],"brief":"记载唇、齿、会厌、咽门、胃、小肠、回肠、广肠的大小长短容量与肠胃全长及回曲之数。","pending":false,"sections":[{"id":"ls31-1","tags":[],"yw":"黃帝問於伯高曰：餘願聞六府傳谷者，腸胃之大小長短，受谷之多少奈何？伯高曰：請盡言之，谷所從出入淺深遠近長短之度：脣至齒長九分，口廣二寸半；齒以後至會厭，深三寸半，大容五合；舌重十兩，長七寸，廣二寸半；咽門重十兩，廣一寸半。至胃長一尺六寸，胃紆曲屈，伸之，長二尺六寸，大一尺五寸，徑五寸，大容三斗五升。小腸後附脊，左環回日迭積，其注於回腸者，外附於臍上。回運環十六曲，大二寸半，徑八分分之少半，長三丈三尺。","bh":"黄帝问伯高说：我想听听六腑传化谷物的情况，肠胃的大小长短、受纳谷物的多少如何？伯高说：请让我详尽地说，谷物所从出入、深浅、远近、长短的度数：唇至齿长九分，口宽二寸半；齿以后到会厌，深三寸半，大容五合；舌重十两，长七寸，宽二寸半；咽门重十两，宽一寸半，到胃长一尺六寸。胃迂曲弯屈，伸直它，长二尺六寸，大一尺五寸，径五寸，大容三斗五升。小肠后附于脊，从左环绕回周、层迭盘积，它下注于回肠的，外附于脐上，回运环绕十六曲，大二寸半，径八分又三分之一弱，长三丈三尺。","notes":[],"pending":false},{"id":"ls31-2","tags":[],"yw":"回腸當臍左環，回周葉積而下，回運還反十六曲，大四寸，徑一寸寸之少半，長二丈一尺。廣腸傳脊，以受回腸，左環葉脊上下，辟大八寸，徑二寸寸之大半，長二尺八寸。腸胃所入至所出，長六丈四寸四分，回曲環反，三十二曲也。","bh":"回肠正当脐部从左环绕，回周层迭而下，回运还反十六曲，大四寸，径一寸又三分之一弱，长二丈一尺。广肠附于脊，以受纳回肠，从左环迭于脊之上下，宽大八寸，径二寸又三分之二强，长二尺八寸。肠胃从所入到所出，长六丈四寸四分，回曲环反，共三十二曲。","notes":[],"pending":false}]},
{"id":"ls32","book":"灵枢","no":32,"title":"平人绝谷","titleTw":"平人絕谷","tags":["zhenfa","zangxiang","shen"],"brief":"据肠胃容量推算常人不食七日而死的道理，说明胃肠更虚更满与神为水谷精气所生。","pending":false,"sections":[{"id":"ls32-1","tags":[],"yw":"黃帝曰：願聞人之不食，七日而死，何也？伯高曰：臣請言其故。胃大一尺五寸，徑五寸，長二尺六寸，橫屈受水谷三斗五升，其中之谷，常留二斗，水一斗五升而滿，上焦泄氣，出其精微，慓悍滑疾，下焦下溉諸腸。小腸大二寸半，徑八分分之少半，長三丈二尺，受谷二斗四升，水六升三合合之大半。回腸大四寸，徑一寸寸之少半，長二丈一尺，受谷一斗，水七升半。廣腸大八寸，徑二寸寸之大半，長二尺八寸，受谷九升三合八分合之一。腸胃之長，凡五丈八尺四寸，受水谷九斗二升一合合之大半，此腸胃所受水谷之數也。","bh":"黄帝说：想听听人不进饮食，七日而死，是为什么？伯高说：臣请说明其中的缘故。胃大一尺五寸，径五寸，长二尺六寸，横屈而受纳水谷三斗五升，其中谷物常留二斗，水一斗五升就满了；上焦宣泄精气，输出其精微，其气慓悍滑疾，下焦则向下灌溉诸肠。小肠大二寸半，径八分又三分之一弱，长三丈二尺，受纳谷物二斗四升，水六升三合又三分之二强。回肠大四寸，径一寸又三分之一弱，长二丈一尺，受纳谷物一斗，水七升半。广肠大八寸，径二寸又三分之二强，长二尺八寸，受纳谷物九升三合又八分之一合。肠胃的总长，共五丈八尺四寸，受纳水谷九斗二升一合又三分之二强，这就是肠胃所受水谷的数目。","notes":[],"pending":false},{"id":"ls32-2","tags":[],"yw":"平人則不然，胃滿則腸虛，腸滿則胃虛，更虛更滿，故氣得上下，五髒安定，血脈和利，精神乃居，故神者，水谷之精氣也。故腸胃之中，當留谷二斗，水一斗五升；故平人日再後，後二升半，一日中五升，七日五七三斗五升，而留水谷盡矣；故平人不食飲七日而死者，小谷精氣津液皆盡故也。","bh":"平人（常人）却不是这样，胃满则肠虚，肠满则胃虚，更虚更满，所以气得以上下贯通，五脏安定，血脉和利，精神乃能内守，所以神就是水谷的精气。所以肠胃之中，常留谷物二斗，水一斗五升；平人一日大便两次，每次二升半，一日中共五升，七日五七三斗五升，所留的水谷就尽了；所以平人不吃不饮七日而死，是水谷精气津液都已竭尽的缘故。","notes":[],"pending":false}]},
{"id":"ls33","book":"灵枢","no":33,"title":"海论","titleTw":"海論","tags":["ci","jingluo","zhenfa"],"brief":"论人身髓海、血海、气海、水谷之海四海的输注部位及其有余不足的证候与调治法则。","pending":false,"sections":[{"id":"ls33-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞刺法於夫子，夫子之所言，不離於營衛血氣。夫十二經脈者，內屬於腑髒，外絡於肢節，夫子乃合之於四海乎。岐伯答曰：人亦有四海，十二經水。經水者，皆注於海，海有東西南北，命曰四海。黃帝曰：以人應之奈何？岐伯曰：人有髓海，有血海，有氣海，有水谷之海，凡此四者，以應四海也。黃帝曰：遠乎者，夫子之合人天地四海也，願聞應之奈何？岐伯曰：必先明知陰陽表滎腧所在，四海定矣。黃帝曰：定之奈何？岐伯曰：胃者水谷之海，其輸上在氣街（衝），下至三裏；衝脈者，爲十二經之海，其輸上在於大杼，下出於巨虛之上下廉；羶中者，爲氣之海，其輸上在於柱骨之上下，前在於人迎，腦爲髓之海，其輸上在於其蓋，下在風府。","bh":"黄帝问岐伯说：我听夫子讲刺法，夫子所说的，不离于营卫血气。那十二经脉，内属于腑脏，外络于肢节，夫子乃把它们合之于四海吗？岐伯回答说：人也有四海、十二经水。经水都注入于海，海有东西南北，名叫四海。黄帝说：以人相对应，是怎样的？岐伯说：人有髓海，有血海，有气海，有水谷之海，这四者，以应四海。黄帝说：深远啊，夫子把人与天地四海相合，想听听是怎样相应的？岐伯说：必须先明确知道阴阳表里荥腧的所在，四海就可以确定。黄帝说：怎样确定？岐伯说：胃是水谷之海，它的输注上在气街（气冲），下至三里；冲脉是十二经之海（血海），它的输注上在大杼，下出于上巨虚、下巨虚；膻中是气之海，它的输注上在柱骨的上下，前在人迎；脑是髓之海，它的输注上在其盖（百会），下在风府。","notes":[],"pending":false},{"id":"ls33-2","tags":[],"yw":"黃帝曰：凡此四海者，何利何害？何生何敗？岐伯曰：得順者生，得逆者敗；知調者利，不知調者害。黃帝曰：四海之逆順奈何？岐伯曰：氣海有餘者，氣滿胸中，悗息面赤；氣海不足，則氣少不足以言。血海有餘，則常想其身大，怫然不知其所病；血海不足，亦常想其身小，狹然不知其所病。水谷之海有餘，則腹滿；水谷之海不足，則飢不受谷食。髓海有餘，則輕勁多力，自過其度；髓海不足，則腦轉耳鳴，脛酸眩冒，目無所見，懈怠安臥。黃帝曰：餘已聞逆順，調之奈何？岐伯曰：審守其俞，而調其虛實，無犯其害，順者得復，逆者必敗。","bh":"黄帝说：这四海，有什么利、什么害？什么主生、什么主败？岐伯说：得顺的就生，得逆的就败；懂得调养的就利，不懂得调养的就害。黄帝说：四海的逆顺如何？岐伯说：气海有余的，气满胸中，呼吸迫促而面赤；气海不足的，就气少而不足以言语。血海有余的，就常觉得自己身体胀大，郁闷而不知自己病在何处；血海不足的，也常觉得自己身体狭小，紧束不舒而不知自己病在何处。水谷之海有余的，就腹满；水谷之海不足的，就饥饿而不受纳谷食。髓海有余的，就轻健有力，超过常人的限度；髓海不足的，就脑转耳鸣，胫酸眩晕，目无所见，懈怠而安卧。黄帝说：我已听了逆顺，怎样调治？岐伯说：审慎地把握它们的腧穴，而调其虚实，不要犯那些害处，顺的得以恢复，逆的必定败坏。","notes":[],"pending":false},{"id":"ls33-3","tags":[],"yw":"黃帝曰：善。","bh":"黄帝说：好。","notes":[],"pending":false}]},
{"id":"ls34","book":"灵枢","no":34,"title":"五乱","titleTw":"五亂","tags":["ci","jingluo","zhenfa"],"brief":"论十二经脉应十二月四时，气乱于心、肺、肠胃、臂胫、头五处的证候及导气调治取穴。","pending":false,"sections":[{"id":"ls34-1","tags":[],"yw":"黃帝曰：經脈十二者，別爲五行，分爲四時，何失而亂？何得而治？岐伯曰：五行有序，四時有分，相順則治，相逆則亂。黃帝曰：何謂相順？岐伯曰：經脈十二者，以應十二月。十二月者，分爲四時。四時者，春秋冬夏，其氣各異，營衛相隨，陰陽已知，清濁不相干，如是則順之而治。黃帝曰：何爲逆而亂，岐伯曰：清氣在陰，濁氣在陽，營氣順脈，衛氣逆行，清濁相干，亂於胸中，是謂大悗。故氣亂於心，則煩心密嘿，俛首靜伏；亂於肺，則俛仰喘喝，接手以呼；亂於腸胃，是爲霍亂；亂於臂脛，則爲四厥；亂於頭，則爲厥逆，頭重眩僕。","bh":"黄帝说：经脉十二条，别为五行，分为四时，失去什么就乱？得到什么就治？岐伯说：五行有序，四时有分，相顺就治，相逆就乱。黄帝说：什么叫相顺？岐伯说：经脉十二条，以应十二月。十二月分为四时。四时是春、秋、冬、夏，其气各不相同，营卫相随，阴阳已和，清浊不相干扰，这样就顺之而治。黄帝说：什么叫做逆而乱？岐伯说：清气在阴，浊气在阳，营气顺脉而行，卫气反而逆行，清浊相干扰，乱于胸中，这叫大悗（大闷）。所以气乱于心的，就心烦而沉默不语，俯首静伏；乱于肺的，就俯仰喘息有声，两手相接而呼；乱于肠胃的，就是霍乱；乱于臂胫的，就成为四厥；乱于头的，就成为厥逆，头重眩晕而仆倒。","notes":[],"pending":false},{"id":"ls34-2","tags":[],"yw":"黃帝曰：五亂者，刺之有道乎？岐伯曰：有道以來，有道以去，審知其道，是謂身寶。黃帝曰：善。願聞其道。岐伯曰：氣在於心者，取之手少陰心主之俞；氣在於肺者，取之手太陰滎，足少陰俞，氣在於腸胃者，取之足太陰陽明，不下者，取之三裏，氣在於頭者，取之天柱大杼，不知，取足太陽滎俞；氣在於臂足，取之先去血脈，後取其陽明少陽之滎俞。黃帝曰：補瀉奈何？岐伯曰：徐入徐出，謂之導氣。補瀉無形，謂之同精。是非有餘不足也，亂氣之相逆也。","bh":"黄帝说：这五种乱，刺治有方法吗？岐伯说：有道以来，有道以去，审知这个道，就是人身的至宝。黄帝说：好。想听听这道。岐伯说：气在于心的，取手少阴、心主之俞；气在于肺的，取手太阴荥、足少阴俞；气在于肠胃的，取足太阴、阳明，气不下的，取之三里；气在于头的，取天柱、大杼，不愈的，取足太阳荥俞；气在于臂足的，先刺其血脉去血，然后取其阳明、少阳之荥俞。黄帝说：补泻怎样？岐伯说：徐入徐出，叫做导气。补泻不露形迹，叫做同精（使精气归同）。这不是有余不足，而是乱气之相逆。","notes":[],"pending":false},{"id":"ls34-3","tags":[],"yw":"黃帝曰：允乎哉道，明乎哉論，請着之玉版，命曰治亂也。","bh":"黄帝说：确当啊这个道，明彻啊这篇论，请把它刻在玉版上，名叫治乱。","notes":[],"pending":false}]},
{"id":"ls35","book":"灵枢","no":35,"title":"胀论","titleTw":"脹論","tags":["ci","jingluo","zhenfa"],"brief":"论胀病的部位、五脏六腑胀的形证、胀的成因与卫气逆行，以及泻补疾徐的针刺原则。","pending":false,"sections":[{"id":"ls35-1","tags":[],"yw":"黃帝曰：脈之應於寸口，如何而脹？岐伯曰：其脈大堅以澀者，脹也。黃帝曰：何以知藏府之脹也。岐伯曰：陰爲藏，陽爲府。黃帝曰：夫氣之令人脹也，在於血脈之中耶，髒腑之內乎？岐伯曰：三者皆存焉，然非脹之舍也。黃帝曰：願聞脹之舍。岐伯曰：夫脹者，皆在於髒腑之外，排髒腑而郭胸脅，脹皮膚，故命曰脹。黃帝曰：髒腑之在胸脅腹裏之內也，若匣匱之藏禁器也，名有次舍，異名而同處，一域之中，其氣各異，願聞其故。黃帝曰：未解其意，再問。","bh":"黄帝说：脉应于寸口，怎样就是胀？岐伯说：其脉大而坚兼涩的，就是胀。黄帝说：怎样知道脏腑之胀呢？岐伯说：阴为脏，阳为腑。黄帝说：气使人胀，是在血脉之中呢，还是在脏腑之内呢？岐伯说：三者都存在，然而都不是胀的居处。黄帝说：想听听胀的居处。岐伯说：胀都在脏腑之外，排挤脏腑而扩充胸胁，使皮肤发胀，所以叫胀。黄帝说：脏腑在胸胁腹里的内部，好像匣柜中收藏禁器一样，各有其次舍，名称不同而同在一处，同一区域之中，其气各不相同，想听听其中的缘故。（黄帝说：）我不理解这个意思，再问。","notes":[],"pending":false},{"id":"ls35-2","tags":[],"yw":"岐伯曰：夫胸腹，髒腑之郭也。羶中者，心主之宮城也；胃者，太倉也；咽喉、小腸者，傳送也；胃之五竅者，閭裏門戶也；廉泉、玉英者，津液之道也。故五髒六腑者，各有畔界，其病各有形狀。營氣循脈，衛氣逆爲脈脹；衛氣並脈循分爲膚脹。三裏而瀉，近者一下，遠者三下，無問虛實，工在疾瀉。黃帝曰：願聞脹形。岐伯曰：夫心脹者煩心短氣，臥不安；肺脹者，虛滿而喘咳；肝脹者，脅下滿而痛引小腹；脾脹者，善穢，四肢煩俛，體重不能勝衣，臥不安；腎脹者，腹滿引背央央然，腰髀痛。","bh":"岐伯说：胸腹是脏腑的城郭。膻中是心主的宫城；胃是太仓；咽喉、小肠是传送的通道；胃的五窍是里巷的门户；廉泉、玉英是津液的道路。所以五脏六腑各有边界，它们的病各有形状。营气循脉而行，卫气逆行就成为脉胀；卫气并脉而循行于分肉，就成为肤胀。取三里而泻，病近的一刺，病远的三刺，不问虚实，关键在于急速泻之。黄帝说：想听听胀的形证。岐伯说：心胀的，心烦短气，睡卧不安；肺胀的，虚满而喘咳；肝胀的，胁下胀满而痛引小腹；脾胀的，多哕，四肢烦闷，身体沉重得连衣服都撑不起，睡卧不安；肾胀的，腹满而牵引背部央央然（胀闷不舒），腰髀疼痛。","notes":[],"pending":false},{"id":"ls35-3","tags":[],"yw":"六府脹，胃脹者，腹滿，胃脘痛，鼻聞焦臭，妨於食，大便難；大腸脹者，腸鳴而痛濯濯，冬日重感於寒，則餐泄不化；小腸脹者，少腹慎脹，引腰而痛；膀胱脹者，少腹而氣癃；三焦脹者，氣滿於皮膚中，輕輕然而不堅；膽脹者，脅下痛脹，口中苦，善太息。凡此諸脹者，其道在一，明知逆順，針數不失，瀉虛補實，神去其室，致邪失正，真不可定，麤之所敗，謂之天命；補虛瀉實，神歸其室，久塞其空，謂之良工。黃帝曰：脹者焉生？何因而有？岐伯曰：衛氣之在身也，常然並脈，循分肉，行有逆順，陰陽相隨，乃得天和，五髒更始，四時循序，五谷乃化。","bh":"六腑之胀，胃胀的，腹满，胃脘痛，鼻闻焦臭，妨碍进食，大便难；大肠胀的，肠鸣而痛，濯濯然（有水声），冬日再感受寒邪，就完谷不化的餐泄；小肠胀的，少腹胀满，牵引腰部而痛；膀胱胀的，少腹胀满而气癃（小便不通）；三焦胀的，气充满于皮肤之中，轻轻然而不坚实；胆胀的，胁下痛胀，口中苦，常太息。凡此各种胀，道理是一致的，明辨逆顺，针刺之数不失法度；若泻虚补实，则神离其室，招致邪气而失却正气，真气不能安定，这是粗工造成的败坏，叫做天命；补虚泻实，则神归其室，久闭其孔穴，叫做良工。黄帝说：胀是怎么产生的？因什么而有？岐伯说：卫气在人身，常常与脉并行，循行于分肉，运行有逆有顺，阴阳相随，乃能得天地之和，五脏更始，四时循序，五谷才能化生。","notes":[],"pending":false},{"id":"ls35-4","tags":[],"yw":"然後厥氣在下，營衛留止，寒氣逆上，真邪相攻，兩氣相搏，乃合爲脹也。黃帝曰：善。何以解惑？岐伯曰：合之於真，三合而得。帝曰：善。黃帝問於岐伯曰：脹論言無問虛實，工在疾瀉，近者一下，遠者三下，今有其三而不下者，其過焉在？岐伯對曰：此言陷於肉肓，而中氣穴者也。不中氣穴，則氣內閉，針不陷肓，則氣不行，上越中肉，則衛氣相亂，陰陽相逐。其於脹也，當瀉不瀉，氣故不下，三而不下，必更其道，氣下乃止，不下復始，可以萬全，烏有殆者乎？其於脹也，必審其彌，當瀉則瀉，當補則補，如鼓應桴，惡有不下者乎？","bh":"然后厥气在下，营卫留止，寒气逆而上行，真邪相攻，两气相搏，就合而为胀。黄帝说：好。怎样解除疑惑？岐伯说：合之于真气，三部相合而可得。黄帝说：好。黄帝问岐伯说：胀论说无问虚实，关键在于疾泻，病近的一刺，病远的三刺，如今有刺三次而气不下的，它的过失在哪里？岐伯回答说：这是说针要陷于肉肓之间，而刺中气穴的。不中气穴，则气内闭；针不陷于肓，则气不行；针刺越于中肉之分，则卫气相乱，阴阳相追逐。对于胀病，当泻而不泻，气所以不下；刺三次而不下，必须更换其道，气下乃止，不下就重新开始，这样可以万全，哪有危险呢？对于胀病，必须审察其脉，当泻就泻，当补就补，如鼓之应槌，哪有气不下之理呢？","notes":[],"pending":false}]},
