<style>
/* ===== 读内经 · 样式 ===== */
:root{
  --paper:#f2e7cb;
  --paper2:#f8f1de;
  --paper-deep:#e9d9ab;
  --line:#d9c9a4;
  --line2:#ab9670;
  --ink:#171208;
  --ink2:#4b4028;
  --ink3:#6c6042;
  --zhu:#a32a17;
  --zhu-bg:#f6ddd0;
  --indigo:#17496f;
  --indigo-bg:#e4ecf2;
  --gold:#7d5310;
  --green:#2f6238;
  --sans:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",Georgia,serif;
  --fs:19px;
  /* 派生语义量：夜间模式只需覆盖这一组 */
  --paper-a:rgba(242,231,203,.95);
  --hover:#e9dcbc;
  --quote-bg:#f8f1d9;
  --txt2:#221c0e;
  --txt3:#332a17;
  --flash:#eed68c;
  --highlight:#e9c96b;
  --th-bg:#eadcbb;
  --src-t:#481f16;
  --node-bg:#f7efd8;
  --svg-line:#685c46;
  --scroll:#b0a17f;
}

/* ---------- 夜间模式 ---------- */
body.night{
  --paper:#12100a;
  --paper2:#1d1a12;
  --line:#3c3a30;
  --line2:#5c5943;
  --ink:#efe6cc;
  --ink2:#cac0a4;
  --ink3:#a89e82;
  --zhu:#ff8f76;
  --zhu-bg:#37211c;
  --indigo:#8fc6e8;
  --indigo-bg:#1a2029;
  --gold:#e5c164;
  --green:#93cb93;
  --paper-a:rgba(18,16,10,.95);
  --hover:#2e2a1e;
  --quote-bg:#262014;
  --txt2:#e8dec2;
  --txt3:#d8cdad;
  --flash:#54451a;
  --highlight:#5a4a15;
  --th-bg:#2b2618;
  --src-t:#f4cdc3;
  --node-bg:#1f1c13;
  --svg-line:#918a76;
  --scroll:#514d3e;
}
body.night img.oldchart-img{filter:brightness(.86) contrast(1.12) sepia(.2)}
/* 图片统一压成暖黄调，避免出现纯白块 */
#mer-fig img,#off-fig img,#mp-fig img,.oldchart-img{filter:sepia(.16) saturate(1.06) contrast(1.02)}
body.night .mer-chip.on,
body.night .wx-chip.on,
body.night .tool-btn.on,
body.night .tm.on,
body.night .mp-btn.on{color:#12100a}
/* 夜间主题切换按钮：宽度自适应文字，避免「夜间 / 日间」两字被挤偏 */
#btn-theme{min-width:46px;text-align:center}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:var(--fs);
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:9px;
  height:52px;padding:0 14px;
  background:var(--paper-a);
  backdrop-filter:blur(8px);
  border-bottom:2px solid var(--line2);
  /* 窄屏时整条横向滚动，不挤压按钮导致文字折行竖排 */
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
#topbar::-webkit-scrollbar{display:none}
.brand{
  font-size:19px;font-weight:700;letter-spacing:.08em;color:var(--ink);
  white-space:nowrap;
}
.brand em{font-style:normal;color:var(--zhu)}
.navbtn{
  border:none;background:none;color:var(--ink2);
  font-size:15px;padding:5px 2px;border-bottom:2px solid transparent;
  letter-spacing:.03em;
  /* 三字以上标题一律单行横排，不折行 */
  white-space:nowrap;flex:0 0 auto;line-height:1.2;
}
.navbtn:hover{color:var(--ink)}
.navbtn.on{color:var(--zhu);border-bottom-color:var(--zhu);font-weight:700}
.spacer{flex:1 1 auto;min-width:0}
#topbar>.brand,#topbar>span{flex:0 0 auto;white-space:nowrap}
#q{
  flex:0 1 132px;min-width:96px;
  padding:4px 8px;font-size:13.5px;font-family:var(--sans);
  border:1px solid var(--line2);border-radius:4px;background:var(--paper2);
  color:var(--ink);outline:none;
}
#q:focus{border-color:var(--zhu)}
.tool-btn{
  border:1px solid var(--line2);background:var(--paper2);
  color:var(--ink2);font-size:12.5px;font-family:var(--sans);
  padding:3px 6px;border-radius:3px;letter-spacing:.02em;
  white-space:nowrap;flex:0 0 auto;line-height:1.5;
}
.tool-btn:hover{border-color:var(--zhu);color:var(--zhu)}
.tool-btn.on{background:var(--zhu);border-color:var(--zhu);color:#fdf4dc}

/* ---------- 布局 ---------- */
#wrap{display:flex;height:calc(100vh - 78px);overflow:hidden}
#toc{
  width:242px;flex:0 0 242px;overflow-y:auto;
  border-right:1px solid var(--line);background:var(--paper2);
  padding:12px 0 40px;
}
#main{flex:1;overflow-y:auto;padding:0 0 120px}
#aside{
  width:312px;flex:0 0 312px;overflow-y:auto;
  border-left:1px solid var(--line);background:var(--paper2);
}
#main.narrow{max-width:940px;margin:0 auto}
body.hide-toc #toc{display:none}
body.hide-aside #aside{display:none}

/* 目录收缩把手：常驻页面左缘 */
#toc-handle{
  position:fixed;left:0;top:44%;z-index:70;width:24px;padding:8px 0;
  border:1px solid var(--line2);border-left:none;background:var(--paper2);
  color:var(--ink3);cursor:pointer;border-radius:0 6px 6px 0;
  font-size:11px;line-height:1.35;text-align:center;font-family:var(--sans);
}
#toc-handle:hover{color:var(--zhu);border-color:var(--zhu)}

/* 古籍经络图 */
.oldchart-wrap{padding:10px}
.oldchart-img{width:100%;display:block;border-radius:3px;box-shadow:0 1px 6px rgba(60,45,20,.14)}
.oldchart-cap{
  font-family:var(--sans);font-size:11px;color:var(--ink3);
  letter-spacing:.05em;padding:7px 2px 2px;text-align:center;
}
.oldchart-empty{
  padding:46px 26px;font-family:var(--sans);font-size:13px;
  color:var(--ink3);text-align:center;line-height:2;
}

/* 阅读栏宽度：仿「阅读模式」三档 */
body.w-wide #main .inner{max-width:1180px}
body.w-mid  #main .inner{max-width:860px}
body.w-nar  #main .inner{max-width:660px}
#main .inner{margin:0 auto;padding:34px 42px 0}

/* ---------- 目录 ---------- */
.toc-book{
  padding:8px 16px 4px;font-size:13px;color:var(--ink3);
  font-family:var(--sans);letter-spacing:.14em;
}
.toc-item{
  display:flex;align-items:baseline;gap:7px;
  padding:5px 16px;font-size:15px;color:var(--ink2);
  border-left:3px solid transparent;cursor:pointer;line-height:1.5;
}
.toc-item:hover{background:var(--hover);color:var(--ink)}
.toc-item.on{
  background:var(--zhu-bg);color:var(--zhu);font-weight:700;
  box-shadow:inset 0 0 0 1px var(--zhu-bg);
  border-left-color:var(--zhu);
}
.toc-no{
  font-family:var(--sans);font-size:11px;color:var(--ink3);
  min-width:20px;text-align:right;
}
.toc-item.on .toc-no{color:var(--zhu)}

/* ---------- 篇章头 ---------- */
.crumb{
  font-family:var(--sans);font-size:12.5px;color:var(--ink3);
  letter-spacing:.06em;margin-bottom:14px;
}
.crumb b{color:var(--ink2);font-weight:600}
.ch-title{
  font-size:31px;font-weight:700;letter-spacing:.1em;margin:0 0 4px;
}
.ch-sub{
  font-family:var(--sans);font-size:13px;color:var(--ink3);
  letter-spacing:.05em;margin-bottom:12px;
}
.ch-brief{
  background:var(--paper2);border:1px solid var(--line);
  border-left:4px solid var(--gold);
  padding:12px 15px;border-radius:3px;
  font-size:15.5px;color:var(--ink2);line-height:1.85;margin-bottom:8px;
}
.ch-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 22px}
.tg{
  font-family:var(--sans);font-size:11.5px;padding:2px 8px;border-radius:11px;
  border:1px solid currentColor;letter-spacing:.05em;
}

/* ---------- 段落卡 ---------- */
.sec{
  border-top:1px solid var(--line);padding:20px 0 22px;position:relative;
}
.sec:first-of-type{border-top:none}
.sec-bar{
  display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;
}
.sec-no{
  font-family:var(--sans);font-size:11px;color:var(--gold);font-weight:600;
  letter-spacing:.05em;
  background:var(--paper2);border:1px solid var(--line2);border-radius:10px;
  padding:2px 8px;
}
.mini-btn{
  font-family:var(--sans);font-size:11.5px;padding:1.5px 8px;
  border:1px solid var(--line2);border-radius:11px;background:var(--paper2);
  color:var(--ink2);letter-spacing:.04em;
}
.mini-btn:hover{border-color:var(--zhu);color:var(--zhu)}
.mini-btn.mer{border-color:var(--indigo);color:var(--indigo);font-weight:600}
.mini-btn.off{border-color:var(--gold);color:var(--gold);font-weight:600}
.mini-btn.man{border-color:var(--green);color:var(--green);font-weight:600}
.mini-btn.hi{background:var(--zhu);color:#fdf4dc;border-color:var(--zhu)}

.yw{
  font-size:var(--fs);line-height:2.05;letter-spacing:.045em;
  color:var(--ink);text-align:justify;
  background:var(--paper-deep);
  padding:16px 18px;border-radius:4px;
  box-shadow:inset 0 0 0 1px var(--line2);
}
body.hide-bh .bh{display:none}
body.hide-note .notes{display:none}
.bh{
  margin-top:11px;padding:11px 14px;
  background:var(--quote-bg);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:3px;font-size:15.5px;line-height:1.9;color:var(--txt3);text-align:justify;
}
.bh::before{
  content:"翻译";display:inline-block;margin-right:8px;
  font-family:var(--sans);font-size:10.5px;color:var(--gold);
  border:1px solid var(--gold);border-radius:2px;padding:0 4px;
  vertical-align:2px;letter-spacing:.08em;
}
/* 术语 */
.t{
  color:var(--zhu);border-bottom:1px dotted var(--zhu);
  cursor:pointer;transition:background .12s;
}
.t:hover{background:var(--zhu-bg)}
.t.on{background:var(--highlight);font-weight:600}
.notes{margin-top:11px}
.nt{
  display:flex;gap:9px;font-size:14.5px;line-height:1.8;
  color:var(--ink2);padding:3px 0;
}
.nt-w{
  flex:0 0 auto;font-family:var(--sans);font-size:11px;
  width:22px;height:22px;line-height:20px;text-align:center;
  border:1px solid var(--line2);border-radius:50%;
  color:var(--ink3);margin-top:5px;
}
.nt-w.x{color:#6a4699;border-color:#6a4699;font-weight:600}
.nt-w.y{color:var(--green);border-color:var(--green);font-weight:600}
.nt-w.a{color:var(--gold);border-color:var(--gold);font-weight:600}
.sec.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{background:var(--flash)}100%{background:transparent}}

/* ---------- 右栏 ---------- */
.aside-hd{
  padding:13px 16px 9px;border-bottom:1px solid var(--line);
  font-family:var(--sans);font-size:12px;color:var(--ink3);
  letter-spacing:.16em;display:flex;justify-content:space-between;align-items:center;
}
.aside-hd button{
  border:none;background:none;color:var(--ink3);font-size:15px;padding:0 4px;
}
.aside-body{padding:14px 16px 40px}
.card-h{
  font-size:19px;font-weight:700;letter-spacing:.05em;margin:0 0 2px;
}
.card-py{
  font-family:var(--sans);font-size:12px;color:var(--ink3);letter-spacing:.1em;
}
.card-cat{
  display:inline-block;font-family:var(--sans);font-size:11px;
  padding:1px 8px;border-radius:10px;margin:9px 0 10px;
  border:1px solid currentColor;color:var(--indigo);
}
.card-def{font-size:15px;line-height:1.95;color:var(--txt2);text-align:justify}
.card-link{
  margin-top:14px;font-family:var(--sans);font-size:12.5px;
  color:var(--indigo);cursor:pointer;border-top:1px dashed var(--line2);
  padding-top:9px;
}
.card-link:hover{color:var(--zhu)}
.empty{color:var(--ink3);font-size:14px;font-family:var(--sans);line-height:1.9}
.occ{
  font-family:var(--sans);font-size:12.5px;color:var(--ink2);
  padding:7px 0;border-bottom:1px dashed var(--line);
}
.occ:hover{color:var(--zhu);cursor:pointer}
.occ b{color:var(--ink3);font-weight:400;font-size:11px;margin-right:6px}

/* ---------- 全屏可视化视图 ---------- */
#viz{display:none;height:calc(100vh - 78px);overflow-y:auto;background:var(--paper2)}
#viz.on{display:block}
#result{height:calc(100vh - 78px);overflow-y:auto;background:var(--paper2)}
body.viz #wrap{display:none}
.viz-head{
  padding:18px 30px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;background:var(--paper-a);
  backdrop-filter:blur(6px);z-index:5;
}
.viz-head h2{margin:0;font-size:22px;letter-spacing:.12em}
.viz-head p{margin:0;font-family:var(--sans);font-size:12.5px;color:var(--ink3)}
.viz-body{display:flex;gap:0;align-items:flex-start;padding:18px 30px 60px}

/* 经络图 */
#mer-fig{flex:0 0 430px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
#mer-panel{flex:1;padding:0 0 0 26px;min-width:300px}
.mer-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mer-chip{
  font-family:var(--sans);font-size:12.5px;padding:3px 10px;border-radius:12px;
  border:1px solid var(--line2);background:var(--paper2);color:var(--ink2);
}
.mer-chip:hover{border-color:var(--zhu)}
.mer-chip.on{color:#fdf4dc;border-color:transparent}
.mer-chip .dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;
}
.view-sw{display:flex;gap:6px;margin-bottom:12px}
.mp-name{font-size:20px;font-weight:700;margin:0 0 3px}
.mp-sub{font-family:var(--sans);font-size:12px;color:var(--ink3);letter-spacing:.08em;margin-bottom:12px}
.mp-h{
  font-family:var(--sans);font-size:11.5px;color:var(--ink3);
  letter-spacing:.14em;margin:14px 0 5px;
}
.mp-t{font-size:15.5px;line-height:1.95;color:var(--txt2);text-align:justify}
.mp-dis li{
  font-size:15px;line-height:1.9;color:var(--txt3);margin-bottom:6px;
  padding-left:12px;border-left:2px solid var(--line2);
}
.mer-path{fill:none;stroke-width:2.6;stroke-linecap:round;opacity:.58;cursor:pointer;transition:opacity .15s,stroke-width .15s}
.mer-path:hover{opacity:.88}
.mer-path.on{opacity:1;stroke-width:4}
.body-line{fill:none;stroke:var(--svg-line);stroke-linecap:round;stroke-linejoin:round}
.body-fill{fill:var(--node-bg);stroke:var(--svg-line);stroke-width:1.2}
.pt-dot{fill:var(--paper2);stroke:var(--zhu);stroke-width:1.5;cursor:pointer}
.pt-dot:hover,.pt-dot.on{fill:var(--zhu)}
.pt-lb{font-family:var(--sans);font-size:9px;fill:var(--ink2);pointer-events:none}
#forcebar{
  font-family:var(--sans);font-size:11px;fill:var(--ink3);letter-spacing:.1em;
}

/* 十二官 */
#off-fig{flex:0 0 560px}
#off-panel{flex:1;padding:0 0 0 20px;min-width:270px}
.off-node{cursor:pointer}
.off-node circle{transition:stroke-width .15s,fill .15s}
.off-node:hover circle.off-c{stroke-width:2.5}
.off-nm{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#fdf4dc;letter-spacing:.04em}
.off-rk{font-family:var(--sans);font-size:10px;text-anchor:middle;fill:var(--ink2)}
.off-line{stroke:var(--line2);stroke-width:1;fill:none}

/* 运气 */
.yq-box{max-width:720px}
.yq-in{display:flex;gap:8px;align-items:center;margin:16px 0}
.yq-in input{
  width:130px;padding:7px 11px;font-size:16px;font-family:var(--serif);
  border:1px solid var(--line2);border-radius:4px;background:var(--paper2);color:var(--ink);
}
.yq-out{
  margin-top:14px;padding:16px 18px;border:1px solid var(--line);
  border-radius:4px;background:var(--paper);
}
.yq-gz{font-size:26px;font-weight:700;letter-spacing:.2em;color:var(--zhu)}
.yq-row{
  display:flex;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);
  font-size:15px;
}
.yq-row b{flex:0 0 88px;font-weight:400;color:var(--ink3);font-family:var(--sans);font-size:13px}
.yq-note{font-family:var(--sans);font-size:12.5px;color:var(--ink3);margin-top:12px;line-height:1.8}

/* 手法演示器 */
#manip-body{display:flex;gap:26px;flex-wrap:wrap}
#mp-fig{flex:0 0 480px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
#mp-panel{flex:1;min-width:290px}
.mp-btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.mp-btn{
  font-size:17px;font-weight:700;font-family:var(--serif);
  width:52px;height:52px;border-radius:50%;
  border:1px solid var(--line2);background:var(--paper2);color:var(--ink2);
}
.mp-btn:hover{border-color:var(--zhu);color:var(--zhu)}
.mp-btn.on{background:var(--zhu);color:#fdf4dc;border-color:var(--zhu)}
.mp-title{font-size:23px;font-weight:700;margin:0 0 2px}
.mp-sub2{font-family:var(--sans);font-size:13px;color:var(--ink3);letter-spacing:.1em;margin-bottom:12px}
.mp-src{
  margin-top:14px;padding:11px 14px;background:var(--zhu-bg);
  border-left:3px solid var(--zhu);font-size:15px;line-height:1.9;color:var(--src-t);
}
.mp-src b{
  display:block;font-family:var(--sans);font-size:11px;color:var(--zhu);
  letter-spacing:.14em;margin-bottom:4px;font-weight:400;
}
.slider-row{
  display:flex;align-items:center;gap:10px;margin-top:14px;
  font-family:var(--sans);font-size:12px;color:var(--ink2);
}
.slider-row input[type=range]{flex:1;accent-color:var(--zhu)}

/* 搜索结果 */
#result{padding:18px 30px 60px}
#result .rs{
  padding:12px 0;border-bottom:1px dashed var(--line);cursor:pointer;
}
#result .rs:hover{background:var(--hover)}

}

}

#mscrim{

}

<body>

<header id="topbar">

</header>

    <div class="aside-hd">
      <span id="aside-title">助手</span>
      <button id="aside-close">×</button>
    </div>
    <div class="aside-body" id="aside-body"></div>
  </aside>
</div>

<button id="toc-handle" title="收起 / 展开目录">‹<br>目<br>录<br>›</button>

<div id="viz"></div>
<div id="result" style="display:none"></div>

<footer style="
  position:fixed;bottom:0;left:0;right:0;height:26px;line-height:26px;
  background:var(--paper-a);border-top:1px solid var(--line);
  font-family:var(--sans);font-size:11px;color:var(--ink3);
  letter-spacing:.06em;padding:0 14px;display:flex;gap:14px;z-index:60">
  <span>「读内经」— 结构与藏象阅读器 · v0.1 · 精选十篇</span>
  <span style="margin-left:auto">章节 收录 10 篇 / 62 段 / 原文约 0.4 万字　·　术语 56 条 · 十二正经 + 任督 · 十四经图谱 14 幅 · 十二官 · 按法六手</span>
</footer>

<script>

/* ============================================================
   手机版 / 电脑版 适配层
   ============================================================ */
(function () {
  "use strict";
  const KEY = "nj.viewmode";
  const root = document.documentElement;
  let isTouch = false;
  try {
    isTouch = (window.matchMedia && matchMedia("(pointer:coarse)").matches) || (navigator.maxTouchPoints > 0);
  } catch (e) {}
  if (isTouch) root.classList.add("mtouch");

  const $ = id => document.getElementById(id);

  const gate = document.createElement("div");
  gate.id = "mgate";
  gate.hidden = true;
  gate.innerHTML = '<div class="mg-box">' +
    '<div class="mg-t">读内经 · 黄帝内经结构与藏象</div>' +
    '<div class="mg-s">先选一种阅读方式 · 之后可在顶栏随时切换</div>' +
    '<div class="mg-cards">' +
      '<button class="mg-card" data-m="desktop">' +
        '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6">' +
        '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>' +
        '<b>电脑版</b><i>三栏常驻<br>目录 / 助手 固定在两侧</i>' +
        '<em class="mg-rec"' + (isTouch ? " hidden" : "") + '>推荐</em>' +
      '</button>' +
      '<button class="mg-card" data-m="mp">' +
        '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6">' +
        '<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>' +
        '<b>手机版 · 竖屏</b><i>窄屏排版<br>顶栏可换行 / 抽屉近满屏</i>' +
        '<em class="mg-rec"' + (isTouch ? "" : " hidden") + '>推荐</em>' +
      '</button>' +
      '<button class="mg-card" data-m="ml">' +
        '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6">' +
        '<rect x="2" y="7" width="20" height="10" rx="2.5"/><path d="M18.5 11v2"/></svg>' +
        '<b>手机版 · 横屏</b><i>宽屏排版<br>顶栏压矮 / 抽屉收窄</i>' +
      '</button>' +
    '</div>' +
    '<button class="mg-cancel" id="mgCancel" hidden>继续当前版本</button>' +
    '<div class="mg-foot">横屏版按宽屏排版，竖屏拿手机时会提示转屏；竖屏版按窄屏排版，随时可用</div>' +
  '</div>';

  const rot = document.createElement("div");
  rot.id = "mrotate";
  rot.innerHTML = '<div class="mr-in">' +
    '<div class="mr-ico"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.6">' +
    '<rect x="8" y="1.5" width="8" height="15" rx="2" transform="rotate(90 12 9)"/>' +
    '<path d="M4.5 20a8 8 0 0 1 0-11"/><path d="M2 17.5l2.6 2.8L7.4 17.8"/></svg></div>' +
    '<div class="mr-t">请横屏阅读</div>' +
    '<div class="mr-s">你选的是手机版 · 横屏<br>竖屏下仍是竖屏排版，不会自动变横屏</div>' +
    '<div class="mr-btns">' +
      '<button class="mr-btn" id="mrDesk">改用电脑版</button>' +
      '<button class="mr-btn mr-keep" id="mrPortrait">换成竖屏版</button>' +
      '<button class="mr-btn mr-keep" id="mrMobile">仍用横屏版（不再提示）</button>' +
    '</div>' +
  '</div>';

  const scrim = document.createElement("div");
  scrim.id = "mscrim";
  scrim.onclick = closeAll;

  function closeAll() { root.classList.remove("m-side", "m-ai"); syncScrim(); }
  function drawer(name, open) {
    const cls = "m-" + name;
    const on = (open === undefined) ? !root.classList.contains(cls) : !!open;
    if (on) { root.classList.remove("m-side", "m-ai"); root.classList.add(cls); }
    else { root.classList.remove(cls); }
    syncScrim();
  }
  function syncScrim() {
    scrim.classList.toggle("on", root.classList.contains("m-side") || root.classList.contains("m-ai"));
  }
  function syncTopbar() {
    const h = $("topbar");
    if (h) root.style.setProperty("--mh", h.offsetHeight + "px");
  }

  const MODE_NAME = { desktop: "电脑版", mp: "手机版·竖屏", ml: "手机版·横屏" };
  function cur() {
    if (root.classList.contains("mode-desktop")) return "desktop";
    if (root.classList.contains("m-portrait")) return "mp";
    if (root.classList.contains("m-landscape")) return "ml";
    return null;
  }

  const origOn = {};
  function apply(m) {
    root.classList.remove("mode-mobile", "mode-desktop", "m-portrait", "m-landscape");
    if (m === "desktop") root.classList.add("mode-desktop");
    else root.classList.add("mode-mobile", m === "mp" ? "m-portrait" : "m-landscape");
    root.classList.add("mready");
    closeAll();
    const sw = $("modeSwitch");
    if (sw) { sw.textContent = (MODE_NAME[m] || "选择版本"); sw.title = "点击重新选择版本"; }

    const tocBtn = $("btn-toc"), handle = $("toc-handle"), asideBtn = $("btn-aside"), asideClose = $("aside-close");
    if (m !== "desktop") {
      document.body.classList.remove("hide-toc", "hide-aside");
      if (tocBtn) tocBtn.onclick = () => drawer("side");
      if (handle) handle.onclick = () => drawer("side");
      if (asideBtn) asideBtn.onclick = () => drawer("ai");
      if (asideClose) asideClose.onclick = () => root.classList.remove("m-ai");
    } else {
      if (tocBtn) tocBtn.onclick = origOn.toc || (() => document.body.classList.toggle("hide-toc"));
      if (handle) handle.onclick = origOn.handle || (() => document.body.classList.toggle("hide-toc"));
      if (asideBtn) asideBtn.onclick = origOn.aside || (() => document.body.classList.toggle("hide-aside"));
      if (asideClose) asideClose.onclick = origOn.asideClose || (() => document.body.classList.add("hide-aside"));
      document.body.classList.remove("hide-toc");
      document.body.classList.add("hide-aside");
    }
    setTimeout(syncTopbar, 40);
    window.dispatchEvent(new Event("resize"));
  }

  function save(m) { try { localStorage.setItem(KEY, m); } catch (e) {} }
  function read() {
    let v = null;
    try { v = localStorage.getItem(KEY); } catch (e) {}
    if (v === "mobile") v = "ml";            /* 旧版「手机版」视为横屏版 */
    if (v !== "desktop" && v !== "mp" && v !== "ml") v = null;
    return v;
  }

  function openGate() {
    const now = cur();
    Array.prototype.forEach.call(gate.querySelectorAll(".mg-card"), function (b) {
      b.classList.toggle("cur", b.getAttribute("data-m") === now);
    });
    const c = $("mgCancel");
    if (c) c.hidden = !now;
    gate.hidden = false;
  }

  function addSwitch() {
    const bar = $("topbar");
    if (!bar || $("modeSwitch")) return;
    const b = document.createElement("button");
    b.className = "tool-btn";
    b.id = "modeSwitch";
    b.onclick = openGate;
    bar.appendChild(b);

      root.classList.add("m-allow-portrait");
      try { localStorage.setItem(KEY + "_allowPortrait", "1"); } catch (e) {}

      if (e.key !== "Escape") return;
      if (!gate.hidden && cur()) { gate.hidden = true; return; }
      closeAll();

    window.addEventListener("orientationchange", function () { setTimeout(syncTopbar, 300); });
  };
  NJModeBoot();
})();

        id: "sw01-5", tags: ["zangxiang", "yang"],
        yw: "岐伯曰：女子七歲，腎氣盛，齒更髮長。二七而天癸至，任脈通，太衝脈盛，月事以時下，故有子。三七，腎氣平均，故真牙生而長極。四七，筋骨堅，髮長極，身體盛壯。五七，陽明脈衰，面始焦，髮始墮。六七，三陽脈衰於上，面皆焦，髮始白。七七，任脈虛，太衝脈衰少，天癸竭，地道不通，故形壞而無子也。",
        bh: "岐伯说：女子七岁时，肾气开始充盛，换牙，头发长得快。十四岁时天癸到来，任脉通畅，太冲脉充盛，月经按时来潮，所以能够生育。二十一岁时，肾气平匀充足，智齿生出，身高达到了顶点。二十八岁时，筋骨坚固，头发长到最盛，身体最为壮实。三十五岁时，阳明经脉之气衰退，面部开始憔悴，头发开始脱落。四十二岁时，三阳经脉之气从上部衰退，整个面部都憔悴了，头发开始变白。四十九岁时，任脉空虚，太冲脉衰少，天癸枯竭，月经停闭而地道不通，所以形体衰败，不能再生育了。",
        notes: [
          { w: "训", t: "天癸：肾精充盈到一定程度后产生的、促成生殖机能成熟的物质。" },
          { w: "训", t: "地道不通：指月经停止。焦，通憔，枯槁不泽。" },
          { w: "按", t: "注意衰老的起点在「阳明脉衰」而不在肾。面部是阳明胃经所过，此处把消化吸收能力视作衰老的第一个可见窗口。" }
        ]
      },
      {
        id: "sw01-6", tags: ["zangxiang", "yang"],
        yw: "丈夫八歲，腎氣實，髮長齒更。二八，腎氣盛，天癸至，精氣溢瀉，陰陽和，故能有子。三八，腎氣平均，筋骨勁強，故真牙生而長極。四八，筋骨隆盛，肌肉滿壯。五八，腎氣衰，髮墮齒槁。六八，陽氣衰竭於上，面焦，髮鬢頒白。七八，肝氣衰，筋不能動，天癸竭，精少，腎藏衰，形體皆極。八八，則齒髮去。",
        bh: "男子八岁时，肾气充实，头发长得好，牙齿开始更换。十六岁时，肾气充盛，天癸到来，精气满溢而能外泄，男女阴阳交合，所以能有子。二十四岁时，肾气平匀充足，筋骨强劲有力，智齿生出，身高达到了顶点。三十二岁时，筋骨丰隆盛满，肌肉丰满壮实。四十岁时，肾气开始衰退，头发脱落，牙齿枯槁。四十八岁时，阳气从上部衰竭，面部憔悴，鬓发斑白。五十六岁时，肝气衰退，筋脉不能灵活活动，天癸枯竭，精液减少，肾脏衰败，形体都到了极点。六十四岁时，牙齿和头发就都脱落了。",
        notes: [
          { w: "按", t: "女七男八，是节律单位而非精确年限。同是一套节律倒数，女子自三十五岁而面始衰，男子自四十岁而齿始槁，都与阳明／阳气的可见表征挂钩。" }
        ]
      },
      {
        id: "sw01-7", tags: ["zangxiang"],
        yw: "腎者主水，受五藏六府之精而藏之，故五藏盛，乃能瀉。今五藏皆衰，筋骨解墮，天癸盡矣，故髮鬢白，身體重，行步不正，而無子耳。",
        bh: "肾主水液，接受并储藏五脏六腑的精气，所以五脏精气充盛，肾才能向外输泻精气。如今五脏都已衰退，筋骨松解无力，天癸枯竭，所以鬓发斑白，身体沉重，走路不稳，也就不能生育了。",
        notes: [
          { w: "义", t: "关键一句：「五藏盛，乃能泻」。肾不是孤立的水库，而是全身精气的共同账户。补的思路由此确立。" }
        ]
      },
      {
        id: "sw01-8", tags: ["yang", "shen"],
        yw: "黃帝曰：余聞上古有真人者，提挈天地，把握陰陽，呼吸精氣，獨立守神，肌肉若一，故能壽敝天地，無有終時，此其道生。中古之時，有至人者，淳德全道，和於陰陽，調於四時，去世離俗，積精全神，遊行天地之間，視聽八達之外。其次有聖人者，處天地之和，從八風之理，適嗜欲於世俗之間，無恚嗔之心，行不欲離於世，外不勞形於事，內無思想之患，以恬愉爲務，以自得爲功，形體不敝，精神不散，亦可以百數。其次有賢人者，法則天地，象似日月，辨列星辰，逆從陰陽，分別四時，將從上古合同於道，亦可使益壽而有極時。",
        bh: "黄帝说：我听说上古有称为真人的人，能提挈天地造化，把握阴阳的变化，呼吸天地精纯之气，独立守持精神，肌肉与形体浑然如一，所以寿命能与天地同久，没有终结的时候，这是他们得道而生的结果。中古时有称为至人的人，德行淳厚，道行完备，调和于阴阳，适应于四时的变迁，超脱世俗，蓄积精气保全精神，神游于天地之间，视听能达八方之外。其次有称为圣人的人，安居于天地的和气之中，顺从八风的变化规律，在世俗之间适度满足自己的嗜好与欲望，没有恼怒怨恨之心，行为不脱离世俗，外不让形体被事务劳累，内心没有思想上的忧患，以恬静愉悦为本务，以自得自足为功业，形体不衰败，精神不耗散，也可以活到百岁。再其次有称为贤人的人，以天地为法则，以日月运行为取象，分辨星辰的位次，顺从阴阳的消长，区别四时的变化，追随上古真人而合于道，也可以延益寿命，但有其极限。",
        notes: [
          { w: "按", t: "真人、至人、圣人、贤人，是四类阶梯，最下一档仍有「极时」。说明这是可达目标的梯度表，不是神话。" }
        ]
      }
    ]
  },

  {
    id: "sw02", book: "素问", no: 2, title: "四气调神大论", titleTw: "四氣調神大論",
    tags: ["yang", "wuxing", "zhize"],
    brief: "按春夏秋冬给出四套作息与情志方案，末尾落到「治未病」——全书最著名的一句纲领。",
    sections: [
      {
        id: "sw02-1", tags: ["yang", "wuxing"],
        yw: "春三月，此謂發陳，天地俱生，萬物以榮，夜臥早起，廣步於庭，被髮緩形，以使志生，生而勿殺，予而勿奪，賞而勿罰，此春氣之應，養生之道也。逆之則傷肝，夏爲寒變，奉長者少。",
        bh: "春季三个月，是推陈出新的季节，天地一同生发，万物欣欣向荣。应当晚睡早起，在庭院里大步散步，披散头发、松缓衣束，让情志随之生发；对待万物要促其生而不加杀伐，多给予而不去剥夺，多奖赏而不去惩罚。这是顺应春气、调养生气的方法。违背了就会损伤肝脏，到夏天发生寒性病变，供给夏季生长的力量就不足了。",
        notes: [
          { w: "训", t: "发陈：发散陈旧，推陈出新。被发，披散头发，取其舒松。" },
          { w: "按", t: "注意这里把「生而勿杀、予而勿夺」也说成养生之法——情志与待人方式被算进了养生技术清单。" }
        ]
      },
      {
        id: "sw02-2", tags: ["yang", "wuxing"],
        yw: "夏三月，此謂蕃秀，天地氣交，萬物華實，夜臥早起，無厭於日，使志無怒，使華英成秀，使氣得泄，若所愛在外，此夏氣之應，養長之道也。逆之則傷心，秋爲痎瘧，奉收者少，冬至重病。",
        bh: "夏季三个月，是万物繁茂秀美的季节，天地之气交合，万物开花结果。应当晚睡早起，不要厌恶日光，让情志不发怒，让容色像花一样秀美，让气机得以宣泄，好像所爱之物就在外边一样外向舒展。这是顺应夏气、调养长气的方法。违背了就会损伤心脏，到秋天发生疟疾之类的寒热病，供给秋季收敛的力量就不足，冬至时节就会重病。",
        notes: [{ w: "训", t: "蕃秀：繁茂秀丽。痎疟，疟疾的通称。" }]
      },
      {
        id: "sw02-3", tags: ["yang", "wuxing"],
        yw: "秋三月，此謂容平，天氣以急，地氣以明，早臥早起，與雞俱興，使志安寧，以緩秋刑，收斂神氣，使秋氣平，無外其志，使肺氣清，此秋氣之應，養收之道也。逆之則傷肺，冬爲飧泄，奉藏者少。",
        bh: "秋季三个月，是万物平定收敛的季节，天气转急，地气清明。应当早睡早起，与鸡的活动时间同步，让情志安宁，以缓和秋气的肃杀之刑，收敛神气，使秋气得以平和，不使情志外驰，使肺气清肃。这是顺应秋气、调养收气的方法。违背了就会损伤肺脏，到冬天发生完谷不化的泄泻，供给冬季闭藏的力量就不足。",
        notes: [{ w: "训", t: "容平：万物形态平定成熟。容，形态。飧泄，泻下物夹有不化谷物。" }]
      },
      {
        id: "sw02-4", tags: ["yang", "wuxing"],
        yw: "冬三月，此謂閉藏，水冰地坼，無擾乎陽，早臥晚起，必待日光，使志若伏若匿，若有私意，若已有得，去寒就溫，無泄皮膚，使氣亟奪，此冬氣之應，養藏之道也。逆之則傷腎，春爲痿厥，奉生者少。",
        bh: "冬季三个月，是万物闭藏的季节，水结冰，地冻裂，不要扰动阳气。应当早睡晚起，一定要等到日光出现才起身，让情志好像潜伏藏匿起来一样，好像怀有私意而不外露，好像已经得到了什么而满足；避开寒冷，趋近温暖，不要让皮肤开泄出汗，以免阳气屡屡被夺。这是顺应冬气、调养藏气的方法。违背了就会损伤肾脏，到春天发生痿弱厥冷的病证，供给春季生发的力量就不足。",
        notes: [
          { w: "训", t: "坼，音彻，裂开。亟，屡次。" },
          { w: "按", t: "四季作息的差别，本质是一件事：对皮肤开阖和出汗的管理。春天广步出汗，冬天无泄皮肤。" }
        ]
      },
      {
        id: "sw02-5", tags: ["wuxing", "zangxiang"],
        yw: "逆春氣，則少陽不生，肝氣內變。逆夏氣，則太陽不長，心氣內洞。逆秋氣，則太陰不收，肺氣焦滿。逆冬氣，則少陰不藏，腎氣獨沉。",
        bh: "违背了春气，少阳之气就不能生发，肝气在体内发生病变。违背了夏气，太阳之气就不能长养，心气在内虚怯不足。违背了秋气，太阴之气就不能收敛，肺气焦躁胀满。违背了冬气，少阴之气就不能闭藏，肾气独自沉衰。",
        notes: [
          { w: "义", t: "用少阳/太阳/太阴/少阴四组把四季与脏腑锁在一起——这是四时与藏象之间的固定接线。" }
        ]
      },
      {
        id: "sw02-6", tags: ["yang"],
        yw: "夫四時陰陽者，萬物之根本也。所以聖人春夏養陽，秋冬養陰，以從其根，故與萬物沉浮於生長之門。逆其根，則伐其本，壞其真矣。故陰陽四時者，萬物之終始也，死生之本也，逆之則災害生，從之則苛疾不起，是謂得道。",
        bh: "四时阴阳的变化，是万物生长收藏的根本。所以圣人在春夏调养生发之气，在秋冬调养收藏之阴，以顺从这个根本，因而能与万物一起在生长收藏的门户中沉浮出入。违背了这个根本，就是砍伐本源、败坏真气。所以阴阳四时的变化，是万物的终始，是死生的根本，违背了就产生灾害，顺从了就不会生重病，这叫做得道。",
        notes: [
          { w: "按", t: "「春夏养阳，秋冬养阴」常被误解为夏天吃热药冬天吃凉药。原意是：春夏要顺养「生、长」的功能，秋冬要顺养「收、藏」的功能。" }
        ]
      },
      {
        id: "sw02-7", tags: ["zhize", "yang"],
        yw: "是故聖人不治已病治未病，不治已亂治未亂，此之謂也。夫病已成而後藥之，亂已成而後治之，譬猶渴而穿井，鬥而鑄錐，不亦晚乎！",
        bh: "所以圣人不等到已经生病才去治疗，而是在疾病发生之前就加以预防；不等到已经动乱才去治理，而是在动乱发生之前就加以防范，说的就是这个。如果疾病已经形成才用药治疗，动乱已经发生才去治理，那就好比口渴了才去挖井，战斗已经开始了才去铸造兵器，不是太晚了吗！",
        notes: [
          { w: "义", t: "「治未病」三字的原始出处。注意它出现的位置——不是作为口号，而是四季养生论证链的末句，前提是顺时而养。" }
        ]
      }
    ]
  },

  {
    id: "sw03", book: "素问", no: 3, title: "生气通天论", titleTw: "生氣通天論",
    tags: ["yang", "bingji", "wuxing"],
    brief: "把阳气比作天空的太阳，再逐条推演阳气受损的六种路径。阳气病理学的总纲。",
    sections: [
      {
        id: "sw03-1", tags: ["yang"],
        yw: "黃帝曰：夫自古通天者，生之本，本於陰陽。天地之間，六合之內，其氣九州、九竅、五藏、十二節，皆通乎天氣。其生五，其氣三，數犯此者，則邪氣傷人，此壽命之本也。",
        bh: "黄帝说：自古以来，与天气相通是生命的根本，而这个根本又归结于阴阳。天地之间、四方上下之内，无论是地上的九州，还是人体的九窍、五脏、十二关节，都与天气相通。阴阳化生五行，又分为三阴三阳之气，屡次违犯这个规律，邪气就会伤害人体，所以这是寿命的根本所在。",
        notes: [{ w: "训", t: "六合：四方上下。十二节，双侧腕、肘、肩、髋、膝、踝共十二大关节。" }]
      },
      {
        id: "sw03-2", tags: ["yang"],
        yw: "陽氣者，若天與日，失其所則折壽而不彰，故天運當以日光明。是故陽因而上，衛外者也。",
        bh: "人体的阳气，好像天体中的太阳一样，如果失去了它应有的位次，人就会减损寿命而不显露生机，所以天体的运行应当有太阳的光明，人的生命也应当有阳气的温养。因此阳气是向上、向外运行的，起着护卫体表的作用。",
        notes: [
          { w: "按", t: "全书最著名的一个比喻。它把「阳气」的功能定义钉死了：向上 + 向外 + 卫外。" }
        ]
      },
      {
        id: "sw03-3", tags: ["bingji"],
        yw: "因於寒，欲如運樞，起居如驚，神氣乃浮。因於暑，汗，煩則喘喝，靜則多言，體若燔炭，汗出而散。因於濕，首如裹，濕熱不攘，大筋緛短，小筋弛長，緛短爲拘，弛長爲痿。因於氣，爲腫，四維相代，陽氣乃竭。",
        bh: "感受了寒邪，阳气应当像门轴的运转一样内守，如果起居躁动惊扰不安，神气就会向外浮越。感受了暑邪，就会出汗，烦躁时可见喘息有声，安静时则多言多语，身体像燃烧的炭一样发热，汗出之后热才散去。感受了湿邪，头部像被布裹住一样沉重，湿热不能消除，大筋就会收缩变短，小筋就会松弛变长，缩短的成为拘挛，弛长的成为痿弱。因于风气，会发生浮肿，四肢交替出现肿胀，阳气就会衰竭。",
        notes: [
          { w: "训", t: "緛，音软，缩短。弛长，松缓延长。四维，四肢。" },
          { w: "义", t: "寒、暑、湿、气四种病因，分别给出「神气浮/汗出/首如裹/肿」四组可辨识的主症，是一份症状鉴别表。" }
        ]
      },
      {
        id: "sw03-4", tags: ["bingji", "yang"],
        yw: "陽氣者，煩勞則張，精絕，闢積於夏，使人煎厥。目盲不可以視，耳閉不可以聽，潰潰乎若壞都，汩汩乎不可止。陽氣者，大怒則形氣絕，而血菀於上，使人薄厥。有傷於筋，縱，其若不容。汗出偏沮，使人偏枯。",
        bh: "阳气在过度烦劳的时候就会亢张外越，使阴精耗竭，这种情况重复累积到夏天，就会使人发生煎厥。表现为眼睛昏盲不能视物，耳窍闭塞不能听声，病情像堤防崩溃一样汹涌，像急流奔泻一样不可阻止。阳气在大怒的时候，会使形与气的功能阻绝，血郁积于上部，使人发生薄厥。如果损伤了筋脉，筋脉就会弛纵，肢体好像不受自己的支配。如果身体半侧出汗而另半侧不出汗，就会使人发生偏枯，即半身不遂。",
        notes: [
          { w: "训", t: "菀，音郁，郁积。沮，音举，阻止、不出。辟积，重复累积。" },
          { w: "义", t: "煎厥与薄厥：一因劳而生于夏，一因怒而发在急。都是「阳气失控」，但触发路径完全不同。" }
        ]
      },
      {
        id: "sw03-5", tags: ["yang", "bingji"],
        yw: "陽氣者，一日而主外，平旦人氣生，日中而陽氣隆，日西而陽氣已虛，氣門乃閉。是故暮而收拒，無擾筋骨，無見霧露，反此三時，形乃困薄。",
        bh: "阳气在一天之中主持于外：清晨人气开始生发，正午阳气最为隆盛，日落时阳气已经虚衰，汗孔的门户也就关闭了。所以到了傍晚就应当收敛阳气、拒守于内，不要扰动筋骨，不要接触雾气露水。如果违背了平旦、日中、日西这三个时段的阳气规律，形体就会被邪气困扰而衰薄。",
        notes: [
          { w: "按", t: "把一年压缩成一天。这也是子午流注一类时间医学的雏形。" }
        ]
      },
      {
        id: "sw03-6", tags: ["yang"],
        yw: "岐伯曰：陰者，藏精而起亟也；陽者，衛外而爲固也。陰不勝其陽，則脈流薄疾，並乃狂。陽不勝其陰，則五藏氣爭，九竅不通。是以聖人陳陰陽，筋脈和同，骨髓堅固，氣血皆從。",
        bh: "岐伯说：阴是内藏精气而不断地起来支援阳气的；阳是保卫体表而使身体固密的。如果阴不能克制阳气，脉中的气血流动就会急迫而快速，阳邪并于阳位就会发狂。如果阳不能克制阴气，五脏之气就会互相争扰，九窍就会不通畅。所以圣人调理阴阳，使筋脉和顺协调，骨髓坚固，气血都能顺从运行。",
        notes: [
          { w: "训", t: "起亟：不断地起来应接需求。亟，急也。" },
          { w: "义", t: "阴与阳在这里各给了一个动词定义：储备 + 支援（阴），屏蔽 + 固守（阳）。" }
        ]
      },
      {
        id: "sw03-7", tags: ["yang"],
        yw: "凡陰陽之要，陽密乃固，兩者不和，若春無秋，若冬無夏，因而和之，是謂聖度。故陽強不能密，陰氣乃絕；陰平陽祕，精神乃治；陰陽離決，精氣乃絕。",
        bh: "大凡阴阳的关键，在于阳气致密才能达到固密。二者不能协调，就好像只有春天而没有秋天、只有冬天而没有夏天一样。因此加以调和，就是圣人的法度。所以阳气过亢而不能固密，阴气就会随之竭绝；阴气平和，阳气固密，精神才能正常；阴阳分离决裂，精气也就随之竭尽了。",
        notes: [
          { w: "按", t: "「阴平阳秘」是中医最常被引用的一句原文，常被简化为「阴阳平衡」。原意更严：平的对象是阴（不虚不亢），秘的对象是阳（致密不散）。" }
        ]
      },
      {
        id: "sw03-8", tags: ["bingji", "wuxing"],
        yw: "陰之所生，本在五味；陰之五宮，傷在五味。是故味過於酸，肝氣以津，脾氣乃絕。味過於鹹，大骨氣勞，短肌，心氣抑。味過於甘，心氣喘滿，色黑，腎氣不衡。味過於苦，脾氣不濡，胃氣乃厚。味過於辛，筋脈沮弛，精神乃央。是故謹和五味，骨正筋柔，氣血以流，腠理以密，如是則骨氣以精，謹道如法，長有天命。",
        bh: "阴精的产生，来源于五味；而储藏阴精的五脏，又会被五味所伤害。所以过食酸味，肝气就会过盛而津溢，脾气就会衰竭。过食咸味，骨骼就会劳伤，肌肉短缩，心气受到抑郁。过食甘味，就会心气喘满，面色发黑，肾气失去平衡。过食苦味，脾气就不能濡润，胃气就会变得厚滞。过食辛味，筋脉就会败坏松弛，精神也会随之受损。因此谨慎地调和五味，骨骼就端正，筋脉就柔韧，气血得以畅行，腠理得以固密，这样骨气就精强有力，谨慎地遵循这些方法，就能享有天赋的寿命。",
        notes: [
          { w: "训", t: "五宫，五脏。沮，败坏。央，殃的通假，伤残。" },
          { w: "义", t: "五味既能养又能伤，判断标准是「各归所喜」。这是一组五行相克的实际应用：酸过则肝乘脾，咸过则肾乘心。" }
        ]
      }
    ]
  },

  {
    id: "sw05", book: "素问", no: 5, title: "阴阳应象大论", titleTw: "陰陽應象大論",
    tags: ["yinyang", "wuxing", "zangxiang", "zhenfa"],
    brief: "阴阳五行的方法论总纲。提出「治病必求于本」，并把清浊出入、气味形精的转化链讲透。",
    sections: [
      {
        id: "sw05-1", tags: ["yinyang"],
        yw: "黃帝曰：陰陽者，天地之道也，萬物之綱紀，變化之父母，生殺之本始，神明之府也。治病必求於本。",
        bh: "黄帝说：阴阳是天地间的普遍规律，是万物的纲领和法度，是变化的起源，是生长与消亡的根本，是一切神明变化所出的府库。治病一定要推求于阴阳这个根本。",
        notes: [
          { w: "按", t: "五个名词连用（纲纪/父母/本始/府），措辞极重。「治病必求于本」的「本」在此处有具体所指，不是泛泛的根本。" }
        ]
      },
      {
        id: "sw05-2", tags: ["yinyang"],
        yw: "故積陽爲天，積陰爲地。陰靜陽躁，陽生陰長，陽殺陰藏。陽化氣，陰成形。寒極生熱，熱極生寒。寒氣生濁，熱氣生清。清氣在下，則生飧泄；濁氣在上，則生䐜脹。此陰陽反作，病之逆從也。",
        bh: "所以阳气轻清上升而聚积成为天，阴气重浊下降而凝聚成为地。阴主静，阳主动；阳主生发，阴主成长；阳主肃杀，阴主闭藏。阳能化生出气，阴能构成形体。寒到极点会转化为热，热到极点会转化为寒。寒气凝聚而生浊阴，热气升散而生清阳。清阳之气当升而不升、反而陷在下，就会发生完谷不化的泄泻；浊阴之气当降而不降、反而滞在上，就会发生胸腹胀满。这就是阴阳的反向运行，也就是疾病的逆顺之别。",
        notes: [
          { w: "训", t: "䐜，音嗔，胀起。" },
          { w: "义", t: "「清气在下则为飧泄，浊气在上则为䐜胀」两句，是升降理论最实用的一对接线，脾胃病的处方由此分野。" }
        ]
      },
      {
        id: "sw05-3", tags: ["yinyang"],
        yw: "故清陽出上竅，濁陰出下竅；清陽發腠理，濁陰走五藏；清陽實四支，濁陰歸六府。",
        bh: "所以清阳之气出于上部的七窍，浊阴之液出于下部的二窍；清阳之气发散于腠理之间，浊阴之精内注于五脏之中；清阳之气充实于四肢，浊阴之水谷归于六腑。",
        notes: [
          { w: "按", t: "三组對應構成一張完整分配表：出路、居所、去向。背诵价值极高。" }
        ]
      },
      {
        id: "sw05-4", tags: ["bingji"],
        yw: "風勝則動，熱勝則腫，燥勝則幹，寒勝則浮，濕勝則濡瀉。",
        bh: "风气偏胜就会出现动摇震颤的症状，热气偏胜就会出现红肿的症状，燥气偏胜就会出现干枯的症状，寒气偏胜就会出现浮肿的症状，湿气偏胜就会出现濡润泄泻的症状。",
        notes: [
          { w: "按", t: "五字一组，把病因直接翻译成看得见的体征。这是《内经》里最短的一条鉴别口诀。" }
        ]
      },
      {
        id: "sw05-5", tags: ["zhenfa", "yinyang"],
        yw: "善診者，察色按脈，先別陰陽；審清濁，而知部分；視喘息，聽音聲，而知所苦；觀權衡規矩，而知病所主；按尺寸，觀浮沉滑澀，而知病所生。以治無過，以診則不失矣。",
        bh: "善于诊病的医生，观察气色、诊按脉象，首先辨别属阴属阳；审察面色的清浊，就能知道病变的部位；观看呼吸的喘息，听辨声音的变化，就能知道病者的痛苦所在；观察脉象的四时规矩，就能知道病变的主因；按切尺肤与寸口，观察脉象的浮沉滑涩，就能知道疾病产生的原因。这样施治就不会有过失，诊断就不会有差错。",
        notes: [
          { w: "训", t: "权衡规矩：四时脉象的形容——春应中规、夏应中矩、秋应中衡、冬应中权。" },
          { w: "按", t: "「先别阴阳」是第一步，不是最后一步。这句常被读成流程中的一環，其实是序位。" }
        ]
      },
      {
        id: "sw05-6", tags: ["zhize"],
        yw: "故曰：病之始起也，可刺而已；其盛，可待衰而已。故因其輕而揚之，因其重而減之，因其衰而彰之。形不足者，溫之以氣；精不足者，補之以味。其高者，因而越之；其下者，引而竭之；中滿者，瀉之於內。",
        bh: "所以说：疾病刚开始发作的时候，可以用针刺方法治愈；病情正盛的时候，可以等到邪气衰减时再行治疗而获愈。所以病势轻浅的，用轻扬宣散的方法；病势沉重的，用逐步削减的方法；正气衰弱的，用补益彰显的方法。形体虚弱的，用温养阳气的方法调补；阴精不足的，用厚味滋养的方法填补。病在上焦高位的，用涌吐的方法使邪气从上越出；病在下焦的，用疏导攻下的方法使邪从下排出；中焦胀满的，用分消的方法泻之于内。",
        notes: [
          { w: "义", t: "「因其盛，可待衰而已」是个反直觉的策略：正盛时不动手，等它自己衰减。与现代急则治标并不矛盾，针对的是周期性发作的病。" }
        ]
      }
    ]
  },

  {
    id: "sw08", book: "素问", no: 8, title: "灵兰秘典论", titleTw: "靈蘭秘典論",
    tags: ["zangxiang", "wuxing"],
    brief: "十二脏腑的官职隐喻，全文不足三百字，是藏象学说的定义性文本。右侧「十二官」图的数据源头。",
    sections: [
      {
        id: "sw08-0", tags: ["zangxiang"],
        yw: "黃帝問曰：願聞十二藏之相使，貴賤何如？岐伯對曰：悉乎哉問也！請遂言之。",
        bh: "黄帝问道：我想听听十二脏腑之间的相互役使关系，它们的主从贵贱是怎样的？岐伯回答说：你问得真详尽啊！请让我来谈谈这个问题。",
        notes: [{ w: "按", t: "「相使」与「贵贱」两个词说明了提问的性质：问的是组织结构图，不是功能清单。" }]
      },
      {
        id: "sw08-1", tags: ["zangxiang", "wuxing"], off: ["心", "肺", "肝"],
        yw: "心者，君主之官也，神明出焉。肺者，相傅之官，治節出焉。肝者，將軍之官，謀慮出焉。",
        bh: "心，如同君主一样的器官，精神意识由此产生。肺，如同辅佐君主的宰相，治理与节律由此产生。肝，如同出征作战的将军，谋略与思虑由此产生。",
        notes: [
          { w: "义", t: "三个官定的都是「信息处理」岗位：神明 = 决策中枢，治节 = 节律调度，谋虑 = 方案生成。" }
        ]
      },
      {
        id: "sw08-2", tags: ["zangxiang", "wuxing"], off: ["胆", "膻中"],
        yw: "膽者，中正之官，決斷出焉。羶中者，臣使之官，喜樂出焉。",
        bh: "胆，如同公正不偏的司法之官，判断与决断由此产生。膻中，如同传达命令的近臣，喜悦与欢乐由此产生。",
        notes: [
          { w: "训", t: "膻中，此处指心包络，为气之海。" },
          { w: "义", t: "肝出谋，胆决断。谋而不决在肝，决而不当在胆，这是两脏的分工。" }
        ]
      },
      {
        id: "sw08-3", tags: ["zangxiang"], off: ["脾", "胃", "大肠", "小肠"],
        yw: "脾胃者，倉廩之官，五味出焉。大腸者，傳道之官，變化出焉。小腸者，受盛之官，化物出焉。",
        bh: "脾胃，如同管理仓库的官员，五味滋养由此产生。大肠，如同负责运输传导的官员，糟粕由此变化形成。小肠，如同负责接收的官员，进一步分化食物精微的功能由此产生。",
        notes: [
          { w: "义", t: "三个都是「物流」岗位：入库分类（脾胃）、干线运输（大肠）、精粗分拣（小肠）。" }
        ]
      },
      {
        id: "sw08-4", tags: ["zangxiang"], off: ["肾", "三焦", "膀胱"],
        yw: "腎者，作強之官，伎巧出焉。三焦者，決瀆之官，水道出焉。膀胱者，州都之官，津液藏焉，氣化則能出矣。",
        bh: "肾，如同复兴百工的能工之官，精巧的技能由此产生。三焦，如同管理水利的官员，通调水道的功能由此产生。膀胱，如同汇聚水液的州都之地，津液储藏于此，经过气化作用才能排出体外。",
        notes: [
          { w: "训", t: "作强，作用强力。伎巧，精巧的技艺。决渎，疏通水道。州都，水液汇聚的地方。" },
          { w: "按", t: "注意膀胱是唯一一个在句末加了机制说明的：「气化则能出矣」。这是在强调它不是被动容器，排尿依赖气的推动。" }
        ]
      },
      {
        id: "sw08-5", tags: ["zangxiang"], off: ["心"],
        yw: "凡此十二官者，不得相失也。故主明則下安，以此養生則壽，歿世不殆，以爲天下則大昌。主不明則十二官危，使道閉塞而不通，形乃大傷，以此養生則殃，以爲天下者，其宗大危，戒之戒之！",
        bh: "这十二官之间，是不能失去协调的。所以君主清明，下属就安定，用这样的道理养生就能长寿，终身不会有危险；用这样的道理治理天下，国家就会昌盛繁荣。君主不明察，十二官就都危险了，联络的通道闭塞不通，形体就会受到大的伤害，用这样的状况养生就要遭殃，用这样的状况治理天下，他的宗社就非常危险，一定要警惕啊！",
        notes: [
          { w: "义", t: "「使道」是关键词：十二官之所以成为系统，靠的是通路而不是各自的职能。通路一闭，职能再全也垮。" },
          { w: "按", t: "全文由脏腑推及治国，一次性把医学与政治隐喻打通。这种跳跃在《内经》里并不常见。" }
        ]
      },
      {
        id: "sw08-6", tags: ["zangxiang"],
        yw: "至道在微，變化無窮，孰知其原！" + "恍惚之数，生于毫氂，毫氂之数，起于度量，千之万之，可以益大，推之大之，其形乃制。",
        bh: "最高深的道理在于细微之处，它的变化是无穷无尽的，谁能知道它的本原呢！那些若有若无的数量变化，产生于毫厘般的微小差别，毫厘般的微小差别，又起于测量的尺度标准。把它成千成万地积累，就可以由小变大，推演扩充开来，事物的形体规律才被认识把握。",
        notes: [
          { w: "训", t: "氂，音厘，同厘，极微小的长度单位。" },
          { w: "按", t: "讲完官职立刻接一段方法论：差异从极小处开始积累。这是《内经》少见的认识论插笔。" }
        ]
      }
    ]
  },

  {
    id: "sw10", book: "素问", no: 10, title: "五脏生成篇", titleTw: "五藏生成篇",
    tags: ["zangxiang", "zhenfa", "wuxing"],
    brief: "给出五脏与体、华、主的对应表，以及五色生死辨——望诊的基础数据结构。",
    sections: [
      {
        id: "sw10-1", tags: ["zangxiang", "wuxing"],
        yw: "心之合脈也，其榮色也，其主腎也。肺之合皮也，其榮毛也，其主心也。肝之合筋也，其榮爪也，其主肺也。脾之合肉也，其榮脣也，其主肝也。腎之合骨也，其榮髮也，其主脾也。",
        bh: "心与脉相合，它的荣华表现在面色上，受肾制约。肺与皮肤相合，它的荣华表现在毫毛上，受心制约。肝与筋相合，它的荣华表现在爪甲上，受肺制约。脾与肌肉相合，它的荣华表现在口唇上，受肝制约。肾与骨相合，它的荣华表现在头发上，受脾制约。",
        notes: [
          { w: "义", t: "每脏三件事：所合（它管什么组织）、所荣（外表哪里看得见）、所主（谁克它）。" },
          { w: "按", t: "「其荣」是可观察项。头发看肾、爪甲看肝、嘴唇看脾——这是最初的望诊接口。" }
        ]
      },
      {
        id: "sw10-2", tags: ["wuxing", "zangxiang"],
        yw: "多食鹹，則脈凝泣而變色；多食苦，則皮槁而毛拔；多食辛，則筋急而爪枯；多食酸，則肉胝䐺而脣揭；多食甘，則骨痛而髮落。此五味之所傷也。",
        bh: "过食咸味，会使血脉凝涩不畅而面色改变；过食苦味，会使皮肤枯槁而毫毛脱落；过食辛味，会使筋脉拘急而爪甲枯槁；过食酸味，会使皮肉粗厚皱缩而口唇掀起；过食甘味，会使骨骼疼痛而头发脱落。这是五味偏嗜所造成的伤害。",
        notes: [
          { w: "训", t: "泣，音涩，凝涩不畅。胝䐺，音支皱，皮厚而缩。" },
          { w: "按", t: "与《生气通天论》五味段同源，但这里全部换成「外观可辨」的表现，是诊断版而不是养生版。" }
        ]
      },
      {
        id: "sw10-3", tags: ["zhenfa"],
        yw: "故色見青如草茲者死，黃如枳實者死，黑如炲者死，赤如衃血者死，白如枯骨者死，此五色之見死也。青如翠羽者生，赤如雞冠者生，黃如蟹腹者生，白如豕膏者生，黑如烏羽者生，此五色之見生也。",
        bh: "所以面色青得像死草的，主死；黄得像枳实的，主死；黑得像烟灰的，主死；红得像凝血的，主死；白得像枯骨的，主死。这是五种主死的面色。面色青得像翠鸟羽毛的，主生；红得像鸡冠的，主生；黄得像蟹腹的，主生；白得像猪脂的，主生；黑得像乌鸦羽毛的，主生。这是五种主生的面色。",
        notes: [
          { w: "训", t: "兹，枯萎的草席。炲，音台，烟灰。衃，音胚，凝聚的死血。" },
          { w: "义", t: "判断标准不是颜色深浅，而是润泽与否：同為黑，如乌羽者生，如炲者死。活色、死色的分界线只有一个词——泽。" }
        ]
      },
      {
        id: "sw10-4", tags: ["zangxiang"],
        yw: "諸脈者皆屬於目，諸髓者皆屬於腦，諸筋者皆屬於節，諸血者皆屬於心，諸氣者皆屬於肺。此四支八溪之朝夕也。",
        bh: "所有的经脉都上属于目，所有的骨髓都上属于脑，所有的筋都连属于骨节，所有的血液都归属于心，所有的气都归属于肺。这些就是四肢和八大关节运行出入的潮汐。",
        notes: [
          { w: "训", t: "八溪，两肘、两腋、两髋、两腘八处大关节的凹陷。朝夕，潮汐般的运行。" }
        ]
      }
    ]
  },

  {
    id: "sw21", book: "素问", no: 21, title: "经脉别论", titleTw: "經脈別論",
    tags: ["jingluo", "zangxiang", "zhenfa"],
    brief: "把吃进去的水谷和喝下去的水，分别画出两条完整的运行路线图。这是全书最清晰的一段生理流程描述。",
    sections: [
      {
        id: "sw21-1", tags: ["zhenfa"],
        yw: "黃帝問曰：人之居處、動靜、勇怯，脈亦爲之變乎？岐伯對曰：凡人之驚恐恚勞動靜，皆爲變也。是以夜行則喘出於腎，淫氣病肺。有所墮恐，喘出於肝，淫氣害脾。有所驚恐，喘出於肺，淫氣傷心。度水跌僕，喘出於腎與骨。當是之時，勇者氣行則已，怯者則着而爲病也。",
        bh: "黄帝问道：人的居住环境、活动状态、勇敢或怯懦，脉象也会随之变化吗？岐伯回答说：大凡人的惊恐、忿怒、劳作、安静等各种状态，都会使脉发生变化。所以夜间行走，喘出于肾，过盛的气会侵犯肺。因坠落而恐惧，喘出于肝，过盛的气会伤害脾。受到惊吓恐骇，喘出于肺，过盛的气会伤害心。涉水或跌仆受伤，喘出于肾与骨。在这样的情况下，勇敢的人气机运行之后就恢复了，怯懦的人则气滞留着而成为疾病。",
        notes: [
          { w: "义", t: "一句「勇者气行则已，怯者则着而为病」，把体质差异引入病机：同样的刺激，结局取决于气的流通能力。" }
        ]
      },
      {
        id: "sw21-2", tags: ["jingluo", "zangxiang"],
        yw: "食氣入胃，散精於肝，淫氣於筋。食氣入胃，濁氣歸心，淫精於脈。脈氣流經，經氣歸於肺，肺朝百脈，輸精於皮毛。毛脈合精，行氣於府，府精神明，留於四藏，氣歸於權衡。權衡以平，氣口成寸，以決死生。",
        bh: "食物入胃之后，所化的精微之气散布到肝脏，再由肝把精气滋濡到筋脉。食物入胃，其中稠厚的部分归于心脏，再由心把精气注入血脉。脉中的气流注于经脉，经脉之气又汇归于肺，肺朝会百脉，把精气输送到皮毛。皮毛与血脉的精气相合，运行精气于六腑，六腑的精气充沛清明，流注留舍于其他四脏。精气的运行趋于平衡协调，在寸口部位形成一寸长的脉应之处，据此可以判断生死。",
        notes: [
          { w: "训", t: "淫，浸淫、滋濡，非指淫邪。权衡，此指阴阳气血的平衡状态。" },
          { w: "按", t: "这条链路解释了为什么可以「独取寸口」诊全身：整条路线最后都汇到肺，而肺气上朝百脉。" }
        ]
      },
      {
        id: "sw21-3", tags: ["jingluo", "zangxiang"],
        yw: "飲入於胃，遊溢精氣，上輸於脾，脾氣散精，上歸於肺，通調水道，下輸膀胱，水精四布，五經並行。合於四時五藏陰陽，揆度以爲常也。",
        bh: "水饮进入胃中，其精气游溢布散，向上输送到脾；脾气升散精微，再向上归于肺；肺通调水道，向下输注到膀胱，水精四布于全身，与五脏经脉并行运行。与四时五脏阴阳的变化相合，测度各行其常便是正常的生理状态。",
        notes: [
          { w: "按", t: "水液四站：胃 → 脾 → 肺 → 膀胱。与上一段的食物路线并行而不重叠，这是《内经》里罕见的「水谷分路」写法。" }
        ]
      }
    ]
  },

  {
    id: "sw39", book: "素问", no: 39, title: "举痛论", titleTw: "舉痛論",
    tags: ["bingji", "ci", "zhenfa"],
    brief: "一口气列出十四种疼痛的鉴别方式，并给出「按之则热气至，热气至则痛止」的手法原理——按压手法的经典依据。",
    sections: [
      {
        id: "sw39-0", tags: ["zhenfa"],
        yw: "黃帝問曰：今餘問於夫子，令言而可知，視而可見，捫而可得，令驗於己而發蒙解惑，可得而聞乎？",
        bh: "黄帝问道：现在我向先生请教，怎样才能做到听其言可知其理，观其形可见其病，触摸其体可得其情，使自己得以验证并启发蒙昧解除疑惑，可以听你讲一讲吗？",
        notes: [
          { w: "训", t: "扪，抚摸按月，此指触摸诊察。" },
          { w: "按", t: "问诊三件套在此定型：语（听）— 视（望）— 扪（切）。" }
        ]
      },
      {
        id: "sw39-1", tags: ["bingji", "jingluo"],
        yw: "岐伯對曰：經脈流行不止，環周不休，寒氣入經而稽遲，泣而不行，客於脈外則血少，客於脈中則氣不通，故卒然而痛。",
        bh: "岐伯回答说：经脉中的气血流行不止，循环往复没有停歇。寒邪侵入经脉，血流就迟滞不畅，涩而不能正常运行。寒邪客于脉外，则脉络收缩而血液减少；客于脉中，则气机不得通畅，所以突然发生疼痛。",
        notes: [
          { w: "义", t: "一句话给出疼痛的通用模型：不通则痛。区分了脉外（血少）与脉中（气不通）两种位置。" }
        ]
      },
      {
        id: "sw39-2", tags: ["bingji"],
        yw: "帝曰：其痛或卒然而止者，或痛甚不休者，或痛甚不可按者，或按之而痛止者，或按之無益者，或喘動應手者，或心與背相引而痛者，或脅肋與少腹相引而痛者，或腹痛引陰股者，或痛宿昔而成積者，或卒然痛死不知人，有少間復生者，或痛而嘔者，或腹痛而後泄者，或痛而閉不通者。凡此諸痛，各不同形，別之奈何？",
        bh: "黄帝说：疼痛有的突然停止，有的剧烈不止，有的痛到不能触碰按压，有的按压后疼痛停止，有的按压也无济于事，有的按压时能感到搏动应手，有的心与背牵引作痛，有的胁肋与小腹牵引作痛，有的腹痛牵引到大腿内侧，有的疼痛日久形成积块，有的突然痛至昏厥不省人事、片刻又复苏，有的疼痛伴呕吐，有的腹痛而后泄泻，有的腹痛而大便闭结不通。这些疼痛各有不同的表现形式，怎样鉴别呢？",
        notes: [
          { w: "按", t: "十四种痛，其中五项直接以「是否可按、按之如何」来分类。按压在这里既是疗法，又是诊断工具。" }
        ]
      },
      {
        id: "sw39-3", tags: ["bingji", "ci"],
        yw: "岐伯曰：寒氣客於脈外則脈寒，脈寒則縮踡，縮踡則脈絀急，絀急則外引小絡，故卒然而痛，得炅則痛立止；因重中於寒，則痛久矣。寒氣客於經脈之中，與炅氣相薄則脈滿，滿則痛而不可按也。",
        bh: "岐伯说：寒邪客于脉外，脉就受寒；脉受寒就收缩痉挛；收缩痉挛就使脉管屈曲拘急；屈曲拘急便向外牵扯细小的络脉，所以突然疼痛，得到温热即刻缓解；如果再次感受寒邪，疼痛就会迁延不止。寒邪客于经脉之中，与人体热气相互搏结，脉就会充盈满实，满实就会疼痛而不敢按压。",
        notes: [
          { w: "训", t: "绌急，音触急，屈曲拘急。炅，音窘，热。" },
          { w: "义", t: "这里给出一条明确的鉴别：得温即止的是脉外受寒，拒按的是脉中有寒热相搏。前者喜按喜暖，后者拒按。" }
        ]
      },
      {
        id: "sw39-4", tags: ["ci", "bingji"], manip: "an",
        yw: "寒氣客於腸胃之間，膜原之下，血不得散，小絡急引故痛，按之則血氣散，故按之痛止。",
        bh: "寒邪停留在肠胃之间、膜原之下，血行不能散畅，细小的络脉拘急牵扯，所以疼痛；用手按之，血气得以散通，所以按后疼痛就停止了。",
        notes: [
          { w: "训", t: "膜原，胸腹之间的膜性组织及其间隙，此为邪气结聚之处。" },
          { w: "按", t: "「按之则血气散」——这是《内经》对手法作用机制最直白的一次说明：物理压力换来气血重新分布。" }
        ]
      },
      {
        id: "sw39-5", tags: ["ci", "bingji"], manip: "an",
        yw: "寒氣客於背俞之脈，則脈泣，脈泣則血虛，血虛則痛，其俞注於心，故相引而痛，按之則熱氣至，熱氣至則痛止矣。",
        bh: "寒邪客于背部的俞脉，脉就运行涩滞；脉涩滞就血虚，血虚就疼痛；这些俞穴都与心相通应，所以心与背相互牵引作痛。用手按之，热气到来，热气到来疼痛就停止了。",
        notes: [
          { w: "按", t: "核心一句：按之不只「散血」，更能「致热气」。这是后世温按手法与艾灸取温的理论原型。" }
        ]
      },
      {
        id: "sw39-6", tags: ["bingji"],
        yw: "寒氣客於俠脊之脈，則深按之不能及，故按之無益也。",
        bh: "寒邪客于脊柱两旁的深部经脉，按压的力量达不到病所，所以按压也没有益处。",
        notes: [
          { w: "义", t: "同章也交代了按压的失效条件：病位过深，力不能及。这一段让前面的「按之痛止」有了边界。" }
        ]
      }
    ]
  }
];

NJ_CHAPTERS.push(
  {
    id: "ls08", book: "灵枢", no: 8, title: "本神", titleTw: "本神",
    tags: ["shen", "zangxiang", "bingji"],
    brief: "给「精、神、魂、魄、心、意、志、思、虑、智」十个连续的名词下定义，再逐脏推演出对应的神志病与死亡时段。",
    sections: [
      {
        id: "ls08-0", tags: ["shen"],
        yw: "黃帝問於岐伯曰：凡刺之法，先必本於神。血脈營氣精神，此五藏之所藏也，至其淫泆離藏則精失，魂魄飛揚，志意恍亂，智慮去身者，何因而然乎？",
        bh: "黄帝向岐伯问道：大凡针刺的法则，首先必须以神为根本。血、脉、营、气、精、神，这些都是五脏所藏的东西。等到它们放散流溢、离开藏守之处，就会精气散失，魂魄飞扬，志意恍惚错乱，智慧与思虑都离开身体。究竟是什么原因造成的呢？",
        notes: [

          { w: "按", t: "开篇就把针刺拉回到「本于神」：操作层面的技术要在精神层面的框架里才有意义。" }
        ]
      },
      {
        id: "ls08-1", tags: ["shen"],
        yw: "岐伯答曰：天之在我者德也，地之在我者氣也，德流氣薄而生者也。故生之來謂之精，兩精相搏謂之神，隨神往來者謂之魂，並精而出入者謂之魄，所以任物者謂之心，心有所憶謂之意，意之所存謂之志，因志而存變謂之思，因思而遠慕謂之慮，因慮而處物謂之智。",
        bh: "岐伯回答说：天赋予我们的是德，地赋予我们的是气，天德下流与地气上交，万物由此化生。所以禀受生命的最初物质叫做精，男女两精相合而产生的生命活动叫做神，随着神往来活动的叫做魂，与精同时出入的叫做魄，担当认识事物职司的叫做心，心里有所追忆而留存的叫做意，意念积存不移的叫做志，依据志向而反复推求变化的叫做思，因思考而向远处推想的叫做虑，经思虑而后确定处置事物的叫做智。",
        notes: [
          { w: "按", t: "这是中国古代心理学最整齐的一段定义链：精 → 神 → 魂魄 → 心 → 意 → 志 → 思 → 虑 → 智。一级推一级，每一级都用前一级定义。" }
        ]
      },
      {
        id: "ls08-2", tags: ["shen", "bingji"],
        yw: "是故怵惕思慮者，則傷神，神傷則恐懼流淫而不止。因悲哀動中者，竭絕而失生。喜樂者，神憚散而不藏。愁憂者，氣閉塞而不行。盛怒者，迷惑而不治。恐懼者，神蕩憚而不收。",
        bh: "所以惊惧警惕、思虑过度的人，会损伤神气；神受伤就会产生恐惧，精气流溢不止。因悲哀动摇内脏的人，会气机竭绝而丧失生机。过度喜乐的人，神气耗散而不能藏守。过度愁忧的人，气机闭塞而不能运行。大怒的人，神志迷惑而不能自主。过度恐惧的人，神气动荡而不能收敛。",
        notes: [
          { w: "训", t: "怵惕，音触替，惊恐警惕。惮，音淡，畏惧而散。" },
          { w: "义", t: "六种情志，各配一组具体的病理动词：流淫、竭绝、惮散、闭塞、迷惑、荡惮。不是笼统说「伤身」。" }
        ]
      },
      {
        id: "ls08-3", tags: ["shen", "zangxiang"],
        yw: "肝藏血，血舍魂，肝氣虛則恐，實則怒。脾藏營，營舍意，脾氣虛則四肢不用，五藏不安，實則腹脹，經溲不利。心藏脈，脈舍神，心氣虛則悲，實則笑不休。肺藏氣，氣舍魄，肺氣虛則鼻塞不利少氣，實則喘喝胸盈仰息。腎藏精，精舍志，腎氣虛則厥，實則脹，五藏不安。",

        notes: [

/* ===== 读内经 · 应用 ===== */
(function () {
  "use strict";

  const $ = s => document.querySelector(s);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const el = (tag, cls, html) => {
    const d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html != null) d.innerHTML = html;
    return d;
  };

  /* ---------- 索引：术语倒排 ---------- */
  const termKeys = Object.keys(NJ_TERMS).sort((a, b) => b.length - a.length);
  const termRe = new RegExp(termKeys.map(esc).join("|"), "g");
  const dict = new Map();                 // term -> [{ch,sec}]
  const chById = new Map();
  const secById = new Map();

  NJ_CHAPTERS.forEach(c => {
    chById.set(c.id, c);
    c.sections.forEach(s => {
      secById.set(s.id, s);
      const seen = new Set();
      (s.yw + "　" + s.bh).replace(termRe, m => { seen.add(m); return m; });
      seen.forEach(t => {
        if (!dict.has(t)) dict.set(t, []);
        dict.get(t).push({ ch: c, sec: s });
      });
    });
  });

  function hl(text) {
    return String(text).replace(termRe, m => `<span class="t" data-t="${m}">${m}</span>`);
  }
  function tagHtml(keys) {
    return (keys || []).map(k => {
      const t = NJ_TAGS[k]; if (!t) return "";
      return `<span class="tg" style="color:${t.color}">${t.name}</span>`;
    }).join("");
  }

  /* ---------- 目录 ---------- */
  let curBook = "素问";

  let tocMode = "book";

  function chapterTagSet(c) {
    const set = new Set(c.tags || []);
    (c.sections || []).forEach(x => (x.tags || []).forEach(t => set.add(t)));
    return set;
  }

  function renderTOC() {
    const toc = $("#toc");
    toc.innerHTML = "";

    const modes = document.createElement("div");
    modes.className = "toc-mode";
    modes.innerHTML = `<button class="tm${tocMode === "book" ? " on" : ""}" data-tm="book">按卷次</button><button class="tm${tocMode === "tag" ? " on" : ""}" data-tm="tag">按体系</button>`;
    modes.querySelectorAll(".tm").forEach(b => { b.onclick = () => { tocMode = b.dataset.tm; renderTOC(); }; });
    toc.appendChild(modes);

    const addItem = c => {
      const d = el("div", "toc-item" + (c.id === state.ch ? " on" : ""),
        `<span class="toc-no">${c.no}</span><span>${c.title}</span>`);
      d.dataset.id = c.id;
      d.onclick = () => openChapter(c.id);
      toc.appendChild(d);
    };

    if (tocMode === "book") {
      ["素问", "灵枢"].forEach(bk => {
        toc.appendChild(el("div", "toc-book", bk));
        NJ_CHAPTERS.filter(c => c.book === bk).forEach(addItem);
      });
      return;
    }

    const pairs = NJ_CHAPTERS.map(c => [c, chapterTagSet(c)]);
    Object.keys(NJ_TAGS).forEach(k => {
      const list = pairs.filter(x => x[1].has(k)).map(x => x[0]);
      if (!list.length) return;
      const t = NJ_TAGS[k];
      const head = el("div", "toc-book toc-tag", `${t.name}<i>${list.length} 篇</i>`);
      head.style.borderLeftColor = t.color;
      head.style.color = t.color;
      toc.appendChild(head);
      list.forEach(addItem);
    });
  }

  /* ---------- 主内容 ---------- */
  const state = { ch: NJ_CHAPTERS[0].id, sec: null };

  function openChapter(id, secId) {
    state.ch = id; state.sec = secId || null;
    const c = chById.get(id);
    curBook = c.book;
    renderTOC();
    // 打开章节＝离开所有图表视图（旧写法在 inViz 时不收起覆盖层，导致点「素问」看不到正文）
    inViz = false;
    window.__vizKind = null;
    if (mpState.raf) { cancelAnimationFrame(mpState.raf); mpState.raf = null; }
    $("#viz").classList.remove("on");
    document.body.classList.remove("viz");
    $("#result").style.display = "none";
    $("#wrap").style.display = "flex";

    const wrap = el("div", "inner");
    wrap.appendChild(el("div", "crumb",
      `<b>${c.book}</b> · 第${c.no}篇　/　${c.sections.length}段`));
    const h = el("div", "ch-title", c.title);
    wrap.appendChild(h);
    const bs = NJ_BOOK_SUB[c.book] || NJ_BOOK_SUB["素问"];
    wrap.appendChild(el("div", "ch-sub", `${c.titleTw}　${bs.zhu} · 本篇 ${bs.ben}`));
    wrap.appendChild(el("div", "ch-brief", c.brief));
    wrap.appendChild(el("div", "ch-tags", tagHtml(c.tags)));

    c.sections.forEach((s, i) => {
      const sec = el("div", "sec");
      sec.id = "sid-" + s.id;
      sec.dataset.sec = s.id;

      const bar = el("div", "sec-bar");
      bar.appendChild(el("span", "sec-no", String(i + 1).padStart(2, "0") + "/" + String(c.sections.length).padStart(2, "0")));
      if (s.tags && s.tags.length) {
        const tw = document.createElement("span");
        tw.style.display = "flex"; tw.style.gap = "6px"; tw.style.flexWrap = "wrap";
        tw.innerHTML = tagHtml(s.tags);
        bar.appendChild(tw);
      }
      if (s.mer) {
        const m = NJ_MERIDIANS.find(x => x.id === s.mer);
        bar.appendChild(el("button", "mini-btn mer", "经络 · " + (m ? m.short : s.mer)))
          .onclick = e => { e.stopPropagation(); openMer(s.mer); };
      }
      if (s.off) {
        bar.appendChild(el("button", "mini-btn off", "十二官 · " + s.off.join("")))
          .onclick = e => { e.stopPropagation(); openOff(s.off[0]); };
      }
      if (s.manip) {
        const mm = NJ_MANIP.find(x => x.id === s.manip);
        bar.appendChild(el("button", "mini-btn man", "手法 · " + (mm ? mm.name : "")))
          .onclick = e => { e.stopPropagation(); openManip(s.manip); };
      }
      sec.appendChild(bar);

      sec.appendChild(el("div", "yw", hl(s.yw)));
      sec.appendChild(el("div", "bh", hl(s.bh)));

      if (s.notes && s.notes.length) {
        const nd = el("div", "notes");
        s.notes.forEach(n => {
          const cls = { "训": "x", "义": "y", "按": "a" }[n.w] || "";
          const row = el("div", "nt");
          row.appendChild(el("span", "nt-w " + cls, n.w));
          row.appendChild(el("span", "", hl(n.t)));
          nd.appendChild(row);
        });
        sec.appendChild(nd);
      }
      wrap.appendChild(sec);
    });

    const inner = $("#inner");
    inner.innerHTML = "";
    inner.appendChild(wrap);
    $("#main").scrollTop = 0;

    if (secId) {
      const t = document.getElementById("sid-" + secId);
      if (t) {
        t.scrollIntoView({ block: "center" });
        t.classList.add("flash");
        setTimeout(() => t.classList.remove("flash"), 1700);
      }
    }
    history.replaceState(null, "", "#" + (secId ? c.id + "/" + secId : c.id));
    setAside(defaultAside(c));
    if (window.NJMarkNav) window.NJMarkNav();
  }

  function defaultAside(c) {
    return `<div class="card-h">${c.title}</div>
      <div class="card-py">${c.book} 第${c.no}篇</div>
      <div class="card-cat" style="color:var(--gold)">本篇要旨</div>
      <div class="card-def">${hl(c.brief)}</div>
      <div style="margin-top:16px">${tagHtml(c.tags)}</div>
      <div class="card-link" data-act="mer">打开对应的人体经络图 →</div>
      <div class="card-link" data-act="off">打开十二官关系图 →</div>
      <div class="card-link" data-act="manip">打开按压手法演示器 →</div>`;
  }

  function setAside(html) { $("#aside-body").innerHTML = html; }

  /* 点击术语 / 全局点击委托 */
  document.addEventListener("click", e => {
    const t = e.target.closest(".t");
    if (t) { showTerm(t.dataset.t); return; }
    const l = e.target.closest("[data-act]");
    if (l) {
      const a = l.dataset.act;
      if (a === "mer") openMer(NJ_MERIDIANS[0].id);
      if (a === "off") openOff("心");
      if (a === "manip") openManip("an");
      return;
    }
    const o = e.target.closest("[data-open]");
    if (o) {
      const [cid, sid] = o.dataset.open.split("/");
      openChapter(cid, sid || null);
    }
  });

  function showTerm(term) {
    const d = NJ_TERMS[term]; if (!d) return;
    const catName = { zang: "脏腑", jing: "经络", xue: "腧穴", mai: "脉象", bing: "病证",
      gai: "概念", fa: "治法手法", wu: "五行岁时", shen: "神志", shih: "食养" }[d.cat] || "术语";
    const occ = dict.get(term) || [];
    let html = `<div class="card-h">${term}</div>
      <div class="card-py">${d.py || ""}</div>
      <div class="card-cat">${catName}</div>
      <div class="card-def">${hl(d.def)}</div>`;
    if (occ.length) {
      html += `<div class="mp-h" style="margin-top:16px">本书出现 ${occ.length} 处</div>`;
      occ.slice(0, 12).forEach(o => {
        html += `<div class="occ" data-open="${o.ch.id}/${o.sec.id}">
          <b>${o.ch.book}${o.ch.no}·${o.ch.title}</b>
          ${o.sec.yw.slice(0, 26)}…</div>`;
      });
    }
    if (d.see && chById.get(d.see)) {
      html += `<div class="card-link" data-open="${d.see}">阅读《${chById.get(d.see).title}》 →</div>`;
    }
    setAside(html);
    $("#aside").scrollTop = 0;
  }

  // 读取 CSS 变量（夜间模式由 body.night 覆盖同一批变量名）
  function njVar(n, fb) {
    const v = getComputedStyle(document.body).getPropertyValue(n).trim();
    return v || fb;
  }

  const merState = { cur: null };

  function openMer(id) {
    merState.cur = id || merState.cur || "lu";

  function wxRingSVG() {
    const cx = 132, cy = 132, R = 86;
    const ang = i => (-90 + i * 72) * Math.PI / 180;
    const P = NJ_WUXING.map((x, i) =>
      [cx + R * Math.cos(ang(i)), cy + R * Math.sin(ang(i))]);
    const sheng = P.map((a, i) => {
      const b = P[(i + 1) % 5];
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const ox = mx - cx, oy = my - cy, L = Math.hypot(ox, oy) || 1;
      return `<path d="M${a[0].toFixed(1)},${a[1].toFixed(1)} Q${(mx + ox / L * 30).toFixed(1)},${(my + oy / L * 30).toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}" fill="none" stroke="#3f7a2e" stroke-width="1.2" opacity=".75" marker-end="url(#wxa-s)"/>`;
    }).join("");
    const ke = P.map((a, i) => {
      const b = P[(i + 2) % 5], t = 0.84;
      return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${(a[0] + (b[0] - a[0]) * t).toFixed(1)}" y2="${(a[1] + (b[1] - a[1]) * t).toFixed(1)}" stroke="#b02d18" stroke-width="1" stroke-dasharray="4 3" opacity=".5" marker-end="url(#wxa-k)"/>`;
    }).join("");
    const nodes = NJ_WUXING.map((w, i) => {
      const on = w.id === wxState.cur;
      return `<g class="wx-node" data-wx="${w.id}"><circle cx="${P[i][0].toFixed(1)}" cy="${P[i][1].toFixed(1)}" r="${on ? 25 : 21}" fill="${on ? w.color : njVar("--node-bg", "#f7efd8")}" stroke="${w.color}" stroke-width="${on ? 2 : 1}"/><text x="${P[i][0].toFixed(1)}" y="${(P[i][1] + 6).toFixed(1)}" text-anchor="middle" font-size="${on ? 19 : 17}" fill="${on ? "#fdf4dc" : w.color}" font-family="var(--serif)">${w.name}</text></g>`;
    }).join("");
    return `<svg viewBox="0 0 264 264" width="100%" style="max-width:264px;display:block">
      <defs>
        <marker id="wxa-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#3f7a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
        <marker id="wxa-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#b02d18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
      </defs>
      ${sheng}${ke}${nodes}
      <text x="132" y="126" text-anchor="middle" font-size="11" fill="${njVar("--ink3", "#9c9282")}" font-family="var(--sans)">外弧　相生</text>
      <text x="132" y="142" text-anchor="middle" font-size="11" fill="${njVar("--ink3", "#9c9282")}" font-family="var(--sans)">内线　相克</text>
    </svg>`;
  }

  function openOff(name) {
    offState.cur = name || "心";

  const offState = { cur: "心" };

  function renderVizOff() {
    const cx = 280, cy = 250, rx = 216, ry = 168;
    const others = NJ_OFFICIALS.filter(o => o.name !== "心");
    const wx = { 木: "#3f7a2e", 火: "#b02d18", 土: "#96650c", 金: "#5c6a86", 水: "#33409e" };

    const offPos = { 心: [cx, cy] };
    const nodes = others.map((o, i) => {
      const a = (-Math.PI / 2) + (i / others.length) * Math.PI * 2;
      const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
      offPos[o.name] = [x, y];
      const col = wx[o.wuxing] || "#6c6450";
      const on = o.name === offState.cur;
      return `<g class="off-node" data-o="${o.name}">
        <line class="off-line" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"
          stroke="${on ? col : njVar("--line2", "#a89272")}" stroke-width="${on ? 2 : 1}"/>
        <circle class="off-c" cx="${x}" cy="${y}" r="30" fill="${on ? col : njVar("--node-bg", "#f7efd8")}"
          stroke="${col}" stroke-width="${on ? 2.5 : 1.4}"/>
        <text class="off-nm" x="${x}" y="${y - 5}" ${on ? "" : 'fill="' + col + '"'}
          style="fill:${on ? "#fdf4dc" : col}">${o.name}</text>
        <text class="off-nm" x="${x}" y="${y + 10}" style="font-size:9px;fill:${on ? "#fdf4dc" : col}">${o.i}</text>
        <text class="off-rk" x="${x}" y="${y + 44}">${o.rank}</text>
      </g>`;
    }).join("");

    const cur = NJ_OFFICIALS.find(o => o.name === offState.cur) || NJ_OFFICIALS[0];
    const centerColor = wx["火"];

    // —— 生克传变：四条通路（绿＝生克相及，红＝乘侮）
    const cbWx = NJ_WUXING.find(x => x.name === cur.wuxing) || NJ_WUXING[0];
    const cbMe = NJ_ZANG5[cur.wuxing];
    const cbZ = { 母: NJ_ZANG5[cbWx.shengwo], 子: NJ_ZANG5[cbWx.sheng],
                  所胜: NJ_ZANG5[cbWx.woKe], 所不胜: NJ_ZANG5[cbWx.keWo] };
    const cbPair = {
      muzi:  [cbZ.母, cbMe, "#3f7a2e", 0],
      zimu:  [cbMe, cbZ.母, "#3f7a2e", 0],
      cheng: [cbMe, cbZ.所胜, "#b02d18", 0],
      wu:    [cbMe, cbZ.所不胜, "#b02d18", 1]
    };
    const cbArrow = (a, b, col, dash) => {
      const A = offPos[a], B = offPos[b];
      if (!A || !B || a === b) return "";
      let dx = B[0] - A[0], dy = B[1] - A[1];
      const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      const r0 = a === "心" ? 64 : 34, r1 = b === "心" ? 68 : 40;
      return `<line x1="${(A[0] + dx * r0).toFixed(1)}" y1="${(A[1] + dy * r0).toFixed(1)}"
        x2="${(B[0] - dx * r1).toFixed(1)}" y2="${(B[1] - dy * r1).toFixed(1)}"
        stroke="${col}" stroke-width="2.1" opacity="1"
        ${dash ? 'stroke-dasharray="5 3"' : ""} marker-end="url(#offa-${dash ? "k" : "s"})"/>`;
    };
    const cbLines = NJ_CB_PATHS.map(p => cbArrow.apply(null, cbPair[p.k])).join("");

    const fig = `<svg viewBox="0 0 560 500" width="100%" style="display:block">
      <defs>
        <marker id="offa-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#3f7a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
        <marker id="offa-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#b02d18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
      </defs>
      <ellipse cx="280" cy="250" rx="216" ry="168" fill="none"
        stroke="#d8cbb0" stroke-width="1" stroke-dasharray="4 6"/>
      ${cbLines}
      ${nodes}
      <g><circle cx="280" cy="250" r="58" fill="${centerColor}"/>
        <text class="off-nm" x="280" y="238" style="font-size:26px">心</text>
        <text class="off-nm" x="280" y="264" style="font-size:11px;font-family:var(--sans)">君主之官</text></g>
      <text x="280" y="470" text-anchor="middle" class="off-rk"
        style="font-size:11px;letter-spacing:.1em">《素问·灵兰秘典论》· 十二官相使图</text>
    </svg>`;

    const listHtml = NJ_OFFICIALS.map(o =>
      `<div class="occ" data-o="${o.name}" style="font-size:14px;${o.name === offState.cur
        ? "color:var(--zhu);font-weight:700" : ""}"><b>${o.rank}</b>${o.name}　${o.out}</div>`).join("");

    $("#viz").innerHTML = `
      <div class="viz-head">
        <h2>十二官关系图</h2>
        <p>十二藏之相使 · 贵贱何如</p>
        <div style="flex:1"></div>
        <button class="tool-btn" id="viz-close">返回阅读</button>
      </div>
      <div class="viz-body">
        <div id="off-fig">${fig}</div>
        <div id="off-panel">
          <div class="mp-name" style="color:${wx[cur.wuxing]}">${cur.name}　<span
            style="font-size:14px;font-weight:400;color:var(--ink2)">${cur.rank}</span></div>
          <div class="mp-sub">五行属${cur.wuxing}　·　位比${cur.pos}　·　第${cur.i}官</div>
          <div class="mp-t" style="font-size:19px;letter-spacing:.06em;margin-bottom:12px">
            ${cur.name}者，${cur.rank}，${cur.out}。</div>
          <div class="mp-h">要义</div>
          <div class="mp-t">${hl(cur.note)}</div>
          <div class="mp-h">生克传变 · 四条通路</div>
          ${cbMe !== cur.name ? `<div class="cb-from">${cur.name}属${cur.wuxing}，腑从其脏，传变以<b>${cbMe}</b>为主论</div>` : ""}
          <div class="cb-list">
            ${NJ_CB_PATHS.map(pt => {
              const [a, b, col] = cbPair[pt.k];
              return `<div class="cb-item ${pt.kind}">
                <div class="cb-top">
                  <span class="cb-arrow" style="color:${col}">${a} → ${b}</span>
                  <b class="cb-nm">${pt.name}</b>
                  <span class="cb-tag">${pt.dir}</span>
                </div>
                <div class="cb-rule">${pt.rule}</div>
                <div class="cb-case">${(NJ_CB_CASES[cbMe] || {})[pt.k] || ""}</div>
                <div class="cb-q">${hl(pt.q)}<span class="cb-src">${pt.src}</span></div>
              </div>`;
            }).join("")}
          </div>
          <div class="cb-note">${NJ_CB_NOTE}</div>
          <div class="mp-h">十二官全表</div>
          <div id="off-list">${listHtml}</div>
          <div class="card-link" data-open="sw08">阅读《灵兰秘典论》原文 →</div>
        </div>
      </div>`;

    $("#viz").querySelectorAll("[data-o]").forEach(b => {
      b.onclick = () => { offState.cur = b.dataset.o; renderVizOff(); };
    });
    $("#viz-close").onclick = exitViz;
  }

            <path id="skin" d="M40,250 C110,232 180,264 240,248 C300,232 370,258 440,246"
