{"id":"ls36","book":"灵枢","no":36,"title":"五癃津液别","titleTw":"五癃津液別","tags":["jingluo","bingji","zangxiang"],"brief":"论水谷所化津液分为溺、汗、泣、唾、水胀五路的生成机理，及阴阳气道不通所致病变。","pending":false,"sections":[{"id":"ls36-1","tags":[],"yw":"黃帝問於岐伯曰：水谷入於口，輸於腸胃，其液別爲五，天寒衣薄，則爲溺與氣，天熱衣厚則爲汗，悲哀氣並則爲泣，中熱胃緩則爲唾。邪氣內逆，則氣爲之閉塞而不行，不行則爲水脹，餘知其然也，不知其何由生？願聞其道。岐伯曰：水谷皆入於口，其味有五，各注其海。津液各走其道，故三焦出氣，以溫肌肉，充皮膚，爲其津，其流而不行者爲液。天暑衣厚則腠理開，故汗出，寒留於分肉之間，聚沫則爲痛。天寒則腠理閉，氣溼不行，水下留於膀胱，則爲溺與氣。","bh":"黄帝问岐伯说：水谷入于口，输于肠胃，它所化的液分为五路，天寒衣薄，就成为尿与气，天热衣厚就成为汗，悲哀气并就成为泣，中焦有热、胃缓就成为唾。邪气内逆，则气因此闭塞而不行，不行就成为水胀，我知道是这样，但不知道它由什么而生，想听听其中的道理。岐伯说：水谷都入于口，其味有五种，各注于其所合之海。津液各走其道，所以三焦输出气，以温养肌肉、充养皮肤，这就是它的津；那流而不行（留而不去）的就是液。天暑衣厚则腠理开，所以出汗；寒邪留于分肉之间，聚为汁沫就成为痛。天寒则腠理闭，气湿滞而不行，水气下留于膀胱，就成为尿与气。","notes":[],"pending":false},{"id":"ls36-2","tags":[],"yw":"五髒六腑，心爲之主，耳爲之聽，目爲之候，肺爲之相，肝爲之將，脾爲之衛，腎爲之主外。故五髒六腑之津液，盡上滲於目，心悲氣並，則心系急。心系急則肺舉，肺舉則液上溢。夫心系與肺，不能常舉，乍上乍下，故欬而泣出矣。中熱則胃中消谷，消谷則蟲上下作。腸胃充郭，故胃緩，胃緩則氣逆，故唾出。五谷之津液，和合而爲膏者，內滲入於骨空，補益腦髓，而下流於陰股。陰陽不和，則使液溢而下流於陰，髓液皆減而下，下過度則虛，虛，故腰背痛而脛酸。","bh":"五脏六腑，心为之主，耳为之听，目为之候（主视），肺为之相（主相辅），肝为之将（主谋虑），脾为之卫（主护卫），肾为之主外（主外应）。所以五脏六腑的津液，都上渗于目；心中悲哀而气并于上，则心系拘急。心系拘急则肺上举，肺上举则液上溢。心系与肺不能常举，忽上忽下，所以咳而泣出。中焦有热则胃中消谷，消谷则虫上下扰动。肠胃充廓，所以胃缓，胃缓则气逆，所以唾出。五谷的津液，和合而成膏脂的，向内渗入骨空，补益脑髓，而向下流于阴股。阴阳不和，就使液外溢而向下流于阴，髓液都减少而下流，下流过甚就虚，虚，所以腰背痛而胫酸。","notes":[],"pending":false},{"id":"ls36-3","tags":[],"yw":"陰陽氣道不通，四海閉塞，三焦不瀉，津液不化，水谷並行腸胃之中，別於回腸，留於下焦，不得滲膀胱，則下焦脹，水溢則爲水脹，此津液五別之逆順也。","bh":"阴阳气道不通，四海闭塞，三焦不能输泻，津液不能化生，水谷并行于肠胃之中，别出于回肠，留于下焦，不能渗入膀胱，则下焦胀，水溢就成为水胀，这就是津液五别的逆顺。","notes":[],"pending":false}]},
{"id":"ls37","book":"灵枢","no":37,"title":"五阅五使","titleTw":"五閱五使","tags":["ci","zhenfa","bingji"],"brief":"论五官为五脏之阅，以鼻目口唇舌耳候五脏之病，并以明堂五色、阙庭蕃蔽决病与寿夭。","pending":false,"sections":[{"id":"ls37-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞刺有五官五閱，以觀五氣。五氣者，五髒之使也，五時之副也。願聞其五使當安出？岐伯曰：五官者，五髒之閱也。黃帝曰：願聞其所出，令可爲常。岐伯曰：脈出於氣口，色見於明堂，五色更出，以應五時，各如其常，經氣入髒，必當治理。帝曰：善。五色獨決於明堂乎？岐伯曰：五官已辨，闕庭必張，乃立明堂，明堂廣大，蕃蔽見外，方壁高基，引垂居外，五色乃治，平搏廣大，壽中百歲，見此者，刺之必已，如是之人者，血氣有餘，肌肉堅致，故可苦以針。","bh":"黄帝问岐伯说：我听说刺家有五官五阅，以观察五气。五气是五脏的外使，与五时相配。想听听这五使应当从何处出现？岐伯说：五官是五脏的外候。黄帝说：想听听它出现的部位，使它可以成为常法。岐伯说：脉出于气口，色见于明堂（鼻部），五色交替出现，以应五时，各如其常，经气入于脏，必当治其理。黄帝说：好。五色独取决于明堂吗？岐伯说：五官已分辨，阙庭必定开张，才确立明堂；明堂广大，蕃蔽（颊侧耳门等屏障）显于外，面部方正、地阁高厚，耳垂居于外侧，五色就正常，平坦广大，寿命可至百岁，见到这样的人，刺之必定痊愈，像这样的人，血气有余，肌肉坚密，所以可以耐受针刺之苦。","notes":[],"pending":false},{"id":"ls37-2","tags":[],"yw":"黃帝曰：願聞五官。岐伯曰：鼻者，肺之官也；目者，肝之官也；口脣者，脾之官也；舌者，心之官也；耳者，腎之官也。黃帝曰：以官何候？岐伯曰：以候五髒。故肺病者，喘息鼻張；肝病者，眥青；脾病者，脣黃；心病者，舌卷短，顴赤；腎病者，顴與顏黑。黃帝曰：五脈安出，五色安見，其常色殆者如何？岐伯曰：五官不辨，闕庭不張，小其明堂，蕃蔽不見，又埤其牆，牆下無基，垂角去外。如是者，雖平常殆，況加疾哉。黃帝曰：五色之見於明堂，以觀五髒之氣，左右高下，各有形乎？岐伯曰：髒腑之在中也，各以次舍，左右上下，各如其度也。","bh":"黄帝说：想听听五官。岐伯说：鼻是肺之官；目是肝之官；口唇是脾之官；舌是心之官；耳是肾之官。黄帝说：以五官候察什么？岐伯说：以候五脏。所以肺病的，喘息而鼻翼张动；肝病的，眼角发青；脾病的，口唇发黄；心病的，舌卷缩而短，两颧发赤；肾病的，两颧与额部发黑。黄帝说：五脉从哪里出现，五色从哪里显现，那平常气色就不好的又怎样？岐伯说：五官不能分辨，阙庭不开张，明堂狭小，蕃蔽不显现，又使两颊低矮，颊下无基，耳垂角反张向外。像这样的人，即使平常也有危险，何况再加上疾病呢。黄帝说：五色显现于明堂，以观察五脏之气，左右高下，各有形状吗？岐伯说：脏腑在人身之中，各有其位置，左右上下，各如其分度。","notes":[],"pending":false}]},
{"id":"ls38","book":"灵枢","no":38,"title":"逆顺肥瘦","titleTw":"逆順肥瘦","tags":["ci","zhenfa","shen"],"brief":"论针道必合天地人事而有法度，据肥人瘦人壮士婴儿体质定深浅疾徐，并论脉行逆顺与冲脉。","pending":false,"sections":[{"id":"ls38-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞針道於夫子，衆多畢悉矣。夫子之道，應若失，而據未有堅然者也。夫子之問學熟乎，將審察於物而心生之乎？岐伯曰：人之爲道者，上合於天，下合於地，中合於人事，必有明法，以起度數，法式檢押，乃後可傳焉。故匠人不能釋尺寸而意短長，廢繩墨而起平水也，工人不能置規而爲圓，去矩而爲方。知用此者，固自然之物，易用之教，逆順之常也。黃帝曰：願聞自然奈何？岐伯曰：臨深決水，不用功力，而水可竭也。循拙決衝，而經可通也。","bh":"黄帝问岐伯说：我听夫子讲针道，众多内容都已详尽了。夫子之道，应用起来好像随手可得，而它的依据却似乎没有坚固不变的定则。夫子的学问是问学得来的呢，还是审察事物而心中悟出来的呢？岐伯说：人为天地间的一种道，上合于天，下合于地，中合于人事，必须有明确的法则，以定出度数，有法式规矩，然后才可以传授。所以匠人不能舍弃尺寸而臆度长短，不能废弃绳墨而求水平；工人不能弃规而画圆，去矩而画方。懂得运用这些的，是固然自然之物、易用之教、逆顺之常。黄帝说：想听听自然是怎样的？岐伯说：临深水处掘开堤防放水，不用费多少功力，水就可以放尽。顺着洞穴掘开通道，水道就可以通行。","notes":[],"pending":false},{"id":"ls38-2","tags":[],"yw":"此言氣之滑澀，血水清濁，行之逆順也。黃帝曰：願聞人之白黑肥瘦小長，各有數乎？岐伯曰：年質壯大，血氣充盈，膚革堅固，因加以邪，刺此者，深而留之，此肥人也。廣肩腋項，肉薄厚皮而黑色，脣臨臨然，其血黑以濁，其氣澀以遲。其爲人也，貪於取與，刺此者，深而留之，多益其數也。黃帝曰：刺瘦人奈何？岐伯曰：瘦人者，皮薄色少，肉廉廉然，薄脣輕言，其血清氣滑，易脫於氣，易損於血，刺此者，淺而疾之。黃帝曰：刺常人奈何？岐伯曰：視其白黑，各爲調之，其端正敦厚者，其血氣和調，刺此者，無失常數也。","bh":"这是说气的滑涩，血的清浊，运行的逆顺。黄帝说：想听听人的黑白、肥瘦、大小、长短，各有定数吗？岐伯说：年壮而体质壮大，血气充盈，皮肤坚固，因而被邪气所侵，刺这样的人，要深刺而留针，这是肥人。肩腋项部宽阔，肉薄而皮厚，色黑，口唇厚大，他的血黑而浊，气涩而行迟。他的为人，贪于取与，刺这样的人，要深刺而留针，增加针刺的次数。黄帝说：刺瘦人怎样？岐伯说：瘦人的，皮薄而色泽少，肌肉瘦削，唇薄而言轻声小，他的血清而气滑，容易脱气，容易损血，刺这样的人，要浅刺而快出针。黄帝说：刺常人怎样？岐伯说：看他的黑白，各为调治；那端正敦厚的，血气和调，刺这样的人，不失常法。","notes":[],"pending":false},{"id":"ls38-3","tags":[],"yw":"黃帝曰：刺壯士真骨者，奈何？岐伯曰：刺壯士真骨，堅肉緩節，監監然，此人重則氣澀血濁，刺此者，深而留之，多益其數；勁則氣滑血清，刺此者，淺而疾之。黃帝曰：刺嬰兒奈何？岐伯曰：嬰兒者，其肉脆，血少氣弱，刺此者，以豪刺，淺刺而疾拔針，日再可也。黃帝曰：臨深決水，奈何？岐伯曰：血清氣濁（滑），疾瀉之則氣竭焉。黃帝曰：循拙決衝，奈何？岐伯曰：血濁氣澀，疾瀉之，則經可通也。黃帝曰：脈行之逆順，奈何？岐伯曰：手之三陰，從髒走手；手之三陽，從手走頭；足之三陽，從頭走足；足之三陰，從足走腹。","bh":"黄帝说：刺壮士而骨骼坚固的人怎样？岐伯说：刺壮士真骨（骨骼坚固）的人，肌肉坚实而关节舒缓，监监然（强壮有力貌），这种人稳重则气涩血浊，刺这样的人，深刺而留针，增加针刺的次数；轻劲的则气滑血清，刺这样的人，浅刺而快出针。黄帝说：刺婴儿怎样？岐伯说：婴儿的，肌肉脆弱，血少气弱，刺这样的人，用毫针，浅刺而快出针，一日二次可以。黄帝说：临深决水，怎样理解？岐伯说：血清而气滑，急速泻之就会使气竭。黄帝说：循拙决冲，怎样理解？岐伯说：血浊而气涩，急速泻之，则经脉可以通畅。黄帝说：脉行的逆顺怎样？岐伯说：手之三阴，从脏走手；手之三阳，从手走头；足之三阳，从头走足；足之三阴，从足走腹。","notes":[],"pending":false},{"id":"ls38-4","tags":[],"yw":"黃帝曰：少陰之脈獨下行，何也？岐伯曰：不然，夫衝脈者，五髒六腑之海也，五髒六腑皆稟焉。其上者，出於頏顙，滲諸陽，灌諸精；其下者，注少陰之大絡，出於氣街，循陰股內廉入膕中，伏行骭骨內，下至內踝之後屬而別。其下者，並於少陰之經，滲三陰；其前者，伏行出跗屬，下循跗，入大趾間，滲諸絡而溫肌肉。故別絡結則附上不動，不動則厥，厥則寒矣。黃帝曰：何以明之？岐伯曰：以言導之，切而驗之，其非必動，然後仍可明逆順之行也。","bh":"黄帝说：足少阴之脉独独下行，是为什么？岐伯说：不是这样。冲脉是五脏六腑之海，五脏六腑都禀受其气。它上行的，出于颃颡（鼻咽部），渗灌诸阳经，灌注诸精气；它下行的，注入足少阴之大络，出于气街，沿阴股内侧入于腘中，伏行于胫骨之内，下至内踝之后而分支别行。它下行的，并于足少阴之经，渗灌三阴；它前行的，伏行出于足背，下循足背，入于大趾之间，渗灌诸络而温养肌肉。所以别络结滞，则足背上的动脉不搏动，不搏动就是厥，厥就寒冷。黄帝说：怎样明辨它？岐伯说：用言语诱导他，切按其脉而验证，看它是否搏动，然后才可以明了逆顺的运行。","notes":[],"pending":false},{"id":"ls38-5","tags":[],"yw":"黃帝曰：窘乎哉！聖人之爲道也。明於日月，微於毫釐，其非夫子，孰能道之也。","bh":"黄帝说：精深啊！圣人所立的道。比日月还明，比毫厘还微，若不是夫子，谁能够讲出它呢。","notes":[],"pending":false}]},
{"id":"ls39","book":"灵枢","no":39,"title":"血络论","titleTw":"血絡論","tags":["ci","zhenfa","bingji"],"brief":"解释刺血络出现的昏仆、血射、血黑浊、血出汁、拔针而肿等各种反应的机理与刺络法度。","pending":false,"sections":[{"id":"ls39-1","tags":[],"yw":"黃帝曰：願聞其奇邪而不在經者。岐伯曰：血絡是也。黃帝曰：刺血絡而僕者，何也？血出而射者，何也？血少黑而濁者，何也？血出清而半爲汁者，何也？拔針而腫者，何也？血出若多若少而面色蒼蒼者，何也？拔針而面色不變而煩悗者，何也？多出血而不動搖者，何也？願聞其故。岐伯曰：脈氣盛而血虛者，刺之則脫氣，脫氣則僕。血氣俱盛而陰氣多者，其血滑，刺之則射；陽氣蓄積，久留而不瀉者，其血黑以濁，故不能射。新飲而液滲於絡，而未合和於血也，故血出而汁別焉；其不新飲者，身中有水，久則爲腫。","bh":"黄帝说：想听听那些奇邪而不在经的。岐伯说：就是血络。黄帝说：刺血络而昏仆的，是为什么？出血而喷射的，是为什么？血少而黑浊的，是为什么？血出清稀而一半是汁的，是为什么？拔针后局部肿起的，是为什么？出血或多或少而面色苍苍的，是为什么？拔针后面色不变而烦闷的，是为什么？出血多而不动摇（不虚脱）的，是为什么？想听听其中的缘故。岐伯说：脉气盛而血虚的，刺之就脱气，脱气就昏仆。血气俱盛而阴气多的，其血滑利，刺之就喷射；阳气蓄积，久留而不泻的，其血黑而浊，所以不能喷射。刚饮水而水液渗入于络，尚未与血和合，所以出血而汁液相别；那没有刚饮水的，是身中有水气，久了就成为肿。","notes":[],"pending":false},{"id":"ls39-2","tags":[],"yw":"陰氣積於陽，其氣因於絡，故刺之血未出而氣先行，故腫。陰陽之氣，其新相得而未和合，因而瀉之，則陰陽俱脫，表裏相離，故脫色而蒼蒼然。刺之血出多，色不變而煩悗者，刺絡而虛經，虛經之屬於陰者，陰脫，故煩悗。陰陽相得而合爲痹者，此爲內溢於經，外注於絡。如是者，陰陽俱有餘，雖多出血而弗能虛也。黃帝曰：相之奈何？岐伯曰：血脈者，盛堅橫以赤，上下無常處，小者如針，大者如筋，則而瀉之萬全也，故無失數矣。失數而反，各如其度。","bh":"阴气蓄积于阳分，其气循于络脉，所以刺时血未出而气先行走散，就肿。阴阳之气，刚刚相得而尚未和合，因而泻之，就阴阳俱脱，表里相离，所以失色而苍苍然。刺之出血多，而面色不变、烦闷的，是刺络而使经虚，虚经属于阴的，阴脱，所以烦闷。阴阳相得而合为痹的，这是内溢于经，外注于络。像这样的人，阴阳都有余，虽然多出血也不能使他虚。黄帝说：怎样诊察它？岐伯说：血脉充盛、坚紧、横行而色赤，上下无固定之处，小的如针，大的如筋（筷子），据此而泻之就万全，所以不要失去法度。失去法度而反其道而行，就会各按其程度而受害。","notes":[],"pending":false},{"id":"ls39-3","tags":[],"yw":"黃帝曰：針入而肉着者，何也？岐伯曰：熱氣因於針，則針熱，熱則內着於針，故堅焉。","bh":"黄帝说：针入而肌肉裹住针的，是为什么？岐伯说：热气附于针，针就发热，热则肌肉附着于针，所以针滞涩而坚紧。","notes":[],"pending":false}]},
{"id":"ls40","book":"灵枢","no":40,"title":"阴阳清浊","titleTw":"陰陽清濁","tags":["ci","jingluo","zhenfa"],"brief":"论人气有清浊之分，受谷者浊、受气者清，清浊相干为乱气，刺法因清浊滑涩而异。","pending":false,"sections":[{"id":"ls40-1","tags":[],"yw":"黃帝曰：餘聞十二經脈，以應十二經水者，其五色各異，清濁不同，人之血氣若一，應之奈何？岐伯曰：人之血氣，苟能若一，則天下爲一矣，惡有亂者乎？黃帝曰：餘問一人，非問天下之衆。岐伯曰：夫一人者，亦有亂氣，天下之象，亦有亂人，其合爲一耳。黃帝曰：願聞人氣之清濁。岐伯曰：受谷者濁，受氣者清。清者注陰，濁者注陽。濁而清者，上出於咽，清而濁者，則下行。清濁相干，命曰亂氣。黃帝曰：夫陰清而陽濁，濁者有清，清者有濁，清濁別之奈何？岐伯曰：氣之大別，清者上注於肺，濁者下走於胃。","bh":"黄帝说：我听说十二经脉以应十二经水，它们的五色各不相同，清浊不同，人的血气若是一样的，怎样相应呢？岐伯说：人的血气，如果能都一样，那天下就成一统了，哪有作乱的呢？黄帝说：我问的是一人，不是问天下众人。岐伯说：一个人也有乱气，天下众人也有作乱的人，其理相合为一罢了。黄帝说：想听听人气的清浊。岐伯说：受纳水谷的浊，受纳天气的清。清的注于阴，浊的注于阳。浊中之清的，上出于咽；清中之浊的，就向下行。清浊相干扰，名叫乱气。黄帝说：阴清而阳浊，浊中有清，清中有浊，怎样分别清浊呢？岐伯说：气的大分别，清者上注于肺，浊者下走于胃。","notes":[],"pending":false},{"id":"ls40-2","tags":[],"yw":"胃之清氣，上出於口；肺之濁氣，下注於經，內積於海。黃帝曰：諸陽皆濁，何陽濁甚乎？岐伯曰：手太陽獨受陽之濁，手太陰獨受陰之清；其清者上走空竅，其濁者下行諸經。諸陰皆清，足太陰獨受其濁。黃帝曰：治之奈何？岐伯曰：清者其氣滑，濁者其氣澀，此氣之常也。故刺陰者，深而留之；刺陽者，淺而疾之；清濁相干者，以數調之也。","bh":"胃中的清气，上出于口；肺中的浊气，下注于经脉，内积于胸中之海。黄帝说：诸阳经都浊，哪一阳经浊得最甚？岐伯说：手太阳独受阳分之浊，手太阴独受阴分之清；那清的上走于孔窍，那浊的下行于诸经。诸阴经都清，足太阴独受其浊。黄帝说：怎样治疗？岐伯说：清的其气滑利，浊的其气涩滞，这是气的常态。所以刺阴经的，深刺而留针；刺阳经的，浅刺而快出针；清浊相干扰的，按法度调治。","notes":[],"pending":false}]},
{"id":"ls41","book":"灵枢","no":41,"title":"阴阳系日月","titleTw":"陰陽系日月","tags":["ci","jingluo","zhenfa"],"brief":"以腰之上下分天地阴阳，手足十二经配十二月与十日，论人体阴阳配属及依月避忌的刺禁。","pending":false,"sections":[{"id":"ls41-1","tags":[],"yw":"黃帝曰：餘聞天爲陽，地爲陰，日爲陽，月爲陰，其合之於人，奈何？岐伯曰：腰以上爲天，腰以下爲地，故天爲陽，地爲陰，故足之十二經脈，以應爲十二月，月生於水，故在下者爲陰；手之十指，以應十日，日主火，故在上者爲陽。黃帝曰：合之於脈，奈何？岐伯曰：寅者，正月之生陽也，主左足之少陽；未者，六月，主右足之少陽。卯者，二月，主左足之太陽；午者，五月，主右足之太陽。辰者，三月，主左足之陽明；巳者，四月，主右足之陽明。","bh":"黄帝说：我听说天为阳，地为阴，日为阳，月为阴，它们与人身相合，是怎样的？岐伯说：腰以上为天，腰以下为地，所以天为阳，地为阴，所以足之十二经脉以应十二月，月生于水，所以在下者为阴；手之十指以应十日（十天干），日主火，所以在上者为阳。黄帝说：与经脉相合，是怎样的？岐伯说：寅是正月所生之阳，主左足之少阳；未是六月，主右足之少阳。卯是二月，主左足之太阳；午是五月，主右足之太阳。辰是三月，主左足之阳明；巳是四月，主右足之阳明。","notes":[],"pending":false},{"id":"ls41-2","tags":[],"yw":"此兩陽合於前，故曰陽明。申者，七月之生陰也，主右足之少陰；丑者，十二月，主左足之少陰；酉者，八月，主右足之太陰；子者，十一月，主左足之太陰；戌者，九月，主右足之厥陰；亥者，十月，主左足之厥陰；此兩陰交盡，故曰厥陽。甲主左手之少陽；己主右手之少陽；乙主左手之太陽，戊主右手之太陽；丙主左手之陽明，丁主右手之陽明，此兩火並合，故爲陽明。庚主右手之少陰，癸主左手之少陰，辛主右手之太陰，壬主左手之太陰。故足之陽者，陰中之少陽也；足之陰者，陰中之太陰也。","bh":"这是两阳合于前，所以叫阳明。申是七月所生之阴，主右足之少阴；丑是十二月，主左足之少阴；酉是八月，主右足之太阴；子是十一月，主左足之太阴；戌是九月，主右足之厥阴；亥是十月，主左足之厥阴；这是两阴相交而尽，所以叫厥阴。甲主左手之少阳；己主右手之少阳；乙主左手之太阳，戊主右手之太阳；丙主左手之阳明，丁主右手之阳明，这是两火并合，所以为阳明。庚主右手之少阴，癸主左手之少阴，辛主右手之太阴，壬主左手之太阴。所以足之阳经，是阴中之少阳；足之阴经，是阴中之太阴。","notes":[],"pending":false},{"id":"ls41-3","tags":[],"yw":"手之陽者，陽中之太陽也；手之陰者，陽中之少陰也。腰以上者爲陽，腰以下者爲陰。其於五髒也，心爲陽中之太陽，肺爲陰中之少陰，肝爲陰中少陽，脾爲陰中之至陰，腎爲陰中之太陰。黃帝曰：以治之奈何？岐伯曰：正月二月三月，人氣在左，無刺左足之陽；四月五月六月，人氣在右，無刺右足之陽，七月八月九月，人氣在右，無刺右足之陰，十月十一月十二月，人氣在左，無刺左足之陰。黃帝曰：五行以東方爲甲乙木主春。春者，蒼色，主肝，肝者，足厥陰也。","bh":"手之阳经，是阳中之太阳；手之阴经，是阳中之少阴。腰以上的为阳，腰以下的为阴。就五脏而言，心为阳中之太阳，肺为阴中之少阴，肝为阴中之少阳，脾为阴中之至阴，肾为阴中之太阴。黄帝说：据此怎样治疗？岐伯说：正月二月三月，人气在左，不要刺左足之阳经；四月五月六月，人气在右，不要刺右足之阳经；七月八月九月，人气在右，不要刺右足之阴经；十月十一月十二月，人气在左，不要刺左足之阴经。黄帝说：五行以东方为甲乙木，主春。春是苍色，主肝，肝是足厥阴。","notes":[],"pending":false},{"id":"ls41-4","tags":[],"yw":"今乃以甲爲左手之少陽，不合於數，何也？岐伯曰：此天地之陰陽也，非四時五行之以次行也。且夫陰陽者，有名而無形，故數之可十，離之可百，散之可千，推之可萬，此之謂也。","bh":"如今却以甲为左手之少阳，不合于五行之数，是为什么？岐伯说：这是天地的阴阳，不是四时五行依次而行的那种配法。况且阴阳这种东西，有名而无形，所以数之可为十，分之可为百，散之可为千，推之可为万，说的就是这个意思。","notes":[],"pending":false}]},
{"id":"ls42","book":"灵枢","no":42,"title":"病传","titleTw":"病傳","tags":["ci","zhenfa","bingji"],"brief":"论邪气淫传五脏的次第与死期，按序相传者皆有死期不可刺，间一脏至三四脏相传者乃可刺。","pending":false,"sections":[{"id":"ls42-1","tags":[],"yw":"黃帝曰：餘受九針於夫子，而私覽於諸方，或有導引行氣，喬摩、灸、熨、刺、?、飲藥之一者，可獨守耶，將盡行之乎？岐伯曰：諸方者，衆人之方也，非一人之所盡行也。黃帝曰：此乃所謂守一勿失，萬物畢者也。今餘已聞陰陽之要，虛實之理，傾移之過，可治之屬，願聞病之變化，淫傳絕敗而不可治者，可得聞乎？岐伯曰：要乎哉問也，昭乎其如日醒，窘乎其如夜瞑，能被而服之，神與俱成，畢將服之，神自得之，生神之理，可着於竹帛，不可傳於子孫。","bh":"黄帝说：我从先生这里接受了九针之法，又私下阅览各种方书，其中有导引行气、乔摩、灸、熨、刺、砭、饮药等法，是可以专守一种，还是全都施行呢？岐伯说：这些方术是众人的方术，不是一人所能尽行。黄帝说：这就是所谓守一勿失而万物毕备吧。我已闻阴阳之要、虚实之理、倾移之过、可治之属，还想听听病的变化，以及邪气淫传、正气绝败而不可治的。岐伯说：问得切要啊。明白了如白日清醒，不明白如夜里昏昧。能领受而奉行，神便与你同成；始终奉行，自然得神。这生神之理，可著于竹帛，不可私传子孙。","notes":[],"pending":false},{"id":"ls42-2","tags":[],"yw":"黃帝曰：何謂日醒？岐伯曰：明於陰陽，如惑之解，如醉之醒。黃帝曰：何謂夜瞑？岐伯曰：瘖乎其無聲，漠乎其無形，折毛發理，正氣橫傾，淫邪泮衍，血脈傳溜，大氣入髒，腹痛下淫，可以致死，不可以致生。黃帝曰：大氣入髒，奈何？岐伯曰：病先發於心，一日而之肺，三日而之肝，五日而之脾，三日不已，死。冬夜半，夏日中。病先發於肺，三日而之肝，一日而之脾，五日而之胃，十日不已，死。冬日入，夏日出。病先發於肝，三日而之脾，五日而之胃，三日而之腎，三日不已，死。","bh":"黄帝问：什么叫日醒？岐伯说：明于阴阳，如困惑消解，如酒醉醒来。黄帝问：什么叫夜瞑？岐伯说：喑然无声，漠然无形，毛发折断、腠理开泄，正气横倾，淫邪涣散蔓延，由血脉传溜，大邪入脏，腹痛而邪下淫，可以致死，不可以致生。黄帝问：大邪入脏会怎样？岐伯说：病先发于心的，一日传肺，三日传肝，五日传脾，三日不愈而死，死于冬夜半、夏日中。病先发于肺的，三日传肝，一日传脾，五日传胃，十日不愈而死，死于冬日入、夏日出。病先发于肝的，三日传脾，五日传胃，三日传肾，三日不愈而死。","notes":[],"pending":false},{"id":"ls42-3","tags":[],"yw":"冬日入，夏蚤食。病先發於脾，一日而之胃，二日而之腎，三日而之膂膀胱，十日不已，死。冬人定，夏晏食。病先發於胃，五日而之腎，三日而之膂膀胱，五日而上之心，二日不已，死，冬夜半，夏日昳。病先發於腎，三日而之膂膀胱，三日而上之心，三日而之小腸，三日不已，死。冬大晨，夏晏晡。病先發於膀胱，五日而之腎，一日而之小腸，一日而之心，二日不已，死。冬雞鳴，夏下晡。諸病以次相傳，如是者，皆有死期，不可刺也；間一髒及二、三、四髒者，乃可刺也。","bh":"死在冬天的日落、夏天的早食之时。病先发于脾的，一日传胃，二日传肾，三日传脊膂膀胱，十日不愈而死，死在冬天人定、夏天晚食之时。病先发于胃的，五日传肾，三日传脊膂膀胱，五日上逆至心，二日不愈而死，死在冬天夜半、夏天的日昳。病先发于肾的，三日传脊膂膀胱，三日上逆至心，三日传小肠，三日不愈而死，死在冬天大晨、夏天的晏晡。病先发于膀胱的，五日传肾，一日传小肠，一日传心，二日不愈而死，死在冬天鸡鸣、夏天日下晡。诸病按次相传，如此者皆有死期，不可刺；间隔一脏及二、三、四脏相传的，才可刺。","notes":[],"pending":false}]},
{"id":"ls43","book":"灵枢","no":43,"title":"淫邪发梦","titleTw":"淫邪發夢","tags":["bingji","zangxiang","yinyang"],"brief":"论淫邪外袭内扰脏腑而致梦，列举十二气盛、十五气不足的梦象及其补泻治法。","pending":false,"sections":[{"id":"ls43-1","tags":[],"yw":"黃帝曰：願聞淫邪泮衍，奈何？岐伯曰：正邪從外襲內，而未有定舍，反淫於髒，不得定處，與營衛俱行，而與魂魄飛揚，使人臥不得安而喜夢；氣淫於腑，則有餘於外，不足於內；氣淫於髒，則有餘於內，不足於外。黃帝曰：有餘不足，有形乎？岐伯曰：陰氣盛，則夢涉大水而恐懼；陽氣盛，則夢大火而燔?；陰陽俱盛，則夢相殺。上盛則夢飛，下盛則夢墮；甚飢則夢取，甚飽則夢予；肝氣盛，則夢怒，肺氣盛，則夢恐懼、哭泣、飛揚；心氣盛，則夢善笑恐畏；脾氣盛，則夢歌、身體重不舉；腎氣盛，則夢腰脊兩解不屬。","bh":"黄帝说：我想听淫邪涣散蔓延，是怎样。岐伯说：正邪从外袭内，未有定舍，反淫于脏，不得定处，与营卫俱行，而使魂魄飞扬，使人卧不得安而多梦；气淫于腑，则有余于外、不足于内；气淫于脏，则有余于内、不足于外。黄帝问：有余不足，有形可见吗？岐伯说：阴气盛则梦涉大水而恐惧；阳气盛则梦大火而燔灼；阴阳俱盛则梦相杀。上盛则梦飞，下盛则梦堕；甚饥则梦取，甚饱则梦予；肝气盛则梦怒，肺气盛则梦恐惧、哭泣、飞扬；心气盛则梦善笑而恐畏；脾气盛则梦歌乐、身体重而不举；肾气盛则梦腰脊两解不属。","notes":[],"pending":false},{"id":"ls43-2","tags":[],"yw":"凡此十二盛者，至而瀉之，立已。厥氣客於心，則夢見丘山煙火；客於肺，則夢飛揚，見金鐵之奇物；客於肝，則夢山林樹木；客於脾，則夢見丘陵大澤，壞屋風雨；客於腎，則夢臨淵，沒居水中；客於膀胱，則夢遊行；客於胃，則夢飲食；客於大腸，則夢田野；客於小腸，則夢聚邑衝衢；客於膽，則夢斗訟自刳；客於陰器，則夢接內；客於項，則夢斬首；客於脛，則夢行走而不能前，及居深地窌苑中；客於股肱，則夢禮節拜起；客於胞?，則夢溲便。","bh":"厥气客于心，则梦见丘山烟火；客于肺，则梦飞扬，见金铁奇物；客于肝，则梦山林树木；客于脾，则梦见丘陵大泽、坏屋风雨；客于肾，则梦临深渊，沉没水中；客于膀胱，则梦游行；客于胃，则梦饮食；客于大肠，则梦田野；客于小肠，则梦聚邑冲衢；客于胆，则梦斗讼自刳；客于阴器，则梦交接；客于项，则梦斩首；客于小腿，则梦行走而不能前进，或居深地窌苑之中；客于股肱，则梦行礼跪拜；客于胞膻（膀胱），则梦排尿大便。","notes":[],"pending":false},{"id":"ls43-3","tags":[],"yw":"凡此十五不足者，至而補之立已也。","bh":"这十五种气不足之梦，用补法即愈。","notes":[],"pending":false}]},
{"id":"ls44","book":"灵枢","no":44,"title":"顺气一日分为四时","titleTw":"順氣一日分爲四時","tags":["ci","bingji","zangxiang"],"brief":"以一日分为四时解释旦慧昼安夕加夜甚之理，并论五脏五变配五输与刺有五变之法。","pending":false,"sections":[{"id":"ls44-1","tags":[],"yw":"黃帝曰：夫百病之所始生者，必起於燥溫寒暑風雨陰陽喜怒飲食居處，氣合而有形，得髒而有名，餘知其然也。夫百病者，多以旦慧晝安，夕加夜甚，何也？岐伯曰：四時之氣使然。黃帝曰：願聞四時之氣。岐伯曰：春生，夏長，秋收，冬藏，是氣之常也，人亦應之，以一日分爲四時，朝則爲春，日中爲夏，日入爲秋，夜半爲冬。朝則人氣始生，病氣衰，故旦慧；日中人氣長，長則勝邪，故安；夕則人氣始衰，邪氣始生，故加；夜半人氣入髒，邪氣獨居於身，故甚也。","bh":"黄帝说：百病之始生，必起于燥湿寒暑风雨、阴阳喜怒、饮食居处，邪气相合而成形，得脏而有名，这些我知道。而百病多是早晨清爽、白天安宁、傍晚加重、夜间更甚，为何？岐伯说：这是四时之气使然。黄帝说：愿闻四时之气。岐伯说：春生、夏长、秋收、冬藏，是气之常，人亦应之；一日分为四时，早晨为春，日中为夏，日落为秋，夜半为冬。早晨人气始生，病气衰，所以清爽；日中人气盛长，长则胜邪，所以安宁；傍晚人气始衰，邪气始生，所以加重；夜半人气入脏，邪气独居于身，所以更甚。","notes":[],"pending":false},{"id":"ls44-2","tags":[],"yw":"黃帝曰：有時有反者何也？岐伯曰：是不應四時之氣，髒獨主其病者，是必以髒氣之所不勝時者甚，以其所勝時者起也。黃帝曰：治之奈何？岐伯曰：順天之時，而病可與期。順者爲工，逆者爲麤。黃帝曰：善，餘聞刺有五變，以主五輸。願聞其數。岐伯曰：人有五髒，五髒有五變。五變有五輸，故五五二十五輸，以應五時。黃帝曰：願聞五變。岐伯曰：肝爲牡藏，其色青，其時春，其音角，其味酸，其日甲乙；心爲牡藏，其色赤，其時夏，其日丙丁，其音徵，其味苦；脾爲牝藏，其色黃，其時長夏，其日戊己，其音宮，其味甘；肺爲牝藏，其色白，其音商，其時徵，其日庚辛，其味辛；腎爲牝藏，其色黑，其時冬，其日壬癸，其音羽，其味鹹。","bh":"黄帝问：有的时候也有与此相反的，是什么缘故？岐伯说：这是不顺应四时之气，而由某一脏单独主导其病的情况；这必定是在受病脏气所不胜的时辰加重，在它所胜的时辰好转。黄帝问：怎样治疗？岐伯说：顺着天的时令而行，病就可以如期而愈。顺应天时的就是良工，违逆的就是粗工。黄帝说：好。我听说针刺有五变，以主五输，想听听它的条数。岐伯说：人有五脏，五脏有五变，五变有五输，所以五五二十五输，以应五时。黄帝说：想听听五变。岐伯说：肝为牡脏，其色青，其时春，其音角，其味酸，其日甲乙；心为牡脏，其色赤，其时夏，其日丙丁，其音征，其味苦；脾为牝脏，其色黄，其时长夏，其日戊己，其音宫，其味甘；肺为牝脏，其色白，其音商，其时秋（原文作征），其日庚辛，其味辛；肾为牝脏，其色黑，其时冬，其日壬癸，其音羽，其味咸。","notes":[],"pending":false},{"id":"ls44-3","tags":[],"yw":"是爲五變。黃帝曰：以主五輸奈何？藏主冬，冬刺井；色主春，春刺滎；時主夏，夏刺輸；音主長夏，長夏刺經；味主秋，秋刺合。是謂五變，以主五輸。黃帝曰：諸原安和，以致五輸。岐伯曰：原獨不應五時，以經合之，以應其數，故六六三十六輸。黃帝曰：何謂藏主冬，時主夏，音主長夏，味主秋，色主春。願聞其故。岐伯曰：病在藏者，取之井；病變於色者，取之滎；病時間時甚者，取之輸；病變於音者，取之經；經滿而血者，病在胃；及以飲食不節得病者，取之於合，故命曰味主合。","bh":"这就是五变。黄帝问：用它来主五输，是怎样的？脏主冬，冬天刺井穴；色主春，春天刺荥穴；时主夏，夏天刺输穴；音主长夏，长夏刺经穴；味主秋，秋天刺合穴。这就叫五变以主五输。黄帝问：那些原穴怎样配入，以凑成五输之数？岐伯说：唯独原穴不与五时相应，把它配合在经穴之中，以应其数，所以成为六六三十六输。黄帝问：什么叫脏主冬、时主夏、音主长夏、味主秋、色主春？想听听其中的缘故。岐伯说：病在脏的，取井穴；病变现于色的，取荥穴；病时发时重的，取输穴；病变现于音的，取经穴；经脉满盛而有血的，病在胃；以及因饮食不节而得病的，取之于合穴，所以命名叫味主合。","notes":[],"pending":false},{"id":"ls44-4","tags":[],"yw":"是謂五變也。","bh":"这就叫五变。","notes":[],"pending":false}]},
{"id":"ls45","book":"灵枢","no":45,"title":"外揣","titleTw":"外揣","tags":["ci","zhenfa","zangxiang"],"brief":"论九针之道浑束为一，以日月、水镜、鼓响为喻，明司外揣内、司内揣外为阴阳之极。","pending":false,"sections":[{"id":"ls45-1","tags":[],"yw":"餘聞九針九篇，餘親受其調，頗得其意。夫九針者，始於一而終於九，然未得其要道也。夫九針者，小之則無內，大之則無外，深不可爲下，高不可爲蓋，恍惚無竅，流溢無極，畲知其合於天道人事四時之變也，然餘願雜之毫毛，渾束爲一，可乎？岐伯曰：明乎哉問也，非獨針道焉，夫治國亦然。黃帝曰：餘願聞針道，非國事也。岐伯曰：夫治國者，夫惟道焉，非道，何可小大深淺，雜合而爲一乎。黃帝曰：願卒聞之。岐伯曰：日與月焉，水與鏡焉，鼓與響焉。","bh":"我听说九针有九篇，我亲受其道，颇得其意。九针始于一面终于九，然而未得其要道。九针之道，小之则无内，大之则无外，深不可为下，高不可为盖，恍惚无窍，流溢无极，我知道它合于天道人事四时之变，然而我愿把它杂于毫毛、浑束为一，可以吗？岐伯说：问得高明啊！不只是针道如此，治国也是这样。黄帝说：我愿听针道，不是国事。岐伯说：治国也唯有道，没有道，怎能把小大深浅杂合为一呢？黄帝说：愿详尽听听。岐伯说：就像日与月，水与镜，鼓与响。","notes":[],"pending":false},{"id":"ls45-2","tags":[],"yw":"夫日月之明，不失其影，水鏡之察，不失其形，鼓響之應，不後其聲，動搖則應和，盡得其情。黃帝曰：窘乎哉！昭昭之明不可蔽，其不可蔽，不失陰陽也。合而察之，切而驗之，見而得之，若清水明鏡之不失其形也。五音不彰，五色不明，五髒波蕩，若是則內外相襲，若鼓之應桴，響之應聲，影之似形。故遠者，司外揣內，近者，司內揣外，是謂陰陽之極，天地之蓋，請藏之靈蘭之室，弗敢使泄也。","bh":"日月之明不失其影，水镜之察不失其形，鼓响之应不后其声；有动摇则应和，尽得其情。黄帝说：深奥啊！昭昭之明不可蔽，因为它不失阴阳。合而察之，切而验之，见而得之，如清水明镜之不失其形。五音不彰，五色不明，五脏波荡，如此则内外相袭，如鼓之应桴、响之应声、影之似形。所以远者司外揣内，近者司内揣外，这就叫阴阳之极、天地之盖，请藏之灵兰之室，不敢使泄。","notes":[],"pending":false}]},
{"id":"ls46","book":"灵枢","no":46,"title":"五变","titleTw":"五變","tags":["bingji","zangxiang","yinyang"],"brief":"以匠人伐木为喻，论同时遇风而病各异因于形体坚脆不同，并列五种易病之人的诊候。","pending":false,"sections":[{"id":"ls46-1","tags":[],"yw":"黃帝問於少俞曰：餘聞百疾之始期也，必生於風雨寒暑，循毫毛而入腠理，或復還，或留止，或爲風腫汗出，或爲消癉，或爲寒熱，或爲留痹，或爲積聚。奇邪淫溢，不可勝數，願聞其故。夫同時得病，或病此，或病彼，意者天之爲人生風乎，何其異也？少俞曰：夫天之生風者，非以私百姓也，其行公平正直，犯者得之，避者得無殆，非求人而人自犯之。黃帝曰：一時遇風，同時得病，其病各異，願聞其故。少俞曰：善乎其問！請論以比匠人。匠人磨斧斤，礪刀削斷材木。","bh":"黄帝问少俞说：我听说百病之起始，必生于风雨寒暑，沿毫毛而入腠理，或去而复返，或留止不去，或成风肿汗出，或成消瘅，或成寒热，或成留痹，或成积聚。奇邪淫溢不可胜数，愿闻其故。同时得病，或病此或病彼，难道是上天为人别生一风吗？为何如此不同？少俞说：上天生风，不是偏私百姓，它运行公平正直，触犯者得病，避者得无患，不是风来求人，是人自去触犯。黄帝说：一时遇风，同时得病，而病各异，愿闻其故。少俞说：问得好啊！请让我以匠人为比。匠人磨斧斤、砺刀刃，用来砍断材木。","notes":[],"pending":false},{"id":"ls46-2","tags":[],"yw":"木之陰陽，尚有堅脆，堅者不入，脆者皮弛，至其交節，而缺斤斧焉。夫一木之中，堅脆不同，堅者則剛，脆者易傷，況其材木之不同，皮之厚薄，汁之多少，而各異耶。夫木之蚤花先生葉者，遇春霜烈風，則花落而葉萎；久曝大旱，則脆木薄皮者，枝條汁少而葉萎；久陰淫雨，則薄皮多汁者，皮漉而淺；卒風暴起，則剛脆之木，根搖而葉落。凡此五者，各有所傷，況於人乎！黃帝曰：以人應木，奈何？少俞答曰：木之所傷也，皆傷其枝。枝之剛脆而堅，未成傷也。","bh":"木材的阴阳向背尚且有坚脆之分，坚者刀斧砍不入，脆者外皮弛散，到了交节之处还会缺损斤斧。一木之中坚脆已不同，坚者刚，脆者易伤，何况材木不同、皮之厚薄、汁之多少又各异呢。树木早开花先生叶的，遇春霜烈风，则花落而叶萎；久曝大旱，那脆木薄皮的枝条汁少而叶萎；久阴淫雨，那薄皮多汁的皮溃而根浅；猝风暴起，那刚脆之木根摇而叶落。这五种各有损伤，何况人呢！黄帝问：以人应木，怎样？少俞回答说：树木受伤，都伤在它的枝条；枝条刚脆而坚实的，未必受伤。","notes":[],"pending":false},{"id":"ls46-3","tags":[],"yw":"人之有常病也，亦因其骨節皮膚腠理之不堅固者，邪之所舍也，故常爲病也。黃帝曰：人之善病風厥漉汗者，何以候之？少俞答曰：內不堅，腠理疏，則善病風。黃帝曰：何以候肉之不堅也？少俞答曰：膕肉不堅，而無分理。理者麤理，麤理而皮不致者，腠理疏。此言其渾然者。黃帝曰：人之善病消癉者，何以候之？少俞答曰：五髒皆柔弱者，善病消癉。黃帝曰：何以知五髒之柔弱也？少俞答曰：夫柔弱者，必有剛強，剛強多怒，柔者易傷也。黃帝曰：何以候柔弱之與剛強？少俞答曰：此人薄皮膚，而目堅固以深者，長衝直腸，其心剛，剛則多怒，怒則氣上逆，胸中蓄積，血氣逆留，髖皮充肌，血脈不行，轉而爲熱，熱則消肌膚，故爲消癉。","bh":"人有常常患某病的，也是因为他的骨节、皮肤、腠理不坚固，成为邪气留止之处，所以常常发病。黄帝问：人容易患风厥而多汗的，怎样诊察？少俞回答说：内里不坚实，腠理疏松，就容易患风病。黄帝问：怎样诊察肌肉的不坚实？少俞回答说：腘肉不坚实，而且没有分理；所谓理是粗疏的纹理，纹理粗疏而皮肤不密致的，腠理就疏松。这是就它浑沦的整体而言。黄帝问：人容易患消瘅的，怎样诊察？少俞回答说：五脏都柔弱的，容易患消瘅。黄帝问：怎样知道五脏柔弱？少俞回答说：柔弱的人，必有刚强的一面，刚强多怒，柔弱的一面就容易受伤。黄帝问：怎样诊察柔弱与刚强？少俞回答说：这种人皮肤薄，而目光有力且深沉，眉目长冲直扬，他的心刚，心刚就多怒，怒则气上逆，胸中蓄积，血气逆行留滞，髋部皮肤肌肉胀满，血脉不得运行，转而生热，热就消灼肌肉皮肤，所以成为消瘅。","notes":[],"pending":false},{"id":"ls46-4","tags":[],"yw":"此言其人暴剛而肌肉弱者也。黃帝曰：人之善病寒熱者，何以候之？少俞答曰：小骨弱肉者，善病寒熱。黃帝曰：何以候骨之小大，肉之堅脆，色之不一也？少俞答曰：顴骨者，骨之本也。顴大則骨大，顴小則骨小。皮膚薄而其肉無(月囷)，其臂懦懦然，其地色殆然，不與其天同色，污然獨異，此其候也。然後臂薄者，其髓不滿，故善病寒熱也。黃帝曰：何以候人之善病痹者？少俞答曰：麤理而肉不堅者，善病痹。黃帝曰：痹之高下有處乎？少俞答曰：欲知其高下者，各視其部。","bh":"这是说那种性情刚暴而肌肉柔弱的人。黄帝问：人容易患寒热的，怎样诊察？少俞回答说：骨骼小而肌肉弱的，容易患寒热。黄帝问：怎样诊察骨的大小、肉的坚脆、色的不一？少俞回答说：颧骨是骨的根本。颧大就骨大，颧小就骨小。皮肤薄而他的肌肉不丰起，手臂软弱无力，地阁之色晦暗，与天庭不同色，污浊而独异，这就是它的征候。此外臂部薄的，他的骨髓不满，所以容易患寒热。黄帝问：怎样诊察人容易患痹？少俞回答说：纹理粗疏而肉不坚实的，容易患痹。黄帝问：痹的部位高下，有一定的处所吗？少俞回答说：要知道它的高下，各自观察它所发的部位。","notes":[],"pending":false},{"id":"ls46-5","tags":[],"yw":"黃帝曰：人之善病腸中積聚者，何以候之？少俞答曰：皮膚薄而不澤，肉不堅而淖澤。如此，則腸胃惡，惡則邪氣留止，積聚乃傷脾胃之間，寒溫不次，邪氣稍至。蓄積留止，大聚乃起。黃帝曰：餘聞病形，已知之矣！願聞其時。少俞答曰：先立其年，以知其時。時高則起，時下則殆，雖不陷下，當年有衝道，其病必起，是謂因形而生病，五變之紀也。","bh":"黄帝问：人易患肠中积聚的，怎样诊察？少俞回答说：皮肤薄而不润泽，肉不坚实而多津濡软。如此则肠胃弱，弱则邪气留止，积聚乃伤于脾胃之间，寒温不依次第，邪气渐至，蓄积留止，大的积聚就形成了。黄帝说：病形我已知道了！还愿闻其发病之时。少俞回答说：先立当年岁气，以知其时。时旺则病起，时衰则危殆，即使脉不陷下，当年有冲犯之路，病也必发，这就叫因形而生病，是五变的纲纪。","notes":[],"pending":false}]},
{"id":"ls47","book":"灵枢","no":47,"title":"本藏","titleTw":"本藏","tags":["jingluo","zhenfa","bingji"],"brief":"论五脏六腑小大高下坚脆端正偏倾二十五变及其病候，并从皮肉筋骨爪耳等外应测知内脏。","pending":false,"sections":[{"id":"ls47-1","tags":[],"yw":"黃帝問於岐伯曰：人之血氣精神者，所以奉生而周於性命者也；經脈者，所以行血氣而營陰陽、濡筋骨，利關節者也；衛氣者，所以溫分肉，充皮膚，肥腠理，司開闔者也；志意者，所以御精神，收魂魄，適寒溫，和喜怒者也。是故血和則經脈流行，營復陰陽，筋骨勁強，關節清利矣；衛氣和則分肉解利，皮膚調柔，腠理致密矣；志意和則精神專直，魂魄不散，悔怒不起，五髒不受邪矣；寒溫和則六腑化谷，風痹不作，經脈通利，肢節得安矣，此人之常平也。","bh":"黄帝问岐伯说：人的血气精神，是用来奉养生命而周流于性命的；经脉，是用来运行血气而营运阴阳、濡润筋骨、滑利关节的；卫气，是用来温养分肉、充实皮肤、肥腠理、主管开阖的；志意，是用来统御精神、收摄魂魄、适应寒温、调和喜怒的。所以血和调则经脉流行，营气往复于阴阳，筋骨劲强，关节清便利落；卫气和调则分肉舒解滑利，皮肤调和柔润，腠理致密；志意和调则精神专一正直，魂魄不散，悔恨恼怒不起，五脏不受邪气所侵；寒温和调则六腑消化谷物，风痹不作，经脉通利，肢节得以安和，这就是人的正常状态。","notes":[],"pending":false},{"id":"ls47-2","tags":[],"yw":"五髒者，所以藏精神血氣魂魄者也；六腑者，所以化水谷而行津液者也。此人之所以具受於天也，無愚智賢不肖，無以相倚也。然有其獨盡天壽，而無邪僻之病，百年不衰，雖犯風雨卒寒大暑，猶有弗能害也；有其不離屏蔽室內，無怵惕之恐，然猶不免於病，何也？願聞其故。岐伯對曰：窘乎哉問也。五髒者，所以參天地，副陰陽，而運四時，化五節者也；五髒者，固有小大、高下、堅脆、端正、偏傾者，六腑亦有小大、長短、厚薄、結直、緩急。凡此二十五者，各不同，或善或惡，或吉或兇，請言其方。","bh":"五脏，是藏精神血气魂魄的；六腑，是消化水谷而运行津液的。这是人所禀受于天的，无论愚笨、聪明、贤能与不肖，都没有什么不同。然而有的人能独自享尽天寿，没有邪僻之病，到百岁也不衰退，即使冒犯风雨、卒然严寒、酷暑，仍然不能伤害他；有的人不离开屏蔽的室内，没有畏惧惊怕的情志，却仍然不免生病，这是什么缘故？想听听其中的道理。岐伯回答说：问得深奥啊。五脏，是与天地相参、与阴阳相副，而运转四时、化应五节的；五脏本来就有小大、高下、坚脆、端正、偏倾的不同，六腑也有小大、长短、厚薄、结直、缓急的差别。这些二十五种变化各不相同，或善或恶，或吉或凶，请让我说说它的大要。","notes":[],"pending":false},{"id":"ls47-3","tags":[],"yw":"心小則安，邪弗能傷，易傷以憂；心大則憂，不能傷，易傷於邪。心高則滿於肺中，悗而善忘，難開以言；心下，則藏外，易傷於寒，易恐以言。心堅，則藏安守固；心脆則善病消癉熱中。心端正，則和利難傷；心偏傾則操持不一，無守司也。肺小，則少飲，不病喘喝；肺大則多飲，善病胸痹、喉痹、逆氣。肺高，則上氣，肩息咳；肺下則居賁迫肺，善脅下痛。肺堅則不病，咳上氣；肺脆，則苦病消痹易傷。肺端正，則和利難傷；肺偏傾，則胸偏痛也。","bh":"心小则安，邪弗能伤，易伤以忧；心大则不易为忧所伤，易伤于邪。心高则满于肺中，闷而善忘，难开以言；心下则脏气外露，易伤于寒，易恐以言。心坚则脏安守固；心脆则善病消瘅热中。心端正则和利难伤；心偏倾则操持不一，无守司。肺小则少饮，不病喘喝；肺大则多饮，善病胸痹、喉痹、逆气。肺高则上气、肩息而咳；肺下则居贲迫肺，善胁下痛。肺坚则不病咳上气；肺脆则苦病消痹易伤。肺端正则和利难伤；肺偏倾则胸偏痛。","notes":[],"pending":false},{"id":"ls47-4","tags":[],"yw":"肺小則髒安，無脅下之病；肝大則逼胃迫咽，迫咽則苦膈中，且脅下痛。肝高，則上支賁切，脅挽爲息賁；肝下則逼胃脅下空，脅下空則易受邪。肝堅則藏安難傷；肝脆則善病消痹，易傷。肝端正，則和利難傷；肝偏傾，則脅下痛也。脾小，則髒安，難傷於邪也；脾大，則苦湊(月少)而痛，不能疾行。脾高，則(月少)引季脅而痛；脾下則下歸於大腸，下加於大腸，則髒苦受邪。脾堅，則髒安難傷；脾脆，則善病消痹易傷。脾端正，則和利難傷；脾偏傾，則善滿善脹也。","bh":"肝小则脏安，没有胁下之病；肝大则逼胃迫咽，迫咽则苦于膈中，而且胁下痛。肝高则上支贲切，胁挽为息贲；肝下则逼胃而胁下空，胁下空则易受邪。肝坚则脏安难伤；肝脆则善病消痹易伤。肝端正则和利难伤；肝偏倾则胁下痛。脾小则脏安，难伤于邪；脾大则苦于䏚（胁下软肉）凑聚而痛，不能快行。脾高则䏚引季胁而痛；脾下则下加于大肠，脏苦受邪。脾坚则脏安难伤；脾脆则善病消痹易伤。脾端正则和利难伤；脾偏倾则善满善胀。","notes":[],"pending":false},{"id":"ls47-5","tags":[],"yw":"腎小，則髒安難傷；腎大，則善病腰痛，不可以俛仰，易傷以邪。腎高，則苦背膂痛，不可以俛仰；腎下則腰尻痛，不可以俛仰，爲狐疝。腎堅，則不病腰背痛；腎脆，則善病消癉，易傷。腎端正，則和利難傷；腎偏傾，則苦腰尻痛也。凡此二十五變者，人之所苦常病。黃帝曰：何以知其然也？岐伯曰：赤色小理者，心小；麤理者，心大。無(骨曷)(骨虧)者，心高；(骨曷)(骨虧)小、短、舉者，心下。(骨曷)(骨虧)長者，心下堅；(骨曷)(骨虧)弱小以薄者，心脆。","bh":"肾小，则脏气安定难以受伤；肾大，则容易患腰痛，不能俯仰，容易被邪气所伤。肾高，则苦于背部脊膂疼痛，不能俯仰；肾下则腰骶疼痛，不能俯仰，发为狐疝。肾坚实，则不患腰背痛；肾脆弱，则容易患消瘅，容易受伤。肾端正，则和利难以受伤；肾偏倾，则苦于腰骶疼痛。以上这二十五种变化，就是人所苦的常见疾病。黄帝问：怎样知道这些呢？岐伯说：赤色而纹理细小的，心小；纹理粗疏的，心大。胸骨剑突（即鸠尾骨）不显的，心高；剑突小、短而上举的，心低。剑突长的，心坚实；剑突弱小而且薄的，心脆弱。","notes":[],"pending":false},{"id":"ls47-6","tags":[],"yw":"(骨曷)(骨虧)直下不舉者，心端正；(骨曷)(骨虧)倚一方者，心偏傾也。白色小理者，肺小；麤理者，肺大。巨肩反膺陷喉者，肺高；合腋張脅者，肺下。好肩背厚者，肺堅；肩背薄者，肺脆。背膺厚者，肺端正；脅偏疏者，肺偏傾也。青色小理者，肝小；麤理者，肝大。廣胸反骹者，肝高；合脅兔骹者，肝下。胸脅好者，肝堅；脅骨弱者，肝脆。膺腹好相得者，肝端正；脅骨偏舉者，肝偏傾也。黃色小理者，脾小；麤理者，脾大。揭脣者，脾高；脣下縱者，脾下。","bh":"剑突直下而不上举的，心端正；剑突偏倚一方的，心偏倾。白色而纹理细小的，肺小；纹理粗疏的，肺大。肩部阔大、胸膺外突而咽喉内陷的，肺高；两腋收合而胁部外张的，肺低。肩背部厚实的，肺坚实；肩背薄的，肺脆弱。背膺厚实的，肺端正；胁部偏斜疏松的，肺偏倾。青色而纹理细小的，肝小；纹理粗疏的，肝大。胸廓宽广而肋骨外突的，肝高；两胁收合而肋骨低伏的，肝低。胸胁发育良好的，肝坚实；胁骨软弱的，肝脆弱。胸膺与腹部相称协调的，肝端正；胁骨偏斜上举的，肝偏倾。黄色而纹理细小的，脾小；纹理粗疏的，脾大。口唇上翘的，脾高；口唇弛纵下垂的，脾低。","notes":[],"pending":false},{"id":"ls47-7","tags":[],"yw":"脣堅者，脾堅；脣大而不堅者，脾脆。脣上下好者，脾端正；脣偏舉者，脾偏傾也。黑色小理者，腎小；麤理者，腎大。高耳者，腎高；耳後陷者，腎下。耳堅者，腎堅；耳薄而不堅者，腎脆。耳好前居牙車者，腎端正；耳偏高者，腎偏傾也。凡此諸變者，持則安，減則病也。帝曰：善。然非餘之所問也，願聞人之有不可病者，至盡天壽，雖有深擾大恐，怵惕之志，猶不能減也，甚寒大熱，不能傷也；其有不離屏蔽室內，又無怵惕之恐，然不免於病者，何也？願聞其故。","bh":"唇坚的，脾坚；唇大而不坚的，脾脆。唇上下端正美好的，脾端正；唇偏举的，脾偏倾。黑色而纹理细小的，肾小；纹理粗疏的，肾大。耳高耸的，肾高；耳后陷的，肾低。耳坚硬的，肾坚；耳薄而不坚的，肾脆。耳端正完好、前居牙车的，肾端正；耳偏高的，肾偏倾。凡此诸变，能保持的就安，衰减的就病。帝说：善。然而这不是我所问的：有的人不会生病，能尽享天寿，虽有深忧大恐、怵惕之志，仍不能使他衰减，甚寒大热也不能伤他；有的人不离屏蔽室内，又无怵惕之恐，却仍不免于病，这是何故？愿闻其故。","notes":[],"pending":false},{"id":"ls47-8","tags":[],"yw":"岐伯曰：五髒六腑，邪之舍也，請言其故。五髒皆小者，少病，苦憔心，大愁擾；五髒皆大者，緩於事，難使以擾。五髒皆高者，好高舉措；五髒皆下者，好出人下。五髒皆堅者，無病；五髒皆脆者，不離於病。五髒皆端正者，和利得人心；五髒皆偏傾者，邪心而善盜，不可以爲人平，反復言語也。黃帝曰：願聞六腑之應。岐伯答曰：肺合大腸，大腸者，皮其應；心合小腸，小腸者，脈其應；肝合膽，膽者，筋其應；脾合胃，胃者，肉其應；腎合三焦膀胱，三焦膀胱者，腠理毫毛其應。","bh":"岐伯说：五脏六腑，是邪气留止的处所，请让我说其中的缘故。五脏都小的，少病，但苦于劳心焦虑、多愁困扰；五脏都大的，处事从容迟缓，难以使他们忧急操劳。五脏都高的，好高张其举止；五脏都低的，甘居人下。五脏都坚实的，不生病；五脏都脆弱的，离不开疾病。五脏都端正的，和顺畅利而能得人心；五脏都偏倾的，心存邪念而好偷盗，不能做平正的人，说话反复无常。黄帝说：我想听听六腑的相应。岐伯回答说：肺合大肠，大肠的应验在皮；心合小肠，小肠的应验在脉；肝合胆，胆的应验在筋；脾合胃，胃的应验在肉；肾合三焦膀胱，三焦膀胱的应验在腠理与毫毛。","notes":[],"pending":false},{"id":"ls47-9","tags":[],"yw":"黃帝曰：應之奈何？岐伯曰：肺應皮。皮厚者，大腸厚，皮薄者，大腸薄；皮緩，腹裏大者，大腸大而長；皮急者，大腸急而短；皮滑者，大腸直；皮肉不相離者，大腸結。心應脈，皮厚者，脈厚，脈厚者，小腸厚；皮薄者，脈薄，脈薄者，小腸薄；皮緩者，脈緩，脈緩者，小腸大而長；皮薄而脈衝小者，小腸小而短。諸陽經脈皆多紆屈者，小腸結。脾應肉，肉(月囷)堅大者，胃厚；肉(月囷)幺者，胃薄。肉(月囷)小而幺者，胃不堅；肉(月囷)不稱身者，胃下，胃下者，下管約不利。","bh":"黄帝问：这相应是怎样的？岐伯说：肺应于皮。皮厚的，大肠厚；皮薄的，大肠薄；皮弛缓而腹里大的，大肠大而长；皮紧急的，大肠紧束而短；皮滑润的，大肠直；皮肉不相分离的，大肠屈结。心应于脉，皮厚的，脉厚，脉厚的，小肠厚；皮薄的，脉薄，脉薄的，小肠薄；皮弛缓的，脉弛缓，脉弛缓的，小肠大而长；皮薄而脉细小的，小肠小而短。各阳经之脉多纡曲屈折的，小肠屈结。脾应于肉，肌肉隆起块坚大而粗的，胃厚；肌肉细小的，胃薄。肌肉隆起小而薄弱的，胃不坚实；肌肉隆起与身体不相称的，胃低，胃低的，下脘约束不利。","notes":[],"pending":false},{"id":"ls47-10","tags":[],"yw":"肉(月囷)不堅者，胃緩；肉(月囷)無小裏累者，胃急。肉(月囷)多少裏累者，胃結，胃結者，上管約不利也。肝應爪，爪厚色黃者，膽厚；爪薄色紅者，膽薄；爪堅色青者，膽急；爪濡色赤者，膽緩；爪直色白無約者，膽直；爪惡色黑多紋者，膽結也。腎應骨，密理厚皮者，三焦膀胱厚；麤理薄皮者，三焦膀胱薄。疏腠理者，三焦膀胱緩；皮急而無毫毛者，三焦膀胱急。毫毛美而麤者，三焦膀胱直，稀毫毛者，三焦膀胱結也。黃帝曰：厚薄美惡，皆有形，願聞其所病。","bh":"肌肉隆起不坚实的，胃弛缓；肌肉隆起没有小块累积的，胃紧急。肌肉隆起多有块垒累积的，胃屈结，胃屈结的，上脘约束不利。肝应于爪，爪甲厚而色黄的，胆厚；爪甲薄而色红的，胆薄；爪甲坚硬而色青的，胆紧急；爪甲柔润而色赤的，胆弛缓；爪甲平直而色白没有纹约的，胆直；爪甲枯恶色黑多纹的，胆屈结。肾应于骨，纹理致密而皮厚的，三焦膀胱厚；纹理粗疏而皮薄的，三焦膀胱薄。腠理疏松的，三焦膀胱弛缓；皮紧急而没有毫毛的，三焦膀胱紧急。毫毛美好而粗的，三焦膀胱直；毫毛稀疏的，三焦膀胱屈结。黄帝说：厚薄美恶，都有外形可征，我想听听它们所患的病。","notes":[],"pending":false},{"id":"ls47-11","tags":[],"yw":"岐伯答曰：視其外應，以知其內藏，則知所病矣。","bh":"岐伯答：视其外应，以知内藏，便知所病。","notes":[],"pending":false}]},
{"id":"ls48","book":"灵枢","no":48,"title":"禁服","titleTw":"禁服","tags":["ci","jingluo","zhenfa"],"brief":"记黄帝与雷公割臂歃血授受针道，论以寸口人迎脉候定十二经病位及补泻灸刺之大法。","pending":false,"sections":[{"id":"ls48-1","tags":[],"yw":"雷公問於黃帝曰：細子得受，通於九針六十篇，旦暮勤服之，近者編絕，久者簡垢，然尚諷誦弗置，未盡解於意矣。「外揣」言渾束爲一，未知所謂也。夫大則無外，小則無內，大小無極，高下無度，束之奈何？士之才力，或有厚薄，智慮褊淺，不能博大深奧，自強於學若細子。細子恐其散於後世，絕於子孫，敢問約之奈何？黃帝曰：善乎哉問也。此先師之所禁，坐私傳之也，割臂歃血之盟也，子若欲得之，何不齋乎。雷公再拜而起曰：請聞命於是也，乃齋宿三日而請曰：敢問今日正陽，細子願以受盟。","bh":"雷公问黄帝说：小子得受九针六十篇，旦暮勤习，近者编绝，久者简垢，仍讽诵不辍，未能尽解其意。《外揣》说浑束为一，未知所谓。大则无外，小则无内，大小无极，高下无度，怎样约束它？士之才力有厚薄，智虑褊浅，不能博大深奥，像小子这样勉强自学。小子恐它散于后世、绝于子孙，请问怎样简约？黄帝说：问得好啊。此先师所禁，只能私传，须割臂歃血为盟，你若想得之，何不先斋戒？雷公再拜而起说：请听命。于是斋宿三日而请曰：今日正阳，小子愿受盟。","notes":[],"pending":false},{"id":"ls48-2","tags":[],"yw":"黃帝乃與俱入齋室，割臂歃血，黃帝親祝曰：今日正陽，歃血傳方，有敢背此言者，反受其殃。雷公再拜曰：細子受之。黃帝乃左握其手，右授之書曰：慎之慎之，吾爲子言之，凡刺之理，經脈爲始，營其所行，知其度量，內刺五髒，外刺六腑，審察衛氣，爲百病母，調其虛實，虛實乃止，瀉其血絡，血盡不殆矣。雷公曰：此皆細子之所以通，未知其所約也。黃帝曰：夫約方者，猶約囊也，囊滿而弗約，則輸泄，方成弗約，則神與弗俱。雷公曰：願爲下材者，勿滿而約之。","bh":"黄帝就与他同入斋室，割臂歃血，黄帝亲祝说：今日正阳，歃血传方，有敢违背此言者，反受其殃。雷公再拜说：小子受之。黄帝乃左握其手，右授之书说：慎之慎之，我给你说：凡刺之理，经脉为始，营其所行，知其度量，内刺五脏，外刺六腑，审察卫气，为百病之母，调其虚实，虚实乃止，泻其血络，血尽不殆。雷公说：这都是小子所已通，还未知其简约之法。黄帝说：约方如同约囊，囊满不约则输泄；方成不约，则神与弗俱。雷公说：我愿做下材者，不必满而约之。","notes":[],"pending":false},{"id":"ls48-3","tags":[],"yw":"黃帝曰：未滿而知約之以爲工，不可以爲天下師。雷公曰：願聞爲工。黃帝曰：寸口主中，人迎主外，兩者相應，俱往俱來，若引繩大小齊等。春夏人迎微大，秋冬寸口微大，如是者，名曰平人。人迎大一倍於寸口，病在足少陽，一倍而躁，在手少陽。人迎二倍，病在足太陽，二倍而躁，病在手太陽。人迎三倍，病在足陽明，三倍而躁，病在手陽明。盛則爲熱，虛則爲寒，緊則爲痛痹，代則乍甚乍間。盛則瀉之，虛則補之，緊痛則取之分肉，代則取血絡，且飲藥，陷下則灸之，不盛不虛，以經取之，名曰經刺。","bh":"黄帝说：未满就知道约束它，可以成为良工，不可以做天下的宗师。雷公说：我想听听如何成为良工。黄帝说：寸口主内，人迎主外，两者相应，同往同来，如同拉绳一样大小齐等。春夏人迎略大，秋冬寸口略大，像这样的，名叫平人。人迎比寸口大一倍，病在足少阳；大一倍而且躁的，在手少阳。人迎大二倍，病在足太阳；大二倍而且躁的，病在手太阳。人迎大三倍，病在足阳明；大三倍而且躁的，病在手阳明。盛就是热，虚就是寒，紧就是痛痹，代就是时重时轻。盛就用泻法，虚就用补法，紧而痛的取之分肉，代的取血络，并且饮服药物，脉陷下的用灸法，不盛不虚的，取之于本经，名叫经刺。","notes":[],"pending":false},{"id":"ls48-4","tags":[],"yw":"人迎四倍者，且大且數，名曰溢陽，溢陽爲外格，死不治。必審按其本末，察其寒熱，以驗其髒腑之病。寸口大於人迎一倍，病在足厥陰，一倍而躁，在手心主。寸口二倍，病在足少陰，二倍而躁，在手少陰。寸口三倍，病在足太陰，三倍而躁，在手太陰。盛則脹滿，寒中，食不化，虛則熱中、出糜、少氣、溺色變，緊則痛痹，代則乍痛乍止。盛則瀉之，虛則補之，緊則先刺而後灸之，代則取血絡，而後調之，陷下則徒灸之，陷下者，脈血結於中，中有着血，血寒，故宜灸之，不盛不虛，以經取之。","bh":"人迎大四倍的，既大而且数，名叫溢阳，溢阳就是外格，死而不治。必须审按其本末，察验寒热，以验证脏腑的病。寸口比人迎大一倍，病在足厥阴；大一倍而且躁的，在手心主。寸口大二倍，病在足少阴；大二倍而且躁的，在手少阴。寸口大三倍，病在足太阴；大三倍而且躁的，在手太阴。盛则胀满、寒中、饮食不化，虚则热中、大便糜烂、少气、小便颜色改变，紧则痛痹，代则时痛时止。盛就用泻法，虚就用补法，紧就先刺而后灸它，代就取血络而后再调治，脉陷下的只是用灸法；陷下的，是脉中血气结聚，中有留着之血，血受寒，所以宜用灸法；不盛不虚的，取之于本经。","notes":[],"pending":false},{"id":"ls48-5","tags":[],"yw":"寸口四倍者，名曰內關，內關者，且大且數，死不治。必審察其本末之寒溫，以驗其髒腑之病。通其營輸，乃可傳於大數。大數曰：盛則徒瀉之，虛則徒補之，緊則灸刺，且飲藥，陷下則徒灸之，不盛不虛，以經取之。所謂經治者，飲藥，亦曰灸刺，脈急則引，脈大以弱，則欲安靜，用力無勞也。","bh":"寸口大四倍的，名叫内关，内关既大而且数，死而不治。必须审察它本末的寒温，以验证脏腑的病。通晓它的营气输注，才可以传授那大法。大法说：盛就只用泻法，虚就只用补法，紧就灸刺并饮服药物，脉陷下的就只用灸法，不盛不虚的，取之于本经。所谓经治的，包括饮药，也说包括灸刺；脉急的就用导引之法，脉大而弱的，就要求他安静，不要用力劳作。","notes":[],"pending":false}]},
{"id":"ls49","book":"灵枢","no":49,"title":"五色","titleTw":"五色","tags":["ci","zhenfa","bingji"],"brief":"论面部五色分区配属脏腑肢节，以色之浮沉、泽夭、散搏辨病的浅深、成败与死期。","pending":false,"sections":[{"id":"ls49-1","tags":[],"yw":"雷公問於黃帝曰：五色獨決於明堂乎？小子未知其所謂也。黃帝曰：明堂者，鼻也；闕者，眉間也；庭者，顏也；蕃者，頰側也；蔽者，耳門也。其間欲方大，去之十步，皆見於外，如是者壽，必中百歲。雷公曰：五言之辨，奈何？黃帝曰：明堂骨高以起，平以直，五髒次於中央，六腑挾其兩側，首面上於闕庭，王宮在於下極，五髒安於胸中，真色以致，病色不見，明堂潤澤以清，五官惡得無辨乎？雷公曰：其不辨者，可得聞乎？黃帝曰：五色之見也，各出其色部。","bh":"雷公问黄帝说：五色单独取决于明堂吗？小子不知道它说的是什么。黄帝说：明堂，就是鼻；阙，就是两眉之间；庭，就是额；蕃，就是两颊的外侧；蔽，就是耳门。这些部位之间要方正阔大，离它十步远，都能显见于外，像这样的必享长寿，一定能活到百岁。雷公说：五色的辨别，是怎样的？黄帝说：明堂骨高高隆起而平直，五脏依次列于中央，六腑挟持在它的两侧，首面显于阙庭，王宫在于下极，五脏安于胸中，正常的气色显现而病色不出现，明堂润泽而清明，五官怎能没有分辨呢？雷公说：那些不能分辨的，可以听听吗？黄帝说：五色的显现，各出现在它所主的色部。","notes":[],"pending":false},{"id":"ls49-2","tags":[],"yw":"部骨陷者，必不免於病矣。其色部乘襲者，雖病甚，不死矣。雷公曰：官五色奈何？黃帝曰：青黑爲痛，黃赤爲熱，白爲寒，是謂五官。雷公曰：病之益甚，與其方衰，如何？黃帝曰：外內皆在焉。切其脈口，滑小緊以沉者，病益甚，在中；人迎氣大緊以浮者，其病益甚，在外。其脈口浮滑者，病日進；人迎沉而滑者，病日損。其脈口滑以沉者，病日進，在內；其人迎脈滑盛以浮者，其病日進，在外。脈之浮沉及人迎與寸口氣小大等者，病難已；病之在藏，沉而大者，易已，小爲逆；病在府，浮而大者，其病易已。","bh":"色部有骨陷的，一定不免于病了。它色部是相生相乘袭的，虽然病很重，也不会死亡。雷公说：怎样主察五色？黄帝说：青黑为痛，黄赤为热，白为寒，这就叫五官。雷公说：病的加重，与它正当衰退之时，怎么看？黄帝说：外与内都在其中。切按它的寸口脉，滑小紧而且沉的，病加重，病在内；人迎气大紧而且浮的，病加重，病在外。寸口脉浮滑的，病日渐进展；人迎脉沉而滑的，病日渐减退。寸口脉滑而沉的，病日渐进展，在内；人迎脉滑盛而浮的，病日渐进展，在外。脉的浮沉以及人迎与寸口之气小大相等的，病难以痊愈；病在脏的，脉沉而大的，容易痊愈，脉小的为逆；病在腑的，脉浮而大的，它的病容易痊愈。","notes":[],"pending":false},{"id":"ls49-3","tags":[],"yw":"人迎盛堅者，傷於寒，氣口盛堅者，傷於食。雷公曰：以色言食之間甚，奈何？黃帝曰：其色麤以明，沉夭者爲甚，其色上行者，病益甚；其色下行，如雲徹散者，病方已。五色各有髒部，有外部有內部也。色從外部走內部者，其病從外走內；其色從內走外者，其病從內走外。病生於內者，先治其陰，後治其陽，反者益甚。其病生於陽者，先治其外，後治其內，反者益甚。其脈滑大，以代而長者，病從外來，目有所見，志有所惡，此陽氣之並也，可變而已。","bh":"人迎盛坚的，伤于寒；气口盛坚的，伤于食。雷公说：用色来说病之间甚，怎样？黄帝说：色粗显而明的病轻，沉滞晦夭的为重；色上行的，病加重；色下行如云彻散的，病才能愈。五色各有脏部，有外部有内部。色从外部走向内部的，病从外走内；色从内走外的，病从内走外。病生于内的，先治其阴，后治其阳，反了就加重；病生于阳的，先治其外，后治其内，反了就加重。脉滑大以代而长的，病从外来，目有所妄见，志有所恶，这是阳气之并，可变而已。","notes":[],"pending":false},{"id":"ls49-4","tags":[],"yw":"雷公曰：小子聞風者，百病之始也；厥逆者，寒溼之起也，別之奈何？黃帝曰：常候闕中，薄澤爲風，衝濁爲痹。在地爲厥。此其常也；各以其色言其病。雷公曰：人不病卒死，何以知之？黃帝曰：大氣入於髒腑者，不病而卒死矣。雷公曰：病小愈而卒死者，何以知之？黃帝曰：赤色出兩顴，大如拇指者，病雖小愈，必卒死。黑色出於庭，大如拇指，必不病而卒死。雷公再拜曰：善哉！其死有期乎？黃帝曰：察色以言其時。雷公曰：善乎！願卒聞之。","bh":"雷公说：小子听说风为百病之始，厥逆为寒湿之起，怎样区别？黄帝说：常候阙中，薄泽为风，冲浊为痹，在地为厥，这是常规，各以其色言其病。雷公说：人不病而猝死，怎样知道？黄帝说：大气入于脏腑的，不病而猝死。雷公说：病稍愈而猝死的，怎样知道？黄帝说：赤色出于两颧，大如拇指的，病虽小愈，必猝死；黑色出于庭，大如拇指的，必不病而猝死。雷公再拜说：善哉！它的死有定期吗？黄帝说：察色以言其时。雷公说：善！愿卒闻之。","notes":[],"pending":false},{"id":"ls49-5","tags":[],"yw":"黃帝曰：庭者，首面也；闕上者，咽喉也；闕中者，肺也；下極者，心也；直下者，肝也；肝左者，膽也；下者，脾也；方上者，胃也；中央者，大腸也；挾大腸者，腎也；當腎者，臍也；面王以上者，小腸也，面王以下者，膀胱子處也；顴者，肩也；顴後者，臂也；臂下者，手也；目內眥上者，膺乳也；挾繩而上者，背也；循牙車以下者，股也；中央者，膝也；膝以下者，脛也；當脛以下者，足也；巨分者，股裏也；巨屈者，膝臏也。此五髒六腑肢節之部也，各有部分。","bh":"黄帝说：庭，是头面；阙之上的，是咽喉；阙之中的，是肺；下极的，是心；直下的，是肝；肝的左边，是胆；下部的，是脾；方上的，是胃；中央的，是大肠；挟著大肠的，是肾；正当肾部的，是脐；面王以上的，是小肠；面王以下的，是膀胱与子处；颧，是肩；颧后的，是臂；臂下的，是手；目内眦之上的，是胸膺与乳房；挟著颊侧纹路上行的，是背；沿着牙床（下颌）以下的，是大腿；中央的，是膝；膝以下的，是小腿；正当小腿以下的，是足；巨分的，是大腿内侧；巨屈的，是膝盖骨。这是五脏六腑肢节的部位，各有它所分属的部分。","notes":[],"pending":false},{"id":"ls49-6","tags":[],"yw":"有部分，用陰和陽，用陽和陰，當明部分，萬舉萬當。能別左右，是謂大道；男女異位，故曰陰陽。審察澤夭，謂之良工。沉濁爲內，浮澤爲外。黃赤爲風，青黑爲痛，白爲寒，黃而膏潤爲膿，赤甚者爲血痛，甚爲攣，寒甚爲皮不仁。五色各見其部，察其浮沉，以知淺深；察其澤夭，以觀成敗；察其散搏，以知遠近；視色上下，以知病處；積神於心，以知往今。故相氣不微，不知是非，屬意勿去，乃知新故。色明不麤，沉天爲甚，不明不澤，其病不甚。","bh":"既有分部，就以阴和阳、以阳和阴，辨明部位，则万举万当。能别左右，是谓大道；男女部位不同，故曰阴阳。审察润泽与枯夭，谓之良工。沉浊主内，浮泽主外。黄赤为风，青黑为痛，白为寒，黄而膏润为脓，赤甚为血，痛甚为挛，寒甚为皮不仁。五色各见其部：察浮沉以知浅深，察泽夭以看成败，察散搏以知远近，视色上下以知病处，凝神于心以知往今。故候气不细，不能辨是非；专意不舍，乃知新故。色明而不粗显，沉滞晦夭的为重；不明不泽的，病不重。","notes":[],"pending":false},{"id":"ls49-7","tags":[],"yw":"其色散，駒駒然，未有聚；其病散而氣痛，聚未成也。腎乘心，心先病，腎爲應，色皆如是。男子色在於面王，爲小腹痛；下爲卵痛；其圜直爲莖痛，高爲本，下爲首，狐疝(疒貴)陰之屬也。女子在於面王，爲膀胱子處之病，散爲痛，搏爲聚，方員左右，各如其色形。其隨而下至胝，爲淫，有潤如膏狀，爲暴食不潔。左爲左，右爲右。其色有邪，聚散而不端，面色所指者也。色者，青黑赤白黃，皆端滿有別鄉。別鄉赤者，其色赤，大如榆莢，在面王爲不日。","bh":"色散漫如驹驹然，未有聚结，是病气散在而气郁作痛，聚尚未成。比如肾乘心，心先病而肾为应，色与病相应都是如此。男子的色在面王，主小腹痛；在下的为睾丸痛；那竖起处的为阴茎痛，高处的为本，低处的为首，属狐疝、𤻊阴之类。女子的色在面王，为膀胱子处之病，色散为痛，色结为聚，方圆左右，各如其色形。色随而下至尾骶的为淫浊，润如膏状的为暴食不洁所致。左主左，右主右。色有邪象、聚散不端正的，就是面色所指的病位。色有青黑赤白黄，都端正圆满而各有所别之乡。其中别乡为赤色，其色赤大如榆荚，出现在面王的，不出数日而死。","notes":[],"pending":false},{"id":"ls49-8","tags":[],"yw":"其色上銳，首空上向，下銳下向，在左右如法。以五色命髒，青爲肝，赤爲心，白爲肺，黃爲脾，黑爲腎。肝合筋，心合脈，肺合皮，脾合肉，腎合骨也。","bh":"色上部尖锐的，头空而上向；下部尖锐的，向下；在左右者依此类推。以五色配五脏：青为肝，赤为心，白为肺，黄为脾，黑为肾。肝合筋，心合脉，肺合皮，脾合肉，肾合骨。","notes":[],"pending":false}]},
{"id":"ls50","book":"灵枢","no":50,"title":"论勇","titleTw":"論勇","tags":["bingji","yinyang","zhize"],"brief":"论四时虚风伤人因病者形色而异，并辨忍痛与勇怯之分，述勇士怯士的脏腑禀赋与酒悖。","pending":false,"sections":[{"id":"ls50-1","tags":[],"yw":"黃帝問於少俞曰：有人於此，並行並立，其年之長少等也，衣之厚薄均也，卒然遇烈風暴雨，或病或不病，或皆病，或皆不病，其故何也？少俞曰：帝問何急？黃帝曰：願盡聞之。少俞曰：春青風夏陽風，秋涼風，冬寒風。凡此四時之風者，其所病各不同形。黃帝曰：四時之風，病人如何？少俞曰：黃色薄皮弱肉者，不勝春之虛風；白色薄皮弱肉者，不勝夏之虛風；青色薄皮弱肉，不勝秋之虛風；赤色薄皮弱肉，不勝冬之虛風也。黃帝曰：黑色不病乎？少俞曰：黑色而皮厚肉堅，固不傷於四時之風；其皮薄而肉不堅，色不一者，長夏至而有虛風者，病矣。","bh":"黄帝问少俞说：有这样一些人，并行而立，他们的年龄老少相等，衣服厚薄也相同，突然遇到烈风暴雨，有的病有的不病，有的全都病，有的全都不病，这是什么缘故？少俞说：帝想先问哪一项？黄帝说：我希望全都听听。少俞说：春是青风，夏是阳风，秋是凉风，冬是寒风。这四时之风，它所致的病各有不同的形证。黄帝问：四时之风，伤人是怎样的？少俞说：黄色薄皮弱肉的，不能耐受春天的虚风；白色薄皮弱肉的，不能耐受夏天的虚风；青色薄皮弱肉的，不能耐受秋天的虚风；赤色薄皮弱肉的，不能耐受冬天的虚风。黄帝问：黑色的人不病吗？少俞说：黑色而皮厚肉坚实的，固然不会被四时之风所伤；那种皮薄而肉不坚实、色不均一的黑色之人，到了长夏而有虚风，就会生病。","notes":[],"pending":false},{"id":"ls50-2","tags":[],"yw":"其皮厚而肌肉堅者，長夏至而有虛風，不病矣。其皮厚而肌肉堅者，必重感於寒，外內皆然，乃病。黃帝曰：善。黃帝曰：夫人之忍痛與不忍痛，非勇怯之分也。夫勇士之不忍痛者，見難則前，見痛則止；夫怯士之忍痛者，聞難則恐，遇痛不動。夫勇士之忍痛者，見難不恐，遇痛不動；夫怯士之不忍痛者，見難與痛，目轉面盻，恐不能言，失氣，驚，顏色變化，乍死乍生。餘見其然也，不知其何由，願聞其故。少俞曰：夫忍痛與不忍痛者，皮膚之薄厚，肌肉之堅脆，緩急之分也，非勇怯之謂也。","bh":"那些皮厚而肌肉坚实的，即便长夏有虚风，也不病；必定重感于寒，内外皆然，才会病。黄帝说：好。黄帝又说：人的忍痛与不忍痛，不是勇与怯的分别。勇士中不忍痛的，见难则前，见痛则止；怯士中忍痛的，闻难则恐，遇痛不动。勇士中忍痛的，见难不恐，遇痛不动；怯士中不忍痛的，见难与痛，目转面盻，恐不能言，失气惊乱，颜色变化，乍死乍生。我见过这种情形，不知由何而起，愿闻其故。少俞说：忍痛与不忍痛，在于皮肤的薄厚、肌肉的坚脆、缓急之分，不是勇怯之谓。","notes":[],"pending":false},{"id":"ls50-3","tags":[],"yw":"黃帝曰：願聞勇怯之所由然。少俞曰：勇士者，目深以固，長衝直揚，三焦理橫，其心端直，其肝大以堅，其膽滿以傍，怒則氣盛而胸張，肝舉而膽橫，眥裂而目揚，毛起而面蒼，此勇士之由然者也。黃帝曰：願聞怯士之所由然。少俞曰：怯士者，目大而不減，陰陽相失，其焦理縱，(骨曷)(骨虧)短而小，肝系緩，其膽不滿而縱，腸胃挺，脅下空，雖方大怒，氣不能滿其胸，肝肺雖舉，氣衰復下，故不能久怒，此怯士之所由然者也。黃帝曰：怯士之得酒，怒不避勇士者，何髒使然？少俞曰：酒者，水谷之精，熟谷之液也，其氣慓悍，其入於胃中，則胃脹，氣上逆，滿於胸中，肝浮膽橫，當是之時，固比於勇士，氣衰則悔。","bh":"黄帝说：愿闻勇怯之所以如此。少俞说：勇士目深而固，长冲直扬，三焦理横，心端直，肝大而坚，胆满以傍，怒则气盛而胸张，肝举而胆横，眦裂而目扬，毛起而面苍，这就是勇士之所以如此。黄帝说：愿闻怯士之所以如此。少俞说：怯士目大而不减，阴阳相失，三焦理纵，剑突短小，肝系缓，胆不满而纵，肠胃挺，胁下空，虽方大怒，气不能满其胸，肝肺虽举，气衰复下，所以不能久怒，这就是怯士之所以如此。黄帝问：怯士得酒，怒不避勇士，哪一脏使他这样？少俞说：酒是水谷之精、熟谷之液，其气慓悍，入于胃中则胃胀，气上逆，满于胸中，肝浮胆横，当此之时，固可比于勇士，气衰则悔。","notes":[],"pending":false},{"id":"ls50-4","tags":[],"yw":"與勇士同類，不知避之，名曰酒悖也。","bh":"与勇士同类，却不知道避忌，这就叫酒悖。","notes":[],"pending":false}]},
{"id":"ls51","book":"灵枢","no":51,"title":"背腧","titleTw":"背腧","tags":["ci","zangxiang","zhize"],"brief":"列五脏背腧的部位与按压验证之法，指出背腧宜灸不宜刺及其补泻用火的操作。","pending":false,"sections":[{"id":"ls51-1","tags":[],"yw":"黃帝問於岐伯曰：願聞五髒之腧，出於背者。岐伯曰：背中大腧，在杼骨之端，肺腧在三焦之間，心腧在五焦之間，膈腧在七焦之間，肝腧在九焦之間，脾腧在十一焦之間，腎腧在十四焦之間。皆挾脊相去三寸所，則欲得而驗之，按其處，應在中而痛解，乃其輸也。灸之則可刺之則不可。氣盛則瀉之，虛則補之。以火補者，毋吹其火，須自滅也；以火瀉之，疾吹其火，傳其艾，須其火滅也。","bh":"黄帝问岐伯说：愿闻五脏出于背部的腧穴。岐伯说：背中大腧在杼骨之端，肺腧在三焦之间，心腧在五焦之间，膈腧在七焦之间，肝腧在九焦之间，脾腧在十一焦之间，肾腧在十四焦之间，都挟脊相距三寸左右。要验取其处：按其处，应于中而痛解，就是它的腧穴。灸之则可，刺之则不可。气盛则泻之，虚则补之。以火补的，不要吹其火，须它自灭；以火泻的，疾吹其火，传其艾，须其火灭。","notes":[],"pending":false}]},
{"id":"ls52","book":"灵枢","no":52,"title":"卫气","titleTw":"衛氣","tags":["jingluo","zhenfa","bingji"],"brief":"论营气卫气的生成与十二经标本，列手足六经标本与胸腹头胫四气街的候治之道。","pending":false,"sections":[{"id":"ls52-1","tags":[],"yw":"黃帝曰：五髒者，所以藏精神魂魄者也；六腑者，所以受水谷而行化物者也。其氣內干五髒，而外絡肢節。其浮氣之不循經者，爲衛氣；其精氣之行於經者，爲營氣。陰陽相隨，外內相貫，如環之無端。亭亭淳淳乎，孰能竊之。然其分別陰陽，皆有標本虛實所離之處。能別陰陽十二經者，知病之所生；候虛實之所在者，能得病之高下；知六腑之氣街者，能知解結契紹於門戶；能知虛石之堅軟者，知補瀉之所在；能知六經標本者，可以無惑於天下。岐伯曰：博哉！聖帝之論。","bh":"黄帝说：五脏，是藏精神魂魄的；六腑，是接受水谷而运行化物之气的。它的气向内入于五脏，而向外络于肢节。那浮而不循经脉之行的气，叫做卫气；那精专而行于经中的气，叫做营气。阴阳相随，内外相贯，如同圆环没有端点。流转不息的样子，谁能穷尽它。然而分别阴阳，都有标本虚实所当分辨之处。能辨别阴阳十二经的，就知道病从哪里发生；能候察虚实所在的，就能得知病的部位高下；能知道六腑之气街的，就能知道解结契联于门户；能知道虚（文中作石）实的坚软的，就知道补泻的所在；能知道六经标本的，就可以在天下无所疑惑。岐伯说：博大啊！圣帝的议论。","notes":[],"pending":false},{"id":"ls52-2","tags":[],"yw":"臣請盡意悉言之。足太陽之本，在限以上五寸中，標在兩絡命門。命門者，目也。足少陽之本，在竅陰之間，標在窗籠之前。窗籠者，耳也。足少陰之本，在內踝下上三寸中，標在背輸與舌下兩脈也。足厥陰之本，在行間上五寸所，標在背腧也。足陽明之本，在厲兌，標在人迎，頰挾頏顙也。足太陰之本，在中封前上四寸之中，標在背腧與舌本也。手太陽之本，在外踝之後，標在命門之上一寸也。手少陽之本，在小指次指之間上二寸，標在耳後上角下外眥也。","bh":"臣请让我尽意把它们全部说出来。足太阳之本，在足跟以上五寸之中，标在两络命门。命门，就是目。足少阳之本，在窍阴之间，标在窗笼之前。窗笼，就是耳。足少阴之本，在内踝下上行三寸之中，标在背腧与舌下两脉。足厥阴之本，在行间上五寸左右，标在背腧。足阳明之本，在厉兑，标在人迎，即挟于颃颡之旁。足太阴之本，在中封前上方四寸之中，标在背腧与舌根。手太阳之本，在腕后外侧（文中称外踝）之后，标在命门之上一寸。手少阳之本，在小指与次指之间上二寸，标在耳后上角、下至外眼角。","notes":[],"pending":false},{"id":"ls52-3","tags":[],"yw":"手陽明之本，在肘骨中，上至別陽，標在顏下合鉗上也。手太陰之本，在寸口之中，標在腋內動也。手少陰之本，在銳骨之端，標在背腧也。手心主之本，在掌後兩筋之間二寸中，標在腋下下三寸也。凡候此者，下虛則厥，下盛則熱；上虛則眩，上盛則熱痛。故石者，絕而止之，虛者，引而起之。請言氣街，胸氣有街，腹氣有街，頭氣有街，脛氣有街。故氣在頭者，止之於腦；氣在胸者，止之膺與背腧；氣在腹者，止之背腧，與衝脈於臍左右之動脈者；氣在脛者，止之於氣街，與承山踝上以下。","bh":"手阳明之本，在肘骨之中，上至别阳，标在颜下，合于钳上。手太阴之本，在寸口之中，标在腋内动脉。手少阴之本，在锐骨之端，标在背腧。手心主之本，在掌后两筋之间二寸之中，标在腋下三寸。凡是候察这些的，下部虚的就厥逆，下部盛的就发热；上部虚的就眩晕，上部盛的就热而痛。所以实的，就断绝其源而制止它；虚的，就引导其气而兴起它。请让我说说气街：胸气有它的街，腹气有它的街，头气有它的街，小腿之气有它的街。所以气在头的，聚止于脑；气在胸的，聚止于膺部与背腧；气在腹的，聚止于背腧，以及冲脉在脐左右的动脉处；气在小腿的，聚止于气街，以及承山到踝上以下之处。","notes":[],"pending":false},{"id":"ls52-4","tags":[],"yw":"取此者，用毫針，必先按而在久應於手，乃刺而予之。所治者，頭痛眩，腹痛中滿暴脹，及有新。痛可移者，易已也；積不痛，難已也。","bh":"取这些穴的用毫针，必先按之稍久，候其应手，然后刺而施治。所治为头痛眩晕、腹痛中满暴胀，以及新起之积。痛可以移动位置的，容易痊愈；已成积而不痛的，难以痊愈。","notes":[],"pending":false}]},
{"id":"ls53","book":"灵枢","no":53,"title":"论痛","titleTw":"論痛","tags":["ci","bingji","zangxiang"],"brief":"论筋骨肌肉皮肤腠理厚薄不同，对针石火焫之痛与毒药的耐受各异，并及其病之易已难已。","pending":false,"sections":[{"id":"ls53-1","tags":[],"yw":"黃帝問於少俞曰：筋骨之強弱，肌肉之堅脆，皮膚之厚薄，腠理之疏密，各不同，其於針石火焫之痛何如？腸胃之厚薄堅脆亦不等，其於毒藥何如？願盡聞之。少俞曰：人之骨強、筋弱、肉緩、皮膚厚者，耐痛，其於針石之痛火焫亦然。黃帝曰：其耐火煤者，何以知之？少俞答曰：加以黑色而美骨者，耐火焫。黃帝曰：其不耐針石之痛者，何以知之？少俞曰：堅肉薄皮者，不耐針石之痛，於火焫亦然。黃帝曰：人之病，或同時而傷，或易已，或難已，其故何如？少俞曰：同時而傷，其身多熱者，易已；多寒者，難已。","bh":"黄帝问少俞说：筋骨之强弱，肌肉之坚脆，皮肤之厚薄，腠理之疏密各不相同，他们对于针石火焫之痛如何？肠胃之厚薄坚脆也不相等，他们对于毒药如何？愿尽闻之。少俞说：那些骨强、筋弱、肉缓、皮肤厚的人耐痛，对于针石之痛与火焫也是这样。黄帝问：那些能耐火焫的，怎样知道？少俞回答说：再加以色黑而骨骼美好的，耐火焫。黄帝问：那些不耐针石之痛的，怎样知道？少俞说：坚肉薄皮的，不耐针石之痛，于火焫也是这样。黄帝问：人的病有的同时受伤，有的易已，有的难已，是何缘故？少俞说：同时受伤而身多热的，易已；多寒的，难已。","notes":[],"pending":false},{"id":"ls53-2","tags":[],"yw":"黃帝曰：人之勝毒，何以知之？少俞曰：胃厚、色黑、大骨及肥骨者，皆勝毒；故其瘦而薄胃者，皆不勝毒也。","bh":"黄帝问：人能否胜毒，怎样知道？少俞说：胃厚、色黑、骨大而肥壮的，皆胜毒；形体瘦而胃薄的，皆不胜毒。","notes":[],"pending":false}]},
{"id":"ls54","book":"灵枢","no":54,"title":"天年","titleTw":"天年","tags":["jingluo","zhenfa","bingji"],"brief":"论人之始生以母为基、以父为楯，详述十岁至百岁气血盛衰之次与不能终寿的原由。","pending":false,"sections":[{"id":"ls54-1","tags":[],"yw":"黃帝問於岐伯曰：願聞人之始生，何氣築爲基，何立而爲楯，何失而死，何得而生？岐伯曰：以母爲基，以父爲楯；失神者死，得神者生也。黃帝曰：何者爲神？岐伯曰：血氣已和，營衛已通，五髒已成，神氣舍心，魂魄畢具，乃成爲人。黃帝曰：人之壽夭各不同，或夭壽，或卒死，或病久，願聞其道。岐伯曰：五髒堅固，血脈和調，肌肉解利，皮膚致密，營衛之行，不失其常，呼吸微徐，氣以度行，六腑化谷，津液布揚，各如其常，故能長久。黃帝曰：人之壽百歲而死，何以致之？岐伯曰：使道隧以長，基牆高以方，通調營衛，三部三裏起，骨高肉滿，百歲乃得終。","bh":"黄帝问岐伯说：愿闻人始生时，何气筑为基，何立而为楯，何失而死，何得而生？岐伯说：以母为基，以父为楯；失神者死，得神者生。黄帝问：什么叫神？岐伯说：血气已和，营卫已通，五脏已成，神气舍心，魂魄毕具，才成为人。黄帝问：人之寿夭各不相同，或夭或猝死或久病，愿闻其道。岐伯说：五脏坚固，血脉和调，肌肉解利，皮肤致密，营卫之行不失其常，呼吸微徐，气以度行，六腑化谷，津液布扬，各如其常，所以能长久。黄帝问：人寿百岁而死，怎样才能致之？岐伯说：使道隧以长，基墙高以方，通调营卫，三部三里起，骨高肉满，就能百岁而终。","notes":[],"pending":false},{"id":"ls54-2","tags":[],"yw":"黃帝曰：其氣之盛衰，以至其死，可得聞乎？岐伯曰：人生十歲，五髒始定，血氣已通，其氣在下，故好走；二十歲，血氣始盛肌肉方長，故好趨；三十歲，五髒大定，肌肉堅固，血脈盛滿，故好步；四十歲，五髒六腑十二經脈，皆大盛以平定，腠理始疏，滎貨頹落，發頗斑白，平盛不搖，故好坐；五十歲，肝氣始衰，肝葉始薄，膽汁始減，目始不明；六十歲，心氣始衰，若憂悲，血氣懈惰，故好臥；七十歲，脾氣虛，皮膚枯；八十歲，肺氣衰，魄離，故言善誤；九十歲，腎氣焦，四髒經脈空虛；百歲，五髒皆虛，神氣皆去，形骸獨居而終矣。","bh":"黄帝问：人气之盛衰以至于死，可以听听吗？岐伯说：人生十岁，五脏始定，血气已通，其气在下，所以好走；二十岁，血气始盛，肌肉方长，所以好趋；三十岁，五脏大定，肌肉坚固，血脉盛满，所以好步；四十岁，五脏六腑十二经脉皆大盛而平定，腠理始疏，荣华颓落，发颇斑白，平盛不摇，所以好坐；五十岁，肝气始衰，肝叶始薄，胆汁始减，目始不明；六十岁，心气始衰，常怀忧悲，血气懈惰，所以好卧；七十岁，脾气虚，皮肤枯；八十岁，肺气衰，魄离，所以言善误；九十岁，肾气焦，四脏经脉空虚；百岁，五脏皆虚，神气皆去，形骸独居而终。","notes":[],"pending":false},{"id":"ls54-3","tags":[],"yw":"黃帝曰：其不能終壽而死者，何如？岐伯曰：其五髒皆不堅，使道不長，空外以張，喘息暴疾；又卑基牆薄，脈少血，其肉不石，數中風寒，血氣虛，脈不通，真邪相攻，亂而相引，故中壽而盡也。靈樞經","bh":"黄帝问：那些不能终寿而死的，怎样？岐伯说：他的五脏都不坚，使道不长，鼻孔外张，喘息暴疾；又基墙低薄，脉少血，肉不实，屡中风寒，血气虚，脉不通，真邪相攻，乱而相引，所以中年而寿尽。","notes":[],"pending":false}]},
{"id":"ls55","book":"灵枢","no":55,"title":"逆顺","titleTw":"逆順","tags":["yinyang"],"brief":"论针刺当审病势之逆顺，气逆不可刺，顺时而取，误刺则败，故为刺法逆顺之要。","pending":false,"sections":[]},
{"id":"ls56","book":"灵枢","no":56,"title":"五味","titleTw":"五味","tags":["ci","zhenfa","bingji"],"brief":"论五味入五脏各走所喜，列五谷五果五畜五菜五色之所宜，及脏病的五味所宜与五禁。","pending":false,"sections":[{"id":"ls56-1","tags":[],"yw":"黃帝曰：願聞谷氣有五味，其入五髒，分別奈何？伯高曰：胃者，五髒六腑之海也，水谷皆入於胃，五髒六腑，皆稟氣於胃。五味各走其所喜，谷味酸，先走肝，谷味苦，先走心，谷味甘，先走脾，谷味辛，先走肺，谷味鹹，先走腎。谷氣津液已行，營衛大通，乃化糟粕，以次傳下。黃帝曰：營衛之行奈何？伯高曰：谷始入於胃，其精微者，先出於胃之兩焦，以溉五髒，別出兩行，營衛之道。其大氣之搏而不行者，積於胸中，命曰氣海，出於肺，循咽喉，故呼則出，吸則入。","bh":"黄帝说：愿闻谷气有五味，它入五脏，分别是怎样的？伯高说：胃是五脏六腑之海，水谷皆入于胃，五脏六腑皆禀气于胃。五味各走其所喜：谷味酸先走肝，苦先走心，甘先走脾，辛先走肺，咸先走肾。谷气津液已行，营卫大通，乃化糟粕，以次传下。黄帝问：营卫之行怎样？伯高说：谷始入胃，它的精微先出于胃之两焦，以溉五脏，别出两行，这是营卫之道。它大气之搏而不行的，积于胸中，名叫气海，出于肺，循咽喉，所以呼则出，吸则入。","notes":[],"pending":false},{"id":"ls56-2","tags":[],"yw":"天地之精氣，其大數常出三入一，故谷不入，半日則氣衰，一日則氣少矣。黃帝曰：谷之五味，可得聞乎？伯高曰：請盡言之。五谷：糠米甘，麻酸，大豆鹹，麥苦，黃黍辛。五果：棗甘，李酸，慄鹹，杏苦，桃辛。五畜：牛甘，犬酸，豬鹹，羊苦，雞辛。五菜：葵甘，韭酸，藿鹹，薤苦，蔥辛。五色：黃色宜甘，青色宜酸，黑色宜鹹，赤色宜苦，白色宜辛。凡此五者，各有所宜。五宜所言五色者，脾病者，宜食糠米飯，牛肉棗葵；心病者，宜食麥羊肉杏薤；腎病者，宜食大豆黃卷豬肉慄藿；肝病者，宜食麻犬肉李韭；肺病者，宜食黃黍雞肉桃蔥。","bh":"天地的精气，它的大数通常是出三而入一，所以谷物不入胃，半日则气衰，一日则气少了。黄帝说：谷物的五味，可以听听吗？伯高说：请让我尽说它。五谷：粳米甘，麻酸，大豆咸，麦苦，黄黍辛。五果：枣甘，李酸，栗咸，杏苦，桃辛。五畜：牛甘，犬酸，猪咸，羊苦，鸡辛。五菜：葵甘，韭酸，藿咸，薤苦，葱辛。五色：黄色宜于甘味，青色宜于酸味，黑色宜于咸味，赤色宜于苦味，白色宜于辛味。这五者，各有它相宜的配合。所谓五宜所说的五色之病：脾病的，宜食粳米饭、牛肉、枣、葵；心病的，宜食麦、羊肉、杏、薤；肾病的，宜食大豆黄卷、猪肉、栗、藿；肝病的，宜食麻、犬肉、李、韭；肺病的，宜食黄黍、鸡肉、桃、葱。","notes":[],"pending":false},{"id":"ls56-3","tags":[],"yw":"五禁：肝病禁辛，心病禁鹹，脾病禁酸，腎病禁甘，肺病禁苦。肝色青，宜食甘，糠米飯、牛肉、棗、葵皆甘。心色赤，宜食酸，犬肉、麻、李、韭皆酸。脾黃色，宜食鹹，大豆、豬肉、慄、藿皆鹹。肺白色，宜食苦，麥、羊肉、杏、薤皆苦。腎色黑，宜食辛，黃黍、雞肉、桃、蔥皆辛。黃帝問於岐伯曰：","bh":"五禁：肝病禁辛，心病禁咸，脾病禁酸，肾病禁甘，肺病禁苦。肝色青，宜食甘味，粳米饭、牛肉、枣、葵都是甘的。心色赤，宜食酸味，犬肉、麻、李、韭都是酸的。脾色黄，宜食咸味，大豆、猪肉、栗、藿都是咸的。肺色白，宜食苦味，麦、羊肉、杏、薤都是苦的。肾色黑，宜食辛味，黄黍、鸡肉、桃、葱都是辛的。","notes":[],"pending":false}]},
{"id":"ls57","book":"灵枢","no":57,"title":"水胀","titleTw":"水脹","tags":["ci","jingluo","zhenfa"],"brief":"辨水肿、肤胀、鼓胀、肠覃、石瘕、石水的成因与证候异同，及其各自的诊断与刺治之法。","pending":false,"sections":[{"id":"ls57-1","tags":[],"yw":"水與膚脹、鼓脹、腸覃、石瘕、石水，何以別之？岐伯曰：水始起也，目窠上微腫，如新臥起之狀，其頸脈動，時咳，陰股間寒，足脛腫，腹乃大，其水已成矣。以手按其腹，隨手而起，如裹水之狀，此其候也。黃帝曰：膚脹何以候之？岐伯曰：膚脹者，寒氣客於皮膚之間，冬冬然不堅，腹大，身盡腫，皮厚，按其腹，窅而不起，腹色不變，此其候也。鼓脹何如？岐伯曰：腹脹身皆大，大與膚脹等也，色蒼黃，腹筋起，此其候也。腸覃何如？岐伯曰：寒氣客於腸外，與衛氣相搏，氣不得榮，因有所系，癖而內着，惡氣乃起，瘜肉乃生。","bh":"水肿与肤胀、鼓胀、肠覃、石瘕、石水，怎样区别？岐伯说：水初起时，眼胞上微肿，如刚睡醒之状，颈脉动，时咳，大腿内侧寒，足胫肿，腹随之胀大，此时水已成。用手按其腹，随手而起，如裹水之状，这就是它的证候。黄帝问：肤胀怎样诊候？岐伯说：肤胀是寒气客于皮肤之间，冬冬然鼓起而不坚，腹大，身尽肿，皮厚，按其腹深陷而不起，腹色不变，这就是它的证候。鼓胀如何？岐伯说：腹胀而身体皆大，与肤胀相等，色苍黄，腹筋显露，这就是它的证候。肠覃如何？岐伯说：寒气客于肠外，与卫气相搏，气不得荣运，因而有所系附，癖而内着，恶气乃起，息肉乃生。","notes":[],"pending":false},{"id":"ls57-2","tags":[],"yw":"其始生也，大如雞卵，稍以益大，至其成，如懷子之狀，久者離歲，按之則堅，推之則移，月事以時下，此其候也。石瘕何如？岐伯曰：石瘕生於胞中，寒氣客於子門，子門閉塞，氣不得通，惡血當瀉不瀉，衄以留止，日以益大，狀如懷子，月事不以時下，皆生於女子，可導而下。黃帝曰：膚脹鼓脹，可刺邪？岐伯曰：先瀉其脹之血絡，後調其經，刺去其血血絡也。","bh":"它初起时大如鸡蛋，渐渐增大，到长成时如怀孕之状，久的可历年，按之则坚，推之则移，月经按时而下，这就是它的证候。石瘕如何？岐伯说：石瘕生于胞宫，寒气客于子门，子门闭塞，气不得通，恶血当泻不泻，瘀血留止而日以益大，状如怀子，月经不以时下，都生于女子，可用导下之法使它排出。黄帝问：肤胀、鼓胀可以刺吗？岐伯说：先泻胀处之血络，后调其经，就是刺去血络中的瘀血。","notes":[],"pending":false}]},
{"id":"ls58","book":"灵枢","no":58,"title":"贼风","titleTw":"賊風","tags":["zhenfa","bingji","zangxiang"],"brief":"论不出户而卒病者，由故邪留内与新感相加所致，并释其似鬼神之故而祝由可已之理。","pending":false,"sections":[{"id":"ls58-1","tags":[],"yw":"黃帝曰：夫子言賊風邪氣傷人也，令人病焉，今有其不離屏蔽，不出室穴之中，卒然病者，非不離賊風邪氣，其故何也？岐伯曰：此皆嘗有所傷於溼氣，藏於血脈之中，分肉之間，久留而不去。若有所墮墜，惡血在內而不去，卒然喜怒不節，飲食不適，寒溫不時，腠理閉而不通。其開而遇風寒，則血氣凝結，與故邪相襲，則爲寒痹。其有熱則汗出，汗出則受風，雖不遇賊風邪氣，必有因加而發焉。黃帝曰：今夫子之所言者，皆病人之所自知也。其毋所遇邪氣，又毋怵惕之所志，卒然而病者，其故何也？唯有因鬼神之事乎？岐伯曰：此亦有故邪留而未發，因而志有所惡，及有所慕，血氣內亂，兩氣相搏。","bh":"黄帝说：先生说贼风邪气伤人而令人病，现在有人不离屏蔽、不出室穴之中，却猝然得病，并不是没有避开贼风邪气，这是何故？岐伯说：这都是曾经伤于湿气，湿藏于血脉之中、分肉之间，久留而不去；或者有所堕坠，恶血在内而不去；又猝然喜怒不节，饮食不适，寒温不时，使腠理闭而不通。等到腠理开而遇风寒，就使血气凝结，与旧邪相袭，于是成为寒痹。有热的则汗出，汗出则受风，虽不遇贼风邪气，也必定因相加而发。黄帝说：现在先生所说的，都是病人自己所能知的；那些既没有遭遇邪气，又没有怵惕之所志，猝然而病的，是何缘故？难道是因鬼神之事吗？岐伯说：这也是有故邪留而未发，因而志有所恶，及有所慕，血气内乱，两气相搏。","notes":[],"pending":false},{"id":"ls58-2","tags":[],"yw":"其所從來者微，視之不見，聽而不聞，故似鬼神。黃帝曰：其祝而已者，其故何也？岐伯曰：先巫者，因知百病之勝，先知其病之所從生者，可祝而已也。","bh":"它由来微妙，视之不见，听之不闻，所以像鬼神。黄帝问：那些用祝祷就能愈的，是什么原因？岐伯说：古时的巫者因知百病相胜之理，预知病之所从生，所以可以祝祷而愈。","notes":[],"pending":false}]},
{"id":"ls59","book":"灵枢","no":59,"title":"卫气失常","titleTw":"衛氣失常","tags":["ci","jingluo","zhenfa"],"brief":"论卫气失常留于腹中的刺取之法，皮肉气血筋骨病的诊候，及肥膏肉三形与寒温气血之别。","pending":false,"sections":[{"id":"ls59-1","tags":[],"yw":"黃帝曰：衛氣之留於腹中，搐積不行，菀蘊不得常所，使人支脅胃中滿，喘呼逆息者，何以去之？伯高曰：其氣積於胸中者，上取之，積於腹中者，下取之，上下皆滿者，旁取之。黃帝曰：取之奈何？伯高對曰：積於上，瀉人迎、天突、喉中；積於下者，瀉三裏與氣街；上下皆滿者，上下取之，與季脅之下一寸；重者，雞足取之。診視其脈大而弦急，及絕不至者，及腹皮急甚者，不可刺也。黃帝曰：善。黃帝問於伯高曰：何以知皮肉氣血筋骨之病也？伯高曰：色起兩眉薄澤者，病在皮；脣色青黃赤白黑者，病在肌肉；營氣濡然者，病在血氣；目色青黃赤白黑者，病在筋；耳焦枯受塵垢，病在骨。","bh":"黄帝说：卫气留滞在腹中，蓄积而不能运行，郁蕴而不能安居其常处，使人胁肋支撑、胃中胀满、喘息而气息上逆的，怎样去除它？伯高说：它的气积在胸中的，从上部取治；积在腹中的，从下部取治；上下都胀满的，从旁侧取治。黄帝问：怎样取治？伯高回答说：积在上面的，泻人迎、天突、喉中；积在下面的，泻三里与气街；上下都胀满的，上下都取，并取季胁之下一寸；病重的，用鸡足式的刺法取之。诊视他的脉大而弦急的，以及脉绝不至的，以及腹皮紧急得很厉害的，都不可以针刺。黄帝说：好。黄帝问伯高说：怎样知道皮、肉、气血、筋、骨的病呢？伯高说：色起于两眉之间而薄薄有泽的，病在皮；唇色现出青黄赤白黑的，病在肌肉；营气濡润异常的，病在血气；目色现出青黄赤白黑的，病在筋；耳轮焦枯像受了尘垢的，病在骨。","notes":[],"pending":false},{"id":"ls59-2","tags":[],"yw":"黃帝曰：病形何如，取之奈何？伯高曰：夫百病變化，不可勝數，然皮有部，肉有桂，血氣有輸，骨有屬。黃帝曰：願聞其故。伯高曰：皮之部，輸於四末；肉之柱，有臂脛諸陽分肉之間，與足少陰分間；血氣之輸，輸於諸絡，氣血留居，則盛而起，筋部無陰無陽，無左無右，候病所在；骨之屬者，骨空之所以受益而益腦者也。黃帝曰：取之奈何？伯高曰：夫病變化，浮沉深淺，不可勝究，各在其處，病間者淺之，甚者深之，間者小之，甚者衆之，隨變而調氣，故曰上工。","bh":"黄帝问：病形如何，怎样取治？伯高说：百病变化不可胜数，然而皮有部，肉有柱，血气有输，骨有属。黄帝说：愿闻其故。伯高说：皮之部，输于四末；肉之柱，在臂胫诸阳分肉之间与足少阴分间；血气之输，输于诸络，气血留居则盛而起；筋部无阴无阳、无左无右，候病之所在；骨之属，是骨空受益而益脑者。黄帝问：怎样取治？伯高说：病之变化，浮沉深浅不可胜究，各在其处，病轻的浅刺，病重的深刺，轻者取穴少，重者取穴多，随变而调气，所以叫上工。","notes":[],"pending":false},{"id":"ls59-3","tags":[],"yw":"黃帝問於伯高曰：人之肥瘦大小溫寒，有老壯少小，別之奈何？伯高對曰：人年五十已上爲老，二十已上爲壯，十八已上爲少，六歲已上爲小。黃帝曰：何以度知其肥瘦？伯高曰：人有肥、有膏、有肉。黃帝曰：別此奈何？伯高曰：膕肉堅，皮滿者，肥。膕肉不堅，皮緩者，膏。皮肉不相離者，肉。黃帝曰：身之寒溫何如？伯高：膏者，其肉淖而粗理者，身寒，細理者，身熱。脂者，其肉堅，細理者熱，粗理者寒。黃帝曰：其肥瘦大小奈何？伯高曰：膏者，多氣而皮縱緩，故能縱腹垂腴。","bh":"黄帝问伯高说：人的肥瘦大小、身之温寒，有老壮少小，怎样分别？伯高回答说：人年五十以上为老，二十以上为壮，十八以上为少，六岁以上为小。黄帝问：怎样度知其肥瘦？伯高说：人有脂、有膏、有肉。黄帝问：怎样分别？伯高说：腘肉坚而皮满的，脂；腘肉不坚而皮缓的，膏；皮肉不相离的，肉。黄帝问：身之寒温如何？伯高说：膏者，肉淖而粗理的身寒，细理的身热。脂者，肉坚，细理的身热，粗理的身寒。黄帝问：肥瘦大小如何？伯高说：膏者多气而皮纵缓，所以能纵腹垂腴。","notes":[],"pending":false},{"id":"ls59-4","tags":[],"yw":"肉者，身體容大。脂者，其身收小。黃帝曰：三者之氣血多少何如？伯高曰：膏者，多氣，多氣者，熱，熱者耐寒。肉者，多血則充形，充形則平。脂者，其血清，氣滑少，故不能大。此別於衆人者也。黃帝曰：衆人奈何？伯高曰：衆人皮肉脂膏，不能相加也，血與氣，不能相多，故其形不小不大，各自稱其身，命曰衆人。黃帝曰：善。治之奈何？伯高曰：必先別其三形，血之多少，氣之清濁，而後調之，治無失常經。是故膏人縱腹垂腴，肉人者，上下容大，脂人者，雖脂不能大者。","bh":"肉者身体容大。脂者其身收小。黄帝问：三者的气血多少如何？伯高说：膏者多气，多气则热，热者耐寒。肉者多血则充形，充形则平。脂者血清，气滑少，所以不能大。这是有别于众人者。黄帝问：众人如何？伯高说：众人皮肉脂膏不能相加，血与气不能相多，所以其形不小不大，各自称其身，名叫众人。黄帝说：善。怎样治疗？伯高说：必先别其三形，血之多少，气之清浊，而后调之，治无失常经。所以膏人纵腹垂腴，肉人上下容大，脂人虽脂不能大。","notes":[],"pending":false}]},
{"id":"ls60","book":"灵枢","no":60,"title":"玉版","titleTw":"玉版","tags":["ci","bingji","zangxiang"],"brief":"论痈疽脓血积微所生而圣人治未形，列刺法五逆之证与误刺夺气之戒，著之玉版以为刺禁。","pending":false,"sections":[{"id":"ls60-1","tags":[],"yw":"黃帝曰：餘以小針爲細物也，夫子乃言上合之於天，下合之於地，中合之於人，餘以爲過針之意矣，願聞其故。岐伯曰：何物大於天乎？夫大於針者，惟五兵者焉，死之備也，非生之具。且夫人者，天地之鎮也，其不可不參乎？夫治民者，亦唯針焉。夫針之與五兵，其孰小乎？黃帝曰：病之生時，有喜怒不測，飲食不節，陰氣不足，陽氣有餘，營氣不行，乃發爲癰疽。陰陽不通，兩熱相搏，乃化爲濃，小針能取之乎？岐伯曰：聖人不能使化者爲之，邪不可留也。","bh":"黄帝说：我以为小针是细物，先生却说它上合于天，下合于地，中合于人，我以为这是过分夸大针的意义，愿闻其故。岐伯说：什么东西比天更大呢？比针大的，只有五兵罢了，那是致死之备，不是养生之具。而且人是天地之镇，难道可以不参吗？那治民的也只有针。针与五兵，哪个小呢？黄帝问：病之生时，有喜怒不测，饮食不节，阴气不足，阳气有余，营气不行，就发为痈疽；阴阳不通，两热相搏，就化为脓，小针能取之吗？岐伯说：圣人不能使已化者复故，因为邪不可留。","notes":[],"pending":false},{"id":"ls60-2","tags":[],"yw":"故兩軍相當，旗幟相望，白刃陳於中野者，此非一日之謀也。能使其民令行，禁止士卒無白刃之難者，非一日之教也，須臾之得也。夫至使身被癰疽之病，膿血之聚者，不亦離道遠乎？夫癰疽之生，膿血之成也，不從天下，不從地出，積微之所生也，故聖人自治於未有形也，愚者遭其已成也。黃帝曰：其已形，不予遭，膿已成，不予見；爲之奈何？岐伯曰：膿已成，十死一生，故聖人弗使已成，而明爲良方，着之竹帛，使能者踵而傳之後世，無有終時者，爲其不予遭也。","bh":"所以两军相当，旗帜相望，白刃陈于中野，这不是一日的谋划。能使他的人民令行禁止，使士卒不遭白刃之难，也不是一日的教化、须臾的所得。至于使身被痈疽之病、脓血之聚的，不也是离道太远了吗？那痈疽的发生、脓血的形成，不从天降，不从地出，是积微所生，所以圣人自治于未有形之时，愚者才遭遇它已成之后。黄帝问：已成形而我未曾遇上，脓已成而我未能见，怎么办？岐伯说：脓已成，十死一生，所以圣人不使已成，而明著良方于竹帛，使能者相继传于后世，无有终时，正因为不能亲遇每一位病人。","notes":[],"pending":false},{"id":"ls60-3","tags":[],"yw":"黃帝曰：其已有膿血而後遭乎？不導之以小針治乎？岐伯曰：以小治小者，其功小，以大治大者，多害，故其已成膿血者，其唯砭石鈹鋒之所取也。黃帝曰：多害者其不可全乎？岐伯曰：其在逆順焉。黃帝曰：願聞逆順。岐伯曰：以爲傷者，其白眼青，黑眼小，是一逆也；內藥而嘔者，是二逆也；腹痛渴甚，是三逆也；肩項中不便，是四逆也；音嘶色脫，是五逆也。除此五者，爲順矣。黃帝曰：諸病皆有逆順，可得聞乎？岐伯曰：腹脹、身熱、脈大，是一逆也；腹鳴而滿，四肢清泄，其脈大，是二逆也；衄而不止，脈大，是三逆也；咳而溲血脫形，其脈小勁，是四逆也；咳脫形，身熱，脈小以疾，是謂五逆也。","bh":"黄帝问：已有脓血而后遇上的，不能用小针疏导治疗吗？岐伯说：以小治小者功小，以大治大者多害，所以已成脓血的，只有砭石、铍针、锋针可以取之。黄帝问：多害的就不能保全了吗？岐伯说：在于逆顺。黄帝说：愿闻逆顺。岐伯说：疮疡表现为白眼青、黑眼小的，是一逆；服药而呕的，是二逆；腹痛渴甚的，是三逆；肩项中不便的，是四逆；声音嘶哑、色脱的，是五逆。除此五者，就是顺了。黄帝问：诸病皆有逆顺，可以听听吗？岐伯说：腹胀、身热、脉大，是一逆；腹鸣而满，四肢清冷泄泻而脉大，是二逆；衄血不止而脉大，是三逆；咳而尿血、脱形而脉小劲，是四逆；咳而脱形、身热、脉小以疾，就是五逆。","notes":[],"pending":false},{"id":"ls60-4","tags":[],"yw":"如是者，不過十五日而死矣。其腹大脹，四末清，脫形，泄甚，是一逆也；腹脹便血，其脈大，時絕，是二逆也；咳溲血，形肉脫，脈搏，是三逆也；嘔血，胸滿引背，脈小而疾，是四逆也；咳嘔，腹脹且飧泄，其脈絕，是五逆也。如是者，不及一時而死矣。工不察此者而刺之，是謂逆治。黃帝曰：夫子之言針甚駿，以配天地，上數天文，下度地紀，內別五髒，外次六腑，經脈二十八會，盡有周紀。能殺生人，不能起死者，子能反之乎？岐伯曰：能殺生人，不能起死者也。","bh":"像这样的，不过十五日而死。那腹大胀、四肢清冷、脱形、泄泻很厉害的，是一逆；腹胀便血，脉大时而断绝的，是二逆；咳而尿血，形肉脱，脉搏有力的，是三逆；呕血，胸满引背，脉小而疾的，是四逆；咳呕，腹胀而且飧泄，其脉断绝的，是五逆。像这样的，不到一个时辰就死。医工不察这些而施针，这就叫逆治。黄帝说：先生论针甚宏大，以配天地，上数天文，下度地纪，内别五脏，外次六腑，经脉二十八会，尽有周纪。它能杀生人而不能起死者，您能反过来吗？岐伯说：它是能杀生人而不能起死者的。","notes":[],"pending":false},{"id":"ls60-5","tags":[],"yw":"黃帝曰：餘聞之，則爲不仁，然願聞其道，弗行於人。岐伯曰：是明道也，其必然也，其如刀劍之可以殺人，如飲酒使人醉也，雖勿診，猶可知矣。黃帝曰：願卒聞之。岐伯曰：人之所受氣者，谷也。谷之所注者，胃也。胃者，水谷氣血之海也。海之所行雲氣者，天下也。胃之所出氣血者，經隧也。而隧者，五髒六腑之大絡也，迎而奪之而已矣。黃帝曰：上下有數乎？岐伯曰：迎之五裏，中道而止，五至而已，五往而髒之氣盡矣，故五五二十五，而竭其輸矣，此所謂奪其天氣者也，非能絕其命而傾其壽者也。","bh":"黄帝说：我听了这些，怕它成为不仁之事，然而仍愿闻其道，只是不施行于人。岐伯说：这是明白的道理，是必然的，如同刀剑可以杀人，如同饮酒使人醉，即使不诊也可以知道。黄帝说：愿卒闻之。岐伯说：人所受气者，谷也；谷之所注者，胃也。胃是水谷气血之海。海所行云气者，天下也；胃所出气血者，经隧也。而隧是五脏六腑之大络，迎而夺之就完了。黄帝问：上下有数吗？岐伯说：迎之五里，中道而止，五至而已，五往而脏之气尽矣，所以五五二十五而竭其输，这就是所谓夺其天气，并不是能绝其命而倾其寿。","notes":[],"pending":false},{"id":"ls60-6","tags":[],"yw":"黃帝曰：願卒聞之。岐伯曰：窺門而刺之者，死於家中；入門而刺之者，死於堂上。黃帝曰：善乎方，明哉道，請着之玉版，以爲重寶，傳之後世，以爲刺禁，令民勿敢犯也。","bh":"黄帝说：愿详细听听。岐伯说：窥门而刺的，病人死于家中；入门而刺的，死于堂上。黄帝说：好啊此方，高明啊此道，请著之玉版，作为重宝传于后世，以为刺禁，使百姓不敢违犯。","notes":[],"pending":false}]},
{"id":"ls61","book":"灵枢","no":61,"title":"五禁","titleTw":"五禁","tags":["ci","zhenfa","bingji"],"brief":"列刺有五禁、五夺、五过、五逆、九宜，详述禁刺之日时与形肉气血已夺不可泻之候。","pending":false,"sections":[{"id":"ls61-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞刺有五禁，何謂五禁？岐伯曰：禁其不可刺也。黃帝曰：餘聞刺有五奪。岐伯曰：無瀉其不可奪者也。黃帝曰：餘聞刺有五過。岐伯曰：補瀉無過其度。黃帝曰：餘聞刺有五逆。岐伯曰：病與脈相逆，命曰五逆。黃帝曰：餘聞刺有九宜。岐伯曰：明知九針之論，是謂九誼。黃帝曰：何謂五禁，願聞其不可刺之時。岐伯曰：甲乙日自乘，無刺實，無發蒙於耳內。丙丁日自乘，無振埃於肩喉廉泉。戊己日自乘四季，無刺腹，去爪瀉水。","bh":"黄帝问岐伯说：我听说刺有五禁，什么叫五禁？岐伯说：就是禁其不可刺的时日。黄帝说：我听说刺有五夺。岐伯说：就是不要泻其不可再夺的虚候。黄帝说：我听说刺有五过。岐伯说：补泻不要超过它的限度。黄帝说：我听说刺有五逆。岐伯说：病与脉相逆，名叫五逆。黄帝说：我听说刺有九宜。岐伯说：明了九针之论，就叫九宜。黄帝说：什么叫五禁？愿闻不可刺之时。岐伯说：甲乙日自乘，不刺实，不于耳内施发蒙之刺；丙丁日自乘，不于肩喉廉泉施振埃之刺；戊己日自乘及四季之日，不刺腹，不用去爪泻水之法。","notes":[],"pending":false},{"id":"ls61-2","tags":[],"yw":"庚辛日自乘，無刺關節於股膝。壬癸日自乘，無刺足脛，是謂五禁。黃帝曰：何謂五奪？岐伯曰：形肉已奪，是一奪也；大奪血之後，是二奪也；大汗出之後，是三奪也；大泄之後，是四奪也；新產及大血之後，是五奪也。此皆不可瀉。黃帝曰：何謂五逆？岐伯曰：熱病脈靜，汗已出，脈盛躁，是一逆也；病泄，脈洪大，是二逆也；着痹不移，(月囷)肉破，身熱，脈偏絕，是三逆也；淫而奪形、身熱，色夭然白，乃後下血衄，血衄篤重，是謂四逆也；寒熱奪形，脈堅搏，是謂五逆也。","bh":"庚辛日自乘，不刺股膝的关节。壬癸日自乘，不刺足胫，这就叫五禁。黄帝问：什么叫五夺？岐伯说：形肉已夺，是一夺；大夺血之后，是二夺；大汗出之后，是三夺；大泄之后，是四夺；新产及大血之后，是五夺。这些都不可泻。黄帝问：什么叫五逆？岐伯说：热病脉静，汗已出而脉盛躁，是一逆；病泄而脉洪大，是二逆；着痹不移，䐃肉破，身热，脉偏绝，是三逆；淫而夺形、身热，色夭然白，其后下血衄，血衄笃重，是四逆；寒热夺形，脉坚搏，就是五逆。","notes":[],"pending":false}]},
{"id":"ls62","book":"灵枢","no":62,"title":"动输","titleTw":"動輸","tags":["jingluo","zhenfa","bingji"],"brief":"论手太阴、足少阴、阳明三脉独动不休之故，及营卫相输如环、四街为气之径路。","pending":false,"sections":[{"id":"ls62-1","tags":[],"yw":"黃帝曰：經脈十二，而手太陰、足少陰、陽明，獨動不休，何也？岐伯曰：是明胃脈也。胃爲五髒六腑之海，其清氣上注於肺，肺氣從太陰而行之，其行也，以息往來，故人一呼，脈再動，一吸脈亦再動，呼吸不已，故動而不止。黃帝曰：氣之過於寸口也，上十焉息，下八焉伏，何道從還？不知其極。岐伯曰：氣之離髒也，卒然如弓弩之發，如水之下岸，上於魚以及衰，其餘氣衰散以逆上，故其行微。黃帝曰：足之陽明，何因而動？岐伯曰：胃氣上注於肺，其悍氣上衝頭者，循咽，上走空竅，循眼系，入絡腦，出顑，下客主人，循牙車，合陽明，並下人迎，此胃氣別走於陽明者也。","bh":"黄帝说：经脉十二，而手太阴、足少阴、阳明独动不休，为何？岐伯说：这是清楚的胃脉。胃为五脏六腑之海，它的清气上注于肺，肺气从太阴而行，它的运行随呼吸往来，所以人一呼脉动两次，一吸亦动两次，呼吸不已，故动而不止。黄帝问：气过于寸口，上十而息，下八而伏，是从哪条路回还的？我不知其极。岐伯说：气离脏时，猝然如弓弩之发，如水之由高岸直下，上行到鱼际而转衰，其余气衰散而上逆，所以它的运行微弱。黄帝问：足阳明因何而动？岐伯说：胃气上注于肺，其悍气上冲于头的，循咽上走空窍，循眼系入络脑，出于额部，下客主人，循牙车，合于阳明，并下人迎，这是胃气别走于阳明者。","notes":[],"pending":false},{"id":"ls62-2","tags":[],"yw":"故陰陽上下，其動也若一。故陽病而陽脈小者，爲逆；陰病而陰脈大者，爲逆。故陰陽俱靜俱動，若引繩相傾者病。黃帝曰：足少陰何因而動？岐伯曰：衝脈者，十二經之海也，與少陰之大絡，起於腎下，出於氣街，循陰股內廉，邪入膕中，循脛骨內廉，並少陰之經，下入內踝之後。入足下，其別者，邪入踝，出屬附上，入大指之間，注諸絡，以溫足脛，此脈之常動者也。黃帝曰：營衛之行也，上下相貫，如環之無端，今有其卒然遇邪風，及逢大寒，手足懈惰，其脈陰陽之道，相輸之會，行相失也，氣何由還？岐伯曰：夫四末陰陽之會者，此氣之尤絡也；四街者，氣之徑路也。","bh":"所以阴阳上下，它们的搏动是一致的。所以阳病而阳脉小的为逆，阴病而阴脉大的为逆。阴阳俱静俱动，若引绳相倾的，就是病。黄帝问：足少阴因何而动？岐伯说：冲脉是十二经之海，与少阴之大络起于肾下，出于气街，循阴股内廉，斜入腘中，循胫骨内廉，并少阴之经，下入内踝之后，入足下；它的别者斜入踝，出属跗上，入大趾之间，注诸络，以温足胫，这是此脉常动的缘故。黄帝问：营卫之行上下相贯，如环无端，现在有人猝然遇邪风、逢大寒，手足懈惰，他的脉之阴阳之道、相输之会运行相失了，气从何而还？岐伯说：四肢末端是阴阳之会，这是气之大络；四街是气的径路。","notes":[],"pending":false},{"id":"ls62-3","tags":[],"yw":"故絡絕則徑通，四末解則氣從合，相輸如環。黃帝曰：善。此所謂如環無端，莫知其紀，終而復始，此之謂也。","bh":"所以络绝则径通，四肢末端解散则气从合处而返，相输如环。黄帝说：好。这就是所谓如环无端，不知其端绪，终而复始。","notes":[],"pending":false}]},
{"id":"ls63","book":"灵枢","no":63,"title":"五味论","titleTw":"五味論","tags":["zhenfa","bingji","zangxiang"],"brief":"论酸咸辛苦甘各有所走，多食分别致癃、渴、洞心、变呕、悗心的缘由，并释其病机。","pending":false,"sections":[{"id":"ls63-1","tags":[],"yw":"黃帝問於少俞曰：五味入於口也，各有所走，各有所病，酸走筋，多食之，令人癃；鹹走血，多食之，令人渴；辛走氣，多食之，令人洞心；苦走骨，多食之，令人變嘔；甘走肉，多食之，令人挽心。餘知其然也，不知其何由？願聞其故。少俞答曰：酸入於胃，其氣澀以收，上之兩焦，弗能出入也，不出即留於胃中，胃中和溫，則下注膀胱，膀胱之胞薄以懦，得酸則縮綣，約而不通，水道不行，故癃。陰者，積筋之所終也，故酸入而走筋矣。黃帝曰：鹹走血，多食之，令人渴，何也？少俞曰：鹹入於胃；其氣上走中焦，注於脈，則血氣走之，血與鹹相得，則凝，凝則胃中汁注之，注之則胃中竭，竭則咽路焦，故舌本干而善渴。","bh":"黄帝问少俞说：五味入于口，各有所走，各有所病：酸走筋，多食令人癃；咸走血，多食令人渴；辛走气，多食令人洞心；苦走骨，多食令人变呕；甘走肉，多食令人悗心。我知道是这样，不知由何而起，愿闻其故。少俞回答说：酸入于胃，其气涩以收，上行两焦，弗能出入，不出就留于胃中，胃中和温则下注膀胱，膀胱之胞薄而懦，得酸则缩绻，约而不通，水道不行，所以癃。前阴是积筋之所终，所以酸入而走筋。黄帝问：咸走血，多食令人口渴，为何？少俞说：咸入于胃，其气上走中焦，注于脉，则血气走之，血与咸相得则凝，凝则胃中汁注之，注之则胃中竭，竭则咽路焦，所以舌本干而善渴。","notes":[],"pending":false},{"id":"ls63-2","tags":[],"yw":"血脈者，中焦之道也，故鹹入而走血矣。黃帝曰：辛走氣，多食之，令人洞心，何也？少俞曰：辛入於胃，其氣走於上焦，上焦者，受氣而營諸陽者也，姜韭之氣燻之，營衛之氣，不時受之，久留心下，故洞心。辛與氣俱行，故辛入而與汗俱出。黃帝曰：苦走骨，多食之，令人變嘔，何也？少俞曰：苦入於胃，五谷之氣，皆不能勝苦，苦入下脘，三焦之道，皆閉而不通，故變嘔。齒者，骨之所終也，故苦入而走骨，故入而復出，知其走骨也。黃帝曰：甘走肉，多食之。","bh":"血脉是中焦的通道，所以咸入胃而走血。黄帝问：辛走气，多吃它使人洞心，是什么缘故？少俞说：辛入于胃，它的气走向上焦，上焦是接受气而营运诸阳之处的，姜韭之气熏蒸它，营卫之气不能按时受纳，久留心下，所以洞心。辛与气一同运行，所以辛入胃而与汗一同排出。黄帝问：苦走骨，多吃它使人变为呕吐，是什么缘故？少俞说：苦入于胃，五谷之气都不能胜过苦，苦入于下脘，三焦的通道都闭塞不通，所以变为呕吐。牙齿是骨所终极之处，所以苦入而走骨，所以它入而复出，便知它是走骨的。黄帝问：甘走肉，多吃它呢？","notes":[],"pending":false},{"id":"ls63-3","tags":[],"yw":"令人悗心，何也？少俞曰：甘入於胃，其氣弱小，不能上至於上焦，而與谷留於胃中者，令人柔潤者也，胃柔則緩，緩則蟲動，蟲動則令人悗心。其氣外通於肉，故甘走肉。","bh":"使人心胸烦闷，是什么缘故？少俞说：甘入于胃，它的气弱小，不能上行到上焦，而与谷物一同留在胃中，它是使人柔润的东西；胃柔软则弛缓，弛缓则虫动，虫动就使人心胸烦闷。它的气向外通于肉，所以甘走肉。","notes":[],"pending":false}]},
{"id":"ls64","book":"灵枢","no":64,"title":"阴阳二十五人","titleTw":"陰陽二十五人","tags":["ci","zhenfa","bingji"],"brief":"分金木水火土五形为二十五种人，述其形色禀赋、年忌、气血多少与审形气调刺之约。","pending":false,"sections":[{"id":"ls64-1","tags":[],"yw":"黃帝曰：餘聞陰陽之人何如？伯高曰：天地之間，六合之內，不離於五，人亦應之。故五五二十五人之政，而陰陽之人不與焉。其態又不合於衆者五，餘已知之矣。願聞二十五人之形，血氣之所生，別而以候，從外知內，何如？岐伯曰：「悉乎哉問也，此先師之祕也，雖伯高猶不能明之也。黃帝避席遵循而卻曰：餘聞之得其人弗教，是謂重失，得而泄之，天將厭之，餘願得而明之，金櫃藏之，不敢揚之。岐伯曰：先立五形金木水火土，別其五色，異其五形之人，而二十五人具矣。","bh":"黄帝说：我听说阴阳之人是怎样的？伯高说：天地之间，六合之内，不离于五，人亦应之。所以五五二十五人之政，而阴阳之人不与焉。它们的形态又不合于众的有五种，我已经知道了。愿闻二十五人之形、血气之所生，分别而候之，从外知内，怎样？岐伯说：问得详尽啊！这是先师之秘，即使伯高也不能明了。黄帝离席退却而行礼说：我听说得其人而不教，叫做重失；得而泄之，天将厌之。我愿得而明之，藏之金柜，不敢扬之。岐伯说：先立金木水火土五形，别其五色，异其五形之人，二十五人就具足了。","notes":[],"pending":false},{"id":"ls64-2","tags":[],"yw":"黃帝曰：願卒聞之。岐伯曰：慎之慎之，臣請言之。木形之人，比於上角似於蒼帝，其爲人蒼色，小頭，長面大肩背直身小，手足好。有才，勞心少力多憂，勞於事，能春夏不能秋冬感而病生。足厥陰，佗佗然，大角之人比於左足少陽，少陽之上遺遺然。左角之人比於右足少陽，少陽之下隨隨然。鈦角之人，比於右足少陽，少陽之上推推然。判角之人比於左足少陽，少陽之下枯枯然。火形之人，比於上徵，似於赤帝。其爲人赤色廣(月引)，脫面，小頭，好肩背，髀腹小手足，行安地疾心，行搖肩背肉滿。","bh":"黄帝说：希望详细听您讲。岐伯说：慎重啊慎重，请让我来说。木形的人，比于上角，如同苍帝，他的面色苍青，头小，脸长，肩背宽厚、身躯挺直，手足纤细美好。有才干，劳心而少气力，多忧虑，辛勤操劳于事务，能够耐受春夏而不能耐受秋冬，感受邪气就生病。属足厥阴经，佗佗然。大角之人比于左足少阳，少阳之上，遗遗然。左角之人比于右足少阳，少阳之下，随随然。钛角之人，比于右足少阳，少阳之上，推推然。判角之人比于左足少阳，少阳之下，枯枯然。火形的人，比于上征，如同赤帝。他的面色赤，脊背肌肉宽广，面部瘦削，头小，肩背美好，髀腹小而手足小，行走安稳而心性急躁，行走时肩背摇动而肌肉丰满。","notes":[],"pending":false},{"id":"ls64-3","tags":[],"yw":"有氣輕財少信多慮，見事明好顏，急心不壽暴死。能春夏不能秋冬，秋冬感而病生，手少陰核核然。質徵之人，比於左手太陽，太陽之上，肌肌然，少徵之人比於右手太陽，太陽之下??然，右徵之人比於右手太陽，太陽之上鮫鮫然。質判之人，比於左手太陽，太陽之下支支頤頤然。形於之人，比於上宮，似於上古黃帝，其爲人黃色圓面、大頭、美肩背、大腹、美股脛、小手足、多肉、上下相稱行安地，舉足浮。安心，好利人不喜權勢，善附人也。能秋冬不能春夏，春夏感而病生，足太陰，敦敦然。","bh":"有气魄，轻财少信，多虑，见事明白，好修容貌，急心而不寿，容易暴死。能春夏不能秋冬，秋冬感邪则病生，属手少阴，核核然。质征之人比于左手太阳，太阳之上肌肌然；少征之人比于右手太阳，太阳之下惛惛然；右征之人比于右手太阳，太阳之上鲛鲛然。质判之人比于左手太阳，太阳之下支支颐颐然。土形之人比于上宫，似于上古黄帝，他面色黄、圆面、大头、美肩背、大腹、美股胫、小手足、多肉、上下相称，行走安稳而举足轻。他们安心，好利人，不喜权势，善附随人。能秋冬不能春夏，春夏感邪则病生，属足太阴，敦敦然。","notes":[],"pending":false},{"id":"ls64-4","tags":[],"yw":"大宮之人比於左足陽明，陽明之上婉婉然。加宮之人，比於左足陽明，陽明之下坎坎然。少宮之人，比於右足陽明，陽明之上，樞樞然。左宮之人，比於右足陽明，陽明之下，兀兀然。金形之人比於上商，似於白帝，其爲人方面白色、小頭、小肩背小腹、小手足如骨發踵外，骨輕。身清廉，急心靜悍，善爲吏，能秋冬，不能春夏，春夏感而病生。手太陰敦敦然，釱商之人比於左手陽明，陽明之上，廉廉然。右商之人，比於左手陽明，陽明之下脫脫然。","bh":"大宫之人比于左足阳明，阳明之上，婉婉然。加宫之人，比于左足阳明，阳明之下，坎坎然。少宫之人，比于右足阳明，阳明之上，枢枢然。左宫之人，比于右足阳明，阳明之下，兀兀然。金形之人比于上商，如同白帝，他的面部方正、面色白，头小，肩背小而腹部小，手足小，如同足跟有骨外突于踵后，身体轻捷。禀性清廉，心性急躁而沉静强悍，善于做官吏，能够耐受秋冬，不能耐受春夏，春夏感受邪气就生病。属手太阴经，敦敦然。釱商之人比于左手阳明，阳明之上，廉廉然。右商之人，比于左手阳明，阳明之下，脱脱然。","notes":[],"pending":false},{"id":"ls64-5","tags":[],"yw":"左商之人比於右手陽明，陽明之上監監然。少商之人，比於右手陽明，陽明之下，嚴嚴然。水形之人，比於上羽，似於黑帝，其爲人，黑色面不平，大頭廉頤，小肩大腹動手足，發行搖身下尻長，背延延然。不敬畏善欺紹人，戮死。能秋冬不能春夏，春夏感而病生。足少陰汗汗然。大羽之人，比於右足太陽，太陽之上，頰頰然。少羽之人，比於左足太陽，太陽之下潔潔然。桎之爲人，比於左足太陽，太陽之上安安然。是故五形之人二十五變者，衆之所以相欺者是也。","bh":"左商之人比于右手阳明，阳明之上，监监然。少商之人，比于右手阳明，阳明之下，严严然。水形之人，比于上羽，如同黑帝，他的面色黑，面部不平，头大，颐部清瘦，肩小而腹部大，手足好动，行走时身体摇摆，臀腿较长而身长，背部延延然。不懂得敬畏，善于欺罔利用他人，容易被刑戮而死。能够耐受秋冬而不能耐受春夏，春夏感受邪气就生病。属足少阴经，汗汗然。大羽之人，比于右足太阳，太阳之上，颊颊然。少羽之人，比于左足太阳，太阳之下，洁洁然。桎之为人，比于左足太阳，太阳之上，安安然。所以五形之人的二十五种变化，正是众人互相混淆而难辨之处。","notes":[],"pending":false},{"id":"ls64-6","tags":[],"yw":"黃帝曰：得其形，不得其色何如？岐伯曰：形勝色，色勝形者，至其勝時年加，感則病行，失則憂矣。形色相得者，富貴大樂。黃帝曰：其形色相當勝之時，年加可知乎？岐伯曰：凡年忌下上之人，大忌常加七歲，十六歲、二十五歲、三十四歲、四十三歲、五十二歲、六十一歲皆人之大忌，不可不自安也，感則病行，失則憂矣，當此之時，無爲奸事，是謂年忌。黃帝曰：夫子之言脈之上下，血氣之候似知形氣，奈何？岐伯曰：足陽明之上血氣盛則髯美長，血少氣多則髯短，故氣少血多則髯少，血氣皆少則無髯。","bh":"黄帝问：得其形而不得其色，会怎样？岐伯说：形胜色或色胜形的，到被胜的时年相加，感邪则病行，有所失则有忧。形色相得的，富贵而大乐。黄帝问：其形色当被胜之时，年忌可以预知吗？岐伯说：凡年忌，大忌常加于七岁、十六岁、二十五岁、三十四岁、四十三岁、五十二岁、六十一岁，都是人的大忌，不可不自安；感邪则病行，有失则忧，当此之时，不要做奸邪之事，这就叫年忌。黄帝问：先生所说脉之上下、血气之候似可据以知形气，怎样？岐伯说：足阳明之上，血气盛则髯美而长，血少气多则髯短，气少血多则髯少，血气皆少则无髯。","notes":[],"pending":false},{"id":"ls64-7","tags":[],"yw":"兩吻多畫，足陽明之下血氣盛則下毛美長至胸，血多氣少則下毛美短至臍，行則善高舉足，足趾少肉足善寒，血少氣多則肉而善瘃，血氣皆少則無毛有則稀、枯悴，善痿厥，足痹。足少陽之上，氣血盛則通髯美長，血多氣少則通髯美短，血少氣多則少髯，血氣皆少則無須，感於寒溼則善痹。骨痛爪枯也。足少陽之下，血氣盛則脛毛美長，外踝肥；血多氣少則脛毛美短，外踝皮堅而厚，血少氣多則胻毛少，外踝皮薄而軟，血氣皆少則無毛，外踝瘦無肉。","bh":"口两旁多纹理的，足阳明之下血气盛则下部之毛美好而长至胸部，血多气少则下部之毛美好而短至脐部，行走时好高抬脚，足趾少肉而足容易发冷，血少气多则肌肉厚而容易生冻疮，血气都少则无毛，有也稀少枯槁憔悴，容易痿厥、足痹。足少阳之上，气血盛则连鬓之髯美好而长，血多气少则通髯美好而短，血少气多则髯少，血气都少则没有胡须，感受寒湿则容易患痹、骨痛、爪甲枯槁。足少阳之下，血气盛则胫毛美好而长，外踝肥厚；血多气少则胫毛美好而短，外踝皮坚实而厚；血少气多则小腿毛少，外踝皮薄而柔软；血气都少则无毛，外踝瘦削而无肉。","notes":[],"pending":false},{"id":"ls64-8","tags":[],"yw":"足太陽之上，血氣盛則美眉，眉有毫毛血多氣少則惡眉，面多少理，血少氣多則面多肉，血氣和則美色，足太陽之下，血氣盛則肉滿，踵堅，氣少血多則瘦，跟空，血氣皆少則善轉筋，踵下痛。手陽明之上，血氣盛則髭美。血少氣多則髭惡，血氣皆少則無髭。手陽明之下血氣盛則腋下毛美，手魚肉以溫，氣血皆少則手瘦以寒。手少陰之上，血氣盛則眉美以長，耳色美，血氣皆少則耳焦惡色。手少陽之下，血氣盛則手卷多肉以溫，血氣皆少則寒以瘦，氣少血多則瘦以多脈。","bh":"足太阳之上，血气盛则眉美，眉有毫毛；血多气少则恶眉、面多小理；血少气多则面多肉；血气和则美色。足太阳之下，血气盛则肉满、踵坚；气少血多则瘦、跟空；血气皆少则善转筋、踵下痛。手阳明之上，血气盛则髭美；血少气多则髭恶；血气皆少则无髭。手阳明之下，血气盛则腋下毛美，手鱼肉以温；气血皆少则手瘦以寒。手少阴之上，血气盛则眉美以长，耳色美；血气皆少则耳焦恶色。手少阳之下，血气盛则手卷多肉以温；血气皆少则寒以瘦；气少血多则瘦以多脉。","notes":[],"pending":false},{"id":"ls64-9","tags":[],"yw":"手太陽之上，血氣盛則多須，面多肉以平，血氣皆少則面瘦惡色。手太陽之下，血氣盛則掌肉充滿，血氣皆少則掌瘦以寒。黃帝曰：二十五人者，刺之有約乎？岐伯曰：美眉者，足太陽之脈，氣血多，惡眉者，血氣少，其肥而澤者，血氣有餘，肥而不澤者，氣有餘，血不足，瘦而無澤者，氣血俱不足，審察其形氣有餘不足而調之，可以知逆順矣。黃帝曰：刺其諸陰陽奈何？岐伯曰：按其寸口人迎，以調陰陽，切循其經絡之凝澀，結而不通者，此於身皆爲痛痹，甚則不行，故凝澀，凝澀者，致氣以溫之血和乃止。","bh":"手太阳之上，血气盛则多须，面多肉以平；血气皆少则面瘦恶色。手太阳之下，血气盛则掌肉充满；血气皆少则掌瘦以寒。黄帝问：这二十五人，刺之有约吗？岐伯说：眉美的，足太阳之脉气血多；眉恶的，血气少；肥而润泽的，血气有余；肥而不泽的，气有余而血不足；瘦而无泽的，气血俱不足。审察其形气有余不足而调之，就可以知道逆顺。黄帝问：刺其诸阴阳怎样？岐伯说：按其寸口人迎以调阴阳，切循其经络，有凝涩、结而不通的，这些都成为痛痹，甚则不行，所以凝涩的，要致气以温之，血和乃止。","notes":[],"pending":false},{"id":"ls64-10","tags":[],"yw":"其結絡者，脈結血不和，決之乃行，故曰：氣有餘於上者，導而下之，氣不足於上者，推而休之，其稽留不至者，因而迎之，必明於經隧，乃能持之，寒與熱爭者，導而行之，其宛陳血不結者，則而予之，必先明知二十五人則血氣之所在，左右上下，刺約畢也。","bh":"那结络的，脉结而血不和，决之乃行，所以说：气有余于上的，导而下之；气不足于上的，推而候之；气稽留不至的，顺势迎之；必须明于经隧，才能把握。寒与热相争的，导而行之；那郁积陈血而未结的，顺势予之。必先明知二十五人，才能知血气之所在、左右上下，刺之要约就完备了。","notes":[],"pending":false}]},
{"id":"ls65","book":"灵枢","no":65,"title":"五音五味","titleTw":"五音五味","tags":["jingluo","zhenfa","bingji"],"brief":"以五音配五味五谷五畜五果与经脉脏腑，并论妇人、宦者、天宦不生须的原因与气血常数。","pending":false,"sections":[{"id":"ls65-1","tags":[],"yw":"右徵與少徵，調右手太陽二，左商與左徵，調左手陽明上。少徵與大宮，調左手陽明上，右角與大角，調右手少陽下。大徵與少徵，調左手太陽上，衆羽與少羽，調右足太陽下，少商與右商調右手太陽下，桎羽與衆羽，調右足太陽下，少宮與大宮，調右足陽明下，判角與少角，調右足少陽下，釱商與上商，調右足陽明下，釱商與上角，調左足太陽下。上徵與右徵同谷麥、畜羊、果杏，手少陰藏心，色赤味苦，時夏。上羽與大羽，同谷大豆，畜彘，果慄，足少陰藏腎，色黑味鹹，時冬。","bh":"右征与少征，调右手太阳上；左商与左征，调左手阳明上。少征与大宫，调左手阳明上；右角与大角，调右手少阳下。大征与少征，调左手太阳上；众羽与少羽，调右足太阳下；少商与右商，调右手太阳下；桎羽与众羽，调右足太阳下；少宫与大宫，调右足阳明下；判角与少角，调右足少阳下；釱商与上商，调右足阳明下；釱商与上角，调左足太阳下。上征与右征同谷麦、畜羊、果杏，手少阴藏心，色赤味苦，时夏。上羽与大羽同谷大豆、畜猪、果栗，足少阴藏肾，色黑味咸，时冬。","notes":[],"pending":false},{"id":"ls65-2","tags":[],"yw":"上宮與大宮同谷稷，畜牛，果棗，足太陰藏脾，色黃味甘，時季夏。上商與右商同谷黍，畜雞，果桃，手太陰藏肺，色白味辛，時秋。上角與大角，同谷麻、畜犬、果李，足厥陰藏肝，色青味酸，時春。大宮與上角，同右足陽明上，左角與大角，同左足陽明上，少羽與大羽同右足太陽下，左商與右商，同左手陽明上，加宮與大宮同左足少陽上，質判與大宮，同左手太陽下，判角與大角同左足少陽下，大羽與大角，同右足太陽上，大角與大宮同右足少陽上，右徵、少徵、質徵、上徵、判徵、右角、釱角、上角、大角、判角。","bh":"上宫与大宫同谷稷、畜牛、果枣，足太阴藏脾，色黄味甘，时季夏。上商与右商同谷黍、畜鸡、果桃，手太阴藏肺，色白味辛，时秋。上角与大角同谷麻、畜犬、果李，足厥阴藏肝，色青味酸，时春。大宫与上角同在右足阳明上；左角与大角同在左足阳明上；少羽与大羽同在右足太阳下；左商与右商同在左手阳明上；加宫与大宫同在左足少阳上；质判与大宫同在左手太阳下；判角与大角同在左足少阳下；大羽与大角同在右足太阳上；大角与大宫同在右足少阳上。五音又各分五等：右征、少征、质征、上征、判征，右角、釱角、上角、大角、判角。","notes":[],"pending":false},{"id":"ls65-3","tags":[],"yw":"右商、少商、釱商、上商、左商。少宮、上宮、大宮、加宮、左角宮。衆羽、桎羽、上羽、大羽、少羽。黃帝曰：婦人無須者，無血氣乎？岐伯曰：衝脈任脈皆起於胞中，上循背裏，爲經絡之海，其浮而外者，循腹右上行，會於咽喉，別而絡脣口，血氣盛則充膚熱肉，血獨盛者澹滲皮膚，生毫毛。今婦人之生有餘於氣，不足於血以其數脫血也，衝任之脈，不榮口脣，故須不生焉。黃帝曰：士人有傷於陰，陰氣絕而不起，陰不用，然其須不去，其故何也？宦者獨去何也？願聞其故。","bh":"右商、少商、釱商、上商、左商。少宫、上宫、大宫、加宫、左宫。众羽、桎羽、上羽、大羽、少羽。黄帝问：妇人无须，是没有血气吗？岐伯说：冲任二脉皆起于胞中，上循背里，为经络之海；它浮而在外的，循腹右上行，会于咽喉，别而络唇口。血气盛则充肤热肉，血独盛则渗灌皮肤而生毫毛。今妇人生理上有余于气、不足于血，因为她们屡次脱血，冲任之脉不荣口唇，所以须不生。黄帝问：有男子伤于阴，阴气绝而不起，阴不能用，然而他的须不脱落，是何缘故？宦者独独去须，又是何故？愿闻其故。","notes":[],"pending":false},{"id":"ls65-4","tags":[],"yw":"岐伯曰：宦者去其宗筋，傷其衝脈，血瀉不復，皮膚內結，脣口內榮故須不生。黃帝曰：其有天宦者，未嘗被傷，不脫於血，然其須不生其故何也？岐伯曰：此天之所不足也，其任衝不盛、宗筋不成，有氣無血，脣口不榮，故須不生。黃帝曰：善乎哉！聖人之通萬物也，若日月之光影，音聲鼓響，聞其聲而知其形，其非夫子，孰能明萬物之精。是故聖人，視其顏色黃赤者，多熱氣，青白者少熱氣，黑色者多血少氣，美眉者，太陽多血；通髯極須者，少陽多血，美須者陽明多血，此其時然也。","bh":"岐伯说：宦者割去宗筋，损伤冲脉，血泻不复，皮肤内结，唇口不荣，所以胡须不生。黄帝问：有天宦者未曾受伤，也不脱血，胡须却也不生，是什么缘故？岐伯说：这是先天不足，他的冲任不盛、宗筋不成，有气无血，唇口不荣，所以胡须不生。黄帝说：好啊！圣人通达万物，如日月之光影、音声之鼓响，闻声而知形，若非先生，谁能明了万物之精。所以圣人观色：黄赤者多热气，青白者少热气，黑色者多血少气；眉美的太阳多血，通髯极须的少阳多血，须美的阳明多血，这是时令禀赋使然。","notes":[],"pending":false},{"id":"ls65-5","tags":[],"yw":"夫人之常數，太陽常多血少氣，少陽常多氣少血，陽明常多血多氣，厥陰常多氣少血，少陰常多血少氣，太陰常多血少氣，此天之常數也。","bh":"人体的常数是：太阳经常多血少气，少阳经常多气少血，阳明经常多血多气，厥阴经常多气少血，少阴经常多血少气，太阴经常多血少气，这是上天所赋的常数。","notes":[],"pending":false}]},
{"id":"ls66","book":"灵枢","no":66,"title":"百病始生","titleTw":"百病始生","tags":["jingluo","zhenfa","bingji"],"brief":"论喜怒风雨清湿三部之气伤人各别，虚邪由浅入深传舍成积的过程及勿逆天时的补泻之治。","pending":false,"sections":[{"id":"ls66-1","tags":[],"yw":"黃帝問於岐伯曰：夫百病之始生也，皆於風雨寒暑，清溼喜怒，喜怒不節則傷髒，風雨則傷上，清溼則傷下。三部之氣所傷異類，願聞其會，岐伯曰：三部之氣各不同或起於陰或起於陽請言其方，喜怒不節則傷髒，髒傷則病起於陰也，清溼襲虛，則病起於下，風雨襲虛，則病起於上，是謂三部，至於其淫泆，不可勝數。黃帝曰：餘固不能數，故問先師願卒聞其道，岐伯曰：風雨寒熱不得虛，邪不能獨傷人。卒然逢疾風暴雨而不病者，蓋無虛，故邪不能獨傷人。","bh":"黄帝问岐伯说：百病之始生，都由于风雨寒暑、清湿喜怒。喜怒不节则伤脏，风雨则伤上部，清湿则伤下部。三部之气所伤不同类，愿闻其会通。岐伯说：三部之气各不同，或起于阴，或起于阳，请言其方：喜怒不节则伤脏，脏伤病起于阴；清湿袭虚，病起于下；风雨袭虚，病起于上，这就叫三部。至于其淫溢流传的变化，就不可胜数了。黄帝说：我本不能尽数，所以问先师，愿闻其道。岐伯说：风雨寒热不得虚，邪不能独伤人。猝然逢疾风暴雨而不病的，正因为无虚，所以邪不能独伤人。","notes":[],"pending":false},{"id":"ls66-2","tags":[],"yw":"此必因虛邪之風，與其身形，兩虛相得，乃客其形。兩實相逢，衆人肉堅，其中於虛邪也因於天時，與其身形，參以虛實，大病乃成，氣有定舍，因處爲名，上下中外，分爲三員。是故虛邪之中人也，始於皮膚，皮膚緩則腠理開，開則邪從毛發入，入則抵深，深則毛發立，毛發立則淅然，故皮膚痛。留而不去，則傳舍於絡脈，在絡之時，痛於肌肉，故痛之時息，大經代去，留而不去，傳舍於經，在經之時，灑淅喜驚。留而不去，傳舍於俞，在俞之時，六經不通四肢，則肢節痛，腰脊乃強，留而不去，傳舍於伏衝之脈，在伏衝之時體重身痛，留而不去，傳舍於腸胃，在腸腎之時，賁響腹脹，多寒則腸鳴飧泄，食不化，多熱則溏出糜。","bh":"这必因虚邪之风，与身形之虚，两虚相合，邪才客居于形。若是两实相逢，众人肌肉坚实，他们被虚邪所中，是因天时与身形相参，再凭虚实，大病乃成。邪气有定舍，因其处而命名，上下中外，分为三部。所以虚邪中伤人体，始于皮肤；皮肤弛缓则腠理开，开则邪从毛发而入，入则至深，深则毛发竖立而淅然恶寒，所以皮肤痛。留而不去，传舍于络脉，在络时痛在肌肉，痛作有时歇止，由大经代受而去。留而不去，传舍于经，在经时洒淅恶寒、易惊。留而不去，传舍于俞，在俞时六经不通四肢，肢节痛而腰脊强。留而不去，传舍于伏冲之脉，在此时体重身痛。留而不去，传舍于肠胃，在肠胃时贲响腹胀，多寒则肠鸣飧泄、食不化，多热则溏出糜。","notes":[],"pending":false},{"id":"ls66-3","tags":[],"yw":"留而不去，傳舍於腸胃之外，募原之間，留着於脈，稽留而不去，息而成積，或着孫脈，或着絡脈，或着經脈，或着俞脈，或着於伏衝之脈，或着於膂筋，或着於腸胃之募原，上連於緩筋，邪氣淫泆，不可勝論。黃帝曰：願盡聞其所由然。岐伯曰：其着孫絡之脈而成積者，其積往來上下，臂小孫絡之居也，浮而緩，不能句積而止之，故往來移行腸胃之間，水湊滲注灌，濯濯有音，有寒則(月真)(月真)滿雷引，故時切痛，其着於陽明之經則挾臍而居，飽食則益大，飢則益小。","bh":"留而不去，传舍于肠胃之外、募原之间，留着于脉，稽留不去，日久而成积。或着于孙脉，或着于络脉，或着于经脉，或着于俞脉，或着于伏冲之脉，或着于膂筋，或着于肠胃之募原，上连于缓筋，邪气淫溢，不可胜论。黄帝说：愿尽闻其所由然。岐伯说：着于孙络之脉而成积的，其积往来上下，因孙络所在浮浅而缓，不能拘积而止之，所以往来移行于肠胃之间，水液凑渗注灌，濯濯有声，有寒则胀满、雷鸣牵引，所以时作切痛。着于阳明之经的，挟脐而居，饱食则益大，饥则益小。","notes":[],"pending":false},{"id":"ls66-4","tags":[],"yw":"其着於緩筋也，似陽明之積，飽食則痛，飢則安。其着於腸胃之募原也，痛而外連於緩筋，飽食則安，飢則痛。其着於伏衝之脈者，揣之應手而動，發手則熱氣下於兩股，如湯沃之狀。其着於膂筋，在腸後者飢則積見，飽則積不見，按之不得。其着於輸之脈者，閉塞不通，津液不下，孔竅干壅，此邪氣之從外入內，從上下也。黃帝曰：積之始生，至其已成，奈何？岐伯曰：積之始生，得寒乃生，厥乃成積也，黃帝曰：其成積奈何？岐伯曰：厥氣生足悗，悗生脛寒，脛寒則血脈凝澀，血脈凝澀則寒氣上入於腸胃，入於腸胃則(月真)脹，(月真)脹則腸外之汁沫迫聚不得散，日以成積。","bh":"着于缓筋的，类似阳明之积，饱食则痛，饥则安。着于肠胃募原的，痛而外连于缓筋，饱食则安，饥则痛。着于伏冲之脉的，揣之应手而动，抬手则热气下行于两股，如热水浇灌之状。着于膂筋而在肠后的，饥则积见，饱则积不见，按之也摸不到。着于输脉的，闭塞不通，津液不下，孔窍干壅，这是邪气从外入内、从上而下的情况。黄帝问：积之始生至它已成，怎样？岐伯说：积之始生，得寒乃生，寒气厥逆上行才成积。黄帝问：它成积是怎样的？岐伯说：厥气生足闷，足闷生胫寒，胫寒则血脉凝涩，凝涩则寒气上入于肠胃，入肠胃则胀，胀则肠外汁沫被迫聚积不得散，日久而成积。","notes":[],"pending":false},{"id":"ls66-5","tags":[],"yw":"卒然多食飲，則腸滿，起居不節，用力過度，則絡脈傷，陽絡傷則血外溢，血外溢則衄血，陰絡傷則血內溢，血內溢則後血。腸胃之絡傷則血溢於腸外，腸外有寒，汁沫與血相搏，則並合凝聚不得散，而積成矣。卒然中外於寒，若內傷於憂怒，則氣上逆，氣上逆則六俞不通，溫氣不行，凝血蘊裏而不散，津液澀滲，着而不去，而積皆成矣。黃帝曰：其生於陰者，奈何？岐伯曰：憂思傷心，重寒傷肺，忿怒傷肝，醉以入房，汗出當風傷脾，用力過度，若入房汗出洛，則傷腎，此內外三部之所生病者也。","bh":"猝然多食饮则肠满，起居不节、用力过度则络脉伤。阳络伤则血外溢，血外溢则衄血；阴络伤则血内溢，血内溢则后血。肠胃之络伤则血溢于肠外，肠外有寒，汁沫与血相搏，则并合凝聚不得散，积就形成了。猝然外中于寒，若又内伤于忧怒，则气上逆，上逆则六俞不通，温气不行，凝血蕴里而不散，津液涩渗，着而不去，积也都形成了。黄帝问：那生于阴的怎样？岐伯说：忧思伤心，重寒伤肺，忿怒伤肝，醉以入房、汗出当风伤脾，用力过度，或入房汗出而浴则伤肾，这是内外三部之所生病。","notes":[],"pending":false},{"id":"ls66-6","tags":[],"yw":"黃帝曰：善治之奈何？岐伯答曰：察其所痛，以知其應，有餘不足，當補則補，當瀉則瀉，毋逆天時，是謂至治。","bh":"黄帝问：好。怎样治疗？岐伯答：审察所痛之处，以知相应的病变，辨有余不足，当补则补，当泻则泻，不违天时，这就叫至治。","notes":[],"pending":false}]},
{"id":"ls67","book":"灵枢","no":67,"title":"行针","titleTw":"行針","tags":["ci","bingji","zangxiang"],"brief":"本篇论针刺气至反应的六种不同表现，指出其由人体阴阳偏盛偏衰、气之浮沉迟速所致，并言针入气逆、数刺病剧皆医者之失。","pending":false,"sections":[{"id":"ls67-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞九針於夫子，而行之於百姓，百姓之血氣，各不同形，或神動而氣先針行；或氣與針相逢；或針已出，氣獨行；或數刺乃知；或發針而氣逆；或數刺病益劇。凡此六者，各不同形，願聞其方。岐伯曰：重陽之人，其神易動，其氣易往也。黃帝曰：何謂重陽之人？岐伯曰：重陽之人，熇熇高高，言語善疾，舉足善高，心肺之髒氣有餘，陽氣滑盛而揚，故神動而氣先行。黃帝曰：重陽之人而神不先行者，何也？岐伯曰：此人頗有陰者也。","bh":"黄帝问岐伯说：我从夫子那里听受了九针，并施行于百姓。百姓的血气各不相同：有的神气先动而后气随针行；有的气与针相逢；有的针已拔出而气仍独行；有的要多次针刺才有感应；有的进针后气逆；有的针刺多次而病反加重。这六种情况表现各异，希望听听其中的道理。岐伯说：重阳的人，他的神气容易触动，他的气容易往行。黄帝问：什么叫重阳的人？岐伯说：重阳的人，气势炽盛高昂，说话爽利而快，举足好高抬，心肺的脏气有余，阳气滑利充盛而外扬，所以神气一动而气先行。黄帝问：重阳的人也有神气不先行的，为什么呢？岐伯说：这种人多少也有些阴气。","notes":[],"pending":false},{"id":"ls67-2","tags":[],"yw":"黃帝曰：何以知其頗有陰者也。岐伯曰：多陽者，多喜；多陰者，多怒，數怒者，易解，故曰頗有陰。其陰陽之離合難，故其神不能先行也。黃帝曰：其氣與針相逢，奈何？岐伯曰：陰陽和調，而血氣淖澤滑利，故針入而氣出，疾而相逢也。黃帝曰：針已出而氣獨行者，何氣使然？岐伯曰：其陰氣多而陽氣少，陰氣沉而陽氣浮者內藏，故針已出，氣乃隨其後，故獨行也。黃帝曰：數刺乃知，何氣使然？岐伯曰：此人之多陰而少陽，其氣沉而氣往難，故數刺乃知也。","bh":"黄帝问：怎么知道他多少有些阴气呢？岐伯说：阳气多的人多喜，阴气多的人多怒，屡屡发怒的又容易消解，所以说他多少有些阴。他阴阳的离合困难，所以神气不能先行。黄帝问：气与针相逢，是怎样的？岐伯说：阴阳和调，血气濡润滑利，所以针一刺入气就随之而出，很快与之相逢。黄帝问：针已拔出而气独自行，是什么气使它这样？岐伯说：这种人阴气多而阳气少，阴气沉而阳气浮，浮阳内藏，所以针已拔出，气才随其后而行，所以说独行。黄帝问：多次针刺才有感应，是什么气使它这样？岐伯说：这种人多阴而少阳，他的气沉滞而气行困难，所以要多次针刺才有感应。","notes":[],"pending":false},{"id":"ls67-3","tags":[],"yw":"黃帝曰：針入而氣逆者，何氣使然？岐伯曰：其氣逆與其數刺病益甚者，非陰陽之氣，浮沉之勢也。此皆麤之所敗，工之所失，其形氣無過焉。","bh":"黄帝问：进针而气逆的，是什么气使它这样？岐伯说：那气逆以及多次针刺而病加重的，并不是阴阳之气浮沉的态势造成的，这都是粗工败坏、医者失误所致，病人的形气并没有过失。","notes":[],"pending":false}]},
{"id":"ls68","book":"灵枢","no":68,"title":"上膈","titleTw":"上膈","tags":["ci","jingluo","bingji"],"brief":"本篇论膈食病，区分上膈与下膈，说明虫寒积聚于下管成痈的病机、痈之浅深形症，以及浅刺傍痈、熨热引气的刺治之法。","pending":false,"sections":[{"id":"ls68-1","tags":[],"yw":"黃帝曰：氣爲上膈者，食飲入而還出，餘已知之矣。蟲爲下膈。下膈者，食焠時乃出，餘未得其意，願卒聞之。岐伯曰：喜怒不適，食飲不節，寒溫不時，則寒汁流於腸中。流於腸中則蟲寒，蟲寒則積聚，守於下管，則腸胃充郭，衛氣不營，邪氣居之。人食則蟲上食，蟲上食則下管虛，下管虛則邪氣勝之，積聚以留，留則癰成，癰成則下管約。其癰在管內者，即而痛深，其癰在外者，則癰外而痛浮，癰上皮熱。黃帝曰：刺之奈何？岐伯曰：微按其癰，視氣所行，先淺刺其傍，稍內益深，逐而刺之，毋過三行，察其沉浮，以爲深淺。","bh":"黄帝说：气所造成的上膈，饮食入口随即吐出，我已经知道了。虫所造成的下膈，是食物过了一晬时才吐出，我还不明白其中的意思，希望详尽地听听。岐伯说：喜怒不适度，饮食不节制，寒温不按时，就有寒汁流入肠中。寒汁流入肠中，虫就受寒，虫受寒就积聚，停守在下管，于是肠胃充廓胀满，卫气不能营运，邪气就留居在那里。人进食时虫上行求食，虫上行求食则下管空虚，下管空虚则邪气胜之，积聚因而留止，留止就成痈，痈成则下管拘约。痈在管内的，痛得深；痈在外的，则痈在外而痛浮浅，痈上的皮肤发热。黄帝问：怎样针刺？岐伯说：轻轻按抚痈处，观察气行的方向，先浅刺痈的旁边，再稍向内逐渐加深，循着气行之处依次而刺，不要超过三行，察其沉浮，以此决定针刺的深浅。","notes":[],"pending":false},{"id":"ls68-2","tags":[],"yw":"已刺必熨，令熱入中，日使熱內，邪氣益衰，大癰乃潰。伍以參禁，以除其內，恬憺無爲，乃能行氣，後以鹹苦，化谷乃下矣。","bh":"刺过之后必须用熨法，使热入于内，天天使热入于内，邪气就日渐衰减，大痈于是溃散。再配合参验禁忌的事项，以祛除内里的病邪，恬淡无为，才能使气运行，然后用咸苦之药，谷物得以消化，食物就下行了。","notes":[],"pending":false}]},
{"id":"ls69","book":"灵枢","no":69,"title":"忧恚无言","titleTw":"憂恚無言","tags":["ci","zhenfa","yinyang"],"brief":"本篇论突然失音之由，指出咽喉、喉咙、会厌等各司其职，寒气客于会厌则开阖失利而无音，并出泻足少阴血脉、取天突的刺法。","pending":false,"sections":[{"id":"ls69-1","tags":[],"yw":"黃帝問於少師曰：人之卒然憂恚，而言無音者，何道之塞？何氣出行？使音不彰？願聞其方。少師答曰：咽喉者，水谷之道也。喉嚨者，氣之所以上下者也。會厭者，聲音之戶也。口脣者，聲音之扇也。舌者，聲音之機也。懸壅垂者，聲音之關者。頏顙者，分氣之所泄也。橫骨者，神氣所使主發舌者也。故人之鼻洞涕出不收者，頏顙不開，分氣失也。是故厭小而疾薄，則發氣疾，其開闔利，其出氣易，其厭大而厚，則開闔難，其氣出遲，故重言也。人卒然無音者，寒氣客於厭，則厭不能發，發不能下，至其開闔不致，故無音。","bh":"黄帝问少师说：人突然因忧愁忿恨而说不出声音的，是什么道路闭塞？什么气出行不畅？使声音不彰？希望听听其中的道理。少师回答说：咽喉，是水谷的通道。喉咙，是气上下出入的通道。会厌，是声音的门户。口唇，是声音的门扇。舌，是声音的机枢。悬壅垂，是声音的关隘。颃颡，是分气外泄之处。横骨，是受神气所使、主司发动舌体的。所以人鼻流清涕而不收的，是颃颡不开、分气失职。因此会厌小而薄快的，出气就迅疾，开合便利，出气容易；会厌大而厚的，开合困难，出气迟缓，所以言语重浊謇涩。人突然失音的，是寒气客于会厌，会厌不能开启，或发而不能下，以致开合不到位，所以没有声音。","notes":[],"pending":false},{"id":"ls69-2","tags":[],"yw":"黃帝曰：刺之奈何？岐伯曰：足之少陰，上系於舌，絡於橫骨，終於會厭。兩瀉其血脈，濁氣乃避。會厭之脈，上絡任脈，取之天突，其厭乃發也。","bh":"黄帝问：怎样针刺？岐伯说：足少阴经，上系于舌，络于横骨，终止于会厌。两次泻其血脉，浊气就可避开。会厌的脉，上络于任脉，取天突穴，会厌就能开启发声。","notes":[],"pending":false}]},
{"id":"ls70","book":"灵枢","no":70,"title":"寒热","titleTw":"寒熱","tags":["ci","zhenfa","bingji"],"brief":"本篇论颈腋瘰疬（鼠瘘）寒热毒气留脉不去之病，提出从本引末的徐刺之法，并以目中赤脉是否贯瞳子及其条数决死生之期。","pending":false,"sections":[{"id":"ls70-1","tags":[],"yw":"黃帝問於岐伯曰：寒熱瘰?在於頸腋者，皆何氣使生？岐伯曰：此皆鼠?寒熱之毒氣也，留於脈而不去者也。黃帝曰：去之奈何？岐伯曰：鼠?之本，皆在於髒，其末上出於頸腋之間，其浮於脈中，而未內着於肌肉，而外爲膿血者，易去也。黃帝曰：去之奈何？岐伯曰：請從其本引其末，可使衰去，而絕其寒熱。審按其道以予之，徐往徐來以去之，其小如麥者，一刺知，三刺而已。黃帝曰：決其生死奈何？岐伯曰：反其目視之，其中有赤脈，上下貫瞳子，見一脈，一歲死；見一脈半，一歲半死；見二脈，二歲死；見二脈半，二歲半死；見三脈，三歲而死。","bh":"黄帝问岐伯说：寒热瘰疬生在颈腋的，都是什么气使它发生？岐伯说：这都是鼠瘘寒热的毒气，留滞在脉中而不能去的。黄帝问：怎样去除？岐伯说：鼠瘘的根本都在内脏，它的末上出于颈腋之间，那浮在脉中而还没有内着于肌肉、在外化为脓血的，容易去除。黄帝问：怎样去除？岐伯说：请从其根本引其末，可使病气衰减而去，并断绝其寒热。仔细按其经道而给予针刺，徐往徐来以祛除它，其小如麦粒的，刺一次就见效，刺三次就好了。黄帝问：怎样决断其生死？岐伯说：翻转其眼目来看，其中有赤脉，上下贯穿瞳子。见到一条赤脉的，一岁死；见到一条半的，一岁半死；见到两条的，二岁死；见到两条半的，二岁半死；见到三条的，三岁死。","notes":[],"pending":false},{"id":"ls70-2","tags":[],"yw":"見赤脈不下貫瞳子，可治也。","bh":"见到赤脉而没有向下贯穿瞳子的，可以治疗。","notes":[],"pending":false}]},
{"id":"ls71","book":"灵枢","no":71,"title":"邪客","titleTw":"邪客","tags":["jingluo","zhenfa","bingji"],"brief":"本篇论邪客脏腑致卫气不得入阴而目不瞑，示以半夏汤方；并列人体肢节与天地相应、持针纵舍之法及八虚候五脏之诊。","pending":false,"sections":[{"id":"ls71-1","tags":[],"yw":"黃帝問於伯高曰：夫邪氣之客人也，或令人目不瞑不臥出者，何氣使然？伯高曰：五谷入於胃也，其糟粕津液宗氣，分爲三隧。故宗氣積於胸中，出於喉嚨，以貫心脈，而行呼吸焉。營氣者，泌其津液，注之於脈，化以爲血，以榮四末，內注五髒六腑，以應刻數焉。節氣者，出其悍氣之慓疾，而先行於四末分肉皮膚之間，而不休者也。晝日行於陽，夜行於陰，常從足少陰之分間，行五髒六腑，今厥氣客於五髒六腑，則衛氣獨衛其外，行於陽，不得入於陰。","bh":"黄帝问伯高说：邪气侵犯人体，有的使人目不能闭、不能卧而外出的，是什么气使它这样？伯高说：五谷入于胃，它的糟粕、津液、宗气，分为三条隧道。所以宗气积聚于胸中，出于喉咙，以贯通心脉，而行呼吸。营气，泌其津液，注之于脉，化而为血，以荣养四肢末端，向内灌注五脏六腑，以应刻数。卫气（原文作节气），出其慓悍滑疾之气，先行于四肢末端、分肉皮肤之间而不休止，白昼行于阳，夜间行于阴，常从足少阴之分间，行于五脏六腑。如今厥气客于五脏六腑，则卫气只能卫护于外，行于阳，不得入于阴。","notes":[],"pending":false},{"id":"ls71-2","tags":[],"yw":"行於陽則陽氣盛，陽氣盛則陽橋陷，不得入於陰，陰虛，故目不瞑。黃帝曰：善。治之奈何？伯高曰：補其不足，瀉其有餘，調其虛實，以通其道，而去其邪。飲以半夏湯一劑，陰陽已通，其臥立至。黃帝曰：善。此所謂決瀆壅塞，經絡大通，陰陽和得者也。願聞其方。伯高曰：其湯方以流水千裏以外者八升，揚之萬遍，取其清五升，煮之，炊以葦薪火，沸置秫米一升，治半夏五合，徐炊，令竭爲一升半，去其滓，飲汁一小杯，日三稍益，以知爲度，故其病新發者，復杯則臥，汗出則已矣。","bh":"行于阳则阳气盛，阳气盛则阳𫏋（原文作阳桥）满陷，不得入于阴，阴虚，所以目不能闭。黄帝说：好。怎样治疗？伯高说：补其不足，泻其有余，调其虚实，以通其道，而祛其邪。饮以半夏汤一剂，阴阳已经相通，其卧立至。黄帝说：好。这就是所谓决开壅塞的沟渎，使经络大通，阴阳和得。希望听听它的方子。伯高说：这个汤方，用来自千里以外的流水八升，扬之万遍，取其清者五升来煮，用苇薪作燃料；煮沸后放入秫米一升、制半夏五合，慢慢炊煮，使它耗减为一升半，去其渣滓，饮汁一小杯，一日三次，逐渐加量，以见效为度。所以病新发的，饮尽一杯就能安卧，汗出就好了。","notes":[],"pending":false},{"id":"ls71-3","tags":[],"yw":"久者，三飲而已也。黃帝問於伯高曰：願聞人之肢節以應天地奈何？伯高答曰：天圓地方，人頭圓足方以應之。天有日月，人有兩目；地有九州，人有九竅；天有風雨，人有喜怒；天有雷電，人有聲音；天有四時，人有四肢；天有五音，人有五髒；天有六律，人有六腑；天有冬夏，人有寒熱；天有十曰，人有手十指；辰有十二，人有足十指，莖垂以應之，女子不足二節，以抱人形；天有陰陽，人有夫妻；歲有三百六十五日，人有三百六十五節；地有高山，人有肩膝；地有深谷，人有腋膕；地有十二經水，人有十二經脈；地有泉脈，人有衛氣；地有草蓂，人有毫毛；天有晝夜，人有臥起；天有列星，人有牙齒；地有小山，人有小節；地有山石，人有高骨；地有林木，人有募筋；地有聚邑，人有膕肉；歲有十二月，人有十二節；地有四時不生草，人有無子。","bh":"病程久的，三次饮服也就好了。黄帝问伯高说：希望听听人的肢节是怎样与天地相应的？伯高回答说：天圆地方，人头圆、足方以应之。天有日月，人有两目；地有九州，人有九窍；天有风雨，人有喜怒；天有雷电，人有声音；天有四时，人有四肢；天有五音，人有五脏；天有六律，人有六腑；天有冬夏，人有寒热；天有十日，人有手十指；辰有十二，人有足十指，加上茎、垂以应之，女子缺少这二节，以能抱持人形；天有阴阳，人有夫妻；岁有三百六十五日，人有三百六十五节；地有高山，人有肩膝；地有深谷，人有腋腘；地有十二经水，人有十二经脉；地有泉脉，人有卫气；地有草蓂，人有毫毛；天有昼夜，人有卧起；天有列星，人有牙齿；地有小山，人有小节；地有山石，人有高骨；地有林木，人有募筋；地有聚邑，人有腘肉；岁有十二月，人有十二节；地有四时不生草之处，人有不能生育的。","notes":[],"pending":false},{"id":"ls71-4","tags":[],"yw":"此人與天地相應者也。黃帝問於岐伯曰：餘願聞持針之數，內針之理，縱舍之意，扞皮開腠理，奈何？脈之屈折，出入之處，焉至而出，焉至而止，焉至而徐，焉至而疾，焉至而入，六腑之輸於身者，餘願盡聞其方。岐伯曰：帝之所問，針道畢矣。黃帝曰：願卒聞之。岐伯曰：手太陰之脈，出於大指之端，內屈，循白肉際，至本節之後太淵，留以澹，外屈，上於本節下，內屈，與陰諸絡會於魚際，數脈並注，其氣滑利，伏行壅骨之下，外屈，出於寸口而行，上至於肘內廉，入於大筋之下，內屈，上行臑陰，入腋下，內屈，走肺。","bh":"这就是人与天地相应的情况。黄帝问岐伯说：我希望听听持针的法度、进针的道理、纵舍的意思，以及扞皮开腠理是怎样的。脉的屈折、出入之处，从哪里出，到哪里止，到哪里徐缓，到哪里疾速，到哪里入；六腑输注于身的情况，我都希望详尽听听其中的道理。岐伯说：帝所问的，针道全在其中了。黄帝说：希望详尽听听。岐伯说：手太阴之脉，出于大指之端，向内屈，循白肉际，至本节之后的太渊，留以澹荡，向外屈，上于本节之下，向内屈，与阴诸络会于鱼际，数脉并注，其气滑利，伏行于壅骨（大指本节后的高骨）之下，向外屈，出于寸口而行，上至于肘内廉，入于大筋之下，向内屈，上行臑阴，入腋下，向内屈，走于肺。","notes":[],"pending":false},{"id":"ls71-5","tags":[],"yw":"此順行逆數之屈折也。心主之脈，出於中指之端，內屈，循中指內廉以上，留於掌中，伏行兩骨之間，外屈，出兩筋之間，上至肘內廉，入於小筋之下，留兩骨之會，上入於胸中，內絡於心脈。黃帝曰：手太陰之脈，獨無俞，何也？岐伯曰：少陰，心脈也。心者，五髒六腑之大主也，精神之所舍也，其髒堅固，邪弗能容也。容之則心傷，心傷則神去，神去則死矣。故諸邪之在於心者，皆在於心之包絡。包絡者，心主之脈也，故獨無俞焉。黃帝曰：少陰獨無俞者，不病乎？岐伯曰：其外經病而藏不病，故獨取其經於掌後銳骨之端。","bh":"这是顺行逆数的屈折。心主之脉，出于中指之端，向内屈，循中指内廉以上，留于掌中，伏行两骨之间，向外屈，出于两筋之间，上至肘内廉，入于小筋之下，留于两骨之会，上入于胸中，内络于心脉。黄帝问：手少阴之脉（原文作手太阴）独无俞穴，为什么？岐伯说：少阴，是心脉。心是五脏六腑的大主，精神所舍之处，它的脏坚固，邪不能容；容之则心伤，心伤则神去，神去就死了。所以诸邪之在于心的，都在于心之包络。包络，是心主之脉，所以（心）独无俞。黄帝问：少阴独无俞，就不病吗？岐伯说：它的外经病而脏不病，所以只取其经于掌后锐骨之端。","notes":[],"pending":false},{"id":"ls71-6","tags":[],"yw":"其餘脈出入屈折，其行之徐疾，皆如手少陰心主之脈行也。故本俞者，皆因其氣之虛實疾徐以取之，是謂因衝而瀉，因衰而補，如是者，邪氣得去，真氣堅固，是謂因天之序。黃帝曰：持針縱舍奈何？岐伯曰：必先明知十二經脈之本末，皮膚之寒熱，脈之盛衰滑澀。其脈滑而盛者，病日進；虛而細者，久以持；大以澀者，爲痛痹。陰陽如一者，病難治。其本末尚熱者，病尚在；其熱以衰者，其病亦去矣。持其尺，察其肉之堅脆，大小滑澀，寒溫燥溼。","bh":"其余各脉的出入屈折，它运行的徐疾，都如同手少阴心主之脉的循行。所以本俞，都是根据气的虚实疾徐以取之，这叫做因冲（气盛）而泻，因衰而补。这样，邪气得以祛除，真气得以坚固，这叫做因天之序。黄帝问：持针纵舍怎样？岐伯说：必须先明确知道十二经脉的本末，皮肤的寒热，脉的盛衰滑涩。其脉滑而盛的，病日进；虚而细的，久以持久；大而涩的，为痛痹。阴阳如一的，病难治。其本末尚热的，病尚在；其热已衰的，其病也去了。持其尺（诊尺肤），察其肉的坚脆、大小、滑涩、寒温、燥湿。","notes":[],"pending":false},{"id":"ls71-7","tags":[],"yw":"因視目之五色，以知五髒，而決死生。視其血脈，察其色，以知其寒熱痛痹。黃帝曰：持針縱舍，餘未得其意也。岐伯曰：持針之道，欲端以正，安以靜。先知虛實而行疾徐。左手執骨，右手循之。無與肉果。瀉欲端以正，補必閉膚。輔針導氣，邪得淫泆，真氣得居。黃帝曰：扞皮開腠理奈何？岐伯曰：因其分肉，左別其膚，微內而徐端之，適神不散，邪氣得去。黃帝問於岐伯曰：人有八虛，各何以候？岐伯答曰：以候五髒。黃帝曰：候之奈何？岐伯曰：肺心有邪，其氣留於兩肘；肝有邪，其氣流於兩腋；脾有邪，其氣留於兩髀；腎有邪，其氣留於兩膕。","bh":"再视目之五色，以知五脏，而决死生；视其血脉，察其色，以知其寒热痛痹。黄帝说：持针纵舍，我还没有明白它的意思。岐伯说：持针之道，要端正而正，安详而静。先知虚实，而后行疾徐。左手执骨，右手循之，不要被肌肉果（缠裹）住。泻要端正而正，补必闭合皮肤（针孔）。辅针导气，使邪得以外泄散溢，真气得以安居。黄帝问：扞皮开腠理怎样？岐伯说：顺着分肉，左手别开其皮肤，微入针而慢慢端正地刺入，适神不散，邪气得以祛除。黄帝问岐伯说：人有八虚，各用以候什么？岐伯回答说：用以候五脏。黄帝问：怎样候？岐伯说：肺心有邪，其气留于两肘；肝有邪，其气流于两腋；脾有邪，其气留于两髀；肾有邪，其气留于两腘。","notes":[],"pending":false},{"id":"ls71-8","tags":[],"yw":"凡此八虛者，皆機關之室，真氣之所過，血絡之所遊。邪氣惡血，固不得住留。住留則傷筋絡骨節；機關不得屈伸，故痀攣也。","bh":"凡此八虚，都是机关之室，真气所经过、血络所游行之处，邪气恶血本不能住留。住留则伤筋络骨节，机关不得屈伸，所以发生拘挛（痀挛）。","notes":[],"pending":false}]},
{"id":"ls72","book":"灵枢","no":72,"title":"通天","titleTw":"通天","tags":["ci","jingluo","zhenfa"],"brief":"本篇按阴阳多少将人分为太阴、少阴、太阳、少阳、阴阳和平五态，述其性情、体态、气血筋脉特点与相应的针刺补泻宜忌。","pending":false,"sections":[{"id":"ls72-1","tags":[],"yw":"黃帝問於少師曰：餘嘗聞人有陰陽，何謂陰人？何謂陽人？少師曰：天地之間，六合之內，不離於五，人亦應之，非徒一陰一陽而已也，而略言耳，口弗能遍明也。黃帝曰：願略聞其意，有賢人聖人，心能備而行之乎？少師曰：蓋有太陰之人，少陰之人，太陽之人，少陽之人，陰陽和平之人。凡五人者，其態不同，其筋骨氣血各不等。黃帝曰：其不等者，可得聞乎？少師曰：太陰之人，貪而不仁，下齊湛湛，好內而惡出，心和而不發，不務於時，動而後之，此太陰之人也。","bh":"黄帝问少师说：我曾听说人有阴阳，什么叫阴人？什么叫阳人？少师说：天地之间，六合之内，不离于五，人也与之相应，并非只是一阴一阳而已，那只是约略而言，口不能遍举说明。黄帝说：希望约略听听其意，有贤人圣人，其心能完备而实行它吗？少师说：大概有太阴之人、少阴之人、太阳之人、少阳之人、阴阳和平之人。这五种人，他们的形态不同，筋骨气血各不相等。黄帝问：那不相等的，可以听听吗？少师说：太阴之人，贪婪而不仁，谦下自守而深藏不露，好进而不愿出，心气和而不外发，不趋赴时务，行动落在人后，这就是太阴之人。","notes":[],"pending":false},{"id":"ls72-2","tags":[],"yw":"少陰之人，小貪而賊心，見人有亡，常若有得，好傷好害，見人有榮，乃反慍怒，心疾而無恩，此少陰之人也。太陽之人，居處於於，好言大事，無能而虛說，志發乎四野，舉措不顧是非，爲事如常自用，事雖敗，而常無悔，此太陽之人也。少陽之人，諟諦好自責，有小小官，則高自宜，好爲外交，而不內附，此少陽之人也。陰陽和平之人，居處安靜，無爲懼懼，無爲欣欣，婉然從物，或與不爭，與時變化，尊則謙謙，譚而不治，是謂至治。古之善用針艾者，視人五態，乃治之。","bh":"少阴之人，贪小利而有贼害之心，见人有损失，常像自己得了好处，好伤好害，见人有荣耀，反而愠怒，心性忌刻而无恩义，这就是少阴之人。太阳之人，居处自得，好言大事，无能而空谈，志气发扬于四野，举措不顾是非，做事常自以为是，事情虽已败坏，而常常不后悔，这就是太阳之人。少阳之人，审谛好自责，有个小小的官职，就高自矜宜，好对外交结，而不内附，这就是少阳之人。阴阳和平之人，居处安静，无所畏惧，也不过分欣喜，婉然顺从外物，或与之而不争，随时变化，尊贵时谦谦有礼，以言谈开导而不施治法，这就叫至治。古代善用针艾的，观察人的五态，然后治之。","notes":[],"pending":false},{"id":"ls72-3","tags":[],"yw":"盛者瀉之，虛者補之。黃帝曰：治人之五態奈何？少師曰：太陰之人，多陰而無陽，其陰血濁，其衛氣澀，陰陽不和，緩筋而厚皮，不之疾瀉，不能移之。少陰之人，多陰少陽，小胃而大腸，六腑不調，其陽明脈小，而太陽脈大，必審調之，其血易脫，其氣易敗也。太陽之人，多陽而少陰，必謹調之，無脫其陰，而瀉其陽。陽重脫者易狂，陰陽皆脫者，暴死，不知人也。少陽之人，多陽少陰，經小而絡大，血在中而氣外，實陰而虛陽。獨瀉其絡脈，則強氣脫而疾，中氣不足，病不起也。","bh":"盛的泻之，虚的补之。黄帝问：治疗这五态之人怎样？少师说：太阴之人，多阴而无阳，他的阴血浊，卫气涩，阴阳不和，筋缓而皮厚，不急泻之，不能改变它。少阴之人，多阴少阳，胃小而肠大，六腑不调，他的阳明脉小而太阳脉大，必须审慎调治，他的血易脱，他的气易败。太阳之人，多阳而少阴，必须谨慎调治，不要脱其阴，而泻其阳。阳重脱的易发狂，阴阳皆脱的，暴死，不省人事。少阳之人，多阳少阴，经小而络大，血在中而气在外，当实其阴而虚其阳。若只泻其络脉，则强气（阳）脱失而急骤，中气不足，病就不能起了。","notes":[],"pending":false},{"id":"ls72-4","tags":[],"yw":"陰陽和平之人，其陰陽之氣和，血脈調，謹診其陰陽，視其邪正，安容儀，審有餘不足，盛則瀉之，虛則補之，不盛不虛，以經取之，此所以調陰陽，別五態之人者也。黃帝曰：夫五態之人者，相與毋故，卒然新會，未知其行也，何以別之？少師答曰：衆人之屬，不知五態之人者，故五五二十五人，而五態之人不與焉。五態之人，尤不合於衆者也。黃帝曰：別五態之人，奈何？少師曰：太陰之人，其狀黮黮然黑色，念然下意，臨臨然長大，膕然未僂，此太陰之人也。","bh":"阴阳和平之人，他的阴阳之气和调，血脉调匀，谨慎诊其阴阳，视其邪正，安定容仪，审其有余不足，盛则泻之，虚则补之，不盛不虚的，以经取之，这就是用以调阴阳、辨别五态之人的方法。黄帝问：这五态之人，与我素无旧交，突然初次相会，不知他的行为，怎样辨别？少师回答说：众人之属，不属于五态之人的，又有五五二十五人，而五态之人不在这二十五人之中。五态之人，尤其与众人不同。黄帝问：辨别五态之人怎样？少师说：太阴之人，其状面色黮黮然发黑，意念下抑，身体临临然长大，膝腘微屈而尚未伛偻，这就是太阴之人。","notes":[],"pending":false},{"id":"ls72-5","tags":[],"yw":"少陰之人，其狀清然竊然，固以陰賊，立而躁嶮，行而似伏，此少陰之人也。太陽之人，其狀軒軒儲儲，反身折膕，此太陽之人也。少陽之人，其狀立則好仰，行則好搖，其兩臂兩肘，則常出於背，此少陽之人也。陰陽和平之人，其狀委委然，隨隨然，顒顒然，愉愉然，(目旋)(目旋)然，豆豆然，衆人皆曰君子，此陰陽和平之人也。","bh":"少阴之人，其状清然窃然，固执而阴险贼害，站立时躁动险仄，行走时身形似伏，这就是少阴之人。太阳之人，其状轩轩储储，反折其身而屈其膝腘，这就是太阳之人。少阳之人，其状站立时好仰身，行走时好摇摆，他的两臂两肘常常反出于背，这就是少阳之人。阴阳和平之人，其状委委然（雍容自得），随随然（和顺），颙颙然（庄重），愉愉然（和悦），目光温润有神，举止端方不乱，众人都称他君子，这就是阴阳和平之人。","notes":[],"pending":false}]},
{"id":"ls73","book":"灵枢","no":73,"title":"官能","titleTw":"官能","tags":["ci","bingji","zangxiang"],"brief":"本篇总论用针之理、五俞徐疾、补泻方圆之法与必知天忌，强调上工救其萌芽，并论依各人才能分派职事的官能之选。","pending":false,"sections":[{"id":"ls73-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞九針於夫子，衆多矣不可勝數，餘推而論之，以爲一紀。餘司誦之，子聽其理，非則語餘，請正其道，令可久傳後世無患，得其人乃傳，非其人勿言。岐伯稽首再拜曰：請聽聖王之道。黃帝曰：用針之理，必知形氣之所在，左右上下，陰陽表裏，血氣多少，行之逆順，出入之合，謀伐有過。知解結，知補虛瀉實，上下氣門，明通於四海。審其所在，寒熱淋露以輸異處，審於調氣，明於經隧，左右肢絡，盡知其會。寒與熱爭，能合而調之，虛與實鄰，知決而通之，左右不調，把而行之，明於逆順，乃知可治，陰陽不奇，故知起時。","bh":"黄帝问岐伯说：我听夫子讲九针，内容众多不可胜数，我推求而论述它，编为一纪。我主持诵习它，你听其中的道理，不对的就告诉我，请订正其中的道，使它可长久传于后世而无祸患，得其人才传授，不是其人就不说。岐伯稽首再拜说：请听圣王之道。黄帝说：用针之理，必知形气之所在，左右上下，阴阳表里，血气多少，运行的逆顺，出入的会合，谋伐有过之处。知道解散郁结，知道补虚泻实，上下的气门，明白通于四海。审察其所在，寒热淋露（困顿疲败）以输注于不同之处，审慎于调气，明白于经隧，左右肢络，尽知其会合。寒与热相争，能合而调之；虚与实相邻，知决而通之；左右不调，把持而行之；明于逆顺，才知可治；阴阳不偏（奇），所以知病起之时。","notes":[],"pending":false},{"id":"ls73-2","tags":[],"yw":"審於本末，察其寒熱，得邪所在，萬刺不殆。知官九針，刺道畢矣。明於五俞徐疾所在，屈伸出入，皆有條理。言陰與陽，合於五行，五髒六腑，亦有所藏，四時八風，盡有陰陽。各得其位，合於明堂，各處色部，五髒六腑。察其所痛，左右上下，知其寒溫，何經所在。審皮膚之寒溫滑澀，知其所苦，膈有上下，知其氣所在。先得其道，稀而疏之，稍深以留，故能徐入之。大熱在上，推而下之；從上下者，引而去之；視前痛者，常先取之。大寒在外，留而補之；入於中者，從合瀉之。","bh":"审察疾病的本末，察其寒热，得邪之所在，针刺万次也不危殆。知道九针的职用（官九针），针道就完备了。明白五俞（五输穴）徐疾之所在，屈伸出入，都有条理。说到阴与阳，合于五行；五脏六腑，也各有所藏；四时八风，尽有阴阳。各得其位，合于明堂（色诊部位），五脏六腑各处在相应的色部。察其所痛，左右上下，知其寒温，何经所在。审皮肤的寒温滑涩，知其所苦；膈有上下，知其气之所在。先得其道，稀疏而疏之，稍深以留针，所以能徐徐入之。大热在上的，推而下之；从上下者，引而去之；见前面疼痛的，常先取之。大寒在外的，留针而补之；入于中的，从合穴泻之。","notes":[],"pending":false},{"id":"ls73-3","tags":[],"yw":"針所不爲，灸之所宜。上氣不足，推而揚之；下氣不足，積而從之；陰陽皆虛，火自當之。厥而寒甚，骨廉陷下，寒過於膝，下陵三裏。陰絡所過，得之留止，寒入於中，推而行之；經陷下者，火則當之；結絡堅緊，火所治之。不知所苦，兩蹻之下，男陰女陽，良工所禁，針論畢矣。用針之服，必有法則，上視天光，下司八正，以辟奇邪，而觀百姓，審於虛實，無犯其邪。是得天之靈，遇歲之虛，救而不勝，反受其殃，故曰必知天忌，乃言針意。法於往古，驗於來今，觀於窈冥，通於無窮。","bh":"针所不能为的，是灸之所宜。上气不足，推而扬之；下气不足，积而聚之；阴阳皆虚，用火（灸）自当之。厥逆而寒甚，骨廉陷下（肌肉瘦削、骨棱下陷），寒过于膝，取下陵三里。阴络所过之处，得病留止，寒入于中，推而行之；经陷下的，用火当之；结络坚紧的，是火所治的。不知其所苦的，取两𫏋之下，男阴女阳，是良工所禁的。针论到此完毕。用针之事，必有法则：上视天光，下司八正，以避奇邪，而观察百姓，审于虚实，不要触犯其邪。这样得遇天时之灵，若遇岁之虚，救治而不能胜任，反受其殃，所以说必知天忌，才谈得上针意。取法于往古，验证于来今，观察于窈冥，通达于无穷。","notes":[],"pending":false},{"id":"ls73-4","tags":[],"yw":"麤之所不見，良工之所貴。莫知其形，若神髣佛。邪氣之中人也，灑淅動形；正邪之中人也，微先見於色，不知於其身，若有若無，若亡若存，有形無形，莫知其情。是故上工之取氣，乃救其萌芽；下工守其已成，因敗其形。是故工之用針也，知氣之所在，而守其門戶，明於調氣，補瀉所在，徐疾之意，所取之處。瀉必用員，切而轉之，其氣乃行，疾而徐出，邪氣乃出，伸而迎之，遙大其穴，氣出乃疾。補必用方，外引其皮，令當其門，左引其樞，右推其膚，微旋而徐推之，必端以正，安以靜，堅心無解，欲微以留，氣下而疾出之，推其皮，蓋其外門，真氣乃存。","bh":"粗工所看不见的，正是良工所宝贵的；不知道它的形迹，好像神灵恍惚一般。邪气之中人，使人洒淅恶寒而形体颤动；正邪之中人，微先见于气色，身上并不察觉，若有若无，若亡若存，有形无形，不知它的情状。所以上工之取气，是救其萌芽；下工守其已成之病，因而败坏其形。所以医工之用针，知气之所在，而守其门户，明于调气，知补泻之所在、徐疾之意、所取之处。泻必用圆（圆活流利），切而转之，其气乃行，疾而徐出（快进慢出），邪气乃出，伸而迎之，摇大其针孔，气出乃快。补必用方（方正安静），向外牵引其皮，令正当其门，左引其枢，右推其肤，微旋而徐推之，必端以正，安以静，心志坚定不懈，欲微以留针，气下而疾出之，推其皮，盖其外门，真气乃存。","notes":[],"pending":false},{"id":"ls73-5","tags":[],"yw":"用針之要，無忘其神。雷公問於黃帝曰：針論曰：得其人乃傳，非其人勿言，何以知其可傳？黃帝曰：各得其人，任之其能，故能明其事。雷公曰：願聞官能奈何？黃帝曰：明目者，可使視色；聰耳者，可使聽音；捷疾辭語者，可使傳論；語徐而安靜，手巧而心審諦者，可使行針艾，理血氣而調諸逆順，察陰陽而兼諸方。緩節柔筋而心和調者，可使導引行氣；疾毒言語輕人者，可使唾癰?病；爪苦手毒，爲事善傷者，可使按積抑痹。各得其能，方乃可行，其名乃彰。","bh":"用针之要，无忘其神。雷公问黄帝说：《针论》说：得其人乃传，非其人勿言，怎么知道他可以传授？黄帝说：各得其人，任之以他的才能，所以能明其事。雷公说：希望听听官能怎样？黄帝说：眼明的，可使他视色；耳聪的，可使他听音；言辞捷疾的，可使他传讲论述；言语徐缓而安静、手巧而心审谛的，可使他行针艾，理血气而调诸逆顺，察阴阳而兼诸方。关节舒缓、筋脉柔和而心和调的，可使他导引行气；言语疾毒而轻人的，可使他咒（唾）痈肿之病；手爪狠毒、做事善伤的，可使他按积抑痹（按摩积聚、痹痛）。各得其能，方法才可施行，其名才会彰显。","notes":[],"pending":false},{"id":"ls73-6","tags":[],"yw":"不得其人，其功不成，其師無名。故曰：得其人乃言，非其人勿傳，此之謂也。手毒者，可使試按龜，置龜於器下，而按其上，五十日而死矣，手甘者，復生如故也。","bh":"不得其人，那功效不能成就，其师也没有名声。所以说：得其人乃言，非其人勿传，说的就是这个。手毒的，可让他试着按龟：把龟放在器皿之下，而在器皿上面按它，五十日龟就死了；手甘的，龟仍复活如故。","notes":[],"pending":false}]},
{"id":"ls74","book":"灵枢","no":74,"title":"论疾诊尺","titleTw":"論疾診尺","tags":["zhenfa","bingji","yinyang"],"brief":"本篇论独取尺肤以诊病，据尺之缓急小大滑涩寒热及目、齿、爪、掌、肘等处寒热色脉，以定病位、病性、死生与四时之序。","pending":false,"sections":[{"id":"ls74-1","tags":[],"yw":"黃帝問岐伯曰：餘欲無視色持脈，獨調其尺，以言其病，從外知內，爲之奈何？岐伯曰：審其尺之緩急小大滑澀，肉之堅脆，而病形定矣。視人之目窠上微癰，如新臥起狀，其頸脈動，時咳，按其手足上，窅而不起者，風水膚脹也。尺膚滑，其淖澤者，風也。尺肉弱者，解並，安臥脫肉者，寒熱，不治。尺膚滑而澤脂者，風也。尺膚澀者，風痹也。尺膚麤如枯魚之鱗者，水泆飲也。尺膚熱甚，脈盛躁者，病溫也，其脈甚而滑者，病且出也。尺膚寒，其脈小者，泄、少氣。","bh":"黄帝问岐伯说：我想不望色、不持脉，只调（诊）其尺，以言其病，从外知内，该怎样做？岐伯说：审察尺肤的缓急、小大、滑涩，肌肉的坚脆，病形就确定了。看人目窠（眼睑）上微微浮肿，如刚睡醒起来的样子，其颈脉动，时时咳嗽，按其手足上，凹陷而不起的，是风水肤胀。尺肤滑而濡润光泽的，是风。尺肉弱的，是解㑊（困倦懈惰）；安卧而脱肉的，是寒热，不治。尺肤滑而泽如脂的，是风。尺肤涩的，是风痹。尺肤粗糙如枯鱼之鳞的，是水溢饮。尺肤热甚、脉盛而躁的，是病温；其脉盛而滑的，病将外出。尺肤寒、其脉小的，是泄、少气。","notes":[],"pending":false},{"id":"ls74-2","tags":[],"yw":"尺膚炬然，先熱後寒者，寒熱也；尺膚先寒，久大之而熱者，亦寒熱也。肘所獨熱者，腰以上熱；手所獨熱者，腰以下熱。肘前獨熱者，膺前熱；肘後獨熱者，肩背熱。臂中獨熱者，腰腹熱；肘後麤以下三四寸熱者，腸中有蟲。掌中熱者，腹中熱；掌中寒者，腹中寒。魚上白肉有青血脈者，胃中有寒。尺炬然熱，人迎大者，當本血；尺堅大，脈小甚，少氣，免有加，立死。目赤色者病在心，白在肺，青在肝，黃在脾，黑在腎。黃色不可名者，病在胸中。","bh":"尺肤灼然发热，先热后寒的，是寒热病；尺肤先寒，久按之而发热的，也是寒热病。肘部独热的，腰以上热；手部独热的，腰以下热。肘前独热的，膺前（胸前）热；肘后独热的，肩背热。臂中独热的，腰腹热；肘后粗处以下三四寸热的，肠中有虫。掌中热的，腹中热；掌中寒的，腹中寒。鱼际上白肉有青色血脉的，胃中有寒。尺肤灼热、人迎脉大的，当是夺血；尺肤坚大、脉小甚、少气的，若再有加重，立死。目现赤色的病在心，白在肺，青在肝，黄在脾，黑在肾。黄色而不可名状的，病在胸中。","notes":[],"pending":false},{"id":"ls74-3","tags":[],"yw":"診目痛，赤脈從上下者，太陽病；從下上者，陽明病；從外走內者，少陽病。診寒熱，赤脈上下至瞳子，見一脈一歲死；見一脈半，一歲半死；見二脈，二歲死；見二脈半，二歲半死；見三脈，三歲死。診齲齒痛，按其陽之來，有過者獨熱，在左左熱，在右右熱，在上上熱，在下下熱。診血脈者，多赤多熱，多青多痛，多黑爲久痹，多赤、多黑、多青皆見者，寒熱。身痛而色微黃，齒垢黃，爪甲上黃，黃疸也。安臥小便黃赤，脈小而澀者不嗜食。人病，其寸口之脈，與人迎之脈小大等，及其浮沉等者，病難已也。","bh":"诊目痛，赤脉从上向下的，是太阳病；从下向上的，是阳明病；从外走内的，是少阳病。诊寒热，赤脉上下行至瞳子，见一条脉的一岁死；见一条半的，一岁半死；见两条的，二岁死；见两条半的，二岁半死；见三条的，三岁死。诊龋齿痛，按其阳脉来的经道，有病变的独热，在左则左热，在右则右热，在上则上热，在下则下热。诊血脉，多赤多热，多青多痛，多黑为久痹，赤、黑、青都见的，是寒热。身痛而色微黄，齿垢黄，爪甲上黄，是黄疸。安卧、小便黄赤、脉小而涩的，不嗜食。人患病，其寸口之脉与人迎之脉小大相等，以及浮沉相等的，病难以痊愈。","notes":[],"pending":false},{"id":"ls74-4","tags":[],"yw":"女子手少陰脈動甚者妊子。嬰兒病，其頭毛皆逆上者必死。耳間青脈起者掣痛。大便赤瓣飧泄，脈小者，手足寒，難已；飧泄，脈小，手足溫，泄易也。四時之變，寒暑之勝，重陰必陽，重陽必陰；故陰主寒，陽主熱，故寒甚則熱，熱甚則寒，故曰寒生熱，熱生寒，此陰陽之變也。故曰：冬傷於寒，春生病熱；春傷於風，夏生飧泄腸僻，夏傷於暑，秋生瘧；秋傷於溼，冬生咳嗽。是謂四時之序也。","bh":"女子手少阴脉动甚的，是怀孕。婴儿病，其头毛都逆上的，必死。耳间青脉起的，是掣痛（抽搐疼痛）。大便赤瓣飧泄、脉小的，手足寒，难愈；飧泄、脉小、手足温的，泄易愈。四时之变，寒暑之胜，重阴必阳，重阳必阴；所以阴主寒，阳主热，所以寒甚则热，热甚则寒，所以说寒生热，热生寒，这是阴阳之变。所以说：冬伤于寒，春生病热；春伤于风，夏生飧泄肠澼；夏伤于暑，秋生疟；秋伤于湿，冬生咳嗽。这就叫四时之序。","notes":[],"pending":false}]},
