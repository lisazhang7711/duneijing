{"id":"sw25","book":"素问","no":25,"title":"宝命全角论","titleTw":"寶命全角論","tags":["ci","zhenfa","bingji"],"brief":"论人以天地之气生，针刺治病必先治神，针有悬布天下的五法，并述刺实刺虚、补泻候气的要则。","pending":false,"sections":[{"id":"sw25-1","tags":[],"yw":"黃帝問曰∶天復地載，萬物悉備，莫貴於人，人以天地之氣生，四時之法成，君王衆庶，盡欲全角，形之疾病，莫知其情，留淫日深，着於骨髓，心私慮之。餘欲針除其疾病，爲之奈何？岐伯對曰∶夫鹽之味鹹者，其氣令器津泄；弦絕者，其音嘶敗；木敷者，其葉發；病深者，其聲噦。人有此三者，是謂壞府，毒藥無治，短針無取，此皆絕皮傷肉，血氣爭黑。帝曰∶餘念其痛，心爲之亂惑反甚，其病不可更代，百姓聞之，以爲殘賊，爲之奈何？岐伯曰∶夫人生於地，懸命於天，天地合氣，命之曰人。","bh":"黄帝问道：天复盖、地承载，万物齐备，没有比人更宝贵的。人禀天地之气而生，依四时之法而成，君王与庶民都想要保全形体；而形体有了疾病，不知其情，病邪留淫日深，着于骨髓，我心中私下忧虑。我想用针除去其疾病，该怎样做？岐伯回答说：盐味咸的，其气能使器物渗出水液；琴弦将要断绝的，其音嘶败；树木敷荣过度的，其叶反而发散；病深的人，其声哕（呃逆）。人有这三种现象，就叫做坏府（脏腑败坏），毒药不能治，短针不能取，这都是皮肉受伤、血气相争而色黑。黄帝说：我念及病人的痛苦，心中为此乱惑而更加严重，其病不可更代，百姓听说后，以为是残贼，怎么办？岐伯说：人生于地，悬命于天，天地合气，就叫做人。","notes":[],"pending":false},{"id":"sw25-2","tags":[],"yw":"人能應四時者，天地爲之父母；知萬物者，謂之天子。天有陰陽，人有十二節；天有寒暑，人有虛實。能經天地陰陽之化者，不失四時；知十二節之理者，聖智不能欺也；能存八動之變，五勝更立；能達虛實之數者，獨出獨入，吟至微，秋毫在目。帝曰∶人生有形，不離陰陽，天地合氣，別爲九野，分爲四時，月有小大，日有短長，萬物並至，不可勝量，虛實吟，敢問其方？岐伯曰∶木得金而伐，火得水而滅，土得木而達，金得火而缺，水得土而絕，萬物盡然，不可勝竭。","bh":"人能顺应四时的，天地就是他的父母；知道万物的，叫做天子。天有阴阳，人有十二节（十二大关节）；天有寒暑，人有虚实。能经历天地阴阳之化的，不失四时；知道十二节之理的，圣智也不能欺瞒他；能存察八动之变、五胜更立，能通达虚实之数的，就能独出独入，呿吟（呼吸开合）至微，秋毫在目。黄帝说：人生有形，不离阴阳，天地合气，别为九野，分为四时，月有小大，日有短长，万物并至，不可胜量，虚实呿吟，请问其方法？岐伯说：木得金而伐，火得水而灭，土得木而达，金得火而缺，水得土而绝，万物都是这样，不可穷尽。","notes":[],"pending":false},{"id":"sw25-3","tags":[],"yw":"故針有懸布天下者五，黔首共餘食，莫知之也。一曰治神，二曰知養身，三曰知毒藥爲真，四曰制砭石小大，五曰知腑髒血氣之診。五法俱立，各有所先。今末世之刺也，虛者實之，滿者泄之，此皆衆工所共知也。若夫法天則地，隨應而動，和之者若響，隨之者若影，道無鬼神，獨來獨往。帝曰∶願聞其道。岐伯曰∶凡刺之真，必先治神，五髒已定，九候已備，後乃存針，衆脈不見，衆兇弗聞，外內相得，無以形先，可玩往來，乃施於人。人有虛實，五虛勿近，五實勿遠，至其當發，間不容。","bh":"所以针道有悬布天下的五项法则，百姓都只是谋食而不知道它：一叫治神，二叫知养身，三叫知毒药之真，四叫制砭石的大小，五叫知脏腑血气之诊。这五法都确立，各有先后。如今末世的针刺，虚者实之、满者泄之，这是一般医生都知道的。至于取法于天、取则于地，随应而动，和之者如响，随之者如影，医道没有鬼神，独来独往。黄帝说：希望听听其中的道理。岐伯说：凡针刺的真要，必先治神；五脏已定，九候已备，然后才存意于针；众脉不见，众凶不闻，内外相得，不以形迹为先，可以玩味往来的气机，才施用于人。人有虚实，五虚不要轻易近针，五实不要轻易放弃，到其当发之时，间不容发（不容迟缓）。","notes":[],"pending":false},{"id":"sw25-4","tags":[],"yw":"手動若務，針耀而勻，靜意視義，觀適之變，是謂冥冥，莫知其形，見其烏烏，見其稷稷，從見其飛，不知其誰，伏如橫弩，起如發機。帝曰∶何如而虛？何如而實？岐伯曰∶刺實者須其虛，刺虛者須其實，經氣已至，慎守勿失，深淺在志，遠近若一，如臨深淵，手如握虎，神無營於衆物。<目錄>卷第八","bh":"手运针时专一其事，针光明而匀整，静心审察其义，观察针下气至的变化，这叫做冥冥（无形无象），不知其形；见其乌乌（如鸟群之集），见其稷稷（如稷之茂），只见其飞，不知其谁；气未至时伏如横弩（弩之待发），气至时起如发机（扳机之发）。黄帝说：怎样是虚？怎样是实？岐伯说：刺实证须待其虚（泻之使虚），刺虚证须待其实（补之使实），经气已至，慎守而勿失，深浅在于心志，远近如一，如临深渊，手如握虎，精神不要被外物所营扰。","notes":[],"pending":false}]},
{"id":"sw26","book":"素问","no":26,"title":"八正神明论","titleTw":"八正神明論","tags":["ci","jingluo","bingji"],"brief":"论用针必候日月星辰四时八正之气而调血气，法往古、验来今、观冥冥，并辨形与神及补泻方圆之法。","pending":false,"sections":[{"id":"sw26-1","tags":[],"yw":"黃帝問曰∶用針之服，必有法則焉，今何法何則？岐伯對曰∶法天則地，合以天光。帝曰∶願卒聞之。岐伯曰∶凡刺之法，必候日月星辰，四時八正之氣，氣定乃刺之。是故天溫日明，則人血淖液而衛氣浮，故血易瀉，氣易行；天寒日陰，則人血凝泣而衛氣沉。月始生，則血氣始精，衛氣始行；月郭滿，則血氣實，肌肉堅；月郭空，則肌肉減，經絡虛，衛氣去，形獨居。是以因天時而調血氣也。是以天寒無刺，天溫無疑。月生無瀉，月滿無補，月郭空無治，是謂得時而調之。","bh":"黄帝问道：用针的法则，必定有一定的法则吧，如今该取什么法则？岐伯回答说：取法于天，取则于地，合以日月星辰之光。黄帝说：希望详尽地听听。岐伯说：凡刺之法，必须候察日月星辰、四时八正之气，气定然后刺之。所以天气温暖、日光明朗，则人血淖液（滑润）而卫气浮，所以血易泻、气易行；天气寒冷、日光阴晦，则人血凝涩而卫气沉。月刚开始生时，则血气开始精纯，卫气开始运行；月郭（月轮）圆满时，则血气充实，肌肉坚；月郭空时，则肌肉减，经络虚，卫气离去，形独居。所以因天时而调血气。所以天寒不要刺，天温不要迟疑。月生不要泻，月满不要补，月郭空不要治，这就叫做得时而调之。","notes":[],"pending":false},{"id":"sw26-2","tags":[],"yw":"因天之序，盛虛之時，移光定位，正立而待之。故曰月生而瀉，是謂髒虛，月滿而補，血氣揚溢，絡有留血，命曰重實；月郭空而治，是謂亂經。陰陽相錯，真邪不別，沉以留止，外虛內亂，淫邪乃起。帝曰∶星辰八正何候？岐伯曰∶星辰者，所以制日月之行也。八正者，所以候八風之虛邪以時至者也。四時者，所以分春秋冬夏之氣所在，以時調之，候八正之虛邪，而避之勿犯也。以身之虛，而逢天之虛，兩虛相感，其氣至骨，入則傷五髒，工候救之，弗能傷也，故曰∶天忌不可不知也。","bh":"因循天之次序、盛虚之时，移光定位（观测日月光影以确定时位），正立而待之。所以说：月生而泻，是谓脏虚；月满而补，血气扬溢，络有留血，名叫重实；月郭空而治，是谓乱经，阴阳相错，真邪不别，邪沉以留止，外虚内乱，淫邪于是而起。黄帝说：星辰八正候察什么？岐伯说：星辰，是用来测度日月运行的。八正，是用来候察八风之虚邪按时而至的。四时，是用来分辨春秋冬夏之气所在的，以时调之，候察八正之虚邪而避之勿犯。以身体之虚，而逢天之虚，两虚相感，其气至于骨，入则伤五脏，医生候而救之，就不能伤人了。所以说：天忌不可不知。","notes":[],"pending":false},{"id":"sw26-3","tags":[],"yw":"帝曰∶善。其法星辰者，餘聞之矣，願聞法往古者。岐伯曰∶法往古者，先知針經也。驗於來今者，先知日之寒溫，月之虛盛，以候氣之浮沉，而調之於身，觀其立有驗也。觀於冥冥者，言形氣榮衛之不形於外，而工獨知之，以日之寒溫，月之虛盛，四時氣之浮沉，參伍相合而調之，工常先見之，然而不形於外，故曰觀於冥冥焉。通於無窮者，可以傳於後世也，是故工之所以異也，然而不形見於外，故俱不能見也。視之無形，嘗之無味，故謂冥冥，若神仿佛。","bh":"黄帝说：好。取法星辰的道理，我已经听到了，希望听听取法往古的。岐伯说：取法往古的，要先知道《针经》。验之于当今的，要先知道日的寒温、月的虚盛，以候气的浮沉，而调之于身，观其立有验。所谓观于冥冥，是说形气营卫不显现于外，而医生独能知之；以日之寒温、月之虚盛、四时气之浮沉，参伍相合而调之，医生常常先见之，然而不形于外，所以说观于冥冥。通于无穷的，可以传于后世，这是医生之所以异于常人的地方，然而它不显现于外，所以大家都不能看见。视之无形，尝之无味，所以叫做冥冥，若神之仿佛。","notes":[],"pending":false},{"id":"sw26-4","tags":[],"yw":"虛邪者，八正之虛邪氣也。正邪者，身形若用力汗出，腠理開，逢虛風，其中人也微，故莫知其情，莫見其形。上工救其萌牙，必先見三部九候之氣，盡調不敗而救之，故曰上工。下工救其已成，救其已敗。救其已成者，言不知三部九候之相失，因病而敗之也。知其所在者，知診三部九候之病脈處而治之，故曰守其門戶焉，莫知其情而見邪形也。帝曰∶餘聞補瀉，未得其意。岐伯曰∶瀉必用方，方者，以氣方盛也，以月方滿也，以日方溫也，以身方定也，以息方吸而內針，乃復候其方吸而轉針，乃復候其方呼而徐引針，故曰瀉必用方，其氣乃行焉。","bh":"虚邪，就是八正的虚邪之气。正邪，就是身形若用力、汗出，腠理开，逢虚风，其中人轻微，所以不知其情、不见其形。上工救治于萌芽，必先察见三部九候之气，尽调不败而救之，所以叫做上工。下工救其已成、救其已败。救其已成的，是说不知三部九候之相失，因病而败之。知其所在的，是知道诊察三部九候的病脉之处而治之，所以叫做守其门户，虽不知其情而能见邪之形。黄帝说：我听说补泻，未得其意。岐伯说：泻必用方；方，就是气方正盛、月方正满、日方正温、身方正定，以病人正吸气而进针，再候其正吸气而转针，再候其正呼气而徐徐引针，所以说泻必用方，其气乃行。","notes":[],"pending":false},{"id":"sw26-5","tags":[],"yw":"補必用員，員者行也，行者移也，刺必中其榮，復以吸排針也。故員與方，非針也。故養神者，必知形之肥瘦，榮衛血氣之盛衰。血氣者，人之神，不可不謹養。帝曰∶妙乎哉論也！合人形於陰陽四時，虛實之應，冥冥之期，其非夫子孰能通之。然夫子數言形與神，何謂形？何謂神？願卒聞之。岐伯曰∶請言形，形乎形，目冥冥，問其所病，索之於經，慧然在前，按之不得，不知其情，故曰形。帝曰∶何謂神？岐伯曰∶請言神，神乎神，耳不聞，目明心開而志先，慧然獨悟，口弗能言，俱視獨見，適若昏，昭然獨明，若風吹雲，故曰神。","bh":"补必用圆；圆，就是行；行，就是移。刺必中其荣（营分），再于吸气时排针。所以圆与方，不是指针具本身。所以养神的，必须知道形体的肥瘦、营卫血气的盛衰。血气，是人之神，不可不谨慎保养。黄帝说：论述得真微妙啊！把人的形体合于阴阳四时、虚实之应、冥冥之期，若不是先生谁能通晓。然而先生屡次说到形与神，什么叫做形？什么叫做神？希望详尽地听听。岐伯说：请让我说形：所谓形，就是形于形，目冥冥然看不清，问其所病，从经上索求，忽然在前，按之不得，不知其情，所以叫做形。黄帝说：什么叫做神？岐伯说：请让我说神：所谓神，就是神乎其神，耳不闻声，目明心开而志先觉，忽然独悟，口不能言，众人皆视而独能见，若在昏暗中昭然独明，如风吹云，所以叫做神。","notes":[],"pending":false},{"id":"sw26-6","tags":[],"yw":"三部九候爲之原，九針之論不必存也。<目錄>卷第八","bh":"三部九候是它的本原，九针之论就不必存于心了。","notes":[],"pending":false}]},
{"id":"sw27","book":"素问","no":27,"title":"离合真邪论","titleTw":"離合真邪論","tags":["ci","jingluo","zhenfa"],"brief":"论邪气入于经脉时的脉象变化与候气之法，强调以三部九候早期遏邪，并详述补泻手法与针刺时机的把握。","pending":false,"sections":[{"id":"sw27-1","tags":[],"yw":"黃帝問曰∶餘聞九針九篇，夫子乃因而九之，九九八十一篇，餘盡通其意矣。經言氣之盛衰，左右傾移，以上調下，以左調右，有餘不足，補瀉於滎輸，餘知之矣。此皆榮衛之傾移，虛實之所生，非邪氣從外入於經也。餘願聞邪氣之在經也，其病患何如？取之奈何？岐伯對曰∶夫聖人之起度數，必應於天地，故天有宿度，地有經水，人有經脈。天地溫和，則經水安靜；天寒地凍，則經水凝泣；天暑地熱，則經水沸溢；卒風暴起，則經水波湧而隴起。夫邪之入於脈也，寒則血凝泣，暑則氣淖澤，虛邪因而入客，亦如經水之得風也，經之動脈，其至也亦時隴起，其行於脈中循循然，其至寸口中手也，時大時小，大則邪至，小則平，其行無常處，在陰與陽，不可爲度，從而察之，三部九候，卒然逢之，早遏其路。","bh":"黄帝问：我听说九针有九篇，夫子又据以推衍九倍，成为九九八十一篇，我已尽通其意。医经上说气的盛衰会左右偏倾移易，以上调下、以左调右，有余不足在荥穴、输穴（气血输注的穴位）上施行补泻，这些我都知道了。这些都属于营卫偏倾、虚实所生的变化，不是邪气从外侵入经脉的情形。我想听听邪气在经脉中时，病人怎样？如何取治？岐伯回答：圣人起定法度，必与天地相应，所以天有宿度，地有经水，人有经脉。天地温和，则经水安静；天寒地冻，则经水凝涩；天暑地热，则经水沸溢；暴风骤起，则经水波涌而隆起。邪气入于脉中，寒则血凝涩，暑则气濡泽，虚邪因而客入，也如经水之遇风，经之动脉，其至也时时隆起，行于脉中循循然，至寸口而应于指下，时大时小，大则邪至，小则平，其行无常处，在阴在阳，不可为度，须从而察之，用三部九候之法，猝然逢遇邪气，就及早遏止它的去路。","notes":[],"pending":false},{"id":"sw27-2","tags":[],"yw":"吸則內針，無令氣忤，靜以久留，無令邪布，吸則轉針，以得氣爲故，候呼引針，呼盡乃去，大氣皆出，故命曰瀉。帝曰∶不足者補之奈何？岐伯曰∶必先捫而循之，切而散之，推而按之，彈而怒之，抓而下之，通而取之，外引其門，以閉其神，呼盡內針，靜以久留，以氣至爲故，如待所貴，不知日暮，其氣以至，適而自護，候吸引針，氣不得出，各在其處，推闔其門，令神氣存，大氣留止，故命曰補。帝曰∶候氣奈何？岐伯曰∶夫邪去絡入於經也，舍於血脈之中，其寒溫未相得，如湧波之起也，時來時去，故不常在。","bh":"吸气时进针，不要让气逆忤，静守而久留针，不要让邪气布散；吸气时捻转针，以得气为度；待呼气时引针，呼气尽时出针，大气皆出，所以叫做泻。黄帝问：不足的怎样补？岐伯说：必须先扪摸而循按，切按而疏散，推引而按压，弹动而使之怒张，掐抓而进针，通导而取气，向外引其针门，以闭其神气；呼气尽时进针，静守而久留，以气至为度，如等待贵人一样，不知日暮；其气已至，就适当地自行护守；待吸气时出针，使气不得外散，各在其处，推合其针门，令神气存留，大气留止，所以叫做补。黄帝问：怎样候气？岐伯说：邪气离开络脉入于经脉，客舍于血脉之中，其寒与温尚未相得，如涌波之起，时来时去，所以不常在。","notes":[],"pending":false},{"id":"sw27-3","tags":[],"yw":"故曰方其來也，必按而止之，止而取之，無逢其衝而瀉之。真氣者，經氣也，經氣太虛，故曰其來不可逢，此之謂也。故曰候邪不審，大氣已過，瀉之則真氣脫，脫則不復，邪氣復至，而病益蓄，故曰其往不可追，此之謂也。不可掛以發者，待邪之至時而發針瀉矣，若先若後者，血氣已盡，其病不可下，故曰知其可取如發機，不知其取如扣椎，故曰知機道者不可掛以發，不知機者扣之不發，此之謂也。帝曰∶補瀉奈何？岐伯曰∶此攻邪也，疾出以去盛血，而復其真氣，此邪新客，溶溶未有定處也，推之則前，引之則止，逆而刺之，溫血也。","bh":"所以说正当邪气来时，必须按压而止之，止住而后取刺，不要逢其冲盛而泻之。真气就是经气，经气太虚，所以说其来不可逢，就是这个意思。所以说候邪不审，大气已过，泻之则真气脱失，脱失则不能恢复，邪气再来而病更加蓄积，所以说其往不可追，就是这个意思。不可挂以发，是说要等邪气到来之时而进针泻之；若先若后，血气已尽，其病就不能除去；所以说知其可取如扣动弩机，不知其取如叩击木椎，所以说知机之道者不可挂以发，不知机者叩之不发，就是这个意思。黄帝问：补泻怎样？岐伯说：这是攻邪，疾速出针以去盛血，而恢复其真气；这是邪气新客，溶溶然未有定处，推之则前进，引之则止息，迎而刺之，是刺其温血。","notes":[],"pending":false},{"id":"sw27-4","tags":[],"yw":"刺出其血，其病立已。帝曰∶善。然真邪以合，波隴不起，候之奈何？岐伯曰∶審捫循三部九候之盛虛而調之，察其左右上下相失及相減者，審其病髒以期之。不知三部者，陰陽不別，天地不分。地以候地，天以候天，人以候人，調之中府，以定三部，故曰刺不知三部九候病脈之處，雖有大過且至，工不能禁也。誅罰無過，命曰大惑，反亂大經，真不可復，用實爲虛，以邪爲真，用針無義，反爲氣賊，奪人正氣，以從爲逆，榮衛散亂，真氣已失，邪獨內着，絕人長命，予人天殃，不知三部九候，故不能久長。","bh":"刺出其血，其病立愈。黄帝说：好。然而真邪已经相合，波陇不起，怎样候察？岐伯说：审察扪循三部九候的盛虚而调治之，察看其左右上下相失及相减的，审察其病的脏腑以预测死期。不知三部的，阴阳不能别，天地不能分。地以候地，天以候天，人以候人，调之于中府，以定三部。所以说刺法不知三部九候病脉之处，虽有大过之气将至，医工也不能禁止。诛罚无过，叫做大惑，反而扰乱大经，真气不可恢复；用实为虚，以邪为真，用针无理，反为气之贼，夺人正气，以从为逆，营卫散乱，真气已失，邪气独留内着，断绝人的长命，给人夭殃。不知三部九候，所以不能长久。","notes":[],"pending":false},{"id":"sw27-5","tags":[],"yw":"因不知合之四時五行，因加相勝，釋邪攻正，絕人長命。邪之新客來也，未有定處，推之則前，引之則止，逢而瀉之，其病立已。<目錄>卷第八","bh":"因为不知配合四时五行，又加相胜之邪，释邪而攻正，断绝人的长命。邪气新客而来时，未有定处，推之则前，引之则止，逢而泻之，其病立愈。","notes":[],"pending":false}]},
{"id":"sw28","book":"素问","no":28,"title":"通评虚实论","titleTw":"通評虛實論","tags":["ci","jingluo","zhenfa"],"brief":"通评虚实的概念与各类病证的生死预后，列举重实、重虚、经络虚实及肠澼、癫疾、消瘅等，并附痈疽、霍乱刺法。","pending":false,"sections":[{"id":"sw28-1","tags":[],"yw":"黃帝問曰∶何謂虛實？岐伯對曰∶邪氣盛則實，精氣奪則虛。帝曰∶虛實何如？岐伯曰∶氣虛者肺虛也，氣逆者足寒也，非其時則生，當其時則死。餘髒皆如此。帝曰∶何謂重實？岐伯曰∶所謂重實者，言大熱病，氣熱脈滿，是謂重實。帝曰∶經絡俱實何如？何以治之？岐伯曰∶經絡皆實，是寸脈急而尺緩也，皆當治之，故曰滑則從，澀則逆也。夫虛實者，皆從其物類始，故五髒骨肉滑利，可以長久也。帝曰∶絡氣不足，經氣有餘，何如？岐伯曰∶絡氣不足，經氣有餘者，脈口熱而尺寒也，秋冬爲逆，春夏爲從，治主病者。","bh":"黄帝问：什么叫虚实？岐伯回答：邪气盛就是实，精气夺就是虚。黄帝问：虚实怎样？岐伯说：气虚是肺虚，气逆是足寒；不在其所受克的时令则生，当其被克的时令则死。其余脏腑都如此。黄帝问：什么叫重实？岐伯说：所谓重实，是说大热病，气热脉满，这就叫重实。黄帝问：经络俱实怎样？怎样治疗？岐伯说：经络皆实，是寸脉急而尺脉缓，都应当治疗，所以说滑则从，涩则逆。虚实都是从其物类开始的，所以五脏骨肉滑利的，可以长久。黄帝问：络气不足、经气有余怎样？岐伯说：络气不足、经气有余的，脉口热而尺肤寒，秋冬为逆，春夏为从，治疗其主病之脏。","notes":[],"pending":false},{"id":"sw28-2","tags":[],"yw":"帝曰∶經虛絡滿何如？岐伯曰∶經虛絡滿者，尺熱滿脈口寒澀也，此春夏死秋冬生也。帝曰∶治此者奈何？岐伯曰∶絡滿經虛，灸陰刺陽；經滿絡虛，刺陰灸陽。帝曰∶何謂重虛？岐伯曰∶脈氣上虛尺虛，是謂重虛。帝曰∶何以治之？岐伯曰∶所謂氣虛者，言無常也。尺虛者，行步然。脈虛者，不象陰也。如此者，滑則生，澀則死也。帝曰∶寒氣暴上，脈滿而實何如？岐伯曰∶實而滑則生，實而逆則死。帝曰∶脈實滿，手足寒，頭熱，何如？岐伯曰∶春秋則生，冬夏則死。","bh":"黄帝问：经虚络满怎样？岐伯说：经虚络满的，尺肤热满而脉口寒涩，这种病春夏死、秋冬生。黄帝问：治此怎样？岐伯说：络满经虚，灸阴刺阳；经满络虚，刺阴灸阳。黄帝问：什么叫重虚？岐伯说：脉虚、气虚、尺虚，这就叫重虚。黄帝问：怎样治疗？岐伯说：所谓气虚，是言语无常；尺虚的，行走怯弱；脉虚的，不象阴脉。这样的，滑则生，涩则死。黄帝问：寒气暴上，脉满而实怎样？岐伯说：实而滑则生，实而涩则死。黄帝问：脉实满，手足寒，头热，怎样？岐伯说：春秋则生，冬夏则死。","notes":[],"pending":false},{"id":"sw28-3","tags":[],"yw":"脈浮而澀，澀而身有熱者死。帝曰∶其形盡滿何如？岐伯曰∶其形盡滿者，脈急大堅，尺澀而不應也，如是者，故從則生，逆則死。帝曰∶何謂從則生，逆則死？岐伯曰∶所謂從者，手足溫也。所謂逆者，手足寒也。帝曰∶乳子而病熱，脈懸小者何如？岐伯曰∶手足溫則生，寒則死。帝曰∶乳子中風熱，喘鳴肩息者，脈何如？岐伯曰∶喘鳴肩息者，脈實大也，緩則生，急則死。帝曰∶腸便血何如？岐伯曰∶身熱則死，寒則生。帝曰∶腸下白沫何如？岐伯曰∶脈沉則生，脈浮則死。","bh":"脉浮而涩，涩而身有热的死。黄帝问：其形尽满怎样？岐伯说：其形尽满的，脉急大坚，尺涩而不应，这样的，从则生，逆则死。黄帝问：什么叫从则生、逆则死？岐伯说：所谓从，是手足温；所谓逆，是手足寒。黄帝问：乳子而病热，脉悬小的怎样？岐伯说：手足温则生，寒则死。黄帝问：乳子中风热，喘鸣肩息的，脉怎样？岐伯说：喘鸣肩息的，脉实大，缓则生，急则死。黄帝问：肠澼便血怎样？岐伯说：身热则死，寒则生。黄帝问：肠澼下白沫怎样？岐伯说：脉沉则生，脉浮则死。","notes":[],"pending":false},{"id":"sw28-4","tags":[],"yw":"帝曰∶腸下膿血何如？岐伯曰∶脈懸絕則死，滑大則生。帝曰∶腸之屬，身不熱，脈不懸絕何如？岐伯曰∶滑大者曰生，懸澀者曰死，以髒期之。帝曰∶癲疾何如？岐伯曰∶脈搏大滑，久自已；脈小堅急，死不治。帝曰∶癲疾之脈，虛實何如？岐伯曰∶虛則可治，實則死，帝曰∶消癉虛實何如？岐伯曰∶脈實大，病久可治；脈懸小堅，病久不可治。帝曰∶形度骨度脈度筋度，何以知其度也？帝曰∶春亟治經絡，夏亟治經俞，秋亟治六腑，冬則閉塞。閉塞者，用藥而少針石也。","bh":"黄帝问：肠澼下脓血怎样？岐伯说：脉悬绝则死，滑大则生。黄帝问：肠澼一类，身不热、脉不悬绝的怎样？岐伯说：滑大的叫生，悬涩的叫死，以五脏之期来推其死时。黄帝问：癫疾怎样？岐伯说：脉搏大滑，久则自愈；脉小坚急，死不治。黄帝问：癫疾的脉，虚实怎样？岐伯说：虚则可治，实则死。黄帝问：消瘅虚实怎样？岐伯说：脉实大，病久可治；脉悬小坚，病久不可治。黄帝问：形度、骨度、脉度、筋度，怎样知道其度数？黄帝说：春亟治经络，夏亟治经俞，秋亟治六腑，冬则闭塞；闭塞的，用药而少用针石。","notes":[],"pending":false},{"id":"sw28-5","tags":[],"yw":"所謂少針石者，非癰疽之謂也，癰疽不得頃時回。癰不知所，按之不應手，乍來乍已，刺手太陰旁三與纓脈各二。掖癰大熱，刺足少陽五，刺而熱不止，刺手心主三，刺手太陰經絡者大骨之會各三。暴癰筋，隨分而痛，魄汗不盡，胞氣不足，治在經俞。腹暴滿，按之不下，取手太陽經絡者，胃之募也，少陰俞去脊椎三寸旁五，用員利針。霍亂，刺俞旁五，足陽明及上旁三。刺癇驚脈五，針手太陰各五，刺經太陽五，刺手少陰經絡旁者一，足陽明一，上踝五寸刺三針。","bh":"所谓少用针石，不是指痈疽，痈疽不得顷刻迟回。痈不知所在，按之不应手，乍来乍已，刺手太阴旁三痏与缨脉各二。掖痈大热，刺足少阳五；刺而热不止，刺手心主三，刺手太阴经络者、大骨之会各三。暴痈筋软，随分肉而痛，魄汗不尽，胞气不足，治在经俞。腹暴满，按之不下，取手太阳经络者，是胃之募；少阴俞去脊椎三寸旁五，用员利针。霍乱，刺俞旁五，足阳明及上旁三。刺痫惊脉五：针手太阴各五，刺经太阳五，刺手少阴经络旁者一，足阳明一，上踝五寸刺三针。","notes":[],"pending":false},{"id":"sw28-6","tags":[],"yw":"凡治消癉僕擊，偏枯痿厥，氣滿發逆，甘肥貴人，則高梁之疾也。隔塞閉絕，上下不通，則暴憂之病也。暴厥而聾，偏塞閉不通，內氣暴薄也。不從內外中風之病，故瘦留着也。跛，寒風溼之病也。黃帝曰∶黃膽暴痛，癲疾厥狂，久逆之所生也。五髒不平，六腑閉塞之所生也。頭痛耳鳴，九竅不利，腸胃之所生也。<目錄>卷第八","bh":"凡治消瘅、仆击、偏枯、痿厥、气满发逆，这些是富贵之人高粱厚味之疾。隔塞闭绝，上下不通，是暴受忧愁之病。暴厥而聋，偏塞闭不通，是内气暴迫。不是从内、外中风的病，所以瘦而留着不去。跛，是寒风湿之病。黄帝说：黄疸暴痛，癫疾厥狂，是久逆之所生。五脏不平，是六腑闭塞之所生。头痛耳鸣，九窍不利，是肠胃之所生。","notes":[],"pending":false}]},
{"id":"sw29","book":"素问","no":29,"title":"太阴阳明论","titleTw":"太陰陽明論","tags":["zhenfa","bingji","zangxiang"],"brief":"论太阴阳明表里异位、阴阳虚实不同而致病各异，说明脾病四肢不用、脾不主时及脾为胃行津液的道理。","pending":false,"sections":[{"id":"sw29-1","tags":[],"yw":"黃帝問曰∶太陰陽明爲表裏，脾胃脈也，生病而異者何也？岐伯對曰∶陰陽異位，更虛更實，更逆更從，或從內，或從外，所從不同，故病異名也。帝曰∶願聞其異狀也。岐伯曰∶陽者，天氣也，主外；陰者，地氣也，主內。故陽道實，陰道虛。故犯賊風虛邪者，陽受之；食飲不節起居不時者，陰受之。陽受之則入六腑，陰受之則入五髒。入六腑則身熱不時臥，上爲喘呼；入五髒則滿閉塞，下爲飧泄，久爲腸。故喉主天氣，咽主地氣。故陽受風氣，陰受溼氣。","bh":"黄帝问：太阴阳明为表里，是脾胃之脉，生病而不同是为什么？岐伯回答：阴阳异位，更虚更实，更逆更从，或从内，或从外，所从不同，所以病名也不同。黄帝说：愿闻其不同的情况。岐伯说：阳是天气，主外；阴是地气，主内。所以阳道实，阴道虚。所以感受贼风虚邪的，阳受之；饮食不节、起居不时的，阴受之。阳受之则入六腑，阴受之则入五脏。入六腑则身热、不能按时卧，上为喘呼；入五脏则胀满闭塞，下为飧泄，久为肠澼。所以喉主天气，咽主地气。所以阳受风气，阴受湿气。","notes":[],"pending":false},{"id":"sw29-2","tags":[],"yw":"故陰氣從足上行至頭，而下行循臂至指端；陽氣從手上行至頭，而下行至足。故曰陽病者上行極而下，陰病者下行極而上。故傷於風者，上先受之；傷於溼者，下先受之。帝曰∶脾病而四肢不用何也？岐伯曰∶四肢皆稟氣於胃，而不得至經，必因於脾，乃得稟也。今脾病不能爲胃行其津液，四肢不得稟水谷氣，氣日以衰，脈道不利，筋骨肌肉，皆無氣以生，故不用焉。帝曰∶脾不主時何也？岐伯曰∶脾者土也，治中央，常以四時長四髒，各十八日寄治，不得獨主於時也。","bh":"所以阴气从足上行至头，而下行循臂至指端；阳气从手上行至头，而下行至足。所以说阳病者上行极而下，阴病者下行极而上。所以伤于风的，上部先受之；伤于湿的，下部先受之。黄帝问：脾病而四肢不用是为什么？岐伯说：四肢都禀气于胃，而不得直接至于经，必因于脾，才能得到禀受。今脾病不能为胃运行其津液，四肢不得禀受水谷之气，气日以衰，脉道不利，筋骨肌肉都无气以生，所以不用。黄帝问：脾不主时是为什么？岐伯说：脾属土，治中央，常以四时长养四脏，各以十八日寄治，不得独主于时。","notes":[],"pending":false},{"id":"sw29-3","tags":[],"yw":"脾髒者常着胃土之精也，土者生萬物而法天地，故上下至頭足，不得主時也。帝曰∶脾與胃以膜相連耳，而能爲之行其津液何也？岐伯曰∶足太陰者三陰也，其脈貫胃屬脾絡嗌，故太陰爲之行氣於三陰。陽明者表也，五髒六腑之海也，亦爲之行氣於三陽。髒腑各因其經而受氣於陽明，故爲胃行其津液。四肢不得稟水谷氣，日以益衰，陰道不利，筋骨肌肉無氣以生，故不用焉。<目錄>卷第八","bh":"脾脏常附着胃土之精，土生万物而法象天地，所以上下至头足，不得主时。黄帝问：脾与胃以膜相连罢了，而能为之行其津液是为什么？岐伯说：足太阴是三阴，其脉贯胃、属脾、络嗌，所以太阴为之行气于三阴。阳明是表，是五脏六腑之海，也为之行气于三阳。脏腑各因其经而受气于阳明，所以是为胃行其津液。四肢不得禀受水谷之气，日以益衰，阴道不利，筋骨肌肉无气以生，所以不用。","notes":[],"pending":false}]},
{"id":"sw30","book":"素问","no":30,"title":"阳明脉解","titleTw":"陽明脈解","tags":["zhenfa","bingji","zangxiang"],"brief":"解释足阳明胃脉病中恶人、恶火、闻木音而惊，以及弃衣而走、登高而歌、妄言骂詈等证的发生机制。","pending":false,"sections":[{"id":"sw30-1","tags":[],"yw":"黃帝問曰∶足陽明之脈病，惡人與火，聞木音則惕然而驚，鍾鼓不爲動，聞木音而驚何也？願聞其故。岐伯對曰∶陽明者胃脈也，胃者土也，故聞木音而驚者，土惡木也。帝曰∶善。其惡火何也？岐伯曰∶陽明主肉，其脈血氣盛，邪客之則熱，熱甚則惡火。帝曰∶其惡人何也？岐伯曰∶陽明厥則喘而惋，惋則惡人。帝曰∶或喘而死者，或喘而生者，何也？岐伯曰∶厥逆連髒則死，連經則生。帝曰∶善。病甚則棄衣而走，登高而歌，或至不食數日，逾垣上屋，所上之處，皆非其素所能也，病反能者何也？岐伯曰∶四肢者諸陽之本也，陽盛則四肢實，實則能登高也。","bh":"黄帝问：足阳明之脉病，恶人与火，闻木音则惕然而惊，钟鼓不为所动，闻木音而惊是为什么？愿闻其故。岐伯回答：阳明是胃脉，胃属土，所以闻木音而惊，是土恶木克。黄帝说：好。其恶火是为什么？岐伯说：阳明主肉，其脉血气盛，邪客之则热，热甚则恶火。黄帝问：其恶人是为什么？岐伯说：阳明厥则喘而惋，惋则恶人。黄帝问：或喘而死的，或喘而生的，是为什么？岐伯说：厥逆连脏则死，连经则生。黄帝说：好。病甚则弃衣而走，登高而歌，或至不食数日，逾垣上屋，所上之处都不是他平素所能做到的，病反能如此是为什么？岐伯说：四肢是诸阳之本，阳盛则四肢实，实则能登高而歌。","notes":[],"pending":false},{"id":"sw30-2","tags":[],"yw":"帝曰∶其棄衣而走者何也？岐伯曰∶熱盛於身，故棄衣欲走也。帝曰∶其妄言罵詈不避親疏而歌者何也？岐伯曰∶陽盛則使人妄言罵詈不避親疏而不欲食，不欲食故妄走也。寶命全角論∶嗄（所嫁切）吟（上丘伽切）黔（音鉗）棄蔑（音滅）容（音舜）八正神明論∶仿佛（上音仿，下音弗）離合真邪論∶（徐倫切）蚊虻（武庚切）捫（音門）抓（側交切）溶（音容）通評虛實論∶（去王切）（榮美切）（之石切）太陰陽明論∶閉塞（蘇則切）陽明脈解篇∶惋（烏貫切）逾（音於）<目錄>卷第九","bh":"黄帝问：其弃衣而走是为什么？岐伯说：热盛于身，所以弃衣欲走。黄帝问：其妄言骂詈、不避亲疏而歌的是为什么？岐伯说：阳盛则使人妄言骂詈、不避亲疏而不欲食，不欲食所以妄走。","notes":[],"pending":false}]},
{"id":"sw31","book":"素问","no":31,"title":"热论","titleTw":"熱論","tags":["jingluo","zhenfa","bingji"],"brief":"论热病本于伤寒，按三阳三阴六经依次传变的证候与日期、汗泄治法，兼论两感于寒的死期与温暑之别。","pending":false,"sections":[{"id":"sw31-1","tags":[],"yw":"黃帝問曰∶今夫熱病者，皆傷寒之類也，或愈或死，其死皆以六七日之間，其愈皆以十日以上者何也？不知其解，願聞其故。岐伯對曰∶巨陽者，諸陽之屬也，其脈連於風府，故爲諸陽主氣也。人之傷於寒也，則爲病熱，熱雖甚不死；其兩感於寒而病者，必不免於死。帝曰∶願聞其狀。岐伯曰∶傷寒一日，巨陽受之，故頭項痛腰脊強。二日陽明受之，陽明主肉，其脈挾鼻絡於目，故身熱目疼而鼻干，不得臥也。三日少陽受之，少陽主膽，其脈循脅絡於耳，故胸脅痛而耳聾。","bh":"黄帝问：现在的热病，都属于伤寒之类，有的愈，有的死，死的都在六七日之间，愈的都在十日以上，是为什么？不知其解，愿闻其故。岐伯回答：巨阳是诸阳之属，其脉连于风府，所以为诸阳主气。人伤于寒，则为病热，热虽甚不死；其两感于寒而病的，必不免于死。黄帝说：愿闻其症状。岐伯说：伤寒一日，巨阳受之，所以头项痛、腰脊强。二日阳明受之，阳明主肉，其脉挟鼻络于目，所以身热、目疼而鼻干，不得卧。三日少阳受之，少阳主胆，其脉循胁络于耳，所以胸胁痛而耳聋。","notes":[],"pending":false},{"id":"sw31-2","tags":[],"yw":"三陽經絡皆受其病，而未入於髒者，故可汗而已。四日太陰受之，太陰脈布胃中絡於嗌，故腹滿而嗌干。五日少陰受之，少陰脈貫腎絡於肺，系舌本，故口燥舌干而渴。六日厥陰受之，厥陰脈循陰器而絡於肝，故煩滿而囊縮。三陰三陽，五髒六腑皆受病，榮衛不行，五髒不通，則死矣。其不兩感於寒者，七日巨陽病衰，頭痛少愈；八日陽明病衰，身熱少愈；九日少陽病衰，耳聾微聞；十日太陰病衰，腹減如故，則思飲食；十一日少陰病衰，渴止不滿，舌干已而嚏；十二日厥陰病衰，囊縱少腹微下，大氣皆去，病日已矣。","bh":"三阳经络皆受其病，而未入于脏的，可以发汗而愈。四日太阴受之，太阴脉布胃中、络于嗌，所以腹满而嗌干。五日少阴受之，少阴脉贯肾、络于肺、系舌本，所以口燥舌干而渴。六日厥阴受之，厥阴脉循阴器而络于肝，所以烦满而囊缩。三阴三阳、五脏六腑皆受病，营卫不行，五脏不通，就死了。其不两感于寒的，七日巨阳病衰，头痛稍愈；八日阳明病衰，身热稍退；九日少阳病衰，耳聋微闻；十日太阴病衰，腹减如故，则思饮食；十一日少阴病衰，渴止不满，舌干已而嚏；十二日厥阴病衰，囊纵、少腹微下，大气皆去，病日愈了。","notes":[],"pending":false},{"id":"sw31-3","tags":[],"yw":"帝曰∶治之奈何？岐伯曰∶治之各通其髒脈，病日衰已矣。其未滿三日者，可汗而已；其滿三日者，可泄而已。帝曰∶熱病已愈，時有所遺者何也？岐伯曰∶諸遺者，熱甚而強食之，故有所遺也。若此者，皆病已衰而熱有所藏，因其谷氣相薄，兩熱相合，故有所遺也。帝曰∶善。治遺奈何？岐伯曰∶視其虛實，調其逆從，可使必已矣。帝曰∶病熱當何禁之？岐伯曰∶病熱少愈，食肉則復，多食則遺，此其禁也。帝曰∶其病兩感於寒者，其脈應與其病形何如？岐伯曰∶兩感於寒者，病一日則巨陽與少陰俱病，則頭痛口干而煩滿；二日則陽明與太陰俱病，則腹滿身熱，不欲食譫言；三日則少陽與厥陰俱病，則耳聾囊縮而厥，水漿不入，不知人，六日死。","bh":"黄帝问：怎样治疗？岐伯说：治之各通其脏脉，病日衰而已。其未满三日的，可汗而已；其满三日的，可泄而已。黄帝问：热病已愈，时常有所遗留的是为什么？岐伯说：诸遗者，是热甚而强食之，所以有所遗。像这样的，都是病已衰而热有所藏，因其与谷气相薄，两热相合，所以有所遗。黄帝说：好。治遗怎样？岐伯说：视其虚实，调其逆从，可使必已。黄帝问：病热应当禁什么？岐伯说：病热少愈，食肉则复发，多食则遗，这就是禁忌。黄帝问：其病两感于寒的，其脉应与病形怎样？岐伯说：两感于寒的，病一日则巨阳与少阴俱病，则头痛、口干而烦满；二日则阳明与太阴俱病，则腹满、身热、不欲食、谵言；三日则少阳与厥阴俱病，则耳聋、囊缩而厥，水浆不入，不知人，六日死。","notes":[],"pending":false},{"id":"sw31-4","tags":[],"yw":"帝曰∶五髒已傷，六腑不通，榮衛不行，如是之後，三日乃死何也？岐伯曰∶陽明者，十二經脈之長也，其血氣盛，故不知人，三日其氣乃盡，故死矣。凡病傷寒而成溫者，先夏至日者爲病溫，後夏至日者爲病暑，暑當與汗皆出，勿止。<目錄>卷第九","bh":"黄帝问：五脏已伤，六腑不通，营卫不行，如此之后三日才死是为什么？岐伯说：阳明是十二经脉之长，其血气盛，所以不知人；三日其气乃尽，所以死了。凡病伤寒而成温的，先夏至日的为病温，后夏至日的为病暑；暑当与汗皆出，不要止汗。","notes":[],"pending":false}]},
{"id":"sw32","book":"素问","no":32,"title":"刺热","titleTw":"刺熱","tags":["ci","zhenfa","bingji"],"brief":"分述五脏热病的证候、五行日期的加重与大汗、死期及刺法，并论热病的五色先兆、取穴与热病气穴部位。","pending":false,"sections":[{"id":"sw32-1","tags":[],"yw":"肝熱病者，小便先黃，腹痛多臥身熱，熱爭則狂言及驚，脅滿痛，手足躁，不得安臥，庚辛甚，甲乙大汗，氣逆則庚辛死，刺足厥陰少陽，其逆則頭痛員員，脈引衝頭也。心熱病者，先不樂，數日乃熱，熱爭則卒心痛，煩悶善嘔，頭痛面赤無汗，壬癸甚，丙丁大汗，氣逆則壬癸死，刺手少陰太陽。脾熱病者，先頭重頰痛，煩心顏青，欲嘔身熱，熱爭則腰痛不可用俯仰，腹滿泄，兩頷痛，甲乙甚，戊己大汗，氣逆則甲乙死，刺足太陰陽明。肺熱病者，先淅然厥，起毫毛，惡風寒，舌上黃身熱。","bh":"肝热病的，小便先黄，腹痛、多卧、身热；热与正气相争则狂言及惊，胁满痛，手足躁扰，不得安卧；庚辛日加重，甲乙日大汗；气逆则庚辛日死，刺足厥阴、少阳。其气逆则头痛员员（眩晕貌），是脉气上冲于头。心热病的，先不乐，数日才发热；热争则卒心痛，烦闷善呕，头痛面赤无汗；壬癸日甚，丙丁日大汗；气逆则壬癸日死，刺手少阴、太阳。脾热病的，先头重颊痛，烦心、颜青，欲呕、身热；热争则腰痛不可用俯仰，腹满泄，两颔痛；甲乙日甚，戊己日大汗；气逆则甲乙日死，刺足太阴、阳明。肺热病的，先淅然恶寒而厥，毫毛竖起，恶风寒，舌上黄，身热。","notes":[],"pending":false},{"id":"sw32-2","tags":[],"yw":"熱爭則喘咳，痛走胸膺背，不得大息，頭痛不堪，汗出而寒，丙丁甚，庚辛大汗，氣逆則丙丁死，刺手太陰陽明，出血如大豆，立已。腎熱病者，先腰痛，苦渴數飲身熱，熱爭則項痛而強，寒且，足下熱，不欲言，其逆則項痛員員淡淡然，戊己甚，壬癸大汗，氣逆則戊己死，刺足少陰太陽，諸汗者，至其所勝日汗出也。肝熱病者左頰先赤，心熱病者顏先赤，脾熱病者鼻先赤，肺熱病者右頰先赤，腎熱病者頤先赤，病雖未發，見赤色者刺之，名曰治未病。","bh":"热争则喘咳，痛走胸膺背，不得大息，头痛不堪，汗出而寒；丙丁日甚，庚辛日大汗；气逆则丙丁日死，刺手太阴、阳明，出血如大豆，立愈。肾热病的，先腰痛，苦渴数饮、身热；热争则项痛而强，寒且酸，足下热，不欲言；其气逆则项痛员员、淡淡然（眩晕摇动貌）；戊己日甚，壬癸日大汗；气逆则戊己日死，刺足少阴、太阳。诸汗的，都是到其所胜之日汗出。肝热病的左颊先赤，心热病的颜部先赤，脾热病的鼻先赤，肺热病的右颊先赤，肾热病的颐部先赤；病虽未发，见赤色的就刺之，叫做治未病。","notes":[],"pending":false},{"id":"sw32-3","tags":[],"yw":"熱病從部所起者，至期而已；其刺之反者，三周而已；重逆則死。諸當汗者，至其所勝日，汗大出也。諸治熱病，以飲之寒水乃刺之，必寒衣之，居止寒處，身寒而止也。熱病先胸脅痛，手足躁，刺足少陽，補足太陰，病甚者爲五十九刺。熱病始手臂痛者，刺手陽明太陰而汗出止。熱病始於頭首者，刺項太陽而汗出止。熱病始於足脛者，刺足陽明而汗出止。熱病先身重骨痛，耳聾好瞑，刺足少陰，病甚爲五十九刺。熱病先眩冒而熱，胸脅滿，刺足少陰少陽。","bh":"热病从其所起之部而治的，到期而已；其刺之反的，三周而已；重逆则死。诸当汗的，到其所胜之日汗大出。凡治热病，先给饮寒水然后刺之，必令穿寒衣，居止于寒处，身寒而止。热病先胸胁痛、手足躁的，刺足少阳，补足太阴；病甚的用五十九刺。热病始于手臂痛的，刺手阳明、太阴而汗出止。热病始于头首的，刺项太阳而汗出止。热病始于足胫的，刺足阳明而汗出止。热病先身重骨痛、耳聋好瞑的，刺足少阴，病甚用五十九刺。热病先眩冒而热、胸胁满的，刺足少阴、少阳。","notes":[],"pending":false},{"id":"sw32-4","tags":[],"yw":"太陽之脈，色榮顴骨，熱病也，榮未交，曰今且得汗，待時而已。與厥陰脈爭見者，死期不過三日，其熱病內連腎，少陽之脈色也。少陽之脈，色榮頰前，熱病也，榮未交，曰今且得汗，待時而已，與少陰脈爭見者，死期不過三日。熱病氣穴∶三椎下間主胸中熱，四椎下間主膈中熱，五椎下間主肝熱，六椎下間主脾熱，七椎下間主腎熱，榮在也。項上三椎，陷者中也。頰下逆顴爲大瘕，下牙車爲腹滿，顴後爲脅痛，頰上者膈上也。<目錄>卷第九","bh":"太阳之脉，色荣颧骨，是热病；荣未交，说现在将得汗，待其时而已。与厥阴脉争见的，死期不过三日；其热病内连肾，是少阳之脉色。少阳之脉，色荣颊前，是热病；荣未交，说现在将得汗，待其时而已；与少阴脉争见的，死期不过三日。热病气穴：三椎下间主胸中热，四椎下间主膈中热，五椎下间主肝热，六椎下间主脾热，七椎下间主肾热，荣在骶也。项上三椎，是陷者中。颊下逆颧为大瘕，下牙车为腹满，颧后为胁痛，颊上的主膈上。","notes":[],"pending":false}]},
{"id":"sw33","book":"素问","no":33,"title":"评热病论","titleTw":"評熱病論","tags":["ci","zhenfa","bingji"],"brief":"评论热病中的阴阳交、风厥、劳风、肾风（风水）等变证，论其病机、预后与治疗宜忌。","pending":false,"sections":[{"id":"sw33-1","tags":[],"yw":"黃帝問曰∶有病溫者，汗出輒復熱，而脈躁疾不爲汗衰，狂言不能食，病名爲何？岐伯對曰∶病名陰陽交，交者死也。帝曰∶願聞其說。岐伯曰∶人所以汗出者，皆生於谷，谷生於精，今邪氣交爭於骨肉而得汗者，是邪卻而精勝也，精勝則當能食而不復熱。復熱者邪氣也，汗者精氣也，今汗出而輒復熱者，是邪勝也，不能食者，精無俾也，病而留者，其壽可立而傾也。且夫《熱論》曰∶汗出而脈尚躁盛者死。今脈不與汗相應，此不勝其病也，其死明矣。","bh":"黄帝问：有病温的，汗出辄复热，而脉躁疾不因汗而衰减，狂言不能食，病名叫什么？岐伯回答：病名叫阴阳交，交者死。黄帝说：愿闻其说。岐伯说：人所以汗出的，都生于谷，谷生于精；今邪气与正气相争于骨肉而得汗的，是邪退而精胜，精胜则应当能食而不复热。复热的是邪气，汗的是精气；今汗出而辄复热的，是邪胜；不能食的，是精气无所补益；病邪留而不去的，其寿可立而倾危。而且《热论》说：汗出而脉尚躁盛的死。今脉不与汗相应，这是不能胜其病，其死明矣。","notes":[],"pending":false},{"id":"sw33-2","tags":[],"yw":"狂言者是失志，失志者死。今見三死，不見一生，雖愈必死也。帝曰∶有病身熱汗出煩滿，煩滿不爲汗解，此爲何病？岐伯曰∶汗出而身熱者風也，汗出而煩滿不解者厥也，病名曰風厥。帝曰∶願卒聞之。岐伯曰∶巨陽主氣，故先受邪，少陰與其爲表裏也，得熱則上從之，從之則厥也。帝曰∶治之奈何？岐伯曰∶表裏刺之，飲之服湯。帝曰∶勞風爲病何如？岐伯曰∶勞風法在肺下，其爲病也，使人強上冥視，唾出若涕，惡風而振寒，此爲勞風之病。帝曰∶治之奈何？岐伯曰∶以救俯仰。","bh":"狂言的是失志，失志的死。今见三死，不见一生，虽似愈必死。黄帝问：有病身热汗出烦满，烦满不为汗解的，这是什么病？岐伯说：汗出而身热的是风，汗出而烦满不解的是厥，病名叫风厥。黄帝说：愿详尽听听。岐伯说：巨阳主气，所以先受邪；少阴与其为表里，得热则上从之，从之则厥。黄帝问：怎样治疗？岐伯说：表里都刺之，并饮服汤药。黄帝问：劳风的病怎样？岐伯说：劳风的病位在肺下，其发病使人强上冥视，唾出若涕，恶风而振寒，这就是劳风之病。黄帝问：怎样治疗？岐伯说：以救其俯仰。","notes":[],"pending":false},{"id":"sw33-3","tags":[],"yw":"巨陽引精者三日，中年者五日，不精者七日，咳出青黃涕，其狀如膿，大如彈丸，從口中若鼻中出，不出則傷肺，傷肺則死也。帝曰∶有病腎風者，面然壅，害於言，可刺不？岐伯曰∶虛不當刺，不當刺而刺，後五日其氣必至。帝曰∶其至何如？岐伯曰∶至必少氣時熱，時熱從胸背上至頭，汗出手熱，口干苦渴，小便黃，目下腫，腹中鳴，身重難以行，月事不來，煩而不能食，不能正偃，正偃則咳甚，病名曰風水，論在《刺法》中。帝曰∶願聞其說。","bh":"巨阳引精的三日，中年的五日，不精的七日；咳出青黄涕，其状如脓，大如弹丸，从口中或鼻中出；不出则伤肺，伤肺则死。黄帝问：有病肾风的，面目浮肿壅起，害于言语，可以刺吗？岐伯说：虚不当刺；不当刺而刺，后五日其气必至。黄帝问：其至怎样？岐伯说：至必少气时热，时热从胸背上至头，汗出手热，口干苦渴，小便黄，目下肿，腹中鸣，身重难以行走，月事不来，烦而不能食，不能正偃，正偃则咳甚；病名叫风水，论在《刺法》中。黄帝说：愿闻其说。","notes":[],"pending":false},{"id":"sw33-4","tags":[],"yw":"岐伯曰∶邪之所湊，其氣必虛，陰虛者陽必湊之，故少氣時熱而汗出也。小便黃者，少腹中有熱也。不能正偃者，胃中不和也。正偃則咳甚，上迫肺也。諸有水氣者，微腫先見於目下也。帝曰∶何以言？岐伯曰∶水者陰也，目下亦陰也，腹者至陰之所居，故水在腹者，必使目下腫也。真氣上逆，故口苦舌干，臥不得正偃，正偃則咳出清水也。諸水病者，故不得臥，臥則驚，驚則咳甚也。腹中鳴者，病本於胃也。薄脾則煩不能食，食不下者，胃脘隔也。","bh":"岐伯说：邪气所凑，其气必虚；阴虚的，阳必凑之，所以少气时热而汗出。小便黄的，是少腹中有热。不能正偃的，是胃中不和。正偃则咳甚，是水气上迫于肺。凡有水气的，微肿先见于目下。黄帝问：为什么这样说？岐伯说：水属阴，目下也属阴，腹部是至阴之所居，所以水在腹中的必使目下肿。真气上逆，所以口苦舌干，卧不得正偃，正偃则咳出清水。诸水病的都不得卧，卧则惊，惊则咳甚。腹中鸣的，病本于胃。邪薄于脾则烦不能食；食不下的，是胃脘隔塞。","notes":[],"pending":false},{"id":"sw33-5","tags":[],"yw":"身重難以行者，胃脈在足也。月事不來者，胞脈閉也，胞脈者屬心而絡於胞中，今氣上迫肺，心氣不得下通，故月事不來也。帝曰∶善。<目錄>卷第九","bh":"身重难以行走的，是胃脉在足。月事不来的，是胞脉闭；胞脉属心而络于胞中，今气上迫肺，心气不得下通，所以月事不来。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw34","book":"素问","no":34,"title":"逆调论","titleTw":"逆調論","tags":["jingluo","zhenfa","bingji"],"brief":"论阴阳偏盛、营卫虚实失调所致的发热、寒从中生、骨痹、肉苛及喘息不得卧等逆调诸证的病机。","pending":false,"sections":[{"id":"sw34-1","tags":[],"yw":"黃帝問曰∶人身非常溫也，非常熱也，爲之熱而煩滿者何也？岐伯對曰∶陰氣少而陽氣勝，故熱而煩滿也。帝曰∶人身非衣寒也，中非有寒氣也，寒從中生者何？岐伯曰∶是人多痹氣也，陽氣少，陰氣多，故身寒如從水中出。帝曰∶人有四肢熱，逢風寒如炙如火者何也？岐伯曰∶是人者陰氣虛，陽氣盛，四肢者陽也，兩陽相得而陰氣虛少，少水不能滅盛火，而陽獨治，獨治者不能生長也，獨勝而止耳，逢風而如炙如火者，是人當肉爍也。帝曰∶人有身寒，湯火不能熱，濃衣不能溫，然不凍慄，是爲何病？岐伯曰∶是人者，素腎氣勝，以水爲事，太陽氣衰，腎脂枯不長，一水不能勝兩火，腎者水也，而生於骨，腎不生則髓不能滿，故寒甚至骨也。","bh":"黄帝问：人身并非衣着过温，也非正常的温热，却发热而烦满的是为什么？岐伯回答：阴气少而阳气胜，所以热而烦满。黄帝问：人身并非衣服单薄，中也非有寒气，寒从内而生的是为什么？岐伯说：这种人多痹气，阳气少、阴气多，所以身寒如从水中出来。黄帝问：人有四肢热，逢风寒如炙如火的是为什么？岐伯说：这种人是阴气虚、阳气盛；四肢属阳，两阳相得而阴气虚少，少水不能灭盛火，而阳独治；独治的不能生长，只是独胜而止罢了；逢风而如炙如火的，这种人应当肌肉消瘦。黄帝问：人有身寒，汤火不能使之热，厚衣不能使之温，然而不发抖战栗，这是什么病？岐伯说：这种人素来肾气胜，以水为事，太阳气衰，肾脂枯而不长，一水不能胜两火；肾属水，而生于骨，肾不生则髓不能满，所以寒甚至骨。","notes":[],"pending":false},{"id":"sw34-2","tags":[],"yw":"所以不能凍慄者，肝一陽也，心二陽也，腎孤髒也，一水不能勝二火，故不能凍慄，病名曰骨痹，是人當攣節也。帝曰∶人之肉苛者，雖近衣絮，猶尚苛也，是謂何疾？岐伯曰∶榮氣虛，衛氣實也，榮氣虛則不仁，衛氣虛則不用，榮衛俱虛，則不仁且不用，肉如故也，人身與志不相有，曰死。帝曰∶人有逆氣不得臥而息有音者，有不得臥而息無音者，有起居如故而息有音者，有得臥行而喘者，有不得臥不能行而喘者，有不得臥臥而喘者，皆何髒使然？願聞其故。","bh":"所以不发抖战栗的，肝是一阳，心是二阳，肾是孤脏，一水不能胜二火，所以不能冻栗，病名叫骨痹，这种人应当骨节拘挛。黄帝问：人的肉苛，虽近衣絮，仍然苛（麻木沉重）的，这是什么病？岐伯说：是营气虚、卫气实；营气虚则不仁，卫气虚则不用；营卫俱虚，则不仁且不用，而肉如故；人身与志不相有，叫做死。黄帝问：人有逆气不得卧而息有音的，有不得卧而息无音的，有起居如故而息有音的，有得卧行走而喘的，有不得卧不能行而喘的，有不得卧、卧而喘的，都是哪一脏使之然？愿闻其故。","notes":[],"pending":false},{"id":"sw34-3","tags":[],"yw":"岐伯曰∶不得臥而息有音者，是陽明之逆也，足三陽者下行，今逆而上行，故息有音也。陽明者胃脈也，胃者六腑之海，其氣亦下行，陽明逆不得從其道，故不得臥也。《下經》曰∶胃不和則臥不安。此之謂也。夫起居如故而息有音者，此肺之絡脈逆也，絡脈不得隨經上下，故留經而不行，絡脈之病患也微，故起居如故而息有音也。夫不得臥臥則喘者，是水氣之客也，夫水者循津液而流也，腎者水髒，主津液，主臥與喘也。帝曰∶善。熱論∶怫（音弗）譫（之閻切，多言也）刺熱論∶頷（胡感切）灑淅（上先禮切，下先歷切）（音酸）跟（音根）（音氐）評熱病論∶（下莫江切）（音博）逆調論∶苛（胡歌切）<目錄>卷第十","bh":"岐伯说：不得卧而息有音的，是阳明之逆；足三阳是下行的，今逆而上行，所以息有音。阳明是胃脉，胃是六腑之海，其气也下行；阳明逆不得从其道，所以不得卧。《下经》说：胃不和则卧不安。就是这个意思。起居如故而息有音的，这是肺之络脉逆；络脉不得随经上下，所以留于经而不行；络脉的病较轻，所以起居如故而息有音。不得卧、卧则喘的，是水气之客；水循津液而流，肾是水脏，主津液，主卧与喘。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw35","book":"素问","no":35,"title":"疟论","titleTw":"瘧論","tags":["jingluo","zhenfa","bingji"],"brief":"系统论述疟疾的病因病机、寒热交替与发作有时的道理、间日发作之故、疟的分类及刺治时机。","pending":false,"sections":[{"id":"sw35-1","tags":[],"yw":"黃帝問曰∶夫瘧皆生於風，其蓄作有時者何也？岐伯對曰∶瘧之始發也，先起於毫毛，伸欠乃作，寒慄鼓頷，腰脊俱痛，寒去則內外皆熱，頭痛如破，渴欲冷凍飲料。帝曰∶何氣使然？願聞其道。岐伯曰∶陰陽上下交爭，虛實更作，陰陽相移也。陽並於陰，則陰實而陽虛，陽明虛則寒慄鼓頷也；巨陽虛則腰背頭項痛；三陽俱虛則陰氣勝，陰氣勝則骨寒而痛；寒生於內，故中外皆寒；陽盛則外熱，陰虛則內熱，外內皆熱則喘而渴，故欲冷凍飲料也。此皆得之夏傷於暑，熱氣盛，藏於皮膚之內，腸胃之外，此榮氣之所舍也。","bh":"黄帝问：疟都生于风，其蓄积发作有定时是为什么？岐伯回答：疟开始发作时，先起于毫毛，伸欠乃发作，寒栗鼓颔，腰脊俱痛；寒去则内外皆热，头痛如破，渴欲冷饮。黄帝问：什么气使之然？愿闻其道。岐伯说：阴阳上下交争，虚实更作，阴阳相移。阳并于阴，则阴实而阳虚；阳明虚则寒栗鼓颔，巨阳虚则腰背头项痛；三阳俱虚则阴气胜，阴气胜则骨寒而痛；寒生于内，所以中外皆寒；阳盛则外热，阴虚则内热，外内皆热则喘而渴，所以欲冷饮。这都是得之于夏伤于暑，热气盛，藏于皮肤之内、肠胃之外，这是营气所舍之处。","notes":[],"pending":false},{"id":"sw35-2","tags":[],"yw":"此令人汗空疏，腠理開，因得秋氣，汗出遇風，及得之以浴，水氣舍於皮膚之內，與衛氣並居。衛氣者，晝日行於陽，夜行於陰，此氣得陽而外出，得陰而內薄，內外相薄，是以日作。帝曰∶其間日而作者何也？岐伯曰∶其氣之舍深，內薄於陰，陽氣獨發，陰邪內着，陰與陽爭不得出，是以間日而作也。帝曰∶善。其作日晏與其日早者，何氣使然？岐伯曰∶邪氣客於風府，循膂而下，衛氣一日一夜大會於風府，其明日日下一節，故其作也晏，此先客於脊背也，每至於風府則腠理開，腠理開則邪氣入，邪氣入則病作，以此日作稍益晏也。","bh":"这使人汗孔疏、腠理开，因而得秋气，汗出遇风，或洗浴而得，水气客舍于皮肤之内，与卫气并居。卫气昼日行于阳，夜行于阴，此气得阳而外出，得阴而内薄，内外相薄，所以每日发作。黄帝问：其间日而作的是为什么？岐伯说：其气客舍深，内薄于阴，阳气独发，阴邪内着，阴与阳争不得出，所以间日而作。黄帝说：好。其发作一日晚、一日早的，是什么气使之然？岐伯说：邪气客于风府，循膂而下；卫气一日一夜大会于风府，其明日日下一节，所以其发作也晚。这是先客于脊背的，每至于风府则腠理开，腠理开则邪气入，邪气入则病作，因此每日发作渐渐更晚。","notes":[],"pending":false},{"id":"sw35-3","tags":[],"yw":"其出於風府，日下一節，二十五日下至骨，二十六日入於脊內，注於伏膂之脈，其氣上行，九日出於缺盆之中，其氣日高，故作日益早也。其間日發者，由邪氣內薄於五髒，橫連募原也，其道遠，其氣深，其行遲，不能與衛氣俱行，不得皆出，故間日乃作也。帝曰∶夫子言衛氣每至於風府，腠理乃發，發則邪氣入，入則病作。今衛氣日下一節，其氣之發也不當風府，其日作者奈何？岐伯曰∶此邪氣客於頭項循膂而下者也，故虛實不同，邪中異所，則不得當其風府也。","bh":"其出于风府，日下一节，二十五日下至骶骨，二十六日入于脊内，注于伏膂之脉；其气上行，九日出于缺盆之中，其气日高，所以发作日益早。其间日发的，是邪气内薄于五脏，横连募原；其道远，其气深，其行迟，不能与卫气俱行，不得皆出，所以间日乃作。黄帝问：夫子说卫气每至于风府，腠理乃发，发则邪气入，入则病作。今卫气日下一节，其气之发也不当风府，其每日发作的怎样解释？岐伯说：这是邪气客于头项、循膂而下的，所以虚实不同，邪中异所，就不得正当其风府。","notes":[],"pending":false},{"id":"sw35-4","tags":[],"yw":"故邪中於頭項者，氣至頭項而病；中於背者，氣至背而病；中於腰脊者，氣至腰脊而病；中於手足者，氣至手足而病。衛氣之所在，與邪氣相合，則病作。故風無常府，衛氣之所發，必開其腠理，邪氣之所合，則其府也。帝曰∶善。夫風之與瘧也，相似同類，而風獨常在，瘧得有時而休者何也？岐伯曰∶風氣留其處，故常在；瘧氣隨經絡沉以內薄，故衛氣應乃作。帝曰∶瘧先寒而後熱者何也？岐伯曰∶夏傷於大暑，其汗大出，腠理開發，因遇夏氣悽滄之水寒，藏於腠理皮膚之中，秋傷於風，則病成矣。","bh":"所以邪中于头项的，气至头项而病；中于背的，气至背而病；中于腰脊的，气至腰脊而病；中于手足的，气至手足而病。卫气之所在，与邪气相合，则病作。所以风无常府，卫气之所发，必开其腠理，邪气之所合，就是其府。黄帝说：好。风之与疟，相似而同类，而风独常在，疟得有时而休止，是为什么？岐伯说：风气留于其处，所以常在；疟气随经络沉以内薄，所以卫气应之乃作。黄帝问：疟先寒而后热的是为什么？岐伯说：夏伤于大暑，其汗大出，腠理开发，因而遇到夏气凄沧之水寒，藏于腠理皮肤之中，秋伤于风，则病成。","notes":[],"pending":false},{"id":"sw35-5","tags":[],"yw":"夫寒者陰氣也，風者陽氣也，先傷於寒而後傷於風，故先寒而後熱也，病以時作，名曰寒瘧。帝曰∶先熱而後寒者何也？岐伯曰∶此先傷於風而後傷於寒，故先熱而後寒也，亦以時作，名曰溫瘧。其但熱而不寒者，陰氣先絕，陽氣獨發，則少氣煩冤，手足熱而欲嘔，名曰癉瘧。帝曰∶夫經言有餘者瀉之，不足者補之。今熱爲有餘，寒爲不足。夫瘧者之寒，湯火不能溫也，及其熱，冰水不能寒也，此皆有餘不足之類。當此之時，良工不能止，必須其自衰乃刺之，其故何也？願聞其說。","bh":"寒是阴气，风是阳气，先伤于寒而后伤于风，所以先寒而后热，病以时作，名叫寒疟。黄帝问：先热而后寒的是为什么？岐伯说：这是先伤于风而后伤于寒，所以先热而后寒，也以时作，名叫温疟。那些但热而不寒的，是阴气先绝，阳气独发，则少气烦冤，手足热而欲呕，名叫瘅疟。黄帝问：医经上说有余的泻之，不足的补之。今热为有余，寒为不足。疟者的寒，汤火不能温；及其热，冰水不能寒；这都是有余不足之类。当此之时，良医不能止，必须等其自衰才刺之，是什么缘故？愿闻其说。","notes":[],"pending":false},{"id":"sw35-6","tags":[],"yw":"岐伯曰∶經言無刺之熱，無刺渾渾之脈，無刺漉漉之汗，故爲其病逆未可治也。夫瘧之始發也，陽氣並於陰，當是之時，陽虛而陰盛，外無氣，故先寒慄也。陰氣逆極，則復出之陽，陽與陰復並於外，則陰虛而陽實，故先熱而渴。夫瘧氣者，並於陽則陽勝，並於陰則陰勝，陰勝則寒，陽勝則熱。瘧者，風寒之氣不常也，病極則復。至病之發也，如火之熱，如風雨不可當也。故經言曰∶方其盛時必毀，因其衰也，事必大昌。此之謂也。夫瘧之未發也，陰未並陽，陽未並陰，因而調之，真氣得安，邪氣乃亡，故工不能治其已發，爲其氣逆也。","bh":"岐伯说：医经上说无刺熇熇之热，无刺浑浑之脉，无刺漉漉之汗，所以为其病气逆乱，未可治。疟之始发，阳气并于阴，当此之时，阳虚而阴盛，外无气，所以先寒栗。阴气逆极，则复出于阳，阳与阴复并于外，则阴虚而阳实，所以先热而渴。疟气并于阳则阳胜，并于阴则阴胜；阴胜则寒，阳胜则热。疟是风寒之气不常，病极则复。至病之发，如火之热，如风雨之不可当。所以医经上说：方其盛时必毁，因其衰也，事必大昌。就是这个意思。疟之未发，阴未并阳，阳未并阴，因而调之，真气得安，邪气乃亡；所以医工不能治其已发，为其气逆。","notes":[],"pending":false},{"id":"sw35-7","tags":[],"yw":"帝曰∶善。攻之奈何？早晏何如？岐伯曰∶瘧之且發也，陰陽之且移也，必從四末始也，陽已傷，陰從之，故先其時堅束其處，令邪氣不得入，陰氣不得出，審候見之在孫絡盛堅而血者皆取之，此真往而未得並者也。帝曰∶瘧不發，其應何如？岐伯曰∶瘧氣者，必更盛更虛，當氣之所在也，病在陽，則熱而脈躁；在陰，則寒而脈靜；極則陰陽俱衰，衛氣相離，故病得休；衛氣集，則復病也。帝曰∶時有間二日或至數日發，或渴或不渴，其故何也？岐伯曰∶其間日者，邪氣與衛氣客於六腑，而有時相失，不能相得，故休數日乃作也。","bh":"黄帝说：好。怎样攻治？早晚如何？岐伯说：疟之将发，阴阳之将移，必从四末开始；阳已伤，阴从之，所以在发作之前紧紧束缚其处，令邪气不得入，阴气不得出；审候见到孙络盛坚而充血的都取之，这是真气已往而未与邪相并的时候。黄帝问：疟不发时，其应怎样？岐伯说：疟气必更盛更虚，当气之所在：病在阳，则热而脉躁；在阴，则寒而脉静；极则阴阳俱衰，卫气相离，所以病得休；卫气集，则复病。黄帝问：时有间二日或至数日发的，或渴或不渴，是什么缘故？岐伯说：其间日的，是邪气与卫气客于六腑，而有时相失，不能相得，所以休数日乃作。","notes":[],"pending":false},{"id":"sw35-8","tags":[],"yw":"瘧者，陰陽更勝也，或甚或不甚，故或渴或不渴。帝曰∶論言夏傷於暑，秋必病瘧，今瘧不必應者何也？岐伯曰∶此應四時者也。其病異形者，反四時也。其以秋病者寒甚，以冬病者寒不甚，以春病者惡風，以夏病者多汗。帝曰∶夫病溫瘧與寒瘧而皆安舍？舍於何髒？岐伯曰∶溫瘧者，得之冬中於風，寒氣藏於骨髓之中，至春則陽氣大發，邪氣不能自出，因遇大暑，腦髓爍，肌肉消，腠理發泄，或有所用力，邪氣與汗皆出，此病藏於腎，其氣先從內出之於外也。","bh":"疟是阴阳更胜，或甚或不甚，所以或渴或不渴。黄帝问：论言夏伤于暑，秋必病疟，今疟不必应的为什么？岐伯说：这是应四时的。其病异形的，是反四时。其以秋病的寒甚，以冬病的寒不甚，以春病的恶风，以夏病的多汗。黄帝问：那病温疟与寒疟的都安舍于何处？舍于何脏？岐伯说：温疟的，得之于冬中于风，寒气藏于骨髓之中，至春则阳气大发，邪气不能自出，因而遇到大暑，脑髓烁，肌肉消，腠理发泄，或有所用力，邪气与汗皆出；此病藏于肾，其气先从内出之于外。","notes":[],"pending":false},{"id":"sw35-9","tags":[],"yw":"如是者，陰虛而陽盛，陽盛則熱矣，衰則氣復反入，入則陽虛，陽虛則寒矣，故先熱而後寒，名曰溫瘧。帝曰∶癉瘧何如？岐伯曰∶癉瘧者，肺素有熱氣盛於身，厥逆上衝，中氣實而不外泄，因有所用力，腠理開，風寒舍於皮膚之內、分肉之間而發，發則陽氣盛，陽氣盛而不衰則病矣。其氣不及於陰，故但熱而不寒，氣內藏於心，而外舍於分肉之間，令人消爍脫肉，故命曰癉瘧。帝曰∶善。<目錄>卷第十","bh":"像这样的，阴虚而阳盛，阳盛则热；衰则气复反入，入则阳虚，阳虚则寒，所以先热而后寒，名叫温疟。黄帝问：瘅疟怎样？岐伯说：瘅疟的，肺素有热，气盛于身，厥逆上冲，中气实而不外泄，因而有所用力，腠理开，风寒客舍于皮肤之内、分肉之间而发；发则阳气盛，阳气盛而不衰则病。其气不及于阴，所以但热而不寒；气内藏于心，而外舍于分肉之间，令人消烁脱肉，所以名叫瘅疟。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw36","book":"素问","no":36,"title":"刺疟","titleTw":"刺瘧","tags":["ci","zhenfa","bingji"],"brief":"分述六经疟、五脏疟与胃疟的症状及刺法，并论疟脉各种表现的针灸取穴与治疗时机。","pending":false,"sections":[{"id":"sw36-1","tags":[],"yw":"足太陽之瘧，令人腰痛頭重，寒從背起，先寒後熱，然，熱止汗出，難已，刺中出血。足少陽之瘧，令人身體解，寒不甚，熱不甚，惡見人，見人心惕惕然，熱多汗出甚，刺足少陽。足陽明之瘧，令人先寒，灑淅灑淅，寒甚久乃熱，熱去汗出，喜見日月光火氣乃快然，刺足陽明跗上。足太陰之瘧，令人不樂，好大息，不嗜食，多寒熱汗出，病至則善嘔，嘔已乃衰，即取之。足少陰之瘧，令人嘔吐甚，多寒熱，熱多寒少，欲閉戶牖而處，其病難已。足厥陰之瘧，令人腰痛少腹滿，小便不利如癃狀，非癃也，數便，意恐懼氣不足，腹中悒悒，刺足厥陰。","bh":"足太阳之疟，令人腰痛头重，寒从背起，先寒后热，熇熇然，热止汗出，难愈，刺郄中出血。足少阳之疟，令人身体解㑊，寒不甚，热不甚，恶见人，见人心惕惕然，热多、汗出甚，刺足少阳。足阳明之疟，令人先寒，洒淅洒淅，寒甚久乃热，热去汗出，喜见日月光火气乃快然，刺足阳明跗上。足太阴之疟，令人不乐，好太息，不嗜食，多寒热汗出；病至则善呕，呕已乃衰，即取之。足少阴之疟，令人呕吐甚，多寒热，热多寒少，欲闭户牖而处，其病难已。足厥阴之疟，令人腰痛、少腹满，小便不利如癃状，其实不是癃，是频频小便，心中恐惧、气不足，腹中悒悒，刺足厥阴。","notes":[],"pending":false},{"id":"sw36-2","tags":[],"yw":"肺瘧者，令人心寒，寒甚熱，熱間善驚，如有所見者，刺手太陰陽明。心瘧者，令人煩心甚，欲得清水，反寒多，不甚熱，刺手少陰。肝瘧者，令人色蒼蒼然，太息，其狀若死者，刺足厥陰見血。脾瘧者，令人寒，腹中痛，熱則腸中鳴，鳴已汗出，刺足太陰。腎瘧者，令人灑灑然，腰脊痛宛轉，大便難，目然，手足寒，刺足太陽少陰。胃瘧者，令人且病也，善飢而不能食，食而支滿腹大，刺足陽明太陰橫脈出血。瘧發身方熱，刺跗上動脈，開其空，出其血，立寒。","bh":"肺疟的，令人心寒，寒甚则热，热间善惊，如有所见，刺手太阴、阳明。心疟的，令人烦心甚，欲得清水，反而寒多、不甚热，刺手少阴。肝疟的，令人色苍苍然，太息，其状若死，刺足厥阴见血。脾疟的，令人寒，腹中痛；热则肠中鸣，鸣已汗出，刺足太阴。肾疟的，令人洒洒然，腰脊痛宛转，大便难，目眩眩然，手足寒，刺足太阳、少阴。胃疟的，令人将病时善饥而不能食，食而支满腹大，刺足阳明、太阴横脉出血。疟发身方热，刺跗上动脉，开其孔，出其血，立刻转寒。","notes":[],"pending":false},{"id":"sw36-3","tags":[],"yw":"瘧方欲寒，刺手陽明太陰、足陽明太陰。瘧脈滿大，急刺背俞，用中針旁伍俞各一，適肥瘦出其血也。瘧脈小實，急灸脛少陰，刺指井。瘧脈滿大，急刺背俞，用五俞背俞各一，適行至於血也。瘧脈緩大虛，便宜用藥，不宜用針。凡治瘧先發，如食頃乃可以治，過之則失時也。諸瘧而脈不見，刺十指間出血，血去必已，先視身之赤如小豆者盡取之。十二瘧者，其發各不同時，察其病形，以知其何脈之病也。先其發時如食頃而刺之，一刺則衰，二刺則知，三刺則已，不已刺舌下兩脈出血，不已刺中盛經出血，又刺項以下俠脊者必已。","bh":"疟方欲寒，刺手阳明、太阴，足阳明、太阴。疟脉满大，急刺背俞，用中针旁五胠俞各一，视肥瘦出其血。疟脉小实，急灸胫少阴，刺指井。疟脉满大，急刺背俞，用五胠俞、背俞各一，适行至于血。疟脉缓大虚，宜用药，不宜用针。凡治疟，先其发作如食顷之前才可以治，过之则失时。诸疟而脉不见的，刺十指间出血，血去必已；先看身上赤如小豆的尽取之。十二疟的发作各不同时，察其病形，以知是哪一经脉之病。先其发作如食顷之前而刺之，一刺则衰，二刺则知，三刺则已；不已刺舌下两脉出血；不已刺郄中盛经出血，又刺项以下侠脊的，必已。","notes":[],"pending":false},{"id":"sw36-4","tags":[],"yw":"舌下兩脈者，廉泉也。刺瘧者，必先問其病之所先發者，先刺之。先頭痛及重者，先刺頭上及兩額兩眉間出血。先項背痛者，先刺之。先腰脊痛者，先刺中出血。先手臂痛者，先刺手少陰陽明十指間。先足脛痛者，先刺足陽明十指間出血。風瘧，瘧發則汗出惡風，刺三陽經背俞之血者。痛甚，按之不可，名曰髓病，以針針絕骨出血，立已。身體小痛，刺至陰。諸陰之井無出血，間日一刺。瘧不渴，間日而作，刺足太陽。渴而間日作，刺足少陽。溫瘧汗不出，爲五十九刺。","bh":"舌下两脉的，是廉泉。刺疟的，必先问其病之所先发的，先刺之。先头痛及重的，先刺头上及两额、两眉间出血。先项背痛的，先刺之。先腰脊痛的，先刺郄中出血。先手臂痛的，先刺手少阴、阳明十指间。先足胫痛的，先刺足阳明十指间出血。风疟，疟发则汗出恶风，刺三阳经背俞之血。痛甚、按之不可的，名叫髓病，用镵针针绝骨出血，立已。身体小痛，刺至阴。诸阴之井无出血，间日一刺。疟不渴、间日而作的，刺足太阳。渴而间日作的，刺足少阳。温疟汗不出的，用五十九刺。","notes":[],"pending":false},{"id":"sw36-5","tags":[],"yw":"<目錄>卷第十","bh":"此段仅存卷第十目录标识，无正文。","notes":[],"pending":false}]},
{"id":"sw37","book":"素问","no":37,"title":"气厥论","titleTw":"氣厥論","tags":["bingji","zangxiang","yinyang"],"brief":"论五脏六腑寒热之气相互移传所生的痈肿、肺消、涌水、膈消、食亦、鼻渊等各种病变。","pending":false,"sections":[{"id":"sw37-1","tags":[],"yw":"黃帝問曰∶五髒六腑，寒熱相移者何？岐伯曰∶腎移寒於肝，癰腫少氣。脾移寒於肝，癰腫筋攣。肝移寒於心，狂隔中。心移寒於肺，肺消，肺消者飲一溲二，死不治。肺移寒於腎，爲湧水，湧水者，按腹不堅，水氣客於大腸，疾行則鳴濯濯如囊裹漿，水之病也。脾移熱於肝，則爲驚衄。肝移熱於心，則死。心移熱於肺，傳爲膈消。肺移熱於腎，傳爲柔。腎移熱於脾，傳爲虛，腸死，不可治。胞移熱於膀胱，則癃溺血。膀胱移熱於小腸，膈腸不便，上爲口麋。","bh":"黄帝问：五脏六腑寒热相移的怎样？岐伯说：肾移寒于肝，痈肿少气。脾移寒于肝，痈肿筋挛。肝移寒于心，狂、隔中。心移寒于肺，为肺消；肺消的饮一分溲二分，死不治。肺移寒于肾，为涌水；涌水的按腹不坚，水气客于大肠，疾行则鸣濯濯如囊裹浆，是水之病。脾移热于肝，则为惊、衄。肝移热于心，则死。心移热于肺，传为膈消。肺移热于肾，传为柔痓。肾移热于脾，传为虚，肠澼死，不可治。胞移热于膀胱，则癃、溺血。膀胱移热于小肠，膈肠不便，上为口糜。","notes":[],"pending":false},{"id":"sw37-2","tags":[],"yw":"小腸移熱於大腸，爲瘕，爲沉。大腸移熱於胃，善食而瘦入，謂之食亦。胃移熱於膽，亦曰食亦。膽移熱於腦，則辛鼻淵，鼻淵者，濁涕下不止也，傳爲衄蔑瞑目，故得之氣厥也。<目錄>卷第十","bh":"小肠移热于大肠，为伏瘕，为沉。大肠移热于胃，善食而瘦，叫做食亦。胃移热于胆，也叫食亦。胆移热于脑，则辛頞鼻渊；鼻渊是浊涕下不止，传为衄蔑、瞑目。所以得之于气厥。","notes":[],"pending":false}]},
{"id":"sw38","book":"素问","no":38,"title":"咳论","titleTw":"咳論","tags":["ci","zhenfa","bingji"],"brief":"论咳嗽不独关乎肺，五脏六腑皆令人咳，分述五脏咳、六腑咳的症状、传变与针刺取穴之法。","pending":false,"sections":[{"id":"sw38-1","tags":[],"yw":"黃帝問曰∶肺之令人咳何也？岐伯對曰∶五髒六腑皆令人咳，非獨肺也。帝曰∶願聞其狀。岐伯曰∶皮毛者肺之合也，皮毛先受邪氣，邪氣以從其合也。其寒飲食入胃，從肺脈上至於肺則肺寒，肺寒則外內合邪因而客之，則爲肺咳。五髒各以其時受病，非其時各傳以與之。人與天地相參，故五髒各以治時感於寒則受病，微則爲咳，甚者爲泄爲痛。乘秋則肺先受邪，乘春則肝先受之，乘夏則心先受之，乘至陰則脾先受之，乘冬則腎先受之。帝曰∶何以異之？岐伯曰∶肺咳之狀，咳而喘息有音，甚則唾血。","bh":"黄帝问：肺之令人咳是为什么？岐伯回答：五脏六腑皆令人咳，非独肺。黄帝说：愿闻其情况。岐伯说：皮毛是肺之合，皮毛先受邪气，邪气以从其合。其寒饮食入胃，从肺脉上至于肺则肺寒，肺寒则外内合邪因而客之，则为肺咳。五脏各以其所主之时受病，非其时的各传以与之。人与天地相参，所以五脏各以治时感于寒则受病，微则为咳，甚者为泄、为痛。乘秋则肺先受邪，乘春则肝先受之，乘夏则心先受之，乘至阴则脾先受之，乘冬则肾先受之。黄帝问：怎样区别？岐伯说：肺咳之状，咳而喘息有音，甚则唾血。","notes":[],"pending":false},{"id":"sw38-2","tags":[],"yw":"心咳之狀，咳則心痛，喉仲介介如梗狀，甚則咽腫喉痹。肝咳之狀，咳則兩脅下痛，甚則不可以轉，轉則兩下滿。脾咳之狀，咳則右脅下痛陰陰引肩背，甚則不可以動，動則咳劇。腎咳之狀，咳則腰背相引而痛，甚則咳涎。帝曰∶六腑之咳奈何？安所受病？岐伯曰∶五髒之久咳，乃移於六腑。脾咳不已，則胃受之，胃咳之狀，咳而嘔，嘔甚則長蟲出。肝咳不已，則膽受之、膽咳之狀、咳嘔膽汁。肺咳不已，則大腸受之，大腸咳狀，咳而遺失。心咳不已，則小腸受之，小腸咳狀，咳而失氣，氣與咳俱失。","bh":"心咳之状，咳则心痛，喉中介介如梗状，甚则咽肿喉痹。肝咳之状，咳则两胁下痛，甚则不可以转，转则两胠下满。脾咳之状，咳则右胁下痛、阴阴引肩背，甚则不可以动，动则咳剧。肾咳之状，咳则腰背相引而痛，甚则咳涎。黄帝问：六腑之咳怎样？从哪里受病？岐伯说：五脏之久咳，乃移于六腑。脾咳不已，则胃受之；胃咳之状，咳而呕，呕甚则长虫出。肝咳不已，则胆受之；胆咳之状，咳呕胆汁。肺咳不已，则大肠受之；大肠咳状，咳而遗失。心咳不已，则小肠受之；小肠咳状，咳而失气，气与咳俱失。","notes":[],"pending":false},{"id":"sw38-3","tags":[],"yw":"腎咳不已，則膀胱受之，膀胱咳狀，咳而遺溺。久咳不已，則三焦受之，三焦咳狀，咳而腹滿，不欲食飲，此皆聚於胃，關於肺，使人多涕唾而面浮腫氣逆也。帝曰∶治之奈何？岐伯曰∶治髒者治其俞，治腑者治其合，浮腫者治其經。帝曰∶善。瘧論∶（火沃切）漉（音鹿）弭（綿婢切）刺瘧論∶（音謁）悒（於急切）（音舜）氣厥論∶（音熾）麋（武悲切）（音復）蔑（莫結切）咳論∶蛔（音回）<目錄>卷第十一","bh":"肾咳不已，则膀胱受之；膀胱咳状，咳而遗溺。久咳不已，则三焦受之；三焦咳状，咳而腹满，不欲食饮。这都是聚于胃，关于肺，使人多涕唾而面浮肿、气逆。黄帝问：怎样治疗？岐伯说：治脏的治其俞，治腑的治其合，浮肿的治其经。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw40","book":"素问","no":40,"title":"腹中论","titleTw":"腹中論","tags":["ci","bingji","zangxiang"],"brief":"论腹中鼓胀、血枯、伏梁、厥逆等病的诊治与禁忌，兼论热中消中的用药宜忌及妊娠、病热之辨。","pending":false,"sections":[{"id":"sw40-1","tags":[],"yw":"黃帝問曰∶有病心腹滿，旦食則不能暮食，此爲何病？岐伯對曰∶名爲鼓脹。帝曰∶治之奈何？岐伯曰∶治之以雞矢醴，一劑知，二劑已。帝曰∶其時有復發者何也？岐伯曰∶此飲食不節，故時有病也。雖然其病且已，時故當病，氣聚於腹也。帝曰∶有病胸脅支滿者，妨於食，病至則先聞腥臊臭，出清液，先唾血，四肢清，目眩，時時前後血，病名爲何？何以得之？岐伯曰∶病名血枯，此得之年少時，有所大脫血，若醉入房中，氣竭肝傷，故月事衰少不來也。","bh":"黄帝问：有病心腹满，旦食则不能暮食，这是什么病？岐伯回答：名叫鼓胀。黄帝问：怎样治疗？岐伯说：治以鸡矢醴，一剂知，二剂已。黄帝问：其时有复发的是为什么？岐伯说：这是饮食不节，所以时有发病。虽然其病将要已，当时仍会发病，是气聚于腹。黄帝问：有病胸胁支满的，妨于食，病至则先闻腥臊臭，出清液，先唾血，四肢清冷，目眩，时时前后血，病名叫什么？怎样得之？岐伯说：病名血枯，这得之于年少时有所大脱血，或醉后入房中，气竭肝伤，所以月事衰少不来。","notes":[],"pending":false},{"id":"sw40-2","tags":[],"yw":"帝曰∶治之奈何？復以何術？岐伯曰∶以四烏骨一茹二物並合之，丸以雀卵，大如小豆，以五丸爲後飯，飲以鮑魚汁，利腸中及傷肝也。帝曰∶病有少腹盛，上下左右皆有根，此爲何病？可治不？岐伯曰∶病名曰伏梁。帝曰∶伏梁何因而得之？岐伯曰∶裹大膿血，居腸胃之外，不可治，治之每切按之致死。帝曰∶何以然？岐伯曰∶此下則因陰，必下膿血，上則迫胃脘，生膈，挾胃脘內癰，此久病也，難治。居臍上爲逆，居臍下爲從，勿動亟奪。論在《刺法》中。","bh":"黄帝问：怎样治疗？用什么方法恢复？岐伯说：用四乌鲗骨、一藘茹二物合并，丸以雀卵，大如小豆，以五丸为后饭，饮以鲍鱼汁，利肠中及补伤肝。黄帝问：病有少腹盛，上下左右皆有根，这是什么病？可治否？岐伯说：病名叫伏梁。黄帝问：伏梁因何而得之？岐伯说：包裹大脓血，居肠胃之外，不可治，治之每切按之致死。黄帝问：为什么？岐伯说：这下则因于阴，必下脓血；上则迫胃脘，生膈，挟胃脘内痈；这是久病，难治。居脐上为逆，居脐下为从，勿动亟夺。论在《刺法》中。","notes":[],"pending":false},{"id":"sw40-3","tags":[],"yw":"帝曰∶人有身體髀股皆腫，環臍而痛，是爲何病？岐伯曰∶病名伏梁，此風根也。其氣溢於大腸而着於肓，肓之原在臍下，故環臍而痛也。不可動之，動之爲水溺澀之病。帝曰∶夫子數言熱中消中，不可服高梁芳草石藥，石藥發，芳草發狂。夫熱中消中者，皆富貴人也，今禁高梁，是不合其心，禁芳草石藥，是病不愈，願聞其說。岐伯曰∶夫芳草之氣美，石藥之氣悍，二者其氣急疾堅勁，故非緩心和人，不可以服此二者。帝曰∶不可以服此二者，何以然？岐伯曰∶夫熱氣悍，藥氣亦然，二者相遇，恐內傷脾，脾者土也而惡木，服此藥者，至甲乙日更論。","bh":"黄帝问：人有身体髀股皆肿，环脐而痛，这是什么病？岐伯说：病名伏梁，这是风根。其气溢于大肠而着于肓，肓之原在脐下，所以环脐而痛。不可动之，动之则成水溺涩之病。黄帝问：夫子屡言热中、消中，不可服高粱、芳草、石药，石药发癫，芳草发狂。热中消中的都是富贵人，今禁高粱是不合其心，禁芳草石药是病不愈，愿闻其说。岐伯说：芳草之气美，石药之气悍，二者其气急疾坚劲，所以不是心气和缓的人，不可以服此二者。黄帝问：不可以服此二者，是为什么？岐伯说：热气慓悍，药气也是一样，二者相遇，恐怕内伤脾；脾属土而恶木；服此药的，至甲乙日再论。","notes":[],"pending":false},{"id":"sw40-4","tags":[],"yw":"帝曰∶善。有病膺腫頸痛胸滿腹脹，此爲何病？何以得之？岐伯曰∶名厥逆。帝曰∶治之奈何？岐伯曰∶灸之則喑，石之則狂，須其氣並，乃可治也。帝曰∶何以然？岐伯曰∶陽氣重上，有餘於上，灸之則陽氣入陰，入則喑；石之則陽氣虛，虛則狂；須其氣並而治之，可使全也。帝曰∶善。何以知懷子之且生也？岐伯曰∶身有病而無邪脈也。帝曰∶病熱而有所痛者何也？岐伯曰∶病熱者，陽脈也，以三陽之動也，人迎一盛少陽，二盛太陽，三盛陽明，入陰也。","bh":"黄帝说：好。有病膺肿、颈痛、胸满、腹胀，这是什么病？怎样得之？岐伯说：名叫厥逆。黄帝问：怎样治疗？岐伯说：灸之则喑，砭石之则狂，须待其气并，才可治。黄帝问：为什么？岐伯说：阳气重上，有余于上；灸之则阳气入阴，入则喑；砭石之则阳气虚，虚则狂；须待其气并而治之，可使保全。黄帝说：好。怎样知道怀孕将要生产？岐伯说：身有病而无邪脉。黄帝问：病热而有所痛的是什么？岐伯说：病热的是阳脉，以三阳之动：人迎一盛是少阳，二盛是太阳，三盛是阳明，是阳入于阴。","notes":[],"pending":false},{"id":"sw40-5","tags":[],"yw":"夫陽入於陰，故病在頭與腹，乃脹而頭痛也。帝曰∶善。<目錄>卷第十一","bh":"阳入于阴，所以病在头与腹，就腹胀而头痛。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw41","book":"素问","no":41,"title":"刺腰痛","titleTw":"刺腰痛","tags":["ci","zhenfa","bingji"],"brief":"分述各经脉令人腰痛的症状特点与刺法取穴，包括解脉、同阴、阳维、衡络、会阴、飞阳等脉腰痛。","pending":false,"sections":[{"id":"sw41-1","tags":[],"yw":"足太陽脈令人腰痛，引項脊尻背如重狀，刺其中。太陽正經出血，春無見血。少陽令人腰痛，如以針刺其皮中，循循然不可以俯仰，不可以顧，刺少陽成骨之端出血，成骨在膝外廉之骨獨起者，夏無見血。陽明令人腰痛，不可以顧，顧如有見者，善悲，刺陽明於前三，上下和之出血，秋無見血。足少陰令人腰痛，痛引脊內廉，刺少陰於內踝上二，春無見血，出血太多，不可復也。厥陰之脈令人腰痛，腰中如張弓弩弦，刺厥陰之脈，在踵魚腹之外，循之累累然，乃刺之，其病令人善言默默然不慧，刺之三。","bh":"足太阳脉令人腰痛，引项脊尻背如负重状，刺其郄中。太阳正经出血，春无见血。少阳令人腰痛，如以针刺其皮中，循循然不可以俯仰，不可以顾；刺少阳成骨之端出血，成骨在膝外廉之骨独起处，夏无见血。阳明令人腰痛，不可以顾，顾则如有所见，善悲；刺阳明于胻前三痏，上下和之出血，秋无见血。足少阴令人腰痛，痛引脊内廉，刺少阴于内踝上二痏，春无见血；出血太多，不可复。厥阴之脉令人腰痛，腰中如张弓弩弦；刺厥阴之脉，在踵鱼腹之外，循之累累然，乃刺之；其病令人善言，或默默然不慧，刺之三痏。","notes":[],"pending":false},{"id":"sw41-2","tags":[],"yw":"解脈令人腰痛，痛引肩，目KTKT然，時遺溲，刺解脈，在膝筋肉分間外廉之橫脈出血，血變而止。解脈令人腰痛如引帶，常如折腰狀，善恐，刺解脈，在中結絡如黍米，刺之血射以黑，見赤血而已。同陰之脈，令人腰痛，痛如小錘居其中，怫然腫，刺同陰之脈，在外踝上絕骨之端，爲三。陽維之脈令人腰痛，痛上怫然腫，刺陽維之脈，脈與太陽合下間，去地一尺所。衡絡之脈令人腰痛，不可以俯仰，仰則恐僕，得之舉重傷腰，衡絡絕，惡血歸之，刺之在陽、筋之間，上數寸，衡居爲二出血。","bh":"解脉令人腰痛，痛引肩，目䀮䀮然，时遗溲；刺解脉，在膝筋肉分间、外廉之横脉出血，血变而止。解脉令人腰痛如引带，常如折腰状，善恐；刺解脉，在郄中结络如黍米，刺之血射以黑，见赤血而已。同阴之脉令人腰痛，痛如小锤居其中，怫然肿；刺同阴之脉，在外踝上绝骨之端，为三痏。阳维之脉令人腰痛，痛上怫然肿；刺阳维之脉，脉与太阳合腨下间，去地一尺所。衡络之脉令人腰痛，不可以俯仰，仰则恐仆；得之于举重伤腰，衡络绝，恶血归之；刺之在郄阳、筋之间，上郄数寸，衡居为二痏出血。","notes":[],"pending":false},{"id":"sw41-3","tags":[],"yw":"會陰之脈令人腰痛，痛上漯漯然汗出，汗干令人欲飲，飲已欲走，刺直陽之脈上三，在蹺上下五寸橫居，視其盛者出血。飛陽之脈令人腰痛，痛上拂拂然，甚則悲以恐，刺飛陽之脈，在內踝上五寸，少陰之前，與陰維之會。昌陽之脈令人腰痛，痛引膺，目KTKT然，甚則反折，舌卷不能言，刺內筋爲二，在內踝上大筋前太陰後，上踝二寸所。散脈令人腰痛而熱，熱甚生煩，腰下如有橫木居其中，甚則遺溲，刺散脈，在膝前骨肉分間，絡外廉，束脈爲三。","bh":"会阴之脉令人腰痛，痛上漯漯然汗出，汗干令人欲饮，饮已欲走；刺直阳之脉上三痏，在𫏋上郄下五寸横居，视其盛者出血。飞阳之脉令人腰痛，痛上拂拂然，甚则悲以恐；刺飞阳之脉，在内踝上五寸，少阴之前，与阴维之会。昌阳之脉令人腰痛，痛引膺，目䀮䀮然，甚则反折，舌卷不能言；刺内筋为二痏，在内踝上大筋前、太阴后，上踝二寸所。散脉令人腰痛而热，热甚生烦，腰下如有横木居其中，甚则遗溲；刺散脉，在膝前骨肉分间、络外廉，束脉为三痏。","notes":[],"pending":false},{"id":"sw41-4","tags":[],"yw":"肉裏之脈令人腰痛，不可以咳，咳則筋縮急，刺肉裏之脈爲二，在太陽之外，少陽絕骨之後。腰痛俠脊而痛至頭KTKT然，目KTKT欲僵僕，刺足太陽中出血。腰痛上寒，刺足太陽陽明；上熱，刺足厥陰；不可以俯仰，刺足少陽；中熱而喘，刺足少陰，刺中出血。腰痛，上寒不可顧，刺足陽明；上熱，刺足太陰；中熱而喘，刺足少陰。大便難，刺足少陰。少腹滿，刺足厥陰。如折不可以俯仰，不可舉，刺足太陽。引脊內廉，刺足少陰。腰痛引少腹控，不可以仰，刺腰尻交者，兩髁胂上，以月生死爲數，發針立已，左取右，右取左。","bh":"肉里之脉令人腰痛，不可以咳，咳则筋缩急；刺肉里之脉为二痏，在太阳之外，少阳绝骨之后。腰痛侠脊而痛至头，几几然，目䀮䀮欲僵仆，刺足太阳郄中出血。腰痛上寒，刺足太阳、阳明；上热，刺足厥阴；不可以俯仰，刺足少阳；中热而喘，刺足少阴，刺郄中出血。腰痛上寒不可顾，刺足阳明；上热，刺足太阴；中热而喘，刺足少阴。大便难，刺足少阴。少腹满，刺足厥阴。如折不可以俯仰、不可举，刺足太阳。痛引脊内廉，刺足少阴。腰痛引少腹、控䏚，不可以仰，刺腰尻交者，两髁胂上，以月的生死为期数，发针立已，左取右，右取左。","notes":[],"pending":false},{"id":"sw41-5","tags":[],"yw":"舉痛論∶泣而（音澀）絀急（上丁骨切）腹中論∶（昨則切）茹（上力居切，下音如）脖（上蒲沒切，下鳥郎切）喑（音陰）刺腰痛論∶厭（於豔切）髁（苦瓦切）（音遼）踵（丑用切）蠡溝（上盧啓切，又落戈切）嘿（音黑）小錘（直垂切）漯（他合切）擷（虎結切）眇（亡表切）<目錄>卷第十二","bh":"此段为《举痛论》《腹中论》《刺腰痛论》各篇音释及卷第十二目录，无正文。","notes":[],"pending":false}]},
{"id":"sw42","book":"素问","no":42,"title":"风论","titleTw":"風論","tags":["jingluo","zhenfa","bingji"],"brief":"论风邪善行数变，入于不同部位则成寒热、热中、寒中、疠风、偏枯及五脏风等，并述其诊法与表现。","pending":false,"sections":[{"id":"sw42-1","tags":[],"yw":"黃帝問曰∶風之傷人也，或爲寒熱，或爲熱中，或爲寒中，或爲癘風，或爲偏枯，或爲風也，其病各異，其名不同，或內至五髒六腑，不知其解，願聞其說。岐伯對曰∶風氣藏於皮膚之間，內不得通，外不得泄，風者善行而數變，腠理開則灑然寒，閉則熱而悶，其寒也則衰食飲，其熱也則消肌肉，故使人慄而不能食，名曰寒熱。風氣與陽明入胃，循脈而上至目內，其人肥則風氣不得外泄，則爲熱中而目黃；人瘦則外泄而寒，則爲寒中而泣出。風氣與太陽俱入，行諸脈俞，散於分肉之間，與衛氣相干，其道不利，故使肌肉憤而有瘍，衛氣有所凝而不行，故其肉有不仁也。","bh":"黄帝问：风之伤人，或为寒热，或为热中，或为寒中，或为疠风，或为偏枯，或为风，其病各异，其名不同，或内至五脏六腑，不知其解，愿闻其说。岐伯回答：风气藏于皮肤之间，内不得通，外不得泄；风善行而数变，腠理开则洒然寒，闭则热而闷；其寒则衰食饮，其热则消肌肉，所以使人战栗而不能食，名叫寒热。风气与阳明入胃，循脉而上至目内眦；其人肥则风气不得外泄，则为热中而目黄；人瘦则外泄而寒，则为寒中而泣出。风气与太阳俱入，行诸脉俞，散于分肉之间，与卫气相干，其道不利，所以使肌肉愤胀而有疡；卫气有所凝而不行，所以其肉有不仁。","notes":[],"pending":false},{"id":"sw42-2","tags":[],"yw":"癘者，有榮氣熱，其氣不清，故使其鼻柱壞而色敗，皮膚瘍潰，風寒客於脈而不去，名曰癘風，或名曰寒熱。以春甲乙傷於風者爲肝風，以夏丙丁傷於風者爲心風，以季夏戊己傷於邪者爲脾風，以秋庚辛中於邪者爲肺風，以冬壬癸中於邪者爲腎風。風中五髒六腑之俞，亦爲髒腑之風，各入其門戶所中，則爲偏風。風氣循風府而上，則爲腦風。風入系頭，則爲目風，眼寒。飲酒中風，則爲漏風。入房汗出中風，則爲內風。新沐中風，則爲首風。久風入中，則爲腸風飧泄。","bh":"疠的，是营气有热，其气不清，所以使其鼻柱坏而色败，皮肤疡溃；风寒客于脉而不去，名叫疠风，或名叫寒热。以春甲乙伤于风的为肝风，以夏丙丁伤于风的为心风，以季夏戊己伤于邪的为脾风，以秋庚辛中于邪的为肺风，以冬壬癸中于邪的为肾风。风中五脏六腑之俞，也为脏腑之风，各入其门户所中的则为偏风。风气循风府而上，则为脑风。风入系头，则为目风、眼寒。饮酒中风，则为漏风。入房汗出中风，则为内风。新沐中风，则为首风。久风入中，则为肠风飧泄。","notes":[],"pending":false},{"id":"sw42-3","tags":[],"yw":"外在腠理，則爲泄風。故風者百病之長也，至其變化乃爲他病也，無常方，然致有風氣也。帝曰∶五髒風之形狀不同者何？願聞其診及其病能。岐伯曰∶肺風之狀，多汗惡風，色然白，時咳短氣，晝日則瘥，暮則甚，診在眉上，其色白。心風之狀，多汗惡風，焦絕善怒嚇，赤色，病甚則言不可快，診在口，其色赤。肝風之狀，多汗惡風，善悲，色微蒼，嗌干善怒，時憎女子，診在目下，其色青。脾風之狀，多汗惡風，身體怠惰，四肢不欲動，色薄微黃，不嗜食，診在鼻上，其色黃。","bh":"外在腠理，则为泄风。所以风是百病之长，至其变化乃为他病，没有一定的方所，然而都是致有风气。黄帝问：五脏风之形状不同的是什么？愿闻其诊断及其病能。岐伯说：肺风之状，多汗恶风，色皏然白，时咳短气，昼日则瘥，暮则甚；诊在眉上，其色白。心风之状，多汗恶风，焦绝善怒吓，赤色，病甚则言不可快；诊在口，其色赤。肝风之状，多汗恶风，善悲，色微苍，嗌干善怒，时憎女子；诊在目下，其色青。脾风之状，多汗恶风，身体怠惰，四肢不欲动，色薄微黄，不嗜食；诊在鼻上，其色黄。","notes":[],"pending":false},{"id":"sw42-4","tags":[],"yw":"腎風之狀，多汗惡風，面然浮腫，脊痛不能正立，其色，隱曲不利，診在肌上，其色黑。胃風之狀，頸多汗惡風，食飲不下，膈塞不通，腹善滿，失衣則脹，食寒則泄，診形瘦而腹大。首風之狀，頭面多汗惡風，當先風一日則病甚，頭痛不可以出內，至其風日則病少愈。漏風之狀，或多汗，常不可單衣，食則汗出，甚則身汗，喘息惡風，衣常濡，口干善渴，不能勞事。泄風之狀，多汗，汗出泄衣上，口中干，上漬，其風不能勞事，身體盡痛則寒。帝曰∶善。","bh":"肾风之状，多汗恶风，面痝然浮肿，脊痛不能正立，其色炲，隐曲不利；诊在肌上，其色黑。胃风之状，颈多汗恶风，食饮不下，膈塞不通，腹善满，少衣则胀，食寒则泄；诊其人形瘦而腹大。首风之状，头面多汗恶风，当先风一日则病甚，头痛不可以出内，至其风日则病少愈。漏风之状，或多汗，常不可单衣，食则汗出，甚则身汗，喘息恶风，衣常濡，口干善渴，不能劳事。泄风之状，多汗，汗出泄于衣上，口中干，上身浸渍，其风不能劳事，身体尽痛则寒。黄帝说：好。","notes":[],"pending":false},{"id":"sw42-5","tags":[],"yw":"<目錄>卷第十二","bh":"此段仅存卷第十二目录标识，无正文。","notes":[],"pending":false}]},
{"id":"sw43","book":"素问","no":43,"title":"痹论","titleTw":"痹論","tags":["zhenfa","bingji","zangxiang"],"brief":"论风寒湿三气杂至合而为痹，分行痹、痛痹、著痹及五体痹、五脏痹、六腑痹，并述症状、病机与针治。","pending":false,"sections":[{"id":"sw43-1","tags":[],"yw":"黃帝問曰∶痹之安生？岐伯對曰∶風寒溼三氣雜至，合而爲痹也。其風氣勝者爲行痹，寒氣勝者爲痛痹，溼氣勝者爲着痹也。帝曰∶其有五者何也？岐伯曰∶以冬遇此者爲骨痹，以春遇此者爲筋痹，以夏遇此者爲脈痹，以至陰遇此者爲肌痹，以秋遇此者爲皮痹。帝曰∶內舍五髒六腑，何氣使然？岐伯曰∶五髒皆有合，病久而不去者，內舍於其合也。故骨痹不已，復感於邪，內舍於腎。筋痹不已，復感於邪，內舍於肝。脈痹不已，復感於邪，內舍於心。","bh":"黄帝问：痹怎样发生？岐伯回答：风寒湿三气杂至，合而为痹。其风气胜的为行痹，寒气胜的为痛痹，湿气胜的为著痹。黄帝问：其有五种是为什么？岐伯说：以冬遇此的为骨痹，以春遇此的为筋痹，以夏遇此的为脉痹，以至阴遇此的为肌痹，以秋遇此的为皮痹。黄帝问：内舍于五脏六腑，是什么气使之然？岐伯说：五脏皆有合，病久而不去的，内舍于其所合。所以骨痹不已，复感于邪，内舍于肾。筋痹不已，复感于邪，内舍于肝。脉痹不已，复感于邪，内舍于心。","notes":[],"pending":false},{"id":"sw43-2","tags":[],"yw":"肌痹不已，復感於邪，內舍於脾。皮痹不已，復感於邪，內舍於肺。所謂痹者，各以其時重感於風寒溼之氣也。凡痹之客五髒者，肺痹者，煩滿喘而嘔。心痹者，脈不通，煩則心下鼓，暴上氣而喘，嗌干善噫，厥氣上則恐。肝痹者，夜臥則驚，多飲數小便，上爲引如懷。腎痹者，善脹，尻以代踵，脊以代頭。脾痹者，四肢解惰，發咳嘔汁，上爲大塞。腸痹者，數飲而出不得，中氣喘爭，時發飧泄。胞痹者，少腹膀胱按之內痛，若沃以湯，澀於小便，上爲清涕。","bh":"肌痹不已，复感于邪，内舍于脾。皮痹不已，复感于邪，内舍于肺。所谓痹，是各以其时重感于风寒湿之气。凡痹之客于五脏的：肺痹的，烦满喘而呕。心痹的，脉不通，烦则心下鼓动，暴上气而喘，嗌干善噫，厥气上逆则恐。肝痹的，夜卧则惊，多饮、数小便，上为牵引如怀物状。肾痹的，善胀，尻以代踵，脊以代头。脾痹的，四肢解惰，发咳呕汁，上为大塞。肠痹的，数饮而出不得，中气喘争，时发飧泄。胞痹的，少腹膀胱按之内痛，若浇灌以热水，涩于小便，上为清涕。","notes":[],"pending":false},{"id":"sw43-3","tags":[],"yw":"陰氣者，靜則神藏，躁則消亡，飲食自倍，腸胃乃傷。淫氣喘息，痹聚在肺；淫氣憂思，痹聚在心；淫氣遺溺，痹聚在腎；淫氣乏竭，痹聚在肝；淫氣肌絕，痹聚在脾。諸痹不已，亦益內也。其風氣勝者，其人易已也。帝曰∶痹，其時有死者，或疼久者，或易已者，其故何也？岐伯曰∶其入髒者死，其留連筋骨間者疼久，其留皮膚間者易已。帝曰∶其客於六腑者何也？岐伯曰∶此亦其食飲居處，爲其病本也。六腑亦各有俞，風寒溼氣中其俞，而食飲應之，循俞而入，各舍其腑也。","bh":"阴气，静则神藏，躁则消亡；饮食自倍，肠胃乃伤。淫气喘息，痹聚在肺；淫气忧思，痹聚在心；淫气遗溺，痹聚在肾；淫气乏竭，痹聚在肝；淫气肌绝，痹聚在脾。诸痹不已，也日益内。其风气胜的，其人易已。黄帝问：痹，其时有死的，或疼久的，或易已的，是什么缘故？岐伯说：其入脏的死，其留连筋骨间的疼久，其留于皮肤间的易已。黄帝问：其客于六腑的是为什么？岐伯说：这也是其食饮居处为其病本。六腑也各有俞，风寒湿气中其俞，而食饮应之，循俞而入，各舍其腑。","notes":[],"pending":false},{"id":"sw43-4","tags":[],"yw":"帝曰∶以針治之奈何？岐伯曰∶五髒有俞，六腑有合，循脈之分，各有所發，各隨其過，則病瘳也。帝曰∶榮衛之氣亦令人痹乎？岐伯曰∶榮者，水谷之精氣也，和調於五髒，灑陳於六腑，乃能入於脈也，故循脈上下，貫五髒，絡六腑也。衛者，水谷之悍氣也，其氣疾滑利，不能入於脈也，故循皮膚之中，分肉之間，燻於肓膜，散於胸腹，逆其氣則病，從其氣則愈，不與風寒溼氣合，故不爲痹。帝曰∶善。痹或痛，或不痛，或不仁，或寒，或熱，或燥，或溼，其故何也？岐伯曰∶痛者，寒氣多也，有寒故痛也。","bh":"黄帝问：以针治之怎样？岐伯说：五脏有俞，六腑有合，循脉之分，各有所发，各随其过，则病愈。黄帝问：营卫之气也令人痹吗？岐伯说：营是水谷之精气，和调于五脏，洒陈于六腑，乃能入于脉，所以循脉上下，贯五脏，络六腑。卫是水谷之悍气，其气疾滑利，不能入于脉，所以循行于皮肤之中、分肉之间，熏于肓膜，散于胸腹；逆其气则病，从其气则愈；不与风寒湿气相合，所以不为痹。黄帝说：好。痹或痛，或不痛，或不仁，或寒，或热，或燥，或湿，是什么缘故？岐伯说：痛的，是寒气多，有寒所以痛。","notes":[],"pending":false},{"id":"sw43-5","tags":[],"yw":"其不痛不仁者，病久入深，榮衛之行澀，經絡時疏，故不通，皮膚不營，故爲不仁。其寒者，陽氣少，陰氣多，與病相益，故寒也。其熱者，陽氣多，陰氣少，病氣勝陽遭陰，故爲痹熱。其多汗而濡者，此其逢溼甚也，陽氣少，陰氣盛，兩氣相感，故汗出而濡也。帝曰∶夫痹之爲病，不痛何也？岐伯曰∶痹在於骨則重，在於脈則血凝而不流，在於筋則屈不伸，在於肉則不仁，在於皮則寒，故具此五者，則不痛也。凡痹之類，逢寒則蟲，逢熱則縱。帝曰∶善。","bh":"其不痛不仁的，病久入深，营卫之行涩，经络时疏，所以不通；皮肤不营，所以为不仁。其寒的，阳气少，阴气多，与病相益，所以寒。其热的，阳气多，阴气少，病气胜，阳遭阴，所以为痹热。其多汗而濡的，这是逢湿甚，阳气少、阴气盛，两气相感，所以汗出而濡。黄帝问：痹之为病，有不痛的为什么？岐伯说：痹在于骨则重，在于脉则血凝而不流，在于筋则屈不伸，在于肉则不仁，在于皮则寒，所以具备这五者的就不痛。凡痹之类，逢寒则急，逢热则纵。黄帝说：好。","notes":[],"pending":false},{"id":"sw43-6","tags":[],"yw":"<目錄>卷第十二","bh":"此段仅存卷第十二目录标识，无正文。","notes":[],"pending":false}]},
{"id":"sw44","book":"素问","no":44,"title":"痿论","titleTw":"痿論","tags":["zhenfa","bingji","zangxiang"],"brief":"论五脏气热致五体失养而成痿的病因与鉴别，阐明治痿独取阳明及宗筋、带脉、督脉相关的道理。","pending":false,"sections":[{"id":"sw44-1","tags":[],"yw":"黃帝問曰∶五髒使人痿何也？岐伯對曰∶肺主身之皮毛，心主身之血脈，肝主身之筋膜，脾主身之肌肉，腎主身之骨髓，故肺熱葉焦，則皮毛虛弱急薄着，則生痿也。心氣熱，則下脈厥而上，上則下脈虛，虛則生脈痿，樞折挈，脛縱而不任地也。肝氣熱，則膽泄口苦筋膜干，筋膜干則筋急而攣，發爲筋痿。脾氣熱，則胃干而渴，肌肉不仁，發爲肉痿。腎氣熱，則腰脊不舉，骨枯而髓減，發爲骨痿。帝曰∶何以得之？岐伯曰∶肺者，髒之長也，爲心之蓋也，有所失亡，所求不得，則發肺鳴，鳴則肺熱葉焦。","bh":"黄帝问：五脏使人痿是为什么？岐伯回答：肺主身之皮毛，心主身之血脉，肝主身之筋膜，脾主身之肌肉，肾主身之骨髓。所以肺热叶焦，则皮毛虚弱急薄，着而不去则生痿躄。心气热，则下脉厥而上，上则下脉虚，虚则生脉痿，关节如枢折而不能提挈，胫纵而不能任地。肝气热，则胆泄口苦、筋膜干；筋膜干则筋急而挛，发为筋痿。脾气热，则胃干而渴，肌肉不仁，发为肉痿。肾气热，则腰脊不举，骨枯而髓减，发为骨痿。黄帝问：怎样得之？岐伯说：肺是脏之长，为心之盖；有所失亡，所求不得，则发肺鸣，鸣则肺热叶焦。","notes":[],"pending":false},{"id":"sw44-2","tags":[],"yw":"故曰∶五髒因肺熱葉焦，發爲痿。此之謂也。悲哀太甚，則胞絡絕，胞絡絕則陽氣內動，發則心下崩數溲血也。故《本病》曰∶大經空虛，發爲肌痹，傳爲脈痿。思想無窮，所願不得，意淫於外，入房太甚，宗筋弛縱，發爲筋痿，及爲白淫。故《下經》曰∶筋痿者，生於肝使內也。有漸於溼，以水爲事，若有所留，居處相溼，肌肉濡漬，痹而不仁，發爲肉痿。故《下經》曰∶肉痿者，得之溼地也。有所遠行勞倦，逢大熱而渴，渴則陽氣內伐，內伐則熱舍於腎，腎者水髒也，今水不勝火，則骨枯而髓虛，故足不任身，發爲骨痿。","bh":"所以说：五脏因肺热叶焦，发为痿躄。就是这个意思。悲哀太甚，则胞络绝；胞络绝则阳气内动，发则心下崩、数溲血。所以《本病》说：大经空虚，发为肌痹，传为脉痿。思想无穷，所愿不得，意淫于外，入房太甚，宗筋弛纵，发为筋痿，及为白淫。所以《下经》说：筋痿的，生于肝，使内也。有渐于湿，以水为事，若有所留，居处相湿，肌肉濡渍，痹而不仁，发为肉痿。所以《下经》说：肉痿的，得之于湿地。有所远行劳倦，逢大热而渴，渴则阳气内伐，内伐则热舍于肾；肾是水脏，今水不胜火，则骨枯而髓虚，所以足不任身，发为骨痿。","notes":[],"pending":false},{"id":"sw44-3","tags":[],"yw":"故《下經》曰∶骨痿者，生於大熱也。帝曰∶何以別之？岐伯曰∶肺熱者色白而毛敗，心熱者色赤而絡脈溢，肝熱者色蒼而爪枯，脾熱者色黃而肉蠕動，腎熱者色黑而齒槁。帝曰∶如夫子言可矣，論言治痿者獨取陽明何也？岐伯曰∶陽明者，五髒六腑之海，主潤宗筋，宗筋主束骨而利機關也。衝脈者，經脈之海也，主滲灌溪谷，與陽明合於宗筋，陰陽宗筋之會，會於氣街，而陽明爲之長，皆屬於帶脈，而絡於督脈。故陽明虛則宗筋縱，帶脈不引，故足痿不用也。","bh":"所以《下经》说：骨痿的，生于大热。黄帝问：怎样区别？岐伯说：肺热的色白而毛败，心热的色赤而络脉溢，肝热的色苍而爪枯，脾热的色黄而肉蠕动，肾热的色黑而齿槁。黄帝说：如夫子所言可矣，可是论言治痿者独取阳明是为什么？岐伯说：阳明是五脏六腑之海，主润宗筋，宗筋主束骨而利机关。冲脉是经脉之海，主渗灌溪谷，与阳明合于宗筋；阴阳宗筋之会，会于气街，而阳明为之长，都连属于带脉，而络于督脉。所以阳明虚则宗筋纵，带脉不引，所以足痿不用。","notes":[],"pending":false},{"id":"sw44-4","tags":[],"yw":"帝曰∶治之奈何？岐伯曰∶各補其滎而通其俞，調其虛實，和其逆順，筋脈骨肉。各以其時受月，則病已矣。帝曰∶善。<目錄>卷第十二","bh":"黄帝问：怎样治疗？岐伯说：各补其荥而通其俞，调其虚实，和其逆顺；筋、脉、骨、肉各以其时受月，则病已。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw45","book":"素问","no":45,"title":"厥论","titleTw":"厥論","tags":["jingluo","zhenfa","bingji"],"brief":"论寒厥、热厥的病因病机与足下热、手足寒之理，并分述六经厥及十二经厥逆的证候与预后。","pending":false,"sections":[{"id":"sw45-1","tags":[],"yw":"黃帝問曰∶厥之寒熱者何也？岐伯對曰∶陽氣衰於下，則爲寒厥；陰氣衰於下，則爲熱厥。帝曰∶熱厥之爲熱也，必起於足下者何也？岐伯曰∶陽氣起於足五指之表，陰脈者集於足下而聚於足心，故陽氣勝則足下熱也。帝曰∶寒厥之爲寒也，必從五指而上於膝者何也？岐伯曰∶陰氣起於五指之裏，集於膝下而聚於膝上，故陰氣勝則從五指至膝上寒，其寒也，不從外，皆從內也。帝曰∶寒厥何失而然也？岐伯曰∶前陰者，宗筋之所聚，太陰陽明之所合也。","bh":"黄帝问：厥之寒热是怎样的？岐伯回答：阳气衰于下，则为寒厥；阴气衰于下，则为热厥。黄帝问：热厥之发热，必起于足下是为什么？岐伯说：阳气起于足五指之表，阴脉者集于足下而聚于足心，所以阳气胜则足下热。黄帝问：寒厥之发寒，必从五指而上于膝是为什么？岐伯说：阴气起于五指之里，集于膝下而聚于膝上，所以阴气胜则从五指至膝上寒；其寒不从外来，都从内生。黄帝问：寒厥是怎样失于调摄而成的？岐伯说：前阴是宗筋之所聚，是太阴阳明之所合。","notes":[],"pending":false},{"id":"sw45-2","tags":[],"yw":"春夏則陽氣多而陰氣少，秋冬則陰氣盛而陽氣衰。此人者質壯，以秋冬奪於所用，下氣上爭，不能復，精氣溢下，邪氣因從之而上也，氣因於中，陽氣衰，不能滲營其經絡，陽氣日損，陰氣獨在，故手足爲之寒也。帝曰∶熱厥何如而然也？岐伯曰∶酒入於胃，則絡脈滿而經脈虛，脾主爲胃行其津液者也，陰氣虛則陽氣入，陽氣入則胃不和，胃不和則精氣竭，精氣竭則不營其四肢也。此人必數醉若飽以入房，氣聚於脾中不得散，酒氣與谷氣相薄，熱盛於中，故熱遍於身內熱而溺赤也。","bh":"春夏则阳气多而阴气少，秋冬则阴气盛而阳气衰。这种人质地强壮，因秋冬夺于所用，下气上争而不能复，精气溢下，邪气因而从之而上；气因于中，阳气衰，不能渗营其经络，阳气日损，阴气独在，所以手足为之寒。黄帝问：热厥是怎样而成的？岐伯说：酒入于胃，则络脉满而经脉虚；脾是为胃行其津液的，阴气虚则阳气入，阳气入则胃不和，胃不和则精气竭，精气竭则不营其四肢。这种人必屡醉或饱后入房，气聚于脾中不得散，酒气与谷气相薄，热盛于中，所以热遍于身、内热而溺赤。","notes":[],"pending":false},{"id":"sw45-3","tags":[],"yw":"夫酒氣盛而悍，腎氣有衰，陽氣獨勝，故手足爲之熱也。帝曰∶厥或令人腹滿，或令人暴不知人，或至半日遠至一日乃知人者何也？岐伯曰∶陰氣盛於上則下虛，下虛則腹脹滿，陽氣盛於上則下氣重上而邪氣逆，逆則陽氣亂，陽氣亂則不知人也。帝曰∶善。願聞六經脈之厥狀病能也。岐伯曰∶巨陽之厥，則腫首頭重，足不能行，發爲僕。陽明之厥，則癲疾欲走呼，腹滿不得臥，面赤而熱，妄見而妄言。少陽之厥，則暴聾頰腫而熱，脅痛，不可以運。太陰之厥，則腹滿脹，後不利，不欲食，食則嘔，不得臥。","bh":"酒气盛而慓悍，肾气有衰，阳气独胜，所以手足为之热。黄帝问：厥或令人腹满，或令人暴不知人，或至半日、远至一日才知人的，是为什么？岐伯说：阴气盛于上则下虚，下虚则腹胀满；阳气盛于上则下气重上而邪气逆，逆则阳气乱，阳气乱则不知人。黄帝说：好。愿闻六经脉之厥状病能。岐伯说：巨阳之厥，则头肿头重，足不能行，发为眩仆。阳明之厥，则癫疾欲走而呼，腹满不得卧，面赤而热，妄见而妄言。少阳之厥，则暴聋、颊肿而热，胁痛，不可以转侧。太阴之厥，则腹满腹胀，大便不利，不欲食，食则呕，不得卧。","notes":[],"pending":false},{"id":"sw45-4","tags":[],"yw":"少陰之厥，則口干溺赤，腹滿心痛。厥陰之厥，則少腹腫痛，腹脹涇溲不利，好臥屈膝，陰縮腫，內熱。盛則瀉之，虛則補之，不盛不虛，以經取之。太陰厥逆，急攣，心痛引腹，治主病者。少陰厥逆，虛滿嘔變，下泄清，治主病者。厥陰厥逆，攣腰痛，虛滿前閉譫言，治主病者。三陰俱逆，不得前後，使人手足寒，三日死。太陽厥逆，僵僕嘔血善衄，治主病者。少陽厥逆，機關不利，機關不利者，腰不可以行，項不可以顧，發腸癰不可治，驚者死。","bh":"少阴之厥，则口干溺赤，腹满心痛。厥阴之厥，则少腹肿痛，腹胀，小便不利，好卧屈膝，阴缩而肿，内热。盛则泻之，虚则补之，不盛不虚的，以经取之。太阴厥逆，小腿急挛，心痛引腹，治其主病之经。少阴厥逆，虚满呕变，下泄清稀，治其主病之经。厥阴厥逆，拘挛腰痛，虚满、小便不通、谵言，治其主病之经。三阴俱逆，大小便不通，使人手足寒，三日死。太阳厥逆，僵仆、呕血、善衄，治其主病之经。少阳厥逆，机关不利；机关不利的，腰不可以行，项不可以顾；发肠痈则不可治，惊的死。","notes":[],"pending":false},{"id":"sw45-5","tags":[],"yw":"陽明厥逆，喘咳身熱，善驚衄嘔血。手太陰厥逆，虛滿而咳，善嘔沫，治主病者。手心主少陰厥逆，心痛引喉，身熱。死不可治。手太陽厥逆，耳聾泣出，項不可以顧，腰不可以俯仰，治主病者。手陽明少陽厥逆，發喉痹，嗌腫，，治主病者。風論∶癘（音利）潰（胡對切）腦（奴皓切）痹論∶肓（音荒）痿論∶（必亦切）髖（音寬）尻（枯熬切）（音總）臏（音牝）厥論∶譫（音詹）僵（居良切）僕（音赴）髦（音毛）<目錄>卷第十三","bh":"阳明厥逆，喘咳身热，善惊、衄、呕血。手太阴厥逆，虚满而咳，善呕沫，治其主病之经。手心主、少阴厥逆，心痛引喉，身热，死不可治。手太阳厥逆，耳聋泣出，项不可以顾，腰不可以俯仰，治其主病之经。手阳明、少阳厥逆，发喉痹，嗌肿，痓，治其主病之经。","notes":[],"pending":false}]},
{"id":"sw46","book":"素问","no":46,"title":"病能论","titleTw":"病能論","tags":["ci","zhenfa","bingji"],"brief":"论胃脘痈、卧不安、不得偃卧、腰痛、颈痈、怒狂、酒风等病的诊断与同病异治，并释《上经》《下经》等义。","pending":false,"sections":[{"id":"sw46-1","tags":[],"yw":"黃帝問曰∶人病胃脘癰者，診當何如？岐伯對曰∶診此者當候胃脈，其脈當沉細，沉細者氣逆，逆者人迎甚盛，甚盛則熱，人迎者胃脈也，逆而盛，則熱聚於胃口而不行，故胃脘爲癰也。帝曰∶善。人有臥而有所不安者何也？岐伯曰∶髒有所傷及，精有所之寄，則安，故人不能懸其病也。帝曰∶人之不得偃臥者何也？岐伯曰∶肺者髒之蓋也，肺氣盛則脈大，脈大則不得偃臥，論在《奇恆陰陽》中。帝曰∶有病厥者，診右脈沉而緊，左脈浮而遲，不然，病主安在？岐伯曰∶冬診之，右脈固當沉緊，此應四時，左脈浮而遲，此逆四時，在左當主病在腎，頗關在肺，當腰痛也。","bh":"黄帝问：人病胃脘痈的，诊断应当怎样？岐伯回答：诊此的当候胃脉，其脉当沉细，沉细是气逆，逆者人迎甚盛，甚盛则热；人迎是胃脉，逆而盛，则热聚于胃口而不行，所以胃脘为痈。黄帝说：好。人有卧而有所不安的是为什么？岐伯说：脏有所损伤，及其精有所寄托之处得安，则安；所以人不能悬空其病。黄帝问：人之不得偃卧的是为什么？岐伯说：肺是脏之盖，肺气盛则脉大，脉大则不得偃卧，论在《奇恒阴阳》中。黄帝问：有病厥的，诊右脉沉而紧，左脉浮而迟，不知病主安在？岐伯说：冬天诊之，右脉固当沉紧，这是应四时；左脉浮而迟，这是逆四时；在左当主病在肾，颇关连在肺，应当腰痛。","notes":[],"pending":false},{"id":"sw46-2","tags":[],"yw":"帝曰∶何以言之？岐伯曰∶少陰脈貫腎絡肺，今得肺脈，腎爲之病，故腎爲腰痛之病也。帝曰∶善。有病頸癰者，或石治之，或針灸治之，而皆已，其真安在？岐伯曰∶此同名異等者也。夫癰氣之息者，宜以針開除去之，夫氣盛血聚者，宜石而瀉之，此所謂同病異治也。帝曰∶有病怒狂者，此病安生？岐伯曰∶生於陽也。帝曰∶陽何以使人狂？岐伯曰∶陽氣者，因暴折而難決，故善怒也，病名曰陽厥。帝曰∶何以知之？岐伯曰∶陽明者常動，巨陽少陽不動，不動而動大疾，此其候也？帝曰∶治之奈何？岐伯曰∶奪其食即已，夫食入於陰，長氣於陽，故奪其食即已。","bh":"黄帝问：为什么这样说？岐伯说：少阴脉贯肾络肺，今得肺脉，肾为之病，所以肾为腰痛之病。黄帝说：好。有病颈痈的，或用砭石治之，或用针灸治之，而都愈，其真法安在？岐伯说：这是同名而异等。痈气之息的，宜以针开除去之；气盛血聚的，宜用砭石而泻之，这就是所谓同病异治。黄帝问：有病怒狂的，此病怎样发生？岐伯说：生于阳。黄帝问：阳为什么使人狂？岐伯说：阳气因暴折而难决，所以善怒，病名叫阳厥。黄帝问：怎样知道？岐伯说：阳明常动，巨阳、少阳不动，不动而动且大疾，这就是其候。黄帝问：怎样治疗？岐伯说：夺其食即已；食入于阴，长气于阳，所以夺其食即已。","notes":[],"pending":false},{"id":"sw46-3","tags":[],"yw":"使之服以生鐵洛爲飲，夫生鐵洛者，下氣疾也。帝曰∶善。有病身熱解惰，汗出如浴，惡風少氣，此爲何病？岐伯曰∶病名曰酒風。帝曰∶治之奈何？岐伯曰∶以澤瀉、術各十分，麋銜五分，合以三指撮爲後飯。所謂深之細者，其中手如針也，摩之切之，聚者堅也，博者大也。《上經》者，言氣之通天也。《下經》者，言病之變化也。《金匱》者，決死生也。《揆度》者，切度之也。《奇恆》者，言奇病也。所謂奇者，使奇病不得以四時死也。恆者，得以四時死也。","bh":"使之服用生铁洛为饮，生铁洛是下气最疾的。黄帝说：好。有病身热解惰，汗出如浴，恶风少气，这是什么病？岐伯说：病名叫酒风。黄帝问：怎样治疗？岐伯说：用泽泻、术各十分，麋衔五分，合以三指撮为后饭。所谓深之细的，其中手如针；摩之切之，聚的坚，博的大。《上经》是言气之通天。《下经》是言病之变化。《金匮》是决死生。《揆度》是切度之。《奇恒》是言奇病。所谓奇，是使奇病不得以四时死；恒，是得以四时死。","notes":[],"pending":false},{"id":"sw46-4","tags":[],"yw":"所謂揆者，方切求之也，言切求其脈理也。度者，得其病處，以四時度之也。<目錄>卷第十三","bh":"所谓揆，是方切求之，说的是切求其脉理。度，是得其病处，以四时度之。","notes":[],"pending":false}]},
{"id":"sw47","book":"素问","no":47,"title":"奇病论","titleTw":"奇病論","tags":["ci","zhenfa","bingji"],"brief":"论妊娠九月而喑、息积、伏梁、疹筋、厥逆头痛、脾瘅、胆瘅、厥、胎病、肾风等奇病的病机与治法。","pending":false,"sections":[{"id":"sw47-1","tags":[],"yw":"黃帝問曰∶人有重身，九月而喑，此爲何也？岐伯對曰∶胞之絡脈絕也。帝曰∶何以言之？岐伯曰∶胞絡者系於腎，少陰之脈，貫腎系舌本，故不能言。帝曰∶治之奈何？岐伯曰∶無治也，當十月復。《刺法》曰∶無損不足，益有餘，以成其疹，然後調之。所謂無損不足者，身羸瘦，無用石也。無益其有餘者，腹中有形而泄之，泄之則精出而病獨擅中，故曰疹成也。帝曰∶病脅下滿氣逆，二三歲不已，是爲何病？岐伯曰∶病名曰息積，此不妨於食，不可灸刺，積爲導引服藥，藥不能獨治也。","bh":"黄帝问：人有怀孕，九月而喑，这是为什么？岐伯回答：是胞之络脉绝。黄帝问：为什么这样说？岐伯说：胞络者系于肾，少阴之脉贯肾、系舌本，所以不能言。黄帝问：怎样治疗？岐伯说：无须治疗，当十月复。《刺法》说：无损不足，益有余，以成其疹，然后调之。所谓无损不足的，是身羸瘦，无用砭石。所谓无益有余的，是腹中有形而泄之；泄之则精出而病独擅于中，所以叫疹成。黄帝问：病胁下满、气逆，二三年不已，这是什么病？岐伯说：病名叫息积，这不妨于食，不可灸刺，积须导引服药，药不能独治。","notes":[],"pending":false},{"id":"sw47-2","tags":[],"yw":"帝曰∶人有身體髀股皆腫，環臍而痛，是爲何病？岐伯曰∶病名曰伏梁，此風根也。其氣溢於大腸而着於肓，肓之原在臍下，故環臍而痛也。不可動之，動之爲水溺澀之病也。帝曰∶人有尺脈數甚，筋急而見，此爲何病？岐伯曰∶此所謂疹筋，是人腹必急，白色黑色見，則病甚。帝曰∶人有病頭痛以數歲不已，此安得之，名爲何病？岐伯曰∶當有所犯大寒，內至骨髓，髓者以腦爲主，腦逆故令頭痛，齒亦痛，病名曰厥逆。帝曰∶善。帝曰∶有病口甘者，病名爲何？何以得之？岐伯曰∶此五氣之溢也，名曰脾癉。","bh":"黄帝问：人有身体髀股皆肿，环脐而痛，这是什么病？岐伯说：病名叫伏梁，这是风根。其气溢于大肠而着于肓，肓之原在脐下，所以环脐而痛。不可动之，动之则成水溺涩之病。黄帝问：人有尺脉数甚，筋急而见，这是什么病？岐伯说：这就是所谓疹筋；这种人腹部必拘急，白色、黑色见则病甚。黄帝问：人有病头痛，数年不已，这是怎样得的，名叫什么病？岐伯说：当有所犯大寒，内至骨髓；髓以脑为主，脑逆所以令头痛，齿也痛，病名叫厥逆。黄帝说：好。黄帝问：有病口甘的，病名叫什么？怎样得之？岐伯说：这是五气之溢，名叫脾瘅。","notes":[],"pending":false},{"id":"sw47-3","tags":[],"yw":"夫五味入口，藏於胃，脾爲之行其精氣，津液在脾，故令人口甘也，此肥美之所發也，此人必數食甘美而多肥也，肥者令人內熱，甘者令人中滿，故其氣上溢，轉爲消渴。治之以蘭，除陳氣也。帝曰∶有病口苦，取陽陵泉，口苦者病名爲何？何以得之？岐伯曰∶病名曰膽癉。夫肝者，中之將也，取決於膽，咽爲之使。此人者，數謀慮不決，故膽虛氣上溢而口爲之苦，治之以膽募俞，治在《陰陽十二官相使》中。帝曰∶有癃者，一日數十溲，此不足也。","bh":"五味入口，藏于胃，脾为之行其精气，津液在脾，所以令人口甘；这是肥美之所发，这种人必常食甘美而多肥。肥的令人内热，甘的令人中满，所以其气上溢，转为消渴。治之以兰，以除陈气。黄帝问：有病口苦，取阳陵泉；口苦的病名叫什么？怎样得之？岐伯说：病名叫胆瘅。肝是中之将，取决于胆，咽为之使。这种人屡次谋虑而不决，所以胆虚、气上溢而口为之苦；治之以胆募俞，治在《阴阳十二官相使》中。黄帝问：有癃的，一日数十溲，这是不足。","notes":[],"pending":false},{"id":"sw47-4","tags":[],"yw":"身熱如炭，頸膺如格，人迎躁盛，喘息氣逆，此有餘也。太陰脈微細如發者，此不足也。其病安在？名爲何病？岐伯曰∶病在太陰，其盛在胃，頗在肺，病名曰厥，死不治，此所謂得五有餘二不足也。帝曰∶何謂五有餘二不足？岐伯曰∶所謂五有餘者，五病之氣有餘也，二不足者，亦病氣之不足也。今外得五有餘，內得二不足，此其身不表不裏，亦正死明矣。帝曰∶人生而有病顛疾者，病名曰何？安所得之？岐伯曰∶病名爲胎病，此得之在母腹中時，其母有所大驚，氣上而不下，精氣並居，故令子發爲顛疾也。","bh":"身热如炭，颈膺如格，人迎躁盛，喘息气逆，这是有余。太阴脉微细如发，这是不足。其病安在？名叫什么病？岐伯说：病在太阴，其盛在胃，颇在肺，病名叫厥，死不治，这就是所谓得五有余、二不足。黄帝问：什么叫五有余、二不足？岐伯说：所谓五有余，是五脏病气之有余；二不足，也是病气之不足。今外得五有余，内得二不足，这是其身不表不里，也是正死明矣。黄帝问：人生下来就有癫疾的，病名叫什么？怎样得之？岐伯说：病名为胎病，这是得之于母腹中时，其母有所大惊，气上而不下，精气并居，所以令子发为癫疾。","notes":[],"pending":false},{"id":"sw47-5","tags":[],"yw":"帝曰∶有病然如有水狀，切其脈大緊，身無痛者，形不瘦，不能食，食少，名爲何病？岐伯曰∶病生在腎，名爲腎風。腎風而不能食善驚，驚已心氣痿者死。帝曰∶善。<目錄>卷第十三","bh":"黄帝问：有病痝然如有水状，切其脉大紧，身无痛处，形不瘦，不能食，食少，名叫什么病？岐伯说：病生在肾，名为肾风。肾风而不能食、善惊，惊后心气痿的死。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw48","book":"素问","no":48,"title":"大奇论","titleTw":"大奇論","tags":["zhenfa","bingji","zangxiang"],"brief":"论脏腑经脉气机失常所致的肿、痈、疝、瘕、痫厥、偏枯、肠澼下血等奇病的脉象及其死期。","pending":false,"sections":[{"id":"sw48-1","tags":[],"yw":"肝滿腎滿肺滿皆實，即爲腫。肺之雍，喘而兩滿。肝雍，兩滿，臥則驚，不得小便。腎雍，腳下至少腹滿，脛有大小，髀大跛，易偏枯。心脈滿大，癇螈筋攣。肝脈小急，癇螈筋攣。肝脈騖暴，有所驚駭，脈不至若喑，不治自已。腎脈小急，肝脈小急，心脈小急，不鼓皆爲瘕。腎肝並沉爲石水，並浮爲風水，並虛爲死，並小弦欲驚。腎脈大急沉，肝脈大急沉，皆爲疝。心脈搏滑急爲心疝，肺脈沉搏爲肺疝。三陽急爲瘕，三陰急爲疝，二陰急爲癇厥，二陽急爲驚。","bh":"肝满、肾满、肺满皆实，即为肿。肺之雍，喘而两胠满。肝雍，两胠满，卧则惊，不得小便。肾雍，脚下至少腹满，胫有大小，髀大而跛，易成偏枯。心脉满大，痫瘛筋挛。肝脉小急，痫瘛筋挛。肝脉骛暴，有所惊骇，脉不至而若喑，不治自已。肾脉小急，肝脉小急，心脉小急，不鼓的皆为瘕。肾肝并沉为石水，并浮为风水，并虚为死，并小弦欲惊。肾脉大急沉，肝脉大急沉，皆为疝。心脉搏滑急为心疝，肺脉沉搏为肺疝。三阳急为瘕，三阴急为疝，二阴急为痫厥，二阳急为惊。","notes":[],"pending":false},{"id":"sw48-2","tags":[],"yw":"脾脈外鼓，沉爲腸，久自已。肝脈小緩爲腸，易治。腎脈小搏沉，爲腸下血，血溫身熱者死。心肝亦下血，二髒同病者可治，其脈小沉澀爲腸，其身熱者死，熱見七日死。胃脈沉鼓澀，胃外鼓大，心脈小堅急，皆膈偏枯，男子發左，女子發右，不喑舌轉，可治，三十日起，其從者喑，三歲起，年不滿二十者，三歲死。脈至而搏，血衄身熱者死，脈來懸鉤浮爲常脈。脈至如喘，名曰暴厥，暴厥者不知與人言。脈至如數，使人暴驚，三四日自已。脈至浮合，浮合如數，一息十至以上，是經氣予不足也。","bh":"脾脉外鼓而沉为肠澼，久则自已。肝脉小缓为肠澼，易治。肾脉小搏沉，为肠澼下血，血温身热的死。心肝也下血的，二脏同病的可治；其脉小沉涩为肠澼，其身热的死，热见七日死。胃脉沉鼓涩，胃外鼓大，心脉小坚急，皆为膈偏枯；男子发左，女子发右；不喑、舌能转的可治，三十日起；其从者喑，三岁起；年不满二十的，三岁死。脉至而搏，血衄身热的死；脉来悬钩浮为常脉。脉至如喘，名叫暴厥；暴厥者不能与人言语。脉至如数，使人暴惊，三四日自已。脉至浮合，浮合如数，一息十至以上，这是经气予不足。","notes":[],"pending":false},{"id":"sw48-3","tags":[],"yw":"微見九十日死。脈至如火薪然，是心精之予奪也，草干而死。脈至如散葉，是肝氣予虛也，木葉落而死。脈至如省客，省客者脈塞而鼓，是腎氣予不足也，懸去棗華而死。脈至如丸泥，是胃精予不足也，榆莢落而死。脈至如橫格，是膽氣予不足也，禾熟而死。脈至如弦縷，是胞精予不足也，病善言，下霜而死，不言，可治。脈至如交漆，交漆者左右旁至也，微見三十日死。脈至如湧泉，浮鼓肌中，太陽氣予不足也，少氣味，韭英而死。脈至如頹土之狀，按之不得，是肌氣予不足也，五色先見黑白，壘發死。","bh":"微见九十日死。脉至如火薪燃，这是心精之予夺，草干而死。脉至如散叶，这是肝气予虚，木叶落而死。脉至如省客，省客是脉塞而鼓，这是肾气予不足，悬去枣华而死。脉至如丸泥，这是胃精予不足，榆荚落而死。脉至如横格，这是胆气予不足，禾熟而死。脉至如弦缕，这是胞精予不足；病而善言的，下霜而死；不言的可治。脉至如交漆，交漆是左右旁至，微见三十日死。脉至如涌泉，浮鼓于肌中，是太阳气予不足，少气，味韭英而死。脉至如颓土之状，按之不得，这是肌气予不足；五色先见黑白，垒发而死。","notes":[],"pending":false},{"id":"sw48-4","tags":[],"yw":"脈至如懸雍，懸雍者浮揣切之益大，是十二俞之予不足也，水凝而死。脈至如偃刀，偃刀者浮之小急，按之堅大急，五髒菀熟，寒熱獨並於腎也，如此其人不得坐，立春而死。脈至如丸滑不直手，不直手者按之不可得也，是大腸氣予不足也，棗葉生而死。脈至如華者，令人善恐，不欲坐臥，行立常聽，是小腸氣予不足也，季秋而死。<目錄>卷第十三","bh":"脉至如悬雍，悬雍是浮揣之而切之益大，这是十二俞之予不足，水凝而死。脉至如偃刀，偃刀是浮取小急、按之坚大急，五脏菀熟，寒热独并于肾；如此其人不得坐，立春而死。脉至如丸滑而不直手，不直手是按之不可得，这是大肠气予不足，枣叶生而死。脉至如华的，令人善恐，不欲坐卧，行立常听，这是小肠气予不足，季秋而死。","notes":[],"pending":false}]},
{"id":"sw49","book":"素问","no":49,"title":"脉解","titleTw":"脈解","tags":["zhenfa","bingji","zangxiang"],"brief":"依十二月卦气与三阴三阳相应之义，逐条解释六经病症状的所以然，如腰痛、跛、耳鸣、狂颠、心胁痛等。","pending":false,"sections":[{"id":"sw49-1","tags":[],"yw":"太陽所謂腫腰痛者，正月太陽寅，寅太陽也，正月陽氣出在上而陰氣盛，陽未得自次也，故腫腰痛也。病偏虛爲跛者，正月陽氣凍解地氣而出也，所謂偏虛者，冬寒頗有不足者，故偏虛爲跛也。所謂強上引背者，陽氣大上而爭，故強上也。所謂耳鳴者，陽氣萬物盛上而躍，故耳鳴也。所謂甚則狂顛疾者，陽盡在上而陰氣從下，下虛上實，故狂顛疾也。所謂浮爲聾者，皆在氣也。所謂入中爲喑者，陽盛已衰，故爲喑也。內奪而厥，則爲喑俳，此腎虛也，少陰不至者，厥也。","bh":"太阳所谓肿腰痛的，正月太阳为寅，寅是太阳；正月阳气出在上而阴气盛，阳未得自其次序，所以肿腰痛。病偏虚为跛的，正月阳气解冻而地气出；所谓偏虚，是冬寒颇有不足，所以偏虚为跛。所谓强上引背的，阳气大上而争，所以强上。所谓耳鸣的，阳气如万物盛上而跃，所以耳鸣。所谓甚则狂颠疾的，阳尽在上而阴气从下，下虚上实，所以狂颠疾。所谓浮为聋的，都在于气。所谓入中为喑的，阳盛已衰，所以为喑。内夺而厥，则为喑俳，这是肾虚；少阴不至的，就是厥。","notes":[],"pending":false},{"id":"sw49-2","tags":[],"yw":"少陽所謂心脅痛者，言少陽盛也，盛者心之所表也，九月陽氣盡而陰氣盛，故心脅痛也。所謂不可反側者，陰氣藏物也，物藏則不動，故不可反側也。所謂甚則躍者，九月萬物盡衰，草木畢落而墮，則氣去陽而之陰，氣盛而陽之下長，故謂躍。陽明所謂灑灑振寒者，陽明者午也，五月盛陽之陰也，陽盛而陰氣加之，故灑灑振寒也。所謂脛腫而股不收者，是五月盛陽之陰也，陽者衰於五月，而一陰氣上，與陽始爭，故脛腫而股不收也。所謂上喘而爲水者，陰氣下而復上，上則邪客於髒腑間，故爲水也。","bh":"少阳所谓心胁痛的，是说少阳盛；盛是心之所表；九月阳气尽而阴气盛，所以心胁痛。所谓不可反侧的，阴气主藏物，物藏则不动，所以不可反侧。所谓甚则跃的，九月万物尽衰，草木毕落而堕，则气去阳而之阴；气盛而阳之下长，所以叫跃。阳明所谓洒洒振寒的，阳明是午，五月是盛阳之阴；阳盛而阴气加之，所以洒洒振寒。所谓胫肿而股不收的，这是五月盛阳之阴；阳者衰于五月，而一阴气上，与阳始争，所以胫肿而股不收。所谓上喘而为水的，阴气下而复上，上则邪客于脏腑间，所以为水。","notes":[],"pending":false},{"id":"sw49-3","tags":[],"yw":"所謂胸痛少氣者，水氣在髒腑也，水者陰氣也，陰氣在中，故胸痛少氣也。所謂甚則厥，惡人與火，聞木音則惕然而驚者，陽氣與陰氣相薄，水火相惡，故惕然而驚也。所謂欲獨閉戶牖而處者，陰陽相薄也，陽盡而陰盛，故欲獨閉戶牖而居。所謂病至則欲乘高而歌，棄衣而走者，陰陽復爭，而外並於陽，故使之棄衣而走也。所謂客孫脈則頭痛鼻鼽腹腫者，陽明並於上，上者則其孫絡太陰也，故頭痛鼻鼽腹腫也。太陰所謂病脹者，太陰子也，十一月萬物氣皆藏於中，故曰病脹。","bh":"所谓胸痛少气的，是水气在脏腑；水是阴气，阴气在中，所以胸痛少气。所谓甚则厥、恶人与火、闻木音则惕然而惊的，阳气与阴气相薄，水火相恶，所以惕然而惊。所谓欲独闭户牖而处的，是阴阳相薄，阳尽而阴盛，所以欲独闭户牖而居。所谓病至则欲乘高而歌、弃衣而走的，是阴阳复争而外并于阳，所以使之弃衣而走。所谓客于孙脉则头痛、鼻鼽、腹肿的，阳明并于上，上者是其孙络太阴，所以头痛、鼻鼽、腹肿。太阴所谓病胀的，太阴是子，十一月万物之气皆藏于中，所以叫病胀。","notes":[],"pending":false},{"id":"sw49-4","tags":[],"yw":"所謂上走心爲噫者，陰盛而上走於陽明，陽明絡屬心，故曰上走心爲噫也。所謂食則嘔者，物盛滿而上溢，故嘔也。所謂得後與氣則快然如衰者，十二月陰氣下衰，而陽氣且出，故曰得後與氣則快然如衰也。少陰所謂腰痛者，少陰者腎也，十月萬物陽氣皆傷，故腰痛也。所謂嘔咳上氣喘者，陰氣在下，陽氣在上，諸陽氣浮，無所根據從，故嘔咳上氣喘也。所謂色色不能久立，久坐起則目KTKT無所見者，萬物陰陽不定未有主也，秋氣始至，微霜始下，而方殺萬物，陰陽內奪，故目KTKT無所見也。","bh":"所谓上走心为噫的，阴盛而上走于阳明，阳明络属心，所以说上走心为噫。所谓食则呕的，是食物盛满而上溢，所以呕。所谓得大便与矢气则快然如衰的，十二月阴气下衰而阳气将出，所以说得后与气则快然如衰。少阴所谓腰痛的，少阴是肾，十月万物阳气皆伤，所以腰痛。所谓呕咳上气喘的，阴气在下，阳气在上，诸阳气浮而无所依从，所以呕咳上气喘。所谓色色不能久立、久坐起则目䀮䀮无所见的，是万物阴阳不定未有主，秋气始至，微霜始下，而方杀万物，阴阳内夺，所以目䀮䀮无所见。","notes":[],"pending":false},{"id":"sw49-5","tags":[],"yw":"所謂少氣善怒者，陽氣不治，陽氣不治則陽氣不得出，肝氣當治而未得，故善怒，善怒者名曰煎厥。所謂恐如人將捕之者，秋氣萬物未有畢去，陰氣少，陽氣入，陰陽相薄，故恐也。所謂惡聞食臭者，胃無氣，故惡聞食臭也。所謂面黑如地色者，秋氣內奪，故變於色也。所謂咳則有血者，陽脈傷也，陽氣未盛於上而脈滿，滿則咳，故血見於鼻也。厥陰所謂疝，婦人少腹腫者，厥陰者辰也，三月陽中之陰，邪在中，故曰疝少腹腫也。所謂腰脊痛不可以俯仰者，三月一振榮華，萬物一俯而不仰也。","bh":"所谓少气善怒的，是阳气不治；阳气不治则阳气不得出，肝气当治而未得，所以善怒；善怒的名叫煎厥。所谓恐如人将捕之的，是秋气万物未有毕去，阴气少，阳气入，阴阳相薄，所以恐。所谓恶闻食臭的，是胃无气，所以恶闻食臭。所谓面黑如地色的，是秋气内夺，所以变于色。所谓咳则有血的，是阳脉伤；阳气未盛于上而脉满，满则咳，所以血见于鼻。厥阴所谓㿗疝、妇人少腹肿的，厥阴是辰，三月是阳中之阴，邪在中，所以叫疝、少腹肿。所谓腰脊痛不可以俯仰的，三月一振荣华，万物一俯而不仰。","notes":[],"pending":false},{"id":"sw49-6","tags":[],"yw":"所謂癃疝膚脹者，曰陰亦盛而脈脹不通，故曰癃疝也。所謂甚則嗌干熱中者，陰陽相薄而熱，故嗌干也。病能論∶解（音介）惰（徒臥切）撮（子括切）奇病論∶（鋤銜切）疹（丑刃切）（音畜）大奇論∶焰（弋念切）瞥（蒲滅切）揣（初委切）脈解論∶（音誰）<目錄>卷第十四","bh":"所谓癃疝、肤胀的，是阴气亦盛而脉胀不通，所以叫癃疝。所谓甚则嗌干、热中的，是阴阳相薄而热，所以嗌干。","notes":[],"pending":false}]},
{"id":"sw50","book":"素问","no":50,"title":"刺要论","titleTw":"刺要論","tags":["ci","zhenfa","bingji"],"brief":"论述针刺须依病位浅深而定，浅深失度则内动五脏而生大病，并分毫毛腠理、皮、肉、脉、筋、骨、髓七层说明刺法禁忌。","pending":false,"sections":[{"id":"sw50-1","tags":[],"yw":"黃帝問曰∶願聞刺要。岐伯對曰∶病有浮沉，刺有淺深，各至其理，無過其道。過之則內傷，不及則生外壅，壅則邪從之。淺深不得，反爲大賊，內動五髒，後生大病。故曰∶病有在毫毛腠理者，有在皮膚者，有在肌肉者，有在脈者，有在筋者，有在骨者，有在髓者。是故刺毫毛腠理無傷皮，皮傷則內動肺，肺動則秋病溫瘧，溯溯然寒慄。刺皮無傷肉，肉傷則內動脾，脾動則七十二日四季之月，病腹脹煩不嗜食。刺肉無傷脈，脈傷則內動心，心動則夏病心痛。","bh":"黄帝问道：希望听听针刺的要领。岐伯回答说：病有浅有深，刺有浅有深，各应刺到病所在的部位，不要越过应循的法度。刺得过深就伤内部，刺不到位则使外部壅滞，壅滞则邪气随之而入。浅深不当，反而成为大害，在内扰动五脏，日久生出大病。所以说：病有在毫毛腠理的，有在皮肤的，有在肌肉的，有在脉的，有在筋的，有在骨的，有在髓的。因此刺毫毛腠理不可伤皮，皮受伤则在内扰动肺，肺被扰动则到秋天发为温疟，恶寒战栗而发抖。刺皮不可伤肉，肉受伤则在内扰动脾，脾被扰动则在四季之月的七十二日之内，发生腹胀、烦闷、不思饮食。刺肉不可伤脉，脉受伤则在内扰动心，心被扰动则到夏天发生心痛。","notes":[],"pending":false},{"id":"sw50-2","tags":[],"yw":"刺脈無傷筋，筋傷則內動肝，肝動則春病熱而筋弛。刺筋無傷骨，骨傷則內動腎，腎動則冬病脹腰痛。刺骨無傷髓，髓傷則銷鑠，體解然不去矣。<目錄>卷第十四","bh":"刺脉不可伤筋，筋受伤则在内扰动肝，肝被扰动则到春天发生发热而筋弛缓。刺筋不可伤骨，骨受伤则在内扰动肾，肾被扰动则到冬天发生胀满、腰痛。刺骨不可伤髓，髓受伤则身体日渐销铄，肢体懈惰弛缓而不能恢复。","notes":[],"pending":false}]},
{"id":"sw51","book":"素问","no":51,"title":"刺齐论","titleTw":"刺齊論","tags":["ci","zhenfa","bingji"],"brief":"辨别针刺深浅与皮、肉、筋、脉、骨各层的界限，说明刺此层不得伤及彼层，并解释所谓「反」的所指。","pending":false,"sections":[{"id":"sw51-1","tags":[],"yw":"黃帝問曰∶願聞刺淺深之分。岐伯對曰∶刺骨者無傷筋，刺筋者無傷肉，刺肉者無傷脈，刺脈者無傷皮，刺皮者無傷肉，刺肉者無傷筋，刺筋者無傷骨。帝曰∶餘未知其所謂，願聞其解。岐伯曰∶刺骨無傷筋者，針至筋而去，不及骨也。刺筋無傷肉者，至肉而去，不及筋也。刺肉無傷脈者，至脈而去，不及肉也。刺脈無傷皮者，至皮而去，不及脈也。所謂刺皮無傷肉者，病在皮中，針入皮中，無傷肉也。刺肉無傷筋者，過肉中筋也。刺筋無傷骨者，過筋中骨也。","bh":"黄帝问道：希望听听针刺浅深的分界。岐伯回答说：刺骨的不可伤筋，刺筋的不可伤肉，刺肉的不可伤脉，刺脉的不可伤皮，刺皮的不可伤肉，刺肉的不可伤筋，刺筋的不可伤骨。黄帝说：我还不明白这些话的意思，希望听你解释。岐伯说：所谓刺骨不可伤筋，是说针到筋就退出，不深入到骨。所谓刺筋不可伤肉，是说针到肉就退出，不及于筋。所谓刺肉不可伤脉，是说针到脉就退出，不及于肉。所谓刺脉不可伤皮，是说针到皮就退出，不及于脉。所谓刺皮不可伤肉，是说病在皮中，针入皮中，不伤及肉。所谓刺肉不可伤筋，是说超过肉的深度就会伤中于筋。所谓刺筋不可伤骨，是说超过筋的深度就会伤中于骨。","notes":[],"pending":false},{"id":"sw51-2","tags":[],"yw":"此之謂反也。<目錄>卷第十四","bh":"这就是所说的「反」。","notes":[],"pending":false}]},
{"id":"sw52","book":"素问","no":52,"title":"刺禁论","titleTw":"刺禁論","tags":["ci","zhenfa","bingji"],"brief":"列举五脏与身体要害部位的针刺禁忌、误刺后的死期与变证，以及大醉、大怒、大劳、大饥、大渴、大惊等不宜针刺的情形。","pending":false,"sections":[{"id":"sw52-1","tags":[],"yw":"黃帝問曰∶願聞禁數。岐伯對曰；髒有要害，不可不察，肝生於左，肺藏於右，心部於表，腎治於裏，脾爲之使，胃爲之市。膈肓之上，中有父母，七節之旁，中有小心，從之有福，逆之有咎。刺中心，一日死，其動爲噫。刺中肝，五日死，其動爲語。刺中腎，六日死，其動爲嚏。刺中肺，三日死，其動爲咳。刺中脾，十日死，其動爲吞。刺中膽，一日半死，其動爲嘔。刺跗上中大脈，血出不止死。刺面中溜脈，不幸爲盲。刺頭中腦戶，入腦立死。刺舌下中脈太過，血出不止爲喑。","bh":"黄帝问道：希望听听针刺的禁忌之数。岐伯回答说：五脏都有要害，不可不明察。肝生于左，肺藏于右，心部居于表，肾主治于里，脾为它转输役使，胃为水谷汇聚的市（胃为之市）。膈肓之上，中间有父母（心肺）；第七椎两旁，中间有小心。顺从它就得福，违逆它就招祸。刺中心脏，一日死，其变动表现为噫气。刺中肝，五日死，其变动表现为多语。刺中肾，六日死，其变动表现为喷嚏。刺中肺，三日死，其变动表现为咳。刺中脾，十日死，其变动表现为吞咽。刺中胆，一日半死，其变动表现为呕吐。刺脚背上而中于大脉，出血不止的死。刺面部而中于溜脉，不幸成为盲。刺头部而中于脑户，入脑立即死亡。刺舌下而中脉太过，出血不止就成为失音。","notes":[],"pending":false},{"id":"sw52-2","tags":[],"yw":"刺足下布絡中脈，血不出爲腫。刺中大脈，令人僕脫色。刺氣街中脈，血不出，爲腫鼠僕。刺脊間中髓，爲傴。刺乳上，中乳房，爲腫根蝕。刺缺盆中內陷，氣泄，令人喘咳逆。刺手魚腹內陷，爲腫。無刺大醉，令人氣亂。無刺大怒，令人氣逆。無刺大勞人，無刺新飽人，無刺大飢人，無刺大渴人，無刺大驚人。刺陰股中大脈，血出不止死。刺客主人內陷中脈，爲內漏爲聾。刺膝髕出液，爲跛。刺臂太陰脈，出血多立死。刺足少陰脈，重虛出血，爲舌難以言。","bh":"刺足下散布的络脉而中于脉，血出不来的成为肿。刺中大脉，使人仆倒、面色骤变。刺气街而中脉，血不出来，成为肿、鼠仆。刺脊骨之间而中髓，成为伛偻。刺乳上而中乳房，成为肿、根蚀（肿根蚀烂）。刺缺盆太过内陷，气外泄，使人喘咳上逆。刺手鱼腹太过内陷，成为肿。不要刺大醉的人，会使他气乱。不要刺大怒的人，会使他气逆。不要刺大劳的人，不要刺刚吃饱的人，不要刺大饥的人，不要刺大渴的人，不要刺大受惊的人。刺大腿内侧而中于大脉，出血不止的死。刺客主人太过内陷而中于脉，成为内漏、成为耳聋。刺膝盖骨出液的，成为跛。刺臂太阴脉，出血多的立即死亡。刺足少阴脉，使虚者重虚而出血，成为舌强难以言语。","notes":[],"pending":false},{"id":"sw52-3","tags":[],"yw":"刺膺中陷中肺，爲喘逆仰息。刺肘中內陷，氣歸之，爲不屈伸。刺陰股下三寸內陷，令人遺溺。刺掖下脅間內陷，令人咳。刺少腹中膀胱溺出，令人少腹滿。刺腸內陷，爲腫。刺匡上陷骨中脈，爲漏爲盲。刺關節中液出，不得屈伸。<目錄>卷第十四","bh":"刺胸部太过内陷而中于肺，成为喘息上逆、仰面呼吸。刺肘中太过内陷，气归聚在那里，成为不能屈伸。刺大腿内侧下三寸太过内陷，使人遗尿。刺腋下胁肋之间太过内陷，使人咳嗽。刺少腹而中于膀胱，尿外出，使人少腹胀满。刺小腿肚太过内陷，成为肿。刺眼眶上方陷骨处而中于脉，成为泪出不止、成为盲。刺关节而液外出的，不能屈伸。","notes":[],"pending":false}]},
{"id":"sw53","book":"素问","no":53,"title":"刺志论","titleTw":"刺志論","tags":["ci","zhenfa","bingji"],"brief":"论述虚实的要领：气与形、谷与气、脉与血的正常相应及其反常表现，并讲针刺补泻时开闭针孔的手法。","pending":false,"sections":[{"id":"sw53-1","tags":[],"yw":"黃帝問曰∶願聞虛實之要。岐伯對曰∶氣實形實，氣虛形虛，此其常也，反此者病。谷盛氣盛，谷虛氣虛，此其常也，反此者病。脈實血實，脈虛血虛，此其常也，反此者病。帝曰∶如何而反？岐伯曰∶氣虛身熱，此謂反也。谷入多而氣少，此謂反也。谷不入而氣多，此謂反也。脈盛血少，此謂反也。脈小血多，此謂反也。氣盛身寒，得之傷寒。氣虛身熱，得之傷暑。谷入多而氣少者，得之有所脫血，溼居下也。谷入少而氣多者，邪在胃及與肺也。脈小血多者，飲中熱也。","bh":"黄帝问道：希望听听虚实的要领。岐伯回答说：气实的形体也实，气虚的形体也虚，这是正常的；与此相反就是病。水谷纳盛的气也盛，水谷纳少的气也虚，这是正常的；与此相反就是病。脉实的血也实，脉虚的血也虚，这是正常的；与此相反就是病。黄帝说：怎样算是相反？岐伯说：气虚而身热，这就叫反。进食多而气少，这就叫反。不进食而气多，这就叫反。脉盛而血少，这就叫反。脉小而血多，这就叫反。气盛而身寒的，是感受寒邪所得。气虚而身热的，是感受暑邪所得。进食多而气少的，是因为有所脱血、湿邪居留在下部。进食少而气多的，是邪气在胃以及肺。脉小而血多的，是水饮之中（饮）有热。","notes":[],"pending":false},{"id":"sw53-2","tags":[],"yw":"脈大血少者，脈有風氣，水漿不入，此之謂也。夫實者，氣入也。虛者，氣出也。氣實者，熱也。氣虛者，寒也。入實者，左手開針空也。入虛者，左手閉針空也。<目錄>卷第十四","bh":"脉大而血少的，是脉中有风气、水浆不入，说的就是这个。所谓实，是气入于内；所谓虚，是气出于外。气实的表现为热，气虚的表现为寒。针治实证的，出针后用左手张开针孔；针治虚证的，出针后用左手闭合针孔。","notes":[],"pending":false}]},
{"id":"sw54","book":"素问","no":54,"title":"针解","titleTw":"針解","tags":["ci","zhenfa","bingji"],"brief":"解释九针虚实补泻、徐疾寒温等刺法术语的含义，并论九针形制与各针所宜，以及人身形与天地四时阴阳的对应关系。","pending":false,"sections":[{"id":"sw54-1","tags":[],"yw":"黃帝問曰∶願聞九針之解，虛實之道。岐伯對曰∶刺虛則實之者，針下熱也，氣實乃熱也。滿而泄之者，針下寒也，氣虛乃寒也。菀陳則除之者，出惡血也。邪勝則虛之者，出針勿按。徐而疾則實者，徐出針而疾按之。疾而徐則虛者，疾出針而徐按之。言實與虛者，寒溫氣多少也。若無若有者，疾不可知也。察後與先者，知病先後也。爲虛與實者，工勿失其法。若得若失者，離其法也。虛實之要，九針最妙者，爲其各有所宜也。補瀉之時者，與氣開闔相合也。","bh":"黄帝问道：希望听听九针的解释和虚实的道理。岐伯回答说：所谓刺虚则实之，是指针下有热感，气实才发热。所谓满而泄之，是指针下有寒感，气虚才发寒。所谓菀陈则除之，是指放出恶血。所谓邪胜则虚之，是出针后不要按压。所谓徐而疾则实，是慢慢出针而迅速按压针孔。所谓疾而徐则虚，是迅速出针而慢慢按压针孔。所谓言实与虚，是指寒温与气的多少。所谓若无若有，是气至迅速而难以察知。所谓察后与先，是了解疾病发生的先后。所谓为虚与实，是医者不可失去其法度。所谓若得若失，是背离了法度。所谓虚实之要，九针最妙，是因为九针各有所宜。所谓补泻之时，是与气机的开阖相配合。","notes":[],"pending":false},{"id":"sw54-2","tags":[],"yw":"九針之名，各不同形者，針窮其所當補瀉也。刺實須其虛者，留針陰氣隆至，乃去針也。刺虛須其實者，陽氣隆至，針下熱乃去針也。經氣已至，慎守勿失者，勿更改也。深淺在志者，知病之內外也。近遠如一者，深淺其候等也。如臨深淵者，不敢惰也。手如握虎者，欲其壯也。神無營於衆物者，靜志觀病患，無左右視也。義無邪下者，欲端以正也。必正其神者，欲瞻病患目制其神，令氣易行也。所謂三裏者，下膝三寸也。所謂跗之者，舉膝分易見也。","bh":"所谓九针之名、各不相同之形，是说针能穷尽各自所当施行的补泻。所谓刺实须其虚，是留针到阴气隆盛而至，才去针。所谓刺虚须其实，是待阳气隆盛而至，针下发热才去针。所谓经气已至，慎守勿失，是说（得气后）不要改变手法。所谓深浅在志，是知道病的在内在外。所谓近远如一，是深浅的候气之法相同。所谓如临深渊，是不敢懈惰。所谓手如握虎，是希望持针壮盛稳实。所谓神无营于众物，是静心观察病人，不左右旁视。所谓义无邪下，是希望针身端正。所谓必正其神，是希望注视病人的双目以制御其神，使气容易运行。所谓三里，在膝下三寸。所谓跗之，是抬举膝部时其分肉容易望见之处。","notes":[],"pending":false},{"id":"sw54-3","tags":[],"yw":"巨虛者，蹺足獨陷者。下廉者，陷下者也。帝曰∶餘聞九針，上應天地四時陰陽，願聞其方，令可傳於後世以爲常也。岐伯曰∶夫一天、二地、三人、四時、五音、六律、七星、八風、九野，身形亦應之，針各有所宜，故曰九針。人皮應天，人肉應地，人脈應人，人筋應時，人聲應音，人陰陽合氣應律，人齒面目應星，人出入氣應風，人九竅三百六十五絡應野。故一針皮，二針肉，三針脈，四針筋，五針骨，六針調陰陽，七針益精，八針除風，九針通九竅，除三百六十五節氣，此之謂各有所主也。","bh":"所谓巨虚，是举足试行时独独陷下之处。所谓下廉，是陷下之处。黄帝说：我听说九针上应天地四时阴阳，希望听听其中的法度，使它能传于后世作为常法。岐伯说：一为天、二为地、三为人、四为时、五为音、六为律、七星、八风、九野，人的身形也与之相应，针各有所宜，所以叫九针。人的皮应天，人的肉应地，人的脉应人，人的筋应时，人的声音应五音，人的阴阳合气应六律，人的齿面目应七星，人的出入之气应八风，人的九窍三百六十五络应九野。所以一针刺皮，二针刺肉，三针刺脉，四针刺筋，五针刺骨，六针以调阴阳，七针以补益精气，八针以祛除风气，九针以通九窍，祛除三百六十五节的邪气，这就叫各有所主。","notes":[],"pending":false},{"id":"sw54-4","tags":[],"yw":"人心意應八風，人氣應天，人發齒耳目五聲應五音六律，人陰陽脈血氣應地，人肝目應之九。九竅三百六十五。人一以觀動靜天二以候五色七星應之以候發毋澤五音一以候宮商角徵羽六律有餘不足應之二地一以候高下有餘九野一節俞應之以候閉節三人變一分人候齒泄多血少十分角之變五分以候緩急六分不足三分寒關節第九分四時人寒溫燥溼四時一應之以候相反一四方各作解。<目錄>卷第十四","bh":"人的心意应八风，人的气应天，人的发、齿、耳、目与五声应五音六律，人的阴阳脉血气应地，人的肝目应之九。九窍三百六十五。人一以观动静，天二以候五色，七星应之以候发无光泽，五音一以候宫、商、角、征、羽，六律有应有余不足；二地一以候高下有余，九野一节俞应之以候闭节，三人变一分以候齿泄多血少，十分角之变五分以候缓急，六分不足三分寒关节，第九分四时人寒温燥湿，四时一应之以候相反，一四方各作解。","notes":[],"pending":false}]},
{"id":"sw55","book":"素问","no":55,"title":"长刺节论","titleTw":"長刺節論","tags":["ci","zhenfa","bingji"],"brief":"列举头疾、少腹积、疝、筋痹、肌痹、骨痹、狂、癫、风、大风等病的针刺部位、深浅与疗程。","pending":false,"sections":[{"id":"sw55-1","tags":[],"yw":"刺家不診，聽病者言，在頭頭疾痛，爲藏針之，刺至骨病已，上無傷骨肉及皮，皮者道也。陰刺，入一旁四處。治寒熱深專者，刺大藏，迫藏刺背，背俞也，刺之迫藏，藏會，腹中寒熱去而止，與刺之要，發針而淺出血。治腐腫者刺腐上，視癰小大深淺刺，刺大者多血，小者深之，必端內針爲故止。病在少腹有積，刺皮，HT以下，至少腹而止，刺挾脊兩旁四椎間，刺兩髂季脅肋間，導腹中氣熱下已。病在少腹，腹痛不得大小便，病名曰疝，得之寒，刺少腹兩股間，刺腰髁骨間，刺而多之，盡炅病已。","bh":"善用针的医家不等诊脉，听病人的自述：病在头部，头部剧痛，就为他针治，刺到骨而病愈，上部不可伤及骨、肉和皮，因为皮是针刺出入的通路。阴刺之法，刺入一处而旁及四处。治寒热深入而专于一处的，刺大脏；病气迫脏的就刺背，背部就是背俞。刺之使邪气逼近于脏，脏气会聚，腹中寒热除去就止针；刺的要法是出针时浅刺出血。治腐肿的刺痈肿之上，看痈的大小深浅而刺：刺大的出血要多，小的要深刺，务必要端正进针，以此为度而止。病在少腹有积块的，刺皮（此处原文有缺字）以下，一直至少腹为止；刺夹脊两旁第四椎之间，刺两侧髂骨上的季胁肋间，引导腹中气热下行则病愈。病在少腹，腹痛而大小便不通，病名叫疝，得之于寒；刺少腹与两股之间，刺腰髁骨之间，多刺；等到周身尽热则病愈。","notes":[],"pending":false},{"id":"sw55-2","tags":[],"yw":"病在筋，筋攣節痛，不可以行，名曰筋痹，刺筋上爲故，刺分肉間，不可中骨也，病起筋炅病已止。病在肌膚，肌膚盡痛，名曰肌痹，傷於寒溼，刺大分小分，多發針而深之，以熱爲故，無傷筋骨，傷筋骨，痛發若變，諸分盡熱病已止。病在骨，骨重不可舉，骨髓酸痛，寒氣至，名曰骨痹，深者刺無傷脈肉爲故，其道大分小分，骨熱病已止。病在諸陽脈，且寒且熱，諸分且寒且熱，名曰狂，刺之虛脈，視分盡熱病已止。病初發歲一發，不治月一發，不治月四五發，名曰癲病，刺諸分諸脈，其無寒者以針調之，病已止。","bh":"病在筋，筋拘挛、关节疼痛，不能行走，名叫筋痹；刺在筋上为要，取分肉之间，不可刺中骨；等到筋有热感、病好就止针。病在肌肤，肌肤尽都疼痛，名叫肌痹，是伤于寒湿；刺大分小分，多下针而深刺，以出现热感为度，不可伤筋骨；若伤了筋骨，疼痛发作而变生他证；等到各分肉尽热则病愈止针。病在骨，骨沉重不能抬举，骨髓酸痛，寒气至，名叫骨痹；深刺的以不伤脉肉为要，其针道取大分小分，骨有热感则病愈止针。病在诸阳脉，忽寒忽热，各分肉也忽寒忽热，名叫狂；刺其虚脉，看到分肉尽热则病愈止针。病初起一年发作一次，不治则一月发作一次，再不治则一月发作四五次，名叫癫病；刺各分肉与各脉，其中不发寒的用针调治，病愈则止。","notes":[],"pending":false},{"id":"sw55-3","tags":[],"yw":"病風且寒且熱，炅汗出，一日數過，先刺諸分理絡脈；汗出且寒且熱，三日一刺，百日而已。病大風，骨節重，須眉墮，名曰大風，刺肌肉爲故，汗出百日，刺骨髓，汗出百日，凡二百日，須眉生而止針。刺要論∶（音素）弛（施是切）鑠（詩若切）眩（音縣）刺齊論∶解（胡買切）刺禁論∶髕（音牝）刺志論∶脫（土活切）捻（音涅）針解論∶（音低）長刺節論∶（光抹切）篡（初患切）<目錄>卷第十五","bh":"病由风邪所致，忽寒忽热，热而出汗，一日内发作数次，先刺各分理与络脉；汗出而仍忽寒忽热的，三日一刺，百日而愈。病为大风的，骨节沉重，胡须眉毛脱落，名叫大风；刺肌肉为要，汗出百日止；刺骨髓，汗出百日止；共二百日，胡须眉毛重生才止针。（篇末所附释音为：）刺要论：弛（施是切）、铄（诗若切）、眩（音县）；刺齐论：解（胡买切）；刺禁论：髌（音牝）；刺志论：脱（土活切）、捻（音涅）；针解论：（一字，音低）；长刺节论：（一字，光抹切）、篡（初患切）。","notes":[],"pending":false}]},
{"id":"sw56","book":"素问","no":56,"title":"皮部论","titleTw":"皮部論","tags":["ci","jingluo","zhenfa"],"brief":"论述十二经脉在皮部的分区与各经皮部的名称、浮络五色所主之病，以及邪由皮毛入络、入经、入脏腑的传变次序。","pending":false,"sections":[{"id":"sw56-1","tags":[],"yw":"黃帝問曰∶餘聞皮有分部，脈有經紀，筋有結絡，骨有度量，其所生病各異，別其分部，左右上下，陰陽所在，病之始終，願聞其道。岐伯對曰∶欲知皮部以經脈爲紀者，諸經皆然。陽明之陽，名曰害蜚，上下同法，視其部中有浮絡者，皆陽明之絡也，其色多青則痛，多黑則痹，黃赤則熱，多白則寒，五色皆見，則寒熱也，絡盛則入客於經，陽主外，陰主內。少陽之陽，名曰樞持，上下同法，視其部中有浮絡者，皆少陽之絡也，絡盛則入客於經，故在陽者主內，在陰者主出，以滲於內，諸經皆然。","bh":"黄帝问道：我听说皮有分部，脉有经纪，筋有结络，骨有度量；它们所发生的病各不相同。要辨别其分部、左右上下、阴阳所在与病的始终，希望听听其中的道理。岐伯回答说：要知道皮部而以经脉为纲纪，各经都是如此。阳明的阳，名叫害蜚；上下同一法则，看其分部中有浮络的，都是阳明的络。其色多青的则痛，多黑的则痹，黄赤的则热，多白的则寒；五色都见到的，则是寒热相兼。络邪盛就客入于经；阳主外，阴主内。少阳的阳，名叫枢持；上下同一法则，看其分部中有浮络的，都是少阳的络。络邪盛就客入于经；所以在阳的主入于内，在阴的主出于外，以渗于内；各经都是这样。","notes":[],"pending":false},{"id":"sw56-2","tags":[],"yw":"太陽之陽，名曰關樞，上下同法，視其部中有浮絡者，皆太陽之絡也，絡盛則入客於經。少陰之陰，名曰樞儒，上下同法，視其部中有浮絡者，皆少陰之絡也，絡盛則入客於經，其入經也，從陽部注於經，其出者，從陰內注於骨。心主之陰，名曰害肩，上下同法，視其部中有浮絡者，皆心主之絡也，絡盛則入客於經。太陰之陰，名曰關蟄，上下同法，視其部中有浮絡者，皆太陰之絡也，絡盛則入客於經。凡十二經絡脈者，皮之部也。是故百病之始生也，必先於皮毛，邪中之則腠理開，開則入客於絡脈，留而不去，傳入於經，留而不去，傳入於腑，廩於腸胃。","bh":"太阳的阳，名叫关枢；上下同一法则，看其分部中有浮络的，都是太阳的络。络邪盛就客入于经。少阴的阴，名叫枢儒；上下同一法则，看其分部中有浮络的，都是少阴的络。络邪盛就客入于经；其入经是从阳部注于经，其外出者从阴内注于骨。心主（厥阴）的阴，名叫害肩；上下同一法则，看其分部中有浮络的，都是心主的络。络邪盛就客入于经。太阴的阴，名叫关蛰；上下同一法则，看其分部中有浮络的，都是太阴的络。络邪盛就客入于经。凡十二经络脉，就是皮的分部。所以百病的发生，必定先始于皮毛；邪气中于皮毛则腠理开张，开张则邪气客入络脉；留而不去，就传入于经；留而不去，就传入于腑，停积于肠胃。","notes":[],"pending":false},{"id":"sw56-3","tags":[],"yw":"邪之始入於皮也，然起毫毛，開腠理；其入於絡也，則絡脈盛色變；其入客於經也，則感虛乃陷下；其留於筋骨之間，寒多則筋攣骨痛，熱多則筋弛骨消，肉爍破，毛直而敗。帝曰∶夫子言皮之十二部，其生病皆何如？岐伯曰∶皮者脈之部也，邪客於皮則腠理開，開則邪入客於絡脈，絡脈滿則注於經脈，經脈滿則入舍於腑髒也，故皮者有分部，不與而生大病也。帝曰∶善。<目錄>卷第十五","bh":"邪气开始侵入皮时，毛发竖起，腠理开张；邪气入于络，则络脉盛大而色变；邪气客于经，则是因感受虚处才陷下；邪气留于筋骨之间，寒多的则筋拘挛骨痛，热多的则筋弛骨消，肌肉销铄破损，毛发竖直而枯败。黄帝说：先生讲皮的十二部，它们所生的病都怎样？岐伯说：皮是脉的分区。邪客于皮则腠理开张，开张则邪气客入络脉；络脉满则注入经脉；经脉满则入舍于腑脏。所以皮虽有分部，若不及时施治，就会酿成大病。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw57","book":"素问","no":57,"title":"经络论","titleTw":"經絡論","tags":["ci","jingluo","zhenfa"],"brief":"论经脉有常色而络脉变色无常：五脏应五色的常色、阴络应经而阳络随四时变化，以及五色俱见等色诊意义。","pending":false,"sections":[{"id":"sw57-1","tags":[],"yw":"黃帝問曰∶夫絡脈之見也，其五色各異，青黃赤白黑不同，其故何也？岐伯對曰∶經有常色而絡無常變也。帝曰∶經之常色何如？岐伯曰∶心赤，肺白，肝青，脾黃，腎黑，皆亦應其經脈之色也。帝曰∶絡之陰陽，亦應其經乎？岐伯曰∶陰絡之色應其經，陽絡之色變無常，隨四時而行也。寒多則凝泣，凝泣則青黑，熱多則淖澤，淖澤則黃赤，此皆常色，謂之無病。五色具見者，謂之寒熱。帝曰∶善。<目錄>卷第十五","bh":"黄帝问道：络脉的显现，其五色各不相同，有青、黄、赤、白、黑的不同，这是什么缘故？岐伯回答说：经有常色而络没有常色，是变化的。黄帝说：经的常色怎样？岐伯说：心赤、肺白、肝青、脾黄、肾黑，也各自与其经脉之色相应。黄帝说：络的阴阳，也与其经相应吗？岐伯说：阴络之色与其经相应；阳络之色变化无常，是随四时而行的。寒多则凝涩，凝涩则色青黑；热多则润泽，润泽则色黄赤。这些都是常色，叫做无病。五色都出现的，叫做寒热。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw58","book":"素问","no":58,"title":"气穴论","titleTw":"氣穴論","tags":["jingluo","zhenfa","bingji"],"brief":"列举三百六十五气穴的部位与数目，并论孙络、溪谷的生理功用、邪气留滞为病的变证及其泻法。","pending":false,"sections":[{"id":"sw58-1","tags":[],"yw":"黃帝問曰∶餘聞氣穴三百六十五以應一歲，未知其所，願卒聞之。岐伯稽首再拜對曰∶窘乎哉問也！其非聖帝，孰能窮其道焉，因請溢意盡言其處。帝捧手逡巡而卻曰∶夫子之開餘道也，目未見其處，耳未聞其數，而目以明，耳以聰矣。岐伯曰∶此所謂聖人易語，良馬易御也。帝曰∶餘非聖人之易語也，世言真數開人意，今餘所訪問者真數，發蒙解惑，未足以論也。然餘願聞夫子溢志盡言其處，令解其意，請藏之金匱，不敢復出。岐伯再拜而起曰∶臣請言之，背與心相控而痛，所治天突與十椎及上紀，上紀者胃脘也，下紀者關元也。","bh":"黄帝问道：我听说气穴三百六十五以应一年之日数，却不知它们所在，希望详尽听听。岐伯叩头再拜回答说：问得真深切啊！若不是圣明的帝王，谁能穷究其中的道理，因此请让我毫无保留地把它们的位置说出来。黄帝拱手谦让而退后说：先生开启我的道路，我眼虽未见其处，耳虽未闻其数，却已经目明、耳聪了。岐伯说：这就是所谓和圣人容易讲话、好马容易驾驭。黄帝说：我并不是圣人那样容易讲话的人；世人说真数能开启人的心意，如今我所问的是真数，不过是启发蒙昧、解除疑惑，还不足以称得上论道。然而我仍希望先生尽情说出它们的位置，使我领会其意，请让我把它藏在金匮之中，不敢再拿出来。岐伯再拜而起说：臣请言之。背部与心互相牵引而痛，所治的是天突与十椎及上纪；上纪是胃脘，下纪是关元。","notes":[],"pending":false},{"id":"sw58-2","tags":[],"yw":"背胸邪系陰陽左右，如此其病前後痛澀，胸脅痛而不得息，不得臥，上氣短氣偏痛，脈滿起斜出尻脈，絡胸脅支心貫膈，上肩加天突，斜下肩交十椎下。髒俞五十穴，腑俞七十二穴，熱俞五十九穴，水俞五十七穴，頭上五行行五，五五二十五穴，中KT兩旁各五，凡十穴，大椎上兩旁各一，凡二穴，目瞳子浮白二穴，兩髀厭分中二穴，犢鼻二穴，耳中多所聞二穴，眉本二穴，完骨二穴，項中央一穴，枕骨二穴，上關二穴，大迎二穴，下關二穴，天柱二穴，巨虛上下廉四穴，曲牙二穴，天突一穴，天府二穴，天牖二穴，扶突二穴，天窗二穴，肩解二穴，關元一穴，委陽二穴，肩貞二穴，喑門一穴，臍一穴，胸俞十二穴，背俞二穴，膺俞十二穴，分肉二穴，踝上橫二穴，陰陽蹺四穴，水俞在諸分，熱俞在氣穴，寒熱俞在兩骸厭中二穴，大禁二十五，在天府下五寸，凡三百六十五穴，針之所由行也。","bh":"背胸的邪气联系着阴阳左右，如此则其病前后疼痛涩滞、胸胁痛而不能喘息、不能平卧、上气短气、偏侧疼痛；其脉满起而斜出于尻脉，络于胸胁，支撑于心，贯于膈，上到肩而加于天突，斜下肩而交于十椎之下。五脏之俞五十穴，六腑之俞七十二穴，热俞五十九穴，水俞五十七穴，头上五行每行五穴，五五二十五穴；脊中两旁各五穴，共十穴；大椎之上两旁各一穴，共二穴；目瞳子、浮白二穴；两髀厌分中各二穴；犊鼻二穴；耳中多所闻二穴；眉本二穴；完骨二穴；项中央一穴；枕骨二穴；上关二穴；大迎二穴；下关二穴；天柱二穴；巨虚上下廉四穴；曲牙二穴；天突一穴；天府二穴；天牗二穴；扶突二穴；天窗二穴；肩解二穴；关元一穴；委阳二穴；肩贞二穴；喑门一穴；脐一穴；胸俞十二穴；背俞二穴；膺俞十二穴；分肉二穴；踝上横二穴；阴阳𫏋四穴；水俞在诸分肉之间，热俞在气穴，寒热俞在两骸厌中二穴；大禁二十五，在天府下五寸。总共三百六十五穴，是针刺所循行之处。","notes":[],"pending":false},{"id":"sw58-3","tags":[],"yw":"帝曰∶餘已知氣穴之處，遊針之居，願聞孫絡溪谷，亦有所應乎？岐伯曰∶孫絡三百六十五穴會，亦以應一歲，以溢奇邪，以通榮衛，榮衛稽留，衛散榮溢，氣竭血着，外爲發熱，內爲少氣，疾瀉無怠，以通榮衛，見而瀉之，無問所會。帝曰∶善。願聞溪谷之會也。岐伯曰∶肉之大會爲谷，肉之小會爲溪，肉分之間，溪谷之會，以行榮衛，以會大氣。邪溢氣壅，脈熱肉敗，榮衛不行，必將爲膿，內銷骨髓，外破大，留於節湊，必將爲敗。積寒留舍，榮衛不居，卷肉縮筋，肋肘不得伸，內爲骨痹，外爲不仁，命曰不足，大寒留於溪谷也。","bh":"黄帝说：我已经知道气穴的所在和游针之处，希望听听孙络、溪谷是否也有所应？岐伯说：孙络三百六十五穴会，也以应一岁，用以溢出奇邪、通行荣卫。荣卫滞留不行，卫散而荣溢，气竭而血留着，在外表现为发热，在内表现为少气；应迅速泻之不可懈怠，以通行荣卫。见到（血络）就泻之，不必问它是否为穴会。黄帝说：好。希望听听溪谷之会。岐伯说：肌肉大会之处叫谷，肌肉小会之处叫溪；分肉之间、溪谷之会，用以运行荣卫、会聚大气。邪气满溢而气壅塞，脉热肉败，荣卫不行，必将化为脓；在内销蚀骨髓，在外破溃大肉；留注于关节之处，必将败坏。若积寒留止不去，荣卫不能安居，肌肉卷缩、筋络拘挛，肋肘不得伸展，在内成为骨痹，在外成为不仁，名叫不足，这是大寒留于溪谷所致。","notes":[],"pending":false},{"id":"sw58-4","tags":[],"yw":"溪谷三百六十五穴會，亦應一歲。其小痹淫溢，循脈往來，微針所及，與法相同。帝乃辟左右而起，再拜曰∶今日發蒙解惑，藏之金匱，不敢復出。乃藏之金蘭之室，署曰氣穴所在。岐伯曰∶孫絡之脈別經者，其血盛而當瀉者，亦三百六十五脈，並注於絡，傳注十二絡脈，非獨十四絡脈也，內解瀉於中者十脈。<目錄>卷第十五","bh":"溪谷三百六十五穴会，也相应于一岁。其中小痹邪气淫溢、循脉往来不定的，微针所及之处，治法与此相同。黄帝于是屏退左右而起，再拜说：今日启发蒙昧、解除疑惑，请把它藏在金匮之中，不敢再拿出来。于是藏在金兰之室，署名叫「气穴所在」。岐伯说：孙络之脉别行于经的，其血盛而当泻的，也有三百六十五脉；它们一并注入络脉，传注于十二络脉，并不只是十四络脉；在内解散而泻于中的有十脉。","notes":[],"pending":false}]},
{"id":"sw59","book":"素问","no":59,"title":"气府论","titleTw":"氣府論","tags":["jingluo","zhenfa","bingji"],"brief":"逐经列举足三阳、手三阳及督脉、任脉、冲脉等脉气所发的穴数与分布部位，总计三百六十五穴。","pending":false,"sections":[{"id":"sw59-1","tags":[],"yw":"足太陽脈氣所發者七十八穴∶兩眉頭各一，入發至項三寸半，旁五，相去三寸，其浮氣在皮中者凡五行，行五，五五二十五，項中大筋兩旁各一，風府兩旁各一，挾脊以下至尻尾二十一節十五間各一，五髒之俞各五，六腑之俞各六，委中以下至足小指旁各六俞。足少陽脈氣所發者六十二穴∶兩角上各二，直目上發際內各五，耳前角上各一，耳前角下各一，銳發下各一，客主人各一，耳後陷中各一，下關各一，耳下牙車之後各一，缺盆各一，掖下三寸，脅下至，八間各一，髀樞中，旁各一，膝以下至足小指次指各六俞。","bh":"足太阳脉气所发的有七十八穴：两眉头各一；从入发际到项部三寸半，两旁各五穴，彼此相距三寸；其中浮气行于皮中的共有五行，每行五穴，五五二十五穴；项中两大筋两旁各一；风府两旁各一；夹脊以下至尻尾二十一节共十五个椎间各一；五脏之俞各五穴，六腑之俞各六穴；委中以下至足小趾旁各有六俞。足少阳脉气所发的有六十二穴：两角上各二；正当目上发际内各五；耳前角上各一；耳前角下各一；锐发下各一；客主人各一；耳后陷中各一；下关各一；耳下牙车之后各一；缺盆各一；腋下三寸，胁下至（此处原文有缺文），八间各一；髀枢中旁各一；膝以下至足小趾次趾各六俞。","notes":[],"pending":false},{"id":"sw59-2","tags":[],"yw":"足陽明脈氣所發者六十八穴∶額顱發際旁各三，面鼽骨空各一，大迎之骨空各一，人迎各一，缺盆外骨空各一，膺中骨間各一，挾鳩尾之外，當乳下三寸，挾胃脘各五，挾臍廣三寸各三，下臍二寸挾之各三，氣街動脈各一，伏兔上各一，三裏以下至足中指各八俞，分之所在穴空。手太陽脈氣所發者三十六穴∶目內各一，目外各一，鼽骨下各一，耳郭上各一，耳中各一，巨骨穴各一，曲掖上骨穴各一，柱骨上陷者各一，上天窗四寸各一，肩解各一，肩解下三寸各一，肘以下至手小指本各六俞。","bh":"足阳明脉气所发的有六十八穴：额颅发际旁各三；面上颧骨之空中各一；大迎之骨空各一；人迎各一；缺盆外骨空各一；膺中骨间各一；夹鸠尾之外、当乳下三寸，夹胃脘各五；夹脐旁宽三寸各三；脐下二寸夹之两旁各三；气街动脉各一；伏兔上各一；三里以下至足中趾各八俞；（以上是）各分部所在的骨空穴。手太阳脉气所发的有三十六穴：目内眦各一；目外眦各一；颧骨下各一；耳郭上各一；耳中各一；巨骨穴各一；曲腋上骨穴各一；柱骨上陷中各一；上天窗四寸各一；肩解各一；肩解下三寸各一；肘以下至手小指根部各六俞。","notes":[],"pending":false},{"id":"sw59-3","tags":[],"yw":"手陽明脈氣所發者二十二穴∶鼻空外廉項上各二，大迎骨空各一，柱骨之會各一，骨之會各一，肘以下至手大指次指本各六俞。手少陽脈氣所發者三十二穴∶鼽骨下各一，眉後各一，角上各一，下完骨後各一，項中足太陽之前各一，挾扶突各一，肩貞各一，肩貞下三寸分間各一，肘以下至手小指次指本各六俞。督脈氣所發者二十八穴∶項中央二，發際後中八，面中三，大椎以下至尻尾及旁十五穴，至下凡二十一節，脊椎法也。任脈之氣所發者二十八穴∶喉中央二，膺中骨陷中各一，鳩尾下三寸，胃脘五寸，胃脘以下至橫骨六寸半一。","bh":"手阳明脉气所发的有二十二穴：鼻孔外缘、项上各二；大迎骨空各一；柱骨之会各一；骨之会各一；肘以下至手大指次指根部各六俞。手少阳脉气所发的有三十二穴：颧骨下各一；眉后各一；角上各一；完骨下后方各一；项中足太阳之前各一；夹扶突两旁各一；肩贞各一；肩贞下三寸分肉间各一；肘以下至手小指次指根部各六俞。督脉气所发的有二十八穴：项中央二；发际后中八；面中三；大椎以下至尻尾及两旁十五穴；（自大椎）至下共二十一节，这是脊椎的取穴法。任脉之气所发的有二十八穴：喉中央二；膺中骨陷中各一；鸠尾下三寸（一穴）；胃脘（下）五寸（一穴）；胃脘以下至横骨六寸半（一穴）。","notes":[],"pending":false},{"id":"sw59-4","tags":[],"yw":"腹脈法也。下陰別一，目下各一，下脣一，齦交一。衝脈氣所發者二十二穴∶挾鳩尾外各半寸至臍寸一，挾臍下旁各五分至橫骨寸一，腹脈法也。足少陰舌下，厥陰毛中急脈各一，手少陰各一，陰陽蹺各一，手足諸魚際脈氣所發者，凡三百六十五穴也。皮部論∶蜚（扶沸切）（渠殞切）氣穴論∶蔽（必寐切）（音摘）（奴到切）氣府論∶囟（音信）（上音衣，下音喜）顳（上如輒切，下汝車切）毖（音祕）HT（音仇）<目錄>卷第十六","bh":"（以上）是腹脉的取穴法。下部前阴（下阴别）一穴；目下各一；下唇一穴；龈交一穴。冲脉气所发的有二十二穴：夹鸠尾外各半寸，下至脐每寸一穴；夹脐下旁各五分，下至横骨每寸一穴；（这是）腹脉的取穴法。足少阴（脉气所发）在舌下，厥阴在毛中急脉各一穴，手少阴各一穴，阴阳𫏋各一穴；（再加）手足诸鱼际脉气所发的，总共三百六十五穴。（篇末所附释音为：）皮部论：蜚（扶沸切）、陨（渠殒切）；气穴论：蔽（必寐切）、谪（音摘）、脑（奴到切）；气府论：囟（音信）、（二字，上音衣，下音喜）、颞（上如辄切，下汝车切）、毖（音秘）、（一字，音仇）。","notes":[],"pending":false}]},
{"id":"sw60","book":"素问","no":60,"title":"骨空论","titleTw":"骨空論","tags":["ci","jingluo","zhenfa"],"brief":"论风病的刺灸取穴、任冲督三脉的循行与主病，并详列骨空部位、水俞五十七穴及灸治寒热病的二十九处。","pending":false,"sections":[{"id":"sw60-1","tags":[],"yw":"黃帝問曰∶餘聞風者百病之始也，以針治之奈何？岐伯對曰∶風從外入，令人振寒，汗出頭痛，身重惡寒，治在風府，調其陰陽，不足則補，有餘則瀉，大風頸項痛，刺風府，風府在上椎。大風汗出，灸，在背下挾脊旁三寸所，厭之令病者呼，應手。從風憎風，刺眉頭。失枕在肩上橫骨間，折使揄臂齊肘正，灸脊中。絡季脅引少腹而痛脹，刺。腰痛不可以轉搖，急引陰卵，刺八與痛上，八在腰尻分間。鼠寒熱，還刺寒府，寒府在附膝外解營。取膝上外者使之拜，取足心者使之跪。","bh":"黄帝问道：我听说风是百病的起始，用针怎样治疗它？岐伯回答说：风从外部侵入，使人寒战、汗出、头痛、身体沉重、恶寒，治当取风府，调理其阴阳；不足的用补，有余的用泻。大风而颈项痛的，刺风府；风府在上椎（颈椎之上）。大风而汗出的，用灸法，灸处（譩𫍻）在背下部夹脊旁三寸的地方，用手按压令病人呼喊，应在手下点拨最明显处。感受风邪而畏风的，刺眉头。落枕（失枕）取肩上横骨间；（一方）让病人抬举手臂与肘齐平而伸臂，灸脊中。络脉（病）牵连季胁而引及少腹胀痛的，刺（此处原文有缺字）。腰痛不能转侧动摇、急引睾丸的，刺八髎与痛处之上；八髎在腰尻的分肉之间。鼠（瘘）病而往来寒热的，回过头来刺寒府；寒府在膝盖外侧骨解的营分。取膝上外侧的穴，要让病人作拜的姿势；取足心的穴，要让病人作跪的姿势。","notes":[],"pending":false},{"id":"sw60-2","tags":[],"yw":"任脈者，起於中極之下，以上毛際，循腹裏上關元，至咽喉，上頤循面入目。衝脈者，起於氣街，並少陰之經，挾臍上行，至胸中而散。任脈爲病，男子內結七疝，女子帶下瘕聚。衝脈爲病，逆氣裏急。督脈爲病，脊強反折。督脈者，起於少腹以下骨中央，女子入系廷孔，其孔，溺孔之端也，其絡循陰器合篡間，繞篡後，別繞臀，至少陰與巨陽中絡者，合少陰上股內後廉，貫脊屬腎，與太陽起於目內，上額交巔上，入絡腦，還出別下項，循肩內，挾脊抵腰中，入循膂絡腎；其男子循莖下至篡，與女子等；其少腹直上者，貫臍中央，上貫心入喉，上頤環脣，上系兩目之下中央。","bh":"任脉，起于中极之下，上行至毛际，循腹内上行到关元，到咽喉，再上颐（下颌），沿着面部入于目。冲脉，起于气街，与少阴之经并行，夹脐上行，到胸中而散布。任脉发病，男子为体内结聚的七疝，女子为带下、瘕聚。冲脉发病，为气上逆、腹内拘急。督脉发病，为脊柱强直、角弓反张。督脉，起于少腹以下的骨中央；女子入内系于廷孔，廷孔就是溺孔的尽头。它的络脉循阴器而合于篡间，绕过篡后，分支绕行臀部，到少阴与巨阳中络相合处，合于少阴而上行股内侧后缘，贯穿脊柱而属于肾；与太阳（之脉）同起于目内眦，上额而交于巅顶之上，入内络于脑，复出后别下项部，循肩膊内侧，夹脊抵达腰中，入内循膂而络于肾；其在男子则循阴茎下至篡，与女子相同；其从少腹直上的一支，贯穿脐中央，再上行贯心、入喉，上至颐而环唇，上行系连两目之下的中央。","notes":[],"pending":false},{"id":"sw60-3","tags":[],"yw":"此生病，從少腹上衝心而痛，不得前後，爲衝疝。其女子不孕，癃痔遺溺嗌干。督脈生病治督脈，治在骨上，甚者在臍下營。其上氣有音者治其喉中央，在缺盆中者。其病上衝喉者治其漸，漸者上挾頤也。蹇膝伸不屈治其楗。坐而膝痛治其機。立而暑解，治其骸關。膝痛，痛及拇指治其。坐而膝痛如物隱者，治其關。膝痛不可屈伸，治其背內。連若折，治陽明中俞。若別，治巨陽少陰滎。淫濼脛，不能久立，治少陽之維，在外上五寸。輔骨上橫骨下爲楗，挾髖爲機，膝解爲骸關，挾膝之骨爲連骸，骸下爲輔，輔上爲，上爲關，頭橫骨爲枕。","bh":"督脉生病，从少腹上冲于心而痛，大小便不通，这叫冲疝；在女子则为不孕、癃闭、痔、遗尿、咽干。督脉生病就治督脉，治在骨上，病重的治在脐下营（阴交一带）。其气上逆而有声音（喘息有声）的，治其喉中央，在缺盆之中的部位。其病气上冲于喉的，治其渐；渐就是上夹颐的部位。膝部屈伸不利、能伸不能屈（蹇）的，治其楗（髀骨上端）。坐下而膝痛的，治其机（髋骨两侧）。站立而（膝部）发热松解的，治其骸关。膝痛，疼痛牵连大趾（拇指）的，治其（此处原文有缺字）。坐下而膝痛如同有东西隐在其中的，治其关。膝痛不能屈伸的，治其背内（背部的俞穴）。小腿（连骸部）痛如折断的，治阳明中俞（三里）；若（病）不同（别），治巨阳、少阴的荥穴。小腿酸痛（淫泺）不能久站的，治少阳之维，在外踝上五寸。辅骨之上、横骨之下叫楗；夹髋骨的叫机；膝部的骨缝叫骸关；夹膝之骨叫连骸；骸下叫辅；辅上叫（此处原文有缺字）；其上叫关；头部的横骨叫枕。","notes":[],"pending":false},{"id":"sw60-4","tags":[],"yw":"水俞五十七穴者，尻上五行，行五，伏兔上兩行，行五，左右各一行，行五，踝上各一行，行六穴。髓空在腦後三分，在顱際銳骨之下，一在齦基下，一在項後中復骨下，一在脊骨上空在風府上。脊骨下空，在尻骨下空。數髓空在面挾鼻，或骨空在口下當兩肩。兩骨空，在中之陽。臂骨空在臂陽，去踝四寸兩骨空之間。股骨上空在股陽，出上膝四寸。骨空在輔骨之上端。股際骨空在毛中動下。尻骨空在髀骨之後，相去四寸。扁骨有滲理湊，無髓孔，易髓無空。","bh":"水俞五十七穴：尻骨上五行，每行五穴；伏兔上两行，每行五穴，左右各一行，每行五穴；踝上各一行，每行六穴。髓空在脑后三分，在颅际锐骨之下；一处在牙龈根部之下；一处在项后中复骨之下；一处在脊骨上之空，在风府之上。脊骨下端的空，在尻骨之下的空中。数处髓空在面部夹鼻两侧，或者骨空在口下正当两肩处。两髆之骨空，在肩中的阳侧。臂骨空在臂的阳侧，距腕踝四寸两骨空之间。股骨上端的空在股的阳侧，在膝上四寸处。小腿骨的空在辅骨的上端。股际骨空在阴毛中动脉之下。尻骨空在髀骨之后，相距四寸。扁骨有渗灌的纹理相凑聚，没有髓孔，它的髓虽然易于变换，却没有孔。","notes":[],"pending":false},{"id":"sw60-5","tags":[],"yw":"灸寒熱之法，先灸項大椎，以年爲壯數，次灸橛骨，以年爲壯數，視背俞陷者灸之，舉臂肩上陷者灸之，兩季脅之間灸之，外踝上絕骨之端灸之，足小指次指間灸之，下陷脈灸之，外踝後灸之，缺盆骨上切之堅痛如筋者灸之，膺中陷骨間灸之。掌束骨下灸之，臍下關元三寸灸之，毛際動脈灸之，膝下三寸分間灸之，足陽明跗上動脈灸之，巔上一灸之，犬所齧之處灸之三壯，即以犬傷病法灸之，凡當灸二十九處。傷食灸之，不已者，必視其經之過於陽者，數刺其俞而藥之。","bh":"灸治寒热之法：先灸项部大椎，按年岁为壮数；其次灸橛骨，按年岁为壮数；看背部俞穴陷下的就灸之；举臂时肩上陷处的灸之；两季胁之间灸之；外踝上绝骨之端灸之；足小趾次趾之间灸之；陷下之脉灸之；外踝之后灸之；缺盆骨上按之坚硬作痛如筋状的灸之；膺中陷骨之间灸之；掌后束骨之下灸之；脐下关元三寸灸之；阴毛际动脉处灸之；膝下三寸分肉之间灸之；足阳明（经）足背上的动脉灸之；巅顶上一穴灸之；被犬咬伤之处灸之三壮，也就是按犬伤病的方法灸之；以上共当灸二十九处。伤食而灸之，若病不愈的，必须诊察其经过阳分的经脉，多刺其俞穴并配合药物治疗。","notes":[],"pending":false},{"id":"sw60-6","tags":[],"yw":"<目錄>卷第十六","bh":"（此段原文仅有目录标记：本篇属卷第十六。）","notes":[],"pending":false}]},
{"id":"sw61","book":"素问","no":61,"title":"水热穴论","titleTw":"水熱穴論","tags":["jingluo","zhenfa","bingji"],"brief":"论水病以肾为本、以肺为标的病机与水俞五十七穴，四季取穴深浅不同的道理，以及治热病五十九俞的分布。","pending":false,"sections":[{"id":"sw61-1","tags":[],"yw":"黃帝問曰∶少陰何以主腎？腎何以主水？岐伯對曰∶腎者至陰也，至陰者盛水也，肺者太陰也，少陰者冬脈也，故其本在腎，其末在肺，皆積水也。帝曰∶腎何以能聚水而生病？岐伯曰∶腎者胃之關也，關門不利，故聚水而從其類也。上下溢於皮膚，故爲腫。腫者，聚水而生病也。帝曰∶諸水皆生於腎乎？岐伯曰∶腎者牝髒也，地氣上者屬於腎，而生水液也，故曰至陰。勇而勞甚則腎汗出，腎汗出逢於風，內不得入於髒腑，外不得越於皮膚，客於玄府，行於皮裏，傳爲腫，本之於腎，名曰風水。","bh":"黄帝问道：少阴为什么主肾？肾为什么主水？岐伯回答说：肾是至阴，至阴是水气盛聚之处；肺是太阴，少阴是冬脉；所以水病的根本在肾，其末在肺，两者都积水。黄帝说：肾为什么能聚水而生病？岐伯说：肾是胃的关门，关门不通利，水就聚积而随其同类（水性）泛滥。水气上下溢于皮肤，所以成为浮肿。浮肿就是水聚而生病。黄帝说：各种水病都生于肾吗？岐伯说：肾是牝脏（阴脏），地气上升而属于肾，由此生成水液，所以叫至阴。（劳力）勇而劳倦过甚则肾汗出；肾汗出而遇风，在内不得返还入于脏腑，在外不得越出于皮肤，客留于玄府（汗孔），行于皮里，传变为浮肿；它的根本在肾，名叫风水。","notes":[],"pending":false},{"id":"sw61-2","tags":[],"yw":"所謂玄府者，汗空也。帝曰∶水俞五十七處者，是何主也？岐伯曰∶腎俞五十七穴，積陰之所聚也，水所從出入也。尻上五行行五者，此腎俞。故水病下爲腫大腹，上爲喘呼，不得臥者，標本俱病，故肺爲喘呼，腎爲水腫，肺爲逆不得臥，分爲相輸，俱受者水氣之所留也。伏兔上各二行行五者，此腎之街也。三陰之所交結於腳也。踝上各一行行六者，此腎脈之下行也，名曰太衝。凡五十七穴者，皆髒之陰絡，水之所客也。帝曰∶春取絡脈分肉何也？岐伯曰∶春者木始治，肝氣始生，肝氣急，其風疾，經脈常深，其氣少，不能深入，故取絡脈分肉間。","bh":"所谓玄府，就是汗孔。黄帝说：水俞五十七处，主治什么？岐伯说：肾俞五十七穴，是阴气积聚的地方，也是水气出入的所在。尻骨上五行每行五穴，这就是肾俞。所以水病在下表现为足胫浮肿、腹部胀大，在上表现为喘呼叫呼、不能平卧，这是标本同病；所以肺表现为喘呼，肾表现为水肿，肺气上逆而不得平卧，（二者）分行而彼此输应，都是受水气留滞所致。伏兔上各二行每行五穴，这是肾的通路（肾之街），是三阴经交结于足的部位。踝上各一行每行六穴，这是肾脉的下行之处，名叫太冲。凡此五十七穴，都是脏的阴络，是水邪客居的地方。黄帝说：春天取络脉分肉是为什么？岐伯说：春天是木气开始主治的时候，肝气开始生发；肝气急，其风疾（急）；经脉（邪气）常深，而春时其气少，不能深入，所以取络脉分肉之间。","notes":[],"pending":false},{"id":"sw61-3","tags":[],"yw":"帝曰∶夏取盛經分腠何也？岐伯曰∶夏者火始治，心氣始長，脈瘦氣弱，陽氣留溢，熱燻分腠，內至於經，故取盛經分腠，絕膚而病去者，邪居淺也。所謂盛經者，陽脈也。帝曰∶秋取經俞何也？岐伯曰∶秋者金始治，肺將收殺，金將勝火，陽氣在合，陰氣初勝，溼氣及體，陰氣未盛，未能深入，故取俞以瀉陰邪，取合以虛陽邪，陽氣始衰，故取於合。帝曰∶冬取井滎何也？岐伯曰∶冬者水始治，腎方閉，陽氣衰少，陰氣堅盛，巨陽伏沉，陽脈乃去，故取井以下陰逆，取滎以實陽氣。","bh":"黄帝说：夏天取盛经分腠是为什么？岐伯说：夏天是火气开始主治的时候，心气开始长养；脉瘦而气弱，阳气留溢，热气熏蒸于分腠，内至于经；所以取盛经分腠，（浅刺）透过皮肤而病去，是因为邪居的部位浅。所谓盛经，就是阳脉。黄帝说：秋天取经俞是为什么？岐伯说：秋天是金气开始主治的时候，肺将收（敛）杀（伐）；金将克火，阳气在合（穴），阴气初胜，湿气及于人体；阴气未盛，未能深入；所以取俞以泻阴邪，取合以（衰）虚阳邪；阳气开始衰退，所以取于合。黄帝说：冬天取井荥是为什么？岐伯说：冬天是水气开始主治的时候，肾气刚闭藏，阳气衰少，阴气坚盛，巨阳（太阳）伏沉于里，阳脉于是退去；所以取井穴以降泻上逆的阴气，取荥穴以充实阳气。","notes":[],"pending":false},{"id":"sw61-4","tags":[],"yw":"故曰∶冬取井滎，春不鼽衄。此之謂也。帝曰∶夫子言治熱病五十九俞，餘論其意，未能領別其處，願聞其處，因聞其意。岐伯曰∶頭上五行行五者，以越諸陽之熱逆也。大杼、膺俞、缺盆、背俞，此八者，以瀉胸中之熱也。氣街，三裏，巨虛上下廉，此八者，以瀉胃中之熱也。雲門、骨、委中、髓空，此八者，以瀉四肢之熱也。五髒俞旁五，此十者，以瀉五髒之熱也。凡此五十九穴者，皆熱之左右也。帝曰∶人傷於寒而傳爲熱何也？岐伯曰∶夫寒盛則生熱也。","bh":"所以说：冬天取井荥（并善调摄），春天就不会鼻塞流涕、鼻出血。说的就是这个。黄帝说：先生说治热病有五十九俞，我揣度它的意思，还未能分辨它们的部位，希望听听其部位，并借此了解它的用意。岐伯说：头上五行每行五穴，是用来发散诸阳经上逆的热的。大杼、膺俞、缺盆、背俞，这八穴，是用来泻胸中之热的。气街、三里、巨虚上下廉，这八穴，是用来泻胃中之热的。云门、（髃）骨、委中、髓空，这八穴，是用来泻四肢之热的。五脏俞旁各五穴，这十穴，是用来泻五脏之热的。凡此五十九穴，都在热邪所在的左右。黄帝说：人伤于寒而传变为热是为什么？岐伯说：寒气盛极就生热。","notes":[],"pending":false},{"id":"sw61-5","tags":[],"yw":"骨空論∶（音博）楗（音健）齧（若結切）水熱穴論∶（音祕）菟（音兔）溜（力救切）鼷（音奚）致（馳二切）<目錄>卷第十七","bh":"（篇末所附释音为：）骨空论：（一字，音博）；楗（音健）；啮（若结切）。水热穴论：（一字，音秘）；菟（音兔）；溜（力救切）；鼷（音奚）；致（驰二切）。","notes":[],"pending":false}]},
