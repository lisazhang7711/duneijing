見，嗌痛頷腫。帝曰∶善。治之奈何？岐伯曰∶諸氣在泉，風淫於內，治以辛涼，佐以苦，以甘緩之，以辛散之。熱淫於內，治以鹹寒，佐以甘苦，以酸收之，以苦發之。","bh":"","notes":[],"pending":true},{"id":"sw74-8","tags":[],"yw":"溼淫於內，治以苦熱，佐以酸淡，以苦燥之，以淡泄之。火淫於內，治以鹹冷，佐以苦辛，以酸收之，以苦發之。燥淫於內，治以苦溫，佐以甘辛，以苦下之。寒淫於內，治以甘熱，佐以苦辛，以鹹瀉之，以辛潤之，以苦堅之。帝曰∶善。天氣之變何如？岐伯曰∶厥陰司天，風淫所勝，則太虛埃昏，雲物以擾，寒生春氣，流水不冰。民病胃脘當心而痛，上支兩脅，膈咽不通，飲食不下，舌本強，食則嘔，冷泄腹脹，溏泄瘕水閉，蟄蟲不去，病本於脾。","bh":"","notes":[],"pending":true},{"id":"sw74-9","tags":[],"yw":"衝陽絕，死不治。少陰司天，熱淫所勝，怫熱至，火行其政。民病胸中煩熱，嗌干，右滿，皮膚痛，寒熱咳喘，大雨且至，唾血血泄，鼽衄嚏嘔，溺色變，甚則瘡瘍腫，肩背臂及缺盆中痛，心痛肺，腹大滿，膨膨而喘咳病本於肺。尺澤絕，死不治。太陰司天，溼淫所勝，則沉陰且布，雨變枯槁，腫骨痛陰痹，陰痹者按之不得，腰脊頭項痛，時眩，大便難，陰氣不用，飢不欲食，咳唾則有血，心如懸，病本干腎。太溪絕，死不治。少陽司天，火淫所勝，則溫氣流行，金政不平。","bh":"","notes":[],"pending":true},{"id":"sw74-10","tags":[],"yw":"民病頭痛，發熱惡寒而瘧，熱上皮膚痛，色變黃赤，傳而爲水，身面腫，腹滿仰息，泄注赤白，瘡瘍咳唾血，煩心胸中熱，甚則鼽衄，病本於肺。天府絕，死不治。陽明司天，燥淫所勝，則木乃晚榮，草乃晚生，筋骨內變，民病左脅痛，寒清於中，感而瘧，大涼革候，咳，腹中鳴，注泄溏，名木斂，生菀於下，草焦上首，心脅暴痛，不可反側，嗌干面塵腰痛，丈夫疝，婦人少腹痛，目，瘍瘡痤癰，蟄蟲來見，病本於肝。太衝絕，死不治。太陽司天，寒淫所勝，則寒氣反至，水且冰，血變於中，發爲癰瘍，民病厥心痛，嘔血血泄鼽衄，善悲時眩僕。","bh":"","notes":[],"pending":true},{"id":"sw74-11","tags":[],"yw":"運火炎烈，雨暴乃雹，胸腹滿，手熱肘攣掖腫，心澹澹大動，胸脅胃脘不安，面赤目黃，善噫嗌干，甚則色，渴而欲飲，病本於心。神門絕，死不治。所謂動氣，知其藏也。帝曰∶善。治之奈何？岐伯曰∶司天之氣，風淫所勝，平以辛涼，佐以苦甘，以甘緩之，以酸瀉之。熱淫所勝，平以鹹寒，佐以苦甘，以酸收之。溼淫所勝，平以苦熱，佐以酸辛，以苦燥之，以淡泄之。溼上甚而熱，治以苦溫，佐以甘辛，以汗爲故而止。火淫所勝，平以酸冷，佐以苦甘，以酸收之，以苦發之，以酸復之，熱淫同。","bh":"","notes":[],"pending":true},{"id":"sw74-12","tags":[],"yw":"燥淫所勝，平以苦溼，佐以酸辛，以苦下之。寒淫所勝，平以辛熱，佐以甘苦，以鹹瀉之。帝曰∶善。邪氣反勝，治之奈何？岐伯曰∶風司於地，清反勝之，治以酸溫，佐以苦甘，以辛平之。熱司於地，寒反勝之，治以甘熱，佐以苦辛，以鹹平之。溼司於地，熱反勝之，治以苦冷，佐以鹹甘，以苦平之。火司於地，寒反勝之，治以甘熱，佐以苦辛，以鹹平之。燥司於地，熱反勝之，治以平寒，佐以苦甘，以酸平之，以和爲利。寒司於地，熱反勝之，治以鹹冷，佐以甘辛，以苦平之。","bh":"","notes":[],"pending":true},{"id":"sw74-13","tags":[],"yw":"帝曰∶其司天邪勝何如？岐伯曰∶風化於天，清反勝之，治以酸溫，佐以甘苦。熱化於天，寒反勝之，治以甘溫，佐以苦酸辛。溼化於天，熱反勝之，治以苦寒，佐以苦酸。火化於天，寒反勝之，治以甘熱，佐以苦辛。燥化於天，熱反勝之，治以辛寒，佐以苦甘。寒化於天，熱反勝之，治以鹹冷，佐以苦辛。帝曰∶六氣相勝奈何？岐伯曰∶厥陰之勝，耳鳴頭眩，憒憒欲吐，胃膈如寒，大風數舉，蟲不滋，脅氣並，化而爲熱，小便黃赤，胃脘當心而痛，上支兩脅，腸鳴飧泄，少腹痛，注下赤白，甚則嘔吐，膈咽不通。","bh":"","notes":[],"pending":true},{"id":"sw74-14","tags":[],"yw":"少陰之勝，心下熱善飢，臍下反動，氣遊三焦，炎暑至，木乃津，草乃萎，嘔逆躁煩，腹滿痛溏泄，傳爲赤沃。太陰之勝，火氣內鬱，瘡瘍於中，流散於外，病在脅，甚則心痛熱格，頭痛喉痹項強，獨勝則溼氣內鬱，寒迫下焦，痛留頂，互引眉間，胃滿，雨數至，燥化乃見，少腹滿，腰重強，內不便，善注泄，足下溫，頭重足脛腫，飲發於中，腫於上。少陽之勝，熱客於胃，煩心心痛，目赤欲嘔，嘔酸善飢，耳痛溺赤，善驚譫妄，暴熱消爍，草萎水涸，介蟲乃屈，少腹痛，下沃赤白。","bh":"","notes":[],"pending":true},{"id":"sw74-15","tags":[],"yw":"陽明之勝，清發於中，左脅痛溏泄，內爲嗌塞，外發疝，大涼肅殺，華英改容，毛蟲乃殃，胸中不便，嗌塞而咳。太陽之勝，凝且至，非時水冰，羽乃後化，痔瘧發，寒厥入胃，則內生心痛，陰中乃瘍，隱曲不利，互引陰股，筋肉拘苛，血脈凝泣，絡滿色變，或爲血泄，皮膚痞腫，腹滿食減，熱反上行，頭項囟頂腦戶中痛，目如脫，寒入下焦，傳爲濡瀉。帝曰∶治之奈何？岐伯曰∶厥陰之勝，治以甘清，佐以苦辛，以酸瀉之。少陰之勝，治以辛寒，佐以苦鹹，以甘瀉之。","bh":"","notes":[],"pending":true},{"id":"sw74-16","tags":[],"yw":"太陰之勝，治以鹹熱，佐以辛甘，以苦瀉之。少陽之勝，治以辛寒，佐以甘鹹，以甘瀉之。陽明之勝，治以酸溫，佐以辛甘，以苦泄之。太陽之勝，治以甘熱，佐以辛酸，以鹹瀉之。帝曰∶六氣之復何如？岐伯曰∶悉乎哉問也！厥陰之復，少腹堅滿，裏急暴痛，偃木飛沙，蟲不榮，厥心痛，汗發嘔吐，飲食不入，入而復出，筋骨掉眩清厥，甚則入脾，食痹而吐。衝陽絕，死不治。少陰之復，燠熱內作，煩躁鼽嚏，少腹絞痛，火見燔，嗌燥，分注時止，氣動於左，上行於右，咳，皮膚痛，暴喑心痛，鬱冒不知人，乃灑淅惡寒，振慄譫妄，寒已而熱，渴而欲飲，少氣骨痿，隔腸不便，外爲浮腫噦噫，赤氣後化，流水不冰，熱氣大行，介蟲不復，病胗瘡瘍，癰疽痤痔，甚則入肺，咳而鼻淵。","bh":"","notes":[],"pending":true},{"id":"sw74-17","tags":[],"yw":"天府絕，死不治。太陰之復，溼變乃舉，體重中滿，食飲不化，陰氣上厥，胸中不便，飲發於中，咳喘有聲，大雨時行，鱗見於陸，頭頂痛重，而掉螈尤甚，嘔而密默，唾吐清液，甚則入腎，竅瀉無度。太溪絕，死不治。少陽之復，大熱將至，枯燥燔，介蟲乃耗，驚螈咳衄，心熱煩躁，便數憎風，厥氣上行，面如浮埃，目乃螈，火氣內發，上爲口糜嘔逆，血溢血泄，發而爲瘧，惡寒鼓慄，寒極反熱，嗌絡焦槁，渴引水漿，色變黃赤，少氣脈萎，化而爲水，傳爲腫，甚則入肺，咳而血泄。","bh":"","notes":[],"pending":true},{"id":"sw74-18","tags":[],"yw":"尺澤絕，死不治。陽明之復，清氣大舉，森木蒼干，毛蟲乃厲，病生脅，氣歸於左，善太息，甚則心痛痞滿，腹脹而泄，嘔苦咳噦煩心，病在膈中頭痛，甚則入肝，驚駭筋攣。太衝絕，死不治。太陽之復，厥氣上行，水凝雨冰，羽蟲乃死，心胃生寒，胸膈不利，心痛痞滿，頭痛善悲，時眩僕，食減，腰反痛，屈伸不便，地裂冰堅，陽光不治，少腹控睾，引腰脊，上衝心，唾出清水，及爲噦噫，甚則入心，善忘善悲。神門絕，死不治。帝曰∶善。治之奈何？岐伯曰∶厥陰之復，治以酸寒，佐以甘辛，以酸瀉之，以甘緩之。","bh":"","notes":[],"pending":true},{"id":"sw74-19","tags":[],"yw":"少陰之復，治以鹹寒，佐以苦辛，以甘瀉之，以酸收之，辛苦發之，以鹹之。太陰之復，治以苦熱，佐以酸辛，以苦瀉之，燥之，泄之。少陽之復，治以鹹冷，佐以苦辛，以鹹之，以酸收之，辛苦發之。發不遠熱，無犯溫涼，少陰同法。陽明之復，治以辛溫，佐以苦甘，以苦泄之，以苦下之，以酸補之。太陽之復，治以鹹熱，佐以甘辛，以苦堅之。治諸勝復，寒者熱之，熱者寒之，溫者清之，清者溫之，散者收之，抑者散之，燥者潤之，急者緩之，堅者之，脆者堅之，衰者補之，強者瀉之，各安其氣，必清必靜，則病氣衰去，歸其所宗，此治之大體也。","bh":"","notes":[],"pending":true},{"id":"sw74-20","tags":[],"yw":"帝曰∶善。氣之上下何謂也？岐伯曰∶身半以上，其氣三矣，天之分也，天氣主之。身半以下，其氣三矣，地之分也，地氣主之。以名命氣，以氣命處，而言其病。半，所謂天樞也。故上勝而下俱病者，以地名之。下勝而上俱病者，以天名之。所謂勝至，報氣屈伏而未發也。復至則不以天地異名，皆如復氣爲法也。帝曰∶勝復之動，時有常乎？氣有必乎？岐伯曰∶時有常位，而氣無必也。帝曰∶願聞其道也。岐伯曰∶初氣終三氣，天氣主之，勝之常也。","bh":"","notes":[],"pending":true},{"id":"sw74-21","tags":[],"yw":"四氣盡終氣，地氣主之，復之常也。有勝則復，無勝則否。帝曰∶善。復已而勝何如？岐伯曰∶勝至則復，無常數也，衰乃止耳。復已而勝，不復則害，此傷生也。帝曰∶復而反病何也？岐伯曰∶居非其位，不相得也。大復其勝則主勝之，故反病也。所謂火燥熱也。帝曰∶治之何如？岐伯曰∶夫氣之勝也，微者隨之，甚者制之。氣之復也，和者平之，暴者奪之。皆隨勝氣，安其屈伏，無問其數，以平爲期，此其道也。帝曰∶善。客主之勝復奈何？岐伯曰∶客主之氣，勝而無復也。","bh":"","notes":[],"pending":true},{"id":"sw74-22","tags":[],"yw":"帝曰∶其逆從何如？岐伯曰∶主勝逆，客勝從，天之道也。帝曰∶其生病何如？岐伯曰∶厥陰司天，客勝則耳鳴掉眩，甚則咳；主勝則胸脅痛，舌難以言。少陰司天，客勝則鼽嚏頸項強，肩背瞀熱，頭痛少氣，發熱耳聾目瞑，甚則腫血溢，瘡瘍咳喘；主勝則心熱煩躁，甚則脅痛支滿。太陰司天，客勝則首面腫，呼吸氣喘；主勝則胸腹滿，食已而瞀。少陽司天，客勝則丹胗外發，及爲丹瘡瘍，嘔逆喉痹，頭痛嗌腫，耳聾血溢，內爲螈；主勝則胸滿咳仰息，甚而有血，手熱。","bh":"","notes":[],"pending":true},{"id":"sw74-23","tags":[],"yw":"陽明司天，清復內餘，則咳衄嗌塞，心膈中熱，咳不止而白血出者死。太陽司天，客勝則胸中不利，出清涕，感寒則咳；主勝則喉嗌中鳴。厥陰在泉，客勝則大關節不利，內爲痙強拘螈，外爲不便；主勝則筋骨繇並，腰腹時痛。少陰在泉，客勝則腰痛，尻股膝髀足病，瞀熱以酸，腫不能久立，溲便變；主勝則厥氣上行，心痛發熱，膈中，衆痹皆作，發於脅，魄汗不藏，四逆而起。太陰在泉，客勝則足痿下重，便溲不時，溼客下焦，發而濡瀉，及爲腫隱曲之疾；主勝則寒氣逆滿，食飲不下，甚則爲疝。","bh":"","notes":[],"pending":true},{"id":"sw74-24","tags":[],"yw":"少陽在泉，客勝則腰腹痛而反惡寒，甚則下白溺白；主勝則熱反上行而客於心，心痛發熱，格中而嘔。少陰同候。陽明在泉，客勝則清氣動下，少腹堅滿而數便瀉；主勝則腰重腹痛，少腹生寒，下爲溏，則寒厥於腸，上衝胸中，甚則喘不能久立。太陽在泉，寒復內餘，則腰尻痛；屈伸不利，股脛足膝中痛。帝曰∶善。治之奈何？岐伯曰∶高者抑之，下者舉之，有餘折之，不足補之，佐以所利，和以所宜，必安其主客，適其寒溫，同者逆之，異者從之。","bh":"","notes":[],"pending":true},{"id":"sw74-25","tags":[],"yw":"帝曰∶治寒以熱，治熱以寒，氣相得者逆之，不相得者從之，餘以知之矣。其於正味何如？岐伯曰∶木位之主，其瀉以酸，其補以辛。火位之主，其瀉以甘，其補以鹹。土位之主，其瀉以苦，其補以甘。金位之主，其瀉以辛，其補以酸。水位之主，其瀉以鹹，其補以苦。厥陰之客，以辛補之，以酸瀉之，以甘緩之。少陰之客，以鹹補之，以甘瀉之，以鹹收之。太陰之客，以甘補之，以苦瀉之，以甘緩之。少陽之客，以鹹補之，以甘瀉之，以鹹之。陽明之客，以酸補之，以辛瀉之，以苦泄之。","bh":"","notes":[],"pending":true},{"id":"sw74-26","tags":[],"yw":"太陽之客，以苦補之，以鹹瀉之，以苦堅之，以辛潤之。開發腠理，致津液通氣也。帝曰∶善。願聞陰陽之三也何謂？岐伯曰∶氣有多少，異用也。帝曰∶陽明何謂也？岐伯曰∶兩陽合明也。帝曰∶厥陰何也？岐伯曰∶兩陰交盡也。帝曰∶氣有多少，病有盛衰，治有緩急，方有大小，願聞其約奈何？岐伯曰∶氣有高下，病有遠近，證有中外，治有輕重，適其至所爲故也。大要曰∶君一臣二，奇之制也；君二臣四，偶之制也；君二臣三，奇之制也；君二臣六，偶之制也。","bh":"","notes":[],"pending":true},{"id":"sw74-27","tags":[],"yw":"故曰∶近者奇之，遠者偶之，汗者不以奇，下者不以偶，補上治上制以緩，補下治下制以急，急則氣味濃，緩則氣味薄，適其至所，此之謂也。病所遠而中道氣味之者，食而過之，無越其制度也。是故平氣之道，近而奇偶，制小其服也。遠而奇偶，制大其服也。大則數少，小則數多。多則九之，少則二之。奇之不去則偶之，是謂重方。偶之不去，則反佐以取之，所謂寒熱溫涼，反從其病也。帝曰∶善。病生於本，餘知之矣。生於標者，治之奈何？岐伯曰∶病反其本，中標之病，治反其本，中標之方。","bh":"","notes":[],"pending":true},{"id":"sw74-28","tags":[],"yw":"帝曰∶善。六氣之勝，何以候之？岐伯曰∶乘其至也，清氣大來，燥之勝也，風木受邪，肝病生焉。熱氣大來，火之勝也，金燥受邪，肺病生焉。寒氣大來，水之勝也，火熱受邪，心病生焉。溼氣大來，土之勝也，寒水受邪，腎病生焉。風氣大來，木之勝也，土溼受邪，脾病生焉。所謂感邪而生病也。乘年之虛，則邪甚也。失時之和，亦邪甚也。遇月之空，亦邪甚也。重感於邪，則病危矣。有勝之氣，其必來復也。帝曰∶其脈至何如？岐伯曰∶厥陰之至其脈弦，少陰之至其脈鉤，太陰之至其脈沉，少陽之至大而浮，陽明之至短而澀，太陽之至大而長。","bh":"","notes":[],"pending":true},{"id":"sw74-29","tags":[],"yw":"至而和則平，至而甚則病，至而反者病，至而不至者病，未至而至者病，陰陽易者危。帝曰∶六氣標本，所從不同奈何？岐伯曰∶氣有從本者，有從標本者，有不從標本者也。帝曰∶願卒聞之。岐伯曰∶少陽太陰從本，少陰太陽從本從標，陽明厥陰，不從標本從乎中也。故從本者化生於本，從標本者有標本之化，從中者以中氣爲化也。帝曰∶脈從而病反者，其診何如？岐伯曰∶脈至而從，按之不鼓，諸陽皆然。帝曰∶諸陰之反，其脈何如？岐伯曰∶脈至而從，按之鼓甚而盛也。","bh":"","notes":[],"pending":true},{"id":"sw74-30","tags":[],"yw":"是故百病之起，有生於本者，有生於標者，有生於中氣者，有取本而得者，有取標而得者，有取中氣而得者，有取標本而得者，有逆取而得者，有從取而得者。逆，正順也。若順，逆也。故曰∶知標與本，用之不殆，明知逆順，正行無問。此之謂也。不知是者，不足以言診，足以亂經。故《大要》曰∶粗工嘻嘻，以爲可知，言熱未已，寒病復始，同氣異形，迷診亂經。此之謂也。夫標本之道，要而博，小而大，可以言一而知百病之害，言標與本，易而勿損，察本與標，氣可令調，明知勝復，爲萬民式，天之道畢矣。","bh":"","notes":[],"pending":true},{"id":"sw74-31","tags":[],"yw":"帝曰∶勝復之變，早晏何如？岐伯曰∶夫所勝者，勝至已病，病已慍慍，而復已萌也。夫所復者，勝盡而起，得位而甚，勝有微甚，復有少多，勝和而和，勝虛而虛，天之常也。帝曰∶勝復之作，動不當位，或後時而至，其故何也？岐伯曰∶夫氣之生，與其化衰盛異也。寒暑溫涼盛衰之用，其在四維。故陽之動，始於溫，盛於暑；陰之動，始於清，盛於寒。春夏秋冬，各差其分。故《大要》曰∶彼春之暖，爲夏之暑，彼秋之忿，爲冬之怒，謹按四維，斥候皆歸，其終可見，其始可知。","bh":"","notes":[],"pending":true},{"id":"sw74-32","tags":[],"yw":"此之謂也。帝曰∶差有數乎？岐伯曰∶又凡三十度也。帝曰∶其脈應皆何如？岐伯曰∶差同正法，待時而去也。脈要曰∶春不沉，夏不弦，冬不澀，秋不數，是謂四塞。沉甚曰病，弦甚曰病，澀甚曰病，數甚曰病，參見曰病，復見曰病，未去而去曰病，去而不去曰病，反者死。故曰∶氣之相守司也，如權衡之不得相失也。夫陰陽之氣，清靜則生化治，動則苛疾起，此之謂也。帝曰∶幽明何如？岐伯曰∶兩陰交盡故曰幽，兩陽合明故曰明，幽明之配，寒暑之異也。","bh":"","notes":[],"pending":true},{"id":"sw74-33","tags":[],"yw":"帝曰∶分至何如？岐伯曰∶氣至之謂至，氣分之謂分，至則氣同，分則氣異，所謂天地之正紀也。帝曰∶夫子言春秋氣始於前，冬夏氣始於後，餘已知之矣。然六氣往復，主歲不常也，其補瀉奈何？岐伯曰∶上下所主，隨其攸利，正其味，則其要也，左右同法。大要曰∶少陽之主，先甘後鹹；陽明之主，先辛後酸；太陽之主，先鹹後苦；厥陰之主，先酸後辛；少陰之主，先甘後鹹；太陰之主，先苦後甘。佐以所利，資以所生，是謂得氣。帝曰∶善。夫百病之生也，皆生於風寒暑溼燥火，以之化之變也。","bh":"","notes":[],"pending":true},{"id":"sw74-34","tags":[],"yw":"經言盛者瀉之，虛者補之，餘錫以方士，而方士用之尚未能十全，餘欲令要道必行，桴鼓相應，猶拔刺雪污，工巧神聖，可得聞乎？岐伯曰∶審察病機，無失氣宜，此之謂也。帝曰∶願聞病機何如？岐伯曰∶諸風掉眩，皆屬於肝。諸寒收引，皆屬於腎。諸氣鬱，皆屬於肺。諸溼腫滿，皆屬於脾。諸熱瞀螈，皆屬於火。諸痛癢瘡，皆屬於心。諸厥固泄，皆屬於下。諸痿喘嘔，皆屬於上。諸禁鼓慄，如喪神守，皆屬於火。諸痙項強，皆屬於溼。諸逆衝上，皆屬於火。","bh":"","notes":[],"pending":true},{"id":"sw74-35","tags":[],"yw":"諸脹腹大，皆屬於熱。諸躁狂越，皆屬於火。諸暴強直，皆屬於風。諸病有聲，鼓之如鼓，皆屬於熱。諸病腫疼酸驚駭，皆屬於火。諸轉反戾，水液混濁，皆屬於熱。諸病水液，澄徹清冷，皆屬於寒。諸嘔吐酸，暴注下迫，皆屬於熱。故大要曰∶謹守病機，各司其屬，有者求之，無者求之，盛者責之，虛者責之，必先五勝，疏其血氣，令其調達，而致和平。此之謂也。帝曰∶善。五味陰陽之用何如？岐伯曰∶辛甘發散爲陽，酸苦湧泄爲陰，鹹味湧泄爲陰，淡味滲泄爲陽。","bh":"","notes":[],"pending":true},{"id":"sw74-36","tags":[],"yw":"六者或收或散，或緩或急，或燥或潤，或或堅，以所利而行之，調其氣使其平也。帝曰∶非調氣而得者，治之奈何？有毒無毒，何先何後？願聞其道。岐伯曰∶有毒無毒，所治爲主，適大小爲制也。帝曰∶請言其制。岐伯曰∶君一臣二，制之小也；君一臣三佐五，制之中也；君一臣三佐九，制之大也。寒者熱之，熱者寒之，微者逆之，甚者從之，堅者削之，客者除之，勞者溫之，結者散之，留者攻之，燥者濡之，急者緩之，散者收之，損者溫之，逸者行之，驚者平之，上之下之，摩之浴之，薄之劫之，開之發之，適事爲故。","bh":"","notes":[],"pending":true},{"id":"sw74-37","tags":[],"yw":"帝曰∶何謂逆從？岐伯曰∶逆者正治，從者反治，從少從多，觀其事也。帝曰∶反治何謂？岐伯曰∶熱因寒用，寒因熱用，塞因塞用，通因通用，必伏其所主，而先其所因，其始則同，其終則異，可使破積，可使潰堅，可使氣和，可使必已。帝曰∶善。氣調而得者何如？岐伯曰∶逆之從之，逆而從之，從而逆之，疏氣令調，則其道也。帝曰∶善。病之中外何如？岐伯曰∶從內之外者，調其內；從外之內者，治其外；從內之外而盛於外者，先調其內而後治其外；從外之內而盛於內者，先治其外而後調其內；中外不相及，則治主病。","bh":"","notes":[],"pending":true},{"id":"sw74-38","tags":[],"yw":"帝曰∶善。火熱復，惡寒發熱，有如瘧狀，或一日發，或間數日發，其故何也？岐伯曰∶勝復之氣，會遇之時，有多少也。陰氣多而陽氣少，則其發日遠；陽氣多而陰氣少，則其發日近。此勝復相薄，盛衰之節，瘧亦同法。帝曰∶論言治寒以熱，治熱以寒，而方士不能廢繩墨而更其道也。有病熱者寒之而熱，有病寒者熱之而寒，二者皆在，新病復起，奈何治？岐伯曰∶諸寒之而熱者取之陰，熱之而寒者取之陽，所謂求其屬也。帝曰∶善。服寒而反熱、服熱而反寒，其故何也？岐伯曰∶治其王氣，是以反也。","bh":"","notes":[],"pending":true},{"id":"sw74-39","tags":[],"yw":"帝曰∶不治王而然者何也？岐伯曰∶悉乎哉問也！不治五味屬也。夫五味入胃，各歸所喜，故酸先入肝，苦先入心，甘先入脾，辛先入肺，鹹先入腎，久而增氣，物化之常也。氣增而久，夭之由也。帝曰∶善。方制君臣何謂也？岐伯曰∶主病之謂君，佐君之謂臣，應臣之謂使，非上下三品之謂也。帝曰∶三品何謂？岐伯曰∶所以明善惡之殊貫也。帝曰∶善。病之中外何如？岐伯曰∶調氣之方，必別陰陽，定其中外，各守其鄉，內者內治，外者外治，微者調之，其次平之，盛者奪之，汗之下之，寒熱溫涼，衰之以屬，隨其攸利，謹道如法，萬舉萬全，氣血正平，長有天命。","bh":"","notes":[],"pending":true},{"id":"sw74-40","tags":[],"yw":"帝曰∶善。至真要大論∶熠（羊入切）（土渾切）膨（普盲切）痤（殂禾切）（如悅切）（匹搖切）（之力切）脆（須醉切）<目錄>卷第二十三","bh":"","notes":[],"pending":true}]},
{"id":"sw75","book":"素问","no":75,"title":"着至教论","titleTw":"着至教論","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"sw75-1","tags":[],"yw":"黃帝坐明堂，召雷公而問之曰∶子知醫之道乎？雷公對曰∶誦而未能解，解而未能別，別而未能明，明而未能彰，足以治羣僚，不足治侯王。願得受樹天之度，四時陰陽合之，別星辰與日月光，以彰經術，後世益明，上通神農，着至教疑於二皇。帝曰∶善。無失之，此皆陰陽表裏上下雌雄相輸應也，而道上知天文，下知地理，中知人事，可以長久，以教衆庶，亦不疑殆，醫道論篇，可傳後世，可以爲寶。雷公曰∶請受道，諷誦用解。帝曰∶子不聞《陰陽傳》乎？曰∶不知。","bh":"","notes":[],"pending":true},{"id":"sw75-2","tags":[],"yw":"曰∶夫三陽天爲業，上下無常，合而病至，偏害陰陽。雷公曰∶三陽莫當，請聞其解。帝曰∶三陽獨至者，是三陽並至，並至如風雨，上爲巔疾，下爲漏病。外無期，內無正，不中經紀，診無上下，以書別。雷公曰∶臣治疏愈，說意而已。帝曰∶三陽者，至陽也，積並則爲驚，病起疾風，至如霹靂，九竅皆塞，陽氣滂溢，干嗌喉塞。並於陰，則上下無常，薄爲腸。此謂三陽直心，坐不得起，臥者便身全，三陽之病。且以知天下，何以別陰陽，應四時，合之五行。","bh":"","notes":[],"pending":true},{"id":"sw75-3","tags":[],"yw":"雷公曰∶陽言不別，陰言不理，請起受解，以爲至道。帝曰∶子若受傳，不知合至道以惑師教，語子至道之要。病傷五髒，筋骨以消，子言不明不別，是世主學盡矣。腎且絕，惋惋日暮，從容不出，人事不殷。<目錄>卷第二十三","bh":"","notes":[],"pending":true}]},
{"id":"sw76","book":"素问","no":76,"title":"示从容论","titleTw":"示從容論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw76-1","tags":[],"yw":"黃帝燕坐，召雷公而問之曰∶汝受術誦書者，若能覽觀雜學，及於比類，通合道理，爲餘言子所長，五髒六腑，膽胃大小腸脾胞膀胱，腦髓涕唾，哭泣悲哀，水所從行，此皆人之所生，治之過失，子務明之，可以十全，即不能知，爲世所怨。雷公曰∶臣請誦《脈經·上下編》甚衆多矣，別異比類，猶未能以十全，又安足以明之。帝曰∶子別試通五髒之過，六腑之所不和，針石之敗，毒藥所宜，湯液滋味，具言其狀，悉言以對，請問不知。雷公曰∶肝虛腎虛脾虛，皆令人體重煩冤，當投毒藥刺灸砭石湯液，或已或不已，願聞其解。","bh":"","notes":[],"pending":true},{"id":"sw76-2","tags":[],"yw":"帝曰∶公何年之長而問之少，餘真問以自謬也。吾問子窈冥，子言上下編以對，何也？夫脾虛浮似肺，腎小浮似脾，肝急沉散似腎，此皆工之所時亂也，然從容得之。若夫三髒土木水參居，此童子之所知，問之何也？雷公曰∶於此有人，頭痛筋攣骨重，怯然少氣，噦噫腹滿，時驚不嗜臥，此何髒之發也？脈浮而弦，切之石堅，不知其解，復問所以三髒者，以知其比類也。帝曰∶夫從容之謂也。夫年長則求之於腑，年少則求之於經，年壯則求之於髒。今子所言皆失，八風菀熟，五髒消爍，傳邪相受。","bh":"","notes":[],"pending":true},{"id":"sw76-3","tags":[],"yw":"夫浮而弦者，是腎不足也。沉而石者，是腎氣內着也。怯然少氣者，是水道不行，形氣消索也。咳嗽煩冤者，是腎氣之逆也。一人之氣，病在一髒也。若言三髒俱行，不在法也。雷公曰∶於此有人，四肢解惰，喘咳血泄，而愚診之，以爲傷肺，切脈浮大而緊，愚不敢治，粗工下砭石，病愈多出血，血止身輕，此何物也？帝曰∶子所能治，知亦衆多，與此病失矣。譬以鴻飛，亦衝於天。夫聖人之治病，循法守度，援物比類，化之冥冥，循上及下，何必守經今夫脈浮大虛者，是脾氣之外絕，去胃外歸陽明也。","bh":"","notes":[],"pending":true},{"id":"sw76-4","tags":[],"yw":"夫二火不勝三水，是以脈亂而無常也。四肢解惰，此脾精之不行也。喘咳者，是水氣並陽明也。血泄者，脈急血無所行也。若夫以爲傷肺者，由失以狂也。不引比類，是知不明也。夫傷肺者，脾氣不守，胃氣不清，經氣不爲使，真髒壞決，經脈旁絕，五髒漏泄，不衄則嘔，此二者不相類也。譬如天之無形，地之無理，白與黑相去遠矣。是失吾過矣，以子知之，故不告子，明引比類《從容》，是以名曰診輕，是謂至道也。<目錄>卷第二十三","bh":"","notes":[],"pending":true}]},
{"id":"sw77","book":"素问","no":77,"title":"五过论","titleTw":"五過論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw77-1","tags":[],"yw":"黃帝曰∶嗚呼遠哉！閔閔乎若視深淵，若迎浮雲，視深淵尚可測，迎浮雲莫知其際。聖人之術，爲萬民式，論裁志意，必有法則，循經守數，按循醫事，爲萬民副，故事有五過四德，汝知之乎？雷公避席再拜曰∶臣年幼小，蒙愚以惑，不聞五過與四德，比類形名，虛引其經，心無所對。帝曰∶凡未診病者，必問嘗貴後賤，雖不中邪，病從內生，名曰脫營。嘗富後貧，名曰失精，五氣留連，病有所並。醫工診之，不在髒腑，不變軀形，診之而疑，不知病名。","bh":"","notes":[],"pending":true},{"id":"sw77-2","tags":[],"yw":"身體日減，氣虛無精，病深無氣，灑灑然時驚，病深者，以其外耗於衛，內奪於榮。良工所失，不知病情，此亦治之一過也。凡欲診病者，必問飲食居處，暴樂暴苦，始樂後苦，皆傷精氣，精氣竭絕，形體毀沮。暴怒傷陰，暴喜傷陽，厥氣上行，滿脈去形。愚醫治之，不知補瀉，不知病情，精華日脫，邪氣乃並，此治之二過也。善爲脈者，必以比類奇恆從容知之，爲工而不知道，此診之不足貴，此治之三過也。診有三常，必問貴賤，封君敗傷，及欲侯王。","bh":"","notes":[],"pending":true},{"id":"sw77-3","tags":[],"yw":"故貴脫勢，雖不中邪，精神內傷，身必敗亡。始富後貧，雖不傷邪，皮焦筋屈，痿爲攣。醫不能嚴，不能動神，外爲柔弱，亂至失常，病不能移，則醫事不行，此治之四過也。凡診者，必知終始，有知餘緒，切脈問名，當合男女。離絕菀結，憂恐喜怒，五髒空虛，血氣離守，工不能知，何術之語。嘗富大傷，斬筋絕脈，身體復行，令澤不息。故傷敗結，留薄歸陽，膿積寒炅。粗工治之，亟刺陰陽，身體解散，四肢轉筋，死日有期，醫不能明，不問所發，唯言死日，亦爲粗工，此治之五過也。","bh":"","notes":[],"pending":true},{"id":"sw77-4","tags":[],"yw":"凡此五者，皆受術不通，人事不明也。故曰∶聖人之治病也，必知天地陰陽，四時經紀，五髒六腑，雌雄表裏，刺灸砭石、毒藥所主，從容人事，以明經道，貴賤貧富，各異品理，問年少長，勇怯之理，審於分部，知病本始，八正九候，診必副矣。治病之道，氣內爲寶，循求其理，求之不得，過在表裏。守數據治，無失俞理，能行此術，終身不殆。不知俞理，五髒菀熟，癰發六腑。診病不審，是謂失常，謹守此治，與經相明，《上經》、《下經》，揆度陰陽，奇恆五中，決以明堂，審於終始，可以橫行。","bh":"","notes":[],"pending":true},{"id":"sw77-5","tags":[],"yw":"<目錄>卷第二十三","bh":"","notes":[],"pending":true}]},
{"id":"sw78","book":"素问","no":78,"title":"征四失论","titleTw":"徵四失論","tags":["zhenfa","bingji","yinyang"],"brief":"","pending":true,"sections":[{"id":"sw78-1","tags":[],"yw":"黃帝在明堂，雷公侍坐，黃帝曰∶夫子所通書受事衆多矣，試言得失之意，所以得之，所以失之。雷公對曰∶循經受業，皆言十全，其時有過失者，請聞其事解也。帝曰∶子年少智未及邪？將言以雜合耶？夫經脈十二，絡脈三百六十五，此皆人之所明知，工之所循用也。所以不十全者，精神不專，志意不理，外內相失，故時疑殆。診不知陰陽逆從之理，此治之一失矣。受師不卒，妄作雜術，謬言爲道，更名自功，妄用砭石，後遺身咎，此治之二失也。","bh":"","notes":[],"pending":true},{"id":"sw78-2","tags":[],"yw":"不適貧富貴賤之居，坐之薄濃，形之寒溫，不適飲食之宜，不別人之勇怯，不知比類，足以自亂，不足以自明，此治之三失也。診病不問其始，憂患飲食之失節，起居之過度，或傷於毒，不先言此，卒持寸口，何病能中，妄言作名，爲粗所窮，此治之四失也。是以世人之語者，馳千裏之外，不明尺寸之論，診無人事。治數之道，從容之葆，坐持寸口，診不中五脈，百病所起，始以自怨，遺師其咎。是故治不能循理，棄術於市，妄治時愈，愚心自得。嗚呼！窈窈冥冥，熟知其道？！道之大者，擬於天地，配於四海，汝不知道之諭，受以明爲晦。","bh":"","notes":[],"pending":true},{"id":"sw78-3","tags":[],"yw":"着至教論∶恤（音戌）示從容論∶砭（方驗切）五過論∶沮（七餘反）憚（音但）徵四失論∶佚（音逸）葆（音保）<目錄>卷第二十四","bh":"","notes":[],"pending":true}]},
{"id":"sw79","book":"素问","no":79,"title":"阴阳类论","titleTw":"陰陽類論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw79-1","tags":[],"yw":"孟春始至，黃帝燕坐，臨觀八極，正八風之氣，而問雷公曰∶陰陽之類，經脈之道，五中所主，何髒最貴？雷公對曰∶春甲乙青，中主肝，治七十二日，是脈之主時，臣以其髒最貴。帝曰∶卻念上下經陰陽從容，子所言貴，最其下也。雷公致齋七日，旦復侍坐。帝曰∶三陽爲經，二陽爲維，一陽爲遊部，此知五髒終始。三陰爲表，二陰爲裏，一陰至絕作朔晦，卻具合以正其理。雷公曰∶受業未能明。帝曰∶所謂三陽者，太陽爲經，三陽脈至手太陰，弦浮而不沉，決以度，察以心，合之陰陽之論。","bh":"","notes":[],"pending":true},{"id":"sw79-2","tags":[],"yw":"所謂二陽者，陽明也，至手太陰，弦而沉急不鼓，炅至以病皆死。一陽者，少陽也，至手太陰，上連人迎，弦急懸不絕，此少陽之病也，專陰則死。三陰者，六經之所主也，交於太陰，伏鼓不浮，上空志心。二陰至肺，其氣歸膀胱，外連脾胃。一陰獨至，經絕，氣浮不鼓，鉤而滑。此六脈者，乍陰乍陽，交屬相並，繆通五髒，合於陰陽，先至爲主，後至爲客。雷公曰∶臣悉盡意，受傳經脈，頌得從容之道，以合《從容》，不知陰陽，不知雌雄。帝曰∶三陽爲父，二陽爲衛，一陽爲紀。","bh":"","notes":[],"pending":true},{"id":"sw79-3","tags":[],"yw":"三陰爲母，二陰爲雌，一陰爲獨使。二陽一陰，陽明主病，不勝一陰，脈而動，九竅皆沉。三陽一陰，太陽脈勝，一陰不能止，內亂五髒，外爲驚駭。二陰二陽，病在肺，少陰脈沉，勝肺傷脾，外傷四肢。二陰二陽皆交至，病在腎，罵詈妄行，巔疾爲狂。二陰一陽，病出於腎，陰氣客遊於心，脘下空竅，堤閉塞不通，四肢別離。一陰一陽代絕，此陰氣至心，上下無常，出入不知，喉咽干燥，病在土脾。二陽三陰，至陰皆在，陰不過陽，陽氣不能止陰，陰陽並絕，浮爲血瘕，沉爲膿。","bh":"","notes":[],"pending":true},{"id":"sw79-4","tags":[],"yw":"陰陽皆壯，下至陰陽，上合昭昭，下合冥冥，診決死生之期，遂合歲首。雷公曰∶請問短期。黃帝不應。雷公復問。黃帝曰。在經論中。雷公曰∶請聞短期。黃帝曰∶冬三月之病，病合於陽者，至春正月脈有死徵，皆歸出春。冬三月之病，在理已盡，草與柳葉皆殺，春陰陽皆絕，期在孟春。春三月之病，曰陽殺，陰陽皆絕，期在草干。夏三月之病，至陰不過十日，陰陽交，期在水。秋三月之病，三陽俱起，不治自已。陰陽交合者，立不能坐，坐不能起。","bh":"","notes":[],"pending":true},{"id":"sw79-5","tags":[],"yw":"三陽獨至，期在石水。二陰獨至，期在盛水。<目錄>卷第二十四","bh":"","notes":[],"pending":true}]},
{"id":"sw80","book":"素问","no":80,"title":"方盛衰论","titleTw":"方盛衰論","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"sw80-1","tags":[],"yw":"雷公請問∶氣之多少，何者爲逆？何者爲從？黃帝答曰∶陽從左，陰從右，老從上，少從下，是以春夏歸陽爲生，歸秋冬爲死，反之，則歸秋冬爲生，是以氣多少逆皆爲厥。問曰∶有餘者厥耶？答曰∶一上不下，寒厥到膝，少者秋冬死，老者秋冬生。氣上不下，頭痛巔疾，求陽不得，求陰不審，五部隔無徵，若居曠野，若伏空室，綿綿乎屬不滿日。是以少氣之厥，令人妄夢，其極至迷。三陽絕，三陰微，是爲少氣。是以肺氣虛則使人夢見白物，見人斬血借借，得其時則夢見兵戰。","bh":"","notes":[],"pending":true},{"id":"sw80-2","tags":[],"yw":"腎氣虛則使人夢見舟船溺人，得其時則夢伏水中，若有畏恐。肝氣虛則夢見菌香生草，得其時則夢伏樹下不敢起。心氣虛則夢救火陽物，得其時則夢燔灼。脾氣虛則夢飲食不足，得其時則夢築垣蓋屋。此皆五髒氣虛，陽氣有餘，陰氣不足，合之五診，調之陰陽，以在《經脈》。診有十度，度人脈度、髒度、肉度、筋度、俞度。陰陽氣盡，人病自具。脈動無常，散陰頗陽，脈脫不具，診無常行，診必上下，度民君卿，受師不卒，使術不明，不察逆從，是爲妄行，持雌失雄，棄陰附陽，不知並合，診故不明，傳之後世，反論自章。","bh":"","notes":[],"pending":true},{"id":"sw80-3","tags":[],"yw":"至陰虛，天氣絕；至陽盛，地氣不足。陰陽並交，至人之所行。陰陽並交者，陽氣先至，陰氣後至。是以聖人持診之道，先後陰陽而持之，奇恆之勢乃六十首，診合微之事，追陰陽之變，章五中之情，其中之論，取虛實之要，定五度之事，知此乃足以診。是以切陰不得陽，診消亡，得陽不得陰，守學不湛，知左不知右，知右不知左，知上不知下，知先不知後，故治不久。知丑知善，知病知不病，知高知下，知坐知起，知行知止，用之有紀，診道乃具，萬世不殆。","bh":"","notes":[],"pending":true},{"id":"sw80-4","tags":[],"yw":"起所有餘，知所不足，度事上下，脈事因格。是以形弱氣虛死；形氣有餘，脈氣不足死；脈氣有餘，形氣不足生。是以診有大方，坐起有常，出入有行，以轉神明，必清必淨，上觀下觀，司八正邪，別五中部，按脈動靜，循尺滑澀，寒溫之意，視其大小，合之病能，逆從以得，復知病名，診可十全，不失人情，故診之或視息視意，故不失條理，道甚明察，故能長久。不知此道，失經絕理，亡言妄期，此謂失道。<目錄>卷第二十四","bh":"","notes":[],"pending":true}]},
{"id":"sw81","book":"素问","no":81,"title":"解精微论","titleTw":"解精微論","tags":["ci","zangxiang","yinyang"],"brief":"","pending":true,"sections":[{"id":"sw81-1","tags":[],"yw":"黃帝在明堂，雷公請曰∶臣授業傳之，行教以經論，從容形法，陰陽刺灸，湯藥所滋。行治有賢不肖，未必能十全。若先言悲哀喜怒，燥溼寒暑，陰陽婦女，請問其所以然者，卑賤富貴，人之形體所從，羣下通使，臨事以適道術，謹聞命矣。請問有HT愚僕漏之問，不在經者，欲聞其狀。帝曰∶大矣。公請問∶哭泣而淚不出者，若出而少涕，其故何也？帝曰∶在經有也。復問∶不知水所從生，涕所從出也。帝曰∶若問此者，無益於治也，工之所知，道之所生也。","bh":"","notes":[],"pending":true},{"id":"sw81-2","tags":[],"yw":"夫心者，五髒之專精也，目者其竅也，華色者其榮也，是以人有德也，則氣和於目，有亡，憂知於色。是以悲哀則泣下，泣下水所由生。水宗者積水也，積水者至陰也，至陰者腎之精也。宗精之水所以不出者，是精持之也，輔之裹之，故水不行也。夫水之精爲志，火之精爲神，水火相感，神志俱悲，是以目之水生也。故諺言曰∶心悲名曰志悲。志與心精，共湊於目也。是以俱悲則神氣傳於心精，上不傳於志而志獨悲，故泣出也。泣涕者腦也，腦者陰也，髓者骨之充也，故腦滲爲涕。","bh":"","notes":[],"pending":true},{"id":"sw81-3","tags":[],"yw":"志者骨之主也，是以水流而涕從之者，其行類也。夫涕之與泣者，譬如人之兄弟，急則俱死，生則俱生，其志以早悲，是以涕泣俱出而橫行也。夫人涕泣俱出而相從者，所屬之類也。雷公曰∶大矣。請問人哭泣而淚不出者，若出而少，涕不從之何也？帝曰∶夫泣不出者，哭不悲也。不泣者，神不慈也。神不慈則志不悲，陰陽相持，泣安能獨來。夫志悲者惋，惋則衝陰，衝陰則志去目，志去則神不守精，精神去目，涕泣出也。且子獨不誦不念夫經言乎，厥則目無所見。","bh":"","notes":[],"pending":true},{"id":"sw81-4","tags":[],"yw":"夫人厥則陽氣並於上，陰氣並於下。陽並於上，則火獨光也；陰並於下，則足寒，足寒則脹也。夫一水不勝五火，故目盲。是以衝風，泣下而不止。夫風之中目也，陽氣內守於精，是火氣燔目，故見風則泣下也。有以比之，夫火疾風生乃能雨，此之類也。陰陽類論∶（音廉）方盛衰論∶菌（祛倫切）解精微論∶HT（士銜切）湊（粗勾切）<目錄>","bh":"","notes":[],"pending":true}]},
{"id":"ls01","book":"灵枢","no":1,"title":"九针十二原","titleTw":"九針十二原","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls01-1","tags":[],"yw":"黃帝問於岐伯曰：餘子萬民，養百姓而收其租稅；餘哀其不給而屬有疾病。餘欲勿使被毒藥，無用砭石，欲以微針通其經脈，調其血氣，榮其逆順出入之會。令可傳於後世，必明爲之法，令終而不滅，久而不絕，易用難忘，爲之經紀，異其章，別其表裏，爲之終始。令各有形，先立針經。願聞其情。岐伯答曰：臣請推而次之，令有綱紀，始於一，終於九焉。請言其道！小針之要，易陳而難入。粗守形，上守神。神乎神，客在門。未赭其疾，惡知其原？刺之微在速遲。","bh":"","notes":[],"pending":true},{"id":"ls01-2","tags":[],"yw":"粗守關，上守機，機之動，不離其空。空中之機，清靜而微。其來不可逢，其往不可追。知機之道者，不可掛以發。不知機道，扣之不發。知其往來，要與之期。粗之闇乎，妙哉，工獨有之。往者爲逆，來者爲順，明知逆順，正行無問。迎而奪之，惡得無虛？追而濟之，惡得無實？迎之隨之，以意和之，針道畢矣。凡用針者，虛則實之，滿則泄之，宛陳則除之，邪勝則虛之。大要曰：徐而疾則實，疾而徐則虛。言實與虛，若有若無。察後與先。若存若亡。","bh":"","notes":[],"pending":true},{"id":"ls01-3","tags":[],"yw":"爲虛與實，若得若失。虛實之要，九針最妙，補瀉之時，以針爲之。瀉曰，必持內之，放而出之，排陽得針，邪氣得泄。按而引針，是謂內溫，血不得散，氣不得出也。補曰，隨之隨之，意若妄之。若行若按，如蚊虻止，如留如還，去如弦絕，令左屬右，其氣故止，外門已閉，中氣乃實，必無留血，急取誅之。持針之道，堅者爲寶。正指直刺，無針左右。神在秋毫，屬意病者。審視血脈者，刺之無殆。方刺之時，必在懸陽，及與兩衛。神屬勿去，知病存亡。","bh":"","notes":[],"pending":true},{"id":"ls01-4","tags":[],"yw":"血脈者在俞橫居，視之獨澄，切之獨堅。九針之名，各不同形。一曰鑱針，長一寸六分；二曰員針，長一寸六分；三曰提針，長三寸半；四曰鋒針，長一寸六分；五曰鈹針，長四寸，廣二分半；六曰員利針，長一寸六分；七曰毫針，長三寸六分；八曰長針，長七寸；九曰大針，長四寸。鑱針者，頭大末銳，去瀉陽氣；員針者，針如卵形，揩摩分間，不得傷肌肉者，以瀉分氣；提針者，鋒如黍粟之銳，主按脈勿陷，以致其氣；鋒針者，刃三隅以發痼疾，鈹針者，末如劍鋒，以取大膿；員利針者，大如釐，且員且銳，中身微大，以取暴氣；毫針者，尖如蚊虻喙，靜以徐往，微以久留之而養，以取痛痹；長針者，鋒利身薄，可以取遠痹；大針者，尖如梃，其鋒微員，以瀉機關之水也。","bh":"","notes":[],"pending":true},{"id":"ls01-5","tags":[],"yw":"九針畢矣。夫氣之在脈也，邪氣在上，濁氣在中，清氣在下。故針陷脈則邪氣出，針中脈則濁氣出，針太深則邪氣反沉、病益。故曰：皮肉筋脈，各有所處。病各有所宜。各不同形，各以任其所宜，無實無虛。損不足而益有餘，是謂甚病。病益甚，取五脈者死，取三脈者恇；奪陰者死，奪陽者狂，針害畢矣。刺之而氣不至，無問其數。刺之而氣至，乃去之，勿復針。針各有所宜，各不同形，各任其所，爲刺之要。氣至而有效，效之信，若風之吹雲，明乎若見蒼天，刺之道畢矣。","bh":"","notes":[],"pending":true},{"id":"ls01-6","tags":[],"yw":"黃帝曰：願聞五髒六腑所出之處。岐伯曰：五髒五俞，五五二十五俞，六腑六俞，六六三十六俞，經脈十二，絡脈十五，凡二十七氣，以上下。所出爲井，所溜爲滎，所注爲俞，所行爲經，所入爲合，二十七氣所行，皆在五俞也。節之交，三百六十五會，知其要者，一言而終，不知其要，流散無窮。所言節者，神氣之所遊行出入也。非皮肉筋骨也。觀其色，察其目，知其散復。一其形，聽其動靜，知其邪正，右主推之，左持而御之，氣至而去之。凡將用針，必先診脈，視氣之劇易，乃可以治也。","bh":"","notes":[],"pending":true},{"id":"ls01-7","tags":[],"yw":"五髒之氣，已絕於內，而用針者反實其外，是謂重竭。重竭必死，其死也靜。治之者輒反其氣，取腋與膺。五髒之氣，已絕於外，而用針者反實其內，是謂逆厥。逆厥則必死，其死也躁。治之者反取四末。刺之害中而不去，則精泄；害中而去，則致氣。精泄則病益甚而恇，致氣則生爲癰瘍。五髒有六腑，六腑有十二原，十二原出於四關，四關主治五髒。五髒有疾，當取之十二原。十二原者，五髒之所以稟三百六十五節氣味也。五髒有疾也，應出十二原。","bh":"","notes":[],"pending":true},{"id":"ls01-8","tags":[],"yw":"十二原各有所出。明知其原，睹其應，而知五髒之害矣。陽中之少陰，肺也，其原出於太淵，太淵二。陽中之太陽，心也，其原出於大陵，大陵二。陰中之少陽，肝也，其原出於太衝，太衝二。陰中之至陰，脾也，其原出於太白，太白二。陰中之太陰，腎也，其原出於太溪，太溪二。膏之原，出於鳩尾，鳩尾一。肓之原，出於脖胦，脖胦一。凡此十二原者，主治五髒六腑之有疾者也。脹取三陽，飧泄取三陰。稟今夫五髒之有疾也，譬猶刺也，猶污也，猶結也，猶閉也。","bh":"","notes":[],"pending":true},{"id":"ls01-9","tags":[],"yw":"刺雖久猶可拔也，污雖久猶可雪也，結雖久猶可解也，閉雖久猶可決也。或言久疾之不可取者，非其說也。夫善用針者，取其疾也，猶拔刺也，猶雪污也，猶解結也，猶決閉也。疾雖久，猶可畢也。言不可治者，未得其術也。刺諸熱者，如以手探湯；刺寒清者，如人不欲行。陰有陽疾者，取之下陵三裏，正往無殆，氣下乃止，不下復始也。疾高而內者，取之陰之陵泉；疾高而外者，取之陽之陵泉也。","bh":"","notes":[],"pending":true}]},
{"id":"ls02","book":"灵枢","no":2,"title":"本输","titleTw":"本輸","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls02-1","tags":[],"yw":"黃帝問於岐伯曰：凡刺之道，必通十二經絡之所終始，絡脈之所別處，五俞之所留，六腑之所與合，四時之所出入，五髒之所溜處，闊數之度，淺深之狀，高下所至。願聞其解。岐伯曰：請言其次也。肺出於少商，少商者，手大指端內側也，爲井木；溜於魚際，魚際者，手魚也，爲滎；注於太淵，太淵魚後一寸陷者中也，爲俞；行於經渠，經渠寸口中也，動而不居爲經；入於尺澤，尺澤肘中之動脈也，爲合。手太陰經也。心出於中衝，中衝，手中指之端也，爲井木；流於勞宮，勞宮掌中中指本節之內間也，爲滎；注於大陵，大陵掌後兩骨之間方下者也，爲俞；行於間使，間使之道，兩筋之間，三寸之中也，有過則至，無過則止，爲經；入於曲澤，曲澤，肘內廉下陷者之中也，屈而得之，爲合。","bh":"","notes":[],"pending":true},{"id":"ls02-2","tags":[],"yw":"手少陰也。肝出於大敦，大敦者，足大趾之端，及三毛之中也，爲井木；溜於行間，行間足大趾間也，爲滎；注於太衝，太衝行間上二寸陷者之中也，爲俞；行於中封，中封內踝之前一寸半，陷者之中，使逆則宛，使和則通，搖足而得之，爲經；入於曲泉，曲泉輔骨之下，大筋之上也，屈膝而得之，爲合。足厥陰也。脾出於隱白，隱白者，足大趾之端內側也，爲井木；溜於大都，大都本節之後下陷者之中也，爲滎；注於太白，太白腕骨之下也，爲俞；行於商丘，商丘內踝之下陷者之中也，爲經；入於陰之陵泉，陰之陵泉，輔骨之下陷者之中也，伸而得之，爲合。","bh":"","notes":[],"pending":true},{"id":"ls02-3","tags":[],"yw":"足太陰也。腎出於湧泉，湧泉者足心也，爲井木；溜於然谷，然谷，然骨之下者也，爲滎；注於太溪，太溪內踝之後跟骨之上陷中者也，爲俞；行於復溜，復溜，上內踝二寸，動而不休，爲經；入於陰谷，陰谷，輔骨之後，大筋之下，小筋之上也，按之應手，屈膝而得之，爲合。足少陰經也。膀胱出於至陰，至陰者，足小趾之端也，爲井金；溜於通谷，通谷，本節之前外側也，爲滎；注於束骨，束骨，本節之後陷者中也，爲俞；過於京骨，京骨，足外側大骨之下，爲原；行於昆侖，昆侖，在外踝之後，跟骨之上，爲經；入於委中，委中，膕中央，爲合，委而取之。","bh":"","notes":[],"pending":true},{"id":"ls02-4","tags":[],"yw":"足太陽也。膽出於竅陰，竅陰者，足小趾次趾之端也，爲井金；溜於俠溪，俠溪，足小趾次趾之間也，爲滎；注於臨泣，臨泣，上行一寸半，陷者中也，爲俞；過於丘墟，丘墟，外踝之前下陷者中也，爲原。行於陽輔，陽輔外踝之上輔骨之前及絕骨之端也，爲經；入於陽之陵泉，陽之陵泉，在膝外陷者中也，爲合，伸而得之。足少陽也。胃出於厲兌，厲兌者，足大趾內次趾之端也，爲井金；溜於內庭，內庭，次趾外間也，爲滎；注於陷谷，陷谷者，上中指內間上行二寸陷者中也，爲俞；過於衝陽，衝陽，足跗上五寸陷者中也，爲原，搖足而得之；行於解溪，解溪，上衝陽一寸半陷者中也，爲經；入於下陵，下陵，膝下三寸胻骨外三裏也，爲合；復下三裏三寸，爲巨虛上廉，復下上廉三寸，爲巨虛下廉也；大腸屬上，小腸屬下，足陽明胃脈也。","bh":"","notes":[],"pending":true},{"id":"ls02-5","tags":[],"yw":"大腸小腸，皆屬於胃，是足陽明也。三焦者，上合手少陽，出於關衝，關衝者，手小指次指之端也，爲井金；溜於液門，液門，小指次指之間也，爲滎；注於中渚，中渚，本節之後陷者中也，爲俞；過於陽池，陽池，在腕上陷者之中也，爲原；行於支溝，支溝，上腕三寸兩骨之間陷者中也，爲經；入於天井，天井，在肘外大骨之上陷者中也，爲合，屈肘而得之；三焦下腧在於足大趾之前，少陽之後，出於膕中外廉，名曰委陽，是太陽絡也，手少陽經也。","bh":"","notes":[],"pending":true},{"id":"ls02-6","tags":[],"yw":"三焦者，足少陽太陰之所將，太陽之別也，上踝五寸，別入貫腨腸，出於委陽，並太陽之正，入絡膀胱，約下焦，實則閉癃，虛則遺溺，遺溺則補之，閉癃則瀉之。手太陽小腸者，上合手太陽，出於少澤，少澤，小指之端也，爲井金；溜於前谷，前谷，在手外廉本節前陷者中也，爲滎；注於後溪，後溪者，在手外側本節之後也，爲俞；過於腕骨，腕骨，在手外側腕骨之前，爲原；行於陽谷，陽谷，在銳骨之下陷者中也，爲經；入於小海，小海，在肘內大骨之外，去端半寸，陷者中也，伸臂而得之，爲合。","bh":"","notes":[],"pending":true},{"id":"ls02-7","tags":[],"yw":"手太陽經也。大腸上合手陽明，出於商陽，商陽，大指次指之端也，爲井金；溜於本節之前二間，爲滎；注於本節之後三間，爲俞；過於合谷，合谷，在大指岐骨之間，爲原；行於陽溪，陽溪，在兩筋間陷者中也，爲經；入於曲池，在肘外輔骨陷者中，屈臂而得之，爲合。手陽明也。是謂五髒六腑之俞，五五二十五俞，六六三十六俞也。六腑皆出足之三陽，上合於手者也。缺盆之中，任脈也，名曰天突。一次，任脈側之動脈足陽明也，名曰人迎；二次脈，手陽明也，名曰扶突；三次脈，手太陽也，名曰天窗；四次脈，足少陽也，名曰天容；五次脈，手少陽也，名曰天牖；六次脈，足太陽也，名曰天柱；七次脈，頸中央之脈，督脈也，名曰風府。","bh":"","notes":[],"pending":true},{"id":"ls02-8","tags":[],"yw":"腋內動脈手太陰也，名曰天府。腋下三寸手心主也，名曰天池。刺上關者，呿不能欠。刺下關者，欠不能呿。刺犢鼻者，屈不能伸。刺兩關者，伸不能屈。足陽明，俠喉之動脈也，其俞在膺中。手陽明，次在其俞外，不至曲頰一寸。手太陽當曲頰。足少陽在耳下曲頰之後。手少陽出耳後上加完骨之上。足太陽俠項大筋之中，發際。陰尺動脈，在五裏，五俞之禁也。肺合大腸，大腸者，傳道之腑。心合小腸，小腸者，受盛之腑。肝合膽，膽者中精之腑。","bh":"","notes":[],"pending":true},{"id":"ls02-9","tags":[],"yw":"脾合胃，胃者五谷之腑。腎合膀胱，膀胱者津液之腑也。少陽屬腎，腎上連肺，故將兩髒。三焦者，中瀆之腑也，水道出焉，屬膀胱，是孤之腑也，是六腑之所與合者。春取絡脈諸滎大經分肉之間，甚者深取之，間者淺取之。夏取諸俞孫絡肌肉皮膚之上。秋取諸合，餘如春法。冬取諸井諸俞之分，欲深而留之。此四時之序，氣之所處，病之所舍，髒之所宜。轉筋者，立而取之，可令遂已。痿厥者，張而刺之，可令立快也。","bh":"","notes":[],"pending":true}]},
{"id":"ls03","book":"灵枢","no":3,"title":"小针解","titleTw":"小針解","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls03-1","tags":[],"yw":"所謂易陳者，易言也。難入者，難着於人也。粗守形者，守刺法也。上守神者，守人之血氣有餘不足可補瀉也。神客者，正邪共會也。神者，正氣也，客者邪氣也。在門者，邪循正氣之所出入也。未睹其疾者，先知邪正何經之疾也。惡知其原者，先知何經之病所取之處也。刺之微在數遲者，徐疾之意也。粗守關者，守四支而不知血氣正邪之往來也。上守機者，知守氣也。機之動不離其空中者，知氣之虛實，用針之徐疾也。空中之機，清靜以微者，針以得氣，密意守氣勿失也。","bh":"","notes":[],"pending":true},{"id":"ls03-2","tags":[],"yw":"其來不可逢者，氣盛不可補也。其往不可追者，氣虛不可瀉也。不可掛以發者，言氣易失也。扣之不發者，言不知補瀉之意也。血氣已盡而氣不下也。知其往來者，知氣之逆順盛虛也。要與之期者，知氣之可取之時也。粗之闇者，冥冥不知氣之微密也。妙哉！工獨有之者，盡知針意也。往者爲逆者，言氣之虛而小，小者逆也。來者爲順者，言形氣之平，平者順也。明知逆順正行無問者，言知所取之處也。迎而奪之者，瀉也；追而濟之者，補也。所謂虛則實之者，氣口虛而當補之也。","bh":"","notes":[],"pending":true},{"id":"ls03-3","tags":[],"yw":"滿則泄之者，氣口盛而當瀉之也。宛陳則除之者，去血脈也。邪勝則虛之者，言諸經有盛者，皆瀉其邪也。徐而疾則實者，言徐內而疾出也。疾而徐則虛者，言疾內而徐出也。言實與虛若有若無者，言實者有氣，虛者無氣也。察後與先若亡若存者，言氣之虛實，補瀉之先後也，察其氣之已下與常存也。爲虛爲實，若得若失者，言補者佖然若有得也，瀉則恍然若有失也。夫氣之在脈也，邪氣在上者，言邪氣之中人也高，故邪氣在上也。濁氣在中者，言水谷皆入於胃，其精氣上注於肺，濁溜於腸胃，言寒溫不適，飲食不節，而病生於腸胃，故命曰濁氣在中也。","bh":"","notes":[],"pending":true},{"id":"ls03-4","tags":[],"yw":"清氣在下者，言清溼地氣之中人也，必從足始，故曰清氣在下也。針陷脈，則邪氣出者取之上，針中脈則濁氣出者，取之陽明合也。針太深則邪氣反沉者，言淺浮之病，不欲深刺也。深則邪氣從之入，故曰反沉也。皮肉筋脈各有所處者，言經絡各有所主也。取五脈者死，言病在中氣不足，但用針盡大瀉其諸陰之脈也。取三陽之脈者，唯言盡瀉三陽之氣，令病人恇然不復也。奪陰者死，言取尺之五裏五往者也。奪陽者狂，正言也。睹其色，察其目，知其散復，一其形，聽其動靜者，言上工知相五色於目。","bh":"","notes":[],"pending":true},{"id":"ls03-5","tags":[],"yw":"有知調尺寸小大緩急滑澀以言所病也。知其邪正者，知論虛邪與正邪之風也。右主推之，左持而御之者，言持針而出入也。氣至而去之者，言補瀉氣調而去之也。調氣在於終始一者，持心也。節之交三百六十五會者，絡脈之滲灌諸節者也。所謂五髒之氣，已絕於內者，脈口氣內絕不至，反取其外之病處，與陽經之合，有留針以致陽氣，陽氣至則內重竭，重竭則死矣。其死也，無氣以動，故靜。所謂五髒之氣，已絕於外者，脈口氣外絕不至，反取其四末之輸，有留針以致其陰氣，陰氣至則陽氣反入，入則逆，逆則死矣。","bh":"","notes":[],"pending":true},{"id":"ls03-6","tags":[],"yw":"其死也，陰氣有餘，故躁。所以察其目者，五髒使五色循明。循明則聲章。聲章者，則言聲與平生異也。","bh":"","notes":[],"pending":true}]},
{"id":"ls04","book":"灵枢","no":4,"title":"邪气藏府病形","titleTw":"邪氣藏府病形","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls04-1","tags":[],"yw":"黃帝問於岐伯曰：邪氣之中人也奈何？岐伯答曰：邪氣之中人高也。黃帝曰：高下有度乎？岐伯曰：身半以上者，邪中之也。身半已下者，溼中之也。故曰：邪之中人也。無有常，中於陰則溜於腑，中於陽則溜於經。黃帝曰：陰之與陽也，異名同類，上下相會，經絡之相貫，如環無端。邪之中人，或中於陰，或中於陽，上下左右，無有恆常，其故何也？岐伯曰：諸陽之會，皆在於面。中人也，方乘虛時及新用力，若飲食汗出，腠理開而中於邪。中於面，則下陽明。","bh":"","notes":[],"pending":true},{"id":"ls04-2","tags":[],"yw":"中於項，則下太陽。中於頰，則下少陽。其中於膺背兩脅，亦中其經。黃帝曰：其中於陰，奈何？岐伯答曰：中於陰者，常從臂胻始。夫臂與胻，其陰皮薄，其肉淖澤，故俱受於風，獨傷其陰。黃帝曰：此故傷其藏乎？岐伯答曰：身之中於風也，不必動藏。故邪入於陰經，則其藏氣實，邪氣入而不能客，故還之於腑。故中陽則溜於經，中陰則溜於府。黃帝曰：邪之中人髒奈何？岐伯曰：愁憂恐懼則傷心。形寒寒飲則傷肺，以其兩寒相感，中外皆傷，故氣逆而上行。","bh":"","notes":[],"pending":true},{"id":"ls04-3","tags":[],"yw":"有所墮墜，惡血留內；若有所大怒，氣上而不下，積於脅下，則傷肝。有所擊僕，若醉入房，汗出當風，則傷脾。有所用力舉重，若入房過度，汗出浴水，則傷腎。黃帝曰：五髒之中風，奈何？岐伯曰：陰陽俱感，邪乃得往。黃帝曰：善哉。黃帝問於岐伯曰：首面與身形也，屬骨連筋，同血合於氣耳。天寒則裂地凌冰，其卒寒，或手足懈惰，然而其面不衣，何也？岐伯答曰：十二經脈，三百六十五絡，其血氣皆上於面而走空竅。其精陽氣上走於目而爲睛。","bh":"","notes":[],"pending":true},{"id":"ls04-4","tags":[],"yw":"其別氣走於耳而爲聽。其宗氣上出於鼻而爲臭。其濁氣出於胃，走脣舌而爲味。其氣之津液，皆上燻於面，而皮又厚，其肉堅，故天氣甚寒，不能勝之也。黃帝曰：邪之中人，其病形何如？岐伯曰：虛邪之中身也，灑淅動形。正邪之中人也，微，先見於色，不知於身，若有若無，若亡若存，有形無形，莫知其情。黃帝曰：善哉。黃帝問於岐伯曰：餘聞之，見其色，知其病，命曰明。按其脈，知其病，命曰神。問其病，知其處，命曰工。餘願聞見而知之，按而得之，問而極之，爲之奈何？岐伯答曰：夫色脈與尺之相應也，如桴鼓影響之相應也，不得相失也，此亦本末根葉之出候也，故根死則葉枯矣。","bh":"","notes":[],"pending":true},{"id":"ls04-5","tags":[],"yw":"色脈形肉，不得相失也。故知一則爲工，知二則爲神，知三則神且明矣。黃帝曰：願卒聞之。岐伯答曰：色青者，其脈弦也，赤者，其脈鉤也，黃者，其脈代也，白者，其脈毛，黑者，其脈石。見其色而不得其脈，反得其相勝之脈，則死矣；得其相生之脈，則病已矣。黃帝問於岐伯曰：五髒之所生，變化之病形何如？岐伯答曰：先定其五色五脈之應，其病乃可別也。黃帝曰：色脈已定，別之奈何？岐伯說：調其脈之緩、急、小、大、滑、澀，而病變定矣。","bh":"","notes":[],"pending":true},{"id":"ls04-6","tags":[],"yw":"黃帝曰：調之奈何？岐伯答曰：脈急者，尺之皮膚亦急；脈緩者，尺之膚亦緩；脈小者，尺之皮膚亦減而少氣；脈大者，尺之皮膚亦賁而起；脈滑者，尺之皮膚亦滑；脈澀者，尺之皮膚亦澀。凡此變者，有微有甚。故善調尺者，不待於寸，善調脈者，不待於色。能參合而行之者，可以爲上工，上工十全九。行二者，爲中工，中工十全七。行一者，爲下工，下工十全六。黃帝曰：請問脈之緩、急，小、大，滑、澀之病形何如？岐伯曰：臣請言五藏之病變也。","bh":"","notes":[],"pending":true},{"id":"ls04-7","tags":[],"yw":"心脈急甚者爲瘈瘲；徵急，爲心痛引背，食不下。緩甚，爲狂笑；微緩，爲伏梁，在心下，上下行，時唾血。大甚，爲喉吤；微大，爲心痹引背，善淚出。小甚爲善噦；微小爲消病。滑甚爲善渴；微滑爲心疝，引臍，小腹鳴。澀爲爲瘖；微澀爲血溢，維厥耳鳴，顛疾。肺脈急甚，爲癲疾；微急，爲肺寒熱，怠惰，咳唾血，引腰背胸，若鼻息肉不通。緩甚，爲多汗；微緩，爲痿瘻，偏風，頭以下汗出不可止。大甚，爲脛腫；微大，爲肺痹，引胸背，起惡見日光。","bh":"","notes":[],"pending":true},{"id":"ls04-8","tags":[],"yw":"小甚，爲泄；微小，爲消痹。滑甚，爲息賁上氣；微滑，爲上下出血。澀甚，爲嘔血；微澀，爲鼠瘻，在頸支腋之間，下不勝其上，其應善酸矣。肝脈急甚者爲惡言；微急爲肥氣在脅下，若復杯。緩甚爲善嘔，微緩爲水瘕痹也。大甚爲內癰，善嘔衄；微大爲肝痹，陰縮，咳引小腹。小甚爲多飲；微小爲消癉。滑甚爲疝；微滑爲遺溺。澀甚爲溢飲；微澀爲瘈攣筋痹。脾脈急甚爲瘈瘲；微急爲膈中，食飲入而還出，後沃沫。緩甚爲痿厥；微緩爲風痿，四肢不用，心慧然若無病。","bh":"","notes":[],"pending":true},{"id":"ls04-9","tags":[],"yw":"大甚爲擊僕；微大爲疝氣，腹裏大膿血在腸胃之外。小甚爲寒熱；微小爲消癉。滑甚爲癃；微滑爲蟲毒蛕蠍腹熱。澀甚爲腸；微澀爲內，多下膿血。腎脈急甚爲骨癲疾；微急爲沉厥奔豚，足不收，不得前後。緩甚爲折脊；微緩爲洞，洞者，食不化，下嗌逐出。大甚爲陰痿；微大爲石水，起臍已下至小腹睡睡然，上至胃脘，死不治。小甚爲洞泄；微小爲消癉。滑甚爲癃；微滑爲骨痿，坐不能起，起則目無所見。澀甚爲大癰；微澀爲不月，沉痔。黃帝曰：病之六變者，刺之奈何？岐伯曰：諸急者多寒；緩者多熱；大者多氣少血；小者血氣皆少；滑者陽氣盛，微有熱；澀者多血、少氣，微有寒。","bh":"","notes":[],"pending":true},{"id":"ls04-10","tags":[],"yw":"是故刺急者，深內而久留之；刺緩者，淺內而疾發針，以去其熱；刺大者，微瀉其氣，無出其血；刺滑者，疾發針而淺內之，以瀉其陽氣而去其熱；刺澀者，必中其脈，隨其逆順而久留之，必先按而循之，已發針，已按其疝，無令其血出，以和其脈；諸小者，陰陽形氣俱不足，勿取以針而調以甘藥也。黃帝曰：餘聞五髒六府之氣，滎、俞所入爲合，令何道從入，入安連過，願聞其故。岐伯答曰：此陽脈之別入於內，屬於府者也。黃帝曰：滎俞與合，各有名乎？岐伯曰：滎俞治外經，合治內府。","bh":"","notes":[],"pending":true},{"id":"ls04-11","tags":[],"yw":"黃帝曰：治內府奈何？岐伯曰：取之於合。黃帝曰：合各有名乎？岐伯答曰：胃合於三裏，大腸合入於巨虛上廉，小腸合入於巨虛下廉，三焦合入於委陽，膀胱合入於委中央，膽合入於陽陵泉。黃帝曰：取之奈何？岐伯答曰：取之三裏者，低跗取之；巨虛者，舉足取之；委陽者，屈伸而索之；委中者，屈而取之；陽陵泉者，正豎膝予之齊下，至委陽之陽取之；取諸外經者，揄申而從之。黃帝曰：願聞六府之病。岐伯答曰：面熱者足陽明病，魚絡血者手陽明病，兩跗之上脈豎陷者，足陽明病，此胃脈也。","bh":"","notes":[],"pending":true},{"id":"ls04-12","tags":[],"yw":"大腸病者，腸中切痛，而鳴濯濯。冬日重感於寒即泄，當臍而痛，不能久立，與胃同候，取巨虛上廉。胃病者，腹脹，胃脘當心而痛，上肢兩脅，膈咽不通，食飲不下，取之三裏也。小腸病者，小腹痛，腰脊控睪而痛，時窘之後，當耳前熱，若寒甚，若獨肩上熱甚，及手小指次指之間熱，若脈陷者，此其候也。手太陽病也，取之巨虛下廉。三焦病者，腹氣滿，小腹尤堅，不得小便，窘急，溢則水留，即爲脹。候在足太陽之外大絡，大絡在太陽少陽之間，亦見於脈，取委陽。","bh":"","notes":[],"pending":true},{"id":"ls04-13","tags":[],"yw":"膀胱病者，小腹偏腫而痛，以手按之，即欲小便而不得，肩上熱，若脈陷，及足小趾外廉及脛踝後皆熱，若脈陷，取委中央。膽病者，善太息，口苦，嘔宿汁，心下淡淡，恐人將捕之，嗌中吤吤然數唾。在足少陽之本末，亦視其脈之陷下者灸之；其寒熱者取陽陵泉。黃帝曰：刺之有道乎？岐伯答曰：刺此者，必中氣穴，無中肉節。中氣穴，則針遊於巷；中肉節，即皮膚痛；補瀉反，則病益篤。中筋則筋緩，邪氣不出，與其真相搏亂而不去，反還內着。","bh":"","notes":[],"pending":true},{"id":"ls04-14","tags":[],"yw":"用針不審，以順爲逆也。","bh":"","notes":[],"pending":true}]},
{"id":"ls05","book":"灵枢","no":5,"title":"根结","titleTw":"根結","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls05-1","tags":[],"yw":"岐伯曰：天地相感，寒暖相移，陰陽之道，孰少孰多，陰道偶，陽道奇。發於春夏，陰氣少，陽氣多，陰陽不調，何補何瀉。發於秋冬，陽氣少，陰氣多；陰氣盛而陽氣衰，故莖葉枯槁，溼雨下歸，陰陽相移，何瀉何補。奇邪離經，不可勝數，不知根結，五髒六腑，折關敗樞，開合而走，陰陽大失，不可復取。九針之玄，要在終始；故能知終始，一言而畢，不知終始，針道鹹絕。太陽根於至陰，結於命門。命門者，目也。陽明根於厲兌，結於顙大。顙大者，鉗耳也。","bh":"","notes":[],"pending":true},{"id":"ls05-2","tags":[],"yw":"少陽根於竅陰，結於窗籠。窗籠者，耳中也。太陽爲開，陽明爲合，少陽爲樞，故開折，則肉節瀆而暴病起矣。故暴病者，取之太陽，視有餘不足。瀆者，皮肉宛膲而弱也。合折，則氣無所止息而痿疾起矣。故痿疾者，取之陽明，視有餘不足。無所止息者，真氣稽留，邪氣居之也。樞折，即骨繇而不安於地。故骨繇者，取之少陽，視有餘不足。骨繇者，節緩而不收也。所謂骨繇者，搖故也。當竊其本也。太陰根於隱白，結於太倉。少陰根於湧泉，結於廉泉。","bh":"","notes":[],"pending":true},{"id":"ls05-3","tags":[],"yw":"厥陰根於大敦，結於玉英，絡於羶中。太陰爲合，少陽爲樞。故開折，則倉廩無所輸，膈洞。膈洞者，取之太陰，視有餘不足，故開折者，氣不足而生病也。合折，即氣絕而喜悲。悲者取之厥陰，視有餘不足。樞折，則脈有所結而不通。不通者，取之少陰，視有餘不足，有結者，皆取之不足。足太陽根於至陰，溜於京骨，注於昆侖，入於天柱、飛揚也。足少陽根於竅陰，溜於丘墟，注於陽輔，入於天容、光明也。足陽明根於厲兌，溜於衝陽，注於下陵，入於人迎，豐隆也。","bh":"","notes":[],"pending":true},{"id":"ls05-4","tags":[],"yw":"手太陽根於少澤，溜於陽谷，注於小海，入於天窗，支正也。少陽根於關衝，溜於陽池，注於支溝，入於天牖、外關也。手陽明根於商陽，溜於合谷，注於陽溪，入於扶突、偏歷也。此所謂十二經者，盛絡皆當取之。一日一夜五十營，以營五髒之精，不應數者，名曰狂生。所謂五十營者，五髒皆受氣，持其脈口，數其至也。五十動而不一代者，五髒皆受氣。四十動一代者，一髒無氣。三十動一代者，二髒無氣。二十動一代者，三髒無氣。十動一代者，四髒無氣。","bh":"","notes":[],"pending":true},{"id":"ls05-5","tags":[],"yw":"不滿十動一代者，五髒無氣。予之短期，要在終始。所謂五十動而不一代者，以爲常也。以知五髒之期，予之短期者，乍數乍疏也。黃帝曰：逆順五體者，言人骨節之大小，肉之堅脆，皮之厚薄，血之清濁，氣之滑澀，脈之長短，血之多少，經絡之數，餘已知之矣，此皆布衣匹夫之士也。夫王公大人，血食之君，身體柔脆，肌肉軟弱，血氣慓悍滑利，其刺之徐疾淺深多少，可得同之乎。岐伯答曰：膏梁菽藿之味，何可同也？氣滑即出疾，其氣澀則出遲，氣悍則針小而入淺，氣澀則針大而入深，深則欲留，淺則欲疾。","bh":"","notes":[],"pending":true},{"id":"ls05-6","tags":[],"yw":"以此觀之，刺布衣者，深以留之，刺大人者，微以徐之，此皆因氣慓悍滑利也。黃帝曰：形氣之逆順奈何？岐伯曰：形氣不足，病氣有餘，是邪勝也，急瀉之；形氣有餘，病氣不足，急補之；形氣不足，病氣不足，此陰陽氣俱不足也，不可刺之，刺之則重不足。重不足則陰陽俱竭，血氣皆盡，五髒空虛，筋骨髓枯，老者絕滅，壯者不復矣。形氣有餘，病氣有餘，此謂陰陽俱有餘也。急瀉其邪，調其虛實。故曰：有餘者瀉之，不足者補之，此之謂也。故曰：刺不知逆順，真邪相搏。","bh":"","notes":[],"pending":true},{"id":"ls05-7","tags":[],"yw":"滿而補之，則陰陽四溢，腸胃充郭，肝肺內，陰陽相錯。虛而瀉之，則經脈空虛，血氣竭枯，腸胃辟，皮膚薄着，毛腠夭膲，予之死期。故曰：用針之要，在於知調陰與陽。調陰與陽，精氣乃光，合形與氣，使神內藏。故曰：上工平氣，中工亂脈，下工絕氣危生。故曰：下工不可不慎也，必審五藏變化之病，五脈之應，經絡之實虛，皮之柔麤，而後取之也。","bh":"","notes":[],"pending":true}]},
{"id":"ls06","book":"灵枢","no":6,"title":"寿夭刚柔","titleTw":"壽夭剛柔","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls06-1","tags":[],"yw":"黃帝問於少師曰：餘聞人之生也，有剛有柔，有弱有強，有短有長，有陰有陽，願聞其方。少師答曰：陰中有陰，陽中有陽，審知陰陽，刺之有方。得病所始，刺之有理。謹度病端，與時相應。內合於五髒六腑，外合於筋骨皮膚。是故內有陰陽，外亦有陰陽。在內者，五髒爲陰，六腑爲陽，在外者，筋骨爲陰，皮膚爲陽。故曰，病在陰之陰者，刺陰之滎俞，病在陽之陽者，刺陽之合，病在陽之陰者，刺陰之經，病在陰之陽者，刺絡脈。故曰，病在陽者名曰風，病在陰者名曰痹，陰陽俱病名曰風痹。","bh":"","notes":[],"pending":true},{"id":"ls06-2","tags":[],"yw":"病有形而不痛者，陽之類也；無形而痛者，陰之類也。無形而痛者，其陽完而陰傷之也。急治其陰，無攻其陽。有形而不痛者，其陰完而陽傷之也。急治其陽，無攻其陰。陰陽俱動，乍有形，乍無形，加以煩心，命曰陰勝其陽。此謂不表不裏，其形不久。黃帝問於伯高曰：餘聞形氣之病先後，外內之應奈何？伯高答曰：風寒傷形，憂恐忿怒傷氣；氣傷髒，乃病髒，寒傷形，乃應形；風傷筋脈，筋脈乃應。此形氣外內之相應也。黃帝曰：刺之奈何？伯高答曰：病九日者，三刺而已；病一月者，十刺而已；多少遠近，以此衰之。","bh":"","notes":[],"pending":true},{"id":"ls06-3","tags":[],"yw":"久痹不去身者，視其血絡，盡出其血。黃帝曰：外內之病，難易之治奈何？伯高答曰：形先病而未入髒者，刺之半其日。髒先病而形乃應者，刺之倍其日。此月內難易之應也。黃帝問於伯高曰：餘聞形有緩急，氣有盛衰，骨有大小，肉有堅脆，皮有厚薄，其以立壽夭奈何？伯高答曰：形與氣相任則壽，不相任則夭。皮與肉相果則壽，不相果則夭，血氣經絡勝形則壽，不勝形則夭。黃帝曰：何謂形之緩急？伯高答曰：形充而皮膚緩者則壽，形充而皮膚急者則夭，形充而脈堅大者順也，形充而脈小以弱者氣衰，衰則危矣。","bh":"","notes":[],"pending":true},{"id":"ls06-4","tags":[],"yw":"若形充而顴不起者骨小，骨小則夭矣。形充而大肉胭堅而有分者肉堅，肉堅則壽矣；形充而大肉無分理不堅者肉脆，肉脆則夭矣。此天之生命，所以立形定氣而視壽夭者，必明乎此立形定氣，而後以臨病人，決生死。黃帝曰：餘聞壽夭，無以度之。伯高答曰：牆基卑，高不及其地者，不滿三十而死。其有因加疾者，不及二十而死也。黃帝曰：形氣之相勝，以立壽夭奈何？伯高答曰：平人而氣勝形者壽；病而形肉脫，氣勝形者死，形勝氣者危矣。黃帝曰：餘聞刺有三變，何謂三變？伯高答曰：有刺營者，有刺衛者，有刺寒痹之留經者。","bh":"","notes":[],"pending":true},{"id":"ls06-5","tags":[],"yw":"黃帝曰：刺三變者奈何？伯高答曰：刺營者出血，刺衛者出氣，刺寒痹者內熱。黃帝曰：營衛寒痹之爲病奈何？伯高答曰：營之生病也，寒熱少氣，血上下行。衛之生病也，氣痛時來時去，怫愾賁響，風寒客於腸胃之中。寒痹之爲病也，留而不去，時痛而皮不仁。黃帝曰：刺寒痹內熱奈何？伯高答曰：刺布衣者，以火焠之；刺大人者，以藥熨之。黃帝曰：藥熨奈何？伯高答曰：用淳酒二十斤，蜀椒一斤，干姜一斤，桂心一斤，凡四種，皆嚼咀，漬酒中，用綿絮一斤，細白布四丈，並內酒中，置酒馬矢熅中，封塗封，勿使泄。","bh":"","notes":[],"pending":true},{"id":"ls06-6","tags":[],"yw":"五日五夜，出綿絮曝干之，干復潰，以盡其汁。每漬必晬其日，乃出干。干，並用滓與綿絮，復布爲復巾，長六七尺，爲六七巾，則用之生桑炭炙巾，以熨寒痹所刺之處，令熱入至於病所，寒復炙巾以熨之，三十遍而止。汗出以巾拭身，亦三十遍而止。起步內中，無見風。每刺必熨，如此病已矣。","bh":"","notes":[],"pending":true}]},
{"id":"ls07","book":"灵枢","no":7,"title":"官针","titleTw":"官針","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls07-1","tags":[],"yw":"凡刺之要，官針最妙。九針之宜，各有所爲，長、短、大、小，各有所施也。不得其用，病弗能移。疾淺針深，內傷良肉，皮膚爲癰；病深針淺，病氣不瀉，支爲大膿。病小針大，氣瀉太甚，疾必爲害；病大針小，氣不泄瀉，亦復爲敗。失針之宜。大者瀉，小者不移。已言其過，請言其所施。病在皮膚無常處者，取以鑱針於病所，膚白勿取。病在分肉間，取以圓針於病所。病在經絡痼痹者，取以鋒針。病在脈，氣少，當補之者，取以鍉針於井滎分俞。","bh":"","notes":[],"pending":true},{"id":"ls07-2","tags":[],"yw":"病爲大膿者，取以鈹針。病痹氣暴發者，取以圓利針。病痹氣痛而不去者，取以毫針。病在中者，取以長針。病水腫不能通關節者，取以大針。病在五髒固居者，取以鋒針，瀉於井滎分俞，取以四時。凡刺有九，以應九變。一曰俞刺，俞刺者，刺諸經滎俞髒俞也；二曰遠道刺，遠道刺者，病在上，取之下，刺腑俞也；三曰經刺，經刺者，刺大經之結絡經分也；四曰絡刺，絡刺者，刺小絡之血脈也；五曰分刺，分刺者，刺分肉之間也；六曰大瀉刺，大瀉刺者，刺大膿以鈹針也；七曰毛刺，毛刺者，刺浮痹皮膚也；八曰巨刺，巨刺者，左取右，右取左；九曰焠刺，焠刺者，刺燔針則取痹也。","bh":"","notes":[],"pending":true},{"id":"ls07-3","tags":[],"yw":"凡刺有十二節，以應十二經。一曰偶刺，偶刺者，以手直心若背，直痛所，一刺前，一刺後，以治心痹。刺此者，傍針之也。二曰報刺，報刺者，刺痛無常處也。上下行者，直內無拔針，以左手隨病所按之，乃出針，復刺之也。三曰恢刺，恢刺者，直刺傍之，舉之前後，恢筋急，以治筋痹也。四曰齊刺，齊刺者，直入一，傍入二，以治寒氣小深者；或曰三刺，三刺者，治痹氣小深者也。五曰揚刺，揚刺者，正內一，傍內四，而浮之，以治寒氣之搏大者也。","bh":"","notes":[],"pending":true},{"id":"ls07-4","tags":[],"yw":"六曰直針刺，直針刺者，引皮乃刺之，以治寒氣之淺者也。七曰輸針，輸刺者，直入直出，稀發針而深之，以治氣盛而熱者也。八曰短刺，短刺者，刺骨痹，稍搖而深之，致針骨所，以上下摩骨也。九曰浮刺，浮刺者，傍入而浮之，以治肌急而寒者也。十曰陰刺，陰刺者，左右率刺之，以治寒厥；中寒厥，足踝後少陰也。十一曰傍針刺，傍針刺者，直刺傍刺各一，以治留痹久居者也。十二曰贊刺，贊刺者，直入直出，數發針而淺之，出血是謂治癰腫也。","bh":"","notes":[],"pending":true},{"id":"ls07-5","tags":[],"yw":"脈之所居，深不見者，刺之微內針而久留之，以致其空脈氣也。脈淺者，勿刺，按絕其脈乃刺之，無令精出，獨出其邪氣耳。所謂三刺，則谷氣出者。先淺刺絕皮，以出陽邪，再刺則陰邪出者，少益深絕皮，致肌肉，未入分肉間也；已入分肉之間，則谷氣出。故刺法曰：始刺淺之，以逐邪氣，而來血氣，後刺深之，以致陰氣之邪，最後刺極深之，以下谷氣。此之謂也。故用針者，不知年之所加，氣之盛衰，虛實之所起，不可以爲工也。凡刺有五，以應五髒，一曰半刺，半刺者，淺內而疾發針，無針傷肉，如拔毛狀，以取皮氣，此肺之應也。","bh":"","notes":[],"pending":true},{"id":"ls07-6","tags":[],"yw":"二曰豹文刺，豹文刺者，左右前後針之，中脈爲故，以取經絡之血者，此心之應也。三曰關刺，關刺者，直刺左右盡筋上，以取筋痹，慎無出血，此肝之應也；或曰淵刺；一曰豈刺。四曰合谷刺，合谷刺者，左右雞足，針於分肉之間，以取肌痹，此脾之應也。五曰輸刺，輸刺者，直入直出，深內之至骨，以取骨痹，此腎之應也。","bh":"","notes":[],"pending":true}]},
{"id":"ls09","book":"灵枢","no":9,"title":"终始","titleTw":"終始","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls09-1","tags":[],"yw":"凡刺之道，畢於終始，明知終始，五髒爲紀，陰陽定矣。陰者主髒，陽者主腑，陽受氣於四末，陰受氣於五髒，故瀉者迎之，補者隨之，知迎知隨，氣可令和，和氣之方，必通陰陽。五髒爲陰，六腑爲陽，傳之後世，以血爲盟。敬之者昌，慢之者亡。無道行私，必得夭殃。謹奉天道，請言終始。終始者，經脈爲紀。持其脈口人迎，以知陰陽有餘不足，平與不平，天道畢矣。所謂平人者不病，不病者，脈口人迎應四時也，上下相應而俱往來也，六經之脈不結動也，本末之寒溫之相守司也。","bh":"","notes":[],"pending":true},{"id":"ls09-2","tags":[],"yw":"形肉血氣必相稱也，是謂平人。少氣者，脈口人迎俱少，而不稱尺寸也。如是者，則陰陽俱不足，補陽則陰竭，瀉陰則陽脫。如是者，可將以甘藥，不可飲以至劑，如此者弗灸。不巳者因而瀉之，則五髒氣壞矣。人迎一盛，病在足少陽，一盛而躁，病在手少陽。人迎二盛，病在足太陽，二盛而躁，病在手太陽，人迎三盛，病在足陽明，三盛而躁，病在手陽明。人迎四盛，且大且數，名曰溢陽，溢陽爲外格。脈口一盛，病在足厥陰；厥陰一盛而躁，在手心主。","bh":"","notes":[],"pending":true},{"id":"ls09-3","tags":[],"yw":"脈口二盛，病在足少陰；二盛而躁，在手少陰。脈口三盛，病在足太陰；三盛而躁，在手太陰。脈口四盛，且大且數者，名曰溢陰。溢陰爲內關，內關不通，死不治。人迎與太陰脈口俱盛四倍以上，名曰關格。關格者，與之短期。人迎一盛，瀉足少陽而補足厥陰，二瀉一補，日一取之，必切而驗之，疏取之，上氣和乃止。人迎二盛，瀉足太陽補足少陰，二瀉一補，二日一取之，必切而驗之，疏取之，上氣和乃止。人迎三盛，瀉足陽明而補足太陰，二瀉一補，日二取之，必切而驗之，疏取之，上氣和乃止。","bh":"","notes":[],"pending":true},{"id":"ls09-4","tags":[],"yw":"脈口一盛，瀉足厥陰而補足少陽，二補一瀉，日一取之，必切而驗之，疏而取，上氣和乃止。脈口二盛，瀉足少陰而補足太陽，二補一瀉，二日一取之，必切而驗之，疏取之，上氣和乃止。脈口三盛，瀉足太陰而補足陽明，二補一瀉，日二取之，必切而驗之，疏而取之，上氣和乃止。所以日二取之者，太、陽主胃，大富於谷氣，故可日二取之也。人迎與脈口俱盛三倍以上，命曰陰陽俱溢，如是者不開，則血脈閉塞，氣無所行，流淫於中，五髒內傷。如此者，因而灸之，則變易而爲他病矣。","bh":"","notes":[],"pending":true},{"id":"ls09-5","tags":[],"yw":"凡刺之道，氣調而止，補陰瀉陽，音氣益彰，耳目聰明。反此者，血氣不行。所謂氣至而有效者，瀉則益虛，虛者，脈大如其故而不堅也；堅如其故者，適雖言故，病未去也。補則益實，實者，脈大如其故而益堅也；夫如其故而不堅者，適雖言快，病未去也。故補則實、瀉則虛，痛雖不隨針，病必衰去。必先通十二經脈之所生病，而後可得傳於終始矣。故陰陽不相移，虛實不相傾，取之其經。凡刺之屬，三刺至谷氣，邪僻妄合，陰陽易居，逆順相反，沉浮異處，四時不得，稽留淫泆須針而去。","bh":"","notes":[],"pending":true},{"id":"ls09-6","tags":[],"yw":"故一刺則陽邪出，再刺則陰邪出，三刺則谷氣至，谷氣至而止。所謂谷氣至者，已補而實，已瀉而虛，故以知谷氣至也。邪氣獨去者，陰與陽未能調而病知愈也。故曰：補則實，瀉則虛，痛雖不隨針，病必衰去矣。陰盛而陽虛，先補其陽，後瀉其陰而和之。陰虛而陽盛，先補其陰，後瀉其陽而和之。三脈動於足大趾之間，必審其實虛，虛而瀉之，是謂重虛。重虛病益甚。凡刺此者，以指按之，脈動而實且疾者疾瀉之，虛而徐者則補之。反此者，病益甚。","bh":"","notes":[],"pending":true},{"id":"ls09-7","tags":[],"yw":"其動也，陽明在上，厥陰在中，少陰在下。膺俞中膺，背俞中背，肩膊虛者，取之上。重舌，刺舌柱以鈹針也。手屈而不伸者，其病在筋，伸而不屈者，其病在骨，在骨守骨，在筋守筋。補須一方實，深取之，稀按其痏，以極出其邪氣。一方虛，淺刺之，以養其脈，疾按其痏，無使邪氣得入。邪氣來也緊而疾，谷氣來也徐而和。脈實者深刺之，以泄其氣；脈虛者，淺刺之，使精氣無瀉出，以養其脈，獨出其邪氣。刺諸痛者，其脈皆實。故曰：從腰以上者，手太陰陽明皆主之；從腰以下者，足太陰陽明皆主之。","bh":"","notes":[],"pending":true},{"id":"ls09-8","tags":[],"yw":"病在上者下取之；病在下者高取之；病在頭者取之足；病在腰者取之膕。病生於頭者，頭重；生於手者，臂重；生於足者，足重。治病者，先刺其病所從生者也。春氣在毛，夏氣在皮膚，秋氣在分肉，冬氣在筋骨。刺此病者，各以其時爲齊。故刺肥人者，以秋冬之齊，刺瘦人者，以春夏之齊。病痛者，陰也，痛而以手按之不得者，陰也，深刺之。病在上者，陽也。病在下者，陰也。癢者，陽也，淺刺之。病先起陰者，先治其陰，而後治其陽；病先起陽者，先治其陽，而後治其陰。","bh":"","notes":[],"pending":true},{"id":"ls09-9","tags":[],"yw":"刺熱厥者，留針反爲寒；刺寒厥者，留針反爲熱。刺熱厥者，二陰一陽；刺寒厥者，二陽一陰。所謂二陰者，二刺陰也；一陽者，一刺陽也。久病者，邪氣入深。刺此病者，深內而久留之，間日而復刺之，必先調其左右，去其血脈，刺道畢矣。凡刺之法，必察其形氣。形肉未脫，少氣而脈又躁，躁厥者，必爲繆刺之，散氣可收，聚氣可布。深居靜處，佔神往來，閉戶塞牖，魂魄不散，專意一神，精氣之分，毋聞人聲，以收其精，必一其神，令志在針。","bh":"","notes":[],"pending":true},{"id":"ls09-10","tags":[],"yw":"淺而留之，微而浮之，以移其神，氣至乃休。男內女外，堅拒勿出，謹守勿內，是謂得氣。凡刺之禁：新內勿刺，新刺勿內；已醉勿刺，已刺勿醉；新怒勿刺，已刺勿怒；新勞勿刺，已刺勿勞；已飽勿刺，已刺勿飽；已飢勿刺，已刺勿飢；已渴勿刺，已刺勿渴；大驚大恐，必定其氣乃刺之。乘車來者，臥而休之，如食頃乃刺之。出行來者，坐而休之，如行千裏頃乃刺之。凡此十二禁者，其脈亂氣散，逆其營衛，經氣不次，因而刺之，則陽病入於陰，陰病出爲陽，則邪氣復生。","bh":"","notes":[],"pending":true},{"id":"ls09-11","tags":[],"yw":"粗工勿察，是謂伐身，形體淫亂，乃消腦髓，津液不化，脫其五味，是謂失氣也。太陽之脈，其終也。戴眼，反折，瘈瘲，其色白，絕皮乃絕汗，絕汗則終矣。少陽終者，耳聾，百節盡縱，目系絕，目系絕，一日半則死矣。其死也，色青白，乃死。陽明終者，口目動作，喜驚、妄言、色黃；其上下之經盛而不行，則終矣。少陰終者，面黑，齒長而垢，腹脹閉塞，上下不通而終矣。厥陰終者，中熱溢干，喜溺，心煩，甚則舌卷，卵上縮而終矣。太陰終者，腹脹閉，不得息，氣噫，善嘔，嘔則逆，逆則面赤，不逆則上下不通，上下不通則面黑，皮毛憔而終矣。","bh":"","notes":[],"pending":true}]},
{"id":"ls11","book":"灵枢","no":11,"title":"经别","titleTw":"經別","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls11-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞人之合於天地道也，內有五髒，以應五音、五色、五時、五味、五位也；外有六腑，以應六律。六律建陰陽諸經而合之十二月、十二辰、十二節、十二經水、十二時、十二經脈者，此五髒六腑之所以應天道。夫十二經脈者，人之所以生，病之所以成，人之所以治，病之所以起，學之所始，工之所止也。粗之所易，上之所難也。請問其離合，出入奈何？岐伯稽首再拜曰：明乎哉問也！此粗之所過，上之所息也，請卒言之。足太陽之正，別入於膕中，其一道下尻五寸，別入於肛，屬於膀胱，散之腎，循膂，當心入散；直者，從膂上出於項，復屬於太陽，此爲一經也。","bh":"","notes":[],"pending":true},{"id":"ls11-2","tags":[],"yw":"足少陰之正，至膕中，別走太陽而合，上至腎，當十四椎出屬帶脈；直者，系舌本，復出於項，合於太陽，此爲一合。成以諸陰之別，皆爲正也。足少陽之正，繞髀入毛際，合於厥陰，別者入季脅之間，循胸裏屬膽，散之上肝，貫心以上挾咽，出頤頜中，散於面，系目系，合少陽於外眥也。足厥陰之正，別跗上，上至毛際，合於少陽，與別俱行，此爲二合也。足陽明之正，上至脾，入於腹裏屬胃，散之脾，上通於心，上循咽出於口，上頞，還系目系，合於陽明也。","bh":"","notes":[],"pending":true},{"id":"ls11-3","tags":[],"yw":"足太陰之正，上至髀，合於陽明，與別俱行，上結於咽，貫舌中，此爲三合也。手太陽之正，指地，別於肩解，入腋走心，系小腸也。手少陰之正，別入於淵腋兩筋之間，屬於心，上走喉嚨，出於面，合目內眥，此爲四合也。手少陽之正，指天，別於巔，入缺盆，下走三焦，散於胸中也。手心主之正，別下淵腋三寸，入胸中，別屬三焦，出循喉嚨，出耳後，合少陽完骨之下，此爲五合也。手陽明之正，從手循膺乳，別於肩髃，入柱骨，下走大腸，屬於肺，上循喉嚨，出缺盆，合於陽明也。","bh":"","notes":[],"pending":true},{"id":"ls11-4","tags":[],"yw":"手太陰之正，別入淵腋少陰之前，入走肺，散之大陽（腸），上出缺盆，循喉嚨，復合陽明，此六合也。","bh":"","notes":[],"pending":true}]},
{"id":"ls12","book":"灵枢","no":12,"title":"经水","titleTw":"經水","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls12-1","tags":[],"yw":"黃帝問於岐伯曰：經脈十二者，外合於十二經水，而內屬於五髒六腑。夫十二經水者，其有大小、深淺、廣狹、遠近各不同；五髒六腑之高下、大小、受谷之多少亦不等，相應奈何？夫經水者，受水而行之；五髒者，合神氣魂魄而藏之；六腑者，受谷而行之，受氣而揚之；經脈者，受血而營之。合而以治，奈何？刺之深淺，灸之壯數，可得聞乎？岐伯答曰：善哉問也！天至高不可度，地至廣不可量，此之謂也。且夫人生於天地之間，六合之內，此天之高，地之廣也，非人力之所能度量而至也。","bh":"","notes":[],"pending":true},{"id":"ls12-2","tags":[],"yw":"若夫八尺之士，皮肉在此，外可度量切循而得之，其死可解剖而視之。其藏之堅脆，腑之大小，谷之多少，脈之長短，血之清濁，氣之多少，十二經之多血少氣，與其少血多氣，與其皆多血氣，與其皆少血氣，皆有大數。其治以針艾，各調其經氣，固其常有合乎。黃帝曰：餘聞之，快於耳不解於心，願卒聞之。岐伯答曰：此人之所以參天地而應陰陽也，不可不察。足太陽外合清水，內屬於膀胱，而通水道焉。足少陽外合於渭水，內屬於膽。足陽明外合於海水，內屬於胃。","bh":"","notes":[],"pending":true},{"id":"ls12-3","tags":[],"yw":"足太陰外合於湖水，內屬於脾。足少陰外合於汝水，內屬於腎。足厥陰外合於澠水，內屬於肝。手太陽外合於淮水，內屬於小腸，而水道出焉。手少陽外合於漯水，內屬於三焦。手陽明外合於江水，內屬於大腸。手太陰外合於河水，內屬於肺。手少陰外合濟水，內屬於心。手心主外合於漳水，內屬於心包。凡此五髒六腑十二經水者，外有源泉，而內有所稟，此皆內外相貫，如環無端，人經亦然。故天爲陽，地爲陰，腰以上爲天，腰以下爲地。故海以北者爲陰，湖以北者爲陰中之陰；漳以南者爲陽，河以北至漳者爲陽中之陰；漯以南至江者，爲陽中之太陽，此一隅之陰陽也，所以人與天地相參也。","bh":"","notes":[],"pending":true},{"id":"ls12-4","tags":[],"yw":"黃帝曰：夫經水之應經脈也，其遠近淺深，水血之多少，各不同，合而以刺之奈何？岐伯答曰：足陽明，五髒六腑之海也，其脈大，血多氣盛，熱壯，刺此者不深勿散，不留不瀉也。足陽明刺深六分，留十呼。足太陽深五分，留七呼。足少陽深四分，留五呼。足太陰深三分，留四呼。足少陰深二分，留三呼。足厥陰深一分，留二呼。手之陰陽，其受氣之道近，其氣之來疾，其刺深者，皆無過二分，其留，皆無過一呼。其少長、大小、肥瘦，以心擦之，命曰法天之常，灸之亦然。","bh":"","notes":[],"pending":true},{"id":"ls12-5","tags":[],"yw":"灸而過此者，得惡火則骨枯脈澀，刺而過此者，則脫氣。黃帝曰：夫經脈之大小，血之多少，膚之厚薄，肉之堅脆及膕之大小，可爲量度乎？岐伯答曰：其可爲度量者，取其中度也。不甚脫肉，而血氣不衰也。若夫度之人，消瘦而形肉脫者，惡可以度量刺乎。審、切、循、捫、按，視其寒溫盛衰而調之，是謂因適而爲之真也。","bh":"","notes":[],"pending":true}]},
{"id":"ls13","book":"灵枢","no":13,"title":"经筋","titleTw":"經筋","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls13-1","tags":[],"yw":"足太陽之筋，起於足小趾，上結於踝，邪上結於膝，其下循足外側，結於踵，上循跟，結於膕；其別者，結於腨外，上膕中內廉，與膕中並上結於臀，上挾脊上項；其支者，別入結於舌本；其直者，結於枕骨，上頭，下顏，結於鼻；其支者，爲目上網，下結於頄；其支者，從腋後外廉結於肩髃；其支者，入腋下，上出缺盆，上結於完骨；其支者，出缺盆，邪上出於頄。其病小趾支跟腫痛，膕攣，脊反折，項筋急，肩不舉，腋支缺盆中紐痛，不可左右搖。","bh":"","notes":[],"pending":true},{"id":"ls13-2","tags":[],"yw":"治在燔針劫刺，以知爲數，以痛爲輸，名曰仲春痹也。足少陽之筋，起於小指次指，上結外踝，上循脛外廉，結於膝外廉；其支者，別起外輔骨，上走髀，前者結於伏兔之上，後者，結於尻；其直者，上乘沙季脅，上走腋前廉，系於膺乳，結於缺盆；直者，上出腋，貫缺盆，出太陽之前，循耳後，上額角，交巔上，下走頷，上結於頄；支者，結於目眥爲外維。其病小指次指支轉筋，引膝外轉筋，膝不可屈伸，膕筋急，前引髀，後引尻，即上乘(月少)季脅痛，上引缺盆、膺乳、頸維筋急。","bh":"","notes":[],"pending":true},{"id":"ls13-3","tags":[],"yw":"從左之右，右目不開，上過右角，並蹻脈而行，左絡於右，故傷左角，右足不用，命曰維筋相交。治在燔針劫刺，以知爲數，以痛爲輸，名曰孟春痹也。足陽明之筋，起於中三指，結於跗上，邪外上加於輔骨，上結於膝外廉，直上結於髀樞，上循脅屬脊；其直者，上循(骨干)，結於膝；其支者，結於外輔骨，合少陽；其直者，上循伏兔，上結於髀，聚於陰器，上腹而布，至缺盆而結，上頸，上挾口，合於頄，下結於鼻，上合於太陽。太陽爲目上網，陽明爲目下網；其支者，從頰結於耳前。","bh":"","notes":[],"pending":true},{"id":"ls13-4","tags":[],"yw":"其病足中指支脛轉筋，腳跳堅，伏兔轉筋，髀前踵，(疒貴)疝，腹筋急，引缺盆及頰，卒口僻；急者，目不合，熱則筋縱，目不開，頰筋有寒，則急，引頰移口，有熱則筋弛縱，緩不勝收，故僻。治之以馬膏，膏其急者；以白酒和桂，以塗其緩者，以桑鉤鉤之，即以生桑炭置之坎中，高下以坐等。以膏熨急頰，且飲美酒，敢美炙肉，不飲酒者，自強也，爲之三拊而已。治在燔針劫刺，以知爲數，以痛爲輸，名曰季春痹也。足太陰之筋，起於大指之端內側，上結於內踝；其直者，絡於膝內輔骨，上循陰股，結於髀，聚於陰器，上腹結於臍，循腹裏，結於肋，散於胸中；其內者，着於脊。","bh":"","notes":[],"pending":true},{"id":"ls13-5","tags":[],"yw":"其病足大指支內踝痛，轉筋痛，膝內輔骨痛，陰股引髀而痛，陰器紐痛，上引臍兩脅痛，引膺中脊內痛。治在燔針劫刺，以知爲數，以痛爲輸，命曰孟秋痹也。足少陰之筋，起於小指之下，並足太陰之筋，邪走內踝之下，結於踵，與太陽之筋合，而上結於內輔之下，並太陰之筋，而上循陰股，結於陰器，循脊內挾膂上至項，結於枕骨，與足太陽之筋合。其病足下轉筋，及所過而結者皆痛及轉筋。病在此者，主癎瘈及痙，在外者不能挽，在內者不能仰。","bh":"","notes":[],"pending":true},{"id":"ls13-6","tags":[],"yw":"故陽病者，腰反折不能俛，陰病者，不能仰。治在燔針劫刺，以知爲數，以痛爲輸。在內者熨引飲藥，此筋折紐，紐發數甚者死不治，名曰仲秋痹也。足厥陰之筋，起於大指之上，上結於內踝之前，上循脛，上結內輔之下，上循陰股，結於陰器，絡諸筋。其病足大指支內踝之前痛，內輔痛，陰股痛轉筋，陰器不用，傷於內則不起，傷於寒則陰縮入，傷於熱則縱挺不收，治在行水清陰氣；其病轉筋者，治在燔針劫刺，以知爲數，以痛爲輸，命曰季秋痹也。","bh":"","notes":[],"pending":true},{"id":"ls13-7","tags":[],"yw":"手太陽之筋，起於小指之上，結於腕，上循臂內廉，結於肘內銳骨之後，彈之應小指之上，入結於腋下；其支者，後走腋後廉，上繞肩胛，循頸出走太陽之前，結於耳後完骨；其支者，入耳中；直者，出耳上，下結於頷，上屬目外眥。其病小指支肘內銳骨後廉痛，循臂陰，入腋下，腋下痛，腋後廉痛，繞肩胛引頸而痛，應耳中鳴痛引頷，目瞑良久乃得視，頸筋急，則爲筋痿頸腫，寒熱在頸者。治在燔針劫刺之，以知爲數，以痛爲輸。其爲腫者，復而銳之。","bh":"","notes":[],"pending":true},{"id":"ls13-8","tags":[],"yw":"本支者，上曲牙，循耳前屬目外眥，上頷結於角，其痛當所過者支轉筋。治在燔針劫刺，以知爲數，以痛爲輸，名曰仲夏痹也。手少陽之筋，起於小指次指之端，結於腕，中循臂，結於肘，上繞臑外廉、上肩、走頸，合手太陽；其支者，當曲頰入系舌本；其支者，上曲牙，循耳前，屬目外眥，上乘頷，結於角。其病當所過者，即支轉筋，舌卷。治在燔針劫刺，以知爲數，以痛爲輸，名曰季夏痹也。手陽明之筋，起於大指次指之端，結於腕，上循臂，上結於肘外，上臑，結於髃；其支者，繞肩胛，挾脊；直者，從肩髃上頸；其支者，上頰，結於頄；直者，上出手太陽之前，上左角，絡頭，下右頷。","bh":"","notes":[],"pending":true},{"id":"ls13-9","tags":[],"yw":"其病當所過者，支痛及轉筋，肩不舉，頸不可左右視。治在燔針劫刺，以知爲數，以痛爲輸，名曰孟夏痹也。手太陰之筋，起於大指之上，循指上行，結於魚後，行寸口外側，上循臂，結肘中，上臑內廉，入腋下，出缺盆，結肩前髃，上結缺盆，下結胸裏，散貫賁，合賁下抵季脅。其病當所過者，支轉筋，痛甚成息賁，脅急吐血。治在燔針劫刺，以知爲數，以痛爲輸。名曰仲冬痹也。手心主之筋，起於中指，與太陰之筋並行，結於肘內廉，上臂陰，結腋下，下散前後挾脅；其支者，入腋，散胸中，結於臂。","bh":"","notes":[],"pending":true},{"id":"ls13-10","tags":[],"yw":"其病當所過者，支轉筋前及胸痛息賁。治在燔針劫刺，以知爲數，以痛爲輸，名曰孟冬痹也。手太陰之筋，起於小指之內側，結於銳骨，上結肘內廉，上入腋，交太陰，挾乳裏，結於胸中，循臂下系於臍。其病內急心承伏梁，下爲肘網。其病當所過者，支轉筋，筋痛。治在燔針劫刺，以知爲數，以痛爲輸。其成伏梁唾血膿者，死不治。經筋之病，寒則反折筋急，熱則筋弛縱不收，陰痿不用。陽急則反折，陰急則俯不伸。焠刺者，刺寒急也，熱則筋縱不收，無用燔針，名曰季冬痹也。","bh":"","notes":[],"pending":true},{"id":"ls13-11","tags":[],"yw":"足之陽明，手之太陽，筋急則口目爲僻，眥急不能卒視，治皆如右方也。","bh":"","notes":[],"pending":true}]},
{"id":"ls14","book":"灵枢","no":14,"title":"骨度","titleTw":"骨度","tags":["jingluo","zhenfa","zhize"],"brief":"","pending":true,"sections":[{"id":"ls14-1","tags":[],"yw":"黃帝問於伯高曰：脈度言經脈之長短，何以立之？伯高曰：先度其骨節之大小、廣狹、長短，而脈度定矣。黃帝曰：願聞衆人之度。人長七尺五寸者，其骨節之大小長短各幾何？伯高曰：頭之大骨圍，二尺六寸，胸圍四尺五寸。腰圍四尺二寸。發所覆者顱至項，尺二寸。發以下至頤，長一尺，君子終折。結喉以下至缺盆中，長四寸。缺盆以下至(骨曷)(骨虧)，長九寸，過則肺大，不滿則肺小。(骨曷)(骨虧)以下至天樞，長八寸，過則胃大，不及則胃小。","bh":"","notes":[],"pending":true},{"id":"ls14-2","tags":[],"yw":"天樞以下至橫骨，長六寸半，過則回腸廣長，不滿則狹短。橫骨，長六寸半。橫骨上廉以下至內輔之上廉，長一尺八寸。內輔之上廉以下至下廉，長三寸半。內輔下廉，下至內踝，長一尺三寸。內踝以下至地，長三寸。膝膕以下至附屬，長一尺六寸。附屬以下至地，長三寸。故骨圍大則太過，小則不及。角以下至柱骨，長一尺。行腋中不見者，長四寸。腋以下至季脅，長一尺二寸。季脅以下至髀樞，長六寸，髀樞以下至膝中，長一尺九寸。膝以下至外踝，長一尺六寸。","bh":"","notes":[],"pending":true},{"id":"ls14-3","tags":[],"yw":"外踝以下至京骨，長三寸。京骨以下至地，長一寸。耳後當完骨者，廣九寸。耳前當耳門者，廣一尺三寸。兩顴之間，相去七寸。兩乳之間，廣九寸半。兩髀之間，廣六寸半。足長一尺二寸，廣四寸半。肩至肘，長一尺七寸；肘至腕，長一尺二寸半。腕至中指本節，長四寸。本節至其末，長四寸半。項發以下至背骨，長二寸半，膂骨以下至尾骶，二十一節，長三尺，上節長一寸四分分之一，奇分在下，故上七節至於膂骨，九寸八分分之七。此衆人骨之度也，所以立經脈之長短也。","bh":"","notes":[],"pending":true},{"id":"ls14-4","tags":[],"yw":"是故視其經脈之在於身也，其見浮而堅，其見明而大者，多血，細而沉者，多氣也。","bh":"","notes":[],"pending":true}]},
{"id":"ls15","book":"灵枢","no":15,"title":"五十营","titleTw":"五十營","tags":["jingluo","zhenfa","yang"],"brief":"","pending":true,"sections":[{"id":"ls15-1","tags":[],"yw":"黃帝曰：餘願聞五十營奈何？岐伯答曰：天周二十八宿，宿三十六分；人氣行一周，千八分，日行二十八宿。人經脈上下左右前後二十八脈，周身十六丈二尺，以應二十八宿，漏水下百刻，以分晝夜。故人一呼脈再動，氣行三寸，呼吸定息，氣行六寸；十息，氣行六尺，日行二分。二百七十息，氣行十六丈二尺，氣行交通於中，一周於身，下水二刻，日行二十五分。五百四十息，氣行再周於身，下水四刻，日行四十分。二千七百息，氣行十周於身，下水二十刻，日行五宿二十分。","bh":"","notes":[],"pending":true},{"id":"ls15-2","tags":[],"yw":"一萬三千五百息，氣行五十營於身，水下百刻，日行二十八宿，漏水皆盡脈終矣。所謂交通者，並行一數也。故五十營備，得盡天地之壽矣，凡行八百一十丈也。","bh":"","notes":[],"pending":true}]},
{"id":"ls16","book":"灵枢","no":16,"title":"营气","titleTw":"營氣","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls16-1","tags":[],"yw":"黃帝曰：營氣之道，內谷爲寶。谷入於胃，乃傳之肺，流溢於中，布散於外，精專者，行於經隧，常營無已，終而復始，是謂天地之紀。故氣從太陰出注手陽明，上行注足陽明，下行至跗上，注大指間，與太陰合；上行抵髀，從脾注心中；循手少陰，出腋中臂，注小指，合手太陽；上行乘腋，出?內，注目內眥，上巔，下項，合足太陽；循脊，下尻，下行注小指之端，循足心，注足少陰；上行注腎，從腎注心外，散於胸中；循心主脈，出腋，下臂，出兩筋之間，入掌中，出中指之端，還注小指次指之端，合手少陽；上行注羶中，散於三焦，從三焦注膽，出脅，注足少陽；下行至跗上，復從跗注大指間，合足厥陰，上行至肝，從肝上注肺，上循喉嚨，入頏顙之竅，究於畜門。","bh":"","notes":[],"pending":true},{"id":"ls16-2","tags":[],"yw":"其支別者，上額，循巔，下項中，循脊，入骶，是督脈也；絡陰器，上過毛中，入臍中，上循腹裏，入缺盆，下注肺中，復出太陰。此營氣之所行也，逆順之常也。","bh":"","notes":[],"pending":true}]},
{"id":"ls17","book":"灵枢","no":17,"title":"脉度","titleTw":"脈度","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls17-1","tags":[],"yw":"黃帝曰：願聞脈度。岐伯答曰：手之六陽，從手至頭，長五尺，五六三丈。手之六陰，從手至胸中，三尺五寸，三六一丈八尺，五六三尺，合二丈一尺。足之六陽，從足上至頭，八尺，六八四丈八尺。足之六陰，從足至胸中，六尺五寸，六六三丈六尺，五六三尺合三丈九尺。蹻脈從足至目，七尺五寸，二七一丈四尺，二五一尺，合一丈五尺。督脈、任脈，各四尺五寸，二四八尺，二五一尺，合九尺。凡都合一十六丈二尺，此氣之大經隧也。經脈爲裏，支而橫者爲絡，絡之別者爲孫，盛而血者疾誅之，盛者瀉之，虛者飲藥以補之。","bh":"","notes":[],"pending":true},{"id":"ls17-2","tags":[],"yw":"五藏常內閱於上七竅也。故肺氣通於鼻，肺和則鼻能知臭香矣；心氣通於舌，心和則舌能知五味矣；肝氣通於目，肝和則目能辨五色矣；脾氣通於口，脾和則口能知五谷矣；腎氣通於耳，腎和則耳能聞五音矣。五髒不和，則七竅不通；六腑不合則留爲癰。故邪在腑則陽脈不和，陽脈不和則氣留之，氣留之則陽氣盛矣。陽氣太盛，則陰不利，陰脈不利則血留之，血留之則陰氣盛矣。陰氣太盛則陽氣不能榮也，故曰關。陽氣太盛，則陰氣弗能榮也，故曰格。","bh":"","notes":[],"pending":true},{"id":"ls17-3","tags":[],"yw":"陰陽俱盛，不得相榮，故曰關格。關格者，不得盡期而死也。黃帝曰：蹻脈安起安止，何氣榮水？岐伯答曰：蹻脈者，少陰之別，起於然骨之後。上內踝之上，直上循陰股，入陰，上循胸裏，入缺盆，上出人迎之前，入頄，屬目內眥，合於太陽，陽蹻而上行，氣並相還，則爲濡，目氣不榮，則目不合。黃帝曰：氣獨行五髒，不榮六腑，何也？岐伯答曰：氣之不得無行也，如水之流，如日月之行不休，故陰脈榮其髒，陽脈榮其腑，如環之無端，莫知其紀，終而復始，其流溢之氣，內溉髒腑，外濡腠理。","bh":"","notes":[],"pending":true},{"id":"ls17-4","tags":[],"yw":"黃帝曰：蹻脈有陰陽，何脈當其數？岐伯曰：男子數其陽，女子數其陰，當數者爲陰，其不當數者爲絡也。","bh":"","notes":[],"pending":true}]},
{"id":"ls18","book":"灵枢","no":18,"title":"营卫生会","titleTw":"營衛生會","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls18-1","tags":[],"yw":"黃帝問於岐伯曰：人焉受氣？陰陽焉會？何氣爲營？何氣爲衛？營安從生？衛於焉會？老壯不同氣，陰陽異位，願聞其會。岐伯答曰：人受氣於谷，谷入於胃，以傳與肺，五髒六腑，皆以受氣，其清者爲營，濁者爲衛，營在脈中，衛在脈外，營周不休，五十度而復大會，陰陽相貫，如環無端，衛氣行於陰二十五度，行於陽二十五度，分爲晝夜，故氣至陽而起，至陰而止。故曰日中而陽隴，爲重陽，夜半而陰隴爲重陰，故太陰主內，太陽主外，各行二十五度分爲晝夜。","bh":"","notes":[],"pending":true},{"id":"ls18-2","tags":[],"yw":"夜半爲陰隴，夜半後而爲陽衰，平且陰盡而陽受氣矣。日中而陽隴，日西而陽衰，日入陽盡而陰受氣矣。夜半而大會，萬民皆臥，命曰合陰，平旦陰盡而陽受氣，如是無己，與天地同紀。黃帝曰：老人之不夜瞑者，何氣使然？少壯之人，不晝瞑者，何氣使然？岐伯答曰：壯者之氣血盛，其肌肉滑，氣道通，營衛之行不失其常，故晝精而夜瞑。老者之氣血衰，其肌肉枯，氣道澀，五髒之氣相博，其營氣衰少而衛氣內伐，故晝不精，夜不瞑。黃帝曰：願聞營衛之所行，皆何道從來？岐伯答曰：營出中焦，衛出下焦。","bh":"","notes":[],"pending":true},{"id":"ls18-3","tags":[],"yw":"黃帝曰：願聞三焦之所出。岐伯答曰：上焦出於胃上口，並咽以上，貫膈，而布胸中，走腋，循太陰之分而行，還至陽明，上至舌，下足陽明，常與營俱行於陽二十五度，行於陰亦二十五度一周也。故五十度而復大會於手太陰矣。黃帝曰：人有熱，飲食下胃，其氣未定，汗則出，或出於面，或出於背，或出於身半，其不循衛氣之道而出，何也？岐伯曰：此外傷於風，內開腠理，毛蒸理泄，衛氣走之，固不得循其道，此氣慓悍滑疾，見開而出，故不得從其道，故命曰漏泄。","bh":"","notes":[],"pending":true},{"id":"ls18-4","tags":[],"yw":"黃帝曰：願聞中焦之所出。岐伯答曰：中焦亦並胃中，出上焦之後，此所受氣者，泌糟粕，蒸津液，化其精微，上注於肺脈乃化而爲血，以奉生身，莫貴於此，故獨得行於經隧，命曰營氣。黃帝曰：夫血之與氣，異名同類。何謂也？岐伯答曰：營衛者，精氣也，血者，神氣也，故血之與氣，異名同類焉。故奪血者無汗，奪汗者無血，故人生有兩死而無兩生。黃帝曰：願聞下焦之所出。岐伯答曰：下焦者，別回腸，注於膀胱，而滲入焉；故水谷者，常並居於胃中，成糟粕，而俱下於大腸而成下焦，滲而俱下。","bh":"","notes":[],"pending":true},{"id":"ls18-5","tags":[],"yw":"濟泌別汁，循下焦而滲入膀胱焉。黃帝曰：人飲酒，酒亦入胃，谷未熟，而小便獨先下，何也？岐伯答曰：酒者，熟谷之液也。其氣悍以清，故後谷而入，先谷而液出焉。黃帝曰：善。餘聞上焦如霧，中焦如漚，下焦如瀆，此之謂也。","bh":"","notes":[],"pending":true}]},
{"id":"ls19","book":"灵枢","no":19,"title":"四时气","titleTw":"四時氣","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls19-1","tags":[],"yw":"黃帝問於岐伯曰：夫四時之氣，各不同形，百病之起，皆有所生，灸刺之道，何者爲定？岐伯答曰：四時之氣，各有所在，灸刺之道，得氣穴爲定。故春取經、血脈、分肉之間，甚者，深刺之，間者，淺刺之；夏取盛經孫絡，取分間絕皮膚；秋取經俞。邪在腑，取之合；冬取井滎，必深以留之。溫瘧汗不出，爲五十九痏，風(疒水)膚脹，爲五十痏。取皮膚之血者，盡取之。飧泄補三陰之上，補陰陵泉，皆久留之，熱行乃止。轉筋於陽，治其陽；轉筋於陰，治其陰。","bh":"","notes":[],"pending":true},{"id":"ls19-2","tags":[],"yw":"皆卒刺之。徒(疒水)先取環谷下三寸，以鈹針針之，已刺而筩之，而內之，入而復之，以盡其(疒水)，必堅。來緩則煩悗，來急則安靜，間日一刺之，(疒水)盡乃止。飲閉藥，方刺之時徒飲之，方飲無食，方食無飲，無食他食，百三十五日。着痹不去，久寒不已，卒取其三裏。骨爲干。腸中不便，取三裏，盛瀉之，虛補之。癘風者，素刺其腫上。已刺，以銳針針其處，按出其惡氣，腫盡乃止。常食方食，無食他食。腹中常鳴，氣上衝胸，喘不能久立。","bh":"","notes":[],"pending":true},{"id":"ls19-3","tags":[],"yw":"邪在大腸，刺肓之原，巨虛上廉、三裏。小腹控睪，引腰脊，上衝心。邪在小腸者，連睪系，屬於脊，貫肝肺，絡心系。氣盛則厥逆，上衝腸胃，燻肝，散於肓，結於臍，故取之肓原以散之，刺太陰以予之，取厥陰以下之，取巨虛下廉以去之，按其所過之經以調之。善嘔，嘔有苦，長太息，心中憺憺，恐人將捕之；邪在膽，逆在胃，膽液泄，則口苦，胃氣逆，則嘔苦，故曰嘔膽。取三裏以下。胃氣逆，則刺少陽血絡，以閉膽逆，卻調其虛實，以去其邪。","bh":"","notes":[],"pending":true},{"id":"ls19-4","tags":[],"yw":"飲食不下，膈塞不通，邪在胃脘，在上脘，則刺抑而下之，在下脘，則散而去之。小腹痛腫，不得小便，邪在三焦，約取之太陽大絡，視其絡脈與厥陰小絡結而血者，腫上及胃脘，取三裏。睹其色，察其以，知其散復者，視其目色，以知病之存亡也。一其形，聽其動靜者，持氣口人迎以視其脈，堅且盛且滑者，病日進，脈軟者，病將下，諸經實者，病三日已。氣口候陰，人迎候陽也。","bh":"","notes":[],"pending":true}]},
{"id":"ls20","book":"灵枢","no":20,"title":"五邪","titleTw":"五邪","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls20-1","tags":[],"yw":"邪在肺，則病皮膚痛，寒熱，上氣喘，汗出，欬動肩背。取之膺中外喻，背三節五髒之傍，以手疾按之，快然，乃刺之。取之缺盆中以越之。邪在肝，則兩脅中痛，寒中，惡血在內，行善掣節，時腳腫。取之行間，以引脅下，補三裏以溫胃中，取血脈以散惡血；取耳間青脈，以去其掣。邪在脾胃，則病肌肉痛，陽氣有餘，陰氣不足，則熱中善飢；陽氣不足，陰氣有餘，則寒中腸鳴、腹痛；陰陽俱有餘，若俱不足，則有寒有熱，皆調於三裏。邪在腎，則病骨痛，陰痹。","bh":"","notes":[],"pending":true},{"id":"ls20-2","tags":[],"yw":"陰痹者，按之而不得，腹脹，腰痛，大便難，肩背頸項痛，時眩。取之湧泉、昆侖。視有血者，盡取之。邪在心，則病心痛，喜悲時眩僕；視有餘不足而調之其輸也。","bh":"","notes":[],"pending":true}]},
{"id":"ls21","book":"灵枢","no":21,"title":"寒热病","titleTw":"寒熱病","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls21-1","tags":[],"yw":"皮寒熱者，不可附席，毛發焦，鼻槁臘。不得汗，取三陽之絡，以補手太陰。肌寒熱者，肌痛，毛發焦而脣槁臘。不得汗，取三陽於下，以去其血者，補足太陰，以出其汗。骨寒熱者，病無所安，汗注不休。齒未槁，取其少陰於陰股之絡；齒已槁，死不治。骨厥亦然。骨痹，舉節不用而痛，汗注、煩心。取三陰之經，補之。身有所傷，血出多及中風寒，若有所墮墜，四肢懈惰不收，名曰體惰。取其小腹臍下三結交。三結交者，陽明太陰也，臍下三寸關元也。","bh":"","notes":[],"pending":true},{"id":"ls21-2","tags":[],"yw":"厥痹者，厥氣上及腹。取陰陽之絡，視主病也，瀉陽補陰經也。頸側之動脈人迎。人迎，足陽明也，在嬰筋之前。嬰筋之後，手陽明也，名曰扶突。次脈，足少陽脈也，名曰天牖。次脈，足太陽也，名曰天柱。腋下動脈，臂太陰也，名曰天府。陽迎頭痛，胸滿不得息，取之人迎。暴瘖氣鞭，取扶突與舌本出血。暴襲氣蒙，耳目不明，取天牖。暴攣?眩，足不任身，取天柱。暴痹內逆，肝肺相搏，血溢鼻口，取天府。此爲天牖五部。臂陽明，有入頄遍齒者，名曰大迎。","bh":"","notes":[],"pending":true},{"id":"ls21-3","tags":[],"yw":"下齒齲，取之臂。惡寒補之，不惡寒瀉之。足太陽有入頄遍齒者，名曰角孫。上齒齲，取之在鼻與頄前。方病之時，其脈盛，盛則瀉之，虛則補之。一曰取之出鼻外。足陽明有挾鼻入於面者，名曰懸顱。屬口，對入系目本，視有過者取之。損有餘，益不足，反者益其。足太陽有通項入於腦者，正屬目本，名曰眼系。頭目苦痛，取之在項中兩筋間。入腦乃別陰蹻、陽蹻，陰陽相交，陽入陰，陰出陽，交於目銳眥，陽氣盛則瞋目，陰氣盛則瞑目。熱厥取足太陰、少陽，皆留之；寒厥取足陽明、少陰於足，皆留之。","bh":"","notes":[],"pending":true},{"id":"ls21-4","tags":[],"yw":"舌縱涎下，煩悗，取足少陰。振寒灑灑鼓頷，不得汗出，腹脹煩悗，取手太陰，刺虛者，刺其去也；刺實者，刺其來也。春取絡脈，夏取分腠，秋取氣口，冬取經輸。凡此四時，各以時爲齊。絡脈治皮膚，分腠治肌肉，氣口治筋脈，經輸治骨髓。五髒，身有五部：伏兔一；腓二，腓者腨也；背三，五髒之輸四；項五。此五部有癰疽者死。病始手臂者，先取手陽明、太陰而汗出；病始頭首者，先取項太陽而汗出；病始足脛者，先取足陽明而汗出。臂太陰可汗出，足陽明可汗出，故取陰而汗出甚者，止之於陽，取陽而汗出甚者，止之於陰。","bh":"","notes":[],"pending":true},{"id":"ls21-5","tags":[],"yw":"凡刺之害，中而不去則精泄；不中而去則致氣。精泄則病甚而慪，致氣則生爲癰疽也。","bh":"","notes":[],"pending":true}]},
{"id":"ls22","book":"灵枢","no":22,"title":"癞狂病","titleTw":"癩狂病","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls22-1","tags":[],"yw":"目眥外決於面者，爲銳眥；在內近鼻者，爲內眥；上爲外眥，下爲內眥。癲疾始生，先不樂，頭重痛，視舉目赤，甚作極，已而煩心。候之於顏。取手太陽、陽明、太陰，血變爲止。癲疾始作，而引口啼呼喘悸者，候之手陽明、太陽。左強者，攻其右；右強者，攻其左，血變爲止。癲疾始作，先反僵，因而脊痛，候之足太陽、陽明、太陰、手太陽，血變爲止。治癲疾者，常與之居，察其所當取之處。病至，視之有過者瀉之，置其血於瓠壺之中，至其發時，血獨動矣，不動，灸窮骨二十壯。","bh":"","notes":[],"pending":true},{"id":"ls22-2","tags":[],"yw":"窮骨者，骶骨也。骨癲疾者，顑、齒諸腧、分肉皆滿而骨居，汗出、煩悗，嘔多沃沫，氣下泄，不治。筋癲疾者，身倦攣急大，刺項大經之大杼脈，嘔多沃沫，氣下泄，不治。脈癲疾者，暴僕，四肢之脈皆脹而縱，脈滿，盡刺之出血，不滿，灸之項太陽，灸帶脈於腰相去三寸，諸分肉本輸。嘔吐沃沫，氣下泄，不治。癲疾者，疾發如狂者，死不治。狂始生，先自悲也，喜忘、苦怒、善恐者得之憂飢，治之取手太陽、陽明，血變而止，及取足太陰、陽明。","bh":"","notes":[],"pending":true},{"id":"ls22-3","tags":[],"yw":"狂始發，少臥不飢，自高賢也，自辯智也，自尊貴也，善罵詈，日夜不休，治之取手陽明太陽太陰舌下少陰，視之盛者，皆取之，不盛，釋之也。狂言，驚，善笑，好歌樂，妄行不休者，得之大恐，治之取手陽明太陽太陰。狂，目妄見，耳妄聞，善呼者，少氣之所生也；治之取手太陽太陰陽明，足太陰頭兩顑。狂者多食，善見鬼神，善笑而不發於外者，得之有所大喜，治之取足太陰太陽陽明，後取手太陰太陽陽明。狂而新發，未應如此者，先取曲泉左右動脈，及盛者見血，有頃已，不已，以法取之，灸骨骶二十壯。","bh":"","notes":[],"pending":true},{"id":"ls22-4","tags":[],"yw":"風逆，暴四肢腫，身漯漯，唏然時寒，飢則煩，飽則善變，取手太表裏，足少陰陽明之徑，肉清取滎，骨清取井、經也。厥逆爲病也，足暴清，胸若將裂，腸若將以刀切之，煩而不能食，脈大小皆澀，暖取足少陰，清取足陽明，清則補之，溫則瀉之。厥逆腹脹滿，腸鳴，胸滿不得息，取之下胸二脅，咳而動手者，與背輸，以手按之，立快者是也。內閉不得溲，刺足少陰太陽，與抵上以長針。氣逆，則取其太陰、陽明、厥陰，甚取少陰、陽明，動者之經也。","bh":"","notes":[],"pending":true},{"id":"ls22-5","tags":[],"yw":"少氣，身漯漯也，言吸吸也，骨酸體重，懈惰不能動，補足少陰。短氣息短，不屬，動作氣索，補足少陰，去血絡也。","bh":"","notes":[],"pending":true}]},
{"id":"ls23","book":"灵枢","no":23,"title":"热病","titleTw":"熱病","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls23-1","tags":[],"yw":"偏枯，身偏不用而痛，言不變，志不亂，病在分腠之間，巨針取之，益其不足，損其有餘，乃可復也。痱之爲病也，身無痛者，四肢不收；智亂不甚，其言微知，可治；甚則不能言，不可治也。病先起於陽，復入於陰者，先取其陽，後取其陰，浮而取之。熱病三日，而氣口靜、人迎躁者，取之諸陽，五十九刺，以瀉其熱，而出其汗，實其陰，以補其不足者。身熱甚，陰陽皆靜者，勿刺也；其可刺者，急取之，不汗出則泄。所謂勿刺者，有死徵也。熱病七日八日，脈口動，喘而短者，急刺之，汗且自出，淺刺手大指間。","bh":"","notes":[],"pending":true},{"id":"ls23-2","tags":[],"yw":"熱病七日八日，脈微小，病者溲血，口中干，一日半而死。脈代者，一日死。熱病已得汗出，而脈尚躁，喘且復熱，勿刺膚，喘甚者死。熱病七日八日，脈不躁，躁不散改，後看中有汗；三日不汗，四日死。未曾汗者，勿腠刺之。熱病先膚痛，窒鼻充面，取之皮，以第一針，五十九，苛軫鼻，索皮於肺，不得，索之火，火者，心也。熱病先身澀倚而熱，煩俛，干脣口溢，取之皮，以第一針，五十九；膚脹口干，寒汗出，索脈於心，不得，索之水，水者，腎也。","bh":"","notes":[],"pending":true},{"id":"ls23-3","tags":[],"yw":"熱病溢干多飲，善驚，臥不能起，取之膚肉，以第六針，五十九，目眥青，索肉於脾，不得，索之水，木者，肝也。熱病面青，腦痛，手足躁，取之筋間，以第四針於四逆；筋躄目浸，索筋於肝，不得，索之金，金者，肺也。","bh":"","notes":[],"pending":true}]},
{"id":"ls24","book":"灵枢","no":24,"title":"厥病","titleTw":"厥病","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls24-1","tags":[],"yw":"厥頭痛，面若腫起而煩心，取之足陽明太陰。厥頭痛，頭脈痛，心悲，善泣，視頭動脈反盛者，刺盡去血，後調足厥陰。厥頭痛，貞貞頭重而痛，寫頭上五行，行五，先取手少陰，後取足少陰。厥頭痛，意善忘，按之不得，取頭面左右動脈，後取足太陰。厥頭痛，項先痛，腰脊爲應，先取天柱，後取足太陽。厥頭痛，頭痛甚，耳前後脈湧有熱，瀉出其血，後取足少陽。真頭痛，頭痛甚，腦盡痛，手足寒至節，死不治。頭痛不可取於腧者，有所擊墮，惡血在於內，若肉傷，痛未已，可則刺，不可遠取也。","bh":"","notes":[],"pending":true},{"id":"ls24-2","tags":[],"yw":"頭痛不可刺者，大痹爲惡，日作者，可令少愈，不可已。頭半寒痛，先取手少陽陽明，後取足少陽陽明。厥心痛，與背相控，善瘈，如從後觸其心，傴僂者，腎心痛也，先取京骨、昆侖，發狂不已，取然谷。厥心痛，腹脹胸滿，心尤痛甚，胃心痛也，取之大都、大白。厥心痛，痛如以錐針刺其心，心痛甚者，脾心痛也，取之然谷、太溪。厥心痛，色蒼蒼如死狀，終日不得太息，肝心痛也，取之行間、太衝。厥心痛，臥若徒居，心痛間，動作，痛益甚，色不變，肺心痛也，取之魚際、太淵。","bh":"","notes":[],"pending":true},{"id":"ls24-3","tags":[],"yw":"真心痛，手足清至節，心痛甚，日發夕死，夕發旦死。心痛不可刺者，中有盛聚，不可取於腧。腸中有蟲瘕及蛟蛕，皆不可取以小針；心腸痛，憹作痛，腫聚，往來上下行，痛有休止，腹熱喜渴涎出者，是蛟蛕也。以手聚按而堅持之，無令得移，以大針刺之，久持之，蟲不動，乃出針也。恐腹濃痛，形中上者。耳聾無聞，取耳中；耳鳴，取耳前動脈；耳痛不可刺者，耳中有膿，若有干聆聊，耳無聞也；耳聾取手小指次指爪甲上與肉交者，先取手，後取足；耳鳴取手中指爪甲上，左取右，右取左，先取手，後取足。","bh":"","notes":[],"pending":true},{"id":"ls24-4","tags":[],"yw":"足髀不可舉，側而取之，在樞合中，以員利針，大針不可刺。病注下血，取曲泉。風痹淫礫，病不可已者，足如履冰，時如入湯中，股脛淫礫，煩心頭痛，時嘔時悗，眩已汗出，久則目眩，悲以喜恐，短氣，不樂，不出三年死也。","bh":"","notes":[],"pending":true}]},
{"id":"ls25","book":"灵枢","no":25,"title":"病本","titleTw":"病本","tags":["bingji","yinyang","shen"],"brief":"","pending":true,"sections":[{"id":"ls25-1","tags":[],"yw":"先病而後逆者，治其本；先逆而後病者，治其本；先寒而後生病者，治其本；先病而後生寒者，治其本；先熱而後生病者，治其本。先泄而後生他病者，治其本，必且調之，乃治其他病。先病而後中滿者，治其標；先病後泄者，治其本；先中滿而後煩心者，治其本。有客氣，有同氣。大小便不利治其標，大小便利，治其本。病發而有餘，本而標之，先治其本，後治其標；病發而不足，標而本之，先治其標，後治其本，謹詳察間甚，以意調之，間者並行，甚爲獨行；先小大便不利而後生他病者，治其本也。","bh":"","notes":[],"pending":true}]},
{"id":"ls26","book":"灵枢","no":26,"title":"杂病","titleTw":"雜病","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls26-1","tags":[],"yw":"厥挾脊而痛者，至頂，頭沉沉然，目(目巟)(目巟)然，腰脊強。取足太陽膕中血絡。厥胸滿面腫，脣漯漯然，暴言難，甚則不能言，取足陽明。厥氣走喉而不能言，手足清，大便不利，取足少陰。厥而腹向向然，多寒氣，腹中谷谷，便溲難，取足太陰。嗌干，口中熱如膠，取足少陰。膝中痛，取犢鼻，以員利針，發而間之。針大如犛，刺膝無疑。喉痹不能言，取足陽明；能言，取手陽明。瘧不渴，間日而作，取足陽明；渴而日作，取手陽明。齒痛，不惡清飲，取足陽明；惡清飲，取手陽明。","bh":"","notes":[],"pending":true},{"id":"ls26-2","tags":[],"yw":"聾而不痛者，取足少陽；聾而痛者，取手陽明。衄而不止，衄血流，取足太陽；衄血，取手太陽。不已，刺宛骨下；不已，刺膕中出血。腰痛，痛上寒，取足太陽陽明；痛上熱，取足厥陰；不可以俛仰，取足少陽。中熱而喘，取足少陰膕中血絡。喜怒而不欲食，言益小，刺足太陰；怒而多言，刺足少陽。顑痛，刺手陽明與顑之盛脈出血。項痛不可俛仰，刺足太陽；不可以顧，刺手太陽也。小腹滿大，上走胃，至心，淅淅身時寒熱，小便不利，取足厥陰。","bh":"","notes":[],"pending":true},{"id":"ls26-3","tags":[],"yw":"腹滿，大便不利，腹大，亦上走胸嗌，喘息喝喝然，取足少陰。腹滿食不化，腹向向然，不能大便，取足太陰。心痛引腰脊，欲嘔，取足少陰。心痛，腹脹，牆牆然，大便不利，取足太陰。心痛，引背不得息，刺足少陰；不已，取手少陽。心痛引小腹滿，上下無常處，便溲難，刺足厥陰。心痛，但短氣不足以息，刺手太陰。心痛，當九節刺之，按，已刺按之，立已；不已，上下求之，得之立已。顑痛，刺足陽明曲周動脈，見血，立已；不已，按人迎於經，立已。","bh":"","notes":[],"pending":true},{"id":"ls26-4","tags":[],"yw":"氣逆上，刺膺中陷者，與下胸動脈。腹痛，刺臍左右動脈，已刺按之，立已；不已，刺氣街，已刺按之，立已。痿厥爲四末束悗，乃疾解之，日二；不仁者，十日而知，無休，病已止。歲以草刺鼻，嚏，嚏而已；無息，而疾迎引之，立已；大驚之，亦可已。","bh":"","notes":[],"pending":true}]},
{"id":"ls27","book":"灵枢","no":27,"title":"周痹","titleTw":"周痹","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls27-1","tags":[],"yw":"黃帝問於岐伯曰：周痹之在身也，上下移徒隨脈，其上下左右相應，間不容空，願聞此痛，在血脈之中邪？將在分肉之間乎？何以致是？其痛之移也，間不及下針，其慉痛之時，不及定治，而痛已止矣。何道使然？願聞其故？岐伯答曰：此衆痹也，非周痹也。黃帝曰：願聞衆痹。岐伯對曰：此各在其處，更發更止，更居更起，以右應左，以左應右，非能周也。更發更休也。黃帝曰：善。刺之奈何？岐伯對曰：刺此者，痛雖已止，必刺其處，勿令復起。","bh":"","notes":[],"pending":true},{"id":"ls27-2","tags":[],"yw":"帝曰：善。願聞周痹何如？岐伯對曰：周痹者，在於血脈之中，隨脈以上，隨脈以下，不能左右，各當其所。黃帝曰：刺之奈何？岐伯對曰：痛從上下者，先刺其下以過之，後刺其上以脫之。痛從下上者，先刺其上以過之，後刺其下以脫之。黃帝曰：善。此痛安生？何因而有名？岐伯對曰：風寒溼氣，客於外分肉之間，迫切而爲沫，沫得寒則聚，聚則排分肉而分裂也，分裂則痛，痛則神歸之，神歸之則熱，熱則痛解，痛解則厥，厥則他痹發，發則如是。","bh":"","notes":[],"pending":true},{"id":"ls27-3","tags":[],"yw":"帝曰：善。餘已得其意矣。此內不在髒，而外未發於皮，獨居分肉之間，真氣不能周，故名曰周痹。故刺痹者，必先切循其下之六經，視其虛實，及大絡之血結而不通，及虛而脈陷空者而調之，熨而通之。其瘈堅轉引而行之。黃帝曰：善。餘已得其意矣，亦得其事也。九者經巽之理，十二經脈陰陽之病也。","bh":"","notes":[],"pending":true}]},
{"id":"ls28","book":"灵枢","no":28,"title":"口问","titleTw":"口問","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls28-1","tags":[],"yw":"黃帝閒居，辟左右而問於岐伯曰：餘已聞九針之經，論陰陽逆順，六經已畢，願得口問。岐伯避席再拜曰：善乎哉問也，此先師之所口傳也。黃帝曰：願聞口傳。岐伯答曰：夫百病之始生也，皆生於風雨寒暑，陰陽喜怒，飲食居處，大驚卒恐。則血氣分離，陰陽破敗，經絡厥絕，脈道不通，陰陽相逆，衛氣稽留，經脈虛空，血氣不次，乃失其常。論不在經者，請道其方。黃帝曰：人之欠者，何氣使然？岐伯答曰：衛氣晝日行於陽，夜半則行於陰，陰者主夜，夜者臥；陽者主上，陰者主下；故陰氣積於下，陽氣未盡，陽引而上，陰引而下，陰陽相引，故數欠。","bh":"","notes":[],"pending":true},{"id":"ls28-2","tags":[],"yw":"陽氣盡，陰氣盛，則目瞑；陰氣盡而陽氣盛，則寤矣。瀉足少陰，補足太陽。黃帝曰：人之噦者，何氣使然？岐伯曰：谷入於胃，胃氣上注於肺。今有故寒氣與新谷氣，俱還入於胃，新故相亂，真邪相攻，氣並相逆，復出於胃，故爲噦。補手太陰，瀉足少陰。黃帝曰：人之唏者，何氣使然？岐伯曰：此陰氣盛而陽氣虛，陰氣疾而陽氣徐，陰氣盛而陽氣絕，故爲唏。補足太陽，瀉足少陰。黃帝曰：人之振寒者，何氣使然？岐伯曰：寒氣客於皮膚，陰氣盛，陽氣虛，故爲振寒寒慄，補諸陽。","bh":"","notes":[],"pending":true},{"id":"ls28-3","tags":[],"yw":"黃帝曰：人之噫者，何氣使然？岐伯曰：寒氣客於胃，厥逆從下上散，復出於胃，故爲噫。補足太陰陽明，一曰補眉本也。黃帝曰：人之嚏者，何氣使然？岐伯曰：陽氣和利，滿於心，出於鼻，故爲嚏。補足太陽榮眉本，一曰眉上也。黃帝曰：人之嚲者，何氣使然？岐伯曰：胃不實則諸脈虛；諸脈虛則筋脈懈惰；筋脈懈惰則行陰用力，氣不能復，故爲嚲。因其所在，補分肉間。黃帝曰：人之哀而泣涕出者，何氣使然？岐伯曰：心者，五髒六腑之主也；目者，宗脈之所聚也，上液之道也；口鼻者，氣之門戶也。","bh":"","notes":[],"pending":true},{"id":"ls28-4","tags":[],"yw":"故悲哀愁憂則心動，心動則五髒六腑皆搖，搖則宗脈感，宗脈感則液道開，液道開，故泣涕出焉。液者，所以灌精濡空竅者也，故上液之道開則泣，泣不止則液竭；液竭則精不灌，精不灌則目無所見矣，故命曰奪精。補天柱經俠頸。黃帝曰：人之太息者，何氣使然？岐伯曰：憂思則心系急，心系急則氣道約，約則不利，故太息以伸出之，補手少陰心主，足少陽留之也。黃帝曰：人之涎下者，何氣使然？岐伯曰：飲食者，皆入於胃，胃中有熱則蟲動，蟲動則胃緩，胃緩則廉泉開，故涎下，補足少陰。","bh":"","notes":[],"pending":true},{"id":"ls28-5","tags":[],"yw":"黃帝曰：人之耳中鳴者，何氣使然？岐伯曰：耳者，宗脈之所聚也，故胃中空則宗脈虛，虛則下溜，脈有所竭者，故耳鳴，補客主人，手大指爪甲上與肉交者也。黃帝曰：人之自齧舌者，何氣使然？岐伯曰：此厥逆走上，脈氣輩至也。少陰氣至則齧舌，少陽氣至則齧頰，陽明氣至則齧脣矣。視主病者，則補之。凡此十二邪者，皆奇邪之走空竅者也。故邪之所在，皆爲不足。故上氣不足，腦爲之不滿，耳爲之苦鳴，頭爲之苦傾，目爲之眩。中氣不足，溲便爲之變，腸爲之苦鳴。","bh":"","notes":[],"pending":true},{"id":"ls28-6","tags":[],"yw":"下氣不足，則乃爲痿厥心悗。補足外踝下留之。黃帝曰：治之奈何？岐伯曰：腎主爲欠，取足少陰；肺主爲噦，取手太陰、足少陰；唏者，陰與陽絕，故補足太陽，瀉足少陰；振寒者，補諸陽；噫者，補足太陰陽明；嚏者，補足太陽眉本；嚲，因其所在，補分肉間；泣出補天柱經俠頸，俠頸者，頭中分也；太息，補手少陰、心主、足少陽，留之；涎下補足少陰；耳鳴補客主人，手大指爪甲上與肉交者；自齧舌，視主病者，則補之。目眩頭傾，補足外踝下留之；痿厥心悗，刺足大趾間上二寸，留之，一曰足外踝下留之。","bh":"","notes":[],"pending":true}]},
{"id":"ls29","book":"灵枢","no":29,"title":"师传","titleTw":"師傳","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls29-1","tags":[],"yw":"黃帝曰：餘聞先師，有所心藏，弗着於方，餘願聞而藏之，則而行之，上以治民，下以治身，使百姓無病，上下和親，德澤下流，子孫無優，傳於後世，無有終時，可得聞乎？岐伯曰：遠乎哉問也。夫治民與自治，治彼與治此，治小與治大，治國與治家，未有逆而能治之也，夫惟順而已矣。順者，非獨陰陽脈，論氣之逆順也，百姓人民皆欲順其志也。黃帝曰：順之奈何？岐伯曰：入國問俗，入家問諱，上堂問禮，臨病人問所便。黃帝曰：便病人奈何？岐伯曰：夫中熱消癉，則便寒；寒中之屬，則便熱。","bh":"","notes":[],"pending":true},{"id":"ls29-2","tags":[],"yw":"胃中熱則消谷，令人懸心善飢。臍以上皮熱，腸中熱，則出黃如糜。臍以下皮寒，胃中寒，則腹脹；腸中寒，則腸鳴飧泄。胃中寒，腸中熱，則脹而且泄，胃中熱，腸中寒，則疾飲，小腹痛脹。黃帝曰：胃欲寒飲，腸欲熱飲，兩者相逆，便之奈何？且夫王公大人，血食之君，驕恣從欲輕人，而無能禁之，禁之則逆其志，順之則加其病，便之奈何？治之何先？岐伯曰：人之情，莫不惡死而喜生，告之以其敗，語之以其善，導之以其所便，開之以其所苦，雖有無道之人，惡有不聽者乎？黃帝曰：治之奈何？岐伯曰：春夏先治其標，後治其本；秋冬先治其本，後治其標。","bh":"","notes":[],"pending":true},{"id":"ls29-3","tags":[],"yw":"黃帝曰：便其相逆者奈何？岐伯曰：便此者，食飲衣服，亦欲適寒溫，寒無悽愴，暑無出汗。食飲者，熱無灼灼，寒無滄滄。寒溫中適，故氣將持，乃不致邪僻也。黃帝曰：本藏以身形肢節(月囷)肉，候五髒六腑之大小焉。今夫王公大人，臨朝即位之君，而問焉，誰可捫循之，而後答乎？岐伯曰：身形肢節者，藏府之蓋也，非面部之閱也。黃帝曰：五藏之氣，閱於面者，餘已知之矣，以肢節知而閱之，奈何？岐伯曰：五藏六府者，肺爲之蓋，巨肩陷咽，候見其外。","bh":"","notes":[],"pending":true},{"id":"ls29-4","tags":[],"yw":"黃帝曰：善。岐伯曰：五藏六府，心爲之主，缺盆爲之道，骷骨有餘，以候(骨曷)(骨虧)。黃帝曰：善。岐伯曰：肝者，主爲將，使之候外，欲知堅固，視目小大。黃帝曰：善。岐伯曰：脾者，主爲衛，使之迎糧，視脣舌好惡，以知吉兇。黃帝曰：善。岐伯曰：腎者，主爲外，使之遠聽，視耳好惡，以知其性。黃帝曰：善。願聞六府之候。岐伯曰：六府者，胃爲之海，龐骸、大頸、張胸，五谷乃容。鼻隧以長，以候大腸。脣厚、人中長，以候小腸。","bh":"","notes":[],"pending":true},{"id":"ls29-5","tags":[],"yw":"目下果大，其膽乃橫。鼻孔在外，膀胱漏泄。鼻柱中央起，三焦乃約，此所以候六府者也。上下三等，藏安且良矣。","bh":"","notes":[],"pending":true}]},
{"id":"ls30","book":"灵枢","no":30,"title":"决气","titleTw":"決氣","tags":["zhenfa","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls30-1","tags":[],"yw":"黃帝曰：餘聞人有精、氣、津、液、血、脈，餘意以爲一氣耳，今乃辨爲六名，餘不知其所以然。岐伯曰：兩神相搏，合而成形，常先身生，是謂精。何謂氣？岐伯曰：上焦開發，宣五谷味，燻膚、充身、澤毛，若霧露之溉，是謂氣。何謂津？岐伯曰：腠理發泄，汗出溱溱，是謂津。何謂液？岐伯曰：谷入氣滿，淖澤注於骨，骨屬屈伸，泄澤補益腦髓，皮膚潤澤，是謂液。何謂血？岐伯曰：中焦受氣，取汁變化而赤，是謂血。何謂脈？岐伯曰：壅遏營氣，令無所避，是謂脈。","bh":"","notes":[],"pending":true},{"id":"ls30-2","tags":[],"yw":"黃帝曰：六氣有，有餘不足，氣之多少，腦髓之虛實，血脈之清濁，何以知之？岐伯曰：精脫者，耳聾；氣脫者，目不明；津脫者，腠理開，汗大泄；液脫者，骨屬屈伸不利，色夭，腦髓消，脛痹，耳數鳴；血脫者，色白，夭然不澤，其脈空虛，此其候也。黃帝曰：六氣者，貴賤何如？岐伯曰：六氣者，各有部主也，其貴賤善惡，可爲常主，然五谷與胃爲大海也。","bh":"","notes":[],"pending":true}]},
{"id":"ls31","book":"灵枢","no":31,"title":"肠胃","titleTw":"腸胃","tags":["zhenfa","zangxiang","yinyang"],"brief":"","pending":true,"sections":[{"id":"ls31-1","tags":[],"yw":"黃帝問於伯高曰：餘願聞六府傳谷者，腸胃之大小長短，受谷之多少奈何？伯高曰：請盡言之，谷所從出入淺深遠近長短之度：脣至齒長九分，口廣二寸半；齒以後至會厭，深三寸半，大容五合；舌重十兩，長七寸，廣二寸半；咽門重十兩，廣一寸半。至胃長一尺六寸，胃紆曲屈，伸之，長二尺六寸，大一尺五寸，徑五寸，大容三斗五升。小腸後附脊，左環回日迭積，其注於回腸者，外附於臍上。回運環十六曲，大二寸半，徑八分分之少半，長三丈三尺。","bh":"","notes":[],"pending":true},{"id":"ls31-2","tags":[],"yw":"回腸當臍左環，回周葉積而下，回運還反十六曲，大四寸，徑一寸寸之少半，長二丈一尺。廣腸傳脊，以受回腸，左環葉脊上下，辟大八寸，徑二寸寸之大半，長二尺八寸。腸胃所入至所出，長六丈四寸四分，回曲環反，三十二曲也。","bh":"","notes":[],"pending":true}]},
{"id":"ls32","book":"灵枢","no":32,"title":"平人绝谷","titleTw":"平人絕谷","tags":["zhenfa","zangxiang","shen"],"brief":"","pending":true,"sections":[{"id":"ls32-1","tags":[],"yw":"黃帝曰：願聞人之不食，七日而死，何也？伯高曰：臣請言其故。胃大一尺五寸，徑五寸，長二尺六寸，橫屈受水谷三斗五升，其中之谷，常留二斗，水一斗五升而滿，上焦泄氣，出其精微，慓悍滑疾，下焦下溉諸腸。小腸大二寸半，徑八分分之少半，長三丈二尺，受谷二斗四升，水六升三合合之大半。回腸大四寸，徑一寸寸之少半，長二丈一尺，受谷一斗，水七升半。廣腸大八寸，徑二寸寸之大半，長二尺八寸，受谷九升三合八分合之一。腸胃之長，凡五丈八尺四寸，受水谷九斗二升一合合之大半，此腸胃所受水谷之數也。","bh":"","notes":[],"pending":true},{"id":"ls32-2","tags":[],"yw":"平人則不然，胃滿則腸虛，腸滿則胃虛，更虛更滿，故氣得上下，五髒安定，血脈和利，精神乃居，故神者，水谷之精氣也。故腸胃之中，當留谷二斗，水一斗五升；故平人日再後，後二升半，一日中五升，七日五七三斗五升，而留水谷盡矣；故平人不食飲七日而死者，小谷精氣津液皆盡故也。","bh":"","notes":[],"pending":true}]},
{"id":"ls33","book":"灵枢","no":33,"title":"海论","titleTw":"海論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls33-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞刺法於夫子，夫子之所言，不離於營衛血氣。夫十二經脈者，內屬於腑髒，外絡於肢節，夫子乃合之於四海乎。岐伯答曰：人亦有四海，十二經水。經水者，皆注於海，海有東西南北，命曰四海。黃帝曰：以人應之奈何？岐伯曰：人有髓海，有血海，有氣海，有水谷之海，凡此四者，以應四海也。黃帝曰：遠乎者，夫子之合人天地四海也，願聞應之奈何？岐伯曰：必先明知陰陽表滎腧所在，四海定矣。黃帝曰：定之奈何？岐伯曰：胃者水谷之海，其輸上在氣街（衝），下至三裏；衝脈者，爲十二經之海，其輸上在於大杼，下出於巨虛之上下廉；羶中者，爲氣之海，其輸上在於柱骨之上下，前在於人迎，腦爲髓之海，其輸上在於其蓋，下在風府。","bh":"","notes":[],"pending":true},{"id":"ls33-2","tags":[],"yw":"黃帝曰：凡此四海者，何利何害？何生何敗？岐伯曰：得順者生，得逆者敗；知調者利，不知調者害。黃帝曰：四海之逆順奈何？岐伯曰：氣海有餘者，氣滿胸中，悗息面赤；氣海不足，則氣少不足以言。血海有餘，則常想其身大，怫然不知其所病；血海不足，亦常想其身小，狹然不知其所病。水谷之海有餘，則腹滿；水谷之海不足，則飢不受谷食。髓海有餘，則輕勁多力，自過其度；髓海不足，則腦轉耳鳴，脛酸眩冒，目無所見，懈怠安臥。黃帝曰：餘已聞逆順，調之奈何？岐伯曰：審守其俞，而調其虛實，無犯其害，順者得復，逆者必敗。","bh":"","notes":[],"pending":true},{"id":"ls33-3","tags":[],"yw":"黃帝曰：善。","bh":"","notes":[],"pending":true}]},
{"id":"ls34","book":"灵枢","no":34,"title":"五乱","titleTw":"五亂","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls34-1","tags":[],"yw":"黃帝曰：經脈十二者，別爲五行，分爲四時，何失而亂？何得而治？岐伯曰：五行有序，四時有分，相順則治，相逆則亂。黃帝曰：何謂相順？岐伯曰：經脈十二者，以應十二月。十二月者，分爲四時。四時者，春秋冬夏，其氣各異，營衛相隨，陰陽已知，清濁不相干，如是則順之而治。黃帝曰：何爲逆而亂，岐伯曰：清氣在陰，濁氣在陽，營氣順脈，衛氣逆行，清濁相干，亂於胸中，是謂大悗。故氣亂於心，則煩心密嘿，俛首靜伏；亂於肺，則俛仰喘喝，接手以呼；亂於腸胃，是爲霍亂；亂於臂脛，則爲四厥；亂於頭，則爲厥逆，頭重眩僕。","bh":"","notes":[],"pending":true},{"id":"ls34-2","tags":[],"yw":"黃帝曰：五亂者，刺之有道乎？岐伯曰：有道以來，有道以去，審知其道，是謂身寶。黃帝曰：善。願聞其道。岐伯曰：氣在於心者，取之手少陰心主之俞；氣在於肺者，取之手太陰滎，足少陰俞，氣在於腸胃者，取之足太陰陽明，不下者，取之三裏，氣在於頭者，取之天柱大杼，不知，取足太陽滎俞；氣在於臂足，取之先去血脈，後取其陽明少陽之滎俞。黃帝曰：補瀉奈何？岐伯曰：徐入徐出，謂之導氣。補瀉無形，謂之同精。是非有餘不足也，亂氣之相逆也。","bh":"","notes":[],"pending":true},{"id":"ls34-3","tags":[],"yw":"黃帝曰：允乎哉道，明乎哉論，請着之玉版，命曰治亂也。","bh":"","notes":[],"pending":true}]},
{"id":"ls35","book":"灵枢","no":35,"title":"胀论","titleTw":"脹論","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls35-1","tags":[],"yw":"黃帝曰：脈之應於寸口，如何而脹？岐伯曰：其脈大堅以澀者，脹也。黃帝曰：何以知藏府之脹也。岐伯曰：陰爲藏，陽爲府。黃帝曰：夫氣之令人脹也，在於血脈之中耶，髒腑之內乎？岐伯曰：三者皆存焉，然非脹之舍也。黃帝曰：願聞脹之舍。岐伯曰：夫脹者，皆在於髒腑之外，排髒腑而郭胸脅，脹皮膚，故命曰脹。黃帝曰：髒腑之在胸脅腹裏之內也，若匣匱之藏禁器也，名有次舍，異名而同處，一域之中，其氣各異，願聞其故。黃帝曰：未解其意，再問。","bh":"","notes":[],"pending":true},{"id":"ls35-2","tags":[],"yw":"岐伯曰：夫胸腹，髒腑之郭也。羶中者，心主之宮城也；胃者，太倉也；咽喉、小腸者，傳送也；胃之五竅者，閭裏門戶也；廉泉、玉英者，津液之道也。故五髒六腑者，各有畔界，其病各有形狀。營氣循脈，衛氣逆爲脈脹；衛氣並脈循分爲膚脹。三裏而瀉，近者一下，遠者三下，無問虛實，工在疾瀉。黃帝曰：願聞脹形。岐伯曰：夫心脹者煩心短氣，臥不安；肺脹者，虛滿而喘咳；肝脹者，脅下滿而痛引小腹；脾脹者，善穢，四肢煩俛，體重不能勝衣，臥不安；腎脹者，腹滿引背央央然，腰髀痛。","bh":"","notes":[],"pending":true},{"id":"ls35-3","tags":[],"yw":"六府脹，胃脹者，腹滿，胃脘痛，鼻聞焦臭，妨於食，大便難；大腸脹者，腸鳴而痛濯濯，冬日重感於寒，則餐泄不化；小腸脹者，少腹慎脹，引腰而痛；膀胱脹者，少腹而氣癃；三焦脹者，氣滿於皮膚中，輕輕然而不堅；膽脹者，脅下痛脹，口中苦，善太息。凡此諸脹者，其道在一，明知逆順，針數不失，瀉虛補實，神去其室，致邪失正，真不可定，麤之所敗，謂之天命；補虛瀉實，神歸其室，久塞其空，謂之良工。黃帝曰：脹者焉生？何因而有？岐伯曰：衛氣之在身也，常然並脈，循分肉，行有逆順，陰陽相隨，乃得天和，五髒更始，四時循序，五谷乃化。","bh":"","notes":[],"pending":true},{"id":"ls35-4","tags":[],"yw":"然後厥氣在下，營衛留止，寒氣逆上，真邪相攻，兩氣相搏，乃合爲脹也。黃帝曰：善。何以解惑？岐伯曰：合之於真，三合而得。帝曰：善。黃帝問於岐伯曰：脹論言無問虛實，工在疾瀉，近者一下，遠者三下，今有其三而不下者，其過焉在？岐伯對曰：此言陷於肉肓，而中氣穴者也。不中氣穴，則氣內閉，針不陷肓，則氣不行，上越中肉，則衛氣相亂，陰陽相逐。其於脹也，當瀉不瀉，氣故不下，三而不下，必更其道，氣下乃止，不下復始，可以萬全，烏有殆者乎？其於脹也，必審其彌，當瀉則瀉，當補則補，如鼓應桴，惡有不下者乎？","bh":"","notes":[],"pending":true}]},
{"id":"ls36","book":"灵枢","no":36,"title":"五癃津液别","titleTw":"五癃津液別","tags":["jingluo","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls36-1","tags":[],"yw":"黃帝問於岐伯曰：水谷入於口，輸於腸胃，其液別爲五，天寒衣薄，則爲溺與氣，天熱衣厚則爲汗，悲哀氣並則爲泣，中熱胃緩則爲唾。邪氣內逆，則氣爲之閉塞而不行，不行則爲水脹，餘知其然也，不知其何由生？願聞其道。岐伯曰：水谷皆入於口，其味有五，各注其海。津液各走其道，故三焦出氣，以溫肌肉，充皮膚，爲其津，其流而不行者爲液。天暑衣厚則腠理開，故汗出，寒留於分肉之間，聚沫則爲痛。天寒則腠理閉，氣溼不行，水下留於膀胱，則爲溺與氣。","bh":"","notes":[],"pending":true},{"id":"ls36-2","tags":[],"yw":"五髒六腑，心爲之主，耳爲之聽，目爲之候，肺爲之相，肝爲之將，脾爲之衛，腎爲之主外。故五髒六腑之津液，盡上滲於目，心悲氣並，則心系急。心系急則肺舉，肺舉則液上溢。夫心系與肺，不能常舉，乍上乍下，故欬而泣出矣。中熱則胃中消谷，消谷則蟲上下作。腸胃充郭，故胃緩，胃緩則氣逆，故唾出。五谷之津液，和合而爲膏者，內滲入於骨空，補益腦髓，而下流於陰股。陰陽不和，則使液溢而下流於陰，髓液皆減而下，下過度則虛，虛，故腰背痛而脛酸。","bh":"","notes":[],"pending":true},{"id":"ls36-3","tags":[],"yw":"陰陽氣道不通，四海閉塞，三焦不瀉，津液不化，水谷並行腸胃之中，別於回腸，留於下焦，不得滲膀胱，則下焦脹，水溢則爲水脹，此津液五別之逆順也。","bh":"","notes":[],"pending":true}]},
{"id":"ls37","book":"灵枢","no":37,"title":"五阅五使","titleTw":"五閱五使","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls37-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞刺有五官五閱，以觀五氣。五氣者，五髒之使也，五時之副也。願聞其五使當安出？岐伯曰：五官者，五髒之閱也。黃帝曰：願聞其所出，令可爲常。岐伯曰：脈出於氣口，色見於明堂，五色更出，以應五時，各如其常，經氣入髒，必當治理。帝曰：善。五色獨決於明堂乎？岐伯曰：五官已辨，闕庭必張，乃立明堂，明堂廣大，蕃蔽見外，方壁高基，引垂居外，五色乃治，平搏廣大，壽中百歲，見此者，刺之必已，如是之人者，血氣有餘，肌肉堅致，故可苦以針。","bh":"","notes":[],"pending":true},{"id":"ls37-2","tags":[],"yw":"黃帝曰：願聞五官。岐伯曰：鼻者，肺之官也；目者，肝之官也；口脣者，脾之官也；舌者，心之官也；耳者，腎之官也。黃帝曰：以官何候？岐伯曰：以候五髒。故肺病者，喘息鼻張；肝病者，眥青；脾病者，脣黃；心病者，舌卷短，顴赤；腎病者，顴與顏黑。黃帝曰：五脈安出，五色安見，其常色殆者如何？岐伯曰：五官不辨，闕庭不張，小其明堂，蕃蔽不見，又埤其牆，牆下無基，垂角去外。如是者，雖平常殆，況加疾哉。黃帝曰：五色之見於明堂，以觀五髒之氣，左右高下，各有形乎？岐伯曰：髒腑之在中也，各以次舍，左右上下，各如其度也。","bh":"","notes":[],"pending":true}]},
{"id":"ls38","book":"灵枢","no":38,"title":"逆顺肥瘦","titleTw":"逆順肥瘦","tags":["ci","zhenfa","shen"],"brief":"","pending":true,"sections":[{"id":"ls38-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞針道於夫子，衆多畢悉矣。夫子之道，應若失，而據未有堅然者也。夫子之問學熟乎，將審察於物而心生之乎？岐伯曰：人之爲道者，上合於天，下合於地，中合於人事，必有明法，以起度數，法式檢押，乃後可傳焉。故匠人不能釋尺寸而意短長，廢繩墨而起平水也，工人不能置規而爲圓，去矩而爲方。知用此者，固自然之物，易用之教，逆順之常也。黃帝曰：願聞自然奈何？岐伯曰：臨深決水，不用功力，而水可竭也。循拙決衝，而經可通也。","bh":"","notes":[],"pending":true},{"id":"ls38-2","tags":[],"yw":"此言氣之滑澀，血水清濁，行之逆順也。黃帝曰：願聞人之白黑肥瘦小長，各有數乎？岐伯曰：年質壯大，血氣充盈，膚革堅固，因加以邪，刺此者，深而留之，此肥人也。廣肩腋項，肉薄厚皮而黑色，脣臨臨然，其血黑以濁，其氣澀以遲。其爲人也，貪於取與，刺此者，深而留之，多益其數也。黃帝曰：刺瘦人奈何？岐伯曰：瘦人者，皮薄色少，肉廉廉然，薄脣輕言，其血清氣滑，易脫於氣，易損於血，刺此者，淺而疾之。黃帝曰：刺常人奈何？岐伯曰：視其白黑，各爲調之，其端正敦厚者，其血氣和調，刺此者，無失常數也。","bh":"","notes":[],"pending":true},{"id":"ls38-3","tags":[],"yw":"黃帝曰：刺壯士真骨者，奈何？岐伯曰：刺壯士真骨，堅肉緩節，監監然，此人重則氣澀血濁，刺此者，深而留之，多益其數；勁則氣滑血清，刺此者，淺而疾之。黃帝曰：刺嬰兒奈何？岐伯曰：嬰兒者，其肉脆，血少氣弱，刺此者，以豪刺，淺刺而疾拔針，日再可也。黃帝曰：臨深決水，奈何？岐伯曰：血清氣濁（滑），疾瀉之則氣竭焉。黃帝曰：循拙決衝，奈何？岐伯曰：血濁氣澀，疾瀉之，則經可通也。黃帝曰：脈行之逆順，奈何？岐伯曰：手之三陰，從髒走手；手之三陽，從手走頭；足之三陽，從頭走足；足之三陰，從足走腹。","bh":"","notes":[],"pending":true},{"id":"ls38-4","tags":[],"yw":"黃帝曰：少陰之脈獨下行，何也？岐伯曰：不然，夫衝脈者，五髒六腑之海也，五髒六腑皆稟焉。其上者，出於頏顙，滲諸陽，灌諸精；其下者，注少陰之大絡，出於氣街，循陰股內廉入膕中，伏行骭骨內，下至內踝之後屬而別。其下者，並於少陰之經，滲三陰；其前者，伏行出跗屬，下循跗，入大趾間，滲諸絡而溫肌肉。故別絡結則附上不動，不動則厥，厥則寒矣。黃帝曰：何以明之？岐伯曰：以言導之，切而驗之，其非必動，然後仍可明逆順之行也。","bh":"","notes":[],"pending":true},{"id":"ls38-5","tags":[],"yw":"黃帝曰：窘乎哉！聖人之爲道也。明於日月，微於毫釐，其非夫子，孰能道之也。","bh":"","notes":[],"pending":true}]},
{"id":"ls39","book":"灵枢","no":39,"title":"血络论","titleTw":"血絡論","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls39-1","tags":[],"yw":"黃帝曰：願聞其奇邪而不在經者。岐伯曰：血絡是也。黃帝曰：刺血絡而僕者，何也？血出而射者，何也？血少黑而濁者，何也？血出清而半爲汁者，何也？拔針而腫者，何也？血出若多若少而面色蒼蒼者，何也？拔針而面色不變而煩悗者，何也？多出血而不動搖者，何也？願聞其故。岐伯曰：脈氣盛而血虛者，刺之則脫氣，脫氣則僕。血氣俱盛而陰氣多者，其血滑，刺之則射；陽氣蓄積，久留而不瀉者，其血黑以濁，故不能射。新飲而液滲於絡，而未合和於血也，故血出而汁別焉；其不新飲者，身中有水，久則爲腫。","bh":"","notes":[],"pending":true},{"id":"ls39-2","tags":[],"yw":"陰氣積於陽，其氣因於絡，故刺之血未出而氣先行，故腫。陰陽之氣，其新相得而未和合，因而瀉之，則陰陽俱脫，表裏相離，故脫色而蒼蒼然。刺之血出多，色不變而煩悗者，刺絡而虛經，虛經之屬於陰者，陰脫，故煩悗。陰陽相得而合爲痹者，此爲內溢於經，外注於絡。如是者，陰陽俱有餘，雖多出血而弗能虛也。黃帝曰：相之奈何？岐伯曰：血脈者，盛堅橫以赤，上下無常處，小者如針，大者如筋，則而瀉之萬全也，故無失數矣。失數而反，各如其度。","bh":"","notes":[],"pending":true},{"id":"ls39-3","tags":[],"yw":"黃帝曰：針入而肉着者，何也？岐伯曰：熱氣因於針，則針熱，熱則內着於針，故堅焉。","bh":"","notes":[],"pending":true}]},
{"id":"ls40","book":"灵枢","no":40,"title":"阴阳清浊","titleTw":"陰陽清濁","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls40-1","tags":[],"yw":"黃帝曰：餘聞十二經脈，以應十二經水者，其五色各異，清濁不同，人之血氣若一，應之奈何？岐伯曰：人之血氣，苟能若一，則天下爲一矣，惡有亂者乎？黃帝曰：餘問一人，非問天下之衆。岐伯曰：夫一人者，亦有亂氣，天下之象，亦有亂人，其合爲一耳。黃帝曰：願聞人氣之清濁。岐伯曰：受谷者濁，受氣者清。清者注陰，濁者注陽。濁而清者，上出於咽，清而濁者，則下行。清濁相干，命曰亂氣。黃帝曰：夫陰清而陽濁，濁者有清，清者有濁，清濁別之奈何？岐伯曰：氣之大別，清者上注於肺，濁者下走於胃。","bh":"","notes":[],"pending":true},{"id":"ls40-2","tags":[],"yw":"胃之清氣，上出於口；肺之濁氣，下注於經，內積於海。黃帝曰：諸陽皆濁，何陽濁甚乎？岐伯曰：手太陽獨受陽之濁，手太陰獨受陰之清；其清者上走空竅，其濁者下行諸經。諸陰皆清，足太陰獨受其濁。黃帝曰：治之奈何？岐伯曰：清者其氣滑，濁者其氣澀，此氣之常也。故刺陰者，深而留之；刺陽者，淺而疾之；清濁相干者，以數調之也。","bh":"","notes":[],"pending":true}]},
{"id":"ls41","book":"灵枢","no":41,"title":"阴阳系日月","titleTw":"陰陽系日月","tags":["ci","jingluo","zhenfa"],"brief":"","pending":true,"sections":[{"id":"ls41-1","tags":[],"yw":"黃帝曰：餘聞天爲陽，地爲陰，日爲陽，月爲陰，其合之於人，奈何？岐伯曰：腰以上爲天，腰以下爲地，故天爲陽，地爲陰，故足之十二經脈，以應爲十二月，月生於水，故在下者爲陰；手之十指，以應十日，日主火，故在上者爲陽。黃帝曰：合之於脈，奈何？岐伯曰：寅者，正月之生陽也，主左足之少陽；未者，六月，主右足之少陽。卯者，二月，主左足之太陽；午者，五月，主右足之太陽。辰者，三月，主左足之陽明；巳者，四月，主右足之陽明。","bh":"","notes":[],"pending":true},{"id":"ls41-2","tags":[],"yw":"此兩陽合於前，故曰陽明。申者，七月之生陰也，主右足之少陰；丑者，十二月，主左足之少陰；酉者，八月，主右足之太陰；子者，十一月，主左足之太陰；戌者，九月，主右足之厥陰；亥者，十月，主左足之厥陰；此兩陰交盡，故曰厥陽。甲主左手之少陽；己主右手之少陽；乙主左手之太陽，戊主右手之太陽；丙主左手之陽明，丁主右手之陽明，此兩火並合，故爲陽明。庚主右手之少陰，癸主左手之少陰，辛主右手之太陰，壬主左手之太陰。故足之陽者，陰中之少陽也；足之陰者，陰中之太陰也。","bh":"","notes":[],"pending":true},{"id":"ls41-3","tags":[],"yw":"手之陽者，陽中之太陽也；手之陰者，陽中之少陰也。腰以上者爲陽，腰以下者爲陰。其於五髒也，心爲陽中之太陽，肺爲陰中之少陰，肝爲陰中少陽，脾爲陰中之至陰，腎爲陰中之太陰。黃帝曰：以治之奈何？岐伯曰：正月二月三月，人氣在左，無刺左足之陽；四月五月六月，人氣在右，無刺右足之陽，七月八月九月，人氣在右，無刺右足之陰，十月十一月十二月，人氣在左，無刺左足之陰。黃帝曰：五行以東方爲甲乙木主春。春者，蒼色，主肝，肝者，足厥陰也。","bh":"","notes":[],"pending":true},{"id":"ls41-4","tags":[],"yw":"今乃以甲爲左手之少陽，不合於數，何也？岐伯曰：此天地之陰陽也，非四時五行之以次行也。且夫陰陽者，有名而無形，故數之可十，離之可百，散之可千，推之可萬，此之謂也。","bh":"","notes":[],"pending":true}]},
{"id":"ls42","book":"灵枢","no":42,"title":"病传","titleTw":"病傳","tags":["ci","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls42-1","tags":[],"yw":"黃帝曰：餘受九針於夫子，而私覽於諸方，或有導引行氣，喬摩、灸、熨、刺、?、飲藥之一者，可獨守耶，將盡行之乎？岐伯曰：諸方者，衆人之方也，非一人之所盡行也。黃帝曰：此乃所謂守一勿失，萬物畢者也。今餘已聞陰陽之要，虛實之理，傾移之過，可治之屬，願聞病之變化，淫傳絕敗而不可治者，可得聞乎？岐伯曰：要乎哉問也，昭乎其如日醒，窘乎其如夜瞑，能被而服之，神與俱成，畢將服之，神自得之，生神之理，可着於竹帛，不可傳於子孫。","bh":"","notes":[],"pending":true},{"id":"ls42-2","tags":[],"yw":"黃帝曰：何謂日醒？岐伯曰：明於陰陽，如惑之解，如醉之醒。黃帝曰：何謂夜瞑？岐伯曰：瘖乎其無聲，漠乎其無形，折毛發理，正氣橫傾，淫邪泮衍，血脈傳溜，大氣入髒，腹痛下淫，可以致死，不可以致生。黃帝曰：大氣入髒，奈何？岐伯曰：病先發於心，一日而之肺，三日而之肝，五日而之脾，三日不已，死。冬夜半，夏日中。病先發於肺，三日而之肝，一日而之脾，五日而之胃，十日不已，死。冬日入，夏日出。病先發於肝，三日而之脾，五日而之胃，三日而之腎，三日不已，死。","bh":"","notes":[],"pending":true},{"id":"ls42-3","tags":[],"yw":"冬日入，夏蚤食。病先發於脾，一日而之胃，二日而之腎，三日而之膂膀胱，十日不已，死。冬人定，夏晏食。病先發於胃，五日而之腎，三日而之膂膀胱，五日而上之心，二日不已，死，冬夜半，夏日昳。病先發於腎，三日而之膂膀胱，三日而上之心，三日而之小腸，三日不已，死。冬大晨，夏晏晡。病先發於膀胱，五日而之腎，一日而之小腸，一日而之心，二日不已，死。冬雞鳴，夏下晡。諸病以次相傳，如是者，皆有死期，不可刺也；間一髒及二、三、四髒者，乃可刺也。","bh":"","notes":[],"pending":true}]},
{"id":"ls43","book":"灵枢","no":43,"title":"淫邪发梦","titleTw":"淫邪發夢","tags":["bingji","zangxiang","yinyang"],"brief":"","pending":true,"sections":[{"id":"ls43-1","tags":[],"yw":"黃帝曰：願聞淫邪泮衍，奈何？岐伯曰：正邪從外襲內，而未有定舍，反淫於髒，不得定處，與營衛俱行，而與魂魄飛揚，使人臥不得安而喜夢；氣淫於腑，則有餘於外，不足於內；氣淫於髒，則有餘於內，不足於外。黃帝曰：有餘不足，有形乎？岐伯曰：陰氣盛，則夢涉大水而恐懼；陽氣盛，則夢大火而燔?；陰陽俱盛，則夢相殺。上盛則夢飛，下盛則夢墮；甚飢則夢取，甚飽則夢予；肝氣盛，則夢怒，肺氣盛，則夢恐懼、哭泣、飛揚；心氣盛，則夢善笑恐畏；脾氣盛，則夢歌、身體重不舉；腎氣盛，則夢腰脊兩解不屬。","bh":"","notes":[],"pending":true},{"id":"ls43-2","tags":[],"yw":"凡此十二盛者，至而瀉之，立已。厥氣客於心，則夢見丘山煙火；客於肺，則夢飛揚，見金鐵之奇物；客於肝，則夢山林樹木；客於脾，則夢見丘陵大澤，壞屋風雨；客於腎，則夢臨淵，沒居水中；客於膀胱，則夢遊行；客於胃，則夢飲食；客於大腸，則夢田野；客於小腸，則夢聚邑衝衢；客於膽，則夢斗訟自刳；客於陰器，則夢接內；客於項，則夢斬首；客於脛，則夢行走而不能前，及居深地窌苑中；客於股肱，則夢禮節拜起；客於胞?，則夢溲便。","bh":"","notes":[],"pending":true},{"id":"ls43-3","tags":[],"yw":"凡此十五不足者，至而補之立已也。","bh":"","notes":[],"pending":true}]},
{"id":"ls44","book":"灵枢","no":44,"title":"顺气一日分为四时","titleTw":"順氣一日分爲四時","tags":["ci","bingji","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls44-1","tags":[],"yw":"黃帝曰：夫百病之所始生者，必起於燥溫寒暑風雨陰陽喜怒飲食居處，氣合而有形，得髒而有名，餘知其然也。夫百病者，多以旦慧晝安，夕加夜甚，何也？岐伯曰：四時之氣使然。黃帝曰：願聞四時之氣。岐伯曰：春生，夏長，秋收，冬藏，是氣之常也，人亦應之，以一日分爲四時，朝則爲春，日中爲夏，日入爲秋，夜半爲冬。朝則人氣始生，病氣衰，故旦慧；日中人氣長，長則勝邪，故安；夕則人氣始衰，邪氣始生，故加；夜半人氣入髒，邪氣獨居於身，故甚也。","bh":"","notes":[],"pending":true},{"id":"ls44-2","tags":[],"yw":"黃帝曰：有時有反者何也？岐伯曰：是不應四時之氣，髒獨主其病者，是必以髒氣之所不勝時者甚，以其所勝時者起也。黃帝曰：治之奈何？岐伯曰：順天之時，而病可與期。順者爲工，逆者爲麤。黃帝曰：善，餘聞刺有五變，以主五輸。願聞其數。岐伯曰：人有五髒，五髒有五變。五變有五輸，故五五二十五輸，以應五時。黃帝曰：願聞五變。岐伯曰：肝爲牡藏，其色青，其時春，其音角，其味酸，其日甲乙；心爲牡藏，其色赤，其時夏，其日丙丁，其音徵，其味苦；脾爲牝藏，其色黃，其時長夏，其日戊己，其音宮，其味甘；肺爲牝藏，其色白，其音商，其時徵，其日庚辛，其味辛；腎爲牝藏，其色黑，其時冬，其日壬癸，其音羽，其味鹹。","bh":"","notes":[],"pending":true},{"id":"ls44-3","tags":[],"yw":"是爲五變。黃帝曰：以主五輸奈何？藏主冬，冬刺井；色主春，春刺滎；時主夏，夏刺輸；音主長夏，長夏刺經；味主秋，秋刺合。是謂五變，以主五輸。黃帝曰：諸原安和，以致五輸。岐伯曰：原獨不應五時，以經合之，以應其數，故六六三十六輸。黃帝曰：何謂藏主冬，時主夏，音主長夏，味主秋，色主春。願聞其故。岐伯曰：病在藏者，取之井；病變於色者，取之滎；病時間時甚者，取之輸；病變於音者，取之經；經滿而血者，病在胃；及以飲食不節得病者，取之於合，故命曰味主合。","bh":"","notes":[],"pending":true},{"id":"ls44-4","tags":[],"yw":"是謂五變也。","bh":"","notes":[],"pending":true}]},
{"id":"ls45","book":"灵枢","no":45,"title":"外揣","titleTw":"外揣","tags":["ci","zhenfa","zangxiang"],"brief":"","pending":true,"sections":[{"id":"ls45-1","tags":[],"yw":"餘聞九針九篇，餘親受其調，頗得其意。夫九針者，始於一而終於九，然未得其要道也。夫九針者，小之則無內，大之則無外，深不可爲下，高不可爲蓋，恍惚無竅，流溢無極，畲知其合於天道人事四時之變也，然餘願雜之毫毛，渾束爲一，可乎？岐伯曰：明乎哉問也，非獨針道焉，夫治國亦然。黃帝曰：餘願聞針道，非國事也。岐伯曰：夫治國者，夫惟道焉，非道，何可小大深淺，雜合而爲一乎。黃帝曰：願卒聞之。岐伯曰：日與月焉，水與鏡焉，鼓與響焉。","bh":"","notes":[],"pending":true},{"id":"ls45-2","tags":[],"yw":"夫日月之明，不失其影，水鏡之察，不失其形，鼓響之應，不後其聲，動搖則應和，盡得其情。黃帝曰：窘乎哉！昭昭之明不可蔽，其不可蔽，不失陰陽也。合而察之，切而驗之，見而得之，若清水明鏡之不失其形也。五音不彰，五色不明，五髒波蕩，若是則內外相襲，若鼓之應桴，響之應聲，影之似形。故遠者，司外揣內，近者，司內揣外，是謂陰陽之極，天地之蓋，請藏之靈蘭之室，弗敢使泄也。","bh":"","notes":[],"pending":true}]},
{"id":"ls46","book":"灵枢","no":46,"title":"五变","titleTw":"五變","tags":["bingji","zangxiang","yinyang"],"brief":"","pending":true,"sections":[{"id":"ls46-1","tags":[],"yw":"黃帝問於少俞曰：餘聞百疾之始期也，必生於風雨寒暑，循毫毛而入腠理，或復還，或留止，或爲風腫汗出，或爲消癉，或爲寒熱，或爲留痹，或爲積聚。奇邪淫溢，不可勝數，願聞其故。夫同時得病，或病此，或病彼，意者天之爲人生風乎，何其異也？少俞曰：夫天之生風者，非以私百姓也，其行公平正直，犯者得之，避者得無殆，非求人而人自犯之。黃帝曰：一時遇風，同時得病，其病各異，願聞其故。少俞曰：善乎其問！請論以比匠人。匠人磨斧斤，礪刀削斷材木。","bh":"","notes":[],"pending":true},{"id":"ls46-2","tags":[],"yw":"木之陰陽，尚有堅脆，堅者不入，脆者皮弛，至其交節，而缺斤斧焉。夫一木之中，堅脆不同，堅者則剛，脆者易傷，況其材木之不同，皮之厚薄，汁之多少，而各異耶。夫木之蚤花先生葉者，遇春霜烈風，則花落而葉萎；久曝大旱，則脆木薄皮者，枝條汁少而葉萎；久陰淫雨，則薄皮多汁者，皮漉而淺；卒風暴起，則剛脆之木，根搖而葉落。凡此五者，各有所傷，況於人乎！黃帝曰：以人應木，奈何？少俞答曰：木之所傷也，皆傷其枝。枝之剛脆而堅，未成傷也。","bh":"","notes":[],"pending":true},{"id":"ls46-3","tags":[],"yw":"人之有常病也，亦因其骨節皮膚腠理之不堅固者，邪之所舍也，故常爲病也。黃帝曰：人之善病風厥漉汗者，何以候之？少俞答曰：內不堅，腠理疏，則善病風。黃帝曰：何以候肉之不堅也？少俞答曰：膕肉不堅，而無分理。理者麤理，麤理而皮不致者，腠理疏。此言其渾然者。黃帝曰：人之善病消癉者，何以候之？少俞答曰：五髒皆柔弱者，善病消癉。黃帝曰：何以知五髒之柔弱也？少俞答曰：夫柔弱者，必有剛強，剛強多怒，柔者易傷也。黃帝曰：何以候柔弱之與剛強？少俞答曰：此人薄皮膚，而目堅固以深者，長衝直腸，其心剛，剛則多怒，怒則氣上逆，胸中蓄積，血氣逆留，髖皮充肌，血脈不行，轉而爲熱，熱則消肌膚，故爲消癉。","bh":"","notes":[],"pending":true},{"id":"ls46-4","tags":[],"yw":"此言其人暴剛而肌肉弱者也。黃帝曰：人之善病寒熱者，何以候之？少俞答曰：小骨弱肉者，善病寒熱。黃帝曰：何以候骨之小大，肉之堅脆，色之不一也？少俞答曰：顴骨者，骨之本也。顴大則骨大，顴小則骨小。皮膚薄而其肉無(月囷)，其臂懦懦然，其地色殆然，不與其天同色，污然獨異，此其候也。然後臂薄者，其髓不滿，故善病寒熱也。黃帝曰：何以候人之善病痹者？少俞答曰：麤理而肉不堅者，善病痹。黃帝曰：痹之高下有處乎？少俞答曰：欲知其高下者，各視其部。","bh":"","notes":[],"pending":true},{"id":"ls46-5","tags":[],"yw":"黃帝曰：人之善病腸中積聚者，何以候之？少俞答曰：皮膚薄而不澤，肉不堅而淖澤。如此，則腸胃惡，惡則邪氣留止，積聚乃傷脾胃之間，寒溫不次，邪氣稍至。蓄積留止，大聚乃起。黃帝曰：餘聞病形，已知之矣！願聞其時。少俞答曰：先立其年，以知其時。時高則起，時下則殆，雖不陷下，當年有衝道，其病必起，是謂因形而生病，五變之紀也。","bh":"","notes":[],"pending":true}]},
{"id":"ls47","book":"灵枢","no":47,"title":"本藏","titleTw":"本藏","tags":["jingluo","zhenfa","bingji"],"brief":"","pending":true,"sections":[{"id":"ls47-1","tags":[],"yw":"黃帝問於岐伯曰：人之血氣精神者，所以奉生而周於性命者也；經脈者，所以行血氣而營陰陽、濡筋骨，利關節者也；衛氣者，所以溫分肉，充皮膚，肥腠理，司開闔者也；志意者，所以御精神，收魂魄，適寒溫，和喜怒者也。是故血和則經脈流行，營復陰陽，筋骨勁強，關節清利矣；衛氣和則分肉解利，皮膚調柔，腠理致密矣；志意和則精神專直，魂魄不散，悔怒不起，五髒不受邪矣；寒溫和則六腑化谷，風痹不作，經脈通利，肢節得安矣，此人之常平也。","bh":"","notes":[],"pending":true},{"id":"ls47-2","tags":[],"yw":"五髒者，所以藏精神血氣魂魄者也；六腑者，所以化水谷而行津液者也。此人之所以具受於天也，無愚智賢不肖，無以相倚也。然有其獨盡天壽，而無邪僻之病，百年不衰，雖犯風雨卒寒大暑，猶有弗能害也；有其不離屏蔽室內，無怵惕之恐，然猶不免於病，何也？願聞其故。岐伯對曰：窘乎哉問也。五髒者，所以參天地，副陰陽，而運四時，化五節者也；五髒者，固有小大、高下、堅脆、端正、偏傾者，六腑亦有小大、長短、厚薄、結直、緩急。凡此二十五者，各不同，或善或惡，或吉或兇，請言其方。","bh":"","notes":[],"pending":true},{"id":"ls47-3","tags":[],"yw":"心小則安，邪弗能傷，易傷以憂；心大則憂，不能傷，易傷於邪。心高則滿於肺中，悗而善忘，難開以言；心下，則藏外，易傷於寒，易恐以言。心堅，則藏安守固；心脆則善病消癉熱中。心端正，則和利難傷；心偏傾則操持不一，無守司也。肺小，則少飲，不病喘喝；肺大則多飲，善病胸痹、喉痹、逆氣。肺高，則上氣，肩息咳；肺下則居賁迫肺，善脅下痛。肺堅則不病，咳上氣；肺脆，則苦病消痹易傷。肺端正，則和利難傷；肺偏傾，則胸偏痛也。","bh":"","notes":[],"pending":true},{"id":"ls47-4","tags":[],"yw":"肺小則髒安，無脅下之病；肝大則逼胃迫咽，迫咽則苦膈中，且脅下痛。肝高，則上支賁切，脅挽爲息賁；肝下則逼胃脅下空，脅下空則易受邪。肝堅則藏安難傷；肝脆則善病消痹，易傷。肝端正，則和利難傷；肝偏傾，則脅下痛也。脾小，則髒安，難傷於邪也；脾大，則苦湊(月少)而痛，不能疾行。脾高，則(月少)引季脅而痛；脾下則下歸於大腸，下加於大腸，則髒苦受邪。脾堅，則髒安難傷；脾脆，則善病消痹易傷。脾端正，則和利難傷；脾偏傾，則善滿善脹也。","bh":"","notes":[],"pending":true},{"id":"ls47-5","tags":[],"yw":"腎小，則髒安難傷；腎大，則善病腰痛，不可以俛仰，易傷以邪。腎高，則苦背膂痛，不可以俛仰；腎下則腰尻痛，不可以俛仰，爲狐疝。腎堅，則不病腰背痛；腎脆，則善病消癉，易傷。腎端正，則和利難傷；腎偏傾，則苦腰尻痛也。凡此二十五變者，人之所苦常病。黃帝曰：何以知其然也？岐伯曰：赤色小理者，心小；麤理者，心大。無(骨曷)(骨虧)者，心高；(骨曷)(骨虧)小、短、舉者，心下。(骨曷)(骨虧)長者，心下堅；(骨曷)(骨虧)弱小以薄者，心脆。","bh":"","notes":[],"pending":true},{"id":"ls47-6","tags":[],"yw":"(骨曷)(骨虧)直下不舉者，心端正；(骨曷)(骨虧)倚一方者，心偏傾也。白色小理者，肺小；麤理者，肺大。巨肩反膺陷喉者，肺高；合腋張脅者，肺下。好肩背厚者，肺堅；肩背薄者，肺脆。背膺厚者，肺端正；脅偏疏者，肺偏傾也。青色小理者，肝小；麤理者，肝大。廣胸反骹者，肝高；合脅兔骹者，肝下。胸脅好者，肝堅；脅骨弱者，肝脆。膺腹好相得者，肝端正；脅骨偏舉者，肝偏傾也。黃色小理者，脾小；麤理者，脾大。揭脣者，脾高；脣下縱者，脾下。","bh":"","notes":[],"pending":true},{"id":"ls47-7","tags":[],"yw":"脣堅者，脾堅；脣大而不堅者，脾脆。脣上下好者，脾端正；脣偏舉者，脾偏傾也。黑色小理者，腎小；麤理者，腎大。高耳者，腎高；耳後陷者，腎下。耳堅者，腎堅；耳薄而不堅者，腎脆。耳好前居牙車者，腎端正；耳偏高者，腎偏傾也。凡此諸變者，持則安，減則病也。帝曰：善。然非餘之所問也，願聞人之有不可病者，至盡天壽，雖有深擾大恐，怵惕之志，猶不能減也，甚寒大熱，不能傷也；其有不離屏蔽室內，又無怵惕之恐，然不免於病者，何也？願聞其故。","bh":"","notes":[],"pending":true},{"id":"ls47-8","tags":[],"yw":"岐伯曰：五髒六腑，邪之舍也，請言其故。五髒皆小者，少病，苦憔心，大愁擾；五髒皆大者，緩於事，難使以擾。五髒皆高者，好高舉措；五髒皆下者，好出人下。五髒皆堅者，無病；五髒皆脆者，不離於病。五髒皆端正者，和利得人心；五髒皆偏傾者，邪心而善盜，不可以爲人平，反復言語也。黃帝曰：願聞六腑之應。岐伯答曰：肺合大腸，大腸者，皮其應；心合小腸，小腸者，脈其應；肝合膽，膽者，筋其應；脾合胃，胃者，肉其應；腎合三焦膀胱，三焦膀胱者，腠理毫毛其應。","bh":"","notes":[],"pending":true},{"id":"ls47-9","tags":[],"yw":"黃帝曰：應之奈何？岐伯曰：肺應皮。皮厚者，大腸厚，皮薄者，大腸薄；皮緩，腹裏大者，大腸大而長；皮急者，大腸急而短；皮滑者，大腸直；皮肉不相離者，大腸結。心應脈，皮厚者，脈厚，脈厚者，小腸厚；皮薄者，脈薄，脈薄者，小腸薄；皮緩者，脈緩，脈緩者，小腸大而長；皮薄而脈衝小者，小腸小而短。諸陽經脈皆多紆屈者，小腸結。脾應肉，肉(月囷)堅大者，胃厚；肉(月囷)幺者，胃薄。肉(月囷)小而幺者，胃不堅；肉(月囷)不稱身者，胃下，胃下者，下管約不利。","bh":"","notes":[],"pending":true},{"id":"ls47-10","tags":[],"yw":"肉(月囷)不堅者，胃緩；肉(月囷)無小裏累者，胃急。肉(月囷)多少裏累者，胃結，胃結者，上管約不利也。肝應爪，爪厚色黃者，膽厚；爪薄色紅者，膽薄；爪堅色青者，膽急；爪濡色赤者，膽緩；爪直色白無約者，膽直；爪惡色黑多紋者，膽結也。腎應骨，密理厚皮者，三焦膀胱厚；麤理薄皮者，三焦膀胱薄。疏腠理者，三焦膀胱緩；皮急而無毫毛者，三焦膀胱急。毫毛美而麤者，三焦膀胱直，稀毫毛者，三焦膀胱結也。黃帝曰：厚薄美惡，皆有形，願聞其所病。","bh":"","notes":[],"pending":true},{"id":"ls47-11","tags":[],"yw":"岐伯答曰：視其外應，以知其內藏，則知所病矣。","bh":"","notes":[],"pending":true}]},
