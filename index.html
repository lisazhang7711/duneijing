{"id":"ls75","book":"灵枢","no":75,"title":"刺节真邪","titleTw":"刺節真邪","tags":["ci","bingji","zangxiang"],"brief":"本篇论刺法五节（振埃、发蒙、去爪、彻衣、解惑）与刺五邪之法，并辨真气、正气、邪气，及解结、推而上之、引而下之诸刺法。","pending":false,"sections":[{"id":"ls75-1","tags":[],"yw":"黃帝問於岐伯曰：餘聞刺有五衛，奈何？岐伯曰：固有五衛，一曰振埃，二曰發蒙，三曰去爪，四曰徹衣，五曰解惑。黃帝曰：夫子言五衛，餘未知其意。岐伯曰：振埃者，刺外經去陽病也；發蒙者，刺腑俞，去腑病也；去爪者，刺關節肢絡也；徹衣者，盡刺諸陽之奇俞也；解惑者，盡知調陰陽，補瀉有餘不足，相傾移也。黃帝曰：刺衛言振埃，夫子乃言刺外經，去陽病，餘不知其所謂也。願卒聞之。岐伯曰：振埃者，陽氣大逆，上滿於胸中，憤瞋肩息，大氣逆上，喘喝坐伏，病惡埃煙，飼不得息，請言振埃，尚疾於振埃。","bh":"黄帝问岐伯说：我听说刺法有五节（原文作五卫），是怎样的？岐伯说：固有五节，一叫振埃，二叫发蒙，三叫去爪，四叫彻衣，五叫解惑。黄帝说：夫子说五节，我还不明白它的意思。岐伯说：振埃，是刺外经以去阳病；发蒙，是刺腑俞以去腑病；去爪，是刺关节肢络；彻衣，是尽刺诸阳的奇俞；解惑，是尽知调阴阳、补泻有余不足，使偏倾者移复。黄帝说：刺节说到振埃，夫子却说是刺外经、去阳病，我还不懂它的意思，希望详尽听听。岐伯说：振埃，是阳气大逆，上满于胸中，愤瞋胀满而抬肩喘息，大气逆上，喘喝有声、坐伏不宁，厌恶尘埃烟雾，气息哽塞不得喘息。请讲讲振埃，它比振除尘埃还要快。","notes":[],"pending":false},{"id":"ls75-2","tags":[],"yw":"黃帝曰：善。取之何如？岐伯曰：取之天容。黃帝曰：其咳上氣窮拙胸痛者，取之奈何？岐伯曰：取之廉泉。黃帝曰：取之有數乎？岐伯曰：取天容者，無過一裏，取廉泉者，血變而止。帝曰：善哉。黃帝曰：刺衛言發蒙，餘不得其意。夫發蒙者，耳無所聞，目無所見，夫子乃言刺腑俞，去腑病，何輸使然，願聞其故。岐伯曰：妙乎哉問也。此刺之大約，針之極也，神明之類也，口說書卷，猶不能及也，請言發蒙耳，尚疾於發蒙也。黃帝曰：善。願卒聞之。","bh":"黄帝说：好。怎样取穴？岐伯说：取天容穴。黄帝问：那咳嗽上气、胸中穷诎而胸痛的，怎样取？岐伯说：取廉泉穴。黄帝问：取穴有法度吗？岐伯说：取天容的，进针不可超过一寸（一里）；取廉泉的，血色改变就止针。黄帝说：好啊。黄帝说：刺节说到发蒙，我不明白它的意思。发蒙，是耳无所闻、目无所见，夫子却说是刺腑俞、去腑病，用哪个输穴使它这样，希望听听其中的缘故。岐伯说：问得真妙啊。这是刺法的大要，针法的极致，属于神明一类，口说书卷还不能表达。请讲讲发蒙，它比启发蒙昧还要快。黄帝说：好。希望详尽听听。","notes":[],"pending":false},{"id":"ls75-3","tags":[],"yw":"岐伯曰：刺此者，必於日中，刺其聽宮，中其眸子，聲聞於耳，此其輸也。黃帝曰：善。何謂聲聞於耳？岐伯曰：刺邪以手堅按其兩鼻竅，而疾偃其聲，必應於針也。黃帝曰：善。此所謂弗見爲之，而無目視，見而取之，神明相得者也。黃帝曰：刺衛言去爪，夫子乃言刺關節肢絡，願卒聞之。岐伯曰：腰脊者，身之大關節也；肢脛者，人之管以趨翔也；莖垂者，身中之機，陰精之候，津液之道也。故飲食不節，喜怒不時，津液內溢，乃下留於睪，血道不通，日大不休，俛仰不便，趨翔不能。","bh":"岐伯说：刺这个病，必须在日中（正午），刺其听宫穴，使针气（中其眸子）达于瞳子，声音闻于耳，这就是它的输穴。黄帝说：好。什么叫声闻于耳？岐伯说：刺时用手紧按其两鼻孔，而急速仰卧使其出声（闭气作声），必定与针相应。黄帝说：好。这就是所谓不用目视而做到的，没有目视，却能见而取之，是神明相得的。黄帝说：刺节说到去爪，夫子却说是刺关节肢络，希望详尽听听。岐伯说：腰脊，是人身的大关节；肢胫，是人用以趋走翱翔（行走跑跳）的管（枢纽）；茎垂，是身中之机，阴精的外候，津液的道路。所以饮食不节，喜怒不时，津液内溢，于是下留于睾，血道不通，日以增大不休，俯仰不便，趋翔不能。","notes":[],"pending":false},{"id":"ls75-4","tags":[],"yw":"此病榮然有水，不上不下，鈹石所取，形不可匿，常不得蔽，故命曰去爪。帝曰：善。黃帝曰：刺衛言徹衣，夫子乃言盡刺諸陽之奇俞，未有常處也。願卒聞之。岐伯曰：是陽氣有餘，而陰氣不足，陰氣不足則內熱，陽氣有餘則外熱，內熱相搏，熱於懷炭，外畏綿帛近，不可近身，又不可近席。腠理閉塞，則汗不出，舌焦脣槁，臘干益燥，飲食不讓美惡。黃帝曰：善。取之奈何？岐伯曰：取之於其天府大杼三痕，又刺中膂，以去其熱，補足手太陰，以去其汗，熱去汗稀，疾於徹衣。","bh":"这种病肿然有水，不上不下，用铍针砭石取治，它的形不可隐藏，常常不能遮蔽，所以名叫去爪。黄帝说：好。黄帝说：刺节说到彻衣，夫子却说是尽刺诸阳的奇俞，没有固定部位，希望详尽听听。岐伯说：这是阳气有余而阴气不足，阴气不足则内热，阳气有余则外热，内热与外热相搏，热如怀抱炭火，外畏绵帛近身，不可近身，又不可近席。腠理闭塞，则汗不出，舌焦唇槁，肌肉腊干益燥，饮食不分美恶。黄帝说：好。怎样取治？岐伯说：取之于其天府、大杼三痏（三次），又刺中膂，以去其热，补足手太阴，以去其汗，热去汗少，比脱去衣服还要快。","notes":[],"pending":false},{"id":"ls75-5","tags":[],"yw":"黃帝曰：善。黃帝曰：刺衛言解惑，夫子乃言盡知調陰陽，補瀉有餘不足，相傾移也，惑何以解之？岐伯曰：大風在身，血脈偏虛，虛者不足，實者有餘，輕重不得，傾側宛伏，不知東西，不知南北，乍上乍下，乍反乍復，顛倒無常，甚於迷惑。黃帝曰：善。取之奈何？岐伯曰：瀉其有餘，補其不足，陰陽平復，用針若此，疾於解惑。黃帝曰：善。請藏之靈蘭之室，不敢妄出也。黃帝曰：餘聞刺有五邪，何謂五邪？岐伯曰：病有持癰者，有容大者，有狹小者，有熱者，有寒者，是謂五邪。","bh":"黄帝说：好。黄帝说：刺节说到解惑，夫子却说是尽知调阴阳、补泻有余不足、使偏倾移复，那惑要怎样解除？岐伯说：大风在身，血脉偏虚，虚的不足，实的有余，轻重不得，倾侧宛伏，不知东西，不知南北，忽上忽下，忽反忽复，颠倒无常，比迷惑还厉害。黄帝说：好。怎样取治？岐伯说：泻其有余，补其不足，阴阳平复，用针如此，比解除疑惑还快。黄帝说：好。请把它藏在灵兰之室，不敢妄自拿出。黄帝说：我听说刺有五邪，什么叫五邪？岐伯说：病有持痈的，有容大的，有狭小的，有热的，有寒的，这叫五邪。","notes":[],"pending":false},{"id":"ls75-6","tags":[],"yw":"黃帝曰：刺五邪奈何？岐伯曰：凡刺五邪之方，不過五章，癉熱消滅，腫聚散亡，寒痹益溫，小者益陽；大者必去，請道其方。凡刺癰邪，無迎隴，易俗移性。不得膿，脆道更行，去其鄉，不安處所乃散亡，諸陰陽過癰者，取之其輸瀉之。凡刺大邪，日以小，泄奪其有餘，乃益虛。剽其通，針其邪，肌肉親視之，毋有反其真，刺諸陽分肉間。凡刺小邪，日以大，補其不足，乃無害。視其所在，迎之界，遠近盡至，其不得外侵而行之，乃自費，刺分肉間。","bh":"黄帝问：刺五邪怎样？岐伯说：凡刺五邪之法，不过五章：瘅热消灭，肿聚散亡，寒痹益温，小的益阳；大的必去，请说其方。凡刺痈邪，不要迎其陇（隆盛之势），要移易其俗其性。不得脓的，从柔脆的道更行，去其乡（离开它的居处），不安于处所就散亡了；诸阴阳经过痈处的，取其输穴泻之。凡刺大邪，使它日渐变小，泄夺其有余，就日益虚。剽通其道，针刺其邪，肌肉相亲附而视之，不要违反其真，刺诸阳经分肉之间。凡刺小邪，使它日渐变大，补其不足，就没有害。视其所在，迎之于界，远近之气尽至，它不得外侵而行，就自行消耗，刺在分肉间。","notes":[],"pending":false},{"id":"ls75-7","tags":[],"yw":"凡刺熱邪，越而蒼，出遊不歸，乃無病。爲開通，辟門戶，使邪得出，病乃已。凡刺寒邪，日以溫，徐往徐來，致其神。門戶已閉，氣不分，虛實得調，其氣存也。黃帝曰：官針奈何？岐伯曰：刺癰者，用鈹針；刺大者，用鋒針；刺小者，用員利針；刺熱者，用纔針；刺寒者，用毫針也。請言解論，與天地相應，與四時相副，人參天地，故可爲解。下有漸洳，上生葦蒲，此所以知形氣之多少也。陰陽者，寒暑也，熱則滋雨而在上，根莖少汁，人氣在外，皮膚緩，腠理開，血氣減，汗大泄，皮淖澤。","bh":"凡刺热邪，使邪气越散而清（苍），出游不归，就没有病了。为它开通，辟开门户，使邪得出，病就好了。凡刺寒邪，使日渐温和，徐往徐来（慢进慢出），以招致其神。门户已闭，气不分散，虚实得以调，其气就保存了。黄帝问：官针怎样？岐伯说：刺痈的，用铍针；刺大的，用锋针；刺小的，用员利针；刺热的，用镵针（原文作才针）；刺寒的，用毫针。请讲讲解论，与天地相应，与四时相副，人参天地，所以可以为解。下面有低湿的渐洳（泥沼），上面就生苇蒲，这就是用来知道形气多少的方法。阴阳，就是寒暑：热则雨水滋润而在上，根茎少汁，人气在外，皮肤缓，腠理开，血气减，汗大泄，皮肤濡润。","notes":[],"pending":false},{"id":"ls75-8","tags":[],"yw":"寒則地凍水冰，人氣在中，皮膚致，腠理閉，汗不出，血氣強，肉堅澀。當是之時，善行水者，不能往冰，善穿地者，不能擊凍，善用針者，亦不能取四厥，血脈凝結，堅搏不往來者，亦未可即柔。故行水者，必待天溫，冰釋凍解，而水可行，地可穿也。人脈猶是也。治厥者，必先熨調和其經，掌與腋，肘與腳，項與脊以調之，火氣已通，血脈乃行。然後視其病，脈淖澤者，刺而平之；堅緊者，破而散之，氣下乃止，此所謂以解結者也。用針之類，在於調氣，氣積於胃，以通營衛，各行其道。","bh":"寒则地冻水冰，人气在中，皮肤致密，腠理闭，汗不出，血气强，肉坚涩。在这个时候，善于行水的，不能在冰上行；善于穿地的，不能凿击冻土；善用针的，也不能取四肢厥逆，血脉凝结、坚搏而不往来的，也不可立即柔化它。所以行水的，必须等待天温，冰释冻解，然后水可行，地可穿。人的血脉也是如此。治疗厥逆的，必须先用熨法调和其经，掌与腋、肘与脚、项与脊以调之，热气已通，血脉乃行。然后视其病，脉濡润的，刺而平之；坚紧的，破而散之，气下就止针，这就是所谓的以解结。用针之类，在于调气；气积于胃，以通营卫，各行其道。","notes":[],"pending":false},{"id":"ls75-9","tags":[],"yw":"宗氣留於海，其下者，注於氣街，其上者，走於息道。故厥在於足，宗氣不下，脈中之血，凝而留止，弗之火調，弗能取之。用針者，必先察其經絡之實虛，切而循之，按而彈之，視其應動者，乃後取之而下之。六經調者，謂之不病，雖病，謂之自已也。一經上實下虛而不通者，此必有橫絡盛加於大經，令之不通，視而瀉之，此所謂解結也。上寒下熱，先刺其項太陽，久留之，已刺則熨項與肩胛，令熱下合乃止，此所謂推而上之者也。上熱下寒，視其虛脈而陷之於經絡者，取之，氣下乃止，此所謂引而下之者也。","bh":"宗气留于海（气海），它下行的，注于气街；它上行的，走于息道。所以厥在于足，宗气不下，脉中之血凝而留止，不用火（熨灸）调，就不能取治它。用针的，必须先察其经络的实虚，切而循之，按而弹之，视其应动之处，然后取之而使之下行。六经调和的，叫做不病，虽有病，也叫做自己会好的。一经上实下虚而不通的，这必定有横络盛加于大经，使它不通，视而泻之，这就是所谓的解结。上寒下热的，先刺其项部太阳经，久留针，刺过就熨项与肩胛，使热气下合才止，这就是所谓的推而上之。上热下寒的，视其虚脉而陷于经络的，取之，气下才止，这就是所谓的引而下之。","notes":[],"pending":false},{"id":"ls75-10","tags":[],"yw":"大熱遍身，狂而妄見妄聞妄言，視足陽明及大絡取之，虛者補之，血而實者瀉之。因其偃臥，居其頭前，以兩手四指挾按頸動脈，久持之，卷而切，推下至缺盆中，而復止如前，熱去乃止，此所謂推而散之者也。黃帝曰：有一脈生數十病者，或痛，或癰，或熱，或寒，或癢，或痹，或不仁，變化無窮，其故何也？岐伯曰：此皆邪氣之所生也。黃帝曰：餘聞氣者，有真氣，有正氣，有邪氣。何謂真氣？岐伯曰：真氣者，所受於天，與谷氣並而充身也。正氣者，正風也，從一方來，非實風，又非虛風也。","bh":"大热遍身，发狂而妄见、妄闻、妄言，视足阳明及大络取之，虚的补之，血实的泻之。让他仰卧，居其头前，用两手四指挟按颈动脉，久久持之，卷而切之，推下至缺盆中，然后重复如前，热去才止，这就是所谓的推而散之。黄帝说：有一条脉发生数十种病的，或痛，或痈，或热，或寒，或痒，或痹，或不仁，变化无穷，这是什么缘故？岐伯说：这都是邪气所生的。黄帝说：我听说气有真气，有正气，有邪气。什么叫真气？岐伯说：真气，是所受于天，与谷气相并而充养全身的。正气，就是正风，从一方而来，既不是实风，也不是虚风。","notes":[],"pending":false},{"id":"ls75-11","tags":[],"yw":"邪氣者，虛風之賊傷人也，其中人也深，不能自去。正風者，其中人也淺，合而自去，其氣來柔弱，不能勝真氣，故自去。虛邪之中人也，灑晰動形，起毫毛而發腠理。其入深，內搏於骨，則爲骨痹；搏於筋，則爲筋攣；搏於脈中，則爲血閉，不通則爲癰。搏於肉，與衛氣相搏，陽勝者，則爲熱，陰勝者，則爲寒。寒則真氣去，去則虛，虛則寒搏於皮膚之間。其氣外發，腠理開，毫毛搖，氣往來行，則爲癢。留而不去，則痹。衛氣不行，則爲不仁。虛邪偏容於身半，其入深，內居榮衛，榮衛稍衰，則真氣去，邪氣獨留，發爲偏枯。","bh":"邪气，是虚风之贼伤人，它中人也深，不能自行去。正风，它中人也浅，合而自去，它的气来柔弱，不能胜过真气，所以自去。虚邪之中人，洒晰（恶寒战栗）动人形体，起毫毛而开发腠理。它入得深，内搏于骨，就为骨痹；搏于筋，就为筋挛；搏于脉中，就为血闭，不通就为痈。搏于肉，与卫气相搏，阳胜的就为热，阴胜的就为寒。寒则真气离去，去则虚，虚则寒搏于皮肤之间。其气外发，腠理开，毫毛摇，气往来流行，就为痒。留而不去，就为痹。卫气不行，就为不仁。虚邪偏客于身半，它入得深，内居荣卫，荣卫稍衰，则真气离去，邪气独留，就发为偏枯。","notes":[],"pending":false},{"id":"ls75-12","tags":[],"yw":"其邪氣淺者，脈偏痛。虛邪之入於身也深，寒與熱相搏，久留而內着，寒勝其熱，則骨疼肉枯；熱勝其寒，則爛肉腐肌爲膿，內傷骨，內傷骨爲骨蝕。有所疾前筋，筋屈不得伸，邪氣居其間而不反，發爲筋溜。有所結，氣歸之，衛氣留之，不得反，津液久留，合而爲腸溜。久者，數歲乃成，以手按之柔，已有所結，氣歸之，津液留之，邪氣中之，凝結日以易甚，連以聚居，爲昔瘤。以手按之堅，有所結，深中骨，氣因於骨，骨與氣並，日以益大，則爲骨疽。","bh":"那邪气浅的，脉偏痛。虚邪之入于身也深，寒与热相搏，久留而内着：寒胜其热，则骨疼肉枯；热胜其寒，则烂肉腐肌为脓，内伤骨，内伤骨就为骨蚀。若邪留于前筋，筋屈不得伸，邪气居其间而不返，发为筋溜。有所结，气归之，卫气留之，不得返，津液久留，合而为肠溜，久的，数岁才成，用手按之柔软。已经有所结，气归之，津液留之，邪气中之，凝结日以益甚，连以聚居，为昔瘤，用手按之坚硬。有所结，深中于骨，气因于骨，骨与气并，日以益大，则为骨疽。","notes":[],"pending":false},{"id":"ls75-13","tags":[],"yw":"有所結，中於肉，宗氣歸之，邪留而不去，有熱則化而爲膿，無熱則爲肉疽。凡此數氣者，其發無常處，而有常名也。","bh":"有所结，中于肉，宗气归之，邪留而不去，有热就化而为脓，无热就为肉疽。凡这数种气（病变），它们发作没有固定部位，而有一定的名称。","notes":[],"pending":false}]},
{"id":"ls76","book":"灵枢","no":76,"title":"卫气行","titleTw":"衛氣行","tags":["jingluo","zhenfa","zangxiang"],"brief":"本篇论卫气一昼夜五十周于身的循行路线、与二十八宿日行之数相应，以及按水下百刻候气所在、逢时而刺的时间针刺法。","pending":false,"sections":[{"id":"ls76-1","tags":[],"yw":"黃帝問於岐伯曰：願聞衛氣之行，出入之合，何如？岐伯曰：歲有十二月，日有十二辰，子午爲經，卯酉爲緯。天周二十八宿，而一面七星，四七二十八星。房昴爲緯，虛張爲經。是故房至畢爲陽，昴至心爲陰。陽主晝，陰主夜。故衛氣之行，一日一夜五十周於身，晝日行於陽二十五周，夜行於陰二十五周，周於五藏。是故平旦陰盡，陽氣出於目，目張則氣上行於頭，循項下足太陽，循背下至小趾之端。其散者，別於目銳眥，下手太陽，下至手小指之間外側。","bh":"黄帝问岐伯说：希望听听卫气的运行、出入的会合，是怎样的？岐伯说：岁有十二月，日有十二辰，子午为经，卯酉为纬。天周二十八宿，而一面七星，四七二十八星。房昴为纬，虚张为经。所以房至毕为阳，昴至心为阴。阳主昼，阴主夜。所以卫气的运行，一日一夜五十周于身，白昼行于阳二十五周，夜间行于阴二十五周，周行于五脏。所以平旦阴尽，阳气出于目，目张则气上行于头，循项下足太阳，循背下至小趾之端。其散行的，别于目锐眦，下手太阳，下至手小指之间外侧。","notes":[],"pending":false},{"id":"ls76-2","tags":[],"yw":"其散者，別於目銳眥，下足少陽，注小趾次趾之間。以上循手少陽之分側，下至小指之間。別者以上至耳前，合於頷脈，注足陽明以下行，至跗上，入五趾之間。其散者，從耳下下手陽明，入大指之間，入掌中。其至於足也，入足心，出內踝，下行陰分，復合於目，故爲一周。是故日行一舍，人氣行一周與十分身之八；日行二舍，人氣行三周於身與十分身之六；日行三舍，人氣行於身五周與十分身之四；日行四舍，人氣行於身七周與十分身之二；日行五舍，人氣行於身九周；日行六舍，人氣行於身十周與十分身之八；日行七舍，人氣行於身十二周在身與十分身之六；日行十四舍，人氣二十五周於身有奇分與十分身之二，陽盡於陰，陰受氣矣。","bh":"其散行的，别于目锐眦，下足少阳，注于小趾次趾之间。以上循手少阳之分侧，下至小指之间。别者以上至耳前，合于颔脉，注足阳明以下行，至跗上，入五趾之间。其散者，从耳下下手阳明，入大指之间，入掌中。其至于足的，入足心，出内踝，下行阴分，复合于目，所以为一周。所以日行一舍，人气行一周又十分身之八；日行二舍，人气行三周于身又十分身之六；日行三舍，人气行于身五周又十分身之四；日行四舍，人气行于身七周又十分身之二；日行五舍，人气行于身九周；日行六舍，人气行于身十周又十分身之八；日行七舍，人气行于身十二周又十分身之六；日行十四舍，人气二十五周于身有奇分又十分身之二，阳尽于阴，阴受气了。","notes":[],"pending":false},{"id":"ls76-3","tags":[],"yw":"其始入於陰，常從足少陰注於腎，腎注於心，心注於肺，肺注於肝，肝注於脾，脾復注於腎爲周。是故夜行一舍，人氣行於陰藏一周與十分藏之八，亦如陽行之二十五周，而復合於目。陰陽一日一夜，合有奇分十分身之四，與十分藏之二，是故人之所以臥起之時，有早晏者，奇分不盡故也。黃帝曰：衛氣之在於身也，上下往來不以期，候氣而刺之，奈何？伯高曰：分有多少，日有長短，春秋冬夏，各有分理，然後常以平旦爲紀，以夜盡爲始。是故一日一夜，水下百刻，二十五刻者，半日之度也，常如是毋已，日入而止，隨日之長短，各以爲紀而刺之。","bh":"它开始入于阴，常从足少阴注于肾，肾注于心，心注于肺，肺注于肝，肝注于脾，脾复注于肾为一周。所以夜行一舍，人气行于阴脏一周又十分藏之八，也如阳行之二十五周，而复合于目。阴阳一日一夜，合有奇分十分身之四，与十分藏之二，所以人之所以卧起之时有早有晚的，是奇分不尽的缘故。黄帝问：卫气之在于身，上下往来不以定期，候气而刺之，该怎样？伯高说：分有多少，日有长短，春秋冬夏，各有分理，然后常以平旦为纪，以夜尽为始。所以一日一夜，水下百刻，二十五刻是半日的度数，常如此而不已，日入而止，随日之长短，各以为纪而刺之。","notes":[],"pending":false},{"id":"ls76-4","tags":[],"yw":"謹候其時，病可與期，失時反候者，百病不治。故曰：刺實者，刺其來也，刺虛者，刺其去也。此言氣存亡之時，以候虛實而刺之，是故謹候氣之所在而刺之，是謂逢時。在於三陽，必候其氣在於陽而刺之，病在於三陰，必候其氣在陰分而刺之。水下一刻，人氣在太陽；水下二刻，人氣在少陽；水下三刻，人氣在陽明；水下四刻，人氣在陰分。水下五刻，人氣在太陽；水下六刻，人氣在少陽；水下七刻，人氣在陽明；水下八刻，人氣在陰分。水下九刻，人氣在太陽；水下十刻，人氣在少陽；水下十一刻，人氣在陽明；水下十二刻，人氣在陰分。","bh":"谨慎地候其时，病就可以预期而愈；失时反候的，百病不治。所以说：刺实的，刺其气来的时候；刺虚的，刺其气去的时候。这是说气存亡之时，以候虚实而刺之，所以谨慎地候气之所在而刺之，这叫逢时。病在于三阳，必候其气在于阳而刺之；病在于三阴，必候其气在阴分而刺之。水下一刻，人气在太阳；水下二刻，人气在少阳；水下三刻，人气在阳明；水下四刻，人气在阴分。水下五刻，人气在太阳；水下六刻，人气在少阳；水下七刻，人气在阳明；水下八刻，人气在阴分。水下九刻，人气在太阳；水下十刻，人气在少阳；水下十一刻，人气在阳明；水下十二刻，人气在阴分。","notes":[],"pending":false},{"id":"ls76-5","tags":[],"yw":"水下十三刻，人氣在太陽；水下十四刻，人氣在少陽；水下十五刻，人氣在陽明；水下十六刻，人氣在陰分。水下十七刻，人氣在太陽；水下十八刻，人氣在少陽；水下十九刻，人氣在陽明；水下二十刻，人氣在陰分。水下二十一刻，人氣在太陽；水下二十二刻，人氣在少陽；水下二十三刻，人氣在陽明；水下二十四刻，人氣在陰分。水下二十五刻，人氣在太陽，此半日之度也。從房至畢一十四舍水下五十刻，日行半度，回行一舍，水下三刻與七分刻之四。","bh":"水下十三刻，人气在太阳；水下十四刻，人气在少阳；水下十五刻，人气在阳明；水下十六刻，人气在阴分。水下十七刻，人气在太阳；水下十八刻，人气在少阳；水下十九刻，人气在阳明；水下二十刻，人气在阴分。水下二十一刻，人气在太阳；水下二十二刻，人气在少阳；水下二十三刻，人气在阳明；水下二十四刻，人气在阴分。水下二十五刻，人气在太阳，这是半日的度数。从房至毕一十四舍，水下五十刻，日行半度，回行一舍，水下三刻又七分刻之四。","notes":[],"pending":false},{"id":"ls76-6","tags":[],"yw":"大要曰：常以日之加於宿上也，人氣在太陽，是故日行一舍，人氣行三陽行與陰分，常如是無已，天與地同紀，紛紛紛紛，終而復始，一日一夜水下百刻而盡矣。","bh":"大要说：常以日加于宿上（日行加临某宿）的时候，人气在太阳。所以日行一舍，人气行三阳行与阴分，常如此而不已，天与地同纪，纷纷然往来不绝，终而复始，一日一夜水下百刻而尽。","notes":[],"pending":false}]},
{"id":"ls77","book":"灵枢","no":77,"title":"九宫八风","titleTw":"九宮八風","tags":["yunqi","zhenfa","bingji"],"brief":"本篇以太一依八节移居九宫的时序为纲，论八方虚风所伤脏腑部位与所致病变，强调避虚邪之风当如避矢石。","pending":false,"sections":[{"id":"ls77-1","tags":[],"yw":"太一常以冬至之日，居葉蟄之宮四十六日，明日居天留四十六日，明日居倉門四十六日，明日居陰洛四十五日，明日居天宮四十六日，明日居玄委四十六日，明日居倉果四十六日，明日居新洛四十五日，明日復居葉蟄之宮，曰冬至矣。太一日遊，以冬至之日，居葉蟄之宮，數所在日，從一處至九日，復返於一。常如是無已，終而復始。太一移日，天必應之以風雨，以其日風雨則吉，歲美民安少病矣。先之則多雨，後之則多汗。太一在冬至之日有變，佔在君；太一在春分之日有變，佔在相；太一在中宮之日有變，佔在吏；太一在秋分之日有變，佔在將；太一在夏至之日有變，佔在百姓。","bh":"太一常以冬至之日，居叶蛰之宫四十六日，明日居天留四十六日，明日居仓门四十六日，明日居阴洛四十五日，明日居天宫四十六日，明日居玄委四十六日，明日居仓果四十六日，明日居新洛四十五日，明日复居叶蛰之宫，叫做冬至了。太一日游，以冬至之日居叶蛰之宫，数其所在之日，从一处至九日，复返于一，常如此而不已，终而复始。太一移日（移宫之日），天必以风雨相应；在它当日有风雨则吉，岁美民安少病。在它之前的则多雨，在它之后的则多旱（原文作多汗）。太一在冬至之日有变（风雨异常），占在君；太一在春分之日有变，占在相；太一在中宫之日有变，占在吏；太一在秋分之日有变，占在将；太一在夏至之日有变，占在百姓。","notes":[],"pending":false},{"id":"ls77-2","tags":[],"yw":"所謂有變者，太一居五宮之日，病風折樹木，揚沙石，各以其所主，佔貴賤。因視風所從來而佔之，風從其所居之鄉來爲實風，主生，長養萬物；從其衝後來爲虛風，傷人者也，主殺，主害者。謹候虛風而避之，故聖人日避虛邪之道，如避矢石然，邪弗能害，此之謂也。是故太一入徙立於中宮，乃朝八風，以佔吉兇也。風從南方來，名曰大弱風，其傷人也，內舍於心，外在於脈，氣主熱。風從西南方來，名曰謀風，其傷人也，內舍於脾，外在於肌，其氣主爲弱。","bh":"所谓有变的，是太一居五宫之日，危害之风折树木、扬沙石。各以其所主，占其贵贱。就观察风所从来而占之：风从它（太一）所居之乡来的为实风，主生，长养万物；从它的冲后来的为虚风，是伤人的，主杀，主害。谨慎地候虚风而避之，所以圣人日日避虚邪之道，如避矢石一样，邪就不能伤害，说的就是这个。所以太一入徙立于中宫，就朝（占候）八风，以占吉凶。风从南方来，名叫大弱风，它伤人的，内舍于心，外在于脉，气主热。风从西南方来，名叫谋风，它伤人的，内舍于脾，外在于肌，其气主为弱。","notes":[],"pending":false},{"id":"ls77-3","tags":[],"yw":"風從西方來，名曰剛風，其傷人也，內舍於肺，外在於皮膚，其氣主爲燥。風從西北方來，名曰折風，其傷人也，內舍於小腸，外在於手太陽脈，脈絕則溢，脈閉則結不通，善暴死。風從北方來，名曰大剛風，其傷人也，內舍於腎，外在於骨與肩背之膂筋，其氣主爲寒也。風從東北方來，名曰兇風，其傷人也，內舍於大腸，外在於兩脅腋骨下及肢節。風從東方來，名曰嬰兀風，其傷人也，內舍於肝，外在於筋紐，其氣主爲身溼。風從東南方來，名曰弱風，其傷人也，內舍於胃，外在肌肉，其氣主體重。","bh":"风从西方来，名叫刚风，它伤人的，内舍于肺，外在于皮肤，其气主为燥。风从西北方来，名叫折风，它伤人的，内舍于小肠，外在于手太阳脉；脉绝则（血）溢，脉闭则结而不通，容易暴死。风从北方来，名叫大刚风，它伤人的，内舍于肾，外在于骨与肩背的膂筋，其气主为寒。风从东北方来，名叫凶风，它伤人的，内舍于大肠，外在于两胁腋骨下及肢节。风从东方来，名叫婴儿风（原文作婴兀风），它伤人的，内舍于肝，外在于筋纽，其气主为身湿。风从东南方来，名叫弱风，它伤人的，内舍于胃，外在肌肉，其气主体重（身体沉重）。","notes":[],"pending":false},{"id":"ls77-4","tags":[],"yw":"此八風皆從其虛之鄉來，乃能病人。三虛相搏，則爲暴病卒死。兩實一虛，病則爲淋露寒熱。犯其兩溼之地，則爲痿。故聖人避風，如避矢石焉。其有三虛而偏中於邪風，則爲僕偏枯矣。","bh":"这八风都是从其虚之乡来的，才能使人发病。三虚相搏（相合），就为暴病卒死。两实一虚，病就为淋露寒热。犯其雨湿之地，就为痿。所以圣人避风，如避矢石一样。若有三虚而偏中于邪风的，就成为仆倒偏枯了。","notes":[],"pending":false}]},
{"id":"ls78","book":"灵枢","no":78,"title":"九针论","titleTw":"九針論","tags":["ci","jingluo","zhenfa"],"brief":"本篇论九针取法天地九数而得名、形制长短与主治，并及身形应九野与天忌日、形志病治、五脏六腑气血病证诸条目。","pending":false,"sections":[{"id":"ls78-1","tags":[],"yw":"黃帝曰：餘聞九針於夫子，衆多博大矣，餘猶不能寤，敢問九針焉生，何因而有名？岐伯曰：九針者，天地之大數也，始於一而終於九。故曰：一以法天，二以法地，三以法人，四以法時，五以法音，六以法律，七以法星，八以法風，九以法野。黃帝曰：以針應九之數，奈何？岐伯曰：夫聖人之起天地之數也，一而九之，故以立九野。九而九之，九九八十一，以起黃鍾數焉，以針應數也。一者，天也。天者，陽也。五藏之應天者肺，肺者，五藏六府之蓋也，皮者，肺之合也，人之陽也。","bh":"黄帝说：我听夫子讲九针，内容众多博大，我还不能领悟，敢问九针是怎样产生的，因什么而得名？岐伯说：九针，是天地的大数，始于一而终于九。所以说：一以法天，二以法地，三以法人，四以法时，五以法音，六以法律，七以法星，八以法风，九以法野（分野）。黄帝问：以针应九之数，怎样？岐伯说：圣人起天地之数，一而九之，所以立九野；九而九之，九九八十一，以起黄钟之数，以针应此数。一，是天。天，是阳。五脏之应天的是肺，肺是五脏六腑的华盖，皮是肺之合，是人的阳。","notes":[],"pending":false},{"id":"ls78-2","tags":[],"yw":"故爲之治針，必以大其頭而銳其末，令無得深入而陽氣出。二者，地也。人之所以應土者，肉也。故爲之治針，必筩其身而員其末，令無得傷肉分，傷則氣得竭。三者，人也。人之所以成生者，血脈也。故爲之治針，必大其身而員其末，令可以按脈物陷，以致其氣，令邪氣獨出。四者，時也。時者，四時八風之客於經絡之中，爲瘤病者也。故爲之治針，必筩其身而鋒其末，令可以瀉熱出血，而痼病竭。五者，音也。音者，冬夏之分，分於子午，陰與陽別，寒與熱爭，兩氣相搏，合爲癰膿者也。","bh":"所以为它制针，必须大其头而锐其末，使它不能深入而阳气出。二，是地。人之所以应土的是肉。所以为它制针，必筩（筒）其身而圆其末，使它不能伤肉分，伤则气得竭。三，是人。人之所以成其生命的是血脉。所以为它制针，必大其身而圆其末，使它可以按脉陷而不伤，以招致其气，使邪气独出。四，是时。时，是四时八风之客于经络之中而成为瘤病（久病）的。所以为它制针，必筩其身而锋其末，使它可以泻热出血，而痼病竭（愈）。五，是音。音，是冬夏之分，分于子午，阴与阳别，寒与热争，两气相搏，合为痈脓的。","notes":[],"pending":false},{"id":"ls78-3","tags":[],"yw":"故爲之治針，必令其末如劍鋒，可以取大膿。六者，律也。律者，調陰陽四時而合十二經脈，虛邪客於經絡而爲暴痹者也。故爲之治針，必令尖如釐，且員其銳，中身微大，以取暴氣。七者，星也。星者，人之七竅，邪之所客於經，而爲痛痹，合於經絡者也。故爲之治針，令尖如蚊虻喙，靜以徐往，微以久留，正氣因之，真邪俱往，出針而養者也。八者，風也。風者，人之股肱八節也。八正之虛風，八風傷人，內舍於骨解腰脊節腠理之間爲深痹也。故爲之治針，必長其身，鋒其末，可以取深邪遠痹。","bh":"所以为它制针，必令其末如剑锋，可以取大脓。六，是律。律，是调阴阳四时而合十二经脉，虚邪客于经络而为暴痹的。所以为它制针，必令其尖如牦（原文作厘，牛尾毛），且圆其锐，中身微大，以取暴气。七，是星。星，是人的七窍；邪之客于经而成为痛痹，合于经络的。所以为它制针，令尖如蚊虻的喙，静以徐往，微以久留，正气因之（随之而来），真邪俱往，出针而养。八，是风。风，是人的股肱八节；八正之虚风、八风伤人，内舍于骨解腰脊节腠理之间，成为深痹。所以为它制针，必长其身，锋其末，可以取深邪远痹。","notes":[],"pending":false},{"id":"ls78-4","tags":[],"yw":"九者，野也。野者，人之節解皮膚之間也。淫邪流溢於身，如風水之狀，而留不能過於機關大節者也。故爲之治針，令尖如挺，其鋒微員，以取大氣之不能過於關節者也。黃帝曰：針之長短有數乎？岐伯曰：一曰鐵針者，取法於巾針，去末寸半，卒銳之，長一寸六分，主熱在頭身也。二曰員針，取法於絮針，其身而卵其鋒，長一寸六分，主治分間氣。三曰提針，取法於黍粟之銳，長三寸半，主按脈取氣，令邪出。四曰鋒針，取法於絮針，其身，鋒其末，長一寸六分，主癰熱出血。","bh":"九，是野。野，是人的节解皮肤之间；淫邪流溢于身，如风水之状，而留滞不能过于机关大节的。所以为它制针，令尖如挺（竹挺），其锋微圆，以取大气之不能过于关节的。黄帝问：针的长短有定数吗？岐伯说：一叫镵针（原文作铁针），取法于巾针，去末寸半，突然使之尖锐，长一寸六分，主热在头身。二叫员针，取法于絮针，筩其身而卵其锋，长一寸六分，主治分间（分肉之间）气。三叫𫔂针（原文作提针），取法于黍粟之锐，长三寸半，主按脉取气，令邪出。四叫锋针，取法于絮针，筩其身，锋其末，长一寸六分，主痈热出血。","notes":[],"pending":false},{"id":"ls78-5","tags":[],"yw":"五曰鈹針，取法於劍鋒，廣二分半，長四寸，主大癰膿，兩熱爭者也。六曰員利針，取法於釐針，微大其末，反小其身，令可深內也，長一寸六分。主取癰痹者也。七曰毫針，取注於毫毛，長一寸六分，主寒熱痛痹在絡者也。八曰長針，取法於綦針，長七寸，主取深邪遠痹者也。九曰大針，取法於鋒針，其鋒微員，長四寸，主取大氣不出關節者也。針形畢矣，此九針大小長短法也。黃帝曰：願聞身形，應九野，奈何？岐伯曰：請言身形之應九野也，左足應立春，其日戊寅己丑。","bh":"五叫铍针，取法于剑锋，宽二分半，长四寸，主大痈脓、两热相争的。六叫员利针，取法于牦针，微大其末，反小其身，使可以深纳，长一寸六分，主取痈痹。七叫毫针，取法于毫毛，长一寸六分，主寒热痛痹在络的。八叫长针，取法于綦针，长七寸，主取深邪远痹。九叫大针，取法于锋针，其锋微圆，长四寸，主取大气不出关节的。针形说完了，这就是九针大小长短的法度。黄帝问：希望听听身形应九野，怎样？岐伯说：请讲身形之应九野：左足应立春，其日是戊寅己丑。","notes":[],"pending":false},{"id":"ls78-6","tags":[],"yw":"左脅應春分，其日乙卯。左手應立夏，其日戊辰己巳。膺喉首頭應夏至，其日丙午。右手應立秋，其中戊申己末。右脅應秋分，其日辛酉。右足應立冬，其日戊戌己亥。腰尻下竅應冬至，其日壬子。六腑下三髒應中州，其大禁，大禁太一所在之日，及諸戊己。凡此九者，善候八正所在之處。所主左右上下身體有癰腫者，欲治之，無以其所直之日潰治之，是謂天忌日也。形東志苦，病生於脈，治之於灸刺。形苦志東，病生於筋，治之以熨引。形東志東，病生於肉，治之以針石。","bh":"左胁应春分，其日乙卯。左手应立夏，其日戊辰己巳。膺喉首头应夏至，其日丙午。右手应立秋，其日戊申己未。右胁应秋分，其日辛酉。右足应立冬，其日戊戌己亥。腰尻下窍应冬至，其日壬子。六腑及膈下三脏应中州，其大禁（大禁之日），是太一所在之日，以及诸戊己日。凡此九者，善于候八正所在之处。所主左右上下身体有痈肿的，要治它，不要在它所值之日溃治（刺破排脓），这叫天忌日。形乐志苦（原文作形东志苦）的，病生于脉，治之于灸刺。形苦志乐的，病生于筋，治之以熨引（药熨导引）。形乐志乐的，病生于肉，治之以针石。","notes":[],"pending":false},{"id":"ls78-7","tags":[],"yw":"形苦志苦，病生於咽喝，治之以甘藥。形數驚恐，筋脈不通，病生於不仁，治之以按摩謬藥。是謂形。五髒氣，心主噫，肺主咳，肝主語，脾主吞，腎主欠。六腑氣，膽爲怒，胃爲氣逆穢，大腸小腸爲泄，膀胱不約爲遺溺，下焦溢爲水。五味：酸入肝，辛入肺，苦入心，甘入脾，鹹入腎，淡入胃，是謂五味。五並：精氣並肝則憂，並心則喜，並肺則悲，並腎則恐，並脾則畏，是謂五精之氣，並於髒也。五惡：肝惡風，心惡熱，肺惡寒，腎惡燥，脾惡溼，此五髒氣所惡也。","bh":"形苦志苦的，病生于咽喝（咽喉噎塞、声音嘶哑），治之以甘药。形屡受惊恐，筋脉不通，病生于不仁，治之以按摩醪药（原文作谬药，药酒）。这就叫形。五脏气：心主噫（嗳气），肺主咳，肝主语（多语），脾主吞（吞酸、吞咽），肾主欠（呵欠）。六腑气：胆为怒，胃为气逆哕（原文作秽），大肠小肠为泄，膀胱不约为遗溺，下焦溢为水。五味：酸入肝，辛入肺，苦入心，甘入脾，咸入肾，淡入胃，这叫五味。五并：精气并于肝则忧，并于心则喜，并于肺则悲，并于肾则恐，并于脾则畏，这叫五精之气并于脏。五恶：肝恶风，心恶热，肺恶寒，肾恶燥，脾恶湿，这是五脏气所恶的。","notes":[],"pending":false},{"id":"ls78-8","tags":[],"yw":"五液：心主汗，肝主泣，肺主涕，腎主唾，脾主液，此五液所出也。五勞：久視傷血，久臥傷氣，久坐傷肉，久立傷骨，久行傷筋，此五久勞所病也。五走：酸走筋，辛走氣，苦走血，鹹走骨，甘走肉，是謂五走也。五裁：病在筋，無食酸；病在氣，無食辛；病在骨，無食鹹；病在血，無食苦；病在肉，無食甘。口嗜而欲食之，不可多也，必自裁也，命曰五裁。五發：陰病發於骨，陽病發於血，陰病發於肉，陽病發於冬，陰病發於夏。五邪：邪入於陽，則爲狂；邪入於陰，則爲血癉；邪入於陽，轉則爲癲疾；邪入於陰，轉則爲瘖；陽入於陰，病靜；陰出之於陽，病喜怒。","bh":"五液：心主汗，肝主泣（泪），肺主涕，肾主唾，脾主液（涎），这是五液所出的。五劳：久视伤血，久卧伤气，久坐伤肉，久立伤骨，久行伤筋，这是五种过久的劳所发生的病。五走：酸走筋，辛走气，苦走血，咸走骨，甘走肉，这叫五走。五裁：病在筋，不要吃酸；病在气，不要吃辛；病在骨，不要吃咸；病在血，不要吃苦；病在肉，不要吃甘。口嗜而想吃它，不可多食，必须自己节制，名叫五裁。五发：阴病发于骨，阳病发于血，阴病发于肉，阳病发于冬，阴病发于夏。五邪：邪入于阳，则为狂；邪入于阴，则为血痹（血瘅）；邪入于阳，转则为癫疾；邪入于阴，转则为瘖（失音）；阳入于阴，病静；阴出之于阳，病喜怒（多怒）。","notes":[],"pending":false},{"id":"ls78-9","tags":[],"yw":"五藏：心藏神，肺藏魄，肝藏魂，脾藏意，腎藏精志也。五主：心主脈，肺主皮，肝主筋，脾主肌，腎主骨。陽明多血多氣，太陽多血少氣，少陽多氣少血，太陰多血少氣，厥陰多血少氣，少陰多氣少血。故曰刺陽明出血氣，刺太陽出血惡氣，刺少陽出氣惡血，刺太陰出血惡氣，刺厥陰出血惡氣，刺少陰出氣惡血也。足陽明太陰爲裏表，少陽厥陰爲表裏，太陽少陰爲表裏，是謂足之陰陽也。手陽明太陰爲表裏，少陽心主爲表裏，太陽少陰爲表裏，是謂手之陰陽也。","bh":"五脏（所藏）：心藏神，肺藏魄，肝藏魂，脾藏意，肾藏精志。五主：心主脉，肺主皮，肝主筋，脾主肌，肾主骨。阳明多血多气，太阳多血少气，少阳多气少血，太阴多血少气，厥阴多血少气，少阴多气少血。所以说刺阳明出血气，刺太阳出血恶气（不宜出气），刺少阳出气恶血，刺太阴出血恶气，刺厥阴出血恶气，刺少阴出气恶血。足阳明太阴为表里，少阳厥阴为表里，太阳少阴为表里，这叫足之阴阳。手阳明太阴为表里，少阳心主为表里，太阳少阴为表里，这叫手之阴阳。","notes":[],"pending":false}]},
{"id":"ls79","book":"灵枢","no":79,"title":"岁露论","titleTw":"歲露論","tags":["yunqi","jingluo","zhenfa"],"brief":"本篇论疟疾发作有时之理、贼风邪气因腠理开闭与月相盈亏而伤人深浅不同，以及依岁露、正月朔日风向候一岁疾病的流行。","pending":false,"sections":[{"id":"ls79-1","tags":[],"yw":"黃帝問於岐伯曰：經言夏日傷暑，秋病瘧，瘧之發以時，其故何也？岐伯對曰：邪客於風府，病循膂而下，衛氣一日一夜，常大會於風府，其明日日下一節，故其日作晏，此其先客於脊背也。故每至於風府則腠理開，腠理開則邪氣入，邪氣入則病作，此所以日作尚晏也。衛氣之行風府，日下一節，二十一日下至尾底，二十二日入脊內，注於伏衝之脈，其行九日，出於缺盆之中，其氣上行，故其病稍益至。其內搏於五髒，橫連募原，其道遠，其氣深，其行遲，不能日作，故次日乃蓄積而作焉。","bh":"黄帝问岐伯说：经言夏日伤暑，秋病疟，疟的发作按时，这是什么缘故？岐伯回答说：邪客于风府，病循膂（脊）而下；卫气一日一夜常大会于风府，其明日日下一节，所以它发作日益晚，这是它先客于脊背的缘故。所以每到风府则腠理开，腠理开则邪气入，邪气入则病发作，这就是所以每日发作而渐渐晚的缘故。卫气之行于风府，日下一节，二十一日下至尾底（尾骶），二十二日入脊内，注于伏冲之脉，其行九日，出于缺盆之中，其气上行，所以其病稍稍加重。它内搏于五脏，横连募原，其道远，其气深，其行迟，不能每日发作，所以隔日蓄积而发作。","notes":[],"pending":false},{"id":"ls79-2","tags":[],"yw":"黃帝曰：衛氣每至於風府，腠理乃發，發則邪入焉。其衛氣日下一節，則不當風府，奈何？岐伯曰：風府無常，衛氣之所應，必開其腠理，氣之所舍節，則其府也。黃帝曰：善。夫風之與瘧也，相與同類，而風常在，而瘧特以時休，何也？岐伯曰：風氣留其處，瘧氣隨經絡，沉以內搏，故衛氣應，乃作也。帝曰：善。黃帝問於少師曰：餘聞四時八風之中人也，故有寒暑，寒則皮膚急而腠理閉；暑則皮膚緩而腠理開。賊風邪氣，因得以入乎？將必須八正虛邪，乃能傷人乎？少師答曰：不然。","bh":"黄帝说：卫气每至于风府，腠理才开发，开发则邪入。那卫气日下一节，就不正当风府，怎么讲？岐伯说：风府无常，卫气之所应，必开其腠理；气之所舍的节，就是它的府。黄帝说：好。那风与疟，相与同类，而风常常存在，而疟独独按时休止，为什么？岐伯说：风气留于其处，疟气随经络，沉以内搏，所以卫气相应乃发作。黄帝说：好。黄帝问少师说：我听说四时八风之中伤人，所以有寒暑：寒则皮肤急而腠理闭，暑则皮肤缓而腠理开。贼风邪气，因此得以侵入吗？还是必须八正的虚邪，才能伤人呢？少师回答说：不是这样。","notes":[],"pending":false},{"id":"ls79-3","tags":[],"yw":"賊風邪氣之中人也，不得以時，然必因其開也，其入深，其內極病，其病人也，卒暴。因其閉也，其入淺以留，其病也，徐以遲。黃帝曰：有寒溫和適，腠理不開，然有卒病者，其故何也？少師答曰：帝弗知邪入乎。雖平居其腠理開閉緩急，其故常有時也。黃帝曰：可得聞乎？少師曰：人與天地相參也，與日月相應也。故月滿則海水西盛，人血氣積，肌肉充，皮膚致，毛發堅，腠理郗，煙垢着，當是之時，雖遇賊風，其入淺不深。至其月郭空，則海水東盛，人氣血虛，其衛氣去，形獨居，肌肉減，皮膚縱，腠理開，毛發殘，膠理薄，煙垢落，當是之時，遇賊風則其入深，其病人也，卒暴。","bh":"贼风邪气之中伤人，不按固定时节，然而必定因其（腠理）开的时候：这时它入得深，它内里病极重，它发病也卒暴。因其闭的时候，它入得浅而留滞，它发病也徐缓而迟。黄帝说：有寒温和适、腠理不开，然而有突然发病的，这是什么缘故？少师回答说：帝不知道邪之侵入吗。虽是平居，其腠理开闭缓急，其原因是常有其时的。黄帝问：可以听听吗？少师说：人与天地相参，与日月相应。所以月满则海水西盛，人血气积，肌肉充，皮肤致密，毛发坚，腠理郄（闭），烟垢着（附着）；当这个时候，虽遇贼风，它入得浅而不深。到那月郭空（月缺无光）时，则海水东盛，人气血虚，其卫气去，形独居，肌肉减，皮肤纵（松弛），腠理开，毛发残，膲理（原文作胶理）薄，烟垢落；当这个时候，遇贼风则它入得深，它发病也卒暴。","notes":[],"pending":false},{"id":"ls79-4","tags":[],"yw":"黃帝曰：其有卒然暴死暴病者，何也？少師答曰：三虛者，其死暴疾也；得三實者邪不能傷人也。黃帝曰：願聞三虛。少師曰：乘年之衰，逢月之空，失時之和，因爲賊風所傷，是謂三虛。故論不知三虛，工反爲粗。帝曰：願聞三實。少師曰：逢年之盛，遇月之滿，得時之和，雖有賊風邪氣，不能危之也。黃帝曰：善乎哉論！明乎哉道！請藏之金匱，命曰三實。然，此一夫之論也。黃帝曰：願聞歲之所以皆同病者，何因而然？少師曰：此八正之候也。","bh":"黄帝问：那有突然暴死暴病的，为什么？少师回答说：三虚的，其死暴疾；得三实的，邪不能伤人。黄帝说：希望听听三虚。少师说：乘年之衰，逢月之空，失时之和，因而为贼风所伤，这叫三虚。所以论病不知三虚，医工反为粗工。黄帝说：希望听听三实。少师说：逢年之盛，遇月之满，得时之和，虽有贼风邪气，不能危害于他。黄帝说：好啊这个论述！明白啊这个道理！请藏在金匮，名叫三实。然而，这是一夫之论（一时的说法）。黄帝说：希望听听一年之中人们都同样患病的，是什么原因？少师说：这是八正的候（占候）。","notes":[],"pending":false},{"id":"ls79-5","tags":[],"yw":"黃帝曰：候之奈何？少師曰：候此者，常以冬至之日，太一立於葉蟄之宮，其至也，天必應之以風雨者矣。風雨從南方來者，爲虛風，賊傷人者也。其以夜半至也，萬民皆臥而弗犯也，故其歲民少病。其以晝至者，萬民懈惰而皆中於虛風，故萬民多病。虛邪入客於骨而不發於外，至其立春，陽氣大發，腠理開，因立春之日，風從西方來，萬民又皆中於虛風，此兩邪相搏，經氣結代者矣。故諸逢其風而遇其雨者，命曰遇歲露焉，因歲之和，而少賊風者，民少病而少死。","bh":"黄帝问：怎样候它？少师说：候这个的，常以冬至之日，太一立于叶蛰之宫，它到来时，天必以风雨相应。风雨从南方来的，为虚风，是贼伤人者。它在半夜到来的，万民都卧着而不触犯它，所以那年民少病。它在白天到的，万民懈惰在外而都中于虚风，所以万民多病。虚邪入客于骨而不发于外，到那立春，阳气大发，腠理开，因立春之日，风从西方来，万民又都中于虚风，这两邪相搏，经气就结代了。所以诸逢其风而遇其雨的，名叫遇岁露。因岁之和（岁气调和）而少贼风的，民少病而少死。","notes":[],"pending":false},{"id":"ls79-6","tags":[],"yw":"歲多賊風邪氣，寒溫不和，則民多病而死矣。黃帝曰：虛邪之風，其所傷貴賤何如，候之奈何？少師答曰：正月朔日，太一居天留之宮，其日西北風，不雨，人多死矣。正月朔日，平旦北風，春，民多死。正月朔日，平旦北風行，民病多者，十有三也。正月朔日，日中北風，夏，民多死。正月朔日，夕時北風，秋，民多死。終日北風，大病死者十有六。正月朔日，風從南方來，命曰旱鄉；從西方來，命曰白骨，將國有殃，人多死亡。正月朔日，風從東方來，發屋，揚沙石，國有大災也。","bh":"岁多贼风邪气，寒温不和，则民多病而死。黄帝问：虚邪之风，它所伤的贵贱（伤害轻重）怎样，怎样候它？少师回答说：正月朔日（初一），太一居天留之宫，其日西北风，不下雨，人多死。正月朔日，平旦北风，春天民多死。正月朔日，平旦北风行而不止，民病多的，十有三（十分之三）。正月朔日，日中北风，夏天民多死。正月朔日，夕时北风，秋天民多死。终日北风，大病死者十有六。正月朔日，风从南方来，名叫旱乡；从西方来，名叫白骨，将国有殃，人多死亡。正月朔日，风从东方来，掀屋（原文作发屋），扬沙石，国有大灾。","notes":[],"pending":false},{"id":"ls79-7","tags":[],"yw":"正月朔日，風從東南方行，春有死亡。正月朔日，天和溫不風糶賤，民不病；天寒而風，糶貴，民多病。此所謂候歲之風，殘傷人者也。二月丑不風，民多心腹病；三月戌不溫，民多寒熱；四月已不暑，民多癉病；十月申不寒，民多暴死。諸所謂風者，皆發屋，折樹木，揚沙石起毫毛，發腠理者也。","bh":"正月朔日，风从东南方行，春天有死亡。正月朔日，天气温和而不刮风，粜（谷价）贱，民不病；天寒而风，粜贵，民多病。这就是所谓候岁之风，残杀伤人的。二月丑日不刮风，民多心腹病；三月戌不温，民多寒热；四月巳不暑，民多瘅病（热病）；十月申不寒，民多暴死。诸所谓风的，都是掀屋、折树木、扬沙石、起毫毛、开发腠理的。","notes":[],"pending":false}]},
{"id":"ls80","book":"灵枢","no":80,"title":"大惑论","titleTw":"大惑論","tags":["zhenfa","bingji","zangxiang"],"brief":"本篇论五脏六腑精气皆上注于目、目系上属于脑，由此解释惑（视歧）、善忘、善饥不嗜食、不得卧、多卧等证的机理与治则。","pending":false,"sections":[{"id":"ls80-1","tags":[],"yw":"黃帝問於岐伯曰：餘嘗上於清冷之臺，中階而顧，匍匐而前，則惑。餘私異之，竊內怪之，獨瞑獨視，安心定氣，久而不解。獨博獨眩，披發長跪，俛而視之，後久之不已也。卒然自上，何氣使然？岐伯對曰：五髒六腑之精氣，皆上注於目而爲之精。精之窠爲眼，骨之精爲瞳子，筋之精爲黑眼，血之精爲絡，其窠氣之精爲白眼，肌肉之精爲約束，裹擷筋骨血氣之精，而與脈並爲系。上屬於腦，後出於項中。故邪中於項，因逢其身之虛，其入深，則隨眼系以入於腦。","bh":"黄帝问岐伯说：我曾经登上清冷之台，走到中阶而回头看，匍匐而前，就感到眩惑。我私下觉得奇怪，内心暗自诧异，独自闭目独视，安心定气，久久不能解除；独自眩转、独自眩晕，披发长跪，俯而视之，之后很久仍不停止。突然从上面（下来）时，是什么气使它这样？岐伯回答说：五脏六腑的精气，都上注于目而成为它的精（视觉）。精之窠（窝）为眼，骨之精为瞳子，筋之精为黑眼（黑睛），血之精为络（眼络），其窠气之精为白眼，肌肉之精为约束（眼睑），裹撷（包罗）筋骨血气之精，而与脉并为系（目系）。上属于脑，后出于项中。所以邪中于项，因逢其身之虚，它入得深，就随眼系以入于脑。","notes":[],"pending":false},{"id":"ls80-2","tags":[],"yw":"入於腦則腦轉，腦轉則引目系急。目系急則目眩以轉矣。邪其精，其精所中不相比也，則精散。精散則視歧，視歧見兩物。目者，五髒六腑之精也，營衛魂魄之所常營也，神氣之所生也。故神勞則魂魄散，志意亂。是故瞳子黑眼法於陰，白眼赤脈法於陽也。故陰陽合傳而精明也。目者，心使也。心者，神之舍也，故神精亂而不轉。卒然見非常處精神魂魄，散不相得，故曰惑也。黃帝曰：餘疑其然。餘每之東苑，未曾不惑，去之則復，餘唯獨爲東苑勞神乎？何其異也？岐伯曰：不然也。","bh":"入于脑则脑转（眩晕旋转），脑转则引目系急，目系急则目眩而（视物）旋转。邪（中）其精，其精所中的不相合（不相比），就精散；精散则视歧（视一为二），视歧就看见两个东西。目，是五脏六腑之精，营卫魂魄所常营运之处，神气所生之处。所以神劳则魂魄散，志意乱。所以瞳子、黑眼法于阴，白眼、赤脉法于阳，所以阴阳合传（相合而传）而精明（视觉清明）。目，是心之使；心，是神之舍，所以神精乱而不转（运转失常）。突然见到非常之处，精神魂魄散而不相得，所以叫做惑。黄帝说：我怀疑是这样。我每次到东苑，未尝不惑，离开就恢复，难道只是我替东苑劳神吗？为什么这样奇怪？岐伯说：不是这样。","notes":[],"pending":false},{"id":"ls80-3","tags":[],"yw":"心有所喜，神有所惡，卒然相惑，則精氣亂，視誤，故惑，神移乃復。是故間者爲迷，甚者爲惑。黃帝曰：人之善忘者，何氣使然？岐伯曰：上氣不足，下氣有餘，腸胃實而心肺虛。虛則營衛留於下，久之不以時上，故善忘也。黃帝曰：人之善飢而不嗜食者，何氣使然？岐伯曰：精氣並於脾，熱氣留於胃，胃熱則消谷，谷消故善飢。胃氣逆上，則胃脘寒，故不嗜食也。黃帝曰：病而不得臥者，何氣使然？岐伯曰：衛氣不得入於陰，常留於陽。留於陽則陽氣滿，陽氣滿則陽蹻盛，不得入於陰則陰氣虛，故目不瞑矣。","bh":"心有所喜，神有所恶，突然相互惑乱，就精气乱，视觉有误，所以惑；神移（精神转移）就恢复。所以轻的为迷，重的为惑。黄帝问：人善忘的，是什么气使它这样？岐伯说：上气不足，下气有余，肠胃实而心肺虚。虚则营卫留于下，久而不能按时上行，所以善忘。黄帝问：人善饥而不嗜食的，是什么气使它这样？岐伯说：精气并于脾，热气留于胃，胃热则消谷，谷消所以善饥。胃气逆上，则胃脘寒，所以不嗜食。黄帝问：病而不得卧的，是什么气使它这样？岐伯说：卫气不得入于阴，常留于阳。留于阳则阳气满，阳气满则阳𫏋盛，不得入于阴则阴气虚，所以目不瞑（不能闭目）。","notes":[],"pending":false},{"id":"ls80-4","tags":[],"yw":"黃帝曰：病目而不得視者，何氣使然？岐伯曰：衛氣留於陰，不得行於陽，留於陰則陰氣盛，陰氣盛則陰蹻滿，不得入於陽則陽氣虛，故目閉也。黃帝曰：人之多臥者，何氣使然？岐伯曰：此人腸胃大而皮膚溼，而分肉不解焉。腸胃大則衛氣留久；皮膚溼則分肉不解，其行遲。夫衛氣者，晝日常行於陽，夜行於陰，故陽氣盡則臥，陰氣盡則寤。故腸胃大，則衛氣行留久；皮膚溼，分肉不解，則行遲。留於陰也久，其氣不清，則欲瞑，故多臥矣。其腸胃小，皮膚滑以緩，分肉解利，衛氣之留於陽也久，故少瞑焉。","bh":"黄帝问：病目而不得视（眼睛闭而不能视物）的，是什么气使它这样？岐伯说：卫气留于阴，不得行于阳；留于阴则阴气盛，阴气盛则阴𫏋满，不得入于阳则阳气虚，所以目闭。黄帝问：人多卧（嗜睡）的，是什么气使它这样？岐伯说：这种人肠胃大而皮肤湿（涩滞），而分肉不解（分肉之间不滑利）。肠胃大则卫气留久；皮肤湿则分肉不解，它运行迟缓。卫气，白昼常行于阳，夜间行于阴，所以阳气尽则卧，阴气尽则寤。所以肠胃大，则卫气行留久；皮肤湿、分肉不解，则行迟。留于阴也久，其气不清，就想闭目，所以多卧。那肠胃小、皮肤滑而缓、分肉解利的，卫气之留于阳也久，所以少眠（少瞑）。","notes":[],"pending":false},{"id":"ls80-5","tags":[],"yw":"黃帝曰：其非常經也，卒然多臥者，何氣使然？岐伯曰：邪氣留於上焦，上焦閉而不通，已食若飲湯，衛氣留久於陰而不行，故卒然多臥焉。黃帝曰：善。治此諸邪，奈何？岐伯曰：先其髒腑，誅其小過，後調其氣，盛者瀉之，虛者補之，必先明知其形志之苦樂，定乃取之。","bh":"黄帝问：那不是常经（常规）的，突然多卧的，是什么气使它这样？岐伯说：邪气留于上焦，上焦闭而不通，进食或者饮汤之后，卫气久留于阴而不行，所以突然多卧。黄帝说：好。治疗这些邪气，该怎样？岐伯说：先治其脏腑，诛其小过（祛除轻微的病邪），后调其气，盛的泻之，虚的补之，必须先明知其形志的苦乐，确定之后才取治。","notes":[],"pending":false}]},
{"id":"ls81","book":"灵枢","no":81,"title":"痈疽","titleTw":"癰疽","tags":["ci","jingluo","zhenfa"],"brief":"本篇论痈疽由寒邪客于经络、血涩卫气不通、热胜肉腐成脓所致，逐一列举诸痈疽的部位形症、治法与死期，末辨痈与疽之别。","pending":false,"sections":[{"id":"ls81-1","tags":[],"yw":"黃帝曰：餘聞腸胃受谷，上焦出氣，以溫分肉，而養骨節，通腠理。中焦出氣如露，上注溪谷，而滲孫脈，津液和調，變化而赤爲血。血和則孫脈先滿溢，乃注於絡脈，皆盈，乃注於經脈，陰陽已張，因息乃行。行有經紀，周有道理，與天合同，不得休止。切而調之，從虛去實，瀉則不足，疾則氣減，留則先後。從實去虛，補則有餘，血氣已調，形氣乃持。餘已知血氣之平與不平，未知癰疽之所從生，成敗之時，死生之期，有遠近，何以度之，可得聞乎？岐伯曰：經脈留行不止，與天同度，與地合紀。","bh":"黄帝说：我听说肠胃受纳谷物，上焦出气，以温分肉，而养骨节，通腠理。中焦出气如露，上注溪谷（肌肉间隙），而渗孙脉，津液和调，变化而赤为血。血和则孙脉先满溢，乃注于络脉，皆盈，乃注于经脉，阴阳已张（充盛），因息乃行。行有经纪，周有道理，与天合同，不得休止。切（诊察）而调之，从虚去实：泻则不足，疾（出针快）则气减，留（留针）则有先后。从实去虚：补则有余，血气已调，形气乃持（相持协调）。我已经知道血气的平与不平，还不知道痈疽从哪里发生、成败之时、死生之期有远有近，怎样度量它，可以听听吗？岐伯说：经脉流行不止，与天同度，与地合纪。","notes":[],"pending":false},{"id":"ls81-2","tags":[],"yw":"故天宿失度，日月薄蝕；地經失紀，水道流溢，草萓不成，五谷不殖；徑路不通，民不往來，巷聚邑居，則別離異處。血氣猶然，請言其故。夫血脈營衛，周流不休，上應星宿，下應經數。寒邪客於經絡之中，則血泣，血泣則不通，不通則衛氣歸之，不得復反，故癰腫。寒氣化爲熱，熱勝則腐肉，肉腐則爲膿。膿不瀉則爛筋，筋爛則傷骨，骨傷則髓消，不當骨空，不得泄瀉，血枯空虛，則筋骨肌肉不相榮，經脈敗漏，燻於五髒，藏傷故死矣。黃帝曰：願盡聞癰疽之形，與忌曰名。","bh":"所以天宿失度，日月薄蚀；地经失纪，水道流溢，草萓（草木）不成，五谷不殖；径路不通，民不往来，巷聚邑居，则别离异处。血气也是如此，请说其缘故。血脉营卫，周流不休，上应星宿，下应经数。寒邪客于经络之中，则血涩（泣），血涩则不通，不通则卫气归之，不得复返，所以痈肿。寒气化为热，热胜则腐肉，肉腐则为脓。脓不泻则烂筋，筋烂则伤骨，骨伤则髓消，不当骨空（不在骨空之处），不得泄泻，血枯空虚，则筋骨肌肉不相荣，经脉败漏，熏于五脏，脏伤所以死了。黄帝说：希望详尽听听痈疽的形（形态），与忌日、名称。","notes":[],"pending":false},{"id":"ls81-3","tags":[],"yw":"岐伯曰：癰發於嗌中，名曰猛疽。猛疽不治，化爲膿，膿不瀉，塞咽，半日死。其化爲膿者，瀉則合豕膏，冷食，三日而已。發於頸，名曰夭疽。其癰大以赤黑，不急治，則熱氣下入淵腋，前傷任脈，內燻肝肺。燻肝肺，十餘日而死矣。陽留大發，消腦留項，名曰腦爍。其色不樂，項痛而如刺以針。煩心者，死不可治。發於肩及臑，名曰疵癰。其狀赤黑，急治之，此令人汗出至足，不害五髒。癰發四五日，逞焫之。發於腋下赤堅者，名曰米疽。治之以砭石，欲細而長，疏砭之，塗以豕膏，六日已，勿裹之。","bh":"岐伯说：痈发于咽中，名叫猛疽。猛疽不治，化为脓，脓不泻，塞咽，半日死。它化为脓的，泻（排脓）后给以猪膏（豕膏），冷服，三日就好了。发于颈的，名叫夭疽。它痈大而赤黑，不急治，则热气下入渊腋，前伤任脉，内熏肝肺；熏肝肺，十余日而死。阳（阳气）留滞大发、消烁于脑而留于项，名叫脑烁。其色（面色）不乐，项痛而如针刺。心烦的，死不可治。发于肩及臑（上臂）的，名叫疵痈。它状赤黑，急治之，这使人汗出至足，不害五脏；痈发四五日，及时（逞）灸（焫）之。发于腋下赤而坚的，名叫米疽。治之以砭石，针要细而长，稀疏地砭刺，涂上猪膏，六日就好，不要包扎。","notes":[],"pending":false},{"id":"ls81-4","tags":[],"yw":"其癰堅而不潰者，爲馬刀挾癭，急治之。發於胸，名曰井疽。其狀如大豆，三四日起，不早治，下入腹，不治，七日死矣。發於膺，名曰甘疽。色青，其狀如谷實柧樓，常苦寒熱，急治之，去其寒熱，十歲死，死後出膿。發於脅，名曰敗疵。敗疵者，女子之病也，灸之，其病大癰膿，治之，其中乃有生肉，大如赤小豆，坐陵翹草根各一升，以水一斗六升煮之，竭爲取三升，則強飲厚衣，坐於釜上，令汗出至足已。發於股脛，名曰股脛疽。其狀不甚變，而癰膿搏骨，不急治，三十日死矣。","bh":"那痈坚硬而不溃的，为马刀挟瘿，急治之。发于胸的，名叫井疽。它状如大豆，三四日起（发病），不早治，下入腹；不治，七日死。发于膺（胸侧）的，名叫甘疽。色青，它状如谷实栝楼，常苦寒热，急治之，去其寒热；十岁死，死后出脓。发于胁的，名叫败疵。败疵，是女子的病，灸之；其病为大痈脓，治之，其中（里面）有生肉（息肉）大如赤小豆，用剉（原文作坐）陵翘草根各一升，以水一斗六升煮之，煎至（竭为）取三升，就强饮之，厚衣，坐在釜上（熏蒸），使汗出至足就好了。发于股胫的，名叫股胫疽。它状不甚变（外形变化不大），而痈脓搏骨（蚀骨），不急治，三十日死。","notes":[],"pending":false},{"id":"ls81-5","tags":[],"yw":"發於尻，名曰銳疽。其狀赤堅大，急治之，不治，三十日死矣。發於股陰，名曰赤施。不急治，六十日死。在兩股之內，不治，十日而當死。發於膝，名曰疵癰。其狀大，癰色不變，寒熱，如堅石，勿石，石之者死，須其柔，乃石之者，生。諸癰疽之發於節而相應者，不可治也。發於陽者，百日死；發於陰者，三十日死。發於脛，名曰兔齧，其狀赤至骨，急治之，不治害人也。發於內踝，名曰走緩。其狀癰也，色不變，數石其輸，而止其寒熱，不死。","bh":"发于尻（尾骶）的，名叫锐疽。它状赤、坚、大，急治之；不治，三十日死。发于股阴（大腿内侧）的，名叫赤施。不急治，六十日死。在两股之内的，不治，十日而当死。发于膝的，名叫疵痈。它状大，痈色不变，寒热，硬如坚石，不要用砭石（刺）；用砭石的死，须等它变软，才用砭石的，生。诸痈疽之发于关节而（与关节）相应的，不可治。发于阳的，百日死；发于阴的，三十日死。发于胫的，名叫兔啮（兔啮），它状赤至骨，急治之，不治害人。发于内踝的，名叫走缓。它状是痈，色不变，屡次用砭石刺其输穴，而止其寒热，不死。","notes":[],"pending":false},{"id":"ls81-6","tags":[],"yw":"發於足上下，名曰四淫。其狀大癰，急治之，百日死。發於足傍，名曰厲癰。其狀不大，初如小指，發，急治之，去其黑者；不消輒益，不治，百日死。發於足趾，名脫癰。其狀赤黑，死不治；不赤黑，不死。不衰，急斬之，不則死矣。黃帝曰：夫子言癰疽，何以別之？岐伯曰：營衛稽留於經脈之中，則血泣而不行，不行則衛氣從之而不通，壅遏而不得行，故熱。大熱不止，熱勝，則肉腐，肉腐則爲膿。然不能陷，骨髓不爲焦枯，五髒不爲傷，故命曰癰。","bh":"发于足上下的，名叫四淫。它状是大痈，急治之；不治，百日死。发于足傍的，名叫厉痈。它状不大，初起如小指，发作时急治之，去掉它的黑（腐黑）处；不消则（辄益）渐增，不治，百日死。发于足趾的，名叫脱痈。它状赤黑的，死不治；不赤黑的，不死。不见衰减的，急速截（斩）之，不截则死。黄帝问：夫子说痈疽，怎样区别它？岐伯说：营卫稽留于经脉之中，则血涩而不行，不行则卫气随之而不通，壅遏而不得行，所以热。大热不止，热胜，则肉腐，肉腐则为脓。然而（热毒）不能陷（深入），骨髓不焦枯，五脏不被伤，所以名叫痈。","notes":[],"pending":false},{"id":"ls81-7","tags":[],"yw":"黃帝曰：何謂疽？岐伯曰：熱氣淳盛，下陷肌膚，筋髓枯，內連五髒，血氣竭，當其癰下，筋骨良肉皆無餘，故命曰疽。疽者，上之皮夭以堅，上如牛領之皮。癰者，其皮上薄以澤。此其候也。","bh":"黄帝问：什么叫疽？岐伯说：热气淳盛（盛极），下陷肌肤，筋髓枯，内连五脏，血气竭，当它痈下（痈处之下），筋骨良肉都无余（尽坏），所以名叫疽。疽，上面的皮夭（枯晦）而坚，上面像牛领（牛颈项）之皮。痈，其皮上薄而润泽。这就是它的征候。","notes":[],"pending":false}]}
);
  /* ---------- 索引：术语倒排 ---------- */
  const termKeys = Object.keys(NJ_TERMS).sort((a, b) => b.length - a.length);
  const termRe = new RegExp(termKeys.map(esc).join("|"), "g");
  const dict = new Map();                 // term -> [{ch,sec}]
  const chById = new Map();
  const secById = new Map();

  NJ_CHAPTERS.forEach(c => {
    chById.set(c.id, c);
    c.sections.forEach(s => {
      secById.set(s.id, s);
      const seen = new Set();
      (s.yw + "　" + s.bh).replace(termRe, m => { seen.add(m); return m; });
      seen.forEach(t => {
        if (!dict.has(t)) dict.set(t, []);
        dict.get(t).push({ ch: c, sec: s });
      });
    });
  });

  function hl(text) {
    return String(text).replace(termRe, m => `<span class="t" data-t="${m}">${m}</span>`);
  }
  function tagHtml(keys) {
    return (keys || []).map(k => {
      const t = NJ_TAGS[k]; if (!t) return "";
      return `<span class="tg" style="color:${t.color}">${t.name}</span>`;
    }).join("");
  }

  /* ---------- 目录 ---------- */
  let curBook = "素问";

  let tocMode = "book";

  function chapterTagSet(c) {
    const set = new Set(c.tags || []);
    (c.sections || []).forEach(x => (x.tags || []).forEach(t => set.add(t)));
    return set;
  }

  function renderTOC() {
    const toc = $("#toc");
    toc.innerHTML = "";

    const modes = document.createElement("div");
    modes.className = "toc-mode";
    modes.innerHTML = `<button class="tm${tocMode === "book" ? " on" : ""}" data-tm="book">按卷次</button><button class="tm${tocMode === "tag" ? " on" : ""}" data-tm="tag">按体系</button>`;
    modes.querySelectorAll(".tm").forEach(b => { b.onclick = () => { tocMode = b.dataset.tm; renderTOC(); }; });
    toc.appendChild(modes);

    const addItem = c => {
      const d = el("div", "toc-item" + (c.id === state.ch ? " on" : ""),
        `<span class="toc-no">${c.no}</span><span>${c.title}</span>`);
      d.dataset.id = c.id;
      d.onclick = () => openChapter(c.id);
      toc.appendChild(d);
    };

    if (tocMode === "book") {
      ["素问", "灵枢"].forEach(bk => {
        toc.appendChild(el("div", "toc-book", bk));
        NJ_CHAPTERS.filter(c => c.book === bk).sort((x, y) => x.no - y.no).forEach(addItem);
      });
      return;
    }

    const pairs = NJ_CHAPTERS.map(c => [c, chapterTagSet(c)]);
    Object.keys(NJ_TAGS).forEach(k => {
      const list = pairs.filter(x => x[1].has(k)).map(x => x[0]);
      if (!list.length) return;
      const t = NJ_TAGS[k];
      const head = el("div", "toc-book toc-tag", `${t.name}<i>${list.length} 篇</i>`);
      head.style.borderLeftColor = t.color;
      head.style.color = t.color;
      toc.appendChild(head);
      list.sort((x, y) => (x.book === y.book ? x.no - y.no : x.book < y.book ? -1 : 1)).forEach(addItem);
    });
  }

  /* ---------- 主内容 ---------- */
  const state = { ch: NJ_CHAPTERS[0].id, sec: null };

  function openChapter(id, secId) {
    if (window.NJCloseDrawers) window.NJCloseDrawers();   // 手机版 / 窄屏：选中章节后自动收抽屉
    state.ch = id; state.sec = secId || null;
    const c = chById.get(id);
    curBook = c.book;
    renderTOC();
    // 打开章节＝离开所有图表视图（旧写法在 inViz 时不收起覆盖层，导致点「素问」看不到正文）
    inViz = false;
    window.__vizKind = null;
    if (mpState.raf) { cancelAnimationFrame(mpState.raf); mpState.raf = null; }
    $("#viz").classList.remove("on");
    document.body.classList.remove("viz");
    $("#result").style.display = "none";
    $("#wrap").style.display = "flex";

    const wrap = el("div", "inner");
    wrap.appendChild(el("div", "crumb",
      `<b>${c.book}</b> · 第${c.no}篇　/　${c.sections.length}段`));
    const h = el("div", "ch-title", c.title);
    wrap.appendChild(h);
    const bs = NJ_BOOK_SUB[c.book] || NJ_BOOK_SUB["素问"];
    wrap.appendChild(el("div", "ch-sub", `${c.titleTw}　${bs.zhu} · 本篇 ${bs.ben}`));
    if (c.brief) wrap.appendChild(el("div", "ch-brief", c.brief));
    else wrap.appendChild(el("div", "ch-brief pend", "篇旨待补 —— 原文已全本录入，今译／注释分批补齐中"));
    wrap.appendChild(el("div", "ch-tags", tagHtml(c.tags)));
    // 图文互鉴：原本放在小助手面板里的图示入口，改到正文里（按本篇内容定位）
    const tzwj = tzwjHtml(c);
    if (tzwj) wrap.appendChild(el("div", "tzwj", tzwj));

    c.sections.forEach((s, i) => {
      const sec = el("div", "sec");
      sec.id = "sid-" + s.id;
      sec.dataset.sec = s.id;

      const bar = el("div", "sec-bar");
      bar.appendChild(el("span", "sec-no", String(i + 1).padStart(2, "0") + "/" + String(c.sections.length).padStart(2, "0")));
      if (s.tags && s.tags.length) {
        const tw = document.createElement("span");
        tw.style.display = "flex"; tw.style.gap = "6px"; tw.style.flexWrap = "wrap";
        tw.innerHTML = tagHtml(s.tags);
        bar.appendChild(tw);
      }
      if (s.mer) {
        const m = NJ_MERIDIANS.find(x => x.id === s.mer);
        bar.appendChild(el("button", "mini-btn mer", "经络 · " + (m ? m.short : s.mer)))
          .onclick = e => { e.stopPropagation(); openMer(s.mer); };
      }
      if (s.off) {
        bar.appendChild(el("button", "mini-btn off", "十二官 · " + s.off.join("")))
          .onclick = e => { e.stopPropagation(); openOff(s.off[0]); };
      }
      if (s.manip) {
        const mm = NJ_MANIP.find(x => x.id === s.manip);
        bar.appendChild(el("button", "mini-btn man", "手法 · " + (mm ? mm.name : "")))
          .onclick = e => { e.stopPropagation(); openManip(s.manip); };
      }
      sec.appendChild(bar);

      sec.appendChild(el("div", "yw", hl(s.yw)));
      if (s.bh) { sec.appendChild(el("div", "bh", hl(s.bh))); }
      else { sec.appendChild(el("div", "bh pend", "今译待补")); }

      if (s.notes && s.notes.length) {
        const nd = el("div", "notes");
        s.notes.forEach(n => {
          const cls = { "训": "x", "义": "y", "按": "a" }[n.w] || "";
          const row = el("div", "nt");
          row.appendChild(el("span", "nt-w " + cls, n.w));
          row.appendChild(el("span", "", hl(n.t)));
          nd.appendChild(row);
        });
        sec.appendChild(nd);
      }
      wrap.appendChild(sec);
    });

    const inner = $("#inner");
    inner.innerHTML = "";
    inner.appendChild(wrap);
    $("#main").scrollTop = 0;

    if (secId) {
      const t = document.getElementById("sid-" + secId);
      if (t) {
        t.scrollIntoView({ block: "center" });
        t.classList.add("flash");
        setTimeout(() => t.classList.remove("flash"), 1700);
      }
    }
    history.replaceState(null, "", "#" + (secId ? c.id + "/" + secId : c.id));
    setAside(defaultAside(c), "总结");
    if (window.NJMarkNav) window.NJMarkNav();

  function defaultAside(c) {
    return `<div class="card-h">${c.title}</div>

  /* ---------- 图文互鉴：本篇 → 本篇真正讲到的那张图 ----------
     显式标记（段上的 mer / off / manip）最优先，其余按正文关键词命中，
     命中不到就不显示该按钮——不做「所有篇都跳同一张图」的兜底。 */
  const NJ_VIZ_KEYS = {
    mer: NJ_MERIDIANS.map(m => ({
      id: m.id, name: m.short || m.full, sub: m.full,
      keys: [m.full, m.short, m.limb + m.yinyang, m.yinyang + m.limb]
    })),
    off: NJ_OFFICIALS.map(o => ({
      id: o.name, name: o.name, sub: o.rank,
      keys: [o.rank, o.name + "者", o.name + "主", o.name + "藏", o.name + "气", o.name]
    })),
    manip: NJ_MANIP.map(x => ({
      id: x.id, name: x.name + "法", sub: x.sub,
      keys: [x.name + "之", x.name + "而", x.name + "其", x.sub, x.name + "法"]
    }))
  };

  function vizHits(c) {
    const secs = c.sections || [];
    const hay = [c.title, c.titleTw, c.brief, (c.tags || []).join(" "),
      secs.map(s => (s.yw || "") + " " + (s.bh || "")).join(" ")].join(" ");
    const cnt = (v) => { let n = 0, i = hay.indexOf(v);
      while (i >= 0) { n++; i = hay.indexOf(v, i + v.length); } return n; };
    const explicit = { mer: [], off: [], manip: [] };
    secs.forEach(s => {
      if (s.mer) explicit.mer.push(s.mer);
      if (s.off && s.off.length) explicit.off = explicit.off.concat(s.off);
      if (s.manip) explicit.manip.push(s.manip);
    });
    const out = {};
    ["mer", "off", "manip"].forEach(kind => {
      out[kind] = NJ_VIZ_KEYS[kind].map(it => {
        let sc = 0;
        it.keys.forEach(k => {
          if (!k) return;
          [k, toTrad(k)].forEach(v => {
            if (!v) return;
            const n = cnt(v);
            if (n) sc += n * (v.length >= 4 ? 14 : v.length === 3 ? 5 : v.length === 2 ? 2 : 0.4);
          });
        });
        const ex = explicit[kind].indexOf(it.id);
        if (ex >= 0) sc += 1000;
        return { it: it, sc: sc, ex: ex < 0 ? 999 : ex };
      }).filter(x => x.sc > 0)
        .sort((a, b) => (a.ex - b.ex) || (b.sc - a.sc));   // 显式标记按文中先后，其余按相关度
    });
    return out;
  }

  function tzwjHtml(c) {
    const h = vizHits(c);
    const take = (kind, min, cap) => h[kind].filter(x => x.sc >= min).slice(0, cap);
    const btn = (kind, id, name, sub) =>
      `<button class="tzwj-bt" data-act="${kind}" data-arg="${id}"><b>${name}</b><em>${sub}</em></button>`;
    const items = []
      .concat(take("mer", 3, 3).map(x => btn("mer", x.it.id, x.it.name, "人体经络图 · " + x.it.sub)))
      .concat(take("off", 3, 4).map(x => btn("off", x.it.id, x.it.name, "十二官 · " + x.it.sub)))
      .concat(take("manip", 6, 2).map(x => btn("manip", x.it.id, x.it.name, "手法演示 · " + x.it.sub)));
    if (!items.length) return "";
    return `<div class="tzwj-h"><span class="tzwj-ic">◍</span>图文互鉴<i>本篇讲到的那几张图</i></div>
      <div class="tzwj-b">${items.join("")}</div>`;
  }

  function wxRingSVG() {
    const cx = 132, cy = 132, R = 86;
    const ang = i => (-90 + i * 72) * Math.PI / 180;
    const P = NJ_WUXING.map((x, i) =>
      [cx + R * Math.cos(ang(i)), cy + R * Math.sin(ang(i))]);
    const sheng = P.map((a, i) => {
      const b = P[(i + 1) % 5];
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const ox = mx - cx, oy = my - cy, L = Math.hypot(ox, oy) || 1;
      return `<path d="M${a[0].toFixed(1)},${a[1].toFixed(1)} Q${(mx + ox / L * 30).toFixed(1)},${(my + oy / L * 30).toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}" fill="none" stroke="#3f7a2e" stroke-width="1.2" opacity=".75" marker-end="url(#wxa-s)"/>`;
    }).join("");
    const ke = P.map((a, i) => {
      const b = P[(i + 2) % 5], t = 0.84;
      return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${(a[0] + (b[0] - a[0]) * t).toFixed(1)}" y2="${(a[1] + (b[1] - a[1]) * t).toFixed(1)}" stroke="#b02d18" stroke-width="1" stroke-dasharray="4 3" opacity=".5" marker-end="url(#wxa-k)"/>`;
    }).join("");
    const nodes = NJ_WUXING.map((w, i) => {
      const on = w.id === wxState.cur;
      return `<g class="wx-node" data-wx="${w.id}"><circle cx="${P[i][0].toFixed(1)}" cy="${P[i][1].toFixed(1)}" r="${on ? 25 : 21}" fill="${on ? w.color : njVar("--node-bg", "#f7efd8")}" stroke="${w.color}" stroke-width="${on ? 2 : 1}"/><text x="${P[i][0].toFixed(1)}" y="${(P[i][1] + 6).toFixed(1)}" text-anchor="middle" font-size="${on ? 19 : 17}" fill="${on ? "#fdf4dc" : w.color}" font-family="var(--serif)">${w.name}</text></g>`;
    }).join("");
    return `<svg viewBox="0 0 264 264" width="100%" style="max-width:264px;display:block">
      <defs>
        <marker id="wxa-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#3f7a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>

    </svg>`;
  }

  const offState = { cur: "心" };

  function renderVizOff() {
    const cx = 280, cy = 250, rx = 216, ry = 168;
    const others = NJ_OFFICIALS.filter(o => o.name !== "心");
    const wx = { 木: "#3f7a2e", 火: "#b02d18", 土: "#96650c", 金: "#5c6a86", 水: "#33409e" };

    const offPos = { 心: [cx, cy] };
    const nodes = others.map((o, i) => {
      const a = (-Math.PI / 2) + (i / others.length) * Math.PI * 2;
      const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
      offPos[o.name] = [x, y];
      const col = wx[o.wuxing] || "#6c6450";
      const on = o.name === offState.cur;
      return `<g class="off-node" data-o="${o.name}">
        <line class="off-line" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"

    const cur = NJ_OFFICIALS.find(o => o.name === offState.cur) || NJ_OFFICIALS[0];
    const centerColor = wx["火"];

    // —— 生克传变：四条通路（绿＝生克相及，红＝乘侮）
    const cbWx = NJ_WUXING.find(x => x.name === cur.wuxing) || NJ_WUXING[0];

    const cbZ = { 母: NJ_ZANG5[cbWx.shengwo], 子: NJ_ZANG5[cbWx.sheng],
                  所胜: NJ_ZANG5[cbWx.woKe], 所不胜: NJ_ZANG5[cbWx.keWo] };
    const cbPair = {
      muzi:  [cbZ.母, cbMe, "#3f7a2e", 0],
      zimu:  [cbMe, cbZ.母, "#3f7a2e", 0],
      cheng: [cbMe, cbZ.所胜, "#b02d18", 0],

    const cbArrow = (a, b, col, dash) => {
      const A = offPos[a], B = offPos[b];

      let dx = B[0] - A[0], dy = B[1] - A[1];

      const r0 = a === "心" ? 64 : 34, r1 = b === "心" ? 68 : 40;
      return `<line x1="${(A[0] + dx * r0).toFixed(1)}" y1="${(A[1] + dy * r0).toFixed(1)}"

        stroke="${col}" stroke-width="2.1" opacity="1"
        ${dash ? 'stroke-dasharray="5 3"' : ""} marker-end="url(#offa-${dash ? "k" : "s"})"/>`;
    };
    const cbLines = NJ_CB_PATHS.map(p => cbArrow.apply(null, cbPair[p.k])).join("");

    const fig = `<svg viewBox="0 0 560 500" width="100%" style="display:block">
      <defs>
        <marker id="offa-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#3f7a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
        <marker id="offa-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#b02d18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>

  function startManipAnim(m) {
    if (mpState.raf) cancelAnimationFrame(mpState.raf);
    const hand = $("#hand"), press = $("#press"), curve = $("#curve"), fb = $("#forcebar");
    const pts = [];
    mpState.speed = m.speed; mpState.amp = m.amp;
    const sp = $("#sp"), am = $("#am");
    sp.oninput = () => { mpState.speed = sp.value / 100; $("#spv").textContent = mpState.speed.toFixed(2) + "×"; };
    am.oninput = () => { mpState.amp = am.value / 100; $("#amv").textContent = mpState.amp.toFixed(2) + "×"; };
    $("#mp-toggle").onclick = e => {
      mpState.run = !mpState.run;
      e.target.textContent = mpState.run ? "暂停" : "继续";
    };

    const baseX = 240, baseY = 236;
    const loop = () => {
      if (mpState.run) mpState.t += 0.016 * mpState.speed;
      const t = mpState.t, A = mpState.amp;
      let x = baseX, y = baseY, force = 0, rot = 0;
      if (m.mode === "press") {
        y = baseY + Math.sin(t * 3) * 26 * A;
        force = Math.max(0, (Math.sin(t * 3) + 1) / 2) * A;
      } else if (m.mode === "line") {
        x = baseX + Math.sin(t * 2.2) * 130 * A;
        const yy = Math.cos(t * 2.2);
        y = baseY - 6 + (1 - yy) * 3;
        force = 0.45 * A;
      } else {
        x = baseX + Math.cos(t * 2.6) * 46 * A;
        y = baseY + Math.sin(t * 2.6) * 18 * A - 2;
        force = 0.6 * A;
        rot = Math.sin(t * 2.6) * 12;
      }
      hand.setAttribute("transform", `translate(${x},${y}) rotate(${rot})`);
      press.setAttribute("cx", x);
      press.setAttribute("cy", y + 18);
      press.setAttribute("rx", 24 + force * 46);
      press.setAttribute("ry", 10 + force * 20);
      press.setAttribute("opacity", 0.06 + force * 0.18);

      pts.push(force);
      if (pts.length > 150) pts.shift();
      const n = pts.length;
      const str = pts.map((v, i) => {
        const px = 310 + (i / 149) * 150;
        const py = 92 - v * 44;
        return px.toFixed(1) + "," + py.toFixed(1);
      }).join(" ");
      curve.setAttribute("points", str);
      fb.textContent = force.toFixed(2);
      mpState.raf = requestAnimationFrame(loop);
    };
    loop();
  }

  /* ---------- 搜索 ---------- */
  // 简体输入 → 繁体归一（映射表由构建期生成），繁体原文也能命中
  function toTrad(s) {
    if (!window.NJ_S2T) return s;
    let out = "";
    for (const ch of s) out += (window.NJ_S2T[ch] || ch);
    return out;
  }
  function doSearch(q) {
    q = q.trim();
    if (!q) return;
    if (window.NJCloseDrawers) window.NJCloseDrawers();
    const res = [];
    NJ_CHAPTERS.forEach(c => {
      const hitTitle = c.title.indexOf(q) >= 0 || c.book.indexOf(q) >= 0 ||
        c.titleTw.indexOf(toTrad(q)) >= 0;
      if (hitTitle) res.push({ c, s: null, txt: c.brief, why: "篇目" });
      c.sections.forEach(s => {
        if (s.yw.indexOf(q) >= 0 || s.yw.indexOf(toTrad(q)) >= 0)
          res.push({ c, s, txt: s.yw, yw: 1 });
        else if (s.bh.indexOf(q) >= 0) res.push({ c, s, txt: s.bh, why: "翻译" });
        else if ((s.notes || []).some(n => n.t.indexOf(q) >= 0))
          res.push({ c, s, txt: s.yw, why: "注" });
      });
    });
    const qv = toTrad(q);
    const pat = qv && qv !== q ? esc(q) + "|" + esc(qv) : esc(q);
    const marked = () => t => t.replace(new RegExp(pat, "g"), m => `<em>${m}</em>`);
    const mk = marked();
    const box = $("#result");
    box.innerHTML = `<div class="viz-head"><h2>检索「${q}」</h2>
      <p>命中 ${res.length} 条</p><div style="flex:1"></div>
      <button class="tool-btn" id="viz-close2">返回阅读</button></div>`;
    if (!res.length) {
      box.innerHTML += `<div style="padding:26px 30px"><div class="empty">
        未命中。收录范围为本节选十篇。<br>可试试：陽氣、按之、天癸、味過於鹹、十二官……</div></div>`;
    }
    res.slice(0, 60).forEach(r => {
      const hits = [r.txt.indexOf(q), qv !== q ? r.txt.indexOf(qv) : -1].filter(i => i >= 0);
      const idx = hits.length ? Math.max(0, Math.min(...hits) - 16) : 0;
      const snip = mk(r.txt.slice(idx, idx + 60));
      const d = el("div", "rs",
        `<h4>${r.c.book}·${r.c.title}${r.why ? "　<span style='font-size:12px;color:var(--ink3);font-weight:400'>"
          + r.why + "</span>" : ""}</h4><p>…${snip}…</p>`);
      d.onclick = () => openChapter(r.c.id, r.s ? r.s.id : null);
      box.appendChild(d);
    });
    $("#viz").classList.remove("on");
    document.body.classList.remove("viz");
    $("#wrap").style.display = "none";
    box.style.display = "block";
    $("#viz-close2").onclick = exitViz;
  }

  /* ---------- 工具开关 ---------- */
  function bindTools() {
    const t = (sel, cls, inv) => {
      const b = $(sel);
      if (!b) return;
      b.onclick = () => {
        document.body.classList.toggle(cls);
        let on = document.body.classList.contains(cls);
        if (inv) on = !on;
        b.classList.toggle("on", on);
      };
    };
    t("#btn-bh", "hide-bh", true);
    t("#btn-note", "hide-note", true);
    $("#btn-bh").classList.add("on");
    $("#btn-note").classList.add("on");

    let fs = 19;
    $("#btn-aa").onclick = () => {
      fs = fs >= 24 ? 16 : fs + 2;
      document.documentElement.style.setProperty("--fs", fs + "px");
    };
    let wm = 1;
    $("#btn-width").onclick = () => {
      document.body.classList.remove("w-wide", "w-mid", "w-nar");
      wm = (wm + 1) % 3;
      document.body.classList.add(["w-wide", "w-mid", "w-nar"][wm]);
    };
    document.body.classList.add("w-mid");

    /* 目录 / 总结：手机版与电脑版窄窗走抽屉，宽屏电脑版走显隐 */
    const drawerMode = () =>
      document.documentElement.classList.contains("mode-mobile") ||
      document.documentElement.classList.contains("mode-narrow") ||
      document.documentElement.classList.contains("mode-narrow2");
    $("#btn-toc").onclick = () => { drawerMode() ? window.NJDrawer("side") : document.body.classList.toggle("hide-toc"); };
    $("#toc-handle").onclick = () => { drawerMode() ? window.NJDrawer("side") : document.body.classList.toggle("hide-toc"); };
    $("#btn-aside").onclick = () => { drawerMode() ? window.NJDrawer("ai") : document.body.classList.toggle("hide-aside"); };
    $("#aside-close").onclick = () => { drawerMode() ? window.NJDrawer("ai", false) : document.body.classList.add("hide-aside"); };

    /* 全屏：进入后按钮变为「退出全屏」，兼容 webkit 前缀（iPad Safari） */
    const fullBtn = $("#btn-full");
    const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
    const syncFull = () => {
      const on = !!fsEl();
      fullBtn.textContent = on ? "退出全屏" : "全屏";
      fullBtn.classList.toggle("on", on);
    };
    fullBtn.onclick = () => {
      try {
        if (!fsEl()) {
          const el = document.documentElement;
          (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
      } catch (e) {}
    };
    ["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, syncFull));

    // 日间 / 夜间：写 localStorage，切换后重绘当前视图以刷新 SVG 底色
    const themeBtn = $("#btn-theme");
    function applyTheme(night) {
      document.body.classList.toggle("night", !!night);
      themeBtn.textContent = night ? "日间" : "夜间";
      themeBtn.classList.toggle("on", !!night);
      try { localStorage.setItem("nj-theme", night ? "night" : "day"); } catch (e) {}
    }
    let nightMode = false;
    try { nightMode = localStorage.getItem("nj-theme") === "night"; } catch (e) {}
    applyTheme(nightMode);
    themeBtn.onclick = () => {
      nightMode = !nightMode;
      applyTheme(nightMode);
      if (inViz) renderViz(window.__vizKind || "mer");
    };

    // 输入即检索（200ms 防抖），回车立即检索并取消待执行的防抖
    let njQTimer = null;
    const njSearch = v => { clearTimeout(njQTimer); njQTimer = setTimeout(() => doSearch(v), 200); };
    $("#q").oninput = e => njSearch(e.target.value);
    $("#q").onkeydown = e => { if (e.key === "Enter") { clearTimeout(njQTimer); doSearch($("#q").value); } };
    $("#q").addEventListener("change", e => doSearch(e.target.value));

/* ============================================================
   简体 / 繁体 切换（DOM 层，不改底本数据）
   ============================================================ */
(function () {
  "use strict";

  function buildDict(K, V, PK, PV) {
    const m = new Map();
    const a = Array.from(K), b = Array.from(V);
    for (let i = 0; i < a.length; i++) m.set(a[i], b[i]);
    const ka = PK.split("|"), va = PV.split("|");
    for (let i = 0; i < ka.length; i++) if (ka[i]) m.set(ka[i], va[i]);
    return m;
  }
  const S2T = buildDict(window.NJ_S2T_K, window.NJ_S2T_V, window.NJ_S2T_PK, window.NJ_S2T_PV);
  const T2S = buildDict(window.NJ_T2S_K, window.NJ_T2S_V, window.NJ_T2S_PK, window.NJ_T2S_PV);
  const MAXLEN = 3;

  function conv(str, m) {
    if (!str) return str;
    let out = "", i = 0;
    while (i < str.length) {
      let hit = false;
      for (let L = Math.min(MAXLEN, str.length - i); L > 0; L--) {
        const v = m.get(str.substr(i, L));
        if (v !== undefined && v !== str.substr(i, L)) { out += v; i += L; hit = true; break; }
      }
      if (!hit) { out += str[i]; i++; }
    }
    return out;
  }
  const toScript = t => script === "hant" ? conv(t, S2T) : conv(t, T2S);

  let script = "hant";
  try {
    const saved = localStorage.getItem("nj-script");
    if (saved === "hans" || saved === "hant") script = saved;
  } catch (e) {}

  const SKIP = { SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEXTAREA: 1 };
  /* 版本选择界面固定简体：#mgate 首选项，不随全站字形切换 */
  const MODE_UI = "#mgate, #modeSwitch";
  function inModeUI(node) {
    let el = null;
    if (node.nodeType === 1) el = node;
    else if (node.parentNode && node.parentNode.nodeType === 1) el = node.parentNode;
    return !!(el && el.closest && el.closest(MODE_UI));
  }
  const orig = new WeakMap();          // 文本节点 -> 原始文本（避免来回切换累积失真）
  const attrOrig = new WeakMap();      // 元素 -> { attr: 原始值 }
  let applying = false;

  function convertNode(node) {
    if (!orig.has(node)) orig.set(node, node.nodeValue);
    const want = toScript(orig.get(node));
    if (node.nodeValue !== want) node.nodeValue = want;
  }
  const ATTRS = ["placeholder", "title", "aria-label"];
  function convertAttrs(el) {
    if (!el || el.nodeType !== 1 || !el.hasAttribute) return;
    if (inModeUI(el)) return;
    let cache = attrOrig.get(el);
    if (!cache) { cache = {}; attrOrig.set(el, cache); }
    ATTRS.forEach(a => {
      if (!el.hasAttribute(a)) return;
      if (cache[a] === undefined) cache[a] = el.getAttribute(a);
      const want = toScript(cache[a]);
      if (want !== el.getAttribute(a)) el.setAttribute(a, want);
    });
  }
  function walk(root) {
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const list = [];
    let n;
    while ((n = tw.nextNode())) {
      const p = n.parentNode;
      if (!p || SKIP[p.nodeName]) continue;
      if (!n.nodeValue || !n.nodeValue.trim()) continue;
      if (inModeUI(n)) continue;
      list.push(n);
    }
    list.forEach(convertNode);
  }
  function applyAll() {
    applying = true;
    try {
      walk(document.body);
      document.querySelectorAll("[placeholder],[title],[aria-label]").forEach(convertAttrs);
    } finally { applying = false; }
  }

  /* 单键切换：按钮文字 = 点击后要切到的字形（当前简体时显示「繁体」） */
  const bSc = document.getElementById("btn-script");
  function labelNode() {
    return (bSc && bSc.firstChild && bSc.firstChild.nodeType === 3) ? bSc.firstChild : null;
  }
  function paint() {
    const n = labelNode();
    if (!n) return;
    const label = script === "hant" ? "简体" : "繁体";
    orig.set(n, label);              // 记为原文，整体转换时不再覆盖按钮标签
    n.nodeValue = toScript(label);
  }
  function setScript(v) {
    if (v === script) return;
    script = v;
    try { localStorage.setItem("nj-script", v); } catch (e) {}
    paint();                         // 先换按钮文字，再整体转换
    applyAll();
  }
  if (bSc) bSc.onclick = () => setScript(script === "hant" ? "hans" : "hant");

  paint();
  applyAll();

  // 后续动态渲染（目录 / 正文 / 图谱 / 助手 / 检索结果）自动跟随当前字形
  if (window.MutationObserver) {
    const mo = new MutationObserver(muts => {
      if (applying) return;
      applying = true;
      try {
        muts.forEach(m => {
          if (m.type !== "childList") return;
          m.addedNodes.forEach(node => {
            if (inModeUI(node)) return;
            if (node.nodeType === 1) { convertAttrs(node); walk(node); }
            else if (node.nodeType === 3) {
              const p = node.parentNode;
              if (p && !SKIP[p.nodeName] && node.nodeValue && node.nodeValue.trim()) convertNode(node);
            }
          });
        });
      } finally { applying = false; }
    });
    mo.observe(document.body, { childList: true, subtree: true });
  }
  window.NJSetScript = setScript;
})();

</script>

<script>
(function(){

  /* token 拆成若干段再拼：GitHub 的密钥扫描会拦截含完整 token 的推送，公开仓库必须这么做 */
  var TOK = ["github_pat_11CQX","WSBY0hHfAn1QW8yj","g_UiWYb8TzJAmqVF","AUleHEvUYkKMFNhg","64Q0XSYCWfbOiRJJ","Q4GDVVG5vQFgN"].join("");
  var TYPES = "译文/注解有误|小助手答得不好|页面显示错误|想要新功能|其他".split("|");
  var QKEY = "fb_queue_" + SITE, LKEY = "fb_last_" + SITE, HKEY = "fb_hash_" + SITE;

  var send = $("fb-send"), cancel = $("fb-cancel"), st = $("fb-status"), copy = $("fb-copy"), meta = $("fb-meta");
  if(!btn || !panel) return;

  TYPES.forEach(function(t){
    var o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  if(TYPES.length) sel.value = TYPES[0];

  function ctx(){
    var extra = "";
    try { if (typeof window.__FEEDBACK_CTX__ === "function") extra = window.__FEEDBACK_CTX__() || ""; } catch(e){}
    var d = new Date();
    var pad = function(n){ return n < 10 ? "0" + n : "" + n; };
    return [
      "站点：" + LABEL + " (" + SITE + ")",
      "页面：" + location.href,
      "时间：" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()),
      "UA：" + navigator.userAgent,
      "语言：" + (navigator.language || "-") + " | 屏幕：" + window.screen.width + "x" + window.screen.height,
      "来源：" + (document.referrer || "-")
    ].concat(extra ? ["上下文：" + extra] : []).join("\n");
  }
  meta.textContent = ctx().replace(/\n/g, " ｜ ");

  /* 一条反馈 -> 一个 HTTP 请求（按模式拼装） */
  function req(type, v, contact, withLabels){
    var c = ctx();
    if(MODE === "github"){
      var fbm = {site: SITE, type: type, contact: contact, ts: new Date().toISOString()};
      var body = "## 反馈内容\n\n" + v + "\n\n**联系方式**：" + contact +
                 "\n\n**技术信息**\n\n```\n" + c + "\n```\n\n<!-- fbmeta " + JSON.stringify(fbm) + " -->";
      var obj = {title: "[" + SITE + "] " + type + " ｜ " + v.slice(0, 30), body: body};
      if(withLabels) obj.labels = [SITE, "反馈"];
      return {headers: {"Content-Type": "application/json", "Accept": "application/vnd.github+json",
                        "Authorization": "Bearer " + TOK, "X-GitHub-Api-Version": "2022-11-28"},

                                  _template: "table", site: SITE, type: type,

  function post(r){

      if(!resp.ok) return resp.text().then(function(t){ throw new Error("HTTP " + resp.status + " " + t.slice(0, 100)); });
      return resp.json().catch(function(){ return {}; });
    });
  }
  function submit(type, v, contact){
    return post(req(type, v, contact, true)).catch(function(e){
      if(MODE === "github") return post(req(type, v, contact, false));  /* 标签不存在时退掉标签重试 */
      throw e;

      var q = JSON.parse(localStorage.getItem(QKEY) || "[]"); q.push(item);
      localStorage.setItem(QKEY, JSON.stringify(q.slice(-20)));

  }
  function flush(){
    var q = [];
    try { q = JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch(e){}
    if(!q.length) return;
    var left = [];
    q.forEach(function(item){
      submit(item.type, item.message, item.contact).then(function(){

      }).catch(function(){ left.push(item); try { localStorage.setItem(QKEY, JSON.stringify(left)); } catch(e){} });

        setTimeout(close, 1600);

        copy.style.display = "block";

    document.body.removeChild(ta);
  };

  try { flush(); } catch(e){}
})();

        body: JSON.stringify(body), keepalive: true
      }).catch(function(){});
    } catch (e) {}
  }

  var t0 = Date.now(), left = false;
  var day = day8(), dev = profile(day);
  post({ p_site: S, p_vid: vid, p_day: day, p_cnt: 1, p_dev: dev });

  function leave() {
    if (left) return; left = true;
    var sec = Math.round((Date.now() - t0) / 1000);
    if (sec < 0) sec = 0;
    if (sec > 3600) sec = 3600;
    dev.w = (dev.w || 0) + sec;
    try { localStorage.setItem(P, JSON.stringify(dev)); } catch (e) {}
    post({ p_site: S, p_vid: vid, p_day: day, p_cnt: 0, p_dev: dev, p_dwell: sec });
  }
  addEventListener('pagehide', leave);
  addEventListener('beforeunload', leave);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') leave();
  });
})();
</script>
