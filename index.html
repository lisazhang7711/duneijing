<style>
/* ===== 读内经 · 样式 ===== */
:root{
  --paper:#f2e7cb;
  --paper2:#f8f1de;
  --paper-deep:#e9d9ab;
  --line:#d9c9a4;
  --line2:#ab9670;
  --ink:#171208;
  --ink2:#4b4028;
  --ink3:#6c6042;
  --zhu:#a32a17;
  --zhu-bg:#f6ddd0;
  --indigo:#17496f;
  --indigo-bg:#e4ecf2;
  --gold:#7d5310;
  --green:#2f6238;
  --sans:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",Georgia,serif;
  --fs:19px;
  /* 派生语义量：夜间模式只需覆盖这一组 */
  --paper-a:rgba(242,231,203,.95);
  --hover:#e9dcbc;
  --quote-bg:#f8f1d9;
  --txt2:#221c0e;
  --txt3:#332a17;
  --flash:#eed68c;
  --highlight:#e9c96b;
  --th-bg:#eadcbb;
  --src-t:#481f16;
  --node-bg:#f7efd8;
  --svg-line:#685c46;
  --scroll:#b0a17f;
}

/* ---------- 夜间模式 ---------- */
body.night{
  --paper:#12100a;
  --paper2:#1d1a12;
  --paper-deep:#2b2414;
  --line:#3c3a30;
  --line2:#5c5943;
  --ink:#efe6cc;
  --ink2:#cac0a4;
  --ink3:#a89e82;
  --zhu:#ff8f76;
  --zhu-bg:#37211c;
  --indigo:#8fc6e8;
  --indigo-bg:#1a2029;
  --gold:#e5c164;
  --green:#93cb93;
  --paper-a:rgba(18,16,10,.95);
  --hover:#2e2a1e;
  --quote-bg:#262014;
  --txt2:#e8dec2;
  --txt3:#d8cdad;
  --flash:#54451a;
  --highlight:#5a4a15;
  --th-bg:#2b2618;
  --src-t:#f4cdc3;
  --node-bg:#1f1c13;
  --svg-line:#918a76;
  --scroll:#514d3e;
}
body.night img.oldchart-img{filter:brightness(.86) contrast(1.12) sepia(.2)}
/* 图片统一压成暖黄调，避免出现纯白块 */
#mer-fig img,#off-fig img,#mp-fig img,.oldchart-img{filter:sepia(.16) saturate(1.06) contrast(1.02)}
body.night .mer-chip.on,
body.night .wx-chip.on,
body.night .tool-btn.on,
body.night .tm.on,
body.night .mp-btn.on{color:#12100a}
/* 夜间主题切换按钮：宽度自适应文字，避免「夜间 / 日间」两字被挤偏 */
#btn-theme{min-width:46px;text-align:center}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:var(--fs);
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:9px;
  height:52px;padding:0 14px;
  background:var(--paper-a);
  backdrop-filter:blur(8px);
  border-bottom:2px solid var(--line2);
  /* 窄屏时整条横向滚动，不挤压按钮导致文字折行竖排 */
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
#topbar::-webkit-scrollbar{display:none}
.brand{
  font-size:19px;font-weight:700;letter-spacing:.08em;color:var(--ink);
  white-space:nowrap;
}
.brand em{font-style:normal;color:var(--zhu)}
.navbtn{
  border:none;background:none;color:var(--ink2);
  font-size:15px;padding:5px 2px;border-bottom:2px solid transparent;
  letter-spacing:.03em;
  /* 三字以上标题一律单行横排，不折行 */
  white-space:nowrap;flex:0 0 auto;line-height:1.2;
}
.navbtn:hover{color:var(--ink)}
.navbtn.on{color:var(--zhu);border-bottom-color:var(--zhu);font-weight:700}
.spacer{flex:1 1 auto;min-width:0}
#topbar>.brand,#topbar>span{flex:0 0 auto;white-space:nowrap}
#q{
  flex:0 1 132px;min-width:96px;
  padding:4px 8px;font-size:13.5px;font-family:var(--sans);
  border:1px solid var(--line2);border-radius:4px;background:var(--paper2);
  color:var(--ink);outline:none;
}
#q:focus{border-color:var(--zhu)}
.tool-btn{
  border:1px solid var(--line2);background:var(--paper2);
  color:var(--ink2);font-size:12.5px;font-family:var(--sans);
  padding:3px 6px;border-radius:3px;letter-spacing:.02em;
  white-space:nowrap;flex:0 0 auto;line-height:1.5;
}
.tool-btn:hover{border-color:var(--zhu);color:var(--zhu)}
.tool-btn.on{background:var(--zhu);border-color:var(--zhu);color:#fdf4dc}
/* 目录按钮：主色实底，与普通工具按钮区分 */
#btn-toc{background:var(--zhu);border-color:var(--zhu);color:#fdf4dc;font-weight:700;letter-spacing:.1em}
#btn-toc:hover{color:#fff;border-color:var(--zhu)}
body.night #btn-toc{color:#16130c}
/* 返回阅读：主色实底、加大，第一眼可见 */
[id^="viz-close"]{background:var(--zhu);border-color:var(--zhu);color:#fdf4dc;font-weight:700;padding:5px 14px;letter-spacing:.06em}
[id^="viz-close"]:hover{color:#fff;border-color:var(--zhu)}
body.night [id^="viz-close"]{color:#16130c}
/* 阅读原文：顶栏互动按钮（靛蓝描边） */
.orig-btn{border-color:var(--indigo);color:var(--indigo)}
.orig-btn:hover{background:var(--indigo);border-color:var(--indigo);color:#f2e7cb}
body.night .orig-btn:hover{color:#12100a}

/* ---------- 布局 ---------- */
#wrap{display:flex;height:calc(100vh - 78px);overflow:hidden}
#toc{
  width:242px;flex:0 0 242px;overflow-y:auto;
  border-right:1px solid var(--line);background:var(--paper2);
  padding:12px 0 40px;
}
#main{flex:1;overflow-y:auto;padding:0 0 120px}
#aside{
  width:312px;flex:0 0 312px;overflow-y:auto;
  border-left:1px solid var(--line);background:var(--paper2);
}
#main.narrow{max-width:940px;margin:0 auto}
body.hide-toc #toc{display:none}
body.hide-aside #aside{display:none}

/* 目录收缩把手：常驻页面左缘 */
#toc-handle{
  position:fixed;left:0;top:44%;z-index:70;width:24px;padding:8px 0;
  border:1px solid var(--line2);border-left:none;background:var(--paper2);
  color:var(--ink3);cursor:pointer;border-radius:0 6px 6px 0;
  font-size:11px;line-height:1.35;text-align:center;font-family:var(--sans);
}
#toc-handle:hover{color:var(--zhu);border-color:var(--zhu)}

/* 古籍经络图 */
.oldchart-wrap{padding:10px}
.oldchart-img{width:100%;display:block;border-radius:3px;box-shadow:0 1px 6px rgba(60,45,20,.14)}
.oldchart-cap{
  font-family:var(--sans);font-size:11px;color:var(--ink3);
  letter-spacing:.05em;padding:7px 2px 2px;text-align:center;
}
.oldchart-empty{
  padding:46px 26px;font-family:var(--sans);font-size:13px;
  color:var(--ink3);text-align:center;line-height:2;
}

/* 阅读栏宽度：仿「阅读模式」三档 */
body.w-wide #main .inner{max-width:1180px}
body.w-mid  #main .inner{max-width:860px}
body.w-nar  #main .inner{max-width:660px}
#main .inner{margin:0 auto;padding:34px 42px 0}

/* ---------- 目录 ---------- */
.toc-book{
  padding:8px 16px 4px;font-size:13px;color:var(--ink3);
  font-family:var(--sans);letter-spacing:.14em;
}
.toc-item{
  display:flex;align-items:baseline;gap:7px;
  padding:5px 16px;font-size:15px;color:var(--ink2);
  border-left:3px solid transparent;cursor:pointer;line-height:1.5;
}
.toc-item:hover{background:var(--hover);color:var(--ink)}
.toc-item.on{
  background:var(--zhu-bg);color:var(--zhu);font-weight:700;
  box-shadow:inset 0 0 0 1px var(--zhu-bg);
  border-left-color:var(--zhu);
}
.toc-no{
  font-family:var(--sans);font-size:11px;color:var(--ink3);
  min-width:20px;text-align:right;
}
.toc-item.on .toc-no{color:var(--zhu)}

/* ---------- 篇章头 ---------- */
.crumb{
  font-family:var(--sans);font-size:12.5px;color:var(--ink3);
  letter-spacing:.06em;margin-bottom:14px;
}
.crumb b{color:var(--ink2);font-weight:600}
.ch-title{
  font-size:31px;font-weight:700;letter-spacing:.1em;margin:0 0 4px;
}
.ch-sub{
  font-family:var(--sans);font-size:13px;color:var(--ink3);
  letter-spacing:.05em;margin-bottom:12px;
}
.ch-brief{
  background:var(--paper2);border:1px solid var(--line);
  border-left:4px solid var(--gold);
  padding:12px 15px;border-radius:3px;
  font-size:15.5px;color:var(--ink2);line-height:1.85;margin-bottom:8px;
}
.ch-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 22px}
.tg{
  font-family:var(--sans);font-size:11.5px;padding:2px 8px;border-radius:11px;
  border:1px solid currentColor;letter-spacing:.05em;
}

/* ---------- 段落卡 ---------- */
.sec{
  border-top:1px solid var(--line);padding:20px 0 22px;position:relative;
}
.sec:first-of-type{border-top:none}
.sec-bar{
  display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;
}
.sec-no{
  font-family:var(--sans);font-size:11px;color:var(--gold);font-weight:600;
  letter-spacing:.05em;
  background:var(--paper2);border:1px solid var(--line2);border-radius:10px;
  padding:2px 8px;
}
.mini-btn{
  font-family:var(--sans);font-size:11.5px;padding:1.5px 8px;
  border:1px solid var(--line2);border-radius:11px;background:var(--paper2);
  color:var(--ink2);letter-spacing:.04em;
}
.mini-btn:hover{border-color:var(--zhu);color:var(--zhu)}
.mini-btn.mer{border-color:var(--indigo);color:var(--indigo);font-weight:600}
.mini-btn.off{border-color:var(--gold);color:var(--gold);font-weight:600}
.mini-btn.man{border-color:var(--green);color:var(--green);font-weight:600}
.mini-btn.hi{background:var(--zhu);color:#fdf4dc;border-color:var(--zhu)}

/* ---------- 图文互鉴（正文内的图示入口） ---------- */
.tzwj{
  margin:0 0 24px;border:1px solid var(--line2);border-radius:12px;
  background:var(--paper2);overflow:hidden;
}
.tzwj-h{
  display:flex;align-items:center;gap:8px;padding:9px 14px;
  border-bottom:1px dashed var(--line2);background:var(--zhu-bg);
  font-family:var(--sans);font-size:13px;font-weight:700;
  letter-spacing:.14em;color:var(--zhu);
}
.tzwj-ic{font-size:13px;line-height:1}
.tzwj-h i{
  font-style:normal;margin-left:auto;font-weight:400;
  font-size:11.5px;letter-spacing:.06em;color:var(--ink3);
}
.tzwj-b{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px}
.tzwj-bt{
  flex:1 1 170px;min-width:152px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:3px;padding:10px 12px;
  border:1px solid var(--line2);border-radius:10px;background:var(--paper);
  transition:border-color .15s,background .15s,transform .15s;
}
.tzwj-bt b{
  font-family:var(--sans);font-size:13.5px;font-weight:700;
  letter-spacing:.05em;color:var(--ink);
}
.tzwj-bt em{
  font-style:normal;font-family:var(--sans);font-size:11.5px;
  letter-spacing:.03em;color:var(--ink3);
}
.tzwj-bt:hover{
  border-color:var(--zhu);background:var(--zhu-bg);transform:translateY(-1px);
}
.tzwj-bt:hover b{color:var(--zhu)}
.tzwj-bt:hover em{color:var(--indigo)}

.yw{
  font-size:var(--fs);line-height:2.05;letter-spacing:.045em;
  color:var(--ink);text-align:justify;
  background:var(--paper-deep);
  padding:16px 18px;border-radius:4px;
  box-shadow:inset 0 0 0 1px var(--line2);
}
body.hide-bh .bh{display:none}
body.hide-note .notes{display:none}
.bh{
  margin-top:11px;padding:11px 14px;
  background:var(--quote-bg);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:3px;font-size:15.5px;line-height:1.9;color:var(--txt3);text-align:justify;
}
.bh::before{
  content:"翻译";display:inline-block;margin-right:8px;
  font-family:var(--sans);font-size:10.5px;color:var(--gold);
  border:1px solid var(--gold);border-radius:2px;padding:0 4px;
  vertical-align:2px;letter-spacing:.08em;
}
/* 术语 */
.t{
  color:var(--zhu);border-bottom:1px dotted var(--zhu);
  cursor:pointer;transition:background .12s;
}
.t:hover{background:var(--zhu-bg)}
.t.on{background:var(--highlight);font-weight:600}
.notes{margin-top:11px}
.pend{color:var(--ink3,#8b8f9a);font-style:italic;opacity:.72}
.ch-brief.pend{font-size:13px}
.nt{
  display:flex;gap:9px;font-size:14.5px;line-height:1.8;
  color:var(--ink2);padding:3px 0;
}
.nt-w{
  flex:0 0 auto;font-family:var(--sans);font-size:11px;
  width:22px;height:22px;line-height:20px;text-align:center;
  border:1px solid var(--line2);border-radius:50%;
  color:var(--ink3);margin-top:5px;
}
.nt-w.x{color:#6a4699;border-color:#6a4699;font-weight:600}
.nt-w.y{color:var(--green);border-color:var(--green);font-weight:600}
.nt-w.a{color:var(--gold);border-color:var(--gold);font-weight:600}
.sec.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{background:var(--flash)}100%{background:transparent}}

/* ---------- 右栏 ---------- */
.aside-hd{
  padding:13px 16px 9px;border-bottom:1px solid var(--line);
  font-family:var(--sans);font-size:12px;color:var(--ink3);
  letter-spacing:.16em;display:flex;justify-content:space-between;align-items:center;
}
.aside-hd button{
  border:none;background:none;color:var(--ink3);font-size:15px;padding:0 4px;
}
.aside-body{padding:14px 16px 40px}
.card-h{
  font-size:19px;font-weight:700;letter-spacing:.05em;margin:0 0 2px;
}
.card-py{
  font-family:var(--sans);font-size:12px;color:var(--ink3);letter-spacing:.1em;
}
.card-cat{
  display:inline-block;font-family:var(--sans);font-size:11px;
  padding:1px 8px;border-radius:10px;margin:9px 0 10px;
  border:1px solid currentColor;color:var(--indigo);
}
.card-def{font-size:15px;line-height:1.95;color:var(--txt2);text-align:justify}
.card-link{
  margin-top:14px;font-family:var(--sans);font-size:12.5px;
  color:var(--indigo);cursor:pointer;border-top:1px dashed var(--line2);
  padding-top:9px;
}
.card-link:hover{color:var(--zhu)}
.empty{color:var(--ink3);font-size:14px;font-family:var(--sans);line-height:1.9}
.occ{
  font-family:var(--sans);font-size:12.5px;color:var(--ink2);
  padding:7px 0;border-bottom:1px dashed var(--line);
}
.occ:hover{color:var(--zhu);cursor:pointer}
.occ b{color:var(--ink3);font-weight:400;font-size:11px;margin-right:6px}

/* ---------- 全屏可视化视图 ---------- */
#viz{display:none;height:calc(100vh - 78px);overflow-y:auto;background:var(--paper2)}
#viz.on{display:block}
#result{height:calc(100vh - 78px);overflow-y:auto;background:var(--paper2)}
body.viz #wrap{display:none}
.viz-head{
  padding:18px 30px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;background:var(--paper-a);
  backdrop-filter:blur(6px);z-index:5;
}
.viz-head h2{margin:0;font-size:22px;letter-spacing:.12em}
.viz-head p{margin:0;font-family:var(--sans);font-size:12.5px;color:var(--ink3)}
.viz-body{display:flex;gap:0;align-items:flex-start;padding:18px 30px 60px}

/* 经络图 */
#mer-fig{flex:0 0 430px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
#mer-panel{flex:1;padding:0 0 0 26px;min-width:300px}
.mer-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mer-chip{
  font-family:var(--sans);font-size:12.5px;padding:3px 10px;border-radius:12px;
  border:1px solid var(--line2);background:var(--paper2);color:var(--ink2);
}
.mer-chip:hover{border-color:var(--zhu)}
.mer-chip.on{color:#fdf4dc;border-color:transparent}
.mer-chip .dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;
}
.view-sw{display:flex;gap:6px;margin-bottom:12px}
.mp-name{font-size:20px;font-weight:700;margin:0 0 3px}
.mp-sub{font-family:var(--sans);font-size:12px;color:var(--ink3);letter-spacing:.08em;margin-bottom:12px}
.mp-h{
  font-family:var(--sans);font-size:11.5px;color:var(--ink3);
  letter-spacing:.14em;margin:14px 0 5px;
}
.mp-t{font-size:15.5px;line-height:1.95;color:var(--txt2);text-align:justify}
.mp-dis li{
  font-size:15px;line-height:1.9;color:var(--txt3);margin-bottom:6px;
  padding-left:12px;border-left:2px solid var(--line2);
}
.mer-path{fill:none;stroke-width:2.6;stroke-linecap:round;opacity:.58;cursor:pointer;transition:opacity .15s,stroke-width .15s}
.mer-path:hover{opacity:.88}
.mer-path.on{opacity:1;stroke-width:4}
.body-line{fill:none;stroke:var(--svg-line);stroke-linecap:round;stroke-linejoin:round}
.body-fill{fill:var(--node-bg);stroke:var(--svg-line);stroke-width:1.2}
.pt-dot{fill:var(--paper2);stroke:var(--zhu);stroke-width:1.5;cursor:pointer}
.pt-dot:hover,.pt-dot.on{fill:var(--zhu)}
.pt-lb{font-family:var(--sans);font-size:9px;fill:var(--ink2);pointer-events:none}
#forcebar{
  font-family:var(--sans);font-size:11px;fill:var(--ink3);letter-spacing:.1em;
}

/* 十二官 */
#off-fig{flex:0 0 560px}
#off-panel{flex:1;padding:0 0 0 20px;min-width:270px}
.off-node{cursor:pointer}
.off-node circle{transition:stroke-width .15s,fill .15s}
.off-node:hover circle.off-c{stroke-width:2.5}
.off-nm{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#fdf4dc;letter-spacing:.04em}
.off-rk{font-family:var(--sans);font-size:10px;text-anchor:middle;fill:var(--ink2)}

    let v = null;

  }

    const now = cur();
    Array.prototype.forEach.call(gate.querySelectorAll(".mg-card"), function (b) {
      b.classList.toggle("cur", b.getAttribute("data-m") === now);
    });

  }

    const bar = $("topbar");
    if (!bar || $("modeSwitch")) return;

      const next = (cur() === "desktop" ? "mp" : "desktop");

    if (asideBtn) origOn.aside = asideBtn.onclick;
    if (asideClose) origOn.asideClose = asideClose.onclick;

    if (m) {
      apply(m);
    } else {
      const sw = $("modeSwitch"); if (sw) sw.textContent = "选择版本";
    }
    openGate();

    Array.prototype.forEach.call(gate.querySelectorAll(".mg-card"), function (b) {
      b.onclick = function () {
        const m = this.dataset.m;
        save(m); gate.hidden = true; apply(m);
      };

    const gc = $("mgCancel");
    if (gc) gc.onclick = function () { gate.hidden = true; };

    });
    window.addEventListener("resize", function () { syncNarrow(); syncTopbar(); });
    window.addEventListener("orientationchange", function () { setTimeout(function () { syncNarrow(); syncTopbar(); }, 300); });
  };
  NJModeBoot();
})();

        bh: "岐伯说：女子七岁时，肾气开始充盛，换牙，头发长得快。十四岁时天癸到来，任脉通畅，太冲脉充盛，月经按时来潮，所以能够生育。二十一岁时，肾气平匀充足，智齿生出，身高达到了顶点。二十八岁时，筋骨坚固，头发长到最盛，身体最为壮实。三十五岁时，阳明经脉之气衰退，面部开始憔悴，头发开始脱落。四十二岁时，三阳经脉之气从上部衰退，整个面部都憔悴了，头发开始变白。四十九岁时，任脉空虚，太冲脉衰少，天癸枯竭，月经停闭而地道不通，所以形体衰败，不能再生育了。",
        notes: [
          { w: "训", t: "天癸：肾精充盈到一定程度后产生的、促成生殖机能成熟的物质。" },
          { w: "训", t: "地道不通：指月经停止。焦，通憔，枯槁不泽。" },
          { w: "按", t: "注意衰老的起点在「阳明脉衰」而不在肾。面部是阳明胃经所过，此处把消化吸收能力视作衰老的第一个可见窗口。" }
        ]
      },
      {
        id: "sw01-6", tags: ["zangxiang", "yang"],
        yw: "丈夫八歲，腎氣實，髮長齒更。二八，腎氣盛，天癸至，精氣溢瀉，陰陽和，故能有子。三八，腎氣平均，筋骨勁強，故真牙生而長極。四八，筋骨隆盛，肌肉滿壯。五八，腎氣衰，髮墮齒槁。六八，陽氣衰竭於上，面焦，髮鬢頒白。七八，肝氣衰，筋不能動，天癸竭，精少，腎藏衰，形體皆極。八八，則齒髮去。",
        bh: "男子八岁时，肾气充实，头发长得好，牙齿开始更换。十六岁时，肾气充盛，天癸到来，精气满溢而能外泄，男女阴阳交合，所以能有子。二十四岁时，肾气平匀充足，筋骨强劲有力，智齿生出，身高达到了顶点。三十二岁时，筋骨丰隆盛满，肌肉丰满壮实。四十岁时，肾气开始衰退，头发脱落，牙齿枯槁。四十八岁时，阳气从上部衰竭，面部憔悴，鬓发斑白。五十六岁时，肝气衰退，筋脉不能灵活活动，天癸枯竭，精液减少，肾脏衰败，形体都到了极点。六十四岁时，牙齿和头发就都脱落了。",
        notes: [
          { w: "按", t: "女七男八，是节律单位而非精确年限。同是一套节律倒数，女子自三十五岁而面始衰，男子自四十岁而齿始槁，都与阳明／阳气的可见表征挂钩。" }
        ]
      },
      {
        id: "sw01-7", tags: ["zangxiang"],
        yw: "腎者主水，受五藏六府之精而藏之，故五藏盛，乃能瀉。今五藏皆衰，筋骨解墮，天癸盡矣，故髮鬢白，身體重，行步不正，而無子耳。",
        bh: "肾主水液，接受并储藏五脏六腑的精气，所以五脏精气充盛，肾才能向外输泻精气。如今五脏都已衰退，筋骨松解无力，天癸枯竭，所以鬓发斑白，身体沉重，走路不稳，也就不能生育了。",
        notes: [
          { w: "义", t: "关键一句：「五藏盛，乃能泻」。肾不是孤立的水库，而是全身精气的共同账户。补的思路由此确立。" }
        ]
      },
      {
        id: "sw01-8", tags: ["yang", "shen"],
        yw: "黃帝曰：余聞上古有真人者，提挈天地，把握陰陽，呼吸精氣，獨立守神，肌肉若一，故能壽敝天地，無有終時，此其道生。中古之時，有至人者，淳德全道，和於陰陽，調於四時，去世離俗，積精全神，遊行天地之間，視聽八達之外。其次有聖人者，處天地之和，從八風之理，適嗜欲於世俗之間，無恚嗔之心，行不欲離於世，外不勞形於事，內無思想之患，以恬愉爲務，以自得爲功，形體不敝，精神不散，亦可以百數。其次有賢人者，法則天地，象似日月，辨列星辰，逆從陰陽，分別四時，將從上古合同於道，亦可使益壽而有極時。",
        bh: "黄帝说：我听说上古有称为真人的人，能提挈天地造化，把握阴阳的变化，呼吸天地精纯之气，独立守持精神，肌肉与形体浑然如一，所以寿命能与天地同久，没有终结的时候，这是他们得道而生的结果。中古时有称为至人的人，德行淳厚，道行完备，调和于阴阳，适应于四时的变迁，超脱世俗，蓄积精气保全精神，神游于天地之间，视听能达八方之外。其次有称为圣人的人，安居于天地的和气之中，顺从八风的变化规律，在世俗之间适度满足自己的嗜好与欲望，没有恼怒怨恨之心，行为不脱离世俗，外不让形体被事务劳累，内心没有思想上的忧患，以恬静愉悦为本务，以自得自足为功业，形体不衰败，精神不耗散，也可以活到百岁。再其次有称为贤人的人，以天地为法则，以日月运行为取象，分辨星辰的位次，顺从阴阳的消长，区别四时的变化，追随上古真人而合于道，也可以延益寿命，但有其极限。",
        notes: [
          { w: "按", t: "真人、至人、圣人、贤人，是四类阶梯，最下一档仍有「极时」。说明这是可达目标的梯度表，不是神话。" }
        ]
      }
    ]
  },

  {
    id: "sw02", book: "素问", no: 2, title: "四气调神大论", titleTw: "四氣調神大論",
    tags: ["yang", "wuxing", "zhize"],
    brief: "按春夏秋冬给出四套作息与情志方案，末尾落到「治未病」——全书最著名的一句纲领。",
    sections: [
      {
        id: "sw02-1", tags: ["yang", "wuxing"],
        yw: "春三月，此謂發陳，天地俱生，萬物以榮，夜臥早起，廣步於庭，被髮緩形，以使志生，生而勿殺，予而勿奪，賞而勿罰，此春氣之應，養生之道也。逆之則傷肝，夏爲寒變，奉長者少。",
        bh: "春季三个月，是推陈出新的季节，天地一同生发，万物欣欣向荣。应当晚睡早起，在庭院里大步散步，披散头发、松缓衣束，让情志随之生发；对待万物要促其生而不加杀伐，多给予而不去剥夺，多奖赏而不去惩罚。这是顺应春气、调养生气的方法。违背了就会损伤肝脏，到夏天发生寒性病变，供给夏季生长的力量就不足了。",
        notes: [
          { w: "训", t: "发陈：发散陈旧，推陈出新。被发，披散头发，取其舒松。" },
          { w: "按", t: "注意这里把「生而勿杀、予而勿夺」也说成养生之法——情志与待人方式被算进了养生技术清单。" }
        ]
      },
      {
        id: "sw02-2", tags: ["yang", "wuxing"],
        yw: "夏三月，此謂蕃秀，天地氣交，萬物華實，夜臥早起，無厭於日，使志無怒，使華英成秀，使氣得泄，若所愛在外，此夏氣之應，養長之道也。逆之則傷心，秋爲痎瘧，奉收者少，冬至重病。",
        bh: "夏季三个月，是万物繁茂秀美的季节，天地之气交合，万物开花结果。应当晚睡早起，不要厌恶日光，让情志不发怒，让容色像花一样秀美，让气机得以宣泄，好像所爱之物就在外边一样外向舒展。这是顺应夏气、调养长气的方法。违背了就会损伤心脏，到秋天发生疟疾之类的寒热病，供给秋季收敛的力量就不足，冬至时节就会重病。",
        notes: [{ w: "训", t: "蕃秀：繁茂秀丽。痎疟，疟疾的通称。" }]
      },
      {
        id: "sw02-3", tags: ["yang", "wuxing"],
        yw: "秋三月，此謂容平，天氣以急，地氣以明，早臥早起，與雞俱興，使志安寧，以緩秋刑，收斂神氣，使秋氣平，無外其志，使肺氣清，此秋氣之應，養收之道也。逆之則傷肺，冬爲飧泄，奉藏者少。",
        bh: "秋季三个月，是万物平定收敛的季节，天气转急，地气清明。应当早睡早起，与鸡的活动时间同步，让情志安宁，以缓和秋气的肃杀之刑，收敛神气，使秋气得以平和，不使情志外驰，使肺气清肃。这是顺应秋气、调养收气的方法。违背了就会损伤肺脏，到冬天发生完谷不化的泄泻，供给冬季闭藏的力量就不足。",
        notes: [{ w: "训", t: "容平：万物形态平定成熟。容，形态。飧泄，泻下物夹有不化谷物。" }]
      },
      {
        id: "sw02-4", tags: ["yang", "wuxing"],
        yw: "冬三月，此謂閉藏，水冰地坼，無擾乎陽，早臥晚起，必待日光，使志若伏若匿，若有私意，若已有得，去寒就溫，無泄皮膚，使氣亟奪，此冬氣之應，養藏之道也。逆之則傷腎，春爲痿厥，奉生者少。",
        bh: "冬季三个月，是万物闭藏的季节，水结冰，地冻裂，不要扰动阳气。应当早睡晚起，一定要等到日光出现才起身，让情志好像潜伏藏匿起来一样，好像怀有私意而不外露，好像已经得到了什么而满足；避开寒冷，趋近温暖，不要让皮肤开泄出汗，以免阳气屡屡被夺。这是顺应冬气、调养藏气的方法。违背了就会损伤肾脏，到春天发生痿弱厥冷的病证，供给春季生发的力量就不足。",
        notes: [
          { w: "训", t: "坼，音彻，裂开。亟，屡次。" },
          { w: "按", t: "四季作息的差别，本质是一件事：对皮肤开阖和出汗的管理。春天广步出汗，冬天无泄皮肤。" }
        ]
      },
      {
        id: "sw02-5", tags: ["wuxing", "zangxiang"],
        yw: "逆春氣，則少陽不生，肝氣內變。逆夏氣，則太陽不長，心氣內洞。逆秋氣，則太陰不收，肺氣焦滿。逆冬氣，則少陰不藏，腎氣獨沉。",
        bh: "违背了春气，少阳之气就不能生发，肝气在体内发生病变。违背了夏气，太阳之气就不能长养，心气在内虚怯不足。违背了秋气，太阴之气就不能收敛，肺气焦躁胀满。违背了冬气，少阴之气就不能闭藏，肾气独自沉衰。",
        notes: [
          { w: "义", t: "用少阳/太阳/太阴/少阴四组把四季与脏腑锁在一起——这是四时与藏象之间的固定接线。" }
        ]
      },
      {
        id: "sw02-6", tags: ["yang"],
        yw: "夫四時陰陽者，萬物之根本也。所以聖人春夏養陽，秋冬養陰，以從其根，故與萬物沉浮於生長之門。逆其根，則伐其本，壞其真矣。故陰陽四時者，萬物之終始也，死生之本也，逆之則災害生，從之則苛疾不起，是謂得道。",
        bh: "四时阴阳的变化，是万物生长收藏的根本。所以圣人在春夏调养生发之气，在秋冬调养收藏之阴，以顺从这个根本，因而能与万物一起在生长收藏的门户中沉浮出入。违背了这个根本，就是砍伐本源、败坏真气。所以阴阳四时的变化，是万物的终始，是死生的根本，违背了就产生灾害，顺从了就不会生重病，这叫做得道。",
        notes: [
          { w: "按", t: "「春夏养阳，秋冬养阴」常被误解为夏天吃热药冬天吃凉药。原意是：春夏要顺养「生、长」的功能，秋冬要顺养「收、藏」的功能。" }
        ]
      },
      {
        id: "sw02-7", tags: ["zhize", "yang"],
        yw: "是故聖人不治已病治未病，不治已亂治未亂，此之謂也。夫病已成而後藥之，亂已成而後治之，譬猶渴而穿井，鬥而鑄錐，不亦晚乎！",
        bh: "所以圣人不等到已经生病才去治疗，而是在疾病发生之前就加以预防；不等到已经动乱才去治理，而是在动乱发生之前就加以防范，说的就是这个。如果疾病已经形成才用药治疗，动乱已经发生才去治理，那就好比口渴了才去挖井，战斗已经开始了才去铸造兵器，不是太晚了吗！",
        notes: [
          { w: "义", t: "「治未病」三字的原始出处。注意它出现的位置——不是作为口号，而是四季养生论证链的末句，前提是顺时而养。" }
        ]
      }
    ]
  },

  {
    id: "sw03", book: "素问", no: 3, title: "生气通天论", titleTw: "生氣通天論",
    tags: ["yang", "bingji", "wuxing"],
    brief: "把阳气比作天空的太阳，再逐条推演阳气受损的六种路径。阳气病理学的总纲。",
    sections: [
      {
        id: "sw03-1", tags: ["yang"],
        yw: "黃帝曰：夫自古通天者，生之本，本於陰陽。天地之間，六合之內，其氣九州、九竅、五藏、十二節，皆通乎天氣。其生五，其氣三，數犯此者，則邪氣傷人，此壽命之本也。",
        bh: "黄帝说：自古以来，与天气相通是生命的根本，而这个根本又归结于阴阳。天地之间、四方上下之内，无论是地上的九州，还是人体的九窍、五脏、十二关节，都与天气相通。阴阳化生五行，又分为三阴三阳之气，屡次违犯这个规律，邪气就会伤害人体，所以这是寿命的根本所在。",
        notes: [{ w: "训", t: "六合：四方上下。十二节，双侧腕、肘、肩、髋、膝、踝共十二大关节。" }]
      },
      {
        id: "sw03-2", tags: ["yang"],
        yw: "陽氣者，若天與日，失其所則折壽而不彰，故天運當以日光明。是故陽因而上，衛外者也。",
        bh: "人体的阳气，好像天体中的太阳一样，如果失去了它应有的位次，人就会减损寿命而不显露生机，所以天体的运行应当有太阳的光明，人的生命也应当有阳气的温养。因此阳气是向上、向外运行的，起着护卫体表的作用。",
        notes: [
          { w: "按", t: "全书最著名的一个比喻。它把「阳气」的功能定义钉死了：向上 + 向外 + 卫外。" }
        ]
      },
      {
        id: "sw03-3", tags: ["bingji"],
        yw: "因於寒，欲如運樞，起居如驚，神氣乃浮。因於暑，汗，煩則喘喝，靜則多言，體若燔炭，汗出而散。因於濕，首如裹，濕熱不攘，大筋緛短，小筋弛長，緛短爲拘，弛長爲痿。因於氣，爲腫，四維相代，陽氣乃竭。",
        bh: "感受了寒邪，阳气应当像门轴的运转一样内守，如果起居躁动惊扰不安，神气就会向外浮越。感受了暑邪，就会出汗，烦躁时可见喘息有声，安静时则多言多语，身体像燃烧的炭一样发热，汗出之后热才散去。感受了湿邪，头部像被布裹住一样沉重，湿热不能消除，大筋就会收缩变短，小筋就会松弛变长，缩短的成为拘挛，弛长的成为痿弱。因于风气，会发生浮肿，四肢交替出现肿胀，阳气就会衰竭。",
        notes: [
          { w: "训", t: "緛，音软，缩短。弛长，松缓延长。四维，四肢。" },
          { w: "义", t: "寒、暑、湿、气四种病因，分别给出「神气浮/汗出/首如裹/肿」四组可辨识的主症，是一份症状鉴别表。" }
        ]
      },
      {
        id: "sw03-4", tags: ["bingji", "yang"],
        yw: "陽氣者，煩勞則張，精絕，闢積於夏，使人煎厥。目盲不可以視，耳閉不可以聽，潰潰乎若壞都，汩汩乎不可止。陽氣者，大怒則形氣絕，而血菀於上，使人薄厥。有傷於筋，縱，其若不容。汗出偏沮，使人偏枯。",
        bh: "阳气在过度烦劳的时候就会亢张外越，使阴精耗竭，这种情况重复累积到夏天，就会使人发生煎厥。表现为眼睛昏盲不能视物，耳窍闭塞不能听声，病情像堤防崩溃一样汹涌，像急流奔泻一样不可阻止。阳气在大怒的时候，会使形与气的功能阻绝，血郁积于上部，使人发生薄厥。如果损伤了筋脉，筋脉就会弛纵，肢体好像不受自己的支配。如果身体半侧出汗而另半侧不出汗，就会使人发生偏枯，即半身不遂。",
        notes: [
          { w: "训", t: "菀，音郁，郁积。沮，音举，阻止、不出。辟积，重复累积。" },
          { w: "义", t: "煎厥与薄厥：一因劳而生于夏，一因怒而发在急。都是「阳气失控」，但触发路径完全不同。" }
        ]
      },
      {
        id: "sw03-5", tags: ["yang", "bingji"],
        yw: "陽氣者，一日而主外，平旦人氣生，日中而陽氣隆，日西而陽氣已虛，氣門乃閉。是故暮而收拒，無擾筋骨，無見霧露，反此三時，形乃困薄。",
        bh: "阳气在一天之中主持于外：清晨人气开始生发，正午阳气最为隆盛，日落时阳气已经虚衰，汗孔的门户也就关闭了。所以到了傍晚就应当收敛阳气、拒守于内，不要扰动筋骨，不要接触雾气露水。如果违背了平旦、日中、日西这三个时段的阳气规律，形体就会被邪气困扰而衰薄。",
        notes: [
          { w: "按", t: "把一年压缩成一天。这也是子午流注一类时间医学的雏形。" }
        ]
      },
      {
        id: "sw03-6", tags: ["yang"],
        yw: "岐伯曰：陰者，藏精而起亟也；陽者，衛外而爲固也。陰不勝其陽，則脈流薄疾，並乃狂。陽不勝其陰，則五藏氣爭，九竅不通。是以聖人陳陰陽，筋脈和同，骨髓堅固，氣血皆從。",
        bh: "岐伯说：阴是内藏精气而不断地起来支援阳气的；阳是保卫体表而使身体固密的。如果阴不能克制阳气，脉中的气血流动就会急迫而快速，阳邪并于阳位就会发狂。如果阳不能克制阴气，五脏之气就会互相争扰，九窍就会不通畅。所以圣人调理阴阳，使筋脉和顺协调，骨髓坚固，气血都能顺从运行。",
        notes: [
          { w: "训", t: "起亟：不断地起来应接需求。亟，急也。" },
          { w: "义", t: "阴与阳在这里各给了一个动词定义：储备 + 支援（阴），屏蔽 + 固守（阳）。" }
        ]
      },
      {
        id: "sw03-7", tags: ["yang"],
        yw: "凡陰陽之要，陽密乃固，兩者不和，若春無秋，若冬無夏，因而和之，是謂聖度。故陽強不能密，陰氣乃絕；陰平陽祕，精神乃治；陰陽離決，精氣乃絕。",
        bh: "大凡阴阳的关键，在于阳气致密才能达到固密。二者不能协调，就好像只有春天而没有秋天、只有冬天而没有夏天一样。因此加以调和，就是圣人的法度。所以阳气过亢而不能固密，阴气就会随之竭绝；阴气平和，阳气固密，精神才能正常；阴阳分离决裂，精气也就随之竭尽了。",
        notes: [
          { w: "按", t: "「阴平阳秘」是中医最常被引用的一句原文，常被简化为「阴阳平衡」。原意更严：平的对象是阴（不虚不亢），秘的对象是阳（致密不散）。" }
        ]
      },
      {
        id: "sw03-8", tags: ["bingji", "wuxing"],
        yw: "陰之所生，本在五味；陰之五宮，傷在五味。是故味過於酸，肝氣以津，脾氣乃絕。味過於鹹，大骨氣勞，短肌，心氣抑。味過於甘，心氣喘滿，色黑，腎氣不衡。味過於苦，脾氣不濡，胃氣乃厚。味過於辛，筋脈沮弛，精神乃央。是故謹和五味，骨正筋柔，氣血以流，腠理以密，如是則骨氣以精，謹道如法，長有天命。",
        bh: "阴精的产生，来源于五味；而储藏阴精的五脏，又会被五味所伤害。所以过食酸味，肝气就会过盛而津溢，脾气就会衰竭。过食咸味，骨骼就会劳伤，肌肉短缩，心气受到抑郁。过食甘味，就会心气喘满，面色发黑，肾气失去平衡。过食苦味，脾气就不能濡润，胃气就会变得厚滞。过食辛味，筋脉就会败坏松弛，精神也会随之受损。因此谨慎地调和五味，骨骼就端正，筋脉就柔韧，气血得以畅行，腠理得以固密，这样骨气就精强有力，谨慎地遵循这些方法，就能享有天赋的寿命。",
        notes: [
          { w: "训", t: "五宫，五脏。沮，败坏。央，殃的通假，伤残。" },
          { w: "义", t: "五味既能养又能伤，判断标准是「各归所喜」。这是一组五行相克的实际应用：酸过则肝乘脾，咸过则肾乘心。" }
        ]
      }
    ]
  },

  {
    id: "sw05", book: "素问", no: 5, title: "阴阳应象大论", titleTw: "陰陽應象大論",
    tags: ["yinyang", "wuxing", "zangxiang", "zhenfa"],
    brief: "阴阳五行的方法论总纲。提出「治病必求于本」，并把清浊出入、气味形精的转化链讲透。",
    sections: [
      {
        id: "sw05-1", tags: ["yinyang"],
        yw: "黃帝曰：陰陽者，天地之道也，萬物之綱紀，變化之父母，生殺之本始，神明之府也。治病必求於本。",
        bh: "黄帝说：阴阳是天地间的普遍规律，是万物的纲领和法度，是变化的起源，是生长与消亡的根本，是一切神明变化所出的府库。治病一定要推求于阴阳这个根本。",
        notes: [
          { w: "按", t: "五个名词连用（纲纪/父母/本始/府），措辞极重。「治病必求于本」的「本」在此处有具体所指，不是泛泛的根本。" }
        ]
      },
      {
        id: "sw05-2", tags: ["yinyang"],
        yw: "故積陽爲天，積陰爲地。陰靜陽躁，陽生陰長，陽殺陰藏。陽化氣，陰成形。寒極生熱，熱極生寒。寒氣生濁，熱氣生清。清氣在下，則生飧泄；濁氣在上，則生䐜脹。此陰陽反作，病之逆從也。",
        bh: "所以阳气轻清上升而聚积成为天，阴气重浊下降而凝聚成为地。阴主静，阳主动；阳主生发，阴主成长；阳主肃杀，阴主闭藏。阳能化生出气，阴能构成形体。寒到极点会转化为热，热到极点会转化为寒。寒气凝聚而生浊阴，热气升散而生清阳。清阳之气当升而不升、反而陷在下，就会发生完谷不化的泄泻；浊阴之气当降而不降、反而滞在上，就会发生胸腹胀满。这就是阴阳的反向运行，也就是疾病的逆顺之别。",
        notes: [
          { w: "训", t: "䐜，音嗔，胀起。" },
          { w: "义", t: "「清气在下则为飧泄，浊气在上则为䐜胀」两句，是升降理论最实用的一对接线，脾胃病的处方由此分野。" }
        ]
      },
      {
        id: "sw05-3", tags: ["yinyang"],
        yw: "故清陽出上竅，濁陰出下竅；清陽發腠理，濁陰走五藏；清陽實四支，濁陰歸六府。",
        bh: "所以清阳之气出于上部的七窍，浊阴之液出于下部的二窍；清阳之气发散于腠理之间，浊阴之精内注于五脏之中；清阳之气充实于四肢，浊阴之水谷归于六腑。",
        notes: [
          { w: "按", t: "三组對應構成一張完整分配表：出路、居所、去向。背诵价值极高。" }
        ]
      },
      {
        id: "sw05-4", tags: ["bingji"],
        yw: "風勝則動，熱勝則腫，燥勝則幹，寒勝則浮，濕勝則濡瀉。",
        bh: "风气偏胜就会出现动摇震颤的症状，热气偏胜就会出现红肿的症状，燥气偏胜就会出现干枯的症状，寒气偏胜就会出现浮肿的症状，湿气偏胜就会出现濡润泄泻的症状。",
        notes: [
          { w: "按", t: "五字一组，把病因直接翻译成看得见的体征。这是《内经》里最短的一条鉴别口诀。" }
        ]
      },
      {
        id: "sw05-5", tags: ["zhenfa", "yinyang"],
        yw: "善診者，察色按脈，先別陰陽；審清濁，而知部分；視喘息，聽音聲，而知所苦；觀權衡規矩，而知病所主；按尺寸，觀浮沉滑澀，而知病所生。以治無過，以診則不失矣。",
        bh: "善于诊病的医生，观察气色、诊按脉象，首先辨别属阴属阳；审察面色的清浊，就能知道病变的部位；观看呼吸的喘息，听辨声音的变化，就能知道病者的痛苦所在；观察脉象的四时规矩，就能知道病变的主因；按切尺肤与寸口，观察脉象的浮沉滑涩，就能知道疾病产生的原因。这样施治就不会有过失，诊断就不会有差错。",
        notes: [
          { w: "训", t: "权衡规矩：四时脉象的形容——春应中规、夏应中矩、秋应中衡、冬应中权。" },
          { w: "按", t: "「先别阴阳」是第一步，不是最后一步。这句常被读成流程中的一環，其实是序位。" }
        ]
      },
      {
        id: "sw05-6", tags: ["zhize"],
        yw: "故曰：病之始起也，可刺而已；其盛，可待衰而已。故因其輕而揚之，因其重而減之，因其衰而彰之。形不足者，溫之以氣；精不足者，補之以味。其高者，因而越之；其下者，引而竭之；中滿者，瀉之於內。",
        bh: "所以说：疾病刚开始发作的时候，可以用针刺方法治愈；病情正盛的时候，可以等到邪气衰减时再行治疗而获愈。所以病势轻浅的，用轻扬宣散的方法；病势沉重的，用逐步削减的方法；正气衰弱的，用补益彰显的方法。形体虚弱的，用温养阳气的方法调补；阴精不足的，用厚味滋养的方法填补。病在上焦高位的，用涌吐的方法使邪气从上越出；病在下焦的，用疏导攻下的方法使邪从下排出；中焦胀满的，用分消的方法泻之于内。",
        notes: [
          { w: "义", t: "「因其盛，可待衰而已」是个反直觉的策略：正盛时不动手，等它自己衰减。与现代急则治标并不矛盾，针对的是周期性发作的病。" }
        ]
      }
    ]
  },

  {
    id: "sw08", book: "素问", no: 8, title: "灵兰秘典论", titleTw: "靈蘭秘典論",
    tags: ["zangxiang", "wuxing"],
    brief: "十二脏腑的官职隐喻，全文不足三百字，是藏象学说的定义性文本。右侧「十二官」图的数据源头。",
    sections: [
      {
        id: "sw08-0", tags: ["zangxiang"],
        yw: "黃帝問曰：願聞十二藏之相使，貴賤何如？岐伯對曰：悉乎哉問也！請遂言之。",
        bh: "黄帝问道：我想听听十二脏腑之间的相互役使关系，它们的主从贵贱是怎样的？岐伯回答说：你问得真详尽啊！请让我来谈谈这个问题。",
        notes: [{ w: "按", t: "「相使」与「贵贱」两个词说明了提问的性质：问的是组织结构图，不是功能清单。" }]
      },
      {
        id: "sw08-1", tags: ["zangxiang", "wuxing"], off: ["心", "肺", "肝"],
        yw: "心者，君主之官也，神明出焉。肺者，相傅之官，治節出焉。肝者，將軍之官，謀慮出焉。",
        bh: "心，如同君主一样的器官，精神意识由此产生。肺，如同辅佐君主的宰相，治理与节律由此产生。肝，如同出征作战的将军，谋略与思虑由此产生。",
        notes: [
          { w: "义", t: "三个官定的都是「信息处理」岗位：神明 = 决策中枢，治节 = 节律调度，谋虑 = 方案生成。" }
        ]
      },
      {
        id: "sw08-2", tags: ["zangxiang", "wuxing"], off: ["胆", "膻中"],
        yw: "膽者，中正之官，決斷出焉。羶中者，臣使之官，喜樂出焉。",
        bh: "胆，如同公正不偏的司法之官，判断与决断由此产生。膻中，如同传达命令的近臣，喜悦与欢乐由此产生。",
        notes: [
          { w: "训", t: "膻中，此处指心包络，为气之海。" },
          { w: "义", t: "肝出谋，胆决断。谋而不决在肝，决而不当在胆，这是两脏的分工。" }
        ]
      },
      {
        id: "sw08-3", tags: ["zangxiang"], off: ["脾", "胃", "大肠", "小肠"],
        yw: "脾胃者，倉廩之官，五味出焉。大腸者，傳道之官，變化出焉。小腸者，受盛之官，化物出焉。",
        bh: "脾胃，如同管理仓库的官员，五味滋养由此产生。大肠，如同负责运输传导的官员，糟粕由此变化形成。小肠，如同负责接收的官员，进一步分化食物精微的功能由此产生。",
        notes: [
          { w: "义", t: "三个都是「物流」岗位：入库分类（脾胃）、干线运输（大肠）、精粗分拣（小肠）。" }
        ]
      },
      {
        id: "sw08-4", tags: ["zangxiang"], off: ["肾", "三焦", "膀胱"],
        yw: "腎者，作強之官，伎巧出焉。三焦者，決瀆之官，水道出焉。膀胱者，州都之官，津液藏焉，氣化則能出矣。",
        bh: "肾，如同复兴百工的能工之官，精巧的技能由此产生。三焦，如同管理水利的官员，通调水道的功能由此产生。膀胱，如同汇聚水液的州都之地，津液储藏于此，经过气化作用才能排出体外。",
        notes: [
          { w: "训", t: "作强，作用强力。伎巧，精巧的技艺。决渎，疏通水道。州都，水液汇聚的地方。" },
          { w: "按", t: "注意膀胱是唯一一个在句末加了机制说明的：「气化则能出矣」。这是在强调它不是被动容器，排尿依赖气的推动。" }
        ]
      },
      {
        id: "sw08-5", tags: ["zangxiang"], off: ["心"],
        yw: "凡此十二官者，不得相失也。故主明則下安，以此養生則壽，歿世不殆，以爲天下則大昌。主不明則十二官危，使道閉塞而不通，形乃大傷，以此養生則殃，以爲天下者，其宗大危，戒之戒之！",
        bh: "这十二官之间，是不能失去协调的。所以君主清明，下属就安定，用这样的道理养生就能长寿，终身不会有危险；用这样的道理治理天下，国家就会昌盛繁荣。君主不明察，十二官就都危险了，联络的通道闭塞不通，形体就会受到大的伤害，用这样的状况养生就要遭殃，用这样的状况治理天下，他的宗社就非常危险，一定要警惕啊！",
        notes: [
          { w: "义", t: "「使道」是关键词：十二官之所以成为系统，靠的是通路而不是各自的职能。通路一闭，职能再全也垮。" },
          { w: "按", t: "全文由脏腑推及治国，一次性把医学与政治隐喻打通。这种跳跃在《内经》里并不常见。" }
        ]
      },
      {
        id: "sw08-6", tags: ["zangxiang"],
        yw: "至道在微，變化無窮，孰知其原！" + "恍惚之数，生于毫氂，毫氂之数，起于度量，千之万之，可以益大，推之大之，其形乃制。",
        bh: "最高深的道理在于细微之处，它的变化是无穷无尽的，谁能知道它的本原呢！那些若有若无的数量变化，产生于毫厘般的微小差别，毫厘般的微小差别，又起于测量的尺度标准。把它成千成万地积累，就可以由小变大，推演扩充开来，事物的形体规律才被认识把握。",
        notes: [
          { w: "训", t: "氂，音厘，同厘，极微小的长度单位。" },
          { w: "按", t: "讲完官职立刻接一段方法论：差异从极小处开始积累。这是《内经》少见的认识论插笔。" }
        ]
      }
    ]
  },

  {
    id: "sw10", book: "素问", no: 10, title: "五脏生成篇", titleTw: "五藏生成篇",
    tags: ["zangxiang", "zhenfa", "wuxing"],
    brief: "给出五脏与体、华、主的对应表，以及五色生死辨——望诊的基础数据结构。",
    sections: [
      {
        id: "sw10-1", tags: ["zangxiang", "wuxing"],
        yw: "心之合脈也，其榮色也，其主腎也。肺之合皮也，其榮毛也，其主心也。肝之合筋也，其榮爪也，其主肺也。脾之合肉也，其榮脣也，其主肝也。腎之合骨也，其榮髮也，其主脾也。",
        bh: "心与脉相合，它的荣华表现在面色上，受肾制约。肺与皮肤相合，它的荣华表现在毫毛上，受心制约。肝与筋相合，它的荣华表现在爪甲上，受肺制约。脾与肌肉相合，它的荣华表现在口唇上，受肝制约。肾与骨相合，它的荣华表现在头发上，受脾制约。",
        notes: [
          { w: "义", t: "每脏三件事：所合（它管什么组织）、所荣（外表哪里看得见）、所主（谁克它）。" },
          { w: "按", t: "「其荣」是可观察项。头发看肾、爪甲看肝、嘴唇看脾——这是最初的望诊接口。" }
        ]
      },
      {

{"id":"sw04","book":"素问","no":4,"title":"金匮真言论","titleTw":"金匱真言論","tags":["ci","zhenfa","bingji"],"brief":"论四时八风与五脏的对应关系、四季多发病，以及人身阴阳表里内外的划分和五脏应四时、配五色五味五谷五畜的收受。","pending":false,"sections":[{"id":"sw04-1","tags":[],"yw":"黃帝問曰∶天有八風，經有五風，何謂？岐伯對曰∶八風發邪，以爲經風，觸五髒，邪氣發病。所謂得四時之勝者，春勝長夏，長夏勝冬，冬勝夏，夏勝秋，秋勝春，所謂四時之勝也。東風生於春，病在肝，俞在頸項；南風生於夏，病在心，俞在胸脅；西風生於秋，病在肺，俞在肩背；北風生於冬，病在腎，俞在腰股；中央爲土，病在脾，俞在脊。故春氣者病在頭，夏氣者病在髒，秋氣者病在肩背，冬氣者病在四肢。故春善病鼽衄，仲夏善病胸脅，長夏善病洞泄寒中，秋善病風瘧，冬善病痹厥。","bh":"黄帝问道：天有八风，经有五风，这说的是什么？岐伯回答说：八风发散邪气，成为侵入经脉的风，触犯五脏，邪气于是使人发病。所谓得四时之胜，就是春胜长夏，长夏胜冬，冬胜夏，夏胜秋，秋胜春，这就是四时相胜的次序。东风生于春季，病发生在肝，俞（气血输注的穴位）在颈项；南风生于夏季，病在心，俞在胸胁；西风生于秋季，病在肺，俞在肩背；北风生于冬季，病在肾，俞在腰股；中央属土，病在脾，俞在脊。所以春气为病多在头，夏气为病多在五脏，秋气为病多在肩背，冬气为病多在四肢。所以春季容易患鼽衄（鼻塞流涕与鼻出血），仲夏容易病在胸胁，长夏容易患洞泄寒中（泄泻无度、内里有寒），秋季容易患风疟，冬季容易患痹厥（肢体麻木疼痛、手足逆冷）。","notes":[],"pending":false},{"id":"sw04-2","tags":[],"yw":"故冬不按蹺，春不鼽衄，春不病頸項，仲夏不病胸脅，長夏不病洞泄寒中，秋不病風瘧，冬不病痹厥，飧泄，而汗出也。夫精者，身之本也。故藏於精者，春不病溫。夏暑汗不出者，秋成風瘧。此平人脈法也。故曰∶陰中有陰，陽中有陽。平旦至日中，天之陽，陽中之陽也；日中至黃昏，天之陽，陽中之陰也；合夜至雞鳴，天之陰，陰中之陰也；雞鳴至平旦，天之陰，陰中之陽也。故人亦應之。夫言人之陰陽，則外爲陽，內爲陰。言人身之陰陽，則背爲陽，腹爲陰。","bh":"所以冬季不做按𫏋（扰动筋骨的按摩导引），春季就不患鼽衄，不病颈项，仲夏不病胸胁，长夏不病洞泄寒中，秋季不病风疟，冬季不病痹厥、飧泄和汗出。精，是人身的根本。所以能藏守精气的人，春季不患温病。夏季暑热时汗出不畅的，到秋季会成风疟。这是平人的脉法。所以说：阴中有阴，阳中有阳。从平旦到日中，是天之阳，属阳中之阳；从日中到黄昏，是天之阳，属阳中之阴；从合夜到鸡鸣，是天之阴，属阴中之阴；从鸡鸣到平旦，是天之阴，属阴中之阳。人也与此相应。就人的阴阳来说，外为阳，内为阴。就人身的阴阳来说，背为阳，腹为阴。","notes":[],"pending":false},{"id":"sw04-3","tags":[],"yw":"言人身之髒腑中陰陽，則髒者爲陰，腑者爲陽。肝心脾肺腎五髒皆爲陰，膽胃大腸小腸膀胱三焦六腑皆爲陽。所以欲知陰中之陰陽中之陽者何也？爲冬病在陰，夏病在陽，春病在陰，秋病在陽，皆視其所在，爲施針石也。故背爲陽，陽中之陽，心也；背爲陽，陽中之陰，肺也；腹爲陰，陰中之陰，腎也；腹爲陰，陰中之陽，肝也；腹爲陰，陰中之至陰，脾也。此皆陰陽表裏內外雌雄相輸應也，故以應天之陰陽也。帝曰∶五髒應四時，各有收受乎？岐伯曰∶有。","bh":"就人身脏腑中的阴阳来说，脏为阴，腑为阳。肝心脾肺肾五脏都属阴，胆、胃、大肠、小肠、膀胱、三焦六腑都属阳。那么要知道阴中之阴、阳中之阳是为什么呢？因为冬病在阴，夏病在阳，春病在阴，秋病在阳，都要看其所在之处，而施行针石之治。所以背为阳，阳中之阳是心；背为阳，阳中之阴是肺；腹为阴，阴中之阴是肾；腹为阴，阴中之阳是肝；腹为阴，阴中之至阴是脾。这都是阴阳、表里、内外、雌雄相互输应，所以与天之阴阳相应。黄帝说：五脏与四时相应，各有收受吗？岐伯说：有。","notes":[],"pending":false},{"id":"sw04-4","tags":[],"yw":"東方青色，入通於肝，開竅於目，藏精於肝，其病發驚駭，其味酸，其類草木，其畜雞，其谷麥，其應四時，上爲歲星，是以春氣在頭也，其音角，其數八，是以知病之在筋也，其臭臊。南方赤色，入通於心，開竅於耳，藏精於心，故病在五髒，其味苦，其類火，其畜羊，其谷黍，其應四時，上爲熒惑星，是以知病之在脈也，其音徵，其數七，其臭焦。中央黃色，入通於脾，開竅於口，藏精於脾，故病在舌本，其味甘，其類土，其畜牛，其谷稷。其應四時，上爲鎮星，是以知病之在肉也，其音宮，其數五，其臭香，西方白色，入通於肺，開竅於鼻，藏精於肺，故病在背，其味辛，其類金，其畜馬，其谷稻，其應四時，上爲太白星，是以知病之在皮毛也，其音商，其數九，其臭腥，北方黑色，入通於腎，開竅於二陰，藏精於腎，故病在溪，其味鹹，其類水，其畜彘。","bh":"东方青色，入通于肝，开窍于目，藏精于肝，其病发为惊骇，其味酸，其类为草木，其畜为鸡，其谷为麦，其应四时，上为岁星，所以春气在头，其音为角，其数为八，因此知道病在筋，其臭为臊。南方赤色，入通于心，开窍于耳，藏精于心，所以病在五脏，其味苦，其类为火，其畜为羊，其谷为黍，其应四时，上为荧惑星，因此知道病在脉，其音为征，其数为七，其臭为焦。中央黄色，入通于脾，开窍于口，藏精于脾，所以病在舌本，其味甘，其类为土，其畜为牛，其谷为稷，其应四时，上为镇星，因此知道病在肉，其音为宫，其数为五，其臭为香。西方白色，入通于肺，开窍于鼻，藏精于肺，所以病在背，其味辛，其类为金，其畜为马，其谷为稻，其应四时，上为太白星，因此知道病在皮毛，其音为商，其数为九，其臭为腥。北方黑色，入通于肾，开窍于二阴，藏精于肾，所以病在溪（肘膝腕踝等关节之处），其味咸，其类为水，其畜为彘（猪）。","notes":[],"pending":false},{"id":"sw04-5","tags":[],"yw":"其谷豆。其應四時，上爲辰星，是以知病之在骨也。其音羽，其數六，其臭腐，故善爲脈者，謹察五髒六腑，一逆一從，陰陽、表裏、雌雄之紀，藏之心意，合心於精，非其人勿教，非其真勿授，是謂得道。序∶乃其（上音乃）蕆（敕輦切）糅（女救切，雜也）瀅（音瑩）上古天真論∶徇（徐閏切，病也）痹（必至切）恬（上啼廉切，下音淡）更齒（上古行切，下齒更同）（於葛切）俠口（胡夾切，下同）額顱（落胡切）滲灌（上所禁切）解惰（上上聲）壽敝（毗祭切）眉睫（音接）恚嗔（上於桂切）愉（音俞）四氣調神大論∶予而（上音與）獺（他達切）（音如，鶉也）蕃秀（上音煩）螻蟈（上音樓，下古獲切，蛙也）蚯蚓（上音丘，下以志切）（古闃切，搏勞鳥也）蜩（音條）溽暑（上音辱）（音皆，瘦瘧也）欲熾（尺志切）壞戶（上步回切）始涸（胡各切）豺（音柴）亟奪（上去吏切）（苦割切）荔挺（上力計切，下大頂切）北鄉（音向）（古豆切，雉鳴）爲否（符鄙切，下不交否同）燠熱（上於六切）生氣通天論∶分（上聲）暴卒（倉沒切）荒佚（音逸）躁（則到切）喝（呼葛切）瘀（衣倨切）裹攘（汝陽切）（音軟，縮也）潰潰（古沒切，煩悶不止也）（在計切，又前計切）奔並（下去聲）偏沮（子魚切，潤也）痤（昨禾切）痱（方味切）怫（符弗切）（織加切）（許竹切）（尺制切）（而劣切）大僂（力主切）（力斗切，癰）瘍（音陽，下並同）俞（音庶）否隔（符鄙切，塞也）粗（千胡切）淖（奴教切，下並同）腸（普擊切）決憊（蒲拜切）癃（音隆）金匱真言論∶鼽（音求）按蹺（音腳）燔灼（上音煩）彘（直利切）<目錄>卷第二","bh":"其谷为豆，其应四时，上为辰星，因此知道病在骨，其音为羽，其数为六，其臭为腐。所以善于诊脉的人，谨慎审察五脏六腑，一逆一从，阴阳、表里、雌雄的纲纪，把这些藏在心中、与心意相合，不是合适的人不教，不是真传不授，这就叫做得道。〔以下为后世所附音释，即各篇字词的反切与直音，非经文正文，不译。〕","notes":[],"pending":false}]},
{"id":"sw06","book":"素问","no":6,"title":"阴阴离合论","titleTw":"陰陰離合論","tags":["bingji","zangxiang","yinyang"],"brief":"论三阴三阳的离合关系，以六经根起结聚的部位说明其开、阖、枢作用，指出三阳合为一阳、三阴合为一阴。","pending":false,"sections":[{"id":"sw06-1","tags":[],"yw":"黃帝問曰∶餘聞天爲陽，地爲陰，日爲陽，月爲陰，大小月三百六十日成一歲，人亦應之。今三陰三陽，不應陰陽，其故何也？岐伯對曰∶陰陽者，數之可十，推之可百，數之可千，推之可萬，萬之大不可勝數，然其要一也。天復地載，萬物方生，未出地者，命曰陰處，名曰陰中之陰；則出地者，命曰陰中之陽。陽予之正，陰爲之主。故生因春，長因夏，收因秋，藏因冬，失常則天地四塞。陰陽之變，其在人者，亦數之可數。帝曰∶願聞三陰三陽之離合也。","bh":"黄帝问道：我听说天为阳，地为阴，日为阳，月为阴，大月小月共三百六十日成为一岁，人体也与之相应。如今三阴三阳，却与阴阳之数不相合，这是什么缘故？岐伯回答说：阴阳，数起来可以有十，推演起来可以有百，数起来可以有千，推演起来可以有万，万之大不可胜数，然而它的要领只有一个。天复盖、地承载，万物才得以生长；尚未出地的，叫做阴处，名为阴中之阴；已经出地的，就叫阴中之阳。阳给予万物生长的正气，阴作为万物成形的主宰。所以生因于春，长因于夏，收因于秋，藏因于冬，若失常则天地四时之气闭塞不通。阴阳的变化，在人身上的，也是可以数得清的。黄帝说：希望听听三阴三阳的离合。","notes":[],"pending":false},{"id":"sw06-2","tags":[],"yw":"岐伯曰∶聖人南面而立，前曰廣明，後曰太衝，太衝之地，名曰少陰，少陰之上，名曰太陽，太陽根起於至陰，結於命門，名曰陰中之陽。中身而上，名曰廣明，廣明之下，名曰太陰，太陰之前，名曰陽明，陽明根起於厲兌，名曰陰中之陽。厥陰之表，名曰少陽，少陽根起於竅陰，名曰陰中之少陽。是故三陽之離合也，太陽爲開，陽明爲闔，少陽爲樞。三經者，不得相失也，搏而勿浮，命曰一陽。帝曰∶願聞三陰。岐伯曰∶外者爲陽，內者爲陰，然則中爲陰，其衝在下，名曰太陰，太陰根起於隱白，名曰陰中之陰。","bh":"岐伯说：圣人面向南而立，前方叫做广明，后方叫做太冲。太冲所居之处，名为少阴；少阴之上，名为太阳。太阳的根起于至阴，结于命门，名为阴中之阳。中身以上，名为广明；广明之下，名为太阴；太阴之前，名为阳明。阳明的根起于厉兑，名为阴中之阳。厥阴之表，名为少阳；少阳的根起于窍阴，名为阴中之少阳。所以三阳的离合是：太阳为开，阳明为阖，少阳为枢。这三条经，不可相互失调，搏聚而不浮散，叫做一阳。黄帝说：希望听听三阴。岐伯说：在外的为阳，在内的为阴，这样则中为阴，其冲脉在下，名为太阴；太阴的根起于隐白，名为阴中之阴。","notes":[],"pending":false},{"id":"sw06-3","tags":[],"yw":"太陰之後，名曰少陰，少陰根起於湧泉，名曰陰中之少陰。少陰之前，名曰厥陰，厥陰根起於大敦，陰之絕陽，名曰陰之絕陰。是故三陰之離合也，太陰爲開，厥陰爲闔，少陰爲樞。三經者，不得相失也，搏而勿沉，名曰一陰。陰陽衝衝，積傳爲一周，氣裏形表而爲相成也。<目錄>卷第二","bh":"太阴之后，名为少阴；少阴的根起于涌泉，名为阴中之少阴。少阴之前，名为厥阴；厥阴的根起于大敦，是阴气极尽阳气之处，名为阴之绝阴。所以三阴的离合是：太阴为开，厥阴为阖，少阴为枢。这三条经，不可相互失调，搏聚而不沉陷，叫做一阴。阴阳之气往来运行，积传周流成为一周，气行于里、形见于表，相互为用而相成。","notes":[],"pending":false}]},
{"id":"sw07","book":"素问","no":7,"title":"阴阳别论","titleTw":"陰陽別論","tags":["zhenfa","bingji","zangxiang"],"brief":"论从脉之阴阳辨别病处与死生之期，以胃气为根本，真脏脉见则死，并举各经合病及其传变与预后。","pending":false,"sections":[{"id":"sw07-1","tags":[],"yw":"黃帝問曰∶人有四經十二從，何謂？岐伯對曰∶四經應四時，十二從應十二月，十二月應十二脈。脈有陰陽，知陽者知陰，知陰者知陽。凡陽有五，五五二十五陽。所謂陰者，真髒也，見則爲敗，敗必死也。所謂陽者，胃脘之陽也。別於陽者，知病處也；別於陰者，知死生之期。三陽在頭，三陰在手，所謂一也。別於陽者，知病忌時；別於陰者，知死生之期。謹熟陰陽，無與衆謀。所謂陰陽者，去者爲陰，至者爲陽；靜者爲陰，動者爲陽；遲者爲陰，數者爲陽。","bh":"黄帝问道：人有四经十二从，这说的是什么？岐伯回答说：四经与四时相应，十二从与十二月相应，十二月与十二脉相应。脉有阴阳，知阳就知道阴，知阴就知道阳。凡阳脉有五，五五共二十五阳。所谓阴，是指真脏脉，出现就是脏气败坏，败坏必死。所谓阳，是指胃脘之阳。辨别阳脉，可以知道病在何处；辨别阴脉，可以知道死生的期限。三阳在头，三阴在手，所说的道理是一样的。辨别阳脉，可以知道病当忌的时日；辨别阴脉，可以知道死生的期限。谨慎熟习阴阳之理，就不必与众议谋。所谓阴阳：脉去的为阴，脉至的为阳；静的为阴，动的为阳；迟的为阴，数的为阳。","notes":[],"pending":false},{"id":"sw07-2","tags":[],"yw":"凡持真脈之髒脈者，肝至懸絕急，十八日死；心至懸絕，九日死；肺至懸絕，十二日死；腎至懸絕，七日死；脾至懸絕，四日死。曰∶二陽之病發心脾，有不得隱曲，女子不月；其傳爲風消，其傳爲息賁者，死不治。曰∶三陽爲病發寒熱，下爲癰腫，及爲痿厥；其傳爲索澤，其傳爲頹疝。曰∶一陽發病，少氣善咳善泄；其傳爲心掣，其傳爲隔。二陽一陰發病，主驚駭背痛，善噫善欠，名曰風厥。二陰一陽發病，善脹心滿善氣。三陽三陰發病，爲偏枯痿易，四肢不舉。","bh":"凡是诊得真脏脉的：肝脉来时悬绝而急，十八日死；心脉来时悬绝，九日死；肺脉来时悬绝，十二日死；肾脉来时悬绝，七日死；脾脉来时悬绝，四日死。又说：二阳之病发于心脾，有不得隐曲（二便不利，也指情志郁结）之症，女子则月经不来；其传变为风消，再传为息贲，就不治而死。又说：三阳为病，发为寒热，在下发为痈肿，以及痿厥；其传变为索泽（皮肤枯槁不润），传变为颓疝。又说：一阳发病，少气，易咳易泄；其传变为心掣，传变为隔（阻隔不通）。二阳一阴发病，主惊骇、背痛，常嗳气、常呵欠，名为风厥。二阴一阳发病，易腹胀、心满、善太息。三阳三阴发病，成为偏枯、痿易，四肢不能举动。","notes":[],"pending":false},{"id":"sw07-3","tags":[],"yw":"鼓一陽曰鉤，鼓一陰曰毛，鼓陽勝急曰弦，鼓陽至而絕曰石，陰陽相過曰溜。陰爭於內，陽擾於外，魄汗未藏，四逆而起，起則燻肺，使人喘鳴。陰之所生，和本曰和。是故剛與剛，陽氣破散，陰氣乃消亡。淖則剛柔不和，經氣乃絕。死陰之屬，不過三日而死；生陽之屬，不過四日而死。所謂生陽死陰者，肝之心謂之生陽，心之肺謂之死陰，肺之腎謂之重陰，腎之脾謂之辟陰，死不治。結陽者，腫四肢。結陰者，便血一升，再結二升，三結三升。陰陽結斜，多陰少陽曰石水，少腹腫。","bh":"脉搏动来一阳叫做钩，鼓动一阴叫做毛，鼓动阳气胜而急的叫做弦，阳气至而断绝的叫做石，阴阳之气相过往的叫做溜。阴争于内，阳扰于外，魄汗未能收藏，四肢厥逆而起，逆气上熏于肺，使人喘息有声。阴之所以能生，在于与阳和调，叫做和。所以刚与刚相合，阳气破散，阴气也就消亡。淖（气血濡浊失常）则刚柔不和，经气就会断绝。属于死阴的，不过三日而死；属于生阳的，不过四日而死。所谓生阳死阴：肝病传心叫做生阳，心病传肺叫做死阴，肺病传肾叫做重阴，肾病传脾叫做辟阴，皆为不治而死。阳气郁结的，四肢浮肿。阴气郁结的，便血一升，二结二升，三结三升。阴阳郁结偏斜，阴多阳少的叫做石水，少腹肿。","notes":[],"pending":false},{"id":"sw07-4","tags":[],"yw":"二陽結謂之消，三陽結謂之隔，三陰結謂之水，一陰一陽結謂之喉痹。陰搏陽別謂之有子。陰陽虛腸辟死。陽加於陰謂之汗。陰虛陽搏謂之崩。三陰俱搏，二十日夜半死。二陰俱搏，十三日夕時死。一陰俱搏，十日死。三陽俱搏且鼓，三日死。三陰三陽俱搏，心腹滿。發盡不得隱曲，五日死。二陽俱搏，其病溫，死不治，不過十日死。陰陽應象大論∶脹（上昌真切，肉脹起也）滲泄（上所禁切）翕（下許極切）噦噫（上乙劣切，下烏界切）能冬（上奴代切，下能夏、形能並同）放效（上妃兩切）並於（上去聲）嗌（伊芳者切）滑澀（下音色）漬（即賜切）陰陽離合論∶予（猶與也）陰陽別論∶（音喘，腓腸也）（音淵，疼也）淖（音淘，水朝宗於海）<目錄>卷第三","bh":"二阳结叫做消，三阳结叫做隔，三阴结叫做水，一阴一阳结叫做喉痹。尺部阴脉搏击而与寸部阳脉有别，叫做有子。阴阳俱虚而肠辟（下利）的，死。阳加于阴叫做汗。阴虚阳搏叫做崩。三阴之脉俱搏击的，二十日夜半死。二阴俱搏的，十三日傍晚死。一阴俱搏的，十日死。三阳俱搏而且鼓甚的，三日死。三阴三阳俱搏，心腹胀满，发作已尽而二便不通的，五日死。二阳俱搏，其病为温，死不治，不过十日死。〔以下为后世所附音释，非经文正文，不译。〕","notes":[],"pending":false}]},
{"id":"sw09","book":"素问","no":9,"title":"六节藏象论","titleTw":"六節藏象論","tags":["zangxiang","yinyang","wuxing"],"brief":"论天度气数、候气时令与五运太过不及，并述藏象、五脏通于四时之气，以及人迎寸口脉盛的诊法。","pending":false,"sections":[{"id":"sw09-1","tags":[],"yw":"黃帝問曰∶餘聞天以六六之節，以成一歲，人以九九制會，計人亦有三百六十五節以爲天地，久矣。不知其所謂也？岐伯對曰∶昭乎哉問也，請遂言之。夫六六之節，九九制會者，所以正天之度、氣之數也。天度者，所以制日月之行也；氣數者，所以紀化生之用也。天爲陽，地爲陰；日爲陽，月爲陰；行有分紀，周有道理，日行一度，月行十三度而有奇焉，故大小月三百六十五日而成歲，積氣餘而盈閏矣。立端於始，表正於中，推餘於終，而天度畢矣。","bh":"黄帝问道：我听说天以六六之节成为一岁，人以九九制会相配，人也有三百六十五节以应天地，这种说法由来已久。不知它说的是什么？岐伯回答说：问得高明啊，请让我详尽地说。六六之节、九九制会，是用来确定天之度数和气之数的。天度，是用来测度日月运行的；气数，是用来记录万物化生作用的。天为阳，地为阴；日为阳，月为阴；运行有分野与纪度，周行有轨道与法度，日行一度，月行十三度而有余，所以大月小月三百六十五日成为一岁，积累余气而成闰月。立端于始，表正于中，推余于终，天度就完备了。","notes":[],"pending":false},{"id":"sw09-2","tags":[],"yw":"帝曰∶餘已聞天度矣，願聞氣數何以合之？岐伯曰∶天以六六爲節，地以九九制會，天有十日，日六竟而周甲，甲六復而終歲，三百六十日法也。夫自古通天者，生之本，本於陰陽，其氣九州九竅，皆通乎天氣。故其生五，其氣三，三而成天，三而成地，三而成人，三而三之，合則爲九，九分爲九野，九野爲九藏，故形藏四，神藏五，合爲九藏以應之也。帝曰∶餘已聞六六九九之會也，夫子言積氣盈閏，願聞何謂氣？請夫子發蒙解惑焉。岐伯曰∶此上帝所祕，先師傳之也。","bh":"黄帝说：我已经听说了天度，希望听听气数怎样与之相合？岐伯说：天以六六为节，地以九九制会。天有十日（十天干），日行六竟而周甲，甲六复而终岁，这是三百六十日的法度。自古以来与天相通的，是生命的根本，根本在于阴阳。其气九州、九窍，都通于天气。所以其生化有五，其气有三，三而成天，三而成地，三而成人，三三相合则为九，九分为九野，九野分为九脏，所以形脏有四、神脏有五，合为九脏以相应。黄帝说：我已经听到六六九九之会了，先生说积气盈闰，希望听听什么叫做气？请先生启发蒙昧、解除疑惑。岐伯说：这是上帝所秘藏、先师传授下来的。","notes":[],"pending":false},{"id":"sw09-3","tags":[],"yw":"帝曰∶請遂聞之。岐伯曰∶五日謂之候，三候謂之氣，六氣謂之時，四時謂之歲，而各從其主治焉。五運相襲，而皆治之，終期之日，周而復始，時立氣布，如環無端，候亦同法。故曰∶不知年之所加，氣之盛衰，虛實之所起，不可以爲工矣。帝曰∶五運之始，如環無端，其太過不及何如？岐伯曰∶五氣更立，各有所勝，盛虛之變，此其常也。帝曰∶平氣何如？岐伯曰∶無過者也。帝曰∶太過不及奈何？岐伯曰∶在經有也。帝曰∶何謂所勝？岐伯曰∶春勝長夏，長夏勝冬，冬勝夏，夏勝秋，秋勝春，所謂得五行時之勝，各以氣命其髒。","bh":"黄帝说：请详尽地讲给我听。岐伯说：五日叫做一候，三候叫做一气，六气叫做一时，四时叫做一岁，而各从其主治之气。五运行气相承袭，各有主治之时，到终结之日，周而复始；时令确立、气分布置，如环无端，候也是同样的方法。所以说：不知每年所加之气、气的盛衰、虚实所起的原因，就不能做医生。黄帝说：五运之始，如环无端，它的太过与不及怎样？岐伯说：五气更替主令，各有其所胜，盛虚的变化，这是常理。黄帝说：平气怎样？岐伯说：就是没有过与不及。黄帝说：太过不及怎样？岐伯说：在经书上已有记载。黄帝说：什么叫做所胜？岐伯说：春胜长夏，长夏胜冬，冬胜夏，夏胜秋，秋胜春，这就是得五行时令之胜，各以其气命名其所应的脏。","notes":[],"pending":false},{"id":"sw09-4","tags":[],"yw":"帝曰∶何以知其勝？岐伯曰∶求其至也，皆歸始春，未至而至，此謂太過，則薄所不勝，而乘所勝也，命曰氣淫。不分邪僻內生工不能禁。至而不至，此謂不及，則所勝妄行，而所生受病，所不勝薄之也，命曰氣迫。所謂求其至者，氣至之時也。謹候其時，氣可與期，失時反候，五治不分，邪僻內生，工不能禁也。帝曰∶有不襲乎？岐伯曰∶蒼天之氣，不得無常也。氣之不襲，是謂非常，非常則變矣。帝曰∶非常而變奈何？岐伯曰∶變至則病，所勝則微，所不勝則甚，因而重感於邪，則死矣。","bh":"黄帝说：怎样知道它的胜？岐伯说：推求气至之时，都以立春为始。时令未到而气先至，这叫做太过，则侵犯它所不胜之气，而乘凌它所胜之气，名叫气淫。〔此处原文疑有错简重出，不分邪僻内生，工不能禁一句与下文重复。〕时令已到而气不至，这叫做不及，则它所胜之气妄行，它所生之气受病，它所不胜之气又来迫近，名叫气迫。所谓求其至，指的就是气至之时。谨慎等候其时，气就可以预期；错失其时、违反气候，则五运之治不能分辨，邪僻内生，医生也不能制止。黄帝说：有没有不相承袭的？岐伯说：苍天之气，不能没有常度。气不相承袭，就是非常，非常就会有变。黄帝说：非常而有变会怎样？岐伯说：变至则发病，若为其所胜之气则病微，为其所不胜之气则病甚，因而再感受邪气，就会死亡。所以不在其所克之时则病微，正当其时则病甚。","notes":[],"pending":false},{"id":"sw09-5","tags":[],"yw":"故非其時則微，當其時則甚也。帝曰∶善。餘聞氣合而有形，因變以正名。天地之運，陰陽之化，其於萬物，孰少孰多，可得聞乎？岐伯曰∶悉哉問也，天至廣不可度，地至大不可量，大神靈問，請陳其方。草生五色，五色之變，不可勝視，草生五味，五味之美，不可勝極，嗜欲不同，各有所通。天食人以五氣，地食人以五味。五氣入鼻，藏於心肺，上使五色修明，音聲能彰。五味入口，藏於腸胃，味有所藏，以養五氣，氣和而生，津液相成，神乃自生。","bh":"黄帝说：好。我听说气相合而有形，因变化而正定名称。天地的运行、阴阳的变化，对于万物来说，孰少孰多，可以听听吗？岐伯说：问得详尽啊！天极广大不可测度，地极广大不可量度，这是神圣的提问，请让我陈述其中的大略。草生五色，五色的变化不可尽看；草生五味，五味的美好不可穷极；人的嗜欲不同，各有所通。天以五气供给人，地以五味供给人。五气入鼻，藏于心肺，上使五色修明、音声能显。五味入口，藏于肠胃，味有所藏，以养五气，气和而生，津液相辅相成，神就自然产生了。","notes":[],"pending":false},{"id":"sw09-6","tags":[],"yw":"帝曰∶髒象何如？岐伯曰∶心者，生之本，神之變也，其華在面，其充在血脈，爲陽中之太陽，通於夏氣。肺者，氣之本，魄之處也，其華在毛，其充在皮，爲陽中之太陰，通於秋氣。腎者，主蟄封藏之本，精之處也，其華在發，其充在骨，爲陰中之少陰，通於冬氣。肝者，罷極之本，魂之居也，其華在爪，其充在筋，以生血氣，其味酸，其色蒼，此爲陽中之少陽，通於春氣。脾胃大腸小腸三焦膀胱者，倉廩之本，營之居也，名曰器，能化糟粕，轉味而入出者也，其華在脣四白，其充在肌，其味甘，其色黃，此至陰之類，通於土氣。","bh":"黄帝说：藏象怎样？岐伯说：心，是生命的根本、神的变化所在，其荣华表现在面，其充养在血脉，为阳中之太阳，通于夏气。肺，是气的根本、魄所居之处，其荣华在毛，其充养在皮，为阳中之太阴，通于秋气。肾，主蛰伏、为封藏的根本，是精所居之处，其荣华在发，其充养在骨，为阴中之少阴，通于冬气。肝，是耐受疲劳的根本、魂所居之处，其荣华在爪，其充养在筋，以生血气，其味酸，其色苍，此为阳中之少阳，通于春气。脾、胃、大肠、小肠、三焦、膀胱，是仓廪的根本、营气所居之处，名为器，能消化糟粕、转输五味而主出入，其荣华在唇四白，其充养在肌，其味甘，其色黄，这属于至阴之类，通于土气。","notes":[],"pending":false},{"id":"sw09-7","tags":[],"yw":"凡十一髒，取決於膽也。故人迎一盛病在少陽，二盛病在太陽，三盛病在陽明，四盛以上爲格陽。寸口一盛病在厥陰，二盛病在少陰，三盛病在太陰，四盛以上爲關陰。人迎與寸口俱盛四倍以上爲關格，關格之脈羸，不能極於天地之精氣，則死矣。<目錄>卷第三","bh":"以上十一脏，都取决于胆。所以人迎脉大一倍，病在少阳；大二倍，病在太阳；大三倍，病在阳明；大四倍以上的为格阳。寸口脉大一倍，病在厥阴；大二倍，病在少阴；大三倍，病在太阴；大四倍以上的为关阴。人迎与寸口都大四倍以上的为关格，关格的脉气衰羸，不能极尽天地的精气，就会死亡。","notes":[],"pending":false}]},
{"id":"sw11","book":"素问","no":11,"title":"五脏别论","titleTw":"五髒別論","tags":["ci","zhenfa","bingji"],"brief":"论奇恒之腑与传化之腑的分别，五脏藏精气而不泻、六腑传化物而不藏，并说明气口独为五脏主的道理。","pending":false,"sections":[{"id":"sw11-1","tags":[],"yw":"黃帝問曰∶餘聞方士，或以腦髓爲髒，或以腸胃爲髒，或以爲腑，敢問更相反，皆自謂是，不知其道，願聞其說。岐伯對曰∶腦髓骨脈膽女子胞，此六者地氣之所生也，皆藏於陰而象於地，故藏而不瀉，名曰奇恆之府。夫胃大腸小腸三焦膀胱，此五者，天氣之所生也，其氣象天，故瀉而不藏，此受五髒濁氣，名曰傳化之府，此不能久留輸瀉者也。魄門亦爲五髒使，水谷不得久藏。所謂五髒者，藏精氣而不瀉也，故滿而不能實。六腑者，傳化物而不藏，故實而不能滿也。","bh":"黄帝问道：我听说方士之中，有的把脑髓当作脏，有的把肠胃当作脏，有的又把它们当作腑，彼此相反，都自认为正确，不知其中的道理，希望听听其中的说法。岐伯回答说：脑、髓、骨、脉、胆、女子胞，这六者是地气所生，都藏于阴而象地，所以藏而不泻，名叫奇恒之府。胃、大肠、小肠、三焦、膀胱，这五者是天气所生，其气象天，所以泻而不藏，它们接受五脏的浊气，名叫传化之府，这是不能久留而须转输泻出的。魄门（肛门）也是为五脏役使的，使水谷不得久藏。所谓五脏，是藏精气而不泻的，所以满而不能实。六腑，是传化水谷之物而不藏的，所以实而不能满。","notes":[],"pending":false},{"id":"sw11-2","tags":[],"yw":"所以然者，水谷入口，則胃實而腸虛；食下，則腸實而胃虛。故曰實而不滿，滿而不實也。帝曰∶氣口何以獨爲五髒主？岐伯曰∶胃者，水谷之海，六腑之大源也。五味入口，藏於胃以養五髒氣，氣口亦太陰也。是以五髒六腑之氣味，皆出於胃，變見於氣口。故五氣入鼻，藏於心肺，心肺有病，而鼻爲之不利也。凡治病必察其下，適其脈，觀其志意，與其病也。拘於鬼神者，不可與言至德。惡於針石者，不可與言至巧。病不許治者，病必不治，治之無功矣。","bh":"之所以这样：水谷入口，则胃实而肠虚；食物下行，则肠实而胃虚。所以说实而不满、满而不实。黄帝说：气口为什么独为五脏之主？岐伯说：胃是水谷之海，六腑的大源。五味入口，藏于胃以养五脏之气，气口也属于太阴。所以五脏六腑的气味，都出于胃，变化显现于气口。五气入鼻，藏于心肺，心肺有病，鼻就为之不利。凡治病必须察其下（二便），审适其脉，观察其志意，以及其所患之病。拘泥于鬼神的人，不可与他谈论至高的医德；厌恶针石的人，不可与他谈论至巧的治法。有病而不许医治的人，病必不能治，勉强去治也没有功效。","notes":[],"pending":false},{"id":"sw11-3","tags":[],"yw":"靈蘭祕典論∶羶（徒旱切）廩（力稔切）瘠（音籍）瞿（音劬）六節藏象論∶僦（即就切）溲（所鳩切，小便也）五髒生成論∶胝（上丁尼切，下側救切）（音苔）（芳杯切）（音頑，又音君）隧（音遂）頏（胡浪切）顙（蘇朗切）系（奚帝切）顴（音權）（去魚切）（音虞）五髒別論∶（音巡）惡（音污）<目錄>卷第四","bh":"〔本节原卷为后世所附音释，即灵兰秘典论、六节藏象论、五脏生成论、五脏别论各篇字词的反切与直音，并非经文正文，不译。〕","notes":[],"pending":false}]},
{"id":"sw12","book":"素问","no":12,"title":"异法方宜论","titleTw":"異法方宜論","tags":["ci","bingji","zangxiang"],"brief":"论东南西北中五方地势不同，居民生活习惯各异，致病与治法亦随之不同，圣人杂合诸法各得其宜。","pending":false,"sections":[{"id":"sw12-1","tags":[],"yw":"黃帝問曰∶醫之治病也，一病而治各不同，皆愈何也？岐伯對曰∶地勢使然也。故東方之域，天地之所始生也，魚鹽之地，海濱傍水，其民食魚而嗜鹹，皆安其處，美其食，魚者使人熱中，鹽者勝血，故其民皆黑色疏理，其病皆爲癰瘍，其治宜砭石，故砭石者，亦從東方來。西方者，金玉之域，沙石之處，天地之所收引也，其民陵居而多風，水土剛強，其民不衣而褐薦，其民華食而脂肥，故邪不能傷其形體，其病生於內，其治宜毒藥，故毒藥者，亦從西方來。","bh":"黄帝问道：医生治病，同一种病而治法各不相同，却都能痊愈，为什么？岐伯回答说：这是地势造成的。所以东方之域，是天地之气开始发生的地方，是产鱼盐之地，海滨傍水，当地居民食鱼而嗜咸，都安于其处、以其食物为美。鱼使人热中（内里有热），盐能胜血（伤血），所以当地居民都肤色黑、肌理疏松，其病多为痈疡，治疗宜用砭石，所以砭石也是从东方来的。西方是金玉之域、沙石之处，是天地之气收敛收引的地方，当地居民依山陵而居而多风，水土刚强，其民不着衣而披褐荐（粗毛布与草席），其民美食而脂肥，所以邪气不能伤其形体，其病生于内，治疗宜用毒药，所以毒药也是从西方来的。","notes":[],"pending":false},{"id":"sw12-2","tags":[],"yw":"北方者，天地所閉藏之域也，其地高陵居，風寒冰冽，其民樂野處而乳食，髒寒生滿病，其治宜灸。故灸者，亦從北方來。南方者，天地所長養，陽之所盛處也，其地下，水土弱，霧露之所聚也，其民嗜酸而食。故其民皆致理而赤色，其病攣痹，其治宜微針。故九針者，亦從南方來。中央者，其地平以溼，天地所以生萬物也衆，其民食雜而不勞，故其病多痿厥寒熱，其治宜導引按蹺，故導引按蹺者，亦從中央出也。故聖人雜合以治，各得其所宜，故治所以異而病皆愈者，得病之情，知治之大體也。","bh":"北方是天地之气闭藏之域，地势高，居民依陵而居，风寒冰冽，其民乐于野外游处而以乳类为食，内脏受寒而生胀满之病，治疗宜用灸法，所以灸法也是从北方来的。南方是天地长养、阳气最盛之处，地势低下，水土薄弱，是雾露所聚集的地方，其民嗜酸而食发酵之物，所以其民肌理致密而色赤，其病为挛痹（筋脉拘挛、麻木疼痛），治疗宜用微针，所以九针也是从南方来的。中央地势平坦而湿润，是天地生育万物最多的地方，其民食物繁杂而不劳作，所以其病多为痿厥寒热，治疗宜用导引按𫏋，所以导引按𫏋也是从中央产生的。所以圣人综合各种治法而施治，各得其所宜，因此治法不同而病都能痊愈，是因为得病情、知治疗的大体。","notes":[],"pending":false},{"id":"sw12-3","tags":[],"yw":"<目錄>卷第四","bh":"〔本节原卷仅存卷第四的目录标记，无正文可译。〕","notes":[],"pending":false}]},
{"id":"sw13","book":"素问","no":13,"title":"移精变气论","titleTw":"移精變氣論","tags":["ci","zhenfa","bingji"],"brief":"论古今治病之异：古人可移精变气、祝由而已，今世必用毒药针石，强调治病以色脉为要、得神者昌。","pending":false,"sections":[{"id":"sw13-1","tags":[],"yw":"黃帝問曰∶餘聞古之治病，惟其移精變氣，可祝由而已。今世治病，毒藥治其內，針石治其外，或愈或不愈，何也？岐伯對曰∶往古人居禽獸之間，動作以避寒，陰居以避暑，內無眷慕之累，外無伸宦之形，此恬之世，邪不能深入也。故毒藥不能治其內，針石不能治其外，故可移精祝由而已。當今之世不然，憂患緣其內，苦形傷其外，又失四時之從，逆寒暑之宜，賊風數至，虛邪朝夕，內至五髒骨髓，外傷空竅肌膚，所以小病必甚，大病必死，故祝由不能已也。","bh":"黄帝问道：我听说古人治病，只须移易精神、变改气机，用祝由（祝说病由的巫祝之法）就可以治好。今世治病，用毒药治其内，用针石治其外，有的痊愈有的不愈，为什么？岐伯回答说：往古之人居于禽兽之间，活动以避寒，居阴凉处以避暑，内无眷恋思慕的牵累，外无奔走求官的形役，这是恬淡之世，邪气不能深入。所以毒药不必治其内，针石不必治其外，只要移精祝由就可以了。当今之世不然，忧患缠扰于内，劳苦损伤于外，又违逆四时的顺从、寒暑的宜忌，贼风屡次而至，虚邪朝夕侵袭，内至五脏骨髓，外伤空窍肌肤，所以小病必加重，大病必死亡，祝由就不能治好了。","notes":[],"pending":false},{"id":"sw13-2","tags":[],"yw":"帝曰∶善。餘欲臨病患，觀死生，決嫌疑，欲知其要，如日月光，可得聞乎？岐伯曰∶色脈者，上帝之所貴也，先師之所傳也。上古使僦貸季，理色脈而通神明，合之金木水火土四時八風六合，不離其常，變化相移，以觀其妙，以知其要，欲知其要，則色脈是矣。色以應日，脈以應月，常求其要，則其要也。夫色之變化，以應四時之脈，此上帝之所貴，以合於神明也，所以遠死而近生。生道以長，命曰聖王。中古之治病，至而治之，湯液十日，以去八風五痹之病，十日不已，治以草蘇草之枝，本末爲助，標本已得，邪氣乃服。","bh":"黄帝说：好。我要临视病人，观察死生，决断疑难，想掌握其中的要领，如日月之光那样明白，可以听听吗？岐伯说：色与脉，是上帝所贵重、先师所传授的。上古时命僦贷季研究色脉而通于神明，合乎金木水火土、四时八风六合，不离其常，变化相移，以观其妙，以知其要；要知道其要领，就是色脉。色以应日，脉以应月，常求其要领，就是其要。色的变化，与四时之脉相应，这是上帝所贵重、用以合于神明的，所以能远死而近生。生道由此而长久，就叫做圣王。中古之治病，病至而治之，用汤液十日，以去除八风五痹之病；十日不愈，再用草苏、草荄之枝（草药的叶与根）治疗，本末相助，标本已得，邪气就被制服了。","notes":[],"pending":false},{"id":"sw13-3","tags":[],"yw":"暮世之治病也則不然，治不本四時，不知日月，不審逆從，病形已成，乃欲微針治其外，湯液治其內，粗工兇兇，以爲可攻，故病未已，新病復起。帝曰∶願聞要道。岐伯曰∶治之要極，無失色脈，用之不惑，治之大則。逆從倒行，標本不得，亡神失國。去故就新，乃得真人。帝曰∶餘聞其要於夫子矣，夫子言不離色脈，此餘之所知也。岐伯曰∶治之極於一。帝曰∶何謂一？岐伯曰∶一者因得之。帝曰∶奈何？岐伯曰∶閉戶塞牖，系之病者，數問其情，以從其意，得神者昌，失神者亡。","bh":"暮世治病就不是这样了：治病不本于四时，不知日月，不审察逆从，病形已经形成，才想用微针治其外、汤液治其内，粗工凶凶然而为，以为可以攻治，所以旧病未愈，新病又起。黄帝说：希望听听重要的道理。岐伯说：治病的最高要领，在于不失误于色脉，运用它而不疑惑，这是治疗的大法。逆从倒行，标本不得，就会亡神失国。去掉旧的、趋向新的，才能成为真人。黄帝说：我已经从先生这里听到要领了，先生说不离色脉，这是我所知道的。岐伯说：治病的极致在于一。黄帝说：什么叫做一？岐伯说：一就是从病人身上得到的。黄帝说：怎样做？岐伯说：关闭门户、塞住窗户，与病人相系，反复询问其病情，顺从其心意，得神的昌盛，失神的死亡。","notes":[],"pending":false},{"id":"sw13-4","tags":[],"yw":"帝曰∶善。<目錄>卷第四","bh":"黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw14","book":"素问","no":14,"title":"汤液醪醴论","titleTw":"湯液醪醴論","tags":["ci","zhenfa","bingji"],"brief":"论汤液醪醴的制作与古今用之不同，指出神不使则病不愈，病为本、工为标，并述水肿病的治法。","pending":false,"sections":[{"id":"sw14-1","tags":[],"yw":"黃帝問曰∶爲五谷湯液及醪醴奈何？岐伯對曰∶必以稻米，炊之稻薪，稻米者完，稻薪者堅。帝曰∶何以然？岐伯曰∶此得天地之和，高下之宜，故能至完，伐取得時，故能至堅也。帝曰∶上古聖人作湯液醪醴，爲而不用何也？岐伯曰∶自古聖人之作湯液醪醴者，以爲備耳，夫上古作湯液，故爲而弗服也。中古之世，道德稍衰，邪氣時至，服之萬全。帝曰∶今之世不必已何也？岐伯曰∶當今之世，必齊毒藥攻其中，石針艾治其外也。帝曰∶形弊血盡而功不立者何？岐伯曰∶神不使也。","bh":"黄帝问道：怎样制作五谷汤液和醪醴？岐伯回答说：必须用稻米，用稻薪来炊煮；稻米之气完备，稻薪之质坚劲。黄帝说：为什么这样？岐伯说：这是因为稻得天地之和气、高下之适宜，所以能最为完备；砍伐取得其时，所以能最为坚劲。黄帝说：上古圣人制作汤液醪醴，做了却不用，为什么？岐伯说：自古圣人制作汤液醪醴，只是作为备用罢了；上古作汤液，所以做了而不服用。中古之世，道德稍衰，邪气时常侵犯，服用就可以万全。黄帝说：今世服用却不一定治好，为什么？岐伯说：当今之世，必须用毒药齐备以攻其内，用石针艾灸治其外。黄帝说：形体败坏、血气耗尽而治疗没有功效，为什么？岐伯说：是神不使的缘故。","notes":[],"pending":false},{"id":"sw14-2","tags":[],"yw":"帝曰∶何謂神不使？岐伯曰∶針石，道也。精神不進，志意不治，故病不可愈。今精壞神去，榮衛不可復收。何者？嗜欲無窮，而憂患不止，精氣弛壞，榮泣衛除，故神去之而病不愈也。帝曰∶夫病之始生也，極微極精，必先入結於皮膚。今良工皆稱曰∶病成名曰逆，則針石不能治，良藥不能及也。今良工皆得其法，守其數，親戚兄弟遠近音聲日聞於耳，五色日見於目，而病不愈者，亦何暇不早乎？岐伯曰∶病爲本，工爲標，標本不得，邪氣不服，此之謂也。","bh":"黄帝说：什么叫做神不使？岐伯说：针石只是治病的方法。病人的精神不进、志意不治，所以病不能愈。如今精坏神去，营卫（营运血脉与护卫肌表之气）不能再收敛。为什么呢？因为嗜欲无穷，而忧患不止，精气弛缓败坏，营血枯涩、卫气消除，所以神离去而病不愈。黄帝说：病在开始发生时，极其微细，必先结聚于皮肤。如今良工都说：病已成而名为逆，针石不能治，良药不能及。如今良工都掌握了治法、遵守着术数，亲戚兄弟远近的声音每天都听在耳中，五色每天都看在眼里，而病却不愈，这也是因为来不及早治吗？岐伯说：病为本，医生为标，标本不相得，邪气就不能被制服，说的就是这个道理。","notes":[],"pending":false},{"id":"sw14-3","tags":[],"yw":"帝曰∶其有不從毫毛而生，五髒陽以竭也，津液充郭，其魄獨居，精孤於內，氣耗於外，形不可與衣相保，此四極急而動中，是氣拒於內，而形施於外，治之奈何？岐伯曰∶平治於權衡，去宛陳，微動四極，溫衣，繆刺其處，以復其形。開鬼門，潔淨府，精以時服，五陽已布，疏滌五髒，故精自生，形自盛，骨肉相保，巨氣乃平。帝曰∶善。<目錄>卷第四","bh":"黄帝说：有的病不是从毫毛而生，而是五脏阳气已经衰竭，津液充溢于皮肤，其魄独居，精孤处于内，气耗散于外，形体不能与衣服相称，这是四肢极度紧急而扰动于内，是气拒于内而形弛于外，怎样治疗？岐伯说：平治于权衡（调衡阴阳），去除郁积陈旧之物，微微活动四肢，加厚衣服以保暖，用缪刺（左病刺右、右病刺左的刺法）刺其处，以恢复其形体。开鬼门（发汗），洁净府（利小便），使精气按时而服，五脏阳气已经布达，疏涤五脏，所以精自然生成，形自然充盛，骨肉相保，大气就能平复。黄帝说：好。","notes":[],"pending":false}]},
{"id":"sw15","book":"素问","no":15,"title":"玉版论要","titleTw":"玉版論要","tags":["ci","zhenfa","bingji"],"brief":"论揆度奇恒之法，据面色脉象的浅深、上下左右逆从判断病之轻重与死生，并论脉证逆从的关键。","pending":false,"sections":[{"id":"sw15-1","tags":[],"yw":"黃帝問曰∶餘聞揆度奇恆，所指不同，用之奈何？岐伯對曰∶揆度者，度病之淺深也。奇恆者，言奇病也。請言道之至數，五色脈變，揆度奇恆，道在於一。神轉不回，回則不轉，乃失其機，至數之要，迫近以微，着之玉版，命曰合玉機。容色見上下左右，各在其要。其色見淺者，湯液主治，十日已。其見深者，必齊主治，二十一日已。其見大深者，醪酒主治，百日已。色夭面脫，不治，百日盡已。脈短氣絕死，病溫虛甚死。色見上下左右，各在其要。","bh":"黄帝问道：我听说揆度、奇恒，所指不同，怎样运用？岐伯回答说：揆度，是衡量病的浅深。奇恒，是说奇病。请让我说医道的至数：五色与脉的变化、揆度奇恒，道理在于一。神运转而不回返，回返就不运转，就失去了它的枢机。至数的要领，切近而微妙，刻在玉版上，名叫合玉机。面容之色见于上下左右，各在其要害之处。其色浅的，用汤液主治，十日可愈；其色深的，必须用药剂主治，二十一日可愈；其色大深的，用醪酒主治，百日可愈；色夭而面脱的，不治，百日而死尽。脉短而气绝的死；病温而虚极的死。面色见于上下左右，各在其要害之处。","notes":[],"pending":false},{"id":"sw15-2","tags":[],"yw":"上爲逆，下爲從。女子右爲逆，左爲從；男子左爲逆，右爲從。易，重陽死，重陰死。陰陽反他，治在權衡相奪，奇恆事也，揆度事也。搏脈痹，寒熱之交。脈孤爲消氣，虛泄爲奪血。孤爲逆，虛爲從。行奇恆之法，以太陰始。行所不勝曰逆，逆則死；行所勝曰從，從則活。八風四時之勝，終而復始，逆行一過，不復可數，論要畢矣。<目錄>卷第四","bh":"色上行者为逆，下行者为从。女子色见于右为逆，见于左为从；男子色见于左为逆，见于右为从。若色变更移易，重阳的死，重阴的死。阴阳反他（阴阳反常相易），治法在于权衡相夺，这是奇恒之事，也是揆度之事。脉来搏击而为痹，是寒热之交争。脉孤为消气，虚泄为夺血；孤为逆，虚为从。行奇恒之法，从手太阴开始。行其所不胜叫做逆，逆则死；行其所胜叫做从，从则活。八风四时之胜，终而复始，若逆行一过，就不能再以常度数尽了，论要就讲完了。","notes":[],"pending":false}]},
{"id":"sw16","book":"素问","no":16,"title":"诊要经终论","titleTw":"診要經終論","tags":["ci","zhenfa","bingji"],"brief":"论四时人气所在与四季刺法所宜、误刺他季之害，刺胸腹必避五脏，并述十二经脉气绝之终的证候。","pending":false,"sections":[{"id":"sw16-1","tags":[],"yw":"黃帝問曰∶診要何如？岐伯對曰∶正月二月，天氣始方，地氣始發，人氣在肝。三月四月，天氣正方，地氣定發，人氣在脾。五月六月，天氣盛，地氣高，人氣在頭。七月八月，陰氣始殺，人氣在肺。九月十月，陰氣始冰，地氣始閉，人氣在心。十一月十二月，冰復，地氣合，人氣在腎。故春刺散俞，及與分理，血出而止，甚者傳氣，間者環也。夏刺絡俞，見血而止，盡氣閉環，痛病必下。秋刺皮膚，循理，上下同法，神變而止。冬刺俞竅於分理，甚者直下，間者散下。","bh":"黄帝问道：诊病的要领怎样？岐伯回答说：正月二月，天气开始升发，地气开始萌动，人气在肝。三月四月，天气正盛，地气定而发散，人气在脾。五月六月，天气旺盛，地气升高，人气在头。七月八月，阴气开始肃杀，人气在肺。九月十月，阴气开始凝冰，地气开始闭藏，人气在心。十一月十二月，冰封复结，地气闭密，人气在肾。所以春天刺散俞（散布的穴位）及分理（肌肉分理之间），出血即止；病重的，待其气传布；病轻的，气行一周即可。夏天刺络俞（浅表络脉的穴位），见血即止，邪气尽去而闭其环周，痛病必下。秋天刺皮肤，循其分理，上下同法，待神气变动即止。冬天刺俞窍于分理之间，病重的可直下深刺，病轻的可散下浅刺。","notes":[],"pending":false},{"id":"sw16-2","tags":[],"yw":"春夏秋冬，各有所刺，法其所在。春刺夏分，脈亂氣微，入淫骨髓，病不能愈，令人不嗜食，又且少氣。春刺秋分，筋攣，逆氣環爲咳嗽，病不愈，令人時驚，又且哭。春刺冬分，邪氣着藏，令人脹，病不愈，又且欲言語。夏刺春分，病不愈，令人解惰。夏刺秋分，病不愈，令人心中欲無言，惕惕如人將捕之。夏刺冬分，病不愈，令人少氣，時欲怒。秋刺春分，病不已，令人惕然欲有所爲，起而忘之。秋刺夏分，病不已，令人益嗜臥，又且善夢。秋刺冬分，病不已，令人灑灑時寒。","bh":"春夏秋冬，各有所刺之法，取法于气之所在。春刺夏分，则脉乱气微，邪入淫于骨髓，病不能愈，使人不欲饮食，而且少气。春刺秋分，则筋挛，逆气环周而为咳嗽，病不愈，使人时常惊骇，又且欲哭。春刺冬分，则邪气着藏，使人腹胀，病不愈，又且多言语。夏刺春分，病不愈，使人懈惰。夏刺秋分，病不愈，使人心中欲无言，惕惕然如有人将要捕捉他。夏刺冬分，病不愈，使人少气，时常欲怒。秋刺春分，病不已，使人惕然欲有所为，起来又忘记了。秋刺夏分，病不已，使人更加嗜卧，又且多梦。秋刺冬分，病不已，使人洒洒然时时恶寒。","notes":[],"pending":false},{"id":"sw16-3","tags":[],"yw":"冬刺春分，病不已，令人欲臥不能眠，眠而有見。冬刺夏分，病不愈，氣上，發爲諸痹。冬刺秋分，病不已，令人善渴。凡刺胸腹者，必避五髒。中心者環死，中脾者五日死，中腎者七日死，中肺者五日死，中膈者，皆爲傷中，其病雖愈，不過一歲必死。刺避五髒者，知逆從也。所謂從者，膈與脾腎之處，不知者反之。刺胸腹者，必以布着之，乃從單布上刺，刺之不愈復刺。刺針必肅，刺腫搖針，經刺勿搖，此刺之道也。帝曰∶願聞十二經脈之終奈何？岐伯曰∶太陽之脈，其終也戴眼反折螈，其色白，絕汗乃出，出則死矣。","bh":"冬刺春分，病不已，使人欲卧而不能眠，眠而有所见。冬刺夏分，病不愈，气上逆，发为诸痹。冬刺秋分，病不已，使人易渴。凡刺胸腹的，必须避开五脏。刺中心脏的，一日而死；刺中脾的，五日死；刺中肾的，七日死；刺中肺的，五日死；刺中膈的，都属于伤中，其病虽然当时痊愈，不过一年必死。刺而能避开五脏的，是知道逆从。所谓从，是指膈与脾肾之处，不知道的就会相反。刺胸腹的，必须先用布复盖，再从单布上刺，刺之不愈可以复刺。刺针必须严肃；刺肿病要摇针，刺经脉不要摇针，这是刺法之道。黄帝说：希望听听十二经脉气绝之终是怎样的？岐伯说：太阳之脉，其终时两目上视、角弓反张、手足抽搐，面色白，绝汗乃出，汗出就死了。","notes":[],"pending":false},{"id":"sw16-4","tags":[],"yw":"少陽終者，耳聾百節皆縱，目HT絕系，絕系一日半死，其死也色先青白，乃死矣。陽明終者，口目動作，善驚妄言，色黃，其上下經盛，不仁，則終矣。少陰終者，面黑齒長而垢，腹脹閉，上下不通而終矣。太陰終者，腹脹閉不得息，善噫善嘔，嘔則逆，逆則面赤，不逆則上下不通，不通則面黑皮毛焦而終矣。厥陰終者，中熱嗌干，善溺心煩，甚則舌卷卵上縮而終矣。此十二經之所敗也。異法方宜論∶蹺（巨嬌切）砭（普廉切）致（直利切）移精變氣論∶（古哀切，草根也）標（必堯切）湯液醪醴論∶（音勞）（音，斬也）滌（音迪）穢（音畏）玉版論∶度（徒各切）（必益切）診要經終論∶（古堯切）（音縱）HT（音瓊）（音閃）跗（音夫）<目錄>卷第五","bh":"少阳终者，耳聋，全身关节都弛纵，目系绝，目绝系一日半死；其死时面色先青白，然后死。阳明终者，口眼动作，易惊、妄言，色黄，其上下经脉盛，不知痛痒（不仁），就终了。少阴终者，面黑，齿长而垢，腹胀闭，上下不通而终。太阴终者，腹胀闭而不得呼吸，常嗳气、常呕吐；呕则气逆，逆则面赤；不逆则上下不通，不通则面黑、皮毛焦而终。厥阴终者，中热、咽干，小便频数、心烦，甚则舌卷、睾丸上缩而终。这是十二经之所败。〔以下为后世所附音释，非经文正文，不译。〕","notes":[],"pending":false}]},
{"id":"sw17","book":"素问","no":17,"title":"脉要精微论","titleTw":"脈要精微論","tags":["ci","jingluo","zhenfa"],"brief":"论诊脉的时间与方法、五色精明之要、五脏为身之守与身之强、脉合四时阴阳，及尺肤分部候病之法。","pending":false,"sections":[{"id":"sw17-1","tags":[],"yw":"黃帝問曰∶診法何如？岐伯對曰∶診法常以平旦，陰氣未動，陽氣未散，飲食未進，經脈未盛，絡脈調勻，氣血未亂，故乃可診有過之脈。切脈動靜而視精明，察五色，觀五髒有餘不足，六腑強弱，形之盛衰，以此參伍，決死生之分。夫脈者，血之府也，長則氣治，短則氣病，數則煩心，大則病進，上盛則氣高，下盛則氣脹，代則氣衰，細則氣少，澀則心痛，渾渾革至如湧泉，病進而色弊，綿綿其去如弦絕，死。夫精明五色者，氣之華也，赤欲如白裹朱，不欲如赭；白欲如鵝羽，不欲如鹽；青欲如蒼璧之澤，不欲如藍；黃欲如羅裹雄黃，不欲如黃土；黑欲如重漆色，不欲如地蒼。","bh":"黄帝问道：诊法怎样？岐伯回答说：诊法常在平旦（清晨）进行，此时阴气未动，阳气未散，饮食未进，经脉未盛，络脉调匀，气血未乱，所以才可以诊出有病之脉。切按脉的动静，同时观察眼睛的神采与面色，审察五色，观察五脏的有余不足、六腑的强弱、形体的盛衰，以此参合比对，决断死生之分。脉是血之府：脉长则气治，脉短则气病，脉数则心烦，脉大则病进；上部脉盛则气高（喘满），下部脉盛则气胀，脉代则气衰，脉细则气少，脉涩则心痛；脉来浑浑然革急如涌泉，是病进而色败，其去绵绵然如弦断绝的，死。眼目神采与五色是气之华：赤色要像白帛裹朱砂，不要像赭石；白色要像鹅羽，不要像盐；青色要像苍璧（青玉）的润泽，不要像蓝草；黄色要像罗帛裹雄黄，不要像黄土；黑色要像重漆之色，不要像地苍（地上的苍黑土色）。","notes":[],"pending":false},{"id":"sw17-2","tags":[],"yw":"五色精微象見矣，其壽不久也。夫精明者，所以視萬物，別白黑，審短長。以長爲短，以白爲黑，如是則精衰矣。五髒者，中之守也，中盛髒滿，氣勝傷恐者，聲如從室中言，是中氣之溼也。言而微，終日乃復言者，此奪氣也。衣被不斂，言語善惡，不避親疏者，此神明之亂也。倉廩不藏者，是門戶不要也。水泉不止者，是膀胱不藏也。得守者生，失守者死。夫五髒者，身之強也，頭者精明之府，頭傾視深，精神將奪矣。背者胸中之府，背曲肩隨，府將壞矣。","bh":"五脏精微之象见于外，寿命就不长久了。眼目的精明，是用来视万物、别黑白、审长短的。以长为短、以白为黑，这样就是精气衰了。五脏是内脏之守：中焦盛满、气胜而伤于恐的，声音如从室中说话，这是中气有湿。说话声音低微、终日才再说话的，这是夺气。衣被不收敛，言语不分善恶、不避亲疏的，这是神明之乱。仓廪（肠胃）不能藏的，是门户不约。水泉（小便）不止的，是膀胱不藏。得守的能生，失守的会死。五脏是身之强：头是精明之府，头倾而目深陷，精神将要被夺了。背是胸中之府，背曲而肩垂，胸中之府将要坏了。","notes":[],"pending":false},{"id":"sw17-3","tags":[],"yw":"腰者腎之府，轉搖不能，腎將憊矣。膝者筋之府，屈伸不能，行則僂附，筋將憊矣。骨者髓之府，不能久立，行則振掉，骨將憊矣。得強則生，失強則死。岐伯曰∶反四時者，有餘爲精，不足爲消。應太過，不足爲精；應不足，有餘爲消。陰陽不相應，病名曰關格。帝曰∶脈其四時動奈何？知病之所在奈何？知病之所變奈何？知病乍在內奈何？知病乍在外奈何？請問此五者，可得聞乎？岐伯曰∶請言其與天運轉大也。萬物之外，六合之內，天地之變，陰陽之應，彼春之暖，爲夏之暑，彼秋之忿，爲冬之怒，四變之動，脈與之上下，以春應中規，夏應中矩，秋應中衡，冬應中權。","bh":"腰是肾之府，转摇不能，肾将要衰惫了。膝是筋之府，屈伸不能，行走则屈身依附，筋将要衰惫了。骨是髓之府，不能久立，行走则振颤动摇，骨将要衰惫了。得强的能生，失强的会死。岐伯说：脉与四时相反的，有余为精，不足为消。应太过而见不足的为精；应不足而见有余的为消。阴阳不相应的，病名叫关格。黄帝说：脉的四时之动怎样？知病之所在怎样？知病之所变怎样？知病忽在于内怎样？知病忽在于外怎样？请问这五者，可以听听吗？岐伯说：请让我讲它与天地运转的相应之大。万物之外、六合之内，天地的变化、阴阳的相应，那春之暖成为夏之暑，那秋之忿成为冬之怒，四时变动，脉也随之上下。所以春脉应中规（圆滑），夏脉应中矩（方正盛大），秋脉应中衡（平正），冬脉应中权（沉下）。","notes":[],"pending":false},{"id":"sw17-4","tags":[],"yw":"是故冬至四十五日，陽氣微上，陰氣微下；夏至四十五日，陰氣微上，陽氣微下。陰陽有時，與脈爲期，期而相失，知脈所分，分之有期，故知死時。微妙在脈，不可不察，察之有紀，從陰陽始，始之有經，從五行生，生之有度，四時爲宜，補瀉勿失，與天地如一，得一之情，以知死生。是故聲合五音，色合五行，脈合陰陽。是知陰盛則夢涉大水恐懼，陽盛則夢大火燔灼，陰陽俱盛則夢相殺毀傷；上盛則夢飛，下盛則夢墮；甚飽則夢予，甚飢則夢取；肝氣盛則夢怒，肺氣盛則夢哭；短蟲多則夢聚衆，長蟲多則夢相擊毀傷。","bh":"所以冬至四十五日，阳气微上，阴气微下；夏至四十五日，阴气微上，阳气微下。阴阳有时，与脉相应为期；与期相失，就可知脉之所分，分之有其期，所以能知死时。微妙在于脉，不可不察；察之有纲纪，从阴阳开始；始之有经，从五行生；生之有度，以四时为宜；补泻不要失误，与天地如一，得其一之情，就能知死生。所以声合五音，色合五行，脉合阴阳。因此阴盛则梦涉大水而恐惧，阳盛则梦大火燔灼，阴阳俱盛则梦相杀毁伤；上盛则梦飞，下盛则梦堕；甚饱则梦给予，甚饥则梦取；肝气盛则梦怒，肺气盛则梦哭；短虫多则梦聚众，长虫多则梦相击毁伤。","notes":[],"pending":false},{"id":"sw17-5","tags":[],"yw":"是故持脈有道，虛靜爲保。春日浮，如魚之遊在波，夏日在膚，泛泛乎萬物有餘；秋日下膚，蟄蟲將去；冬日在骨，蟄蟲周密，君子居室。故曰∶知內者按而紀之，知外者終而始之。此六者，持脈之大法。心脈搏堅而長，當病舌卷不能言；其而散者，當消環自已。肺脈搏堅而長，當病唾血；其而散者，當病灌汗，至令不復散發也。肝脈搏堅而長，色不青，當病墜若搏，因血在脅下，令人喘逆；其而散色澤者，當病溢飲，溢飲者渴暴多飲，而易入肌皮腸胃之外也。","bh":"所以持脉有其道，以虚静为贵。春日脉浮，如鱼游在水波之中；夏日脉在肤表，泛泛然如万物有余；秋日脉下于肤，如蛰虫将要离去；冬日脉沉在骨，如蛰虫周密、君子居于室内。所以说：知内脏的，按脉而纪之；知外证的，从终而知始。这六者，是持脉的大法。心脉搏击坚而长的，当病舌卷不能言；其脉软而散的，当病消渴，环周而自愈。肺脉搏击坚而长的，当病唾血；其脉软而散的，当病灌汗（大汗如灌），以至于不能复发散。肝脉搏击坚而长、色不青的，当病坠堕或搏击损伤，因血在胁下，使人喘逆；其脉软而散、色泽鲜明的，当病溢饮，溢饮是口渴暴饮而水气易入于肌皮肠胃之外的病。","notes":[],"pending":false},{"id":"sw17-6","tags":[],"yw":"胃脈搏堅而長，其色赤，當病折髀；其而散者，當病食痹。脾脈搏堅而長，其色黃，當病少氣；其而散色不澤者，當病足腫，若水狀也。腎脈搏堅而長，其色黃而赤者，當病折腰；其而散者，當病少血，至令不復也。帝曰∶診得心脈而急，此爲何病？病形何如？岐伯曰∶病名心疝，少腹當有形也。帝曰∶何以言之？岐伯曰∶心爲牡髒，小腸爲之使，故曰少腹當有形也。帝曰∶診得胃脈，病形何如？岐伯曰∶胃脈實則脹，虛則泄。帝曰∶病成而變何謂？岐伯曰∶風成爲寒熱，癉成爲消中，厥成爲巔疾，久風爲飧泄，脈風成爲癘，病之變化，不可勝數。","bh":"胃脉搏击坚而长、其色赤的，当病折髀（大腿如折）；其脉软而散的，当病食痹。脾脉搏击坚而长、其色黄的，当病少气；其脉软而散、色不润泽的，当病足肿，像水气病一样。肾脉搏击坚而长、其色黄而赤的，当病折腰；其脉软而散的，当病少血，以至于不能恢复。黄帝说：诊得心脉而急，这是什么病？病形怎样？岐伯说：病名叫心疝，少腹当有形。黄帝说：为什么这样说？岐伯说：心为牡脏（阳脏），小肠为它役使，所以说少腹当有形。黄帝说：诊得胃脉，病形怎样？岐伯说：胃脉实则胀，虚则泄。黄帝说：病成而变化怎样讲？岐伯说：风成为寒热，瘅成为消中，厥成为巅疾（头巅之疾），久风成为飧泄，脉风成为疠，病的变化不可胜数。","notes":[],"pending":false},{"id":"sw17-7","tags":[],"yw":"帝曰∶諸癰腫筋攣骨痛，此皆安生？岐伯曰∶此寒氣之腫，八風之變也。帝曰∶治之奈何？岐伯曰∶此四時之病，以其勝治之愈也。帝曰∶有故病五髒發動，因傷脈色，各何以知其久暴至之病乎？岐伯曰∶悉乎哉問也！徵其脈小色不奪者，新病也；徵其脈不奪其色奪者，此久病也；徵其脈與五色俱奪者，此久病也；徵其脈與五色俱不奪者，新病也。肝與腎脈並至，其色蒼赤，當病毀傷不見血，已見血，溼若中水也。尺內兩旁，則季脅也，尺外以候腎，尺裏以候腹中。","bh":"黄帝说：各种痈肿、筋挛、骨痛，这些都从何而生？岐伯说：这是寒气之肿，八风之变。黄帝说：怎样治疗？岐伯说：这是四时之病，用其所胜之气来治就可以痊愈。黄帝说：有旧病从五脏发动，因而伤及脉色，怎样分别知道它是久病还是新发的病？岐伯说：问得详尽啊！验其脉小而色不夺的，是新病；验其脉不夺而其色夺的，这是久病；验其脉与五色俱夺的，这是久病；验其脉与五色俱不夺的，是新病。肝脉与肾脉并至，其色苍赤的，当病毁伤而不见血；若已见血，则像被湿邪或水气所中一样。尺内两旁，是季胁；尺外以候肾，尺里以候腹中。","notes":[],"pending":false},{"id":"sw17-8","tags":[],"yw":"附上，左外以候肝，內以候膈；右外以候胃，內以候脾。上附上，右外以候肺，內以候胸中；左外以候心，內以候羶中。前以候前，後以候後。上竟上者，胸喉中事也；下竟下者，少腹腰股膝脛足中事也。粗大者，陰不足陽有餘，爲熱中也。來疾去徐，上實下虛，爲厥巔疾；來徐去疾，上虛下實，爲惡風也。故中惡風者，陽氣受也。有脈俱沉細數者，少陰厥也；沉細數散者，寒熱也；浮而散者爲僕。諸浮不躁者皆在陽，則爲熱；其有躁者在手。諸細而沉者皆在陰，則爲骨痛；其有靜者在足。","bh":"附（尺的中部）上，左外以候肝，内以候膈；右外以候胃，内以候脾。上附上（尺的上部），右外以候肺，内以候胸中；左外以候心，内以候膻中。前以候前，后以候后。上竟上的，是胸喉中的事；下竟下的，是少腹、腰、股、膝、胫、足中的事。脉粗大的，是阴不足阳有余，为热中。来疾去徐，上实下虚，为厥巅疾；来徐去疾，上虚下实，为恶风。所以中恶风的，是阳气受邪。有脉俱沉细数的，是少阴厥；沉细数散的，是寒热；浮而散的为仆（仆倒）。诸浮而不躁的，都在阳分，则为热；其中有躁的，在手。诸细而沉的，都在阴分，则为骨痛；其中有静的，在足。","notes":[],"pending":false},{"id":"sw17-9","tags":[],"yw":"數動一代者，病在陽之脈也，泄及便膿血。諸過者切之，澀者陽氣有餘也，滑者陰氣有餘也。陽氣有餘爲身熱無汗，陰氣有餘爲多汗身寒，陰陽有餘則無汗而寒。推而外之，內而不外，有心腹積也。推而內之，外而不內，身有熱也。推而上之，上而不下，腰足清也。推而下之，下而不上，頭項痛也。按之至骨，脈氣少者，腰脊痛而身有痹也。<目錄>卷第五","bh":"数动而一代的，是病在阳之脉，主泄泻及便脓血。各种有病之脉切按之：涩的是阳气有余，滑的是阴气有余。阳气有余则身热无汗，阴气有余则多汗身寒，阴阳有余则无汗而寒。推而向外，脉在内而不外，是有心腹积。推而向内，脉在外而不内，是身有热。推而向上，脉在上而不下，是腰足清冷。推而向下，脉在下而不上，是头项痛。按之至骨而脉气少的，是腰脊痛而身有痹。","notes":[],"pending":false}]},
{"id":"sw18","book":"素问","no":18,"title":"平人气象论","titleTw":"平人氣象論","tags":["zhenfa","bingji","zangxiang"],"brief":"论平人呼吸与脉动的常度，四时五脏以胃气为本的平脉、病脉、死脉，及寸口诸脉主病与真脏脉死期。","pending":false,"sections":[{"id":"sw18-1","tags":[],"yw":"黃帝問曰∶平人何如？岐伯對曰∶人一呼脈再動，一吸脈亦再動，呼吸定息脈五動，閏以太息，命曰平人。平人者，不病也。常以不病調病患，醫不病，故爲病患平息以調之爲法。人一呼脈一動，一吸脈一動，曰少氣。人一呼脈三動，一吸脈三動而躁，尺熱曰病溫，尺不熱脈滑曰病風，脈澀曰痹。人一呼脈四動以上曰死，脈絕不至曰死，乍疏乍數曰死。平人之常氣稟於胃，胃者平人之常氣也，人無胃氣曰逆，逆者死。春胃微弦曰平，弦多胃少曰肝病，但弦無胃曰死，胃而有毛曰秋病，毛甚曰今病。","bh":"黄帝问道：平人怎样？岐伯回答说：人一呼脉再动，一吸脉也再动，呼吸定息脉五动，再加上太息（长息），叫做平人。平人就是不病的人。常以不病之人调息来候病人，医生不病，所以为病人平息而调之法度。人一呼脉一动，一吸脉一动，叫做少气。人一呼脉三动，一吸脉三动而躁，尺肤热的叫病温；尺肤不热而脉滑的叫病风，脉涩的叫痹。人一呼脉四动以上的叫死，脉绝不至的叫死，忽疏忽数的叫死。平人的常气禀于胃，胃就是平人的常气，人无胃气叫做逆，逆的会死。春脉有胃气而微弦的叫平，弦多胃少的叫肝病，但弦无胃的叫死；胃气而有毛脉的，到秋天会病，毛甚的现在就病。","notes":[],"pending":false},{"id":"sw18-2","tags":[],"yw":"藏真散於肝，肝藏筋膜之氣也。夏胃微鉤曰平，鉤多胃少曰心病，但鉤無胃曰死，胃而有石曰冬病，石甚曰今病。藏真通於心，心藏血脈之氣也。長夏胃微弱曰平，弱多胃少曰脾病，但代無胃曰死，弱有石曰冬病，弱甚曰今病。藏真濡於脾，脾藏肌肉之氣也。秋胃微毛曰平，毛多胃少曰肺病，但毛無胃曰死，毛而有弦曰春病，弦甚曰今病。藏真高於肺，以行榮衛陰陽也。冬胃微石曰平，石多胃少曰腎病，但石無胃曰死，石而有鉤曰夏病，鉤甚曰今病。","bh":"藏真之气散于肝，肝藏筋膜之气。夏脉有胃气而微钩的叫平，钩多胃少的叫心病，但钩无胃的叫死；胃气而有石脉的，到冬天会病，石甚的现在就病。藏真通于心，心藏血脉之气。长夏脉有胃气而微软弱的叫平，弱多胃少的叫脾病，但代无胃的叫死；软弱而有石脉的，到冬天会病，弱甚的现在就病。藏真濡于脾，脾藏肌肉之气。秋脉有胃气而微毛的叫平，毛多胃少的叫肺病，但毛无胃的叫死；毛而有弦的，到春天会病，弦甚的现在就病。藏真高于肺，以行营卫阴阳。冬脉有胃气而微石的叫平，石多胃少的叫肾病，但石无胃的叫死；石而有钩的，到夏天会病，钩甚的现在就病。","notes":[],"pending":false},{"id":"sw18-3","tags":[],"yw":"藏真下於腎，腎藏骨髓之氣也。胃之大絡，名曰虛裏，貫膈絡肺，出於左乳下，其動應衣，脈宗氣也。盛喘數絕者，則病在中；結而橫，有積矣；絕不至曰死。乳之下其動應衣，宗氣泄也。欲知寸口太過與不及，寸口之脈中手短者，曰頭痛。寸口脈中手長者，曰足脛痛。寸口脈中手促上擊者，曰肩背痛。寸口脈沉而堅者，曰病在中。寸口脈浮而盛者，曰病在外。寸口脈沉而弱，曰寒熱及疝瘕少腹痛。寸口脈沉而橫，曰脅下有積，腹中有橫積痛。寸口脈沉而喘，曰寒熱。","bh":"藏真下于肾，肾藏骨髓之气。胃的大络，名叫虚里，贯膈络肺，出于左乳之下，其动应衣，这是脉的宗气。盛喘而数绝的，是病在中；结而横的，是有积；绝不至的叫死。乳下其动应衣的，是宗气外泄。要知道寸口的太过与不及：寸口脉中手而短的，是头痛；寸口脉中手而长的，是足胫痛；寸口脉中手促而上击的，是肩背痛；寸口脉沉而坚的，是病在中；寸口脉浮而盛的，是病在外；寸口脉沉而弱的，是寒热及疝瘕、少腹痛；寸口脉沉而横的，是胁下有积、腹中有横积痛；寸口脉沉而喘的，是寒热。","notes":[],"pending":false},{"id":"sw18-4","tags":[],"yw":"脈盛滑堅者，曰病在外。脈小實而堅者，病在內。脈小弱以澀，謂之久病。脈滑浮而疾者，謂之新病。脈急者，曰疝瘕少腹痛。脈滑曰風。脈澀曰痹。緩而滑曰熱中。盛而緊曰脹。脈從陰陽，病易已；脈逆陰陽，病難已。脈得四時之順，曰病無他；脈反四時及不間藏，曰難已。臂多青脈，曰脫血。尺脈緩澀，謂之解。安臥脈盛，謂之脫血。尺澀脈滑，謂之多汗。尺寒脈細，謂之後泄。脈尺粗常熱者，謂之熱中。肝見庚辛死，心見壬癸死，脾見甲乙死，肺見丙丁死，腎見戊己死，是謂真髒見皆死。","bh":"脉盛滑而坚的，是病在外。脉小实而坚的，病在内。脉小弱而涩的，叫做久病。脉滑浮而疾的，叫做新病。脉急的，是疝瘕、少腹痛。脉滑的是风。脉涩的是痹。缓而滑的是热中。盛而紧的是胀。脉从阴阳的，病容易好；脉逆阴阳的，病难好。脉得四时之顺的，叫做病无他变；脉反四时及不间脏（传变不隔脏）的，叫做难愈。臂多青脉的，叫做脱血。尺脉缓涩的，叫做解㑊（懈惰无力）。安卧而脉盛的，叫做脱血。尺涩而脉滑的，叫做多汗。尺寒而脉细的，叫做后泄（大便泄泻）。尺肤粗而常热的，叫做热中。肝见于庚辛日死，心见于壬癸日死，脾见于甲乙日死，肺见于丙丁日死，肾见于戊己日死，这就是所谓真脏脉见皆死。","notes":[],"pending":false},{"id":"sw18-5","tags":[],"yw":"頸脈動喘疾咳，曰水。目裹微腫如臥蠶起之狀，曰水。溺黃赤安臥者，黃膽。已食如飢者，胃疸。面腫曰風。足脛腫曰水。目黃者曰黃膽。婦人手少陰脈動甚者，妊子也。脈有逆從四時，未有髒形，春夏而脈瘦，秋冬而脈浮大，命曰逆四時也。風熱而脈靜，泄而脫血脈實，病在中脈虛，病在外脈澀堅者，皆難治，命曰反四時也。人以水谷爲本，故人絕水谷則死，脈無胃氣亦死。所謂無胃氣者，但得真髒脈不得胃氣也。所謂脈不得胃氣者，肝不弦腎不石也。","bh":"颈脉搏动、喘息、疾咳的，叫做水。目裹微肿如卧蚕起之状的，叫做水。小便黄赤而安卧的，是黄疸。已食而如饥的，是胃疸。面肿的叫做风。足胫肿的叫做水。目黄的叫做黄疸。妇人手少阴脉动甚的，是妊娠。脉有逆从四时：未见本脏之形，春夏而脉瘦，秋冬而脉浮大，叫做逆四时。风热而脉静，泄泻脱血而脉实，病在中而脉虚，病在外而脉涩坚的，都难治，叫做反四时。人以水谷为本，所以人绝水谷则死，脉无胃气也死。所谓无胃气，就是只见到真脏脉而不见胃气。所谓脉不得胃气，就是肝脉不见弦、肾脉不见石（即失其本脏之脉而真脏独见）。","notes":[],"pending":false},{"id":"sw18-6","tags":[],"yw":"太陽脈至，洪大以長，少陽脈至，乍數乍疏，乍短乍長；陽明脈至，浮大而短。夫平心脈來，累累如連珠，如循琅，曰心平，夏以胃氣爲本。病心脈來，喘喘連屬，其中微曲，曰心病。死心脈來，前曲後居，如操帶鉤，曰心死。平肺脈來，厭厭聶聶，如落榆莢，曰肺平，秋以胃氣爲本。病肺脈來，不上不下，如循雞羽，曰肺病。死肺脈來，如物之浮，如風吹毛，曰肺死。平肝脈來，弱招招，如揭長竿末梢，曰肝平，春以胃氣爲本。病肝脈來，盈實而滑，如循長竿，曰肝病。","bh":"太阳脉至，洪大而长；少阳脉至，乍数乍疏、乍短乍长；阳明脉至，浮大而短。平心脉来，累累然如连珠、如循琅玕（美玉），叫做心平，夏以胃气为本。病心脉来，喘喘然连续相连，其中微有曲意，叫做心病。死心脉来，前曲后居，如操持带钩，叫做心死。平肺脉来，厌厌聂聂，如落榆荚，叫做肺平，秋以胃气为本。病肺脉来，不上不下，如循鸡羽，叫做肺病。死肺脉来，如物之浮、如风吹毛，叫做肺死。平肝脉来，软弱招招，如揭长竿末梢，叫做肝平，春以胃气为本。病肝脉来，盈实而滑，如循长竿，叫做肝病。","notes":[],"pending":false},{"id":"sw18-7","tags":[],"yw":"死肝脈來，急益勁，如新張弓弦，曰肝死。平脾脈來，和柔相離，如雞踐地，曰脾平，長夏以胃氣爲本。病脾脈來，實而盈數，如雞舉足，曰脾病。死脾脈來，銳堅如鳥之喙，如鳥之距，如屋之漏，如水之流，曰脾死。平腎脈來，喘喘累累如鉤，按之而堅，曰腎平，冬以胃氣爲本。病腎脈來，如引葛，按之益堅，曰腎病。死腎脈來，發如奪索，辟辟如彈石，曰腎死。脈要精微論∶莠（音誘）汨（古沒切）癉（都HT切）（音荀，又音舜）平人氣象論∶疝（音山）瘕（音賈）（音亦）（女耕切）喙（虛畏切）<目錄>卷第六","bh":"死肝脉来，急而益劲，如新张之弓弦，叫做肝死。平脾脉来，和柔相离，如鸡践地，叫做脾平，长夏以胃气为本。病脾脉来，实而盈数，如鸡举足，叫做脾病。死脾脉来，锐坚如鸟之喙、如鸟之距、如屋之漏、如水之流，叫做脾死。平肾脉来，喘喘累累如钩，按之而坚，叫做肾平，冬以胃气为本。病肾脉来，如引葛藤，按之益坚，叫做肾病。死肾脉来，发如夺索（解索），辟辟然如弹石，叫做肾死。〔以下为后世所附音释，非经文正文，不译。〕","notes":[],"pending":false}]},
{"id":"sw19","book":"素问","no":19,"title":"玉机真脏论","titleTw":"玉機真髒論","tags":["zhenfa","bingji","zangxiang"],"brief":"论四时五脏脉象与其太过不及之病、五脏病传变次序、真脏脉形与死期，以及虚实决死生之法。","pending":false,"sections":[{"id":"sw19-1","tags":[],"yw":"黃帝問曰∶春脈如弦，何如而弦？岐伯對曰∶春脈者肝也，東方木也，萬物之所以始生也，故其氣來，弱輕虛而滑，端直以長，故曰弦，反此者病。帝曰∶何如而反？岐伯曰∶其氣來實而強，此謂太過，病在外；其氣來不實而微，此謂不及，病在中。帝曰∶春脈太過與不及，其病皆何如？岐伯曰∶太過則令人善忘，忽忽眩冒而巔疾；其不及則令人胸痛引背，下則兩脅滿。帝曰∶善。夏脈如鉤，何如而鉤？岐伯曰∶夏脈者心也，南方火也，萬物之所以盛長也，故其氣來盛去衰，故曰鉤，反此者病。","bh":"黄帝问道：春脉如弦，怎样才算弦？岐伯回答说：春脉属肝，属东方木，是万物开始生长之时，所以其气来时软弱轻虚而滑，端直而长，所以叫做弦，与此相反的就是病。黄帝说：怎样是反？岐伯说：其气来实而强，这叫做太过，病在外；其气来不实而微，这叫做不及，病在中。黄帝说：春脉太过与不及，其病各怎样？岐伯说：太过则使人善忘，忽忽然眩晕昏冒而患巅疾；不及则使人胸痛引背，下则两胁胀满。黄帝说：好。夏脉如钩，怎样才算钩？岐伯说：夏脉属心，属南方火，是万物盛长之时，所以其气来盛去衰，所以叫做钩，与此相反的就是病。","notes":[],"pending":false},{"id":"sw19-2","tags":[],"yw":"帝曰∶何如而反？岐伯曰∶其氣來盛去亦盛，此謂太過，病在外；其氣來不盛去反盛，此謂不及，病在中。帝曰∶夏脈太過與不及，其病皆何如？岐伯曰∶太過則令人身熱而膚痛，爲浸淫；其不及則令人煩心，上見咳唾，下爲氣泄。帝曰∶善。秋脈如浮，何如而浮？岐伯曰∶秋脈者肺也，西方金也，萬物之所以收成也，故其氣來，輕虛以浮，來急去散，故曰浮，反此者病。帝曰∶何如而反？岐伯曰∶其氣來，毛而中央堅，兩旁虛，此謂太過，病在外；其氣來，毛而微，此謂不及，病在中。","bh":"黄帝说：怎样是反？岐伯说：其气来盛、去也盛，这叫做太过，病在外；其气来不盛而去反盛，这叫做不及，病在中。黄帝说：夏脉太过与不及，其病各怎样？岐伯说：太过则使人身热而肤痛，成为浸淫（浸淫疮）；不及则使人烦心，在上见咳唾，在下为气泄。黄帝说：好。秋脉如浮，怎样才算浮？岐伯说：秋脉属肺，属西方金，是万物收成之时，所以其气来时轻虚而浮，来急去散，所以叫做浮，与此相反的就是病。黄帝说：怎样是反？岐伯说：其气来时毛而中央坚、两旁虚，这叫做太过，病在外；其气来时毛而微，这叫做不及，病在中。","notes":[],"pending":false},{"id":"sw19-3","tags":[],"yw":"帝曰∶秋脈太過與不及，其病皆何如？岐伯曰∶太過則令人逆氣而背痛，慍慍然；其不及則令人喘，呼吸少氣而咳，上氣見血，下聞病音。帝曰∶善。冬脈如營，何如而營？岐伯曰∶冬脈者腎也，北方水也，萬物之所以合藏也，故其氣來沉以搏，故曰營，反此者病。帝曰∶何如而反？岐伯曰∶其氣來如彈石者，此謂太過，病在外；其去如數者，此謂不及，病在中。帝曰∶冬脈太過與不及，其病皆何如？岐伯曰∶太過則令人解，脊脈痛而少氣不欲言；其不及則令人心懸如病飢，中清，脊中痛，少腹滿，小便變。","bh":"黄帝说：秋脉太过与不及，其病各怎样？岐伯说：太过则使人气逆而背痛，愠愠然不舒；不及则使人喘息，呼吸少气而咳，在上气逆见血，在下可闻病音（喘息之声）。黄帝说：好。冬脉如营，怎样才算营？岐伯说：冬脉属肾，属北方水，是万物合藏之时，所以其气来沉而搏，所以叫做营，与此相反的就是病。黄帝说：怎样是反？岐伯说：其气来如弹石的，这叫做太过，病在外；其去如数的，这叫做不及，病在中。黄帝说：冬脉太过与不及，其病各怎样？岐伯说：太过则使人懈惰，脊脉痛而少气、不欲言语；不及则使人心悬如病饥，中脘清冷，脊中痛，少腹胀满，小便变色。","notes":[],"pending":false},{"id":"sw19-4","tags":[],"yw":"帝曰∶善。帝曰∶四時之序，逆從之變異也，然脾脈獨何主？岐伯曰∶脾脈者土也，孤髒以灌四旁者也。帝曰∶然則脾善惡，可得見之乎？岐伯曰∶善者不可得見，惡者可見。帝曰∶惡者何如可見？岐伯曰∶其來如水之流者，此謂太過，病在外；如鳥之喙者，此謂不及，病在中。帝曰∶夫子言脾爲孤髒，中央土以灌四旁，其太過與不及，其病皆何如？岐伯曰∶太過則令人四肢不舉；其不及，則令人九竅不通，名曰重強。帝瞿然而起，再拜而稽首曰∶善。","bh":"黄帝说：好。黄帝又说：四时的次序、逆从的变异如此，然而脾脉独主什么？岐伯说：脾脉属土，是孤脏以灌注四旁（四脏）的。黄帝说：那么脾脉的善恶，可以见到吗？岐伯说：善的不可得见，恶的可以见到。黄帝说：恶的怎样可以见到？岐伯说：其脉来如水之流的，这叫做太过，病在外；如鸟之喙的，这叫做不及，病在中。黄帝说：先生说脾为孤脏，中央土以灌四旁，其太过与不及，其病各怎样？岐伯说：太过则使人四肢不能举动；不及则使人九窍不通，名叫重强。黄帝惊异地站起，再拜而叩头说：好。","notes":[],"pending":false},{"id":"sw19-5","tags":[],"yw":"吾得脈之大要，天下至數，五色脈變，揆度奇恆，道在於一，神轉不回，回則不轉，乃失其機，至數之要，迫近以微，着之玉版，藏之髒腑，每旦讀之，名曰《玉機》。五髒受氣於其所生，傳之於其所勝，氣舍於其所生，死於其所不勝。病之且死，必先傳行至其所不勝，病乃死。此言氣之逆行也，故死。肝受氣於心，傳之於脾，氣舍於腎，至肺而死。心受氣於脾，傳之於肺，氣舍於肝，至腎而死。脾受氣於肺，傳之於腎，氣舍於心，至肝而死。肺受氣於腎，傳之於肝，氣舍於脾，至心而死。","bh":"我得到了脉学的大要，天下至数，五色脉变、揆度奇恒，道理在于一；神转而不回，回则不转，就失去其枢机。至数的要领，切近而微妙，刻在玉版上，藏在脏腑，每晨诵读，名叫《玉机》。五脏受气于其所生之脏，传之于其所胜之脏，气舍于其所生之脏，死于其所不胜之脏。病将死时，必先传行到其所不胜之脏，病人才死。这是说气之逆行，所以死。肝受气于心，传之于脾，气舍于肾，至肺而死。心受气于脾，传之于肺，气舍于肝，至肾而死。脾受气于肺，传之于肾，气舍于心，至肝而死。肺受气于肾，传之于肝，气舍于脾，至心而死。","notes":[],"pending":false},{"id":"sw19-6","tags":[],"yw":"腎受氣於肝，傳之於心，氣舍於肺，至脾而死。此皆逆死也。一日一夜五分之，此所以佔死生之早暮也。黃帝曰∶五髒相通，移皆有次，五髒有病，則各傳其所勝。不治，法三月若六月，若三日若六日，傳五髒而當死，是順傳所勝之次。故曰∶別於陽者，知病從來；別於陰者，知死生之期。言知至其所困而死。是故風者百病之長也，今風寒客於人，使人毫毛畢直，皮膚閉而爲熱，當是之時，可汗而發也；或痹不仁腫痛，當是之時，可湯熨及火灸刺而去之。","bh":"肾受气于肝，传之于心，气舍于肺，至脾而死。这都是逆传而死。把一日一夜分为五分（以配五脏），这就是占验死生早晚的根据。黄帝说：五脏相通，传移都有次序，五脏有病，则各传其所胜。若不治，法当三月或六月、或三日或六日，传遍五脏而当死，这是顺传所胜之次。所以说：辨别阳的，知病从何而来；辨别阴的，知死生之期，是说知道传至其所困之脏而死。所以风是百病之长，如今风寒客于人，使人毫毛毕直，皮肤闭而为热，在这个时候，可以用汗法发散；或见痹、不仁、肿痛，在这个时候，可以用汤熨及火灸、针刺而去其邪。","notes":[],"pending":false},{"id":"sw19-7","tags":[],"yw":"弗治，病入舍於肺，名曰肺痹，發咳上氣。弗治，肺即傳而行之肝，病名曰肝痹，一名曰厥，脅痛出食，當是之時，可按若刺耳。弗治，肝傳之脾，病名曰脾風，發癉，腹中熱，煩心出黃，當此之時，可按可藥可浴。弗治，脾傳之腎，病名曰疝瘕，少腹冤熱而痛，出白，一名曰蠱，當此之時，可按可藥。弗治，腎傳之心，病筋脈相引而急，病名曰螈，當此之時，可灸可藥。弗治，滿十日，法當死。腎因傳之心，心即復反傳而行之肺，發寒熱，法當三歲死，此病之次也。","bh":"不治，病邪入舍于肺，名叫肺痹，发为咳逆上气。不治，肺就传而行之于肝，病名叫肝痹，一名叫厥，胁痛而吐食，在这个时候，可以按摩或针刺。不治，肝传之于脾，病名叫脾风，发为瘅（热中），腹中热，烦心，出黄（小便黄），在这个时候，可以按摩、可以药治、可以洗浴。不治，脾传之于肾，病名叫疝瘕，少腹郁热而痛，出白（小便白浊），一名叫蛊，在这个时候，可以按摩、可以药治。不治，肾传之于心，病见筋脉相引而急，病名叫瘛，在这个时候，可以灸治、可以药治。不治，满十日，按法当死。肾因而传之于心，心又反传而行之于肺，发为寒热，按法当三年死，这是病的传变次序。","notes":[],"pending":false},{"id":"sw19-8","tags":[],"yw":"然其卒發者，不必治於傳，或其傳化有不以次，不以次入者，憂恐悲喜怒，令不得以其次，故令人有大病矣。因而喜大虛則腎氣乘矣，怒則肝氣乘矣，悲則肺氣乘矣，恐則脾氣乘矣，憂則心氣乘矣，此其道也。故病有五，五五二十五變，及其傳化。傳，乘之名也。大骨枯槁，大肉陷下，胸中氣滿，喘息不便，其氣動形，期六月死，真髒脈見，乃予之期日。大骨枯槁，大肉陷下，胸中氣滿，喘息不便，內痛引肩項，期一月死，真髒見，乃予之期日。大骨枯槁，大肉陷下，胸中氣滿，喘息不便，內痛引肩項，身熱脫肉破，真髒見，十月之內死。","bh":"然而突然发作的病，就不必依传变次序去治；有的传化不依次序，不依次序传入的，是忧恐悲喜怒等情志，使它不得依其次序，所以使人有大病。因而大喜则心气大虚而肾气乘之，怒则肝气乘之，悲则肺气乘之，恐则脾气乘之，忧则心气乘之，这就是其中的道理。所以病有五，五五二十五变，以及其传化。所谓传，就是乘（克伐）的名称。大骨枯槁，大肉陷下，胸中气满，喘息不便，其气动形，预期六月死，真脏脉见的，就可以定其死期。大骨枯槁，大肉陷下，胸中气满，喘息不便，内痛引肩项，预期一月死，真脏脉见的，就可以定其死期。大骨枯槁，大肉陷下，胸中气满，喘息不便，内痛引肩项，身热、脱肉破䐃，真脏脉见的，十月之内死。","notes":[],"pending":false},{"id":"sw19-9","tags":[],"yw":"大骨枯槁，大肉陷下，肩髓內消，動作益衰，真髒來見，期一歲死，見其真髒，乃予之期日。大骨枯槁，大肉陷下，胸中氣滿，腹內痛，心中不便，肩項身熱，破脫肉，目匡陷，真髒見，目不見人，立死，其見人者，至其所不勝之時則死。急虛身中卒至，五髒絕閉，脈道不通，氣不往來，譬於墮溺，不可爲期。其脈絕不來，若人一息五六至，其形肉不脫，真髒雖不見，猶死也。真肝脈至，中外急，如循刀刃責責然，如按琴瑟弦，色青白不澤，毛折，乃死。","bh":"大骨枯槁，大肉陷下，肩髓内消，动作日益衰，真脏脉来见的，预期一岁死；见了真脏脉，就可以定其死期。大骨枯槁，大肉陷下，胸中气满，腹内痛，心中不便，肩项身热，破䐃脱肉，目眶陷，真脏脉见，目不见人的，立死；其能见人的，到其所不胜之时就死。急剧虚脱而身中卒然至于五脏绝闭、脉道不通、气不往来，譬如坠落溺水，不可为期。其脉绝不来的，或人一息脉五六至的，其形肉不脱，真脏脉虽不见，还是会死。真肝脉至，中外皆急，如循刀刃责责然，如按琴瑟之弦，色青白而不润泽，毛折，就死。","notes":[],"pending":false},{"id":"sw19-10","tags":[],"yw":"真心脈至，堅而搏，如循薏苡子累累然，色赤黑不澤，毛折，乃死。真肺脈至，大而虛，如以毛羽中人膚，色白赤不澤，毛折，乃死。真腎脈至，搏而絕，如指彈石辟辟然，色黑黃不澤，毛折，乃死。真脾脈至，弱而乍數乍疏，色黃青不澤，毛折，乃死。諸真髒脈見者，皆死不治也。黃帝曰∶見真髒曰死，何也？岐伯曰∶五髒者皆稟氣於胃，胃者五髒之本也，髒氣者，不能自致於手太陰，必因於胃氣，乃至於手太陰也，故五髒各以其時，自爲而至於手太陰也。","bh":"真心脉至，坚而搏，如循薏苡子累累然，色赤黑而不润泽，毛折，就死。真肺脉至，大而虚，如以毛羽触人皮肤，色白赤而不润泽，毛折，就死。真肾脉至，搏而绝，如以指弹石辟辟然，色黑黄而不润泽，毛折，就死。真脾脉至，弱而乍数乍疏，色黄青而不润泽，毛折，就死。凡是真脏脉见的，都死而不治。黄帝说：见真脏脉就说死，为什么？岐伯说：五脏都禀气于胃，胃是五脏之本，脏气不能自行到达手太阴，必须借胃气，才能到达手太阴，所以五脏各以其时，自行而至于手太阴。","notes":[],"pending":false},{"id":"sw19-11","tags":[],"yw":"故邪氣勝者，精氣衰也，故病甚者，胃氣不能與之俱至於手太陰，故真髒之氣獨見，獨見者病勝髒也，故曰死。帝曰∶善。黃帝曰∶凡治病，察其形氣色澤，脈之盛衰，病之新故，乃治之無後其時。形氣相得，謂之可治；色澤以浮，謂之易已；脈從四時，謂之可治；脈弱以滑，是有胃氣，命曰易治，取之以時。形氣相失，謂之難治；色夭不澤，謂之難已；脈實以堅，謂之益甚；脈逆四時，爲不可治。必察四難，而明告之。所謂逆四時者，春得肺脈，夏得腎脈，秋得心脈，冬得脾脈，其至皆懸絕沉澀者，命曰逆四時。","bh":"所以邪气胜的，是精气衰；病重的，胃气不能与之同至于手太阴，所以真脏之气独见；独见的是病气胜脏气，所以说死。黄帝说：好。黄帝说：凡治病，察其形气色泽、脉之盛衰、病之新故，然后治之而不要后于其时。形气相得的，叫做可治；色泽浮润的，叫做易愈；脉从四时的，叫做可治；脉弱而滑的，是有胃气，叫做易治，要按时取治。形气相失的，叫做难治；色夭而不润泽的，叫做难愈；脉实而坚的，叫做益甚；脉逆四时的，为不可治。必须察明这四难，而明白告知。所谓逆四时，就是春得肺脉，夏得肾脉，秋得心脉，冬得脾脉，其至都悬绝沉涩的，叫做逆四时。","notes":[],"pending":false},{"id":"sw19-12","tags":[],"yw":"未有髒形，於春夏而脈沉澀，秋冬而脈浮大，名曰逆四時也。病熱脈靜，泄而脈大，脫血而脈實，病在中脈實堅，病在外脈不實堅者，皆難治。黃帝曰∶餘聞虛實以決死生，願聞其情。岐伯曰∶五實死，五虛死。帝曰∶願聞五實五虛。岐伯曰∶脈盛，皮熱，腹脹，前後不通，悶瞀，此謂五實。脈細，皮寒，氣少，泄利前後，飲食不入，此謂五虛。帝曰∶其時有生者何也？岐伯曰∶漿粥入胃，泄注止，則虛者活；身汗得後利，則實者活。此其候也。<目錄>卷第六","bh":"未见本脏之形，在春夏而脉沉涩，秋冬而脉浮大的，名叫逆四时。病热而脉静，泄泻而脉大，脱血而脉实，病在中而脉实坚，病在外而脉不实坚的，都难治。黄帝说：我听说以虚实来决断死生，希望听听其中的情况。岐伯说：五实死，五虚死。黄帝说：希望听听五实五虚。岐伯说：脉盛、皮热、腹胀、前后不通、闷瞀（昏闷），这叫五实。脉细、皮寒、气少、泄利前后、饮食不入，这叫五虚。黄帝说：其中有能活的，为什么？岐伯说：浆粥入胃、泄注停止，则虚者能活；身上出汗、得大便通利，则实者能活。这就是其征候。","notes":[],"pending":false}]},
{"id":"sw20","book":"素问","no":20,"title":"三部九候论","titleTw":"三部九候論","tags":["ci","zhenfa","bingji"],"brief":"论三部九候的取脉部位与候病之法、决死生之形脉相应、病之所在与死期，以及依经孙络施治的刺法。","pending":false,"sections":[{"id":"sw20-1","tags":[],"yw":"黃帝問曰∶餘聞九針於夫子，衆多博大，不可勝數。餘願聞要道，以屬子孫，傳之後世，着之骨髓，藏之肝肺，歃血而受，不敢妄泄，令合天道，必有終始，上應天光星辰歷紀，下副四時五行，貴賤更立，冬陰夏陽，以人應之奈何？願聞其方。岐伯對曰∶妙乎哉問也！此天地之至數。帝曰∶願聞天地之至數，合於人形血氣，通決死生，爲之奈何？岐伯曰∶天地之至數，始於一，終於九焉。一者天，二者地，三者人，因而三之，三三者九，以應九野。故人有三部，部有三候，以決死生，以處百病，以調虛實，而除邪疾。","bh":"黄帝问道：我从先生这里听到九针的道理，内容众多博大，不可胜数。我希望听到要道，以传嘱子孙，流传后世，刻在骨髓、藏在肝肺，歃血而受，不敢妄泄，使它与天道相合，必有终始，上应天光星辰历纪，下副四时五行，贵贱更立，冬阴夏阳，人怎样与之相应？希望听听其中的方法。岐伯回答说：问得微妙啊！这是天地的至数。黄帝说：希望听听天地的至数，合于人形血气，通决死生，该怎样做？岐伯说：天地的至数，始于一，终于九。一是天，二是地，三是人，因而三之，三三为九，以应九野。所以人有三部，每部有三候，用以决死生、处百病、调虚实而除邪疾。","notes":[],"pending":false},{"id":"sw20-2","tags":[],"yw":"帝曰∶何謂三部？岐伯曰∶有下部，有中部，有上部，部各有三候，三候者，有天有地有人也，必指而導之，乃以爲真。上部天，兩額之動脈；上部地，兩頰之動脈；上部人，耳前之動脈。中部天，手太陰也；中部地，手陽明也；中部人，手少陰也。下部天，足厥陰也；下部地，足少陰也；下部人，足太陰也。故下部之天以候肝，地以候腎，人以候脾胃之氣。帝曰∶中部之候奈何？岐伯曰∶亦有天，亦有地，亦有人。天以候肺，地以候胸中之氣，人以候心。","bh":"黄帝说：什么叫做三部？岐伯说：有下部，有中部，有上部，每部各有三候；三候就是有天、有地、有人，必须指而导之，才能得其真。上部天，是两额的动脉；上部地，是两颊的动脉；上部人，是耳前的动脉。中部天，是手太阴；中部地，是手阳明；中部人，是手少阴。下部天，是足厥阴；下部地，是足少阴；下部人，是足太阴。所以下部之天以候肝，地以候肾，人以候脾胃之气。黄帝说：中部的候法怎样？岐伯说：也有天，也有地，也有人。天以候肺，地以候胸中之气，人以候心。","notes":[],"pending":false},{"id":"sw20-3","tags":[],"yw":"帝曰∶上部以何候之？岐伯曰∶亦有天，亦有地，亦有人。天以候頭角之氣，地以候口齒之氣，人以候耳目之氣。三部者，各有天，各有地，各有人。三而成天，三而成地，三而成人。三而三之，合則爲九，九分爲九野，九野爲九藏。故神藏五，形藏四，合爲九藏。五髒已敗，其色必夭，夭必死矣。帝曰∶以候奈何？岐伯曰∶必先度其形之肥瘦，以調其氣之虛實，實則瀉之，虛則補之。必先去其血脈而後調之，無問其病，以平爲期。帝曰∶決死生奈何？岐伯曰∶形盛脈細，少氣不足以息者危。","bh":"黄帝说：上部以什么候之？岐伯说：也有天，也有地，也有人。天以候头角之气，地以候口齿之气，人以候耳目之气。三部，各有天，各有地，各有人。三而成天，三而成地，三而成人。三而三之，合则为九，九分为九野，九野为九脏，所以神脏五、形脏四，合为九脏。五脏已经败坏，其色必夭，夭必死。黄帝说：怎样候察？岐伯说：必须先度量其形体的肥瘦，以调其气的虚实，实则泻之，虚则补之。必须先去其血脉之瘀而后调之，不问其病，以平为期。黄帝说：怎样决断死生？岐伯说：形盛而脉细、少气不足以呼吸的，危。","notes":[],"pending":false},{"id":"sw20-4","tags":[],"yw":"形瘦脈大，胸中多氣者死。形氣相得者生。參伍不調者病。三部九候皆相失者死。上下左右之脈相應如參舂者病甚。上下左右相失不可數者死。中部之候雖獨調，與衆髒相失者死。中部之候相減者死。目內陷者死。帝曰∶何以知病之所在？岐伯曰∶察九候獨小者病，獨大者病，獨疾者病，獨遲者病，獨熱者病，獨寒者病，獨陷下者病。以左手足上，上去踝五寸按之，庶右手足當踝而彈之，其應過五寸以上，蠕蠕然者不病；其應疾，中手渾渾然者病；中手徐徐然者病；其應上不能至五寸，彈之不應者死。","bh":"形瘦而脉大、胸中多气的，死。形气相得的，生。脉来参伍不调的，病。三部九候都相失的，死。上下左右之脉相应如参舂（参差不齐）的，病甚。上下左右相失而不可数的，死。中部之候虽独调，而与诸脏相失的，死。中部之候相减的，死。目内陷的，死。黄帝说：怎样知道病之所在？岐伯说：察九候之中独小的病，独大的病，独疾的病，独迟的病，独热的病，独寒的病，独陷下的病。用左手按在病人足上、距踝五寸处，用右手在病人足踝处弹之，其感应超过五寸以上、蠕蠕然的，不病；其应疾、中手浑浑然的，病；中手徐徐然的，病；其应上不能至五寸、弹之不应的，死。","notes":[],"pending":false},{"id":"sw20-5","tags":[],"yw":"是以脫肉身不去者死。中部乍疏乍數者死。其脈代而鉤者，病在絡脈。九候之相應也，上下若一，不得相失。一候後則病，二候後則病甚，三候後則病危。所謂後者，應不俱也。察其腑髒，以知死生之期，必先知經脈，然後知病脈，真髒脈見者勝死。足太陽氣絕者，其足不可屈伸，死必戴眼。帝曰∶冬陰夏陽奈何？岐伯曰∶九候之脈，皆沉細懸絕者爲陰，主冬，故以夜半死。盛躁喘數者爲陽，主夏，故以日中死。是故寒熱病者，以平旦死。熱中及熱病者，以日中死。","bh":"所以肌肉脱去而身不能行动的，死。中部脉乍疏乍数的，死。其脉代而钩的，病在络脉。九候的相应，上下若一，不得相失。一候后则病，二候后则病甚，三候后则病危。所谓后，就是感应不一致。察其腑脏，以知死生之期；必先知道经脉，然后知道病脉；真脏脉见的，至其所胜之时而死。足太阳气绝的，其足不可屈伸，死时必戴眼（两目上视）。黄帝说：冬阴夏阳怎样讲？岐伯说：九候之脉都沉细悬绝的为阴，主冬，所以死于夜半；盛躁喘数的为阳，主夏，所以死于日中。所以寒热病的，死于平旦；热中及热病的，死于日中。","notes":[],"pending":false},{"id":"sw20-6","tags":[],"yw":"病風者，以日夕死。病水者，以夜半死。其脈乍疏乍數乍遲乍疾者，日乘四季死。形肉已脫，九候雖調，猶死。七診雖見，九候皆從者不死。所言不死者，風氣之病及經月之病，似七診之病而非也，故言不死。若有七診之病，其脈候亦敗者死矣，必發噦噫。必審問其所始病，與今之所方病，而後各切循其脈，視其經絡浮沉，以上下逆從循之，其脈疾者不病，其脈遲者病，脈不往來者死，皮膚着者死。帝曰∶其可治者奈何？岐伯曰∶經病者治其經，孫絡病者治其孫絡血，血病身有痛者治其經絡。","bh":"病风的，死于日夕；病水的，死于夜半。其脉乍疏乍数、乍迟乍疾的，在日乘四季（辰戌丑未之时）死。形肉已脱的，九候虽调，还是会死。七诊虽见，而九候皆从的，不死。所说不死的，是风气之病及经月之病，像七诊之病而其实不是，所以说不死。若有七诊之病，其脉候也败的，就死，必发哕噫（呃逆、嗳气）。必须审问其起初所患之病，与现在所患之病，然后各切循其脉，视其经络的浮沉，以上下逆从来循察。其脉疾的不病，其脉迟的病，脉不来往的死，皮肤着骨（枯着）的死。黄帝说：其可治的怎样治？岐伯说：经病的治其经，孙络病的治其孙络之血，血病而身有痛的治其经络。","notes":[],"pending":false},{"id":"sw20-7","tags":[],"yw":"其病者在奇邪，奇邪之脈則繆刺之。留瘦不移，節而刺之。上實下虛，切而從之，索其結絡脈，刺出其血，以見通之。瞳子高者太陽不足，戴眼者太陽已絕，此決死生之要，不可不察也。手指及手外踝上五指留針。玉機真髒論∶溉（古代切）窳（音愈）（渠殞切）瞀（莫候切）三部九候論∶歃（所甲切，飲血也）（古營切）蠕（而勻切）<目錄>卷第七","bh":"其病在奇邪的，奇邪之脉就用缪刺（左病刺右、右病刺左）之法。病邪留瘦不移的，按节而刺之。上实下虚的，切而循之，寻其结络之脉，刺出其血，以通其气。瞳子高的，是太阳不足；戴眼的，是太阳已绝。这是决死生的要领，不可不察。手指及手外踝上、五指之处可以留针。〔本节此句上下文疑有错简；以下为后世所附音释，非经文正文，不译。〕","notes":[],"pending":false}]},
{"id":"sw22","book":"素问","no":22,"title":"脏气法时论","titleTw":"髒氣法時論","tags":["bingji","zangxiang","yinyang"],"brief":"论五脏应四时五行的愈、甚、持、起之时日与五味补泻，并列五脏病证及其针刺取经与五味所宜。","pending":false,"sections":[{"id":"sw22-1","tags":[],"yw":"黃帝問曰∶合人形以法四時五行而治，何如而從？何如而逆？得失之意，願聞其事。岐伯對曰∶五行者，金木水火土也，更貴更賤，以知死生，以決成敗，而定五髒之氣，間甚之時，死生之期也。帝曰∶願卒聞之。岐伯曰∶肝主春，足厥陰少陽主治，其日甲乙，肝苦急，急食甘以緩之。心主夏，手少陰太陽主治，其日丙丁，心苦緩，急食酸以收之。脾主長夏，足太陰陽明主治，其日戊己，脾苦溼，急食苦以燥之。肺主秋，手太陰陽明主治，其日庚辛，肺苦氣上逆，急食苦以泄之。","bh":"黄帝问道：合于人的形体而取法四时五行来治疗，怎样是从？怎样是逆？得失的意义，希望听听其事。岐伯回答说：五行就是金木水火土，更贵更贱（盛衰交替），以此知死生、决成败，而确定五脏之气、病之轻重之时与死生之期。黄帝说：希望详尽地听听。岐伯说：肝主春，足厥阴、少阳主治，其日为甲乙，肝苦于急，急食甘味以缓之。心主夏，手少阴、太阳主治，其日为丙丁，心苦于缓（涣散），急食酸味以收之。脾主长夏，足太阴、阳明主治，其日为戊己，脾苦于湿，急食苦味以燥之。肺主秋，手太阴、阳明主治，其日为庚辛，肺苦于气上逆，急食苦味以泄之。","notes":[],"pending":false},{"id":"sw22-2","tags":[],"yw":"腎主冬，足少陰太陽主治，其日壬癸，腎苦燥，急食辛以潤之，開腠理，致津液，通氣也。病在肝，愈於夏，夏不愈，甚於秋，秋不死，持於冬，起於春，禁當風。肝病者，愈在丙丁，丙丁不愈，加於庚辛，庚辛不死，持於壬癸，起於甲乙。肝病者，平旦慧，下晡甚，夜半靜。肝欲散，急食辛以散之，用辛補之，酸瀉之。病在心，愈在長夏，長夏不愈，甚於冬，冬不死，持於春，起於夏，禁溫食熱衣。心病者，愈在戊己，戊己不愈，加於壬癸，壬癸不死。","bh":"肾主冬，足少阴、太阳主治，其日为壬癸，肾苦于燥，急食辛味以润之，以开腠理、致津液、通气。病在肝，愈于夏；夏不愈，甚于秋；秋不死，持于冬，起于春，禁当风。肝病者，愈在丙丁日；丙丁不愈，加于庚辛日；庚辛不死，持于壬癸日，起于甲乙日。肝病者，平旦清爽，下晡（傍晚）加重，夜半安静。肝欲散，急食辛味以散之，用辛补之，用酸泻之。病在心，愈在长夏；长夏不愈，甚于冬；冬不死，持于春，起于夏，禁温食、热衣。心病者，愈在戊己日；戊己不愈，加于壬癸日；壬癸不死。","notes":[],"pending":false},{"id":"sw22-3","tags":[],"yw":"持於甲乙，起於丙丁。心病者，日中慧，夜半甚，平旦靜。心欲，急食鹹以之，用鹹補之，甘瀉之。病在脾，愈在秋，秋不愈，甚於春，春不死，持於夏，起於長夏，禁溫食飽食溼地濡衣。脾病者，愈在庚辛，庚辛不愈，加於甲乙，甲乙不死，持於丙丁，起於戊己。脾病者，日慧，日出甚，下晡靜。脾欲緩，急食甘以緩之，用苦瀉之，甘補之。病在肺，愈在冬，冬不愈，甚於夏，夏不死，持於長夏，起於秋，禁寒飲食寒衣。肺病者，愈在壬癸，壬癸不愈，加於丙丁，丙丁不死，持於戊己，起於庚辛。","bh":"持于甲乙日，起于丙丁日。心病者，日中清爽，夜半加重，平旦安静。心欲软，急食咸味以软之，用咸补之，用甘泻之。病在脾，愈在秋；秋不愈，甚于春；春不死，持于夏，起于长夏，禁温食、饱食、湿地、湿衣。脾病者，愈在庚辛日；庚辛不愈，加于甲乙日；甲乙不死，持于丙丁日，起于戊己日。脾病者，日昳（午后）清爽，日出加重，下晡安静。脾欲缓，急食甘味以缓之，用苦泻之，用甘补之。病在肺，愈在冬；冬不愈，甚于夏；夏不死，持于长夏，起于秋，禁寒饮食、寒衣。肺病者，愈在壬癸日；壬癸不愈，加于丙丁日；丙丁不死，持于戊己日，起于庚辛日。","notes":[],"pending":false},{"id":"sw22-4","tags":[],"yw":"肺病者，下晡慧，日中甚，夜半靜。肺欲收，急食酸以收之，用酸補之，辛瀉之。病在腎，愈在春，春不愈，甚於長夏，長夏不死，持於秋，起於冬，禁犯淬HT熱食溫炙衣。腎病者，愈在甲乙，甲乙不愈，甚於戊己，戊己不死，持於庚辛，起於壬癸。腎病者，夜半慧，四季甚，下晡靜。腎欲堅，急食苦以堅之，用苦補之，鹹瀉之。夫邪氣之客於身也，以勝相加，至其所生而愈，至其所不勝而甚，至於所生而持，自得其位而起。必先定五髒之脈，乃可言間甚之時，死生之期也。","bh":"肺病者，下晡清爽，日中加重，夜半安静。肺欲收，急食酸味以收之，用酸补之，用辛泻之。病在肾，愈在春；春不愈，甚于长夏；长夏不死，持于秋，起于冬，禁犯焠㶼（煎爆）热食与温炙之衣。肾病者，愈在甲乙日；甲乙不愈，甚于戊己日；戊己不死，持于庚辛日，起于壬癸日。肾病者，夜半清爽，四季（辰戌丑未之时）加重，下晡安静。肾欲坚，急食苦味以坚之，用苦补之，用咸泻之。邪气客于人身，是以胜相加（以所胜之气相加），至其所生之时而愈，至其所不胜之时而甚，至于其所生之时而持，自得其位而起。必先确定五脏之脉，才可以言病之轻重之时与死生之期。","notes":[],"pending":false},{"id":"sw22-5","tags":[],"yw":"肝病者，兩脅下痛引少腹，令人善怒，虛則目KTKT無所見，耳無所聞，善恐如人將捕之，取其經，厥陰與少陽，氣逆，則頭痛耳聾不聰頰腫。取血者。心病者，胸中痛，脅支滿，脅下痛，膺背肩甲間痛，兩臂內痛，虛則胸腹大，脅下與腰相引而痛，取其經，少陰太陽，舌下血者。其變病，刺中血者。脾病者，身重善肌肉痿，足不收行，善螈腳下痛，虛則腹滿腸鳴，飧泄食不化，取其經，太陰陽明少陰血者。肺病者，喘咳逆氣，肩背痛，汗出尻陰股膝髀足皆痛，虛則少氣不能報息，耳聾嗌干，取其經，太陰足太陽之外厥陰內血者。","bh":"肝病者，两胁下痛引少腹，使人善怒；虚则目䀮䀮（视物不清）而无所见，耳无所闻，善恐如有人将要捕捉他。取其经，厥阴与少阳。气逆则头痛、耳聋不聪、颊肿，取血者。心病者，胸中痛，胁部支撑胀满，胁下痛，膺背肩胛间痛，两臂内侧痛；虚则胸腹大，胁下与腰相引而痛。取其经，少阴、太阳，舌下血者。其病变，刺郄中血者。脾病者，身重、肌肉易痿，足不收而行，易瘛（抽搐）而脚下痛；虚则腹满肠鸣，飧泄、食不化。取其经，太阴、阳明、少阴血者。肺病者，喘咳逆气，肩背痛，汗出，尻、阴、股、膝、髀、足皆痛；虚则少气不能接续呼吸，耳聋、咽干。取其经，太阴、足太阳之外、厥阴之内血者。","notes":[],"pending":false},{"id":"sw22-6","tags":[],"yw":"腎病者，腹大脛腫，喘咳身重，寢汗出憎風，虛則胸中痛，大腹小腹痛，清厥意不樂，取其經，少陰太陽血者。肝色青，宜食甘，粳米牛肉棗葵皆甘。心色赤，宜食酸，小豆犬肉李韭皆酸。肺色白，宜食苦，麥羊肉杏薤皆苦。脾色黃，宜食鹹，大豆豕肉慄藿皆鹹。腎色黑，宜食辛，黃黍雞肉桃蔥皆辛。辛散，酸收，甘緩，苦堅，鹹。毒藥攻邪，五谷爲養，五果爲助，五畜爲益，五菜爲充，氣味合而服之，以補精益氣。此五者，有辛酸甘苦鹹，各有所利，或散或收，或緩或急，或堅或，四時五髒，病隨五味所宜也。","bh":"肾病者，腹大、胫肿，喘咳身重，睡中汗出、恶风；虚则胸中痛，大腹小腹痛，清厥（四肢逆冷）而情志不乐。取其经，少阴、太阳血者。肝色青，宜食甘：粳米、牛肉、枣、葵都属甘。心色赤，宜食酸：小豆、犬肉、李、韭都属酸。肺色白，宜食苦：麦、羊肉、杏、薤都属苦。脾色黄，宜食咸：大豆、豕肉、栗、藿都属咸。肾色黑，宜食辛：黄黍、鸡肉、桃、葱都属辛。辛散，酸收，甘缓，苦坚，咸软。毒药攻邪，五谷为养，五果为助，五畜为益，五菜为充，气味合而服之，以补精益气。这五者，有辛酸甘苦咸，各有所利，或散或收，或缓或急，或坚或软；四时五脏，病随五味所宜而治。","notes":[],"pending":false},{"id":"sw22-7","tags":[],"yw":"<目錄>卷第七","bh":"〔本节原卷仅存卷第七的目录标记，无正文可译。〕","notes":[],"pending":false}]},
{"id":"sw23","book":"素问","no":23,"title":"宣明五气","titleTw":"宣明五氣","tags":["zhenfa","bingji","zangxiang"],"brief":"列举五味所入、五气所病、五精所并、五脏所恶、所化之液、所禁之味及五劳所伤、五脉应象等常理。","pending":false,"sections":[{"id":"sw23-1","tags":[],"yw":"五味所入∶酸入肝，辛入肺，苦入心，鹹入腎，甘入脾，是謂五入。五氣所病∶心爲噫，肺爲咳，肝爲語，脾爲吞，腎爲欠爲嚏，胃爲氣逆爲噦爲恐，大腸小腸爲泄，下焦溢爲水，膀胱不利爲癃，不約爲遺溺，膽爲怒，是謂五病。五精所並∶精氣並於心則喜，並於肺則悲，並於肝則憂，並於脾則畏，並於腎則恐，是謂五並，虛而相並者也。五髒所惡∶心惡熱，肺惡寒，肝惡風，脾惡溼，腎惡燥，是謂五惡。五髒化液∶心爲汗，肺爲涕，肝爲淚，脾爲涎，腎爲唾，是謂五液。","bh":"五味所入：酸入肝，辛入肺，苦入心，咸入肾，甘入脾，这叫做五入。五气所病：心为噫（嗳气），肺为咳，肝为语（多言），脾为吞（吞酸），肾为欠、为嚏；胃为气逆、为哕（呃逆）、为恐；大肠小肠为泄，下焦溢为水，膀胱不利为癃（小便不通），不约为遗溺；胆为怒。这叫做五病。五精所并：精气并于心则喜，并于肺则悲，并于肝则忧，并于脾则畏，并于肾则恐，这叫做五并，是脏虚而精气相并。五脏所恶：心恶热，肺恶寒，肝恶风，脾恶湿，肾恶燥，这叫做五恶。五脏化液：心为汗，肺为涕，肝为泪，脾为涎，肾为唾，这叫做五液。","notes":[],"pending":false},{"id":"sw23-2","tags":[],"yw":"五味所禁∶辛走氣，氣病無多食辛；鹹走血，血病無多食鹹；苦走骨，骨病無多食苦；甘走肉，肉病無多食甘；酸走筋，筋病無多食酸。是謂五禁，無令多食。五病所發∶陰病發於骨，陽病發於血，陰病發於肉，陽病發於冬，陰病發於夏，是謂五發。五邪所亂∶邪入於陽則狂，邪入於陰則痹，搏陽則爲巔疾，搏陰則爲喑，陽入之陰則靜，陰出之陽則怒，是謂五亂。五邪所見∶春得秋脈，夏得冬脈，長夏得春脈，秋得夏脈，冬得長夏脈，名曰陰出之陽，病善怒不治，是謂五邪，皆同命，死不治。","bh":"五味所禁：辛走气，气病不要多食辛；咸走血，血病不要多食咸；苦走骨，骨病不要多食苦；甘走肉，肉病不要多食甘；酸走筋，筋病不要多食酸。这叫做五禁，不要使之多食。五病所发：阴病发于骨，阳病发于血，阴病发于肉，阳病发于冬，阴病发于夏，这叫做五发。五邪所乱：邪入于阳则狂，邪入于阴则痹，搏于阳则为巅疾，搏于阴则为喑（失音）；阳入之阴则静，阴出之阳则怒，这叫做五乱。五邪所见：春得秋脉，夏得冬脉，长夏得春脉，秋得夏脉，冬得长夏脉，名叫阴出之阳，病者善怒而不治，这叫做五邪，都是同样的命数，死而不治。","notes":[],"pending":false},{"id":"sw23-3","tags":[],"yw":"五髒所藏∶心藏神，肺藏魄，肝藏魂，脾藏意，腎藏志，是謂五髒所藏。五髒所主∶心主脈，肺主皮，肝主筋，脾主肉，腎主骨，是謂五主。五勞所傷∶久視傷血，久臥傷氣，久坐傷肉，久立傷骨，久行傷筋，是謂五勞所傷。五脈應象∶肝脈弦，心脈鉤，脾脈代，肺脈毛，腎脈石，是謂五髒之脈。<目錄>卷第七","bh":"五脏所藏：心藏神，肺藏魄，肝藏魂，脾藏意，肾藏志，这叫做五脏所藏。五脏所主：心主脉，肺主皮，肝主筋，脾主肉，肾主骨，这叫做五主。五劳所伤：久视伤血，久卧伤气，久坐伤肉，久立伤骨，久行伤筋，这叫做五劳所伤。五脉应象：肝脉弦，心脉钩，脾脉代，肺脉毛，肾脉石，这叫做五脏之脉。","notes":[],"pending":false}]},
{"id":"sw24","book":"素问","no":24,"title":"血气形志","titleTw":"血氣形志","tags":["ci","jingluo","zhenfa"],"brief":"论六经气血多少的常数、手足阴阳表里相配、五脏背俞的度量取穴，以及形志苦乐不同所致之病与治法。","pending":false,"sections":[{"id":"sw24-1","tags":[],"yw":"夫人之常數，太陽常多血少氣，少陽常少血多氣，陽明常多氣多血，少陰常少血多氣，厥陰常多血少氣，太陰常多氣少血，此天之常數。足太陽與少陰爲表裏，少陽與厥陰爲表裏，陽明與太陰爲表裏，是爲足陰陽也。手太陽與少陰爲表裏，少陽與心主爲表裏，陽明與太陰爲表裏，是爲手之陰陽也。今知手足陰陽所苦，凡治病必先去其血，乃去其所苦，伺之所欲，然後瀉有餘，補不足。欲知背俞，先度其兩乳間，中折之，更以他草度去半已，即以兩隅相拄也，乃舉以度其背，令其一隅居上，齊脊大椎，兩隅在下，當其下隅者，肺之俞也。","bh":"人身气血的常数：太阳常多血少气，少阳常少血多气，阳明常多气多血，少阴常少血多气，厥阴常多血少气，太阴常多气少血，这是天的常数。足太阳与少阴为表里，少阳与厥阴为表里，阳明与太阴为表里，这是足之阴阳。手太阳与少阴为表里，少阳与心主（厥阴心包）为表里，阳明与太阴为表里，这是手之阴阳。既然知道手足阴阳所苦之病，凡治病必先去其血，然后去其所苦，观察其所需，然后泻有余、补不足。要知道背俞（五脏在背部的俞穴）：先度量两乳之间，从中间对折，再用另一草量取折半之后，就把两角相拄，然后举起以度量其背，使一角在上、与大椎相齐，两角在下；当着下角的，就是肺之俞。","notes":[],"pending":false},{"id":"sw24-2","tags":[],"yw":"復下一度，心之俞也。復下一度，左角肝之俞也，右角脾之俞也。復下一度，腎之俞也。是謂五髒之俞，灸刺之度也。形樂志苦，病生於脈，治之以灸刺。形樂志樂，病生於肉，治之以針石。形苦志樂，病生於筋，治之以熨引。形苦志苦，病生於咽嗌，治之以百藥。形數驚恐，經絡不通，病生於不仁，治之以按摩醪藥。是謂五形志也。刺陽明出血氣，刺太陽出血惡氣，刺少陽出氣惡血，刺太陰出氣惡血，刺少陰出氣惡血，刺厥陰出血惡氣也。經脈別論∶跌僕（音赴）罷極（上音疲）如漚（下音甌）髒氣法時論∶慧（音惠）淬（七內切）HT（烏開切）KTKT（音荒）內（人朱切）宣明五氣篇∶翕（音吸）（音帝）窒（陡慄切）凝泣（澀）喑（讀作音）血氣形志篇∶相柱（知庚切）（音鈹）<目錄>卷第八","bh":"再下一度，就是心之俞。再下一度，左角是肝之俞，右角是脾之俞。再下一度，就是肾之俞。这就是五脏之俞，是灸刺的法度。形体安逸而心志劳苦的，病生于脉，治之以灸刺。形体安逸而心志也安乐的，病生于肉，治之以针石。形体劳苦而心志安乐的，病生于筋，治之以熨引（热熨与导引）。形体劳苦而心志也劳苦的，病生于咽嗌，治之以百药。形体屡受惊恐、经络不通的，病生于不仁（麻木不仁），治之以按摩醪药。这叫做五形志。刺阳明出血出气，刺太阳出血而恶气（不宜出气），刺少阳出气而恶血，刺太阴出气而恶血，刺少阴出气而恶血，刺厥阴出血而恶气。〔以下为后世所附音释，非经文正文，不译。〕","notes":[],"pending":false}]},
