            <path d="M40,250 C110,232 180,264 240,248 C300,232 370,258 440,246 L440,420 L40,420 Z"
              fill="#f2e9d5"/>
            <text x="24" y="292" class="pt-lb" style="font-size:11px">皮部</text>
            <text x="24" y="360" class="pt-lb" style="font-size:11px">筋肉</text>
            <!-- 压力场 -->
            <ellipse id="press" cx="240" cy="248" rx="0" ry="0" fill="${njVar("--zhu", "#a32a17")}" opacity=".2"/>
            <!-- 手 -->
            <g id="hand">
              <path d="M0,0 C-26,-6 -34,-30 -20,-48 C-10,-62 12,-64 22,-52 L26,10 L26,10 Z"
                fill="${njVar("--paper2", "#f8f1de")}" stroke="${njVar("--svg-line", "#685c46")}" stroke-width="2"/>
              <path id="thumb" d="M-18,-44 C-34,-58 -30,-76 -14,-80 C-2,-83 6,-74 4,-62 L2,-46 Z"
                fill="${njVar("--paper2", "#f8f1de")}" stroke="${njVar("--svg-line", "#685c46")}" stroke-width="2"/>
              <circle cx="10" cy="-8" r="9" fill="#e4d6b2" stroke="#685c46" stroke-width="1.4"/>
              <text x="6" y="-6" class="pt-lb" style="font-size:9px">劳宫</text>
            </g>
            <!-- 方向箭头 -->
            <g id="arrow" stroke="${njVar("--zhu", "#a32a17")}" stroke-width="2.8" fill="none" opacity=".9">
              <path d="M240,196 L240,226"/><path d="M232,218 L240,228 L248,218"/>
            </g>
            <!-- 力度曲线 -->
            <rect x="300" y="24" width="160" height="76" fill="${njVar("--paper2", "#f8f1de")}" stroke="${njVar("--line", "#d8cbb0")}"/>
            <text x="310" y="42" class="pt-lb" style="font-size:10px;letter-spacing:.1em">力度曲线</text>
            <polyline id="curve" fill="none" stroke="${njVar("--zhu", "#a32a17")}" stroke-width="2.4"
              points="310,92 460,92"/>
            <text id="forcebar" x="310" y="116">0.00</text>
            <text x="24" y="24" class="pt-lb" style="font-size:11px">${m.name}法 · ${m.sub}</text>
          </svg>
        </div>
        <div id="mp-panel">
          <div class="mp-btn-row">${btns}</div>
          <div class="mp-title">${m.name}　<span
            style="font-size:15px;font-weight:400;color:var(--ink2)">${m.sub}</span></div>
          <div class="mp-sub2">六法之一</div>
          <div class="mp-t">${hl(m.desc)}</div>
          <div class="mp-src"><b>经典依据</b>${m.src}</div>
          <div class="slider-row">
            <span>频率</span>
            <input id="sp" type="range" min="30" max="220" value="${Math.round(m.speed * 100)}">
            <span id="spv">${m.speed.toFixed(2)}×</span>
          </div>
          <div class="slider-row">
            <span>力度</span>
            <input id="am" type="range" min="30" max="140" value="100">
            <span id="amv">1.00×</span>
          </div>
          <div class="slider-row">
            <button class="tool-btn" id="mp-toggle">暂停</button>
            <span style="font-size:11.5px;color:var(--ink3)">演示为示意动画，非标准操作规范</span>
          </div>
          <div class="mp-h">相关原文</div>
          ${(dict.get("按蹻") || []).concat(NJ_CHAPTERS.flatMap(c =>
            c.sections.filter(s => s.manip).map(s => ({ ch: c, sec: s }))))
            .slice(0, 4).map(o =>
              `<div class="occ" data-open="${o.ch.id}/${o.sec.id}">
                <b>${o.ch.book}${o.ch.no}·${o.ch.title}</b>${o.sec.yw.slice(0, 22)}…</div>`).join("")}
        </div>
      </div>`;

    $("#viz").querySelectorAll("[data-mp]").forEach(b => {
      b.onclick = () => { mpState.cur = b.dataset.mp; mpState.t = 0; renderVizManip(); };
    });
    $("#viz-close").onclick = exitViz;
    startManipAnim(m);
  }

  function startManipAnim(m) {
    if (mpState.raf) cancelAnimationFrame(mpState.raf);
    const hand = $("#hand"), press = $("#press"), curve = $("#curve"), fb = $("#forcebar");
    const pts = [];
    mpState.speed = m.speed; mpState.amp = m.amp;
    const sp = $("#sp"), am = $("#am");
    sp.oninput = () => { mpState.speed = sp.value / 100; $("#spv").textContent = mpState.speed.toFixed(2) + "×"; };
    am.oninput = () => { mpState.amp = am.value / 100; $("#amv").textContent = mpState.amp.toFixed(2) + "×"; };
    $("#mp-toggle").onclick = e => {
      mpState.run = !mpState.run;
      e.target.textContent = mpState.run ? "暂停" : "继续";
    };

    const baseX = 240, baseY = 236;
    const loop = () => {
      if (mpState.run) mpState.t += 0.016 * mpState.speed;
      const t = mpState.t, A = mpState.amp;
      let x = baseX, y = baseY, force = 0, rot = 0;
      if (m.mode === "press") {
        y = baseY + Math.sin(t * 3) * 26 * A;
        force = Math.max(0, (Math.sin(t * 3) + 1) / 2) * A;
      } else if (m.mode === "line") {
        x = baseX + Math.sin(t * 2.2) * 130 * A;
        const yy = Math.cos(t * 2.2);
        y = baseY - 6 + (1 - yy) * 3;
        force = 0.45 * A;
      } else {
        x = baseX + Math.cos(t * 2.6) * 46 * A;
        y = baseY + Math.sin(t * 2.6) * 18 * A - 2;
        force = 0.6 * A;
        rot = Math.sin(t * 2.6) * 12;
      }
      hand.setAttribute("transform", `translate(${x},${y}) rotate(${rot})`);
      press.setAttribute("cx", x);
      press.setAttribute("cy", y + 18);
      press.setAttribute("rx", 24 + force * 46);
      press.setAttribute("ry", 10 + force * 20);
      press.setAttribute("opacity", 0.06 + force * 0.18);

      pts.push(force);
      if (pts.length > 150) pts.shift();
      const n = pts.length;
      const str = pts.map((v, i) => {
        const px = 310 + (i / 149) * 150;
        const py = 92 - v * 44;
        return px.toFixed(1) + "," + py.toFixed(1);
      }).join(" ");
      curve.setAttribute("points", str);
      fb.textContent = force.toFixed(2);
      mpState.raf = requestAnimationFrame(loop);
    };
    loop();
  }

  /* ---------- 视图切换 ---------- */
  let inViz = false;
  function renderViz(kind) {
    inViz = true;
    window.__vizKind = kind;
    $("#wrap").style.display = "none";
    $("#result").style.display = "none";
    $("#viz").classList.add("on");
    document.body.classList.add("viz");
    if (mpState.raf) { cancelAnimationFrame(mpState.raf); mpState.raf = null; }
    if (kind === "wx") renderVizWuxing();
    if (kind === "mer") renderVizMer();
    if (kind === "off") renderVizOff();
    if (kind === "yq") renderVizYunqi();
    if (kind === "manip") renderVizManip();
    $("#viz").scrollTop = 0;
    history.replaceState(null, "", "#viz/" + kind);
    if (window.NJMarkNav) window.NJMarkNav();
  }
  function exitViz() {
    inViz = false;
    window.__vizKind = null;
    if (mpState.raf) { cancelAnimationFrame(mpState.raf); mpState.raf = null; }
    $("#viz").classList.remove("on");
    $("#result").style.display = "none";
    document.body.classList.remove("viz");
    $("#wrap").style.display = "flex";
    openChapter(state.ch, state.sec);
    if (window.NJMarkNav) window.NJMarkNav();
  }
  window.exitViz = exitViz;

  /* ---------- 搜索 ---------- */
  // 简体输入 → 繁体归一（映射表由构建期生成），繁体原文也能命中
  function toTrad(s) {
    if (!window.NJ_S2T) return s;
    let out = "";
    for (const ch of s) out += (window.NJ_S2T[ch] || ch);
    return out;
  }
  function doSearch(q) {
    q = q.trim();
    if (!q) return;
    const res = [];
    NJ_CHAPTERS.forEach(c => {
      const hitTitle = c.title.indexOf(q) >= 0 || c.book.indexOf(q) >= 0 ||
        c.titleTw.indexOf(toTrad(q)) >= 0;
      if (hitTitle) res.push({ c, s: null, txt: c.brief, why: "篇目" });
      c.sections.forEach(s => {
        if (s.yw.indexOf(q) >= 0 || s.yw.indexOf(toTrad(q)) >= 0)
          res.push({ c, s, txt: s.yw, yw: 1 });
        else if (s.bh.indexOf(q) >= 0) res.push({ c, s, txt: s.bh, why: "翻译" });
        else if ((s.notes || []).some(n => n.t.indexOf(q) >= 0))
          res.push({ c, s, txt: s.yw, why: "注" });
      });
    });
    const qv = toTrad(q);
    const pat = qv && qv !== q ? esc(q) + "|" + esc(qv) : esc(q);
    const marked = () => t => t.replace(new RegExp(pat, "g"), m => `<em>${m}</em>`);
    const mk = marked();
    const box = $("#result");
    box.innerHTML = `<div class="viz-head"><h2>检索「${q}」</h2>
      <p>命中 ${res.length} 条</p><div style="flex:1"></div>
      <button class="tool-btn" id="viz-close2">返回阅读</button></div>`;
    if (!res.length) {
      box.innerHTML += `<div style="padding:26px 30px"><div class="empty">
        未命中。收录范围为本节选十篇。<br>可试试：陽氣、按之、天癸、味過於鹹、十二官……</div></div>`;
    }
    res.slice(0, 60).forEach(r => {
      const hits = [r.txt.indexOf(q), qv !== q ? r.txt.indexOf(qv) : -1].filter(i => i >= 0);
      const idx = hits.length ? Math.max(0, Math.min(...hits) - 16) : 0;
      const snip = mk(r.txt.slice(idx, idx + 60));
      const d = el("div", "rs",
        `<h4>${r.c.book}·${r.c.title}${r.why ? "　<span style='font-size:12px;color:var(--ink3);font-weight:400'>"
          + r.why + "</span>" : ""}</h4><p>…${snip}…</p>`);
      d.onclick = () => openChapter(r.c.id, r.s ? r.s.id : null);
      box.appendChild(d);
    });
    $("#viz").classList.remove("on");
    document.body.classList.remove("viz");
    $("#wrap").style.display = "none";
    box.style.display = "block";
    $("#viz-close2").onclick = exitViz;
  }

  /* ---------- 工具开关 ---------- */
  function bindTools() {
    const t = (sel, cls, inv) => {
      const b = $(sel);
      if (!b) return;
      b.onclick = () => {
        document.body.classList.toggle(cls);
        let on = document.body.classList.contains(cls);
        if (inv) on = !on;
        b.classList.toggle("on", on);
      };
    };
    t("#btn-bh", "hide-bh", true);
    t("#btn-note", "hide-note", true);
    $("#btn-bh").classList.add("on");
    $("#btn-note").classList.add("on");

    let fs = 19;
    $("#btn-aa").onclick = () => {
      fs = fs >= 24 ? 16 : fs + 2;
      document.documentElement.style.setProperty("--fs", fs + "px");
    };
    let wm = 1;
    $("#btn-width").onclick = () => {
      document.body.classList.remove("w-wide", "w-mid", "w-nar");
      wm = (wm + 1) % 3;
      document.body.classList.add(["w-wide", "w-mid", "w-nar"][wm]);
    };
    document.body.classList.add("w-mid");

    $("#btn-toc").onclick = () => document.body.classList.toggle("hide-toc");
    $("#toc-handle").onclick = () => document.body.classList.toggle("hide-toc");
    $("#btn-aside").onclick = () => document.body.classList.toggle("hide-aside");
    $("#btn-full").onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    $("#aside-close").onclick = () => document.body.classList.add("hide-aside");

    // 日间 / 夜间：写 localStorage，切换后重绘当前视图以刷新 SVG 底色
    const themeBtn = $("#btn-theme");
    function applyTheme(night) {
      document.body.classList.toggle("night", !!night);
      themeBtn.textContent = night ? "日间" : "夜间";
      themeBtn.classList.toggle("on", !!night);
      try { localStorage.setItem("nj-theme", night ? "night" : "day"); } catch (e) {}
    }
    let nightMode = false;
    try { nightMode = localStorage.getItem("nj-theme") === "night"; } catch (e) {}
    applyTheme(nightMode);
    themeBtn.onclick = () => {
      nightMode = !nightMode;
      applyTheme(nightMode);
      if (inViz) renderViz(window.__vizKind || "mer");
    };

    // 输入即检索（200ms 防抖），回车立即检索并取消待执行的防抖
    let njQTimer = null;
    const njSearch = v => { clearTimeout(njQTimer); njQTimer = setTimeout(() => doSearch(v), 200); };
    $("#q").oninput = e => njSearch(e.target.value);
    $("#q").onkeydown = e => { if (e.key === "Enter") { clearTimeout(njQTimer); doSearch($("#q").value); } };
    $("#q").addEventListener("change", e => doSearch(e.target.value));

    // 顶栏导航统一绑定（避免新增视图时漏绑导致按钮无反应）
    const firstOf = bk => (NJ_CHAPTERS.find(c => c.book === bk) || {}).id;
    const NAVMAP = {
      "nav-sw": () => openChapter(firstOf("素问")),
      "nav-ls": () => openChapter(firstOf("灵枢")),
      "nav-wx": () => openWuxing("mu"),
      "nav-mer": () => openMer("lu"),
      "nav-off": () => openOff("心"),
      "nav-yq": () => renderViz("yq"),
      "nav-manip": () => openManip("an")
    };
    Object.keys(NAVMAP).forEach(id => {
      const b = document.getElementById(id);
      if (b) b.onclick = NAVMAP[id];
    });
  }

  /* ---------- 路由 ---------- */
  function route() {
    const h = location.hash.replace(/^#/, "");
    if (!h) { openChapter(state.ch); return; }
    const p = h.split("/");
    if (p[0] === "viz") { renderViz(p[1] || "mer"); return; }
    if (p[0] === "s") { doSearch(decodeURIComponent(p[1] || "")); return; }
    if (p[0] === "off") { openOff(decodeURIComponent(p[1] || "心")); return; }
    if (chById.get(p[0])) openChapter(p[0], p[1] || null);
    else openChapter(state.ch);
  }

  window.addEventListener("hashchange", route);

  /* ---------- 对外接口（顶栏按钮用） ---------- */
  window.NJAPI = {
    openChapter, openMer, openOff, openManip, openWuxing, renderViz, exitViz, doSearch
  };

  /* ---------- 顶栏高亮 ---------- */
  function markNav() {
    document.querySelectorAll(".navbtn").forEach(b => b.classList.remove("on"));
    if (inViz) {
      const map = { wx: "nav-wx", mer: "nav-mer", off: "nav-off", yq: "nav-yq", manip: "nav-manip" };
      const id = map[window.__vizKind];
      if (id && document.getElementById(id)) document.getElementById(id).classList.add("on");
      return;
    }
    const c = chById.get(state.ch);
    if (c) {
      const id = c.book === "素问" ? "nav-sw" : "nav-ls";
      const b = document.getElementById(id);
      if (b) b.classList.add("on");
    }
  }
  window.NJMarkNav = markNav;

  /* ---------- 启动 ---------- */
  renderTOC();
  bindTools();
  route();
  markNav();
})();


(function(){
  var A = window.NJAPI;
  function first(bk){ for(var i=0;i<NJ_CHAPTERS.length;i++)
    if(NJ_CHAPTERS[i].book===bk) return NJ_CHAPTERS[i].id; }
  function $(id){ return document.getElementById(id); }
  $("nav-sw").onclick  = function(){ A.openChapter(first("素问")); };
  $("nav-ls").onclick  = function(){ A.openChapter(first("灵枢")); };
  $("nav-wx").onclick  = function(){ A.openWuxing("mu"); };
  $("nav-mer").onclick = function(){ A.openMer("lu"); };
  $("nav-off").onclick = function(){ A.openOff("心"); };
  $("nav-yq").onclick  = function(){ A.renderViz("yq"); };
  $("nav-manip").onclick = function(){ A.openManip("an"); };
  A.markNavHook = window.NJMarkNav;
})();


/* ============================================================
   简体 / 繁体 切换（DOM 层，不改底本数据）
   ============================================================ */
(function () {
  "use strict";

  function buildDict(K, V, PK, PV) {
    const m = new Map();
    const a = Array.from(K), b = Array.from(V);
    for (let i = 0; i < a.length; i++) m.set(a[i], b[i]);
    const ka = PK.split("|"), va = PV.split("|");
    for (let i = 0; i < ka.length; i++) if (ka[i]) m.set(ka[i], va[i]);
    return m;
  }
  const S2T = buildDict(window.NJ_S2T_K, window.NJ_S2T_V, window.NJ_S2T_PK, window.NJ_S2T_PV);
  const T2S = buildDict(window.NJ_T2S_K, window.NJ_T2S_V, window.NJ_T2S_PK, window.NJ_T2S_PV);
  const MAXLEN = 3;

  function conv(str, m) {
    if (!str) return str;
    let out = "", i = 0;
    while (i < str.length) {
      let hit = false;
      for (let L = Math.min(MAXLEN, str.length - i); L > 0; L--) {
        const v = m.get(str.substr(i, L));
        if (v !== undefined && v !== str.substr(i, L)) { out += v; i += L; hit = true; break; }
      }
      if (!hit) { out += str[i]; i++; }
    }
    return out;
  }
  const toScript = t => script === "hant" ? conv(t, S2T) : conv(t, T2S);

  let script = "hant";
  try {
    const saved = localStorage.getItem("nj-script");
    if (saved === "hans" || saved === "hant") script = saved;
  } catch (e) {}

  const SKIP = { SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEXTAREA: 1 };
  /* 版本选择界面固定简体：#mgate 首选项 + #mrotate 竖屏提示，不随全站字形切换 */
  const MODE_UI = "#mgate, #mrotate";
  function inModeUI(node) {
    let el = null;
    if (node.nodeType === 1) el = node;
    else if (node.parentNode && node.parentNode.nodeType === 1) el = node.parentNode;
    return !!(el && el.closest && el.closest(MODE_UI));
  }
  const orig = new WeakMap();          // 文本节点 -> 原始文本（避免来回切换累积失真）
  const attrOrig = new WeakMap();      // 元素 -> { attr: 原始值 }
  let applying = false;

  function convertNode(node) {
    if (!orig.has(node)) orig.set(node, node.nodeValue);
    const want = toScript(orig.get(node));
    if (node.nodeValue !== want) node.nodeValue = want;
  }
  const ATTRS = ["placeholder", "title", "aria-label"];
  function convertAttrs(el) {
    if (!el || el.nodeType !== 1 || !el.hasAttribute) return;
    if (inModeUI(el)) return;
    let cache = attrOrig.get(el);
    if (!cache) { cache = {}; attrOrig.set(el, cache); }
    ATTRS.forEach(a => {
      if (!el.hasAttribute(a)) return;
      if (cache[a] === undefined) cache[a] = el.getAttribute(a);
      const want = toScript(cache[a]);
      if (want !== el.getAttribute(a)) el.setAttribute(a, want);
    });
  }
  function walk(root) {
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const list = [];
    let n;
    while ((n = tw.nextNode())) {
      const p = n.parentNode;
      if (!p || SKIP[p.nodeName]) continue;
      if (!n.nodeValue || !n.nodeValue.trim()) continue;
      if (inModeUI(n)) continue;
      list.push(n);
    }
    list.forEach(convertNode);
  }
  function applyAll() {
    applying = true;
    try {
      walk(document.body);
      document.querySelectorAll("[placeholder],[title],[aria-label]").forEach(convertAttrs);
    } finally { applying = false; }
  }

  /* 单键切换：按钮文字 = 点击后要切到的字形（当前简体时显示「繁体」） */
  const bSc = document.getElementById("btn-script");
  function labelNode() {
    return (bSc && bSc.firstChild && bSc.firstChild.nodeType === 3) ? bSc.firstChild : null;
  }
  function paint() {
    const n = labelNode();
    if (!n) return;
    const label = script === "hant" ? "简体" : "繁体";
    orig.set(n, label);              // 记为原文，整体转换时不再覆盖按钮标签
    n.nodeValue = toScript(label);
  }
  function setScript(v) {
    if (v === script) return;
    script = v;
    try { localStorage.setItem("nj-script", v); } catch (e) {}
    paint();                         // 先换按钮文字，再整体转换
    applyAll();
  }
  if (bSc) bSc.onclick = () => setScript(script === "hant" ? "hans" : "hant");

  paint();
  applyAll();

  // 后续动态渲染（目录 / 正文 / 图谱 / 助手 / 检索结果）自动跟随当前字形
  if (window.MutationObserver) {
    const mo = new MutationObserver(muts => {
      if (applying) return;
      applying = true;
      try {
        muts.forEach(m => {
          if (m.type !== "childList") return;
          m.addedNodes.forEach(node => {
            if (inModeUI(node)) return;
            if (node.nodeType === 1) { convertAttrs(node); walk(node); }
            else if (node.nodeType === 3) {
              const p = node.parentNode;
              if (p && !SKIP[p.nodeName] && node.nodeValue && node.nodeValue.trim()) convertNode(node);
            }
          });
        });
      } finally { applying = false; }
    });
    mo.observe(document.body, { childList: true, subtree: true });
  }
  window.NJSetScript = setScript;
})();

</script>
